<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>镜像迷宫</title>
<style>
/* ================= 镜像迷宫 mirrormaze（batch17 r14 轴向族版）=================
   视觉按 SPEC-BATCH17 §6（承家族暖米底）：每题=方盘网格（ch1 4×4 / ch2 5×5 / ch3-4 6×6）+
   源侧色格 + 对称轴（轴向族六 kind：v 竖直/h 水平/d1 主对角/d2 反对角/pv·ph 双向/
   vv 平行双镜/r180 垂直双镜=转半圈）。点空格补全镜像：
   点对（=某源格的镜像位）→该格点亮成同色；点非镜像位→格子闪一下不点亮可重点
   （低挫败零惩罚，miss 照计=星级口径）；全部镜像位补齐→对称轴闪+图案完整→下一题。
   对称轴按 kind 渲染（#axis 容器内 .axl 线段，几何由 game-main 按格心连线计算——
   竖/横/斜 45°/双平行线/十字全走同一 generic 线段）。
   触摸目标：格子 ≥64、提示按钮 ≥96 高、底栏按钮 ≥72 高；pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:4px 10px}

/* ---------- 题面：网格棋盘 + 对称轴（轴向族） ---------- */
#board{position:relative;flex:0 0 auto;padding:6px;animation:board-in .4s cubic-bezier(.2,1.5,.4,1) both}
@keyframes board-in{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#board.g4{--cs:92px}
#board.g5{--cs:82px}
#board.g6{--cs:72px}
#grid{display:grid;gap:8px;position:relative}
/* 格子：空=虚线暖沙；点亮=实色卡（源格 given / 补对 lit）；错点=blink 闪不点亮 */
.cell{width:var(--cs);height:var(--cs);padding:0;border-radius:16px;background:#F6ECD9;
  border:3px dashed #C9A87C;transition:transform .15s}
.cell:active{transform:translateY(3px)}
.cell.lit{border-style:solid;border-color:#4A3B2E;box-shadow:0 4px 0 rgba(74,59,46,.22)}
.cell.given{animation:cell-in .4s cubic-bezier(.2,1.5,.4,1) both}
.cell.given:nth-child(2n){animation-delay:.06s}
.cell.given:nth-child(3n){animation-delay:.12s}
.cell.lit:not(.given){animation:cell-in .32s cubic-bezier(.2,1.6,.4,1) both}
@keyframes cell-in{from{transform:scale(.2)}to{transform:scale(1)}}
.cell.blink{animation:cell-blink .42s ease}
@keyframes cell-blink{0%,100%{background:#F6ECD9;border-color:#C9A87C}
  45%{background:#F3C9BC;border-color:#D98A7A}}
.cell.breathe{animation:cell-breathe 1.6s ease-in-out infinite}
@keyframes cell-breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(232,151,90,0)}
  50%{transform:scale(1.12);box-shadow:0 0 16px rgba(232,151,90,.85)}}
.cell.pulse{animation:cell-pulse .5s ease 3}
@keyframes cell-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
/* 对称轴（r14 轴向族）：#axis=容器（与 #grid 同域），内放 .axl generic 线段——
   几何（起止/角度）由 game-main 按 kind 的轴两端格心连线实算（竖/横/斜/双平行/十字）；
   补齐时容器加 .flash 全线段齐闪 */
#axis{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
#axis .axl{position:absolute;left:0;top:0;height:0;border-top:3px dashed rgba(201,168,124,.95);
  transform-origin:0 0;pointer-events:none}
#axis.flash .axl{animation:axis-flash .95s ease}
@keyframes axis-flash{0%,100%{border-top:3px dashed rgba(201,168,124,.95);filter:none}
  35%{border-top:4px solid #E8975A;filter:drop-shadow(0 0 12px rgba(232,151,90,.95))}}

/* ---------- 底部作答区：「提示」主按钮（≥96，未补镜像位 breathe+对应源格 pulse） ---------- */
#answers{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:20px;
  flex-wrap:wrap;min-height:118px;padding:2px 12px}
#tip{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#8A7B6C}
#tip svg{width:34px;height:34px}
#hint-btn{min-width:200px;min-height:96px;padding:0 36px;border-radius:26px;background:#8FBF7F;
  border:3px solid #4A3B2E;box-shadow:0 6px 0 #6FA063;color:#FFF9EE;font-size:32px;font-weight:800;
  letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:12px;
  transition:transform .15s,box-shadow .15s;animation:board-in .38s cubic-bezier(.2,1.5,.4,1) both}
#hint-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #6FA063}
#hint-btn svg{width:44px;height:44px}
#hint-btn.nudge{animation:hint-nudge .4s ease}
@keyframes hint-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}

/* ---------- 幽灵手指教学（照 spellen/read） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持，通道 A=@media）：格子仍 ≥64（g4 84/g5 72/g6 66），提示按钮 ≥96 高 */
@media (orientation:portrait){
  #board.g4{--cs:84px}
  #board.g5{--cs:72px}
  #board.g6{--cs:66px}
  #grid{gap:7px}
  #hint-btn{min-width:180px;font-size:28px}
}
/* 竖屏通道 B：body.port 类（verify simView 模拟竖屏——与上方 @media 逐条等值，双通道同步） */
body.port #board.g4{--cs:84px}
body.port #board.g5{--cs:72px}
body.port #board.g6{--cs:66px}
body.port #grid{gap:7px}
body.port #hint-btn{min-width:180px;font-size:28px}
</style>
</head>
<body>
<div id="game" aria-label="镜像迷宫">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board" class="g4" aria-label="对称图案棋盘">
      <div id="grid" aria-label="图案格子"></div>
      <div id="axis" aria-hidden="true"></div>
    </div>
    <div id="answers" aria-label="作答区"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

   数据模型：q.given=源侧色格[{x,y,c,role}]；q.targets=应补格[{x,y,c,sx,sy}]（sx,sy=镜像源格）；
   q._fill[i]=第 i 个 target 是否已点亮。
   engTapCell：点对（未补 target）=点亮；点非 target（given 格/空位）='wrong'（miss 计一次、零惩罚
   可重点）；点已点亮 target/越界/已解题=null。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增；难度章号：静态关 (ch-1)%4+1 循环，生成关随机 1-4（§0.3） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 引擎侧镜射原语（逐面镜应用；verify 侧用闭式代数分源对账，禁复用本组函数 §6） */
const reflV = (K, p) => ({ x: K - p.x, y: p.y });
const reflH = (L, p) => ({ x: p.x, y: L - p.y });
const KINDS = ['v', 'h', 'd1', 'd2', 'pv', 'ph', 'vv', 'r180'];
const KIND_W = { v: 4, h: 4, d1: 5, d2: 5, pv: 6, ph: 6, vv: 6, r180: 6 };
const KIND_TGT = { v: [3, 4], h: [3, 4], d1: [4, 5], d2: [4, 5], pv: [6, 6], ph: [6, 6], vv: [4, 6], r180: [4, 6] };
/* vv 双镜配置（k1,k2,Δ）：先照 k1 再照 k2 ⇒ 平移 Δ=k2-k1（源带=移出侧 2 列） */
const VV_CFG = [[3, 5, 2], [1, 5, 4], [5, 3, -2], [5, 1, -4]];

/* 单题变换（引擎侧：按轴逐次应用反射原语） */
function applyKind(q, p) {
  switch (q.kind) {
    case 'v':  return reflV(3, p);
    case 'h':  return reflH(3, p);
    case 'd1': return { x: p.y, y: p.x };
    case 'd2': return { x: 4 - p.y, y: 4 - p.x };
    case 'pv': return reflV(5, p);
    case 'ph': return reflH(5, p);
    case 'vv': return reflV(q.axis.k2, reflV(q.axis.k1, p));
    case 'r180': return reflH(5, reflV(5, p));
  }
  return null;
}

/* ---------- 单题生成（确定性，按难度章） ---------- */
function genQuiz(dch, rnd, forceV) {
  if (dch === 1) {                                  /* ch1：4×4 v/h 轴逐题轮换（flat0-q0 固定 v=教学兼容） */
    const kind = (forceV || rnd() < 0.5) ? 'v' : 'h';
    const q = { kind: kind, W: 4, H: 4, axis: { kind: kind }, side: 'A', tpl: -1,
      given: [], targets: [], _fill: [], miss: 0, solved: false };
    q.tpl = DCH1_TPL[Math.floor(rnd() * DCH1_TPL.length)];
    const t = RECT[q.tpl];
    let maxB = 0; t.forEach(p => { maxB = Math.max(maxB, p[1]); });
    const off = ri(rnd, 0, 3 - maxB);
    const ci = ri(rnd, 0, PALETTE.length - 1);
    t.forEach(p => {
      /* 模板带域 2 列（a=横跨带 0/1，b=沿带 0..3）：v 源=左半 2 列；h 源=上半 2 行（转置） */
      q.given.push(kind === 'v' ? { x: p[0], y: p[1] + off, c: PALETTE[ci], role: 'src' }
                                : { x: p[1] + off, y: p[0], c: PALETTE[ci], role: 'src' });
    });
    buildTargets(q);
    return q;
  }
  if (dch === 2) {                                  /* ch2：5×5 斜 45° 轴（d1/d2 轮换）+轴上干扰格 */
    const kind = rnd() < 0.5 ? 'd1' : 'd2';
    const q = { kind: kind, W: 5, H: 5, axis: { kind: kind }, side: 'A', tpl: -1,
      given: [], targets: [], _fill: [], miss: 0, solved: false };
    q.tpl = Math.floor(rnd() * TRI.length);
    const t = TRI[q.tpl];
    const ci = ri(rnd, 0, PALETTE.length - 1);
    t.forEach(p => {
      /* TRI 定义在 d1 源侧（y>x）；d2 源侧=h 翻折 (x,4-y)（§6 真值：y>x ⇒ x+(4-y)<4） */
      const c = kind === 'd1' ? { x: p[0], y: p[1] } : { x: p[0], y: 4 - p[1] };
      q.given.push({ x: c.x, y: c.y, c: PALETTE[ci], role: 'src' });
    });
    /* 轴上干扰格 1-2（自映：d1 对角 x=y / d2 反对角 x+y=4；色≠主体） */
    const axCells = kind === 'd1' ? [[0, 0], [1, 1], [2, 2], [3, 3], [4, 4]]
                                  : [[4, 0], [3, 1], [2, 2], [1, 3], [0, 4]];
    const nAx = 1 + (rnd() < 0.5 ? 0 : 1);
    const axPick = shuffled(axCells, rnd).slice(0, nAx);
    axPick.forEach(a => q.given.push({ x: a[0], y: a[1], c: PALETTE[(ci + 1 + ri(rnd, 0, 1)) % PALETTE.length], role: 'axis' }));
    q.given.sort((a, b) => a.y - b.y || a.x - b.x);
    buildTargets(q);
    return q;
  }
  if (dch === 3) {                                  /* ch3：6×6 周期棋盘格+双向（pv/ph；判哪侧是源） */
    const kind = rnd() < 0.5 ? 'pv' : 'ph';
    const q = { kind: kind, W: 6, H: 6, axis: { kind: kind }, side: rnd() < 0.5 ? 'A' : 'B', tpl: -1,
      given: [], targets: [], _fill: [], miss: 0, solved: false };
    const two = shuffled([0, 1, 2], rnd).slice(0, 2);
    const assign = [PALETTE[two[0]], PALETTE[two[1]]];   /* assign[(x+y)%2] */
    if (kind === 'pv') {                            /* 块=2 列×3 行：A 源 cols0-1 / B 源 cols4-5 */
      const r = ri(rnd, 0, 3);
      const x0 = q.side === 'A' ? 0 : 4;
      for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 2; dx++) {
        const x = x0 + dx, y = r + dy;
        q.given.push({ x: x, y: y, c: assign[(x + y) % 2], role: 'src' });
      }
    } else {                                        /* 块=3 列×2 行：A 源 rows0-1 / B 源 rows4-5 */
      const c = ri(rnd, 0, 3);
      const y0 = q.side === 'A' ? 0 : 4;
      for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 3; dx++) {
        const x = c + dx, y = y0 + dy;
        q.given.push({ x: x, y: y, c: assign[(x + y) % 2], role: 'src' });
      }
    }
    buildTargets(q);
    return q;
  }
  /* dch4：双镜复合（vv 平行=平移 / r180 垂直=180° 旋转） */
  const kind = rnd() < 0.5 ? 'vv' : 'r180';
  const q = { kind: kind, W: 6, H: 6, axis: { kind: kind }, side: 'A', tpl: -1,
    given: [], targets: [], _fill: [], miss: 0, solved: false };
  if (kind === 'vv') {
    const cfg = VV_CFG[Math.floor(rnd() * VV_CFG.length)];
    q.axis.k1 = cfg[0]; q.axis.k2 = cfg[1];
    q.tpl = DCH4_VV[Math.floor(rnd() * DCH4_VV.length)];
    const t = RECT[q.tpl];
    let maxB = 0; t.forEach(p => { maxB = Math.max(maxB, p[1]); });
    const off = ri(rnd, 0, 5 - maxB);
    const ci = ri(rnd, 0, PALETTE.length - 1);
    const x0 = cfg[2] > 0 ? 0 : 4;                  /* 源带=移出侧 2 列（Δ>0 左带 / Δ<0 右带） */
    t.forEach(p => q.given.push({ x: x0 + p[0], y: p[1] + off, c: PALETTE[ci], role: 'src' }));
  } else {
    q.tpl = DCH4_R180[Math.floor(rnd() * DCH4_R180.length)];
    const t = RECT[q.tpl];
    let maxX = 0, maxY = 0;
    t.forEach(p => { maxX = Math.max(maxX, p[0]); maxY = Math.max(maxY, p[1]); });
    const offX = ri(rnd, 0, 2 - Math.min(2, maxX));
    const offY = ri(rnd, 0, 5 - maxY);
    const ci = ri(rnd, 0, PALETTE.length - 1);
    t.forEach(p => q.given.push({ x: p[0] + offX, y: p[1] + offY, c: PALETTE[ci], role: 'src' }));
  }
  buildTargets(q);
  return q;
}

/* 由 given(src) 逐格应用变换生成 targets（色同源格；sx,sy=源格坐标）——唯一解的结构保证 */
function buildTargets(q) {
  q.targets = [];
  q.given.forEach(g => {
    if (g.role !== 'src') return;
    const t = applyKind(q, { x: g.x, y: g.y });
    q.targets.push({ x: t.x, y: t.y, c: g.c, sx: g.x, sy: g.y });
  });
  q.targets.sort((a, b) => a.y - b.y || a.x - b.x);
  q._fill = q.targets.map(function () { return false; });
}

/* 题签名（同关 5 题互异判据）：kind+轴参数+W/H+given 全格（含颜色）排序 */
function quizSig(q) {
  const ax = q.kind === 'vv' ? ':' + q.axis.k1 + ',' + q.axis.k2 : '';
  return q.kind + ax + ':' + q.W + 'x' + q.H + ':' +
    q.given.map(c => c.x + ',' + c.y + ',' + c.c).sort().join(';');
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；同关 5 题互异） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 29);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // §0.3 batch11 M1 定版
  const quizzes = [];
  const seen = {};
  let guard = 0;
  while (quizzes.length < CH_LEN && guard++ < 500) {
    const q = genQuiz(dch, rnd, flat === 0 && quizzes.length === 0);  // flat0-q0 固定 v（教学兼容）
    const sig = quizSig(q);
    if (seen[sig]) continue;                       // 同关互异：撞签名重生成
    seen[sig] = true;
    quizzes.push(q);
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 补全引擎（无 DOM） ---------- */
const filledOf = q => q._fill.reduce((s, f) => s + (f ? 1 : 0), 0);

/* engTapCell(L, x, y)：点 (x,y) 格 → 返回 'placed'（点对未满）/
   'right'|'done'（补齐最后一格，step 推进）/ 'wrong'（非 target 位，miss 计一次）
   / null（非法：越界、已点亮 target、已解题、关已结束） */
function engTapCell(L, x, y) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved) return null;
  if (typeof x !== 'number' || typeof y !== 'number' ||
      Math.floor(x) !== x || Math.floor(y) !== y ||
      x < 0 || y < 0 || x >= q.W || y >= q.H) return null;
  for (let i = 0; i < q.targets.length; i++) {
    const t = q.targets[i];
    if (t.x === x && t.y === y) {
      if (q._fill[i]) return null;                 // 已点亮：无操作不计 miss（可重点口径）
      q._fill[i] = true;
      q.solved = q._fill.every(f => f === true);
      if (q.solved) {
        L.step++;
        if (L.step >= L.quizzes.length) L.done = true;
        return L.done ? 'done' : 'right';
      }
      return 'placed';
    }
  }
  q.miss++;                                        // 非 target 位（given 格/空位）
  L.retries++;
  return 'wrong';
}
/* 星级：0 错=3★ / 1-2 错=2★ / 更多=1★（错次口径，零惩罚=可无限重点） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 救援/教学"帮"目标（§3 承旧）：首个未补镜像位 → {i}（其对应源格=pulse 目标）；
   已解题 → null ---------- */
function rescueTarget(q) {
  if (!q || q.solved) return null;
  for (let i = 0; i < q.targets.length; i++) {
    if (!q._fill[i]) return { i: i };
  }
  return null;
}

/* ---------- 结构校验（verify 用）：域/角色/公平性不变式基础面（对称真值由 verify 分源复算 §6） */
function structOk(q) {
  if (!q || KINDS.indexOf(q.kind) < 0) return false;
  if (q.W !== KIND_W[q.kind] || q.H !== KIND_W[q.kind]) return false;
  if (!q.axis || q.axis.kind !== q.kind) return false;
  if (!Array.isArray(q.given) || !q.given.length) return false;
  const lo = KIND_TGT[q.kind][0], hi = KIND_TGT[q.kind][1];
  if (!Array.isArray(q.targets) || q.targets.length < lo || q.targets.length > hi) return false;
  const seen = {};
  let nSrc = 0, nAxis = 0;
  for (const c of q.given) {
    if (c.x < 0 || c.x >= q.W || c.y < 0 || c.y >= q.H) return false;
    if (PALETTE.indexOf(c.c) < 0) return false;
    if (seen[c.x + ',' + c.y]) return false;
    seen[c.x + ',' + c.y] = true;
    if (c.role === 'src') nSrc++;
    else if (c.role === 'axis') nAxis++;
    else return false;
  }
  if (nSrc !== q.targets.length) return false;                    // 每源格恰一 target
  if ((q.kind === 'd1' || q.kind === 'd2') !== (nAxis > 0)) return false;  // 轴上格仅 dch2
  const tseen = {};
  for (const t of q.targets) {
    if (t.x < 0 || t.x >= q.W || t.y < 0 || t.y >= q.H) return false;
    if (tseen[t.x + ',' + t.y]) return false;
    tseen[t.x + ',' + t.y] = true;
    if (seen[t.x + ',' + t.y]) return false;                      // targets 与 given 无重叠
    const src = q.given.filter(g => g.x === t.sx && g.y === t.sy && g.role === 'src');
    if (src.length !== 1 || src[0].c !== t.c) return false;       // 色同源格+源恰一
  }
  return Array.isArray(q._fill) && q._fill.length === q.targets.length &&
    q._fill.every(f => f === false) && q.miss === 0 && q.solved === false;
}
/* ================= mirrormaze 主逻辑（题面渲染 / 点格补全 / 教学 / 救援 / 推进）
   玩法（SPEC-BATCH17 §6 r14 轴向族）：每题=方盘网格+源侧色格+按 kind 渲染的对称轴
   （v 竖直/h 水平/d1 主对角/d2 反对角/pv·ph 6×6 周期双向/vv 平行双镜/r180 垂直双镜）。
   点空格补全镜像：点对（=某源格的镜像位）→该格点亮成同色；点非镜像位→格子闪一下
   不点亮可重点（低挫败零惩罚；1000ms 防重入窗内吞点=miss 只记一次 §0.26-b16 M1）；
   全部镜像位补齐→对称轴闪+mm_right+下一题。错点反馈轻（闪+微音），不长晃动。
   语音轴向分流（r14）：v 轴沿用旧键（hint/wrong 说"左边"——flat0-q0 恒 v 教学兼容）；
   非 v 轴走 mm_hint2/mm_wrong2（"镜子那一边"）；tip 文案按轴切换（非 clip）。
   救援钟口径（§0.7a）：点格子（无论对错）=作答不重置；补齐推进=唯一重置；空白/兔子/提示不重置。
   教学看-帮-独：watch=演示看源格→手指移到镜像位→逐格点满（返回值存 window.__mmDemoR
   §0.27，watch ≤16s）→立即重发同关（确定性关卡，题面一致），"你来拼一拼"交接 →
   帮=幽灵手指指向下一个未补镜像位；独=首次补齐放手。
   验收钩子：window.MM = { get currentLevel, get quiz{W,H,kind,axis,given,targets,step,miss},
   tapCell(x,y), autoSolve(), start(flat), get tutorial, get rescues } */

}
/* 对称轴（r14 轴向族）：#axis 容器内 .axl generic 线段，按 kind 实算几何——
   量测用 offsetWidth/computed gap（transform 无关：board-in 缩放动画不污染几何）。
   反射轴 K 的像素位=(K*step+cs)/2（K=反射常数：v/h=p/W-1、pv=5、vv=k1/k2；
   偶 K=列间缝中点、奇 K=中列格心——代数恒等式，两种盘宽统一） */
function renderAxis(q) {
  axisEl.innerHTML = '';
  const first = gridEl.children[0];
  if (!first) return;
  const cs = first.offsetWidth;
  const gap = parseFloat(getComputedStyle(gridEl).columnGap) || 8;
  const step = cs + gap;
  const gx = gridEl.offsetLeft, gy = gridEl.offsetTop;
  const cx = x => gx + x * step + cs / 2;          // 第 x 列格心
  const cy = y => gy + y * step + cs / 2;          // 第 y 行格心
  const ax = K => gx + (K * step + cs) / 2;        // 竖直反射轴 K 像素位
  const ay = L => gy + (L * step + cs) / 2;        // 水平反射轴 L 像素位
  const bot = () => gy + q.H * step - gap;         // 网格底缘
  const right = () => gx + q.W * step - gap;       // 网格右缘
  const ex = cs * 0.22;                            // 线段两端出界延伸
  const line = (x1, y1, x2, y2) => {
    const len = Math.hypot(x2 - x1, y2 - y1);
    const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    const d = document.createElement('div');
    d.className = 'axl';
    d.style.left = x1 + 'px';
    d.style.top = y1 + 'px';
    d.style.width = len.toFixed(1) + 'px';
    d.style.transform = 'rotate(' + ang.toFixed(2) + 'deg)';
    axisEl.appendChild(d);
  };
  switch (q.kind) {
    case 'v':  line(ax(3), gy - ex, ax(3), bot() + ex); break;
    case 'h':  line(gx - ex, ay(3), right() + ex, ay(3)); break;
    case 'd1': line(cx(0) - ex * .7, cy(0) - ex * .7, cx(4) + ex * .7, cy(4) + ex * .7); break;
    case 'd2': line(cx(4) + ex * .7, cy(0) - ex * .7, cx(0) - ex * .7, cy(4) + ex * .7); break;
    case 'pv': line(ax(5), gy - ex, ax(5), bot() + ex); break;
    case 'ph': line(gx - ex, ay(5), right() + ex, ay(5)); break;
    case 'vv':                                       /* 平行双镜：先照 k1 再照 k2（两竖线） */
      line(ax(q.axis.k1), gy - ex, ax(q.axis.k1), bot() + ex);
      line(ax(q.axis.k2), gy - ex, ax(q.axis.k2), bot() + ex);
      break;
    case 'r180':                                     /* 垂直双镜=转半圈（十字轴） */
      line(ax(5), gy - ex, ax(5), bot() + ex);
      line(gx - ex, ay(5), right() + ex, ay(5));
      break;
  }
}

/* ================= 补全主路径（真实点击 / MM 钩子 / autoSolve / 教学演示共用） ================= */
async function uiTapCell(x, y, demo) {
  /* locked 门拦真实输入；demo 通道仅 tutorialWatch 内部传 true（豁免 locked） */
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  const run = cur;                               // 身份守卫：演出窗口内重玩会重建 cur
  const r = engTapCell(cur, x, y);
  if (r === null) {                              // 已点亮格/越界：轻叮不计 miss
    if (!demo) sfx('pop');
    return false;
  }
  if (r === 'wrong') {                           // 点非镜像位：闪一下不点亮，零惩罚可重点
    flashCell(x, y);
    sfx('fail');
    const wk = wrongKeyOf(q);                    /* 轴向分流：v=mm_wrong / 非 v=mm_wrong2 */
    sayW(wk.key, wk.text, q.miss === 2);         /* 三态（§0.5） */
    if (q.miss >= 2) applyRescueVisual(q);       /* 首错不提示：连错 2 次给视觉线索（§0.7） */
    if (state.tut === 'help') pointHelpNext();
    state.locked = true;                         /* 错点防重入窗 1000ms：连击不重复记 miss（b16 P2-1 M1） */
    await wait(1000 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    return r;
  }
  lightCell(x, y, cellColor(q, x, y));           // 点对：点亮成同色
  fillHi();
  if (state.tut === 'help' && r === 'placed') pointHelpNext();   // "帮"：跟着节奏指向下一格
  if (r === 'right' || r === 'done') {           // 补齐：对称轴闪+图案完整→推进
    lastAct = Date.now();                        // 仅补齐推进重置救援钟（§0.7a）
    if (state.tut === 'help') {                  // 教学"独"：首次补齐放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    state.locked = true;
    clearRescueVisual();
    axisFlash();
    sayR(VOICE.right.key, VOICE.right.text);     // 补齐反馈句=中文 clip（§0.24）
    sfx('ok');
    await wait(2000 * SPEED);                    // 等 mm_right clip（≈2.5s）主体播完
    if (cur !== run) return r;
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
    return r;
  }
  return r;                                      // 'placed'
}
/* 该 target 的应亮颜色（同源格色；引擎真值） */
function cellColor(q, x, y) {
  for (const t of q.targets) if (t.x === x && t.y === y) return t.c;
  return '#F6ECD9';
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(f) {
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关（flat≥20 dch 随机）实算下一关难度章取 GEN 文案
     （家族 F 契约，r13 三犯后定版：禁章序取模推进形态——build.py 双断言） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });   /* 家族 A（b25 形态定版，r14 审查 m-6 对齐 dc）：winFlow 重玩旧关后 dayEnd 预告按进度关非 lim-1 */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {

  }

}

async function tutorialWatch() {

  await wait(700 * SPEED);

  const lEl = cellBtn(firstSrc.x, firstSrc.y);

      await wait(420 * SPEED);

async function runVerify() {

  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;

  /* ---- verify 侧独立真值（闭式代数 T——禁引引擎 reflV/reflH/applyKind，§6 三源分算） ---- */
  const REF_W = { v: 4, h: 4, d1: 5, d2: 5, pv: 6, ph: 6, vv: 6, r180: 6 };
  const REF_KINDS_OF_DCH = { 1: ['v', 'h'], 2: ['d1', 'd2'], 3: ['pv', 'ph'], 4: ['vv', 'r180'] };
  const REF_TGT = { v: [3, 4], h: [3, 4], d1: [4, 5], d2: [4, 5], pv: [6, 6], ph: [6, 6], vv: [4, 6], r180: [4, 6] };

  /* 闭式代数变换（SPEC §6 真值表）：v(3-x,y)/h(x,3-y)/d1(y,x)/d2(4-y,4-x)/pv(5-x,y)/
     ph(x,5-y)/vv=x+(k2-k1) 平移（双平行镜复合恒等式）/r180(5-x,5-y)=转 180° */
  function refT(q, p) {
    switch (q.kind) {
      case 'v':    return { x: 3 - p.x, y: p.y };
      case 'h':    return { x: p.x, y: 3 - p.y };
      case 'd1':   return { x: p.y, y: p.x };
      case 'd2':   return { x: 4 - p.y, y: 4 - p.x };
      case 'pv':   return { x: 5 - p.x, y: p.y };
      case 'ph':   return { x: p.x, y: 5 - p.y };
      case 'vv':   return { x: p.x + (q.axis.k2 - q.axis.k1), y: p.y };
      case 'r180': return { x: 5 - p.x, y: 5 - p.y };
    }

  const keyOfCell = c => c.x + ',' + c.y;
  /* 独立签名（同关 5 题互异判据）：kind+轴参数+W/H+given 全格（含颜色）排序 */
  function refSigOf(q) {
    const ax = q.kind === 'vv' ? ':' + q.axis.k1 + ',' + q.axis.k2 : '';
    return q.kind + ax + ':' + q.W + 'x' + q.H + ':' +
      q.given.map(c => c.x + ',' + c.y + ',' + c.c).sort().join(';');
  }
  /* 答案签名（反启发式锚 delta⑤）：kind+轴参数+源侧（同模板跨签名答案变换互异——
     记住图案≠记住答案，必须读轴） */
  function ansSigOf(q) {
    const src = q.given.filter(c => c.role === 'src');
    const xs = src.map(c => c.x), ys = src.map(c => c.y);
    let side = '';
    if (q.kind === 'v') side = Math.max.apply(0, xs) <= 1 ? 'L' : 'R';
    if (q.kind === 'h') side = Math.max.apply(0, ys) <= 1 ? 'T' : 'B';
    if (q.kind === 'pv') side = Math.max.apply(0, xs) <= 1 ? 'A' : 'B';
    if (q.kind === 'ph') side = Math.max.apply(0, ys) <= 1 ? 'A' : 'B';
    if (q.kind === 'vv') side = (q.axis.k2 - q.axis.k1) > 0 ? 'L' : 'R';
    const ax = q.kind === 'vv' ? ':' + q.axis.k1 + ',' + q.axis.k2 : '';
    return q.kind + ax + ':' + side;

  /* 单题结构分源复算（SPEC §6 全量判据） */
  function refQuizOk(dch, q) {
    const why = [];
    if (REF_KINDS_OF_DCH[dch].indexOf(q.kind) < 0) why.push('kind ' + q.kind + ' 不属 dch' + dch);
    if (q.W !== REF_W[q.kind] || q.H !== REF_W[q.kind]) why.push('盘面 ' + q.W + 'x' + q.H);
    const seen = {};
    let nSrc = 0, nAxis = 0;
    for (const c of q.given) {
      if (c.x < 0 || c.x >= q.W || c.y < 0 || c.y >= q.H) why.push('given 越界 ' + keyOfCell(c));
      if (REF_PALETTE.indexOf(c.c) < 0) why.push('色域 ' + keyOfCell(c));
      if (seen[keyOfCell(c)]) why.push('given 重复 ' + keyOfCell(c));
      seen[keyOfCell(c)] = true;
      if (c.role === 'src') nSrc++;
      else if (c.role === 'axis') nAxis++;

      if (t.x < 0 || t.x >= q.W || t.y < 0 || t.y >= q.H) why.push('target 越界 ' + keyOfCell(t));
      if (tSeen[keyOfCell(t)]) why.push('target 重复 ' + keyOfCell(t));
      tSeen[keyOfCell(t)] = true;
      if (seen[keyOfCell(t)]) why.push('target 与 given 重叠 ' + keyOfCell(t));
    }
    /* 公平性不变式：every given(src) 的闭式变换位=target 同色且 sx/sy=源格；axis 自映无 target */
    for (const c of q.given) {
      const T = refT(q, c);
      if (c.role === 'axis') {
        if (T.x !== c.x || T.y !== c.y) why.push('axis 非自映 ' + keyOfCell(c));
        if (q.targets.some(t => t.x === c.x && t.y === c.y)) why.push('axis 产 target ' + keyOfCell(c));
      } else {
        const hit = q.targets.filter(t => t.x === T.x && t.y === T.y);
        if (hit.length !== 1 || hit[0].c !== c.c || hit[0].sx !== c.x || hit[0].sy !== c.y)
          why.push('src 变换位≠同色 target ' + keyOfCell(c));

    }
    if (nSrc !== q.targets.length) why.push('targets 数 ' + q.targets.length + '≠src ' + nSrc);
    const lo = REF_TGT[q.kind][0], hi = REF_TGT[q.kind][1];
    if (q.targets.length < lo || q.targets.length > hi)
      why.push('targets 数 ' + q.targets.length + ' 不在域 [' + lo + ',' + hi + ']');
    const src = q.given.filter(c => c.role === 'src');
    /* 章别源侧结构（SPEC §6 章结构） */
    if (dch === 1) {
      if (nAxis) why.push('ch1 含 axis 格');
      if (q.kind === 'v' && !src.every(c => c.x <= 1)) why.push('ch1-v 源非左半');
      if (q.kind === 'h' && !src.every(c => c.y <= 1)) why.push('ch1-h 源非上半');
    }
    if (dch === 2) {
      if (!nAxis || nAxis > 2) why.push('ch2 轴上干扰格数 ' + nAxis);
      if (q.kind === 'd1') {
        if (!src.every(c => c.y > c.x)) why.push('d1 源非 y>x 三角');
        if (!q.given.filter(c => c.role === 'axis').every(c => c.x === c.y)) why.push('d1 轴格非 x=y');
      } else {
        if (!src.every(c => c.x + c.y < 4)) why.push('d2 源非 x+y<4 三角');
        if (!q.given.filter(c => c.role === 'axis').every(c => c.x + c.y === 4)) why.push('d2 轴格非 x+y=4');
      }
    }
    if (dch === 3) {
      if (nAxis) why.push('ch3 含 axis 格');
      /* 周期棋盘格：双色相位一致（同相位恒同色、异相位恒异色）——独立于引擎 assign */
      const ph = { 0: null, 1: null };
      for (const c of src) {
        const p = (c.x + c.y) % 2;
        if (ph[p] === null) ph[p] = c.c;
        else if (ph[p] !== c.c) why.push('周期相位色不一致 ' + keyOfCell(c));
      }
      if (!ph[0] || !ph[1] || ph[0] === ph[1]) why.push('ch3 非双色棋盘格');
      /* 周期反相判别（delta④）：每 target 位置相位与源格相位互反——续延/照抄预测逐格全错 */
      for (const t of q.targets) {

        const band = Math.max.apply(0, xs) <= 1 ? [0, 1] : [4, 5];

      } else {
        const ys = src.map(c => c.y);
        const band = Math.max.apply(0, ys) <= 1 ? [0, 1] : [4, 5];

        for (const t of q.targets) if (t.x !== 5 - t.sx || t.y !== 5 - t.sy) why.push('r180 非转半圈 ' + keyOfCell(t));
      }

    return { ok: why.length === 0, why: why };
  }
  /* 找一个非 given 非 target 空 cell（错点用；各章恒存在） */
  function emptyCell(q) {
    const occ = {};
    q.given.forEach(c => { occ[keyOfCell(c)] = 1; });
    q.targets.forEach(t => { occ[keyOfCell(t)] = 1; });
    for (let y = 0; y < q.H; y++) for (let x = 0; x < q.W; x++)

  /* ---- 反启发式锚（delta⑤）与 pv/ph 双向覆盖：40 关聚合 ---- */

  const auditOf = flat => {
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const rec = { dch: L1.dch, kinds: L1.quizzes.map(q => q.kind) };

    rec.struct = true;

      if (!structOk(q)) rec.struct = false;

      if (sigSeen[sg]) sigRepeated = true;
      sigSeen[sg] = true;
      /* 聚合：模板×答案签名（反启发式锚）/pv·ph 双向覆盖 */
      if (q.tpl >= 0) {

    const Ld = genLevel(flat);

    if (engTapCell(Ld, ec.x, ec.y) !== 'wrong' || q0.miss !== 1 || Ld.retries !== 1) rec.drive = false;
    if (engTapCell(Ld, ec.x, ec.y) !== 'wrong' || q0.miss !== 2) rec.drive = false;  // 再点再计
    const g0 = q0.given[0];
    if (engTapCell(Ld, g0.x, g0.y) !== 'wrong' || q0.miss !== 3 || Ld.retries !== 3) rec.drive = false;  // 点 given 格=wrong
    let relitOk = false;
    for (let k = 0; k < Ld.quizzes.length && rec.drive; k++) {

        const isQuizLast = i === q.targets.length - 1;
        const isLevelLast = isQuizLast && k === Ld.quizzes.length - 1;
        const r = engTapCell(Ld, q.targets[i].x, q.targets[i].y);
        const want = isLevelLast ? 'done' : (isQuizLast ? 'right' : 'placed');
        if (r !== want) { rec.drive = false; break; }
        if (k === 0 && i === 0) {                   // 已点亮 target 再点=null 不计 miss
          relitOk = engTapCell(Ld, q.targets[0].x, q.targets[0].y) === null && q.miss === 3;

    /* ①c 救援闭环：rescueTarget 步进收敛（步数=全 targets 数；已解题无目标） */
    const Lr = genLevel(flat);

      if (!t && !q.solved) { rescueOk = false; break; }
      if (t) {
        engTapCell(Lr, q.targets[t.i].x, q.targets[t.i].y);
        rSteps++;
      }
    }
    if (rescueTarget(Lr.quizzes[CH_LEN - 1]) !== null) rescueOk = false;   // 已解题无目标
    if (!Lr.done || rSteps !== expectSteps) rescueOk = false;
    rec.rescue = rescueOk;
    rec.ok = rec.det && rec.range && rec.struct && rec.ref && rec.drive && rec.rescue;
    return rec;
  };
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const rec = auditOf(flat);
    if (flat < STATIC_LEVELS) levels[flat] = rec; else gen[flat] = rec;
    if (rec.ok) npass++;
  }
  /* 聚合断言：反启发式锚（≥2 互异答案签名的模板 ≥5）+pv/ph 双向覆盖 */
  total++;
  for (const k2 of Object.keys(tplSigs)) {
    if (Object.keys(tplSigs[k2]).length >= 2) anchorN++;   /* r14 实测 anchor=6（verify_one M4 同口径 2026-09-15——SPEC §6 实测值回写） */
  }
  const coverOk = Object.keys(sideSeen.pv).sort().join(',') === 'A,B' &&
                  Object.keys(sideSeen.ph).sort().join(',') === 'A,B';
  const anchorOk = anchorN >= 5 && coverOk;
  if (anchorOk) npass++;
  units.anchor = { ok: anchorOk, templatesWithTwoSigs: anchorN, pvSides: Object.keys(sideSeen.pv),
    phSides: Object.keys(sideSeen.ph) };

  /* ---- ★ 星级三档独立驱动（flat7：0/1/3 错） ---- */
  total++;
  const L3 = genLevel(7);
  for (const q of L3.quizzes) for (const t of q.targets) engTapCell(L3, t.x, t.y);
  const s3 = engStars(L3) === 3;
  const L2 = genLevel(7);
  engTapCell(L2, emptyCell(L2.quizzes[0]).x, emptyCell(L2.quizzes[0]).y);       // 1 错
  for (const q of L2.quizzes) for (const t of q.targets) engTapCell(L2, t.x, t.y);
  const s2 = engStars(L2) === 2;
  const L1s = genLevel(7);
  const ec1 = emptyCell(L1s.quizzes[0]);
  engTapCell(L1s, ec1.x, ec1.y); engTapCell(L1s, ec1.x, ec1.y); engTapCell(L1s, ec1.x, ec1.y);   // 3 错
  for (const q of L1s.quizzes) for (const t of q.targets) engTapCell(L1s, t.x, t.y);
  const s1 = engStars(L1s) === 1;
  if (s3 && s2 && s1) npass++;
  units.stars = { ok: s3 && s2 && s1, s3: s3, s2: s2, s1: s1 };

  /* ---- ② tapCell 单元（flat0 真实 UI） ---- */
  total++;
  startLevel(0);
  await wait(60);
  const qT = cur.quizzes[0];
  const ecT = emptyCell(qT);
  const rW = await MM.tapCell(ecT.x, ecT.y);
  const wb = cellBtn(ecT.x, ecT.y);
  const wrongOk = rW === 'wrong' && wb.classList.contains('blink') && !wb.classList.contains('lit') &&
    MM.quiz.miss === 1;
  const t0 = qT.targets[0];
  const rP = await MM.tapCell(t0.x, t0.y);
  const rb = cellBtn(t0.x, t0.y);
  const placedOk = rP === 'placed' && rb.classList.contains('lit') && rb.dataset.c === t0.c &&
    MM.quiz.step === 1;
  const rN = await MM.tapCell(t0.x, t0.y);                       // 重点已点亮格
  const relitOk2 = rN === false && MM.quiz.miss === 1;
  const rO1 = await MM.tapCell(99, 0), rO2 = await MM.tapCell(1.5, 0);          // 越界/非整数
  const oobOk = rO1 === false && rO2 === false;
  const tapOk = wrongOk && placedOk && relitOk2 && oobOk;
  if (tapOk) npass++;
  units.tap = { ok: tapOk, wrongOk: wrongOk, placedOk: placedOk, relit: relitOk2, oob: oobOk };

  /* ---- ②b sayW 三态 + 轴向分流（flat0 v=mm_wrong / flat5 d1·d2=mm_wrong2） ---- */
  total++;
  const origP = KIDS.voice.play;
  const pLogB = [];
  KIDS.voice.play = function (key, text) { pLogB.push(String(key)); };
  startLevel(0);
  await MM.tapCell(emptyCell(cur.quizzes[0]).x, emptyCell(cur.quizzes[0]).y);
  await MM.tapCell(emptyCell(cur.quizzes[0]).x, emptyCell(cur.quizzes[0]).y);   // flat<3：每错必播
  const n0 = pLogB.filter(k => k === 'mm_wrong').length;
  const k0 = pLogB[pLogB.length - 1];
  startLevel(5);                                                                 // flat5=ch2 斜轴
  const q5 = cur.quizzes[0];
  await MM.tapCell(emptyCell(q5).x, emptyCell(q5).y);                            // ①节流窗首播
  await MM.tapCell(emptyCell(q5).x, emptyCell(q5).y);                            // ②miss===2 force
  await MM.tapCell(emptyCell(q5).x, emptyCell(q5).y);                            // ③10s 窗内静默
  const n5 = pLogB.filter(k => k === 'mm_wrong2').length;
  const k5 = pLogB[pLogB.length - 1];
  KIDS.voice.play = origP;
  const sayWOk = n0 === 2 && k0 === 'mm_wrong' && n5 === 2 && k5 === 'mm_wrong2';
  if (sayWOk) npass++;
  units.sayW = { ok: sayWOk, nFlat0: n0, keyFlat0: k0, nFlat5: n5, keyFlat5: k5 };

  /* ---- ③ UI 冒烟 A：flat0 错一次→全通路通关（2 星+对称轴 flash 同步在场） ---- */
  total++;
  startLevel(0);
  await MM.tapCell(emptyCell(cur.quizzes[0]).x, emptyCell(cur.quizzes[0]).y);    // 首题错点一次
  let axisFlashed = false, quizzesA = 0;
  while (cur && !cur.done && quizzesA < 30) {
    const q = cur.quizzes[cur.step];
    for (const t of q.targets) {
      const p = MM.tapCell(t.x, t.y);            // flash 在 await 前同步挂类——逐击即时抓取
      if (axisEl.classList.contains('flash')) axisFlashed = true;
      await p;
    }
    quizzesA++;
  }
  const lvA = MM.currentLevel;
  const smokeOkA = cur.done && quizzesA === CH_LEN && cur.retries === 1 &&
    engStars(cur) === 2 && lvA.won && axisFlashed;
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, axisFlashed: axisFlashed, quizzes: quizzesA,
    stars: engStars(cur), retries: cur.retries };

  /* ---- ④ UI 冒烟 B：flat15（ch4 双镜复合）全对通关 3 星 ---- */
  total++;
  startLevel(15);
  const q15 = cur.quizzes[0];
  const shapeOk = q15.W === 6 && (q15.kind === 'vv' || q15.kind === 'r180');
  const rB = await MM.autoSolve();
  const lv15 = MM.currentLevel;
  const smokeOkB = shapeOk && rB.ok && rB.done && rB.quizzes === CH_LEN &&
    lv15.done && lv15.won && cur.retries === 0 && engStars(cur) === 3;
  if (smokeOkB) npass++;
  smokes.flat15 = { ok: smokeOkB, shapeOk: shapeOk, kind: q15.kind, quizzes: rB.quizzes,
    stars: engStars(cur), targets: q15.targets.length };

  /* ---- ⑤ 布局（竖屏三件套 M3）：双 viewport ×四 dch（flat0/5/10/15）
     量测用 offsetWidth（transform 无关：board-in 缩放动画不污染几何）；
     portStyle 判别锚=格尺寸横/竖双档位（g4 92/84、g5 82/72、g6 72/66）；
     轴向线段数按 kind（vv 双平行线/r180 十字） ---- */
  async function simView(w, h, port, flat) {
    const g = $id('game');
    document.body.classList.toggle('port', !!port);       // 竖屏类通道（与 @media 逐条等值——M3）
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    startLevel(flat);
    await wait(620);                            // 盘入场动画 .4s（真实 ms，不吃 SPEED）
    const cells = Array.prototype.slice.call(gridEl.querySelectorAll('.cell'));
    const q = cur.quizzes[cur.step];
    const cellOk = cells.length === q.W * q.H &&
      cells.every(b => b.offsetWidth >= 64 && b.offsetHeight >= 64);
    const cs = cells.length ? cells[0].offsetWidth : 0;
    const wantPort = { 4: 84, 5: 72, 6: 66 }[q.W];
    const wantLand = { 4: 92, 5: 82, 6: 72 }[q.W];
    const realPort = window.innerHeight > window.innerWidth;
    const portStyle = port ? (cs >= wantPort - 2 && cs <= wantPort + 2)
                           : (realPort || (cs >= wantLand - 2 && cs <= wantLand + 2));
    const axN = axisEl.querySelectorAll('.axl').length;
    const axisOk = axN === REF_AXIS_N[q.kind];          // 轴向线段数=kind 真值（1/1/2/2）
    const hb = hintBtnEl();
    const hintOk = !!hb && hb.getBoundingClientRect().width >= 96 && hb.getBoundingClientRect().height >= 96;
    let btnOk = true;                           // 全部按钮 ≥64（.k-parentbtn 家长按钮豁免）
    document.querySelectorAll('button').forEach(b => {
      if (b.classList.contains('k-parentbtn')) return;
      const r = b.getBoundingClientRect();
      if (r.width > 4 && r.height > 4 && (r.width < 64 || r.height < 64)) btnOk = false;
    });
    const de = document.documentElement;
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    document.body.classList.remove('port');
    return { vp: w + 'x' + h + (port ? 'P' : ''), flat: flat, kind: q.kind, cells: cells.length,
      cs: cs, cellOk: cellOk, portStyle: portStyle, axisOk: axisOk, axisN: axN,
      hintOk: hintOk, btnOk: btnOk, ox: ox,
      pass: cellOk && portStyle && axisOk && hintOk && btnOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const f of [0, 5, 10, 15]) {
    sims.push(await simView(1280, 800, false, f));
    sims.push(await simView(800, 1180, true, f));
  }
  const gv = $id('game');
  gv.style.width = '';
  gv.style.height = '';
  startLevel(0);                                // 还原真实 viewport 布局
  const layoutOk = sims.length === 8 && sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑥ 分布与专项：文案对账 / clip 注入 / 开场链 / 提示通道轴向分流 ---- */
  total++;
  /* SPEC §6 定稿文案独立字面量（manifest 一致，禁改） */
  const refVoice = VOICE.watch.text === '看！照镜子拼一拼' &&
    VOICE.turn.text === '你来拼一拼' &&
    VOICE.hint.text === '看看左边想一想' && VOICE.hint2.text === '看看镜子那一边' &&
    VOICE.right.text === '拼好啦，真对称' &&
    VOICE.wrong.text === '照照左边再看看' && VOICE.wrong2.text === '照照镜子再看看';
  /* 10 条 clips 注入对账（mm_ 7 + core 3，manifest games:['mirrormaze']；无额外词 clip） */
  const MM_KEYS = ['mm_tut_watch', 'mm_tut_turn', 'mm_hint', 'mm_hint2', 'mm_right', 'mm_wrong', 'mm_wrong2'];
  const coreKeys = Object.keys(KIDS.voice.clips).filter(k => k.indexOf('core_') === 0);
  const nClips = Object.keys(KIDS.voice.clips).length;
  const clipOk = nClips === 10 && MM_KEYS.every(k => !!KIDS.voice.clips[k]) && coreKeys.length === 3;
  /* 开场顺序链 + 提示通道轴向分流（stub 记录） */
  const origQ = KIDS.voice.queue, origP6 = KIDS.voice.play;
  const qLog = [], playLog = [];
  KIDS.voice.queue = function (parts) { qLog.push(parts.slice()); };
  KIDS.voice.play = function (key) { playLog.push(String(key)); };
  startLevel(0);                                // verify 页恒走开场链（flat0-q0 恒 v）
  const lastQ = qLog[qLog.length - 1];
  const openChain = qLog.length >= 1 && lastQ.length === 1 && lastQ[0] === 'mm_hint';   // 开场=[hint] 单通道
  const tipV = (document.querySelector('#tip span') || {}).textContent || '';
  startLevel(10);                               // ch3 pv/ph：非 v 轴→hint2+tip 按轴
  const q10 = cur.quizzes[0];
  doHint();
  const hintR2 = playLog.indexOf('mm_hint2') >= 0;
  const tipPv = (document.querySelector('#tip span') || {}).textContent || '';
  const tipOk = tipV === '看看左边，拼右边' && tipPv === '先找镜子在哪边';
  KIDS.voice.queue = origQ; KIDS.voice.play = origP6;
  const specOk = refVoice && clipOk && openChain && hintR2 && tipOk && (q10.kind === 'pv' || q10.kind === 'ph');
  if (specOk) npass++;
  units.dist = { ok: specOk, refVoice: refVoice, clips: clipOk, nClips: nClips,
    openChain: openChain, hint2: hintR2, tipOk: tipOk, kind10: q10.kind,
    missing: MM_KEYS.filter(k => !KIDS.voice.clips[k]) };

  /* ---- ⑦ 教学链（verify 直驱 tutorialWatch；真实页看-帮-独链路由无头自测覆盖） ---- */
  total++;
  const origQ7 = KIDS.voice.queue, origP7 = KIDS.voice.play;
  const qLog7 = [], pLog7 = [];
  KIDS.voice.queue = function (parts) { qLog7.push(parts.slice()); };
  KIDS.voice.play = function (key) { pLog7.push(String(key)); };
  startLevel(0);
  const t0ms = Date.now();
  await tutorialWatch();                          // 看：watch clip → demo 看源格→点镜像位 → 补齐 → 重发同关 → 帮
  const tutMs = Date.now() - t0ms;
  KIDS.voice.queue = origQ7; KIDS.voice.play = origP7;
  const lastQ7 = qLog7[qLog7.length - 1];
  const fresh0 = genLevel(0).quizzes[0];
  const q0t = MM.quiz;
  const tutOk = pLog7.indexOf('mm_tut_watch') >= 0 &&                    /* 看=演示配 watch clip */
    window.__mmDemoR === 'right' &&                                     /* §0.27 演示补齐真实生效 */
    state.tut === 'help' && !state.demo && !state.locked &&              /* 帮：解锁等孩子动手 */
    MM.currentLevel && MM.currentLevel.flat === 0 &&                     /* 重发同关 */
    q0t && q0t.step === 0 && q0t.miss === 0 &&                           /* 新题面同题初态 */
    q0t.targets.length === fresh0.targets.length &&
    q0t.given.length === fresh0.given.length &&
    q0t.kind === 'v' &&                                                  /* flat0-q0 恒 v（教学兼容） */
    lastQ7 && lastQ7.length === 1 && lastQ7[0] === 'mm_tut_turn' &&      /* 交接顺序链单通道 */
    tutMs < 16000;                                                      /* watch ≤16s（verify 提速下恒真，真实页由时序设计保证） */
  if (tutOk) npass++;
  units.tutorial = { ok: tutOk, watchClip: pLog7.indexOf('mm_tut_watch') >= 0,
    demoR: window.__mmDemoR, handoff: !!lastQ7, parts: lastQ7, tut: state.tut, tutMs: tutMs };

  /* ---- ⑪ duration（r14 门禁）：40 关 modeled ≥40000+实测最低 93275 精确（flat0 定死：
     全 v 关 17 格=5×(4600×17/5 摊平)+5×3015——理论下限 84075（全 3 格 v 模板关）只是
     下界，防回漂锚用 40 关实测最低值）+逐关对账+语音窗不撑 ---- */
  /* 独立副本常量（禁引源模型；DECIDE_MS 六型=SPEC §6 认知推算定版） */
  const estMsV = s => s.length * 345 + 600;      // b25 定版：SAPI ~345ms/字+600（全字符口径）
  const V_DECIDE = { v: 4000, h: 5500, d1: 7500, d2: 7500, pv: 8000, ph: 8000, vv: 10000, r180: 9500 };
  const V_STEP = 600, V_ENTER = 400, V_STAGE = 400, V_MIN = 40000;
  const V_QUIZ = estMsV('拼好啦，真对称');        // = 3015（7 字符含逗号——全字符口径）
  const vDur = L => L.quizzes.reduce((s, q) =>
    s + q.targets.reduce((a, _, k) =>
      a + Math.max(k === 0 ? V_ENTER : V_STAGE, V_DECIDE[q.kind]) + V_STEP, 0) + V_QUIZ, 0);
  let dMin = Infinity, dFlat = -1, parityOk = true, voiceOk = true;
  for (let flat = 0; flat < 40; flat++) {
    const L = genLevel(flat);
    const d = vDur(L);
    if (d < dMin) { dMin = d; dFlat = flat; }
    if (levelDurMs(L) !== d) parityOk = false;             // 独立副本与源模型逐关对账
    for (const q of L.quizzes) for (let k = 0; k < q.targets.length; k++)
      if (V_DECIDE[q.kind] < (k === 0 ? V_ENTER : V_STAGE)) voiceOk = false;   // 逐步：决策 ≥ 语音窗
  }
  /* 源常量同步断言（estMs 全字符口径/DECIDE_MS/ADV_STEP/ADV_QUIZ/LEVEL_MIN_MS——build.py 另做字面 assert） */
  const constOk = JSON.stringify(DECIDE_MS) === JSON.stringify(V_DECIDE) &&
    ADV_STEP === 600 && ADV_QUIZ === 3015 && estMs('拼好啦，真对称') === 3015 &&
    ENTER_MS === 400 && STAGE_MS === 400 && LEVEL_MIN_MS === 40000 &&
    typeof modeled === 'function' && modeled(0) === vDur(genLevel(0));
  const durUnitOk = dMin >= V_MIN && dMin === 93275 && dFlat === 0 && parityOk && voiceOk && constOk;
  total++;
  if (durUnitOk) npass++;
  units.duration = { ok: durUnitOk, minMs: dMin, minFlat: dFlat, want: V_MIN,
    parity: parityOk, voiceNeverDominates: voiceOk, constOk: constOk,
    decide: V_DECIDE, quiz: V_QUIZ, step: V_STEP };

  const out = { game: 'mirrormaze', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
