<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子的游戏屋 · 一二年级的新游戏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FBF3E4;color:#4A3B2E;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:34px 22px}
  .logo{width:150px;height:150px}
  h1{font-size:clamp(26px,5vw,38px);letter-spacing:.05em}
  .ageband{display:inline-flex;align-items:center;gap:8px;background:#6E9BD8;color:#fff;font-size:16px;font-weight:700;
           padding:7px 18px;border-radius:999px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px;width:100%;max-width:760px}
  a.card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 24px;border-radius:26px;
         background:#FFF9EE;border:2.5px solid #4A3B2E;text-decoration:none;color:#4A3B2E;
         box-shadow:0 5px 0 #D8C9B4;transition:transform .2s}
  a.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
  @media (hover:hover){
    a.card:hover{transform:translateY(-4px);box-shadow:0 9px 0 #D8C9B4}
  }
  .card .icon{width:92px;height:92px}
  .card .name{font-size:22px;font-weight:700}
  .card .desc{font-size:14px;color:#8A7B6C;line-height:1.6;text-align:center}
  .foot{font-size:12.5px;color:#8A7B6C;text-align:center;line-height:1.8;max-width:520px}
</style>
</head>
<body>
  <div class="logo" id="logo"></div>
  <h1>小兔子的游戏屋 · 一二年级的新游戏</h1>
  <div class="ageband">★ 7-8 岁 · 一二年级 ★</div>
  <div class="grid">
    <a class="card" href="poemfill/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="16" y="10" width="68" height="80" rx="9" fill="#FFF9EE" stroke="#4A3B2E" stroke-width="2.5"/>
        <rect x="16" y="10" width="68" height="14" rx="9" fill="#6E9BD8" stroke="#4A3B2E" stroke-width="2.5"/>
        <g font-family="'Kaiti SC','STKaiti','KaiTi',serif" font-weight="700" font-size="15" fill="#4A3B2E">
          <text x="50" y="42" text-anchor="middle">白日依山尽</text>
          <text x="50" y="60" text-anchor="middle">黄河□海流</text>
          <text x="50" y="78" text-anchor="middle">欲穷千里目</text>
        </g>
        <g font-family="'Kaiti SC','STKaiti','KaiTi',serif" font-weight="700" font-size="12.5" text-anchor="middle">
          <rect x="8" y="52" width="16" height="16" rx="3.5" fill="#F5C445" stroke="#4A3B2E" stroke-width="2"/><text x="16" y="64" fill="#4A3B2E">入</text>
          <rect x="84" y="52" width="16" height="16" rx="3.5" fill="#F5C445" stroke="#4A3B2E" stroke-width="2" transform="translate(-4 14)"/><text x="80" y="66" fill="#4A3B2E">云</text>
        </g>
      </svg></div>
      <div class="name">古诗填空</div>
      <div class="desc">读一读学过的古诗<br>把空格的字填上</div>
    </a>
    <a class="card" href="area/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#4A3B2E" stroke-width="2">
          <rect x="12" y="22" width="48" height="48" rx="4" fill="#FFF9EE"/>
          <path d="M12 38 h48 M12 54 h48 M28 22 v48 M44 22 v48" stroke="#D8C9B4" stroke-width="1.6"/>
          <rect x="44" y="22" width="16" height="16" fill="#E8975A" opacity=".85"/>
          <rect x="44" y="38" width="16" height="16" fill="#E8975A" opacity=".85"/>
          <rect x="44" y="54" width="16" height="16" fill="#E8975A" opacity=".85"/>
        </g>
        <g stroke="#4A3B2E" stroke-width="2">
          <rect x="68" y="18" width="13" height="26" rx="3" fill="#8FBF7F"/>
          <rect x="84" y="18" width="13" height="26" rx="3" fill="#F5C445"/>
        </g>
        <path d="M74 58 q6 8 14 0" fill="none" stroke="#E0503C" stroke-width="3" stroke-linecap="round"/>
      </svg></div>
      <div class="name">铺砖面积</div>
      <div class="desc">数一数格子<br>选对砖块铺满工地</div>
    </a>
    <a class="card" href="mirrormaze/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#4A3B2E" stroke-width="1.6">
          <rect x="10" y="20" width="80" height="64" rx="6" fill="#FFF9EE" stroke-width="2.5"/>
          <path d="M50 20 v64" stroke="#8A7B6C" stroke-width="2" stroke-dasharray="4 4"/>
          <path d="M10 36 h80 M10 52 h80 M10 68 h80 M26 20 v64 M42 20 v64 M58 20 v64 M74 20 v64" stroke="#EADFCB" stroke-width="1.2"/>
        </g>
        <rect x="26" y="20" width="16" height="16" fill="#E8975A" stroke="#4A3B2E" stroke-width="2"/>
        <rect x="26" y="36" width="16" height="16" fill="#E8975A" stroke="#4A3B2E" stroke-width="2"/>
        <rect x="58" y="20" width="16" height="16" fill="none" stroke="#C9A87C" stroke-width="2" stroke-dasharray="3.5 3"/>
        <rect x="58" y="36" width="16" height="16" fill="none" stroke="#C9A87C" stroke-width="2" stroke-dasharray="3.5 3"/>
      </svg></div>
      <div class="name">镜像迷宫</div>
      <div class="desc">看看左边的图案<br>在右边照镜子补全</div>
    </a>
  </div>
    <p class="foot">每天有新关卡，玩完今天的小兔子会说"明天见"。<br>每款游戏右上角 🔒 家长面板：进度 / 时长 / 今日多玩关数。<br>完全离线，无广告无内购，进度保存在本机。</p>
