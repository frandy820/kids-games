<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数字侦探</title>
<style>
/* ================= 数字侦探 numberdet（batch14）=================
   视觉按 SPEC-BATCH14 §3 + 家族暖底：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E
   数轴场景：均匀横条 + 1/N 端点大字 + 5 倍数中间刻度；已排除段灰化、剩余段亮金；
   剩余区间两端数字大字实时显示（"还剩 lo 到 hi"防大范围不可读）
   数字键盘 1-9/0/删（≥64，3×4 网格）+ 确认主按钮（≥96 全宽大条）；
   范围外/已排除 → 键盘轻抖 + num_gone（不计猜测次数，无害探索）
   pointerdown 即响应；教学/演出期点键盘=吞输入+轻叮+键圈轻闪（§0.22） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#B7D3EA;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面行（上）+ 桌面（数轴区‖键盘，方向由 layout() 实测切换） ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  padding:4px 8px;overflow:hidden}
#tip{min-height:54px;max-width:94%;padding:9px 30px;border-radius:27px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;gap:12px;transition:transform .15s;flex:0 0 auto}
#tip.flash{animation:tip-b .5s ease}
@keyframes tip-b{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#tip-text{font-size:clamp(20px,2.8vw,27px);font-weight:800;color:#4A3B2E;line-height:1.2}
#tip b{font-size:clamp(24px,3.2vw,32px);font-weight:800;color:#E8873A;
  font-variant-numeric:tabular-nums;line-height:1}
#tip.watch{background:#FFF4E0}
#tip.help{background:#FDF3DF}

#table{flex:1 1 auto;min-height:0;width:100%;max-width:1240px;display:flex;align-items:center;
  justify-content:center;gap:22px;padding:8px 4px}
#table.col{flex-direction:column;gap:12px}

/* ---------- 左区：数轴卡（上）+ 输入卡（下） ---------- */
#left{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px}
/* 数轴卡：奶油底卡 + 顶部剩余区间大字 chip + 均匀横条 */
#axis-card{width:100%;max-width:980px;padding:10px 18px 12px;border-radius:22px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4}
#range-chip{display:flex;align-items:baseline;justify-content:center;gap:8px;min-height:44px;
  padding:3px 14px;margin:0 auto 6px;width:fit-content;border-radius:16px;background:#FDEBD2;
  border:2.5px dashed #E8873A;font-size:17px;font-weight:700;color:#8A7B6C}
#range-chip b{font-size:34px;font-weight:800;color:#E8873A;line-height:1;
  font-variant-numeric:tabular-nums}
#range-chip.ok{border-style:solid;border-color:#6FA063;background:#EAF4E4}
#range-chip.ok b{color:#5E9455}
/* 数轴轨道：格位模型（v 的格心 = (v-0.5)/N），段宽由 JS 百分比设置 */
#axis{position:relative;height:64px;margin:6px 4px 26px}
.seg{position:absolute;top:26px;height:16px;border-radius:8px;transition:left .45s ease,width .45s ease}
#seg-l,#seg-r{background:#E2D6C0;box-shadow:inset 0 2px 0 rgba(74,59,46,.08)}
#seg-m{background:linear-gradient(180deg,#F8D98C 0%,#F2B13C 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 2px 0 #C98F2B}
/* 5 倍数中间刻度：短竖线 + 小数字（端点 1/N 另有大字，不重复标） */
.tick{position:absolute;top:20px;width:0;pointer-events:none}
.tick i{position:absolute;left:-1.5px;top:0;width:3px;height:26px;border-radius:2px;
  background:#C9B896}
.tick span{position:absolute;left:0;top:32px;transform:translateX(-50%);font-size:15px;
  font-weight:700;color:#8A7B6C;font-variant-numeric:tabular-nums;white-space:nowrap}
.tick.dead span{color:#C4B49B}
/* 端点 1/N 大字（数轴锚点，§0.19 关键数字大字） */
.endcap{position:absolute;top:48px;font-size:26px;font-weight:800;color:#4A3B2E;
  font-variant-numeric:tabular-nums;line-height:1;transform:translateX(-50%);pointer-events:none}
/* 最近一次猜测图钉：蓝=太小(指右待升)/橙红=太大(指左待降)；猜中换 reveal 金星 */
#pin{position:absolute;top:-6px;transform:translateX(-50%);display:none;pointer-events:none;
  flex-direction:column;align-items:center;gap:1px;animation:pin-in .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pin-in{from{transform:translateX(-50%) scale(.3)}to{transform:translateX(-50%) scale(1)}}
#pin.show{display:flex}
#pin b{min-width:34px;padding:2px 8px;border-radius:11px;border:2.5px solid #4A3B2E;
  font-size:19px;font-weight:800;color:#FFF9EE;font-variant-numeric:tabular-nums;line-height:1.2}
#pin.small b{background:#6B8CB8}
#pin.big b{background:#D9806A}
#pin i{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent}
#pin.small i{border-top:8px solid #6B8CB8}
#pin.big i{border-top:8px solid #D9806A}
/* 救援视觉（§0.21）：剩余段中点 pulse 三连（救援即教二分） */
#mid-dot{position:absolute;top:14px;width:40px;height:40px;margin-left:-20px;border-radius:50%;
  pointer-events:none;display:none}
#mid-dot.on{display:block}
#mid-dot.pulse3{animation:mid-p3 .55s ease-in 3}
@keyframes mid-p3{0%,100%{box-shadow:0 0 0 0 rgba(232,151,90,.75);background:rgba(232,151,90,.28)}
  50%{box-shadow:0 0 0 16px rgba(232,151,90,0);background:rgba(232,151,90,.6)}}
/* 猜中揭示：金光圈+数字（数轴上 secret 位置，短暂呈现后随换题重建） */
#reveal{position:absolute;top:-4px;transform:translateX(-50%);display:none;pointer-events:none;
  flex-direction:column;align-items:center}
#reveal.show{display:flex;animation:pin-in .35s cubic-bezier(.2,1.7,.4,1)}
#reveal b{min-width:44px;padding:3px 10px;border-radius:13px;background:#8FBF7F;
  border:3px solid #4A3B2E;box-shadow:0 0 16px rgba(143,191,127,.9);font-size:24px;font-weight:800;
  color:#FFF9EE;font-variant-numeric:tabular-nums;line-height:1.15}
#reveal i{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:9px solid #8FBF7F}

/* ---------- 输入卡：我猜 ?（当前拼数大字）+ 宝箱 + 已猜次数 ---------- */
#input-card{display:flex;align-items:center;justify-content:center;gap:16px;min-height:88px;
  padding:6px 26px;border-radius:22px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #D8C9B4;transition:transform .15s}
#input-card .lb{font-size:19px;font-weight:800;color:#8A7B6C}
#in-val{min-width:86px;text-align:center;font-size:52px;font-weight:800;color:#4A3B2E;
  line-height:1;font-variant-numeric:tabular-nums}
#in-val.empty{color:#C9B896}
#input-card.nudge{animation:in-nudge .4s ease}
@keyframes in-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}
  55%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
#chest{flex:0 0 auto;transition:transform .2s}
#chest.open{animation:chest-pop .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes chest-pop{0%{transform:scale(.6) rotate(-10deg)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
#gcount{display:flex;align-items:baseline;gap:5px;padding:4px 14px;border-radius:13px;
  background:#F6ECD9;border:2px solid #E2D6C0;font-size:15px;font-weight:700;color:#8A7B6C}
#gcount b{font-size:24px;font-weight:800;color:#E8873A;font-variant-numeric:tabular-nums;line-height:1}

/* ---------- 数字键盘：3×4 网格（1-9 + 空|0|空）+ 删除；键径 --key 由 layout() 实测，下限 64 ---------- */
#keys-wrap{flex:0 0 auto;display:flex;flex-direction:column;gap:13px}
#keys{display:grid;grid-template-columns:repeat(3,var(--key,88px));grid-auto-rows:var(--key,88px);
  gap:13px}
#keys.shake{animation:keys-shake .45s ease}
@keyframes keys-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.key{width:var(--key,88px);height:var(--key,88px);border-radius:20px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;font-size:calc(var(--key,88px) * .46);font-weight:800;color:#4A3B2E;
  font-variant-numeric:tabular-nums;transition:transform .12s,box-shadow .12s}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.key svg{width:58%;height:58%}
/* 吞输入期轻反馈（§0.22）：被吞键黄圈轻闪一拍 */
.key.nudge{animation:key-nudge .34s ease}
@keyframes key-nudge{0%{outline:7px solid #F5C445;outline-offset:0}
  100%{outline:7px solid transparent;outline-offset:10px}}
.keysp{width:var(--key,88px);height:var(--key,88px)}   /* 占位（非按钮，不参与触摸审计） */
/* 确认=主答案按钮（§0.9 ≥96）：键盘全宽大条 */
#ok-btn{min-height:96px;border-radius:24px;background:#E8975A;border:3px solid #4A3B2E;
  box-shadow:0 6px 0 #C77A42;color:#FFF9EE;font-size:30px;font-weight:800;letter-spacing:.1em;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s,box-shadow .15s}
#ok-btn svg{width:36px;height:36px}
#ok-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C77A42}
#ok-btn.nudge{animation:in-nudge .4s ease}
#ok-btn.breathe{animation:ok-breathe 1.6s ease-in-out infinite}
@keyframes ok-breathe{0%,100%{transform:scale(1);box-shadow:0 6px 0 #C77A42}
  50%{transform:scale(1.04);box-shadow:0 6px 0 #C77A42,0 0 18px rgba(232,151,90,.9)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}
</style>
</head>
<body>
<div id="game" aria-label="数字侦探">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="tip" aria-live="polite"><span id="tip-text">神秘数藏在 </span></div>
    <div id="table">
      <div id="left" aria-label="数轴">
        <div id="axis-card">
          <div id="range-chip" role="status" aria-label="剩余范围"><span>还剩</span><b id="r-lo">1</b><span>到</span><b id="r-hi">20</b></div>
          <div id="axis">
            <div class="seg" id="seg-l"></div>
            <div class="seg" id="seg-m"></div>
            <div class="seg" id="seg-r"></div>
            <span id="pin"><b></b><i></i></span>
            <span id="mid-dot"></span>
            <span id="reveal"><b></b><i></i></span>
          </div>
        </div>
        <div id="input-card" aria-label="我的猜测">
          <span class="lb">我猜</span>
          <b id="in-val" class="empty">?</b>
          <span id="chest" aria-hidden="true"></span>
          <span id="gcount">已猜<b id="gcount-n">0</b>次</span>
        </div>
      </div>
      <div id="keys-wrap" aria-label="数字键盘">
        <div id="keys"></div>
        <button id="ok-btn" aria-label="确认猜测"><span>确认</span></button>
      </div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="侦探兔"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

/* ================= numberdet 纯引擎：确定性关卡生成 + 猜数二分判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   章难度（SPEC-BATCH14 §3）：
     dch1 1-20 base=5 / dch2 1-30 base=5 / dch3 1-50 base=6 / dch4 1-99 base=7
   base 口径：SPEC §3 表值 {20:5, 30:5, 50:6, 99:7}——恰为恒猜中点二分的最坏步数
     worst(N) = ceil(log2(N+1))（20→5 / 30→5 / 50→6 / 99：log2(100)=6.64→7，四值全对账）；
     SPEC 括注"ceil(log2(N))+1"按字面给 6/6/7/8 与表值不符——表值为准（SPEC 内部冲突取具体定稿值），
     且字面式恒 ≥ 表值，"二分 ≤base"断言在两种读法下均成立（verify 独立复算双证）。
   secret ∈ [1,N] 确定性随机；同关 5 题互异（优先未用值，60 次重试后线性兜底）
   判定（engOK）：每猜必有信息反馈，无 wrong 路径（§0.24 显式豁免）：
     'big' 猜大（区间 hi 收紧到 g-1）/ 'small' 猜小（lo 收紧到 g+1）/
     'got' 猜中推进（非末题）/ 'done' 猜中且末题（通关）/
     'gone' 范围外（<1 或 >N）或已排除数（<lo 或 >hi）——不计猜测次数（无害探索 §0.7a）/
     'empty' 未输入就确认（不计次数）/ null 关已结束或非法
   星级=超基准口径（SPEC §3）：每题超次 miss = max(0, guesses-base)（≥0，实时维护）；
     关星=Σ各题超次：0=3★ / 1-2=2★ / 更多=1★（二分策略好=满星——星级本身教二分；永不 0 星 §0.14）
   L.retries 仅为合法猜测总次数统计（不进星级，防与 miss 语义混淆） */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增；难度章号：静态关 (ch-1)%4+1 循环，生成关随机 1-4（§0.3） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 章参数：范围 N 与基准 base（SPEC §3 定稿表） ---------- */
const RANGE_N = { 1: 20, 2: 30, 3: 50, 4: 99 };
const BASE_N = { 20: 5, 30: 5, 50: 6, 99: 7 };
const baseOf = N => BASE_N[N];

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // §0.3 batch11 M1 定版
  const N = RANGE_N[dch];
  const used = [], quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) {
    let s = ri(rnd, 1, N), tries = 0;             // 同关 5 题互异：优先抽未用值
    while (used.indexOf(s) >= 0 && tries++ < 60) s = ri(rnd, 1, N);
    if (used.indexOf(s) >= 0) {                   // 兜底：线性找首个未用值（确定性成立）
      for (let v = 1; v <= N; v++) if (used.indexOf(v) < 0) { s = v; break; }
    }
    used.push(s);
    quizzes.push({ kind: 'hunt', N: N, secret: s, base: baseOf(N),
      lo: 1, hi: N, guesses: 0, miss: 0, input: null, solved: false });
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv,
    quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 键入引擎：engKey(L, d) —— 数字键 0-9
   返回新拼数（number）；满 2 位/非法数字/关末 → null（不变）
   输入 ≤2 位（ch1-4 全 2 位封顶：99 为最大 N）；首位 0 再按 d → 归并为 d（标准键盘行为） ---------- */
function engKey(L, d) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (q.kind !== 'hunt' || q.solved) return null;
  if (!Number.isInteger(d) || d < 0 || d > 9) return null;
  if (q.input == null) { q.input = d; return d; }
  if (q.input >= 10) return null;                 // 已 2 位，满
  q.input = q.input === 0 ? d : q.input * 10 + d; // 前导 0 归并
  return q.input;
}

/* ---------- 删除引擎：engDel(L)
   有输入 → 退一位，返回新拼数（number 或 null=已清空）；无输入 → false（无变化） ---------- */
function engDel(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return false;
  const q = L.quizzes[L.step];
  if (q.kind !== 'hunt' || q.solved) return false;
  if (q.input == null) return false;
  q.input = q.input >= 10 ? Math.floor(q.input / 10) : null;
  return q.input;
}

/* ---------- 确认引擎：engOK(L) —— 主判定（§3 玩法）
   'big'/'small' 信息反馈（区间收紧，计一次猜测）/'got'/'done' 猜中（计一次猜测并推进）/
   'gone' 范围外或已排除（不计猜测次数，无害探索）/'empty' 空输入（不计）/
   null 关已结束。合法猜测（big/small/got/done）才 guesses++ 并实时维护 miss=max(0,guesses-base) ---------- */
function engOK(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (q.kind !== 'hunt' || q.solved) return null;
  if (q.input == null) return 'empty';
  const g = q.input;
  if (g < 1 || g > q.N || g < q.lo || g > q.hi) {
    q.input = null;                               // 拒绝后拼数清空（状态机干净：抖动后从 ? 重拼）
    return 'gone';                                // 范围外/已排除：不计数
  }
  q.input = null;                                 // 合法确认即消耗拼数
  q.guesses++;
  q.miss = Math.max(0, q.guesses - q.base);        // 当前题超次（实时，钩子可观测）
  L.retries++;                                    // 合法猜测总次数（统计，不进星级）
  if (g === q.secret) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'got';
  }
  if (g < q.secret) { q.lo = Math.max(q.lo, g + 1); return 'small'; }
  q.hi = Math.min(q.hi, g - 1);
  return 'big';
}

/* ---------- 剩余区间中点（救援视觉/教学"帮"/autoSolve 二分共用；恒猜中点口径一致） ---------- */
const engMid = q => Math.floor((q.lo + q.hi) / 2);

/* ---------- 星级：超基准口径（SPEC §3）——Σ各题超次 0=3★ / 1-2=2★ / 更多=1★（永不 0 星） ---------- */
const engStars = L => {
  const over = L.quizzes.reduce((s, q) => s + q.miss, 0);
  return over === 0 ? 3 : (over <= 2 ? 2 : 1);
};

/* ---------- 结构校验（verify 用）：初始态值域/base/secret 域 ---------- */
function structOk(q) {
  if (!q || q.kind !== 'hunt') return false;
  if (q.secret < 1 || q.secret > q.N) return false;
  if (q.base !== baseOf(q.N)) return false;
  if (q.lo !== 1 || q.hi !== q.N) return false;
  if (q.guesses !== 0 || q.miss !== 0 || q.input !== null || q.solved) return false;
  return true;
}
/* ================= numberdet 主逻辑（数轴渲染 / 数字键盘 / 猜测判定演出 / 教学 / 救援 / 推进）

/* 桌面布局（数轴区‖键盘）：按舞台实测切换横/竖排；
   键径 clamp[64,104]；确认键独立于网格=键盘全宽大条（min-height 96，§0.9 主答案） */
function layout() {
  const availW = stageEl.clientWidth - 16;

  const colMode = availH >= 640 && availW < availH * 1.15;   // 高屏窄持=竖排；否则横排
  tableEl.classList.toggle('col', colMode);
  const gap = 13;
  let kw, kh;
  if (colMode) {
    kw = Math.min(availW, 470);
    kh = availH - 330;                           // 竖排：数轴卡+输入卡占上方 ~330
  } else {
    kw = Math.min(availW * 0.4, 410);

  const key = Math.max(64, Math.min(Math.floor((kw - 2 * gap) / 3),
    Math.floor((kh - 4 * gap - 96 - gap) / 4), 104));
  document.documentElement.style.setProperty('--key', key + 'px');
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */

  /* 章末预告=刚打完章的下一章（ci<4）；生成关用 GEN 文案（不带"明天："前缀，core 模板自带） */

/* ================= 教学（仅关 1-0 首次）：看→帮→独（save.numberdet.tutSeen）

   前两步走 demo 通道（locked 吞真实输入），末步临时解锁走真实路径演完整猜中演出
   （返回值存 window.__ndDemoR，verify 断言真实生效 §0.27）→ 立即重发同关（确定性，题面一致）
   → 帮=幽灵手指按中点数字；独=首次猜中放手 */
function demoPlan(q) {                           // 演示三步（自适应 secret 边界，禁重猜已排除数）
  const s = q.secret, N = q.N, plan = [];
  if (s < N) plan.push(Math.min(N, s + 3));      // 第一步：偏大 → '太大啦'
  if (s > 1) plan.push(Math.max(1, s - 2));      // 第二步：偏小 → '太小啦'
  let d = 3;
  while (plan.length < 2) {                      // 边界（s=1 无更小 / s=N 无更大）：补同向一步
    if (s === 1) plan.push(Math.min(N, d));
    else if (s === N) plan.push(N - 1);          /* 审查 m3：N-2 small 后 lo=N-1，补 N-1 恒在剩余区间（原 s-d=N-3 已被排除，禁演示 gone） */
    else plan.push(Math.max(1, s - d));

}

  get rescues() { return rescueCount; }
};

   ①b 引擎直驱：空输入 'empty' 不计数 → 范围外/已排除 'gone' 不计次（guesses/miss 零增量）→

   ③ 教学链（verify 直驱 tutorialWatch）：watch clip → 三步演示（大→小→中）→ __ndDemoR==='got'

      Math.ceil(Math.log2(n)) + 1 >= REF_BASE[n] &&                  /* SPEC 括注字面式恒≥表值 */
      refWorst(n) === REF_BASE[n];                                   /* =恒中点二分最坏步数 */
  });
  /* 引擎驱动小助手：恒中点二分打完一题 / lo 策略（每猜当前 lo，guesses=secret） */
  function driveBisectQuiz(L, q) {
    let g = 0;
    while (!q.solved && g++ < 30) {
      const mid = engMid(q);
      String(mid).split('').forEach(ch => engKey(L, Number(ch)));
      const r = engOK(L);
      if (r !== 'big' && r !== 'small' && r !== 'got' && r !== 'done') return false;
    }
    return q.solved;
  }
  function driveLoQuiz(L, q) {
    let g = 0;
    while (!q.solved && g++ < 120) {
      const v = q.lo;
      String(v).split('').forEach(ch => engKey(L, Number(ch)));
      engOK(L);
    }
    return q.solved;
  }

  /* ---- ① 40 关全量审计 + ①b 引擎直驱 + ①c 星级口径（flat 0-39） ---- */
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1) === JSON.stringify(L2);
    const chOk = L1.ch === Math.floor(flat / CH_LEN) + 1;
    const dchOk = flat < STATIC_LEVELS ? L1.dch === diffOfCh(L1.ch) : (L1.dch >= 1 && L1.dch <= 4);
    if (flat >= STATIC_LEVELS) genDch[L1.dch]++;
    const wantN = REF_RANGE[L1.dch];
    let rangeAll = true, uniqOk = true, baseAll = true, structAll = true;
    const secrets = [];
    L1.quizzes.forEach(q => {
      if (q.kind !== 'hunt') rangeAll = false;
      if (q.N !== wantN) rangeAll = false;                         // 范围按难度章
      if (q.secret < 1 || q.secret > q.N) rangeAll = false;        // secret 域
      if (q.base !== REF_BASE[q.N] || !formulaOk) baseAll = false; // base 表值+公式独立复算
      if (!structOk(q)) structAll = false;
      secrets.push(q.secret);
    });
    if (secrets.filter((v, i, a) => a.indexOf(v) === i).length !== CH_LEN) uniqOk = false;  // 同关互异
    /* ①b 引擎直驱：empty/gone 不计数 → 二分逐猜（收紧对账+计数+miss 实时+≤base） */
    const Ld = genLevel(flat);
    let driveOk = true, bisectMax = 0;
    for (let k = 0; k < Ld.quizzes.length && driveOk; k++) {
      const q = Ld.quizzes[k];
      if (engOK(Ld) !== 'empty' || q.guesses !== 0 || q.miss !== 0) { driveOk = false; break; }   // 空输入
      const goneV = q.N < 99 ? 99 : 0;                             // 范围外（N=99 用 0<1）
      String(goneV).split('').forEach(ch => engKey(Ld, Number(ch)));
      if (engOK(Ld) !== 'gone' || q.guesses !== 0 || q.miss !== 0) { driveOk = false; break; }    // 不计次
      if (q.input !== null) { driveOk = false; break; }            // gone 后拼数已清
      if (engDel(Ld) !== false && q.input !== null) { driveOk = false; break; }                   // 空删除=false
      while (!q.solved && driveOk) {
        const lo0 = q.lo, hi0 = q.hi, mid = engMid(q);
        String(mid).split('').forEach(ch => engKey(Ld, Number(ch)));
        const r = engOK(Ld);
        if (r === 'small') {
          if (q.lo !== Math.max(lo0, mid + 1) || q.hi !== hi0) { driveOk = false; break; }        // 收紧对账
        } else if (r === 'big') {
          if (q.hi !== Math.min(hi0, mid - 1) || q.lo !== lo0) { driveOk = false; break; }
        } else if (r !== 'got' && r !== 'done') { driveOk = false; break; }
        if (q.guesses > q.base) { driveOk = false; break; }         // 二分 ≤base 断言（逐猜）

      if (driveOk) bisectMax = Math.max(bisectMax, q.guesses);

    const formulaStar = L1x.done && engStars(L1x) === tierOf(sumL);
    /* 2★/1★ 构造实证（聚合）：Σ超次 ∈[1,2] / ≥3 的关 */

    if (idx2 >= 0) {

      const Lq = genLevel(flat);
      Lq.quizzes.forEach((q, k) => { if (k === idx2) driveLoQuiz(Lq, q); else driveBisectQuiz(Lq, q); });
      const sq = Lq.quizzes.reduce((s, q) => s + q.miss, 0);

  const qual2Ok = qual2Total >= 6 && qual2Pass === qual2Total;      // 2★ 实证关（聚合门槛）
  const qual1Ok = qual1Total >= 10 && qual1Pass === qual1Total;     // 1★ 实证关（聚合门槛）

  /* ---- ② tapKey/tapDel/tapOK 单元（flat0 真实 UI 状态机） ---- */
  total++;
  startLevel(0);
  const q0 = ND.quiz;
  const N0 = q0.N, s0 = q0.secret;
  const keyOk1 = await ND.tapKey(5) === 5 && inVal.textContent === '5' && ND.quiz.input === 5;
  const keyOk2 = await ND.tapKey(2) === 52 && inVal.textContent === '52';
  const keyFull = await ND.tapKey(9) === false;                    // 已 2 位，满
  const del1 = await ND.tapDel() === 5 && inVal.textContent === '5';
  const del2 = await ND.tapDel() === null && inVal.textContent === '?' && inVal.classList.contains('empty');

  let missLive = false;

    if (!ql || ql.step !== 0) { missLive = true; break; }          // lo 烧穿=猜中推进（兜底真值）

  }
  missOk = missLive && ND.quiz.miss === Math.max(0, ND.quiz.guesses - ND.quiz.base);  // miss 不变量

  if (unitOk) npass++;

    rangeText: textOk, missLive: missOk, goneAnim: getComputedStyle(keysEl).animationName };

  /* ---- ②b 救援与 §0.7a 口径（救援钟只被合法猜测/读题重置；lastAct 同作用域直读直写，

  /* 14s 救援行为本体（verify 页 interval 被 VERIFY 门关（家族口径），行为函数直驱断言；

  const tutOk = pLog7.indexOf('num_tut_watch') >= 0 &&                  /* 看=演示配 watch clip */
    window.__ndDemoR === 'got' &&                                      /* §0.27 演示猜中真实生效 */
    state.tut === 'help' && !state.demo && !state.locked &&            /* 帮：解锁等孩子动手 */
    ND.currentLevel && ND.currentLevel.flat === 0 &&                    /* 重发同关 */

    demoR: window.__ndDemoR, sawBig: pLog7.indexOf('num_big') >= 0,
    sawSmall: pLog7.indexOf('num_small') >= 0, handoff: lastQ7, tut: state.tut };

  total++;

  /* ---- ⑤ 分布与专项：文案对账 / clip 注入 / 开场链 / 题面三段拼接 / numCn ---- */
  total++;
  /* SPEC §3 定稿文案独立字面量（manifest 一致，禁改） */
  const refVoice = VOICE.watch.text === '看！猜一猜神秘数' &&
    VOICE.turn.text === '你来当侦探' && VOICE.hint.text === '试一试中间的数' &&
    VOICE.q1.text === '神秘数藏在1到' && VOICE.q2.text === '之间' &&   /* 审查 m5 文案同步 */
    VOICE.big.text === '太大啦' && VOICE.small.text === '太小啦' &&
    VOICE.got.text === '猜中啦' && VOICE.gone.text === '这个数已经排除啦';
  const numCnOk = numCn(10) === '十' && numCn(20) === '二十' && numCn(30) === '三十' &&
    numCn(50) === '五十' && numCn(99) === '九十九';
  /* num_* 全部 14 条 clips 注入对账（build 注入后 KIDS.voice.clips 应含全部） */
  const NUM_KEYS = ['num_tut_watch', 'num_tut_turn', 'num_hint', 'num_q1', 'num_q2',
    'num_big', 'num_small', 'num_got', 'num_gone',
    'num_n_10', 'num_n_20', 'num_n_30', 'num_n_50', 'num_n_99'];
  const clipOk = NUM_KEYS.every(k => !!KIDS.voice.clips[k]) &&
    Object.keys(KIDS.voice.clips).every(k => k.indexOf('num_') !== 0 || NUM_KEYS.indexOf(k) >= 0);
  /* 开场顺序链（stub 记录）：queue([num_hint, num_q1, num_n_N, num_q2]) 单通道不叠音 */
  const origQ = KIDS.voice.queue, origP = KIDS.voice.play, origS = KIDS.voice.say;
  const qLog = [], playLog = [], sayLog = [];
  KIDS.voice.queue = function (parts) { qLog.push(parts.slice()); };
  KIDS.voice.play = function (key) { playLog.push(String(key)); };
  KIDS.voice.say = function (t) { sayLog.push(String(t)); };
  startLevel(0);                                   // verify 页恒走开场链
  const lastQ = qLog[qLog.length - 1];
  const q0v = genLevel(0).quizzes[0];
  const openChain = qLog.length >= 1 && lastQ.length === 4 && lastQ[0] === 'num_hint' &&
    lastQ[1].key === 'num_q1' && lastQ[2].key === 'num_n_' + q0v.N && lastQ[3].key === 'num_q2';
  /* 题面三段拼接：ch1 N=20 与 ch4 N=99（num_n_99'九十九'）全 clip 在场 */
  const parts0 = quizParts(q0v);
  const q15v = genLevel(15).quizzes[0];
  const parts15 = quizParts(q15v);
  const partsOk = parts0.length === 3 && parts0[0].key === 'num_q1' &&
    parts0[1].key === 'num_n_20' && parts0[2].key === 'num_q2' &&
    parts15.length === 3 && parts15[1].key === 'num_n_99' &&
    parts0.concat(parts15).every(p => !!KIDS.voice.clips[p.key]);
  /* 救援/重听拼句（题面 3 段，clip 在场走 queue） */
  speakQuiz(q0v);                                 // 救援/重听拼句（sayQ 全 clip 态走 queue，段=key 串）
  const lastQ2 = qLog[qLog.length - 1];
  const rescueChain = qLog.length >= 2 && lastQ2 !== lastQ && lastQ2.length === 3 &&
    lastQ2[0] === 'num_q1' && lastQ2[1] === 'num_n_20' && lastQ2[2] === 'num_q2';
  KIDS.voice.queue = origQ; KIDS.voice.play = origP; KIDS.voice.say = origS;
  const distOk = refVoice && numCnOk && clipOk && openChain && partsOk && rescueChain &&
    formulaOk && qual2Ok && qual1Ok && genDch[1] >= 1 && genDch[2] >= 1 &&
    genDch[3] >= 1 && genDch[4] >= 1;
  if (distOk) npass++;
  units.dist = { ok: distOk, refVoice: refVoice, numCn: numCnOk, clips: clipOk,
    openChain: openChain, partsOk: partsOk, rescueChain: rescueChain, formula: formulaOk,
    qual2: { total: qual2Total, pass: qual2Pass }, qual1: { total: qual1Total, pass: qual1Pass },
    genDch: genDch };

  /* ---- ⑥ UI 冒烟 A：flat0 真实键盘路径通关（范围外轻抖+猜大+猜小+猜中三态全走过） ---- */
  total++;
  startLevel(0);
  const saw = { big: 0, small: 0, got: 0, gone: 0 };
  let smokeA = true, quizzesA = 0, lastR = null;
  const typeGuess = async v => {                   // 真实钩子路径拼数（tapKey/tapDel/tapOK）
    while (ND.quiz && ND.quiz.input != null) ND.tapDel();
    String(v).split('').forEach(ch => ND.tapKey(Number(ch)));
    return ND.tapOK();
  };
  for (let s = 0; s < CH_LEN && smokeA; s++) {
    const q = ND.quiz;
    if (!q) { smokeA = false; break; }
    if (s === 0) {                                 // 一次范围外（99>N）：键盘轻抖不计数
      const rg = await typeGuess(99);
      saw.gone += rg === 'gone' ? 1 : 0;
      if (rg !== 'gone' || ND.quiz.guesses !== 0) smokeA = false;
    }
    const qq = ND.quiz;
    if (!saw.big && qq.secret < qq.hi) {           // 猜大：N 位（secret<N 必 big）
      const rb = await typeGuess(qq.hi);
      saw.big += rb === 'big' ? 1 : 0;
      if (rb !== 'big' && rb !== 'got') { smokeA = false; break; }
      if (rb === 'got') saw.got++;
    }
    const q2 = ND.quiz;
    if (q2 && !saw.small && q2.secret > q2.lo) {   // 猜小：lo 位（secret>lo 必 small）
      const rs2 = await typeGuess(q2.lo);
      saw.small += rs2 === 'small' ? 1 : 0;
      if (rs2 !== 'small' && rs2 !== 'got') { smokeA = false; break; }
      if (rs2 === 'got') saw.got++;
    }
    const q3 = ND.quiz;                            // 恒中点二分收尾
    let g = 0;
    while (ND.quiz && ND.quiz.step === s && g++ < 20) {
      const q4 = ND.quiz;
      lastR = await typeGuess(engMid({ lo: q4.lo, hi: q4.hi }));
      if (lastR !== 'big' && lastR !== 'small' && lastR !== 'got' && lastR !== 'done') { smokeA = false; break; }
      if (lastR === 'got' || lastR === 'done') saw.got++;
    }
    if (ND.quiz && ND.quiz.step === s) smokeA = false;
    quizzesA++;
  }
  const lvA = ND.currentLevel;
  const smokeOkA = smokeA && saw.gone >= 1 && saw.big >= 1 && saw.small >= 1 && saw.got >= 1 &&
    quizzesA === CH_LEN && lvA.done && lvA.won && lastR === 'done' &&
    !document.querySelector('.k-celebrate');       // verify 页不弹层
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, saw: saw, quizzes: quizzesA, stars: engStars(cur) };

  /* ---- ⑦ UI 冒烟 B：flat5/10/15（ch2/ch3/ch4）autoSolve 恒中点通关 3★ 且逐题 ≤base ---- */
  total++;
  const chapSpec = { 5: { N: 30, base: 5 }, 10: { N: 50, base: 6 }, 15: { N: 99, base: 7 } };
  const chapOut = {};
  let smokeB = true;
  for (const f of [5, 10, 15]) {
    startLevel(f);
    const qf = ND.quiz;
    const domOk = qf && qf.N === chapSpec[f].N && qf.base === chapSpec[f].base &&
      rHi.textContent === String(qf.N) && rLo.textContent === '1';
    const a = await ND.autoSolve();
    const lv = ND.currentLevel;
    const solveOk = a.done && lv.done && lv.won && engStars(cur) === 3 &&
      a.perQuiz.length === CH_LEN && a.perQuiz.every(g => g <= chapSpec[f].base);
    chapOut[f] = { ok: domOk && solveOk, N: qf.N, perQuiz: a.perQuiz, stars: engStars(cur) };
    if (!domOk || !solveOk) smokeB = false;
  }
  if (smokeB) npass++;
  smokes.chapters = { ok: smokeB, flats: chapOut };

  /* ---- ⑧ 布局：双 viewport ×（flat0/5/10/15）量测（等入场动画结束 §0.11） ---- */
  async function simView(w, h, flat) {
    startLevel(flat);
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    layout();
    await wait(680);                               // 入场/段动画结束再量（真实 ms，不吃 SPEED）
    const de = document.documentElement;
    const keys = Array.prototype.slice.call(keysEl.querySelectorAll('.key'));
    const keyOk = keys.length === 11 &&
      keys.every(b => { const r = b.getBoundingClientRect(); return r.width >= 64 && r.height >= 64; });
    const or = okBtn.getBoundingClientRect();
    const okOk = or.width >= 96 && or.height >= 96;
    let btnOk = true;                              // 全部按钮 ≥64（.k-parentbtn 家长按钮豁免）
    document.querySelectorAll('button').forEach(b => {
      if (b.classList.contains('k-parentbtn')) return;
      const r = b.getBoundingClientRect();
      if (r.width > 4 && r.height > 4 && (r.width < 64 || r.height < 64)) btnOk = false;
    });
    const q = cur.quizzes[cur.step];
    const chipOk = rangeChip.getBoundingClientRect().height > 0 &&                 // 剩余区间 chip 可见
      rLo.textContent === String(q.lo) && rHi.textContent === String(q.hi) &&     // 文字=引擎 lo/hi
      parseFloat(segM.style.width) > 0;                                           // 剩余段亮且宽>0
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, flat: flat, keyOk: keyOk, okOk: okOk, btnOk: btnOk,
      chipOk: chipOk, ox: ox, pass: keyOk && okOk && btnOk && chipOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const f of [0, 5, 10, 15]) {
    sims.push(await simView(1280, 800, f));
    sims.push(await simView(800, 1180, f));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                   // 还原真实 viewport 布局
  const layoutOk = sims.length === 8 && sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  const out = { game: 'numberdet', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
