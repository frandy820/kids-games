<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乘法对战</title>
<style>
/* ================= 乘法对战 multibattle（batch14）=================
   视觉按 SPEC-BATCH14 §2：暖米底 #FBF3E4、小兔子 IP 赛跑对抗
   顶部赛道横条：孩子白兔（下泳道）vs 对手灰兔（上泳道）同起点，答对进 1 格；
   对手答题钟进度条渐满（ch1 8000ms → ch4 5000ms 真实时长）；
   算式题面大字 + 3 选 1 大数字答案卡（≥96）；答错晃动零惩罚不灰化（钟不停）；
   触摸目标：答案卡 ≥96、底栏按钮 ≥72 高；pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:4px 10px}

/* ---------- 赛道区：两条泳道 + 终点旗 ---------- */
#track{flex:0 0 auto;width:100%;max-width:1080px;position:relative;padding:2px 40px 2px 6px}
.lane{position:relative;height:56px;border-radius:28px;margin-bottom:8px;
  border:2.5px solid #D9C5A6;overflow:hidden}
.lane-mine{background:#EAF4E4;border-color:#A8C79B}
.lane-foe{background:#EFEAE0;border-color:#C9BFA9}
/* 格点刻度：5 格均分竖线（终点线加粗） */
.lane .tick{position:absolute;top:6px;bottom:6px;width:0;border-left:2px dashed rgba(74,59,46,.14)}
.lane .tick:last-of-type{border-left:3px solid rgba(74,59,46,.28)}
/* 选手：外层 .pos 定位（left% 过渡），内层 .bun 兔子（hop 动画独立 transform） */
.pos{position:absolute;top:50%;left:4%;transform:translate(-50%,-50%);
  transition:left .65s cubic-bezier(.3,1.25,.4,1);z-index:2}
.bun{display:flex;flex-direction:column;align-items:center;pointer-events:none}
.bun svg{width:46px;height:46px;filter:drop-shadow(0 2px 0 rgba(74,59,46,.15))}
.bun .tag{margin-top:-6px;padding:1px 10px;border-radius:10px;background:#FFFAF0;
  border:2px solid #4A3B2E;font-size:13px;font-weight:800;line-height:1.4;white-space:nowrap}
.pos.hop .bun{animation:bun-hop .5s ease}
@keyframes bun-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-13px) scale(1.06)}}
/* 计分角标（泳道左端内嵌） */
.lane .score{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:3;
  display:flex;align-items:center;gap:3px;font-size:16px;font-weight:800;color:#8A7B6C;
  background:rgba(255,250,240,.85);border-radius:12px;padding:2px 10px;line-height:1.3}
.lane .score b{font-size:20px;color:#4A3B2E;font-variant-numeric:tabular-nums}
/* 终点旗：赛道右缘中垂（两泳道共用） */
#flagpole{position:absolute;right:2px;top:50%;transform:translateY(-50%);z-index:3}

/* ---------- 对手答题钟（进度条渐满；走完=对手进格） ---------- */
#foe-clock{flex:0 0 auto;width:100%;max-width:1080px;display:flex;align-items:center;gap:10px;
  padding:4px 12px;border-radius:18px;background:#F6ECD9;border:2.5px dashed #D9C5A6}
#foe-clock .face{flex:0 0 30px;width:30px;height:30px}
#foe-clock .fc-bar{flex:1 1 auto;height:18px;border-radius:9px;background:#FFFAF0;
  border:2px solid #C9BFA9;overflow:hidden;position:relative}
#fc-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:7px;
  background:repeating-linear-gradient(45deg,#8FA2B5 0 10px,#A9B8C6 10px 20px);
  transition:width .1s linear}
#foe-clock.full #fc-fill{background:#D98A8A}
#foe-clock .fc-txt{flex:0 0 auto;font-size:15px;font-weight:700;color:#8A7B6C;white-space:nowrap}

/* ---------- 题面：乘法算式大字 ---------- */
#board{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:78px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 34px;
  border-radius:22px;background:#FFFAF0;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #DFCFB6}
#expr{display:flex;align-items:baseline;gap:9px;white-space:nowrap;
  font-variant-numeric:tabular-nums;font-weight:800}
#expr b{font-size:50px;line-height:1;color:#4A3B2E}
#expr i{font-style:normal;font-size:34px;color:#E8873A}
#expr em{font-style:normal;font-size:34px;color:#8A7B6C}
#ex-q{font-size:50px;line-height:1;color:#E8873A;min-width:1.2em;text-align:center}
#ex-q.ok{color:#5E9455}
#prompt-chip .vs{font-size:17px;font-weight:800;color:#8A7B6C;margin-left:6px;white-space:nowrap}

/* ---------- 底部答案区：3 张大数字答案卡 ---------- */
#answers{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:20px;
  flex-wrap:wrap;min-height:118px;padding:2px 12px}
.opt{min-width:136px;min-height:100px;padding:0 30px;border-radius:26px;background:#FFFAF0;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #DFCFB6;font-size:46px;font-weight:800;color:#4A3B2E;
  font-variant-numeric:tabular-nums;transition:transform .15s,box-shadow .15s;position:relative;
  animation:opt-in .38s cubic-bezier(.2,1.5,.4,1) both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}
@keyframes opt-in{from{transform:scale(0) rotate(-8deg)}to{transform:scale(1) rotate(0)}}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #DFCFB6}
/* 不灰化款：错卡=晃动不灰掉可重点（SPEC §2） */
.opt.wrong{animation:opt-shake .42s ease}
@keyframes opt-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.opt.right{background:#8FBF7F;color:#4A3B2E;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.opt.right .mark{position:absolute;top:-13px;right:-13px;width:40px;height:40px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFFAF0;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.opt.right .mark svg{width:26px;height:26px}
@keyframes opt-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
/* 救援视觉：正确卡 breathe 持续循环（§0.21） */
.opt.breathe{animation:opt-breathe 1.6s ease-in-out infinite}
@keyframes opt-breathe{0%,100%{transform:scale(1);box-shadow:0 5px 0 #DFCFB6}
  50%{transform:scale(1.07);box-shadow:0 5px 0 #DFCFB6,0 0 16px rgba(232,151,90,.9)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop2 .45s ease 2}
@keyframes bun-hop2{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 money/times） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* ---------- 关末鼓励收尾层（<3 格；不锁关不惩罚，SPEC §2） ---------- */
.mb-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;background:rgba(251,243,228,.94);touch-action:none;opacity:0;
  transition:opacity .3s}
.mb-ov.show{opacity:1}
.mb-ov .mb-stars{display:flex;gap:8px;font-size:56px;line-height:1;color:#F5C445;
  text-shadow:0 3px 0 #D8862B}
.mb-ov .mb-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 26px}
.mb-ov .mb-sub{font-size:19px;color:#8A7B6C;text-align:center;padding:0 26px}
.mb-ov .mb-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;
  background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.mb-ov .mb-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：赛道/钟/算式/答案卡适配 */
@media (orientation:portrait){
  .lane{height:54px}
  .bun svg{width:44px;height:44px}
  #expr b{font-size:44px}
  #ex-q{font-size:44px}
  #prompt-chip{padding:8px 26px}
  .opt{min-width:150px;min-height:108px;font-size:52px}
  #btn-rabbit{width:84px;height:84px}
  #foe-clock .fc-txt{font-size:14px}
}
</style>
</head>
<body>
<div id="game" aria-label="乘法对战">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="track" aria-label="赛跑赛道">
      <div class="lane lane-foe">
        <span class="score">灰兔 <b id="foe-score">0</b></span>
        <div class="pos" id="foe-pos"><div class="bun" id="foe-bun"></div></div>
      </div>
      <div class="lane lane-mine">
        <span class="score">我 <b id="my-score">0</b></span>
        <div class="pos" id="my-pos"><div class="bun" id="my-bun"></div></div>
      </div>
      <div id="flagpole" aria-hidden="true"></div>
    </div>
    <div id="foe-clock" aria-label="兔子答题钟">
      <span class="face" aria-hidden="true"></span>
      <div class="fc-bar"><i id="fc-fill"></i></div>
      <span class="fc-txt">兔子正在算…</span>
    </div>
    <div id="board">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
    </div>
    <div id="answers" aria-label="作答区"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= multibattle 纯引擎：确定性关卡生成 + 抢答判定 + 对手得分（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   章难度（SPEC §2；无首题热身设计——每章题型单一，全关直入对抗）：
   dch1 {2,3}×{2..9} / dch2 {4,5}×{2..9} / dch3 {6,7}×{2..9}
   dch4 = 洗牌[2×m89({8,9}×) + 3×mix(2..9 混合复习)]（照 times 混合复习结构，无缺因数型）
   a≠b 允许（口诀含平方）；同关相邻题算式互异（(a,b) 有序对不同）
   干扰 = {ans±a, ans±b, a+b} 滤重/正值/非 ans 取 2（§0.17 近邻+运算混淆；池恒 ≥2：最差 a=b=2 时 {2,6}）
   miss 口径（家族统一=准确性）：答错 tapAnswer 计 miss/retries；
   对手超时 engFoe 只进 foeScore/step——不计 miss 不扣星（超时是慢不是错，零惩罚精神）
   星级：0 错=3★ / 1-2 错=2★ / 更多=1★（永不 0）；胜负=myScore≥3（速度口径，与星级分离，UI 层判） */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
const pick = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];
/* 进度章号单调递增；难度章号：静态关 (ch-1)%4+1 循环，生成关随机 1-4（§0.3） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 干扰候选池：{ans±a, ans±b, a+b}，滤 0 负/同答案/重复
   恒 ≥2 证明：ans-a=a(b-1)≥2>0 与 ans+a=a(b+1) 互异且 ≠ans（b≥2）；
   a=b 时两对退化相同，a+b≠ans（除 a=b=2 外）仍保证 ≥2；a=b=2 时池={2,6} 恰 2 ---------- */
function candPool(q) {
  const raw = [q.answer - q.a, q.answer + q.a, q.answer - q.b, q.answer + q.b, q.a + q.b];
  const uniq = [];
  raw.forEach(v => { if (v > 0 && v !== q.answer && uniq.indexOf(v) < 0) uniq.push(v); });
  return uniq;
}

/* ---------- 单题生成（rnd 同流确定性；kind='mul'章键因数/'m89'{8,9}/'mix'混合） ---------- */
function genOne(dch, kind, rnd) {
  let a, b;
  if (kind === 'm89') { a = rnd() < 0.5 ? 8 : 9; b = ri(rnd, 2, 9); }
  else if (kind === 'mix') { a = ri(rnd, 2, 9); b = ri(rnd, 2, 9); }
  else { const ks = KEYS[dch]; a = ks[ri(rnd, 0, ks.length - 1)]; b = ri(rnd, 2, 9); }
  /* q.src 字段记录来源型（'mul'章键因数/'m89'{8,9}/'mix'混合）——verify 形态审计用（不进钩子契约） */
  const q = { kind: 'mul', src: kind, a: a, b: b, answer: a * b, text: a + '×' + b, miss: 0, solved: false };
  const ds = shuffled(candPool(q), rnd).slice(0, 2);
  q.items = shuffled([q.answer, ds[0], ds[1]], rnd);
  q.answerIdx = q.items.indexOf(q.answer);
  return q;
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；相邻题算式互异重试 ≤60） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // §0.3 batch11 M1 定版
  const kinds = dch === 4
    ? shuffled(['m89', 'm89', 'mix', 'mix', 'mix'], rnd)
    : ['mul', 'mul', 'mul', 'mul', 'mul'];
  const quizzes = [];
  let prev = null;                                    // 上一题 (a,b)（相邻互异）
  for (let qi = 0; qi < CH_LEN; qi++) {
    let q = null;
    for (let t = 0; t < 60; t++) {                    // 重试至与上一题 (a,b) 对不同
      const c = genOne(dch, kinds[qi], rnd);
      if (!prev || c.a !== prev.a || c.b !== prev.b) { q = c; break; }
    }
    if (!q) q = genOne(dch, kinds[qi], rnd);          // 兜底（理论不可达：每题 ≥16 组合）
    prev = { a: q.a, b: q.b };
    quizzes.push(q);
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, quizzes: quizzes,
           step: 0, retries: 0, done: false, myScore: 0, foeScore: 0 };
}

/* ---------- 抢答引擎（无 DOM）：engPick(L, i) 孩子点第 i 张答案卡
   'right' 答对推进（myScore++）/ 'done' 答对且最后一题（通关）
   'wrong' 答错（miss/retries 计一次，零惩罚可重点）/ null 已结束或非法下标 ---------- */
function engPick(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (typeof i !== 'number' || Math.floor(i) !== i || i < 0 || i >= q.items.length) return null;
  if (i === q.answerIdx) {
    q.solved = true;
    L.myScore++;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  q.miss++;
  L.retries++;                                        // 不灰化款：同卡可重复点，每次计错
  return 'wrong';
}
/* ---------- 对手超时引擎：engFoe(L) —— 对手钟走完调用
   'foe' 对手进 1 格推进 / 'foedone' 最后一题对手得分（关终）
   不计 miss 不扣星（超时是慢不是错，SPEC §2 明示） ---------- */
function engFoe(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  q.solved = true;
  L.foeScore++;
  L.step++;
  if (L.step >= L.quizzes.length) L.done = true;
  return L.done ? 'foedone' : 'foe';
}
/* 星级：0 错=3★ / 1-2 错=2★ / 更多=1★（miss=retries 口径，家族统一；超时不进此口径） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：算式域 + 3 选 1 互异禁 0 负 + 干扰池复算 ---------- */
function structOk(q) {
  if (!q || q.kind !== 'mul') return false;
  if (!(q.a >= 2 && q.a <= 9 && q.b >= 2 && q.b <= 9)) return false;
  if (q.a * q.b !== q.answer) return false;
  if (!Array.isArray(q.items) || q.items.length !== 3) return false;
  if (q.answerIdx < 0 || q.answerIdx >= 3 || q.items[q.answerIdx] !== q.answer) return false;
  for (let i = 0; i < 3; i++) {
    if (q.items[i] <= 0) return false;                                     // 禁 0 负
    for (let j = i + 1; j < 3; j++) if (q.items[i] === q.items[j]) return false;  // 互异
  }
  const ds = q.items.filter((v, i) => i !== q.answerIdx);
  return ds.every(v => v !== q.answer && candPool(q).indexOf(v) >= 0);
}
/* ================= multibattle 主逻辑（赛道渲染 / 抢答判定 / 对手钟 / 教学 / 胜负收尾）
   玩法（SPEC-BATCH14 §2）：赛跑对抗。每题一道乘法算式 3 选 1 大数字卡 + 对手答题钟进度条：
   - 孩子先答对→己方进 1 格 + mul_win + 庆祝音（钟即停）
   - 答错→晃动零惩罚可重点（对手钟不停，§0.26 晃动窗防重入）
   - 钟走完→对手进 1 格 + mul_lose 播报，自动下一题（不计 miss 不扣星——超时是慢不是错）
   - 关末：孩子 ≥3 格=胜利庆祝；<3=鼓励收尾"就差一点点，再来一局"（不锁关不惩罚）
     星级=miss 口径（准确性）；胜负=速度，两者分离（SPEC 明示设计意图）
   对手钟真实时长 FOE_MS（verify 页统一乘 SPEED 提速）；教学 watch/demo 期钟冻结（help 起走）；
   对手钟与救援钟独立（超时换题不重置救援钟 lastAct）。
   验收钩子：window.MB = { get currentLevel, get quiz(){a,b,options,answerIdx,step,miss,
   myScore,foeScore,foeT}, tapAnswer(i), async autoSolve(), get tutorial, get rescues } */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速（钟同乘，对齐 wait() 口径）
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/进格播报/开场任务语音/教学不受 flat 门限制（§0.5；mul_win/mul_lose=核心反馈每题一次） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音：flat<3 每错必播；flat≥3 走 10s 节流；force 豁免恰一次——不灰化款 miss 无上限，
   必须 === 2（豁免只在每题 miss 首达 2 时发一次，防豁免变每错必播） */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.play(key, text); }
};
/* 题面=queue 拼接 clip（§0.23）：全部段 clip 在场走 queue，缺任一走整句 TTS 兜底 */
function sayQ(parts, fullText) {
  if (KIDS.voice.clips && parts.every(p => KIDS.voice.clips[p.key])) {
    KIDS.voice.queue(parts.map(p => p.key));
  } else {
    KIDS.voice.say(fullText);
  }
}

const stageEl = $id('stage'), chipEl = $id('prompt-chip'), answersEl = $id('answers'),
      trackEl = $id('track'), foeClockEl = $id('foe-clock'), fcFillEl = $id('fc-fill'),
      myPosEl = $id('my-pos'), foePosEl = $id('foe-pos'), myScoreEl = $id('my-score'),
      foeScoreEl = $id('foe-score'), ghostEl = $id('ghost'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();
let helpRedemo = false;
let lastTurnNudge = 0;                            // 帮期换题"你来抢答"重提节流（试玩 P2④）
let lastBlankHint = 0;                          // 点空白/探索区轻提示节流（§0.16，10s）
let rescueCount = 0;                            // 救援触发计数（MB.rescues）

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const optEl = i => answersEl.querySelector('.opt[data-i="' + i + '"]');

/* ================= 对手钟（世代计数防竞态；rAF 驱动进度条渐满）
   foeT=剩余比例 0-1（钩子可观测）；钟走完→onFoeTimeout（对手进格零惩罚）；
   教学 demo 期不启动（renderQuiz 门）；答对/换关/关末 stopFoe（foeT 回 1 待走） ================= */
let foeGen = 0, foeT = 1;
function setFoeBar(f) { fcFillEl.style.width = (f * 100) + '%'; }
function startFoe() {
  const gen = ++foeGen;
  const dur = Math.max(200, FOE_MS[cur.dch] * SPEED);   // verify 提速口径=base*SPEED
  const t0 = performance.now();
  const stepFn = () => {
    if (gen !== foeGen) return;                 // 已被 stop/重启：本代作废
    const el = performance.now() - t0;
    foeT = Math.max(0, 1 - el / dur);
    setFoeBar(1 - foeT);
    if (foeT <= 0) { onFoeTimeout(); return; }
    requestAnimationFrame(stepFn);
  };
  requestAnimationFrame(stepFn);
}
function stopFoe() { foeGen++; foeT = 1; setFoeBar(0); }
/* 钟走完：对手进 1 格 + mul_lose 播报 → 自动下一题（engFoe 不计 miss 不扣星，§2） */
async function onFoeTimeout() {
  const run = cur;                              // 身份守卫：演出窗口内重玩会重建 cur
  foeGen++;                                     // 自然到 0：本代终结（防重入）
  foeT = 0; setFoeBar(1);
  foeClockEl.classList.add('full');
  state.locked = true;                          // 吞演出窗点击（点击→pop 轻反馈 §0.22）
  const r = engFoe(cur);
  sfx('fail');
  sayR(VOICE.lose.key, VOICE.lose.text);
  renderTrack(false, true);
  renderStep();
  await wait(820 * SPEED);
  if (cur !== run) { state.locked = false; return; }
  state.locked = false;
  foeClockEl.classList.remove('full');
  if (r === 'foedone') winFlow();
  else {
    renderQuiz();
    if (state.tut === 'help') {                  // 帮期换题：手指重指新题正确卡
      pointHelpNext();
      /* 试玩 P2④：帮期孩子不接手→对手无限连胜无出口——换题重提"你来抢答"（10s 节流） */
      const now = Date.now();
      if (now - lastTurnNudge > 10000) { lastTurnNudge = now; sayR(VOICE.turn.key, VOICE.turn.text); }
    }
  }
}

function renderExpr(q) {
  chipEl.innerHTML = '<span id="expr" aria-label="' + q.a + '乘' + q.b + '等于多少">' +
    '<b>' + q.a + '</b><i>×</i><b>' + q.b + '</b><em>=</em><span id="ex-q">?</span></span>';
}
function renderAnswers(q) {
  answersEl.innerHTML = '';
  q.items.forEach((v, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.dataset.i = i;
    b.textContent = String(v);
    b.setAttribute('aria-label', '选 ' + v);
    answersEl.appendChild(b);

function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
/* 赛道：比分角标 + 兔子格位（进格方 hop；纯位置更新不 hop） */
function renderTrack(hopMine, hopFoe) {
  myScoreEl.textContent = cur.myScore;
  foeScoreEl.textContent = cur.foeScore;
  myPosEl.style.left = laneLeft(cur.myScore);
  foePosEl.style.left = laneLeft(cur.foeScore);
  if (hopMine) { myPosEl.classList.remove('hop'); void myPosEl.offsetWidth; myPosEl.classList.add('hop'); }
  if (hopFoe) { foePosEl.classList.remove('hop'); void foePosEl.offsetWidth; foePosEl.classList.add('hop'); }
}
function speakQuiz(q) { if (q) sayQ(quizParts(q), qSpeech(q)); }
/* 开场顺序链（§0.5/§0.6）：hint（或教学交接 turn clip）→ 题面 4 段，queue 单通道顺序播 */
function openingSpeak(turn) {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  KIDS.voice.queue([turn ? VOICE.turn.key : VOICE.hint.key].concat(quizParts(q)));
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderExpr(q);
  renderAnswers(q);
  renderStep();
  renderTrack();
  foeClockEl.classList.remove('full');
  foeT = 1; setFoeBar(0);
  if (!state.demo && !state.won && !cur.done) startFoe();   /* 教学 watch/demo 期钟不走（help 起走） */
  if (!VERIFY && !state.demo && !state.quiet) sayQ(quizParts(q), qSpeech(q));   /* 换题读题 sayR 级 */
}

/* ================= 抢答主路径（真实点击 / MB.tapAnswer / autoSolve / 教学演示共用） ================= */
async function uiPick(i, demo) {
  /* locked 门拦真实输入；demo 通道仅 tutorialWatch 内部传 true（豁免 locked） */
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const run = cur;                               // 身份守卫：演出窗口内重玩会重建 cur
  const r = engPick(cur, i);
  if (r === null) return false;
  const el = optEl(i);
  if (r === 'right' || r === 'done') {
    stopFoe();                                   // 抢答成功：钟即停（§2 孩子先答对）
    lastAct = Date.now();                        // 点对重置救援钟（§0.7a 主交互口径）
    if (state.tut === 'help') {                  // 教学"独"：首次答对 → 强化反馈放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbitBtn();
    }
    state.locked = true;
    if (el) {
      el.classList.remove('breathe', 'wrong');
      el.classList.add('right');
      const m = document.createElement('span');
      m.className = 'mark';
      m.innerHTML = ICONS.check;
      el.appendChild(m);
    }
    const qEl = $id('ex-q');
    if (qEl) { qEl.textContent = q.answer; qEl.classList.add('ok'); }
    sfx('coin');
    sayR(VOICE.win.key, VOICE.win.text);         // 己方进格播报（核心反馈）
    renderTrack(true);
    renderStep();
    await wait(880 * SPEED);
    if (cur !== run) return r;                   // 演出窗内重玩已重建关卡：丢弃旧续体
    state.locked = false;
    if (demo) return r;                          // 教学演示：不进下一题渲染（tutorialWatch 随即重发同关，防中间态起钟）
    if (r === 'done') winFlow();
    else renderQuiz();
  } else {                                       // 答错：晃动不灰掉可重点（对手钟不停，SPEC §2）
    if (el) { el.classList.remove('wrong', 'breathe'); void el.offsetWidth; el.classList.add('wrong'); }
    sfx('fail');
    sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2);   /* flat<3 每错必播 / ≥3 节流+豁免恰一次（===2） */
    if (q.miss >= 2) applyRescueVisual(q);       /* 首错不 pulse：连错 2 次给正确视觉线索 */
    if (state.tut === 'help') pointHelpNext();
    state.locked = true;                         /* 晃动窗防重入：连点一次错只记一次 miss（§0.26） */
    await wait(520 * SPEED);
    /* 题身份守卫（审查 M1）：对手超时在本窗内换题（同 cur 已推进 step）时不解锁——
       旧卡下标对新题判分会白得分/误记 miss，交由 onFoeTimeout 续体收尾解锁 */
    if (cur !== run || cur.quizzes[cur.step] !== q) return r;
    state.locked = false;
  }
  return r;
}

/* ================= 过关推进（胜负分支 → 写档 → 章末/日末）
   星级=engStars（miss 口径）照常给；胜负=myScore≥3 只定收尾演出（§2 两者分离） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关用 GEN 文案（不带"明天："前缀，core 模板自带） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  stopFoe();
  ghost.hide();
  const stars = engStars(cur);
  const win = cur.myScore >= WIN_LINE;
  window.__mbWinBranch = win ? 'win' : 'again';  // 关末胜负文案分支（verify 断言）
  sfx(win ? 'win' : 'fail');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  const afterWin = () => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  };
  if (win) KIDS.ui.celebrate(stars).then(afterWin);
  else againLayer(stars).then(function (replay) {          // 鼓励收尾：不锁关不惩罚（§2）
    if (replay) {
      KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);  /* 先写档保底（审查 m2）：重赛中途退出不丢本局；core 保星 max 下重赛更高星可覆盖 */
      startLevel(cur.flat);                               // 主动再赛一局（进度不回退，重打照常写档）
    }
    else afterWin();
  });
}
/* 鼓励收尾层（<3 格）：星星照给 + "就差一点点，再来一局" + 再来一局按钮；3.6s 自动流转 */
function againLayer(stars) {
  return new Promise(res => {
    const o = document.createElement('div');
    o.className = 'mb-ov';
    o.innerHTML = '<div class="mb-stars">' + '★'.repeat(stars) + '</div>' +
      '<div class="mb-big">' + AGAIN_TEXT + '</div>' +
      '<div class="mb-sub">把算式再算一遍，一定能追上它</div>' +
      '<button class="mb-btn" id="mb-again-btn">再来一局</button>';
    document.body.appendChild(o);
    requestAnimationFrame(() => o.classList.add('show'));
    let done = false;
    const finish = replay => {
      if (done) return;
      done = true;
      o.classList.remove('show');
      setTimeout(() => { o.remove(); res(replay); }, 320);
    };
    o.querySelector('#mb-again-btn').addEventListener('pointerdown', e => { e.preventDefault(); finish(true); });
    setTimeout(() => finish(false), 3600);
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();

  helpRedemo = false;

  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.multibattle && sv.multibattle.tutSeen);
  if (VERIFY) { openingSpeak(); return; }        /* verify 页恒走开场链（stub 记录供断言） */

const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },

  hide() { ghostEl.classList.remove('show', 'pressing'); }

/* 教学"帮"阶段指向：正确答案卡（SPEC §2 帮=幽灵手指指正确卡，钟走） */
function pointHelpNext() {

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=演示（对手钟冻结，幽灵手指指正确卡+演示答对进格）→ 重发同关（比分清零）
   → 帮=手指指正确卡（钟起走）→ 独=首次答对放手。
   save.multibattle.tutSeen 记住演示已放过（§0.6）；演示生效实证 window.__mbDemoR（§0.27） ================= */
async function tutorialWatch() {
  stopFoe();                                     // watch 期钟冻结（demo=true 期间不再起钟）
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);
  await wait(700 * SPEED);
  const q = cur.quizzes[0];
  pointGhostAt(optEl(q.answerIdx));
  await wait(850 * SPEED);
  ghost.press();
  await wait(320 * SPEED);
  ghost.hide();
  state.demo = false;                            // 临时解锁走真实路径演示一次完整抢答演出
  state.locked = false;
  window.__mbDemoR = await uiPick(q.answerIdx, true);   /* 演示实证：真实答对返回 'right'（§0.27） */
  const sv = KIDS._save();                       // 真实页 save 恒非 null；verify 直驱时跳过写档
  if (sv) {
    sv.multibattle = sv.multibattle || {};
    sv.multibattle.tutSeen = true;
    KIDS.store.persist();
  }
  /* 立即重发同关（确定性关卡，题面一致，比分清零），"你来抢答"在重发后的题面上说（照家族） */
  stopFoe();
  cur = genLevel(0);
  state = { locked: false, won: false, demo: false, tut: 'help', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();                    // help 起走钟（SPEC §2）
  state.quiet = false;
  openingSpeak(true);                            // 交接顺序链：turn clip → 题面 4 段（§0.6）
  setTimeout(() => { if (state.tut === 'help') pointHelpNext(); }, 600);
}

/* ================= 无操作看护：14s 救援（重读题面+答案视觉 §0.21）/ 教学"帮"5s 重演示一次
   救援钟只被正确推进/读题重置（§0.7a）；对手超时换题=系统推进不重置（两钟独立，§2） ================= */
setInterval(() => {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  const idle = Date.now() - lastAct;
  if (idle > 14000) {
    const q = cur.quizzes[cur.step];
    if (q) {
      speakQuiz(q);                              // 救援=重读题面（queue 拼接，§0.21）
      applyRescueVisual(q);
      rescueCount++;
    } else sayR(VOICE.hint.key, VOICE.hint.text);
    lastAct = Date.now();
    return;
  }
  if (idle > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {

}, 1000);

/* ================= ?verify=1 自检（仅 verify 分支加载执行）
   ① 40 关全量审计（flat 0-39，每关一记）：确定性（同 flat 双生成 JSON 一致）/
     章域一致（dch1-3 全部 q.src 记"mul"且 a∈章键因数；dch4 q.src 计数 m89=2+mix=3——混合复习形态）/
     算式域独立审计（refRangeOk：a,b∈2..9、answer=a*b、章键因数匹配）/
     干扰项独立复算（refCands={ans±a,ans±b,a+b} 滤重/正/非 ans）+ structOk / 互异禁 0 负/
     相邻题算式互异（(a,b) 对不同）/ 热身无（本款设计无热身，记录性断言恒真）/
     引擎直驱：答对推进 myScore++ / 答错 miss 恰一次 retries+1 / 对手超时 engFoe foeScore++
     不动 miss/retries / 星级三档独立驱动（每题一错 1★ / 仅首题一错 2★ / 全对 3★）
   ② sayW 三态（flat<3 每错必播 / flat≥3 10s 节流 / miss===2 force 豁免恰一次）
   ③ UI 冒烟 A flat0：真实通路首题先错一次（晃动不灰化可重点、钟不停）→ 通关=2 星 +
     myScore=5 + 胜利分支 __mbWinBranch='win'（verify 页不弹层）
     B flat5/flat10：autoSolve 全对 3 星；B3 flat15（ch4）：形态 m89=2+mix=3 + 3 星
   ④ 教学链（verify 直驱 tutorialWatch）：watch clip → demo 答对（__mbDemoR==='right' §0.27）→
     重发同关比分清零 → 交接链 queue([mul_tut_turn, n_a, mul_q1, n_b, mul_q2]) 5 段 →
     tut='help' 解锁；watch 期钟冻结（foeT 恒 1 采样）
   ⑤ multibattle 钟专项：A 提速生效（ch1 首超时实测 ≪ 真实 8000ms）/
     B 超时零惩罚（全超时关 retries=0 星级=3 + foeScore=5 + 'again' 分支）/
     C 答错钟不停（钟剩余单调减）
   ⑥ 布局：双 viewport（1280×800 / 800×1180）×（flat0/5/10/15）答案卡 ≥96、全按钮 ≥64
     （.k-parentbtn 豁免）、overflowX ≤0（量测期钟停，防超时换题重渲染干扰）
   ⑦ 分布与专项：VOICE 表文案独立字面量对账（SPEC 定稿）/ mul_* 16 条 clips 注入 clipOk /
     开场顺序链 queue([mul_hint, n_a, mul_q1, n_b, mul_q2]) 5 段单通道 / 题面 4 段拼接全 clip /
     answerIdx 三位置均出现且首位 <60%
   结果写 #verify-result + document.title='VERIFY PASS n/n' */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;
  const idxDist = [0, 0, 0];

  /* ---- verify 侧独立复算（不调引擎生成器/candPool，防两套逻辑同错） ---- */
  function refRangeOk(dch, q) {                  // 算式域独立审计
    if (q.src === 'mul') {                       // dch1-3 章键因数
      const ks = KEYS[dch];
      return ks.indexOf(q.a) >= 0 && q.b >= 2 && q.b <= 9 && q.a * q.b === q.answer;
    }
    if (q.src === 'm89') return (q.a === 8 || q.a === 9) && q.b >= 2 && q.b <= 9 && q.a * q.b === q.answer;
    if (q.src === 'mix') return q.a >= 2 && q.a <= 9 && q.b >= 2 && q.b <= 9 && q.a * q.b === q.answer;
    return false;
  }
  function refCands(q) {                         // 干扰规则池：{ans±a, ans±b, a+b}
    const out = [];
    [q.answer - q.a, q.answer + q.a, q.answer - q.b, q.answer + q.b, q.a + q.b].forEach(v => {
      if (v > 0 && v !== q.answer && out.indexOf(v) < 0) out.push(v);
    });
    return out;
  }

  /* ---- ① 40 关全量审计 + 引擎直驱（flat 0-39） ---- */
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1) === JSON.stringify(L2);
    let rangeAll = true, kindAll = true, structAll = true, distrAll = true,
        adjOk = true, driveOk = true, formOk = true;
    let prevA = -1, prevB = -1, m89n = 0, mixn = 0;
    if (flat < STATIC_LEVELS && L1.dch !== diffOfCh(chOfFlat(flat))) rangeAll = false;  // 静态关=循环章
    if (L1.dch < 1 || L1.dch > 4) rangeAll = false;
    for (let k = 0; k < L1.quizzes.length; k++) {
      const q = L1.quizzes[k];
      if (q.kind !== 'mul') kindAll = false;
      if (!refRangeOk(L1.dch, q)) rangeAll = false;
      if (!structOk(q)) structAll = false;
      if (q.src === 'm89') m89n++;
      if (q.src === 'mix') mixn++;
      q.items.forEach((v, idx) => {                                        // 干扰规则+互异禁 0 负（structOk 复口径）
        if (idx === q.answerIdx) return;
        if (v === q.answer || refCands(q).indexOf(v) < 0) distrAll = false;
      });
      idxDist[q.answerIdx]++;
      if (q.a === prevA && q.b === prevB) adjOk = false;                  // 相邻题算式互异（(a,b) 对）
      prevA = q.a; prevB = q.b;
    }
    /* 形态：dch1-3 全章键因数乘法；dch4 = 2×m89 + 3×mix（混合复习，SPEC §2） */
    if (L1.dch <= 3) formOk = L1.quizzes.every(q => q.src === 'mul');
    else formOk = m89n === 2 && mixn === 3;
    /* 引擎直驱：答对推进 / 答错 miss 恰一次 / 超时零惩罚 / 星级三档 */
    const Ld = genLevel(flat);
    for (let k = 0; k < Ld.quizzes.length && driveOk; k++) {
      const q = Ld.quizzes[k];
      const base = Ld.retries;
      let wi = 0; while (wi === q.answerIdx) wi++;
      if (engPick(Ld, wi) !== 'wrong' || q.miss !== 1 || Ld.retries !== base + 1) driveOk = false;  // 错=miss 恰一次
      if (engPick(Ld, 99) !== null || engPick(Ld, 0.5) !== null) driveOk = false;                    // 非法下标防御
      if (engPick(Ld, q.answerIdx) !== (k === Ld.quizzes.length - 1 ? 'done' : 'right')) driveOk = false;  // 对=推进
      if (Ld.myScore !== k + 1) driveOk = false;
      if (k === 0) {                            // 对手超时（首题）：foeScore++ 不动 miss/retries（零惩罚）
        const Lf = genLevel(flat), qf = Lf.quizzes[0];
        const rf = engFoe(Lf);
        if (rf !== 'foe' || Lf.foeScore !== 1 || Lf.step !== 1 ||
            qf.miss !== 0 || Lf.retries !== 0) driveOk = false;
      }
    }
    /* 星级三档：Ld=每题一错（更多=1★）/ L2x=仅首题一错（1-2 错=2★）/ L3=全对（0 错=3★） */
    const s1 = Ld.done && Ld.retries >= 5 && engStars(Ld) === 1;
    const L2x = genLevel(flat);
    let g2 = 0;
    while (!L2x.done && g2++ < 30) {
      const q = L2x.quizzes[L2x.step];
      if (L2x.step === 0) { let wi = 0; while (wi === q.answerIdx) wi++; engPick(L2x, wi); }
      engPick(L2x, q.answerIdx);
    }
    const s2 = L2x.done && L2x.retries === 1 && engStars(L2x) === 2;
    const L3 = genLevel(flat);
    let guard = 0;
    while (!L3.done && guard++ < 30) engPick(L3, L3.quizzes[L3.step].answerIdx);
    const s3 = L3.done && L3.retries === 0 && engStars(L3) === 3;
    if (!s1 || !s2 || !s3) driveOk = false;
    /* 热身：本款设计无首题热身（每章题型单一直入对抗，SPEC §2 无热身条款）——记录性恒真 */
    const warmOk = true;
    const ok = det && L1.quizzes.length === CH_LEN && rangeAll && kindAll && formOk &&
      structAll && distrAll && adjOk && driveOk && warmOk;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, rangeAll: rangeAll, kindAll: kindAll,
      formOk: formOk, structAll: structAll, distrAll: distrAll, adjOk: adjOk, driveOk: driveOk,
      stars: { many1: engStars(Ld), wrong1: engStars(L2x), clean: engStars(L3) },
      qs: L1.quizzes.map(q => q.a + '×' + q.b + '=' + q.items.join('/')) };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② sayW 三态（flat<3 每错必播 / flat≥3 10s 节流 / miss===2 force 豁免恰一次） ---- */
  total++;
  const wLog = [];
  const origPlay2 = KIDS.voice.play;
  KIDS.voice.play = function (key, text) { wLog.push([key, String(text).slice(0, 4)]); };
  const wrongPlays = () => wLog.filter(p => p[0] === 'mul_wrong').length;
  const wrongIdx = () => { const q = MB.quiz; let i = 0; while (i === q.answerIdx) i++; return i; };
  startLevel(0);                                          // flat0：每错必播
  await uiPick(wrongIdx());
  await uiPick(wrongIdx());
  const sayA = wrongPlays();                              // → 2
  startLevel(3);                                          // flat3：10s 节流
  lastWrongVoice = Date.now();                            /* 显式进入节流窗口内 */
  await uiPick(wrongIdx());                               // miss=1 窗口内 → 节流不播
  const sayB = wrongPlays() - 2;                          // 增量 → 0
  startLevel(3);                                          // 同关重发 fresh quiz：miss===2 force 豁免
  lastWrongVoice = 0;                                     /* 隔离上一子用例时间戳 */
  await uiPick(wrongIdx());                               // miss=1 → 播（10s 窗口外）
  await uiPick(wrongIdx());                               // miss=2 → force === 2 → 播
  const sayC = wrongPlays() - 2 - sayB;                   // 增量 → 2
  KIDS.voice.play = origPlay2;
  const sayWOk = sayA === 2 && sayB === 0 && sayC === 2;
  if (sayWOk) npass++;
  units.sayW = { ok: sayWOk, flat0Plays: sayA, flat3Throttle: sayB, flat3Force: sayC };

  /* ---- ③ UI 冒烟 A：flat0 真实通路通关（首题先错一次=2 星；钟走完前抢答，提速下可行） ---- */
  total++;
  startLevel(0);
  let smokeA = true, wrongOk = false, clockLive = false, quizzesA = 0;
  for (let s = 0; s < CH_LEN && smokeA; s++) {
    const q = MB.quiz;
    if (!q) { smokeA = false; break; }
    if (s === 0) {                                        // 首错：卡晃动零惩罚可重点；对手钟不停
      await wait(200);                                    // 先让钟走一段（foeT<1 再采基数）
      const t1 = MB.quiz.foeT;
      const r = await uiPick(wrongIdx());
      const t2 = MB.quiz.foeT;
      const wigCard = !!answersEl.querySelector('.opt.wrong');
      const alive = !!answersEl.querySelector('.opt:not(.wrong):not(.right)');
      wrongOk = r === 'wrong' && wigCard && alive &&
        MB.currentLevel.retries === 1 && MB.currentLevel.step === 0 && MB.quiz.miss === 1;
      clockLive = t1 < 1 && t2 < t1;                      // 错答期间钟剩余递减=钟没停
    }
    const r2 = await uiPick(MB.quiz.answerIdx);
    if (r2 !== (s === CH_LEN - 1 ? 'done' : 'right')) smokeA = false;
    quizzesA++;
  }
  const lvA = MB.currentLevel;
  const smokeOkA = smokeA && wrongOk && clockLive && quizzesA === CH_LEN && lvA.done && lvA.won &&
    lvA.retries === 1 && engStars(cur) === 2 && lvA.myScore === 5 && lvA.foeScore === 0 &&
    window.__mbWinBranch === 'win' && !document.querySelector('.k-celebrate');   // verify 页不弹层
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, wrongOk: wrongOk, clockLive: clockLive, quizzes: quizzesA,
    retries: lvA.retries, stars: engStars(cur), myScore: lvA.myScore, branch: window.__mbWinBranch };

  /* ---- ③ UI 冒烟 B1/B2：flat5（ch2）/flat10（ch3）autoSolve 全对 3 星 ---- */
  total++;
  startLevel(5);
  const a5 = await MB.autoSolve();
  const lv5 = MB.currentLevel;
  const smokeOk5 = a5.done && lv5.done && lv5.won && lv5.retries === 0 &&
    engStars(cur) === 3 && lv5.myScore === 5;
  if (smokeOk5) npass++;
  smokes.flat5 = { ok: smokeOk5, picks: a5.picks, stars: engStars(cur) };
  total++;
  startLevel(10);
  const a10 = await MB.autoSolve();
  const lv10 = MB.currentLevel;
  const smokeOk10 = a10.done && lv10.done && lv10.won && lv10.retries === 0 &&
    engStars(cur) === 3 && lv10.myScore === 5;
  if (smokeOk10) npass++;
  smokes.flat10 = { ok: smokeOk10, picks: a10.picks, stars: engStars(cur) };

  /* ---- ③ UI 冒烟 B3：flat15（ch4）形态 m89=2+mix=3 + autoSolve 3 星 ---- */
  total++;
  startLevel(15);
  const L15 = genLevel(15);
  const form15 = L15.dch === 4 &&
    L15.quizzes.filter(q => q.src === 'm89').length === 2 &&
    L15.quizzes.filter(q => q.src === 'mix').length === 3;
  const a15 = await MB.autoSolve();
  const lv15 = MB.currentLevel;
  const smokeOk15 = form15 && a15.done && lv15.done && lv15.won &&
    lv15.retries === 0 && engStars(cur) === 3 && lv15.myScore === 5;
  if (smokeOk15) npass++;
  smokes.flat15 = { ok: smokeOk15, form: form15, picks: a15.picks, stars: engStars(cur) };

  /* ---- ④ 教学链（verify 直驱 tutorialWatch）：watch clip → demo 答对（demoR 实证）→
       重发同关比分清零 → 交接链 5 段 → help 解锁；watch 期钟冻结（foeT 恒 1） ---- */
  total++;
  const origQ7 = KIDS.voice.queue, origP7 = KIDS.voice.play;
  const qLog7 = [], pLog7 = [];
  KIDS.voice.queue = function (parts) { qLog7.push(parts.slice()); };
  KIDS.voice.play = function (key) { pLog7.push(String(key)); };
  startLevel(0);
  const demoSamples = [];
  const tw = tutorialWatch();                    // 不 await：watch 进行中采样钟冻结
  for (let i = 0; i < 3; i++) { demoSamples.push(MB.quiz ? MB.quiz.foeT : null); await wait(90); }
  await tw;
  KIDS.voice.queue = origQ7; KIDS.voice.play = origP7;
  const lastQ7 = qLog7[qLog7.length - 1];
  const q0t = MB.quiz;
  const frozenOk = demoSamples.length === 3 && demoSamples.every(v => v === 1);   // 教学期钟冻结
  const tutOk = pLog7.indexOf('mul_tut_watch') >= 0 &&                    /* 看=演示配 watch clip */
    window.__mbDemoR === 'right' &&                                      /* 演示真实生效（§0.27） */
    state.tut === 'help' && !state.demo && !state.locked &&              /* 帮：解锁等孩子动手 */
    MB.currentLevel && MB.currentLevel.flat === 0 &&                      /* 重发同关 */
    MB.quiz && MB.quiz.step === 0 && MB.quiz.myScore === 0 &&            /* 重发后比分清零 */
    lastQ7 && lastQ7.length === 5 && lastQ7[0] === 'mul_tut_turn' &&      /* 交接顺序链单通道 5 段 */
    lastQ7[1].key === 'mul_n_' + q0t.a && lastQ7[2].key === 'mul_q1' &&
    lastQ7[3].key === 'mul_n_' + q0t.b && lastQ7[4].key === 'mul_q2';
  if (tutOk) npass++;
  units.tutorial = { ok: tutOk, demoR: window.__mbDemoR, frozen: frozenOk,
    watchClip: pLog7.indexOf('mul_tut_watch') >= 0, handoff: !!lastQ7, parts: lastQ7,
    samples: demoSamples, tut: state.tut };

  /* ---- ⑤ 钟专项 A：verify 提速生效（/SPEED 口径）——ch1 首题超时实测 ≈960ms（≪ 真实 8000ms） ---- */
  total++;
  startLevel(0);
  const t0 = performance.now();
  let gA = 0;
  while (cur && !cur.done && cur.step === 0 && gA++ < 260) await wait(40);   // 等首题对手超时
  const dtA = performance.now() - t0;
  const expect = FOE_MS[1] * SPEED;             // 960ms（提速口径=base/SPEED 家族 wait() 同构）
  const speedOk = dtA > 400 && dtA < 2600 && expect < 1200;
  if (speedOk) npass++;
  units.clockSpeed = { ok: speedOk, ms: Math.round(dtA), expect: Math.round(expect), base: FOE_MS[1] };

  /* ---- ⑤ 钟专项 B：超时零惩罚——静置全超时：不计 miss 不扣星 + 鼓励分支 ---- */
  total++;
  let gB = 0;
  while (cur && !cur.done && gB++ < 400) await wait(50);   // 接 A：第 2-5 题全部超时
  await wait(400);                              // 等末题超时演出收尾 → winFlow 记录胜负分支
  const timeoutOk = !!cur && cur.done && cur.foeScore === CH_LEN && cur.myScore === 0 &&
    cur.retries === 0 && cur.quizzes.every(q => q.miss === 0) && engStars(cur) === 3 &&
    window.__mbWinBranch === 'again';            /* <3 格=鼓励收尾（胜负=速度，与星级分离） */
  if (timeoutOk) npass++;
  units.clockTimeout = { ok: timeoutOk, foeScore: cur ? cur.foeScore : null,
    myScore: cur ? cur.myScore : null, retries: cur ? cur.retries : null,
    stars: cur ? engStars(cur) : null, branch: window.__mbWinBranch };

  /* ---- ⑤ 钟专项 C：答错对手钟不停（钟剩余单调减） ---- */
  total++;
  startLevel(0);
  await wait(240);                               // 钟走一段（foeT<1）
  const st1 = MB.quiz;
  await uiPick(wrongIdx());                      // 错答（晃动窗 62ms，钟不停）
  const t2 = MB.quiz.foeT;
  await wait(150);
  const t3 = MB.quiz.foeT;
  const wrongClockOk = st1.foeT < 1 && t2 < st1.foeT && t3 < t2;
  stopFoe();                                     // 清场：本专项不再需要钟
  if (wrongClockOk) npass++;
  units.clockWrong = { ok: wrongClockOk, t1: st1.foeT, t2: t2, t3: t3 };

  /* ---- ⑥ 布局：双 viewport ×（flat0/5/10/15）；量测期停钟（防超时换题重渲染干扰 §0.11） ---- */
  async function simView(w, h, flat) {
    startLevel(flat);
    stopFoe();
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    await wait(620);                             // 答案卡入场动画 .38s+delay .14s（真实 ms，不吃 SPEED）
    const de = document.documentElement;
    const opts = Array.prototype.slice.call(answersEl.querySelectorAll('.opt'));
    const optOk = opts.length === 3 &&
      opts.every(b => { const r = b.getBoundingClientRect(); return r.width >= 96 && r.height >= 96; });
    let btnOk = true;                            // 全部按钮 ≥64（.k-parentbtn 家长按钮豁免）
    document.querySelectorAll('button').forEach(b => {
      if (b.classList.contains('k-parentbtn')) return;
      const r = b.getBoundingClientRect();
      if (r.width > 4 && r.height > 4 && (r.width < 64 || r.height < 64)) btnOk = false;
    });
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, flat: flat, optOk: optOk, btnOk: btnOk, ox: ox,
      pass: optOk && btnOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const f of [0, 5, 10, 15]) {
    sims.push(await simView(1280, 800, f));
    sims.push(await simView(800, 1180, f));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                 // 还原真实 viewport 布局
  const layoutOk = sims.length === 8 && sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑦ 分布与专项：文案对账 / clip 注入 / 开场链 / 题面拼接 / 覆盖率 ---- */
  total++;
  /* SPEC §2 定稿文案独立字面量（manifest 一致，禁改） */
  const refVoice = VOICE.watch.text === '看！和兔子比一比' &&
    VOICE.turn.text === '你来抢答' && VOICE.hint.text === '算一算，几个几' &&
    VOICE.q1.text === '乘' && VOICE.q2.text === '等于多少呀' &&
    VOICE.win.text === '答对啦，冲呀' && VOICE.lose.text === '兔子先答完啦，下一题追上它' &&
    VOICE.wrong.text === '再想一想，算一算';
  const numCnOk = numCn(2) === '二' && numCn(5) === '五' && numCn(9) === '九';
  /* mul_* 全部 16 条 clips 注入对账（build 注入后 KIDS.voice.clips 应含全部） */
  const MUL_KEYS = ['mul_tut_watch', 'mul_tut_turn', 'mul_hint', 'mul_wrong', 'mul_q1', 'mul_q2',
    'mul_win', 'mul_lose'].concat(Array.from({ length: 8 }, (_, i) => 'mul_n_' + (i + 2)));
  const clipOk = MUL_KEYS.every(k => !!KIDS.voice.clips[k]);
  /* 开场顺序链（stub 记录）：queue([mul_hint, n_a, mul_q1, n_b, mul_q2]) 5 段单通道不叠音 */
  const origQ = KIDS.voice.queue, origP = KIDS.voice.play, origS = KIDS.voice.say;
  const qLog = [], playLog = [], sayLog = [];
  KIDS.voice.queue = function (parts) { qLog.push(parts.slice()); };
  KIDS.voice.play = function (key) { playLog.push(String(key)); };
  KIDS.voice.say = function (t) { sayLog.push(String(t)); };
  startLevel(0);                                 // verify 页恒走开场链
  const lastQ = qLog[qLog.length - 1];
  const q0v = genLevel(0).quizzes[0];
  const openChain = qLog.length >= 1 && lastQ.length === 5 && lastQ[0] === 'mul_hint' &&
    lastQ[1].key === 'mul_n_' + q0v.a && lastQ[2].key === 'mul_q1' &&
    lastQ[3].key === 'mul_n_' + q0v.b && lastQ[4].key === 'mul_q2';
  /* 题面 queue 4 段拼接断言：段序=key 序（数词a、q1'乘'、数词b、q2'等于多少呀'）且全 clip 在场 */
  const parts0 = quizParts(q0v);
  const chainOk = parts0.length === 4 &&
    parts0[0].key === 'mul_n_' + q0v.a && parts0[1].key === 'mul_q1' &&
    parts0[2].key === 'mul_n_' + q0v.b && parts0[3].key === 'mul_q2' &&
    parts0.every(p => !!KIDS.voice.clips[p.key]);
  speakQuiz(q0v);                                // 救援/重听拼句：题面 4 段（clip 在场走 queue）
  const lastQ2 = qLog[qLog.length - 1];
  const rescueChain = qLog.length >= 2 && lastQ2 !== lastQ && lastQ2.length === 4 &&
    lastQ2[0] === 'mul_n_' + q0v.a && lastQ2[3] === 'mul_q2';
  KIDS.voice.queue = origQ; KIDS.voice.play = origP; KIDS.voice.say = origS;
  /* 答案位置分布：三位置均出现、首位不恒定（<60%，按实际计数） */
  const idxN = idxDist[0] + idxDist[1] + idxDist[2];
  const distOk = idxDist[0] > 0 && idxDist[1] > 0 && idxDist[2] > 0 && idxDist[0] < idxN * 0.6;
  const specOk = refVoice && numCnOk && clipOk && openChain && chainOk && rescueChain && distOk;
  if (specOk) npass++;
  units.dist = { ok: specOk, refVoice: refVoice, numCn: numCnOk, clips: clipOk,
    openChain: openChain, chain: chainOk, rescueChain: rescueChain,
    idx: idxDist, n: idxN };

  const out = { game: 'multibattle', total: total, pass: npass, layoutOk: layoutOk, dist: idxDist,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
</body>
