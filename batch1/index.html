<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子的游戏屋</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FBF3E4;color:#4A3B2E;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:34px 22px}
  .logo{width:150px;height:150px}
  h1{font-size:clamp(26px,5vw,38px);letter-spacing:.05em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px;width:100%;max-width:760px}
  a.card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 24px;border-radius:26px;
         background:#FFF9EE;border:2.5px solid #4A3B2E;text-decoration:none;color:#4A3B2E;
         box-shadow:0 5px 0 #D8C9B4;transition:transform .2s}
  a.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
  @media (hover:hover){
    a.card:hover{transform:translateY(-4px);box-shadow:0 9px 0 #D8C9B4}
  }
  .card .icon{width:92px;height:92px}
  .card .name{font-size:22px;font-weight:700}
  .card .desc{font-size:14px;color:#8A7B6C;line-height:1.6;text-align:center}
  .foot{font-size:12.5px;color:#8A7B6C;text-align:center;line-height:1.8;max-width:520px}
</style>
</head>
<body>
  <div class="logo" id="logo"></div>
  <h1>小兔子的游戏屋</h1>
  <div class="grid">
    <a class="card" href="pipe-rabbit/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="40" width="26" height="20" rx="5" fill="#8A9BAE" stroke="#4A3B2E" stroke-width="2.5"/><path d="M34 50 h14 a8 8 0 0 1 8 8 v14 a8 8 0 0 0 8 8" fill="none" stroke="#E8975A" stroke-width="9" stroke-linecap="round"/><circle cx="82" cy="74" r="9" fill="#F2B8C6" stroke="#4A3B2E" stroke-width="2.5"/><circle cx="82" cy="70" r="3.5" fill="#C77A42"/></svg></div>
      <div class="name">管道小兔子</div>
      <div class="desc">转一转水管<br>让水流到花盆里</div>
    </a>
    <a class="card" href="shop-math/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M22 38 h56 l-6 44 a8 8 0 0 1-8 7 H36 a8 8 0 0 1-8-7 z" fill="#8FBF7F" stroke="#4A3B2E" stroke-width="2.5"/><path d="M38 38 v-6 a12 12 0 0 1 24 0 v6" fill="none" stroke="#4A3B2E" stroke-width="2.5"/><circle cx="40" cy="58" r="6" fill="#E8975A"/><circle cx="60" cy="58" r="6" fill="#F2B8C6"/><circle cx="50" cy="74" r="6" fill="#E8B04F"/></svg></div>
      <div class="name">数字小卖部</div>
      <div class="desc">小动物来买东西<br>数一数 拿对了吗</div>
    </a>
    <a class="card" href="kitchen-rhythm/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="52" width="80" height="30" rx="8" fill="#EFE3CD" stroke="#4A3B2E" stroke-width="2.5"/><path d="M50 20 q-14 16 -14 28 a14 14 0 0 0 28 0 q0-12-14-28z" fill="#8A7BAE" stroke="#4A3B2E" stroke-width="2.5" opacity=".001"/><path d="M50 24 q-12 14 -12 25 a12 12 0 0 0 24 0 q0-11-12-25z" fill="#E8975A" stroke="#4A3B2E" stroke-width="2.5"/><circle cx="47" cy="52" r="2.6" fill="#4A3B2E"/><circle cx="55" cy="52" r="2.6" fill="#4A3B2E"/></svg></div>
      <div class="name">厨房节奏</div>
      <div class="desc">食材到圈里切一切<br>你的节拍就是歌</div>
    </a>
  </div>
  <p class="foot">每天有新关卡，玩完今天的小兔子会说"明天见"。<br>每款游戏右上角 🔒 家长面板：进度 / 时长 / 声音 / 存档。<br>完全离线，无广告无内购，进度保存在本机。</p>
