<body>
<div id="game" aria-label="数字小卖部">
  <div id="hud">
    <div id="sign" aria-hidden="true"></div>
    <div id="fruit-tray" aria-label="本章收入果子"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="door" aria-label="门口排队"></div>
    <div id="cust-wrap" aria-hidden="true"></div>
    <div id="bubble" aria-live="polite"></div>
    <div id="budget-bar" aria-label="顾客的钱"></div>
  </div>
  <div id="group-bar" aria-label="数数策略"></div>
  <div id="shelf" aria-label="货架"></div>
  <div id="dock">
    <div id="basket" aria-label="篮子"><div class="empty-hint"></div></div>
    <button id="btn-help" aria-label="小兔子帮忙"></button>
    <button id="btn-checkout" aria-label="结账"></button>
  </div>
  <div id="pay-panel" aria-label="收银台">
    <div class="pp-items"></div>
    <div class="pp-tray"></div>
    <div class="pp-row2">
      <div id="coin-dock" aria-label="硬币"></div>
      <div class="pp-sum"><span class="pp-sum-n">0</span></div>
      <button id="btn-done" aria-label="完成"></button>
    </div>
  </div>
</div>
<div id="hintcard" aria-hidden="true"></div>
<div id="okmark" aria-hidden="true"></div>
<div id="ghost" aria-hidden="true"></div>
<div id="shutter" aria-hidden="true"><div class="curtain"></div><div class="sign2"></div></div>
<pre id="verify-result"></pre>
