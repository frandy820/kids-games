<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数字小卖部</title>
<style>
/* ================= 数字小卖部 shop-math =================
   视觉按 DESIGN-SPEC §8：奶油暖白底、暖橙主色、灰蓝错误色（不用大红）
   触摸目标：货架格/结账/帮忙按钮 ≥96px；硬币/策略条/完成 ≥72px（viewport 双档保证）
   r6 新增：货架价签 .price-tag / 策略条 #group-bar / 预算条 #budget-bar /
   收银台 #pay-panel（硬币区 #coin-dock + 托盘 .pp-tray + 合计 .pp-sum + #btn-done） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏：果子盘（本章进度）+ 店招 ---------- */
#hud{height:58px;flex:0 0 58px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:12px}
#sign{width:44px;height:44px;border-radius:12px;background:#E8975A;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
#fruit-tray{display:flex;gap:6px;align-items:center;flex:1 1 auto}
#fruit-tray .fruit{width:34px;height:34px;opacity:.22;transform:scale(.82);transition:all .35s cubic-bezier(.2,1.6,.4,1)}
#fruit-tray .fruit.on{opacity:1;transform:scale(1)}
#chapter-dots{display:flex;gap:5px;align-items:center}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：门口排队 + 当前顾客 + 气泡 + 预算条 ---------- */
#stage{flex:1 1 auto;position:relative;overflow:hidden;min-height:180px;--cw:min(46vh,300px)}
#door{position:absolute;top:8px;right:64px;display:flex;gap:4px;align-items:flex-end;opacity:.9}
#door .doorpet{width:44px;height:44px;filter:saturate(.8)}
#door .doorpet svg{width:100%;height:100%}
#cust-wrap{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:var(--cw);height:auto;text-align:center}
#cust-wrap.entering{animation:walk-in .5s ease both}
#cust-wrap.leaving{animation:walk-out .6s ease-in both}
@keyframes walk-in{from{transform:translateX(-50%) translateX(150vw)}to{transform:translateX(-50%) translateX(0)}}
@keyframes walk-out{from{transform:translateX(-50%) translateX(0);opacity:1}
  to{transform:translateX(-50%) translateX(-120vw);opacity:.6}}
#cust-wrap.happy{animation:hop .4s ease 2}
@keyframes hop{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-16px)}}
#cust-wrap svg{width:100%;height:auto}

/* 需求气泡：图标×数量 + 数字 + 点数圆点（零文字）；r6 大数=分组圆点 .b-grp */
#bubble{position:absolute;left:50%;bottom:calc(var(--cw) + 36px);transform:translate(-50%,14px) scale(.6);transform-origin:bottom center;
  background:#FFF9EE;border:2.5px solid #4A3B2E;border-radius:22px;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-direction:column;
  box-shadow:0 4px 0 rgba(74,59,46,.14);opacity:0;transition:transform .3s cubic-bezier(.2,1.6,.4,1),opacity .3s;
  max-width:min(94%,560px);z-index:5}
#bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
#bubble.flash{animation:b-flash .55s ease 2}
@keyframes b-flash{0%,100%{opacity:1}50%{opacity:.35}}
#bubble:after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);
  border:9px solid transparent;border-top-color:#4A3B2E}
#bubble .b-row{display:flex;align-items:center;gap:8px}
#bubble .b-icons{display:flex;gap:2px;flex-wrap:wrap;max-width:340px}
#bubble .b-icons svg{width:30px;height:30px}
#bubble .b-count{display:flex;flex-direction:column;align-items:center;gap:3px}
#bubble .b-num{font-size:30px;font-weight:800;color:#4A3B2E;line-height:1}
#bubble .b-dots{display:flex;gap:3px;flex-wrap:wrap;max-width:220px}
#bubble .b-dots i{width:7px;height:7px;border-radius:50%;background:#E8975A}
#bubble .b-grps{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:300px}
#bubble .b-grp{display:flex;gap:3px;padding:4px 5px;border-radius:9px;background:rgba(232,151,90,.13);
  border:1.5px solid rgba(232,151,90,.35)}
#bubble .b-grp i{width:8px;height:8px;border-radius:50%;background:#E8975A}
#bubble .b-grp.lit{background:rgba(143,191,127,.28);border-color:#8FBF7F}
#bubble .b-tag{display:flex;align-items:center;gap:5px;background:#F6EBD7;border-radius:12px;padding:3px 9px 3px 4px}
#bubble .b-tag svg{width:26px;height:26px}
#bubble .b-tag b{font-size:24px;font-weight:800;color:#4A3B2E}
#bubble .b-want{display:flex;gap:7px;align-items:center}
#bubble .b-want i{width:15px;height:15px;border-radius:50%;border:2.5px dashed #C9A87C;background:#FFF9EE}
#bubble .b-want i.on{border-style:solid;border-color:#8FBF7F;background:rgba(143,191,127,.35)}
#bubble .b-q{font-size:26px;font-weight:800;color:#C77A42}

/* 预算条（r6：budget 轮在场——顾客递来的整钱 + 要买几样） */
#budget-bar{position:absolute;left:10px;top:8px;display:none;flex-direction:column;align-items:center;gap:2px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;border-radius:16px;padding:7px 10px;z-index:6;
  box-shadow:0 3px 0 rgba(74,59,46,.14)}
#budget-bar.show{display:flex}
#budget-bar .bb-coin svg{width:42px;height:42px}
#budget-bar .bb-want{display:flex;gap:3px}
#budget-bar .bb-want i{width:9px;height:9px;border-radius:50%;background:#E8975A}

/* ---------- 数数策略条（r6 按群：n≥10 在场；按钮 ≥72×64） ---------- */
#group-bar{flex:0 0 auto;display:none;gap:10px;justify-content:center;align-items:center;
  padding:6px 10px;background:#F3E2C8;border-top:3px solid #4A3B2E}
#group-bar.show{display:flex}
#group-bar button{min-width:76px;height:72px;border-radius:14px;background:#FFF9EE;border:2.5px solid #C9A87C;
  box-shadow:0 4px 0 #D8B88E;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;transition:transform .15s}
#group-bar button:active{transform:translateY(3px);box-shadow:0 1px 0 #D8B88E}
#group-bar button b{font-size:24px;font-weight:800;color:#4A3B2E}
#group-bar button .g-dots{display:flex;gap:2px}
#group-bar button .g-dots i{width:5px;height:5px;border-radius:50%;background:#E8975A}
#group-bar button.cur{border-color:#E8975A;background:#FBE9D6}

/* ---------- 货架：4 商品格（≥96×96 双档）；r6 价签（sum/budget 轮显示） ---------- */
#shelf{flex:0 0 auto;background:#F3E2C8;border-top:3px solid #4A3B2E;border-bottom:3px solid #4A3B2E;
  padding:10px 12px 12px;display:flex;gap:clamp(16px,2vw,22px);justify-content:center;align-items:stretch}
#group-bar.show + #shelf{border-top:none;padding-top:6px}
.shelf-cell{width:clamp(96px,20vw,124px);height:clamp(104px,21vw,134px);background:#FFF9EE;border-radius:18px;
  border:2.5px solid #C9A87C;box-shadow:0 5px 0 #D8B88E;display:flex;align-items:center;justify-content:center;
  position:relative;transition:transform .15s}
.shelf-cell:active{transform:translateY(3px);box-shadow:0 2px 0 #D8B88E}
.shelf-cell svg{width:64%;height:64%}
.shelf-cell.pulse{animation:cell-pulse 1s ease 2}
@keyframes cell-pulse{0%,100%{box-shadow:0 5px 0 #D8B88E,0 0 0 0 rgba(232,151,90,.55)}
  50%{box-shadow:0 5px 0 #D8B88E,0 0 0 16px rgba(232,151,90,0)}}
.shelf-cell .price-tag{display:none;position:absolute;top:-11px;right:-9px;align-items:center;gap:2px;
  background:#F6EBD7;border:2px solid #4A3B2E;border-radius:11px;padding:1px 7px 1px 2px;z-index:2}
.shelf-cell .price-tag svg{width:20px;height:20px}
.shelf-cell .price-tag b{font-size:16px;font-weight:800;color:#4A3B2E}
#game.prices-on .shelf-cell .price-tag{display:flex}

/* ---------- 底栏：篮子 + 帮忙 + 结账（拇指区） ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px 14px}
#basket{flex:1 1 auto;min-width:0;background:#FFF9EE;border:2.5px solid #4A3B2E;border-radius:20px;
  padding:8px;display:flex;gap:16px;flex-wrap:wrap;align-content:center;justify-content:center;min-height:96px}
#basket .slot{width:64px;height:64px;border-radius:14px;background:#F6EBD7;border:2px dashed #D8C9B4;
  display:none;align-items:center;justify-content:center;position:relative}
#basket .slot.show{display:flex}
#basket .slot svg{width:42px;height:42px}
#basket .slot .qty{position:absolute;top:-9px;right:-9px;min-width:26px;height:26px;padding:0 5px;border-radius:13px;
  background:#E8975A;color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center}
#basket .empty-hint{color:#C9B99F;display:none;align-items:center;justify-content:center;width:100%}
#basket .empty-hint svg{width:52px;height:52px;opacity:.5}
#btn-help{width:78px;height:78px;flex:0 0 78px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-help:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-help svg{width:52px;height:52px}
#btn-checkout{width:clamp(100px,24vw,128px);height:clamp(100px,24vw,128px);flex:0 0 auto;border-radius:50%;
  background:#E8975A;border:3px solid #4A3B2E;box-shadow:0 6px 0 #C77A42;
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-checkout:active{transform:translateY(4px);box-shadow:0 2px 0 #C77A42}
#btn-checkout svg{width:62%;height:62%}
#btn-checkout.okflash{animation:btn-ok .5s ease 1}
@keyframes btn-ok{50%{transform:scale(1.08)}}

/* ---------- 收银台（r6：付钱/找零阶段浮层；body.paying 时 checkout 让位） ---------- */
#pay-panel{position:fixed;left:50%;bottom:12px;transform:translate(-50%,24px) scale(.9);z-index:40;
  background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;padding:10px 14px;
  box-shadow:0 5px 0 rgba(74,59,46,.18);opacity:0;pointer-events:none;max-width:min(96%,640px);
  transition:transform .28s cubic-bezier(.2,1.6,.4,1),opacity .25s}
#pay-panel.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#pay-panel .pp-items{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:44px}
#pay-panel .pp-items .pi{display:flex;align-items:center;gap:3px;background:#F6EBD7;border-radius:12px;padding:2px 8px 2px 2px}
#pay-panel .pp-items .pi svg.gi{width:34px;height:34px}
#pay-panel .pp-items .pi svg.ci{width:24px;height:24px}
#pay-panel .pp-items .pi b{font-size:19px;font-weight:800}
#pay-panel .pp-items .pp-paid{display:flex;align-items:center;gap:3px;background:#FBE9D6;border:2px solid #E8975A;border-radius:12px;padding:2px 8px 2px 2px}
#pay-panel .pp-items .pp-paid svg{width:26px;height:26px}
#pay-panel .pp-items .pp-paid b{font-size:20px;font-weight:800;color:#C77A42}
#pay-panel .pp-tray{display:flex;gap:6px;justify-content:center;min-height:44px;align-items:center;margin-top:4px;flex-wrap:wrap}
#pay-panel .pp-tray .chip{width:40px;height:40px;pointer-events:auto;transition:transform .15s}
#pay-panel .pp-tray .chip:active{transform:scale(.9)}
#pay-panel .pp-tray .chip svg{width:100%;height:100%}
#pay-panel .pp-tray .tray-empty{color:#C9B99F;font-size:15px}
#pay-panel .pp-row2{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:6px;flex-wrap:wrap}
#coin-dock{display:flex;gap:9px}
#coin-dock button{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s;padding:0}
#coin-dock button:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#coin-dock button svg{width:56px;height:56px}
#coin-dock button.pulse{animation:cell-pulse 1s ease 2}
.pp-sum{display:flex;align-items:center;gap:4px;min-width:86px;justify-content:center;
  background:#F6EBD7;border-radius:14px;padding:4px 12px}
.pp-sum svg{width:26px;height:26px}
.pp-sum .pp-sum-n{font-size:26px;font-weight:800;color:#4A3B2E}
#btn-done{width:80px;height:72px;border-radius:18px;background:#8FBF7F;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #6FA063;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-done:active{transform:translateY(3px);box-shadow:0 2px 0 #6FA063}
#btn-done svg{width:46px;height:46px}
body.paying #btn-checkout{display:none}

/* ---------- 飞行商品（货架→篮子）/ 硬币（顾客→柜台） ---------- */
.fly-item{position:fixed;z-index:50;width:46px;height:46px;pointer-events:none;transition:left .38s ease,top .38s ease,transform .38s ease}
.fly-item svg{width:100%;height:100%}
#coin{position:fixed;z-index:50;width:44px;height:44px;pointer-events:none;opacity:0;transition:left .35s ease,top .35s ease,opacity .3s}
#coin.show{opacity:1}

/* ---------- verify 模式：禁用过渡/动画（bbox 量测确定性——入场 scale 过渡会截出 65px 假值） ---------- */
body.verify *{transition:none !important;animation:none !important}

/* ---------- 错误提示卡：歪头兔 + 循环箭头（灰蓝，双编码，克制） ---------- */
#hintcard{position:fixed;left:50%;bottom:clamp(140px,22vh,260px);transform:translate(-50%,30px) scale(.7);
  background:#FFF9EE;border:2.5px solid #8A9BAE;border-radius:20px;padding:10px 18px;display:flex;align-items:center;gap:12px;
  opacity:0;transition:all .3s cubic-bezier(.2,1.6,.4,1);z-index:60;pointer-events:none}
#hintcard.show{opacity:1;transform:translate(-50%,0) scale(1)}
#hintcard .rabbit-tilt svg{animation:tilt 1.1s ease-in-out 2;transform-origin:50% 80%}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(9deg)}75%{transform:rotate(-5deg)}}
#hintcard .retry-ic svg{width:44px;height:44px}

/* 正确勾图标浮出（绿，双编码） */
#okmark{position:fixed;z-index:60;left:50%;bottom:clamp(150px,24vh,260px);transform:translate(-50%,0) scale(.4);opacity:0;
  pointer-events:none;transition:transform .3s cubic-bezier(.2,1.6,.4,1),opacity .3s}
#okmark.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ---------- 幽灵手指教学 ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* ---------- 打烊卷帘（章节收尾） ---------- */
#shutter{position:fixed;inset:0;z-index:9000;pointer-events:none;overflow:hidden}
#shutter .curtain{position:absolute;left:0;right:0;top:0;height:0;transition:height 1s ease;
  background:repeating-linear-gradient(0deg,#E8B98A 0 26px,#F3E2C8 26px 40px);border-bottom:8px solid #C77A42}
#shutter.play .curtain{height:56%}
#shutter .sign2{position:absolute;left:50%;top:24%;transform:translateX(-50%) scale(.6);opacity:0;transition:all .45s .8s;
  width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center}
#shutter.play .sign2{opacity:1;transform:translateX(-50%) scale(1)}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:40vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 宽屏（≥820px）：舞台顾客更大、底栏限宽居中 */
@media (min-width:820px){
  #stage{--cw:min(40vh,300px)}
  #dock,#shelf{max-width:860px;margin-left:auto;margin-right:auto;width:100%}
}
</style>
</head>
