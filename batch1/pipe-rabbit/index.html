<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>管道小兔子</title>
<style>
:root{
  --cream:#FBF3E4; --paper:#FFF9EE; --ink:#4A3B2E; --orange:#E8975A;
  --green:#8FBF7F; --blue:#8A9BAE; --pink:#F2B8C6; --water:#7FAFD4;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--cream); color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none; -webkit-user-select:none;
}
/* ---------- 顶栏（图形按钮，零文字） ---------- */
#top{display:flex;align-items:center;gap:16px;padding:8px 12px 6px 12px}
#top .tl{display:flex;gap:12px}
.iconbtn{width:72px;height:72px;border:none;border-radius:20px;background:var(--paper);
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .15s}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
.iconbtn svg{width:52px;height:52px;pointer-events:none}
#dots{flex:1;display:flex;justify-content:center;gap:10px}
.dot{width:18px;height:18px;border-radius:50%;background:#EFE3CD;border:2.5px solid #D8C9B4}
.dot.done{background:#F5D78E;border-color:#D9B45C}
.dot.on{background:var(--orange);border-color:#C77A42;transform:scale(1.18)}
#spacerR{width:52px}
/* ---------- 棋盘 ---------- */
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px}
#boardwrap{position:relative}
#board{display:grid;gap:16px;touch-action:none}
.cell{width:var(--cs);height:var(--cs);border-radius:18px;position:relative;background:#F1E9DA;
  box-shadow:inset 0 -3px 0 #E4DAC7}
.cell svg{width:100%;height:100%;display:block;pointer-events:none}
.cell .rot{position:absolute;inset:0;transition:transform .28s cubic-bezier(.25,1.4,.4,1)}
.cell.pipe{ /* 可点管件：白描边 + 投影，与背景强区分 */
  background:#FFFDF7;border:3px solid #FFFFFF;
  box-shadow:0 4px 0 rgba(74,59,46,.16), 0 0 0 1px rgba(74,59,46,.10);
  cursor:pointer}
.cell.empty,.cell.rock{ /* 非交互格降饱和 */
  background:#EFE8DB;box-shadow:inset 0 -2px 0 #E2D8C5;filter:saturate(.62)}
.cell.goal{background:#FFFDF7;border:3px solid #FFFFFF;box-shadow:0 4px 0 rgba(74,59,46,.14)}
.cell.tap{background:#FFFDF7;border:3px solid #FFFFFF;box-shadow:0 4px 0 rgba(74,59,46,.14)}
/* 水流浸润（单次过渡，无频闪） */
.cell .inner{transition:stroke .3s}
.cell.wet .inner{stroke:var(--water)}
.cell .drop{fill:var(--water);opacity:0;transition:opacity .3s}
.cell.wet .drop{opacity:.95}
.cell.goal .sprout{transition:opacity .3s}
.cell.goal.bloom .sprout{opacity:0}
.cell.goal .blossom{transform:scale(0);transform-origin:50px 40px;
  transition:transform .55s cubic-bezier(.2,1.6,.4,1)}
.cell.goal.bloom .blossom{transform:scale(1)}
/* ---------- 幽灵手指（教学示范：2.8s 一轮，慢速无频闪） ---------- */
#finger{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;opacity:0;z-index:60}
#finger.go{animation:tapdemo 2.8s ease-in-out 1}
#finger svg{width:100%;height:100%}
#finger::after{content:"";position:absolute;left:8px;top:8px;width:48px;height:48px;border-radius:50%;
  border:4px solid rgba(255,255,255,.85);opacity:0}
#finger.go::after{animation:ripple 2.8s ease-out 1}
@keyframes tapdemo{
  0%{opacity:0;transform:translateY(-16px)}
  12%{opacity:.92;transform:translateY(0)}
  28%{transform:translateY(5px) scale(.9)}
  50%{transform:translateY(0) scale(1)}
  86%{opacity:.92;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-10px)}
}
@keyframes ripple{
  0%{opacity:0;transform:scale(.3)}
  28%{opacity:.9;transform:scale(.5)}
  60%{opacity:0;transform:scale(1.7)}
  100%{opacity:0;transform:scale(1.7)}
}
/* ---------- 吉祥物兔子（右下角，点击跳） ---------- */
#mascot{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));
  z-index:40;cursor:pointer;line-height:0}
#rabbitBox.hop{animation:hop .6s cubic-bezier(.25,1.5,.4,1)}
@keyframes hop{
  0%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-4deg)}
  60%{transform:translateY(0)}80%{transform:translateY(-8px)}100%{transform:translateY(0)}
}
/* ---------- 关卡地图覆盖层 ---------- */
.m-ov{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:rgba(251,243,228,.96);opacity:0;transition:opacity .3s;overflow:auto;
  padding:20px;touch-action:none}
.m-ov.show{opacity:1}
.m-row{display:flex;gap:16px}
.m-cell{width:76px;height:76px;border:none;border-radius:18px;background:var(--paper);
  box-shadow:0 4px 0 #D8C9B4;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;position:relative}
.m-cell:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
.m-cell.locked{background:#EDE6D8;box-shadow:inset 0 -3px 0 #DFD4BF;cursor:default;filter:saturate(.6)}
.m-cell.passed{background:#F7F0DC;box-shadow:0 4px 0 #D9C98F}
.m-cell.current{outline:4px solid var(--orange);outline-offset:2px}
.m-cell svg{width:52px;height:52px;pointer-events:none}
.m-stars{display:flex;gap:3px;pointer-events:none}
.ms{width:13px;height:13px;background:#E4D9BF;border-radius:50% 50% 50% 2px;transform:rotate(-45deg)}
.ms.on{background:#F0C64F;box-shadow:inset 0 -2px 0 #D9A822}
.m-close{position:absolute;top:14px;right:16px;width:64px;height:64px;border:none;border-radius:18px;
  background:var(--paper);box-shadow:0 4px 0 #D8C9B4;cursor:pointer}
.m-close svg{width:40px;height:40px}
@media (max-width:820px){
  #mascot{transform:scale(.72);transform-origin:bottom right}
  .iconbtn{width:68px;height:68px}
}
#verify-result{display:none}
</style>
</head>
<body>
<header id="top">
  <div class="tl">
    <button id="mapBtn" class="iconbtn" aria-label="关卡地图"></button>
    <button id="replayBtn" class="iconbtn" aria-label="重玩本关"></button>
  </div>
  <div id="dots"></div>
  <div id="spacerR"></div>
</header>
<main id="stage">
  <div id="boardwrap">
    <div id="board"></div>
    <div id="finger">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" fill="rgba(255,255,255,.38)"/>
        <path d="M44 82 V46 q0 -7 6 -7 t6 7 V40 q0 -6 6 -6 t6 6 v22 l6 -7 q4 -5 9 -2 t2 9 l-11 18 q-6 10 -18 10 t-18 -10 q-4 -6 -4 -12"
              fill="#FFFFFF" stroke="#4A3B2E" stroke-width="3" stroke-linejoin="round" opacity=".95"/>
      </svg>
    </div>
  </div>
</main>
<div id="mascot"><div id="rabbitBox"></div></div>
<pre id="verify-result"></pre>
<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS ---------- */
  /* TTS（Task#46 阶段3 2026-09-20 通道删除——与 design/core.js 同步；静态款无构建层直接内嵌改） */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}

  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) { const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o; },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

   { grid: [5,4], start: {x:0,y:2,dir:1}, goals: [{x:1,y:0},{x:4,y:1}],
     cells: [{x:1,y:2,t:'T',rot:0},{x:1,y:1,t:'I',rot:1},{x:2,y:2,t:'I',rot:0},{x:3,y:2,t:'L',rot:3},{x:3,y:1,t:'L',rot:1}], rocks: [{x:2,y:1},{x:4,y:2},{x:1,y:3}] },
   { grid: [5,4], start: {x:0,y:3,dir:1}, goals: [{x:4,y:0}],
     cells: [{x:1,y:3,t:'I',rot:0},{x:2,y:3,t:'T',rot:2},{x:3,y:3,t:'I',rot:0},{x:4,y:3,t:'L',rot:3},{x:4,y:2,t:'I',rot:1},{x:4,y:1,t:'I',rot:1}], rocks: [{x:3,y:0},{x:1,y:2}] },
   { grid: [5,4], start: {x:0,y:2,dir:1}, goals: [{x:4,y:3},{x:4,y:0}],
     cells: [{x:1,y:2,t:'I',rot:0},{x:2,y:2,t:'T',rot:2},{x:2,y:3,t:'L',rot:0},{x:3,y:3,t:'I',rot:0},{x:3,y:2,t:'L',rot:3},{x:3,y:1,t:'L',rot:1},{x:4,y:1,t:'L',rot:3}], rocks: [{x:2,y:0},{x:0,y:1},{x:4,y:2}] }

/* ---------- 几何 ---------- */
const OPEN0 = { I: [1,3], L: [0,1], T: [3,0,1] };
const ROTATABLE = t => t === 'I' || t === 'L' || t === 'T';
const DX = [0,1,0,-1], DY = [-1,0,1,0];
const opp = d => (d + 2) % 4;
const openings = (t, rot) => (OPEN0[t] || []).map(d => (d + rot) % 4);
const K2 = (x, y) => x + ',' + y;

/* ---------- 无限关卡生成（静态 20 关用完后按第一档参数程序生成；2026-09-05 用户实测"内容量不足"反馈） ----------
 * 难度曲线（按生成关全局序号 i，i≥20）：
 *   章号 = floor(i/5)+1（生成关从第 5 章起）；网格 5×4；石头数 = min(4, 1+floor((i-20)/8))；
 *   T 管概率随章号升；路径长度 = 格子数的 50%-80%
 * 确定性：mulberry32(i*7919+101) 做种子，同 idx 永远同关（重玩一致、verify 可检）
 * 算法：先随机铺一条水龙头→花盆的自避免路径（曼哈顿走法，直行加权；DFS 回溯保证必成），
 *       允许少量 T 分叉（接第二盆花或留死口排水）；管型由相邻走向推出（直行=I、转弯=L、分叉=T），
 *       再在非路径格随机放石头（不压路径、不压花盆）——cells 即"解"，加载时照旧随机初始 rot */
const TOTAL_STATIC = LEVELS.reduce((s, c) => s + c.levels.length, 0);      // 20
const CH_LEN = 5;
const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);      // 关卡 key 无限化：章号 1 基（与静态口径一致）
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));   // dayDone 用动态构造（同 shop-math）
function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; } }
const dirBetween = (a, b) => b.x > a.x ? 1 : b.x < a.x ? 3 : b.y < a.y ? 0 : 2;  // 相邻格 a→b 的走向

/* 由开口方向集合反推 {t, rot}（与 OPEN0 的 rot0 开口互逆；对向=I、直角=L、三向=T） */
function typeRotFor(dirs) {
  const ds = [...dirs].sort((a, b) => a - b);
  if (ds.length === 2) {
    if ((ds[0] + 2) % 4 === ds[1]) return { t: 'I', rot: ds[0] % 2 ? 0 : 1 };                        // E/W=rot0、N/S=rot1
    for (let r = 0; r < 4; r++) if (dirs.has(r) && dirs.has((r + 1) % 4)) return { t: 'L', rot: r }; // 直角弯头
  }
  for (let m = 0; m < 4; m++) if (!dirs.has(m)) return { t: 'T', rot: (m + 2) % 4 };                 // 缺 m 口=三通
  return { t: 'I', rot: 0 };
}
/* 自避免随机游走：恰好 len 格（含水龙头格与花盆格）；首步强制向东（水龙头出水口朝右）；
 * 55% 概率优先直行让管路自然；DFS 回溯保证一定能铺到目标长度 */
function saw(W, H, sy, len, rnd) {
  const path = [{ x: 0, y: sy }, { x: 1, y: sy }];
  const used = new Set(path.map(p => K2(p.x, p.y)));
  const shuffled = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
  const dfs = (x, y, lastDir) => {
    if (path.length >= len) return true;
    const others = shuffled([0, 1, 2, 3].filter(d => d !== lastDir));
    const order = rnd() < 0.55 ? [lastDir].concat(others) : shuffled([0, 1, 2, 3]);
    for (const d of order) {
      const nx = x + DX[d], ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || used.has(K2(nx, ny))) continue;
      used.add(K2(nx, ny)); path.push({ x: nx, y: ny });
      if (dfs(nx, ny, d)) return true;
      used.delete(K2(nx, ny)); path.pop();
    }
    return false;
  };
  dfs(1, sy, 1);
  return path;
}
/* 生成第 i 关（i≥20）：返回与静态关同构的数据（grid/start/goals/cells/rocks），cells 的 rot 即解 */
function genLevel(i) {
  const ch = Math.floor(i / CH_LEN) + 1;
  const rnd = mulberry32(i * 7919 + 101);             // 确定性：同 idx 永远同关
  const W = 5, H = 4;                                 // 第 5 章起 5×4（生成关全部 ≥ 第 5 章）
  const len = Math.max(4, Math.round(W * H * (0.5 + rnd() * 0.3)));  // 路径长度=格子数的 50%-80%
  const sy = Math.floor(rnd() * H);
  const path = saw(W, H, sy, len, rnd);
  const onPath = new Set(path.map(p => K2(p.x, p.y)));
  /* 主花盆=路径终点；沿途按概率加 T 分叉：40% 接第二盆花（多出口多目标），60% 留死口排水 */
  const goals = [{ x: path[path.length - 1].x, y: path[path.length - 1].y }];
  const goalCells = new Set(goals.map(g => K2(g.x, g.y)));
  const branch = new Map();                           // 路径格 → 分叉方向
  const tProb = Math.min(0.5, 0.08 + 0.05 * (ch - 5)); // T 管概率随章号升（第 5 章 8% → 第 13 章起封顶 50%）
  for (let k = 1; k < path.length - 1; k++) {
    if (rnd() >= tProb) continue;
    const p = path[k];
    const opts = [0, 1, 2, 3].filter(d => {
      const nx = p.x + DX[d], ny = p.y + DY[d];
      return nx >= 0 && ny >= 0 && nx < W && ny < H && !onPath.has(K2(nx, ny)) && !goalCells.has(K2(nx, ny));
    });
    if (!opts.length) continue;
    const d = opts[Math.floor(rnd() * opts.length)];
    branch.set(K2(p.x, p.y), d);
    if (rnd() < 0.4) { const g = { x: p.x + DX[d], y: p.y + DY[d] }; goals.push(g); goalCells.add(K2(g.x, g.y)); }
  }
  /* 石头：不压路径、不压花盆 */
  const rocks = [];
  const free = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!onPath.has(K2(x, y)) && !goalCells.has(K2(x, y))) free.push({ x: x, y: y });
  }
  for (let n = Math.min(free.length, Math.min(4, 1 + Math.floor((i - 20) / 8))); n > 0; n--) {
    rocks.push(free.splice(Math.floor(rnd() * free.length), 1)[0]);
  }
  /* 管型：由相邻走向推出（含分叉方向） */
  const cells = [];
  for (let k = 1; k < path.length - 1; k++) {
    const dirs = new Set([dirBetween(path[k], path[k - 1]), dirBetween(path[k], path[k + 1])]);
    const bd = branch.get(K2(path[k].x, path[k].y));
    if (bd != null) dirs.add(bd);
    const tr = typeRotFor(dirs);
    cells.push({ x: path[k].x, y: path[k].y, t: tr.t, rot: tr.rot });
  }
  return { grid: [W, H], start: { x: 0, y: sy, dir: 1 }, goals: goals, cells: cells, rocks: rocks, gen: true };
}
/* 全局序号 → 关卡数据（静态 20 关 + 生成关统一入口） */
function getLevel(flat) {
  if (flat < TOTAL_STATIC) return LEVELS[Math.floor(flat / CH_LEN)].levels[flat % CH_LEN];
  return genLevel(flat);
}

/* ---------- 水流 BFS（通关判定核心）
 * 从水龙头出水口出发逐格遍历：
 *  - 越界 / 石头 / 空格：水停
 *  - 花盆 F：任意方向接水即到达（第一档宽容）
 *  - 管件：管口必须对上来水方向（openings 含 opp(来向)）才接得住，
 *          进水后从其余管口流出继续 BFS
 * 返回 {win: 全部花盆到达, order:[{x,y,dist,goal}]}（order 供水流动画排序） */
function flow(level, rotOf) {
  const W = level.grid[0], H = level.grid[1];
  const cellMap = new Map(level.cells.map(c => [K2(c.x, c.y), c]));
  const rocks = new Set((level.rocks || []).map(r => K2(r.x, r.y)));
  const goals = new Set(level.goals.map(g => K2(g.x, g.y)));
  const hit = new Set(), seen = new Set(), order = [];
  const s = level.start;
  const q = [{ x: s.x + DX[s.dir], y: s.y + DY[s.dir], from: opp(s.dir), dist: 0 }];
  while (q.length) {
    const cu = q.shift();
    if (cu.x < 0 || cu.y < 0 || cu.x >= W || cu.y >= H) continue;
    const k = K2(cu.x, cu.y);
    if (rocks.has(k)) continue;
    if (goals.has(k)) { if (!hit.has(k)) { hit.add(k); order.push({ x: cu.x, y: cu.y, dist: cu.dist, goal: true }); } continue; }
    const c = cellMap.get(k);
    if (!c || !ROTATABLE(c.t)) continue;
    const ops = openings(c.t, rotOf(c.x, c.y));
    if (!ops.includes(cu.from)) continue;      // 管口没对上来水方向
    const vk = k + ':' + cu.from;
    if (seen.has(vk)) continue;
    seen.add(vk);
    if (!seen.has(k + ':*')) { seen.add(k + ':*'); order.push({ x: cu.x, y: cu.y, dist: cu.dist }); }
    for (const d of ops) {
      if (d === cu.from) continue;
      q.push({ x: cu.x + DX[d], y: cu.y + DY[d], from: opp(d), dist: cu.dist + 1 });
    }
  }
  return { win: [...goals].every(g => hit.has(g)), order };
}

/* ---------- BFS 求解器（?verify=1 与 PipeSolve 用）
 * 状态 = 各可转管件 rot；I 型只有 2 个有效形态（水平/竖直），状态键压缩为 r&1
 * 单步 = 任选一格顺时针转 90°；BFS 层序保证首次到达连通态即最少步数
 * 管件 ≤11 时 BFS 找最短/捷径解；>11（生成关长路径、L 管占比高）状态空间超预算，
 * 直接返回"构造解"：每根管顺时针转到解 rot（I 管用 180° 对称取近端）——按构造必连通，步数 ≤3n≤200 */
function solve(level, initRot) {
  const pipes = level.cells.filter(c => ROTATABLE(c.t));
  const rm0 = new Map(pipes.map(c => [K2(c.x, c.y), initRot.get(K2(c.x, c.y)) || 0]));
  const test = rm => flow(level, (x, y) => rm.has(K2(x, y)) ? rm.get(K2(x, y)) : 0).win;
  if (test(rm0)) return { steps: 0, clicks: [], mode: 'bfs' };
  if (!pipes.length) return null;
  const canon = () => { /* 构造解：逐管转到解 rot */
    const clicks = []; let steps = 0;
    pipes.forEach(p => {
      const r = initRot.get(K2(p.x, p.y)) || 0, s = p.rot;
      let d = (s - r + 4) % 4;
      if (p.t === 'I') d = Math.min(d, (s + 2 - r + 4) % 4);
      if (d > 0) { clicks.push({ x: p.x, y: p.y, times: d }); steps += d; }
    });
    return { steps, clicks, mode: 'canon' };
  };
  if (pipes.length > 11) return canon();
  const stKey = rs => rs.map((r, i) => pipes[i].t === 'I' ? (r & 1) : r).join('');
  const rots = pipes.map(c => initRot.get(K2(c.x, c.y)) || 0);
  const sk = stKey(rots);
  const visited = new Map(); visited.set(sk, null);
  const queue = [{ rs: rots, key: sk }];
  let head = 0;
  while (head < queue.length && visited.size < 600000) {
    const cs = queue[head++];
    for (let i = 0; i < pipes.length; i++) {
      const nrs = cs.rs.slice(); nrs[i] = (nrs[i] + 1) % 4;
      const nk = stKey(nrs);
      if (visited.has(nk)) continue;
      visited.set(nk, { pk: cs.key, mv: i });
      const rm = new Map(pipes.map((c, j) => [K2(c.x, c.y), nrs[j]]));
      if (test(rm)) {
        const times = new Array(pipes.length).fill(0);
        let steps = 0, k = nk;
        while (visited.get(k)) { const nd = visited.get(k); times[nd.mv]++; steps++; k = nd.pk; }
        const clicks = pipes.map((p, idx) => ({ x: p.x, y: p.y, times: times[idx] })).filter(c => c.times > 0);
        return { steps, clicks, mode: 'bfs' };
      }
      queue.push({ rs: nrs, key: nk });
    }
  }
  return null;
}

/* ---------- ?verify=1 自检：不启动游戏循环、无声音 ----------
 * ① 解状态连通性断言（cells 的 rot 即解，必须全部 PASS）
 * ② 对随机初始 rot 实际 BFS 求解 ×3（步数上限 200）
 * ③ 生成关抽查 i∈{20,25,30,40,60}：确定性（两次生成 deep equal）+ 解状态连通 + 随机初始 rot 可解×3 */
function runVerify() {
  const res = { game: 'pipe-rabbit', levels: {}, gen: {}, pass: true };
  const total = LEVELS.reduce((s, c) => s + c.levels.length, 0);
  LEVELS.forEach((ch, ci) => ch.levels.forEach((lv, li) => {
    const key = (ci + 1) + '-' + li;
    const solRot = new Map(lv.cells.map(c => [K2(c.x, c.y), c.rot]));
    const okSol = flow(lv, (x, y) => solRot.has(K2(x, y)) ? solRot.get(K2(x, y)) : 0).win;
    let maxSteps = -1, solved = 0, appliedWin = 0;
    for (let k = 0; k < 3; k++) {
      const init = new Map(lv.cells.filter(c => ROTATABLE(c.t)).map(c => [K2(c.x, c.y), Math.floor(Math.random() * 4)]));
      const r = solve(lv, init);
      if (r && r.steps <= 200) {
        maxSteps = Math.max(maxSteps, r.steps); solved++;
        const rm = new Map(init);                     /* 应用返回的点击序列后必须真的连通（闭环证明） */
        r.clicks.forEach(cl => rm.set(K2(cl.x, cl.y), (rm.get(K2(cl.x, cl.y)) || 0) + cl.times));
        if (flow(lv, (x, y) => rm.has(K2(x, y)) ? rm.get(K2(x, y)) : 0).win) appliedWin++;
      }
    }
    res.levels[key] = { solutionConnected: okSol, solvableTries: solved + '/3', appliedWin: appliedWin + '/3', maxSteps };
    if (!okSol || solved < 3 || appliedWin < 3) res.pass = false;
  }));
  [20, 25, 30, 40, 60].forEach(i => {
    const g1 = genLevel(i), g2 = genLevel(i);
    const deterministic = JSON.stringify(g1) === JSON.stringify(g2);
    const solRot = new Map(g1.cells.map(c => [K2(c.x, c.y), c.rot]));
    const okSol = flow(g1, (x, y) => solRot.has(K2(x, y)) ? solRot.get(K2(x, y)) : 0).win;
    let maxSteps = -1, solved = 0, appliedWin = 0;
    for (let k = 0; k < 3; k++) {
      const init = new Map(g1.cells.filter(c => ROTATABLE(c.t)).map(c => [K2(c.x, c.y), Math.floor(Math.random() * 4)]));
      const r = solve(g1, init);
      if (r && r.steps <= 200) {
        maxSteps = Math.max(maxSteps, r.steps); solved++;
        const rm = new Map(init);                     /* 应用返回的点击序列后必须真的连通（闭环证明） */
        r.clicks.forEach(cl => rm.set(K2(cl.x, cl.y), (rm.get(K2(cl.x, cl.y)) || 0) + cl.times));
        if (flow(g1, (x, y) => rm.has(K2(x, y)) ? rm.get(K2(x, y)) : 0).win) appliedWin++;
      }
    }
    res.gen[i] = { key: keyOf(i), ch: Math.floor(i / CH_LEN) + 1, cells: g1.cells.length, rocks: g1.rocks.length, goals: g1.goals.length,
      deterministic: deterministic, solutionConnected: okSol, solvableTries: solved + '/3', appliedWin: appliedWin + '/3', maxSteps: maxSteps };
    if (!deterministic || !okSol || solved < 3 || appliedWin < 3) res.pass = false;
  });
  const nAll = total + 5;   // 20 静态 + 5 个生成关抽查
  res.total = nAll;
  const el = document.getElementById('verify-result');
  if (el) el.textContent = JSON.stringify(res);
  document.title = res.pass ? 'VERIFY PASS ' + nAll + '/' + nAll : 'VERIFY FAIL';
}
if (QS.get('verify') === '1') { runVerify(); return; }

/* 最小旋转步数基准（I 管利用对称只需 0/1 步；L/T 只能顺时针） */
function calcMin() {
  let m = 0;
  cellMap.forEach(c => {
    if (!ROTATABLE(c.t)) return;
    const d = (c.solRot - c.curRot + 4) % 4;
    m += c.t === 'I' ? Math.min(d, (d + 2) % 4) : d;
  });
  return Math.max(1, m);
}

/* ---------- SVG 图形库（全内联，圆润描边风 2.5px 暖棕） ---------- */
const INK = '#4A3B2E';
const svgWrap = inner => '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
const flange = (x, y) => '<circle cx="' + x + '" cy="' + y + '" r="14" fill="#EFE3CD" stroke="' + INK + '" stroke-width="2.5"/>' +
  '<circle cx="' + x + '" cy="' + y + '" r="5" fill="#FFF9EE" stroke="' + INK + '" stroke-width="2"/>';
function pipeSVG(t) {
  const drop = '<circle class="drop" cx="50" cy="50" r="7"/>';
  if (t === 'I') return svgWrap(
    '<path class="outer" d="M0 50 H100" stroke="' + INK + '" stroke-width="33" fill="none"/>' +
    '<path class="inner" d="M0 50 H100" stroke="#FFF9EE" stroke-width="25" fill="none"/>' +
    flange(10, 50) + flange(90, 50) + drop);
  if (t === 'L') return svgWrap(
    '<path class="outer" d="M50 0 L50 34 Q50 50 66 50 L100 50" stroke="' + INK + '" stroke-width="33" fill="none" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<path class="inner" d="M50 0 L50 34 Q50 50 66 50 L100 50" stroke="#FFF9EE" stroke-width="25" fill="none" stroke-linejoin="round" stroke-linecap="round"/>' +
    flange(50, 11) + flange(89, 50) + drop);
  /* T 型（rot0 开口 W/N/E） */
  return svgWrap(
    '<path class="outer" d="M0 50 H100 M50 0 V50" stroke="' + INK + '" stroke-width="33" fill="none" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<path class="inner" d="M0 50 H100 M50 0 V50" stroke="#FFF9EE" stroke-width="25" fill="none" stroke-linejoin="round" stroke-linecap="round"/>' +
    flange(11, 50) + flange(50, 11) + flange(89, 50) + drop);
}
/* 水龙头（rot0 出水口朝右；整体随 start.dir 旋转） */
function tapSVG() {
  return svgWrap(
    '<rect x="24" y="36" width="36" height="54" rx="13" fill="#FFF9EE" stroke="' + INK + '" stroke-width="3"/>' +
    '<circle cx="42" cy="27" r="13" fill="#E8975A" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<rect x="39.5" y="8" width="5" height="17" rx="2.5" fill="#E8975A" stroke="' + INK + '" stroke-width="2"/>' +
    '<rect x="55" y="44" width="45" height="19" rx="9.5" fill="#FFF9EE" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<ellipse cx="96" cy="63" rx="5" ry="4" fill="#7FAFD4" stroke="' + INK + '" stroke-width="2"/>');
}
/* 花盆（bloom 后开花：花瓣弹跳缩放，无频闪） */
function potSVG() {
  const petals = [0, 72, 144, 216, 288].map(a => {
    const cx = 50 + 11 * Math.cos(a * Math.PI / 180), cy = 34 + 11 * Math.sin(a * Math.PI / 180);
    return '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="8.5" fill="#F2B8C6" stroke="' + INK + '" stroke-width="2"/>';
  }).join('');
  return svgWrap(
    '<path d="M26 56 h48 l-6 34 q-1 6 -7 6 h-22 q-6 0 -7 -6 z" fill="#E8975A" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<rect x="21" y="48" width="58" height="11" rx="5.5" fill="#F0AF79" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<ellipse cx="50" cy="53" rx="20" ry="3.6" fill="#8A7B6C"/>' +
    '<g class="sprout"><path d="M50 48 V36 M50 40 C46 38 43 35 42 31 M50 42 C54 40 57 37 58 33" stroke="#8FBF7F" stroke-width="4" fill="none" stroke-linecap="round"/></g>' +
    '<g class="blossom">' + petals + '<circle cx="50" cy="34" r="6.5" fill="#F5D78E" stroke="' + INK + '" stroke-width="2"/></g>');
}
function rockSVG() {
  return svgWrap(
    '<ellipse cx="40" cy="60" rx="27" ry="21" fill="#B9B3A8" stroke="#8F877B" stroke-width="2.5"/>' +
    '<ellipse cx="66" cy="68" rx="17" ry="12" fill="#C6C0B5" stroke="#8F877B" stroke-width="2.5"/>' +
    '<path d="M28 50 q6 -8 14 -9" stroke="#DDD8CE" stroke-width="3" fill="none" stroke-linecap="round"/>');
}

/* ---------- 渲染 ---------- */
function renderBoard() {
  const lv = cur.level;
  W = lv.grid[0]; H = lv.grid[1];
  const rocks = new Set((lv.rocks || []).map(r => K2(r.x, r.y)));
  const goals = new Set(lv.goals.map(g => K2(g.x, g.y)));
  board.innerHTML = '';
  cellEls = new Map();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = document.createElement('div');
    d.className = 'cell'; d.dataset.x = x; d.dataset.y = y;
    const k = K2(x, y);
    if (rocks.has(k)) { d.classList.add('rock'); d.innerHTML = rockSVG(); }
    else if (goals.has(k)) { d.classList.add('goal'); d.innerHTML = potSVG(); }
    else if (x === lv.start.x && y === lv.start.y) {
      d.classList.add('tap');
      d.innerHTML = '<div class="rot" style="transform:rotate(' + (lv.start.dir * 90) + 'deg)">' + tapSVG() + '</div>';
    } else {
      const c = cellMap.get(k);
      if (c) {
        d.classList.add('pipe');
        d.innerHTML = '<div class="rot">' + pipeSVG(c.t) + '</div>';
        cellEls.set(k, d);
        applyRot(c);
      } else d.classList.add('empty');
    }
    board.appendChild(d);
  }
  layout();
}
function applyRot(c) {
  const el = cellEls.get(K2(c.x, c.y));
  if (el) el.querySelector('.rot').style.transform = 'rotate(' + (c.visRot * 90) + 'deg)';
}
/* 布局：cell ≥96px（NN/g 儿童触摸研究 ~2cm），上限 172px 防过大 */
function layout() {
  const r = stage.getBoundingClientRect();
  const g = 8;
  const cs = Math.max(96, Math.min(172, Math.floor(Math.min((r.width - g * (W - 1) - 4) / W, (r.height - g * (H - 1) - 4) / H))));
  board.style.setProperty('--cs', cs + 'px');
  board.style.gridTemplateColumns = 'repeat(' + W + ', ' + cs + 'px)';
}
window.addEventListener('resize', () => { if (board.children.length) layout(); });

function updateDots() {
  const box = document.getElementById('dots');
  box.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.className = 'dot' + (i < cur.li ? ' done' : '') + (i === cur.li ? ' on' : '');
    box.appendChild(s);
  }
}

/* ---------- 水流动画（按 BFS 距离逐格浸润；弹跳/缩放无频闪） ---------- */
function waterNoise(dur) {
  const c = KIDS.audio.ctx, v = KIDS.audio._vol();
  if (!c || v <= 0) return;
  const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = c.createBufferSource(); s.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 850;
  const g = c.createGain(); g.gain.value = 0.13 * v;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}
function playFlowVisual(r) {
  r = r || flowOf(cur);
  return new Promise(res => {
    waterNoise(1.8);
    let maxD = 0;
    r.order.forEach(o => {
      maxD = Math.max(maxD, o.dist);
      setTimeout(() => {
        const el = cellEls.get(K2(o.x, o.y)) || board.querySelector('[data-x="' + o.x + '"][data-y="' + o.y + '"]');
        if (!el) return;
        el.classList.add('wet');
        if (o.goal) { el.classList.add('bloom'); KIDS.audio.sfx('pop'); }
      }, 170 * o.dist + 120);
    });
    setTimeout(res, 170 * (maxD + 1) + 750);
  });
}

/* ---------- 幽灵手指（教学"帮"） ---------- */
function hideFinger() { finger.classList.remove('go'); }
function ghostDemo(x, y, stick) {
  const el = board.querySelector('[data-x="' + x + '"][data-y="' + y + '"]');
  if (!el) return;
  const r = el.getBoundingClientRect(), br = boardwrap.getBoundingClientRect();
  finger.style.left = (r.left - br.left + r.width * 0.5) + 'px';
  finger.style.top = (r.top - br.top + r.height * 0.6) + 'px';
  finger.classList.add('go');
  if (!stick) setTimeout(() => { if (!state.firstStep) hideFinger(); }, 2700);   // stick=卡关救援：常驻至点选
}
function ghostDemoTarget(stick) {
  let target = null;
  const needsRot = c => { const d = (c.solRot - c.curRot + 4) % 4; return d !== 0 && !(c.t === 'I' && d === 2); };  // I 管 180° 对称
  cellMap.forEach(c => { if (!target && ROTATABLE(c.t) && needsRot(c)) target = c; });
  if (!target) { cellMap.forEach(c => { if (!target && ROTATABLE(c.t)) target = c; }); }
  if (target) ghostDemo(target.x, target.y, stick);
}
function stopTutorWatcher() { clearInterval(tutorTimer); tutorTimer = null; }
function startTutorWatcher() { // 5 秒无操作再示范一次
  stopTutorWatcher();
  tutorTimer = setInterval(() => {
    if (state.won) { stopTutorWatcher(); return; }
    if (Date.now() - lastAct > 5000 && state.firstStep) ghostDemoTarget();
  }, 1000);
}

/* ---------- 关卡加载（教学关"看-帮-独"三步） ---------- */
function randomizeRots() {
  cellMap.forEach(c => { if (ROTATABLE(c.t)) { c.curRot = rnd4(); c.visRot = c.curRot; } });
}
/* 语音仅前 3 关（2026-09-05 用户反馈"说得太频繁"）：第 4 关起全部静音，仅保留音效与 core 低频语音（章末/日末/休息） */
const sayP = (key, text) => { if (cur && cur.ci * CH_LEN + cur.li < 3) KIDS.voice.play(key, text); };
function loadLevel(ci, li) {
  clearTimeout(checkTimer); stopTutorWatcher(); hideFinger();
  const lv = getLevel(ci * CH_LEN + li);   /* 静态 20 关 + 生成关统一入口 */
  cur = { ci, li, level: lv };
  cellMap = new Map(lv.cells.map(c => [K2(c.x, c.y), { x: c.x, y: c.y, t: c.t, solRot: c.rot, curRot: c.rot, visRot: c.rot }]));
  const teach = (ci === 0 && li === 0);
  state = { clicks: 0, minRot: 1, locked: true, won: false, tutorial: teach, firstStep: teach };
  if (!teach) randomizeRots();
  renderBoard(); updateDots();
  if (teach) {
    const seen = KIDS._save().tutSeen;
    if (!seen) {
      /* 看：首次自动演示连通放水（约 3-5 秒），之后不再自动演示 */
      sayP('pipe_tut_watch', '看！水龙头打开啦，水顺着水管流呀流，花花就开了');
      setTimeout(() => {
        playFlowVisual(flowOf(cur)).then(() => {
          const sv = KIDS._save(); sv.tutSeen = true; KIDS.store.persist();
          sayP('pipe_tut_turn', '现在轮到你啦！点一点水管，让它转一转');
          setTimeout(startHandsOn, 1000);
        });
      }, 1000);
    } else startHandsOn();
  } else {
    state.minRot = calcMin(); state.locked = false;
    sayP('pipe_start', '把水管转一转，让水流到花盆里吧');
    scheduleCheck(); // 随机初始恰为连通时自动放水，不让孩子干等
  }
  /* 帮→独：重置管件随机初始，幽灵手指示范 1 次，5 秒无操作再示范
     教学关=仅 1 根错位（弯管优先）且必不连通：5岁玩家评估"横管看起来已连上、不知道要转哪根"目标感断裂；
     一步可通也与教学 firstStep"第一步成功强化反馈"设计吻合 */
  function startHandsOn() {
    if (state.tutorial) {
      const rots = Array.from(cellMap.values()).filter(c => ROTATABLE(c.t));
      rots.forEach(c => { c.curRot = c.solRot; c.visRot = c.solRot; });
      const pick = rots.find(c => c.t !== 'I') || rots[0];   // 弯管优先（错位断口视觉明显）
      if (pick) { pick.curRot = (pick.solRot + 1) % 4; pick.visRot = pick.curRot; }
    } else randomizeRots();
    renderBoard();
    state.clicks = 0; state.minRot = calcMin(); state.locked = false;
    setTimeout(ghostDemoTarget, 700);
    startTutorWatcher();
  }
}

/* ---------- 交互 ---------- */
function doRotate(c, sound) {
  c.curRot = (c.curRot + 1) % 4; c.visRot = (c.visRot + 1) % 4;
  applyRot(c);
  if (sound) KIDS.audio.sfx('click');
  state.clicks++;
}
function onCellTap(c) {
  lastAct = Date.now();
  if (state.locked || state.won) return;
  if (!ROTATABLE(c.t)) return;
  hideFinger();   /* 任何点选=已参与：收救援/示范手指（教玩观察 P1） */
  doRotate(c, true);
  if (state.tutorial && state.firstStep) {
    const d = (c.solRot - c.curRot + 4) % 4;
    const fixed = d === 0 || (c.t === 'I' && d === 2);   /* I 管 180° 对称 */
    if (fixed) { /* 首步转对（教学关唯一错位格）→ 成功强化，停止示范 */
      state.firstStep = false; stopTutorWatcher();
      KIDS.audio.sfx('ok'); hopRabbit();
    } else setTimeout(ghostDemoTarget, 350);   /* 教玩观察 P2：首点旁管≠成功，手指多陪伴一步重新指位 */
  }
  scheduleCheck();
}
function scheduleCheck() { clearTimeout(checkTimer); checkTimer = setTimeout(checkNow, 350); }
function checkNow() {
  if (!cur || state.locked || state.won) return false;
  const r = flowOf(cur);
  if (!r.win) return false;
  winFlow(r); return true;
}
board.addEventListener('pointerdown', e => {
  const cellEl = e.target.closest('.cell');
  if (!cellEl) return;
  const c = cellMap.get(K2(cellEl.dataset.x, cellEl.dataset.y));
  if (c) onCellTap(c);
});

/* ---------- 过关流程 ---------- */
function calcStars() {
  const m = state.minRot || 1;
  return state.clicks <= Math.ceil(m * 1.2) ? 3 : state.clicks <= Math.ceil(m * 2) ? 2 : 1;
}
/* 章末/日末预告：静态 2-4 章沿用手写文案；第 5+ 章=生成关，给"更长的迷宫"类预告 */
const GEN_HINTS = ['更长的水管迷宫哦', '更多石头阵的挑战哦', '弯弯绕绕的三通水管哦', '更大的花园迷宫哦'];
function nextHint(ci) {
  const hints = { 1: '石头阵里继续接水管', 2: '弯弯的三通水管来啦', 3: '最长最绕的大花园' };
  if (ci == null) ci = Math.floor(KIDS.calendar.limit(Infinity) / CH_LEN); /* dayEnd：按下一关（第 lim 关）所在章 */
  if (ci >= 4) return '明天有' + GEN_HINTS[(ci - 4) % GEN_HINTS.length];
  return hints[ci] || '有新的关卡哦';
}
function winFlow(r) {
  state.won = true; state.locked = true;
  stopTutorWatcher(); hideFinger(); clearTimeout(checkTimer);
  const stars = calcStars();
  playFlowVisual(r).then(() => {
    KIDS.audio.sfx('win');
    return KIDS.ui.celebrate(stars);
  }).then(() => {
    const ch = cur.ci + 1, lv = cur.li;
    const pr = KIDS.level.pass(ch, lv, stars, [0, 1, 2, 3, 4]);
    const lim = KIDS.calendar.limit(Infinity);        /* 关卡无限：日历不设内容上限（每日新关+家长加关由 core 控制） */
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: ch, stars: stars5, nextHint: nextHint(cur.ci + 1) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() { /* 进入今日解锁范围内第一个未通关的关（含生成关） */
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { loadLevel(Math.floor(i / CH_LEN), i % CH_LEN); return; }
  }
  /* 全部完成：停留（可重玩/看地图） */
}

/* ---------- 吉祥物兔子 ---------- */
const rabbitBox = document.getElementById('rabbitBox');
rabbitBox.innerHTML = KIDS.assets.rabbit('normal', 150);
function hopRabbit() {
  rabbitBox.classList.remove('hop'); void rabbitBox.offsetWidth; rabbitBox.classList.add('hop');
}
rabbitBox.parentElement.addEventListener('pointerdown', () => {
  hopRabbit(); lastAct = Date.now();
  sayP(cur && state.tutorial ? 'pipe_hint_tut' : 'pipe_start', cur && state.tutorial ? '点一点水管，让它转一转' : '把水管转一转，让水流到花盆里吧');
});

/* ---------- 顶栏按钮（图形无文字） ---------- */
document.getElementById('mapBtn').innerHTML = svgWrap(
  '<rect x="14" y="14" width="32" height="32" rx="8" fill="#E8975A" stroke="' + INK + '" stroke-width="2.5"/>' +
  '<rect x="54" y="14" width="32" height="32" rx="8" fill="#8FBF7F" stroke="' + INK + '" stroke-width="2.5"/>' +
  '<rect x="14" y="54" width="32" height="32" rx="8" fill="#8FBF7F" stroke="' + INK + '" stroke-width="2.5"/>' +
  '<rect x="54" y="54" width="32" height="32" rx="8" fill="#F2B8C6" stroke="' + INK + '" stroke-width="2.5"/>');
document.getElementById('replayBtn').innerHTML = svgWrap(
  '<path d="M76 50 a26 26 0 1 1 -9 -19.7" stroke="' + INK + '" stroke-width="8" fill="none" stroke-linecap="round"/>' +
  '<path d="M62 18 L74 30 L58 36 Z" fill="#E8975A" stroke="' + INK + '" stroke-width="2.5" stroke-linejoin="round"/>');
document.getElementById('mapBtn').addEventListener('pointerdown', openMap);
document.getElementById('replayBtn').addEventListener('pointerdown', () => { lastAct = Date.now(); loadLevel(cur.ci, cur.li); });

/* ---------- 关卡地图覆盖层（路线图：锁/空/星星） ---------- */
function starMini(on) { return '<span class="ms' + (on ? ' on' : '') + '"></span>'; }
function openMap() {
  lastAct = Date.now();
  const ov = document.createElement('div');
  ov.className = 'm-ov';
  const lim = KIDS.calendar.limit(Infinity), sv = KIDS._save();
  const nCh = Math.max(1, Math.ceil(lim / CH_LEN));   /* 地图画到当前进行中的章（生成关章节照常成行，可滚动） */
  const close = document.createElement('button');
  close.className = 'm-close'; close.setAttribute('aria-label', '关闭');
  close.innerHTML = svgWrap('<path d="M30 30 L70 70 M70 30 L30 70" stroke="' + INK + '" stroke-width="9" stroke-linecap="round"/>');
  close.addEventListener('pointerdown', () => ov.remove());
  ov.appendChild(close);
  for (let ci = 0; ci < nCh; ci++) {
    const row = document.createElement('div'); row.className = 'm-row';
    for (let li = 0; li < CH_LEN; li++) {
      const flat = ci * CH_LEN + li, key = (ci + 1) + '-' + li;
      const unlocked = flat < lim, rec = sv.levels[key];
      const b = document.createElement('button');
      b.className = 'm-cell' + (unlocked ? '' : ' locked') + (rec ? ' passed' : '') + (cur && cur.ci === ci && cur.li === li ? ' current' : '');
      b.setAttribute('data-flat', flat);
      let inner = '';
      if (!unlocked) inner = svgWrap('<rect x="30" y="42" width="40" height="32" rx="8" fill="#B9B3A8" stroke="' + INK + '" stroke-width="2.5"/><path d="M50 42 V30 a7 7 0 0 1 7 7" stroke="' + INK + '" stroke-width="5" fill="none" stroke-linecap="round"/>');
      else if (rec) { const n = rec.stars || 0; inner = '<div class="m-stars">' + starMini(n >= 1) + starMini(n >= 2) + starMini(n >= 3) + '</div>'; }
      else inner = svgWrap('<circle cx="50" cy="50" r="16" fill="none" stroke="#D8C9B4" stroke-width="5"/>');
      b.innerHTML = inner;
      if (unlocked) b.addEventListener('pointerdown', () => { ov.remove(); loadLevel(ci, li); });
      row.appendChild(b);
    }
    ov.appendChild(row);
  }
  document.body.appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('show'));
}

/* ---------- 无操作看护：12 秒视觉救援（手指指向需旋转的格子，常驻至点选）；20 秒轻声提示目标 ---------- */
setInterval(() => {
  if (!cur || state.won || state.locked) return;
  const idle = Date.now() - lastAct;
  if (idle > 20000) {
    sayP('pipe_start', '把水管转一转，让水流到花盆里吧');
    lastAct = Date.now();
    return;
  }
  if (idle > 12000 && !finger.classList.contains('go')) ghostDemoTarget(true);   /* 教玩观察 P1：非教学关卡住无 DOM 救援（语音仅前 3 关） */
}, 2000);

/* ---------- 集成验收钩子 ---------- */
window.GAME = {
  get currentLevel() { return cur ? (cur.ci + 1) + '-' + cur.li : null; },
  get cells() { return cur ? [...cellMap.values()].map(c => ({ x: c.x, y: c.y, t: c.t, rot: c.curRot, solRot: c.solRot })) : []; },
  rotate(x, y) { const c = cellMap.get(K2(x, y)); if (c) onCellTap(c); },
  checkWin() { return checkNow(); }
};
window.PipeSolve = (chIdx, lvIdx) => { /* 章号 0 基；第 5+ 章（生成关）同样可解 */
  if (chIdx < 0 || lvIdx < 0 || lvIdx >= CH_LEN) return null;
  if (!cur || cur.ci !== chIdx || cur.li !== lvIdx) loadLevel(chIdx, lvIdx);
  const init = new Map([...cellMap.values()].filter(c => ROTATABLE(c.t)).map(c => [K2(c.x, c.y), c.curRot]));
  const r = solve(cur.level, init);
  if (!r) return null;
  let seq = r.clicks;
  if (!seq.length) { /* 开局即连通：转一整圈（4 次）触发交互与胜利 */
    const c = cur.level.cells.find(c => ROTATABLE(c.t));
    if (c) seq = [{ x: c.x, y: c.y, times: 4 }];
  }
  return seq;
};

/* ---------- 启动：首次直接进教学关；有进度则进今日第一个未完成关 ---------- */
(function start() {
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  let ci = 0, li = 0;
  if (Object.keys(sv.levels).length) {
    for (let i = 0; i < lim; i++) { if (!sv.levels[keys[i]]) { ci = Math.floor(i / CH_LEN); li = i % CH_LEN; break; } }
  }
  loadLevel(ci, li);
})();
})();

</script>
