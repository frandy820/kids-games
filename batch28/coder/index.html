<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>指令小兔</title>
<style>
/* ================= 指令小兔 coder（batch28）=================
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E；
   6-7 岁幼小衔接段：题面 = 草地网格（ch1/2 3×3，ch3 起 4×4——r40 扩容；
   小兔 / 萝卜 / 石头 SVG）+ 题面句文字条；
   下方方向指令卡（箭头 SVG + 汉字，封闭 4 方向）或 path 题 3-4 格候选卡。
   点一张方向卡 = 小兔走一格（走格动画 + transition）；到达萝卜 = right（殊途同达合法）；
   撞石头 / 出界 = 该卡吞（卡灰飞 + 小兔朝向顶一下 + 「往这边走不过去哦」TTS，不记 miss）；
   卡池点完未到达 = wrong + miss + 复位（小兔回起点、卡池恢复）。
   path 题（ch3+）：题面指令条按序展示 2-3 步箭头 + 语音念，「小兔子会走到哪？」3/4 格卡。
   触摸目标：网格格 ≥72×72、指令/格候选卡 ≥64×64（§0.9 本款口径；4×4 档格 72.75-73.75）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 50px;display:flex;align-items:center;padding:5px 60px 0 14px;gap:14px}
#logo{width:40px;height:40px;border-radius:12px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 40px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面卡（网格 + 题面句）→ 指令卡 / 格候选卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:6px 12px}

/* 题面卡：可点重听题面；题面句条 + 3×3 网格 */
#scene{position:relative;width:min(400px,94vw);border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;overflow:hidden;padding:10px 12px 12px;
  transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene .q-text{position:relative;z-index:3;margin:0 auto 8px;width:max-content;max-width:100%;
  background:#FBF6EC;border:2.5px solid #4A3B2E;border-radius:16px;
  padding:4px 18px;font-size:23px;font-weight:700;letter-spacing:1px;white-space:nowrap}
/* path 题指令条：按序 2-3 步箭头（卡面顺序展示 + 语音念——SPEC §1；r40 seq3 三张卡 188px 内） */
#scene .seq-strip{position:relative;z-index:3;display:flex;gap:10px;justify-content:center;margin:0 0 8px}
#scene .seq-card{position:relative;width:56px;height:56px;border-radius:14px;background:#FBF6EC;
  border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;animation:seq-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
#scene .seq-card svg{width:38px;height:38px}
#scene .seq-card .seq-no{position:absolute;left:-7px;top:-7px;width:20px;height:20px;border-radius:50%;
  background:#E8975A;border:2px solid #4A3B2E;color:#FFF9EE;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
@keyframes seq-in{from{transform:scale(.3) translateY(-12px);opacity:0}to{transform:scale(1);opacity:1}}
/* 3×3 网格：格 ≥72×72（触摸目标）；草地浅绿格；r40：ch3 起 .g4 四列大草地（格 73.75 ≥72） */
#scene .grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);
  grid-auto-rows:1fr;gap:7px;width:300px;height:300px;margin:0 auto}
#scene .grid.g4{grid-template-columns:repeat(4,1fr);width:316px;height:316px}
#scene .cell{position:relative;border-radius:14px;background:#EAF2DC;
  border:2.5px solid #C9CFA9;display:flex;align-items:center;justify-content:center}
#scene .cell svg{width:74%;height:74%}
#scene .cell.stone{background:#E4E2DC}
#scene .cell.goal-cell{background:#FDE8C8}
/* 小兔：绝对定位于网格，left/top 按格心 transition（走格动画）；g4 档缩小防越格 */
#scene .bun{position:absolute;z-index:5;width:86px;height:86px;left:0;top:0;
  transition:left .35s cubic-bezier(.3,1.2,.4,1),top .35s cubic-bezier(.3,1.2,.4,1);
  display:flex;align-items:center;justify-content:center;pointer-events:none}
#scene .bun svg{width:76px;height:76px;filter:drop-shadow(0 3px 0 rgba(74,59,46,.2))}
#scene .grid.g4 .bun{width:68px;height:68px}
#scene .grid.g4 .bun svg{width:60px;height:60px}
/* 撞石头 / 出界：小兔朝该方向顶一下弹回（4 向 nudge） */
#scene .bun.nudge-up{animation:nd-up .38s ease}
#scene .bun.nudge-down{animation:nd-down .38s ease}
#scene .bun.nudge-left{animation:nd-left .38s ease}
#scene .bun.nudge-right{animation:nd-right .38s ease}
@keyframes nd-up{0%,100%{margin-top:0}45%{margin-top:-20px}}
@keyframes nd-down{0%,100%{margin-top:0}45%{margin-top:20px}}
@keyframes nd-left{0%,100%{margin-left:0}45%{margin-left:-20px}}
@keyframes nd-right{0%,100%{margin-left:0}45%{margin-left:20px}}
/* 到达萝卜：小兔开心连跳 */
#scene .bun.reach{animation:bun-reach .55s cubic-bezier(.2,1.6,.4,1) 2}
@keyframes bun-reach{0%,100%{margin-top:0}40%{margin-top:-16px}}
/* 萝卜到达演出：萝卜摇摆放大 */
#scene .cell .carrot-lit{animation:carrot-lit .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes carrot-lit{0%,100%{transform:scale(1)}45%{transform:scale(1.25) rotate(-6deg)}}
/* 救援方向级：题面卡 pulse（呼吸放大 3 次） */
#scene.pulse{animation:scene-pulse 1s ease-in-out 3}
@keyframes scene-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#scene.bounce{animation:scene-b .4s ease}
@keyframes scene-b{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}

/* ---------- 指令卡排（run）：方向卡=箭头 SVG + 汉字，≥64×64；
   格候选卡排（path）：mini 3×3/4×4 网格标记候选格；吞输入=容器 bump；
   r40：flex-wrap 防溢出安全网 + .many 紧凑档（run 池 ≥5 张：6×80+5×14=550≤640 单行） ---------- */
#board{display:flex;flex-wrap:wrap;row-gap:10px;gap:14px;justify-content:center;align-items:stretch;
  flex:0 0 auto;width:100%;max-width:640px;padding:0 2px}
#board.bump{animation:board-bump .22s ease}
@keyframes board-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:20px;
  box-shadow:0 5px 0 #D8C9B4;flex:0 0 auto;width:96px;min-height:118px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .15s;overflow:hidden}
/* r40 紧凑档（dch3/4 run 池 5-6 张）：≥64 触摸地板保持 */
#board.many .card{width:80px;min-height:106px;border-radius:17px}
#board.many .card .arrow svg{width:44px;height:44px}
#board.many .card .d-label{font-size:21px;letter-spacing:1px}
.card:active{transform:translateY(3px)}
.card .arrow{width:54px;height:54px;display:flex;align-items:center;justify-content:center}
.card .arrow svg{width:52px;height:52px}
.card .d-label{font-size:24px;font-weight:700;letter-spacing:2px}
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.card.bump{animation:card-bump .22s ease}
@keyframes card-bump{0%,100%{transform:scale(1)}45%{transform:scale(.94)}}
/* 卡吞（撞石 / 出界）：灰缩飞走（该卡消耗掉，不记 miss——探索豁免） */
.card.spent{opacity:.3;transform:scale(.88);filter:grayscale(.9);pointer-events:none;
  animation:card-spent .45s ease}
@keyframes card-spent{0%{transform:scale(1);opacity:1}55%{transform:scale(1.14) rotate(6deg);opacity:.7}
  100%{transform:scale(.88) rotate(4deg);opacity:.3}}
/* run 卡池消耗（moved 后正常用掉的卡）：轻灰 */
.card.used-up{opacity:.45;filter:grayscale(.5)}
/* 答对：卡绿 + 弹 */
.card.lit{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;
  animation:card-lit .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes card-lit{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 答错：摇头晃动（不灰掉可重选——探索不罚） */
.card.wig{animation:an-wig .6s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}22%{transform:rotate(-8deg) translateX(-4px)}
  50%{transform:rotate(7deg) translateX(3px)}78%{transform:rotate(-4deg) translateX(-2px)}}
/* 30s 答案级救援：应点卡呼吸高亮循环（§0.21） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* path 格候选卡：mini 3×3 网格（66×66）+ 高亮格；r40：.m4 四列档（74×74 与 4×4 真网格同构） */
.card .mini{width:66px;height:66px;border-radius:10px;background:#FBF6EC;
  border:2px solid #4A3B2E;padding:5px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.card .mini.m4{width:74px;height:74px;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px}
.card .mini i{border-radius:4px;background:#EAF2DC}
.card .mini i.mk{background:#E8975A;border:1.5px solid #4A3B2E}
.card .g-label{font-size:15px;font-weight:700;margin-top:5px;color:#8A7B66}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-27） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：网格与卡适配，格仍 ≥72、卡 ≥64（r40：g4 档 312px 格 72.75、many 档 76px——r40 审查 m3 勘正：与下行 width:76px 一致） */
@media (orientation:portrait){
  #scene .q-text{font-size:20px;padding:3px 14px}
  #scene .grid{width:288px;height:288px}
  #scene .grid.g4{width:312px;height:312px}
  #scene .bun{width:82px;height:82px}
  #scene .bun svg{width:72px;height:72px}
  #scene .grid.g4 .bun{width:66px;height:66px}
  #scene .grid.g4 .bun svg{width:58px;height:58px}
  #board{gap:11px}
  .card{width:88px;min-height:110px}
  .card .arrow svg{width:48px;height:48px}
  .card .d-label{font-size:22px}
  #board.many .card{width:76px;min-height:102px}
  #board.many .card .arrow svg{width:40px;height:40px}
  #board.many .card .d-label{font-size:19px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="指令小兔">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="帮小兔子走到萝卜，点我再听一遍"></button>
    <div id="board" aria-label="方向指令卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= coder 纯引擎：确定性关卡生成 + 指令卡点选判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 31)：同 flat 永远同关（重玩一致、verify 可检）。
   章型（SPEC-BATCH28 §0.67/§1 + SPEC-R40-CODER §R2；进度章号单调递增、难度章号 (ch-1)%4+1 循环）：
     dch1 两步走（3×3）：run dist=2，卡池 2 张，无石头（flat0 题0 教学锚点 dist=1 池=[上] 唯一例外）
     dch2 三步走（3×3）：run dist=3，卡池 3 张，无石头
     dch3 四格大棋盘+预测（4×4）：run dist=4 卡池 4（题序奇数位 +1 张干扰=5）+ 恒 1 石头；
           path 预测题混出（每关 ≥2 path，全 5 翻 1 保混合），path 恒 1 石头，
           seq lv0-1=2（引入坡）/ lv2-4=3（r40 主轴：预测序列加长）
     dch4 大挑战（4×4）：run dist=5 + 石头 1-2 + 奇数位干扰；path seq 恒 3，石头 0-2，混出同 dch3
   生成关（flat≥20）：每关随机章参数 dch=ri(1,4)（先取数保确定性——b25 坑④ verify 钩子直读）。
   r25 M2 判定层单步铁律（SPEC-R40 §R1 论证）：engTapCard 单步原子判定不动，扩容只加长
   原子判定序列（run dist 2-5）与被模拟指令序列（path seq 2-3），无新中间态判定层。
   卡池数学先验（§0.67，出题器即验证——structWhy 同款校验双保险）：
     ① 卡池 = 一条最短路径的指令多重集（dist=曼哈顿距离=步数）± 干扰 1 张（ch3+ 奇数位），
        加入干扰后 DFS 复验「卡池多重集可拼出 ≥1 条合法到达路径」（poolReach）；
     ② 石头不挡死全部路径：至少一条最短路径存活（shortestPaths 非空——卡池步数=dist，
        合法到达路径必为最短路，故最短路存活即全部路径不被挡死）；
     ③ 起终点不相邻（dist≥2 天然满足；flat0 题0 锚点 dist=1 唯一例外）。
   path 题：seq 2-3 步指令（各中间格+落点均界内非石；seq3 约束 d2≠opp(d1) 保中间格2≠起点
   ——「少走一步」陷阱格恒合法在场；d3=−d2 回折落点=中间格1 为合法陷阱态）；
   opts=seq+1 格候选：seq2 3 格=落点+中间格+随机 1 格；seq3 4 格=落点+末段中间格+首段中间格
   （与落点重复则去重）+随机补足（均非 start 非石互异——「少走一步/两步」双陷阱在场）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 网格工具（r40：g∈{3,4}——ch1/2 3×3，ch3 起 4×4 大草地；(r,c) r=0 顶行 c=0 左列） ---------- */
const CELLS3 = [], CELLS4 = [];
for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
  if (r < 3 && c < 3) CELLS3.push({ r: r, c: c });
  CELLS4.push({ r: r, c: c });
}
const cellsOf = g => g === 4 ? CELLS4 : CELLS3;          // 封闭两档（structWhy 对账 g∈{3,4}）
const inGrid = (p, g) => p.r >= 0 && p.r <= (g || 3) - 1 && p.c >= 0 && p.c <= (g || 3) - 1;
const samePos = (a, b) => !!a && !!b && a.r === b.r && a.c === b.c;
const isStone = (stones, p) => stones.some(s => samePos(s, p));
const distOf = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
const quizKeyOf = q => q.start.r + ',' + q.start.c + '>' + q.goal.r + ',' + q.goal.c;

/* ---------- 全部最短路径枚举（定向 DFS，不回头）：返回存活路径数组（每条=方向序列）
   石头不挡死全部路径 ⟺ 本表非空（合法到达必为 dist 步=最短路——卡池先验） ---------- */
function shortestPaths(start, goal, stones, g) {
  const out = [];
  const walk = (pos, acc) => {
    if (samePos(pos, goal)) { out.push(acc.slice()); return; }
    const moves = [];
    if (goal.r > pos.r) moves.push('down');
    if (goal.r < pos.r) moves.push('up');
    if (goal.c > pos.c) moves.push('right');
    if (goal.c < pos.c) moves.push('left');
    for (let k = 0; k < moves.length; k++) {
      const d = moves[k];
      const nv = { r: pos.r + DIRS[d].dr, c: pos.c + DIRS[d].dc };
      if (!inGrid(nv, g) || isStone(stones, nv)) continue;
      acc.push(d); walk(nv, acc); acc.pop();
    }
  };
  walk({ r: start.r, c: start.c }, []);
  return out;
}

/* ---------- 卡池可达 DFS（structWhy 同款校验）：方向多重集可拼出 ≥1 条合法到达路径
   （到达即停——殊途同达：孩子选对序即可，剩余卡闲置合法） ---------- */
function poolReach(start, goal, stones, dirs, g) {
  const used = dirs.map(() => false);
  const go = pos => {
    if (samePos(pos, goal)) return true;
    for (let i = 0; i < dirs.length; i++) {
      if (used[i]) continue;
      const nv = { r: pos.r + DIRS[dirs[i]].dr, c: pos.c + DIRS[dirs[i]].dc };
      if (!inGrid(nv, g) || isStone(stones, nv)) continue;
      used[i] = true;
      const ok = go(nv);
      used[i] = false;
      if (ok) return true;
    }
    return false;
  };
  return go({ r: start.r, c: start.c });
}

/* ---------- 每关题序表（genLevel 预生成；rnd 同流保确定性）
   r40 阶梯（SPEC §R2）：dch1 dist2 / dch2 dist3 / dch3 run dist4 / dch4 run dist5（dch4 原
   ri(2,3) 取数删除——rnd 流消耗变化=谱更新预期内；dch1/2 分支零 rnd 消耗，锚面不动）
   dch3/dch4 path 混出：掷硬币标 path 题，每关 ≥2 path（全 path 时翻 1 保混合）；
   path seq 由 (dch,lv) 表（pathSeqOf）：dch3 lv0-1=2 引入坡，lv2 起与 dch4 恒 3
   run 干扰位=题序奇数位（qi%2===1，确定性可硬断言——ch3+ 每 run 关 ≥2 干扰位） ---------- */
function specSeqOf(dch, rnd, lv) {
  const seq = [];
  if (dch === 1) {
    for (let qi = 0; qi < CH_LEN; qi++) seq.push({ kind: 'run', dist: 2, stone: 0, distract: false, g: 3 });
    return seq;
  }
  if (dch === 2) {
    for (let qi = 0; qi < CH_LEN; qi++) seq.push({ kind: 'run', dist: 3, stone: 0, distract: false, g: 3 });
    return seq;
  }
  if (dch === 3 || dch === 4) {
    const flags = [];
    for (let qi = 0; qi < CH_LEN; qi++) flags.push(rnd() < 0.5);
    let cnt = flags.filter(Boolean).length;
    if (cnt < 2) {                                        // path 题 <2 → 补足（每关 ≥2）
      for (let i = 0; i < CH_LEN && cnt < 2; i++) if (!flags[i]) { flags[i] = true; cnt++; }
    } else if (cnt === CH_LEN) {                          // 全 path → 翻 1 题 run（保"混合"）
      flags[1] = false;
    }
    for (let qi = 0; qi < CH_LEN; qi++) {
      if (flags[qi]) seq.push({ kind: 'path', stone: dch === 3 ? 1 : ri(rnd, 0, 2),
                                seqN: pathSeqOf(dch, lv), g: 4 });
      else seq.push({ kind: 'run', dist: dch === 3 ? 4 : 5,
                      stone: dch === 3 ? 1 : ri(rnd, 1, 2), distract: qi % 2 === 1, g: 4 });
    }
    return seq;
  }
  return seq;
}

/* ---------- 干扰卡注入（≤8 掷换向，复验可达；全败弃干扰=池=路径多重集仍合法） ---------- */
function tryDistract(start, goal, stones, baseDirs, rnd, g) {
  for (let t = 0; t < 8; t++) {
    const ex = DIR_KEYS[Math.floor(rnd() * 4)];
    if (poolReach(start, goal, stones, baseDirs.concat([ex]), g))
      return { dirs: baseDirs.concat([ex]), distract: true };
  }
  return { dirs: baseDirs, distract: false };
}

/* ---------- 单题构建（r40：spec 携 g/seqN；q.g 全题落盘供 UI/verify 对账） ---------- */
function buildQuiz(spec, dch, rnd, flat, qi, prevQ) {
  /* flat0 题0 教学演示锚点：start(1,1)→goal(0,1) dist=1 卡池=[上]（幽灵手指点「上」卡）——
     r40 唯一 dist=1（教学机制锚面，新 dist 阶梯在 structWhy 显式豁免本题） */
  if (flat === 0 && qi === 0 && spec.kind === 'run') {
    return { kind: 'run', start: { r: 1, c: 1 }, goal: { r: 0, c: 1 }, stones: [],
             pool: [{ id: 'p0', dir: 'up', used: false }], distract: false, g: 3,
             walked: { r: 1, c: 1 }, _miss: 0, _answered: false };
  }

  if (spec.kind === 'run') {
    const g = spec.g || 3, cells = cellsOf(g);
    let q = null;
    for (let t = 0; t < 8 && !q; t++) {
      const start = cells[Math.floor(rnd() * cells.length)];
      const cands = cells.filter(p => distOf(start, p) === spec.dist);
      if (!cands.length) continue;
      const goal = cands[Math.floor(rnd() * cands.length)];
      const key = quizKeyOf({ start: start, goal: goal });
      if (prevQ && quizKeyOf(prevQ) === key && t < 7) continue;      // 相邻题布局互异（末掷兜底放行）
      /* 石头摆放：逐块试放（非起终点），放后须有最短路径存活 */
      const stones = [];
      const freeShuffled = shuffled(cells.filter(p => !samePos(p, start) && !samePos(p, goal)), rnd);
      for (let k = 0; k < freeShuffled.length && stones.length < spec.stone; k++) {
        const trial = stones.concat([freeShuffled[k]]);
        if (shortestPaths(start, goal, trial, g).length) stones.push(freeShuffled[k]);
      }
      if (stones.length < spec.stone) continue;                      // 石头数不足 → 整题重掷
      /* 卡池源：存活最短路随机一条（指令多重集）± 干扰（奇数位，复验可达） */
      const alive = shortestPaths(start, goal, stones, g);
      if (!alive.length) continue;
      const base = alive[Math.floor(rnd() * alive.length)].slice();
      const dk = spec.distract ? tryDistract(start, goal, stones, base, rnd, g)
                               : { dirs: base, distract: false };
      const pool = shuffled(dk.dirs, rnd).map((d, j) => ({ id: 'p' + j, dir: d, used: false }));
      q = { kind: 'run', start: start, goal: goal, stones: stones, pool: pool,
            distract: dk.distract, g: g, walked: { r: start.r, c: start.c },
            _miss: 0, _answered: false };
    }
    if (q) return q;
    /* 兜底（理论不可达）：左上角起点 + 无碰撞布局 + 离路石头 + 干扰复验（r40 阶梯 2-5 全表） */
    const start = { r: 0, c: 0 };
    const goalMap = { 2: { r: 1, c: 1 }, 3: { r: 1, c: 2 }, 4: { r: 2, c: 2 }, 5: { r: 3, c: 2 } };
    const goal = goalMap[spec.dist] || goalMap[2];
    const alive = shortestPaths(start, goal, [], g);
    const onPath = {};
    alive.forEach(p => { let pp = { r: start.r, c: start.c };
      p.forEach(d => { pp = { r: pp.r + DIRS[d].dr, c: pp.c + DIRS[d].dc }; onPath[pp.r + ',' + pp.c] = 1; }); });
    const stones = cellsOf(g).filter(p => !samePos(p, start) && !samePos(p, goal) && !onPath[p.r + ',' + p.c])
                        .slice(0, spec.stone);
    const base = alive[0].slice();
    const dk = spec.distract ? tryDistract(start, goal, stones, base, rnd, g)
                             : { dirs: base, distract: false };
    return { kind: 'run', start: start, goal: goal, stones: stones,
             pool: shuffled(dk.dirs, rnd).map((d, j) => ({ id: 'p' + j, dir: d, used: false })),
             distract: dk.distract, g: g, walked: { r: start.r, c: start.c }, _miss: 0, _answered: false };
  }

  /* ---- path 预测题：seq 2-3 步指令（各中间格界内非石）+ seq+1 格候选（双陷阱在场）
         seq3 生成约束（SPEC §R2）：d2≠opp(d1)（中间格2≠起点——末段陷阱格恒合法）；
         d3 不限（d3=−d2 回折落点=中间格1 为合法陷阱态，候选去重后随机补足） ---- */
  const g = spec.g || 3, cells = cellsOf(g);
  for (let t = 0; t < 8; t++) {
    const start = cells[Math.floor(rnd() * cells.length)];
    const seq = [], walked = [{ r: start.r, c: start.c }];
    let ok = true;
    for (let s = 0; s < spec.seqN && ok; s++) {
      const pool = DIR_KEYS.filter(dk => {
        if (s === 1 && DIRS[dk].dr === -DIRS[seq[0]].dr && DIRS[dk].dc === -DIRS[seq[0]].dc)
          return false;                                              // d2≠opp(d1)（seq3 陷阱格保障）
        const nv = { r: walked[s].r + DIRS[dk].dr, c: walked[s].c + DIRS[dk].dc };
        return inGrid(nv, g);                                        // 中间格/落点界内（石后摆）
      });
      if (!pool.length) { ok = false; break; }
      const d = pool[Math.floor(rnd() * pool.length)];
      seq.push(d);
      walked.push({ r: walked[s].r + DIRS[d].dr, c: walked[s].c + DIRS[d].dc });
    }
    if (!ok) continue;
    const ans = walked[spec.seqN];
    if (samePos(ans, start)) continue;                                // 落点=起点：起终重合歧义，禁
    const key = start.r + ',' + start.c + '>' + ans.r + ',' + ans.c;
    if (prevQ && quizKeyOf(prevQ) === key && t < 7) continue;
    /* 石头：避开 start/seq 各中间格/落点——seq 合法性即保证 */
    const stones = shuffled(cells.filter(p => !walked.some(w => samePos(w, p))), rnd).slice(0, spec.stone);
    /* 候选种子：落点 + 末段中间格 + 首段中间格（seq3；去重）——「少走一步/两步」双陷阱在场 */
    const seeds = [ans, walked[spec.seqN - 1]];
    if (spec.seqN === 3 && !samePos(walked[1], ans)) seeds.push(walked[1]);   // 回折落点=中间格1 去重
    const seedKeys = seeds.map(p => p.r + ',' + p.c);
    /* 随机补足格：非 start/种子/石头格，补到 seq+1 张 */
    const fillPool = cells.filter(p => !samePos(p, start) && !isStone(stones, p) &&
                                       seedKeys.indexOf(p.r + ',' + p.c) < 0);
    if (seeds.length + fillPool.length < spec.seqN + 1) continue;    // 补足不足 → 重掷
    const opts = shuffled(seeds.concat(shuffled(fillPool, rnd).slice(0, spec.seqN + 1 - seeds.length))
                                .map(p => ({ r: p.r, c: p.c })), rnd);
    const answer = opts.findIndex(o => samePos(o, ans));
    return { kind: 'path', start: start, goal: { r: ans.r, c: ans.c }, stones: stones,
             seq: seq, opts: opts, answer: answer, g: g, _miss: 0, _answered: false };
  }
  /* 兜底 path（理论不可达）：右下两步（(0,0)→(0,1)→(1,1)，界内恒成立；石头离路摆放；
     r40：g=4 时落 (0,2) 石离路——两档网格各自合法。
     本兜底固定 seq2/opts3 与 spec.seqN 脱钩（r40 审查 m8）：dch4 恒 seq3 下若真走到此分支，
     产物会被 structWhy 拒绝=红——fail-loud 非静默放行，理论不可达故不设 seqN 感知 */
  const pStart = { r: 0, c: 0 };
  const pStones = spec.stone >= 1 ? [g === 4 ? { r: 3, c: 0 } : { r: 2, c: 0 }] : [];
  if (spec.stone >= 2) pStones.push(g === 4 ? { r: 3, c: 3 } : { r: 2, c: 2 });
  return { kind: 'path', start: pStart, goal: { r: 1, c: 1 }, stones: pStones,
           seq: ['right', 'down'], g: g,
           opts: [{ r: 1, c: 1 }, { r: 0, c: 1 }, { r: 0, c: 2 }], answer: 0,
           _miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   生成关 dch 取数前 burn 一掷：mulberry32(flat*7919+31) 首掷对 4 有系统偏差
   （flat20-39 首掷 20 连 0 个 dch4 实测——ch4 型生成关绝迹）；burn 后四型全现
   （实测 2/7/6/5），burn+ri 仍是该 rnd 流固定首个消耗——确定性保持（b25 坑④） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 31);
  if (flat >= STATIC_LEVELS) rnd();                          // burn：首掷偏差修正（仅生成关消耗）
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const specs = specSeqOf(dch, rnd, lv);                     // r40：lv 入参（path seq 坡表）
  const quizzes = [];
  let prev = null;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = buildQuiz(specs[qi], dch, rnd, flat, qi, prev);
    quizzes.push(q);
    prev = q;
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, g: specs[0] ? (specs[0].g || 3) : 3,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点指令卡引擎（无 DOM）：engTapCard(L, i) —— 点第 i 张卡（run=pool / path=opts 下标）
   'right' 答对且本题完成推进 / 'done' 答对且末题=通关
   'moved' run 执行一步合法但未到达（内部值——autoSolve 逐步依赖）
   'wrong' run 卡池点完未到达（miss+1+复位：小兔回起点卡池全恢复）/ path 点错格（miss+1）
   'false' 撞石头或出界=该卡吞（卡消耗，不记 miss——探索性惩罚豁免）
   null    非法下标 / 已用卡 / 关卡已结束 ---------- */
function engTapCard(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (q.kind === 'path') {
    if (!Number.isInteger(i) || i < 0 || i >= q.opts.length) return null;
    if (i === q.answer) {
      q._answered = true;
      L.step++;
      if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
      return 'right';
    }
    q._miss++;
    L.retries++;
    return 'wrong';
  }
  if (!Number.isInteger(i) || i < 0 || i >= q.pool.length) return null;
  const card = q.pool[i];
  if (card.used) return null;                               // 已吞/已用卡=无效点击
  const d = DIRS[card.dir];
  const nv = { r: q.walked.r + d.dr, c: q.walked.c + d.dc };
  if (!inGrid(nv, q.g) || isStone(q.stones, nv)) {
    card.used = true;                                       // 撞石/出界：该卡吞（不记 miss）
    if (q.pool.some(c => !c.used)) return 'false';          // 还剩卡：吞卡探索继续
    q._miss++;                                              // r40 试玩 B1：末卡撞石吞尽=卡尽死锁（池尽/救援无解/儿童无法自救）
    L.retries++;                                            // →与「移动后卡尽」同构 wrong 复位（miss+1+小兔回起点+池全恢复）
    q.walked = { r: q.start.r, c: q.start.c };
    q.pool.forEach(c => { c.used = false; });
    return 'wrong';
  }
  card.used = true;
  q.walked = nv;
  if (samePos(nv, q.goal)) {                                // 到达萝卜即 right（殊途同达合法）
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  if (q.pool.some(c => !c.used)) return 'moved';            // 还剩卡：等下一步指令
  q._miss++;                                                // 卡池尽未到达：wrong+复位重来
  L.retries++;
  q.walked = { r: q.start.r, c: q.start.c };
  q.pool.forEach(c => { c.used = false; });
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（§0.67 口径）：全关 miss 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));

/* ---------- run 求解器（DFS 找一条可行到达路径的首步）：教学帮指/答案级救援/autoSolve 共用
   返回应点卡的 pool 下标，无解=-1（撞石吞卡后可能死局——UI 层重走 wrong 复位兜底） ---------- */
function solveNext(q) {
  if (!q || q.kind !== 'run') return -1;
  const n = q.pool.length;
  const mask0 = q.pool.reduce((m, c, i) => m | (c.used ? (1 << i) : 0), 0);
  const go = (pos, mask) => {
    if (samePos(pos, q.goal)) return [];
    for (let i = 0; i < n; i++) {
      if (mask & (1 << i)) continue;
      const d = DIRS[q.pool[i].dir];
      const nv = { r: pos.r + d.dr, c: pos.c + d.dc };
      if (!inGrid(nv, q.g) || isStone(q.stones, nv)) continue;
      const rest = go(nv, mask | (1 << i));
      if (rest) return [i].concat(rest);
    }
    return null;
  };
  const p = go({ r: q.walked.r, c: q.walked.c }, mask0);
  return p && p.length ? p[0] : -1;
}
/* 当前题应点卡下标（救援/教学帮指/verify 直驱统一入口） */
const correctIdx = q => !q ? -1 : (q.kind === 'path' ? q.answer : solveNext(q));

/* ---------- 结构校验（verify 用，返回失败原因或 null）：方向封闭 / 章型规则 /
   r40 阶梯（dist 2/3/4/5 + g 3/4 + path seq (dch,lv) 表 + opts=seq+1）/
   卡池可达（poolReach 同款 DFS）/ 石头不挡死最短路 / path 落点独立复算 /
   候选格互异非石含末段中间格强干扰 / 相邻题布局互异 / flat0q0 锚点 / 初始态干净 */
function structWhy(q, dch, flat, qi, prevQ) {
  if (!q) return 'q';
  if (q.kind !== 'run' && q.kind !== 'path') return 'kind';
  const g = q.g || 3;
  if (g !== 3 && g !== 4) return 'gsize';                        // r40：网格封闭两档
  if (g !== (dch >= 3 ? 4 : 3)) return 'gCh';                    // ch1/2 3×3 / ch3+ 4×4
  if (!inGrid(q.start, g) || !inGrid(q.goal, g) || samePos(q.start, q.goal)) return 'grid';
  const st = q.stones || [];
  if (st.some(s => !inGrid(s, g) || samePos(s, q.start) || samePos(s, q.goal))) return 'stoneCell';
  if (new Set(st.map(s => s.r + ',' + s.c)).size !== st.length) return 'stoneDup';
  if (dch === 3 && st.length !== 1) return 'stoneN3';            // ch3 恒 1 石头（run/path 同）
  if ((dch === 1 || dch === 2) && st.length !== 0) return 'stoneN0';  // ch1/2 无石头
  if (dch === 4 && st.length > 2) return 'stoneN4';              // ch4 石头 0-2（run 1-2）
  if (q.kind === 'run') {
    const dist = distOf(q.start, q.goal);
    const anchor = flat === 0 && qi === 0;                       // r40：教学锚点=唯一 dist1 豁免位
    if (dch === 1 && dist !== (anchor ? 1 : 2)) return 'dist1';
    if (dch === 2 && dist !== 3) return 'dist2';
    if (dch === 3 && dist !== 4) return 'dist3';
    if (dch === 4 && dist !== 5) return 'dist4';
    if (!q.pool.every(c => DIR_KEYS.indexOf(c.dir) >= 0)) return 'dir';
    if (q.pool.length !== dist && q.pool.length !== dist + 1) return 'poolN';   // 池=dist±干扰 1
    if ((dch === 1 || dch === 2) && q.pool.length !== dist) return 'poolNoDis'; // ch1/2 无干扰
    if (anchor && !(dist === 1 && q.pool.length === 1 &&
        q.pool[0].dir === 'up' && st.length === 0)) return 'anchor';            // 教学演示锚点（点「上」卡）
    if (!shortestPaths(q.start, q.goal, st, g).length) return 'blocked';        // 石头不挡死全部最短路
    if (!poolReach(q.start, q.goal, st, q.pool.map(c => c.dir), g)) return 'unreach';  // 卡池可拼出到达路径
    if (!samePos(q.walked, q.start)) return 'walked';
    if (q.pool.some(c => c.used)) return 'used';
  } else {
    if (dch !== 3 && dch !== 4) return 'pathCh';                 // path 只出现在 ch3/ch4
    const seqN = pathSeqOf(dch, flat % CH_LEN);                  // r40 坡表：dch3 lv0-1=2 其余 3
    if (q.seq.length !== seqN || !q.seq.every(d => DIR_KEYS.indexOf(d) >= 0)) return 'seq';
    let p = { r: q.start.r, c: q.start.c };
    for (let k = 0; k < q.seq.length; k++) {
      p = { r: p.r + DIRS[q.seq[k]].dr, c: p.c + DIRS[q.seq[k]].dc };
      if (!inGrid(p, g) || isStone(st, p)) return 'seqOut';      // 中间格/落点界内非石
    }
    if (!samePos(p, q.goal)) return 'seqGoal';                   // goal=seq 落点（独立复算）
    if (q.opts.length !== q.seq.length + 1) return 'optsN';      // r40：seq2=3 格 / seq3=4 格
    if (!(q.answer >= 0 && q.answer < q.opts.length) || !samePos(q.opts[q.answer], q.goal)) return 'ansIdx';
    if (new Set(q.opts.map(o => o.r + ',' + o.c)).size !== q.opts.length) return 'optsDup';
    if (q.opts.some(o => !inGrid(o, g) || samePos(o, q.start))) return 'optCell';   // 候选格非起点
    if (q.opts.some(o => isStone(st, o))) return 'optStone';                     // 候选格非石（视觉歧义）
    const midLast = { r: p.r - DIRS[q.seq[q.seq.length - 1]].dr,
                      c: p.c - DIRS[q.seq[q.seq.length - 1]].dc };
    if (!q.opts.some(o => samePos(o, midLast))) return 'midMiss';   // 末段中间格强干扰必在场（少走一步陷阱）
  }
  if (prevQ && quizKeyOf(prevQ) === quizKeyOf(q)) return 'adjacent';   // 相邻题布局互异
  if (q._miss !== 0 || q._answered) return 'init';
  return null;
}
/* ================= coder 主逻辑（题面渲染 / 指令卡点选 / 走格动画 / 教学 / 救援 / 推进）
   r40（SPEC-R40-CODER）：ch1-2 3×3 走 2/3 步；ch3 起 4×4 大草地 run dist 4/5；
   path 预测 seq 2（ch3 lv0-1）/3（ch3 lv2+/ch4），seq3 候选 4 格；run 池 ≥5 张卡排紧凑档。
   玩法：题面 = 草地网格（3×3/4×4：小兔 / 萝卜 / 石头 SVG）+ 题面句；run 题 = 方向指令卡
   （箭头+汉字，点一张小兔走一格），path 题 = 指令条按序 2-3 步箭头 + 3-4 格候选卡。
   run：到达萝卜即 right（殊途同达合法——交换律路径教育上正确）；撞石/出界 = 该卡吞
   （卡灰飞 + 小兔朝向顶一下 + 「往这边走不过去哦」TTS 拼句，不记 miss=探索豁免）；
   卡池点完未到达 = wrong + miss + 复位（小兔回起点、卡池全恢复）。
   path：点对格 = right（确认句 TTS）；点错 = wig + queue 链 [cod_wrong clip,
   「再想想，先走第一步看看」TTS]，1000ms 防重入窗后可重选（探索不罚）。
   救援两级（§0.67/家族 B 定版）：14s 方向级=重读题面 + 题面卡 pulse（lastDir 独立节流锚，
   不重置 lastAct）；30s 答案级=应点卡 breathe + 重读（run 应点卡=solveNext DFS 实算）。
   主动读题（startLevel/hear/点题面）重置 lastAct idle 锚（b25 M4）；救援自读不重置防自喂。
   语音窗（家族 G/H/I，clip 实长 SPEC-BATCH28 §4 量化 + R40 §R4）：
   cod_tut_watch 3504 → 教学演示 tap 延至 t=900+3000=3900（≥3504+300，禁撞头）；
   cod_tut_turn 1848 → turn 后读题延 2200（≥1848+300 防尾截）；
   确认句 clip 最长 cod_demo 2832 → 判对演出窗 1800+3600=5400 ≥2832+300（错→对路径同延防掐尾）；
   cod_right 2424 → winFlow celebrate(2620)+wait(400)=3020 ≥2424+300=2724（判对后窗）；
   cod_wrong 2568 + 引导链（run 四段 8418）→ 错链豁免窗 wrongChainUntil=8800（≥8418+300，家族 I）；
   撞石豁免句 cod_g_block 2280 → wrongChainUntil=3700 让路救援；
   path 读题 seq2 7 段链 11244+1000 ≤14000 方向级救援间隔（无掐尾，fire-and-forget）；
   path 读题 seq3 9 段链 14136（Σ段 12936+150×8）>14000 → r40 新增 readChainUntil=14600
     豁免守卫（家族 I 同构：speakQuiz 起 seq3 链时设窗，rescueTick 让路至链播完——
     救援延迟不饿死，1s 轮询链后即触发；seq2 不挂窗）；run 读题=cod_q clip 2400。
   验收钩子：window.CD = { get currentLevel, get quiz(){kind,g,grid{start,goal,stones[]},
   pool[]{dir,used}, seq[], opts[]{r,c}, answer, step, miss}, tapCard(i), start(flat),
   async autoSolve(), get tutorial }——tapCard 返回值族：moved/right/done/wrong/false(撞石卡吞)/
   null(越界或演出窗)，全 async（走格动画+判定链）；getter 返回拷贝 */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
const replayAnim = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
/* 救援/开场任务语音/读题不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错链节流：flat<3 每错必播；flat≥3 走 10s 节流（家族 J：语义句全程保留，禁切通用 clip） */
let lastWrongVoice = 0;
let wrongChainUntil = 0;                         /* 错反馈链豁免窗终点（救援 interval 让路，家族 I） */
let readChainUntil = 0;                          /* seq3 读题链豁免窗终点（r40：9 段链 14136>14000 救援间隔，
                                                   家族 I 同构让路；seq2 链 11244 挂 14000 内不设窗） */
const sayW = parts => {
  if (!cur) return false;
  if (cur.flat < 3) { KIDS.voice.queue(parts); return true; }
  const now = Date.now();
  if (now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.queue(parts); return true; }
  return false;                            /* m2（审查 2026-09-10）：节流未播返回 false——豁免窗仅起播时设（契约 I「起播设」） */
};

const sceneEl = $id('scene'), boardEl = $id('board'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear'),
      ghostEl = $id('ghost');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();                       /* 30s 答案级 idle 锚（方向级不得重置它） */
let lastDir = Date.now();                       /* 14s 方向级独立节流锚（家族 B：与 lastAct 分离） */
let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）
let helpRedemo = false;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const cardEl = i => boardEl.querySelector('.card[data-i="' + i + '"]');

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 70);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：答对=双音上行 / 答错=低柔单音 */
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };

/* ================= 题面语音（run=clip cod_q；path=TTS 拼句豁免 clip 化——SPEC §1；
   verify 页 stub 记 __lastVoiceKey/__lastSay） ================= */
function speakQuiz() {
  if (!cur || !cur.quizzes[cur.step]) return;
  const q = cur.quizzes[cur.step];
  if (q.kind === 'run') KIDS.voice.play(VOICE.q.key, VOICE.q.text);   /* 「帮小兔子走到萝卜」 */
  else {                                       /* T46 阶段2：path 读题变长链 clip 化（全键在册，r40 seq3=9 段） */
    KIDS.voice.queue(pathKeys(q));
    if (q.seq.length === 3)                    /* r40：seq3 链 14136 > 14000 救援间隔 → 设读链豁免窗
                                                  （14600 ≥ Σ12936+150×8+300=14436，build/verify 双静态对账） */
      readChainUntil = Date.now() + 14600;
  }
}

/* ================= 渲染 ================= */
/* 小兔定位（网格内绝对定位，left/top 按格心——transition .35s 即走格动画；
   r40：g×g 通用（ch3 起 4×4——cw=(gw−gap·(g−1))/g） */
function placeBun(pos, g) {
  const bun = sceneEl.querySelector('.bun'), gridEl = sceneEl.querySelector('.grid');
  if (!bun || !gridEl) return;
  const gw = gridEl.clientWidth, gap = 7, gn = g || 3;
  const cw = (gw - gap * (gn - 1)) / gn, bs = bun.offsetWidth || 86;
  bun.style.left = (pos.c * (cw + gap) + (cw - bs) / 2) + 'px';
  bun.style.top = (pos.r * (cw + gap) + (cw - bs) / 2) + 'px';
}
/* 撞石/出界：小兔朝该方向顶一下弹回（视觉解释「过不去」） */
function nudgeBun(dir) {
  const bun = sceneEl.querySelector('.bun');
  if (!bun) return;
  ['nudge-up', 'nudge-down', 'nudge-left', 'nudge-right'].forEach(c => bun.classList.remove(c));
  void bun.offsetWidth;
  bun.classList.add('nudge-' + dir);
}
/* run 到达演出：小兔连跳 + 萝卜摇摆放大（k=格索引 r·g+c——r40 双网格） */
function reachFx(q) {
  const bun = sceneEl.querySelector('.bun');
  if (bun) bun.classList.add('reach');
  const cells = sceneEl.querySelectorAll('.cell');
  const k = q.goal.r * q.g + q.goal.c;
  const carrot = cells[k] && cells[k].querySelector('svg');
  if (carrot) carrot.classList.add('carrot-lit');
}
/* path 点对演出：小兔走到落点格 + 落点格点亮 */
function pathFx(q) {
  placeBun(q.goal, q.g);
  const cells = sceneEl.querySelectorAll('.cell');
  const k = q.goal.r * q.g + q.goal.c;
  if (cells[k]) cells[k].classList.add('goal-cell');
  const bun = sceneEl.querySelector('.bun');
  if (bun) bun.classList.add('reach');
}
function renderScene(q) {                        // 题面：题面句条 +（path 指令条）+ g×g 网格（r40：3|4）
  sceneEl.dataset.kind = q.kind;
  sceneEl.setAttribute('aria-label', quizText(q) + '，点我再听一遍');
  let h = '<div class="q-text">' + quizText(q) + '</div>';
  if (q.kind === 'path') {                       // 指令序列按序展示（卡面箭头顺序 + 语音念；seq 2-3 步）
    h += '<div class="seq-strip">' + q.seq.map((d, k) =>
      '<div class="seq-card" style="animation-delay:' + (k * 90) + 'ms">' + arrowSvg(d) +
      '<span class="seq-no">' + (k + 1) + '</span></div>').join('') + '</div>';
  }
  h += '<div class="grid' + (q.g === 4 ? ' g4' : '') + '">';
  for (let r = 0; r < q.g; r++) for (let c = 0; c < q.g; c++) {
    const p = { r: r, c: c };
    const isS = isStone(q.stones, p);
    const isG = q.kind === 'run' && samePos(p, q.goal);   // path 题落点不画萝卜（那是答案）
    h += '<div class="cell' + (isS ? ' stone' : '') + (isG ? ' goal-cell' : '') + '" data-r="' + r + '" data-c="' + c + '">' +
         (isS ? stoneSvg() : (isG ? carrotSvg() : '')) + '</div>';
  }
  h += '</div>';
  sceneEl.innerHTML = h;
  const gridEl = sceneEl.querySelector('.grid');
  const bun = document.createElement('div');
  bun.className = 'bun';
  bun.innerHTML = KIDS.assets.rabbit('normal', 76);
  gridEl.appendChild(bun);
  placeBun(q.walked || q.start, q.g);
}
function renderBoard(q) {                        // run=方向指令卡（箭头+汉字）/ path=3-4 格候选卡
  boardEl.innerHTML = '';
  const n = q.kind === 'run' ? q.pool.length : q.opts.length;
  /* r40：run 池 ≥5 张（dch3 池 5 / dch4 池 5-6）挂 many 紧凑档（6×80+5×14=550≤640 单行） */
  boardEl.classList.toggle('many', q.kind === 'run' && q.pool.length >= 5);
  for (let i = 0; i < n; i++) {
    const b = document.createElement('button');
    b.className = 'card pop';
    b.dataset.i = i;
    b.style.animationDelay = (i * 70) + 'ms';
    if (q.kind === 'run') {
      const d = q.pool[i].dir;
      b.dataset.dir = d;                         // verify 对账（渲染即引擎）
      b.setAttribute('aria-label', '往' + DIRS[d].n + '走指令卡');
      b.innerHTML = '<span class="arrow">' + arrowSvg(d) + '</span>' +
                    '<span class="d-label">' + DIRS[d].n + '</span>';
    } else {
      const o = q.opts[i];
      b.dataset.r = o.r; b.dataset.c = o.c;      // verify 对账（渲染即引擎）
      b.setAttribute('aria-label', '第' + (o.r + 1) + '行第' + (o.c + 1) + '列候选格卡');
      b.innerHTML = '<span class="mini' + (q.g === 4 ? ' m4' : '') + '">' + miniGridHtml(o, q.g) + '</span>' +
                    '<span class="g-label">走到这格</span>';
    }
    boardEl.appendChild(b);
  }
}
function renderQuiz(speak) {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderScene(q);
  renderBoard(q);
  renderStep();
  if (speak !== false && !VERIFY && !state.demo && !state.quiet) speakQuiz();  /* 开场/换题读题 */
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向：当前题应点卡（run=solveNext DFS 实算下一步；path=正确格） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const i = correctIdx(q);
  if (i >= 0) pointGhostAt(cardEl(i));
}

/* ================= 点卡主路径（真实点击 / CD.tapCard / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（卡排容器 bump 微动效——家族 D）：演出窗/越界/已用卡=null+pop+bump；
   错点 1000ms 防重入窗（b16 定案禁偏离）========== */
async function uiTapCard(i, demo) {
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return null;                                 // 演出窗/教学演示期吞点=null（钩子契约）
  }
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  const run = cur;                               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapCard(cur, i);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }   // 越界下标/已用卡
  const el = cardEl(i);

  if (r === 'false') {                           /* 撞石/出界：该卡吞+小兔顶一下+探索豁免句（不记 miss） */
    if (el) { el.classList.remove('pop'); el.classList.add('spent'); }
    nudgeBun(q.pool[i].dir);
    sfx('pop');
    replayAnim(boardEl, 'bump');
    KIDS.voice.play('cod_g_block', GUIDE.block); /* T46 阶段2：撞石豁免句 clip 化（2280） */
    wrongChainUntil = Date.now() + 3700;         /* 探索反馈豁免 ≥2280+300（救援让路，家族 I 同守卫） */
    return r;
  }

  if (r === 'moved') {                           /* run 合法一步未到达：走格动画+落定窗 */
    state.locked = true;
    if (el) { el.classList.remove('pop'); el.classList.add('used-up'); }
    placeBun(q.walked, q.g);
    await wait(520 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    return r;
  }

  if (r === 'wrong') {                           /* run 卡尽未到达（引擎已复位）/path 点错格 */
    state.locked = true;
    if (el) replayAnim(el, 'wig');
    dodgeLo();
    if (sayW([VOICE.wrong.key].concat(guideKeys(q))))   /* T46 阶段2 拼播链：cod_wrong+引导段组全键化（m2：仅链起播时设窗） */
      wrongChainUntil = Date.now() + 8800;       /* 链豁免（家族 I）：2568+150+gw1 3072+150+d 1224+150+gw2 1104+300=8718 */
    await wait(1000 * SPEED);                    /* 错点防重入窗 1000ms；对选可打断链；救援由 wrongChainUntil 让路 */
    if (cur !== run) return r;
    if (q.kind === 'run') renderQuiz(false);     /* run 复位重渲染：小兔回起点+卡池全恢复（不读题） */
    state.locked = false;
    return r;
  }

  /* ---- right·done（run 到达萝卜 / path 点对格：演出+确认句 TTS） ---- */
  lastAct = Date.now();                          /* 正确推进重置救援钟（§0.7a） */
  if (state.tut === 'help') {                    /* 教学"独"：首次选对 → 放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  if (el) { el.classList.remove('breathe'); el.classList.add('lit'); }
  if (q.kind === 'run') { placeBun(q.walked, q.g); reachFx(q); }  /* 走到萝卜格+连跳+萝卜摇摆 */
  else pathFx(q);                                                /* path：小兔走到落点格点亮 */
  chimeGoal();
  sfx('coin');
  KIDS.voice.play(demo ? 'cod_demo' : confirmKeyOf(q),            /* T46 阶段2：demo 机制句/确认句 clip 化 */
                 demo ? '点箭头，小兔子就走' : confirmText(q));   /* 教学 demo=机制句；正常=确认句（实长 ≤2832 ≤ 窗 5400-300） */
  if (demo) window.__cdDemoV = 'cod_demo';           /* demo 键实证（verify ⑤ 断言——turn 句会覆写 __lastVoiceKey） */
  await wait(1800 * SPEED);                      /* 走格+演出+确认句主窗 */
  if (cur !== run) return r;
  await wait(3600 * SPEED);                      /* 确认句收尾窗：总 5400 ≥ 确认句 clip 实长上界 2832（cod_demo，
                                                    T46 clip 化后实长口径——estMs 估算口径随 clip 化退役，r40 审查 m5 勘正）；
                                                    错→对路径读题延 5400 防错反馈链掐在 <500ms */
  if (cur !== run) return r;
  state.locked = false;
  if (r === 'done') { winFlow(); return 'done'; }
  renderQuiz();                                  /* 新题（网格/卡全换）+读题 */
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关随机章型 GEN[dch-1]（家族 F：
     genLevel 纯函数确定性，同 flat 恒同 dch——预告与实际章型恒一致；禁 (ci+1)%4 章序推进） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  sayR(VOICE.right.key, VOICE.right.text);       /* cod_right：走到啦，真聪明（2424ms） */
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(async () => {
    await wait(400);                             /* 家族 H：celebrate 2620+400=3020 ≥ 2424+300=2724（判对后窗） */
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });   /* 家族 A：winFlow 传 nextHint(null)（b25 形态定版） */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  lastWrongVoice = 0; wrongChainUntil = 0; readChainUntil = 0;   /* 换关重置错反馈节流锚与链豁免（家族 I/J 配套；r40 读链窗同列） */
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();                          /* 主动读题路径重置 idle 锚（b25 M4） */
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.coder && sv.coder.tutSeen);
  if (VERIFY) return;                            // verify 页：教学链由 runVerify 单元直调
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  speakQuiz();                                   /* 开场读题面 */
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=幽灵手指点「上」卡 → 小兔走一格到萝卜（flat0 题0 恒 start(1,1)→goal(0,1)
   卡池=[上]——确定性锚点；演示句「点箭头，小兔子就走」）；帮=指向应点卡；独=首次选对放手
   时序（家族 G/H）：watch clip 3504ms → 演示 tap 延至 t=900+3000=3900（≥3504+300），
   确认机制句不与 watch 撞头；演示演出窗 5400 罩机制句 TTS 再收束 turn（全程 ≤16s） */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);       /* cod_tut_watch：看！小兔子要去找萝卜（3504ms） */
  await wait(900 * SPEED);                       /* 网格+小兔+萝卜亮相 */
  const q = cur.quizzes[0];                      // flat0 题0 恒 pool=[up]（→点「上」卡）
  const idx = correctIdx(q);
  pointGhostAt(cardEl(idx));
  await wait(3000 * SPEED);                      /* t=3900 ≥ watch 3504+300=3804：clip 播完再演示（不撞头） */
  ghost.press();
  await wait(320 * SPEED);
  const demoR = await uiTapCard(idx, true);      /* demo 通道豁免 locked 门（演示吞真实输入） */
  window.__cdDemoR = demoR;                      /* 演示生效证据（§0.27，gate 断言 'right'） */
  await wait(500 * SPEED);                       /* 收尾（机制句 TTS 仍在播，由 uiTapCard 演出窗罩满） */
  const sv = KIDS._save() || {};
  sv.coder = sv.coder || {};
  sv.coder.tutSeen = true;
  if (KIDS._save()) KIDS.store.persist();
  /* 立即重发同关（确定性关卡，题面一致），"你来指一指"在重发后的题面上说（照 batch5-27） */
  ghost.hide();
  cur = genLevel(0);
  state = { locked: false, won: false, demo: false, tut: 'help', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  state.quiet = false;
  sayR(VOICE.turn.key, VOICE.turn.text);         /* cod_tut_turn：你来指一指（1848ms） */
  setTimeout(() => {
    if (state.tut === 'help' && cur && cur.quizzes[cur.step]) speakQuiz();

  /* ---- ① 40 关全量审计（flat 0-39；r40 聚合：阶梯/g/seq/opts4） ---- */

                                       : (L1.dch >= 1 && L1.dch <= 4);       // 生成关随机章参数（钩子直读）
