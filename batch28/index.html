<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子的游戏屋 · 又来三款新游戏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FBF3E4;color:#4A3B2E;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:34px 22px}
  .logo{width:150px;height:150px}
  h1{font-size:clamp(26px,5vw,38px);letter-spacing:.05em}
  .ageband{display:inline-flex;align-items:center;gap:8px;background:#E8975A;color:#fff;font-size:16px;font-weight:700;
           padding:7px 18px;border-radius:999px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px;width:100%;max-width:760px}
  a.card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 24px;border-radius:26px;
         background:#FFF9EE;border:2.5px solid #4A3B2E;text-decoration:none;color:#4A3B2E;
         box-shadow:0 5px 0 #D8C9B4;transition:transform .2s}
  a.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
  @media (hover:hover){
    a.card:hover{transform:translateY(-4px);box-shadow:0 9px 0 #D8C9B4}
  }
  .card .icon{width:92px;height:92px}
  .card .name{font-size:22px;font-weight:700}
  .card .desc{font-size:14px;color:#8A7B6C;line-height:1.6;text-align:center}
  .foot{font-size:12.5px;color:#8A7B6C;text-align:center;line-height:1.8;max-width:520px}
</style>
</head>
<body>
  <div class="logo" id="logo"></div>
  <h1>小兔子的游戏屋 · 又来三款新游戏</h1>
  <div class="ageband">★ 6-7 岁 · 幼小衔接 ★</div>
  <div class="grid">
    <a class="card" href="coder/index.html">

        <path d="M10 36.6 h80 M10 63.3 h80 M36.6 10 v80 M63.3 10 v80" stroke="#4A3B2E" stroke-width="1.6" opacity=".35"/>
        <circle cx="24" cy="24" r="7" fill="#9CC288" stroke="#4A3B2E" stroke-width="2"/>
        <path d="M76 72 l0 -13 M76 59 l-6 6 M76 59 l6 6" stroke="#E05A5A" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <circle cx="77.2" cy="18.8" r=".9" fill="#4A3B2E"/>
        <path d="M20 76 q3.4 4 7.6 3 q4.4 -1 7.4 2" stroke="#E8975A" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      </svg></div>
      <div class="name">指令小兔</div>
      <div class="desc">点箭头指方向<br>帮小兔子走到萝卜</div>
    </a>
    <a class="card" href="shapecount/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="26" cy="26" r="11" fill="#7FB3E0" stroke="#4A3B2E" stroke-width="2.4"/>
        <circle cx="54" cy="20" r="11" fill="#7FB3E0" stroke="#4A3B2E" stroke-width="2.4"/>
        <rect x="20" y="52" width="21" height="21" rx="3.5" fill="#F2C94C" stroke="#4A3B2E" stroke-width="2.4"/>
        <rect x="58" y="46" width="21" height="21" rx="3.5" fill="#F2C94C" stroke="#4A3B2E" stroke-width="2.4" transform="rotate(12 68.5 56.5)"/>
        <path d="M74 78 l11.6 6.8 -11.6 6.8 z" fill="#9CC288" stroke="#4A3B2E" stroke-width="2.2" stroke-linejoin="round" transform="rotate(90 80 84.8)"/>
        <text x="24" y="94" font-size="15" font-weight="700" fill="#E05A5A" font-family="Arial">2</text>
        <text x="66" y="36" font-size="13" font-weight="700" fill="#E05A5A" font-family="Arial">?</text>
      </svg></div>
      <div class="name">图形计数</div>
      <div class="desc">一个一个指着数<br>圆形有几个三角有几个</div>
    </a>
    <a class="card" href="conserve/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g fill="#E8975A" stroke="#4A3B2E" stroke-width="2">
          <circle cx="16" cy="26" r="5.4"/><circle cx="29" cy="26" r="5.4"/><circle cx="42" cy="26" r="5.4"/><circle cx="55" cy="26" r="5.4"/><circle cx="68" cy="26" r="5.4"/>
        </g>
        <g fill="#9CC288" stroke="#4A3B2E" stroke-width="2">
          <circle cx="16" cy="48" r="5.4"/><circle cx="31.5" cy="48" r="5.4"/><circle cx="47" cy="48" r="5.4"/><circle cx="62.5" cy="48" r="5.4"/><circle cx="78" cy="48" r="5.4"/>
        </g>
        <path d="M12 64 h72" stroke="#8A7B6C" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="50" y="84" font-size="15" font-weight="700" text-anchor="middle" fill="#4A3B2E">哪边多？</text>
      </svg></div>
      <div class="name">数量守恒</div>
      <div class="desc">拉开间距数不变<br>比一比哪边多</div>
    </a>
  </div>
    <p class="foot">每天有新关卡，玩完今天的小兔子会说"明天见"。<br>每款游戏右上角 🔒 家长面板：进度 / 时长 / 今日多玩关数。<br>完全离线，无广告无内购，进度保存在本机。</p>
