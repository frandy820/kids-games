<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>图形计数</title>
<style>
/* ================= 图形计数 shapecount（batch28）=================
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E；
   6-7 岁幼小衔接段：题面=图形拼贴场景（SVG 简笔大色块散布非重叠——
   4×3 确定性槽位 + 轻旋转缩放营造散布感，渲染前算位防重叠）+ 题面句文字条；
   下方 4 张数字卡（count「三角形有几个？」）或 2 张图形卡（more「哪种图形多？」）。
   点对=目标图形逐个点亮跳 + 确认句 TTS 拼句（「三角形，有三个」——NUMCN 2=两）；
   点错=卡摇头 + sha_wrong + 语义方向句 TTS（count 按所点数字大小 / more 配对锚句），
   卡不灰可重选（探索不罚）。
   触摸目标：数字/图形卡=主答案按钮 ≥96×96（§0.9）；场景图形 ≥56 可辨；
   题面卡可点重听；底栏按钮 ≥72。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 50px;display:flex;align-items:center;padding:5px 60px 0 14px;gap:14px}
#logo{width:40px;height:40px;border-radius:12px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 40px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面卡（图形场景+题面句）→ 卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;overflow:hidden;padding:6px 12px}

/* 题面卡：可点重听题面；r3 双模式——scatter=散点（槽位 4×3 模型）/ grid=r×c 阵列
   （GRID_TOP/GRID_DY 行定位，4 行最底 90%+半高 29=335<340 零溢出；行距 79.9px>58 零重叠） */
#scene{position:relative;width:min(620px,94vw);height:322px;border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;overflow:hidden;padding:0;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene[data-mode="grid"]{height:364px}
#scene[data-mode="grid"] .sc-shape{width:58px;height:58px}
/* 题面句文字条（顶部；散点槽区自 22% 起、阵列首行自 GRID_TOP——垂直零重叠） */
#scene .q-text{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:3;
  background:rgba(255,249,238,.94);border:2.5px solid #4A3B2E;border-radius:16px;
  padding:4px 18px;font-size:24px;font-weight:700;letter-spacing:1px;white-space:nowrap}
/* 场景图形：外层槽位/格位定位（left/top 内联），内层旋转缩放+入场动画分离（防 transform 覆盖）；
   ch4 漂移（r3 ④ 移动干扰）=外层 drift-x 横摆动画（内联声明，幅度 ±9px——
   横向间隙 ≥66px 双侧 18px 恒安全；transform 基向量 translate(-50%,-50%) 在关键帧内保留） */
#scene .sc-shape{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);
  pointer-events:none;z-index:2}
#scene .sc-shape[style*="drift-x"]{will-change:transform}
@keyframes drift-x{0%,100%{transform:translate(-50%,-50%)}
  50%{transform:translate(calc(-50% + 9px),-50%)}}
#scene .sc-in{display:block;width:100%;height:100%;animation:sc-in .42s cubic-bezier(.2,1.5,.4,1) backwards}
#scene .sc-in svg{width:100%;height:100%}
@keyframes sc-in{from{transform:scale(.2) rotate(-14deg);opacity:0}to{transform:scale(1);opacity:1}}
/* 教学/答对逐个点亮：目标图形描边变绿+跳 */
#scene .sc-shape.lit .sc-in{animation:sc-lit .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes sc-lit{0%{filter:none}45%{filter:drop-shadow(0 0 12px rgba(143,191,127,.95)) brightness(1.12)}
  100%{filter:none}}
#scene .sc-in.bump{animation:sc-bump .3s ease}
@keyframes sc-bump{0%,100%{margin-top:0}45%{margin-top:-7px}}
/* 救援方向级：题面区 pulse（整体呼吸放大 3 次） */
#scene.pulse{animation:scene-pulse 1s ease-in-out 3}
@keyframes scene-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#scene.bounce{animation:scene-b .4s ease}
@keyframes scene-b{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}

/* ---------- 卡排：count 一行 4 数字卡 / more 2 图形卡；主答案按钮 ≥96×96；
   吞输入=容器 bump ---------- */
#board{display:flex;gap:18px;justify-content:center;align-items:stretch;flex:0 0 auto;
  width:100%;max-width:780px;padding:0 2px}
#board.bump{animation:board-bump .22s ease}
@keyframes board-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 5px 0 #D8C9B4;flex:0 0 auto;transition:transform .15s;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.card:active{transform:translateY(3px)}
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.card.bump{animation:card-bump .22s ease}
@keyframes card-bump{0%,100%{transform:scale(1)}45%{transform:scale(.94)}}
/* 数字卡：大数字 + 「个」量词标签（r3 四型一律数字卡） */
.card.ncard{width:116px;min-height:132px;flex-direction:column;gap:2px}
.card.ncard .num{font-size:58px;font-weight:800;line-height:1;font-family:Georgia,"Microsoft YaHei",serif}
.card.ncard .nlab{font-size:20px;font-weight:700;opacity:.85}
/* 答对：卡绿+弹 */
.card.lit{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;
  animation:card-lit .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes card-lit{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 答错：摇头晃动（不灰掉可重选——探索不罚，语义反馈款） */
.card.wig{animation:an-wig .6s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}22%{transform:rotate(-8deg) translateX(-4px)}
  50%{transform:rotate(7deg) translateX(3px)}78%{transform:rotate(-4deg) translateX(-2px)}}
/* 30s 答案级救援：正确卡呼吸高亮循环（§0.21） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-27） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：场景/卡适配，主答案卡仍 ≥96；grid 模式保持 340px 高
   （4 行行距 79.9px>58px 图形零重叠——阵列几何不随竖屏压缩，r3 ②） */
@media (orientation:portrait){
  #scene{height:268px}
  #scene[data-mode="grid"]{height:364px}
  #scene .q-text{font-size:20px;padding:4px 14px}
  #scene .sc-shape{width:58px;height:58px}
  #board{gap:12px}
  .card.ncard{width:100px;min-height:122px}
  .card.ncard .num{font-size:50px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="图形计数">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="数一数图形，点我再听一遍"></button>
    <div id="board" aria-label="答案卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

/* ================= shapecount 纯引擎：确定性关卡生成 + 数字卡点选判定（无 DOM，UI 与 verify 共用）

     dch3 空格颜色：gridmiss（r*c∈[12,20] 缺格 k∈[1,4] 且 r*c-k≥10——减法结构）+
           dual（目标 3-6 + 同色异形 2-5 + 同形异色 2-5，双干扰必在场）交替 3+2
     dch4 大挑战：四型混合（count 近形版+grid+gridmiss+dual，每关 ≥2 型）+
           全题漂移 drift（r3 ④ 移动干扰：横摆 ±9px 慢速 CSS 动画，判定层不受影响）
   生成关（flat≥20）：每关随机章参数 dch=ri(1,4)（先取数保确定性——b25 坑④ verify 钩子直读）；
   dch4 含漂移。铁律：count/grid/gridmiss/dual 候选数字=numSet(n) 数学先验（四数互异
   含真值、全 ≥1、定长 4）；dual 同色异形+同形异色双干扰必在场（§0.68 r3）；
   散点槽位 12 确定性互异（非重叠由槽位模型保证）；阵列 _place=row/cp 结构
   （miss 格不在 _place）；相邻题同型身份互异（防同关连题单调）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数

/* ---------- 阵列参数掷取：r∈{2,3,4}×c∈{3,4,5}，总格数域内重掷（≤24 掷兜底）
   满阵域 [10,20]（dch2）/ 缺格阵底数域 [12,20]（dch3 缺格后 ≥10） */
function rollGrid(rnd, totLo, totHi) {
  for (let g = 0; g < 24; g++) {
    const r = ri(rnd, GRID_R[0], GRID_R[1]), c = ri(rnd, GRID_C[0], GRID_C[1]);
    if (r * c >= totLo && r * c <= totHi) return { r: r, c: c };
  }
  return { r: 4, c: 5 };                              // 兜底（4×5=20 恒在两域内）
}

/* ---------- 每关题序表（genLevel 预生成；rnd 同流保确定性）
   dch1：flat0 题0 锚 circle×6；形序列=全 6 池洗牌取 5（互异轮换）
   dch2：形=全 6 池互异轮换；每题掷 r×c（满阵 10-20）
   dch3：两子型交替 3+2（首型掷 coin）；gm 掷 r×c+k；du 掷 形/色/三数量
   dch4：每题 ri(1,4) 定型（<2 型兜底改末题补缺型）；count=近形版；
         全部题 drift=true（漂移标记随题型落 buildQuiz） ---------- */
function specSeqOf(dch, rnd, flat) {
  const seq = [];
  const pickDiff = (pool, prev) => {
    let s = pool[Math.floor(rnd() * pool.length)];
    for (let g = 0; g < 8 && s === prev; g++) s = pool[Math.floor(rnd() * pool.length)];
    return s;
  };
  if (dch === 1) {
    let shapes;
    if (flat === 0) shapes = ['circle'].concat(shuffled(ALL6.filter(s => s !== 'circle'), rnd).slice(0, CH_LEN - 1));
    else shapes = shuffled(ALL6, rnd).slice(0, CH_LEN);
    for (let qi = 0; qi < CH_LEN; qi++) {
      const n = (flat === 0 && qi === 0) ? 6 : ri(rnd, N_CH1[0], N_CH1[1]);   // flat0q0 锚 n=6（分组数教学）
      seq.push({ kind: 'count', ask: shapes[qi], n: n });
    }
    return seq;
  }
  if (dch === 2) {
    const shapes = shuffled(ALL6, rnd).slice(0, CH_LEN);   // 互异轮换（相邻身份天然互异）
    for (let qi = 0; qi < CH_LEN; qi++) {
      const rc = rollGrid(rnd, GRID_TOT[0], GRID_TOT[1]);
      seq.push({ kind: 'grid', ask: shapes[qi], r: rc.r, c: rc.c });
    }
    return seq;
  }
  if (dch === 3) {
    const firstDual = rnd() < 0.5;                        // 交替 3+2（首型掷 coin）
    for (let qi = 0; qi < CH_LEN; qi++) {
      const isDual = (qi % 2 === 0) === firstDual;        // 0,2,4 一型 / 1,3 另一型
      if (isDual) seq.push(rollDualSpec(rnd, null));
      else {
        const rc = rollGrid(rnd, MISS_TOT[0], MISS_TOT[1]);
        const k = ri(rnd, MISS_K[0], Math.min(MISS_K[1], rc.r * rc.c - MISS_FLOOR));
        seq.push({ kind: 'gridmiss', ask: pickDiff(ALL6, null), r: rc.r, c: rc.c, k: k });
      }
    }
    return seq;
  }
  /* dch4 四型混合（每关 ≥2 型） */
  const kinds = [];
  for (let qi = 0; qi < CH_LEN; qi++) kinds.push(ri(rnd, 1, 4));
  const uniq = kinds.filter((v, i, a) => a.indexOf(v) === i);
  if (uniq.length < 2) kinds[CH_LEN - 1] = (kinds[0] % 4) + 1;   // 全同型 → 末题改邻型（保混合）
  let prevAsk = null, prevDual = null;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const t = kinds[qi];
    if (t === 1) {
      const ask = pickDiff(NEAR_KEYS, prevAsk);          // ch4 count=近形版（近形必在场）
      let n = ri(rnd, N_CH4[0], N_CH4[1]), m = ri(rnd, N_DIST4[0], N_DIST4[1]);
      for (let g = 0; g < 12 && n + m > N_SLOTS; g++) m = ri(rnd, N_DIST4[0], N_DIST4[1]);
      if (n + m > N_SLOTS) m = N_SLOTS - n;              // 兜底钳制（n≤9 → m=12-n∈[3,7] 恒界内）
      seq.push({ kind: 'count', ask: ask, n: n, m: m });
      prevAsk = ask;
    } else if (t === 2) {
      const ask = pickDiff(ALL6, prevAsk);
      const rc = rollGrid(rnd, GRID_TOT[0], GRID_TOT[1]);
      seq.push({ kind: 'grid', ask: ask, r: rc.r, c: rc.c });
      prevAsk = ask;
    } else if (t === 3) {
      const ask = pickDiff(ALL6, prevAsk);
      const rc = rollGrid(rnd, MISS_TOT[0], MISS_TOT[1]);
      const k = ri(rnd, MISS_K[0], Math.min(MISS_K[1], rc.r * rc.c - MISS_FLOOR));
      seq.push({ kind: 'gridmiss', ask: ask, r: rc.r, c: rc.c, k: k });
      prevAsk = ask;
    } else {
      const du = rollDualSpec(rnd, prevDual);
      seq.push(du);
      prevDual = du.shape + ':' + du.color;
    }
  }
  return seq;
}

/* ---------- dual 题参数掷取：目标 n 3-6 + 同色异形 d1 2-5 + 同形异色 d2 2-5，
   三量和 ≤12（散点槽位上界，≤16 掷兜底+末掷钳制）；
   干扰形 d1s ≠ 目标形、干扰色 d2c ≠ 目标色（近形对 50% 优先取——辨析回退纯形状通道）
   prev=相邻题 'shape:color' 身份（互异兜底 ≤8 掷） ---------- */
function rollDualSpec(rnd, prev) {
  for (let g = 0; g < 16; g++) {
    const shape = ALL6[Math.floor(rnd() * 6)];
    const color = COLOR4[Math.floor(rnd() * 4)];
    if (g < 8 && prev === shape + ':' + color) continue;
    const n = ri(rnd, DUAL_N[0], DUAL_N[1]);
    const d1 = ri(rnd, DUAL_D[0], DUAL_D[1]);
    const d2 = ri(rnd, DUAL_D[0], DUAL_D[1]);
    if (n + d1 + d2 > N_SLOTS) continue;                 // 槽位上界铁律（重掷）
    let d1s = ALL6[Math.floor(rnd() * 6)];
    if (d1s === shape) d1s = ALL6[(ALL6.indexOf(shape) + 1) % 6];   // 干扰形 ≠ 目标形
    else if (NEAR[shape] && rnd() < 0.5) d1s = NEAR[shape];         // 近形干扰 50%（同色近形=辨析最狠）
    if (d1s === shape) d1s = NEAR[shape] || ALL6[(ALL6.indexOf(shape) + 2) % 6];
    let d2c = COLOR4[Math.floor(rnd() * 4)];
    if (d2c === color) d2c = COLOR4[(COLOR4.indexOf(color) + 1) % 4];   // 干扰色 ≠ 目标色
    return { kind: 'dual', shape: shape, color: color, n: n, d1s: d1s, d1: d1, d2c: d2c, d2: d2 };
  }
  /* 兜底（概率上不可达：16 掷全失败）——确定性钳制保域 */
  return { kind: 'dual', shape: 'circle', color: 'red', n: 4, d1s: 'triangle', d1: 3, d2c: 'blue', d2: 3 };
}

/* ---------- 单题构建
   count（dch1 单形 / dch4 近形版）：scene={ask:n(+near:m)}；数字卡=shuffled(numSet(n))
   grid：满阵 rows×cols，n=r*c，scene={ask:n}；_place=阵列格（miss 空）
   gridmiss：n=r*c-k，miss[]=缺格 idx（洗牌取 k），scene={ask:n}
   dual：ask='shape:color'，scene={'shape:color':n,'d1s:color':d1,'shape:d2c':d2}
         （三组合键=目标+同色异形+同形异色，双干扰必在场）；_place 散点带 fill ---------- */
function buildQuiz(spec, dch, rnd) {
  if (spec.kind === 'count') {
    const n = spec.n;
    const near = spec.m != null ? NEAR[spec.ask] : null;
    const scene = {};
    scene[spec.ask] = n;
    if (near) scene[near] = spec.m;
    const nums = shuffled(numSet(n), rnd);
    const opts = nums.map(x => ({ num: x }));
    const ids = near ? [spec.ask, near] : [spec.ask];
    return { kind: 'count', ask: spec.ask, n: n, scene: scene,
             opts: opts, answer: nums.indexOf(n),
             _place: placeOf(scene, ids, rnd), _miss: 0, _answered: false };
  }
  if (spec.kind === 'grid' || spec.kind === 'gridmiss') {
    const miss = spec.kind === 'gridmiss'
      ? shuffled(Array.from({ length: spec.r * spec.c }, (_, i) => i), rnd).slice(0, spec.k) : [];
    const n = spec.r * spec.c - miss.length;
    const scene = {};
    scene[spec.ask] = n;
    const nums = shuffled(numSet(n), rnd);
    const opts = nums.map(x => ({ num: x }));
    return { kind: spec.kind, ask: spec.ask, rows: spec.r, cols: spec.c, miss: miss, n: n,
             scene: scene, opts: opts, answer: nums.indexOf(n),
             _place: gridPlace(spec.r, spec.c, miss, spec.ask, rnd),
             _miss: 0, _answered: false };
  }
  /* dual */
  const scene = {};
  scene[spec.shape + ':' + spec.color] = spec.n;
  scene[spec.d1s + ':' + spec.color] = spec.d1;          // 同色异形干扰（必在场）
  scene[spec.shape + ':' + spec.d2c] = spec.d2;          // 同形异色干扰（必在场）
  const nums = shuffled(numSet(spec.n), rnd);
  const opts = nums.map(x => ({ num: x }));
  const keys = [spec.shape + ':' + spec.color, spec.d1s + ':' + spec.color, spec.shape + ':' + spec.d2c];
  return { kind: 'dual', ask: spec.shape + ':' + spec.color,
           dual: { shape: spec.shape, color: spec.color, n: spec.n,
                   d1s: spec.d1s, d1: spec.d1, d2c: spec.d2c, d2: spec.d2 },
           n: spec.n, scene: scene, opts: opts, answer: nums.indexOf(spec.n),
           _place: placeOf(scene, keys, rnd), _miss: 0, _answered: false };
}

/* ---------- 场景散布（确定性）：实例序=键序展开，槽位洗牌互异 + 旋转 ±12° + 缩放 .95-1.05
   dual 键 'shape:color' 解析出 fill（颜色 id）；count 键=shapeId 无 fill */
function placeOf(scene, keys, rnd) {
  const flat = [];
  keys.forEach(k => {
    const shape = k.indexOf(':') > 0 ? k.split(':')[0] : k;
    const fill = k.indexOf(':') > 0 ? k.split(':')[1] : null;
    for (let i = 0; i < scene[k]; i++) flat.push({ shape: shape, fill: fill });
  });
  const slots = shuffled(Array.from({ length: N_SLOTS }, (_, i) => i), rnd).slice(0, flat.length);
  return flat.map((it, k) => ({ shape: it.shape, fill: it.fill, slot: slots[k],
                                rot: Math.round(rnd() * 24 - 12),
                                scale: +(0.95 + rnd() * 0.1).toFixed(3) }));
}

/* ---------- 阵列散布（r3 ②）：满格 (row,cp) 全展开跳过 miss 格；
   旋转 ±8° + 缩放 .97-1.03（阵列整齐感，微变体小于散点）；
   miss 格不在 _place（渲染/verify 双口径：DOM 元素数=n=r*c-k） ---------- */
function gridPlace(rows, cols, miss, shape, rnd) {
  const missSet = {};
  miss.forEach(i => { missSet[i] = true; });
  const out = [];
  for (let i = 0; i < rows * cols; i++) {
    if (missSet[i]) continue;
    out.push({ shape: shape, fill: null, row: Math.floor(i / cols), cp: i % cols,
               rot: Math.round(rnd() * 16 - 8),
               scale: +(0.97 + rnd() * 0.06).toFixed(3) });
  }
  return out;
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关随机章参数）
   flat0 题0 恒 circle×6（§2 教学演示锚点——两个两个分组数）；drift 标记=dch4 全题
   （r3 ④ 移动干扰：渲染层漂移，判定层 scene 真值不变） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 47);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const specs = specSeqOf(dch, rnd, flat);
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(specs[qi], dch, rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点卡引擎（无 DOM）：engTapOpt(L, i) —— 点第 i 张卡（opts 数组下标）
   'right' 答对且本题完成推进 / 'done' 答对且末题=通关
   'wrong' 点错：该题 miss+1（retries 全关累计=星级口径），卡不灰可重选（探索不罚）
   null    非法下标或关卡已结束 ---------- */
function engTapOpt(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.opts.length) return null;
  if (i === q.answer) {
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（§0.68 口径）：全关错选 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：当前题正确卡下标 */
const correctIdx = q => q ? q.answer : -1;

/* ---------- 结构校验（verify 用，返回失败原因或 null）：封闭表 / 章型规则 /
   阵列参数域与缺格结构 / dual 双干扰在场 / 候选数字数学先验 / 场景-答案自洽 /
   槽位·阵列格一致性 / 相邻题同型互异 / flat0q0 锚点 / 初始态干净 ---------- */
function structWhy(q, dch, flat, qi, prevQ) {
  if (!q) return 'q';
  const isAnchor = flat === 0 && qi === 0;              // 教学演示题（两个两个数圆形）锚点
  if (isAnchor && !(q.kind === 'count' && q.ask === 'circle' && q.n === 6)) return 'anchor';
  if (q.kind === 'count') {
    if (!SHAPES[q.ask]) return 'ask';
    if (dch !== 1 && dch !== 4) return 'countCh';                   // count 只在 ch1/ch4
    if (dch === 1) {
      if (Object.keys(q.scene).length !== 1) return 'dch1scene';    // ch1 单形
      if (q.n < N_CH1[0] || q.n > N_CH1[1]) return 'dch1n';
    } else {
      if (Object.keys(q.scene).length !== 2) return 'ch4scene';
      if (NEAR_KEYS.indexOf(q.ask) < 0) return 'ch4pool';           // ch4 目标恒近形 4 池
      const near = NEAR[q.ask];
      if (!(near in q.scene)) return 'nearMissing';                 // 近形必在场（§0.68 r3）
      const m = q.scene[near];
      if (m < N_DIST4[0] || m > N_DIST4[1]) return 'mRange';
      if (q.n < N_CH4[0] || q.n > N_CH4[1]) return 'ch4n';
      if (q.n + m > N_SLOTS) return 'slots';
    }
  } else if (q.kind === 'grid') {
    if (dch !== 2 && dch !== 4) return 'gridCh';
    if (!SHAPES[q.ask]) return 'ask';
    if (q.rows < GRID_R[0] || q.rows > GRID_R[1]) return 'rows';
    if (q.cols < GRID_C[0] || q.cols > GRID_C[1]) return 'cols';
    const tot = q.rows * q.cols;
    if (tot < GRID_TOT[0] || tot > GRID_TOT[1]) return 'tot';
    if (q.n !== tot) return 'nTot';
    if (q.miss && q.miss.length) return 'gridMiss';                 // 满阵无缺格
  } else if (q.kind === 'gridmiss') {
    if (dch !== 3 && dch !== 4) return 'gmCh';
    if (!SHAPES[q.ask]) return 'ask';
    if (q.rows < GRID_R[0] || q.rows > GRID_R[1]) return 'rows';
    if (q.cols < GRID_C[0] || q.cols > GRID_C[1]) return 'cols';
    const tot = q.rows * q.cols;
    if (tot < MISS_TOT[0] || tot > MISS_TOT[1]) return 'gmTot';
    if (!Array.isArray(q.miss) || q.miss.length < MISS_K[0] || q.miss.length > MISS_K[1]) return 'kRange';
    if (tot - q.miss.length < MISS_FLOOR) return 'floor';           // 缺格后 ≥10（域铁律）
    if (q.n !== tot - q.miss.length) return 'nSub';                 // 减法结构：n = r*c - k
    if (q.miss.filter((v, i, a) => a.indexOf(v) === i).length !== q.miss.length) return 'missDup';
    if (!q.miss.every(v => v >= 0 && v < tot)) return 'missRange';
  } else if (q.kind === 'dual') {
    if (dch !== 3 && dch !== 4) return 'dualCh';
    if (!q.dual) return 'dualObj';
    const d = q.dual;
    if (!SHAPES[d.shape] || !COLORS[d.color]) return 'dualLib';
    if (!SHAPES[d.d1s]) return 'd1sLib';
    if (!COLORS[d.d2c]) return 'd2cLib';
    if (d.d1s === d.shape) return 'd1sSame';                        // 同色异形干扰：形必异
    if (d.d2c === d.color) return 'd2cSame';                        // 同形异色干扰：色必异
    if (d.n < DUAL_N[0] || d.n > DUAL_N[1]) return 'dualN';
    if (d.d1 < DUAL_D[0] || d.d1 > DUAL_D[1] || d.d2 < DUAL_D[0] || d.d2 > DUAL_D[1]) return 'dualD';
    if (d.n + d.d1 + d.d2 > N_SLOTS) return 'dualSlots';
    if (q.ask !== d.shape + ':' + d.color) return 'askPair';
    if (Object.keys(q.scene).length !== 3) return 'dualScene';      // 恰 3 组合键
    if (q.scene[q.ask] !== d.n) return 'sceneN';
    if (q.scene[d.d1s + ':' + d.color] !== d.d1) return 'sceneD1';  // 同色异形在场（必在）
    if (q.scene[d.shape + ':' + d.d2c] !== d.d2) return 'sceneD2';  // 同形异色在场（必在）
  } else return 'kind';
  if (dch === 1 && q.kind !== 'count') return 'dch1kind';           // ch1 全为散点计数
  if (dch === 2 && q.kind !== 'grid') return 'dch2kind';            // ch2 全为满阵
  if (dch === 3 && q.kind !== 'gridmiss' && q.kind !== 'dual') return 'dch3kind';  // ch3 两子型
  if (q.scene[q.ask] !== q.n) return 'sceneAsk';
  if (q.opts.length !== 4) return 'len';
  const nums = q.opts.map(o => o.num);
  if (nums.filter((v, i, a) => a.indexOf(v) === i).length !== 4) return 'dup';
  if (!nums.every(x => x >= 1 && x <= 20)) return 'range';
  if (nums.filter(x => x === q.n).length !== 1) return 'ansN';
  if (q.answer !== nums.indexOf(q.n)) return 'ansIdx';
  if (nums.slice().sort().join() !== numSet(q.n).slice().sort().join()) return 'numSet';  // 候选=数学先验集
  if (prevQ && prevQ.kind === q.kind) {                            // 同型相邻互异
    const ka = prevQ.kind === 'dual' ? prevQ.ask
             : prevQ.kind === 'count' || prevQ.kind === 'grid' || prevQ.kind === 'gridmiss' ? prevQ.ask : '';
    const kb = q.kind === 'dual' ? q.ask : q.ask;
    if (ka === kb) return 'adjacent';
  }
  /* 槽位/阵列格一致：_place 数=scene 总数；散点槽互异界内；阵列格=满格-缺格 */
  const tot = Object.keys(q.scene).reduce((s, k) => s + q.scene[k], 0);
  if (q._place.length !== tot) return 'placeN';
  if (q.kind === 'grid' || q.kind === 'gridmiss') {
    const want = {};
    for (let i = 0; i < q.rows * q.cols; i++) want[i] = !(q.miss && q.miss.indexOf(i) >= 0);
    const got = {};
    q._place.forEach(p => { const idx = p.row * q.cols + p.cp; got[idx] = true; });
    for (let i = 0; i < q.rows * q.cols; i++) if (want[i] !== !!got[i]) return 'placeGrid';
    if (q._place.some(p => p.shape !== q.ask)) return 'placeShape';
  } else {
    const slots = q._place.map(p => p.slot);
    if (slots.filter((v, i, a) => a.indexOf(v) === i).length !== tot) return 'placeDup';
    if (!slots.every(s => s >= 0 && s < N_SLOTS)) return 'placeRange';
    const want = {};
    Object.keys(q.scene).forEach(k => {
      const shape = k.indexOf(':') > 0 ? k.split(':')[0] : k;
      const fill = k.indexOf(':') > 0 ? k.split(':')[1] : null;
      const key = shape + (fill ? '|' + fill : '');
      want[key] = (want[key] || 0) + q.scene[k];
    });
    const got = {};
    q._place.forEach(p => { const key = p.shape + (p.fill ? '|' + p.fill : ''); got[key] = (got[key] || 0) + 1; });
    if (Object.keys(want).some(k => want[k] !== got[k])) return 'placeIds';
  }
  if (q._miss !== 0 || q._answered) return 'init';
  return null;
}
/* ================= shapecount 主逻辑（r3 难度改造版：题面渲染双模式 / 数字卡点选 /
   目标点亮 / 教学（两个两个分组数）/ 救援 / 推进）
   玩法：题面 = 图形场景（r3 双模式：count/dual=散点 12 槽 / grid·gridmiss=r×c 阵列）
   + 题面句 TTS 拼句（count「三角形有几个？」=queue 链 [shc_q 任务锚, 题面句]；
   grid「排好队的图形，一共有几个？」/ gridmiss「有空格的图形，一共几个？」/
   dual「红色的圆形有几个？」）；一律 4 数字卡。ch4 全题漂移（drift-x 横摆 ±9px
   慢速 CSS 动画——r3 ④ 移动干扰：纯视觉层，判定 scene 真值不变）。
   点对 = 场景目标图形逐个点亮（count=ask 形 / grid·gridmiss=全阵 / dual=形+色双匹配）
   + 卡亮 + 确认句 TTS 拼句（「一共，有十二个」/「红色的圆形，有四个」——NUMCN 2=两）；
   点错 = 卡摇头 + queue 链 [shc_wrong clip, 语义引导句 TTS]（count/grid 按所点数字
   方向 / gridmiss 结构锚 / dual 两步过滤锚），1000ms 防重入窗（b16 定案）后可重选。
   救援两级（§0.68/家族 B 定版）：14s 方向级=重读题面+题面卡 pulse（lastDir 独立节流锚，
   不重置 lastAct）；30s 答案级=正确卡 breathe+重读。主动读题重置 lastAct idle 锚（b25 M4）。
   面板遮挡期救援静默（家族 K）。hint 按题型选播（r3 新增 shc_hint_grid/shc_hint_dual）。
   语音窗（家族 G/H/I，clip 实长=shc_ 浏览器实测 2026-09-10；r3 新增 hint_grid 3168/
   hint_dual 2976——hint 为 fire-and-forget 播放无后续窗依赖）：
   shc_tut_watch 3096 → 教学分组点前延至 t=900+3100=4000（≥3096+300=3396）；
   shc_tut_turn 1896 → turn 后读题延 2400（≥1896+300=2196 防尾截）；
   确认句 TTS 最长 10 全字符（黄色的三角形，有六个 estMs=10×345+600=4050）→
     判对演出窗 1800+3600=5400 ≥4050（错→对路径读题同延防链掐尾）；
   shc_right 2304 → winFlow celebrate(2620)+wait(600)=3220 ≥2304+300=2604（判对后窗）；
   shc_wrong 1968 + 引导句 TTS（estMs 最长 10 字符=4050）→ 拼播链 1968+150+4050=6168，
     错点防重入窗 1000ms；对选可打断链；救援读题掐链由 wrongChainUntil=7900 守卫
     （≥6168+300=6468，全字符口径）；
   教学分组数分账：900+3100+3×(250+250+900)+5400+500=14100 ≤16000。
   验收钩子：window.SC = { get currentLevel, get quiz, tapOpt(i), start(flat),
   async autoSolve(), get tutorial }（getter 返回拷贝）。
   tapOpt 返回值族（SPEC-BATCH28 §2 r3）：对='right'/末题对='done'/错='wrong'+miss+1/
   越界或演出窗=null（吞输入轻叮+容器 bump 照配——家族 D）。 */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
const replayAnim = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
/* 救援/开场任务语音/读题不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错链节流：flat<3 每错必播；flat≥3 走 10s 节流（家族 J：语义句全程保留，禁切通用 clip） */
let lastWrongVoice = 0;
let wrongChainUntil = 0;                         /* 错反馈链豁免窗终点（救援 interval 让路，家族 I） */
const sayW = parts => {
  if (!cur) return false;
  if (cur.flat < 3) { KIDS.voice.queue(parts); return true; }
  const now = Date.now();
  if (now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.queue(parts); return true; }
  return false;                            /* m2（审查 2026-09-10）：节流未播返回 false——豁免窗仅起播时设（契约 I「起播设」） */
};

const sceneEl = $id('scene'), boardEl = $id('board'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear'),
      ghostEl = $id('ghost');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();                       /* 30s 答案级 idle 锚（方向级不得重置它） */
let lastDir = Date.now();                       /* 14s 方向级独立节流锚（家族 B：与 lastAct 分离） */
let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）
let helpRedemo = false;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const cardEl = i => boardEl.querySelector('.card[data-i="' + i + '"]');
/* 漂移标记（r3 ④）：dch4 全题漂移——渲染/verify 钩子同源派生（禁散存题内，防两处漂移） */
const driftOf = L => L.dch === 4;

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 70);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：答对=双音上行 / 答错=低柔单音 */
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };

/* ================= 题面语音（四型统一 queue 链 [shc_q 任务锚, 题面句 TTS 拼句]
   ——SPEC §2 图形名/颜色名豁免 clip 化；verify 页 stub 记 __lastQueue/__lastSayText） ================= */
function speakQuiz() {
  if (!cur || !cur.quizzes[cur.step]) return;
  const q = cur.quizzes[cur.step];
  KIDS.voice.queue([VOICE.q].concat(quizKeys(q)));   /* T46 阶段2：题面段链 clip 化（题型句/色+形+尾句全键） */
}

/* ================= 渲染（r3 双模式：散点 scatter / 阵列 grid；漂移=drift-x 内联动画）
   外层定位 / 内层旋转缩放+入场动画分离（防 transform 覆盖）；图形 pointer-events:none
   不挡题面重听。渲染判定一致（r2 M1 铁律）：散点 data-id/data-slot ↔ _place.slot；
   阵列 data-id/data-row/data-cp ↔ (row,cp)（miss 格不渲染）；dual data-fill ↔ 组合键
   颜色段（fill 属性同源=shapeEl(id, fill)——verify DOM 级对账） ================= */
function renderScene(q) {
  const drift = driftOf(cur);
  sceneEl.dataset.kind = q.kind;
  sceneEl.dataset.mode = (q.kind === 'grid' || q.kind === 'gridmiss') ? 'grid' : 'scatter';
  sceneEl.dataset.drift = drift ? '1' : '0';
  sceneEl.setAttribute('aria-label', quizText(q) + '点我再听一遍');
  let h = '<div class="q-text">' + quizText(q) + '</div>';
  const gridMode = sceneEl.dataset.mode === 'grid';
  q._place.forEach((p, k) => {
    let pos, attrs, ph;
    if (gridMode) {
      pos = 'left:' + ((p.cp + 0.5) / q.cols * 100).toFixed(3) + '%;top:calc(' +
            (GRID_TOP[q.rows] + p.row * GRID_DY[q.rows]).toFixed(3) + '% + 22px)';
      attrs = 'data-row="' + p.row + '" data-cp="' + p.cp + '"';
      ph = p.row * q.cols + p.cp;
    } else {
      const col = p.slot % 4, row = Math.floor(p.slot / 4);
      pos = 'left:' + (col * 25 + 12.5) + '%;top:' + (28 + row * 29) + '%';
      attrs = 'data-slot="' + p.slot + '"';
      ph = p.slot;
    }
    const anim = drift ? ';animation:drift-x ' + (7 + ph % 4) + 's ease-in-out ' +
                 (-(ph * 0.9)).toFixed(1) + 's infinite' : '';
    h += '<span class="sc-shape" data-id="' + p.shape + '" ' + attrs +
         (p.fill ? ' data-fill="' + p.fill + '"' : '') +
         ' style="' + pos + anim + '">' +
         '<span class="sc-in" style="transform:rotate(' + p.rot + 'deg) scale(' + p.scale + ');animation-delay:' + (k * 60) + 'ms">' +
         shapeSvg(p.shape, p.fill ? COLORS[p.fill].col : null) + '</span></span>';
  });
  sceneEl.innerHTML = h;
}
function renderBoard(q) {                        // 四型一律 4 数字卡（大数字+「个」）
  boardEl.innerHTML = '';
  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'ncard card pop';
    b.dataset.i = i;
    b.dataset.num = o.num;                       // verify 对账（渲染即引擎）
    b.setAttribute('aria-label', o.num + '个');
    b.style.animationDelay = (i * 70) + 'ms';
    b.innerHTML = '<span class="num">' + o.num + '</span><span class="nlab">个</span>';
    boardEl.appendChild(b);
  });
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderScene(q);
  renderBoard(q);
  renderStep();
  if (!VERIFY && !state.demo && !state.quiet) speakQuiz();  /* 开场/换题读题；demo 门防演示收尾叠播 */
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 答对演出：场景目标图形逐个点亮
   （count=ask 形 / grid·gridmiss=全阵 / dual=形+色双匹配——渲染判定同源：data-id+data-fill）
   + 卡亮（确认句 TTS 由 uiTapOpt 播）；verify 页跳点亮直接落定 ---------- */
function lightShapes(q) {
  let cells;
  if (q.kind === 'dual')
    cells = sceneEl.querySelectorAll('.sc-shape[data-id="' + q.dual.shape + '"][data-fill="' + q.dual.color + '"]');
  else if (q.kind === 'grid' || q.kind === 'gridmiss')
    cells = sceneEl.querySelectorAll('.sc-shape');
  else
    cells = sceneEl.querySelectorAll('.sc-shape[data-id="' + q.ask + '"]');
  Array.prototype.forEach.call(cells, (c, k) => {
    setTimeout(() => c.classList.add('lit'), k * 320 * SPEED + 250 * SPEED);
  });
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向：当前题正确卡（数字卡） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const i = correctIdx(q);
  if (i >= 0) pointGhostAt(cardEl(i));
}

/* ================= 点卡主路径（真实点击 / SC.tapOpt / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（卡排容器 bump 微动效——家族 D）；
   错点 1000ms 防重入窗（b16 定案禁偏离）：窗内 locked 吞点（pop+bump）；
   越界下标/演出窗=null+pop+bump（钩子契约：对 right/错 wrong/越界·演出窗 null）========== */
async function uiTapOpt(i, demo) {
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return null;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  const run = cur;                               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapOpt(cur, i);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }
  const el = cardEl(i);

  if (r === 'wrong') {                           /* 答错：摇头+shc_wrong+语义引导句（方向/结构/两步锚） */
    state.locked = true;
    if (el) replayAnim(el, 'wig');
    dodgeLo();
    if (sayW([VOICE.wrong.key, { key: guideKeyOf(q, i), text: guideText(q, i) }]))  /* T46 阶段2：引导句 clip 化（m2：仅链起播时设窗） */
      wrongChainUntil = Date.now() + 7900;       /* 链豁免（家族 I）：1968+150+引导 clip 最长 3168+300=5586 ≤ 7900 */
    await wait(1000 * SPEED);                    /* 错点防重入窗 1000ms；对选可打断链；救援由 wrongChainUntil 让路 */
    if (cur !== run) return r;
    state.locked = false;
    return r;
  }

  /* ---- right·done（本题完成：目标图形逐个点亮+卡亮+确认句 TTS 拼句） ---- */
  lastAct = Date.now();                          /* 正确选择重置救援钟（§0.7a） */
  if (state.tut === 'help') {                    /* 教学"独"：首次选对 → 放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  if (el) { el.classList.remove('breathe'); el.classList.add('lit'); }
  chimeGoal();
  sfx('coin');
  if (cur === run) lightShapes(q);               /* 场景目标图形逐个点亮（按题型选目标集） */
  const cKeys = confirmKeys(q);
  KIDS.voice.queue(cKeys);                       /* T46 阶段2：确认句段链 clip 化（dual 4 段/grid 2 段） */
  await wait(1800 * SPEED);                      /* 图形点亮+卡亮+确认链主窗 */
  if (cur !== run) return r;
  await wait(Math.max(3600, chainMs(cKeys) + CONFIRM_PAD - 1800) * SPEED);
                                                /* T46 确认链收尾窗：max(estMs 窗 5400, 链实长+PAD)——dual 6186+300
                                                   超 estMs 窗，clip 链口径动态补足（calendar 先例）；
                                                   错→对路径读题延 ≥5400 防错反馈链掐在 <500ms */
  if (cur !== run) return r;
  state.locked = false;
  if (r === 'done') { winFlow(); return 'done'; }
  renderQuiz();                                  /* 新题（场景/卡全换）+读题 */
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关随机章型 GEN[dch-1]（家族 F：
     genLevel 纯函数确定性，同 flat 恒同 dch——预告与实际章型恒一致；禁 (ci+1)%4 章序推进） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  sayR(VOICE.right.key, VOICE.right.text);       /* shc_right：数对啦，真棒（2304ms） */
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(async () => {
    await wait(600);                             /* 家族 H：celebrate 2620+600=3220 ≥ shc_right 2304+300=2604（判对后窗） */
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });   /* 家族 A：winFlow 传 nextHint(null)（b25 形态定版） */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  lastWrongVoice = 0; wrongChainUntil = 0;      /* 换关重置错反馈节流锚与链豁免（家族 I/J 配套） */
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();                          /* 主动读题路径重置 idle 锚（b25 M4） */
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.shapecount && sv.shapecount.tutSeen);
  if (VERIFY) return;                            // verify 页：教学链由 runVerify 单元直调
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  speakQuiz();                                   /* 开场读题面 */
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=幽灵手指**两个两个分组点**圆形（每组点 2 个+组末计数 TTS「两个/四个/六个」——
   r3 分组策略教学：6-7 岁跳过逐个数用 2 个 2 个数；estMs(2字符)=1290 罩内）
   → 演示点正确数字卡（确认句「圆形，有六个」=报总数收束）→帮=指向正确卡；独=首次选对放手
   （watch 全程 ≤16s——build 静态断言分账：900+3100+3×1400+5400+500=14100）
   时序（家族 G/H）：watch clip 3096ms → t=900 场景亮相+手指就位 → 再延 3100 至 t=4000
   ≥3096+300=3396（clip 播完再分组点，计数 TTS 不与 watch 撞头）；
   每组 250+250（两小步移动+按停）+900（组末计数 TTS+驻留）=1400；
   演示演出窗 5400 罩确认句 TTS 再收束 turn ---------- */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);       /* shc_tut_watch：看！图形里有几个（3096ms） */
  await wait(900 * SPEED);                       /* 场景亮相 */
  const q = cur.quizzes[0];                      // flat0 题0 恒 circle×6（确定性锚点）
  const cells = Array.prototype.slice.call(sceneEl.querySelectorAll('.sc-shape[data-id="circle"]'));
  if (cells.length) { ghost.toEl(cells[0]); ghost.show(); }
  await wait(3100 * SPEED);                      /* t=900+3100=4000 ≥ watch 3096+300=3396：clip 播完（手指就位漂浮） */
  const groups = Math.ceil(cells.length / 2);    // 6 个 → 3 组（两个两个数）
  for (let g = 0; g < groups; g++) {             // 幽灵手指分组点圆形——「两个两个数」
    ghost.toEl(cells[2 * g]);
    await wait(250 * SPEED);
    ghost.press();
    replayAnim(cells[2 * g].firstElementChild, 'bump');
    if (cells[2 * g + 1]) {
      ghost.toEl(cells[2 * g + 1]);
      await wait(250 * SPEED);
      ghost.press();
      replayAnim(cells[2 * g + 1].firstElementChild, 'bump');
    }

  renderQuiz(); renderDots();
  state.quiet = false;
  sayR(VOICE.turn.key, VOICE.turn.text);         /* shc_tut_turn：你来数一数（1896ms） */
  setTimeout(() => {

  }, 2400);                                      /* ≥1896+300=2196 防尾截（turn 后读题延，留辨别器 ±60ms 余量） */

   错反馈链豁免窗守卫在顶部（家族 I：链播完前救援不掐断，不挡主动点选）；
   面板遮挡期救援静默（家族 K——试玩 P2-3：层在时点击全吞却周期重播读题=压迫感） ================= */
function rescueTick() {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  if (Date.now() < wrongChainUntil) return;   /* 错反馈链豁免窗（家族 I）：链播完前救援不掐断 */
  if (document.querySelector('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel')) return;
  /* 面板遮挡期救援静默（家族 K：k-dayend/k-chapterend/k-resttip/k-celebrate/k-panel 在场即静默） */
  const idle = Date.now() - lastAct;
  if (idle > 30000) {                            /* 答案级：静音也能看见答案线索 */
    const q = cur.quizzes[cur.step];
    if (q) {
      const i = correctIdx(q);
      if (i >= 0) { const ok = cardEl(i); if (ok) replayAnim(ok, 'breathe'); }
      speakQuiz();
    }
    lastAct = Date.now();
    return;
  }
  if (idle > 14000 && Date.now() - lastDir > 14000) {   /* 方向级：重读题面+题面卡 pulse（不动 lastAct） */
    speakQuiz();
    replayAnim(sceneEl, 'pulse');
    lastDir = Date.now();
    return;
  }
  if (idle > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {
    helpRedemo = true;
    pointHelpNext();
  }
}

  get currentLevel() {
    if (!cur) return null;
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.quizzes.length,
             step: cur.step, done: cur.done, won: state.won,
             miss: cur.retries, stars: engStars(cur) };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    const scene = {};
    Object.keys(q.scene).forEach(k => { scene[k] = q.scene[k]; });
    return { kind: q.kind,                                  /* 'count'|'grid'|'gridmiss'|'dual'（SPEC §2 r3） */
             scene: scene,                                  /* {图形id:数量} 或 {'图形:颜色':数量}（拷贝） */
             ask: q.ask,                                    /* count=图形 id / dual='图形:颜色' / grid·gm=图形 id */
             rows: q.rows != null ? q.rows : null,          /* grid/gridmiss 行数 */
             cols: q.cols != null ? q.cols : null,          /* grid/gridmiss 列数 */
             missCells: q.miss ? q.miss.slice() : null,     /* gridmiss 缺格 idx 数组（r3 新键） */
             dual: q.dual ? { shape: q.dual.shape, color: q.dual.color, n: q.dual.n,
                              d1s: q.dual.d1s, d1: q.dual.d1, d2c: q.dual.d2c, d2: q.dual.d2 } : null,
             n: q.n,                                        /* 真值总数（各型自洽：r*c(-k)/过滤数） */
             drift: driftOf(cur),                           /* ch4 漂移标记（渲染/verify 同源） */
             opts: q.opts.map(o => ({ num: o.num })),
             answer: q.answer,
             step: cur.step,
             miss: q._miss || 0 };                          /* 本题错选数（原契约语义不变） */
  },
  tapOpt(i) { return uiTapOpt(i); },
  async autoSolve() {                    // UI 路径自动点完当前关（逐题点应选卡，走真实判定链）
    let taps = 0, guard = 0;
    while (cur && !cur.done && guard++ < 100) {

      if (i < 0) break;
      const r = await uiTapOpt(i);
      if (r === false || r === null) break;      // 锁死/重玩保护
      taps++;
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
  get tutorial() { return state.tut; }
};
