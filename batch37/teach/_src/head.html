<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>教会小兔子</title>
<style>
/* ================= 教会小兔子 teach（batch37·扩容批 7；r5 难度改造 2026-09-13）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 一节三步小课（SPEC-BATCH37 §0.90/§3 + §6 r5，7-8 岁元认知·协作心智）：
   示范（点托盘苹果数 N 个入碗——r5 n≥10 按群策略条：一个一个/两个两个/五个五个，
   组块飞入+组末计数；碗点阵每颗标序号=数感锚）→ 兔子学（学习碗逐颗摆并标报数序列
   ——r5 错误三类：漏数/重复/换序，读过程判定）→ 纠错（生成化 4 选诊断卡——正确
   +同型错参+异型+无错）。
   触摸目标：诊断卡 ≥96×96、托盘苹果 ≥44（大数缩档）/组块 ≥64×64、策略钮 ≥44 高；
   overflowX 恒 0。款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：小课堂（兔子老师位 + 双碗板 + 问句条 + 策略条/托盘/诊断卡行） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:6px 12px}
#scene{flex:0 0 auto;position:relative;width:min(680px,94vw);border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F6E2BE 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:row;align-items:center;
  justify-content:center;gap:14px;padding:12px 16px}
#scene.bump{animation:tch-bump .22s ease}
@keyframes tch-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
#scene.wig{animation:tch-wig .5s ease}
@keyframes tch-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}
  50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}

/* 学生小兔子（教学对象：normal 观察 / happy 学会跳；peek=探头看碗） */
#rabbit-wrap{flex:0 0 auto;position:relative;width:104px;height:104px;border-radius:50%;background:#FFF9EE;
  border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4;display:flex;align-items:center;justify-content:center}
#rabbit-wrap svg{width:84px;height:84px}
#rabbit-wrap.peek{animation:tch-peek .8s ease}
@keyframes tch-peek{0%,100%{transform:translateX(0) rotate(0)}35%{transform:translateX(14px) rotate(7deg)}
  70%{transform:translateX(10px) rotate(4deg)}}
#rabbit-wrap.shake{animation:tch-shake .4s ease}
@keyframes tch-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
#rabbit-wrap.hop{animation:tch-hop .5s cubic-bezier(.3,1.6,.5,1) 3}
@keyframes tch-hop{0%,100%{margin-bottom:0}50%{margin-bottom:14px}}
/* 兔子说泡（我来试试） */
#rabbit-say{position:absolute;left:50%;top:-34px;transform:translateX(-50%) translateY(6px);opacity:0;
  background:#FFF9EE;border:2.5px solid #4A3B2E;border-radius:14px;padding:3px 12px;
  font-size:16px;font-weight:700;color:#4A3B2E;box-shadow:0 3px 0 #D8C9B4;white-space:nowrap;
  transition:opacity .3s, transform .3s}
#rabbit-say.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 双碗板：老师碗（示范）+ 兔子碗（学习）——苹果点阵逐个显示（数感锚非数字文字；
   r5 每颗标序号徽章 .num=报数可视化——漏数/重复/换序的判定载体） */
#board{flex:1 1 auto;display:flex;gap:14px;align-items:flex-end;justify-content:center}
.bowl-wrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:196px}
.bowl-dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:flex-end;
  min-height:34px;max-width:200px;padding:0 2px}
.bowl-dots .apple{width:26px;height:26px;position:relative;animation:tch-pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes tch-pop{0%{transform:scale(.2)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
/* r5 按群分组点亮：一组聚拢进 .grp（组内紧组间疏——群结构可视） */
.bowl-dots .grp{display:flex;gap:2px;padding:2px 3px;border-radius:9px;background:rgba(232,151,90,.14);
  border:1.5px dashed rgba(232,151,90,.55);animation:tch-pop .3s cubic-bezier(.2,1.6,.4,1)}
.bowl-dots .grp .apple{width:22px;height:22px}
/* 序号徽章（r5 报数序列标签）：苹果右上角小圆牌 */
.apple .num{position:absolute;top:-8px;right:-6px;min-width:17px;height:17px;padding:0 3px;
  border-radius:9px;background:#4A3B2E;color:#FFF9EE;font-size:11.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;z-index:2}
.bowl-svg{width:196px;height:94px}
.bowl-wrap.dim .bowl-dots .apple{opacity:.5}
.bowl-tag{font-size:14px;font-weight:700;color:#4A3B2E;background:#FDEBD2;border:2px solid #4A3B2E;
  border-radius:10px;padding:1px 10px}
/* 学习碗修正动画：拿走一颗（升起飞离）/补一颗（弹入）/归位两颗（fixed 脉冲） */
.apple.away{animation:tch-away .7s ease forwards}
@keyframes tch-away{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-30px) scale(.4);opacity:0}}
.apple.fixed{animation:tch-fixed .7s cubic-bezier(.2,1.6,.4,1) 2}
@keyframes tch-fixed{0%,100%{filter:none}50%{filter:brightness(1.35) drop-shadow(0 0 6px rgba(143,191,127,.9))}}

/* 问句条（show 相位=任务句文本——渲染即引擎；rabbit/fix=相位句；fix 复现题=老毛病句） */
#q-text{font-size:20px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4;
  flex:0 0 auto;align-self:center;max-width:94vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 策略条（r5 按群计数：n≥10 在场——一个一个/两个两个/五个五个） ---------- */
#groupbar{flex:0 0 auto;display:flex;gap:10px;align-items:center;justify-content:center;
  transition:opacity .35s;min-height:40px}
#groupbar.off{opacity:0;pointer-events:none}
.gmode{font-size:15px;font-weight:700;color:#4A3B2E;background:#FFF9EE;border:2.5px solid #4A3B2E;
  border-radius:12px;padding:5px 13px;box-shadow:0 3px 0 #D8C9B4;transition:transform .12s, background .2s}
.gmode:active{transform:translateY(2px)}
.gmode.active{background:#E8975A;color:#FFF9EE}

/* ---------- 托盘行（show 阶段点苹果/组块入碗）与 诊断卡行（fix 阶段 4 卡）：常驻 DOM，
   off 态只隐不删（可测可量） ---------- */
#tray, #fixcards{flex:0 0 auto;display:flex;gap:14px;align-items:center;justify-content:center;
  flex-wrap:wrap;row-gap:8px;transition:opacity .35s, transform .35s;min-height:104px}
#tray.off, #fixcards.off{opacity:0;pointer-events:none;transform:translateY(14px)}
#tray.wig, #fixcards.wig{animation:tch-wig .5s ease}
#tray.dim .t-apple, #tray.dim .t-group{opacity:.4}
.t-apple{width:64px;height:64px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .12s, opacity .3s}
.t-apple:active{transform:translateY(3px)}
.t-apple svg{width:46px;height:46px}
/* r5 大数逐个档（n≥10）：缩为 48px wrap 多行（逐个数可行但慢——视觉即暗示按群高效） */
.t-apple.sm{width:48px;height:48px}
.t-apple.sm svg{width:34px;height:34px}
/* r5 组块（按群 tap 目标）：块内 g 颗小苹果并排，暖底圆角块 */
.t-group{min-width:64px;min-height:64px;border-radius:14px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;gap:1px;
  padding:4px 7px;transition:transform .12s, opacity .3s}
.t-group:active{transform:translateY(3px)}
.t-group svg{width:26px;height:26px}
.fixcard{min-width:104px;min-height:96px;max-width:168px;border-radius:18px;background:#FFF9EE;
  border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;padding:7px 9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:transform .12s}
.fixcard:active{transform:translateY(3px)}
.fixcard svg{width:40px;height:40px;flex:0 0 40px}
.fixcard .fx-label{font-size:15px;font-weight:700;color:#4A3B2E;line-height:1.25;text-align:center}
.fixcard.ok{background:#E7F2DF;box-shadow:0 4px 0 #8FBF7F}
.fixcard.dim{opacity:.45}
.fixcard.shake{animation:tch-shake .4s ease}
.fixcard.breathe{animation:tch-br 1.2s ease-in-out infinite}
@keyframes tch-br{0%,100%{box-shadow:0 0 0 0 rgba(232,151,90,0)}
  50%{box-shadow:0 0 0 7px rgba(232,151,90,.75)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:tch-dhop .45s ease 2}
@keyframes tch-dhop{0%,100%{margin-top:0}50%{margin-top:-14px}}

/* ---------- 幽灵手指教学（照 batch21-36） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .7s ease,top .7s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：舞台收紧，触摸面仍达标 */
@media (orientation:portrait){
  #scene{width:min(470px,96vw);flex-direction:column;gap:8px}
  #rabbit-wrap{width:84px;height:84px}
  #rabbit-wrap svg{width:68px;height:68px}
  #board{flex-direction:row;gap:8px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
  .bowl-wrap{min-width:158px}
  .bowl-svg{width:158px;height:76px}
  .bowl-dots{max-width:164px;min-height:30px}
  .bowl-dots .apple{width:22px;height:22px}
  .bowl-dots .grp .apple{width:19px;height:19px}
  .apple .num{min-width:15px;height:15px;font-size:10px;top:-6px;right:-5px}
  #q-text{font-size:17px;padding:3px 14px}
  .gmode{font-size:13px;padding:4px 9px}
  .t-apple{width:56px;height:56px}
  .t-apple svg{width:40px;height:40px}
  .t-apple.sm{width:44px;height:44px}
  .t-apple.sm svg{width:31px;height:31px}
  .t-group{min-width:56px;min-height:56px;padding:3px 5px}
  .t-group svg{width:22px;height:22px}
  .fixcard{min-width:96px;min-height:96px;padding:6px 6px}
  .fixcard .fx-label{font-size:13px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="教会小兔子">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="小课堂：兔子在学数数">
      <div id="rabbit-wrap" aria-hidden="true">
        <div id="rabbit-body"></div>
        <div id="rabbit-say">我来试试！</div>
      </div>
      <div id="board">
        <div class="bowl-wrap" id="teach-bowl-wrap" aria-label="老师的碗：示范数数">
          <div class="bowl-dots" id="teach-dots"></div>
          <div class="bowl-svg" id="teach-bowl"></div>
          <div class="bowl-tag">老师的碗</div>
        </div>
        <div class="bowl-wrap" id="learn-bowl-wrap" aria-label="兔子的碗：它数的数">
          <div class="bowl-dots" id="learn-dots"></div>
          <div class="bowl-svg" id="learn-bowl"></div>
          <div class="bowl-tag">兔子的碗</div>
        </div>
      </div>
    </div>
    <div id="q-text"></div>
    <div id="groupbar" class="off" aria-label="数数方法：一个一个数，还是几个几个数"></div>
    <div id="tray" class="off" aria-label="苹果托盘：点一个数一个"></div>
    <div id="fixcards" class="off" aria-label="兔子数对了吗：选一张帮帮它"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
