<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>感谢的话</title>
<style>
/* ================= thanks 感谢的话（batch37）=================
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E。
   玩法 = 帮助情景选回应卡（r12 难度改造 2026-09-15，SPEC-BATCH37 §7 真值现行版；
   v1 好坏二分/§1 作历史存档）：朋友帮了「你」（受助视角——主语反转，与 b36
   comfort 差异声明三重差异之一），舞台小动物朋友帮你后期待地看着你（角色
   SVG+期待表情），题面=情景句 keyless TTS（say 非队列链，零文字依赖）+
   题型框架锚串播（fit/size=tha_fit「想一想，哪个最合适」/ anti=tha_not
   「哪一句，现在不该说」——反向题）；下方 2-3 张回应卡（tier 图+短词）：
   ch1-2 fit 场合适配两选（对老师/家人同伴——同 label 跨情景 tier 翻转防
   「永远鞠躬」启发式）/ ch3 size 强度匹配三选（大帮忙热烈·小帮忙轻声）/
   ch4 anti 反向辨析三选（点**不该说**的那句=对——比赛输了谢对手=合时宜 ok）。
   选答案卡=朋友开心演出+right+th_right；选灰卡（择优次档）=朋友半好态
   meh+tha_gray「有点用，还有更合适的哦」（SEL 温和不否定）；anti 点 ok 卡=
   meh+tha_ok 消除式反馈；选 bad 卡=wrong+th_wrong「朋友会伤心的」
   （SEL 铁律：温和指向行为后果，禁人身评价）。
   触摸目标：回应卡 ≥96×96（实测 ~160）；overflowX 恒 0。
   各 tier 卡视觉同构（不靠颜色歧视——语义承载在图+语音）。
   竖屏双通道：@media (orientation:portrait) + body.port 类通道逐条等值
   （r9 M-A1/r11 M-1 同型——verify simView 无真 orientation 时类通道兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：朋友演出区（帮完你→期待回应） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;overflow:hidden;padding:6px 12px}
#scene{position:relative;flex:1 1 auto;width:100%;max-width:560px;min-height:230px;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:2px;
  background:linear-gradient(180deg,#FDF3E3 0%,#FAE9CF 100%);
  border:3px solid #E5CDA6;border-radius:26px;overflow:hidden;
  box-shadow:inset 0 0 0 5px rgba(255,249,238,.55)}
/* 地面线：朋友站的地方 */
#scene .ground{position:absolute;left:8%;right:8%;bottom:34px;height:14px;border-radius:50%;
  background:rgba(201,179,138,.35)}
#friend{width:168px;height:156px;pointer-events:none;position:relative;z-index:2}
#friend svg{width:100%;height:100%}
/* 表情组切换（容器类控 mood：sad 题面期待态 / meh r12 半好态 / happy 开心演出
   ——契约 M DOM 类层锚）
   th 语义：sad 类=朋友帮完你后期待地看着你（睁眼微笑+小盼头）非伤心；
   meh 类=灰卡/anti-ok 后果（平眉睁眼小平笑——有点用还没到最好，不否定已选） */
#friend .fx-happy,#friend .fx-meh{display:none}
#friend.meh .fx-sad{display:none}
#friend.meh .fx-meh{display:block}
#friend.happy .fx-sad,#friend.happy .fx-meh{display:none}
#friend.happy .fx-happy{display:block}
/* 期待出场：轻轻左右盼（头微摆+小浮） */
#friend.sad{animation:fr-sway 2.4s ease-in-out infinite}
@keyframes fr-sway{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-1.2deg) translateY(1px)}}
/* 半好态（r12 灰卡/anti-ok：轻晃一下——不期待也不失落） */
#friend.meh{animation:fr-meh 1.8s ease-in-out infinite}
@keyframes fr-meh{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(2px) rotate(1.2deg)}}
/* 重播期待：重演点头一拍（方向级救援/重听配动效） */
#friend.wait{animation:fr-nod 1.1s ease}
@keyframes fr-nod{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(5px) rotate(2.5deg)}}
/* 失落（点坏卡瞬间：低头垂肩一拍——SEL：指向行为后果不羞辱） */
#friend.sadder{animation:fr-down .5s ease}
@keyframes fr-down{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(10px) rotate(-3deg)}}
/* 开心：跳两下（答案卡=朋友开心演出） */
#friend.happy{animation:fr-joy .55s ease 2}
@keyframes fr-joy{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px) scale(1.04)}}
/* 期待小星（fx-sad 组内，一闪一闪） */
#friend .wish{animation:wish-tw 1.4s ease-in-out infinite}
@keyframes wish-tw{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
/* 情景道具（舞台右下小图标） */
#prop{position:absolute;right:16px;bottom:14px;width:56px;height:56px;z-index:1;opacity:.95}
#prop svg{width:100%;height:100%}
/* 星星彩带（开心演出层：JS 撒 6 颗） */
.spark{position:absolute;z-index:5;pointer-events:none;width:22px;height:22px;
  animation:spark-fly .9s ease-out forwards}
@keyframes spark-fly{0%{transform:translateY(0) scale(.4);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
#q-text{flex:0 0 auto;font-size:15px;letter-spacing:2px;color:#8A7B6C;padding:0 0 6px}

/* ---------- 回应 2-3 张：大卡（图+短词），≥96×96 ---------- */
#cards{flex:0 0 auto;display:flex;justify-content:center;align-items:stretch;gap:18px;
  width:100%;max-width:760px;padding:4px 14px 10px}
#cards.wig{animation:cds-wig .5s ease}
@keyframes cds-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.6deg)}75%{transform:rotate(1.6deg)}}
#cards.bump{animation:cds-bump .22s ease}
@keyframes cds-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  width:210px;min-height:158px;padding:10px 12px 12px;border-radius:22px;
  background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  transition:transform .15s}
.card-wrap:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card-wrap .art{width:104px;height:76px;pointer-events:none}
.card-wrap .art svg{width:100%;height:100%}
.card-wrap .word{font-size:21px;font-weight:800;color:#4A3B2E;letter-spacing:1px}
/* 好卡被选中：亮起+心跳（演出层锚 .good——契约 M） */
.card-wrap.good{animation:cd-good 1.1s ease}
@keyframes cd-good{0%{transform:scale(1)}35%{transform:scale(1.12) translateY(-6px)}100%{transform:scale(1)}}
/* 坏卡被点：左右摇头（行为后果反馈，不羞辱） */
.card-wrap.bad{animation:cd-bad .5s ease}
@keyframes cd-bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* 灰卡/anti-ok 被点（r12）：轻降饱和+微缩一拍（SEL 温和——次优非错误，不摇头） */
.card-wrap.gray{animation:cd-gray .5s ease;filter:saturate(.55) brightness(.97)}
@keyframes cd-gray{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
/* 救援答案级：好卡高亮呼吸 */
.card-wrap.breathe{animation:cd-hint 1.2s ease-in-out infinite}
@keyframes cd-hint{0%,100%{box-shadow:0 5px 0 #D8C9B4}50%{box-shadow:0 5px 0 #D8C9B4,0 0 16px rgba(232,151,90,.95)}}
/* 出场弹入 */
.card-wrap.pop{animation:cd-pop .45s ease backwards}
@keyframes cd-pop{0%{transform:translateY(26px) scale(.86);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，教学演示/帮共用；照家族形态） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：舞台收紧+卡横排收窄。
   双通道（r9 M-A1/r11 M-1 定版）：@media 真竖屏 + body.port 类通道（verify
   simView 在横视口下用类通道模拟竖屏——两段规则逐条等值，改必同步）；
   #friend 横 168/竖 140=portStyle 固定尺寸判别锚（verify 断言）。 */
@media (orientation:portrait){
  #scene{min-height:200px;max-width:460px}
  #friend{width:140px;height:130px}
  #cards{gap:12px;max-width:640px}
  .card-wrap{width:168px;min-height:140px}
  .card-wrap .art{width:88px;height:64px}
  .card-wrap .word{font-size:18px}
}
body.port #scene{min-height:200px;max-width:460px}
body.port #friend{width:140px;height:130px}
body.port #cards{gap:12px;max-width:640px}
body.port .card-wrap{width:168px;min-height:140px}
body.port .card-wrap .art{width:88px;height:64px}
body.port .card-wrap .word{font-size:18px}
</style>
</head>
<body>
<div id="game" aria-label="感谢的话">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="朋友帮助你的情景">
      <div class="ground" aria-hidden="true"></div>
      <div id="friend" aria-hidden="true"></div>
      <div id="prop" aria-hidden="true"></div>
    </div>
    <div id="q-text" aria-hidden="true"></div>
    <div id="cards" aria-label="选一个感谢朋友的回应"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= thanks 纯引擎：确定性关卡生成 + 点卡判定（无 DOM，UI 与 verify 共用）
   r12 难度改造（SPEC-BATCH37 §7 真值现行版；v1 good:bool 好坏二分作历史存档）：
   种子 = mulberry32(flat * 7919 + 727)（本款常量 727 沿 v1，SPEC §0.88/§7）：
   同 flat 永远同关（重玩一致、verify 可检）。
   取题（§7 题库封闭 20 题=4 章×5；每关 5 题 kind-pure per-chapter）：
     静态关 flat<20：章 ch 的 5 题按关内偏移 rotate——scene=(ch-1)*5+((lv+qi)%5)
     （20 静态关覆盖全 20 题各 5 次；ch1-2 fit 两选/ch3 size 三选/ch4 anti 三选恒同档）；
     生成关 flat≥20：dch=ri(rnd,1,4) seeded 随机（域全档成立型——SPEC §0.88
     生成关策略=b33 硬性②显式声明：mulberry32 第一个随机数，先取数保确定性），
     从对应**单章池** seeded 无放回抽 5（r12 池改 per-chapter kind-pure：
     dch1→题 0-4 / dch2→题 5-9 / dch3→题 10-14 / dch4→题 15-19——同关不混题型框架，
     框架锚（tha_fit/tha_not）随题播不串档；卡数 2/2/3/3 与 v1 dch≤2<10/dch≥3≥10 口径一致）。
   卡序：每题 cards seeded shuffle（best/bad 位置不恒定——禁位置学习）；
   rnd 消耗顺序恒定：生成关先抽 dch →（抽题，仅生成关）→ 逐题卡序 shuffle。
   answer（r12 按 kind 分流，verify 从 cards 独立推导复算禁读 quiz.answer 直比）：
     kind='fit'|'size'：answer=唯一 tier==='best' 的 i（择优解锚）
     kind='anti'    ：answer=唯一 tier==='bad' 的 i（反向解锚——senses anti 族先例：
                       点**不合时宜**的那句=对；恰 1 bad 防（>1）双真值）
   quiz 结构：{ scene(0-19), kind('fit'|'size'|'anti'), say(情景句), anim, prop,
                cards[{tier,label,icon}], answer, _miss, _answered }
   铁律：每关 5 题；tier 分布语义先验（structWhy 按 kind 校验：
     fit=[best,gray] / size=[best,gray,bad] / anti=[ok,ok,bad]）；
     miss 在本判定层计（b34 坑①：UI guard 判定前拦+预判与 core 严格同构）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;
/* r12 章→题池（per-chapter kind-pure，§7 定版）；卡数档=dch1/2 两选、dch3/4 三选 */
const poolOfDch = dch => {
  const base = (dch - 1) * 5;
  return [base, base + 1, base + 2, base + 3, base + 4];
};
/* 答案 tier（kind 分流）：fit/size='best' / anti='bad'——verify 复算同口径 */
const answerTierOf = kind => (kind === 'anti' ? 'bad' : 'best');

/* ---------- 单题构建：题库行 + seeded 卡序打散；answer 按 kind 取唯一解档 ---------- */
function buildQuiz(scene, rnd) {
  const row = SCENES[scene];
  const cards = shuffled(row.cards, rnd).map(c => ({ tier: c.tier, label: c.label, icon: c.icon }));
  const want = answerTierOf(row.kind);
  let answer = -1, hitN = 0;
  for (let i = 0; i < cards.length; i++) if (cards[i].tier === want) { hitN++; answer = i; }
  if (hitN !== 1) answer = -1;                       // 语义先验（SPEC §7 验算 ✓ 恒 1）：防御式兜底
  return { scene: scene, kind: row.kind, say: row.say, anim: row.anim, prop: row.prop,
           cards: cards, answer: answer, _miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   生成关 seeded 无放回抽 5（顺序即题序）；池=单章 5 题 kind-pure ---------- */
function pickScenes(dch, rnd) {
  const a = poolOfDch(dch).slice(), out = [];
  for (let k = 0; k < CH_LEN; k++) out.push(a.splice(ri(rnd, 0, a.length - 1), 1)[0]);
  return out;
}
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 727);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  let scenes;
  if (flat < STATIC_LEVELS) {
    scenes = poolOfDch(dch).map((_, k) => poolOfDch(dch)[(lv + k) % 5]);   // 静态关 dch===ch：章池 rotate
  } else {
    scenes = pickScenes(dch, rnd);                           // 生成关：单章池 seeded 抽 5
  }
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(scenes[qi], rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv, scenes: scenes,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点卡引擎（无 DOM）：engTapCard(L, i) —— 点当前题第 i 张回应卡
   'right' 点对（best 或 anti 唯一 bad）且本题完成推进 / 'done' 点对且末题=通关
   'wrong' 点非答案卡（gray/bad 于 fit·size；ok/bad 于 anti 点 ok）：该题 miss+1
            （retries 全关累计=星级口径），卡回可重点（探索不罚）
   null    非法下标 / 关卡已结束 / 本题已答 ---------- */
function engTapCard(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.cards.length) return null;
  if (i === q.answer) {
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（SPEC §0.88 miss 口径沿 v1：非答案点计）：全关 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：当前题答案卡下标（独立函数供 verify 复核） */
const correctIdx = q => !q ? -1 : q.answer;

/* ---------- 结构校验（verify 用，返回失败原因或 null）：scene 域 / kind 域 /
   卡数选数档 / tier 分布语义先验（按 kind）/ answer 复算 / label 集与题库行一致 /
   初始态干净 ---------- */
const TIERS_OF = { fit: ['best', 'gray'],
                   size: ['best', 'gray', 'bad'],
                   anti: ['ok', 'ok', 'bad'] };      // 分布多重集（kind 定档）
function structWhy(q, dch) {
  if (!q) return 'quiz';
  if (!Number.isInteger(q.scene) || q.scene < 0 || q.scene >= SCENES.length) return 'scene';
  const row = SCENES[q.scene];
  if (q.kind !== row.kind || !TIERS_OF[q.kind]) return 'kind';   // kind 与题库行一致且域合法
  const wantN = dch <= 2 ? 2 : 3;
  if (q.cards.length !== wantN || row.cards.length !== wantN) return 'cardsN';
  const tiers = q.cards.map(c => c.tier).sort().join('|');
  const wantT = TIERS_OF[q.kind].slice().sort().join('|');
  if (tiers !== wantT) return 'tiers';               // 语义先验：fit=[best,gray]/size=[best,gray,bad]/anti=[ok,ok,bad]
  const want = answerTierOf(q.kind);
  let hitN = 0, exp = -1;
  for (let i = 0; i < q.cards.length; i++) if (q.cards[i].tier === want) { hitN++; exp = i; }
  if (hitN !== 1) return 'hitN';                     // 恰一解档（best 或 bad）
  if (q.answer !== exp) return 'answer';             // answer=唯一解档下标复算
  const lbl = q.cards.map(c => c.label).sort().join('|');
  const lblRow = row.cards.map(c => c.label).sort().join('|');
  if (lbl !== lblRow) return 'labels';               // label 集与题库行一致（卡序无关）
  if (q.say !== row.say || q.anim !== row.anim) return 'say';
  if (q._miss !== 0 || q._answered) return 'dirty';
  return null;
}
/* ================= thanks 主逻辑（情景演出→框架锚→点回应卡→朋友开心/半好/失落）
   r12 难度改造（SPEC-BATCH37 §7 真值现行版；v1 好坏二分反馈作历史存档）：
   开题演出（presentQuiz）：朋友期待出场（左右盼+期待小星）+情景道具 + 题面
   情景句播报（T46 化 2026-09-19：KIDS.voice.play(sayClipOf(q), q.say) 全句 clip
   th_sc_1..20——零 keyless；窗=estMs(句长)+300+出场 400 动态保留，20 句实测
   clip 全部 ≤ estMs+300——窗不动零 pacing 回归，verify 逐句上界对账）→ **框架锚串播**（r12：
   fit/size=tha_fit「想一想，哪个最合适」择优方向锚 / anti=tha_not「哪一句，
   现在不该说」反向框架锚——不指认，锚文本与全部卡 label 无子串交集，verify 断言）。
   演出锁=真时钟 state.showUntil（Date.now() 比较，tapCard 演出期返 null——测试驱动须轮询等）。
   点答案卡（fit/size=best / anti=唯一 bad）=朋友开心演出（容器类 sad→happy：
   弯眼+咧嘴+跳两下+撒星星）+确认链 [th_right]（单 clip 窗 CELE_WIN 2124=1824+300
   精确——家族 H）。
   点灰卡（fit/size 的 gray 择优次档）=朋友**半好态 meh**（平眉睁眼小平笑——有点用
   还没到最好）+灰链 [tha_gray]（单 clip 豁免窗 GRAY_WIN 3180=2880+300 真时钟）
   +miss+1——SEL 温和：指向「还有更合适的」不否定已选行为。
   点 anti 的 ok 卡（合时宜句但非所问）=meh+反向错反馈 [tha_ok]（豁免窗
   ANTI_OK_WIN 3492=3192+300——消除式反馈「这句可以说，再找不该说的」不指认其余）。
   点 fit/size 的 bad 卡=坏卡摇头+朋友失落一拍（sadder 低头垂肩）+错链
   [th_wrong, th_hint]（豁免窗 4434=2040+150+1944+300 真时钟，契约 I）
   +首错卡区整体 wiggle（方向级不指卡）/ miss≥2 答案卡 breathe（答案级；anti 题禁用——
   breathe 落 bad 答案卡=同形反义，改 ok 卡保持 .gray 排除法视觉，P2-1）。
   SEL 铁律：坏反馈恒指向行为后果（th_wrong「朋友会伤心的」）禁人身评价；
   aria 统一「做法 」前缀（tier 不进 DOM 可读层——不泄答案）。
   救援：14s 方向级=重播情景句+朋友期待重演（lastDir 独立节流锚，不重置
   lastAct——契约 B）/ 30s 答案级=答案卡 breathe+重播（anti 题只走语音重播 tha_not
   反向框架锚——breathe 落 bad 卡反义，P2-1 同治）；错链·灰链豁免窗让路（契约 I）。
   兔子按钮/空白提示按题型分流（dirVoice：fit/size=tha_fit / anti=tha_not——
   同框架锚不泄答案级内容；th_hint 留守坏卡错链尾段）。
   验收钩子：window.TH = { get currentLevel, get quiz{scene,kind,say,cards[{tier,label}],
   answer,step,miss}, tapCard(i), start(flat), autoSolve() }——真实页同暴露（b29 坑⑥）。
   tapCard 返回：答案卡非末题 'right' / 答案卡末题 'done' / 非答案卡 'wrong' /
   豁免窗内非答案卡吞 false / 演出期 null（真时钟锁）/ 越界·已答·无题 null。 */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
const replayAnim = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
/* b25 定版 estMs（data 内同源定义——此处供窗断言与教学分账引用一致） */
/* 救援/开场任务语音不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错链节流：flat<3 每错必播；flat≥3 走 10s 节流（契约 J：语义句全程保留，禁切通用 clip；
   b36 m3 教训：教学迷你关 flat=-1 每错必播——条件写 cur.flat < 3） */
let lastWrongVoice = 0;
let wrongChainUntil = 0;                         /* 坏卡错链豁免窗终点（真时钟，救援 interval 让路——契约 I） */
let grayChainUntil = 0;                          /* r12 灰链/反向错反馈豁免窗终点（真时钟；与 wrongChainUntil 分离——两窗不同长恒斥于 kind） */
const sayW = parts => {
  if (!cur) return false;
  if (cur.flat < 3) { KIDS.voice.queue(parts); return true; }   /* 教学迷你关 flat=-1 每错必播（契约 J flat≥3 才节流） */
  const now = Date.now();
  if (now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.queue(parts); return true; }
  return false;                            /* 节流未播返回 false——豁免窗仅链起播时设（契约 I「起播设」） */
};

const sceneEl = $id('scene'), friendEl = $id('friend'), propEl = $id('prop'),
      qTextEl = $id('q-text'), cardsEl = $id('cards'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'),
      hearBtn = $id('btn-hear'), ghostEl = $id('ghost');

let cur = null;                                 // 当前关模型（genLevel/教学迷你关产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true, showUntil: 0 };
let lastAct = Date.now();                       /* 30s 答案级 idle 锚（方向级不得重置它——契约 B） */
let lastDir = Date.now();                       /* 14s 方向级独立节流锚（家族 B：与 lastAct 分离） */
let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）
let lastHearAt = 0;                             // 重听情景句 3s 节流锚
let helpRedemo = false;
let showRun = 0;                                // 演出令牌（重开关卡/新题/重演中止在途）
let firstFlat = 0;                              // 启动首个未通关 flat（教学完成后进入）

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const cardWrapAt = i => cardsEl.querySelector('.card-wrap[data-i="' + i + '"]');
/* r12 题型框架锚（presentQuiz 串播 / dirVoice 提示分流共用；不指认——文本与全部卡 label 无子串交集） */
const anchorOf = kind => kind === 'anti' ? VOICE.not : VOICE.fit;
const anchorWinOf = kind => kind === 'anti' ? NOT_WIN : PICK_WIN;

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  qTextEl.textContent = Q_TEXT;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 70);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成，家族马林巴音色）：答对=双音上行 / 答错=低柔单音 */
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(523.25, 0.12, 0, 0.3); };

/* ================= 渲染 ================= */
/* 朋友表情态（契约 M DOM 类层锚）：'sad' 题面期待态（豆眼微笑+期待小星——朋友帮完
   你后期待地看着你）/ 'meh' r12 半好态（平眉睁眼小平笑——灰卡/anti-ok 后果）
   / 'happy' 开心演出（弯眼+咧嘴+跳两下）——verify 三层断言依据 */
function setFriendMood(mood) {
  friendEl.classList.remove('sad', 'meh', 'happy', 'sadder');
  friendEl.classList.add(mood);
}
function renderQuiz() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  friendEl.innerHTML = friendSvg(q.anim);       // 朋友（含 fx-sad/fx-meh/fx-happy 表情组）
  setFriendMood('sad');                         // 题面态=期待（豆眼微笑+期待小星）
  propEl.innerHTML = propSvg(q.prop);           // 情景道具（帮助物：蜡笔/书/伞…）
  sceneEl.dataset.scene = q.scene;              // 帧内容锚（verify 断言渲染即引擎）
  sceneEl.dataset.kind = q.kind;                // r12 题型框架锚（fit/size/anti——verify 断言）
  cardsEl.innerHTML = '';
  cardsEl.dataset.n = q.cards.length;
  for (let i = 0; i < q.cards.length; i++) {
    const c = q.cards[i];
    const w = document.createElement('button');
    w.className = 'card-wrap pop';
    w.dataset.i = i;                            // 卡下标（点选语义）
    w.style.animationDelay = (i * 90) + 'ms';
    w.setAttribute('aria-label', '做法 ' + c.label);   /* r12 统一前缀（tier 不进 DOM 可读层——不泄答案） */
    const art = document.createElement('span');
    art.className = 'art';
    art.innerHTML = cardIconSvg(c.icon);
    const word = document.createElement('span');
    word.className = 'word';
    word.textContent = c.label;
    w.appendChild(art); w.appendChild(word);
    cardsEl.appendChild(w);
  }
  renderStep();
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 开题演出：渲染 → 题面情景句 clip（T46）→ 框架锚串播 → 开放点选
   演出锁=真时钟 showUntil（tapCard 演出期返 null）================= */
async function presentQuiz() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  renderQuiz();
  const run = cur, token = ++showRun;
  const sayWin = ENTER_MS + estMs(q.say) + 300;        // 出场 400 与题面 TTS 并行，窗=estMs+300（家族 T）
  const ancWin = anchorWinOf(q.kind);                  // r12 框架锚窗（fit/size=3108 / anti=3060，串播）
  state.locked = true;
  state.showUntil = Date.now() + (sayWin + ancWin) * SPEED + 140;   // 真时钟演出锁（余量）
  KIDS.voice.play(sayClipOf(q), q.say);         /* 题面情景句（T46 化：th_sc_* 全句 clip——零 keyless） */
  replayAnim(friendEl, 'wait');                 /* 期待出场重演（容器 .sad 已带期待摆动动画） */
  await wait(sayWin * SPEED);
  if (token !== showRun || cur !== run) return;
  const anc = anchorOf(q.kind);
  KIDS.voice.play(anc.key, anc.text);           /* r12 框架锚：tha_fit 择优方向 / tha_not 反向框架（不指认） */
  await wait(ancWin * SPEED);
  if (token !== showRun || cur !== run) return;
  state.locked = false;
  lastAct = Date.now();                          /* 演出完成开放点选（b25 M4：重置 idle 锚） */
  lastDir = Date.now();
}

/* 朋友开心撒星星（演出层：#scene 内 spark 元素 6 颗，CSS 随机方向飞散；
   spark 为 #scene 子元素 absolute 定位——坐标相对 #scene 内边距盒） */
function sparkBurst() {
  const r = sceneEl.getBoundingClientRect();
  for (let k = 0; k < 6; k++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.innerHTML = '<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg"><path d="M11 1 l2.6 6.4 L20 10 l-6.4 2.6 L11 19 l-2.6 -6.4 L2 10 l6.4 -2.6 Z" fill="#F5C542" stroke="#4A3B2E" stroke-width="1.6"/></svg>';
    const ang = -Math.PI / 2 + (k - 2.5) * 0.42;
    s.style.left = Math.round(r.width / 2 + (k - 2.5) * 26 - 11) + 'px';
    s.style.top = Math.round(r.height * 0.34) + 'px';
    s.style.setProperty('--dx', Math.round(Math.cos(ang) * 66) + 'px');
    s.style.setProperty('--dy', Math.round(Math.sin(ang) * 76) + 'px');
    sceneEl.appendChild(s);
    setTimeout(() => s.remove(), 1000 * SPEED + 60);
  }
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向：当前题答案卡（教学期泄答案=家族先例，帮→独后撤） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const i = correctIdx(q);
  if (i >= 0) pointGhostAt(cardWrapAt(i));
}

/* ================= 点卡主路径（真实点击 / TH.tapCard / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（卡区容器 bump 微动效——家族 D）；
   演出锁真时钟（演出期 null）；豁免窗 guard（I 补：错点吞/对选放行）========== */
async function uiTapCard(i, demo) {
  if (!cur || state.won) { sfx('pop'); replayAnim(cardsEl, 'bump'); return null; }
  if (!demo && (state.locked || state.demo || Date.now() < state.showUntil)) {
    sfx('pop');                                  /* 演出锁（真时钟）：吞+轻叮+bump */
    replayAnim(cardsEl, 'bump');
    return null;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.cards.length) { sfx('pop'); replayAnim(cardsEl, 'bump'); return null; }   // 越界
  if (q._answered) return null;
  /* b31 家族 I 补口径：错链/灰链豁免窗（真时钟）内非答案卡点吞——pop+bump 不计 miss；
     答案卡放行（缓解吞输入急性子观察）；窗后第二错照常计 miss（miss≥2 梯度可达） */
  if (!demo && i !== q.answer &&
      ((wrongChainUntil && Date.now() < wrongChainUntil) ||
       (grayChainUntil && Date.now() < grayChainUntil))) {
    sfx('pop'); replayAnim(cardsEl, 'bump'); return false;
  }
  const run = cur, token = showRun;              /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapCard(cur, i);
  if (r === null) { sfx('pop'); replayAnim(cardsEl, 'bump'); return null; }
  const el = cardWrapAt(i);
  const tier = q.cards[i].tier;                  /* r12 反馈分流档（fit/size：best|gray|bad；anti：ok|bad=答案） */

  if (r === 'wrong') {
    if (tier === 'gray' || tier === 'ok') {      /* ---- 灰卡/anti-ok：半好态+单 clip 反馈链（r12） ---- */
      const gWin = tier === 'ok' ? ANTI_OK_WIN : GRAY_WIN;
      state.locked = true;
      state.showUntil = Date.now() + gWin * SPEED + 140;
      dodgeLo();
      setFriendMood('meh');                      /* 半好态（平眉睁眼小平笑——不否定已选行为） */
      if (el) el.classList.add('gray');          /* 灰卡轻降饱和（非 bad 摇头——SEL 温和） */
      if (sayW([tier === 'ok' ? VOICE.ok.key : VOICE.gray.key]))   /* 单 clip 反馈链（tha_ok/tha_gray） */
        grayChainUntil = Date.now() + gWin;      /* 灰链豁免：GRAY_WIN 3180 / ANTI_OK_WIN 3492 真时钟（契约 I） */
      if (q._miss === 1) replayAnim(cardsEl, 'wig');           /* 方向级：卡区整体 wiggle 不指卡 */
      if (q._miss >= 2 && q.kind !== 'anti') {                 /* miss≥2=答案卡 breathe（答案级梯度）。
                                                                  P2-1（试玩实锤）：anti 题禁用——breathe 视觉语言
                                                                  「发光=该点」在反向题会落在 bad 答案卡上同形反义
                                                                  （孩子按 fit/size 学到的信号在 anti 题变成相反指令）；
                                                                  anti 的答案级方向由排除法承载：tha_ok 消除式反馈
                                                                  +ok 卡错后保持 .gray（下方不移除，两 ok 全灰
                                                                  =bad 唯一亮）=「已排除」视觉 */
        const ok = cardWrapAt(q.answer);
        if (ok) replayAnim(ok, 'breathe');
      }
      await wait(gWin * SPEED);
      if (cur !== run || token !== showRun) return r;
      if (q.kind !== 'anti' && el) el.classList.remove('gray');
                                                                  /* anti：ok 卡错后一律保持灰=排除法视觉（两 ok 全灰
                                                                     →bad 唯一亮；下题重建清零，灰卡仍可重点不罚）；
                                                                     其余路径卡回可重点（探索不罚） */
      state.locked = false;
      return r;
    }
    /* ---- bad 卡（fit/size）：摇头+朋友失落一拍+错链两段+视觉梯度（v1 沿用） ---- */
    state.locked = true;
    state.showUntil = Date.now() + SHAKE_MS * SPEED + 140;
    dodgeLo();

  /* ---- ④ frameM（契约 M 帧内容三层 ×flat0 fit/flat10 size/flat15 anti/flat20 生成关） ---- */
  total++;

    const sadOk = friendEl.classList.contains('sad') && !friendEl.classList.contains('happy') &&

    /* 演出层：点答案卡（独立推导）→ 演出中段采样朋友开心（happy）+答案卡 .good
       （tapCard resolve 后非末题会 presentQuiz 新题重置 DOM——断言须在演出窗内做） */
    const goodI = deriveAnswerV(q.cards, q.kind);

    await wait(250);                            // 演出中段（cele 窗 255ms@SPEED.12 中点）
    const happyOk = friendEl.classList.contains('happy') && !friendEl.classList.contains('sad');
    const wrapOk = (function () { const w = cardWrapAt(goodI); return !!w && w.classList.contains('good'); })();
    const r = await pF;

    return { ok: numOk && sadOk && joyOk && happyOk && wrapOk,
             why: JSON.stringify({ numOk, sadOk, joyOk, happyOk, wrapOk, r }) };
  }
  const fA = await frameCheck(0);      // dch1 fit 2 卡
  const fB = await frameCheck(10);     // dch3 size 3 卡
  const fC = await frameCheck(15);     // dch4 anti 3 卡（反向框架锚 tha_not）
  const fD = await frameCheck(20);     // 生成关（kind/卡数随 dch——帧断言不依赖卡数）
  const frameOk = fA.ok && fB.ok && fC.ok && fD.ok;

  /* ---- ⑤ grayPath（r12）：灰卡半好态+灰链豁免窗（吞/照计梯度） ---- */
  total++;
  startLevel(5);                                // ch2 fit：题5 熊奶奶（best 抱抱奶奶/gray 鞠躬说谢谢）
  await unlocked();
  const q5 = window.TH.quiz;
  const grayI = q5.cards.findIndex(c => c.tier === 'gray');   // 灰卡下标（独立推导）

  const mehMid = friendEl.classList.contains('meh') && !!friendEl.querySelector('.fx-meh');
  const grayMid = (function () { const w = cardWrapAt(grayI); return !!w && w.classList.contains('gray'); })();
  const rG = await pG;
  await unlocked();
  const chainG = window.__queueHist && window.__queueHist.some(h =>
                 h.length === 1 && h[0] === 'tha_gray' &&                // 灰链=tha_gray 单 clip
                 h.every(p => typeof p === 'string') && !keylessLast(h));
  const winSet = grayChainUntil > Date.now() - 100;                      // 豁免窗已设（GRAY_WIN 真时钟）
  const rejG = await window.TH.tapCard(grayI);                           // 窗内灰二击=吞 false（不计 miss）
  const miss1 = rG === 'wrong' && rejG === false && window.TH.quiz.miss === 1 &&
                mehMid && grayMid && chainG && winSet;

  await unlocked();

  /* ---- ⑥ badPath：bad 卡错路径+豁免窗（真时钟 4434：窗内吞/窗内答案放行/窗后二错照计） ---- */
  total++;

  /* ---- ⑦b antiRescue（P2-1 修复实证，试玩实锤回归锚）：anti 二错后 bad 答案卡

  const rB2 = await pB2;

  const missB2 = window.TH.quiz.miss;                              // 推进前记录（答案卡推进会清零）
  const grayB1b = cardWrapAt(okIs[0]).classList.contains('gray');  // 两 ok 全灰=bad 唯一亮

  /* ---- ⑧ delta 实锤断言：反启发式 tier 翻转+anti 分布+审计双例+不泄答案 ---- */
  total++;
  /* 翻转表（SPEC §7 设计定版硬编码）：label → {行号: 期望 tier}——「永远鞠躬/永远大声」

  const FLIP = {
    '鞠躬说谢谢': { 0: 'best', 1: 'best', 2: 'best', 3: 'best', 4: 'best', 5: 'gray', 7: 'gray', 8: 'gray', 9: 'gray' },
    '击掌说谢谢': { 1: 'gray', 4: 'gray', 7: 'best', 9: 'best' },
    '大声说谢谢': { 0: 'gray', 3: 'gray', 8: 'best', 12: 'best' },
    '小声说谢谢': { 10: 'gray', 11: 'best', 12: 'gray', 13: 'best', 14: 'gray' },
    '抱抱它':     { 10: 'best', 13: 'gray', 14: 'best' }
  };
  let flipBad = null, flipHits = 0;
  const lblRows = {};                            // 实测：label → {行号: tier}（全 20 题扫）
  for (let i = 0; i < 20; i++) SCENES[i].cards.forEach(c => {
    lblRows[c.label] = lblRows[c.label] || {};
    lblRows[c.label][i] = c.tier;
  });
  Object.keys(FLIP).forEach(lbl => {
    const exp = FLIP[lbl], got = lblRows[lbl] || {};
    Object.keys(exp).forEach(r => {
      if (got[r] !== exp[r]) flipBad = 'flip ' + lbl + '@' + r + '=' + got[r];
      else flipHits++;
    });
    if (Object.keys(got).length !== Object.keys(exp).length)
      flipBad = 'flipN ' + lbl + ' got ' + Object.keys(got).length;   // 出现次数全对账（无漏列）

  let antiBad = null;
  for (let i = 15; i < 20 && !antiBad; i++) {

    if (t !== 'bad|ok|ok') antiBad = 'dist ' + i + '=' + t;
  }
  /* 审计双例（AUDIT-56:85 示例逐条）：比赛输了谢对手=合时宜（题15 ok「对他说谢谢」）/
     被抢了玩具还说谢谢=不合时宜（题16 bad「对他说谢谢」） */
  const auditOk = SCENES[15].cards.some(c => c.tier === 'ok' && c.label === '对他说谢谢') &&
                  SCENES[15].cards.some(c => c.tier === 'bad' && c.label === '说我不玩了') &&
                  SCENES[16].cards.some(c => c.tier === 'bad' && c.label === '对他说谢谢');
  /* 不泄答案：aria 统一「做法 」前缀（tier 不进 DOM 可读层）+框架锚文本与全部卡

  startLevel(0);
  await unlocked();
  const ariaOk = Array.from(cardsEl.querySelectorAll('.card-wrap')).every((w, i) =>

    !/best|gray|bad|ok/.test(w.getAttribute('aria-label')));
  const anchors = [VOICE.fit.text, VOICE.not.text];
  const allLabels = [];
  SPEC_SCENES.forEach(s => s.cards.forEach(c => allLabels.push(c[1])));
  const noLeak = anchors.every(a => allLabels.every(l => l.length < 2 || a.indexOf(l) < 0));
  const deltaOk = !flipBad && !antiBad && auditOk && ariaOk && noLeak && flipHits === 25;   /* m1：SPEC 25 锚精确（flipN 全量对账兜底——判别力无损） */
  if (deltaOk) npass++;
  units.delta = { ok: deltaOk, flipBad: flipBad, flipHits: flipHits, antiBad: antiBad,
                  audit: auditOk, aria: ariaOk, noLeak: noLeak };

  /* ---- ⑨ pool：题库 20 题对账（SPEC §7 全表独立硬编码——情景句+kind+tier/label 多重集） ---- */
  total++;
  let poolBad = null;
  for (let i = 0; i < 20 && !poolBad; i++) {
    const spec = SPEC_SCENES[i], row = SCENES[i];
    if (row.say !== spec.say) { poolBad = 'say ' + i; break; }
    if (row.kind !== spec.kind) { poolBad = 'kind ' + i; break; }
    if (row.cards.length !== spec.cards.length) { poolBad = 'n ' + i; break; }
    const got = row.cards.map(c => c.tier + '\t' + c.label).sort().join('|');       // 多重集（卡序无关）
    const exp = spec.cards.map(p => p[0] + '\t' + p[1]).sort().join('|');
    if (got !== exp) { poolBad = 'cards ' + i; break; }
  }
  /* 20 题覆盖审计：静态 20 关每题恰现 5 次（§0.88 取题域全档成立——覆盖口径
     不锁取材序：只数每行出现次数，不验出现位置） */
  const cnt = {};
  for (let flat = 0; flat < 20; flat++) {
    const L = genLevel(flat);
    L.quizzes.forEach(q => { cnt[q.scene] = (cnt[q.scene] || 0) + 1; });
  }
  const coverOk = Object.keys(cnt).length === 20 && SPEC_SCENES.every((s, i) => cnt[i] === 5);
  const poolOk = !poolBad && coverOk;
  if (poolOk) npass++;
  units.pool = { ok: poolOk, bad: poolBad, cover: coverOk };

  /* ---- ⑩ stars：星级口径（0=3★/1-2=2★/≥3=1★，永不 0 星） ---- */
  total++;
  const LA = genLevel(10);
  LA.retries = 0; const st3 = engStars(LA) === 3;
  LA.retries = 1; const st2a = engStars(LA) === 2;
  LA.retries = 2; const st2b = engStars(LA) === 2;
  LA.retries = 3; const st1 = engStars(LA) === 1;
  LA.retries = 9; const stFloor = engStars(LA) === 1;   // 永不 0 星
  const starsOk = st3 && st2a && st2b && st1 && stFloor;
  if (starsOk) npass++;
  units.stars = { ok: starsOk, st3: st3, st2: st2a && st2b, st1: st1, floor: stFloor };

  /* ---- ⑪ gen：生成关 flat20+（seeded ri(rnd,1,4) 独立复算+四档全现+per-chapter 池+确定性+无放回） ---- */
  total++;
  const genBad = [];
  const genDch = {};
  for (let flat = 20; flat < 40; flat++) {
    const rnd = mulberry32V(flat * 7919 + 727);      // SPEC §0.88：独立重写 rng（python 式复刻）
    const expDch = 1 + Math.floor(rnd() * 4);        // dch=第一个随机数（先取数保确定性）
    const L = genLevel(flat), L2 = genLevel(flat);
    if (L.dch !== expDch) genBad.push(flat + ':dch ' + L.dch + '!=' + expDch);
    if (JSON.stringify(L.quizzes) !== JSON.stringify(L2.quizzes)) genBad.push(flat + ':det');
    const cfg = SPEC_CH[L.dch];                      // 章档：卡数+题型
    if (!L.quizzes.every(q => q.cards.length === cfg.n)) genBad.push(flat + ':cardsN');
    /* r12 池域 per-chapter kind-pure：say+卡数反查 SPEC 行号落单章池
       （dch k→行 (k-1)*5..k*5-1）+关内 5 题全=章 kind——b36 坑③反查口径 */
    if (!L.quizzes.every(q => {
      const row = rowOfV(q.say, q.cards.length);
      return row >= 0 && row >= (L.dch - 1) * 5 && row < L.dch * 5 && q.kind === cfg.kind;
    })) genBad.push(flat + ':pool');
    const set = {};
    L.quizzes.forEach(q => { set[q.scene] = 1; });
    if (Object.keys(set).length !== 5) genBad.push(flat + ':dupScene');             // 无放回抽 5 题
    genDch[L.dch] = (genDch[L.dch] || 0) + 1;
  }
  const distOk = [1, 2, 3, 4].every(d => genDch[d] > 0);   // 四档全现（域全档成立型）
  const genOk = genBad.length === 0 && distOk;
  if (genOk) npass++;
  units.gen = { ok: genOk, bad: genBad.slice(0, 5), dist: genDch };

  /* ---- ⑫ windows+contract：六窗静态断言（SPEC §4/§7 实长表）+契约源码断言+双录+nextHint 实算 ---- */
  total++;
  const src = document.querySelectorAll('script')[2].textContent;
  const coreSrc = document.querySelectorAll('script')[0].textContent;
  const D = SPEC_DUR;
  const winOk = WRONG_CHAIN_WIN === 4434 &&                            // 坏链豁免窗 ==4434 精确
                WRONG_CHAIN_WIN === D.th_wrong + 150 + D.th_hint + 300 &&   // =2040+150+1944+300
                CELE_WIN === 2124 && CELE_WIN === D.th_right + 300 &&  // 确认窗=1824+300 精确
                PICK_WIN === 3108 && PICK_WIN === D.tha_fit + 300 &&   // r12 择优锚窗=2808+300
                NOT_WIN === 3060 && NOT_WIN === D.tha_not + 300 &&     // r12 反向锚窗=2760+300
                GRAY_WIN === 3180 && GRAY_WIN === D.tha_gray + 300 &&  // r12 灰链窗=2880+300
                ANTI_OK_WIN === 3492 && ANTI_OK_WIN === D.tha_ok + 300 &&   // r12 反向错反馈窗=3192+300
                TUT_WATCH_WAIT >= D.th_tut_watch + 300 &&              // watch 延 ≥3204
                TUT_TURN_WAIT >= D.th_tut_turn + 300 &&                // turn 延 ≥2124
                (2620 + 400) >= D.th_right + 300 &&                    // celebrate 3020 ≥ 2124
                estMsV('下雨小鹿老师给你撑伞') === 10 * 345 + 600 &&   // estMs 全字符口径（10 字最长句）
                SPEC_SCENES.every((s, i) => estMsV(s.say) + 300 >= SPEC_TH_SC['th_sc_' + (i + 1)]);   // T46：20 句 clip 全 ≤ estMs+300（窗不动充分性——逐句上界）
  const srcA = src.indexOf('KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) })') >= 0 &&
               src.indexOf('KIDS.ui.dayEnd({ nextHint: nextHint(null) })') >= 0;   // A：启动 lim-1+winFlow null
  const srcB = src.indexOf('lastDir') >= 0 && src.indexOf('lastAct') >= 0 &&
               src.indexOf('if (idle > 14000 && Date.now() - lastDir > 14000)') >= 0 &&
               src.indexOf('idle > 30000') >= 0;   // B：救援双锚（14s 方向级独立节流/30s 答案级）
  const srcC = coreSrc.indexOf("VER = '1.0'") >= 0 &&                       // C：存档版本 1.0（core）
               coreSrc.indexOf("'kidsgame_' + cfg.game") >= 0 &&            // C：存档键名
               src.indexOf("KIDS.init({ game: 'thanks'") >= 0;             // C：本款存档键 kidsgame_thanks
  const srcE = src.indexOf('sv.thanks && sv.thanks.tutSeen') >= 0;   // E：行为分流先查教学特例
  const srcF = src.indexOf('GEN_HINTS[genLevel(f + 1).dch - 1]') >= 0 &&   // F：生成关实算 dch-1
               src.indexOf('(ci + 1)' + ' % 4') < 0;   // 禁章序右移（检索串拼接防 verify 源码自匹配）
  const srcI = src.indexOf('wrongChainUntil = Date.now() + WRONG_CHAIN_WIN') >= 0 &&
               src.indexOf('grayChainUntil = Date.now() + gWin') >= 0 &&   // r12 灰链豁免窗起播设
               src.indexOf('if (Date.now() < wrongChainUntil || Date.now() < grayChainUntil) return;') >= 0 &&   // I：救援双窗守卫
               src.indexOf('lastWrongVoice = 0; wrongChainUntil = 0; grayChainUntil = 0;') >= 0 &&   // I：换关重置双窗
               src.indexOf('grayChainUntil && Date.now() < grayChainUntil') >= 0;   // I 补：灰链豁免窗 guard
  const srcJ = src.indexOf('now - lastWrongVoice > 10000') >= 0;          // J：语义句 10s 节流在场
  const srcK = src.indexOf("if (document.querySelector('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel')) return;") >= 0 &&
               src.indexOf('function rescueTick()') >= 0;   // K：面板守卫+命名函数
  const srcD = src.indexOf("replayAnim(cardsEl, 'bump')") >= 0;           // D：吞输入轻叮配容器 bump
  const srcMeh = src.indexOf("setFriendMood('meh')") >= 0 &&              // r12：半好态分流在场
                 src.indexOf('anchorOf(q.kind)') >= 0 &&                  // r12：框架锚按题型分流
                 src.indexOf('function dirVoice()') >= 0;                 // r12：提示按题型分流
  const srcHint = CHAPTERS[1].hint === SPEC_CHAPTER_HINTS[1] &&   // 双录独立硬编码对账
                  CHAPTERS[2].hint === SPEC_CHAPTER_HINTS[2] &&
                  CHAPTERS[3].hint === SPEC_CHAPTER_HINTS[3] &&
                  CHAPTERS[4].hint === SPEC_CHAPTER_HINTS[4] &&
                  GEN_HINTS[0] === SPEC_GEN_HINTS[0] && GEN_HINTS[1] === SPEC_GEN_HINTS[1] &&
                  GEN_HINTS[2] === SPEC_GEN_HINTS[2] && GEN_HINTS[3] === SPEC_GEN_HINTS[3] &&
                  nextHint(4) === SPEC_CHAPTER_HINTS[1] && nextHint(9) === SPEC_CHAPTER_HINTS[2] &&
                  nextHint(14) === SPEC_CHAPTER_HINTS[3] && nextHint(19) === SPEC_CHAPTER_HINTS[4] &&   // 章末关 ci<4 → CHAPTERS[ci+1].hint（hint 字段语义=预告下一章）
                  nextHint(20) === GEN_HINTS[genLevel(21).dch - 1] &&
                  [24, 29, 34, 39].every(f => nextHint(f) === GEN_HINTS[genLevel(f + 1).dch - 1]);   // F：实算（b35 m5 范式）
  const srcSpeed = SPEED === 0.12;                       // verify 提速
  const contractOk = srcA && srcB && srcC && srcD && srcE && srcF && srcI && srcJ && srcK &&
                     srcMeh && srcHint && srcSpeed;
  const winUnitOk = winOk && contractOk;
  if (winUnitOk) npass++;
  units.windows = { ok: winUnitOk, win: winOk, A: srcA, B: srcB, C: srcC, D: srcD, E: srcE, F: srcF,
                    I: srcI, J: srcJ, K: srcK, meh: srcMeh, hints: srcHint };

  /* ---- ⑬ confirmChain：确认链构成（__lastQueue===['th_right'] 单 clip；题面 say/框架锚
       走 voice.say·play 不动 __lastQueue——SPEC §7 明示） ---- */
  total++;
  startLevel(20);
  await unlocked();
  const q13 = window.TH.quiz;
  const goodI13 = deriveAnswerV(q13.cards, q13.kind);
  const h0 = window.__queueHist.length;      // 订阅起点
  const r13 = await window.TH.tapCard(goodI13);
  const LQ = window.__lastQueue;
  const chainOk13 = r13 === 'right' &&
                    LQ && LQ.length === 1 && LQ[0] === 'th_right' &&        // 确认链=right 单 clip
                    JSON.stringify(LQ) === JSON.stringify(['th_right']) &&
                    !keylessLast(LQ) &&                                     // 全 clip 无 keyless（契约 N）
                    window.__queueHist.slice(h0).some(h =>
                      h.length === 1 && h[0] === 'th_right');
  if (chainOk13) npass++;
  units.confirmChain = { ok: chainOk13, r: r13,
                         queue: LQ && LQ.map(p => typeof p === 'string' ? p : JSON.stringify(p)) };

  /* ---- ⑭ save：真实写档链（init thanks→autoSolve 通关→localStorage 更新，测后还原） ---- */
  total++;
  const origSave = window.__thOrig.save, origPersist = window.__thOrig.persist;
  const origLS = localStorage.getItem('kidsgame_thanks');
  let saveOk = false, saveDetail = '';
  try {
    KIDS._save = origSave;                       // 还原真函数（init 用）
    KIDS.store.persist = origPersist;
    localStorage.removeItem('kidsgame_thanks');
    KIDS.init({ game: 'thanks', title: '感谢的话' });   // 真实 init：store.load 新档 v1.0
    startLevel(0);                               // verify 页 freshTut 恒 false → 直接开题
    const a14 = await window.TH.autoSolve();     // 真实判定链通关 → winFlow verify 分支 persistWin
    const raw = localStorage.getItem('kidsgame_thanks');
    const j = raw ? JSON.parse(raw) : null;
    saveOk = !!(a14.done && a14.taps === 5 && j && j.v === '1.0' && j.game === 'thanks' &&
                j.levels && j.levels['1-0'] &&
                j.levels['1-0'].stars === 3 && j.levels['1-0'].plays === 1);
    if (!saveOk) saveDetail = JSON.stringify({ taps: a14.taps, raw: raw && raw.slice(0, 200) });
  } catch (err) {
    saveDetail = 'ERR ' + (err && err.message);
  }
  /* 清理：恢复原 localStorage（不污染真实存档）——U15 继续用真实函数 */
  if (origLS === null) localStorage.removeItem('kidsgame_thanks');
  else localStorage.setItem('kidsgame_thanks', origLS);
  if (saveOk) npass++;
  units.save = { ok: saveOk, detail: saveDetail };

  /* ---- ⑮ realPath：预置存档 v1.0+tutSeen → start(0) 非教学直达题面（契约 E 分流；
       审查 m4：try/finally 保异常时 origLS 也恢复） ---- */
  total++;
  const today = new Date();
  const tstr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  const pre = { v: '1.0', game: 'thanks', firstDay: tstr, lastDay: tstr, levels: {},
                dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 },
                restTip: { day: '', shown: 0 }, thanks: { tutSeen: true } };
  let q15 = null, realOk = false;
  try {
    localStorage.setItem('kidsgame_thanks', JSON.stringify(pre));
    KIDS.store.load();                             // 重读预置档
    window.__thDemoR = null;                       // 教学实证清零（非教学路径不应重设）
    window.TH.start(0);
    await unlocked();
    q15 = window.TH.quiz;
    realOk = state.tut === 'none' && window.__thDemoR === null &&
             q15 && q15.scene === 0 && q15.kind === 'fit' && q15.cards.length === 2 &&
             q15.step === 0 && q15.miss === 0 &&
             q15.say === SPEC_SCENES[0].say &&
             q15.answer === deriveAnswerV(q15.cards, q15.kind) &&        // answer 独立推导
             window.TH.currentLevel.flat === 0 && window.TH.currentLevel.n === 5 &&
             (KIDS._save() || {}).v === '1.0' &&
             typeof window.TH === 'object' && typeof window.TH.tapCard === 'function' &&
             typeof window.TH.autoSolve === 'function';        // b29 坑⑥：钩子真实页同暴露
  } finally {
    /* 收尾清理：恢复原 localStorage + 沙盒 stub（防真实页误写）——异常路径也执行 */
    if (origLS === null) localStorage.removeItem('kidsgame_thanks');
    else localStorage.setItem('kidsgame_thanks', origLS);
    KIDS._save = function () { return { levels: {} }; };
    KIDS.store.persist = function () {};
  }
  if (realOk) npass++;
  units.realPath = { ok: realOk, tut: state.tut,
                     quiz: q15 && { scene: q15.scene, kind: q15.kind, n: q15.cards.length } };

  /* ---- ⑯ duration（r12 时长模型门禁）：独立副本复算+逐关对账（V_* 禁引引擎常量） ---- */
  total++;
  const V_DECIDE = { fit: 10000, size: 10000, anti: 11500 };   // SPEC §7 认知决策时长
  const V_ADV = 2124, V_MIN = 40000, V_PICK = 3108, V_NOT = 3060, V_ENTER = 400;
  const voiceWinV = (say, kind) => V_ENTER + estMsV(say) + 300 + (kind === 'anti' ? V_NOT : V_PICK);
  const quizDurV = (say, kind) => Math.max(voiceWinV(say, kind), V_DECIDE[kind]) + V_ADV;
  /* 全 20 题：语音窗恒 ≤ DECIDE（语音窗从不撑时长——r12 模型前提） */
  const noVoiceDrive = SPEC_SCENES.every(s => voiceWinV(s.say, s.kind) <= V_DECIDE[s.kind]);
  /* 40 关：modeled ≥40000 +页面 levelDurMs 与独立复算逐关对账（同引用 JSON.stringify
     互比恒真禁用——对账用数值和比较，非 stringify） */
  let durBad = null, minDur = Infinity;
  for (let flat = 0; flat < 40 && !durBad; flat++) {
    const L = genLevel(flat);
    const mySum = L.quizzes.reduce((s, q) => s + quizDurV(q.say, q.kind), 0);
    const pageSum = levelDurMs(L);
    if (mySum !== pageSum) durBad = 'mismatch ' + flat + ' ' + mySum + '!=' + pageSum;
    if (mySum < V_MIN) durBad = 'min ' + flat + ' ' + mySum;
    if (mySum < minDur) minDur = mySum;
  }
  const advOk = ADV_MS === 2124 && LEVEL_MIN_MS === 40000;    // 页面常量与独立值等值（交叉锚）
  const durUnitOk = noVoiceDrive && !durBad && advOk;
  if (durUnitOk) npass++;
  units.duration = { ok: durUnitOk, noVoiceDrive: noVoiceDrive, bad: durBad,
                     minModeled: minDur, adv: advOk };

  const out = { game: 'thanks', total: total, pass: npass, units: units };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__thVlog = out;                          // __vlog 计数（外部断言挂点，任务书钩子）
  document.title = (npass === total) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL ' + (total - npass);
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text 并留播报历史（框架锚 tha_fit/tha_not 亦经此——锚真值
     断言依据）；题面情景句 T46 化走 play（__lastVoiceKey/__lastVoiceText+voiceHist——SPEC §7 题面
     链，不进 __lastQueue）；voice.queue 记录拼播链（__lastQueue+__queueHist 全史） */
  window.__voiceHist = [];
  window.__queueHist = [];
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) {
    window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null;
    if (k) window.__voiceHist.push(k);
  };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    if (parts) window.__queueHist.push(parts);
    window.__lastVoiceKey = parts && parts.length
      ? (typeof parts[0] === 'string' ? parts[0] : parts[0].key) : null;
  };
  runVerify();
}
