<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>植树程序</title>
<style>
/* ================= 植树程序 plant（batch37·扩容批 7）
   视觉按家族基调：暖米底 #FBF6EC、暖绿主色 #8FBF7F、暖棕描边 #4A3B2E；
   玩法 = 按程序卡在花园网格种树（SPEC-BATCH37 §0.89/§2，6-7 岁计算思维·
   程序执行+坐标定位）：程序卡「第X行 第Y列」keyless TTS 播报 → 孩子点
   对应格 → 树苗生长动画（花园逐渐成形）。
   网格边长 n：ch1=3/ch2=3/ch3=4/ch4=4（3×3→4×4 单调坡度，域承诺型）。
   行列标尺恒可见（左侧行号/顶部列号 1-N——坐标教学锚，渲染铁律）。
   触摸目标：网格格 ≥96×96、底栏按钮 ≥72；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：程序卡 + 花园网格（行列标尺恒可见） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}
#scene{flex:0 0 auto;position:relative;width:min(640px,94vw);border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F0E7CC 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:10px 14px 14px;transition:transform .4s,box-shadow .4s}
#scene.panorama{transform:scale(1.04);box-shadow:0 0 0 6px rgba(143,191,127,.45),0 4px 0 #D8C9B4}

/* 程序卡（题面真值——「第X行 第Y列」大字卡；卡亮 .lit=读卡时高燃） */
#card-wrap{flex:0 0 auto;display:flex;align-items:center;gap:10px}
#card{font-size:30px;font-weight:800;letter-spacing:2px;padding:5px 26px;border-radius:16px;
  background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;
  transition:transform .25s cubic-bezier(.2,1.4,.4,1),box-shadow .25s}
#card.lit{transform:scale(1.07);box-shadow:0 0 0 5px rgba(232,151,90,.55),0 4px 0 #D8C9B4;
  background:#FFF3D9}
#card-tag{font-size:15px;font-weight:700;color:#8A6F52;padding:3px 10px;border-radius:10px;
  background:#F2DDC0;border:2px solid #4A3B2E}

/* ---------- 花园（CSS grid：角/列标尺/行标尺/网格四区） ---------- */
#garden{flex:0 0 auto;width:100%;display:grid;
  grid-template-columns:40px 1fr;grid-template-rows:40px 1fr;gap:6px}
.g-corner{grid-area:1/1}
#col-ruler{grid-area:1/2;display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px}
#row-ruler{grid-area:2/1;display:grid;grid-template-rows:repeat(var(--n,3),1fr);gap:6px}
#col-ruler span,#row-ruler span{display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:#4A3B2E;background:#F2DDC0;border:2.5px solid #4A3B2E;
  border-radius:12px;transition:all .2s}
/* 标尺高亮（方向级反馈：只亮行列边缘不亮格子本体——不泄答案） */
#col-ruler span.lit,#row-ruler span.lit{background:#E8975A;color:#FFF9EE;
  transform:scale(1.14);box-shadow:0 0 0 4px rgba(232,151,90,.5)}
/* r47 δ2 标尺闪现（ch3-4 dch≥3）：开题可见 RULER_FADE_MS 后淡出——记忆坐标坡度
   （错反馈/提示 litRulers 窗内解除淡出重闪，窗末恢复） */
#garden.rulers-off #col-ruler span,#garden.rulers-off #row-ruler span{opacity:0}

/* ---------- 网格（土床 .cell：empty→tree——渲染即引擎契约 M） ---------- */
#grid{grid-area:2/2;display:grid;grid-template-columns:repeat(var(--n,3),1fr);
  grid-template-rows:repeat(var(--n,3),1fr);gap:6px}
#grid.bump{animation:pl-bump .22s ease}
@keyframes pl-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
.cell{position:relative;border-radius:16px;background:#EFE2C3;border:3px solid #4A3B2E;
  box-shadow:inset 0 -4px 0 rgba(74,59,46,.12);display:flex;align-items:center;
  justify-content:center;transition:background .3s;min-width:96px;min-height:96px}
.cell:active{background:#EADAB4}
/* 空格土窝（居中小坑暗示——可种的格） */
.cell.empty::after{content:'';position:absolute;width:34%;height:34%;border-radius:50%;
  background:#D9C49A;border:2.5px dashed #B99F73}
/* 空格藏树苗（土窝态只显坑） */
.cell.empty .sapling{display:none}
/* 已种格：树苗在场（.tree 态=渲染层真值锚） */
.cell.tree{background:#DCE8CC}
.cell.tree::after{display:none}
.cell .sapling{width:86%;height:86%;display:flex;align-items:flex-end;justify-content:center}
.cell.tree .sapling svg{width:100%;height:100%}
.cell.tree.pop .sapling{animation:tree-in 1.1s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes tree-in{0%{transform:scale(0) translateY(30%);opacity:0}
  70%{transform:scale(1.12) translateY(-2%);opacity:1}100%{transform:scale(1)}}
/* 已种格拒绝（家族 D）：树苗轻摇——探索不罚 */
.cell.tree.shake .sapling{animation:tree-shake .55s ease}
@keyframes tree-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}
  50%{transform:rotate(5deg)}75%{transform:rotate(-3deg)}}
/* r47 δ3 星星起点徽章（rel 题参照锚——金五角星盖土窝；starbeat=点星星拒绝/方向级
   pulse；星星格 ≠ 目标格（净位移≠0 生成期保证） */
.cell .starbadge{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;pointer-events:none}
.cell.star::after{display:none}            /* 星星格藏土窝 */
.cell.star.starbeat .starbadge{animation:star-beat .6s ease}
@keyframes star-beat{0%,100%{transform:scale(1)}40%{transform:scale(1.3) rotate(10deg)}}
/* 答案级提示：正确格 breathe（miss≥2） */

.cell.breathe{animation:cell-br 1.2s ease-in-out infinite}
@keyframes cell-br{0%,100%{box-shadow:inset 0 -4px 0 rgba(74,59,46,.12)}
  50%{box-shadow:0 0 0 6px rgba(143,191,127,.75),inset 0 -4px 0 rgba(74,59,46,.12)}}
/* 关末零错开花加成（纯演出层） */
.cell.tree.bloom .sapling .flower{opacity:1;transition:opacity .5s}
.cell.tree.bloom .sapling{animation:tree-shake .55s ease}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:76px;height:76px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:44px;height:44px}
#btn-replay.bounce{animation:rep-b .4s ease}
@keyframes rep-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-36） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* ---------- r47 δ1 wide 紧凑布局（n≥5 挂 #game.wide：5×5/6×6 装进 1280×800）
   竖向预算（SPEC-R47 §R1δ1 写前验算）：stage=800−hud40−dock98=662−padding4=658 ≥
   scene 6+16+28+4+6×96+5×4=650（余 8）。程序卡改挂 dock 中央（position:fixed 出流
   不占舞台高——非触达纯展示；兔子/重听按钮 x 两侧无重叠）；格 ≥96×96 触达铁律不变 */
#game.wide #hud{flex:0 0 40px}
#game.wide #logo{width:32px;height:32px;flex:0 0 32px}
#game.wide #stage{padding:2px 12px;gap:4px}
#game.wide #scene{width:min(760px,96vw);padding:8px 10px;gap:4px}
#game.wide #garden{grid-template-columns:28px 1fr;grid-template-rows:28px 1fr;gap:4px}
#game.wide #col-ruler,#game.wide #row-ruler{gap:4px}
#game.wide #grid{gap:4px}
#game.wide #col-ruler span,#game.wide #row-ruler span{font-size:16px;border-width:2px;
  border-radius:8px}
#game.wide #dock{padding-top:4px;padding-bottom:8px}
#game.wide #card-wrap{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
  z-index:5;gap:8px}
#game.wide #card{font-size:23px;letter-spacing:1px;padding:5px 20px;
  box-shadow:0 3px 0 #D8C9B4;white-space:nowrap}
#game.wide #card.rel{font-size:20px;letter-spacing:0}
#game.wide #card-tag{display:none}

/* 竖屏（平板/手机竖持）：舞台收紧，网格格仍 ≥96；wide 档（n≥5）竖屏高度充裕
   （stage≈1038 ≥ scene 650）只放宽宽度 */
@media (orientation:portrait){
  #scene{width:min(560px,96vw)}
  #card{font-size:26px;padding:4px 20px}
  #card-tag{display:none}
  #garden{grid-template-columns:36px 1fr;grid-template-rows:36px 1fr}
  #col-ruler span,#row-ruler span{font-size:19px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
  #game.wide #scene{width:min(760px,97vw)}
  #game.wide #card{font-size:21px}
  #game.wide #card.rel{font-size:19px}
}
</style>
</head>
<body>
<div id="game" aria-label="植树程序">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="花园网格，看程序卡种小树">
      <div id="card-wrap"><span id="card-tag">程序卡</span><div id="card"></div></div>
      <div id="garden" aria-label="花园网格，带行列标尺">
        <div class="g-corner" aria-hidden="true"></div>
        <div id="col-ruler" aria-label="列号"></div>
        <div id="row-ruler" aria-label="行号"></div>
        <div id="grid" aria-label="花园格子"></div>
      </div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再听一遍程序卡"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
