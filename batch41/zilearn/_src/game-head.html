<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>识字小课堂</title>
<style>
/* ================= zilearn 识字小课堂（batch41，第 151 款，5-8 岁主线认字）=================
   家族基调：暖米底 #FBF6EC、暖橙 #E8975A、暖棕描边 #4A3B2E（DESIGN-SPEC §8）。
   玩法 = 每关 5 题位谱：qi0 字理亮相（watch 演示 0 判定，picto 象形演变/glyph 字理文案）
   → qi1 听音找字 → qi2 词语境选字（ch3 起句子填空）→ qi3 组词搭配 → qi4 关末小测。
   防泄露（悟空槽点）：题面区 #stage 与选项区 #opts 物理分离（两个独立容器，
   verify 断言选项上沿 > 题面下沿）；无任何答案暗示动画（miss 不高亮正确项，
   breathe 仅 30s 答案级救援）。触摸目标：选项卡 ≥96、亮相大字 ≥96；
   溢出恒 0（overflowX 恒 ≤0，横竖屏同构）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 题面区（与选项区物理分离——防泄露契约） ---------- */
#stage{flex:1 1 auto;min-height:150px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:8px 12px}

/* qi0 字理亮相：左侧象形演变面板 + 右侧大字（pyFull 注音；words[1..2] 为惰性数据不展示 r1-m2） */
#watch{display:flex;align-items:center;justify-content:center;gap:22px;max-width:100%}
#watch.hide{display:none}
#w-side{width:148px;height:148px;border-radius:24px;background:#FFFDF7;border:3px solid #E5CDA6;
  box-shadow:0 4px 0 #E0CBB2;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#w-side svg{width:118px;height:118px}
#w-ev,#w-svg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transition:opacity .4s}
#w-svg{opacity:0}
#watch.p2 #w-ev{opacity:0}
#watch.p2 #w-svg{opacity:1}
#w-box{width:150px;height:150px;border-radius:28px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;animation:w-in .34s cubic-bezier(.2,1.5,.4,1)}
@keyframes w-in{from{transform:translateY(20px) scale(.6);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
#w-zi{font-size:92px;font-weight:800;line-height:1.05;color:#4A3B2E}
#w-py{font-size:17px;font-weight:700;color:#8A7B6C;letter-spacing:.1em;font-family:Georgia,serif}
#w-glyph{max-width:440px;padding:10px 18px;border-radius:18px;background:rgba(253,243,227,.72);
  border:2px solid #EFE3CD;font-size:19px;line-height:1.6;color:#6B5A48;text-align:center}
#watch.glyphmode #w-side{display:none}
#watch.plainmode #w-side,#watch.plainmode #w-glyph{display:none}   /* r1-M4：无字理文案=纯大字段 */

/* 点选题面：prompt 行（听音喇叭/题面文字） */
#qwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;max-width:100%}
#qwrap.hide{display:none}
#q-prompt{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:700;color:#8A7B6C}
#q-prompt svg{width:44px;height:44px}
#q-text{min-height:64px;display:flex;align-items:center;justify-content:center;
  font-size:58px;font-weight:800;color:#4A3B2E;letter-spacing:.06em;padding:6px 26px;
  border-radius:24px;background:rgba(253,243,227,.6);border:2px solid #EFE3CD}
#q-text.sent{font-size:40px;letter-spacing:.04em}
#q-text .blank{color:#E8975A;margin:0 2px}
#q-sub{font-size:18px;color:#8A7B6C}

/* ---------- 选项区（独立容器——与 #stage 物理分离） ---------- */
#opts{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;
  padding:6px 18px;max-width:920px;margin:0 auto;width:100%}
#opts.hide{display:none}
.opt{min-height:118px;border-radius:24px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #D8C9B4;font-size:56px;font-weight:800;color:#4A3B2E;line-height:1.15;
  display:flex;align-items:center;justify-content:center;padding:8px 6px;
  transition:transform .15s,box-shadow .15s}
.opt .zi{display:block}
.opt.wd{font-size:36px;letter-spacing:.04em}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.opt.wig{animation:an-wig .5s ease}
@keyframes an-wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  45%{transform:translateX(8px)}70%{transform:translateX(-5px)}88%{transform:translateX(4px)}}
.opt.good{background:#8FBF7F;border-color:#6FA063;box-shadow:0 5px 0 #6FA063;animation:an-good .5s ease}
.opt.good .zi{color:#FFF9EE}
@keyframes an-good{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 30s 答案级救援专用（唯一允许的答案暗示动画——keepIdle 纪律配套） */
.opt.breathe{animation:an-breathe 1.4s ease infinite}
@keyframes an-breathe{0%,100%{transform:scale(1);box-shadow:0 5px 0 #D8C9B4}
  50%{transform:scale(1.07);box-shadow:0 5px 0 #E8975A,0 0 22px rgba(232,151,90,.65)}}
#opts.shake{animation:an-shake .42s ease}
@keyframes an-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-hear{width:76px;height:76px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:44px;height:44px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}

/* ---------- 幽灵手指教学（家族范式） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：选项 2×2、题面与亮相缩放，触摸面仍 ≥96 */
/* F1 关末生字墙：本关新字翻牌收字（点字听音，全点过/12s 自动过） */
#result-wall{position:fixed;inset:0;z-index:60;background:rgba(74,59,46,.42);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:rw-in .3s ease}
#result-wall.hide{display:none}
@keyframes rw-in{from{opacity:0}to{opacity:1}}
.rw-title{font-size:24px;font-weight:800;color:#FFF9EE;text-shadow:0 2px 0 rgba(74,59,46,.4)}
.rw-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:520px;padding:0 16px}
.rw-card{display:flex;flex-direction:column;align-items:center;gap:2px;background:#FFF9EE;
  border:3px solid #4A3B2E;border-radius:20px;box-shadow:0 5px 0 #D8C9B4;padding:12px 14px;
  min-width:86px;min-height:112px;transform:rotate(-3deg);transition:transform .18s cubic-bezier(.2,1.5,.4,1)}
.rw-card:nth-child(2n){transform:rotate(2.5deg)}
.rw-card:nth-child(3n){transform:rotate(-1deg)}
.rw-card .rw-zi{font-size:52px;font-weight:800;line-height:1.1;color:#4A3B2E}
.rw-card .rw-py{font-size:14px;font-weight:700;color:#8A7B6C;font-family:Georgia,serif}
.rw-card.lit{background:#FDEFD3;border-color:#E8975A;box-shadow:0 5px 0 #D89A6A;transform:scale(1.06)}
.rw-tip{font-size:16px;font-weight:700;color:#FFF3E0}
/* F2 阶梯 3：摘除的干扰项（隐藏+禁点，不删 DOM——判定索引不变） */
.opt.dimmed{opacity:.18;pointer-events:none;filter:grayscale(1)}
/* F7 播放失败一次性提示（60s 节流；家长可发现无声故障） */
#mute-tip{position:fixed;top:14px;left:50%;transform:translate(-50%,-56px);z-index:70;display:flex;
  align-items:center;gap:8px;background:#FFF9EE;border:2.5px solid #4A3B2E;border-radius:16px;
  box-shadow:0 4px 0 #D8C9B4;padding:8px 16px;font-size:15px;font-weight:700;color:#4A3B2E;
  transition:transform .3s ease}
#mute-tip.show{transform:translate(-50%,0)}

@media (orientation:portrait){
  #opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:6px 12px;max-width:520px}
  .opt{min-height:104px;font-size:50px}
  .opt.wd{font-size:32px}
  #w-zi{font-size:80px}
  #w-box{width:136px;height:136px}
  #w-side{width:132px;height:132px}
  #q-text{font-size:48px}
  #q-text.sent{font-size:34px}
  #w-glyph{font-size:17px;max-width:330px}
}
</style>
</head>
<body>
<div id="result-wall" class="hide" aria-label="这一关认识的字">
  <div class="rw-title">这一关认识的字</div>
  <div class="rw-cards"></div>
  <div class="rw-tip">点一点，听一听</div>
</div>
<div id="mute-tip" aria-label="声音提示"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9 h4 l5-4 v14 l-5-4 H4 Z" fill="#4A3B2E"/><path d="M16 8 L21 16 M21 8 L16 16" stroke="#C94F3D" stroke-width="2.4" stroke-linecap="round"/></svg><span>声音没有出来哦</span></div>
<div id="game" aria-label="识字小课堂">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题位进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="watch" aria-label="字理亮相">
      <div id="w-side"><div id="w-ev"></div><div id="w-svg"></div></div>
      <div id="w-box"><span id="w-zi"></span><span id="w-py"></span></div>
      <div id="w-glyph"></div>
    </div>
    <div id="qwrap" class="hide">
      <div id="q-prompt"></div>
      <div id="q-text"></div>
      <div id="q-sub"></div>
    </div>
  </div>
  <div id="opts" class="hide" aria-label="选项"></div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
