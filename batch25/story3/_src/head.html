<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>故事排序</title>
<style>
/* ================= 故事排序 story3（batch25）=================
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E；
   6-7 岁零文字依赖：题面=3 槽位故事条（数字徽章 1/2/3——数字承 bridge/feed 大数字
   先例）+ 3 张乱序帧卡（SVG 场景）+ 语音承载全部语义；
   点对=帧卡飞入槽 + 槽点亮；三槽全对=故事条整体亮起（glow）+「先…然后…最后…」TTS 复述；
   点错=卡摇头 + 方位语义反馈（不出现「错了」，卡不灰可重选——探索不罚）。
   触摸目标：帧卡=主答案按钮 ≥96×96（§0.9）；故事条可点重听；底栏按钮 ≥72。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 50px;display:flex;align-items:center;padding:5px 60px 0 14px;gap:14px}
#logo{width:40px;height:40px;border-radius:12px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 40px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：故事条（3 槽位）→ 帧卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;overflow:hidden;padding:6px 12px}

/* 故事条：可点重听题面；3 槽（数字徽章 + 帧图/虚线占位）；三槽全对 glow */
#scene{position:relative;display:flex;gap:12px;justify-content:center;align-items:stretch;
  width:min(640px,94vw);padding:16px 14px 13px;border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;overflow:hidden;padding-top:16px;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene.pulse{animation:scene-pulse 1s ease-in-out 3}
@keyframes scene-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#scene.bounce{animation:scene-b .4s ease}
@keyframes scene-b{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
#scene.full{animation:strip-glow 1.3s ease 2}
@keyframes strip-glow{0%,100%{box-shadow:0 5px 0 #D8C9B4}
  50%{box-shadow:0 5px 0 #D8C9B4,0 0 22px rgba(245,196,69,.95);border-color:#F5C445}}
.slot{position:relative;flex:1 1 0;max-width:186px;aspect-ratio:4/3;border:3px solid #D8C9B4;
  border-radius:16px;background:#FBF3E4;display:flex;align-items:center;justify-content:center;overflow:visible}
.slot .ph{width:66%;height:62%;border:3px dashed #D8C9B4;border-radius:12px}
.slot .art{position:absolute;inset:2px;border-radius:12px;overflow:hidden;
  animation:slot-in .45s cubic-bezier(.2,1.6,.4,1)}
.slot .art svg{width:100%;height:100%}
@keyframes slot-in{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.slot.slot-pop{animation:slot-pop-j .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slot-pop-j{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
.slot .bdg{position:absolute;top:-9px;left:-9px;width:26px;height:26px;border-radius:50%;
  background:#FFF9EE;border:2.5px solid #4A3B2E;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;color:#4A3B2E;z-index:2}
.slot.cur{border-color:#E8975A;animation:slot-cur 1.5s ease-in-out infinite}
@keyframes slot-cur{0%,100%{box-shadow:0 0 0 0 rgba(232,151,90,0)}50%{box-shadow:0 0 0 6px rgba(232,151,90,.3)}}
.slot.filled{border-color:#6FA063;background:#F3FAEF}
/* r34 因果问句：首帧 why pulse（问题锚点） */
.slot.why-first{border-color:#F5C445;animation:slot-why 1.5s ease-in-out infinite}
@keyframes slot-why{0%,100%{box-shadow:0 0 0 0 rgba(245,196,69,0)}50%{box-shadow:0 0 0 7px rgba(245,196,69,.55)}}

/* ---------- 帧卡排：r34 候选 3-6 张（flex-wrap 两行 3+3/3+2；4 卡单行紧凑变体），
   主答案按钮 ≥96×96；吞输入=容器 bump ---------- */
#board{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:stretch;
  flex:0 0 auto;width:100%;max-width:640px;padding:0 2px}
#board[data-n="4"]{gap:16px}
#board[data-n="4"] .card{width:138px;min-height:120px}
#board[data-n="4"] .card .gwrap{width:120px;height:92px}
#board[data-n="4"] .card .gwrap svg{width:116px;height:87px}
#board.bump{animation:board-bump .22s ease}
@keyframes board-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 5px 0 #D8C9B4;flex:0 0 auto;width:150px;min-height:130px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s;overflow:hidden}
.card:active{transform:translateY(3px)}
.card .gwrap{width:132px;height:100px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card .gwrap svg{width:128px;height:96px}
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.card.gone{display:none}                        /* 已飞入槽的帧从卡排移除（槽位不清已对的） */
.card.bump{animation:card-bump .22s ease}
@keyframes card-bump{0%,100%{transform:scale(1)}45%{transform:scale(.94)}}
/* 答对：卡绿闪后飞入（flyFrame 克隆体承载飞行） */
.card.lit{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;
  animation:card-lit .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes card-lit{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
/* 答错：摇头晃动（不灰掉可重选——探索不罚，方位语义反馈款） */
.card.wig{animation:an-wig .6s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}22%{transform:rotate(-8deg) translateX(-4px)}
  50%{transform:rotate(7deg) translateX(3px)}78%{transform:rotate(-4deg) translateX(-2px)}}
/* 30s 答案级救援：当前槽正确帧呼吸高亮循环（§0.21） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 14s 方向级救援：未放帧一次性 pulse */
.card.pulse{animation:an-pulse .9s ease 2}
@keyframes an-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* 帧飞行体（卡 → 槽位，fixed 层 CSS transition） */
.flyframe{position:fixed;z-index:90;border-radius:18px;display:flex;align-items:center;
  justify-content:center;background:#FFF9EE;border:3px solid #6FA063;overflow:hidden;
  box-shadow:0 4px 0 #6FA063;pointer-events:none;
  transition:transform .43s cubic-bezier(.3,.85,.35,1.08)}
.flyframe svg{width:92%;height:92%}

/* ---------- r34 因果问句选项卡（文字大卡 ≥96×96，worden 文字卡先例） ---------- */
.optcard{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 5px 0 #D8C9B4;flex:0 0 auto;width:230px;min-height:104px;max-width:44vw;
  padding:14px 18px;display:flex;align-items:center;justify-content:center;
  font-size:23px;font-weight:800;line-height:1.35;color:#4A3B2E;
  transition:transform .15s}
.optcard:active{transform:translateY(3px)}
.optcard.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
.optcard.lit{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;
  animation:card-lit .4s cubic-bezier(.2,1.6,.4,1)}
.optcard.wig{animation:an-wig .6s ease}
.optcard.breathe{animation:an-breathe 1.6s ease-in-out infinite}
.optcard.pulse{animation:an-pulse .9s ease 2}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-24） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：故事条/卡适配，主答案卡仍 ≥96；r34 选项卡/4-6 卡同步 */
@media (orientation:portrait){
  #scene{gap:9px;padding:14px 10px 11px}
  .slot{max-width:150px}
  #board{gap:12px}
  .card{width:118px;min-height:106px}
  .card .gwrap{width:104px;height:80px}
  .card .gwrap svg{width:100px;height:75px}
  #board[data-n="4"]{gap:12px}
  #board[data-n="4"] .card{width:112px;min-height:104px}
  #board[data-n="4"] .card .gwrap{width:98px;height:76px}
  #board[data-n="4"] .card .gwrap svg{width:94px;height:71px}
  .optcard{width:200px;min-height:100px;font-size:21px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="故事排序">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="按顺序排故事，点我再听一遍"></button>
    <div id="board" aria-label="故事画面卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
