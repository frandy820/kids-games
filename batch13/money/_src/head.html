<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>零钱管家</title>
<style>
/* ================= 零钱管家 money（batch13 · r15 难度改造版）=================
   视觉按 SPEC-BATCH13 §1 r15：暖米底 #FBF3E4、小卖部小兔子掌柜、圆形人民币简笔
   （5 角金黄 / 1 元银灰 / 5 元暖紫 / 10 元青蓝，大字面额）、价签大字 ≥40、答案卡 ≥96
   四题型：gather 凑零钱含角（点币入篮/合计实时/"给钱啦"提交，≠价篮晃动零惩罚不灰化）
   + pair 买两件合计（两件价签，先算 A+B 再凑币）
   + change 找零整元键盘（黑板"付 X 买 Y"，数字键盘 0-9+清空+退格，"算好啦"确认判定）
   + jiao 找零带角键盘（键盘+5 角键 toggle；显示一律"X元5角"格式，禁小数连写）
   键盘交互：判定只在确认（按键=构造探索不计 miss）；位数上限 2（超位拒收+轻闪）；
   确认错/空输入确认=miss（与空篮提交同口径）
   触摸目标：币 ≥68、键盘键 ≥64、答案卡与主按钮（给钱啦/算好啦）≥96、底栏按钮 ≥72 高；
   pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#C9A548;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:4px 10px}

/* ---------- 题面行：gather/pair=商品价签卡 / change/jiao=小黑板 ---------- */
#board{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  min-height:76px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:14px;padding:8px 22px;border-radius:22px;
  background:#FFFAF0;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #DFCFB6;flex-wrap:wrap;
  justify-content:center}
#prompt-chip .goods{width:58px;height:58px;flex:0 0 58px}
#prompt-chip .gname{font-size:18px;font-weight:700;color:#8A7B6C}
#tag{display:flex;align-items:baseline;gap:4px;padding:4px 16px;border-radius:14px;
  background:#FDEBD2;border:2.5px dashed #E8873A}
#tag b{color:#E8873A;font-size:46px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums}
#tag .u{font-size:20px;font-weight:800;color:#E8873A}
#tag .j5{font-size:24px;font-weight:800;color:#E8873A}
#prompt-chip .give{font-size:17px;font-weight:700;color:#8A7B6C}
#prompt-chip .plus{font-size:30px;font-weight:800;color:#C9A87C;padding:0 2px}
/* 小黑板（change/jiao）：深绿板面+粉笔白大字；木框 */
#prompt-chip.board{background:#33544B;border-color:#B08A5E;box-shadow:0 5px 0 #8A6844;padding:8px 26px}
#chalk{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
#chalk .ln{display:flex;align-items:baseline;gap:6px;color:#F5F1E6;font-weight:800}
#chalk .lb{font-size:20px;color:#CBE3D4;letter-spacing:.04em}
#chalk b{font-size:42px;line-height:1.1;font-variant-numeric:tabular-nums;color:#FDF9EE;
  text-shadow:0 2px 0 rgba(0,0,0,.18)}
#chalk .ask{font-size:22px;color:#F2C98C;font-weight:800}

/* ---------- 桌面（gather/pair）：钱币托盘（上）+ 购物篮行（下） ---------- */
#table-area{flex:1 1 auto;min-height:190px;width:100%;max-width:1180px;display:flex;
  flex-direction:column;justify-content:center;gap:6px}
#coin-tray{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:14px 18px;min-height:80px;padding:6px 8px;border-radius:20px;
  background:#F6ECD9;border:2.5px dashed #D9C5A6}
/* 钱币按钮：圆形人民币简笔；点后 .gone（入篮）；救援/教学 breathe */
.coin{position:relative;width:68px;height:68px;padding:0;border-radius:50%;
  transition:transform .15s;animation:coin-in .4s cubic-bezier(.2,1.5,.4,1) both}
.coin:nth-child(2n){animation-delay:.06s}.coin:nth-child(3n){animation-delay:.12s}
@keyframes coin-in{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.coin:active{transform:translateY(3px)}
.coin svg{width:100%;height:100%;pointer-events:none}
.coin.gone{visibility:hidden;pointer-events:none}
.coin.breathe{animation:coin-breathe 1.6s ease-in-out infinite}
@keyframes coin-breathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(232,151,90,0))}
  50%{transform:scale(1.12);filter:drop-shadow(0 0 12px rgba(232,151,90,.85))}}
/* 飞行币（fixed 克隆，JS 设起止坐标） */
.fly-coin{position:fixed;z-index:60;width:56px;height:56px;pointer-events:none;
  transition:transform .46s cubic-bezier(.35,.05,.6,1),opacity .46s;will-change:transform}

/* 购物篮行：篮（篮内币可点=移除）+ 合计大字 */
#basket-row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
  padding:2px 6px}
#basket{display:flex;align-items:center;gap:10px;min-width:230px;min-height:96px;
  padding:8px 16px;border-radius:20px;background:#FBE9CF;border:2.5px solid #C9A87C;
  box-shadow:0 4px 0 #DFCFB6;flex-wrap:wrap;justify-content:center}
#basket .empty{font-size:16px;font-weight:700;color:#8A7B6C}
#basket.wig{animation:basket-wig .5s ease}
@keyframes basket-wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.tcoin{position:relative;width:64px;height:64px;padding:0;border-radius:50%;
  animation:coin-in .32s cubic-bezier(.2,1.5,.4,1) both;transition:transform .15s}
.tcoin:active{transform:translateY(3px)}
.tcoin svg{width:100%;height:100%;pointer-events:none}
.tcoin.breathe{animation:coin-breathe 1.6s ease-in-out infinite}
/* 合计：篮右侧实时大字（=价时亮绿）；带角显示"X 元 5 角"格式 */
#sumbox{display:flex;align-items:baseline;gap:6px;padding:6px 18px;border-radius:16px;
  background:#FFFAF0;border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #DFCFB6}
#sumbox .lb{font-size:17px;font-weight:700;color:#8A7B6C}
#sumbox b{font-size:44px;font-weight:800;color:#E8873A;line-height:1;
  font-variant-numeric:tabular-nums}
#sumbox .u{font-size:20px;font-weight:800;color:#8A7B6C}
#sumbox .j5{font-size:24px;font-weight:800;color:#E8873A}
#sumbox.ok{border-color:#6FA063;background:#EAF4E4}
#sumbox.ok b,#sumbox.ok .j5{color:#5E9455}

/* ---------- 数字键盘（change/jiao 找零期住 #table-area）：3×4 = 1-9 + 末行[清空,0,退格]
   键 ≥64（column 家族）；救援 breathe=当前应按的正确键；超位拒收 .nudge 轻闪 ---------- */
#keypad{display:none;grid-template-columns:repeat(3,var(--key,76px));grid-auto-rows:var(--key,76px);
  gap:13px;justify-content:center;flex:0 0 auto;align-self:center}
#keypad.show{display:grid}
.key{width:var(--key,76px);height:var(--key,76px);border-radius:20px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;font-size:calc(var(--key,76px) * .46);font-weight:800;color:#4A3B2E;
  font-variant-numeric:tabular-nums;transition:transform .12s,box-shadow .12s;position:relative}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.key .k-ico{width:46%;height:46%}
.key.fn{font-size:calc(var(--key,76px) * .3);color:#8A7B6C;background:#F6ECD9}
.key.breathe{animation:key-breathe 1.25s ease infinite}
@keyframes key-breathe{0%,100%{box-shadow:0 5px 0 #D8C9B4,0 0 0 0 rgba(232,151,90,.6);transform:scale(1)}
  50%{box-shadow:0 5px 0 #D8C9B4,0 0 0 15px rgba(232,151,90,0);background:#FDF0DA;transform:scale(1.07)}}
.key.nudge,#ans-display.nudge{animation:key-nudge .34s ease}
@keyframes key-nudge{0%{outline:7px solid #F5C445;outline-offset:0}
  100%{outline:7px solid transparent;outline-offset:10px}}

/* ---------- 底部答案区：gather/pair="给钱啦"主按钮
   change/jiao=答案显示（数字+元+5角键）+"算好啦"确认大按钮 ---------- */
#answers{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:20px;
  flex-wrap:wrap;min-height:118px;padding:2px 12px}
#deal-tip{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#8A7B6C}
#deal-tip svg{width:34px;height:34px}
#pay-btn{min-width:216px;min-height:96px;padding:0 40px;border-radius:28px;background:#E8975A;
  border:3px solid #4A3B2E;box-shadow:0 6px 0 #C77A42;color:#FFF9EE;font-size:34px;font-weight:800;
  letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:12px;
  transition:transform .15s,box-shadow .15s;animation:coin-in .38s cubic-bezier(.2,1.5,.4,1) both}
#pay-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C77A42}
#pay-btn svg{width:44px;height:44px}
#pay-btn.breathe{animation:pay-breathe 1.6s ease-in-out infinite}
@keyframes pay-breathe{0%,100%{transform:scale(1);box-shadow:0 6px 0 #C77A42}
  50%{transform:scale(1.06);box-shadow:0 6px 0 #C77A42,0 0 18px rgba(232,151,90,.9)}}
/* 答案显示（键盘期）：大数字 + 元 +（jiao 章）5 角 toggle 键；空位='?'占位 */
#ans-display{display:flex;align-items:center;gap:8px;min-width:210px;min-height:96px;
  padding:6px 24px;border-radius:24px;background:#FFFAF0;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #DFCFB6;animation:coin-in .38s cubic-bezier(.2,1.5,.4,1) both}
#ans-display b{font-size:52px;font-weight:800;color:#E8873A;line-height:1;
  font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
#ans-display b.ph{color:#D9C5A6}
#ans-display .u{font-size:22px;font-weight:800;color:#8A7B6C}
#ans-display.wig{animation:opt-shake .42s ease}
#ans-display.ok{border-color:#6FA063;background:#EAF4E4}
#ans-display.ok b{color:#5E9455}
#ans-display.breathe{animation:disp-breathe 1.6s ease-in-out infinite}
@keyframes disp-breathe{0%,100%{transform:scale(1);box-shadow:0 5px 0 #DFCFB6}
  50%{transform:scale(1.05);box-shadow:0 5px 0 #DFCFB6,0 0 16px rgba(232,151,90,.9)}}
/* 5 角键（仅 jiao 章）：金色 toggle，按下 .on 常亮 */
#jiao-chip{min-width:96px;min-height:96px;border-radius:24px;background:#F6ECD9;
  border:3px solid #C9A548;box-shadow:0 5px 0 #C9A548;color:#8A6D1F;font-size:26px;
  font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;
  transition:transform .12s,box-shadow .12s;animation:coin-in .38s cubic-bezier(.2,1.5,.4,1) both}
#jiao-chip:active{transform:translateY(3px);box-shadow:0 2px 0 #C9A548}
#jiao-chip.on{background:#E8C87A;border-color:#8A6D1F;box-shadow:0 5px 0 #8A6D1F;color:#5C4A12}
#jiao-chip.breathe{animation:pay-breathe 1.6s ease-in-out infinite}
/* 确认主按钮（键盘期）："算好啦" */
#confirm-btn{min-width:200px;min-height:96px;padding:0 34px;border-radius:28px;background:#E8975A;
  border:3px solid #4A3B2E;box-shadow:0 6px 0 #C77A42;color:#FFF9EE;font-size:32px;font-weight:800;
  letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s,box-shadow .15s;animation:coin-in .38s cubic-bezier(.2,1.5,.4,1) both}
#confirm-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C77A42}
#confirm-btn svg{width:40px;height:40px}
#confirm-btn.breathe{animation:pay-breathe 1.6s ease-in-out infinite}
/* 不灰化款：答错=晃动不灰掉可重点（SPEC §1）——键盘期晃答案显示区 */
@keyframes opt-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 divide/subbug） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：币/键盘/题面适配 */
@media (orientation:portrait){
  .coin{width:64px;height:64px}
  #coin-tray{gap:12px 14px}
  #basket{min-width:210px;min-height:96px}
  #keypad{--key:68px;gap:11px}
  #ans-display{min-width:180px;min-height:96px;padding:6px 16px}
  #ans-display b{font-size:44px}
  #jiao-chip{min-width:96px;font-size:23px}
  #confirm-btn{min-width:172px;font-size:28px}
  #tag b{font-size:40px}
  #chalk b{font-size:38px}
  #chalk .ask{font-size:19px}
  #pay-btn{min-width:190px;font-size:30px}
  #sumbox b{font-size:38px}
}
</style>
</head>
<body>
<div id="game" aria-label="零钱管家">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
    </div>
    <div id="table-area">
      <div id="coin-tray" aria-label="钱币托盘"></div>
      <div id="basket-row" aria-label="购物篮">
        <div id="basket"></div>
        <div id="sumbox" aria-label="篮内合计"><span class="lb">合计</span><b>0</b><span class="u">元</span></div>
      </div>
      <div id="keypad" aria-label="数字键盘"></div>
    </div>
    <div id="answers" aria-label="作答区"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子掌柜"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
