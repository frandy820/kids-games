<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>零钱管家</title>
<style>
/* ================= 零钱管家 money（batch13 · r15 难度改造版）=================
   视觉按 SPEC-BATCH13 §1 r15：暖米底 #FBF3E4、小卖部小兔子掌柜、圆形人民币简笔
   （5 角金黄 / 1 元银灰 / 5 元暖紫 / 10 元青蓝，大字面额）、价签大字 ≥40、答案卡 ≥96
   四题型：gather 凑零钱含角（点币入篮/合计实时/"给钱啦"提交，≠价篮晃动零惩罚不灰化）
   + pair 买两件合计（两件价签，先算 A+B 再凑币）
   + change 找零整元键盘（黑板"付 X 买 Y"，数字键盘 0-9+清空+退格，"算好啦"确认判定）
   + jiao 找零带角键盘（键盘+5 角键 toggle；显示一律"X元5角"格式，禁小数连写）
   键盘交互：判定只在确认（按键=构造探索不计 miss）；位数上限 2（超位拒收+轻闪）；
   确认错/空输入确认=miss（与空篮提交同口径）
   触摸目标：币 ≥68、键盘键 ≥64、答案卡与主按钮（给钱啦/算好啦）≥96、底栏按钮 ≥72 高；
   pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#C9A548;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:4px 10px}

/* ---------- 题面行：gather/pair=商品价签卡 / change/jiao=小黑板 ---------- */
#board{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  min-height:76px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:14px;padding:8px 22px;border-radius:22px;
  background:#FFFAF0;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #DFCFB6;flex-wrap:wrap;
  justify-content:center}
#prompt-chip .goods{width:58px;height:58px;flex:0 0 58px}
#prompt-chip .gname{font-size:18px;font-weight:700;color:#8A7B6C}
#tag{display:flex;align-items:baseline;gap:4px;padding:4px 16px;border-radius:14px;
  background:#FDEBD2;border:2.5px dashed #E8873A}
#tag b{color:#E8873A;font-size:46px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums}
#tag .u{font-size:20px;font-weight:800;color:#E8873A}
#tag .j5{font-size:24px;font-weight:800;color:#E8873A}
#prompt-chip .give{font-size:17px;font-weight:700;color:#8A7B6C}
#prompt-chip .plus{font-size:30px;font-weight:800;color:#C9A87C;padding:0 2px}
/* 小黑板（change/jiao）：深绿板面+粉笔白大字；木框 */
#prompt-chip.board{background:#33544B;border-color:#B08A5E;box-shadow:0 5px 0 #8A6844;padding:8px 26px}
#chalk{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
#chalk .ln{display:flex;align-items:baseline;gap:6px;color:#F5F1E6;font-weight:800}
#chalk .lb{font-size:20px;color:#CBE3D4;letter-spacing:.04em}
#chalk b{font-size:42px;line-height:1.1;font-variant-numeric:tabular-nums;color:#FDF9EE;
  text-shadow:0 2px 0 rgba(0,0,0,.18)}
#chalk .ask{font-size:22px;color:#F2C98C;font-weight:800}

/* ---------- 桌面（gather/pair）：钱币托盘（上）+ 购物篮行（下） ---------- */
#table-area{flex:1 1 auto;min-height:190px;width:100%;max-width:1180px;display:flex;
  flex-direction:column;justify-content:center;gap:6px}
#coin-tray{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:14px 18px;min-height:80px;padding:6px 8px;border-radius:20px;
  background:#F6ECD9;border:2.5px dashed #D9C5A6}
/* 钱币按钮：圆形人民币简笔；点后 .gone（入篮）；救援/教学 breathe */
.coin{position:relative;width:68px;height:68px;padding:0;border-radius:50%;
  transition:transform .15s;animation:coin-in .4s cubic-bezier(.2,1.5,.4,1) both}
.coin:nth-child(2n){animation-delay:.06s}.coin:nth-child(3n){animation-delay:.12s}
@keyframes coin-in{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.coin:active{transform:translateY(3px)}
.coin svg{width:100%;height:100%;pointer-events:none}
.coin.gone{visibility:hidden;pointer-events:none}
.coin.breathe{animation:coin-breathe 1.6s ease-in-out infinite}
@keyframes coin-breathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(232,151,90,0))}
  50%{transform:scale(1.12);filter:drop-shadow(0 0 12px rgba(232,151,90,.85))}}
/* 飞行币（fixed 克隆，JS 设起止坐标） */
.fly-coin{position:fixed;z-index:60;width:56px;height:56px;pointer-events:none;
  transition:transform .46s cubic-bezier(.35,.05,.6,1),opacity .46s;will-change:transform}

/* 购物篮行：篮（篮内币可点=移除）+ 合计大字 */
#basket-row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
  padding:2px 6px}
#basket{display:flex;align-items:center;gap:10px;min-width:230px;min-height:96px;
  padding:8px 16px;border-radius:20px;background:#FBE9CF;border:2.5px solid #C9A87C;
  box-shadow:0 4px 0 #DFCFB6;flex-wrap:wrap;justify-content:center}
#basket .empty{font-size:16px;font-weight:700;color:#8A7B6C}
#basket.wig{animation:basket-wig .5s ease}
@keyframes basket-wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.tcoin{position:relative;width:64px;height:64px;padding:0;border-radius:50%;
  animation:coin-in .32s cubic-bezier(.2,1.5,.4,1) both;transition:transform .15s}
.tcoin:active{transform:translateY(3px)}
.tcoin svg{width:100%;height:100%;pointer-events:none}
.tcoin.breathe{animation:coin-breathe 1.6s ease-in-out infinite}
/* 合计：篮右侧实时大字（=价时亮绿）；带角显示"X 元 5 角"格式 */
#sumbox{display:flex;align-items:baseline;gap:6px;padding:6px 18px;border-radius:16px;
  background:#FFFAF0;border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #DFCFB6}
#sumbox .lb{font-size:17px;font-weight:700;color:#8A7B6C}
#sumbox b{font-size:44px;font-weight:800;color:#E8873A;line-height:1;
  font-variant-numeric:tabular-nums}
#sumbox .u{font-size:20px;font-weight:800;color:#8A7B6C}
#sumbox .j5{font-size:24px;font-weight:800;color:#E8873A}
#sumbox.ok{border-color:#6FA063;background:#EAF4E4}
#sumbox.ok b,#sumbox.ok .j5{color:#5E9455}

/* ---------- 数字键盘（change/jiao 找零期住 #table-area）：3×4 = 1-9 + 末行[清空,0,退格]
   键 ≥64（column 家族）；救援 breathe=当前应按的正确键；超位拒收 .nudge 轻闪 ---------- */
#keypad{display:none;grid-template-columns:repeat(3,var(--key,76px));grid-auto-rows:var(--key,76px);
  gap:13px;justify-content:center;flex:0 0 auto;align-self:center}
#keypad.show{display:grid}
.key{width:var(--key,76px);height:var(--key,76px);border-radius:20px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;font-size:calc(var(--key,76px) * .46);font-weight:800;color:#4A3B2E;
  font-variant-numeric:tabular-nums;transition:transform .12s,box-shadow .12s;position:relative}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.key .k-ico{width:46%;height:46%}
.key.fn{font-size:calc(var(--key,76px) * .3);color:#8A7B6C;background:#F6ECD9}
.key.breathe{animation:key-breathe 1.25s ease infinite}
@keyframes key-breathe{0%,100%{box-shadow:0 5px 0 #D8C9B4,0 0 0 0 rgba(232,151,90,.6);transform:scale(1)}
  50%{box-shadow:0 5px 0 #D8C9B4,0 0 0 15px rgba(232,151,90,0);background:#FDF0DA;transform:scale(1.07)}}
.key.nudge,#ans-display.nudge{animation:key-nudge .34s ease}
@keyframes key-nudge{0%{outline:7px solid #F5C445;outline-offset:0}
  100%{outline:7px solid transparent;outline-offset:10px}}

/* ---------- 底部答案区：gather/pair="给钱啦"主按钮
   change/jiao=答案显示（数字+元+5角键）+"算好啦"确认大按钮 ---------- */
#answers{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:20px;
  flex-wrap:wrap;min-height:118px;padding:2px 12px}
#deal-tip{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#8A7B6C}
#deal-tip svg{width:34px;height:34px}
#pay-btn{min-width:216px;min-height:96px;padding:0 40px;border-radius:28px;background:#E8975A;
  border:3px solid #4A3B2E;box-shadow:0 6px 0 #C77A42;color:#FFF9EE;font-size:34px;font-weight:800;
  letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:12px;
  transition:transform .15s,box-shadow .15s;animation:coin-in .38s cubic-bezier(.2,1.5,.4,1) both}
#pay-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C77A42}
#pay-btn svg{width:44px;height:44px}
#pay-btn.breathe{animation:pay-breathe 1.6s ease-in-out infinite}
@keyframes pay-breathe{0%,100%{transform:scale(1);box-shadow:0 6px 0 #C77A42}
  50%{transform:scale(1.06);box-shadow:0 6px 0 #C77A42,0 0 18px rgba(232,151,90,.9)}}
/* 答案显示（键盘期）：大数字 + 元 +（jiao 章）5 角 toggle 键；空位='?'占位 */
#ans-display{display:flex;align-items:center;gap:8px;min-width:210px;min-height:96px;
  padding:6px 24px;border-radius:24px;background:#FFFAF0;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #DFCFB6;animation:coin-in .38s cubic-bezier(.2,1.5,.4,1) both}
#ans-display b{font-size:52px;font-weight:800;color:#E8873A;line-height:1;
  font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
#ans-display b.ph{color:#D9C5A6}
#ans-display .u{font-size:22px;font-weight:800;color:#8A7B6C}
#ans-display.wig{animation:opt-shake .42s ease}
#ans-display.ok{border-color:#6FA063;background:#EAF4E4}
#ans-display.ok b{color:#5E9455}
#ans-display.breathe{animation:disp-breathe 1.6s ease-in-out infinite}
@keyframes disp-breathe{0%,100%{transform:scale(1);box-shadow:0 5px 0 #DFCFB6}
  50%{transform:scale(1.05);box-shadow:0 5px 0 #DFCFB6,0 0 16px rgba(232,151,90,.9)}}
/* 5 角键（仅 jiao 章）：金色 toggle，按下 .on 常亮 */
#jiao-chip{min-width:96px;min-height:96px;border-radius:24px;background:#F6ECD9;
  border:3px solid #C9A548;box-shadow:0 5px 0 #C9A548;color:#8A6D1F;font-size:26px;
  font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;
  transition:transform .12s,box-shadow .12s;animation:coin-in .38s cubic-bezier(.2,1.5,.4,1) both}
#jiao-chip:active{transform:translateY(3px);box-shadow:0 2px 0 #C9A548}
#jiao-chip.on{background:#E8C87A;border-color:#8A6D1F;box-shadow:0 5px 0 #8A6D1F;color:#5C4A12}
#jiao-chip.breathe{animation:pay-breathe 1.6s ease-in-out infinite}
/* 确认主按钮（键盘期）："算好啦" */
#confirm-btn{min-width:200px;min-height:96px;padding:0 34px;border-radius:28px;background:#E8975A;
  border:3px solid #4A3B2E;box-shadow:0 6px 0 #C77A42;color:#FFF9EE;font-size:32px;font-weight:800;
  letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s,box-shadow .15s;animation:coin-in .38s cubic-bezier(.2,1.5,.4,1) both}
#confirm-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C77A42}
#confirm-btn svg{width:40px;height:40px}
#confirm-btn.breathe{animation:pay-breathe 1.6s ease-in-out infinite}
/* 不灰化款：答错=晃动不灰掉可重点（SPEC §1）——键盘期晃答案显示区 */
@keyframes opt-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 divide/subbug） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：币/键盘/题面适配 */
@media (orientation:portrait){
  .coin{width:64px;height:64px}
  #coin-tray{gap:12px 14px}
  #basket{min-width:210px;min-height:96px}
  #keypad{--key:68px;gap:11px}
  #ans-display{min-width:180px;min-height:96px;padding:6px 16px}
  #ans-display b{font-size:44px}
  #jiao-chip{min-width:96px;font-size:23px}
  #confirm-btn{min-width:172px;font-size:28px}
  #tag b{font-size:40px}
  #chalk b{font-size:38px}
  #chalk .ask{font-size:19px}
  #pay-btn{min-width:190px;font-size:30px}
  #sumbox b{font-size:38px}
}
</style>
</head>
<body>
<div id="game" aria-label="零钱管家">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
    </div>
    <div id="table-area">
      <div id="coin-tray" aria-label="钱币托盘"></div>
      <div id="basket-row" aria-label="购物篮">
        <div id="basket"></div>
        <div id="sumbox" aria-label="篮内合计"><span class="lb">合计</span><b>0</b><span class="u">元</span></div>
      </div>
      <div id="keypad" aria-label="数字键盘"></div>
    </div>
    <div id="answers" aria-label="作答区"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子掌柜"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {

        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* 最少解币数（模型用；verify 另有独立副本） */
function minCoinsDP(avail, target) {
  if (target < 0) return 0;
  const INF = 99;
  const dp = new Array(target + 1).fill(INF);
  dp[0] = 0;
  for (const v of avail) for (let t = target; t >= v; t--) {
    if (dp[t - v] + 1 < dp[t]) dp[t] = dp[t - v] + 1;
  }
  return dp[target] >= INF ? 0 : dp[target];
}
const voiceWinMs = q => ENTER_MS + estMs(qSpeech(q)) + TAIL_MS;
const nInputOf = q => q.kind === 'gather' || q.kind === 'pair'
  ? minCoinsDP(q.coins, q.price)
  : String(Math.floor(q.ans / 2)).length + (q.kind === 'jiao' ? 1 : 0);
const quizDurMs = q => Math.max(voiceWinMs(q), DECIDE_MS[q.kind]) + nInputOf(q) * TAP_MS + CONFIRM_MS + ADV_MS;
const levelDurMs = L => L.quizzes.reduce((s, q) => s + quizDurMs(q), 0);

/* ---------- 题面读音单元序列（与题面文字一一对应；queue 段间自动 0.15s 停顿）
   引擎金额为半元单位，读音/文字一律先转元 ---------- */
function quizParts(q) {
  if (q.kind === 'gather') {
    const half = q.price % 2 === 1;                   /* ch1 角价 X.5 */
    return [
      { key: VOICE.qbuy.key, text: VOICE.qbuy.text },
      { key: nKey((q.price - (half ? 1 : 0)) / 2), text: numCn((q.price - (half ? 1 : 0)) / 2) },
      half ? { key: VOICE.buyj.key, text: VOICE.buyj.text }
           : { key: VOICE.qbuy2.key, text: VOICE.qbuy2.text }
    ];
  }
  if (q.kind === 'pair') {                            /* ch2 买两件：买 X(元五角)的和 Y(元五角)的东西 */
    const ha = q.priceA % 2 === 1, hb = q.priceB % 2 === 1;
    return [
      { key: VOICE.qbuy.key, text: VOICE.qbuy.text },
      { key: nKey((q.priceA - (ha ? 1 : 0)) / 2), text: numCn((q.priceA - (ha ? 1 : 0)) / 2) },
      ha ? { key: VOICE.andj.key, text: VOICE.andj.text }
         : { key: VOICE.and.key, text: VOICE.and.text },
      { key: nKey((q.priceB - (hb ? 1 : 0)) / 2), text: numCn((q.priceB - (hb ? 1 : 0)) / 2) },
      hb ? { key: VOICE.buyj.key, text: VOICE.buyj.text }
         : { key: VOICE.qbuy2.key, text: VOICE.qbuy2.text }
    ];
  }
  const priceHalf = q.price % 2 === 1;                 /* ch4 价 X.5 */
  const parts = [
    { key: VOICE.qpay.key, text: VOICE.qpay.text },
    { key: nKey(q.pay / 2), text: numCn(q.pay / 2) },
    { key: VOICE.qpay2.key, text: VOICE.qpay2.text },
    { key: nKey((q.price - (priceHalf ? 1 : 0)) / 2), text: numCn((q.price - (priceHalf ? 1 : 0)) / 2) }
  ];
  if (priceHalf) parts.push({ key: VOICE.qjiao.key, text: VOICE.qjiao.text });       /* 带角=整条尾句（含"的东西，找回几元呀"） */
  else parts.push({ key: VOICE.qpay3.key, text: VOICE.qpay3.text });                  /* 整元=数词+元的东西 */
  return parts;
}
const qSpeech = q => quizParts(q).map(p => p.text).join('');   /* TTS 兜底与 quizParts 同构 */

/* ================= money 纯引擎：确定性关卡生成 + 凑钱/买两件/键盘找零判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   内部金额单位=半元（0.5 元）整数：币 {0.5,1,5,10}元 = {1,2,10,20}，零浮点歧义
   章难度（SPEC-BATCH13 §1 r15）：
   dch1 凑零钱含角（币 0.5/1/5 元；价池 角{2.5,3.5,5.5,6.5,7.5}+整{3,4,6,7,8}，qi0/2/4 角价——起步含五角）
   dch2 买两件合计（qi0 热身=dch1 角价型；qi1/2 拆型无 10 元币 T∈15 档；qi3/4 含 10 元币 T∈10 档；
        两件各 2.5-9.5 元，合计=凑钱目标——先算 A+B 再凑）
   dch3 找零整元键盘（付 10/20 元，价 3-18，差 2-17 整元；数字键盘输入）
   dch4 找零带角键盘（付 10/20，价 X.5 X∈2-8；付 10→差 1.5-7.5、付 20→差 11.5-17.5；
        答案=元数字+5 角键；qi0 热身=dch3 型）
   凑钱可凑性=引擎级保证：coins 含 price 的基础分解+干扰币（生成即证明可达，verify 再 DP 复核）
   最少解币数上限（儿童工作记忆先验，verify 独立复算）：dch1 ≤4 / dch2 ≤5（拆型与含 10 型逐一验算）
   miss 语义（SPEC §1"零惩罚可调整"）：放币/移币/按键=构造探索不计 miss；
   tapOK/tapConfirm 提交错（或空输入确认）才 miss++/retries++
   键盘域：元位数 ≤2（第 3 位拒收）；角位仅 0/5 两态（5 角键 toggle，仅 dch4 在场） */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
const pick = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];
/* 进度章号单调递增；难度章号：静态关 (ch-1)%4+1 循环，生成关随机 1-4（§0.3） */

const Y = e => Math.round(e * 2);                     // 元 → 半元
const sumBy = (arr, f) => arr.reduce((s, v) => s + (f ? f(v) : v), 0);

/* ---------- 价位选择（同关优先不重复、相邻不同；池尽回退） ---------- */
function pickPrice(rnd, pool, used, avoid) {
  let p = pool.filter(v => used.indexOf(v) < 0 && v !== avoid);
  if (!p.length) p = pool.filter(v => v !== avoid);
  if (!p.length) p = pool;                            // 理论不可达（各池 ≥5 种）
  return pick(rnd, p);
}
/* ---------- 币盘收尾：干扰币（0-2 枚 0.5/1/5 元）+洗牌+最少 3 枚（防一步题） ---------- */
function finishGather(price, coins, rnd) {
  const extra = ri(rnd, 0, 2);
  for (let i = 0; i < extra; i++) coins.push(pick(rnd, [1, 2, 10]));
  capCoins(coins, 7, 40);                             // 基础币在前，只砍尾部干扰
  while (coins.length < 3) coins.push(pick(rnd, [1, 2, 10]));
  return { kind: 'gather', price: price,
    coins: shuffled(coins, rnd).map(v => v),
    _taken: [], _tray: [], miss: 0, solved: false, warm: false };
}
function capCoins(coins, maxN, maxSum) {              // 防御上限：只 pop 尾部干扰币
  while (coins.length > maxN || sumBy(coins) > maxSum) {
    if (coins.length <= 1) break;
    coins.pop();
  }
}

/* ---------- dch1 凑零钱含角（半元价池；角价 5/7/11/13/15，整价 6/8/12/14/16）
   基础分解：≥5 元给 5 元币，余 1 元币，角给 5 角币——最少解 ≤4（SPEC 先验验算） ---------- */
const G1_HALF_POOL = [5, 7, 11, 13, 15];              // 2.5/3.5/5.5/6.5/7.5 元
const G1_INT_POOL = [6, 8, 12, 14, 16];               // 3/4/6/7/8 元
function baseCoins(p) {                               // 半元基础分解（5 元→10/1 元→2/5 角→1）
  const coins = [];
  if (p >= 10) coins.push(10);
  let r = p - (p >= 10 ? 10 : 0);
  while (r >= 2) { coins.push(2); r -= 2; }
  if (r === 1) coins.push(1);
  return coins;
}
function genGatherHalf(rnd, used, avoid, wantHalf) {  // dch1（兼 dch2 首题热身）
  const pool = wantHalf ? G1_HALF_POOL : G1_INT_POOL;
  const price = pickPrice(rnd, pool, used, avoid);
  return finishGather(price, baseCoins(price), rnd);
}

/* ---------- dch2 买两件合计：两价相加 → 合计为凑钱目标（多币组合）
   拆型（无 10 元币）T 池 15 档 / 含 10 型 T 池 10 档（半元；最少解 ≤5 逐一验算，排除 9.5/13.5/14/14.5/17.5 等超档值） ---------- */
const PAIR_SPLIT_POOL = [16, 17, 18, 20, 21, 22, 23, 24, 25, 26, 30, 31, 32, 33, 34];  // 8-17 元（缺 14 档）
const PAIR_TEN_POOL = [24, 25, 26, 27, 28, 30, 31, 32, 33, 34];                        // 12-17 元（缺 14.5 档）
function splitTwo(rnd, T) {                           // 合计 T → 两件各 2.5-9.5 元（半元 5-19）
  const lo = Math.max(5, T - 19), hi = Math.min(19, T - 5);
  const a = ri(rnd, lo, hi);
  return [a, T - a];
}
function finishPair(T, coins, rnd) {
  const q = finishGather(T, coins, rnd);
  q.kind = 'pair';
  const ab = splitTwo(rnd, T);
  q.priceA = ab[0]; q.priceB = ab[1];
  return q;
}
function genPairSplit(rnd, used, avoid) {             // dch2 拆型：无 10 元币（需拆解）
  const T = pickPrice(rnd, PAIR_SPLIT_POOL, used, avoid);
  const coins = [];
  const k = Math.min(Math.floor(T / 10), 3);          // ≤3 枚 5 元
  for (let i = 0; i < k; i++) coins.push(10);
  let r = T - k * 10;
  while (r >= 2) { coins.push(2); r -= 2; }
  if (r === 1) coins.push(1);
  if (ri(rnd, 0, 1)) coins.push(pick(rnd, [1, 2, 10]));   // 0-1 干扰（不加 10 元保持"拆"语义）
  return finishPair(T, coins, rnd);
}
function genPairTen(rnd, used, avoid) {               // dch2 含 10 型：用 10 元币
  const T = pickPrice(rnd, PAIR_TEN_POOL, used, avoid);
  const coins = [20];
  let r = T - 20;
  if (r >= 10) { coins.push(10); r -= 10; }
  while (r >= 2) { coins.push(2); r -= 2; }
  if (r === 1) coins.push(1);
  if (ri(rnd, 0, 1)) coins.push(pick(rnd, [1, 2, 10]));
  return finishPair(T, coins, rnd);
}

/* ---------- 找零生成（c3 整元键盘 / c4 带角键盘；无选项卡——答案域即键盘输入域） ---------- */
function finishChange(pay, price, rnd) {              // 半元 → 键盘初态（digits='' jiao=false）
  const q = { kind: price % 2 === 1 ? 'jiao' : 'change', pay: pay, price: price,
    ans: pay - price, digits: '', jiao: false, miss: 0, solved: false, warm: false };
  return q;
}
function genChangeWhole(rnd, used, avoid) {           // dch3（兼 dch4 首题热身）
  const pay = rnd() < .5 ? 20 : 40;                   // 付 10/20 元
  const pool = pay === 20 ? [6, 8, 10, 12, 14, 16]                        // 价 3-8 元
    : Array.from({ length: 16 }, (_, i) => 6 + i * 2);                    // 价 3-18 元
  const price = pickPrice(rnd, pool, used, avoid);
  return finishChange(pay, price, rnd);
}
function genChangeJiao(rnd, used, avoid) {            // dch4：价 X.5（X∈2-8），差=付-X-0.5
  const pay = rnd() < .5 ? 20 : 40;                   // 付 10→差 1.5-7.5 / 付 20→差 11.5-17.5
  const pool = [5, 7, 9, 11, 13, 15, 17];             // X.5 价（半元奇数）
  const price = pickPrice(rnd, pool, used, avoid);
  return finishChange(pay, price, rnd);
}

/* ---------- 单题生成（rnd 同流确定性；同关相邻价不同，优先未用价） ---------- */
function genOne(dch, qi, rnd, used, avoid) {
  let q;
  if (dch === 1) q = genGatherHalf(rnd, used, avoid, qi % 2 === 0);     // qi0/2/4 角价=起步含五角
  else if (dch === 2) q = qi === 0 ? genGatherHalf(rnd, used, avoid, true)   // 首题热身=dch1 角价型
    : (qi <= 2 ? genPairSplit(rnd, used, avoid) : genPairTen(rnd, used, avoid));
  else if (dch === 3) q = genChangeWhole(rnd, used, avoid);
  else q = qi === 0 ? genChangeWhole(rnd, used, avoid) : genChangeJiao(rnd, used, avoid);   // 首题热身=dch3 型
  q.warm = qi === 0 && (dch === 2 || dch === 4);
  if (q.kind === 'gather' || q.kind === 'pair') {                     // 商品轮换（确定性）
    q.goods = qi % GOODS.length;
    if (q.kind === 'pair') q.goodsB = (q.goods + 3) % GOODS.length;   // 两件不同商品
  }
  return q;
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // §0.3 batch11 M1 定版
  const quizzes = [];
  const used = [];
  let avoid = -1;                                     // 上一题半元价（同关 kind 恒定，避相邻重复）
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genOne(dch, qi, rnd, used, avoid);
    used.push(q.price);
    avoid = q.price;
    quizzes.push(q);
  }
  return { flat, ch, dch, lv, quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 凑钱引擎（无 DOM）：篮内合计（gather+pair 共用） ---------- */
const sumOf = q => q._tray.reduce((s, i) => s + q.coins[i], 0);
const isGatherKind = q => q.kind === 'gather' || q.kind === 'pair';

/* engTapCoin(L, i)：gather/pair 期点第 i 枚币入篮 → 返回新合计（半元）；
   已入篮/非法下标/键盘期/关已结束 → null */
function engTapCoin(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!isGatherKind(q)) return null;
  if (typeof i !== 'number' || Math.floor(i) !== i || i < 0 || i >= q.coins.length) return null;
  if (q._taken[i]) return null;
  q._taken[i] = 1;
  q._tray.push(i);
  return sumOf(q);
}
/* engTapTray(L, j)：点篮内第 j 枚币移除 → 返回新合计；非法下标/键盘期 → null */
function engTapTray(L, j) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!isGatherKind(q)) return null;
  if (typeof j !== 'number' || Math.floor(j) !== j || j < 0 || j >= q._tray.length) return null;
  q._taken[q._tray[j]] = 0;
  q._tray.splice(j, 1);
  return sumOf(q);
}
/* engOK(L)：gather/pair 期"给钱啦"提交——合计=价 → 'right'/'done'（推进）；
   ≠价 → 'wrong'（miss/retries 计一次，零惩罚可调整）；键盘期 → 'again' 防御层；
   放币/移除/按键不进此路径（探索不计 miss） */
function engOK(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!isGatherKind(q)) return 'again';
  if (sumOf(q) === q.price) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  q.miss++;
  L.retries++;
  return 'wrong';
}

/* ---------- 键盘引擎（dch3/4 找零）：engKey 构造（探索零惩罚）/ engConfirm 判定 ----------
   k ∈ '0'-'9'（元位数字，≤2 位，首位 0 替换）| 'del'（退格元位）| 'clr'（清空+角位）
   | 'jiao'（5 角键 toggle，仅 jiao 型；change 型返回 null 拒收）
   返回 {digits, jiao, capped}（capped=超位数拒收，状态不变）；键盘期以外 'again'/null */
function engKey(L, k) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (isGatherKind(q)) return 'again';                 // gather/pair 期按键=防御层
  if (k === 'del') {
    if (q.digits.length) q.digits = q.digits.slice(0, -1);
    return { digits: q.digits, jiao: q.jiao, capped: false };
  }
  if (k === 'clr') {
    q.digits = ''; q.jiao = false;
    return { digits: q.digits, jiao: q.jiao, capped: false };
  }
  if (k === 'jiao') {
    if (q.kind !== 'jiao') return null;               // 5 角键仅带角章在场
    q.jiao = !q.jiao;
    return { digits: q.digits, jiao: q.jiao, capped: false };
  }
  if (typeof k === 'string' && k.length === 1 && k >= '0' && k <= '9') {
    if (q.digits.length >= 2) return { digits: q.digits, jiao: q.jiao, capped: true };   // 位数上限 2：拒收
    q.digits = q.digits === '0' ? k : q.digits + k;   // 首位 0 替换（计算器惯例）
    return { digits: q.digits, jiao: q.jiao, capped: false };
  }
  return null;                                        // 非法键名
}
/* engConfirm(L)：确认判定（唯一 miss 计数点）——元数字×2+（角?1:0）=答案（半元）→ 'right'/'done';
   错/空输入 → 'wrong'（miss/retries 计一次；空输入确认与空篮提交同口径）；gather 期 → 'again' 防御层 */
function engConfirm(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (isGatherKind(q)) return 'again';
  const val = q.digits === '' ? -1 : Number(q.digits) * 2 + (q.jiao ? 1 : 0);   // 半元；空输入恒错
  if (val === q.ans) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  q.miss++;
  L.retries++;
  return 'wrong';
}
/* 星级：0 错=3★ / 1-2 错=2★ / 更多=1★（SPEC §1，永不 0 星） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 可行性 DP：avail（半元数组）能否子集和凑出 target（每币一次） ---------- */
function canReach(avail, target) {
  if (target < 0) return false;
  if (target === 0) return true;
  const dp = new Array(target + 1).fill(false);
  dp[0] = true;
  for (const v of avail) {
    for (let t = target; t >= v; t--) if (dp[t - v]) dp[t] = true;
  }
  return !!dp[target];
}

/* ---------- 救援目标（§0.21）：
   gather/pair：合计=价 → {act:'ok'}；可加币 → {act:'add', i}；否则 → {act:'remove', j}（恒有解）
   change/jiao 键盘：清→位→角→确认 阶梯——非前缀输入 → {act:'clr'}；元位未齐 →
   {act:'key', k=下一位正确数字}；元位齐角错 → {act:'chip'}；全对 → {act:'ok'} ---------- */
function rescueTarget(q) {
  if (!q || q.solved) return null;
  if (isGatherKind(q)) {
    const sum = sumOf(q);
    if (sum === q.price) return { act: 'ok' };
    const availIdx = [];
    for (let i = 0; i < q.coins.length; i++) if (!q._taken[i]) availIdx.push(i);
    if (sum < q.price) {
      for (const i of availIdx) {
        const rest = availIdx.filter(k => k !== i).map(k => q.coins[k]);
        if (canReach(rest, q.price - sum - q.coins[i])) return { act: 'add', i: i };
      }
    }
    for (let j = q._tray.length - 1; j >= 0; j--) {     // 后放的先引导移除（直觉）
      const ci = q._tray[j];
      const rest = availIdx.concat([ci]).map(k => q.coins[k]);
      if (canReach(rest, q.price - (sum - q.coins[ci]))) return { act: 'remove', j: j };
    }
    return null;                                        // 理论不可达（生成即证明完整解在场）
  }
  const ansY = String(Math.floor(q.ans / 2));
  const needJiao = q.ans % 2 === 1;
  if (q.digits !== '' && q.digits !== ansY.slice(0, q.digits.length)) return { act: 'clr' };
  if (q.digits.length < ansY.length) return { act: 'key', k: ansY[q.digits.length] };
  if (needJiao !== q.jiao) return { act: 'chip' };
  return { act: 'ok' };
}

/* ---------- 结构校验（verify 用；数值域断言在 verify refRangeOk 独立推导） ---------- */
function structOk(q) {
  if (!q) return false;
  if (isGatherKind(q)) {
    if (!Array.isArray(q.coins) || q.coins.length < 3 || q.coins.length > 7) return false;
    if (q.coins.some(v => [1, 2, 10, 20].indexOf(v) < 0)) return false;      // 币面值 ∈{0.5,1,5,10}元
    if (sumBy(q.coins) < q.price) return false;                              // 可凑性前提：总额≥价
    if (q.kind === 'pair') {
      if (q.priceA + q.priceB !== q.price) return false;                     // 两件合计=目标
      if (q.priceA < 5 || q.priceA > 19 || q.priceB < 5 || q.priceB > 19) return false;  // 各 2.5-9.5 元
    }
    return canReach(q.coins, q.price);                                       // 引擎级：子集和可达
  }
  if (q.kind !== 'change' && q.kind !== 'jiao') return false;
  if (q.pay !== 20 && q.pay !== 40) return false;                            // 付 10/20 元
  if (q.ans !== q.pay - q.price || q.ans <= 0) return false;                 // 差=付-价 恒正
  if (q.kind === 'change' && (q.price % 2 !== 0 || q.ans % 2 !== 0)) return false;   // 整元章全偶
  if (q.kind === 'jiao' && (q.price % 2 === 0 || q.ans % 2 === 0)) return false;     // 带角章全奇
  if (String(Math.floor(q.ans / 2)).length > 2) return false;                // 键盘位数域 ≤2
  return typeof q.digits === 'string' && typeof q.jiao === 'boolean';
}
/* ================= money 主逻辑（r15：商品价签/币托盘/购物篮/数字键盘渲染 / 凑钱·买两件提交
   / 键盘找零确认 / 教学 / 推进）
   玩法四型（SPEC-BATCH13 §1 r15）：
   gather 凑零钱含角——商品价签大字（含"X元5角"）+钱币托盘（含 5 角金币）：点币入篮（飞入）、
   再点篮内币移除，合计实时大字；点"给钱啦"提交：合计=价→庆祝；≠价→篮晃动零惩罚（不灰化
   可调整；放币/移除=探索不计 miss）
   pair 买两件合计——两件商品各带价签，先算两价之和再凑正好的钱（多币组合）
   change 找零整元键盘——黑板"付了 X 元，买了 Y 元的东西"，数字键盘（1-9+清空+0+退格）
   输元位数字，"算好啦"确认判定；按键=构造探索不计 miss，确认错/空输入确认才 miss
   jiao 找零带角键盘——键盘+5 角键 toggle；答案"X 元 5 角"（显示禁小数连写）
   答错=晃动不灰化可重点；sayW force=q.miss===2；救援 14s=重读题面+答案视觉线索
   （凑钱期可行性 DP 指币/指提交钮；键盘期 清→位→角→确认 阶梯 breathe），只被正确推进重置。
   验收钩子：window.MN = { get currentLevel, get quiz(){kind,price,priceA,priceB,pay,coins,tray,
   sum,digits,jiao,answer,step,miss}, tapCoin(v), tapTray(i), tapOK(), tapKey(k), tapConfirm(),
   async autoSolve(), get tutorial, get rescues }（getter 拷贝非活引用） */

   必须 === 2（豁免只在每题 miss 首达 2 时发一次，防豁免变每错必播） */
let lastWrongVoice = 0;

  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.play(key, text); }
};
/* 题面=queue 拼接 clip（§0.23）：全部段 clip 在场走 queue，缺任一走整句 TTS 兜底 */
function sayQ(parts, fullText) {
  if (KIDS.voice.clips && parts.every(p => KIDS.voice.clips[p.key])) {
    KIDS.voice.queue(parts.map(p => p.key));
  } else {
    KIDS.voice.say(fullText);
  }
}

const payBtnEl = () => answersEl.querySelector('#pay-btn');

const coinName = v => v === 0.5 ? '五角' : (v + ' 元');          // 币名（aria/提示）

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 72);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
  buildKeys();
}
/* 数字键盘 3×4：1-9 + 末行[清空, 0, 退格]（column 家族；键 ≥64，change/jiao 期在场） */
const KEY_LAYOUT = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clr', '0', 'del'];
function buildKeys() {
  keypadEl.innerHTML = '';
  KEY_LAYOUT.forEach(k => {
    const b = document.createElement('button');
    b.className = 'key' + (k === 'clr' || k === 'del' ? ' fn' : '');
    b.dataset.k = k;
    if (k === 'clr') { b.textContent = '清空'; b.setAttribute('aria-label', '清空'); }
    else if (k === 'del') { b.textContent = '退格'; b.setAttribute('aria-label', '退格，删一个数字'); }
    else { b.textContent = k; b.setAttribute('aria-label', '数字 ' + k); }
    keypadEl.appendChild(b);
  });
}
/* 音效（Web Audio 合成）：入篮/按键=双音上扬 / 移除=低柔单音（轻反馈不惩罚） */
const coinHi = () => { if (!VERIFY) { KIDS.audio.note(880, 0.09, 0, 0.5); KIDS.audio.note(1108, 0.12, 0.07, 0.4); } };
const takeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };
const keyLo = () => { if (!VERIFY) KIDS.audio.note(659, 0.08, 0, 0.35); };

/* ================= 渲染 ================= */
/* 题面：gather=商品+价签大字 / pair=两件商品+两价签+加号 / change·jiao=小黑板（付 X · 买 Y）
   带角显示一律"X元5角"格式（禁小数连写） */
const chalkTxt = j => j % 2 ? ((j - 1) / 2 + '元5角') : (j / 2 + '元');
function tagHtml(j, id) {                              // 价签（半元 → "X元"/"X元5角"）
  if (j % 2) return '<span id="' + id + '"><b>' + ((j - 1) / 2) + '</b><span class="u">元</span><span class="j5">5角</span></span>';
  return '<span id="' + id + '"><b>' + (j / 2) + '</b><span class="u">元</span></span>';
}
function renderChip(q) {
  if (q.kind === 'change' || q.kind === 'jiao') {
    chipEl.className = 'board';
    chipEl.innerHTML = '<div id="chalk">' +
      '<span class="ln"><span class="lb">付了</span><b>' + fmtYuan(q.pay) + '</b><span class="lb">元</span></span>' +
      '<span class="ln"><span class="lb">买了</span><b>' + chalkTxt(q.price) + '</b><span class="lb">的东西</span></span>' +
      '<span class="ask">找回几元呀？</span></div>';
    return;
  }
  chipEl.className = '';
  if (q.kind === 'pair') {
    const ga = GOODS[q.goods % GOODS.length], gb = GOODS[q.goodsB % GOODS.length];
    chipEl.innerHTML = '<span class="goods">' + ga.svg + '</span>' + tagHtml(q.priceA, 'tagA') +
      '<span class="plus">+</span>' +
      '<span class="goods">' + gb.svg + '</span>' + tagHtml(q.priceB, 'tagB') +
      '<span class="give">点出正好的钱</span>';
    return;
  }
  const g = GOODS[q.goods >= 0 ? q.goods % GOODS.length : 0];
  chipEl.innerHTML = '<span class="goods">' + g.svg + '</span>' +
    '<span class="gname">' + g.name + '</span>' +
    tagHtml(q.price, 'tag') +
    '<span class="give">点出正好的钱</span>';
}
/* 币托盘：每枚圆形人民币按钮（data-i=coins 下标；重渲染还原已入篮 .gone；5 角金币） */
function renderCoins(q) {
  coinTrayEl.innerHTML = '';
  q.coins.forEach((v, i) => {
    const b = document.createElement('button');
    b.className = 'coin' + (q._taken[i] ? ' gone' : '');
    b.dataset.i = i;
    b.setAttribute('aria-label', coinName(fmtYuan(v)) + '硬币');
    b.innerHTML = coinSvg(fmtYuan(v), 64);
    coinTrayEl.appendChild(b);
  });
}
/* 购物篮：篮内币（data-j=tray 序，点=移除）+ 合计实时大字（=价亮绿） */
function renderBasket(q) {
  basketEl.innerHTML = '';
  if (!q._tray.length) {
    basketEl.innerHTML = '<span class="empty">点点钱币，放进小篮子</span>';
  } else {
    q._tray.forEach((ci, j) => {
      const b = document.createElement('button');
      b.className = 'tcoin';
      b.dataset.j = j;
      b.setAttribute('aria-label', '篮内 ' + coinName(fmtYuan(q.coins[ci])) + '，点一点拿回来');
      b.innerHTML = coinSvg(fmtYuan(q.coins[ci]), 60);
      basketEl.appendChild(b);
    });
  }
  renderSum(q);
}
function renderSum(q) {                          // 合计实时大字；带角="X元5角"格式（=价亮绿）
  const s = sumOf(q);
  const b = sumboxEl.querySelector('b'), u = sumboxEl.querySelector('.u');
  let j5 = sumboxEl.querySelector('.j5');
  if (s % 2 === 1) {
    b.textContent = (s - 1) / 2;
    u.style.display = 'none';
    if (!j5) { j5 = document.createElement('span'); j5.className = 'j5'; sumboxEl.appendChild(j5); }
    j5.textContent = '元5角';
  } else {
    b.textContent = s / 2;
    u.style.display = '';
    if (j5) j5.remove();
  }
  sumboxEl.classList.toggle('ok', s === q.price);
}
/* 作答区：gather/pair="给钱啦"主提交大按钮 / change·jiao=答案显示+（jiao）5 角键+"算好啦"确认 */
function renderAnswers(q) {
  answersEl.innerHTML = '';
  if (isGatherKind(q)) {
    const b = document.createElement('button');
    b.id = 'pay-btn';
    b.setAttribute('aria-label', '给钱啦，提交');
    b.innerHTML = ICONS.hand + '<span>给钱啦</span>';
    answersEl.appendChild(b);
    return;
  }
  const d = document.createElement('div');
  d.id = 'ans-display';
  d.innerHTML = '<b class="ph">?</b><span class="u">元</span>';
  answersEl.appendChild(d);
  if (q.kind === 'jiao') {                        // 5 角键仅带角章在场（toggle）
    const j = document.createElement('button');
    j.id = 'jiao-chip';
    j.setAttribute('aria-label', '加五角');
    j.textContent = '5角';
    answersEl.appendChild(j);
  }
  const c = document.createElement('button');
  c.id = 'confirm-btn';
  c.setAttribute('aria-label', '算好啦，确认');
  c.innerHTML = ICONS.ok + '<span>算好啦</span>';
  answersEl.appendChild(c);
  renderKeyState(q);
}
/* 键盘答案显示同步：元位数字（空='?' 占位）/ 5 角键 .on */
function renderKeyState(q) {
  const d = $id('ans-display');
  if (!d) return;
  const b = d.querySelector('b');
  if (q.digits === '') { b.textContent = '?'; b.classList.add('ph'); }
  else { b.textContent = q.digits; b.classList.remove('ph'); }
  const j = $id('jiao-chip');
  if (j) j.classList.toggle('on', !!q.jiao);
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
function speakQuiz(q) { if (q) sayQ(quizParts(q), qSpeech(q)); }
/* 开场顺序链（§0.5/§0.6）：hint（或教学交接 turn clip）→ 题面段，queue 单通道顺序播 */
function openingSpeak(turn) {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  KIDS.voice.queue([turn ? VOICE.turn.key : VOICE.hint.key].concat(quizParts(q)));
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  const gather = isGatherKind(q);
  const kb = !gather;                             // 键盘期：币托盘/篮收起，数字键盘在场
  coinTrayEl.style.display = kb ? 'none' : '';
  basketRowEl.style.display = kb ? 'none' : '';
  keypadEl.classList.toggle('show', kb);
  renderChip(q);
  if (gather) { renderCoins(q); renderBasket(q); }
  renderAnswers(q);
  renderStep();
  if (!VERIFY && !state.demo && !state.quiet) sayQ(quizParts(q), qSpeech(q));  /* 换题读题 sayR 级（不识字依赖听题） */
}

/* ================= 飞行动画：点币→克隆 fixed 飞向购物篮 → 到达后篮内币弹入 ================= */
function flyCoin(fromEl, q) {
  const to = basketEl.getBoundingClientRect();
  const a = fromEl.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'fly-coin';
  f.innerHTML = coinSvg(fmtYuan(q.coins[Number(fromEl.dataset.i)]), 56);
  f.style.left = (a.left + a.width / 2 - 28) + 'px';
  f.style.top = (a.top + a.height / 2 - 28) + 'px';
  document.body.appendChild(f);
  const dx = (to.left + to.width / 2) - (a.left + a.width / 2);
  const dy = (to.top + to.height / 2) - (a.top + a.height / 2);
  requestAnimationFrame(() => {
    f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.7) rotate(16deg)';
    f.style.opacity = '0';
  });
  setTimeout(() => f.remove(), 480 * SPEED);
}

/* ================= 凑钱主路径（gather/pair；真实点击 / MN 钩子 / autoSolve / 教学演示共用） ================= */
function uiTapCoin(i, demo) {
  /* locked 门拦真实输入；demo 通道仅 tutorialWatch 内部传 true（豁免 locked） */
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q || !isGatherKind(q)) return false;
  const r = engTapCoin(cur, i);
  if (r === null) return false;
  /* 放币不重置救援钟（审查 m4：探索构造非推进，与移除币/§0.7a 统一口径） */
  const el = coinEl(i);
  if (el) {
    el.classList.remove('breathe');
    el.classList.add('gone');
    flyCoin(el, q);
  }
  coinHi();
  renderSum(q);                                  // 合计实时同步更新（SPEC §1"篮内合计实时大字显示"）
  setTimeout(() => { if (cur && cur.quizzes[cur.step] === q && !q.solved) renderBasket(q); }, 460 * SPEED);
  if (state.tut === 'help') pointHelpNext();     // "帮"：跟着节奏指向下一步
  return r;                                      // 返回新合计（半元）
}
/* 移除篮内币（零惩罚探索；不重置救援钟——构造回退非推进）
   语义注：放币与移除都不计 miss（SPEC §1"零惩罚可调整"），miss 只来自 tapOK 提交错 */
function uiTapTray(j) {
  if (!cur || state.locked || state.won || state.demo) return false;
  const q = cur.quizzes[cur.step];
  if (!q || !isGatherKind(q)) return false;
  const r = engTapTray(cur, j);
  if (r === null) return false;
  takeLo();
  renderBasket(q);
  renderCoins(q);
  return r;
}
/* "给钱啦"提交主路径（gather/pair） */
async function uiTapOK(demo) {
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q || !isGatherKind(q)) return false;
  const run = cur;                               // 身份守卫：演出窗口内重玩会重建 cur
  const r = engOK(cur);
  if (r === null) return false;
  if (r === 'again') return 'again';             // 防御层（理论不可达：kind 已滤）
  const btn = payBtnEl();
  if (r === 'right' || r === 'done') {
    lastAct = Date.now();                        // 仅正确推进重置救援钟（§0.7a）
    if (state.tut === 'help') {                  // 教学"独"：首次答对 → 强化反馈放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    state.locked = true;
    sumboxEl.classList.add('ok');
    if (btn) { btn.classList.remove('breathe'); btn.style.background = '#8FBF7F'; btn.style.boxShadow = '0 6px 0 #6FA063'; }
    const tags = chipEl.querySelectorAll('#tag, #tagA, #tagB');
    tags.forEach(t => { t.style.borderStyle = 'solid'; t.style.borderColor = '#5E9455'; t.style.background = '#EAF4E4'; });
    sfx('coin');
    await wait(880 * SPEED);
    if (cur !== run) return r;                   // 演出窗内重玩已重建关卡：丢弃旧续体
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
  } else {                                       // 提交错：篮晃动零惩罚不灰化（SPEC §1）
    basketEl.classList.remove('wig'); void basketEl.offsetWidth; basketEl.classList.add('wig');
    sfx('fail');
    sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2);   /* flat<3 每错必播 / ≥3 节流+豁免恰一次（===2） */
    if (q.miss >= 2) applyRescueVisual(q);       /* 首错不 pulse：连错 2 次给正确视觉线索 */
    if (state.tut === 'help') pointHelpNext();
    state.locked = true;                         /* 晃动窗防重入：连点一次错只记一次 miss（审查 m3，照 column） */
    await wait(520 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
  }
  return r;
}

/* ================= 键盘主路径（change/jiao 找零；真实点击 / MN.tapKey / autoSolve 共用）
   按键=构造探索不计 miss（与放币同口径）；超位拒收=轻闪不计数 ---------- */
function uiKey(k, demo) {
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q || isGatherKind(q)) return false;
  const r = engKey(cur, k);
  if (r === null || r === 'again') return false;
  if (r.capped) {                                // 第 3 位数字拒收：显示区轻闪（§0.22 吞输入轻反馈）
    const d = $id('ans-display');
    if (d) { d.classList.remove('nudge'); void d.offsetWidth; d.classList.add('nudge'); }
    sfx('pop');
    return r;
  }
  keyLo();
  renderKeyState(q);
  if (state.tut === 'help') pointHelpNext();
  return r;                                      // {digits, jiao, capped}（拷贝语义）
}
/* "算好啦"确认主路径：唯一判定点——对=推进；错/空输入=miss（与空篮提交同口径） */
async function uiConfirm(demo) {
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q || isGatherKind(q)) return false;
  const run = cur;                               // 身份守卫
  const r = engConfirm(cur);
  if (r === null) return false;
  if (r === 'again') return 'again';             // gather 期确认：防御层早退零惩罚（§0.7）
  const disp = $id('ans-display');
  if (r === 'right' || r === 'done') {
    lastAct = Date.now();                        // 仅正确推进重置救援钟（§0.7a）
    if (state.tut === 'help') {
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    state.locked = true;
    if (disp) { disp.classList.remove('breathe', 'wig'); disp.classList.add('ok'); }
    const cb = confirmBtnEl();
    if (cb) { cb.classList.remove('breathe'); cb.style.background = '#8FBF7F'; cb.style.boxShadow = '0 6px 0 #6FA063'; }
    sfx('coin');
    await wait(880 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
  } else {                                       // 确认错：显示区晃动零惩罚可重点（不灰化 SPEC §1）
    if (disp) { disp.classList.remove('ok', 'breathe'); void disp.offsetWidth; disp.classList.add('wig'); }
    sfx('fail');
    sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2);
    if (q.miss >= 2) applyRescueVisual(q);       /* 首错不 pulse：连错 2 次给 清→位→角→确认 阶梯线索 */
    state.locked = true;                         /* 晃动窗防重入：连点一次错只记一次 miss（审查 m3） */
    await wait(520 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
  }
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关实算下一关难度章取 GEN 文案（家族 F，禁取模推进） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.money && sv.money.tutSeen);
  if (VERIFY) { openingSpeak(); return; }        /* verify 页恒走开场链（stub 记录供断言） */
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  openingSpeak();                                /* 开场任务语音+题面顺序链（§0.5） */
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向：gather/pair=可行下一步（rescueTarget：提交钮/可加币/应移除币）；
   键盘=清→位→角→确认 阶梯（rescueTarget 同源） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  if (isGatherKind(q)) {
    const t = rescueTarget(q);
    if (!t) return;
    if (t.act === 'ok') pointGhostAt(payBtnEl());
    else if (t.act === 'add') pointGhostAt(coinEl(t.i));
    else pointGhostAt(tcoinEl(t.j));
  } else {
    const t = rescueTarget(q);
    if (!t) return;
    if (t.act === 'ok') pointGhostAt(confirmBtnEl());
    else if (t.act === 'chip') pointGhostAt($id('jiao-chip'));
    else if (t.act === 'key') pointGhostAt(keyEl(t.k));

function greedySolve(q) {                        // 空篮贪心凑法（0.5/1/5/10 币制贪心恒成；教学/自测用）
  const order = q.coins.map((v, i) => ({ v: v, i: i })).sort((a, b) => b.v - a.v);
  let target = q.price;
  const seq = [];
  for (const c of order) {
    if (c.v <= target) { seq.push(c.i); target -= c.v; if (!target) break; }
  }
  return target === 0 ? seq : null;
}
