<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>坐标寻宝</title>
<style>
/* ================= 坐标寻宝 grid（batch13 r13 难度改造版）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、藏宝岛草格、暖橙主色、暖棕描边（不用大红警示）
   r13：8×8 纯网格（无行列号条——相对导航身体参照系不读绝对坐标）；
   格 ≥44px 双 viewport（r13 delta 定死 8×8 触控下限）；指令键=主答案 ≥96（前进/左转/右转/
   拿宝箱），退一步 ≥64；exec 期指令条=当前命令高亮（icon+文字+前进格点进度）；
   朝向可视化=兔子朝向箭头旋转（.hwrap）+前方格虚线高亮（.ahead）。
   竖屏双通道（r9 M-A1/r11 M-1/r12 M3/r13 同型定版）：@media 真竖屏 + body.port 类通道
   逐条等值两段同步；#play-row flex-direction=column = portStyle 判别锚（verify 断言）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 题面行（指令条/宝箱序/步数；核心指令语音承载 §0.19） ---------- */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  min-height:72px;padding:4px 8px}
#prompt-chip{display:flex;align-items:center;gap:12px;padding:6px 20px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;max-width:96%;flex-wrap:wrap;
  justify-content:center}
#prompt-chip.done{background:#F3F0DC}
/* exec 指令条：命令 chip 序列（当前命令高亮+前进格点进度） */
.schip{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:14px;
  border:2.5px solid #E5D5BC;background:#FBF6EC;opacity:.62;transition:all .2s}
.schip svg{width:30px;height:30px}
.schip .st{font-size:clamp(17px,2.4vw,23px);font-weight:800;color:#6B5D4A;line-height:1.15;white-space:nowrap}
.schip.cur{opacity:1;border-color:#E8975A;background:#FFF3D9;box-shadow:0 0 14px rgba(232,151,90,.45);
  transform:scale(1.06)}
.schip.went{opacity:.4}
.schip .fdots{display:flex;gap:4px;margin-left:2px}
.schip .fdots i{width:9px;height:9px;border-radius:50%;border:2px solid #C99A4E;background:#FFF}
.schip .fdots i.on{background:#E8973A;border-color:#B5763B}
/* plan/maze 宝箱序徽章（下一个呼吸高亮） */
.orderbox{display:flex;align-items:center;gap:8px}
.orderbox .ob{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:13px;
  border:2.5px solid #E5D5BC;background:#FBF6EC;font-size:clamp(17px,2.4vw,23px);font-weight:800;
  color:#6B5D4A;transition:all .2s}
.orderbox .ob.next{border-color:#E8975A;background:#FFF3D9;color:#4A3B2E;
  animation:ob-next 1.5s ease-in-out infinite}
.orderbox .ob.got{border-color:#6FA363;background:#8FBF7F;color:#fff;opacity:.85}
@keyframes ob-next{0%,100%{box-shadow:0 0 4px rgba(232,151,90,.35)}50%{box-shadow:0 0 16px rgba(232,151,90,.85)}}
.chipmini{width:40px;height:40px;flex:0 0 40px}
.qtext{font-size:clamp(18px,2.4vw,26px);font-weight:800;color:#4A3B2E;line-height:1.25}
/* 步数表（最少步意识 r13 delta③：错步可退不罚但步数常显） */
#stepmeter{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:16px;
  background:#FFF9EE;border:2.5px solid #D8C9B4;font-size:clamp(15px,2vw,19px);font-weight:800;color:#6B5D4A}
#stepmeter b{color:#E8873A;font-size:clamp(18px,2.4vw,23px);font-variant-numeric:tabular-nums}

/* ---------- 舞台：网格板与指令键区 ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:6px 12px;overflow:hidden}
#play-row{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:22px}
#board-wrap{position:relative;border-radius:22px;background:#EFE3CD;border:3px solid #D8C9B4;
  box-shadow:inset 0 0 0 5px rgba(255,249,238,.55),0 5px 0 #D8C9B4;padding:12px}
#board{display:grid;
  grid-template-columns:repeat(8,var(--cs,64px));
  grid-template-rows:repeat(8,var(--cs,64px));
  gap:var(--gap,6px)}

/* 格子：藏宝岛草格（div——非答案目标，点击=探索轻反馈） */
.cell{position:relative;border-radius:12px;border:3px solid #C9B98F;
  background:linear-gradient(180deg,#F2E8C9 0%,#EADBB0 82%,#E2D0A0 100%);
  box-shadow:inset 0 -4px 0 rgba(184,161,107,.35);display:block}
/* 宝箱（到访目标）：开启=盖子掀起+金光；序号徽章 .bnum */
.chest{position:absolute;inset:6%;pointer-events:none}
.chest .lid{transform-box:fill-box;transform-origin:14% 100%;transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.chest .glow{opacity:0;transition:opacity .3s}
.cell.open .chest .lid{transform:rotate(-34deg)}
.cell.open .chest .glow{opacity:1;animation:chest-glow 1.1s ease-in-out infinite alternate}
.cell.open{animation:cell-win .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes chest-glow{from{opacity:.55}to{opacity:1}}
@keyframes cell-win{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
.bnum{position:absolute;top:5%;right:8%;width:34%;height:34%;max-width:30px;max-height:30px;
  border-radius:50%;background:#E8873A;border:2.5px solid #4A3B2E;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:clamp(12px,calc(var(--cs,64px)*.34),21px);pointer-events:none}
.cell.open .bnum{background:#6FA363}
/* 下一个目标宝箱：呼吸光圈（答案视觉线索/救援 breathe 复用） */
.cell.nextchest{border-color:#E8975A;
  box-shadow:inset 0 -4px 0 rgba(184,161,107,.35),0 0 18px rgba(232,151,90,.55);
  animation:shine-b 1.6s ease-in-out infinite}
@keyframes shine-b{0%,100%{box-shadow:inset 0 -4px 0 rgba(184,161,107,.35),0 0 10px rgba(232,151,90,.4)}
  50%{box-shadow:inset 0 -4px 0 rgba(184,161,107,.35),0 0 24px rgba(232,151,90,.85)}}
/* 石块格（障碍/死路墙） */
.stone{position:absolute;inset:5%;pointer-events:none}
.cell.walled{background:linear-gradient(180deg,#E4E9F0 0%,#CDD6E2 80%,#BDC9D9 100%);border-color:#9FB0C4}
/* 兔子所站格淡圈 + 前方格虚线（朝向可视化之一） */
.cell.here{box-shadow:inset 0 -4px 0 rgba(184,161,107,.35),inset 0 0 0 4px rgba(255,249,238,.75)}
.cell.ahead{border-style:dashed;border-color:#E8975A}
/* 错序/探索轻晃（零惩罚） */
.cell.shake{animation:cell-shake .45s ease}
@keyframes cell-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* 救援 breathe：循环光晕在屏（§0.21 静音可感知） */
.cell.breathe{animation:cell-breathe 1.2s ease-in-out infinite}
@keyframes cell-breathe{0%,100%{box-shadow:0 0 4px rgba(232,151,90,.35),0 3px 0 #D8C9B4}
  50%{box-shadow:0 0 22px rgba(232,151,90,.95),0 3px 0 #D8C9B4}}
/* 连错 2 次高亮答案线索：两遍脉冲（首错不 pulse §0.7） */
.cell.pulse{animation:cell-pulse 1s ease 2}
@keyframes cell-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95))}}

/* 小兔子（站格上；JS 依格定位）：朝向可视化=箭头环 .hwrap 旋转（N0/E90/S180/W270） */
#rabbit{position:absolute;left:0;top:0;width:76px;z-index:5;pointer-events:none;
  transition:left .32s cubic-bezier(.35,1.3,.55,1),top .32s cubic-bezier(.35,1.3,.55,1)}
#rabbit .body{width:100%;height:auto}
#rabbit .hwrap{position:absolute;inset:0;transition:transform .3s cubic-bezier(.35,1.3,.55,1);
  pointer-events:none}
#rabbit .harrow{position:absolute;left:50%;top:-14px;width:0;height:0;transform:translateX(-50%);
  border-left:11px solid transparent;border-right:11px solid transparent;
  border-bottom:17px solid #E8873A;filter:drop-shadow(0 2px 1px rgba(74,59,46,.4))}
#rabbit.hoppy .body{animation:rab-hop .32s ease}
@keyframes rab-hop{0%,100%{transform:scale(1)}45%{transform:scale(1.14,.88)}}

/* ---------- 指令键区：主答案 4 键 ≥96 + 退一步 ≥64 ---------- */
#pad-area{display:grid;grid-template-columns:repeat(3,var(--dir,96px));grid-template-rows:repeat(2,var(--dir,96px));
  gap:10px}
.cmdb{border-radius:22px;border:3.5px solid #4A3B2E;background:#FFF3D9;
  box-shadow:0 5px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;transition:transform .12s}
.cmdb:active{transform:translateY(3px)}
.cmdb svg{width:52%;height:52%}
.cmdb span{font-size:clamp(16px,2vh,21px);font-weight:800;color:#4A3B2E}
.cmdb[data-c="L"]{grid-area:1/1}.cmdb[data-c="fwd"]{grid-area:1/2}.cmdb[data-c="R"]{grid-area:1/3}
.cmdb[data-c="T"]{grid-area:2/1/3/3;background:#FFE9C4}
#btn-undo{grid-area:2/3;width:100%;height:64px;align-self:center;border-radius:18px;
  border:3px solid #8A7B6C;background:#FBF6EC;box-shadow:0 4px 0 #D8C9B4;
  display:flex;align-items:center;justify-content:center;gap:4px;transition:transform .12s}
#btn-undo:active{transform:translateY(3px)}
#btn-undo svg{width:34px;height:34px}
#btn-undo span{font-size:clamp(14px,1.9vh,18px);font-weight:800;color:#6B5D4A}
.cmdb.wig,#btn-undo.wig{animation:cell-shake .45s ease}
/* 指令键 breathe（救援视觉线索之一：exec 当前命令键）/ pulse（连错 2 次） */
.cmdb.breathe{animation:cell-breathe 1.2s ease-in-out infinite}
.cmdb.pulse{animation:cell-pulse 1s ease 2}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch7-13 家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持 800×1180）：指令键区移到网格下方；题面字号收窄 */
@media (orientation:portrait){
  #play-row{flex-direction:column;gap:12px}
  #prompt-chip .qtext{font-size:clamp(17px,2.4vw,22px)}
  #stepmeter{padding:5px 11px}
}
/* body.port 类通道（@media 逐条等值副本——r13 M3 竖屏三件套；verify simView 断言） */
body.port #play-row{flex-direction:column;gap:12px}
body.port #prompt-chip .qtext{font-size:clamp(17px,2.4vw,22px)}
body.port #stepmeter{padding:5px 11px}
</style>
</head>
<body>
<div id="game" aria-label="坐标寻宝">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="prompt">
    <div id="prompt-chip" role="heading" aria-label="题目"></div>
    <div id="stepmeter" aria-label="步数"></div>
  </div>
  <div id="stage" aria-label="藏宝岛网格">
    <div id="play-row">
      <div id="board-wrap" aria-label="八乘八网格">
        <div id="board" aria-label="导航网格"></div>
        <div id="rabbit" aria-hidden="true"></div>
      </div>
      <div id="pad-area" aria-label="指令键">
        <button class="cmdb" data-c="L" aria-label="向左转"></button>
        <button class="cmdb" data-c="fwd" aria-label="前进一格"></button>
        <button class="cmdb" data-c="R" aria-label="向右转"></button>
        <button class="cmdb" data-c="T" aria-label="拿宝箱"></button>
        <button id="btn-undo" aria-label="退一步"></button>
      </div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

function engBfs(from, to, walls) {

    /* 回溯绝对朝向步序列（起点→宝箱） */
    const dirs = [];

function engDeadEnds(q) {
  const wl = new Set(q.walls.map(w => wallKey(w.r, w.c)));
  const chestKeys = new Set(q.chests.map(ch => wallKey(ch.r, ch.c)));
  const out = [];
  for (let r = 1; r <= GRID_N; r++) for (let c = 1; c <= GRID_N; c++) {
    const k = wallKey(r, c);
    if (wl.has(k) || (r === q.fr && c === q.fc) || chestKeys.has(k)) continue;
    let deg = 0;
    for (const h of HEADS) {

      if (inGrid(nr, nc) && !wl.has(wallKey(nr, nc))) deg++;

  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // 生成关随机章参数（首抽保确定性）
  const quizzes = [];

  for (let qi = 0; qi < CH_LEN; qi++) {
    let q;
    if (dch === 1) q = genExec(rnd, last, 2, 2, 0, CAP_EXEC1, qi === 0);
    else if (dch === 2) q = qi === 0 ? genExec(rnd, last, 1, 1, 0, CAP_EXEC1, true)
                                     : genExec(rnd, last, 2, 3, ri(rnd, 0, 2), CAP_EXEC2, false);
    else if (dch === 3) q = qi === 0 ? genExec(rnd, last, 1, 2, 0, CAP_EXEC1, false)
                                     : genPlan(rnd, last, 2, 2, 4, false);
    else q = qi === 0 ? genPlan(rnd, last, 1, 2, 4, false)
                      : genPlan(rnd, last, 3, 6, 10, true);
    last = [wallKey(q.fr, q.fc), wallKey(q.chests[0].r, q.chests[0].c)];

/* ---------- 指令引擎（pad 主路径）：engCmd(L, c) —— c='fwd'|'L'|'R'|'T'

     fwd 命令期撞界/墙='bump'（不移动零惩罚不计 miss，指令不推进——§0.7a 物理探索）。
   plan/maze 章（自由规划）：任意合法动作放行；T 站 next 箱='take'（终箱='goal'/'done'），
     站未来箱='order'（miss+方向级反馈不罚死），非箱格='nope'（探索不罚）。
   返回：'step' 前进一格 / 'turn' 转向 / 'take' 到访非终箱 / 'goal' 终箱收集（本题完成）
     / 'done' 末题终箱（本关通关）/ 'bump' / 'wrong' / 'order' / 'nope'

function engCmd(L, c) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  if (c !== 'fwd' && c !== 'L' && c !== 'R' && c !== 'T') return null;
  const q = L.quizzes[L.step];
  const isExec = q.kind === 'exec1' || q.kind === 'exec2';
  if (isExec) {
    const act = q.seq[q._si];
    if (!act) return null;
    /* 指令错配判定：非当前命令类型的按键=wrong（miss 晃动零惩罚可重点） */
    if ((act.t === 'fwd' && c !== 'fwd') || (act.t === 'L' && c !== 'L') ||
        (act.t === 'R' && c !== 'R') || (act.t === 'T' && c !== 'T')) {
      q._miss++;
      L.retries++;
      return 'wrong';
    }
    if (c === 'fwd') {                                     /* fwd 命令逐格执行 */
      const d = DELTA_H[q._h], nr = q._pr + d[0], nc = q._pc + d[1];
      if (!inGrid(nr, nc) || q.walls.some(w => w.r === nr && w.c === nc)) {
        L.retries++;                                       /* bump=探索：不计 miss（§0.7a） */
        return 'bump';
      }
      q._pr = nr; q._pc = nc; q._steps++;
      q._stack.push({ k: 'fwd' });
      q._fn--;
      if (q._fn <= 0) { q._si++; q._fn = q.seq[q._si] && q.seq[q._si].t === 'fwd' ? q.seq[q._si].n : 0; }
      return 'step';
    }
    if (c === 'T') {                                       /* 到访=末命令；指令全对执行必达箱 */
      if (q._pr !== q.chests[q._col].r || q._pc !== q.chests[q._col].c) return null;  /* 防御层：指令带不变式破缺 */
      q._col++;
      q._stack = [];                                       /* 检查点：撤销栈清空 */
      L.step++;
      if (L.step >= L.quizzes.length) L.done = true;
      return L.done ? 'done' : 'goal';
    }
    q._h = c === 'L' ? TURN_L[q._h] : TURN_R[q._h];        /* 转向：改朝向不动步 */
    q._stack.push({ k: c });
    q._si++;
    q._fn = q.seq[q._si] && q.seq[q._si].t === 'fwd' ? q.seq[q._si].n : 0;
    return 'turn';

  /* ---- plan/maze 自由规划 ---- */
  if (c === 'fwd') {

    if (!inGrid(nr, nc) || q.walls.some(w => w.r === nr && w.c === nc)) {

      return 'bump';

    q._pr = nr; q._pc = nc; q._steps++;

    return 'step';

    q._h = c === 'L' ? TURN_L[q._h] : TURN_R[q._h];

  /* T：站 next 箱=收集；站未来箱=错序 miss 方向级反馈；非箱格=探索不罚 */
  const nx = q.chests[q._col];

    q._col++;
    q._stack = [];

      L.step++;
      if (L.step >= L.quizzes.length) L.done = true;
      return L.done ? 'done' : 'goal';
    }
    return 'take';
  }
  const fut = q.chests.findIndex((ch, i) => i > q._col && ch.r === q._pr && ch.c === q._pc);
  if (fut >= 0) {
    q._miss++;                                             /* 错序=主动认领错序号：miss 不罚死 */
    L.retries++;

  }

/* ---------- 撤销引擎：engUndo(L) —— LIFO 回退上一原子动作
   fwd→回一格（朝向不变；步数不减=错步留痕「最少步意识」）；L/R→反转朝向；
   exec 同步回卷指令条（_si/_fn 与动作带一致）；T 已清栈=空栈 null。

  if (!st) return null;
  if (st.k === 'fwd') {
    const d = DELTA_H[q._h];                               /* 栈上无未回退转向→朝向即当时朝向 */
    q._pr -= d[0]; q._pc -= d[1];
    if (q.kind === 'exec1' || q.kind === 'exec2') {        /* 指令条回卷 */
      if (q._fn > 0) q._fn++;

  if (!inGrid(q.fr, q.fc) || q.h0 == null || HEADS.indexOf(q.h0) < 0) return 'range';
  if (q.walls.some(w => !inGrid(w.r, w.c))) return 'wallRange';
  const wallSeen = new Set();
  if (!q.walls.every(w => { const k = wallKey(w.r, w.c); if (wallSeen.has(k)) return false; wallSeen.add(k); return true; })) return 'wallDup';
  const chestCount = q.kind === 'exec1' || q.kind === 'exec2' ? 1 : (q.kind === 'plan' ? -1 : 3);
  if (q.kind === 'plan' && (q.chests.length < 1 || q.chests.length > 2)) return 'chestCount';
  if (chestCount > 0 && q.chests.length !== chestCount) return 'chestCount';
  if (q.chests.some(ch => !inGrid(ch.r, ch.c))) return 'chestRange';
  if (q.chests.some(ch => ch.r === q.fr && ch.c === q.fc)) return 'chestOnStart';
  if (q.chests.some((ch, i) => q.chests.some((ch2, j) => i < j &&
      Math.abs(ch.r - ch2.r) + Math.abs(ch.c - ch2.c) < 2))) return 'chestAdj';
  if (q.walls.some(w => (w.r === q.fr && w.c === q.fc) ||
      q.chests.some(ch => ch.r === w.r && ch.c === w.c))) return 'wallOnEnd';
  const nw = q.walls.length;
  if (q.kind === 'exec1' && nw !== 0) return 'wallN';
  if (q.kind === 'exec2' && (nw < 0 || nw > 2)) return 'wallN';
  if (q.kind === 'plan' && (nw < 2 || nw > 4)) return 'wallN';
  if (q.kind === 'maze' && (nw < 6 || nw > 10)) return 'wallN';
  if (q._pr !== q.fr || q._pc !== q.fc || q._h !== q.h0 || q._col !== 0 ||
      q._steps !== 0 || q._miss !== 0 || (q._stack && q._stack.length)) return 'initDirty';
  const opt = engOptFwd(q);
  if (opt < 0) return 'sealed';                            /* 依序分段全可达（SPEC §3 r13） */
  if (opt !== q.opt) return 'optMismatch';
  if (q.kind === 'exec1' || q.kind === 'exec2') {
    const cap = q.kind === 'exec1' ? CAP_EXEC1 : CAP_EXEC2;
    const sentence = sentenceOf({ seq: q.seq });
    if (sentence.length > cap) return 'sentenceCap';
    const mv = q.seq.filter(cm => cm.t !== 'T').length;
    if (q.kind === 'exec1' && (mv < 1 || mv > 2)) return 'exec1Mv';
    if (q.kind === 'exec2' && (mv < 1 || mv > 3)) return 'exec2Mv';
    if (q.seq[q.seq.length - 1].t !== 'T') return 'execTailT';
    if (q.seq.some(cm => cm.t === 'fwd' && (cm.n < 1 || cm.n > 3))) return 'fwdN';
    if (q.seq.some((cm, i) => cm.t === 'T' && i !== q.seq.length - 1)) return 'midT';

    if (!end || end.r !== q.chests[0].r || end.c !== q.chests[0].c) return 'seqMismatch';
    if (q._fn !== (q.seq[0].t === 'fwd' ? q.seq[0].n : 0) || q._si !== 0) return 'siDirty';
    return null;

  if (!q.seq || !q.seq.length) return 'refMissing';

    const a = i === 0 ? { r: q.fr, c: q.fc } : q.chests[i - 1];

/* 音效（Web Audio 合成）：前进=马林巴双音 / 撞墙=低哑音 / 转向=上行双音 / 到访=轻叮 / 终箱=叮咚 */

/* ================= 布局尺寸（--cs 格 8×8 / --dir 指令键；双 viewport §0.9+r13 delta）
   8×8 域扩后格下限 44px 双向（r13 delta① 定死触控下限）；横屏指令键区右侧、竖屏下方。
   主答案键=前进/左转/右转/拿宝箱 ≥96；退一步 ≥64。 ---------- */
function layoutBoard() {
  /* 竖屏判别=真实视口 || body.port 类通道（verify simView 强制竖屏时 JS 侧同步走竖屏分支——
     否则格尺寸按横屏余量计算而 CSS 已纵排，板+键区溢出舞台被裁） */
  const portrait = document.body.classList.contains('port') || window.innerHeight > window.innerWidth;
  const gap = 6, wrapPad = 30;                  // board padding 12*2 + border 3*2*2
  const padSide = 3 * 96 + 2 * 10 + 22;         // 指令键区宽 + play-row gap（横屏预留）
  const padUnder = 2 * 96 + 1 * 10 + 12;        // 指令键区高（两行；竖屏预留）
  const availW = portrait ? stageEl.clientWidth : stageEl.clientWidth - padSide;
  const availH = portrait ? stageEl.clientHeight - padUnder : stageEl.clientHeight;
  let cs = Math.floor(Math.min((availH - GRID_N * gap - wrapPad) / GRID_N,
                               (availW - GRID_N * gap - wrapPad) / GRID_N));
  cs = Math.max(44, Math.min(cs, 96));          // r13：8×8 格 ≥44px 触控下限（双 viewport）
  document.documentElement.style.setProperty('--cs', cs + 'px');
  document.documentElement.style.setProperty('--gap', gap + 'px');
  document.documentElement.style.setProperty('--dir', '96px');
  if (cur) placeRabbit(false);
}
window.addEventListener('resize', () => { if (cur) { layoutBoard(); } });

/* ================= 题面语音（读题 sayR 级不受 flat 门）
   exec = queue 拼接全 clip（逐命令 cmdClips：向前+数词+格 / 向左转 / 向右转 / 拿到宝箱）；
   plan/maze = play(gri_i_order)。重入先清接力定时器（防旧题残留切断新题面） */
function speakQuiz(q) {
  if (!q) return;
  if (qTimer) { clearTimeout(qTimer); qTimer = null; }
  if (isExecKind(q)) {
    const parts = [];
    q.seq.forEach(cm => { cmdClips(cm).forEach(k => parts.push(k)); });
    KIDS.voice.queue(parts);
  } else KIDS.voice.play('gri_i_order', PLAN_SAY);
}

/* ================= 开场顺序链（§0.5/§0.6）：hint → OPEN_RELAY 3000ms 接力题面
   （接力窗 ≥ gri_i_hint 2640+300 防尾截——r13 实长表；禁双通道叠音） */
function openingSpeak() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  if (qTimer) { clearTimeout(qTimer); qTimer = null; }
  sayR(VOICE.hint.key, VOICE.hint.text);
  qTimer = setTimeout(() => {
    qTimer = null;
    if (cur && !cur.done) speakQuiz(cur.quizzes[cur.step]);
  }, OPEN_RELAY_MS);
}

/* ================= 渲染 ================= */
function renderChip(q) {                        // 题面卡：指令条/宝箱序（文字=语音的装饰性冗余 §0.19）
  chipEl.classList.remove('done');
  if (isExecKind(q)) {
    let html = '<span class="chipmini">' + chestSvg(false) + '</span>';
    q.seq.forEach((cm, i) => {
      const cls = i < q._si ? 'schip went' : (i === q._si ? 'schip cur' : 'schip');
      let dots = '';
      if (cm.t === 'fwd') {
        const done = i < q._si ? cm.n : (i === q._si ? cm.n - q._fn : 0);
        dots = '<span class="fdots">' +
          Array.from({ length: cm.n }, (_, k) => '<i class="' + (k < done ? 'on' : '') + '"></i>').join('') +
          '</span>';
      }
      html += '<span class="' + cls + '">' + ICONS.cmd[cm.t === 'fwd' ? 'fwd' : cm.t] +
        '<span class="st">' + cmdText(cm) + '</span>' + dots + '</span>';
    });
    chipEl.innerHTML = html;
  } else {
    let badges = '';
    q.chests.forEach((ch, i) => {
      badges += '<span class="ob ' + (i < q._col ? 'got' : (i === q._col ? 'next' : '')) + '">' +
        (i + 1) + ' 号</span>';
    });
    chipEl.innerHTML = '<span class="chipmini">' + chestSvg(false) + '</span>' +
      '<span class="orderbox"><span class="qtext">' + PLAN_SAY + '</span>' + badges + '</span>';
  }
  chipEl.setAttribute('aria-label', quizSay(q) + '，点我再听一遍');
}
function renderMeter(q) {                       // 步数表：错步可退不罚但步数常显（r13 delta③）
  meterEl.innerHTML = '已走 <b>' + q._steps + '</b> 步 · 最短 <b>' + q.opt + '</b> 步';
}
/* 8×8 网格：64 格 div（非答案目标——点击=探索轻反馈）+石块+宝箱（序号徽章/下一个呼吸） */
function renderBoard(q) {
  boardEl.className = '';
  boardEl.innerHTML = '';
  for (let r = 1; r <= GRID_N; r++) for (let c = 1; c <= GRID_N; c++) {
    const b = document.createElement('div');
    b.className = 'cell'; b.dataset.r = r; b.dataset.c = c;
    b.setAttribute('aria-label', '第' + r + '行第' + c + '列');
    const ci = q.chests.findIndex(ch => ch.r === r && ch.c === c);
    if (ci >= 0) {
      b.innerHTML = '<span class="chest">' + chestSvg(false) + '</span>' +
        '<span class="bnum">' + (ci + 1) + '</span>';
      if (ci === q._col) b.classList.add('nextchest');
      if (ci < q._col) b.classList.add('open');
    }
    if (q.walls.some(w => w.r === r && w.c === c))
      b.innerHTML = '<span class="stone">' + stoneSvg() + '</span>', b.classList.add('walled');
    boardEl.appendChild(b);
  }
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderChip(q);
  renderMeter(q);
  renderBoard(q);
  renderStep();
  layoutBoard();
  updateRabbit(false);
  if (!VERIFY && !state.demo && !state.quiet) speakQuiz(q);   /* 开场/换题读题；quiet=开场/教学交接走顺序链 */
}
function renderStep() {                         // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
/* 小兔子站当前格 + 朝向箭头旋转 + 前方格虚线（朝向可视化 r13 delta②） */
function placeRabbit(anim) {
  const q = cur && cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)];
  if (!q) { rabbitEl.style.display = 'none'; return; }
  rabbitEl.style.display = 'block';
  const el = cellEl(q._pr, q._pc);
  if (!el) return;
  const w = Math.max(50, Math.round(el.offsetWidth * 0.7));
  rabbitEl.style.width = w + 'px';
  rabbitEl.style.left = Math.round(boardEl.offsetLeft + el.offsetLeft + el.offsetWidth / 2 - w / 2) + 'px';
  rabbitEl.style.top = Math.round(boardEl.offsetTop + el.offsetTop + el.offsetHeight * 0.42 - w * 0.44) + 'px';
  if (anim) { rabbitEl.classList.remove('hoppy'); void rabbitEl.offsetWidth; rabbitEl.classList.add('hoppy'); }
}
function updateRabbit(anim) {
  const q = cur && cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)];
  if (!q) return;
  placeRabbit(anim);
  const hw = rabbitEl.querySelector('.hwrap');
  if (hw) hw.style.transform = 'rotate(' + HEAD_DEG[q._h] + 'deg)';       /* 箭头环旋转=朝向 */
  boardEl.querySelectorAll('.cell.here').forEach(e => e.classList.remove('here'));
  boardEl.querySelectorAll('.cell.ahead').forEach(e => e.classList.remove('ahead'));
  const he = cellEl(q._pr, q._pc);
  if (he) he.classList.add('here');
  const d = DELTA_H[q._h], ar = q._pr + d[0], ac = q._pc + d[1];
  if (inGrid(ar, ac) && !q.walls.some(w => w.r === ar && w.c === ac)) {
    const ae = cellEl(ar, ac);
    if (ae) ae.classList.add('ahead');                                    /* 前方格虚线（撞墙预览） */
  }
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向：当前题的答案线索（exec=当前命令键；plan=下一个宝箱格/已站箱=拿宝箱键） */
function helpTargetEl(q) {
  if (isExecKind(q)) {
    const act = q.seq[q._si];
    return act ? cmdEl(act.t === 'fwd' ? 'fwd' : act.t) : null;
  }
  const nx = q.chests[q._col];
  if (nx && q._pr === nx.r && q._pc === nx.c) return cmdEl('T');
  return nx ? cellEl(nx.r, nx.c) : null;
}
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  pointGhostAt(helpTargetEl(q));
}
/* 救援视觉线索元素（§0.21 答案 breathe；与 helpTargetEl 同一指向逻辑） */
function rescueTargetEl(q) { return helpTargetEl(q); }
/* 清全部 breathe/pulse 类（换题/救援重入） */
function clearHints() {
  boardEl.querySelectorAll('.breathe,.pulse').forEach(e => e.classList.remove('breathe', 'pulse'));
  padEl.querySelectorAll('.breathe,.pulse').forEach(e => e.classList.remove('breathe', 'pulse'));
}

/* ================= 答对推进（终箱收集 → 开箱演出 → 换题/通关） ================= */
async function advance(cellR, cellC, r) {
  const run = cur;
  state.locked = true;
  const el = cellEl(cellR, cellC);
  if (el) { el.classList.remove('nextchest'); el.classList.add('open'); }
  chipEl.classList.add('done');
  chimeGoal();
  sfx('coin');
  await wait(950 * SPEED);
  if (cur !== run) return r;                    /* 演出窗内重玩已重建关卡：丢弃旧续体 */
  state.locked = false;
  clearHints();
  if (cur.done) winFlow();
  else renderQuiz();
  return r;
}

/* ================= 指令键主路径（真实点击 / GR 钩子 / autoSolve 共用） ================= */
async function uiCmd(c, demo) {
  /* locked 门拦真实输入；demo 通道仅 tutorialWatch 内部传 true（豁免 locked）。
     吞输入轻反馈（§0.22）：真实点击被 locked/demo/won 吞时 sfx('pop')，返回值/状态不变 */
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) {
    sfx('pop');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const run = cur;
  const rr = engCmd(cur, c);
  if (rr === null) { sfx('pop'); return false; }
  const bel = cmdEl(c);
  if (rr === 'wrong') {                         /* exec 指令错配：晃动零惩罚（不灰化可重点） */
    if (bel) { bel.classList.remove('wig'); void bel.offsetWidth; bel.classList.add('wig'); }
    sayW(VOICE.wrong.key, VOICE.wrong.text, q._miss === 2);
    if (q._miss >= 2) {                         /* 首错不 pulse：连错 2 次才高亮当前命令键（§0.7） */
      const ok = helpTargetEl(q);
      if (ok) { ok.classList.remove('pulse'); void ok.offsetWidth; ok.classList.add('pulse'); }
    }
    state.locked = true;                        /* 晃动窗防重入：连点一次错只记一次 miss（审查 m3） */
    await wait(480 * SPEED);
    if (cur !== run) return rr;
    state.locked = false;
    return rr;
  }
  if (rr === 'order') {                         /* 错序 T：方向级反馈不罚死（r13 delta③；miss 已计） */
    const here = cellEl(q._pr, q._pc);
    if (here) { here.classList.remove('shake'); void here.offsetWidth; here.classList.add('shake'); }
    KIDS.voice.queue(['gri_i_next', numKey(q._col + 1), 'gri_i_box']);   /* 先拿 N 号宝箱（单通道禁与 gri_wrong 叠播） */
    if (q._miss >= 2) {
      const nx = q.chests[q._col] && cellEl(q.chests[q._col].r, q.chests[q._col].c);
      if (nx) { nx.classList.remove('pulse'); void nx.offsetWidth; nx.classList.add('pulse'); }
    }
    state.locked = true;
    await wait(480 * SPEED);
    if (cur !== run) return rr;
    state.locked = false;
    return rr;
  }
  if (rr === 'nope') {                          /* 非宝箱格 T=探索：轻晃不罚（不锁不 miss） */
    if (bel) { bel.classList.remove('wig'); void bel.offsetWidth; bel.classList.add('wig'); }
    sfx('pop');
    return rr;
  }
  if (rr === 'bump') {                          /* 出界/撞墙：原地轻晃不移动（探索零惩罚不计 miss，§0.7a） */
    if (bel) { bel.classList.remove('wig'); void bel.offsetWidth; bel.classList.add('wig'); }
    rabbitEl.classList.remove('hoppy'); void rabbitEl.offsetWidth; rabbitEl.classList.add('hoppy');
    bumpLo();
    sfx('fail');
    await wait(480 * SPEED);                    /* 错点不重置救援钟（§0.7a）；卡住由 14s 救援指方向 */
    return rr;
  }
  /* 合法动作（step/turn/take/goal/done）：重置救援钟（推进的物理形态 §0.7a） */
  lastAct = Date.now();
  if (state.tut === 'help') {                   /* 教学"独"：首次答对 → 强化反馈放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  if (rr === 'step') {
    updateRabbit(true);
    hopHi();
    sayR(DIR_KEY(HEAD_WORD[q._h]), DIR_NAME[HEAD_WORD[q._h]]);   /* 播绝对方向词（相对→绝对桥接） */
    if (isExecKind(q)) renderChip(q);
    renderMeter(q);
    return rr;
  }
  if (rr === 'turn') {
    updateRabbit(false);
    turnUp();
    if (isExecKind(q)) renderChip(q);
    return rr;
  }
  if (rr === 'take') {                          /* plan 中途到访：开箱定格+下一箱呼吸高亮 */
    const got = q.chests[q._col - 1];
    const el = got && cellEl(got.r, got.c);
    if (el) { el.classList.remove('nextchest'); el.classList.add('open'); }
    const nx = q.chests[q._col] && cellEl(q.chests[q._col].r, q.chests[q._col].c);
    if (nx) nx.classList.add('nextchest');
    stageDing();
    renderChip(q);
    return rr;
  }
  /* 终箱收集（goal/done）：开箱演出 → 推进 */
  return await advance(q.chests[q.chests.length - 1].r, q.chests[q.chests.length - 1].c, rr);
}

/* ================= 撤销主路径（错步可回退不罚；步数不减=r13 delta③） ================= */
async function uiUndo(demo) {
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) {
    sfx('pop');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const rr = engUndo(cur);
  if (rr === null) {                            /* 空栈/终态：轻反馈不罚 */
    undoBtn.classList.remove('wig'); void undoBtn.offsetWidth; undoBtn.classList.add('wig');
    sfx('pop');
    return false;
  }
  updateRabbit(true);
  turnUp();
  if (isExecKind(q)) renderChip(q);
  renderMeter(q);
  return rr;                                    /* 撤销不重置救援钟（回退非推进） */
}

/* ================= 探索点击轻提示（§0.16：10s 节流，不重置救援钟） ================= */
function exploreHint() {
  if (VERIFY || !cur || state.locked || state.won || state.demo) return;
  if (Date.now() - lastBlankHint > 10000) {
    lastBlankHint = Date.now();
    sayR(VOICE.hint.key, VOICE.hint.text);
  }
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关预告实算下一关难度章（家族 F——禁 (ci+1)%4） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  if (qTimer) { clearTimeout(qTimer); qTimer = null; }
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);               // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  if (qTimer) { clearTimeout(qTimer); qTimer = null; }
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.grid && sv.grid.tutSeen);
  if (VERIFY) { openingSpeak(); return; }        /* verify 页恒走开场链（stub 记录供断言） */
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;

   ⑪ duration（r13 门禁）：40 关 modeled ≥40000+独立副本逐关对账+每步 DECIDE≥voiceWin
   ⑫ 源码断言：script[2]（data+engine+main）字面（estMs 家族/DECIDE_MS/GRID_N=8/

   结果写 #verify-result + document.title='VERIFY PASS n/n' */
/* ---- 独立复算常量（文件顶层：runVerify 内单元与底部驱动辅助共用；禁引引擎——同源陷阱对策） ---- */
const DELTA_V = { N: [-1, 0], E: [0, 1], S: [1, 0], W: [0, -1] };
const TURN_L_V = { N: 'W', W: 'S', S: 'E', E: 'N' };
const NUM_V = { 1: '一', 2: '二', 3: '三' };
const inGridV = (r, c) => r >= 1 && r <= 8 && c >= 1 && c <= 8;
function bfsV(fr, fc, to, walls) {
  const wl = new Set(walls.map(w => w.r * 8 + w.c));
  const dist = {}; dist[fr * 8 + fc] = 0;
  const q = [[fr, fc]]; let head = 0;
  while (head < q.length) {
    const p = q[head++];
    if (p[0] === to[0] && p[1] === to[1]) return dist[p[0] * 8 + p[1]];
    const d0 = dist[p[0] * 8 + p[1]];
    for (const k of ['N', 'E', 'S', 'W']) {
      const nr = p[0] + DELTA_V[k][0], nc = p[1] + DELTA_V[k][1];
      if (!inGridV(nr, nc) || wl.has(nr * 8 + nc)) continue;
      const key = nr * 8 + nc;
      if (dist[key] != null) continue;
      dist[key] = d0 + 1;
      q.push([nr, nc]);
    }
  }
  return -1;
}

async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;
  const genDch = { 1: 0, 2: 0, 3: 0, 4: 0 };
  let bumpEdgeN = 0, bumpWallN = 0;              // 出界/撞墙两类 bump 实测计数

  /* 独立指令序列回放（朝向+位置状态机复算）：exec 到达断言/plan 依序收集断言 */
  function replayV(q) {
    let r = q.fr, c = q.fc, h = q.h0, col = 0, fwd = 0;
    for (const cm of q.seq) {
      if (cm.t === 'L') h = TURN_L_V[h];
      else if (cm.t === 'R') h = { N: 'E', E: 'S', S: 'W', W: 'N' }[h];
      else if (cm.t === 'fwd') {
        for (let k = 0; k < cm.n; k++) {
          r += DELTA_V[h][0]; c += DELTA_V[h][1];
          if (!inGridV(r, c)) return null;
        }
        fwd += cm.n;
      } else {
        if (!q.chests[col] || q.chests[col].r !== r || q.chests[col].c !== c) return null;
        col++;
      }
    }
    return { r: r, c: c, h: h, col: col, fwd: fwd };
  }
  const sentenceV = q => q.seq.map(cm => cm.t === 'fwd' ? '向前' + NUM_V[cm.n] + '格'
    : (cm.t === 'L' ? '向左转' : (cm.t === 'R' ? '向右转' : '拿到宝箱'))).join('，');
  const optV = q => {
    let s = 0, ar = q.fr, ac = q.fc;
    for (const ch of q.chests) {
      const d = bfsV(ar, ac, [ch.r, ch.c], q.walls);
      if (d < 0) return -1;
      s += d; ar = ch.r; ac = ch.c;
    }
    return s;
  };
  /* plan 现算参考解（④/⑧/冒烟用——复用引擎 engPlanRef 属同源；此处只做驱动不禁断言口径） */

  /* ---- ① 40 关全量审计（flat 0-39） ---- */
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1.quizzes) === JSON.stringify(L2.quizzes);   // 确定性
    const chOk = L1.ch === Math.floor(flat / CH_LEN) + 1;
    const dchOk = flat < STATIC_LEVELS ? L1.dch === diffOfCh(L1.ch)
                                     : (L1.dch >= 1 && L1.dch <= 4);         // 生成关随机章参数
    if (flat >= STATIC_LEVELS) genDch[L1.dch]++;
    let structAll = true, ruleOk = true, adjOk = true, indepOk = true;
    for (let k = 0; k < L1.quizzes.length; k++) {
      const q = L1.quizzes[k];
      if (structWhy(q)) structAll = false;
      /* 章型：exec1 全 exec1；exec2 qi0 热身 exec1 型；plan qi0 热身 exec 型；maze qi0 热身 plan 型 */
      const want = L1.dch === 1 ? 'exec1'
        : L1.dch === 2 ? (k === 0 ? 'exec1' : 'exec2')
        : L1.dch === 3 ? (k === 0 ? 'exec1' : 'plan')
        : (k === 0 ? 'plan' : 'maze');
      if (q.kind !== want) ruleOk = false;
      if (L1.dch === 2 && k > 0 && q.walls.length > 2) ruleOk = false;       // exec2 墙 0-2
      /* 独立复算：指令回放到达/依序收集 + 独立 BFS opt 对账 */
      const rv = replayV(q);
      if (!rv) indepOk = false;
      else {
        if (q.kind === 'exec1' || q.kind === 'exec2') {
          if (rv.col !== 1 || rv.r !== q.chests[0].r || rv.c !== q.chests[0].c) indepOk = false;
        } else if (rv.col !== q.chests.length) indepOk = false;
        if (rv.fwd !== q.opt || optV(q) !== q.opt) indepOk = false;
      }
      if (k > 0) {                               // 相邻题互异（起点+首箱）
        const p = L1.quizzes[k - 1];
        if (p.fr === q.fr && p.fc === q.fc && p.chests[0].r === q.chests[0].r &&
            p.chests[0].c === q.chests[0].c) adjOk = false;
      }
    }
    /* 引擎直驱：每题先错 1 次（exec=错配 / plan·maze=错序 take）再依序解完；
       plan·maze 加 bump 探针（出界或撞墙不移动零惩罚）+ undo 探针（位置回退步数不减） */
    const Ld = genLevel(flat);
    let driveOk = true, expRetries = 0, expMiss = 0, lastR = null, guard = 0;
    while (!Ld.done && driveOk && guard++ < 400) {
      const q = Ld.quizzes[Ld.step];
      const isExec = q.kind === 'exec1' || q.kind === 'exec2';
      const drivePlan = plan => {                // 执行命令序列（fwd 逐格；段尾 T 跳过——
        for (let i = 0; i < plan.length; i++) {  // 由外层显式 engCmd('T') 收集并校验返回值，
          const cm = plan[i];                    // 否则错序走位到未来箱的 T 会提前触发 order）
          if (cm.t === 'T' && i === plan.length - 1) break;
          const n = cm.t === 'fwd' ? cm.n : 1;
          for (let j = 0; j < n; j++) lastR = engCmd(Ld, cm.t === 'fwd' ? 'fwd' : cm.t);
        }
      };
      if (isExec) {
        const act = q.seq[q._si];                // 错配 1 次：非当前命令类型
        const bad = act.t === 'fwd' ? 'L' : 'fwd';
        if (engCmd(Ld, bad) !== 'wrong' || q._miss !== 1) { driveOk = false; break; }
        expRetries++; expMiss++;
        drivePlan(q.seq);                        // 全对执行（段尾 T 跳过）
        lastR = engCmd(Ld, 'T');                 // 显式到访收集（校验 goal/done）
      } else {
        /* undo 探针：前进一格（合法时）→撤销→位置回退步数不减 */
        const st0 = { r: q._pr, c: q._pc, steps: q._steps };
        const ru = engCmd(Ld, 'fwd');
        if (ru === 'step') {
          if (engUndo(Ld) !== 'undo' || q._pr !== st0.r || q._pc !== st0.c || q._steps !== st0.steps + 1) {
            driveOk = false; break;
          }
          expRetries++;
        } else if (ru === 'bump') {              /* 起点朝向即受阻：bump 计数（出界/撞墙分类） */
          const d0 = DELTA_H[q._h];
          if (!inGrid(q._pr + d0[0], q._pc + d0[1])) bumpEdgeN++; else bumpWallN++;
          expRetries++;

    const rabOk = rabR.width >= 50 && rabR.height >= 50 && rabbitEl.innerHTML.length > 0;
    const rotOk = /rotate\((0|90|180|270)deg\)/.test(rabbitEl.querySelector('.hwrap').style.transform || '');
    /* M3 三件之三：portStyle 判别锚。真实竖屏视口下 @media 恒 column（类通道只能加竖不能减），
       故非 port 模拟的期望并集真实视口朝向；类通道的判别力由横屏真视口轮的 port 模拟承担 */
    const realPort = window.innerHeight > window.innerWidth;
    const portStyle = getComputedStyle($id('play-row')).flexDirection ===
      ((port || realPort) ? 'column' : 'row');
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    document.body.classList.remove('port');
    return { vp: w + 'x' + h + (port ? 'P' : ''), kind: q.kind, cellOk: cellOk, dir96: dirOkL,
      undo64: undoOkL, btn64: btnOk, insideOk: insideOk, chest: chestOk, stone: stoneOk,
      rab: rabOk, rot: rotOk, portStyle: portStyle, ox: ox,
      pass: cellOk && dirOkL && undoOkL && btnOk && insideOk && chestOk && stoneOk &&
            rabOk && rotOk && portStyle && ox <= 0 };
  }
  total++;
  const sims = [];
  startLevel(0);                                  // exec1
  sims.push(await simView(1280, 800, false)); sims.push(await simView(800, 1180, true));
  startLevel(6);                                  // exec2（qi0 热身答对 → qi1）
  await solveQuizV();
  sims.push(await simView(1280, 800, false)); sims.push(await simView(800, 1180, true));
  startLevel(10);                                 // plan（qi0 热身答对 → qi1）
  await solveQuizV();
  sims.push(await simView(1280, 800, false)); sims.push(await simView(800, 1180, true));
  startLevel(15);                                 // maze（qi0 热身答对 → qi1）
  await solveQuizV();
  sims.push(await simView(1280, 800, false)); sims.push(await simView(800, 1180, true));
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                  // 还原真实 viewport 布局
  const layoutOk = sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑩ 分布与专项：文案对账 / clips 注入 / 开场链 / 覆盖 / bump 双类 ---- */
  total++;
  /* VOICE 独立字面量对账（watch/turn/wrong=既有键一字不改 + hint=r13 新键；manifest 严格一致） */
  const voiceOk = VOICE.watch.key === 'gri_tut_watch' && VOICE.watch.text === '看！宝藏在格子里' &&
    VOICE.turn.key === 'gri_tut_turn' && VOICE.turn.text === '你来找一找' &&
    VOICE.hint.key === 'gri_i_hint' && VOICE.hint.text === '听一听，想好再走' &&
    VOICE.wrong.key === 'gri_wrong' && VOICE.wrong.text === '再想一想，听一听';
  /* gri_* 26 条 clips 注入对账（既有 17+r13 新 9；build 注入后 KIDS.voice.clips 应含全部） */
  const GRI_KEYS = ['gri_tut_watch', 'gri_tut_turn', 'gri_hint', 'gri_wrong',
    'gri_q1', 'gri_q2', 'gri_q3', 'gri_go',
    'gri_n_1', 'gri_n_2', 'gri_n_3', 'gri_n_4', 'gri_n_5',
    'gri_d_up', 'gri_d_down', 'gri_d_left', 'gri_d_right',
    'gri_i_fwd', 'gri_i_ge', 'gri_i_left', 'gri_i_right', 'gri_i_take',
    'gri_i_order', 'gri_i_next', 'gri_i_box', 'gri_i_hint'];
  const clipOk = GRI_KEYS.every(k => !!KIDS.voice.clips[k]) &&
    Object.keys(KIDS.voice.clips).filter(k => k.indexOf('gri_') === 0).length === 26;
  /* 开场顺序链（stub 记录）：play(gri_i_hint) 后 OPEN_RELAY 3000ms 接力指令句 queue（全 clip） */
  const origP = KIDS.voice.play, origQ = KIDS.voice.queue;
  const playLog = [], queueLog = [];
  KIDS.voice.play = function (key) { playLog.push(String(key)); };
  KIDS.voice.queue = function (parts) { queueLog.push(parts); };
  startLevel(0);
  const openHint = playLog.indexOf('gri_i_hint') >= 0;
  await wait(3400);                               // 等 3000ms 接力 queue 落地
  const q0c = genLevel(0).quizzes[0];             // flat0 qi0 指令（确定性）
  const expOpen = [];
  q0c.seq.forEach(cm => cmdClips(cm).forEach(k => expOpen.push(k)));
  const qParts = queueLog.find(p => p[0] === 'gri_i_fwd');
  const openQ = !!qParts && qParts.length === expOpen.length &&
    expOpen.every((k, i) => qParts[i] === k);     /* 全 clip 拼接（禁 key:null） */
  KIDS.voice.play = origP; KIDS.voice.queue = origQ;
  const distOk = voiceOk && clipOk && openHint && openQ &&
    genDch[1] >= 1 && genDch[2] >= 1 && genDch[3] >= 1 && genDch[4] >= 1 &&  /* 生成关随机章全覆盖 */
    bumpEdgeN >= 1 && bumpWallN >= 1;             /* 出界/撞墙两类 bump 均实测 */
  if (distOk) npass++;
  units.dist = { ok: distOk, voice: voiceOk, clips: clipOk, openHint: openHint, openQ: openQ,
    genDch: genDch, bumpEdge: bumpEdgeN, bumpWall: bumpWallN };

  /* ---- ⑪ duration（r13 门禁）：40 关 modeled ≥40000+逐关对账+每步 DECIDE≥voiceWin ---- */
  total++;
  const estMsV = s => s.length * 345 + 600;       // b25 定版：SAPI ~345ms/字+600（全字符口径）
  const V_DECIDE = { exec1: 7000, exec2: 8500, plan: 9000, maze: 10000 };   /* 独立副本常量（禁引引擎） */
  const V_ADV = 600, V_MIN = 40000, V_CHEST = 950, V_ENTER = 400, V_STAGE = 400;
  const vVoice = (q, k) => k === 0
    ? (V_ENTER + estMsV(q.kind.slice(0, 4) === 'exec' ? sentenceV(q) : '按顺序拿到宝箱') + 300)
    : V_STAGE;
  const vDur = L => L.quizzes.reduce((s, q) => {
    const na = q.seq.reduce((x, cm) => x + (cm.t === 'fwd' ? cm.n : 1), 0);
    let d = V_CHEST;
    for (let k = 0; k < na; k++) d += Math.max(vVoice(q, k), V_DECIDE[q.kind]) + V_ADV;
    return s + d;
  }, 0);
  let dMin = Infinity, dFlat = -1, parityOk = true, voiceOkD = true;
  for (let flat = 0; flat < 40; flat++) {
    const L = genLevel(flat);
    const d = vDur(L);
    if (d < dMin) { dMin = d; dFlat = flat; }
    if (levelDurMs(L) !== d) parityOk = false;             // 独立副本与源模型逐关对账
    for (const q of L.quizzes) {
      const na = q.seq.reduce((x, cm) => x + (cm.t === 'fwd' ? cm.n : 1), 0);
      for (let k = 0; k < na; k++)
        if (V_DECIDE[q.kind] < vVoice(q, k)) voiceOkD = false;   // 逐步：决策 ≥ 语音窗（认知主体）
    }
  }
  const durUnitOk = dMin >= V_MIN && parityOk && voiceOkD && dMin === 126350;   /* 防回漂：40 关 modeled 最低=126350（SPEC §3 r13 验算） */
  if (durUnitOk) npass++;
  units.duration = { ok: durUnitOk, minMs: dMin, minFlat: dFlat, want: V_MIN,
    parity: parityOk, voiceNeverDominates: voiceOkD,
    decide: V_DECIDE, adv: V_ADV };

  /* ---- ⑫ 源码断言：script[2]（data+engine+main）r13 字面（b36 M1① 判别力恢复） ---- */
  total++;
  const src2 = document.querySelectorAll('script')[2] ? document.querySelectorAll('script')[2].textContent : '';
  const src0 = document.querySelectorAll('script')[0] ? document.querySelectorAll('script')[0].textContent : '';
  const srcOk = src2.indexOf('const estMs = s => s.length * 345 + 600') >= 0 &&
    src2.indexOf('const DECIDE_MS = { exec1: 7000, exec2: 8500, plan: 9000, maze: 10000 }') >= 0 &&
    src2.indexOf('const LEVEL_MIN_MS = 40000') >= 0 &&
    src2.indexOf('const GRID_N = 8') >= 0 &&
    src2.indexOf('const OPEN_RELAY_MS = 3000') >= 0 &&
    src2.indexOf('const CAP_EXEC1 = 14, CAP_EXEC2 = 20') >= 0 &&
    src2.indexOf('const TURN_L = { N: ') >= 0 &&
    src2.indexOf('GEN_HINTS[genLevel(f + 1).dch - 1]') >= 0 &&
    src2.indexOf('CHAPTERS[(ci + 1) % 4]') < 0 &&          /* 家族 F：禁章序取模推进 */
    src2.indexOf('GEN_HINTS[(ci + 1) % 4]') < 0 &&
    src0.indexOf('settle()') >= 0 &&                       /* script[0]=core 源锚 */
    src2.indexOf('runVerify') < 0;                         /* script[2] 纯游戏逻辑（b37 R4 对称） */
  if (srcOk) npass++;
  units.srcLit = { ok: srcOk };

  const out = { game: 'grid', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__grVlog = out;                          /* 外部断言挂点（selftest/Python verify） */
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

/* ---- verify 内部驱动辅助（UI 层：走完当前一题——exec=按指令条；plan=现算参考解逐段） ---- */
async function solveQuizV() {
  const run = cur.step;
  let guard = 0;
  while (cur && !cur.done && cur.step === run && guard++ < 160) {
    const q = cur.quizzes[cur.step];
    let c;
    if (q.kind === 'exec1' || q.kind === 'exec2') {
      const act = q.seq[q._si];
      if (!act) break;
      c = act.t;
    } else {
      const p = engPlanRef({ fr: q._pr, fc: q._pc, h0: q._h,
        chests: q.chests.slice(q._col), walls: q.walls });
      if (!p || !p.length) break;
      c = p[0].t;
    }
    const r = await uiCmd(c);
    if (r === false || r === null) break;
  }
  return cur.step > run || cur.done;
}
async function walkToV(cell) {                    // plan 期走到指定格（现算参考解逐步驱动）
  let guard = 0;
  while (guard++ < 160) {
    const q = cur.quizzes[cur.step];
    if (q._pr === cell.r && q._pc === cell.c) return true;
    const p = engPlanRef({ fr: q._pr, fc: q._pc, h0: q._h, chests: [{ r: cell.r, c: cell.c }],
                           walls: q.walls });
    if (!p || !p.length) return false;
    const r = await uiCmd(p[0].t);
    if (r === false || r === null) return false;
  }
  return false;
}
function findFreeCellV(q) {                       // 找一个非箱非墙非当前位置的自由格（④ nope 用；
  for (let r = 1; r <= 8; r++) for (let c = 1; c <= 8; c++) {   // q=GR.quiz getter 契约字段 pos/walls）
    if (r === q.pos.r && c === q.pos.c) continue;
    if (q.chests.some(ch => ch.r === r && ch.c === c)) continue;
    if (q.walls.some(w => w.r === r && w.c === c)) continue;
    const d = bfsV(q.pos.r, q.pos.c, [r, c], q.walls);
    if (d >= 1) return { r: r, c: c };
  }
  return null;
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}
