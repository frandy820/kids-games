<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>机器画师</title>
<style>
/* ================= 机器画师 robotpaint r18（batch33·7-8 岁段，计算思维·指令精确性）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E。
   r18 玩法 = 想清楚再画（五题型）：plain 三轴组指令 / neg 否定指令卡（打叉芯片=
   封闭集补全推理）/ edit 两步修改卡（from✗→to✓）/ mem 记忆复现（闪现后罩住）/
   dual 双画师并行（四框=目标A｜画布A｜目标B｜画布B）。
   目标侧按题型呈现（指令卡/图案卡）；画布按相位——pick=画师待命（edit=pick 显
   起始画）→ paint 逐属性作画 → compare 成品定格+印记。块池 r18=轴分组+组内打乱。
   文案红线：小画师听指令画画 / 说得清楚画得像 / 打了叉的不能用 / 记住它再画。
   【SPEED 缩放换算声明】所有 CSS 动画时长 = calc(时长 * var(--t))，
   :root 默认 --t:1（真实页）；verify 页 JS 置 --t:0.12（=SPEED），
   JS 等待窗同步乘 SPEED——CSS 动画与 JS 窗同一换算因子，verify 提速不漂移。
   触摸目标：属性块 ≥96×88（≥48 下限）、槽 ≥84、画！钮 ≥84、dual mini 框 ≥132；overflowX 恒 0 */
:root{--t:1}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{color:#4A3B2E;font-family:inherit;cursor:pointer;border:none;background:none}   /* 契约 O：自建 button 显式 color */
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：相位提示 + 画架（双框或 dual 四框）+ 指令槽 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;gap:4px;overflow:hidden;padding:4px 12px 6px}
#tip{flex:0 0 auto;font-size:19px;font-weight:700;padding:3px 18px;border-radius:13px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D9C9B4}
/* 画架：plain/neg/edit/mem=两框（目标侧｜画布侧）；dual=四框（目标A｜画布A｜目标B｜画布B，
   B 对默认隐藏 .dual-only；当前任务对 .cur 高亮）。比对印记盖在画布右下角 */
#easel{flex:0 0 auto;display:flex;gap:14px;align-items:stretch;justify-content:center;padding:2px 0 4px}
.frame{position:relative;width:172px;border-radius:16px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #D9C9B4;display:flex;flex-direction:column;align-items:center;padding:6px 6px 8px}
.frame .f-cap{font-size:13px;font-weight:700;color:#8A7B6C;line-height:1.2}
.frame .f-paper{position:relative;width:150px;height:150px;margin-top:3px;border-radius:10px;
  background:#FFFDF6;border:2.5px dashed #C9A87C;display:flex;align-items:center;justify-content:center;overflow:hidden}
.frame .f-paper > svg{width:118px;height:118px}
.frame .f-paper .artist{width:96px;height:auto;align-self:flex-end;position:absolute;right:2px;bottom:0}
.frame[data-role="painted"] .f-paper,.frame[data-role="pB"] .f-paper{border-style:solid;border-color:#E8D9BE}
.frame.dual-only{display:none}
#easel.dual .dual-only{display:flex}
#easel.dual{gap:10px}
#easel.dual .frame{width:136px;padding:5px 4px 6px}
#easel.dual .frame .f-paper{width:116px;height:116px}
#easel.dual .frame .f-paper > svg{width:92px;height:92px}
#easel.dual .frame .f-paper .artist{width:56px}
#easel.dual .frame .f-cap{font-size:12px}
.frame.cur{border-color:#E8975A;box-shadow:0 5px 0 #C98A4E,0 0 14px rgba(232,151,90,.45)}
.frame.shake{animation:fr-shake calc(.5s*var(--t)) ease 2}
@keyframes fr-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.frame.flash-ok{animation:fr-ok calc(.6s*var(--t)) ease}
@keyframes fr-ok{0%{box-shadow:0 5px 0 #D9C9B4}50%{box-shadow:0 5px 0 #8FBF7F,0 0 22px rgba(143,191,127,.8)}100%{box-shadow:0 5px 0 #D9C9B4}}
/* 比对印记：像（绿√）/ 不像（橙?）——契约 M 帧内容锚 data-judge */
.stamp{position:absolute;right:6px;bottom:6px;z-index:5;width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;
  border:3px solid #4A3B2E;transform:rotate(-8deg);opacity:.94;
  animation:stamp-in calc(.45s*var(--t)) cubic-bezier(.2,1.6,.4,1) backwards}
.stamp[data-judge="like"]{background:#BFE3AF;color:#2E5B21}
.stamp[data-judge="diff"]{background:#F6D9A8;color:#7A5A17}
@keyframes stamp-in{0%{transform:rotate(-8deg) scale(2.1);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:.94}}
/* 画师作画逐属性演出：颜色底淡入→形状轮廓描线→大小缩放（JS 分段驱动，
   class 段标记=data-ph 帧；时长=calc(*var(--t)) 换算声明同上） */
.paint-el{opacity:0;transform-box:fill-box;transform-origin:center}
.paint-el.ph-color{animation:ph-fade calc(.55s*var(--t)) ease forwards}
@keyframes ph-fade{0%{opacity:0}100%{opacity:1}}
.paint-el.ph-shape{stroke-dasharray:900;stroke-dashoffset:900;opacity:1;
  animation:ph-draw calc(.7s*var(--t)) ease forwards}
@keyframes ph-draw{0%{stroke-dashoffset:900;opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.paint-el.ph-size{opacity:1;animation:ph-zoom calc(.55s*var(--t)) cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes ph-zoom{0%{transform:scale(1.45)}100%{transform:scale(1)}}
.artist-painting .artist-arm{transform-box:fill-box;transform-origin:50% 8%;
  animation:arm-draw calc(.8s*var(--t)) ease-in-out infinite}
@keyframes arm-draw{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(14deg)}}
.frame[data-role="painted"].settled .paint-el,.frame[data-role="pB"].settled .paint-el{opacity:1;stroke-dashoffset:0;animation:none;transform:none}

/* ---------- r18 指令卡（neg 否定卡 / edit 修改卡——目标侧 pick 相位呈现）
   锚：.nrow/.erow data-axis + .nchip data-val + data-neg（打叉排除）+ data-ok（目标值） */
.negcard,.editcard{display:flex;flex-direction:column;justify-content:center;gap:7px;width:100%;padding:2px 4px}
.nrow,.erow{display:flex;align-items:center;gap:5px;justify-content:center}
.nlab{font-size:13px;font-weight:700;color:#8A7B6C;flex:0 0 auto}
.nchips{display:flex;gap:4px;align-items:center}
.nchip{position:relative;display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:10px;background:#FFF9EE;border:2px solid #C9BFA8}
.nchip svg{width:30px;height:30px}
.nchip.neg{border-color:#D9A08E;background:#FBEFE8}
.nchip.ok{border-color:#8FBF7F;background:#F0F7EA}
.nchip.neg .x{position:absolute;inset:-3px;pointer-events:none}
.nchip.neg .x:before,.nchip.neg .x:after{content:'';position:absolute;left:6%;top:45%;width:88%;height:5px;
  border-radius:3px;background:#DF5B48;box-shadow:0 1px 0 rgba(255,255,255,.6)}
.nchip.neg .x:before{transform:rotate(45deg)}
.nchip.neg .x:after{transform:rotate(-45deg)}
.earrow{font-size:18px;font-weight:800;color:#E8975A;flex:0 0 auto}
/* mem 罩卡（闪现窗后罩住目标——锚 .memcover data-covered） */
.memcover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.memcover svg{width:96px;height:96px}
.memcover .mc-txt{font-size:14px;font-weight:700;color:#C98A4E}

/* ---------- 指令槽（轴标签恒在：颜色/形状/大小；当前槽 pulse；填入=属性图+小字名+pop） ---------- */
#slots{flex:0 0 auto;display:flex;gap:10px;justify-content:center;align-items:stretch;padding:2px 0 4px}
.slot{position:relative;width:96px;height:96px;border:3px dashed #C9A87C;border-radius:16px;
  background:#FFF9EE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.slot .s-axis{font-size:13px;font-weight:700;line-height:1.1;color:#8A7B6C}
.slot .s-val{display:flex;flex-direction:column;align-items:center;gap:1px}
.slot .s-val svg{width:44px;height:44px}
.slot .s-val .s-name{font-size:13px;font-weight:700;line-height:1.1}
.slot.cur{border-color:#E8975A;border-style:solid;
  animation:slot-pulse calc(1.1s*var(--t)) ease-in-out infinite}
@keyframes slot-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.slot.flash{animation:slot-flash calc(.55s*var(--t)) ease}
@keyframes slot-flash{0%{background:#FDEFDC;transform:scale(1.12)}100%{background:#FFF9EE;transform:scale(1)}}
.slot.fill-pop{animation:slot-pop calc(.2s*var(--t)) ease}
@keyframes slot-pop{0%{transform:scale(.5)}60%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ---------- 属性块池（恒 8：颜色 3+形状 3+大小 2 轴分组连续，组内 seeded 打乱——
   同轴多值干扰恒全摆（防位置查表）；pick 相位显示） ---------- */
#board{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:10px;max-width:760px;padding:2px 4px}
#board.bump{animation:bd-bump calc(.22s*var(--t)) ease}
@keyframes bd-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.block{position:relative;width:96px;min-height:88px;border-radius:18px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D9C9B4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:5px 4px 5px;transition:transform .15s}
.block:active{transform:translateY(3px);box-shadow:0 2px 0 #D9C9B4}
.block svg{width:52px;height:52px;pointer-events:none}
.block .c-name{font-size:15px;font-weight:700;line-height:1.15;pointer-events:none}
.block.pop{animation:card-in calc(.4s*var(--t)) cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes card-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.block.wig{animation:blk-wig calc(.4s*var(--t)) ease}
@keyframes blk-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.block.breathe{animation:blk-br calc(1.2s*var(--t)) ease-in-out infinite}
@keyframes blk-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.06)}}

/* ---------- 底栏：小画师钮（方向提示）+ 画！钮（三槽满亮起；错后常驻=改槽重画） ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:6px 18px 12px;gap:26px}
#btn-artist{width:80px;height:80px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-artist:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-artist svg{width:62px;height:62px}
#btn-artist.hop{animation:art-hop calc(.45s*var(--t)) ease 2}
@keyframes art-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-go{width:96px;height:84px;border-radius:22px;background:#F0E4CC;border:3px solid #C9BFA8;
  box-shadow:0 4px 0 #C9BFA8;font-size:24px;font-weight:800;color:#B7A88E;
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-go.ready{background:#E8975A;border-color:#4A3B2E;box-shadow:0 5px 0 #C98A4E;color:#FFF9EE;
  animation:go-pulse calc(1s*var(--t)) ease-in-out infinite}
@keyframes go-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#btn-go.ready:active{transform:translateY(3px);box-shadow:0 2px 0 #C98A4E}
#btn-go.bump{animation:bd-bump calc(.22s*var(--t)) ease}

/* ---------- 幽灵手指教学（照家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press calc(.6s*var(--t)) ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple calc(.6s*var(--t)) ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：画框/块收紧，触摸目标仍 ≥48；dual 四框 2×2 网格。
   【PORT-CLS 镜像声明】本段与下方 body.port 镜像段逐行全等（剥离 body.port 前缀）
   ——JS 类通道与系统媒体查询通道双保险，build 逐行断言 */
@media (orientation:portrait){
#tip{font-size:17px;padding:3px 14px}
.frame{width:150px}
.frame .f-paper{width:128px;height:128px}
.frame .f-paper > svg{width:100px;height:100px}
.frame .f-paper .artist{width:52px}
#easel.dual{flex-wrap:wrap;gap:8px;max-width:340px}
#easel.dual .frame{width:150px}
#easel.dual .frame .f-paper{width:128px;height:128px}
#easel.dual .frame .f-paper > svg{width:100px;height:100px}
#slots{gap:8px}
.slot{width:86px;height:88px}
.slot .s-val svg{width:38px;height:38px}
.slot .s-val .s-name{font-size:12px}
#board{gap:8px}
.block{width:88px;min-height:82px}
.block svg{width:46px;height:46px}
.block .c-name{font-size:14px}
#btn-artist{width:72px;height:72px}
#btn-artist svg{width:56px;height:56px}
#btn-go{width:88px;height:78px;font-size:21px}
}
/*PORT-CLS*/
body.port #tip{font-size:17px;padding:3px 14px}
body.port .frame{width:150px}
body.port .frame .f-paper{width:128px;height:128px}
body.port .frame .f-paper > svg{width:100px;height:100px}
body.port .frame .f-paper .artist{width:52px}
body.port #easel.dual{flex-wrap:wrap;gap:8px;max-width:340px}
body.port #easel.dual .frame{width:150px}
body.port #easel.dual .frame .f-paper{width:128px;height:128px}
body.port #easel.dual .frame .f-paper > svg{width:100px;height:100px}
body.port #slots{gap:8px}
body.port .slot{width:86px;height:88px}
body.port .slot .s-val svg{width:38px;height:38px}
body.port .slot .s-val .s-name{font-size:12px}
body.port #board{gap:8px}
body.port .block{width:88px;min-height:82px}
body.port .block svg{width:46px;height:46px}
body.port .block .c-name{font-size:14px}
body.port #btn-artist{width:72px;height:72px}
body.port #btn-artist svg{width:56px;height:56px}
body.port #btn-go{width:88px;height:78px;font-size:21px}
</style>
</head>
<body>
<div id="game" aria-label="机器画师">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="tip" aria-live="polite">说清楚要什么</div>
    <div id="easel" aria-label="目标与画师画布">
      <div class="frame" data-role="target" aria-label="要画的">
        <div class="f-cap" id="cap-goal">要画的</div>
        <div class="f-paper" id="paper-goal"></div>
      </div>
      <div class="frame" data-role="painted" aria-label="小画师画的">
        <div class="f-cap" id="cap-paint">小画师画的</div>
        <div class="f-paper" id="paper-paint"></div>
      </div>
      <div class="frame dual-only" data-role="gB" aria-label="还要画的">
        <div class="f-cap" id="cap-goal2">还要画的</div>
        <div class="f-paper" id="paper-goal2"></div>
      </div>
      <div class="frame dual-only" data-role="pB" aria-label="小画师还要画的">
        <div class="f-cap" id="cap-paint2">小画师还要画的</div>
        <div class="f-paper" id="paper-paint2"></div>
      </div>
    </div>
    <div id="slots" aria-label="指令槽"></div>
  </div>
  <div id="board" aria-label="属性块"></div>
  <div id="dock">
    <button id="btn-artist" aria-label="小画师"></button>
    <button id="btn-go" aria-label="画">画！</button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
