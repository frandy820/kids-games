<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>机器画师</title>
<style>
/* ================= 机器画师 robotpaint r18（batch33·7-8 岁段，计算思维·指令精确性）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E。
   r18 玩法 = 想清楚再画（五题型）：plain 三轴组指令 / neg 否定指令卡（打叉芯片=
   封闭集补全推理）/ edit 两步修改卡（from✗→to✓）/ mem 记忆复现（闪现后罩住）/
   dual 双画师并行（四框=目标A｜画布A｜目标B｜画布B）。
   目标侧按题型呈现（指令卡/图案卡）；画布按相位——pick=画师待命（edit=pick 显
   起始画）→ paint 逐属性作画 → compare 成品定格+印记。块池 r18=轴分组+组内打乱。
   文案红线：小画师听指令画画 / 说得清楚画得像 / 打了叉的不能用 / 记住它再画。
   【SPEED 缩放换算声明】所有 CSS 动画时长 = calc(时长 * var(--t))，
   :root 默认 --t:1（真实页）；verify 页 JS 置 --t:0.12（=SPEED），
   JS 等待窗同步乘 SPEED——CSS 动画与 JS 窗同一换算因子，verify 提速不漂移。
   触摸目标：属性块 ≥96×88（≥48 下限）、槽 ≥84、画！钮 ≥84、dual mini 框 ≥132；overflowX 恒 0 */
:root{--t:1}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{color:#4A3B2E;font-family:inherit;cursor:pointer;border:none;background:none}   /* 契约 O：自建 button 显式 color */
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：相位提示 + 画架（双框或 dual 四框）+ 指令槽 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;gap:4px;overflow:hidden;padding:4px 12px 6px}
#tip{flex:0 0 auto;font-size:19px;font-weight:700;padding:3px 18px;border-radius:13px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D9C9B4}
/* 画架：plain/neg/edit/mem=两框（目标侧｜画布侧）；dual=四框（目标A｜画布A｜目标B｜画布B，
   B 对默认隐藏 .dual-only；当前任务对 .cur 高亮）。比对印记盖在画布右下角 */
#easel{flex:0 0 auto;display:flex;gap:14px;align-items:stretch;justify-content:center;padding:2px 0 4px}
.frame{position:relative;width:172px;border-radius:16px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #D9C9B4;display:flex;flex-direction:column;align-items:center;padding:6px 6px 8px}
.frame .f-cap{font-size:13px;font-weight:700;color:#8A7B6C;line-height:1.2}
.frame .f-paper{position:relative;width:150px;height:150px;margin-top:3px;border-radius:10px;
  background:#FFFDF6;border:2.5px dashed #C9A87C;display:flex;align-items:center;justify-content:center;overflow:hidden}
.frame .f-paper > svg{width:118px;height:118px}
.frame .f-paper .artist{width:96px;height:auto;align-self:flex-end;position:absolute;right:2px;bottom:0}
.frame[data-role="painted"] .f-paper,.frame[data-role="pB"] .f-paper{border-style:solid;border-color:#E8D9BE}
.frame.dual-only{display:none}
#easel.dual .dual-only{display:flex}
#easel.dual{gap:10px}
#easel.dual .frame{width:136px;padding:5px 4px 6px}
#easel.dual .frame .f-paper{width:116px;height:116px}
#easel.dual .frame .f-paper > svg{width:92px;height:92px}
#easel.dual .frame .f-paper .artist{width:56px}
#easel.dual .frame .f-cap{font-size:12px}
.frame.cur{border-color:#E8975A;box-shadow:0 5px 0 #C98A4E,0 0 14px rgba(232,151,90,.45)}
.frame.shake{animation:fr-shake calc(.5s*var(--t)) ease 2}
@keyframes fr-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.frame.flash-ok{animation:fr-ok calc(.6s*var(--t)) ease}
@keyframes fr-ok{0%{box-shadow:0 5px 0 #D9C9B4}50%{box-shadow:0 5px 0 #8FBF7F,0 0 22px rgba(143,191,127,.8)}100%{box-shadow:0 5px 0 #D9C9B4}}
/* 比对印记：像（绿√）/ 不像（橙?）——契约 M 帧内容锚 data-judge */
.stamp{position:absolute;right:6px;bottom:6px;z-index:5;width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;
  border:3px solid #4A3B2E;transform:rotate(-8deg);opacity:.94;
  animation:stamp-in calc(.45s*var(--t)) cubic-bezier(.2,1.6,.4,1) backwards}
.stamp[data-judge="like"]{background:#BFE3AF;color:#2E5B21}
.stamp[data-judge="diff"]{background:#F6D9A8;color:#7A5A17}
@keyframes stamp-in{0%{transform:rotate(-8deg) scale(2.1);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:.94}}
/* 画师作画逐属性演出：颜色底淡入→形状轮廓描线→大小缩放（JS 分段驱动，
   class 段标记=data-ph 帧；时长=calc(*var(--t)) 换算声明同上） */
.paint-el{opacity:0;transform-box:fill-box;transform-origin:center}
.paint-el.ph-color{animation:ph-fade calc(.55s*var(--t)) ease forwards}
@keyframes ph-fade{0%{opacity:0}100%{opacity:1}}
.paint-el.ph-shape{stroke-dasharray:900;stroke-dashoffset:900;opacity:1;
  animation:ph-draw calc(.7s*var(--t)) ease forwards}
@keyframes ph-draw{0%{stroke-dashoffset:900;opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.paint-el.ph-size{opacity:1;animation:ph-zoom calc(.55s*var(--t)) cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes ph-zoom{0%{transform:scale(1.45)}100%{transform:scale(1)}}
.artist-painting .artist-arm{transform-box:fill-box;transform-origin:50% 8%;
  animation:arm-draw calc(.8s*var(--t)) ease-in-out infinite}
@keyframes arm-draw{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(14deg)}}
.frame[data-role="painted"].settled .paint-el,.frame[data-role="pB"].settled .paint-el{opacity:1;stroke-dashoffset:0;animation:none;transform:none}

/* ---------- r18 指令卡（neg 否定卡 / edit 修改卡——目标侧 pick 相位呈现）
   锚：.nrow/.erow data-axis + .nchip data-val + data-neg（打叉排除）+ data-ok（目标值） */
.negcard,.editcard{display:flex;flex-direction:column;justify-content:center;gap:7px;width:100%;padding:2px 4px}
.nrow,.erow{display:flex;align-items:center;gap:5px;justify-content:center}
.nlab{font-size:13px;font-weight:700;color:#8A7B6C;flex:0 0 auto}
.nchips{display:flex;gap:4px;align-items:center}
.nchip{position:relative;display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:10px;background:#FFF9EE;border:2px solid #C9BFA8}
.nchip svg{width:30px;height:30px}
.nchip.neg{border-color:#D9A08E;background:#FBEFE8}
.nchip.ok{border-color:#8FBF7F;background:#F0F7EA}
.nchip.neg .x{position:absolute;inset:-3px;pointer-events:none}
.nchip.neg .x:before,.nchip.neg .x:after{content:'';position:absolute;left:6%;top:45%;width:88%;height:5px;
  border-radius:3px;background:#DF5B48;box-shadow:0 1px 0 rgba(255,255,255,.6)}
.nchip.neg .x:before{transform:rotate(45deg)}
.nchip.neg .x:after{transform:rotate(-45deg)}
.earrow{font-size:18px;font-weight:800;color:#E8975A;flex:0 0 auto}
/* mem 罩卡（闪现窗后罩住目标——锚 .memcover data-covered） */
.memcover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.memcover svg{width:96px;height:96px}
.memcover .mc-txt{font-size:14px;font-weight:700;color:#C98A4E}

/* ---------- 指令槽（轴标签恒在：颜色/形状/大小；当前槽 pulse；填入=属性图+小字名+pop） ---------- */
#slots{flex:0 0 auto;display:flex;gap:10px;justify-content:center;align-items:stretch;padding:2px 0 4px}
.slot{position:relative;width:96px;height:96px;border:3px dashed #C9A87C;border-radius:16px;
  background:#FFF9EE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.slot .s-axis{font-size:13px;font-weight:700;line-height:1.1;color:#8A7B6C}
.slot .s-val{display:flex;flex-direction:column;align-items:center;gap:1px}
.slot .s-val svg{width:44px;height:44px}
.slot .s-val .s-name{font-size:13px;font-weight:700;line-height:1.1}
.slot.cur{border-color:#E8975A;border-style:solid;
  animation:slot-pulse calc(1.1s*var(--t)) ease-in-out infinite}
@keyframes slot-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.slot.flash{animation:slot-flash calc(.55s*var(--t)) ease}
@keyframes slot-flash{0%{background:#FDEFDC;transform:scale(1.12)}100%{background:#FFF9EE;transform:scale(1)}}
.slot.fill-pop{animation:slot-pop calc(.2s*var(--t)) ease}
@keyframes slot-pop{0%{transform:scale(.5)}60%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ---------- 属性块池（恒 8：颜色 3+形状 3+大小 2 轴分组连续，组内 seeded 打乱——
   同轴多值干扰恒全摆（防位置查表）；pick 相位显示） ---------- */
#board{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:10px;max-width:760px;padding:2px 4px}
#board.bump{animation:bd-bump calc(.22s*var(--t)) ease}
@keyframes bd-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.block{position:relative;width:96px;min-height:88px;border-radius:18px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D9C9B4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:5px 4px 5px;transition:transform .15s}
.block:active{transform:translateY(3px);box-shadow:0 2px 0 #D9C9B4}
.block svg{width:52px;height:52px;pointer-events:none}
.block .c-name{font-size:15px;font-weight:700;line-height:1.15;pointer-events:none}
.block.pop{animation:card-in calc(.4s*var(--t)) cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes card-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.block.wig{animation:blk-wig calc(.4s*var(--t)) ease}
@keyframes blk-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.block.breathe{animation:blk-br calc(1.2s*var(--t)) ease-in-out infinite}
@keyframes blk-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.06)}}

/* ---------- 底栏：小画师钮（方向提示）+ 画！钮（三槽满亮起；错后常驻=改槽重画） ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:6px 18px 12px;gap:26px}
#btn-artist{width:80px;height:80px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-artist:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-artist svg{width:62px;height:62px}
#btn-artist.hop{animation:art-hop calc(.45s*var(--t)) ease 2}
@keyframes art-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-go{width:96px;height:84px;border-radius:22px;background:#F0E4CC;border:3px solid #C9BFA8;
  box-shadow:0 4px 0 #C9BFA8;font-size:24px;font-weight:800;color:#B7A88E;
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-go.ready{background:#E8975A;border-color:#4A3B2E;box-shadow:0 5px 0 #C98A4E;color:#FFF9EE;
  animation:go-pulse calc(1s*var(--t)) ease-in-out infinite}
@keyframes go-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#btn-go.ready:active{transform:translateY(3px);box-shadow:0 2px 0 #C98A4E}
#btn-go.bump{animation:bd-bump calc(.22s*var(--t)) ease}

/* ---------- 幽灵手指教学（照家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press calc(.6s*var(--t)) ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple calc(.6s*var(--t)) ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：画框/块收紧，触摸目标仍 ≥48；dual 四框 2×2 网格。
   【PORT-CLS 镜像声明】本段与下方 body.port 镜像段逐行全等（剥离 body.port 前缀）
   ——JS 类通道与系统媒体查询通道双保险，build 逐行断言 */
@media (orientation:portrait){
#tip{font-size:17px;padding:3px 14px}
.frame{width:150px}
.frame .f-paper{width:128px;height:128px}
.frame .f-paper > svg{width:100px;height:100px}
.frame .f-paper .artist{width:52px}
#easel.dual{flex-wrap:wrap;gap:8px;max-width:340px}
#easel.dual .frame{width:150px}
#easel.dual .frame .f-paper{width:128px;height:128px}
#easel.dual .frame .f-paper > svg{width:100px;height:100px}
#slots{gap:8px}
.slot{width:86px;height:88px}
.slot .s-val svg{width:38px;height:38px}
.slot .s-val .s-name{font-size:12px}
#board{gap:8px}
.block{width:88px;min-height:82px}
.block svg{width:46px;height:46px}
.block .c-name{font-size:14px}
#btn-artist{width:72px;height:72px}
#btn-artist svg{width:56px;height:56px}
#btn-go{width:88px;height:78px;font-size:21px}
}
/*PORT-CLS*/
body.port #tip{font-size:17px;padding:3px 14px}
body.port .frame{width:150px}
body.port .frame .f-paper{width:128px;height:128px}
body.port .frame .f-paper > svg{width:100px;height:100px}
body.port .frame .f-paper .artist{width:52px}
body.port #easel.dual{flex-wrap:wrap;gap:8px;max-width:340px}
body.port #easel.dual .frame{width:150px}
body.port #easel.dual .frame .f-paper{width:128px;height:128px}
body.port #easel.dual .frame .f-paper > svg{width:100px;height:100px}
body.port #slots{gap:8px}
body.port .slot{width:86px;height:88px}
body.port .slot .s-val svg{width:38px;height:38px}
body.port .slot .s-val .s-name{font-size:12px}
body.port #board{gap:8px}
body.port .block{width:88px;min-height:82px}
body.port .block svg{width:46px;height:46px}
body.port .block .c-name{font-size:14px}
body.port #btn-artist{width:72px;height:72px}
body.port #btn-artist svg{width:56px;height:56px}
body.port #btn-go{width:88px;height:78px;font-size:21px}
</style>
</head>
<body>
<div id="game" aria-label="机器画师">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="tip" aria-live="polite">说清楚要什么</div>
    <div id="easel" aria-label="目标与画师画布">
      <div class="frame" data-role="target" aria-label="要画的">
        <div class="f-cap" id="cap-goal">要画的</div>
        <div class="f-paper" id="paper-goal"></div>
      </div>
      <div class="frame" data-role="painted" aria-label="小画师画的">
        <div class="f-cap" id="cap-paint">小画师画的</div>
        <div class="f-paper" id="paper-paint"></div>
      </div>
      <div class="frame dual-only" data-role="gB" aria-label="还要画的">
        <div class="f-cap" id="cap-goal2">还要画的</div>
        <div class="f-paper" id="paper-goal2"></div>
      </div>
      <div class="frame dual-only" data-role="pB" aria-label="小画师还要画的">
        <div class="f-cap" id="cap-paint2">小画师还要画的</div>
        <div class="f-paper" id="paper-paint2"></div>
      </div>
    </div>
    <div id="slots" aria-label="指令槽"></div>
  </div>
  <div id="board" aria-label="属性块"></div>
  <div id="dock">
    <button id="btn-artist" aria-label="小画师"></button>
    <button id="btn-go" aria-label="画">画！</button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ---------- 属性图案 SVG 工厂（目标卡/成品画布共用——纯 SVG 属性自明，无文字）
   propSvg(t, opts)：t={color,shape,size} 三元组；根组 g[data-prop] 带
   data-color/data-shape/data-size 三属性——契约 M 帧内容断言锚（渲染即引擎）。
   大小：big=基准半径 44 / small=25（同 viewBox 直观可辨）；
   ph（作画分相位标记）：'color' 段=色底淡入 / 'shape' 段=轮廓描线 / 'size' 段=缩放定尺
   ——JS 逐段驱动（paint 相位 ~800ms/段），settled=比对定格（动画全清）。 ---------- */
/* 元素统一带 fill="none" 占位（供外层按需替换填充色——三形状 replace 恒命中） */
function shapeEl(shape, r, ph) {
  const stroke = 'stroke="#4A3B2E" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
  const cls = ph ? ' class="paint-el ph-' + ph + '"' : '';
  if (shape === 'cir')
    return '<circle' + cls + ' data-part="shape" cx="60" cy="60" r="' + r + '" fill="none" ' + stroke + '/>';
  if (shape === 'squ') {
    const x = 60 - r, w = 2 * r;
    return '<rect' + cls + ' data-part="shape" x="' + x + '" y="' + x + '" width="' + w +
      '" height="' + w + '" rx="11" fill="none" ' + stroke + '/>';
  }
  /* tri：等边三角（顶点上），圆心 60,60 内切布局 */
  const cy = 60 + r * 0.42, h = r * 1.9;
  const ax = 60, ay = cy - h * 0.62, bx = 60 - r * 1.12, by = cy + h * 0.38,
        cx2 = 60 + r * 1.12, cy2 = cy + h * 0.38;
  return '<path' + cls + ' data-part="shape" d="M' + ax + ' ' + ay + ' L' + bx + ' ' + by +
    ' L' + cx2 + ' ' + cy2 + ' Z" fill="none" ' + stroke + '/>';
}
function propSvg(t, opts) {
  const o = opts || {};
  const r = t.size === 'big' ? 44 : 25;
  const fill = ITEMS[t.color] ? ITEMS[t.color].fill : '#DF5B48';
  const anchor = o.paint ? 'data-paint="1"' : 'data-target="1"';
  /* 分相位作画（paint 演出）：色底=同形状低透明色块 / 轮廓=描线 / 定尺=整体缩放。
     比对定格与目标卡=一次到位（色底+轮廓合成：色块垫底+描边形状盖上层） */
  if (o.ph === 'color') {                    /* 段 1：颜色底淡入（低透明色块） */
    return '<svg viewBox="0 0 120 120" width="118" height="118" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">' +
      '<g ' + anchor + ' data-color="' + t.color + '" data-shape="' + t.shape + '" data-size="' + t.size + '">' +
      shapeEl(t.shape, r, 'color').replace('fill="none"', 'fill="' + fill + '" opacity=".55"') +
      '</g></svg>';
  }
  if (o.ph === 'shape') {                    /* 段 2：形状轮廓描线（dash 动画） */
    return '<svg viewBox="0 0 120 120" width="118" height="118" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">' +
      '<g ' + anchor + ' data-color="' + t.color + '" data-shape="' + t.shape + '" data-size="' + t.size + '">' +
      shapeEl(t.shape, r, 'shape') + '</g></svg>';
  }
  if (o.ph === 'size') {                     /* 段 3：大小缩放定尺（小=zoom 收缩到尺寸） */
    return '<svg viewBox="0 0 120 120" width="118" height="118" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">' +
      '<g ' + anchor + ' data-color="' + t.color + '" data-shape="' + t.shape + '" data-size="' + t.size + '">' +
      '<g class="paint-el ph-size">' + shapeEl(t.shape, r, null).replace('fill="none"', 'fill="' + fill + '"') +
      '</g></g></svg>';
  }
  /* 上面 size 段 transform 缩放基准：.paint-el 已声明 transform-box:fill-box（head CSS） */
  /* 一次到位（目标卡 / compare 定格） */
  return '<svg viewBox="0 0 120 120" width="118" height="118" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">' +
    '<g ' + anchor + ' data-color="' + t.color + '" data-shape="' + t.shape + '" data-size="' + t.size + '">' +
    shapeEl(t.shape, r, null).replace('fill="none"', 'fill="' + fill + '"') +
    '</g></svg>';
}

/* ================= 机器画师 robotpaint 纯引擎：确定性关卡生成 + 五题型判定状态机
   （r18 难度改造 2026-09-18，AUDIT-78 黄款；无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 1151)（本款常量 1151，SPEC-BATCH33 §0.81 定版）：
   同 flat 永远同关（重玩一致、verify 可检）。
   章型（r18：每关 6 题 CH_LEN / 静态 24 关=4 章；进度章号单调递增、难度章号
   dch=1+flat//6 静态四档，生成关 flat≥24 恒 dch=4）：
     dch1 plain 三轴组指令（无 breathe）
     dch2 neg 否定指令 + edit 两步修改（NEG/EDIT_AXES_N=1；无 breathe）
     dch3 mem 记忆复现 + dual 双画师并行（miss≥2 不一致轴块 breathe——首错不指轴）
     dch4 生成：五题型混出（seeded）+ breathe（ch3+ 同档；NEG/EDIT_AXES_N=2）
   rnd 取数顺序钉死（确定性依据，禁改序）：①kind（pool 内 ri 取一）→ ②目标三元组
   （drawTriple：先 color 后 shape 后 size）→ ③kind 附加（edit 各 to 值 / dual 第二目标
   补抽）→ ④块池（三轴组各一次组内 Fisher-Yates——每组消耗 轴长-1 次恒定）。
   铁律：属性三轴互独立（轴内值互异天然成立——封闭集 3/3/2 各取一）；
     块池 r18=轴分组恒续（色 3|形 3|大小 2 连续段）+ 组内 seeded 打乱（防位置查表），
     恒全摆不消耗——指令可编辑；
     neg 排除集=轴封闭集∖{目标值}（补集唯一=目标值——封闭集补全推理可满足）；
     edit 每处修改 from≠to（轴内重抽保证），终态=start∘edits（两步复合可满足）；
     dual 两目标 g1≠g2（seeded 重抽保证——工作记忆分叉）。
   相位：q.phase 'pick'（选块填槽）→ 'paint'（画师作画演出，吞输入）→ 'compare'
   （比对反馈）→ 判对推进（下一题 pick / 末题终态 'won'）；判错 compare→pick
   （槽保留可改——错轴可视化=画师忠实执行，painted 保留供比对）。
   dual 双任务：任务一判对（t1Done=true，painted1 留档）不推进 L.step，
   engAfterConfirm 切任务二（tIdx=1、target=goals[1]、槽复位、phase='pick'）；
   任务二判对才 solved/L.step++（quiz.miss 两任务累计）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 三元组工具 ---------- */
/* drawTriple：rnd 序钉死 color→shape→size（18 组合全域均匀） */
function drawTriple(rnd) {
  return { color: COLORS[ri(rnd, 0, 2)], shape: SHAPES[ri(rnd, 0, 2)], size: SIZES[ri(rnd, 0, 1)] };
}
const sameTriple = (a, b) => !!a && !!b && a.color === b.color && a.shape === b.shape && a.size === b.size;
const tripleInDomain = t => !!t && COLORS.indexOf(t.color) >= 0 && SHAPES.indexOf(t.shape) >= 0 &&
  SIZES.indexOf(t.size) >= 0;
const firstEmpty = slots => { for (let i = 0; i < slots.length; i++) if (!slots[i].val) return i; return slots.length; };
/* r18 块池：轴分组恒续（AXES 序）+ 组内 seeded 打乱（同轴多值干扰恒全摆、
   值-位置查表失效——组内序每题独立于基序） */
function buildBlocks(rnd) {
  const blocks = [];
  AXES.forEach(ax => {
    shuffled(AXIS_POOL[ax], rnd).forEach(v => blocks.push({ axis: ax, val: v }));
  });
  return blocks;
}

/* ---------- 单题构建（五 kind）：rnd 序=①kind ②目标 ③kind 附加 ④块池 ----------
   kind 附加形态：
     neg   negMap={axis:[排除值…]}（排除集=轴封闭集∖{target[axis]}，呈现为打叉芯片）
     edit  start=起始三元组 + edits=[{axis,from,to}…]（from=start[ax]、to 轴内异于 from；
           target=start∘edits——两步修改终态）
     mem   q.mem=true（UI 闪现窗后罩目标——引擎只标记，呈现归 UI）
     dual  goals=[g1,g2]（g1≠g2）；target=g1，任务二在 engAfterConfirm 切为 g2 */
function buildQuiz(dch, rnd) {
  const pool = KIND_POOL[dch];
  const kind = pool[ri(rnd, 0, pool.length - 1)];          /* ①kind */
  const q = {
    kind: kind, mem: kind === 'mem', flashDone: false,
    target: null,
    slots: AXES.map(ax => ({ axis: ax, val: null })),
    slotIdx: 0,
    blocks: null,
    phase: 'pick', painted: null, judged: null,
    miss: 0, solved: false,
    negMap: null, start: null, edits: null,
    goals: null, tIdx: 0, t1Done: false, painted1: null
  };
  q.target = drawTriple(rnd);                              /* ②目标 */
  if (kind === 'neg') {                                    /* ③neg：否定呈现轴 seeded 取 N 个 */
    const negAxes = shuffled(AXES.slice(), rnd).slice(0, NEG_AXES_N[dch]);
    q.negMap = {};
    negAxes.forEach(ax => {
      q.negMap[ax] = AXIS_POOL[ax].filter(v => v !== q.target[ax]);   /* 排除集=补目标 */
    });
  } else if (kind === 'edit') {                            /* ③edit：修改轴 seeded 取 N 个 */
    const edAxes = shuffled(AXES.slice(), rnd).slice(0, EDIT_AXES_N[dch]);
    q.start = { color: q.target.color, shape: q.target.shape, size: q.target.size };
    q.target = { color: q.start.color, shape: q.start.shape, size: q.start.size };
    q.edits = edAxes.map(ax => {
      const others = AXIS_POOL[ax].filter(v => v !== q.start[ax]);
      const to = others[ri(rnd, 0, others.length - 1)];    /* to≠from（轴内重抽） */
      q.target[ax] = to;                                   /* target=start∘edits */
      return { axis: ax, from: q.start[ax], to: to };
    });
  } else if (kind === 'dual') {                            /* ③dual：第二目标补抽至 g1≠g2 */
    let g2 = drawTriple(rnd), guard = 0;
    while (sameTriple(q.target, g2) && guard++ < 20) g2 = drawTriple(rnd);
    q.goals = [{ color: q.target.color, shape: q.target.shape, size: q.target.size }, g2];
  }
  q.blocks = buildBlocks(rnd);                             /* ④块池（组内打乱） */
  q.slotIdx = firstEmpty(q.slots);
  return q;
}

/* ---------- 关卡生成（静态 24 关与生成关同一确定性通道；生成关 flat≥24 恒 dch=4
   ——SPEC §-r18「ch4 生成五题型混出」，无 dch 随机） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 1151);
  const dch = flat < STATIC_LEVELS ? dch0 : 4;
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(dch, rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 教学关（仅 UI 层用：目标=红色大圆形三轴完整流程（点红/圆/大 三块），
   三槽全空（kind='plain' 基础形态——教学展示完整三指令）；SPEC §3 ---------- */
function genTutLevel() {
  const q = {
    kind: 'plain', mem: false, flashDone: false,
    target: { color: 'red', shape: 'cir', size: 'big' },
    slots: AXES.map(ax => ({ axis: ax, val: null })),
    slotIdx: 0,
    blocks: buildBlocks(mulberry32(1)),          /* 固定种子演示块池（轴分组+组内序稳定） */
    phase: 'pick', painted: null, judged: null,
    miss: 0, solved: false,
    negMap: null, start: null, edits: null,
    goals: null, tIdx: 0, t1Done: false, painted1: null
  };
  return { flat: -1, ch: 1, dch: 1, lv: 0, quizzes: [q],
           step: 0, retries: 0, done: false, tutLevel: true };
}

/* ---------- 点块引擎（无 DOM）：engTapBlock(L, i) —— 点第 i 块候选（blocks 下标）
   'fill'  填入当前槽（块轴==当前槽轴且当前槽空）：slots[slotIdx].val=块值、
           播块名音、slotIdx=下一个空槽
   'ready' 末槽填满（三槽满待画——「画！」亮起）
   'wrong-axis' 点异轴块（说得清楚=按槽序说——吞不填，UI 层转 false+轻叮+当前槽 flash）
   null    非法下标 / 非 pick 相位（paint/compare 演出期吞）/ 关卡已结束 ---------- */
function engTapBlock(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.blocks.length) return null;
  if (q.phase !== 'pick') return null;                       /* paint/compare 吞 */
  const b = q.blocks[i];
  const curAx = q.slots[q.slotIdx] ? q.slots[q.slotIdx].axis : null;
  if (!curAx) return null;                                   /* 三槽满（无待填槽） */
  if (b.axis !== curAx) return 'wrong-axis';                 /* 异轴块吞（方向级） */
  q.slots[q.slotIdx].val = b.val;
  q.slotIdx = firstEmpty(q.slots);
  return q.slotIdx >= q.slots.length ? 'ready' : 'fill';
}

/* ---------- 点槽引擎（无 DOM）：engTapSlot(L, i) —— 点第 i 槽（pick 相位）
   'clear' 已填可改槽：清空、slotIdx=i（回该轴选择——指令可编辑，SPEC 明示）
   null    空槽 / 非 pick 相位 / 非法下标（r18 无预填锁定槽） ---------- */
function engTapSlot(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.slots.length) return null;
  if (q.phase !== 'pick') return null;
  const s = q.slots[i];
  if (!s.val) return null;                                   /* 空槽无可清 */
  s.val = null;
  q.slotIdx = i;
  return 'clear';
}

/* ---------- 「画！」引擎相位口（无 DOM）——判定集中 tapGo（SPEC §0.81）
   engToPaint(L)：pick→paint（前置：三槽满）。UI tapGo 入口调用（守卫通过后），
     演出窗=go 1176+3×800+300 ≥3876（paint 相位锁定，SPEC §4）。
   engTapGo(L)：paint→compare + 判定（演出完调用）。产出 painted=三槽值忠实组装
     （错轴可视化依据——不像=指令不精确）：
     { r:'right', painted, last, nextTask } 三元组全对。dual 任务一：t1Done=true、
        painted1 留档、nextTask=true（L.step 不动——engAfterConfirm 切任务二）；
        其余：solved=true、L.step++/L.done 推进，last=末题——UI 返回 'done'（教学关除外）
     { r:'wrong', painted } 任一属性错（miss+1（dual 两任务累计），槽保留可改——
        engine 不清槽；UI 演出错链后 engBackToPick 回 pick 供改槽重画）
     null 相位不符 / 已解题 / 关卡已结束。
   engAfterConfirm(L)：对题确认链演出完——dual 任务一（t1Done 且未 solved 且仍在
     compare）切任务二（tIdx=1、target=goals[1]、槽/painted 复位、phase='pick'）；
     其余=已推进的末解题（quizzes[L.step-1]）本题终态 phase='won'（末题 quiz getter
     仍可读：done 后返回末题，phase='won'）。
   engBackToPick(L)：错题反馈完——compare→pick（槽保留、painted/judged 保留供比对）。 */
function engToPaint(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return false;
  const q = L.quizzes[L.step];
  if (!q || q.solved || q.phase !== 'pick') return false;
  if (firstEmpty(q.slots) < q.slots.length) return false;    /* 三槽未满不可画 */
  q.phase = 'paint';
  return true;
}
function engTapGo(L) {
  if (!L || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved) return null;
  if (q.phase !== 'paint') return null;
  const painted = { color: q.slots[0].val, shape: q.slots[1].val, size: q.slots[2].val };
  const ok = painted.color === q.target.color &&
             painted.shape === q.target.shape &&
             painted.size === q.target.size;
  q.painted = painted;                                       /* 忠实执行（错轴可视化） */
  q.phase = 'compare';
  if (ok) {
    q.judged = 'like';
    if (q.kind === 'dual' && q.tIdx === 0) {                 /* dual 任务一：不推进 step */
      q.t1Done = true;
      q.painted1 = { color: painted.color, shape: painted.shape, size: painted.size };
      return { r: 'right', painted: painted, last: false, nextTask: true };
    }
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return { r: 'right', painted: painted, last: L.done };
  }
  q.judged = 'diff';
  q.miss++;
  L.retries++;
  return { r: 'wrong', painted: painted, last: false };
}
function engAfterConfirm(L) {
  if (!L || L.step > L.quizzes.length) return false;
  const qd = L.quizzes[L.step];                              /* dual 任务一（step 未推进） */
  if (qd && qd.kind === 'dual' && qd.t1Done && !qd.solved && qd.phase === 'compare') {
    qd.tIdx = 1;
    qd.target = { color: qd.goals[1].color, shape: qd.goals[1].shape, size: qd.goals[1].size };
    qd.slots = AXES.map(ax => ({ axis: ax, val: null }));
    qd.slotIdx = 0;
    qd.painted = null;                                       /* painted1 已留档（画布A定格） */
    qd.judged = null;
    qd.phase = 'pick';
    return true;
  }
  if (!L.step) return false;
  const q = L.quizzes[L.step - 1];                           /* 已推进的末解题 */
  if (!q || !q.solved || q.phase !== 'compare') return false;
  q.phase = 'won';
  return true;
}
function engBackToPick(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return false;
  const q = L.quizzes[L.step];
  if (!q || q.solved || q.phase !== 'compare') return false;
  q.phase = 'pick';
  return true;
}

/* 不一致轴清单（wrong 后 miss≥2 答案级 breathe/比对 pulse 共用：ch3+ 才启用；
   dual 任务二=对当前 target 比对——q.target 已切 goals[1]） */
function diffAxes(q) {
  if (!q || !q.painted) return [];
  return AXES.filter(ax => q.painted[ax] !== q.target[ax]);
}
/* 轴的应选块下标（答案级 breathe/教学帮指/autoSolve 共用：当前待填槽轴的目标值块） */
function correctIdx(q) {
  if (!q || q.solved || q.phase !== 'pick') return -1;
  const ax = q.slots[q.slotIdx] ? q.slots[q.slotIdx].axis : null;
  if (!ax) return -1;
  for (let j = 0; j < q.blocks.length; j++)
    if (q.blocks[j].axis === ax && q.blocks[j].val === q.target[ax]) return j;
  return -1;
}
const engWon = L => !!L && L.done;
/* 星级（miss 口径）：全关错画 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));

/* ---------- 结构校验（verify 用，返回失败原因或 null）：题型域 / kind 先验独立复算
   （neg 排除补全唯一 / edit 复合终态 / dual g1≠g2）/ 块池轴分组恒续+组内封闭集全量 /
   槽初始态干净 / kind 字段无泄漏 ---------- */
function structWhy(q, dch) {
  if (!q) return 'quiz';
  if (q.phase !== 'pick' || q.painted !== null || q.judged !== null ||
      q.miss !== 0 || q.solved || q.tIdx !== 0 || q.t1Done || q.painted1 !== null) return 'init';
  if (q.flashDone !== false) return 'initFlash';
  if (KIND_POOL[dch].indexOf(q.kind) < 0) return 'kind';     /* 章题型池 */
  if (!tripleInDomain(q.target)) return 'targetPool';
  if (q.kind === 'neg') {
    const negAxes = Object.keys(q.negMap || {});
    if (negAxes.length !== NEG_AXES_N[dch]) return 'negCount';
    for (const ax of negAxes) {
      if (AXES.indexOf(ax) < 0) return 'negAxis';
      const excl = q.negMap[ax];
      const rest = AXIS_POOL[ax].filter(v => excl.indexOf(v) < 0);
      /* 排除集=轴封闭集∖{目标值} → 补集唯一且=目标值（推理可满足性先验） */
      if (rest.length !== 1 || rest[0] !== q.target[ax]) return 'negExcl';
      if (excl.indexOf(q.target[ax]) >= 0) return 'negSelf';
    }
  }
  if (q.kind === 'edit') {
    if (!tripleInDomain(q.start)) return 'startPool';
    if (!Array.isArray(q.edits) || q.edits.length !== EDIT_AXES_N[dch]) return 'editCount';
    const fin = { color: q.start.color, shape: q.start.shape, size: q.start.size };
    for (const e of q.edits) {
      if (AXES.indexOf(e.axis) < 0) return 'editAxis';
      if (e.from !== q.start[e.axis]) return 'editFrom';
      if (e.to === e.from || AXIS_POOL[e.axis].indexOf(e.to) < 0) return 'editTo';
      fin[e.axis] = e.to;
    }
    /* 终态=start∘edits（两步复合——verify 独立复算同构） */
    if (fin.color !== q.target.color || fin.shape !== q.target.shape ||
        fin.size !== q.target.size) return 'editCompose';
  }
  if (q.kind === 'mem' && !q.mem) return 'memFlag';
  if (q.kind === 'dual') {
    if (!q.goals || q.goals.length !== 2) return 'dualGoals';
    if (!tripleInDomain(q.goals[0]) || !tripleInDomain(q.goals[1])) return 'dualPool';
    if (sameTriple(q.goals[0], q.goals[1])) return 'dualSame';
    if (q.target.color !== q.goals[0].color || q.target.shape !== q.goals[0].shape ||
        q.target.size !== q.goals[0].size) return 'dualCur';
  }
  /* kind 字段泄漏（非本题型不得携带其结构） */
  if (q.kind !== 'neg' && q.negMap) return 'negLeak';
  if (q.kind !== 'edit' && (q.start || q.edits)) return 'editLeak';
  if (q.kind !== 'dual' && (q.goals || q.painted1)) return 'dualLeak';
  if (q.kind !== 'mem' && q.mem) return 'memLeak';

  for (const ax of AXES) {

    const seg = q.blocks.slice(off, off + n);

    const got = seg.map(b => b.val).sort().join(',');
    const want = AXIS_POOL[ax].slice().sort().join(',');

/* ================= 点块主路径（真实点击 / RP.tapBlock / autoSolve / 教学演示共用）

/* ================= 「画！」主路径（RP.tapGo / autoSolve / 教学演示共用）
   判定集中点：三槽满+pick → paint 作画演出（go 1176+3×800，锁定窗 ≥3876）→
   compare 比对（like 前导+确认链 / wrong 错链+豁免窗 5010）；
   豁免窗 guard（契约 I 补，真时钟禁 SPEED 缩水窗）：窗内重画吞（错链播完才可重画）；
   dual 任务一判对=确认链后 engAfterConfirm 切任务二（槽复位重选）；edit 起始画在
   pick 相位已定格画布（重画=改指令覆盖之）。 ================= */
async function uiTapGo(demo) {
  if (!cur || state.won) {                       // 通关终态吞（真实点击兜底）
    sfx('pop');

  await wait(GO_MS * SPEED);

  }

    state.locked = false;

    renderQuiz();                                 /* 目标侧同步（mem 再罩/neg·edit 保持揭示） */
    if (q.miss >= 2) showDiffHelp(q);             /* 答案级：miss≥2 才指错轴（ch3+）——渲染后加（防重绘清 breathe） */
    return res.r;

  chimeGoal();

  KIDS.voice.play(VOICE.like.key, VOICE.like.text);   /* rp_like：画得真像（1752ms） */
  await wait(LIKE_WIN * SPEED);                   /* ≥1752+300 前导窗 */
  if (token !== paintRun || cur !== run) return 'right';

  KIDS.voice.queue([VOICE.right.key].concat(names));   /* 确认链=right 首段+名音按槽序（全 clip） */
  await wait(CONFIRM_WIN * SPEED);                    /* 链实长+300=8634（恒三段） */
  if (token !== paintRun || cur !== run) return 'right';

  if (run.tutLevel) return 'right';               /* 教学演示完成——交接由 tutorialWatch 接管 */
  if (engWon(run)) { winFlow(); return 'done'; }  /* 末题末槽=通关 */

/* ================= 过关推进（celebrate → level.pass → 章末/日末）

function nextHint(flat) {
  const f = flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关章型 GEN[dch-1]（家族 F：
     genLevel 纯函数确定性，同 flat 恒同 dch——预告与实际章型恒一致，禁 (ci+1)%4） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  paintRun++;
  flashRun++;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(async () => {
    await wait(400);
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, LV_ALL);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const starsN = LV_ALL.reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: starsN, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) });   /* 家族 A：winFlow 传 lim-1（原 null 实参形态废止） */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}

  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {

}

  const memLen = SPEC_MEM_TEXT.length;                                            // 17 全字符
  const winFlash = FLASH_WIN === estMs(memLen) + 300 && estMs(memLen) === 6465 &&
                   FLASH_WIN === 6765;                                            // 家族 T 实算（§-r18）
  const winOpen = voiceWinMs({ kind: 'plain' }) === D.rp_q + 300 &&               // 开题窗=clip+300
                  voiceWinMs({ kind: 'neg' }) === D.rp_neg + 300 &&
                  voiceWinMs({ kind: 'edit' }) === D.rp_edit + 300 &&
                  voiceWinMs({ kind: 'dual' }) === D.rp_dual + 300 &&
                  voiceWinMs({ kind: 'mem' }) === FLASH_WIN;
  /* 页面常量钉死（防漂移——实现常量与 SPEC 恒等式双核对） */
  const constOk = PAINT_WIN === 3876 && LIKE_WIN === 2052 && CONFIRM_WIN === 8634 &&
                  WRONG_CHAIN_MS === 5010 && GO_MS === 1176 &&
                  PAINT_STEP_MS === 800 && MAX_NAME_DUR === D.rp_n_tri &&
                  MEM_TEXT === SPEC_MEM_TEXT;
  T('win:paint', winPaint && PAINT_WIN === 3876);
  T('win:like', winLike);
  T('win:conf', winConf && CONFIRM_WIN === 8634);
  T('win:wrong', winWrong && WRONG_CHAIN_MS === 5010);
  T('win:watch', winWatch);
  T('win:turn', winTurn);
  T('win:flash', winFlash);
  T('win:openers', winOpen);
  T('win:consts', constOk);
  units.estWin = { ok: winPaint && winLike && winConf && winWrong && winWatch &&
                          winTurn && winFlash && winOpen && constOk,
                   flash: FLASH_WIN };

  /* ---- ⑯ 时长模型钉死（verify 侧独立推导；selftest 双钉对账） ---- */
  const PERF = 1176 + 3 * 800 + 2052 + 8634;                 // PERF_RIGHT_MS=14262（判对演出链实码）
  const m0 = modeled(0);
  let minModeled = Infinity;
  const voiceOkAll = [], levelMinOk = [];
  for (let flat = 0; flat < 40; flat++) {
    const L = genLevel(flat);
    const m = levelDurMs(L);
    if (m < minModeled) minModeled = m;
    levelMinOk.push(m >= LEVEL_MIN_MS);
    for (const q of L.quizzes) voiceOkAll.push(voiceWinMs(q) <= DECIDE_MS[q.kind]);
  }
  const mdOk = m0 === SPEC_MODELED_MIN && minModeled === SPEC_MODELED_MIN &&   // 最低=ch1 全 plain 关
    m0 === 900 + SPEC_CH_LEN * (SPEC_DECIDE.plain + PERF) &&                   // 独立推导恒等式
    PERF_RIGHT_MS === PERF &&
    DECIDE_MS.plain === SPEC_DECIDE.plain && DECIDE_MS.neg === SPEC_DECIDE.neg &&
    DECIDE_MS.edit === SPEC_DECIDE.edit && DECIDE_MS.mem === SPEC_DECIDE.mem &&
    DECIDE_MS.dual === SPEC_DECIDE.dual &&
    voiceOkAll.every(Boolean) && levelMinOk.every(Boolean);
  T('modeled:flat0', m0 === SPEC_MODELED_MIN);
  T('modeled:min40', minModeled === SPEC_MODELED_MIN);
  T('model:identity', PERF_RIGHT_MS === PERF &&
    m0 === 900 + SPEC_CH_LEN * (SPEC_DECIDE.plain + PERF));
  T('model:decide-voiceWin', voiceOkAll.every(Boolean) && levelMinOk.every(Boolean));
  units.modeled = { ok: mdOk, flat0: m0, min: minModeled, perfect: PERF_RIGHT_MS };

  /* ---- ⑰ verify 提速断言（SPEED + CSS --t 换算生效） ---- */
  const tVar = getComputedStyle(document.documentElement).getPropertyValue('--t').trim();
  const speedOk = SPEED === 0.12 && (tVar === '0.12' || Math.abs(parseFloat(tVar) - 0.12) < 1e-6);
  T('speed', speedOk);
  units.speed = { ok: speedOk, SPEED: SPEED, tVar: tVar };

  const out = { game: 'robotpaint', total: total, pass: npass, layoutOk: layoutOk,
                failList: units.__failList || [], levels: levels, gen: gen,
                units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__rpVlog = out;                          // 外部断言挂点（任务书钩子）
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text（__lastVoiceKey/__lastVoiceText）；
     voice.queue 记录拼播链（__lastQueue，含 keyless 对象段）供反馈链/确认链/闪现链断言 */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) { window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null; };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    window.__lastVoiceKey = parts && parts.length
      ? (typeof parts[0] === 'string' ? parts[0] : (parts[0] && parts[0].key)) : null;
  };
  runVerify();
}

</script>
