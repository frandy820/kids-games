<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>方位词图阵</title>
<style>
/* ================= 方位词图阵 position（batch33·扩容批 3；r44 难度改造 SPEC-R44-POSITION）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 树居中场景 + 六方位格（浅色虚线框，r44 起恒全摆 6 格含左右——v1 ch1-2 4 格域退役）
   + 题面句（ps_q1「兔子在树的哪里呀」/ placepos=全句指令 / dual=双参照复合句 / flip=转身问句）。
   题型四族（SPEC-R44 §R1）：findpos（点兔子所在格答方位——教学锚+热身）/
   placepos（「把兔子放到树的X」全句指令→点目标格，兔子飞入）/
   dual（ch3+：房子渲染左下/右下，「兔子藏在树的X，也在房子的Y」——兔子隐藏，点对 pop 出现）/
   flip（ch4+：兔子背面态坐非答案格，「它的X边是树的哪边」→180° 转身映射
   left↔right/front↔back/up·down 恒等）。
   参照系=孩子视角为主线（画面左右=孩子左右）；dual 局部引入房参照换算；
   遮挡语义：前格兔子盖树干下段（z 30>树 20）/后格树盖兔子（z 10<树 20，近大远小 0.58x）；
   上=树冠上格/下=树根下格/左右=树两侧；房子 z=15（几何与六格零重叠，z 仅保险）。
   触摸目标：方位格 ≥96×96（横竖双档核）；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：树+六方位格场景（主点选区）+ 题面句条 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:4px 12px}

/* 场景垫：暖色森林垫，树 SVG 铺满 + 方位格浮层；点空白=重听题面 */
#scene{position:relative;flex:0 0 auto;width:min(420px,92vw,calc((100vh - 215px)*0.673));
  aspect-ratio:330/490;border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,#FDF3DC 0%,#F3E7C2 62%,#E9DCB4 100%);
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;cursor:pointer}
#scene.pulse{animation:ps-scene 1.1s ease-in-out 3}
@keyframes ps-scene{0%,100%{box-shadow:0 4px 0 #D8C9B4}50%{box-shadow:0 0 0 10px rgba(232,151,90,.4)}}
#tree-svg{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}

/* 方位格层：z 序承载遮挡语义——back 格 10（树盖兔子）< 树 20 < 其余格 30（兔子盖树干下段）。
   #cells 禁设 z-index（z-index≠auto 会自建栈上下文→整层被树 20 盖住，前后遮挡全失效）；
   容器 bump 动画挂 #scene（transform 也会建栈上下文，挂 #cells 同样闪遮挡，挂 #scene 内部相对序不变） */
#cells{position:absolute;inset:0;pointer-events:none}
#scene.bump{animation:ps-bump .22s ease}
@keyframes ps-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
.cell{position:absolute;border-radius:16px;border:3px dashed #C9B48A;background:rgba(255,249,238,.42);
  z-index:30;pointer-events:auto;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.cell:active{transform:scale(.96)}
.cell.pos-back{z-index:10}
.cell .bunny{width:78%;display:flex;justify-content:center;pointer-events:none}
.cell .bunny svg{width:100%;height:auto}
.cell.pos-front .bunny{width:90%}
.cell.pos-back .bunny{width:58%}
.cell.pos-left .bunny,.cell.pos-right .bunny{width:80%}
.cell.pos-up .bunny{width:84%}
.cell.pos-down .bunny{width:76%}
.cell.lit{border-color:#E8975A;background:rgba(253,239,220,.85);
  animation:ps-lit .5s ease}
@keyframes ps-lit{0%,100%{transform:scale(1)}45%{transform:scale(1.06)}}
.cell.wig{animation:ps-wig .4s ease}
@keyframes ps-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
.cell .bunny.pulse{animation:ps-bun 1.1s ease-in-out 3}
@keyframes ps-bun{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.cell.breathe{animation:ps-cell-br 1.2s ease-in-out infinite}
@keyframes ps-cell-br{0%,100%{border-color:#C9B48A;box-shadow:none}50%{border-color:#E8975A;
  box-shadow:0 0 14px rgba(232,151,90,.85);background:rgba(253,239,220,.9)}}
.cell.pop-in{animation:ps-pop .4s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes ps-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
/* 兔子飞入（placepos 点对）：克隆兔子跨格飞越 */
.bunny-fly{position:absolute;z-index:40;pointer-events:none;display:flex;justify-content:center;
  transition:left .45s cubic-bezier(.3,.9,.4,1),top .45s cubic-bezier(.3,.9,.4,1),width .45s ease}
/* ---------- r44 dual 房子（第二参照物）：z=15 树 20 之下（几何与六格零重叠——
   SPEC-R44 §R1 论证：left-down x[18,102] 与 down 格 x[113,217] 不交/y 与 left 格不交）；
   pointer-events:none=参照物非作答面（点击落 sceneEl 空白=重听题面路径） ---------- */
#house{position:absolute;z-index:15;pointer-events:none}
#house svg{width:100%;height:100%;display:block}
#house.pulse{animation:ps-house 1.1s ease-in-out 3}
@keyframes ps-house{0%,100%{filter:none}50%{filter:drop-shadow(0 0 9px rgba(232,151,90,.95))}}
/* r44 flip 背面兔：格内背面态（.bunny.back），与正面兔同槽同尺寸；
   data-face="back" 挂格 cell（帧内容朝向锚——契约 M） */
.cell .bunny.back svg{width:100%;height:auto}

/* 题面句条（findpos 问句 / placepos 全句指令 / 答对后确认句） */
#qbar{flex:0 0 auto;max-width:94vw}
#qbar .q-text{font-size:21px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}
#qbar.jump{animation:ps-qjump .5s ease 2}
@keyframes ps-qjump{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-32） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：场景收紧，方位格仍 ≥96×96 */
@media (orientation:portrait){
  #scene{width:min(340px,94vw)}
  #qbar .q-text{font-size:18px;padding:3px 14px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="方位词图阵">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="树和方位格场景，点空白再听一遍">
      <svg id="tree-svg" viewBox="0 0 330 490" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="cells" aria-label="方位格"></div>
      <div id="house" aria-hidden="true"></div>
    </div>
    <div id="qbar"><div class="q-text"></div></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
