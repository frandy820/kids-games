<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>听音计数</title>
<style>
/* ================= 听音计数 soundcount（batch33·扩容批 3）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 播击段（鼓图逐击 bounce 视锚恒在——5-6 岁降坡核心，不随章撤；
   countmix 铛=干扰音色身份图，恒静态不 bounce——视锚同选择性）
   + 问句（sc_q1「敲了几下呀」/sc_q2「鼓敲了几下」）
   + 数字卡点选（数字大字+对应点数圆点=数学符号双通道，零文字墙）。
   题型三族（SPEC-BATCH33 §0.79 + SPEC-R24-SOUNDCOUNT）：counthear（鼓 N 下→选数字卡）/
   countmix（ch3：鼓 N+铃 M 混排，只数鼓）/ countdual（r24 ch4：鼓铃混排双问两步作答）。
   数字域 1-10（r24 大域 6-10）；候选互异含真值（ch1 2/ch2 3/ch3+ 4 卡）；击段间 700ms 可数节奏。
   章：ch1 N∈2-3 / ch2 N∈3-4（全 counthear）/ ch3 countmix / ch4 纯听+大域+双问固定谱（seeded 733）。
   触摸目标：数字卡 ≥96×96、鼓图 ≥120 高；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：击段题面（鼓视锚+铃身份图+问句条） + 数字卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}

/* 题面：暖色舞台垫 + 鼓大图（逐击 bounce 视锚）+ countmix 铃身份图（静态）+ 问句文字条 */
#scene{flex:0 0 auto;position:relative;width:min(420px,92vw);min-height:216px;border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F8E7C2 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene .stage-props{position:relative;display:flex;align-items:flex-end;justify-content:center;
  gap:22px;min-height:150px}
#drum-wrap{position:relative;display:flex;align-items:flex-end;justify-content:center}
#drum-wrap svg{width:150px;height:150px}
#drum-wrap .drum-shadow{position:absolute;left:50%;bottom:0;width:118px;height:15px;
  border-radius:50%;background:#EAD3A8;opacity:.75;transform:translateX(-50%)}
/* 鼓击视锚：逐击 bounce（重放类动画，播放器逐击驱动——契约 M 帧内容断言锚） */
#drum-wrap.bounce{animation:drum-b .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes drum-b{0%{transform:scale(1)}40%{transform:scale(1.14) translateY(-9px)}100%{transform:scale(1)}}
#bell-wrap{display:none;align-items:flex-end;opacity:.95;position:relative}
#scene[data-kind="countmix"] #bell-wrap,
#scene[data-kind="countdual"] #bell-wrap{display:flex}   /* r24 countdual 双音色在场 */
#bell-wrap svg{width:86px;height:86px}
#bell-wrap .bell-shadow{position:absolute;left:50%;bottom:0;width:64px;height:11px;
  border-radius:50%;background:#EAD3A8;opacity:.6;transform:translateX(-50%)}
/* r24 countdual 双步：当前问谁谁满亮（另侧降不透明度——pre-literate 可辨） */
#scene[data-kind="countdual"][data-phase="0"] #bell-wrap{opacity:.45}
#scene[data-kind="countdual"][data-phase="1"] #drum-wrap{opacity:.45}
/* r24 纯听耳徽标：dch4 播放期显示（.listening 挂/摘由播放器驱动）——仅标志播放窗口，
   零逐击信息（撤视锚核心：听觉计数必经通道） */
#scene .listen-badge{display:none;position:absolute;top:10px;right:10px;align-items:center;gap:5px;
  padding:4px 10px;border-radius:13px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 3px 0 #D8C9B4;font-size:15px;font-weight:700;pointer-events:none;z-index:5}
#scene.listening .listen-badge{display:flex;animation:sc-pulse 1.1s ease-in-out infinite}
#scene .listen-badge svg{width:26px;height:26px}
#scene .q-text{font-size:21px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}
#scene.pulse{animation:sc-pulse 1.1s ease-in-out 3}
@keyframes sc-pulse{0%,100%{box-shadow:0 4px 0 #D8C9B4}50%{box-shadow:0 0 0 10px rgba(232,151,90,.4)}}
#scene .demo-pet{position:absolute;right:10px;bottom:8px;opacity:0;transform:translateX(24px);
  transition:all .5s cubic-bezier(.2,1.4,.4,1)}
#scene .demo-pet.show{opacity:1;transform:translateX(0)}

/* ---------- 数字卡排（主答案按钮 ≥96×96；ch1 2 卡/ch2 3 卡居中）
   卡面=数字大字+对应点数圆点（数学符号，零文字墙——SPEC §0.79 允许） ---------- */
#board{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:14px;max-width:760px;padding:2px 4px}
#board.bump{animation:bd-bump .22s ease}
@keyframes bd-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;width:138px;min-height:128px;border-radius:20px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;padding:8px 6px;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card svg{width:104px;height:104px;pointer-events:none}
.card.pop{animation:card-in .4s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes card-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.card.lit{border-color:#E8975A;background:#FDEFDC;
  animation:card-lit .5s ease}
@keyframes card-lit{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
.card.wig{animation:card-wig .4s ease}
@keyframes card-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
.card.breathe{animation:card-br 1.2s ease-in-out infinite}
@keyframes card-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.05)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-32） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：题面/卡收紧，主答案卡仍 ≥96 */
@media (orientation:portrait){
  #scene{width:min(340px,94vw);min-height:196px}
  #scene .stage-props{min-height:124px;gap:14px}
  #drum-wrap svg{width:124px;height:124px}
  #bell-wrap svg{width:72px;height:72px}
  #scene .q-text{font-size:18px;padding:3px 14px}
  #board{gap:11px}
  .card{width:124px;min-height:112px}
  .card svg{width:90px;height:90px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="听音计数">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="题面，点我再听一遍"></button>
    <div id="board" aria-label="数字卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
