<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>听音计数</title>
<style>
/* ================= 听音计数 soundcount（batch33·扩容批 3）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 播击段（鼓图逐击 bounce 视锚恒在——5-6 岁降坡核心，不随章撤；
   countmix 铛=干扰音色身份图，恒静态不 bounce——视锚同选择性）
   + 问句（sc_q1「敲了几下呀」/sc_q2「鼓敲了几下」）
   + 数字卡点选（数字大字+对应点数圆点=数学符号双通道，零文字墙）。
   题型三族（SPEC-BATCH33 §0.79 + SPEC-R24-SOUNDCOUNT）：counthear（鼓 N 下→选数字卡）/
   countmix（ch3：鼓 N+铃 M 混排，只数鼓）/ countdual（r24 ch4：鼓铃混排双问两步作答）。
   数字域 1-10（r24 大域 6-10）；候选互异含真值（ch1 2/ch2 3/ch3+ 4 卡）；击段间 700ms 可数节奏。
   章：ch1 N∈2-3 / ch2 N∈3-4（全 counthear）/ ch3 countmix / ch4 纯听+大域+双问固定谱（seeded 733）。
   触摸目标：数字卡 ≥96×96、鼓图 ≥120 高；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：击段题面（鼓视锚+铃身份图+问句条） + 数字卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}

/* 题面：暖色舞台垫 + 鼓大图（逐击 bounce 视锚）+ countmix 铃身份图（静态）+ 问句文字条 */
#scene{flex:0 0 auto;position:relative;width:min(420px,92vw);min-height:216px;border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F8E7C2 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene .stage-props{position:relative;display:flex;align-items:flex-end;justify-content:center;
  gap:22px;min-height:150px}
#drum-wrap{position:relative;display:flex;align-items:flex-end;justify-content:center}
#drum-wrap svg{width:150px;height:150px}
#drum-wrap .drum-shadow{position:absolute;left:50%;bottom:0;width:118px;height:15px;
  border-radius:50%;background:#EAD3A8;opacity:.75;transform:translateX(-50%)}
/* 鼓击视锚：逐击 bounce（重放类动画，播放器逐击驱动——契约 M 帧内容断言锚） */
#drum-wrap.bounce{animation:drum-b .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes drum-b{0%{transform:scale(1)}40%{transform:scale(1.14) translateY(-9px)}100%{transform:scale(1)}}
#bell-wrap{display:none;align-items:flex-end;opacity:.95;position:relative}
#scene[data-kind="countmix"] #bell-wrap,
#scene[data-kind="countdual"] #bell-wrap{display:flex}   /* r24 countdual 双音色在场 */
#bell-wrap svg{width:86px;height:86px}
#bell-wrap .bell-shadow{position:absolute;left:50%;bottom:0;width:64px;height:11px;
  border-radius:50%;background:#EAD3A8;opacity:.6;transform:translateX(-50%)}
/* r24 countdual 双步：当前问谁谁满亮（另侧降不透明度——pre-literate 可辨） */
#scene[data-kind="countdual"][data-phase="0"] #bell-wrap{opacity:.45}
#scene[data-kind="countdual"][data-phase="1"] #drum-wrap{opacity:.45}
/* r24 纯听耳徽标：dch4 播放期显示（.listening 挂/摘由播放器驱动）——仅标志播放窗口，
   零逐击信息（撤视锚核心：听觉计数必经通道） */
#scene .listen-badge{display:none;position:absolute;top:10px;right:10px;align-items:center;gap:5px;
  padding:4px 10px;border-radius:13px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 3px 0 #D8C9B4;font-size:15px;font-weight:700;pointer-events:none;z-index:5}
#scene.listening .listen-badge{display:flex;animation:sc-pulse 1.1s ease-in-out infinite}
#scene .listen-badge svg{width:26px;height:26px}
#scene .q-text{font-size:21px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}
#scene.pulse{animation:sc-pulse 1.1s ease-in-out 3}
@keyframes sc-pulse{0%,100%{box-shadow:0 4px 0 #D8C9B4}50%{box-shadow:0 0 0 10px rgba(232,151,90,.4)}}
#scene .demo-pet{position:absolute;right:10px;bottom:8px;opacity:0;transform:translateX(24px);
  transition:all .5s cubic-bezier(.2,1.4,.4,1)}
#scene .demo-pet.show{opacity:1;transform:translateX(0)}

/* ---------- 数字卡排（主答案按钮 ≥96×96；ch1 2 卡/ch2 3 卡居中）
   卡面=数字大字+对应点数圆点（数学符号，零文字墙——SPEC §0.79 允许） ---------- */
#board{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:14px;max-width:760px;padding:2px 4px}
#board.bump{animation:bd-bump .22s ease}
@keyframes bd-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;width:138px;min-height:128px;border-radius:20px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;padding:8px 6px;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card svg{width:104px;height:104px;pointer-events:none}
.card.pop{animation:card-in .4s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes card-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.card.lit{border-color:#E8975A;background:#FDEFDC;
  animation:card-lit .5s ease}
@keyframes card-lit{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
.card.wig{animation:card-wig .4s ease}
@keyframes card-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
.card.breathe{animation:card-br 1.2s ease-in-out infinite}
@keyframes card-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.05)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-32） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：题面/卡收紧，主答案卡仍 ≥96 */
@media (orientation:portrait){
  #scene{width:min(340px,94vw);min-height:196px}
  #scene .stage-props{min-height:124px;gap:14px}
  #drum-wrap svg{width:124px;height:124px}
  #bell-wrap svg{width:72px;height:72px}
  #scene .q-text{font-size:18px;padding:3px 14px}
  #board{gap:11px}
  .card{width:124px;min-height:112px}
  .card svg{width:90px;height:90px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="听音计数">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="题面，点我再听一遍"></button>
    <div id="board" aria-label="数字卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

/* ================= soundcount 纯引擎：确定性关卡生成 + 数字卡点选判定（无 DOM，UI 与 verify 共用）

   同 flat 永远同关（重玩一致、verify 可检）。
   章型（SPEC-BATCH33 §0.79 + SPEC-R24-SOUNDCOUNT r24 修订；进度章号单调递增、
   难度章号 dch=1+flat//5 静态四档）：
     dch1 counthear 5 连 · N∈[2,3] · 2 候选数字卡（基线原样）
     dch2 counthear 5 连 · N∈[3,4] · 3 候选（基线原样）
     dch3 countmix 5 连 · N∈[3,5]+M∈[1,2] 且 N+M≤6 · 4 候选（选择性计数只数鼓；基线原样）
     dch4 r24 固定谱 qi0/2/4=counthear N∈[6,10]（候选⊆{6..10}，量域上探）
          + qi1/3=countdual N∈[3,5]≠M∈[2,4]（候选⊆{1..5} 含双真值，双音色双问两步作答）
          ——两形态每关恒在场（确定性谱替代旧逐题掷币混出；countmix 单独形态留 dch3）
   quiz 结构：{ kind, count(鼓次数真值), mix(铃次数，counthear=0), phase(countdual 0=问鼓/1=问铃),
     seq(击序数组 'd'=鼓/'b'=铃——countmix/countdual 洗牌混排，音色间可相邻), opts[{num}],
     answer(真值卡下标=count 卡；countdual 第二步真值卡按 phase 求值见 ansIdxOf), _miss, _answered }
   铁律：数字卡互异含真值（counthear-dch4 ⊆{6..10}，余 ⊆{1..5}；countdual 恒含 count 与 mix）；
   seq 击数对账（'d' 数==count 且 'b' 数==mix 且长度==count+mix；counthear seq 恒全 'd'）。 */
function mulberry32(a) {

function shuffled(arr, rnd) {

const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 单题构建：kind 由章型/谱位先行定（各域互不越界） ---------- */
function buildQuiz(kind, dch, rnd) {
  let count, mix;
  if (kind === 'counthear') {
    count = dch === 1 ? ri(rnd, 2, 3) : dch === 2 ? ri(rnd, 3, 4)
           : dch === 4 ? ri(rnd, 6, 10) : ri(rnd, 2, 5);   // r24：dch4 大域腿 6-10
    mix = 0;
  } else if (kind === 'countdual') {         // r24 双音色双问：N∈3-5 鼓 + M∈2-4 铃 且 N≠M
    count = ri(rnd, 3, 5);
    mix = ri(rnd, 2, 4);
    if (mix === count) mix = (count === 3 ? 4 : count === 4 ? 3 : 2);   // 同掷值定值替换（域内且 ≠N）
  } else {                                   // countmix：N∈3-5+M∈1-2 且 N+M≤6（dch3 专用）
    count = ri(rnd, 3, 5);
    mix = ri(rnd, 1, 2);
    if (count + mix > 6) mix = 6 - count;    // 先验钳制（count≤5 → mix≥1 恒成立）
  }
  /* 击序：counthear 恒全 'd'；countmix/countdual 洗牌混排（音色间可相邻——随机序不刻意隔开） */
  const seq = kind === 'counthear'
    ? Array.from({ length: count }, () => 'd')
    : shuffled(Array.from({ length: count }, () => 'd')
        .concat(Array.from({ length: mix }, () => 'b')), rnd);
  /* 候选：真值 + 数字域干扰补齐（互异含真值；ch1 2/ch2 3/ch3+ 4 卡。
     r24：dch4 counthear 候选 ⊆{6..10} 大域带（近失区间）；countdual 候选 ⊆{1..5} 恒含双真值 */
  let picks;

    picks = [count, mix].concat(
      shuffled(NUMS5.filter(x => x !== count && x !== mix), rnd).slice(0, 2));
  } else if (kind === 'counthear' && dch === 4) {
    picks = [count].concat(shuffled(NUMS_HI.filter(x => x !== count), rnd).slice(0, 3));
  } else {
    const nOpt = dch === 1 ? 2 : dch === 2 ? 3 : 4;
    picks = [count].concat(shuffled(NUMS5.filter(x => x !== count), rnd).slice(0, nOpt - 1));
  }
  const order = shuffled(picks, rnd);
  const opts = order.map(x => ({ num: x }));
  let answer = -1;
  for (let j = 0; j < order.length; j++) if (order[j] === count) answer = j;
  const quiz = { kind: kind, count: count, mix: mix, seq: seq,

  if (kind === 'countdual') quiz.phase = 0;  // r24 两步：初始 0=问鼓（对则转 1=问铃）
  return quiz;
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关随机章参数）
   dch4 r24 固定谱：qi0/2/4=counthear 大域 + qi1/3=countdual（两形态每关恒在场——
   确定性谱替代旧逐题掷币+全同翻 1；两族混出训练值由 countdual 承载，countmix 单独
   形态留 dch3）；建题按 kind 走各自域先验——域互不污染 ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 733);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  let kinds;
  if (dch === 4) {
    kinds = [];
    for (let qi = 0; qi < CH_LEN; qi++)
      kinds.push(qi % 2 === 0 ? 'counthear' : 'countdual');  // r24 固定谱（SPEC-R24 §R3）
  } else kinds = Array.from({ length: CH_LEN },
    () => dch === 3 ? 'countmix' : 'counthear');
  const quizzes = kinds.map(k => buildQuiz(k, dch, rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- r24 当前步真值卡下标：countdual 按 phase（0=count 鼓/1=mix 铃）求值；
   他 kind 恒 =q.answer（count 卡下标）。SC.quiz.answer/救援 breathe/教学帮指共用同口径 ---------- */
function ansIdxOf(q) {
  if (!q) return -1;
  if (q.kind !== 'countdual') return q.answer;
  const want = q.phase === 1 ? q.mix : q.count;
  for (let j = 0; j < q.opts.length; j++) if (q.opts[j].num === want) return j;
  return -1;

/* ---------- 点卡引擎（无 DOM）：engTapOpt(L, i) —— 点第 i 张数字卡（opts 数组下标）

   'half'  r24 countdual 第一步（鼓）对：phase→1 转问铃，不置 _answered 不推 step
   'wrong' 点错：该题 miss+1（retries 全关累计=星级口径），卡不灰可重选（探索不罚）

function engTapOpt(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.opts.length) return null;
  if (i === ansIdxOf(q)) {
    if (q.kind === 'countdual' && q.phase === 0) { q.phase = 1; return 'half'; }
    q._answered = true;
    L.step++;

const correctIdx = q => ansIdxOf(q);

/* ---------- 结构校验（verify 用，返回失败原因或 null）：数字域 1-10 / 章型规则 /
   countmix 先验（N∈3-5/M∈1-2/N+M≤6）/ countdual 先验（r24：N∈3-5≠M∈2-4/phase 初始 0）/
   击序 seq 对账 / 候选互异含真值（dch4 counthear ⊆{6..10}）/ answer 自洽 / 初始态干净 ---------- */
function structWhy(q, dch, qi) {
  if (!q) return 'quiz';
  if (q.kind !== 'counthear' && q.kind !== 'countmix' && q.kind !== 'countdual') return 'kind';
  const isCH = q.kind === 'counthear';
  const isDual = q.kind === 'countdual';
  if (!Number.isInteger(q.count) || q.count < 1 || q.count > 10) return 'countDomain';  // ⊆1-10（r24 大域）
  if (isCH) {

    if (dch === 1 && (q.count < 2 || q.count > 3)) return 'dch1N';
    if (dch === 2 && (q.count < 3 || q.count > 4)) return 'dch2N';
    if (dch === 4 && (q.count < 6 || q.count > 10)) return 'dch4N';   // r24 大域腿 6-10

    if (q.count < 3 || q.count > 5) return 'dualN';                  // N∈3-5
    if (q.mix < 2 || q.mix > 4) return 'dualM';                      // M∈2-4
    if (q.count === q.mix) return 'dualEq';                          // N≠M 两步真值可区分
    if (q.phase !== 0) return 'dualPhase';                           // 初始步=问鼓

    if (q.mix < 1 || q.mix > 2) return 'mixM';                       // M∈1-2

  if (dch === 4 && !isCH && !isDual) return 'dch4Kind';              // ch4 恒 {counthear,countdual}
  if (dch === 1 && q.opts.length !== 2) return 'dch1Len';
  if (dch === 2 && q.opts.length !== 3) return 'dch2Len';

  if (!Array.isArray(q.seq) || q.seq.length !== q.count + q.mix) return 'seqLen';
  if (q.seq.filter(x => x === 'd').length !== q.count) return 'seqDrum';
  if (q.seq.filter(x => x === 'b').length !== q.mix) return 'seqBell';

  if (new Set(vals).size !== vals.length) return 'optDup';           // 候选互异
  if (vals.indexOf(q.count) < 0) return 'optTruth';                  // 含真值
  if (isDual && vals.indexOf(q.mix) < 0) return 'optTruth2';         // r24 双问两步真值都在候选
  if (q.answer < 0 || q.answer >= vals.length) return 'ansRange';
  if (vals[q.answer] !== q.count) return 'ansIdx';                   // answer=真值卡下标（第一步）
  if (q._miss !== 0 || q._answered) return 'init';
  return null;
}
/* ================= soundcount 主逻辑（击段播放+视锚/纯听 / 数字卡点选判定 / 教学 / 救援 / 推进）
   玩法：开题=播击段（ch1-3 鼓图逐击 bounce 视锚同步——5-6 岁降坡核心；countmix 鼓 N+铃 M
   混排，铃=干扰音色只响不 bounce——视锚同选择性；**r24 dch4 纯听**：撤逐击视锚（鼓不
   bounce），播放期挂「用耳朵数」耳徽标——零逐击信息，听觉计数必经通道）→ 问句
   （counthear=sc_q1「敲了几下呀」/countmix=sc_q2「鼓敲了几下」/countdual 第一步=sc_q2
   第二步=sc_q3「铃铛响了几下」）→ 数字卡点选（数字大字+对应点数圆点；6-10 双行五点阵）。
   r24 countdual 两步：第一步（鼓）对='half' 卡亮+确认链后转问铃（不重播不推进）；
   第二步（铃）对=right/done 推进（确认链名音=铃数 sc_n_<mix>）。
   点对=卡亮+sc_right+数字名音拼播（确认链=[sc_right, sc_n_<N>]——全 clip 无 keyless，
   契约 N 天然安全；r24 名音=末步真值：countdual 第二步用铃数；大域名音 sc_n_6-10
   注册前静默 SPEC-R24 §R6）；点错首错=错链 [sc_wrong, sc_hint]
   （豁免窗 3930=1656+150+1824+300）+自动重播一遍击段+数字卡排 bump（方向级）；
   miss≥2=正确数字卡 breathe（答案级；countdual 按 phase 取当前步真值卡）。
   重听=整段重播（题面后可点，3s 节流；dch4 恒纯听）；救援：14s 方向级=纯听自动重播
   （lastDir 独立节流锚）/30s 答案级=正确卡 breathe+重播（r24 纯听关例外带视锚——
   方向级不给/答案级可给分层）；错反馈链豁免窗 3930 让路（契约 I）。
   验收钩子：window.SC = { get currentLevel, get quiz{kind,count,mix,seq,opts,answer,phase,
   step,miss}, tapOpt(i), start(flat), autoSolve(), replay() }——真实页同暴露（b29 坑⑥）；
   r24 verify 专用驱动 _forceIdle/_rescueCore（VERIFY 页守卫，真实页不可达）。 */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
const replayAnim = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const estMs = s => s.length * 345 + 600;       // b25 定版：SAPI ~345ms/字 + 600 落定余量（全字符口径；家族 T 契约锚——r24③ 后 ears 唯一调用点已改实长常量窗，定义保留防家族断言漂移）
/* 救援/开场任务语音/读题不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错链节流：flat<3 每错必播；flat≥3 走 10s 节流（契约 J：语义句全程保留，禁切通用 clip） */
let lastWrongVoice = 0;
let wrongChainUntil = 0;                         /* 错反馈链豁免窗终点（救援 interval 让路，契约 I） */
const sayW = parts => {
  if (!cur) return false;
  if (cur.flat >= 0 && cur.flat < 3) { KIDS.voice.queue(parts); return true; }
  const now = Date.now();
  if (now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.queue(parts); return true; }
  return false;                            /* 节流未播返回 false——豁免窗仅链起播时设（契约 I「起播设」） */
};

const sceneEl = $id('scene'), boardEl = $id('board'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear'),
      ghostEl = $id('ghost');

let cur = null;                                 // 当前关模型（genLevel/教学迷你关产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();                       /* 30s 答案级 idle 锚（方向级不得重置它） */
let lastDir = Date.now();                       /* 14s 方向级独立节流锚（家族 B：与 lastAct 分离） */
let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）
let lastReplayAt = 0;                           // 重听 3s 节流锚（SPEC §0.79）
let helpRedemo = false;
let playRun = 0;                                // 击段播放令牌（重开关卡/新题/重播中止在途）
let firstFlat = 0;                              // 启动首个未通关 flat（教学完成后进入）

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const cardEl = i => boardEl.querySelector('.card[data-i="' + i + '"]');
/* r24 纯听判定：dch4 起（含生成关 dch4 腿）击段撤逐击视锚（教学迷你关 flat<0 与
   flat0-14 恒 false——教学/基线零改动） */
const pureOf = L => !!L && L.dch === 4;

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 70);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成，家族马林巴音色）：答对=双音上行 / 答错=低柔单音
   鼓击=低频短音 146.83 / 铃击=清脆高音 1244.51（音色差=选择性计数可辨） */
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };
const drumNote = () => { if (!VERIFY) KIDS.audio.note(146.83, 0.35, 0, 0.95); };
const bellNote = () => { if (!VERIFY) KIDS.audio.note(1244.51, 0.5, 0, 0.6); };

/* ================= 击段播放器（听觉序列——simon 节拍参照）
   ch1-3：鼓图逐击 bounce 视锚同步（降坡核心）；铃击只响不 bounce。
   r24 dch4 纯听：鼓击不 bounce（drumHit(false)），播放期 scene 挂 .listening
   （「用耳朵数」耳徽标——仅标志播放窗口，零逐击信息）；anchored=true 仅 30s 答案级
   救援在纯听关传入（视锚例外回归一次——方向级不给/答案级可给分层）。
   __scBounceN=本次播放鼓击计数（播放器写，verify 与 DOM animationstart 双向对账——
   契约 M；纯听下仍逐击累加=击序对账锚不随视锚撤） */
function drumHit(anchor) {
  if (anchor) { const el = $id('drum-wrap'); if (el) replayAnim(el, 'bounce'); }
  window.__scBounceN = (window.__scBounceN || 0) + 1;
  drumNote();
}
async function playBeats(q, anchored) {
  const token = ++playRun, run = cur;
  window.__scBounceN = 0;
  const pure = pureOf(cur) && !anchored;         /* r24 纯听（dch4 且非答案级带锚重播） */
  if (pure) sceneEl.classList.add('listening');
  if (!VERIFY) KIDS.audio.unlock();              /* 首次自动播放前解锁音频上下文 */
  try {
    for (let k = 0; k < q.seq.length; k++) {
      if (token !== playRun || cur !== run || state.won) return false;
      if (q.seq[k] === 'd') drumHit(!pure);      /* 鼓击：纯听关只计数+发声不 bounce */
      else bellNote();                           /* 铃击：只响（视锚同选择性） */
      await wait(HIT_GAP * SPEED);               /* 段间 700ms 可数节奏 */
    }
  } finally { sceneEl.classList.remove('listening'); }
  return token === playRun && cur === run && !state.won;
}
/* 问句（counthear=sc_q1 / countmix=sc_q2 / countdual 第一步=sc_q2 第二步=sc_q3 r24）；
   q3 窗 2600 ≥ 6 字×家族最长字率(q2 1848/5=369.6)+300=2518（注册后实长复测替换） */
const askText = q => q.kind === 'counthear' ? VOICE.q1
  : (q.kind === 'countdual' && q.phase === 1) ? VOICE.q3 : VOICE.q2;
const askWin = q => (q.kind === 'countdual' && q.phase === 1) ? 2600 : 2148;
const askVoice = q => sayR(askText(q).key, askText(q).text);

/* ================= r24 纯听模式首次预告（每存档一次 sv.soundcount.earsSeen；verify 页
   不写档每次触发）：dch4 首次击段前播 sc_ears，等实长+300 余量窗 3192+300=3492
   （_clipdur33 实测回填，宁等勿叠防语音压掉头几击——r24 审查 m4 收紧：原 estMs
   全字符口径 4395 每存档首次超等 ~1.2s） ================= */
async function maybeEarsIntro() {
  const sv = KIDS._save();
  if (sv && sv.soundcount && sv.soundcount.earsSeen) return;
  sayR(VOICE.ears.key, VOICE.ears.text);         /* sc_ears：这次呀，用小耳朵数一数（注册前静默） */
  await wait((3192 + 300) * SPEED);
  const s2 = KIDS._save() || {};
  s2.soundcount = s2.soundcount || {};
  s2.soundcount.earsSeen = true;
  if (KIDS._save()) KIDS.store.persist();
}

/* ================= 开题呈现：渲染题面 → (纯听预告) → 击段 → 问句 → 开放点选
   （含击后 300 余量+问句窗 askWin 2148/2600——r24 dual 第二步 q3 窗）
   答对推进/重开关卡共用（渲染在此——advance 路径不复漏换题面） ================= */
async function presentQuiz() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  renderQuiz();                                 // 场景+数字卡+进度点（新题面）
  const run = cur;
  state.locked = true;
  if (pureOf(cur)) await maybeEarsIntro();       /* r24 dch4 纯听预告（每存档一次） */
  if (cur !== run) return;
  const ok = await playBeats(q);
  const token = playRun;
  if (!ok || cur !== run || token !== playRun) return;   // 中断（换关/新播放接管）——接管方负责锁
  await wait(300 * SPEED);
  if (cur !== run || token !== playRun) return;
  askVoice(q);
  await wait(askWin(q) * SPEED);                 /* ≥ max(q1 1752,q2 1848)+300=2148；q3 窗 2600（家族 H） */
  if (cur !== run || token !== playRun) return;
  state.locked = false;
  lastAct = Date.now();                          /* 问句播完开放点选（b25 M4：读题完成重置 idle 锚） */
  lastDir = Date.now();
}
/* ================= 重听：整段重播（user=true 走 3s 节流；救援/首错自动重播 false；
   r24 anchored=true=30s 答案级救援在纯听关的带视锚重播；
   keepIdle=true=重播完成不刷 lastAct（审查M1 r24：方向级救援重播走共享路径曾隐式
   刷新 idle 锚→30s 答案级每 14s 被清零永不可达，r23 P1-1 同型——仅方向级传 true；
   用户主动重听/首错自动重播/答案级重播保留刷新，b25 M4 语义不变） ================= */
async function doReplay(user, anchored, keepIdle) {
  const q = cur && cur.quizzes[cur.step];
  if (!q || state.won) return false;
  if (user) {
    if (Date.now() - lastReplayAt < 3000) return false;   // 3s 节流（SPEC §0.79）
    lastReplayAt = Date.now();
    sayR(VOICE.replay.key, VOICE.replay.text);   /* sc_replay：再听一遍（与击段叠播不撞） */
  }
  const run = cur;
  state.locked = true;
  const ok = await playBeats(q, anchored);
  const token = playRun;
  if (!ok || cur !== run || token !== playRun) return false;
  await wait(300 * SPEED);
  if (cur !== run || token !== playRun) return false;
  askVoice(q);
  await wait(askWin(q) * SPEED);
  if (cur !== run || token !== playRun) return false;
  state.locked = false;
  if (!keepIdle) lastAct = Date.now();
  return true;
}

/* ================= 渲染 ================= */
function renderScene(q) {                        // 题面：暖色舞台垫+铃身份图（countmix/countdual）+鼓大图+问句条
  sceneEl.dataset.kind = q.kind;                 // 帧内容锚（契约 M：verify 断言）
  if (q.kind === 'countdual') sceneEl.dataset.phase = q.phase || 0;   // r24 双步：0 问鼓/1 问铃（谁满亮）
  else sceneEl.removeAttribute('data-phase');
  const ask = askText(q);
  sceneEl.setAttribute('aria-label', ask.text + '，点我再听一遍');
  sceneEl.innerHTML = '<div class="stage-props">' +
    '<div id="bell-wrap">' + bellSvg(86) + '<div class="bell-shadow" aria-hidden="true"></div></div>' +
    '<div id="drum-wrap">' + drumSvg(150) + '<div class="drum-shadow" aria-hidden="true"></div></div>' +
    '</div>' +
    '<div class="listen-badge" aria-hidden="true">' + ICONS.hear + '<span>用耳朵数</span></div>' +
    '<div class="q-text">' + ask.text + '</div>';
}
function renderBoard(q) {                        // 数字卡排（数字大字+圆点；ch1 2/ch2 3 卡居中）
  boardEl.innerHTML = '';
  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'card pop';
    b.dataset.i = i;
    b.dataset.num = o.num;                       // verify 对账（渲染即引擎）
    b.setAttribute('aria-label', '数字' + o.num + '卡');
    b.innerHTML = numSvg(o.num, 104);
    b.style.animationDelay = (i * 70) + 'ms';
    boardEl.appendChild(b);
  });
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderScene(q);
  renderBoard(q);
  renderStep();
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 答对演出：鼓图跳 + 小兔子滑入示范（确认句拼播由 uiTapOpt 播）
   verify 页跳过装饰直接落定 ================= */
function celebrateScene() {
  const dw = $id('drum-wrap');
  if (dw) replayAnim(dw, 'bounce');

    const pet = document.createElement('div');

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向：当前题正确数字卡 */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const i = correctIdx(q);
  if (i >= 0) pointGhostAt(cardEl(i));
}

/* ================= 点卡主路径（真实点击 / SC.tapOpt / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（数字卡排容器 bump 微动效——家族 D）；
   错防重入窗/判对演出窗共用 locked 门；首错链后自动重播（方向级核心）========== */
async function uiTapOpt(i, demo) {
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  /* b31 家族 I 补口径（2026-09-11）：错链豁免窗（真时钟）内错点吞——locked 窗 verify 页乘 SPEED
     缩水防 40ms 漏点；对选放行（缓解吞输入急性子观察）；窗后第二错照常计 miss（miss≥2 梯度可达）。
     r24：对选=当前步真值卡（correctIdx phase 感知——dual 第二步真值是铃卡非静态 q.answer） */
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil && i !== correctIdx(q)) {
    sfx('pop'); replayAnim(boardEl, 'bump'); return false;
  }
  const run = cur;                               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapOpt(cur, i);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }   // 越界/已答=null+pop+bump
  playRun++;                                     /* 判定后中止在途播放尾音（重播尾段/救援重播） */
  const el = cardEl(i);

  if (r === 'wrong') {                           /* 答错：摇头+错链两段（wrong clip→hint clip）
                                                    +首错自动重播+卡排 bump / miss≥2 正确卡 breathe */
    state.locked = true;
    if (el) replayAnim(el, 'wig');
    dodgeLo();
    if (sayW([VOICE.wrong.key, VOICE.hint.key]))                       /* 错链全 clip 无 keyless（契约 N） */
      wrongChainUntil = Date.now() + 3930;      /* 链豁免：wrong 1656+150+hint 1824+300=3930（契约 I） */
    if (q._miss === 1) replayAnim(boardEl, 'bump');   /* 方向级：数字卡排 bump（§0.79） */
    if (q._miss >= 2) {                          /* miss≥2=正确卡 breathe（答案级，家族梯度；
                                                    r24 dual 按 phase 取当前步真值卡） */
      const ok = cardEl(correctIdx(q));
      if (ok) replayAnim(ok, 'breathe');
    }
    if (q._miss === 1) {                         /* 首错：错链播完自动重播一遍击段（方向级核心） */
      await wait(3630 * SPEED);                  /* 错链主窗 wrong 1656+150+hint 1824=3630 */
      if (cur !== run) return r;
      await doReplay(false);
      if (cur !== run) return r;
      state.locked = false;
    } else {
      await wait(1000 * SPEED);                  /* 错点防重入窗 1000ms（对选可打断链） */
      if (cur !== run) return r;
      state.locked = false;
    }
    return r;
  }

  /* ---- half（r24 countdual 第一步·鼓 对：确认链后转问铃——不重播不推进） ---- */
  if (r === 'half') {
    state.locked = true;
    if (el) { el.classList.remove('breathe'); el.classList.add('lit'); }
    chimeGoal();
    sfx('coin');
    KIDS.voice.queue([VOICE.right.key, nameClip(q.count)]);   /* 第一步名音=鼓数 */

     q-text 按 kind（countdual 第二步=铃铛响了几下）——flat0 2 卡/flat5 3 卡/
     flat10 countmix 4 卡/flat15 dch4 大域 4 卡
   ⑦ 教学链三段（看→帮→独）：tutorialWatch() 真实走完（stub 存档）→
     __scDemoR==='right' 且 tut='help'（turn 2 下迷你关）；turn 题点对 → __scTutSolo
     且进正式关（flat=0 n=5），watch 折算真实时长 ≤16s
   ⑧ 吞输入轻叮+可见回应：demo/locked 门拦钩子输入 + 卡排容器 bump（家族 D）
   ⑨ UI 冒烟：flat0 autoSolve（taps=5 恒 3★）/ flat5 autoSolve / flat10 先 1 错
     再 autoSolve（miss=1 → 2★）
   ⑩ 布局：双 viewport（1280×800/800×1180）×（flat0/flat5/flat12/flat15）：数字卡
     ≥96×96、鼓图 SVG ≥120px 高、描边对比度 ≥3:1、overflowX ≤0
   ⑪ clips：sc_ 13 条 + core 3 条全注入（子集式 ≥16——r24 新 7 键主线注册后 23 亦过）
     + duration 辨别器（_clipdur33 实长 ±60ms，13 键实长子集）
   ⑫ 星级三档：0=3★/1-2=2★/≥3=1★（永不 0 星）
   ⑬ 契约 A/B/C/E/F/I/J/K/L/M/N 源码断言（读自身合并 script 文本；B 含救援双锚
     14s/30s；L=NUM_TEXT 覆盖 1-10 全量；M=__scBounceN 击序对账锚）+ r24 锚
     （pureOf/half 分支/dual 末步名音=铃数/答案级带锚重播）
   ⑭ 章末预告 C7 独立硬编码对账（hint[i]↔CHAPTERS[i+1]）+ 生成关 nextHint 实算对账
   ⑮ estMs 语音窗动态断言：判对窗 4600 ≥ 2304+150+1416+300=4170；错链豁免窗 3930 ==
     1656+150+1824+300（SPEC §4 精确值）；教学 watch 延 3450 ≥ 3144+300；turn 延
     2200 ≥ 1896+300；问句窗 2148 ≥ max(q1 1752,q2 1848)+300；r24 q3 窗 2600 ≥
     实长 2016+300=2316（注册后主线实测替换推导式）；celebrate 3020 ≥
     2304+300=2604
   ⑯ SPEED=0.12 提速断言
   ⑰ 重播节流：SC.replay() 起播 true+视锚重放（bounce 复位重数）+紧邻二次 false
     （3s 节流）+sc_replay clip 实播（voiceHist 在场）
   ⑱ 契约 M 击序视锚帧内容：播放期鼓 bounce 次数==count（播放器计数+DOM
     animationstart 双向对账）；countmix 只 bounce 鼓击（bounce==count ≠ count+mix）
   ⑲ r24 纯听撤锚单元（flat15 dch4）：播放期 .listening 耳徽标在场+整题 drum-b 动画
     0 次+__scBounceN==count（击计数在、视锚撤）+count∈6-10+候选 ⊆6-10+sc_ears 实播
   ⑳ r24 countdual 两步单元（flat15 qi1 真实 UI）：第一步 tapOpt='half'→phase=1+
     data-phase+q-text 切铃铛+sc_q3 实播 → 第二步错卡 wrong 不换步 → 第二步对
     'right' 推进+确认链尾名音=sc_n_<mix>（末步真值=铃数）
   ㉑ r24 救援两级单元（flat15，SC._forceIdle/_rescueCore 直调——r23 登记项④落地）：
     14s 方向级=纯听重播（bounce=0）；30s 答案级=正确卡 breathe+带锚重播（bounce>0）
     ——方向级不给/答案级可给分层实证
   结果写 #verify-result + window.__scVlog + document.title='VERIFY PASS n/n' */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;

  /* SPEC-BATCH33 §0.79/§1/§4 + SPEC-R24-SOUNDCOUNT 文字独立重列（禁抄页面 NUMS5/NUMS_HI/VOICE/NUM_TEXT/常量） */
  const SPEC_NUMS = [1, 2, 3, 4, 5];             // 数字域封闭 1-5（dch1-3/countdual）
  const SPEC_HI = [6, 7, 8, 9, 10];              // r24 dch4 counthear 大域带
  const SPEC_NUM_TEXT = { 1: '一下', 2: '两下', 3: '三下', 4: '四下', 5: '五下',
                          6: '六下', 7: '七下', 8: '八下', 9: '九下', 10: '十下' };   // 契约 L（r24 扩 1-10）
  const SPEC_DUR = { sc_tut_watch: 3144, sc_tut_turn: 1896, sc_hint: 1824,
                     sc_right: 2304, sc_wrong: 1656, sc_q1: 1752, sc_q2: 1848,
                     sc_replay: 1656,
                     sc_n_1: 1320, sc_n_2: 1368, sc_n_3: 1416, sc_n_4: 1416, sc_n_5: 1320,
                     /* r24 新 7 键注册后主线实长回填（2026-09-20，_clipdur33 mutagen 实测） */
                     sc_ears: 3192, sc_q3: 2016,
                     sc_n_6: 1368, sc_n_7: 1368, sc_n_8: 1344, sc_n_9: 1344, sc_n_10: 1440 };
  const SPEC_CHAPTER_HINTS = { 1: '卡片变多了，仔细听再点', 2: '小铃铛来啦，只数鼓声哦',
                               3: '鼓不跳了，用耳朵数大数字', 4: '新一轮听音计数' };
  const SPEC_GEN_HINTS = ['两张卡里选数字', '三张卡里选数字',
                          '只数鼓声，别数铃铛', '用耳朵数大数字'];
  const SPEC_Q_TEXT = { counthear: '敲了几下呀', countmix: '鼓敲了几下',
                        dualA: '鼓敲了几下', dualB: '铃铛响了几下' };   // countdual 两步（r24）
  const estMs = n => n * 345 + 600;               // b25 定版：SAPI ~345ms/字 + 600 落定余量
  const SPEC_MAXNAME = 1440;                      // 名音全集 max（r24 注册后=sc_n_10 实长，_clipdur33）
  const unlocked = async () => {                  // 等击段播放/演出/错反馈窗结束（verify 提速后）
    let wg = 0;
    while ((state.locked || state.demo) && wg++ < 900) await wait(50);
    return !(state.locked || state.demo);
  };
  /* Mj-1 防回归（core voice.queue 弃尾语义）：keyless TTS 段（{key:null}）播完即 return
     丢弃后续段——本款全链 clip 段（keylessLast 对任意链恒 false=全 clip 无 keyless 安全） */
  const keylessLast = parts => !parts || !parts.length ? false :
    !!(parts[parts.length - 1] && parts[parts.length - 1].key === null &&
       parts[parts.length - 1].text);

  /* ---- ①② 40 关全量审计 + SPEC 表独立对账 ---- */
  const genDch = {}, planBad4 = [];
  let tableOk = true, badCase = null;
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1.quizzes) === JSON.stringify(L2.quizzes);      // 确定性
    let ruleOk = true;
    for (let k = 0; k < L1.quizzes.length; k++) {
      const why = structWhy(L1.quizzes[k], L1.dch, k);
      if (why) ruleOk = false;
    }
    if (L1.quizzes.length !== CH_LEN) ruleOk = false;
    const expCh = Math.floor(flat / 5) + 1;                       // 章号独立复算
    const chOk = L1.ch === expCh;
    const dchOk = flat < 20 ? L1.dch === Math.floor(flat / 5) + 1   // 静态四档
                           : (L1.dch >= 1 && L1.dch <= 4);       // 生成关随机章参数
    /* 引擎直驱：逐题点应选卡 → right / 末题 done；全关零错=3 星；
       r24 countdual 两步：第一步 'half'（不推进）→第二步 right/done */
    const L3 = genLevel(flat);
    let driveOk = true;
    for (let k = 0; k < L3.quizzes.length && driveOk; k++) {
      const q = L3.quizzes[k];
      const exp = k === L3.quizzes.length - 1 ? 'done' : 'right';
      if (q.kind === 'countdual') {
        const a1 = engTapOpt(L3, correctIdx(q));       // 第一步（鼓，phase 0）
        const a2 = engTapOpt(L3, correctIdx(q));       // 第二步（铃，phase 1）
        if (a1 !== 'half' || a2 !== exp || q._miss !== 0) { driveOk = false; break; }
      } else {
        const r = engTapOpt(L3, q.answer);
        if (r !== exp || q._miss !== 0) { driveOk = false; break; }
      }
    }
    const solvedAll = L3.done && L3.step === CH_LEN && L3.retries === 0 && engStars(L3) === 3;

    /* SPEC 表独立对账（每题：数字域/候选按章互异含真值/answer 复算/章型域/
       countmix 先验/r24 dch4 固定谱+大域带+countdual 先验/击序 seq 对账） */
    let specOk = true;
    let nCH = 0, nDual = 0;
    for (let k = 0; k < L1.quizzes.length; k++) {
      const q = L1.quizzes[k];
      const isCH = q.kind === 'counthear';
      const isDual = q.kind === 'countdual';
      if (isCH) nCH++;
      if (isDual) nDual++;
      if (L1.dch === 1 && (!isCH || q.count < 2 || q.count > 3 || q.opts.length !== 2))
        { badCase = 'dch1 ' + flat + '/' + k; specOk = false; break; }
      if (L1.dch === 2 && (!isCH || q.count < 3 || q.count > 4 || q.opts.length !== 3))
        { badCase = 'dch2 ' + flat + '/' + k; specOk = false; break; }
      if (L1.dch === 3 && (isCH || isDual || q.opts.length !== 4))
        { badCase = 'dch3 ' + flat + '/' + k; specOk = false; break; }
      if (L1.dch >= 4 && q.opts.length !== 4)
        { badCase = 'dchLen ' + flat + '/' + k; specOk = false; break; }
      if (isCH) {
        if (q.mix !== 0) { badCase = 'chMix ' + flat + '/' + k; specOk = false; break; }
        /* r24：dch4 固定谱 qi0/2/4=counthear 大域 N∈6-10；qi1/3=countdual */
        if (L1.dch === 4 && (k % 2 !== 0 || q.count < 6 || q.count > 10))
          { badCase = 'dch4CH ' + flat + '/' + k; specOk = false; break; }
      } else if (isDual) {
        if (L1.dch !== 4 || k % 2 !== 1)              // countdual 仅 dch4 且 qi1/3
          { badCase = 'dch4Dual ' + flat + '/' + k; specOk = false; break; }
        if (q.count < 3 || q.count > 5 || q.mix < 2 || q.mix > 4 || q.count === q.mix ||
            q.phase !== 0)
          { badCase = 'dualPrior ' + flat + '/' + k; specOk = false; break; }
      } else {                                    // countmix 先验：N∈3-5/M∈1-2/N+M≤6（仅 dch3）
        if (L1.dch !== 3 || q.count < 3 || q.count > 5 || q.mix < 1 || q.mix > 2 || q.count + q.mix > 6)
          { badCase = 'mixPrior ' + flat + '/' + k; specOk = false; break; }
      }
      /* 击序 seq 对账（SPEC §1 钩子契约：'d'/'b' 数组） */
      if (!Array.isArray(q.seq) || q.seq.length !== q.count + q.mix ||
          q.seq.filter(x => x === 'd').length !== q.count ||
          q.seq.filter(x => x === 'b').length !== q.mix ||
          q.seq.some(x => x !== 'd' && x !== 'b'))
        { badCase = 'seq ' + flat + '/' + k; specOk = false; break; }
      if (isCH && q.seq.some(x => x !== 'd'))
        { badCase = 'seqPure ' + flat + '/' + k; specOk = false; break; }
      /* 候选：互异含真值；r24 候选带按 kind（dch4 counthear ⊆{6..10}，余 ⊆{1..5}，
         countdual 恒含 count 与 mix 双真值）；answer=真值卡下标独立复算 */
      const vals = q.opts.map(o => o.num);
      const pool = (isCH && L1.dch === 4) ? SPEC_HI : SPEC_NUMS;
      let poolOk = true;
      for (const v of vals) if (pool.indexOf(v) < 0) poolOk = false;
      if (!poolOk || new Set(vals).size !== vals.length || vals.indexOf(q.count) < 0 ||
          (isDual && vals.indexOf(q.mix) < 0))
        { badCase = 'opt ' + flat + '/' + k; specOk = false; break; }
      let expAns = -1;
      for (let j = 0; j < vals.length; j++) if (vals[j] === q.count) expAns = j;
      if (expAns < 0 || q.answer !== expAns)
        { badCase = 'ans ' + flat + '/' + k; specOk = false; break; }
    }
    if (!specOk) tableOk = false;
    if (L1.dch === 4 && (nCH !== 3 || nDual !== 2)) planBad4.push(flat);   // r24 固定谱构成
    if (flat >= 20) genDch[L1.dch] = (genDch[L1.dch] || 0) + 1;
    const ok = det && ruleOk && chOk && dchOk && driveOk && solvedAll && specOk;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, ruleOk: ruleOk, chOk: chOk,
                  dchOk: dchOk, driveOk: driveOk, solvedAll: solvedAll, specOk: specOk,
                  kinds: L1.quizzes.map(q => (q.kind === 'counthear' ? 'hear' :
                                    q.kind === 'countmix' ? 'mix' : 'dual') + ':' + q.count +
                                             (q.mix ? '+' + q.mix : '')) };
    if (flat < 20) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ③ 聚合独占票：dch4 固定谱构成（恰 3 counthear+恰 2 countdual）/ 生成关四型全现 ---- */
  total++;
  const aggOk = tableOk && planBad4.length === 0 &&
    genDch[1] > 0 && genDch[2] > 0 && genDch[3] > 0 && genDch[4] > 0;
  if (aggOk) npass++;
  units.audit = { ok: aggOk, bad: badCase, planBad4: planBad4, genDch: genDch };

  /* ---- ④ tapOpt 单元（flat0 counthear 2 候选）---- */
  total++;
  startLevel(0);
  await unlocked();
  const q4 = window.SC.quiz;
  const initOk = q4 && q4.kind === 'counthear' && q4.count >= 2 && q4.count <= 3 &&
                 q4.mix === 0 && q4.seq.length === q4.count &&
                 q4.opts.length === 2 &&
                 q4.opts.every(o => SPEC_NUMS.indexOf(o.num) >= 0) &&
                 q4.opts[q4.answer].num === q4.count &&
                 q4.step === 0 && q4.miss === 0;
  const badTap = (await window.SC.tapOpt(99)) === null;           // 非法下标=null（不炸）
  const wA = q4.opts.findIndex((o, i) => i !== q4.answer);        // 错卡（2 选 1 的另一张）
  const pW = window.SC.tapOpt(wA);                                // → wrong（首错自动重播窗，fire-and-forget）
  const rejW = await window.SC.tapOpt(wA);                        // 窗内紧邻再点=被拦 false
  const rW = await pW;
  const chainA = window.__lastQueue && window.__lastQueue.length === 2 &&
                window.__lastQueue[0] === 'sc_wrong' &&           // 错链头=wrong clip（manifest 文案）
                window.__lastQueue[1] === 'sc_hint' &&            // 首错语义句=hint「再听一遍呀」（clip 段）
                window.__lastQueue.every(p => typeof p === 'string') &&   // 全 clip 无 keyless（契约 N）
                !keylessLast(window.__lastQueue);
  const reBounce = window.__scBounceN === q4.count;               // 首错自动重播=视锚重放（bounce 复位重数）
  const s1 = rW === 'wrong' && rejW === false && chainA && reBounce &&
             window.SC.quiz.miss === 1 && window.SC.currentLevel.miss === 1;
  const rR = await window.SC.tapOpt(q4.answer);
  const chainR = window.__lastQueue && window.__lastQueue.length === 2 &&
                 window.__lastQueue[0] === 'sc_right' &&          // 确认链=sc_right+数字名音（全 clip）
                 window.__lastQueue[1] === 'sc_n_' + q4.count;
  const s2 = rR === 'right' && chainR && window.SC.quiz.step === 1 && window.SC.quiz.miss === 0;
  const tapOk = initOk && badTap && s1 && s2;
  if (tapOk) npass++;
  units.tap = { ok: tapOk, init: initOk, badTap: badTap, wrongA: s1,
                chain: chainA, reBounce: reBounce, right: s2, chainR: chainR };

  /* ---- ⑤ countmix 单元（flat10 ch3 恒 countmix）：seq 对账+豁免窗 3930+breathe 梯度 ---- */
  total++;
  startLevel(10);
  await unlocked();
  const qm = window.SC.quiz;
  const mixShape = qm && qm.kind === 'countmix' && qm.count >= 3 && qm.count <= 5 &&
                   qm.mix >= 1 && qm.mix <= 2 && qm.count + qm.mix <= 6 &&
                   qm.seq.length === qm.count + qm.mix &&
                   qm.seq.filter(x => x === 'd').length === qm.count &&
                   qm.seq.filter(x => x === 'b').length === qm.mix &&
                   qm.opts.length === 4 && qm.opts[qm.answer].num === qm.count;
  const bellShown = !!document.querySelector('#bell-wrap') &&
                    getComputedStyle(document.querySelector('#bell-wrap')).display !== 'none';
  const wC = qm.opts.findIndex((o, i) => i !== qm.answer);
  const rC = await window.SC.tapOpt(wC);                          // 首错（豁免窗起播）
  const chainM = window.__lastQueue && window.__lastQueue.length === 2 &&
                 window.__lastQueue[0] === 'sc_wrong' && window.__lastQueue[1] === 'sc_hint';
  const miss1 = window.SC.quiz.miss === 1;
  const rejM = await window.SC.tapOpt(wC) === false;              // 错链豁免窗内（locked/豁免）二错吞
  await new Promise(w => setTimeout(w, 4100));                    // 等错链豁免窗（真时钟 3930）过——
                                                                 // 窗后第二错照计 miss=2（梯度可达）
  const wD = qm.opts.findIndex((o, i) => i !== qm.answer && i !== wC);
  const rD = await window.SC.tapOpt(wD);
  const brEl = cardEl(qm.answer);
  const breathe2 = !!brEl && brEl.classList.contains('breathe'); // miss≥2=正确卡 breathe（答案级梯度）
  const miss2 = rD === 'wrong' && window.SC.quiz.miss === 2;       // 第二次错=miss 2（卡不灰可重选）
  const rE = await window.SC.tapOpt(qm.answer);
  const mixOk = mixShape && bellShown && rC === 'wrong' && chainM && miss1 &&
                rejM && miss2 && breathe2 && rE === 'right';
  if (mixOk) npass++;
  units.tapMix = { ok: mixOk, shape: mixShape, bell: bellShown, chain: chainM,
                   miss1: miss1, rejInWin: rejM, miss2: miss2, breathe2: breathe2, right: rE };

  /* ---- ⑥ 帧内容断言（契约 M：渲染即引擎——数字卡 DOM==opts.len+data-num+圆点数==num+
     题面 kind+鼓图锚+铃图显示态+q-text 按 kind） ---- */
  total++;
  const frameCheck = q => {
    const cards = Array.from(boardEl.querySelectorAll('.card'));
    const domOk = cards.length === q.opts.length &&
      cards.every((c, i) => Number(c.dataset.num) === q.opts[i].num &&
        c.querySelectorAll('svg').length === 1 &&
        c.querySelectorAll('.dot').length === q.opts[i].num);     // 圆点数==数字（6-10 双行同口径）
    const drum = sceneEl.querySelector('#drum-wrap svg > g[data-anim]');
    const drumOk = !!drum && drum.dataset.anim === 'drum';        // 鼓视锚锚
    const kindOk = sceneEl.dataset.kind === q.kind;
    const bw = document.querySelector('#bell-wrap');
    const bellOk = (q.kind === 'countmix' || q.kind === 'countdual')
      ? (!!bw && getComputedStyle(bw).display !== 'none')          // countmix/countdual 铃身份图显示
      : (!!bw && getComputedStyle(bw).display === 'none');         // counthear 铃隐藏
    const txt = sceneEl.querySelector('.q-text').textContent;
    const wantTxt = q.kind === 'counthear' ? SPEC_Q_TEXT.counthear
      : q.kind === 'countmix' ? SPEC_Q_TEXT.countmix
      : (q.phase === 1 ? SPEC_Q_TEXT.dualB : SPEC_Q_TEXT.dualA);   // r24 dual 两步问句
    const txtOk = txt.indexOf(wantTxt) >= 0;
    return domOk && drumOk && kindOk && bellOk && txtOk;
  };
  startLevel(0);                                        // dch1 counthear 2 卡
  const fA = frameCheck(window.SC.quiz) && boardEl.querySelectorAll('.card').length === 2;
  startLevel(5);                                        // dch2 counthear 3 卡
  const fB = frameCheck(window.SC.quiz) && boardEl.querySelectorAll('.card').length === 3;
  startLevel(10);                                       // dch3 countmix 4 卡
  await unlocked();
  const fC = frameCheck(window.SC.quiz) && boardEl.querySelectorAll('.card').length === 4;
  startLevel(15);                                       // r24 dch4 大域 counthear 4 卡（qi0）
  await unlocked();
  const fD = frameCheck(window.SC.quiz) && boardEl.querySelectorAll('.card').length === 4 &&
             window.SC.quiz.count >= 6;                 // 大域腿（候选 ⊆6-10 在 ⑪① 对账）
  const frameOk = fA && fB && fC && fD;
  if (frameOk) npass++;
  units.frame = { ok: frameOk, dch1: fA, dch2: fB, countmix: fC, dch4: fD };

  /* ---- ⑦ 教学链三段（看→帮→独）：tutorialWatch 真实走完 → __scDemoR='right'（演示点

  const bellShownD = !!document.querySelector('#bell-wrap') &&
                     getComputedStyle(document.querySelector('#bell-wrap')).display !== 'none';
  const rHalf = await window.SC.tapOpt(qd.answer);           // 第一步（鼓）→ 'half'
  await unlocked();                                          // 第二步问句窗（q3 2600）结束
  const phase1 = window.SC.quiz.phase === 1 &&
                 window.SC.quiz.opts[window.SC.quiz.answer].num === qd.mix &&
                 sceneEl.dataset.phase === '1' &&
                 sceneEl.querySelector('.q-text').textContent.indexOf(SPEC_Q_TEXT.dualB) >= 0 &&
                 (window.__voiceHist || []).indexOf('sc_q3') >= 0;
  const wD20 = qd.opts.findIndex(o => o.num !== qd.mix);     // 第二步必错卡（≠当前步真值）
  const rWrong2 = await window.SC.tapOpt(wD20);              // 第二步错 → wrong（miss=1 不换步）
  const wrongKeep = rWrong2 === 'wrong' && window.SC.quiz.step === 1 &&
                    window.SC.quiz.miss === 1 && window.SC.quiz.phase === 1;
  await unlocked();                                          // 错链+首错自动重播窗收尾
  const rRight2 = await window.SC.tapOpt(window.SC.quiz.answer);   // 第二步对 → 'right' 推进
  const chainD = window.__lastQueue && window.__lastQueue.length === 2 &&
                 window.__lastQueue[0] === 'sc_right' &&
                 window.__lastQueue[1] === 'sc_n_' + qd.mix; // 末步名音=铃数（r24）
  const adv2 = rRight2 === 'right' && window.SC.quiz.step === 2;
  const dualOk = r20a === 'right' && dualShape && bellShownD && rHalf === 'half' &&
                 phase1 && wrongKeep && chainD && adv2;
  if (dualOk) npass++;
  units.dual = { ok: dualOk, first: r20a, shape: dualShape, bell: bellShownD,
                 half: rHalf === 'half', phase1: phase1, wrongKeep: wrongKeep,
                 chain: chainD, adv: adv2 };

  /* ---- ㉑ r24 救援两级单元（flat15，SC._forceIdle/_rescueCore 直调——r23 登记项④
     落地）：14s 方向级=纯听重播（bounce=0）+重播完成 idle 不归零（审查M1 r24 行为断言：
     keepIdle 生效——否则 30s 答案级每 14s 被清零永不可达）；30s 答案级=正确卡 breathe+
     带锚重播（bounce>0）——方向级不给/答案级可给分层实证 ---- */
  total++;
  let domR21 = 0;
  const onR21 = e => { if (e.animationName === 'drum-b') domR21++; };
  document.addEventListener('animationstart', onR21);
  startLevel(15);                                            // 回 flat15 首题（counthear 大域）
  await unlocked();
  window.SC._forceIdle(15000);                               // 模拟 14s+ 空闲（方向级域）
  window.SC._rescueCore();
  await wait(500);                                           // 纯听重播进行中（6-10 击×84ms）
  const dirPure = domR21 === 0 && window.__scBounceN > 0;    // 方向级：击计数在、零 bounce
  await unlocked();                                          // 等重播+问句收尾（locked 复位）
  const idleKept = window.SC._idle() > 14000;                // 审查M1：重播完成 idle 须仍 >14s
  window.SC._forceIdle(31000);                               // 模拟 30s+ 空闲（答案级域）
  const brEl21 = cardEl(window.SC.quiz.answer);
  window.SC._rescueCore();
  await wait(600);                                           // 带锚重播进行中（首击即 bounce）
  const ansBreathe = !!brEl21 && brEl21.classList.contains('breathe');
  const ansBounce = domR21 > 0;                              // 答案级：视锚回归
  await unlocked();
  document.removeEventListener('animationstart', onR21);
  const rescueOk = dirPure && idleKept && ansBreathe && ansBounce;
  if (rescueOk) npass++;
  units.rescueLvl = { ok: rescueOk, dirPure: dirPure, idleKept: idleKept,
                     ansBreathe: ansBreathe, ansBounce: ansBounce };

  const out = { game: 'soundcount', total: total, pass: npass, layoutOk: layoutOk,
                levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__scVlog = out;                          // 外部断言挂点（任务书钩子）
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text（__lastVoiceKey/__lastVoiceText）并留播报历史
     （__voiceHist——sc_replay 实播证据）；voice.queue 记录拼播链（__lastQueue） */
  window.__voiceHist = [];
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) {
    window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null;
    if (k) window.__voiceHist.push(k);
  };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    window.__lastVoiceKey = parts && parts.length ? parts[0] : null;
  };
  runVerify();
}

</script>
