<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>找证据</title>
<style>
/* ================= 找证据 evidence（batch32 · 扩容批 2 · r17 难度改造 v2）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 结论卡（完整结论句文字+小侦探放大镜图标，7-8 岁识字承载）
   + 证据场景图卡点选（每卡=场景 SVG+短标签小字，触摸目标 ≥96px）。
   r17（SPEC-BATCH32 §-r17-evidence）：结论封闭 20；证据推理三档
   （true 能证明/weak 有关但不能证明/none 无关）；题型三族：
   findexact 单真值（ch1 二分=3 none 干扰/ch2 三档=weak≥1+none≥1）
   / findall 三真值多选（3 真+1 干扰，pick/unpick 勾选零惩罚+提交判定，契约 F17）
   / reverse 反问（3 真+1 非真，answer=非真卡「哪张不能证明」）。
   章：ch1-2 findexact / ch3 findall / ch4 三族混出；每章 8 关每关 8 题（CH_LEN=8）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：结论卡 + 问句条 + 证据卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:6px 12px}

/* 结论卡（文字卡：完整结论句+小侦探放大镜图标；点=重听题面，pulse=首错方向级回锚） */
#concl{position:relative;flex:0 0 auto;width:min(600px,94vw);min-height:76px;border-radius:22px;
  background:linear-gradient(180deg,#FFFDF6 0%,#FBF3E2 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;padding:8px 16px;display:flex;align-items:center;justify-content:center;
  gap:12px;transition:transform .15s;text-align:left}
#concl:active{transform:translateY(2px)}
#concl.pulse{animation:cc-pulse 1.1s ease-in-out 3}
@keyframes cc-pulse{0%,100%{box-shadow:0 4px 0 #D8C9B4}50%{box-shadow:0 0 0 10px rgba(232,151,90,.4)}}
#concl .c-icon{flex:0 0 auto}
#concl .c-icon svg{width:40px;height:46px}
#concl .c-text{font-size:25px;font-weight:800;color:#4A3B2E;line-height:1.25}
#concl.pop .c-text{animation:cc-pop .35s ease}
@keyframes cc-pop{0%{transform:scale(.92)}55%{transform:scale(1.05)}100%{transform:scale(1)}}

/* 问句条（findexact/findall 两族屏显问句） */
#qbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  max-width:94vw;padding:2px 8px}
#qbar .q-text{font-size:20px;font-weight:700;color:#4A3B2E;padding:4px 20px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}
#qbar.pop .q-text{animation:q-pop .35s ease}
@keyframes q-pop{0%{transform:scale(.9)}55%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- 证据卡排（主答案按钮 ≥96×96；findall 已 lit 卡再点走吞路径） ---------- */
#board{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:12px;max-width:760px;padding:2px 4px}
#board.bump{animation:bd-bump .22s ease}
@keyframes bd-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;width:126px;min-height:108px;border-radius:18px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:6px 4px;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card svg{width:74px;height:74px;pointer-events:none}
.card .nm{font-size:13px;font-weight:700;color:#6B5A48;margin-top:2px;text-align:center;line-height:1.25}
.card.pop{animation:card-in .4s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes card-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.card.lit{border-color:#8FBF7F;background:#EFF6E6;animation:card-lit .5s ease}
@keyframes card-lit{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
.card.wig{animation:card-wig .4s ease}
@keyframes card-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
.card.breathe{animation:card-br 1.2s ease-in-out infinite}
@keyframes card-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.05)}}

/* findall 勾选态（r17 契约 F17）：暖橙边+绿勾徽章（.tick 默认隐藏）；勾选零惩罚 */
.card .tick{display:none;position:absolute;right:5px;top:5px;width:26px;height:26px;
  border-radius:50%;background:#8FBF7F;border:2.5px solid #4A3B2E}
.card .tick:before{content:"";position:absolute;left:6px;top:5px;width:11px;height:16px;
  border-right:3.5px solid #FFFDF6;border-bottom:3.5px solid #FFFDF6;transform:rotate(40deg)}
.card.held{border-color:#E8975A;background:#FDEFDC;box-shadow:0 5px 0 #E8B47E}
.card.held .tick{display:block;animation:card-lit .35s ease}

/* findall 提交钮（选好啦；r17 判定步）：默认安静，armed=有勾选，ready=勾满三张呼吸
   （计数驱动不泄答案——照 senses r11 提交制先例） */
#btn-submit{width:78px;height:78px;border-radius:50%;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s;opacity:.55}
#btn-submit svg{width:48px;height:48px}
#btn-submit:active{transform:translateY(3px)}
#btn-submit.armed{opacity:1}
#btn-submit.ready{opacity:1;border-color:#8FBF7F;
  animation:sub-ready 1.1s ease-in-out infinite}
@keyframes sub-ready{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#btn-submit.hidden{display:none}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-31） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：结论卡/问句收紧，证据卡仍 ≥96 高
   r17 双通道：真视口媒体查询 + body.port 类模拟（verify 竖屏模拟/自测 P1b），
   两条通道规则逐行相同（标记段 PORT-CLS 见下方，build.py 逐行全等断言） */
@media (orientation:portrait){
  #concl{width:min(420px,95vw);min-height:70px;padding:6px 12px;gap:10px}
  #concl .c-icon svg{width:32px;height:38px}
  #concl .c-text{font-size:21px}
  #qbar .q-text{font-size:17px;padding:3px 14px}
  #board{gap:10px}
  .card{width:104px;min-height:100px}
  .card svg{width:62px;height:62px}
  .card .nm{font-size:12px}
  #btn-submit{width:70px;height:70px}
  #btn-submit svg{width:44px;height:44px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
/*PORT-CLS*/
body.port #concl{width:min(420px,95vw);min-height:70px;padding:6px 12px;gap:10px}
body.port #concl .c-icon svg{width:32px;height:38px}
body.port #concl .c-text{font-size:21px}
body.port #qbar .q-text{font-size:17px;padding:3px 14px}
body.port #board{gap:10px}
body.port .card{width:104px;min-height:100px}
body.port .card svg{width:62px;height:62px}
body.port .card .nm{font-size:12px}
body.port #btn-submit{width:70px;height:70px}
body.port #btn-submit svg{width:44px;height:44px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
</style>
</head>
<body>
<div id="game" aria-label="找证据">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="concl" aria-label="结论卡，点我再听一遍"></button>
    <div id="qbar" aria-live="polite"><div class="q-text"></div></div>
    <div id="board" aria-label="证据卡"></div>
    <button id="btn-submit" class="hidden" aria-label="选好啦，点这里提交"></button>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ---------- r17 时长模型（§-r17 §4；estMs 四方同步=data 本处/verify 独立定义/build est_ms
   字面断言/_selftest est_ms——认知步主体非演出窗）：
   每题 dur = max(voiceWin, DECIDE_MS[kind]) + CONFIRM_MS；
   voiceWin(q) = DUR_CONCL[q.concl] + QGAP + DUR_Q[kind] + 300（queue 段间 150/落定 300——实测 clip 长）；
   DECIDE_MS（7-8 岁单题认知推算）：findexact 8000（读结论+4 卡逐卡证明性判别约 1.5s/卡+确认，
   ch2 三档须额外区分「有关但不能证明」语义）/ findall 11500（4 卡逐一判别+集合管理「还差哪张」
   +勾选提交，三真值全找全，漏选重选计入）/ reverse 9000（抑制反转：靶心从找证据翻转为找非证据
   +逐卡检查约 2s/卡）；语音窗恒 ≤DECIDE（max findexact 5514 / findall 6402 / reverse 5658）。
   CONFIRM_MS=2900（判对演出窗 1600+1300 实码，罩确认链 evi_right 2472+300=2772）；
   OPEN_MS=900（开题渲染落定）；LEVEL_MIN_MS=40000（家族门禁）。
   modeled(flat)=OPEN_MS+Σ每题 dur；全 40 关 modeled 最低值=88100（ch1/ch2 全 findexact 关
   flat0-15 同值：900+8*(8000+2900)）——verify+_selftest 双钉精确断言（禁约数）。 ---------- */
const QGAP = 150;                              // queue 段间停顿（core voice.queue 实码）
const DUR_CONCL = {   // 结论句 clip 实长（r17 实测 2026-09-17，§-r17 §5 表）
  rainwet: 1776, snowplay: 1656, birthday: 2256, cooked: 2040,
  doghere: 1824, windbig: 1728, paintday: 1704, nightowl: 2832,
  washhands: 1752, ateorange: 1920, haircut: 1920, waterplant: 1728,
  mopped: 1752, brushed: 1752, fedfish: 1752, playedblocks: 1896,
  drankmilk: 1968, wrotehomework: 1968, fixedbike: 2160, playedsandbox: 1896
};
const DUR_Q = { findexact: 2232, findall: 3120, reverse: 2376 };   // 题面问句 clip 实长
const OPEN_MS = 900;
const DECIDE_MS = { findexact: 8000, findall: 11500, reverse: 9000 };   // r17 三题型
const CONFIRM_MS = 1600 + 1300;               // 判对演出窗（main 实码 wait 字面）
const LEVEL_MIN_MS = 40000;                   // 单关 modeled 下限硬断言（r14/r15 家族门禁）
const voiceWinMs = q => DUR_CONCL[q.concl] + QGAP + DUR_Q[q.kind] + 300;
const quizDurMs = q => Math.max(voiceWinMs(q), DECIDE_MS[q.kind]) + CONFIRM_MS;
const levelDurMs = L => OPEN_MS + L.quizzes.reduce((s, q) => s + quizDurMs(q), 0);
const modeled = flat => levelDurMs(genLevel(flat | 0));

/* ================= evidence 纯引擎：确定性关卡生成 + 结论/证据候选构建 + 点选/勾选判定（无 DOM）
   r17 难度改造（SPEC-BATCH32 §-r17-evidence 现行真值源）：
   种子 = mulberry32(flat * 7919 + 1031)（本批常量 evi=1031）——同 flat 永远同关。
   章型（每关 8 题=每章 8 关，CH_LEN=8/STATIC_LEVELS=32；生成关 flat≥32 每关 dch=seeded ri(1,4)）：
     dch1 findexact 二分（干扰=该结论 none 全 3，weak 不在场——只考「能证明/无关」）
     dch2 findexact 三档（干扰 3=seeded 取自 dstr 5 且 weak≥1+none≥1——区分「有关但不能证明」）
     dch3 findall 三真值多选（真值 3 全在场+干扰 1；pick/unpick 勾选零惩罚，判定步在 submit）
     dch4 三族 seeded 混出且各 ≥1（在场保证：缺族换入重复槽）
   每关 8 题结论互异（20 池洗牌取 8——同关去重）；flat0 题0 锚 rainwet findexact puddle（教学锚）。
   数学先验铁律（§-r17 §2）：
     findexact 候选=恰 1 真证据+3 干扰（同结论其他真证据不得入候选——防双真值）；
     findall 候选=真值 3 全在场+干扰 1（answers=3 真值下标升序）；
     reverse 候选=真值 3+非真 1（answer=非真卡下标「哪张不能证明」）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 每关题型序表（genLevel 预生成，rnd 同流保确定性）
   域：dch1/2 {findexact} / dch3 {findall} / dch4 {findexact,findall,reverse}；
   在场保证：dch4 三族 ≥1（8 槽 ≥ 域大，必有重复槽可换）。 ---------- */
const KIND_POOL = {
  1: ['findexact'],
  2: ['findexact'],
  3: ['findall'],
  4: ['findexact', 'findall', 'reverse']
};
function kindSeqOf(dch, rnd) {
  const pool = KIND_POOL[dch] || KIND_POOL[4];
  let seq = [];
  for (let i = 0; i < CH_LEN; i++) seq.push(pool[Math.floor(rnd() * pool.length)]);
  for (const k of pool) {                          // 在场保证：缺族换入重复槽
    if (seq.indexOf(k) >= 0) continue;
    let slot = -1;
    for (let i = 0; i < CH_LEN; i++) {
      const v = seq[i];
      if (seq.indexOf(v) !== i) { slot = i; break; }   // 重复出现的槽（首次出现保留）
    }
    if (slot >= 0) seq[slot] = k;
  }
  return seq;
}
/* ---------- 每关结论序表：20 结论池洗牌取 8（互异——同关去重）；flat0 题0 锚 rainwet ---------- */
function conclSeqOf(rnd, flat) {
  const seq = shuffled(CONCLS20, rnd).slice(0, CH_LEN);
  if (flat === 0) {
    const i = seq.indexOf('rainwet');
    if (i > 0) { const t = seq[0]; seq[0] = 'rainwet'; seq[i] = t; }
    else if (i < 0) seq[0] = 'rainwet';            // 洗牌未含锚结论：直接落位（互异不破）
  }
  return seq;
}

/* ---------- 干扰采样（r17 三档；dstr 池恒 weak2+none3）
   dch1 findexact：干扰=none 全 3（二分章 weak 不在场）；
   dch2 findexact：seeded 取 3 且 weak≥1+none≥1（三档判别核心章）；
   findall/reverse：seeded 取 1（weak/none 皆可）。 ---------- */
function dstrOf(bank, rnd, dch, kind) {
  if (kind === 'findexact' && dch === 1) return bank.dstr.filter(d => d.type === 'none');
  if (kind === 'findexact') {                      // dch2：3 干扰三档混合
    let picks = shuffled(bank.dstr, rnd).slice(0, 3);
    if (!picks.some(d => d.type === 'weak')) {     // 全 none（none3 存在可能）：换入池内 weak
      const w = bank.dstr.find(d => d.type === 'weak');
      if (w) picks = [w].concat(picks.filter(p => p.img !== w.img).slice(0, 2));
    }
    return picks;                                  // none≥1 恒成立（weak 仅 2，取 3 必含 none）
  }
  return [bank.dstr[Math.floor(rnd() * bank.dstr.length)]];   // 1 干扰 seeded
}

/* ---------- 单题构建（kind 特定部分 rnd 定序消费）
   findexact：真=真池 seeded 选 1（flat0q0 锚 puddle）+干扰=dstrOf；
   findall：真=真池全 3+干扰 1；answers=3 真值下标升序；picked=[]（勾选态）；
   reverse：真=真池全 3+非真 1；answer=非真卡下标。 ---------- */
function buildQuiz(kind, cid, rnd, flat, qi, dch) {
  const bank = EV_BANK[cid];
  const q = { kind: kind, concl: cid, opts: [], answer: -1, answers: null, picked: [],
              text: '', _miss: 0, _answered: false };
  let entries;
  if (kind === 'findexact') {
    const t = flat === 0 && qi === 0
      ? bank.true[0]                               // 教学锚：rainwet 真池[0]=puddle（§-r17 §3）
      : bank.true[Math.floor(rnd() * bank.true.length)];
    entries = [t].concat(dstrOf(bank, rnd, dch, kind));
  } else {                                         // findall/reverse：真 3 全在场+干扰 1
    entries = bank.true.concat(dstrOf(bank, rnd, dch, kind));
  }
  q.opts = shuffled(entries, rnd).map(e => ({ img: e.img, label: e.label }));
  const tImgs = bank.true.map(e => e.img);
  if (kind === 'findexact') {
    const tImg = entries[0].img;                   // 唯一真证据（教学锚/seeded 选出）
    for (let j = 0; j < q.opts.length; j++) if (q.opts[j].img === tImg) { q.answer = j; break; }
  } else if (kind === 'findall') {
    q.answers = [];
    for (let j = 0; j < q.opts.length; j++) if (tImgs.indexOf(q.opts[j].img) >= 0) q.answers.push(j);
    q.answers.sort((a, b) => a - b);               // 三真值下标升序
  } else {                                         // reverse：answer=非真卡下标
    for (let j = 0; j < q.opts.length; j++) if (tImgs.indexOf(q.opts[j].img) < 0) q.answer = j;
  }
  q.text = kind === 'findexact' ? Q1_TEXT : (kind === 'findall' ? Q2_TEXT : Q3_TEXT);
  return q;
}

/* ---------- 关卡生成（静态 32 关与生成关同一确定性通道；生成关 flat≥32 每关随机章参数）
   flat0 题0 恒 findexact+rainwet+puddle（教学演示锚点） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 1031);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const kinds = kindSeqOf(dch, rnd);
  const concls = conclSeqOf(rnd, flat);
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(kinds[qi], concls[qi], rnd, flat, qi, dch));
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点卡引擎（无 DOM）：engTapOpt(L, i) —— 点第 i 张候选卡（opts 数组下标）
   'right'  findexact/reverse 答对且本题完成推进
   'done'   末题答对=通关
   'pick'/'unpick' findall 勾选/取消（零惩罚，勾选不是判定步——判定步在 engSubmit）
   'wrong'  点错：该题 miss+1（retries 全关累计=星级口径），卡不灰可重选（探索不罚）
   null     非法下标 / 关卡已结束 / 已判定题（吞 pop 通道） ---------- */
function engTapOpt(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.opts.length) return null;
  if (q.kind === 'findall') {                      // 勾选切换：中性动作不计 miss
    const k = q.picked.indexOf(i);
    if (k >= 0) { q.picked.splice(k, 1); return 'unpick'; }
    q.picked.push(i);
    return 'pick';
  }
  if (i === q.answer) {                            // findexact 真值 / reverse 非真卡
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q._miss++; L.retries++;
  return 'wrong';
}
/* ---------- 提交判定引擎（无 DOM）：engSubmit(L) —— findall 判定步（契约 F17）
   'right' picked 集==answers 集→本题完成推进 / 'done' 末题=通关
   'wrong' 漏/多选：miss+1 且已选对位保留（picked=picked∩answers，错选位清除），可续选补齐
   false   非 findall / 已判定被拦 / 空选（空选不判不计 miss）
   null    非法（关未在局/越界） ---------- */
function engSubmit(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered || q.kind !== 'findall') return false;
  if (!Array.isArray(q.picked) || q.picked.length === 0) return false;
  const pk = q.picked.slice().sort((a, b) => a - b);
  const ok = pk.length === q.answers.length && pk.every((v, j) => v === q.answers[j]);
  if (ok) {
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q._miss++; L.retries++;
  q.picked = q.picked.filter(i => q.answers.indexOf(i) >= 0);   // 对位保留，错选清除
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（miss 口径）：全关错选 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：当前题该亮（breathe）的正确卡下标
   findexact/reverse=answer 单卡 / findall=answers 中下一个未勾真值卡逐张步进（§-r17 §5） */
function correctIdx(q) {
  if (!q) return -1;
  if (q.kind === 'findall') {
    for (const a of q.answers) if (q.picked.indexOf(a) < 0) return a;
    return -1;                                     // 三真值已集齐（过渡瞬间）
  }
  return q.answer;
}

/* ---------- 结构校验（verify 用，返回失败原因或 null）：结论/候选先验 /
   防双真值 / 档位律（dch1 无 weak/dch2 weak≥1+none≥1）/ answer 自洽 / flat0q0 锚点 /
   初始态干净 ---------- */
function structWhy(q, dch, flat, qi) {
  if (!q) return 'quiz';
  if (q.kind !== 'findexact' && q.kind !== 'findall' && q.kind !== 'reverse') return 'kind';
  if (CONCLS20.indexOf(q.concl) < 0) return 'conclPool';       // 结论 ⊆ 封闭 20
  const bank = EV_BANK[q.concl];
  if (dch <= 2 && q.kind !== 'findexact') return 'dchKind';    // ch1/2 只 findexact
  if (dch === 3 && q.kind !== 'findall') return 'dchKind';     // ch3 只 findall
  if (q.text !== (q.kind === 'findexact' ? Q1_TEXT : (q.kind === 'findall' ? Q2_TEXT : Q3_TEXT))) return 'text';
  const nT = q.kind === 'findexact' ? 1 : 3;                   // 恰 1 真 / 三真值全在场
  if (q.opts.length !== 4) return 'optLen';                    // 恒 4 候选
  const imgs = q.opts.map(o => o.img);
  if (new Set(imgs).size !== 4) return 'optDup';               // 候选互异
  const poolImg = bank.true.map(e => e.img).concat(bank.dstr.map(e => e.img));
  for (const v of imgs) if (poolImg.indexOf(v) < 0) return 'optPool';   // ⊆ 该结论证据池
  const tImgs = bank.true.map(e => e.img);
  const tCnt = imgs.filter(v => tImgs.indexOf(v) >= 0).length;
  if (tCnt !== nT) return 'truthN';                            // findexact 恰 1 真（防双真值）
  const dImgs = imgs.filter(v => tImgs.indexOf(v) < 0);        // 干扰位（findexact3/findall·reverse1）
  if (dImgs.length !== 4 - nT) return 'dstrN';
  const typeOf = v => { const d = bank.dstr.find(x => x.img === v); return d ? d.type : '?'; };
  if (q.kind === 'findexact') {
    const w = dImgs.filter(v => typeOf(v) === 'weak').length;
    const n = dImgs.filter(v => typeOf(v) === 'none').length;
    if (dch === 1 && (w !== 0 || n !== 3)) return 'tier1';     // 二分章：干扰全 none
    if (dch >= 2 && !(w >= 1 && n >= 1)) return 'tier2';       // 三档章：weak≥1+none≥1
    if (!Number.isInteger(q.answer) || q.answer < 0 || q.answer >= 4) return 'ansRange';
    if (tImgs.indexOf(q.opts[q.answer].img) < 0) return 'ansIdx';
    if (q.answers !== null) return 'extra';
    if (Array.isArray(q.picked) && q.picked.length !== 0) return 'extraP';
  } else if (q.kind === 'findall') {
    if (!Array.isArray(q.answers) || q.answers.length !== 3) return 'ansLen';
    if (new Set(q.answers).size !== 3) return 'ansDup';
    for (const a of q.answers) {
      if (!Number.isInteger(a) || a < 0 || a >= 4) return 'ansRange';
      if (tImgs.indexOf(q.opts[a].img) < 0) return 'ansIdx';
    }
    if (q.answers[0] >= q.answers[1] || q.answers[1] >= q.answers[2]) return 'ansOrder';   // 升序
    if (q.answer !== -1) return 'extra';
    if (!Array.isArray(q.picked) || q.picked.length !== 0) return 'picked0';
  } else {                                                     // reverse
    if (!Number.isInteger(q.answer) || q.answer < 0 || q.answer >= 4) return 'ansRange';
    if (tImgs.indexOf(q.opts[q.answer].img) >= 0) return 'ansIdx';   // answer=非真卡
    if (q.answers !== null) return 'extra';
    if (!Array.isArray(q.picked) || q.picked.length !== 0) return 'picked0';
  }
  if (flat === 0 && qi === 0) {                                // 教学演示锚：rainwet findexact puddle
    if (q.concl !== 'rainwet' || q.kind !== 'findexact' ||
        q.opts[q.answer].img !== 'puddle') return 'anchor';
  }
  if (q._miss !== 0 || q._answered) return 'init';
  return null;
}
/* ================= evidence 主逻辑（结论卡/证据卡渲染 / 点选·勾选判定 / 教学 / 救援 / 推进）
   r17（SPEC-BATCH32 §-r17-evidence）：结论卡（完整结论句+小侦探放大镜图标）+ 屏显问句
   + 证据场景图卡（SVG+短标签）。题型三族：
     findexact（ch1/ch2 点卡判定：tap 真=right / tap 干扰=wrong）

     findexact=[evi_c_<id>, evi_q1]（max 2832+150+2232+300=5514）

   单卡 / findall=下一个未勾真值卡——家族梯度脚手架）。

   放行；findall 勾选中性不吞，守卫挂 uiSubmit——窗内提交吞 pop+bump）。
   救援：14s 方向级=重播题面链（结论句+150+q 句）+结论卡 pulse（lastDir 独立节流锚，
   不重置 lastAct——30s 答案级不被饿死）/ 30s 答案级=正确卡 breathe+重读题面。
   验收钩子：window.EV = { get currentLevel, get quiz(){kind,concl,opts,answer/answers,

/* ================= 判对共同路径（uiTapOpt 点卡判对 / uiSubmit 提交判对共用）
   findexact/reverse=点亮所点卡 / findall=三真值卡 lit 保持；
   确认链=evi_right 单段（2472；演出窗 1600+1300=2900 ≥2472+300=2772） ================= */
async function finishCorrect(q, run, r, tapIdx) {
  lastAct = Date.now();                          /* 正确判定重置救援钟（§0.7a） */
  if (state.tut === 'help') {                    /* 教学"独"：首次判对 → 放手 */
    state.tut = 'solo';

  state.locked = true;
  if (q.kind === 'findall') {
    for (const a of q.answers) {
      const e2 = cardEl(a);
      if (e2) { e2.classList.remove('breathe', 'held'); e2.classList.add('lit'); }
    }
    updateSubmitState();
  } else if (tapIdx != null) {
    const el = cardEl(tapIdx);
    if (el) { el.classList.remove('breathe'); el.classList.add('lit'); }
  }
  chimeGoal();
  sfx('coin');
  if (cur === run) celebrateScene();
  KIDS.voice.queue([VOICE.right.key]);           /* 确认链=evi_right 单段 */
  await wait(1600 * SPEED);                      /* 确认链主窗（卡 lit+结论卡 pulse+兔子跳） */
  if (cur !== run) return r;
  await wait(1300 * SPEED);                      /* 确认链收尾窗：总 2900 ≥ 2472+300=2772（家族 G/H） */
  if (cur !== run) return r;
  state.locked = false;
  if (cur.done) { winFlow(); return 'done'; }    /* 末题通关 */
  renderQuiz();                                  /* 新题（结论卡/问句/证据卡全换）+读题 */
  return r;
}

/* ================= 点卡主路径（真实点击 / EV.tapOpt / autoSolve / 教学演示共用）
   findexact/reverse=点卡即判定步；findall=勾选切换（中性零惩罚）。
   吞输入轻叮必配可见回应（卡排容器 bump 微动效——家族 D）；
   错链豁免窗（契约 I r17，真时钟）：判定式题型窗内错点吞（pop+bump 不计 miss）、
   对选放行、窗后二错照计 miss；findall 勾选不吞（守卫挂 uiSubmit）========== */
async function uiTapOpt(i, demo) {
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop');
    replayAnim(boardEl, 'bump');

  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const judging = q.kind !== 'findall';          // findexact/reverse 判定步在点卡
  if (!demo && judging && wrongChainUntil && Date.now() < wrongChainUntil && i !== q.answer) {
    sfx('pop'); replayAnim(boardEl, 'bump'); return false;
  }
  const run = cur;                               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapOpt(cur, i);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }   // 越界/已答/已勾态非法=null+pop+bump
  const el = cardEl(i);

  if (r === 'pick' || r === 'unpick') {          /* findall 勾选切换：中性动作零惩罚（F17） */
    lastAct = Date.now();                        /* 主动选择重置救援钟（§0.7a） */
    if (el) el.classList.toggle('held', q.picked.indexOf(i) >= 0);
    if (r === 'pick') chimeLit();
    updateSubmitState();
    return r;
  }

  if (r === 'wrong') {                           /* 答错（findexact 点干扰/reverse 点真值卡）：摇头+错链+方向级 */
    state.locked = true;
    if (el) replayAnim(el, 'wig');
    dodgeLo();
    if (sayW([VOICE.wrong.key, { key: 'evi_again', text: WRONG_AGAIN }]))
      wrongChainUntil = Date.now() + WRONG_CHAIN_WIN;   /* 链豁免窗=4242（契约 I，T46 键段） */
    if (q._miss >= 2) breatheCorrect(q);          /* 答案级线索 miss≥2 才亮（家族梯度脚手架） */
    else pulseConcl();                            /* 首错=结论卡再 pulse（方向级，不泄答案） */
    await wait(1000 * SPEED);                     /* 错点防重入窗 1000ms；对选可打断链；救援由豁免窗让路 */
    if (cur !== run) return r;
    state.locked = false;
    return r;
  }

  /* ---- right/done（findexact 点真值 / reverse 点非真卡：本题完成或末题通关） ---- */
  return await finishCorrect(q, run, r, i);
}

/* ================= 提交主路径（findall 判定步；真实点击 / EV.tapSubmit / autoSolve 共用）
   契约 F17：picked 集==answers 集→right；漏/多选=wrong（miss+1）且已选对位保留
   （错选位清 .held+摇头），可续选补齐再提交；空选/被拦=false 不计 miss。
   契约 I r17：错链豁免窗内提交吞（pop+bump）——勾选中性不吞、判定步受窗保护 ========== */
async function uiSubmit(demo) {
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.kind !== 'findall') return false;
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil) {
    sfx('pop'); replayAnim(boardEl, 'bump'); return false;
  }
  const run = cur;
  const prevPicked = q.picked.slice();           /* 错选位取证（摇头演出用） */
  const r = engSubmit(cur);
  if (r === null || r === false) { sfx('pop'); replayAnim(boardEl, 'bump'); return r; }

  if (r === 'wrong') {                           /* 漏/多选：错选卡清勾+摇头+错链+方向级 */
    state.locked = true;
    for (const j of prevPicked) {
      if (q.answers.indexOf(j) < 0) {            /* 被清除的错选位（对位保留的不动） */
        const e2 = cardEl(j);
        if (e2) { e2.classList.remove('held'); replayAnim(e2, 'wig'); }
      }
    }
    dodgeLo();
    if (sayW([VOICE.wrong.key, { key: 'evi_again', text: WRONG_AGAIN }]))
      wrongChainUntil = Date.now() + WRONG_CHAIN_WIN;   /* 链豁免窗=4242（契约 I，T46 键段） */
    if (q._miss >= 2) breatheCorrect(q);          /* 答案级线索 miss≥2 才亮（findall=下一个未勾真值卡） */
    else pulseConcl();
    await wait(1000 * SPEED);                     /* 错点防重入窗（续选可打断链；救援由豁免窗让路） */
    if (cur !== run) return r;
    state.locked = false;
    updateSubmitState();
    return r;
  }

  /* ---- right/done（提交判对：三真值卡 lit 保持，本题完成或末题通关） ---- */
  return await finishCorrect(q, run, r, null);
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;

     genLevel 纯函数确定性，同 flat 恒同 dch——预告与实际章型恒一致，禁取模） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {

  const a0 = await window.EV.autoSolve();
  const lv0 = window.EV.currentLevel;
  const smokeA = a0.done && a0.taps === 8 && lv0.done && lv0.won &&
                 engStars(cur) === 3 && !document.querySelector('.k-celebrate');
  if (smokeA) npass++;
  smokes.flat0 = { ok: smokeA, taps: a0.taps, stars: engStars(cur) };

  /* ---- ⑪ UI 冒烟 B：flat16（dch3 全 findall）autoSolve 通关（taps=8——勾选不计步） ---- */
  total++;
  startLevel(16);
  const faCnt = cur.quizzes.filter(q => q.kind === 'findall').length;
  const a16 = await window.EV.autoSolve();
  const smokeB = a16.done && a16.taps === 8 && faCnt === 8 && window.EV.currentLevel.done;
  if (smokeB) npass++;
  smokes.flat16 = { ok: smokeB, taps: a16.taps, findallN: faCnt };

  /* ---- ⑪ UI 冒烟 C：flat16 先 1 错（勾干扰提交）再 autoSolve（1 错=2 星） ---- */
  total++;
  startLevel(16);
  await unlocked();
  const qC = window.EV.quiz;
  const wrongC = qC.opts.findIndex((o, i) => qC.answers.indexOf(i) < 0);
  await window.EV.tapOpt(wrongC);
  const rC = await window.EV.tapSubmit();                     // F17 wrong（miss 1）
  const aC = await window.EV.autoSolve();
  const lvC = window.EV.currentLevel;
  const smokeC = rC === 'wrong' && aC.done && lvC.done && lvC.won &&
                 lvC.miss === 1 && engStars(cur) === 2;
  if (smokeC) npass++;
  smokes.flat16wrong = { ok: smokeC, r: rC, taps: aC.taps, miss: lvC.miss, stars: engStars(cur) };

  /* ---- ⑫ 布局：双 viewport ×（flat0 / flat16 / flat24） ---- */
  function lum(hexStr) {
    const m = hexStr.match(/#?([0-9a-f]{6})/i);
    if (!m) return null;
    const n = [0, 2, 4].map(i => parseInt(m[1].substr(i, 2), 16) / 255)
      .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    return 0.2126 * n[0] + 0.7152 * n[1] + 0.0722 * n[2];
  }
  const ratioOf = (a, b) => { const x = lum(a), y = lum(b);
    return x == null || y == null ? 0 : (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const cssToHex = c => { const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    return m ? '#' + [1, 2, 3].map(i => ('0' + (+m[i]).toString(16)).slice(-2)).join('') : c; };
  function simView(w, h) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    startLevel(g._simFlat);
    const need = window.EV.quiz ? window.EV.quiz.opts.length : 4;
    const cards = Array.prototype.map.call(boardEl.querySelectorAll('.card'), b => ({
      w: b.offsetWidth, h: b.offsetHeight }));
    const cH = conclEl.offsetHeight;
    const hitOk = cards.length === need && cards.every(b => b.w >= 96 && b.h >= 96);   // 证据卡=主答案按钮
    const conclOk = cH >= 56;                                       // 结论卡触摸目标
    const sbShown = !submitBtn.classList.contains('hidden');
    const sbOk = !sbShown || (submitBtn.offsetWidth >= 48 && submitBtn.offsetHeight >= 48);
    const cB = ratioOf('#4A3B2E', '#FBF6EC') >= 3 &&
               ratioOf(cssToHex(getComputedStyle(boardEl.querySelector('.card')).borderLeftColor), '#FFF9EE') >= 3;
    const cS = ratioOf(cssToHex(getComputedStyle(conclEl).borderLeftColor), '#FBF6EC') >= 3;
    const de = document.documentElement;
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, flat: g._simFlat, cards: cards.length, cardH: Math.min.apply(null, cards.map(c => c.h)),
             conclH: cH, hitOk: hitOk, conclOk: conclOk, sbOk: sbOk, contrast: cB && cS, ox: ox,
             pass: hitOk && conclOk && sbOk && cB && cS && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const flat of [0, 16, 24]) {
    $id('game')._simFlat = flat;
    sims.push(simView(1280, 800));
    sims.push(simView(800, 1180));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                            // 还原真实 viewport 布局
  const layoutOk = sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑬ clips：evi_ 29 条（r17 28+T46 语义句 1）+ core 3 条全注入 + duration 辨别器（±60ms 全表） ---- */
  total++;
  const keys = Object.keys(KIDS.voice.clips);
  const eviKeys = ['evi_tut_watch', 'evi_tut_turn', 'evi_hint', 'evi_right', 'evi_wrong',
                   'evi_q1', 'evi_q2', 'evi_q3', 'evi_again'].concat(SPEC_CONCLS.map(c => 'evi_c_' + c));
  const needAll = eviKeys.concat(['core_chapter_end', 'core_day_end', 'core_rest']);
  const preOk = keys.length === 32 &&
    needAll.every(k => keys.indexOf(k) >= 0 && KIDS.voice.clips[k].indexOf('data:audio/mpeg;base64,') === 0);
  const durKeys = Object.keys(SPEC_DUR);
  const durs = await Promise.all(durKeys.map(k => new Promise(res => {
    let done = false;
    const a = new Audio(KIDS.voice.clips[k]);
    const t = setTimeout(() => { if (!done) { done = true; res(-2); } }, 3000);
    a.onloadedmetadata = () => { if (!done) { done = true; clearTimeout(t); res(Math.round(a.duration * 1000)); } };
    a.onerror = () => { if (!done) { done = true; clearTimeout(t); res(-1); } };
  })));
  const durOk = durs.every((d, i) => Math.abs(d - SPEC_DUR[durKeys[i]]) <= 60);
  const clipsOk = preOk && durOk;
  if (clipsOk) npass++;
  units.clips = { ok: clipsOk, n: keys.length, durs: durs };

  /* ---- ⑭ 星级规则（引擎级构造直测：0=3★ / 1-2=2★ / ≥3=1★，永不 0 星） ---- */
  total++;
  const LA = genLevel(16);
  LA.retries = 0; const st3 = engStars(LA) === 3;
  LA.retries = 1; const st2a = engStars(LA) === 2;
  LA.retries = 2; const st2b = engStars(LA) === 2;
  LA.retries = 3; const st1 = engStars(LA) === 1;
  LA.retries = 9; const stFloor = engStars(LA) === 1;   // 永不 0 星
  const starsOk = st3 && st2a && st2b && st1 && stFloor;
  if (starsOk) npass++;
  units.stars = { ok: starsOk, st3: st3, st2: st2a && st2b, st1: st1, floor: stFloor };

  /* ---- ⑮ 契约 A/B/E/F/I/J/K+I17/F17/MIG 源码断言（读第 3 script 块=游戏块 data+engine+main
     ——verify 独立第 4 块源码不自匹配；E-M1/E-M2 修复后未拼接串恢复真断言效力） ---- */
  total++;
  const src = document.querySelectorAll('script')[2].textContent;
  const nLim = src.split('nextHint(lim - 1)').length - 1;
  const srcA = nLim === 2 &&                                   // A（r17 双 lim-1）：winFlow+启动两处实算
               src.indexOf('Math.max(0, lim - 1)') >= 0 &&      // 日末停留今日末关
               src.indexOf('nextHint(null)') < 0;               // 旧 null 实参禁再现（含注释）
  const srcB = src.indexOf('lastDir') >= 0 && src.indexOf('lastAct') >= 0 &&
               src.indexOf('if (idle > 14000 && Date.now() - lastDir > 14000)') >= 0 &&
               src.indexOf('idle > 30000') >= 0;   // B：救援双锚（14s 方向级独立节流/30s 答案级）
  const srcE = src.indexOf('sv.evidence && sv.evidence.tutSeen') >= 0;   // E：行为分流先查教学特例
  const srcF = src.indexOf('GEN_HINTS[genLevel(f + 1).dch - 1]') >= 0 &&   // F：生成关实算 dch-1
               src.indexOf('(ci + 1)' + ' % 4') < 0;   // 禁章序右移（检索串拼接防 verify 源码自匹配）
  const srcI = src.indexOf('wrongChainUntil = Date.now() + WRONG_CHAIN_WIN') >= 0 &&
               src.indexOf('if (Date.now() < wrongChainUntil) return;') >= 0 &&
               src.indexOf('lastWrongVoice = 0; wrongChainUntil = 0;') >= 0 &&
               src.indexOf('2112 + 150 + 1680 + 300') >= 0;   // I：豁免窗常量=4242（T46）+救援守卫+重置
  const srcJ = src.indexOf('now - lastWrongVoice > 10000') >= 0;          // J：语义句 10s 节流在场
  const srcK = src.indexOf("if (document.querySelector('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel')) return;") >= 0 &&
               src.indexOf('function rescueTick()') >= 0;   // K：面板守卫+命名函数
  const sigI17 = 'if (!demo && wrongChainUntil' + ' && Date.now() < wrongChainUntil)';
  const srcI17 = src.indexOf(sigI17) >= 0;                 // I r17：findall 豁免窗守卫挂 uiSubmit
  const sigF17 = 'picked.filter(i => q.ans' + 'wers.indexOf(i) >= 0)';
  const srcF17 = src.indexOf('function eng' + 'Submit(') >= 0 && src.indexOf(sigF17) >= 0;   // F17 判分契约实码
  const sigMIG = "getItem('kids" + "game_evidence')";
  const srcMIG = src.indexOf(sigMIG) >= 0 &&
                 src.indexOf("lv[(c - 1) + '-5'") >= 0 &&
                 src.indexOf('> CH_LEN - 1') >= 0;          // MIG：键基迁移 IIFE（矛盾态+脏键守卫）
  const srcOk = srcA && srcB && srcE && srcF && srcI && srcJ && srcK && srcI17 && srcF17 && srcMIG;
  if (srcOk) npass++;
  units.contract = { ok: srcOk, A: srcA, nLim: nLim, B: srcB, E: srcE, F: srcF, I: srcI, J: srcJ, K: srcK,
                     I17: srcI17, F17: srcF17, MIG: srcMIG };

  /* ---- ⑯ 章末预告 C7 独立硬编码对账 + 生成关 nextHint 实算对账 ---- */
  total++;
  const hintOk = CHAPTERS[1].hint === SPEC_CHAPTER_HINTS[1] &&   // hint[i] ↔ CHAPTERS[i+1]（家族 F）
                 CHAPTERS[2].hint === SPEC_CHAPTER_HINTS[2] &&
                 CHAPTERS[3].hint === SPEC_CHAPTER_HINTS[3] &&
                 CHAPTERS[4].hint === SPEC_CHAPTER_HINTS[4] &&
                 GEN_HINTS[0] === SPEC_GEN_HINTS[0] && GEN_HINTS[1] === SPEC_GEN_HINTS[1] &&
                 GEN_HINTS[2] === SPEC_GEN_HINTS[2] && GEN_HINTS[3] === SPEC_GEN_HINTS[3] &&
                 nextHint(7) === SPEC_CHAPTER_HINTS[1] &&        // 章末（ch1 打完 flat7）预告 ch2 文案
                 nextHint(15) === SPEC_CHAPTER_HINTS[2] &&
                 nextHint(23) === SPEC_CHAPTER_HINTS[3] &&
                 nextHint(31) === SPEC_CHAPTER_HINTS[4];
  const genOk = [32, 35, 38, 39].every(f => nextHint(f) === GEN_HINTS[genLevel(f + 1).dch - 1]);   // F：实算
  if (hintOk && genOk) npass++;
  units.hints = { ok: hintOk && genOk, chapters: [1, 2, 3, 4].map(i => CHAPTERS[i].hint), gen: GEN_HINTS };

  /* ---- ⑰ estMs 语音窗动态断言（b25 定版：窗 ≥ estMs/链实长；clip 实长 §-r17 §5 表）
     判对确认链=evi_right 2472 单段 → 演出窗 1600+1300=2900 ≥ 2772；
     错链豁免窗=2112+150+evi_again 1680+300=4242（T46 clip 实长口径——estMs 字数口径退役）；
     题面链（知识断言）：findexact max=2832+150+2232+300=5514 / findall max=2832+150+3120+300=6402
     / reverse max=2832+150+2376+300=5658 ---- */
  total++;
  const maxConcl = SPEC_DUR.evi_c_nightowl;                   // 结论句 max 2832（§-r17 §5）
  const winOk = (1600 + 1300) >= SPEC_DUR.evi_right + 300 &&                          // 判对窗 2900 ≥ 2772
                (2112 + 150 + SPEC_DUR.evi_again + 300) === 4242 &&                    // 错链窗=4242（T46）
                WRONG_CHAIN_WIN === 4242 &&                                             // 常量自证
                (maxConcl + 150 + SPEC_DUR.evi_q1 + 300) === 5514 &&                   // findexact 题面链 max
                (maxConcl + 150 + SPEC_DUR.evi_q2 + 300) === 6402 &&                   // findall 题面链 max
                (maxConcl + 150 + SPEC_DUR.evi_q3 + 300) === 5658 &&                   // reverse 题面链 max
                3300 >= SPEC_DUR.evi_tut_watch + 300 &&                                 // 教学 watch 演示延 ≥ 3228
                3200 >= SPEC_DUR.evi_c_rainwet + 300 &&                                 // 教学结论句窗 ≥ 2076
                2300 >= SPEC_DUR.evi_tut_turn + 300 &&                                  // turn 后读题延 ≥ 2220
                (2620 + 400) >= SPEC_DUR.evi_right + 300;                               // winFlow ≥ 2772
  const estData = { confirmWin: 1600 + 1300, confirmNeed: SPEC_DUR.evi_right + 300,
                    wrongChain: 4242, q1ChainMax: maxConcl + 150 + SPEC_DUR.evi_q1 + 300,
                    q2ChainMax: maxConcl + 150 + SPEC_DUR.evi_q2 + 300,
                    q3ChainMax: maxConcl + 150 + SPEC_DUR.evi_q3 + 300,
                    watchT: 3300, conclWin: 3200, turnDelay: 2300, rightFlow: 3020 };
  if (winOk) npass++;
  units.estWin = { ok: winOk, est: estData };

  /* ---- ⑱ 时长模型 r17（§-r17 §4）：modeled(0)===88100 精确钉死 + 40 关 min===88100
     + 全关 ≥LEVEL_MIN_MS + 逐题 voiceWin≤DECIDE（语音从不撑时长）+ DECIDE 三族字面 ---- */
  total++;
  const decOk = DECIDE_MS.findexact === SPEC_DECIDE.findexact &&
                DECIDE_MS.findall === SPEC_DECIDE.findall &&
                DECIDE_MS.reverse === SPEC_DECIDE.reverse;
  const m0Ok = modeled(0) === SPEC_MODELED_MIN;
  let mdMin = Infinity, mdMax = 0, minBad = 0, vwBad = 0;
  for (let f = 0; f < 40; f++) {
    const L = genLevel(f);
    const m = modeled(f);
    mdMin = Math.min(mdMin, m);
    mdMax = Math.max(mdMax, m);
    if (m < LEVEL_MIN_MS) minBad++;
    for (const q of L.quizzes) if (voiceWinMs(q) > DECIDE_MS[q.kind]) vwBad++;
  }
  const mdOk = m0Ok && decOk && mdMin === SPEC_MODELED_MIN && minBad === 0 && vwBad === 0;
  if (mdOk) npass++;
  units.modeled = { ok: mdOk, flat0: modeled(0), min: mdMin, max: mdMax,
                    minBad: minBad, voiceWinBad: vwBad, decide: decOk };

  /* ---- ⑲ verify 提速断言 ---- */
  total++;
  const speedOk = SPEED === 0.12;
  if (speedOk) npass++;
  units.speed = { ok: speedOk, SPEED: SPEED };

  const out = { game: 'evidence', total: total, pass: npass, layoutOk: layoutOk,
                levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__evVlog = out;                          // 外部断言挂点（任务书钩子）
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text（__lastVoiceKey/__lastVoiceText）；
     voice.queue 记录拼播链（__lastQueue）供反馈链/确认链绑定断言 */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) { window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null; };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    window.__lastVoiceKey = parts && parts.length ? parts[0] : null;
  };
  runVerify();
}

</script>
