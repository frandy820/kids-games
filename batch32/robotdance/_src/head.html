<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>兔子机器人学跳舞</title>
<style>
/* ================= 兔子机器人学跳舞 robotdance（batch32·6-7 岁段，计算思维·序列记忆）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   主角=兔子机器人（兔耳+天线+方脸+铆钉，与家族圆兔子区分——机器人化）。
   玩法 = 看→拼（watch 演示相位 → build 按序点选重建 → dance 完整舞+确认链）
   + ch4 fix「改一步」题（演示正确版→槽区静态显示错版→点出错误格，SPEC-R43 §R5）。
   动作封闭 10（jump/spin/clap/stomp/wave/nod/kick/shake/bow/stretch）；
   步数 dch1 [3,4,4,5,5]/dch2 6/dch3 7/dch4 8；ch3/4 序列恒有重复（u=6，禁 3 连）；
   干扰=池中未用动作 3-4（同族舞步防排除法）。
   【SPEED 缩放换算声明】所有 CSS 动画时长 = calc(时长 * var(--t))，
   :root 默认 --t:1（真实页）；verify 页 JS 置 --t:0.12（=SPEED），
   JS 等待窗同步乘 SPEED——CSS 动画与 JS 窗同一换算因子，verify 提速不漂移。
   触摸目标：候选块 ≥96×88（≥48 下限）、槽 ≥64、dock 钮 ≥72；overflowX 恒 0
   （8 槽横排横屏 8×72+7×10=646 / 竖屏 8×62+7×10=566，≥800 视口全覆盖） */
:root{--t:1}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{color:#4A3B2E;font-family:inherit;cursor:pointer;border:none;background:none}   /* 契约 O：自建 button 显式 color */
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：相位提示 + 机器人演出区 + 序列槽 ---------- */
#stage{flex:1 1 auto;min-height:110px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;gap:4px;overflow:hidden;padding:4px 12px 6px}
#tip{flex:0 0 auto;font-size:19px;font-weight:700;padding:3px 18px;border-radius:13px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D9C9B4}
#robot-zone{flex:1 1 auto;min-height:120px;width:100%;max-width:560px;position:relative;
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  background:radial-gradient(58% 88% at 50 100%, #F7E7C8 0%, rgba(247,231,200,0) 72%);
  background:radial-gradient(58% 88% at 50% 100%, #F7E7C8 0%, rgba(247,231,200,0) 72%)}   /* 小舞台地毯 */
#robot-zone .robot{margin-bottom:2px}

/* ---------- 序列槽（虚线框，左→右；当前槽 pulse；填入=动作图+小字名+pop） ---------- */
#slots{flex:0 0 auto;display:flex;gap:10px;justify-content:center;align-items:stretch;padding:2px 0 4px}
.slot{position:relative;width:72px;height:80px;border:3px dashed #C9A87C;border-radius:16px;
  background:#FFF9EE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.slot .s-idx{position:absolute;left:5px;top:3px;font-size:11px;font-weight:700;font-style:normal;color:#8A7B6C}
.slot svg{width:44px;height:44px}
.slot .s-name{font-size:12px;font-weight:700;line-height:1.1}
.slot.cur{border-color:#E8975A;border-style:solid;
  animation:slot-pulse calc(1.1s*var(--t)) ease-in-out infinite}
@keyframes slot-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* fix 题（SPEC-R43 §R5）：槽=作答目标（可点反馈+错误格 wiggle+答案级 breathe 救援） */
.slot.pickable{cursor:pointer;border-style:solid;border-color:#C9A87C;transition:transform .12s}
.slot.pickable:active{transform:translateY(3px)}
.slot.wig{animation:slot-wig calc(.4s*var(--t)) ease}
@keyframes slot-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.slot.breathe{animation:slot-br calc(1.2s*var(--t)) ease-in-out infinite}
@keyframes slot-br{0%,100%{box-shadow:none;transform:scale(1)}
  50%{box-shadow:0 0 14px rgba(232,151,90,.95);transform:scale(1.06)}}
.slot.flash{animation:slot-flash calc(.55s*var(--t)) ease}
@keyframes slot-flash{0%{background:#FDEFDC;transform:scale(1.12)}100%{background:#FFF9EE;transform:scale(1)}}
.slot.fill-pop{animation:slot-pop calc(.2s*var(--t)) ease}
@keyframes slot-pop{0%{transform:scale(.45)}60%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ---------- 候选动作块区（build 相位显示；图+小字名 图主文辅） ---------- */
#board{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:12px;max-width:700px;padding:2px 4px}
#board.bump{animation:bd-bump calc(.22s*var(--t)) ease}
@keyframes bd-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.block{position:relative;width:104px;min-height:92px;border-radius:18px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D9C9B4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:6px 4px 5px;transition:transform .15s}
.block:active{transform:translateY(3px);box-shadow:0 2px 0 #D9C9B4}
.block svg{width:56px;height:56px;pointer-events:none}
.block .c-name{font-size:15px;font-weight:700;line-height:1.15;pointer-events:none}
.block.pop{animation:card-in calc(.4s*var(--t)) cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes card-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.block.gone{animation:block-out calc(.2s*var(--t)) ease forwards;pointer-events:none}
@keyframes block-out{to{transform:scale(.25);opacity:0}}
.block.wig{animation:blk-wig calc(.4s*var(--t)) ease}
@keyframes blk-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.block.breathe{animation:blk-br calc(1.2s*var(--t)) ease-in-out infinite}
@keyframes blk-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.06)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-bunny{width:82px;height:82px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-bunny:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-bunny svg{width:66px;height:66px}
#btn-bunny.hop{animation:bun-hop calc(.45s*var(--t)) ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:76px;height:76px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D9C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D9C9B4}
#btn-replay svg{width:46px;height:46px}
#btn-replay.bounce{animation:rep-b calc(.5s*var(--t)) ease 3}
@keyframes rep-b{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
#btn-hear{width:82px;height:82px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D9C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D9C9B4}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b calc(.45s*var(--t)) ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 兔子机器人 10 动作动画（CSS keyframes；时长=calc(*var(--t))——verify 换算声明见头部注）
   jump=整体上下位移 / spin=rotate 360 / clap=双手开合（臂组 rotate）/ stomp=单脚下踩+尘土 /
   wave=单臂摆动 / nod=头部组俯仰点头 / kick=右腿斜踢 / shake=整体左右摆 / bow=整体前倾鞠躬 /
   stretch=双臂高举（SPEC-R43 新 5——与旧 5 同族同节奏风格） ---------- */
.robot .rb-lift{transform-box:fill-box;transform-origin:50% 55%}
.robot .rb-head{transform-box:fill-box;transform-origin:50% 92%}
.robot .rb-armL,.robot .rb-armR{transform-box:fill-box;transform-origin:50% 4%}
.robot .rb-dust{opacity:0}
.robot.a-jump .rb-lift{animation:rb-jump calc(.85s*var(--t)) ease}
@keyframes rb-jump{0%,100%{transform:translateY(0)}32%{transform:translateY(-30px)}
  48%{transform:translateY(-20px)}66%{transform:translateY(-33px)}86%{transform:translateY(-4px)}}
.robot.a-spin .rb-lift{animation:rb-spin calc(1s*var(--t)) ease-in-out}
@keyframes rb-spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.robot.a-clap .rb-armL{animation:rb-clapL calc(.5s*var(--t)) ease 2}
.robot.a-clap .rb-armR{animation:rb-clapR calc(.5s*var(--t)) ease 2}
@keyframes rb-clapL{0%,100%{transform:rotate(0)}50%{transform:rotate(38deg)}}
@keyframes rb-clapR{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
.robot.a-stomp .rb-footR{animation:rb-stomp calc(.5s*var(--t)) ease 2}
@keyframes rb-stomp{0%,100%{transform:translateY(0)}45%{transform:translateY(8px)}}
.robot.a-stomp .rb-dust{animation:rb-dust calc(.9s*var(--t)) ease-out 2}
@keyframes rb-dust{0%{opacity:0;transform:translateX(0) scale(.4)}30%{opacity:.95}
  100%{opacity:0;transform:translateX(-22px) scale(1.2)}}
.robot.a-wave .rb-armR{animation:rb-wave calc(.45s*var(--t)) ease-in-out 3}
@keyframes rb-wave{0%,100%{transform:rotate(-112deg)}50%{transform:rotate(-140deg)}}
/* 新 5 动作（SPEC-R43 §R3） */
.robot.a-nod .rb-head{animation:rb-nod calc(.5s*var(--t)) ease 2}
@keyframes rb-nod{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
.robot.a-kick .rb-footR{animation:rb-kick calc(.55s*var(--t)) ease 2}
@keyframes rb-kick{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-10px) rotate(-42deg)}}
.robot.a-kick .rb-dust{animation:rb-dust calc(.9s*var(--t)) ease-out 2}
.robot.a-shake .rb-lift{animation:rb-shake calc(.45s*var(--t)) ease-in-out 4}
@keyframes rb-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.robot.a-bow .rb-lift{animation:rb-bow calc(1.1s*var(--t)) ease-in-out 1}
@keyframes rb-bow{0%,100%{transform:rotate(0)}45%,60%{transform:rotate(20deg) translateY(6px)}}
.robot.a-stretch .rb-armL{animation:rb-strL calc(.6s*var(--t)) ease 2}
.robot.a-stretch .rb-armR{animation:rb-strR calc(.6s*var(--t)) ease 2}
@keyframes rb-strL{0%,100%{transform:rotate(0)}50%{transform:rotate(-95deg)}}
@keyframes rb-strR{0%,100%{transform:rotate(0)}50%{transform:rotate(95deg)}}
/* 点对微缩重放（200ms 微缩版）：覆盖时长/次数 */
.robot.mini .rb-lift,.robot.mini .rb-head,.robot.mini .rb-armL,.robot.mini .rb-armR,.robot.mini .rb-footR{
  animation-duration:calc(.1s*var(--t));animation-iteration-count:2}
.robot.mini .rb-dust{animation-duration:calc(.2s*var(--t));animation-iteration-count:1}

/* ---------- 幽灵手指教学（照家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press calc(.6s*var(--t)) ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple calc(.6s*var(--t)) ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：机器人/块收紧，触摸目标仍 ≥48 */
@media (orientation:portrait){
  #tip{font-size:17px;padding:3px 14px}
  #robot-zone{min-height:104px}
  #robot-zone .robot{width:150px;height:auto}
  .slot{width:62px;height:70px}
  .slot svg{width:38px;height:38px}
  .slot .s-name{font-size:11px}
  #board{gap:10px}
  .block{width:96px;min-height:86px}
  .block svg{width:50px;height:50px}
  .block .c-name{font-size:14px}
  #btn-bunny{width:74px;height:74px}
  #btn-bunny svg{width:60px;height:60px}
}
</style>
</head>
<body>
<div id="game" aria-label="兔子机器人学跳舞">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="tip" aria-live="polite">看机器人跳舞</div>
    <div id="robot-zone" aria-hidden="true"></div>
    <div id="slots" aria-label="舞步序列槽"></div>
  </div>
  <div id="board" aria-label="动作块"></div>
  <div id="dock">
    <button id="btn-bunny" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再看一遍舞"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
