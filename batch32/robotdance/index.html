<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>兔子机器人学跳舞</title>
<style>
/* ================= 兔子机器人学跳舞 robotdance（batch32·6-7 岁段，计算思维·序列记忆）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   主角=兔子机器人（兔耳+天线+方脸+铆钉，与家族圆兔子区分——机器人化）。
   玩法 = 看→拼（watch 演示相位 → build 按序点选重建 → dance 完整舞+确认链）
   + ch4 fix「改一步」题（演示正确版→槽区静态显示错版→点出错误格，SPEC-R43 §R5）。
   动作封闭 10（jump/spin/clap/stomp/wave/nod/kick/shake/bow/stretch）；
   步数 dch1 [3,4,4,5,5]/dch2 6/dch3 7/dch4 8；ch3/4 序列恒有重复（u=6，禁 3 连）；
   干扰=池中未用动作 3-4（同族舞步防排除法）。
   【SPEED 缩放换算声明】所有 CSS 动画时长 = calc(时长 * var(--t))，
   :root 默认 --t:1（真实页）；verify 页 JS 置 --t:0.12（=SPEED），
   JS 等待窗同步乘 SPEED——CSS 动画与 JS 窗同一换算因子，verify 提速不漂移。
   触摸目标：候选块 ≥96×88（≥48 下限）、槽 ≥64、dock 钮 ≥72；overflowX 恒 0
   （8 槽横排横屏 8×72+7×10=646 / 竖屏 8×62+7×10=566，≥800 视口全覆盖） */
:root{--t:1}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{color:#4A3B2E;font-family:inherit;cursor:pointer;border:none;background:none}   /* 契约 O：自建 button 显式 color */
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：相位提示 + 机器人演出区 + 序列槽 ---------- */
#stage{flex:1 1 auto;min-height:110px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;gap:4px;overflow:hidden;padding:4px 12px 6px}
#tip{flex:0 0 auto;font-size:19px;font-weight:700;padding:3px 18px;border-radius:13px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D9C9B4}
#robot-zone{flex:1 1 auto;min-height:120px;width:100%;max-width:560px;position:relative;
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  background:radial-gradient(58% 88% at 50 100%, #F7E7C8 0%, rgba(247,231,200,0) 72%);
  background:radial-gradient(58% 88% at 50% 100%, #F7E7C8 0%, rgba(247,231,200,0) 72%)}   /* 小舞台地毯 */
#robot-zone .robot{margin-bottom:2px}

/* ---------- 序列槽（虚线框，左→右；当前槽 pulse；填入=动作图+小字名+pop） ---------- */
#slots{flex:0 0 auto;display:flex;gap:10px;justify-content:center;align-items:stretch;padding:2px 0 4px}
.slot{position:relative;width:72px;height:80px;border:3px dashed #C9A87C;border-radius:16px;
  background:#FFF9EE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.slot .s-idx{position:absolute;left:5px;top:3px;font-size:11px;font-weight:700;font-style:normal;color:#8A7B6C}
.slot svg{width:44px;height:44px}
.slot .s-name{font-size:12px;font-weight:700;line-height:1.1}
.slot.cur{border-color:#E8975A;border-style:solid;
  animation:slot-pulse calc(1.1s*var(--t)) ease-in-out infinite}
@keyframes slot-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* fix 题（SPEC-R43 §R5）：槽=作答目标（可点反馈+错误格 wiggle+答案级 breathe 救援） */
.slot.pickable{cursor:pointer;border-style:solid;border-color:#C9A87C;transition:transform .12s}
.slot.pickable:active{transform:translateY(3px)}
.slot.wig{animation:slot-wig calc(.4s*var(--t)) ease}
@keyframes slot-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.slot.breathe{animation:slot-br calc(1.2s*var(--t)) ease-in-out infinite}
@keyframes slot-br{0%,100%{box-shadow:none;transform:scale(1)}
  50%{box-shadow:0 0 14px rgba(232,151,90,.95);transform:scale(1.06)}}
.slot.flash{animation:slot-flash calc(.55s*var(--t)) ease}
@keyframes slot-flash{0%{background:#FDEFDC;transform:scale(1.12)}100%{background:#FFF9EE;transform:scale(1)}}
.slot.fill-pop{animation:slot-pop calc(.2s*var(--t)) ease}
@keyframes slot-pop{0%{transform:scale(.45)}60%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ---------- 候选动作块区（build 相位显示；图+小字名 图主文辅） ---------- */
#board{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:12px;max-width:700px;padding:2px 4px}
#board.bump{animation:bd-bump calc(.22s*var(--t)) ease}
@keyframes bd-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.block{position:relative;width:104px;min-height:92px;border-radius:18px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D9C9B4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:6px 4px 5px;transition:transform .15s}
.block:active{transform:translateY(3px);box-shadow:0 2px 0 #D9C9B4}
.block svg{width:56px;height:56px;pointer-events:none}
.block .c-name{font-size:15px;font-weight:700;line-height:1.15;pointer-events:none}
.block.pop{animation:card-in calc(.4s*var(--t)) cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes card-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.block.gone{animation:block-out calc(.2s*var(--t)) ease forwards;pointer-events:none}
@keyframes block-out{to{transform:scale(.25);opacity:0}}
.block.wig{animation:blk-wig calc(.4s*var(--t)) ease}
@keyframes blk-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.block.breathe{animation:blk-br calc(1.2s*var(--t)) ease-in-out infinite}
@keyframes blk-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.06)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-bunny{width:82px;height:82px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-bunny:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-bunny svg{width:66px;height:66px}
#btn-bunny.hop{animation:bun-hop calc(.45s*var(--t)) ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:76px;height:76px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D9C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D9C9B4}
#btn-replay svg{width:46px;height:46px}
#btn-replay.bounce{animation:rep-b calc(.5s*var(--t)) ease 3}
@keyframes rep-b{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
#btn-hear{width:82px;height:82px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D9C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D9C9B4}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b calc(.45s*var(--t)) ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 兔子机器人 10 动作动画（CSS keyframes；时长=calc(*var(--t))——verify 换算声明见头部注）
   jump=整体上下位移 / spin=rotate 360 / clap=双手开合（臂组 rotate）/ stomp=单脚下踩+尘土 /
   wave=单臂摆动 / nod=头部组俯仰点头 / kick=右腿斜踢 / shake=整体左右摆 / bow=整体前倾鞠躬 /
   stretch=双臂高举（SPEC-R43 新 5——与旧 5 同族同节奏风格） ---------- */
.robot .rb-lift{transform-box:fill-box;transform-origin:50% 55%}
.robot .rb-head{transform-box:fill-box;transform-origin:50% 92%}
.robot .rb-armL,.robot .rb-armR{transform-box:fill-box;transform-origin:50% 4%}
.robot .rb-dust{opacity:0}
.robot.a-jump .rb-lift{animation:rb-jump calc(.85s*var(--t)) ease}
@keyframes rb-jump{0%,100%{transform:translateY(0)}32%{transform:translateY(-30px)}
  48%{transform:translateY(-20px)}66%{transform:translateY(-33px)}86%{transform:translateY(-4px)}}
.robot.a-spin .rb-lift{animation:rb-spin calc(1s*var(--t)) ease-in-out}
@keyframes rb-spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.robot.a-clap .rb-armL{animation:rb-clapL calc(.5s*var(--t)) ease 2}
.robot.a-clap .rb-armR{animation:rb-clapR calc(.5s*var(--t)) ease 2}
@keyframes rb-clapL{0%,100%{transform:rotate(0)}50%{transform:rotate(38deg)}}
@keyframes rb-clapR{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
.robot.a-stomp .rb-footR{animation:rb-stomp calc(.5s*var(--t)) ease 2}
@keyframes rb-stomp{0%,100%{transform:translateY(0)}45%{transform:translateY(8px)}}
.robot.a-stomp .rb-dust{animation:rb-dust calc(.9s*var(--t)) ease-out 2}
@keyframes rb-dust{0%{opacity:0;transform:translateX(0) scale(.4)}30%{opacity:.95}
  100%{opacity:0;transform:translateX(-22px) scale(1.2)}}
.robot.a-wave .rb-armR{animation:rb-wave calc(.45s*var(--t)) ease-in-out 3}
@keyframes rb-wave{0%,100%{transform:rotate(-112deg)}50%{transform:rotate(-140deg)}}
/* 新 5 动作（SPEC-R43 §R3） */
.robot.a-nod .rb-head{animation:rb-nod calc(.5s*var(--t)) ease 2}
@keyframes rb-nod{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
.robot.a-kick .rb-footR{animation:rb-kick calc(.55s*var(--t)) ease 2}
@keyframes rb-kick{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-10px) rotate(-42deg)}}
.robot.a-kick .rb-dust{animation:rb-dust calc(.9s*var(--t)) ease-out 2}
.robot.a-shake .rb-lift{animation:rb-shake calc(.45s*var(--t)) ease-in-out 4}
@keyframes rb-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.robot.a-bow .rb-lift{animation:rb-bow calc(1.1s*var(--t)) ease-in-out 1}
@keyframes rb-bow{0%,100%{transform:rotate(0)}45%,60%{transform:rotate(20deg) translateY(6px)}}
.robot.a-stretch .rb-armL{animation:rb-strL calc(.6s*var(--t)) ease 2}
.robot.a-stretch .rb-armR{animation:rb-strR calc(.6s*var(--t)) ease 2}
@keyframes rb-strL{0%,100%{transform:rotate(0)}50%{transform:rotate(-95deg)}}
@keyframes rb-strR{0%,100%{transform:rotate(0)}50%{transform:rotate(95deg)}}
/* 点对微缩重放（200ms 微缩版）：覆盖时长/次数 */
.robot.mini .rb-lift,.robot.mini .rb-head,.robot.mini .rb-armL,.robot.mini .rb-armR,.robot.mini .rb-footR{
  animation-duration:calc(.1s*var(--t));animation-iteration-count:2}
.robot.mini .rb-dust{animation-duration:calc(.2s*var(--t));animation-iteration-count:1}

/* ---------- 幽灵手指教学（照家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press calc(.6s*var(--t)) ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple calc(.6s*var(--t)) ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：机器人/块收紧，触摸目标仍 ≥48 */
@media (orientation:portrait){
  #tip{font-size:17px;padding:3px 14px}
  #robot-zone{min-height:104px}
  #robot-zone .robot{width:150px;height:auto}
  .slot{width:62px;height:70px}
  .slot svg{width:38px;height:38px}
  .slot .s-name{font-size:11px}
  #board{gap:10px}
  .block{width:96px;min-height:86px}
  .block svg{width:50px;height:50px}
  .block .c-name{font-size:14px}
  #btn-bunny{width:74px;height:74px}
  #btn-bunny svg{width:60px;height:60px}
}
</style>
</head>
<body>
<div id="game" aria-label="兔子机器人学跳舞">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="tip" aria-live="polite">看机器人跳舞</div>
    <div id="robot-zone" aria-hidden="true"></div>
    <div id="slots" aria-label="舞步序列槽"></div>
  </div>
  <div id="board" aria-label="动作块"></div>
  <div id="dock">
    <button id="btn-bunny" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再看一遍舞"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= robotdance 纯引擎：确定性关卡生成 + 分相按序点选判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 823)（本款常量 823 不变，SPEC-R43 §R4）：同 flat 永远同关。
   章型（SPEC-R43 §R3；进度章号单调递增、难度章号 dch=1+flat//5 静态四档，生成关 ri(1,4)）：
     dch1 步数 qi 表 [3,4,4,5,5]（q0=锚面 3 步，flat0 q0 走 legacyQuiz 旧律逐字节）· 干扰 3
     dch2 步数 6 · u=6 无重复 · 干扰 3
     dch3 步数 7 · u=6 恒 ≥1 重复 · 干扰 4
     dch4 步数 8 · u=6 恒 ≥2 重复 · 干扰 4 · 每关恒 1 题 fix「改一步」（kq=ri(0,4) 掷位）
   铁律（SPEC-R43 §R2 防背）：允许重复但禁 3 连（相邻同动作 ≤2 连续）；
     fix 替换动作 bad 恒取自 steps 本身（disp 集合===steps 集合——集合记忆失效）+disp 无 3 连；
     候选块互异 ⊆池 ⊇步骤集；干扰=池中未用动作恰 NEW_CAP 个（同族防排除法）；块序洗牌 seeded。
   相位：q.phase 'watch'（演示期，判定一律 'watch'=吞输入）→ 'build'（开放点选）
   → 填满/点对错步位切 'dance'（演出期同样吞输入）；replay 重播=build 临时切回 watch（进度保留）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;
/* 章参数表（SPEC-R43 §R3）：dch1 题步数坡（q0=3 锚面）/ dch2-4 步数 / u 上限（ch3/4 恒有重复）/
   干扰数 NEW_CAP（池 10 中未用动作取 d 个——同族舞步防排除法） */
const CH1_STEPS = [3, 4, 4, 5, 5];
const DCH_STEPS = { 2: 6, 3: 7, 4: 8 };
const U_CAP = { 1: 5, 2: 6, 3: 6, 4: 6 };
const NEW_CAP = { 1: 3, 2: 3, 3: 4, 4: 4 };
const OLD_POOL = ['jump', 'spin', 'clap', 'stomp', 'wave'];   // 旧 5 池（flat0 q0 锚面专用）
const OLD_DCH_STEPS = { 1: 3, 2: 4, 3: 5 };                    // 旧章步数（锚面通道）
const OLD_DCH_CAP = { 1: 0, 2: 1, 3: 2, 4: 2 };                // 旧干扰上限（锚面通道）

/* 3 连工具（SPEC-R43 §R2.2 禁 3 连）：makesTriple=插入位 p 放 a 后是否构成同动作 3 连；
   hasTriple=全序列 3 连扫描（steps 与 fix disp 双查） */
function makesTriple(arr, p, a) {
  if (p > 0 && arr[p - 1] === a) {
    if (p > 1 && arr[p - 2] === a) return true;               // 左侧已 2 连
    if (p < arr.length && arr[p] === a) return true;          // 左右各 1 → 插入成 3 连
  }
  if (p < arr.length && arr[p] === a && p + 1 < arr.length && arr[p + 1] === a) return true;
  return false;
}
function hasTriple(arr) {
  for (let i = 2; i < arr.length; i++)
    if (arr[i] === arr[i - 1] && arr[i] === arr[i - 2]) return true;
  return false;
}

/* ---------- 单题构建（SPEC-R43 §R4 生成律；rnd 消耗序钉死禁改序——pycheck 逐位对拍）：
   n(0 rnd) → shuffled(POOL10)=9 rnd 取 u 种 → u<n 时重复注入（每个 2 rnd+3 连顺移 0 rnd）
   → fix（k 1 rnd + bad 掷位 1 rnd+顺移 0 rnd）→ 干扰 shuffled(rest) len-1 rnd → 块洗牌 n+d-1 rnd ---------- */
function buildQuiz(dch, rnd, qi, isFix) {
  const n = dch === 1 ? CH1_STEPS[qi] : DCH_STEPS[dch];
  const u = Math.min(n, U_CAP[dch]);
  const moves = shuffled(MOVE_POOL, rnd).slice(0, u);          // u 种动作（洗全池 9 rnd）
  let steps = moves.slice(0, n);                               // u≥n（ch1/ch2）：无重复
  for (let e = steps.length; e < n; e++) {                     // u<n（ch3/4）：重复注入
    const a = moves[ri(rnd, 0, u - 1)];                        // 1 rnd 重复动作
    let p = ri(rnd, 0, steps.length);                          // 1 rnd 插入位
    if (makesTriple(steps, p, a)) {                            // 3 连防御：顺移首个合法位（0 rnd）
      let q2 = (p + 1) % (steps.length + 1);
      while (q2 !== p && makesTriple(steps, q2, a)) q2 = (q2 + 1) % (steps.length + 1);
      p = q2;                                                  // 合法位恒存在（重复段 ≤2 时段间有隔断）
    }
    steps = steps.slice(0, p).concat([a], steps.slice(p));
  }
  if (isFix) {                                                 // fix 题（SPEC-R43 §R5）
    const k = ri(rnd, 0, n - 1);                               // 1 rnd 错步位（均匀，非恒位）
    const uniq = Array.from(new Set(steps)).filter(a => a !== steps[k]);
    const bi = ri(rnd, 0, uniq.length - 1);                    // 1 rnd bad 候选掷位
    let bad = uniq[bi];
    for (let t = 1; t < uniq.length; t++) {                    // disp 3 连防御：顺移候选（0 rnd）
      const cand = uniq[(bi + t) % uniq.length];
      const test = steps.slice(); test[k] = cand;
      if (!hasTriple(test)) { bad = cand; break; }
    }
    const disp = steps.slice(); disp[k] = bad;
    return { kind: 'fix', steps: steps, k: k, bad: bad, disp: disp,
             blocks: [], filled: new Array(n).fill(null),
             pos: 0, miss: 0, phase: 'watch', solved: false, _consumed: [] };
  }
  const d = NEW_CAP[dch];
  const stepSet = new Set(steps);
  const rest = MOVE_POOL.filter(a => !stepSet.has(a));          // 池中未用动作（10-u 个）
  const extras = shuffled(rest, rnd).slice(0, d);               // 干扰恰 d 个（同族）
  const order = shuffled(steps.concat(extras), rnd);            // 候选块顺序洗牌 seeded
  return { steps: steps, blocks: order.map(a => ({ anim: a })),
           filled: new Array(n).fill(null),
           pos: 0, miss: 0, phase: 'watch', solved: false,
           _consumed: order.map(() => false) };
}

/* ---------- flat0 q0 锚面（SPEC-R43 §R10：旧律逐字节保留——旧 5 池/3 步/0 干扰；
   rnd 消耗序与旧 buildQuiz(dch=1) 完全一致：shuffled(OLD5)=4 rnd + 块洗牌=2 rnd） ---------- */
function legacyQuiz(rnd) {
  const n = OLD_DCH_STEPS[1];
  const pool = shuffled(OLD_POOL, rnd);
  const steps = pool.slice(0, n);
  const k = Math.min(5 - n, OLD_DCH_CAP[1]);                   // =0（锚面无干扰）
  const extras = pool.slice(n, n + k);
  const order = shuffled(steps.concat(extras), rnd);
  return { steps: steps, blocks: order.map(a => ({ anim: a })),
           filled: new Array(n).fill(null),
           pos: 0, miss: 0, phase: 'watch', solved: false,
           _consumed: order.map(() => false) };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关随机章参数） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 823);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const kq = dch === 4 ? ri(rnd, 0, 4) : -1;                 // dch4 fix 题位（每关恒 1 题，SPEC-R43 §R3）
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) {
    if (flat === 0 && qi === 0) quizzes.push(legacyQuiz(rnd));       // 锚面：旧律逐字节
    else quizzes.push(buildQuiz(dch, rnd, qi, qi === kq));
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 教学关（仅 UI 层用：2 步舞=跳一跳+拍拍手，2 块自然序；SPEC §2） ---------- */
function genTutLevel() {
  const q = { steps: ['jump', 'clap'], blocks: [{ anim: 'jump' }, { anim: 'clap' }],
              filled: [null, null], pos: 0, miss: 0, phase: 'watch', solved: false,
              _consumed: [false, false] };
  return { flat: -1, ch: 1, dch: 1, lv: 0, quizzes: [q],
           step: 0, retries: 0, done: false, tutLevel: true };
}

/* ---------- 相位切换（UI 演示计时器到期时调用；verify/引擎直驱同口） ---------- */
function engToBuild(L) {
  if (!L || L.done) return false;
  const q = L.quizzes[L.step];
  if (!q || q.solved || q.phase !== 'watch') return false;
  q.phase = 'build';
  return true;
}
/* replay 重播：build 临时切回 watch（filled/pos/_consumed 全保留——重播不清进度，b18 同构；
   fix 题 replay=重播正确版演示（disp 槽显示保留——对比锚不撤，SPEC-R43 §R5） */
function engToWatch(L) {
  if (!L || L.done) return false;
  const q = L.quizzes[L.step];
  if (!q || q.solved || q.phase !== 'build') return false;
  q.phase = 'watch';
  return true;
}

/* ---------- 点块引擎（无 DOM）：engTapBlock(L, i) —— 点第 i 块候选（blocks 数组下标）
   'fill'  点对（块动作=当前步动作）：填槽 filled[pos]=动作、块消耗、pos++
   'done'  末槽填完（本题组装完成→dance 相位；末题末槽=L.done）
   'wrong' 点错（干扰块或顺序错位块）：miss+1（retries 全关累计=星级口径），
           已填槽不回退（错只计 miss 不清槽——b18 定案）
   'watch' watch/dance 演出演出期吞输入（uiTapBlock 层转 false+轻叮）
   null    非法下标 / 已消耗块 / 关卡已结束 ---------- */
function engTapBlock(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.blocks.length) return null;
  if (q._consumed[i]) return null;                  // 已消耗块（已填槽）非合法目标
  if (q.phase !== 'build') return 'watch';          // watch/dance 演出期吞输入
  if (q.blocks[i].anim === q.steps[q.pos]) {
    q.filled[q.pos] = q.steps[q.pos];
    q._consumed[i] = true;
    q.pos++;
    if (q.pos >= q.steps.length) {                  // 末槽填完=本题完成
      q.solved = true;
      q.phase = 'dance';
      L.step++;
      if (L.step >= L.quizzes.length) L.done = true;
      return 'done';
    }
    return 'fill';
  }
  q.miss++;
  L.retries++;
  return 'wrong';
}

/* ---------- 点槽引擎（fix 题专用，SPEC-R43 §R5；与 engTapBlock 同构单步原子判定 r25 M2）
   'done'  点对（i===k 错步位）：solved+切 dance（L.step/L.done 推进同 done 路径）
   'wrong' 点错（i!==k）：miss+1（retries 计星同口径）
   'watch' 非 build 相位吞输入
   null    非法下标 / 非 fix 题 / 关卡已结束 ---------- */
function engTapSlot(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved || q.kind !== 'fix') return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.steps.length) return null;
  if (q.phase !== 'build') return 'watch';
  if (i === q.k) {
    q.solved = true;
    q.phase = 'dance';
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return 'done';
  }
  q.miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（miss 口径）：全关错选 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 当前步正确块下标（未消耗且动作=steps[pos]；救援答案级/教学帮指/autoSolve 共用；
   fix 题 blocks 空 → -1（fix 题答案目标=槽 k，UI 层 fix 分流用 slotEl(q.k)，SPEC-R43 §R5） */
function correctIdx(q) {
  if (!q || q.solved) return -1;
  for (let j = 0; j < q.blocks.length; j++)
    if (!q._consumed[j] && q.blocks[j].anim === q.steps[q.pos]) return j;
  return -1;
}

/* ---------- 结构校验（verify 用，返回失败原因或 null；SPEC-R43 §R3/§R6 新谱全量重写）
   flat0 q0 锚面（legacyQuiz 产物）不适用本函数——verify 侧走锚对拍（逐字节），此处锚豁免。
   块律（重复步语义）：候选块多重集===步骤多重集∪干扰多重集——重复步=多个同名块
   （每步消耗一块按序点，孩子须监控块计数=「再认+复现」次数负荷，SPEC-R43 §R2.1） ---------- */
function structWhy(q, dch, qi) {
  if (!q) return 'quiz';
  if (q.phase !== 'watch' || q.pos !== 0 || q.miss !== 0 || q.solved) return 'init';
  const n = q.steps.length;
  const expN = dch === 1 ? CH1_STEPS[qi] : DCH_STEPS[dch];
  if (n !== expN) return 'stepsLen';                        // 步数谱（dch1 qi 表）
  for (const a of q.steps) if (MOVE_POOL.indexOf(a) < 0) return 'stepsPool';
  const u = new Set(q.steps).size;
  if (u !== Math.min(n, U_CAP[dch])) return 'uCap';         // 重复律（ch3/4 恒 u=6）
  if (hasTriple(q.steps)) return 'triple';                  // 禁 3 连
  const stepSet = new Set(q.steps);
  if (q.kind === 'fix') {                                   // fix 结构律（SPEC-R43 §R4/§R5）
    if (dch !== 4) return 'fixDch';
    if (q.k < 0 || q.k >= n) return 'fixK';
    if (q.bad === q.steps[q.k] || q.steps.indexOf(q.bad) < 0) return 'fixBad';   // bad∈steps 且≠steps[k]
    const disp = q.steps.slice(); disp[q.k] = q.bad;
    if (q.disp.join(',') !== disp.join(',')) return 'fixDisp';   // disp===steps 恰换 k 位
    if (!q.disp.every(a => stepSet.has(a))) return 'fixNew';     // 错版无新动作（防新奇检测 §R2.4）
    if (hasTriple(q.disp)) return 'fixTriple';                   // 错版也无 3 连（防规则泄题）
    if (q.blocks.length !== 0) return 'fixBlocks';               // fix 题 blocks 恒空（作答目标=槽）
    if (q.filled.length !== n || q.filled.some(x => x !== null)) return 'filled';
    return null;
  }
  if (q.kind) return 'kind';                                // 常规题 kind 必须空
  const anims = q.blocks.map(b => b.anim);
  const cnt = {}, stepCnt = {};
  anims.forEach(a => cnt[a] = (cnt[a] || 0) + 1);
  q.steps.forEach(a => stepCnt[a] = (stepCnt[a] || 0) + 1);
  for (const a of q.steps) if ((cnt[a] || 0) !== stepCnt[a]) return 'stepsCov';   // 步骤块计数全对（重复步=多块）
  let disN = 0;
  for (const a in cnt) if (!stepCnt[a]) {
    if (cnt[a] !== 1) return 'disDup';                      // 干扰块互异
    if (MOVE_POOL.indexOf(a) < 0) return 'disPool';
    disN++;
  }
  if (disN !== NEW_CAP[dch]) return 'disCnt';               // 干扰恰 NEW_CAP 个（同族=池中未用动作）
  if (q.filled.length !== n || q.filled.some(x => x !== null)) return 'filled';
  if (q._consumed.some(c => c)) return 'consumed';
  return null;
}
/* ================= robotdance 主逻辑（分相状态机渲染 / 按序点选判定 / 教学 / 救援 / 推进）

   语义链 [rbd_wrong, rbd_hint] 全程保留，禁切通用 clip） */
let lastWrongVoice = 0;
let wrongChainUntil = 0;                         /* 错反馈链豁免窗终点（救援 interval 让路，契约 I） */
const sayW = parts => {
  if (!cur) return false;
  if (cur.flat < 3) { KIDS.voice.queue(parts); return true; }
  const now = Date.now();
  if (now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.queue(parts); return true; }
  return false;                            /* 节流未播返回 false——豁免窗仅链起播时设（契约 I「起播设」） */
};

const tipEl = $id('tip'), robotZone = $id('robot-zone'), slotsEl = $id('slots'),
      boardEl = $id('board'), bunnyBtn = $id('btn-bunny'), replayBtn = $id('btn-replay'),
      hearBtn = $id('btn-hear'), ghostEl = $id('ghost');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none' };
let lastAct = Date.now();                       /* 30s 答案级 idle 锚（方向级不得重置它） */
let lastDir = Date.now();                       /* 14s 方向级独立节流锚（家族 B：与 lastAct 分离） */
let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）
let helpRedemo = false;
let watchT = null, watchRun = 0;                // watch 演示定时器 + 运行令牌（重开/重播中止在途演出）
window.__rdDemoLog = [];                        // watch 演示动作实录（verify 帧内容对账）
window.__rdDanceLog = [];                       // dance 完整舞动作实录（verify 对账）

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const blockEl = i => boardEl.querySelector('.block[data-i="' + i + '"]');
const slotEl = i => slotsEl.querySelector('.slot[data-slot="' + i + '"]');
const liveQuiz = () => cur && !cur.done ? cur.quizzes[cur.step] : null;

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  bunnyBtn.innerHTML = KIDS.assets.rabbit('normal', 66);
  robotZone.innerHTML = robotSvg(170);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：填对=双音上行 / 错=低柔单音 */
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };

/* ================= 渲染（渲染即引擎：DOM 锚与 quiz 真值一一对应——契约 M） ================= */
const TIP_TEXT = { watch: '看机器人跳舞', build: VOICE.q.text, dance: VOICE.right.text };
function renderTip(q) {
  tipEl.textContent = q.kind === 'fix'
    ? (q.phase === 'dance' ? TIP_TEXT.dance : VOICE.fix.text)   // fix 题面=找一找（SPEC-R43 §R5）
    : (TIP_TEXT[q.phase] || TIP_TEXT.watch);
}
function renderSlots(q, just) {
  slotsEl.innerHTML = '';
  /* fix 槽显示三分支（r43 修复轮 M1 2026-09-22）：build=错版 disp 全填可点（零视觉区分
     错误格）；dance=正确版（视觉修正演出）；**watch 首演=空槽**（SPEC §R5「孩子与记忆中
     正确版逐格对比」——首演期显示 disp 会把记忆保持弱化成实时找茬）；replay 例外=q._replay
     期间 disp 保留（SPEC §R5 明文「对比锚不撤」，审查 REPORT-REVIEW-r43 M1） */
  const fixShow = q.kind === 'fix'
    ? (q.phase === 'dance' ? q.steps
       : (q.phase === 'build' || q._replay) ? q.disp : null)
    : null;
  q.steps.forEach((a, i) => {
    const d = document.createElement('div');
    d.className = 'slot';
    d.dataset.slot = String(i);
    if (fixShow) {                               /* fix 题：build=错版 disp 全填可点（零视觉
                                                    区分错误格）；dance=正确版（视觉修正演出） */
      d.dataset.anim = fixShow[i];
      d.innerHTML = actionSvg(fixShow[i], 44) + '<div class="s-name">' + nameOf(fixShow[i]) + '</div>';
      if (q.phase === 'build' && !q.solved) d.classList.add('pickable');
    } else {
      const filled = q.filled[i] != null;
      if (filled) {                              // 已填槽=动作图+小字名（帧内容锚）
        d.dataset.anim = q.filled[i];
        d.innerHTML = actionSvg(q.filled[i], 44) + '<div class="s-name">' + nameOf(q.filled[i]) + '</div>';
        if (just != null && i === just) d.classList.add('fill-pop');   // 仅新填槽 pop（200ms）
      }
      if (i === q.pos && q.phase === 'build' && !q.solved) d.classList.add('cur');   // 当前槽
    }
    d.insertAdjacentHTML('beforeend', '<i class="s-idx">' + (i + 1) + '</i>');
    slotsEl.appendChild(d);
  });
}
function renderBoard(q) {
  if (q.phase !== 'build' || q.kind === 'fix') { boardEl.style.display = 'none'; boardEl.innerHTML = ''; return; }
  boardEl.style.display = '';
  boardEl.innerHTML = '';
  q.blocks.forEach((b, i) => {
    if (q._consumed[i]) return;                  // 已消耗块从候选区消失
    const el = document.createElement('button');
    el.className = 'block pop';
    el.dataset.i = String(i);
    el.dataset.anim = b.anim;                    // verify 对账（渲染即引擎）
    el.setAttribute('aria-label', nameOf(b.anim) + '动作块');
    el.innerHTML = actionSvg(b.anim, 56) + '<div class="c-name">' + nameOf(b.anim) + '</div>';
    el.style.animationDelay = (i * 60) + 'ms';
    boardEl.appendChild(el);
  });
}
function renderPhase(q, just) {
  if (!q) return;
  renderTip(q);
  renderSlots(q, just);
  renderBoard(q);
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
function renderQuiz() {
  const q = liveQuiz();
  if (!q) return;
  renderPhase(q);
  renderStep();
}

/* ================= 机器人动画（CSS keyframes；时长=calc(*var(--t)) 已随 SPEED 换算） ================= */
const MOVE_ANIM_MS = { jump: 850, spin: 1000, clap: 1000, stomp: 1000, wave: 1350,   // 名义全长（新 5 SPEC-R43）
                       nod: 1000, kick: 1100, shake: 1800, bow: 1100, stretch: 1200 };
function robotAnim(move, mini) {
  const rob = robotZone.querySelector('.robot');
  if (!rob) return;
  rob.classList.remove('a-jump', 'a-spin', 'a-clap', 'a-stomp', 'a-wave',
                       'a-nod', 'a-kick', 'a-shake', 'a-bow', 'a-stretch', 'mini');
  void rob.offsetWidth;
  if (mini) rob.classList.add('a-' + move, 'mini');
  else rob.classList.add('a-' + move);
  const dur = mini ? 220 : (MOVE_ANIM_MS[move] || 900);
  setTimeout(() => { rob.classList.remove('a-' + move, 'mini'); }, dur * SPEED + 50);
}
function pulseSlot(pos) {                        // 方向级：当前槽再 pulse（错反馈/救援共用）
  const el = slotEl(pos);
  if (el) replayAnim(el, 'flash');
}
function clearBreathe() {
  boardEl.querySelectorAll('.block.breathe').forEach(b => b.classList.remove('breathe'));
  slotsEl.querySelectorAll('.slot.breathe').forEach(s => s.classList.remove('breathe'));   // fix 答案级（SPEC-R43）
}
function bounceReplayBtn() { replayAnim(replayBtn, 'bounce'); }   // 首错：重播按钮在场提示

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向：当前步正确块（仅 build 相位——watch 期指向=泄底）；
   fix 题防御分流指槽 k（教学关无 fix——flat0 ch1，防御性兼容，SPEC-R43 §R5） */
function pointHelpNext() {
  const q = liveQuiz();
  if (!q || q.phase !== 'build') return;
  if (q.kind === 'fix') { const ke = slotEl(q.k); if (ke) pointGhostAt(ke); return; }
  const i = correctIdx(q);
  if (i >= 0) pointGhostAt(blockEl(i));
}

/* ================= watch 演示播放器（question 开题 / replay 重播 / dance 共用底层）
   逐动作：动画+名音 play+150 间隙（单段窗 STEP_MS=1834=预估 1684+150；实测 max stretch
   1704→间隙 130ms 零截断，r43 定版——minor4 勘误原 1734/1584 旧值，SPEC §4/§R8）；
   watchRun 令牌中止在途演出（重开/重播）；身份守卫 cur!==run 丢弃旧关续体 ================= */
function stopWatch() { clearTimeout(watchT); watchT = null; watchRun++; }
async function playMoves(q, run, token, logArr) {
  for (let k = 0; k < q.steps.length; k++) {
    if (token !== watchRun || cur !== run) return false;
    robotAnim(q.steps[k], false);
    KIDS.voice.play(nameClip(q.steps[k]), nameOf(q.steps[k]));
    if (logArr) logArr.push(q.steps[k]);
    await wait(STEP_MS * SPEED);                 // 单段 ≤1834ms（名音实测 max 1704，间隙 130）
  }
  return token === watchRun && cur === run;
}
/* 开题：lead 后播演示 → 演示完 [rbd_tut_turn, rbd_q] 转场链进 build（chainTurn=false
   供教学交接用——turn 刚播过，只补 q）；build 开始重置救援双锚 */
function startQuizFlow(lead, chainTurn) {
  stopWatch();
  const run = cur, token = watchRun;
  watchT = setTimeout(async () => {
    watchT = null;
    if (cur !== run || state.won || !run) return;
    const q = liveQuiz();
    if (!q || q.solved) return;
    renderPhase(q);
    const ok = await playMoves(q, run, token, window.__rdDemoLog);
    if (!ok) return;
    engToBuild(cur);
    /* 转场链：演示完「你来拼一拼」+「按顺序点一点」进 build（SPEC §0.77+§2；全 clip 无 keyless）；
       fix 题=任务句 [rbd_q_fix]「有一跳错啦，找一找」（SPEC-R43 §R5/§R7） */
    const chain = q.kind === 'fix' ? [VOICE.fix.key]
                : (chainTurn === false ? [VOICE.q.key] : [VOICE.turn.key, VOICE.q.key]);
    KIDS.voice.queue(chain);
    renderPhase(liveQuiz());
    lastAct = Date.now();                        /* build 开始重置救援钟（§0.7a） */
    lastDir = Date.now();
    if (state.tut === 'help') pointHelpNext();   // 教学"帮"：build 开放再指（不泄底）
  }, lead * SPEED);
}

/* ================= dance 演出相位：机器人按序完整跳 + 确认链（名音逐段+right 尾段）
   窗口：k 步最长 k×1834+2580（right 2280+300）；5 步=11750 ≥ 11050（SPEC §4，家族 G/H） */
async function danceFlow(run, q) {
  const chain = q.steps.map(a => nameClip(a)).concat([VOICE.right.key]);
  KIDS.voice.queue(chain);                       // 确认链：完整舞名音逐段+right 尾段（全 clip 无 keyless）
  const token = watchRun;
  for (let k = 0; k < q.steps.length; k++) {
    if (cur !== run || token !== watchRun) return;
    robotAnim(q.steps[k], false);
    window.__rdDanceLog.push(q.steps[k]);
    await wait(STEP_MS * SPEED);
  }
  if (cur !== run || token !== watchRun) return;
  await wait(2580 * SPEED);                      /* right 尾段 2280+300；总窗 5×1834+2580=11750 ≥ 11050 */
}

/* ================= 点块主路径（真实点击 / RD.tapBlock / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（块区容器 bump 微动效——家族 D）；
   错链豁免窗 guard（契约 I 补，真时钟禁 SPEED 缩水窗）：错点吞/对选放行/窗后照计 miss */
async function uiTapBlock(i, demo) {
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return false;
  }
  const q = liveQuiz();
  if (!q || q.solved) return false;
  if (!Number.isInteger(i) || i < 0 || i >= q.blocks.length) {   // 越界=null+pop+bump
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return null;
  }
  /* 契约 I 补：错链豁免窗（真时钟 4650）内错点吞（pop+bump 不计 miss）、对选放行 */
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil && q.blocks[i].anim !== q.steps[q.pos]) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return false;
  }
  const run = cur;                               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapBlock(cur, i);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }   // 越界/已消耗块
  if (r === 'watch') {                           /* watch/dance 演出期吞输入+轻叮（§0.22） */
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return false;
  }
  const el = blockEl(i);

  if (r === 'wrong') {                    /* 点错：块摇头+[rbd_wrong, rbd_hint] 全 clip 链+
                                            当前槽 pulse 方向级+重播按钮提示；已填槽不回退 */
    if (el) replayAnim(el, 'wig');
    dodgeLo();
    if (sayW([VOICE.wrong.key, VOICE.hint.key]))  /* 错链=rbd_wrong 1656+150+rbd_hint 2544+300 */
      wrongChainUntil = Date.now() + 4650;        /* 豁免窗 4650（契约 I；救援 interval 让路） */
    pulseSlot(q.pos);                             /* 方向级：当前应填槽高亮 */
    bounceReplayBtn();                            /* 首错：rbd_replay 重播按钮在场提示 */
    if (q.miss >= 2) {                            /* miss≥2=答案级：正确块 breathe（家族梯度） */
      const ci = correctIdx(q);
      if (ci >= 0) { const ce = blockEl(ci); if (ce) replayAnim(ce, 'breathe'); }
    }
    await wait(600 * SPEED);                      /* 摇头演完（§0.11）；无 locked 窗——豁免窗 guard 承担 */
    return r;
  }

  /* ---- fill / done（点对：填槽+块消失+200ms 微缩重放） ---- */
  lastAct = Date.now();                           /* 正确推进重置救援钟（§0.7a） */
  if (state.tut === 'help') {                     /* 教学"独"：首次点对 → 放手 */
    state.tut = 'solo';
    ghost.hide();
    hopBunny();
  }
  clearBreathe();
  if (el) el.classList.add('gone');               /* 块消失（微缩退场 200ms） */
  sfx('coin');
  const filledIdx = q.pos - 1;                    /* 引擎已 pos++：刚填槽下标 */
  robotAnim(q.steps[filledIdx], true);            /* 该动作 200ms 微缩重放 */
  if (r === 'fill') {
    await wait(260 * SPEED);                      /* 填槽+块退场演出窗 */
    if (cur !== run) return r;
    renderPhase(liveQuiz(), filledIdx);           /* 刷新槽/块区（消耗块消失+当前槽前移） */
    return r;
  }

  /* ---- done：末槽填完 → dance 相位（完整舞+确认链） ---- */
  state.locked = true;
  renderPhase(q, filledIdx);                      /* dance：槽全满+块区收起 */
  await wait(280 * SPEED);                        /* 填槽动画收尾（fill-pop 200） */
  if (cur !== run) return r;
  chimeGoal();
  await danceFlow(run, q);                        /* 机器人按序完整跳+名音逐段+right 尾段 */
  if (cur !== run) return r;
  state.locked = false;
  if (run.tutLevel) return r;                     /* 教学演示完成——交接由 tutorialWatch 接管 */
  if (engWon(run)) { winFlow(); return r; }       /* 末题末槽=通关 */
  renderQuiz();                                   /* 下一题（watch 相位） */
  startQuizFlow(600);
  return r;
}

/* ================= 点槽主路径（fix 题专用，SPEC-R43 §R5；真实点击 / RD.tapSlot / autoSolve 共用）
   单步原子判定（r25 M2）：i===k='done'（槽刷新正确版→dance 跳正确版+确认链）；
   i!==k='wrong'（miss+1+错链+豁免窗 4650 同常规+错点格 wig；miss≥2 槽 k breathe 答案级）；
   无中间态不卡死（豁免窗后可再点）；吞输入轻叮配容器 bump（家族 D） */
async function uiTapSlot(i) {
  if (!cur || state.won || state.locked || state.demo) {
    sfx('pop');
    replayAnim(slotsEl, 'bump');
    return false;
  }
  const q = liveQuiz();
  if (!q || q.solved || q.kind !== 'fix') return false;
  if (!Number.isInteger(i) || i < 0 || i >= q.steps.length) {   // 越界=null+pop+bump
    sfx('pop');
    replayAnim(slotsEl, 'bump');
    return null;
  }
  if (q.phase !== 'build') {                    // watch 演示期吞输入+轻叮（§0.22）
    sfx('pop');
    replayAnim(slotsEl, 'bump');
    return false;
  }
  /* 契约 I 补同律：错链豁免窗（真时钟 4650）内错点吞、对选放行 */
  if (wrongChainUntil && Date.now() < wrongChainUntil && i !== q.k) {
    sfx('pop');
    replayAnim(slotsEl, 'bump');
    return false;
  }
  const run = cur;                              /* 身份守卫：演出窗内重玩会重建 cur */
  const r = engTapSlot(cur, i);
  if (r === null) { sfx('pop'); replayAnim(slotsEl, 'bump'); return null; }
  if (r === 'watch') { sfx('pop'); replayAnim(slotsEl, 'bump'); return false; }
  const el = slotEl(i);

  if (r === 'wrong') {                          /* 点错格：格 wig+错链+miss≥2 槽 k breathe */
    if (el) replayAnim(el, 'wig');
    dodgeLo();
    if (sayW([VOICE.wrong.key, VOICE.hint.key]))   /* 错链=rbd_wrong 1656+150+rbd_hint 2544+300 */
      wrongChainUntil = Date.now() + 4650;        /* 豁免窗 4650（契约 I；救援 interval 让路） */
    if (q.miss >= 2) {                           /* miss≥2=答案级：槽 k breathe（家族梯度） */
      const ke = slotEl(q.k);
      if (ke) replayAnim(ke, 'breathe');
    }
    await wait(600 * SPEED);                     /* wig 演完（§0.11） */
    return r;
  }

  /* ---- done：点对错误格 → 槽刷新正确版（视觉修正演出）→ dance 跳正确版+确认链 ---- */
  lastAct = Date.now();                          /* 正确推进重置救援钟（§0.7a） */
  if (state.tut === 'help') { state.tut = 'solo'; ghost.hide(); hopBunny(); }
  clearBreathe();
  chimeGoal();
  state.locked = true;
  renderPhase(q);                                /* dance：槽=steps 正确版 */
  await wait(280 * SPEED);                       /* 修正演出收尾 */
  if (cur !== run) return r;
  await danceFlow(run, q);                       /* dance=跳正确版+确认链（steps 通用） */
  if (cur !== run) return r;
  state.locked = false;
  if (run.tutLevel) return r;
  if (engWon(run)) { winFlow(); return r; }
  renderQuiz();                                  /* 下一题（watch 相位） */
  startQuizFlow(600);
  return r;
}

/* ================= replay 重播演示（build 相位可用；RD.replay 与重播按钮共用）
   watch 相位完整重演动画+名音（filled/已消耗块全保留——重播不清进度）；返回 true/false */
async function replayDemo() {
  const q = liveQuiz();
  if (!q || q.solved || q.phase !== 'build') return false;
  sayR(VOICE.replay.key, VOICE.replay.text);      /* rbd_replay：再看一遍舞（1896ms） */
  engToWatch(cur);                                /* build 临时切回 watch（pos 保留） */
  q._replay = true;                               /* r43 M1：replay 期 disp 槽保留（对比锚不撤） */
  renderPhase(q);
  state.locked = true;                            /* 演出期吞输入（engTapBlock 'watch' 兜底） */
  await wait(2124 * SPEED);                       /* replay 前导窗：>rbd_replay 1896 无截断（余 228ms；
                                                  2124=turn 延窗值复用，家族 300 约定差 72ms——r43
                                                  minor3 勘误注记，原「≥1896+300」算式不成立 */
  const run = cur;
  const ok = await playMoves(q, run, watchRun, window.__rdDemoLog);
  if (!ok || cur !== run) { state.locked = false; return false; }
  engToBuild(cur);
  delete liveQuiz()._replay;                      /* 回 build 清 replay 标志（r43 M1） */
  renderPhase(liveQuiz());
  state.locked = false;
  lastAct = Date.now();                           /* 重播=主动交互，重置 idle 锚 */
  return true;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末）
   注：确认链 right 尾段已在 dance 相位播过，winFlow 不再重播 right（celebrate 承载收尾） */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关随机章型 GEN[dch-1]（家族 F：
     genLevel 纯函数确定性，同 flat 恒同 dch——预告与实际章型恒一致，禁 (ci+1)%4） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  stopWatch();
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(async () => {
    await wait(400);
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });   /* 家族 A：winFlow 传 nextHint(null) */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独（SPEC §2）
   看=教学关 2 步舞（跳一跳、拍拍手）：rbd_tut_watch「看！机器人跳舞啦」(3072) →
   机器人逐动作播 → 幽灵手指按序点两块填槽 → 'done'（完整舞+确认链）→ __rdDemoR；
   帮=交接真关 genLevel(0)，rbd_tut_turn「你来拼一拼」→首题演示→build 后指向正确块；
   独=首次点对放手。
   时序（真实页名义分账）：watch 延 3372（≥3072+300）+演示 2×1834+转场链起 420+
   ghost 2×920（含 pointGhostAt 内 800 移动+按压）+fill 260+60+280+dance 2×1834+2580
   = 16148 ≤ 16500（verify 实测同值；minor4 勘误原 1734/15748 为 STEP_MS 旧值 stale） */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';

  lastWrongVoice = 0; wrongChainUntil = 0;

  await wait(3372 * SPEED);                      /* t=3372 ≥ 3072+300=3372：clip 播完再演（不撞头） */
  if (state.tut !== 'watch') return;
  const run = cur;

  if (!ok || state.tut !== 'watch' || cur !== run) return;
  engToBuild(cur);

  renderPhase(run.quizzes[0]);                   /* build：块出现 */
  await wait(420 * SPEED);                       /* 转场链起+块入场（链异步续播） */
  if (state.tut !== 'watch' || cur !== run) return;
  /* 幽灵手指按序点两块填槽（pointGhostAt 内 800 移动+按压，920 窗覆盖） */
  for (let t = 0; t < 2; t++) {

/* ================= 无操作看护（契约 B/K）：watch/dance 演出相位豁免 idle（演出即引导，
   不计时——§0.77 演示相位定义）；build 14s 方向级（当前步名音+槽 pulse，lastDir 独立
   节流锚，不动 lastAct）/30s 答案级（正确块 breathe+当前步名音）；教学"帮"5s 重演示 */
function rescueTick() {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  if (Date.now() < wrongChainUntil) return;   /* 错反馈链豁免窗（契约 I）：链播完前救援不掐断 */
  if (document.querySelector('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel')) return;
  /* 面板在场守卫（契约 K）：面板遮挡期救援静默 */
  const q = liveQuiz();
  if (!q || q.solved || q.phase !== 'build') return;   /* watch/dance 演出相位不计时（演出即引导） */
  const idle = Date.now() - lastAct;
  if (idle > 30000) {                            /* 答案级：静音也能看见答案线索 */
    if (q.kind === 'fix') {                      /* fix 题：错误槽 k breathe+任务重述（SPEC-R43 §R5） */
      const ke = slotEl(q.k);
      if (ke) replayAnim(ke, 'breathe');
      KIDS.voice.play(VOICE.fix.key, VOICE.fix.text);
    } else {
      const ci = correctIdx(q);
      if (ci >= 0) { const ce = blockEl(ci); if (ce) replayAnim(ce, 'breathe'); }
      KIDS.voice.play(nameClip(q.steps[q.pos]), nameOf(q.steps[q.pos]));
    }
    lastAct = Date.now();
    return;
  }
  if (idle > 14000 && Date.now() - lastDir > 14000) {   /* 方向级（不动 lastAct） */
    if (q.kind === 'fix') {                      /* fix 题=任务重述（hint「下一步」语义不符） */
      KIDS.voice.play(VOICE.fix.key, VOICE.fix.text);
    } else {                                     /* 常规题：当前步名音+槽 pulse */
      KIDS.voice.play(nameClip(q.steps[q.pos]), nameOf(q.steps[q.pos]));
      pulseSlot(q.pos);
    }
    lastDir = Date.now();
    return;
  }
  if (idle > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {
    helpRedemo = true;
    pointHelpNext();
  }
}

/* ================= 验收钩子（getter 模式，返回拷贝非活引用；start(flat)=外部切关入口；
   verify 页与真实页都暴露——b29 坑⑥） ================= */
window.RD = {
  start(flat) { startLevel(flat); },
  get currentLevel() {
    if (!cur) return null;
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.quizzes.length,
             step: cur.step, done: cur.done, won: state.won,
             miss: cur.retries, stars: engStars(cur) };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    return { steps: q.steps.slice(),                     /* SPEC §2：steps=动作 id 序列真值 */
             blocks: q.blocks.map(b => ({ anim: b.anim })),   /* 候选块 {anim} 含干扰（全量；fix 题空） */
             filled: q.filled.slice(),                   /* 已填槽动作 id 或 null */
             step: q.pos,                                /* 当前应填下标 0 基 */
             miss: q.miss,
             phase: q.phase,                             /* 'watch'|'build'|'dance' */
             kind: q.kind || 'seq',                      /* 'seq'|'fix'（SPEC-R43 §R5） */
             k: q.kind === 'fix' ? q.k : undefined,      /* fix 错步位（0 基） */
             bad: q.kind === 'fix' ? q.bad : undefined,  /* fix 替换动作 */
             disp: q.kind === 'fix' ? q.disp.slice() : undefined };   /* fix 错版显示序列 */
  },
  tapBlock(i) { return uiTapBlock(i); },                 /* 'fill'/'done'/'wrong'/越界 null/吞 false */
  tapSlot(i) { return uiTapSlot(i); },                   /* fix 题点槽：'done'/'wrong'/null/false（SPEC-R43） */
  replay() { return replayDemo(); },                     /* build 相位重播演示（watch 重演+名音；fix=正确版） */
  async autoSolve() {                    // UI 路径自动点完当前关（真实等演示/舞演出→逐块照序点）
    let taps = 0, guard = 0;
    while (cur && !cur.done && guard++ < 300) {
      const q = cur.quizzes[cur.step];
      if (!q) break;
      if (q.phase !== 'build') { await waitPhase(q); continue; }
      let wg = 0;
      while ((state.locked || state.demo) && wg++ < 900) await wait(50);
      const cq = cur.quizzes[cur.step];
      if (!cq || cq.solved || cq.phase !== 'build') continue;
      if (cq.kind === 'fix') {                     /* fix 题：点错误槽 k（SPEC-R43 §R5） */
        const r = await uiTapSlot(cq.k);
        if (r === 'done') taps++;
        else if (r === false || r === null) await wait(200);
        continue;
      }
      const ci = correctIdx(cq);
      if (ci < 0) break;
      const r = await uiTapBlock(ci);
      if (r === 'fill' || r === 'done') taps++;
      else if (r === false || r === null) await wait(200);
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
  get tutorial() { return state.tut; }
};
/* 轮询等演出相位结束（autoSolve/verify 驱动用；真实等待不猜时长） */
async function waitPhase(q) {
  const span = (3200 + 10 * STEP_MS) * SPEED + 6000;   /* 8 步+2 余量（SPEC-R43 §R8） */
  const t0 = Date.now();
  while (Date.now() - t0 < span) {
    if (!cur || cur.done) return true;
    const cq = cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)];
    if (cq && (cq.solved || cq.phase === 'build')) return true;
    await wait(50);
  }
  return !!(cur && cur.done);
}
