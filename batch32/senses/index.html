<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五感侦探</title>
<style>
/* ================= 五感侦探 senses（batch32·扩容批 2；r11 难度改造 v2）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法（r11 四族）= 题面大图 + 题面句 + 候选图卡点选/勾选提交（图卡=SVG 零文字——
   5-6 岁不识字可玩，语义语音承载）。
   find=findsense（物品大图→选感官卡）/findthing（感官大图→选物品卡）恒 4 候选；
   multi=多感官物大图→5 感官卡全选恰 3+提交钮（漏选/多选都错）；
   anti=打叉（否决圈）感官小人→4 物品卡选「不是用它的」（抑制式）；
   comp=多感官物+捂住徽章→4 感官卡选「捂住了还能用的」（失能代偿）。
   触摸目标：候选卡 ≥96×96、题面大图 ≥120 高、提交钮横屏 78/竖屏 70（均 ≥64 家族下界）；overflowX 恒 0。
   竖屏规则双通道：@media(orientation:portrait) 真视口 + body.port 类（verify 竖屏模拟
   通道——媒体查询跟视口不跟元素，r7-r10 纪律⑥）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面大图 + 候选图卡排 + 提交钮（multi） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}

/* 题面：暖色侦察垫 + 大图 + 题面句文字条（点=重听+大图 pulse 方向级回锚） */
#scene{flex:0 0 auto;position:relative;width:min(420px,92vw);min-height:216px;border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F8E7C2 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene .ask-slot{position:relative;display:flex;align-items:flex-end;justify-content:center;
  min-height:150px}
#scene .ask-slot svg{width:150px;height:150px}
#scene .ask-slot .ask-shadow{position:absolute;left:50%;bottom:2px;width:110px;height:14px;
  border-radius:50%;background:#EAD3A8;opacity:.75;transform:translateX(-50%)}
#scene .q-text{font-size:21px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}
#scene.pulse{animation:sc-pulse 1.1s ease-in-out 3}
@keyframes sc-pulse{0%,100%{box-shadow:0 4px 0 #D8C9B4}50%{box-shadow:0 0 0 10px rgba(232,151,90,.4)}}
#scene .ask-slot.jump{animation:ask-jump .5s ease 2}
@keyframes ask-jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
#scene .demo-pet{position:absolute;right:10px;bottom:8px;opacity:0;transform:translateX(24px);
  transition:all .5s cubic-bezier(.2,1.4,.4,1)}
#scene .demo-pet.show{opacity:1;transform:translateX(0)}

/* anti 打叉感官小人：否决圈盖在题面大图上（红圈+斜杠=「不是用它」） */
#scene .not-ring{position:absolute;left:50%;top:6px;width:150px;height:150px;
  transform:translateX(-50%);pointer-events:none}
#scene .not-ring:before,#scene .not-ring:after{content:"";position:absolute;left:50%;top:50%}
#scene .not-ring:before{width:112px;height:112px;border:9px solid #D9534F;border-radius:50%;
  transform:translate(-50%,-50%);opacity:.92}
#scene .not-ring:after{width:138px;height:9px;background:#D9534F;border-radius:5px;
  transform:translate(-50%,-50%) rotate(-45deg);opacity:.92}
/* comp 捂住徽章：右下角感官小人小图+否决圈（「这个捂住了」） */
#scene .cov-badge{position:absolute;right:2px;bottom:2px;width:80px;height:80px;
  border-radius:16px;background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 2px 0 #D8C9B4;pointer-events:none}
#scene .cov-badge .cov-ic{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%)}
#scene .cov-badge .cov-ic svg{width:42px;height:42px}
#scene .cov-badge > svg{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:74px;height:74px}

/* ---------- 候选图卡排（主答案按钮 ≥96×96；multi=5 卡收紧仍 ≥96） ---------- */
#board{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:14px;max-width:760px;padding:2px 4px}
#board.bump{animation:bd-bump .22s ease}
@keyframes bd-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;width:150px;min-height:128px;border-radius:20px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;padding:8px 6px;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card svg{width:104px;height:104px;pointer-events:none}
.card.pop{animation:card-in .4s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes card-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.card.lit{border-color:#E8975A;background:#FDEFDC;
  animation:card-lit .5s ease}
@keyframes card-lit{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
.card.wig{animation:card-wig .4s ease}
@keyframes card-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
.card.breathe{animation:card-br 1.2s ease-in-out infinite}
@keyframes card-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.05)}}

/* multi 勾选态：暖橙边+绿勾徽章（.tick 默认隐藏）；5 卡收紧 */
.card .tick{display:none;position:absolute;right:5px;top:5px;width:26px;height:26px;
  border-radius:50%;background:#8FBF7F;border:2.5px solid #4A3B2E}
.card .tick:before{content:"";position:absolute;left:6px;top:5px;width:11px;height:16px;
  border-right:3.5px solid #FFFDF6;border-bottom:3.5px solid #FFFDF6;transform:rotate(40deg)}
.card.held{border-color:#E8975A;background:#FDEFDC;box-shadow:0 5px 0 #E8B47E}
.card.held .tick{display:block;animation:card-lit .35s ease}
#board.w5{gap:10px;max-width:770px}
#board.w5 .card{width:132px;min-height:104px}
#board.w5 .card svg{width:88px;height:88px}

/* multi 提交钮（选好啦）：默认安静，armed=橙描边，ready=呼吸（计数驱动不泄答案） */
#btn-submit{width:78px;height:78px;border-radius:50%;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s;opacity:.55}
#btn-submit svg{width:48px;height:48px}
#btn-submit:active{transform:translateY(3px)}
#btn-submit.armed{opacity:1}
#btn-submit.ready{opacity:1;border-color:#8FBF7F;
  animation:sub-ready 1.1s ease-in-out infinite}
@keyframes sub-ready{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#btn-submit.hidden{display:none}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-31） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* ---------- 竖屏收紧（真视口媒体查询 + body.port 模拟通道双落点，规则逐条相同） ---------- */
@media (orientation:portrait){
  #scene{width:min(340px,94vw);min-height:196px}
  #scene .ask-slot{min-height:124px}
  #scene .ask-slot svg{width:124px;height:124px}
  #scene .q-text{font-size:18px;padding:3px 14px}
  #scene .not-ring{width:124px;height:124px}
  #board{gap:11px}
  .card{width:132px;min-height:112px}
  .card svg{width:90px;height:90px}
  #board.w5{gap:8px}
  #board.w5 .card{width:110px;min-height:98px}
  #board.w5 .card svg{width:78px;height:78px}
  #btn-submit{width:70px;height:70px}
  #btn-submit svg{width:44px;height:44px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
body.port #scene{width:min(340px,94vw);min-height:196px}
body.port #scene .ask-slot{min-height:124px}
body.port #scene .ask-slot svg{width:124px;height:124px}
body.port #scene .q-text{font-size:18px;padding:3px 14px}
body.port #scene .not-ring{width:124px;height:124px}
body.port #board{gap:11px}
body.port .card{width:132px;min-height:112px}
body.port .card svg{width:90px;height:90px}
body.port #board.w5{gap:8px}
body.port #board.w5 .card{width:110px;min-height:98px}
body.port #board.w5 .card svg{width:78px;height:78px}
body.port #btn-submit{width:70px;height:70px}
body.port #btn-submit svg{width:44px;height:44px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
</style>
</head>
<body>
<div id="game" aria-label="五感侦探">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="题面，点我再听一遍"></button>
    <div id="board" aria-label="候选图卡"></div>
    <button id="btn-submit" class="hidden" aria-label="选好了，点这里"></button>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

       点物品卡 4 候选，干扰不含真值同感官另一物——防双真值）；
     multi=出示多感官物+名音+sen_q3「都用什么呢，找全哦」→5 感官卡全选恰 3（勾选 .held+提交制，

/* r11 否决圈（anti 打叉感官小人 / comp 捂住徽章共用）：红圈+斜杠（通用「不是它」符号，零文字） */

/* ================= senses 纯引擎：确定性关卡生成 + 四族题型判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 421)（本批常量 sen=421，SPEC-BATCH32 §0.76/§6 r11 定版）：
   同 flat 永远同关（重玩一致、verify 可检）。
   章型（r11 v2：CH_FAMILY 每章 5 题族序定版，q0 恒单选题型；进度章号单调递增、
   难度章号 dch=1+flat//5 静态四档，生成关 flat≥20 dch=ri(1,4)）：
     dch1 [find,multi,find,multi,multi]——find 复习（恒 4 候选两族混出）+multi 多感官全选入门
     dch2 [anti,multi,anti,find,anti]——anti 通感排除主场
     dch3 [anti,multi,comp,multi,anti]——comp 失能代偿引入
     dch4 [comp,multi,anti,comp,find]——四族混出
   铁律（verify/structWhy 双侧独立复算）：
     find——findsense 候选感官互异含真值 ⊆感官 5 恒 4；findthing 候选物品互异含真值 ⊆物品 10
       恒 4 且干扰不含真值同感官另一物（防双真值——每感官至多 1 物在场）；
     multi——候选=感官 5 全集（互异 5 卡），answers=该物感官集下标恰 3，漏选/多选都错；
     anti——ask=感官 S；候选 4 物品卡互异，其中「相关」=THINGS_OF[S] 2 单感官物+1 含 S
       多感官物恰 3，「不相关」恰 1=answer（防双真值：判相关须掌握多感官物感官集）；
     comp——ask=多感官物 m，blocked=其感官之一；候选 4 感官卡=真值 A+被捂 S（诱惑恒在）+
       感官集外恰 2（5-3=2 恒填满）；另一剩余感官 B 禁在场（防双真值——恰 1 可用真值）；
     flat0 题0 锚定 findsense/bell（教学「看闹钟响图点耳朵卡」演示锚点）；
     相邻题（族:题键）互异。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 每关题序表（genLevel 预生成；r11 章型位序制 CH_FAMILY[dch] 逐位取材，rnd 同流保确定性）
   find 位逐题掷 findsense/findthing+物品；multi 位取多感官物；anti 位取感官；
   comp 位取多感官物+seeded 洗牌其感官集（blocked=洗牌[0]，truth=洗牌[1]——另一剩余禁入候选）；
   flat0 题0 恒 findsense/bell（§1 教学演示锚点）；相邻题互异（族:题键重掷 ≤8 兜底） ---------- */
const specKeyOf = s =>
  s.kind === 'findsense' ? 'fs:' + s.thing :
  s.kind === 'findthing' ? 'ft:' + SENSE_OF[s.thing] :
  s.kind === 'multi' ? 'mu:' + s.mthing :
  s.kind === 'anti' ? 'an:' + s.sense :
  'co:' + s.mthing + ':' + s.blocked;

function specSeqOf(dch, rnd, flat) {
  const coin = () => rnd() < 0.5 ? 'findsense' : 'findthing';
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const compSpec = () => {
    const m = pick(MULTI5), ss = shuffled(MULTI_SENSES[m], rnd);
    return { kind: 'comp', mthing: m, blocked: ss[0], truth: ss[1] };
  };
  const roll = fam => fam === 'find' ? { kind: coin(), thing: pick(THINGS10) } :
      fam === 'multi' ? { kind: 'multi', mthing: pick(MULTI5) } :
      fam === 'anti' ? { kind: 'anti', sense: pick(SENSES5) } : compSpec();
  let specs = CH_FAMILY[dch].map(fam => roll(fam));
  if (flat === 0) specs[0] = { kind: 'findsense', thing: 'bell' };   // 教学演示锚点：闹钟响响点耳朵
  let prev = null;                                  // 相邻题互异（fs 问物/ft 问感官/mu 问物/an 问感官/co 问物+被捂）
  for (let qi = 0; qi < CH_LEN; qi++) {
    let s = specs[qi], pk = prev && specKeyOf(prev);
    for (let g = 0; g < 8 && specKeyOf(s) === pk; g++) {
      s = roll(CH_FAMILY[dch][qi]);
      specs[qi] = s;
    }
    prev = specs[qi];
  }
  return specs;
}

/* ---------- 单题构建（四族；洗牌+answer/answers 自洽）
   find：ask=物品(findsense)/感官(findthing)，候选恒 4；findthing 干扰按「感官已占位」排除
     （每感官至多 1 物在场——防双真值）；
   multi：候选=感官 5 全集洗牌；answers=该物感官集下标升序恰 3；picked=[];
   anti：相关=THINGS_OF[S](2 单感官物)+1 seeded 含 S 多感官物；不相关=seeded 取
     （单感官≠S ∪ 多感官不含 S）池 1 个=answer；
   comp：候选=[truth, blocked, 感官集外 2] 洗牌；answer=truth 下标 ---------- */
function buildQuiz(spec, rnd) {
  if (spec.kind === 'multi') {
    const order = shuffled(SENSES5, rnd);
    const opts = order.map(x => ({ anim: x }));
    const answers = [];
    order.forEach((x, j) => { if (MULTI_SENSES[spec.mthing].indexOf(x) >= 0) answers.push(j); });
    return { kind: 'multi', ask: spec.mthing, opts: opts, answers: answers, answer: -1,
             picked: [], _miss: 0, _answered: false };
  }
  if (spec.kind === 'anti') {
    const S = spec.sense;
    const relMulti = MULTI5.filter(m => MULTI_SENSES[m].indexOf(S) >= 0);
    const rm = relMulti[Math.floor(rnd() * relMulti.length)];
    const unrelPool = THINGS10.filter(t => SENSE_OF[t] !== S)
      .concat(MULTI5.filter(m => MULTI_SENSES[m].indexOf(S) < 0));
    const ur = unrelPool[Math.floor(rnd() * unrelPool.length)];
    const order = shuffled([ur].concat(THINGS_OF[S], [rm]), rnd);
    const opts = order.map(x => ({ anim: x }));
    let answer = -1;
    for (let j = 0; j < order.length; j++) if (order[j] === ur) answer = j;
    return { kind: 'anti', ask: S, opts: opts, answer: answer, _miss: 0, _answered: false };
  }
  if (spec.kind === 'comp') {
    const ms = MULTI_SENSES[spec.mthing];
    const outside = SENSES5.filter(x => ms.indexOf(x) < 0);   // 恰 2（5−3）
    const order = shuffled([spec.truth, spec.blocked, outside[0], outside[1]], rnd);
    const opts = order.map(x => ({ anim: x }));
    let answer = -1;
    for (let j = 0; j < order.length; j++) if (order[j] === spec.truth) answer = j;
    return { kind: 'comp', ask: spec.mthing, blocked: spec.blocked, opts: opts,
             answer: answer, _miss: 0, _answered: false };
  }
  /* ---- find（findsense/findthing，恒 4 候选） ---- */
  const isFS = spec.kind === 'findsense';
  const truth = isFS ? SENSE_OF[spec.thing] : spec.thing;
  const pool = isFS ? SENSES5 : THINGS10;
  const picks = [truth];
  const usedSense = {}; usedSense[SENSE_OF[spec.thing]] = true;   // 真值感官占位（findthing 防双真值）
  const others = shuffled(pool.filter(x => x !== truth), rnd);
  for (const x of others) {
    if (picks.length >= 4) break;
    if (!isFS) {                                 // findthing：感官已占位的物品不入候选
      if (usedSense[SENSE_OF[x]]) continue;
      usedSense[SENSE_OF[x]] = true;
    }
    picks.push(x);
  }
  const order = shuffled(picks, rnd);
  const opts = order.map(x => ({ anim: x }));
  let answer = -1;
  for (let j = 0; j < order.length; j++) if (order[j] === truth) answer = j;
  return { kind: spec.kind, ask: isFS ? spec.thing : SENSE_OF[spec.thing],
           opts: opts, answer: answer, _miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关随机章参数）
   flat0 题0 恒 findsense/bell（§1 教学演示锚点） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 421);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const specs = specSeqOf(dch, rnd, flat);
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(specs[qi], rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点卡引擎（无 DOM）：engTapOpt(L, i) —— 点第 i 张候选卡（opts 数组下标）
   单选题型（findsense/findthing/anti/comp）：对 'right'/末题 'done'/错 'wrong'（该题 miss+1，
     retries 全关累计=星级口径，卡不灰可重选——探索不罚）/ null 非法下标或关卡已结束；
   multi：'pick' 勾选 / 'unpick' 取消（零惩罚——勾选不是判定，判定在 engSubmit）/ null 同上 */
function engTapOpt(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.opts.length) return null;
  if (q.kind === 'multi') {
    const at = q.picked.indexOf(i);
    if (at >= 0) { q.picked.splice(at, 1); return 'unpick'; }
    q.picked.push(i);
    return 'pick';
  }
  if (i === q.answer) {
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
/* ---------- multi 提交判定：engSubmit(L) —— 勾选集合 == answers 集合才算对
   'right' 勾满真值且本题完成推进 / 'done' 末题=通关 / 'wrong' 漏选或多选（清空重选，
   该题 miss+1、retries+1——一题多错照计，星级梯度可达）/ false 非提交题型 / null 关卡已结束 */
function engSubmit(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (q.kind !== 'multi') return false;
  const norm = a => a.slice().sort((x, y) => x - y).join(',');
  if (norm(q.picked) === norm(q.answers)) {
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q.picked = [];                      // 清空重选（把它找全——漏选/多选都错）
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（§0.76 口径承 r11）：全关错选 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：单选题正确卡下标（独立函数供 verify 复核；multi 用 q.answers 数组） */
const correctIdx = q => !q ? -1 : q.answer;

/* ---------- 结构校验（verify 用，返回失败原因或 null）：章型位序 / 四族封闭表与数学先验 /
   answer(s) 自洽 / 防双真值（findthing 同感官对·anti 恰 1 不相关·comp 恰 1 可用真值）/
   相邻题互异 / flat0q0 锚点 / 初始态干净 ---------- */
function structWhy(q, dch, flat, qi, prevQ) {
  if (!q) return 'quiz';
  const fam = familyTok(q.kind);
  if (['find', 'multi', 'anti', 'comp'].indexOf(fam) < 0) return 'kind';
  if (CH_FAMILY[dch][qi] !== fam) return 'chFam';                  // 章型位序（r11 定版）
  if (flat === 0 && qi === 0 && (q.kind !== 'findsense' || q.ask !== 'bell')) return 'anchor';
  if (fam === 'find') {
    const isFS = q.kind === 'findsense';
    if (isFS && THINGS10.indexOf(q.ask) < 0) return 'askThing';    // findsense ask=物品 id
    if (!isFS && SENSES5.indexOf(q.ask) < 0) return 'askSense';    // findthing ask=感官 id
    if (q.opts.length !== 4) return 'findLen';                     // find 恒 4 卡（r11 起含 ch1）
    const pool = isFS ? SENSES5 : THINGS10;
    const vals = q.opts.map(o => o.anim);
    for (const v of vals) if (pool.indexOf(v) < 0) return 'optPool';
    if (new Set(vals).size !== vals.length) return 'optDup';
    let truth = null;
    if (isFS) truth = SENSE_OF[q.ask];
    else {
      const bySense = {};
      for (const v of vals) {
        const s2 = SENSE_OF[v];
        if (bySense[s2]) return 'sensePair';                       // 防双真值：同感官对至多 1 物在场
        bySense[s2] = true;
        if (s2 === q.ask) truth = v;
      }
    }
    if (truth === null || vals.indexOf(truth) < 0) return 'optTruth';
    if (vals[q.answer] !== truth) return 'ansIdx';
  } else if (fam === 'multi') {
    if (MULTI5.indexOf(q.ask) < 0) return 'askMulti';              // ask=多感官物
    const vals = q.opts.map(o => o.anim);
    if (q.opts.length !== SENSES5.length) return 'multiLen';       // 候选=感官 5 全集
    for (const v of vals) if (SENSES5.indexOf(v) < 0) return 'optPool';
    if (new Set(vals).size !== vals.length) return 'optDup';
    const want = MULTI_SENSES[q.ask];
    const truthIdx = [];
    vals.forEach((v, j) => { if (want.indexOf(v) >= 0) truthIdx.push(j); });
    if (truthIdx.length !== want.length) return 'multiTruth';      // 真值恒 3 全在场
    if (q.answers.length !== want.length || normIdx(q.answers) !== normIdx(truthIdx)) return 'multiAns';
    if (q.picked.length !== 0) return 'init';
  } else if (fam === 'anti') {
    if (SENSES5.indexOf(q.ask) < 0) return 'askSense';             // ask=被排除感官 S
    if (q.opts.length !== 4) return 'antiLen';
    const vals = q.opts.map(o => o.anim);
    if (new Set(vals).size !== vals.length) return 'optDup';
    let nRel = 0, truth = null;
    for (const v of vals) {
      const inPool = THINGS10.indexOf(v) >= 0 || MULTI5.indexOf(v) >= 0;
      if (!inPool) return 'optPool';                               // 候选=单感官物∪多感官物
      const rel = (THINGS10.indexOf(v) >= 0 && SENSE_OF[v] === q.ask) ||
                  (MULTI5.indexOf(v) >= 0 && MULTI_SENSES[v].indexOf(q.ask) >= 0);
      if (rel) nRel++;
      else if (truth === null) truth = v;
      else if (v !== truth) return 'antiMulti';                    // 不相关恰 1（防双真值）
    }
    if (nRel !== 3 || truth === null) return 'antiRel';            // 相关恰 3（2 单感官+1 多感官）
    let nS = 0;
    for (const v of vals) if (THINGS10.indexOf(v) >= 0 && SENSE_OF[v] === q.ask) nS++;
    if (nS !== 2) return 'antiSingles';                            // 恒含 S 的 2 个单感官物
    if (vals[q.answer] !== truth) return 'ansIdx';
  } else {                                                          /* ---- comp ---- */
    if (MULTI5.indexOf(q.ask) < 0) return 'askMulti';
    if (SENSES5.indexOf(q.blocked) < 0) return 'blockedSense';
    if (MULTI_SENSES[q.ask].indexOf(q.blocked) < 0) return 'blockedIn';   // 被捂必属该物感官集
    if (q.opts.length !== 4) return 'compLen';
    const vals = q.opts.map(o => o.anim);
    if (new Set(vals).size !== vals.length) return 'optDup';
    const ms = MULTI_SENSES[q.ask];
    let nAvail = 0, nBlocked = 0, nOut = 0, nOther = 0, truth = null;
    for (const v of vals) {
      if (SENSES5.indexOf(v) < 0) return 'optPool';
      if (ms.indexOf(v) >= 0) {
        if (v === q.blocked) { nBlocked++; continue; }             // 诱惑=被捂感官恒在场
        nAvail++;
        if (truth === null) truth = v; else if (v !== truth) nOther++;
      } else nOut++;
    }
    if (nBlocked !== 1) return 'compTempt';                        // 被捂感官恰 1 在场（诱惑恒在）
    if (nAvail !== 1 || nOther > 0) return 'compTruth';            // 可用真值恰 1（另一剩余禁在场）
    if (nOut !== 2) return 'compOut';                              // 感官集外恰 2 填满
    if (vals[q.answer] !== truth) return 'ansIdx';
    if (q.blocked === truth) return 'compSelf';                    // 真值≠被捂
  }

             a.kind === 'multi' ? 'mu:' + a.ask :
             a.kind === 'anti' ? 'an:' + a.ask : 'co:' + a.ask + ':' + a.blocked;

             b.kind === 'findthing' ? 'ft:' + b.ask :
             b.kind === 'multi' ? 'mu:' + b.ask :
             b.kind === 'anti' ? 'an:' + b.ask : 'co:' + b.ask + ':' + b.blocked;
  return ka === kb;

/* ================= 错反馈（四族共用骨架）：错链三段+方向级回锚+miss≥2 答案级梯度
   链构成（T46 阶段2 语义句尾段 clip 化——实长口径，§4/_clipdur32+T46 六键 ffprobe）：
   findsense 1656+150+物品名音max1872+150+again_sense 2640+300=7768
   / findthing 1656+150+感官名音max1440+150+again_thing 2184+300=6870
   / multi 1824+150+名音max1560+150+again_multi 2976+300=6960
   / anti（最长，5 段拼播）=1656+150+1440+150+anti_base 2880+150+名音1440+150+anti_tail 1248+300=9564
   / comp 1656+150+1440+150+again_cov 3264+300=6960
   ——豁免窗 9800 ≥ 全族链+余量（r11 9500→T46 9800：anti 拆三段后链超旧窗 64ms；契约 I。
   T46 后全链 clip 键段无 keyless——契约 N 天然合规） ================= */
function wrongParts(q) {
  if (q.kind === 'multi') return [VOICE.mw.key, nameClip(q.ask),
    { key: 'sen_again_multi', text: MULTI_AGAIN }];
  if (q.kind === 'anti') return [VOICE.wrong.key, nameClip(q.ask),
    { key: 'sen_anti_base', text: ANTI_BASE }, nameClip(q.ask),
    { key: 'sen_anti_tail', text: ANTI_TAIL }];
  if (q.kind === 'comp') return [VOICE.wrong.key, nameClip(q.blocked),
    { key: 'sen_again_cov', text: COV_AGAIN }];
  return [VOICE.wrong.key, nameClip(q.ask),
    { key: q.kind === 'findsense' ? 'sen_again_sense' : 'sen_again_thing',
      text: q.kind === 'findsense' ? SENSE_AGAIN : THING_AGAIN }];
}
async function wrongFlow(q, run, el) {
  state.locked = true;
  if (el) replayAnim(el, 'wig');
  dodgeLo();
  if (sayW(wrongParts(q)))
    wrongChainUntil = Date.now() + 9800;         /* 链豁免：≥最长 anti 链 9564+余量（T46 拆段后 9500→9800，契约 I） */
  pulseAsk();                                    /* 方向级：题面大图再 pulse（不泄答案） */
  if (q._miss >= 2) {                            /* miss≥2=正确卡 breathe（答案级，家族梯度） */
    if (q.kind === 'multi') for (const j of q.answers) { const ok = cardEl(j); if (ok) replayAnim(ok, 'breathe'); }
    else { const ok = cardEl(q.answer); if (ok) replayAnim(ok, 'breathe'); }
  }
  await wait(1000 * SPEED);                      /* 错点防重入窗 1000ms；对选可打断链；救援由豁免窗让路 */
  if (cur !== run) return;
  state.locked = false;
}
/* ================= 答对推进（单选 tapOpt / multi tapSubmit 共用）：
   确认链=sen_right+答案名音（multi=+3 感官名音逐段，全 clip 无 keyless——契约 N）；
   演出窗 1600+3000（单选族 ≥2256+150+1872+300=4578）/ 1600+5800（multi ≥2256+3×1590+300=7326） ================= */
async function rightFlow(q, run, r, litEls) {
  lastAct = Date.now();                          /* 正确选择重置救援钟（§0.7a） */
  if (state.tut === 'help') {                    /* 教学"独"：首次选对 → 放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  litEls.forEach(e2 => { if (e2) { e2.classList.remove('breathe'); e2.classList.add('lit'); } });
  chimeGoal();
  sfx('coin');
  if (cur === run) celebrateScene(run);          /* 大图跳 + 小兔子滑入示范 */
  const chain = [VOICE.right.key].concat(q.kind === 'multi'
    ? q.answers.map(j => nameClip(q.opts[j].anim))
    : [nameClip(q.opts[q.answer].anim)]);
  KIDS.voice.queue(chain);
  await wait(1600 * SPEED);                      /* 大图跳+卡亮+确认链主窗 */
  if (cur !== run) return r;
  await wait((q.kind === 'multi' ? 5800 : 3000) * SPEED);   /* 确认链收尾窗（家族 G/H） */
  if (cur !== run) return r;
  state.locked = false;
  if (r === 'done') { winFlow(); return 'done'; }
  renderQuiz();                                  /* 新题（大图/卡全换）+读题 */
  return r;
}

/* ================= 点卡主路径（真实点击 / SE.tapOpt / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（卡排容器 bump 微动效——家族 D）；
   错防重入窗/判对演出窗共用 locked 门；错点 1000ms 防重入窗（b16 定案）========== */
async function uiTapOpt(i, demo) {
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  /* b31 家族 I 补口径（2026-09-11）：错链豁免窗（真时钟）内错点吞——对选放行；multi 勾选是
     中性动作（判定在 tapSubmit）不吞，豁免窗守卫挂在 uiSubmit（窗内提交吞 pop+bump） */
  if (!demo && q.kind !== 'multi' && wrongChainUntil && Date.now() < wrongChainUntil && i !== q.answer) {
    sfx('pop'); replayAnim(boardEl, 'bump'); return false;
  }
  const run = cur;                               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapOpt(cur, i);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }   // 越界/已答=null+pop+bump
  const el = cardEl(i);

  if (q.kind === 'multi') {                      /* pick/unpick：勾选徽章+提交钮状态（零惩罚） */
    lastAct = Date.now();
    if (el) el.classList.toggle('held', r === 'pick');
    sfx('pop');
    updateSubmitState();
    return r;
  }

  if (r === 'wrong') {                           /* 答错：摇头+错链三段+大图 pulse */
    await wrongFlow(q, run, el);
    return r;
  }

  /* ---- right·done（本题完成：大图跳+兔子示范+确认句拼播） ---- */
  return rightFlow(q, run, r, [el]);
}

/* ================= multi 提交主路径（真实点击 / SE.tapSubmit / autoSolve 共用）
   空选不判（防误触计 miss——探索不罚）；豁免窗内吞；漏选/多选=wrong 清空重选 ================= */
async function uiSubmit() {
  if (!cur || state.won || state.locked || state.demo) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.kind !== 'multi') return false;
  if (wrongChainUntil && Date.now() < wrongChainUntil) {   /* 契约 I：链播完前不重复判（pop+bump 吞） */
    sfx('pop'); replayAnim(boardEl, 'bump'); return false;
  }
  if (!q.picked.length) { sfx('pop'); replayAnim(boardEl, 'bump'); return false; }   // 空选不判
  const run = cur;
  const r = engSubmit(cur);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }

  if (r === 'wrong') {                           /* 漏选/多选：清空重选（错链+清 held，不指认错卡） */
    boardEl.querySelectorAll('.card.held').forEach(c => c.classList.remove('held'));
    updateSubmitState();
    await wrongFlow(q, run, null);
    return r;
  }
  const litEls = q.answers.map(j => cardEl(j));
  return rightFlow(q, run, r, litEls);
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {

                     sen_n_eye: 1368, sen_n_ear: 1344, sen_n_nose: 1344,
                     sen_n_hand: 1440, sen_n_mouth: 1344,
                     sen_n_rainbow: 1368, sen_n_star: 1872, sen_n_bell: 1824,
                     sen_n_birdsong: 1848, sen_n_flower: 1632, sen_n_cookie: 1776,
                     sen_n_softtoy: 1752, sen_n_ice: 1800, sen_n_lemon: 1776,
                     sen_n_candy: 1848,
                     sen_n_popcorn: 1536, sen_n_watermelon: 1368, sen_n_kitten: 1560,
                     sen_n_soup: 1392, sen_n_drum: 1464,   // batch32/_clipdur32.json 实长
                     sen_again_sense: 2640, sen_again_thing: 2184, sen_again_multi: 2976,
                     sen_again_cov: 3264, sen_anti_base: 2880, sen_anti_tail: 1248 };   // T46 六键 ffprobe 实测
  const SPEC_CHAPTER_HINTS = { 1: '接下来，要找一个不一样的哦', 2: '捂住一个感官，还能用什么呀',
                               3: '什么都混在一起，大挑战', 4: '新一轮五感大挑战' };
  const SPEC_GEN_HINTS = ['选感官，还要找全哦', '找一个不一样的哦',
                          '捂住一个，想一想哦', '五感大集合，来挑战'];
  const SPEC_CNFN = { eye: '眼睛', ear: '耳朵', nose: '鼻子', hand: '小手', mouth: '嘴巴' };  // 感官名（anti 错链尾拼算）
  const estMs = n => n * 345 + 600;               // b25 定版：SAPI ~345ms/字 + 600 落定余量
  const famTok = k => (k === 'findsense' || k === 'findthing') ? 'find' : k;
  const unlocked = async () => {                  // 等错防重入/演出窗结束（verify 提速后 ≤1.4s）
    let wg = 0;
    while ((state.locked || state.demo) && wg++ < 900) await wait(50);
    return !(state.locked || state.demo);
  };
  /* Mj-1 防回归（core voice.queue 弃尾语义）：keyless TTS 段播完即 return 丢弃后续段——
     T46 阶段2 四族错链尾段全部 clip 键段化，全款拼播链无 keyless 段（链尾断言改键段直断） */
  /* 驱动当前题到推进（multi=勾满 need+提交；单选=点 answer）；返回是否推进 */
  const driveQ = async () => {
    const q = window.SE.quiz;
    if (!q) return false;
    if (!(await unlocked())) return false;
    if (q.kind === 'multi') {
      for (const j of q.answers) { if (!(await unlocked())) return false; await window.SE.tapOpt(j); }
      const r = await window.SE.tapSubmit();
      return r === 'right' || r === 'done';
    }
    const r = await window.SE.tapOpt(q.answer);
    return r === 'right' || r === 'done';
  };
  /* 遍历推进直到目标族出现（≤5 题内必达——章型位序保证） */
  const seekKind = async kind => {
    for (let g = 0; g < 6; g++) {
      const q = window.SE.quiz;
      if (!q) return null;
      if (q.kind === kind) return q;
      if (!(await driveQ())) return null;
    }
    return null;
  };

  /* ---- ①② 40 关全量审计 + SPEC 表独立对账 ---- */
  const genDch = {}, mixBad = {};
  const cov = { multiU: {}, antiU: {}, compN: 0, compU: {}, ch1Find: {}, genKinds: {} };
  let tableOk = true, badCase = null, modeledBad = null;
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1.quizzes) === JSON.stringify(L2.quizzes);      // 确定性
    let ruleOk = true;
    for (let k = 0; k < L1.quizzes.length; k++) {
      const why = structWhy(L1.quizzes[k], L1.dch, flat, k, k > 0 ? L1.quizzes[k - 1] : null);
      if (why) ruleOk = false;
    }
    if (L1.quizzes.length !== CH_LEN) ruleOk = false;
    const expCh = Math.floor(flat / 5) + 1;                       // 章号独立复算
    const chOk = L1.ch === expCh;
    const dchOk = flat < 20 ? L1.dch === Math.floor(flat / 5) + 1   // 静态四档
                           : (L1.dch >= 1 && L1.dch <= 4);       // 生成关随机章参数
    /* 引擎直驱：multi=engTapOpt×need+engSubmit；单选=engTapOpt(answer) → right/末题 done */
    const L3 = genLevel(flat);
    let driveOk = true;
    for (let k = 0; k < L3.quizzes.length && driveOk; k++) {
      const q = L3.quizzes[k];
      const exp = k === L3.quizzes.length - 1 ? 'done' : 'right';
      let r;
      if (q.kind === 'multi') {
        for (const j of q.answers) engTapOpt(L3, j);
        r = engSubmit(L3);
      } else r = engTapOpt(L3, q.answer);
      if (r !== exp || q._miss !== 0) { driveOk = false; break; }
    }
    const solvedAll = L3.done && L3.step === CH_LEN && L3.retries === 0 && engStars(L3) === 3;

    /* r11 认知建模独立复算（SPEC_MODELED 表）+与引擎常量对账 */
    let modSum = 0;
    for (const q of L1.quizzes) modSum += SPEC_MODELED[famTok(q.kind)];
    if (modSum < SPEC_MODELED_FLOOR || modSum !== modeledLevelMs(L1)) modeledBad = flat + '=' + modSum;

    /* SPEC 表独立对账（每题：章型位序/四族数学先验/answer(s) 复算） */
    let specOk = true;
    for (let k = 0; k < L1.quizzes.length; k++) {
      const q = L1.quizzes[k];
      const vals = q.opts.map(o => o.anim);
      if (SPEC_CH_FAMILY[L1.dch][k] !== famTok(q.kind)) { badCase = 'chFam ' + flat + '/' + k; specOk = false; break; }
      if (flat === 0 && k === 0) {                          // 教学演示锚点：闹钟响响点耳朵
        if (q.kind !== 'findsense' || q.ask !== 'bell') { badCase = 'anchor ' + flat; specOk = false; break; }
      }
      if (famTok(q.kind) === 'find') {
        const isFS = q.kind === 'findsense';
        const askOk = isFS ? SPEC_THINGS.indexOf(q.ask) >= 0 : SPEC_SENSES.indexOf(q.ask) >= 0;
        if (!askOk) { badCase = 'askDomain ' + flat + '/' + k; specOk = false; break; }
        if (vals.length !== 4) { badCase = 'findLen ' + flat + '/' + k; specOk = false; break; }
        const pool = isFS ? SPEC_SENSES : SPEC_THINGS;
        let poolOk = true;
        for (const v of vals) if (pool.indexOf(v) < 0) poolOk = false;
        if (!poolOk || new Set(vals).size !== vals.length) { badCase = 'optPool ' + flat + '/' + k; specOk = false; break; }
        let truth, truthCnt = 0;
        if (isFS) truth = SPEC_SENSE_OF[q.ask];
        else for (const v of vals) if (SPEC_SENSE_OF[v] === q.ask) { truth = v; truthCnt++; }
        if (!truth || vals.indexOf(truth) < 0) { badCase = 'optTruth ' + flat + '/' + k; specOk = false; break; }
        if (!isFS) {                                        // 防双真值：同感官对至多 1 物在场
          const bySense = {};
          let pairOk = true;
          for (const v of vals) {
            const s2 = SPEC_SENSE_OF[v];
            if (bySense[s2]) { pairOk = false; break; }
            bySense[s2] = true;
          }
          if (!pairOk || truthCnt !== 1) { badCase = 'dblTruth ' + flat + '/' + k; specOk = false; break; }
        }
        let expAns = -1;
        for (let j = 0; j < vals.length; j++) if (vals[j] === truth) expAns = j;
        if (expAns < 0 || q.answer !== expAns) { badCase = 'ans ' + flat + '/' + k; specOk = false; break; }
        if (flat < 5) cov.ch1Find[q.kind] = true;           // ch1 两子族并集素材
      } else if (q.kind === 'multi') {
        if (!SPEC_MULTI[q.ask]) { badCase = 'askMulti ' + flat + '/' + k; specOk = false; break; }
        if (vals.length !== SPEC_SENSES.length || new Set(vals).size !== vals.length) {
          badCase = 'multiLen ' + flat + '/' + k; specOk = false; break; }
        let setOk = true;
        for (const v of vals) if (SPEC_SENSES.indexOf(v) < 0) setOk = false;
        if (!setOk) { badCase = 'optPool ' + flat + '/' + k; specOk = false; break; }
        const want = SPEC_MULTI[q.ask];
        const expIdx = vals.map((v, j) => want.indexOf(v) >= 0 ? j : -1).filter(j => j >= 0);
        const gotIdx = (q.answers || []).slice().sort((a, b) => a - b);
        if (expIdx.length !== want.length || JSON.stringify(expIdx) !== JSON.stringify(gotIdx)) {
          badCase = 'multiAns ' + flat + '/' + k; specOk = false; break; }
        if (q.answer !== -1 || (q.picked && q.picked.length)) { badCase = 'multiInit ' + flat + '/' + k; specOk = false; break; }
        if (flat < 20) cov.multiU[q.ask] = true;
      } else if (q.kind === 'anti') {
        if (SPEC_SENSES.indexOf(q.ask) < 0) { badCase = 'askSense ' + flat + '/' + k; specOk = false; break; }
        if (vals.length !== 4 || new Set(vals).size !== 4) { badCase = 'antiLen ' + flat + '/' + k; specOk = false; break; }
        let nRel = 0, nSingle = 0, unrel = null, unrel2 = null;
        for (const v of vals) {
          const isSingle = SPEC_THINGS.indexOf(v) >= 0;
          const isMulti = !!SPEC_MULTI[v];
          if (!isSingle && !isMulti) { badCase = 'optPool ' + flat + '/' + k; specOk = false; break; }
          const rel = isSingle ? SPEC_SENSE_OF[v] === q.ask :
                      isMulti ? SPEC_MULTI[v].indexOf(q.ask) >= 0 : false;
          if (rel) { nRel++; if (isSingle) nSingle++; }
          else if (unrel === null) unrel = v;
          else if (unrel2 === null) unrel2 = v;
        }
        if (nRel !== 3 || nSingle !== 2 || unrel === null || unrel2 !== null) {
          badCase = 'antiRel ' + flat + '/' + k; specOk = false; break; }   // 相关恰 3（2 单感官+1 多感官）/不相关恰 1
        if (vals[q.answer] !== unrel) { badCase = 'ans ' + flat + '/' + k; specOk = false; break; }
        if (flat < 20) cov.antiU[q.ask] = true;
      } else {
        if (!SPEC_MULTI[q.ask]) { badCase = 'askMulti ' + flat + '/' + k; specOk = false; break; }
        if (!SPEC_MULTI[q.ask] || SPEC_MULTI[q.ask].indexOf(q.blocked) < 0) { badCase = 'blockedIn ' + flat + '/' + k; specOk = false; break; }
        if (vals.length !== 4 || new Set(vals).size !== 4) { badCase = 'compLen ' + flat + '/' + k; specOk = false; break; }
        const want = SPEC_MULTI[q.ask];
        let nAvail = 0, nBlocked = 0, nOut = 0, truth = null;
        for (const v of vals) {
          if (SPEC_SENSES.indexOf(v) < 0) { badCase = 'optPool ' + flat + '/' + k; specOk = false; break; }
          if (want.indexOf(v) >= 0) {
            if (v === q.blocked) nBlocked++;
            else { nAvail++; if (truth === null) truth = v; }
          } else nOut++;
        }
        if (nBlocked !== 1 || nAvail !== 1 || nOut !== 2 || !truth) {   // 诱惑恒在/真值恰 1/集外恰 2
          badCase = 'compPrior ' + flat + '/' + k; specOk = false; break; }
        if (truth === q.blocked || vals[q.answer] !== truth) { badCase = 'ans ' + flat + '/' + k; specOk = false; break; }
        if (flat < 20) { cov.compN++; cov.compU[q.ask + ':' + q.blocked] = true; }
      }
    }
    if (!specOk) tableOk = false;
    if (flat >= 20) {
      genDch[L1.dch] = (genDch[L1.dch] || 0) + 1;
      for (const q of L1.quizzes) cov.genKinds[q.kind] = true;
    }
    const ok = det && ruleOk && chOk && dchOk && driveOk && solvedAll && specOk && !modeledBad;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, ruleOk: ruleOk, chOk: chOk,
                  dchOk: dchOk, driveOk: driveOk, solvedAll: solvedAll, specOk: specOk,
                  modeled: modSum,
                  kinds: L1.quizzes.map(q => q.kind + ':' + q.ask) };
    if (flat < 20) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ③ 聚合独占票：章型位序覆盖+生成关四型全现+五 kind 全现 ---- */
  total++;
  const multiAll = Object.keys(SPEC_MULTI), senseAll = SPEC_SENSES.slice();
  const ch3 = [10, 11, 12, 13, 14], ch4 = [15, 16, 17, 18, 19];
  const ch3comp = ch3.filter(f => genLevel(f).quizzes.filter(q => q.kind === 'comp').length === 1).length;
  const ch4comp = ch4.reduce((a, f) => a + genLevel(f).quizzes.filter(q => q.kind === 'comp').length, 0);
  const aggOk = tableOk && !modeledBad &&
    multiAll.every(m => cov.multiU[m]) &&                        // 静态 20 关 multi 5 物全现
    senseAll.every(s => cov.antiU[s]) &&                         // 静态 20 关 anti 5 感官全现
    ch3comp === 5 && ch4comp === 10 &&                           // ch3 每关 1 comp/ch4 每关 2 comp
    cov.ch1Find.findsense && cov.ch1Find.findthing &&            // ch1 find 两子族并集全现
    genDch[1] > 0 && genDch[2] > 0 && genDch[3] > 0 && genDch[4] > 0 &&   // 生成关四型全现
    ['findsense', 'findthing', 'multi', 'anti', 'comp'].every(k2 => cov.genKinds[k2]);
  if (aggOk) npass++;
  units.audit = { ok: aggOk, bad: badCase, modeledBad: modeledBad, genDch: genDch,
                  multiU: Object.keys(cov.multiU).length, antiU: Object.keys(cov.antiU).length,
                  compN: cov.compN, compU: Object.keys(cov.compU).length,
                  ch3comp: ch3comp, ch4comp: ch4comp };

  /* ---- ④ tapOpt 单元（flat0 findsense/bell 4 候选）---- */
  total++;
  startLevel(0);
  const q4 = window.SE.quiz;
  const initOk = q4 && q4.kind === 'findsense' && q4.ask === 'bell' &&
                 q4.opts.length === 4 &&
                 q4.opts.every(o => typeof o.anim === 'string' && SPEC_SENSES.indexOf(o.anim) >= 0) &&
                 q4.opts[q4.answer].anim === 'ear' &&
                 q4.step === 0 && q4.miss === 0;
  const badTap = (await window.SE.tapOpt(99)) === null;           // 非法下标=null（不炸）
  const wA = q4.opts.findIndex((o, i) => i !== q4.answer);        // 错卡（异感官）
  const pW = window.SE.tapOpt(wA);                                // → wrong（1000ms 防重入窗，fire-and-forget）
  const rejW = await window.SE.tapOpt(wA);                        // 窗内紧邻再点=被拦 false
  const rW = await pW;
  const chainA = window.__lastQueue && window.__lastQueue.length === 3 &&
                window.__lastQueue[0] === 'sen_wrong' &&          // 错链头=wrong clip（manifest 文案）
                window.__lastQueue[1] === 'sen_n_bell' &&         // 题面名音回锚（clip 段）
                window.__lastQueue[2] && window.__lastQueue[2].key === 'sen_again_sense' &&   // T46 键段尾
                window.__lastQueue[2].text === SPEC_SAGAIN;
  const s1 = rW === 'wrong' && rejW === false && chainA &&
             window.SE.quiz.miss === 1 && window.SE.currentLevel.miss === 1;
  replayQuiz(false);                              // 重听路径（仍在 q0 findsense）：名音+题面句（两 clip 无 keyless）
  const chainQ = window.__lastQueue && window.__lastQueue.length === 2 &&
                 window.__lastQueue[0] === 'sen_n_bell' &&
                 window.__lastQueue[1] === 'sen_q1';
  const rR = await window.SE.tapOpt(q4.answer);
  const chainR = window.__lastQueue && window.__lastQueue.length === 2 &&
                 window.__lastQueue[0] === 'sen_right' &&          // 确认链=sen_right+名音尾段（全 clip 无 keyless）
                 window.__lastQueue[1] === 'sen_n_ear';

  const tapOk = initOk && badTap && s1 && s2;
  if (tapOk) npass++;
  units.tap = { ok: tapOk, init: initOk, badTap: badTap, wrongA: s1,
                chain: chainA, right: s2, chainR: chainR, chainReplay: chainQ };

  /* ---- ⑤ multi 提交状态机（flat5 q1=multi）两遍式：豁免窗 9.5s 真时钟内二次提交必被吞，
     故 A 遍零错先测 勾/取消/空选/勾满对提交=right+确认链；B 遍（重开重置窗）专测错选 wrong ---- */
  total++;
  startLevel(5);
  const qm = await seekKind('multi');
  const mShape = !!qm && qm.kind === 'multi' && !!SPEC_MULTI[qm.ask] &&
                 qm.opts.length === 5 && qm.answer === -1 &&
                 qm.answers.length === 3 && qm.picked.length === 0 &&
                 qm.answers.every(j => SPEC_MULTI[qm.ask].indexOf(qm.opts[j].anim) >= 0);
  const noAns = qm ? qm.opts.filter((o, i) => qm.answers.indexOf(i) < 0) : [];   // 2 干扰感官
  const d0 = qm ? qm.opts.findIndex(o => o.anim === noAns[0].anim) : -1;
  const p1 = await window.SE.tapOpt(qm.answers[0]);               // 勾真值 1 → pick
  const p2 = await window.SE.tapOpt(d0);                          // 勾干扰 1 → pick
  const sPick = p1 === 'pick' && p2 === 'pick' &&
                JSON.stringify(window.SE.quiz.picked) === JSON.stringify([qm.answers[0], d0]);
  const u1 = await window.SE.tapOpt(qm.answers[0]);               // 取消勾选零惩罚
  const sUnpick = u1 === 'unpick' && window.SE.quiz.picked.length === 1 && window.SE.quiz.miss === 0;
  const u2 = await window.SE.tapOpt(d0);                          // 取消干扰 → picked 清空
  const subEmpty = await window.SE.tapSubmit();                   // 空选不判：false 不计 miss（窗未设纯路径）
  const wEmpty = subEmpty === false && window.SE.quiz.miss === 0 && window.SE.quiz.picked.length === 0;
  for (const j of qm.answers) await window.SE.tapOpt(j);          // 勾满 need（3 真值）
  const readyOk = submitBtn.classList.contains('ready') && submitBtn.classList.contains('armed');
  const subR = await window.SE.tapSubmit();                       // → right（零错路径窗干净）
  const chainMR = window.__lastQueue && window.__lastQueue.length === 4 &&
                 window.__lastQueue[0] === 'sen_right' &&
                 qm.answers.every((j, i2) => window.__lastQueue[i2 + 1] === 'sen_n_' + qm.opts[j].anim);
  const passA = mShape && sPick && sUnpick && wEmpty && readyOk &&
                subR === 'right' && chainMR && window.SE.quiz.step === qm.step + 1;
  /* B 遍：重开 flat5（startLevel 重置豁免窗），错选集=真值 1+干扰 2（漏选+多选并犯）→ wrong */
  startLevel(5);
  const qmB = await seekKind('multi');
  const dB0 = qmB ? qmB.opts.findIndex((o, i) => qmB.answers.indexOf(i) < 0) : -1;
  const dB1 = qmB ? qmB.opts.findIndex((o, i) => qmB.answers.indexOf(i) < 0 && i !== dB0) : -1;
  await window.SE.tapOpt(qmB.answers[0]);
  await window.SE.tapOpt(dB0);
  await window.SE.tapOpt(dB1);
  const subW2 = await window.SE.tapSubmit();                      // → wrong（清空+miss）
  const chainM = window.__lastQueue && window.__lastQueue.length === 3 &&
                 window.__lastQueue[0] === 'sen_mw' &&            // multi 错链头=没有找全哦
                 window.__lastQueue[1] === 'sen_n_' + qmB.ask &&  // 物品名音回锚
                 window.__lastQueue[2] && window.__lastQueue[2].key === 'sen_again_multi' &&   // T46 键段尾
                 window.__lastQueue[2].text === SPEC_MUAGAIN;
  const heldCleared = boardEl.querySelectorAll('.card.held').length === 0;
  const passB = subW2 === 'wrong' && chainM && heldCleared && window.SE.quiz.miss === 1;
  const multiOk = passA && passB;
  if (multiOk) npass++;
  units.multi = { ok: multiOk, shape: mShape, pick: sPick, unpick: sUnpick,
                  emptyNoMiss: wEmpty, ready: readyOk,
                  right: subR, chainRight: chainMR, wrong: passB, chainWrong: chainM };

  /* ---- ⑥ anti 抑制单元（flat5 q0：相关 3+不相关 1=answer；错链含感官名） ---- */
  total++;
  startLevel(5);
  const qa = window.SE.quiz;
  const aShape = !!qa && qa.kind === 'anti' && SPEC_SENSES.indexOf(qa.ask) >= 0 &&
                 qa.opts.length === 4 &&
                 qa.opts[qa.answer].anim !== undefined &&
                 (SPEC_SENSE_OF[qa.opts[qa.answer].anim] !== qa.ask) &&
                 !(SPEC_MULTI[qa.opts[qa.answer].anim] || []).includes(qa.ask);   // answer=不相关
  const relIdx = qa ? qa.opts.map((o, i) => i).filter(i => i !== qa.answer) : [];
  const rA = await window.SE.tapOpt(relIdx[0]);                   // 点相关卡=wrong（抑制失败）
  const chainAN = window.__lastQueue && window.__lastQueue.length === 5 &&   // T46 拼句三段化（5 段链）
                 window.__lastQueue[0] === 'sen_wrong' &&
                 window.__lastQueue[1] === 'sen_n_' + qa.ask &&   // 感官名音回锚
                 window.__lastQueue[2] && window.__lastQueue[2].key === 'sen_anti_base' &&
                 window.__lastQueue[2].text === SPEC_ANBASE &&
                 window.__lastQueue[3] === 'sen_n_' + qa.ask &&   // 拼句中间名音（同感官）
                 window.__lastQueue[4] && window.__lastQueue[4].key === 'sen_anti_tail' &&
                 window.__lastQueue[4].text === SPEC_ANTAIL;
  const aMiss = window.SE.quiz.miss === 1;
  const rA2 = await window.SE.tapOpt(qa.answer);                  // 点不相关=right
  const chainAR = window.__lastQueue && window.__lastQueue.length === 2 &&
                 window.__lastQueue[0] === 'sen_right' &&
                 window.__lastQueue[1] === 'sen_n_' + qa.opts[qa.answer].anim;
  const antiOk = aShape && rA === 'wrong' && chainAN && aMiss && rA2 === 'right' && chainAR;
  if (antiOk) npass++;
  units.anti = { ok: antiOk, shape: aShape, wrong: rA, chain: chainAN, right: rA2, chainR: chainAR };

  /* ---- ⑦ comp 代偿单元（flat15 q0：诱惑=被捂恒在场；点诱惑=wrong） ---- */

                3000 >= SPEC_DUR.sen_tut_watch + 300 &&                        // 教学名音演示延 ≥ 2892
                2150 >= SPEC_DUR.sen_tut_turn + 300 &&                         // turn 后读题延 ≥ 2124
                (2620 + 400) >= SPEC_DUR.sen_right + 300 &&                    // winFlow ≥ 2556
                9800 >= wcFS && 9800 >= wcFT && 9800 >= wcMU &&
                9800 >= wcAN && 9800 >= wcCO;
  const estData = { confirmWin: 4600, confirmNeed: SPEC_DUR.sen_right + 150 + maxName + 300,
                    multiConfirmWin: 7400,
                    multiConfirmNeed: SPEC_DUR.sen_right + 3 * (150 + maxSenseName) + 300,
                    tutChainWin: 3900, tutChainNeed: SPEC_DUR.sen_n_bell + 150 + SPEC_DUR.sen_q1 + 300,
                    watchT: 3000, turnDelay: 2150, rightFlow: 3020,
                    wrongChain: 9800,
                    chainNeedFS: wcFS, chainNeedFT: wcFT, chainNeedMU: wcMU,
                    chainNeedAN: wcAN, chainNeedCO: wcCO };
  if (winOk) npass++;
  units.estWin = { ok: winOk, est: estData };

  /* ---- ⑱ r11 认知建模硬断言：40 关逐关 modeled ≥40000（SPEC 独立表已在 ① 复算；
     此处独立副本逐档再列——静态四档各 5 关+生成 20 关全过） ---- */
  total++;
  const modFlats = [];
  for (let flat = 0; flat < 40; flat++) {
    const L = genLevel(flat);
    const s2 = L.quizzes.reduce((a, q) => a + SPEC_MODELED[famTok(q.kind)], 0);
    if (s2 < SPEC_MODELED_FLOOR || s2 !== modeledLevelMs(L)) modFlats.push(flat + ':' + s2);
  }
  const chSums = [1, 2, 3, 4].map(d => SPEC_CH_FAMILY[d].reduce((a, f) => a + SPEC_MODELED[f], 0));
  const modeledOk = modFlats.length === 0 && chSums.every(s2 => s2 >= SPEC_MODELED_FLOOR);
  if (modeledOk) npass++;
  units.modeled = { ok: modeledOk, bad: modFlats.slice(0, 4), chSums: chSums,
                    floor: SPEC_MODELED_FLOOR };

  /* ---- ⑲ verify 提速断言 ---- */
  total++;
  const speedOk = SPEED === 0.12;
  if (speedOk) npass++;
  units.speed = { ok: speedOk, SPEED: SPEED };

  const out = { game: 'senses', total: total, pass: npass, layoutOk: layoutOk,
                levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__seVlog = out;                          // 外部断言挂点（任务书钩子）
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text（__lastVoiceKey/__lastVoiceText）；
     voice.queue 记录拼播链（__lastQueue）供反馈链/确认链绑定断言 */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) { window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null; };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    window.__lastVoiceKey = parts && parts.length ? parts[0] : null;
  };
  runVerify();
}

</script>
