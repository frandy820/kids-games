<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>昆虫还是蜘蛛</title>
<style>
/* ================= ins 昆虫还是蜘蛛（batch40）=================
   家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E。
   玩法 = 看动物大图听题面 → 两选点选（SPEC-BATCH40 §1，5-6 岁降坡·常识/科学）：
   judge 族「{动物名}呀，它是昆虫还是蜘蛛？」两选=昆虫（瓢虫实物小图）/
   蜘蛛（圆蛛实物小图）；legs 族「{动物名}的腿有几条呀？数一数」两选=
   六腿排/八腿排图标（逐条可数）。题面=拼接链（动物名 clip+keyless 尾段
   ——契约 N 尾段必居链尾）。零文字依赖：按钮全图形，无文字。
   腿高亮视觉锚：legs 族题 #animal.leg-focus（腿色暖橙+交替慢摆——逐条可数，
   SPEC §1 恒在）。选对=按钮闪亮+确认链 ins_right；选错=按钮摇头+错链
   [ins_wrong, ins_sci_*]（科普句按动物类——蛛形纲=「它不是昆虫」句式）。
   防同质化（SPEC §1 声明）：vs babylove=亲子配对→生物特征辨析；vs habitat=
   语义联想→可数特征锚（数腿）分类；vs 机器画师=指令执行→观察-归纳启蒙。
   触摸目标：两选按钮 ≥96×96（实测 ~150）；overflowX 恒 0。
   好坏候选视觉同构（语义承载在图案+题面语音，不靠颜色歧视）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：动物观察大图（居中）+ 题面装饰句 ---------- */
#stage{flex:1 1 auto;min-height:110px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;overflow:hidden;padding:4px 12px}
#animalwrap{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:10px 22px;border-radius:26px;background:rgba(253,243,227,.55);
  border:2px solid #EFE3CD}
#animal{position:relative;width:min(210px,44vw);height:min(210px,44vw);
  background:#FFFDF7;border:3px solid #E5CDA6;border-radius:50%;
  box-shadow:0 5px 0 #E0CBB2,inset 0 0 0 5px rgba(255,249,238,.6);
  overflow:hidden}
#animal.enter{animation:an-in .45s ease}
@keyframes an-in{0%{transform:translateY(18px) scale(.9);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
#animal.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.6deg)}75%{transform:rotate(1.6deg)}}
#animal.happy{animation:an-happy .75s ease}
@keyframes an-happy{0%{transform:scale(1)}40%{transform:scale(1.07) rotate(2deg)}100%{transform:scale(1)}}
#animal svg{position:absolute;inset:7%;width:86%;height:86%}
/* 腿高亮视觉锚（legs 族恒在）：腿描边转暖橙加粗+逐条交替慢摆（可数——
   每条腿独立 data-leg，摆动 transform-box fill-box 微幅 1.7s，无频闪） */
#animal.leg-focus [data-leg]{stroke:#E8975A;stroke-width:3.4;
  animation:leg-swing 1.7s ease-in-out infinite}
#animal.leg-focus [data-leg="2"],#animal.leg-focus [data-leg="4"],
#animal.leg-focus [data-leg="6"],#animal.leg-focus [data-leg="8"]{animation-delay:.85s}
@keyframes leg-swing{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
#animal [data-leg]{transform-box:fill-box;transform-origin:top center}
/* r26 撤腿可数锚（SPEC-R26 §R4）：legs3 题恒挂 .leg-hide——全部腿隐藏
   （visibility：不可数不可见）+ 叶形遮挡条（「叶子挡住了」视觉故事；头胸/
   壳/翅仍可见=身份可辨识，腿数须类目知识回忆）。30s 答案级救援移除本类
   （掀叶揭晓）。 */
#animal.leg-hide [data-leg]{visibility:hidden}
#animal.leg-hide .leafcover{display:block}
.leafcover{display:none;position:absolute;left:5%;right:5%;top:33%;height:45%;
  background:#8FBF7F;border:2.5px solid #4A3B2E;border-radius:48% 48% 14px 14px/72% 72% 12px 12px;
  box-shadow:0 3px 0 rgba(74,59,46,.22);z-index:2}
.leafcover::before{content:'';position:absolute;left:12%;top:14%;width:40%;height:2.5px;
  background:rgba(74,59,46,.32);border-radius:2px;transform:rotate(-7deg)}
.leafcover::after{content:'';position:absolute;right:14%;top:36%;width:32%;height:2.5px;
  background:rgba(74,59,46,.32);border-radius:2px;transform:rotate(6deg)}
#q-text{flex:0 0 auto;font-size:15px;letter-spacing:2px;color:#8A7B6C;padding:0 0 2px}

/* ---------- 两选盘（主答案目标 ≥96×96——恒两选大盘） ---------- */
#tray{flex:0 0 auto;display:flex;justify-content:center;align-items:flex-end;gap:26px;
  width:100%;max-width:640px;padding:2px 14px 8px}
#tray.wig{animation:try-wig .5s ease}
@keyframes try-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.6deg)}75%{transform:rotate(1.6deg)}}
#tray.bump{animation:try-bump .22s ease}
@keyframes try-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:150px;min-height:150px;padding:8px;border-radius:26px;
  background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  transition:transform .15s}
.pick:active{transform:translateY(4px) scale(1.03);box-shadow:0 1px 0 #D8C9B4}
.pick .art{width:104px;height:104px;pointer-events:none;display:flex;align-items:center;justify-content:center}
.pick .art svg{width:100%;height:100%}
/* 选对：按钮闪亮一拍（演出层锚 .good——契约 M） */
.pick.good{animation:pk-good 1.05s ease}
@keyframes pk-good{0%{transform:scale(1)}35%{transform:scale(1.12) translateY(-8px)}100%{transform:scale(1)}}
/* 选错：摇头（行为后果反馈，不羞辱） */
.pick.bad{animation:pk-bad .5s ease}
@keyframes pk-bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* 救援答案级：正确候选高亮呼吸 */
.pick.breathe{animation:pk-hint 1.2s ease-in-out infinite}
@keyframes pk-hint{0%,100%{box-shadow:0 5px 0 #D8C9B4}50%{box-shadow:0 5px 0 #D8C9B4,0 0 18px rgba(232,151,90,.95)}}
/* 出场弹入 */
.pick.pop{animation:pk-pop .45s ease backwards}
@keyframes pk-pop{0%{transform:translateY(24px) scale(.86);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}

/* ---------- 底栏 ---------- */
#dock{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，教学演示/帮共用；照家族形态） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：观察图收紧+盘横排收窄 */
@media (orientation:portrait){
  #animal{width:min(186px,44vw);height:min(186px,44vw)}
  #tray{gap:16px;max-width:560px}
  .pick{width:132px;min-height:132px}
  .pick .art{width:92px;height:92px}
}
</style>
</head>
<body>
<div id="game" aria-label="昆虫还是蜘蛛">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="animalwrap" aria-label="看一看这个动物">
      <div id="animal"></div>
    </div>
    <div id="q-text" aria-hidden="true"></div>
    <div id="tray" aria-label="它是昆虫还是蜘蛛，点一个"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* 两选候选集（SPEC §1 恒两选，dch1-3）与推导律（LEGS→pick id——verify 独立复算依据） */
const PICKS_OF = kind => kind === 'judge' ? ['insect', 'spider'] : ['six', 'eight'];
const pickIdOf = (kind, anim) => kind === 'judge'
  ? (isBug(anim) ? 'insect' : 'spider')
  : (isBug(anim) ? 'six' : 'eight');
/* r26 三选候选集与推导律（dch4 谱——verify 独立复算依据，answer 禁另写魔数）：
   judge3 {昆虫,蜘蛛,都不是}=clsOf / legs3 {六,八,都不是}=LEGS 三向 /
   bodyseg {三段,两段,很多段}=SEGS 三向（==3→three / ==2→two / ≥4→many） */
const PICKS3_OF = { judge3: ['insect', 'spider', 'none'],
                    legs3: ['six', 'eight', 'none'],
                    bodyseg: ['three', 'two', 'many'] };
const pickIdOf3 = (kind, anim) => kind === 'judge3' ? clsOf(anim)
  : kind === 'legs3' ? (LEGS[anim] === 6 ? 'six' : (LEGS[anim] === 8 ? 'eight' : 'none'))
  : (SEGS[anim] === 3 ? 'three' : (SEGS[anim] === 2 ? 'two' : 'many'));
/* 科普句键（知识红线：蛛形纲→「它不是昆虫」句式；r26 三向——干扰动物
   →sciNone「不是昆虫也不是蜘蛛」） */
const sciKeyOf = anim => isBug(anim) ? 'sciInsect' : (LEGS[anim] === 8 ? 'sciSpider' : 'sciNone');

/* ---------- 单题构建（dch1-3 题表行+seeded 两选盘——**逐字节原样**；
   r26：dch4 在旧消耗之前整支分流 buildQuiz4——dch1-3 rnd 消耗序列与
   r26 前逐位一致（SPEC-R26 §R6 基线双证据①源码锚）） ---------- */
function buildQuiz(rowIdx, dch, qi, rnd) {
  if (dch === 4) return buildQuiz4(rowIdx, qi, rnd);    // r26 dch4 谱（rnd 消耗专属本分支）
  const row = ROWS[rowIdx];
  const picks = shuffled(PICKS_OF(row.kind), rnd);      // seeded 打乱（契合位不恒定）
  return { row: rowIdx, kind: row.kind, anim: row.anim,
           picks: picks, answer: picks.indexOf(pickIdOf(row.kind, row.anim)),
           _miss: 0, _answered: false };
}
/* ---------- r26 dch4 谱单题构建（SPEC-R26 §R3 生成律） ---------- */
function buildQuiz4(rowIdx, qi, rnd) {
  const kind = DCH4_KINDS[qi];
  const rowAnim = ROWS[rowIdx].anim;
  if (kind === 'judge3' || kind === 'legs3') {
    /* 主角=题表行动物（核心 8 种）；seeded 掷币换干扰动物主角
       （rnd()>=0.5 换，再掷定 snail/centipede——约半数答案=「都不是」） */
    let anim = rowAnim;
    if (rnd() >= 0.5) anim = rnd() < 0.5 ? 'snail' : 'centipede';
    const picks = shuffled(PICKS3_OF[kind], rnd);
    return { row: rowIdx, kind: kind, anim: anim,
             picks: picks, answer: picks.indexOf(pickIdOf3(kind, anim)),
             _miss: 0, _answered: false };
  }
  if (kind === 'bodyseg') {
    /* 主角=视觉诚实池 seeded 取 1（ant/bee/spider/wolfspider/jumpspider=三段·两段
       /centipede=很多段——三分支全档成立） */
    const anim = BODY_POOL[Math.floor(rnd() * BODY_POOL.length)];
    const picks = shuffled(PICKS3_OF.bodyseg, rnd);
    return { row: rowIdx, kind: kind, anim: anim,
             picks: picks, answer: picks.indexOf(pickIdOf3(kind, anim)),
             _miss: 0, _answered: false };
  }
  /* mixfind：cond 双条件（6=六条腿的昆虫/8=八条腿的蜘蛛）；契合 1+异类核心 1+
     干扰动物 1（每道恒含干扰动物——审计①候选盘落点）；封闭表内 LEGS==cond
     的 pick 唯一（恒一性）；anim=match（确认链尾名音取用——题面链禁念名防泄） */
  const cond = rnd() < 0.5 ? 6 : 8;
  const pool6 = ['ant', 'butterfly', 'bee', 'ladybird'];
  const pool8 = ['spider', 'wolfspider', 'jumpspider', 'scorpion'];
  const matchPool = cond === 6 ? pool6 : pool8;
  const otherPool = cond === 6 ? pool8 : pool6;
  const match = matchPool[Math.floor(rnd() * 4)];
  const wrongCore = otherPool[Math.floor(rnd() * 4)];
  const decoy = rnd() < 0.5 ? 'snail' : 'centipede';
  const picks = shuffled([match, wrongCore, decoy], rnd);
  return { row: rowIdx, kind: 'mixfind', anim: match, cond: cond,
           picks: picks, answer: picks.indexOf(match),
           _miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   N1 rotate：题(flat,k)=表行[(dch-1)*5+((flat%5)+k)%5]（章池 5 行 rotate——
   同关 5 题取同池 5 行天然互异；20 静态关每行恰现 5 次。r26：dch4 仍按本式
   取 row 号（quiz.row 照赋——20 行覆盖审计口径不变），kind/anim 由谱覆盖） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 887);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const base = (dch - 1) * 5;
  const rows = [];
  for (let k = 0; k < CH_LEN; k++) rows.push(base + (lv + k) % 5);
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(rows[qi], dch, qi, rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv, rows: rows,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点选引擎（无 DOM）：engTapPick(L, i) —— 点当前题第 i 枚候选
   'picked'  选对（本题完成 step+1；非末题）
   'done'    选对且末题=通关（SPEC §1 tapPick 枚举）
   'wrong'   选错：该题 miss+1（retries 全关累计=星级口径），候选回可重点（探索不罚）
   null      非法下标 / 关卡已结束 / 本题已答完 ---------- */
function engTapPick(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.picks.length) return null;
  if (i === q.answer) {
    q._answered = true;                                 // 单步题：一步一答
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'picked';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（SPEC §0 miss 计数款：全关选错 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星） */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：当前题契合项下标（独立函数供 verify 复核） */
const correctIdx = q => !q ? -1 : q.answer;

/* ---------- 结构校验（verify 用，返回失败原因或 null）：row 域 / kind·anim
   与题表行一致（dch1-3）/ anim 属 LEGS 封闭集 / 盘 2 枚恰为该 kind 候选集（互异）/
   answer=LEGS 推导下标复算（禁读直比）/ 同关 5 题行号=章池 rotate 复算 /
   初始态干净。r26 dch4 分支：谱位校验（dch===4 且 DCH4_KINDS[k] 匹配）+
   封闭表推导复算（三选集/三向推导/mixfind 唯一契合）——关级谱构成聚合
   断言在 game-verify ③（r24/r25 同范式） ---------- */
function structWhy(q, dch, lv, k) {
  if (!q) return 'quiz';
  if (!Number.isInteger(q.row) || q.row < 0 || q.row >= ROWS.length) return 'row';
  if (q.kind === 'judge3' || q.kind === 'legs3' || q.kind === 'bodyseg' || q.kind === 'mixfind') {
    if (dch !== 4 || DCH4_KINDS[k] !== q.kind) return 'dch4Pos';      // 谱位（qi 位对应）
    if (!Array.isArray(q.picks) || q.picks.length !== 3) return 'picksN';
    if (new Set(q.picks).size !== 3) return 'picksDup';
    if (q.kind === 'mixfind') {
      if (q.cond !== 6 && q.cond !== 8) return 'cond';
      if (!q.picks.every(p => LEGS[p] !== undefined)) return 'pickAnimSet';   // 候选=动物 id 封闭集
      if (q.picks.filter(p => LEGS[p] === q.cond).length !== 1) return 'matchUnique';   // 唯一契合（恒一性）
      if (q.anim !== q.picks.find(p => LEGS[p] === q.cond)) return 'anim';    // anim=契合动物
      if (q.answer !== q.picks.indexOf(q.anim)) return 'answer';
    } else {
      if (LEGS[q.anim] === undefined) return 'animSet';
      if (q.kind === 'bodyseg' && BODY_POOL.indexOf(q.anim) < 0) return 'bodyPool';   // 视觉诚实池域
      const want = PICKS3_OF[q.kind];
      if (q.picks.slice().sort().join('|') !== want.slice().sort().join('|')) return 'picksSet';
      if (q.answer !== q.picks.indexOf(pickIdOf3(q.kind, q.anim))) return 'answer';   // 三向推导复算
    }
  } else {
    const row = ROWS[q.row];
    if (q.kind !== row.kind) return 'kind';
    if (q.kind !== 'judge' && q.kind !== 'legs') return 'kindSet';
    if (dch === 4) return 'dch4Kind';                       // 旧 kind 不得出现在 dch4 谱位
    if (q.anim !== row.anim) return 'anim';
    if (LEGS[q.anim] === undefined) return 'animSet';
    if (!Array.isArray(q.picks) || q.picks.length !== 2) return 'picksN';
    if (new Set(q.picks).size !== 2) return 'picksDup';
    const want = PICKS_OF(q.kind);
    if (q.picks.slice().sort().join('|') !== want.slice().sort().join('|')) return 'picksSet';
    if (q.answer !== q.picks.indexOf(pickIdOf(q.kind, q.anim))) return 'answer';
  }
  if (k !== undefined && lv !== undefined && dch !== undefined) {
    if (q.row !== (dch - 1) * 5 + (lv + k) % 5) return 'rotate';   // N1 取材复算（dch4 row 照赋同式）
  }
  if (q._miss !== 0 || q._answered) return 'dirty';
  return null;
}
/* ================= ins 主逻辑（看动物听题→两选点选→LEGS 推导判定）
   开题演出（presentQuiz）：动物大图出场+题面拼接链
   KIDS.voice.queue(['ins_a_' + anim, 'ins_t_' + kind])——T46 阶段2 全 clip 双段链
   （动物名 clip+题模板尾段 ins_t_ clip——落空回退 TTS；段间 150。
   窗=ENTER 400+名 clip 实长+150+estMs(尾段)+300，动态按句长——家族 T）。
   演出锁=真时钟 state.showUntil（Date.now() 比较，tapPick 演出期返 null
   ——测试驱动须轮询等）。legs 族题恒挂 .leg-focus（腿高亮视觉锚——
   SPEC §1：腿逐条可数恒在，禁把答案画在题面）。
   选对=按钮闪亮 .good+动物图 happy 一拍+确认链 [ins_right]（单 clip 窗
   PICK_WIN 2964=2664+300 精确——家族 H）；选错=按钮摇头+错链

   知识红线；豁免窗 6638=1944+150+3744+300 真时钟，契约 I）+首错盘区整体
   wiggle（方向级不指候选）/ miss≥2 正确候选 breathe（答案级）。
   救援：14s 方向级=播科普句+动物图轻摆（lastDir 独立节流锚，不重置
   lastAct——契约 B）/ 30s 答案级=正确候选 breathe+重播题面；错链豁免窗让路
   （契约 I）。
   验收钩子：window.INS = { get currentLevel, get quiz{kind,anim,text,picks,
   answer,step,miss,say}, tapPick(i), start(flat), autoSolve() }——真实页同
   暴露（b29 坑⑥）。tapPick 返回：契合项非末题 'picked' / 末题 'done' /
   干扰项 'wrong' / 豁免窗内干扰项吞 false / 演出期 null（真时钟锁）/
   越界·已答完 null。 */
'use strict';

  const now = Date.now();

  return false;                            /* 节流未播返回 false——豁免窗仅链起播时设（契约 I「起播设」） */

/* ================= 开题演出：渲染 → 题面拼接链 → 开放点选。
   演出锁=真时钟 showUntil（tapPick 演出期 null）。
   r26（SPEC-R26 §R4）：dch4 具名题（judge3/legs3/bodyseg）链=['ins_a_'+anim,
   'ins_t_'+kind]（ins_t_judge3/legs3/bodyseg 新键——注册前静默）；mixfind 链=
   ['ins_t_mix'+cond] 单段（无主角名防泄）；窗=ENTER+名实长+150+estMs(尾)+300
   （mixfind 无名段）——estMs 全字符口径恒安全覆盖。================= */
async function presentQuiz() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  renderQuiz();
  const run = cur, token = ++showRun;
  const win = q.kind === 'mixfind'
    ? ENTER_MS + estMs(MIX_SAY[q.cond]) + 300                                        /* r26：单段链无名音 */
    : ENTER_MS + NAME_DUR[q.anim] + 150 + estMs(SAY_T4[q.kind] || SAY_T[q.kind]) + 300;   /* 出场 400 与题面链并行 */
  state.locked = true;

  /* 清理：恢复原 localStorage（不污染真实存档）——U12 继续用真实函数 */
  if (origLS === null) localStorage.removeItem('kidsgame_ins');
  else localStorage.setItem('kidsgame_ins', origLS);
  if (saveOk) npass++;
  units.save = { ok: saveOk, detail: saveDetail };

  /* ---- ⑫ realPath：预置存档 v1.0+tutSeen → start(0) 非教学直达题面（契约 E 分流；
       审查 m4：try/finally 保异常时 origLS 也恢复） ---- */
  total++;
  const today = new Date();
  const tstr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  const pre = { v: '1.0', game: 'ins', firstDay: tstr, lastDay: tstr, levels: {},
                dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 },
                restTip: { day: '', shown: 0 }, ins: { tutSeen: true } };
  let q12 = null, realOk = false;
  try {
    localStorage.setItem('kidsgame_ins', JSON.stringify(pre));
    KIDS.store.load();                             // 重读预置档
    window.__insDemoR = null;                       // 教学实证清零（非教学路径不应重设）
    window.INS.start(0);
    await unlocked();
    q12 = window.INS.quiz;
    realOk = state.tut === 'none' && window.__insDemoR === null &&
             q12 && q12.kind === 'judge' && q12.anim === 'ant' &&
             q12.step === 0 && q12.miss === 0 && q12.picks.length === 2 &&
             q12.text === '蚂蚁呀，它是昆虫还是蜘蛛？' &&        // 完整题面句（SPEC_TAIL 拼装）
             q12.answer === deriveV(q12) &&        // answer 独立推导
             window.INS.currentLevel.flat === 0 && window.INS.currentLevel.n === 5 &&
             (KIDS._save() || {}).v === '1.0' &&
             typeof window.INS === 'object' && typeof window.INS.tapPick === 'function' &&
             typeof window.INS.autoSolve === 'function';  // b29 坑⑥：钩子真实页同暴露
  } finally {
    /* 收尾清理：恢复原 localStorage + 沙盒 stub（防真实页误写）——异常路径也执行 */
    if (origLS === null) localStorage.removeItem('kidsgame_ins');
    else localStorage.setItem('kidsgame_ins', origLS);
    KIDS._save = function () { return { levels: {} }; };
    KIDS.store.persist = function () {};
  }
  if (realOk) npass++;
  units.realPath = { ok: realOk, tut: state.tut,
                     quiz: q12 && { kind: q12.kind, anim: q12.anim, n: q12.picks.length, text: q12.text } };

  /* ---- ⑬ dch4UI（r26）：flat15 全关真实 UI 驱动——谱序/三选盘/叶挡腿/mixfind/确认链/3★ ---- */
  total++;
  startLevel(15);
  await unlocked();
  let d4ok = window.INS.currentLevel.dch === 4;
  const d4notes = [];
  for (let k = 0; k < 5 && d4ok; k++) {
    const q = window.INS.quiz;
    if (!q) { d4ok = false; d4notes.push('q' + k + ':null'); break; }
    if (q.kind !== SPEC_DCH4_KINDS[k] || q.picks.length !== 3) { d4ok = false; d4notes.push('q' + k + ':kind/n ' + q.kind); break; }
    if (q.answer !== deriveV(q)) { d4ok = false; d4notes.push('q' + k + ':derive'); break; }
    if (q.text !== specSayV(q)) { d4ok = false; d4notes.push('q' + k + ':text'); break; }
    if (q.kind === 'legs3') {
      /* 叶挡腿：.leg-hide 在场+渲染腿 visibility hidden（撤锚实证） */
      const leg1 = animalEl.querySelector('[data-leg]');
      const hidOk = animalEl.classList.contains('leg-hide') && !!animalEl.querySelector('.leafcover') &&
                    leg1 && getComputedStyle(leg1).visibility === 'hidden';
      if (!hidOk) { d4ok = false; d4notes.push('q' + k + ':leg-hide'); break; }
    } else if (animalEl.classList.contains('leg-hide')) {
      d4ok = false; d4notes.push('q' + k + ':legHideLeak'); break;
    }
    if (q.kind === 'bodyseg' && SPEC_BODY_POOL.indexOf(q.anim) < 0) { d4ok = false; d4notes.push('q' + k + ':pool'); break; }
    if (q.kind === 'mixfind') {
      /* search 场景+cond+唯一契合+干扰动物在场 */
      const mixOk = animalEl.dataset.anim === 'search' &&
                    (q.cond === 6 || q.cond === 8) &&
                    q.picks.filter(p => SPEC_LEGS[p] === q.cond).length === 1 &&
                    q.picks.some(p => SPEC_EXTRA.indexOf(p) >= 0) &&
                    q.anim === q.picks[deriveV(q)];
      if (!mixOk) { d4ok = false; d4notes.push('q' + k + ':mix'); break; }
    }
    const hPre = window.__queueHist.length;
    const r = await window.INS.tapPick(q.answer);
    if (r !== (k === 4 ? 'done' : 'picked')) { d4ok = false; d4notes.push('q' + k + ':r=' + r); break; }
    if (q.kind === 'mixfind') {
      const segsM = window.__queueHist.slice(hPre);          /* mixfind 确认链=[right, 名音] 两段 */
      const chainM = segsM.some(h => h.length === 2 && h[0] === 'ins_right' &&
                         h[1] === 'ins_a_' + q.anim && !keylessLast(h));
      if (!chainM) { d4ok = false; d4notes.push('q' + k + ':chain'); break; }
    }
    if (k < 4) await unlocked();
  }
  const d4done = d4ok && window.INS.currentLevel.done && window.INS.currentLevel.won &&
                 window.INS.currentLevel.stars === 3 && window.INS.currentLevel.miss === 0;
  if (d4done) npass++;
  units.dch4UI = { ok: d4done, notes: d4notes, lv: window.INS.currentLevel };

  /* ---- ⑭ rescueLayers（r26）：flat15 qi1 legs3 救援分层直驱（14s 方向级不掀叶/
       30s 答案级掀叶+breathe——分层判别力：任一层被删该单元红） ---- */
  total++;
  startLevel(15);
  await unlocked();
  const r14a = await window.INS.tapPick(deriveV(window.INS.quiz));   // qi0 judge3 对 → 进 qi1
  await unlocked();
  const q14 = window.INS.quiz;
  let lv14 = r14a === 'picked' && q14 && q14.kind === 'legs3' &&
             animalEl.classList.contains('leg-hide');
  /* 14s 方向级：科普句按主角类三向（insect→sci_insect / spider→sci_spider /
     干扰动物→sci_none）+腿仍藏+契合候选无 breathe */
  const sciExp14 = 'ins_sci_' + clsOfV(q14.anim);
  window.INS._idleHack(15000);
  window.INS._rescueCore();
  await wait(80);
  const dir14 = window.__lastVoiceKey === sciExp14 &&
                animalEl.classList.contains('leg-hide') &&
                !pickAt(q14.answer).classList.contains('breathe');
  /* 30s 答案级：契合候选 breathe+掀叶（视锚回归）+重播题面链 */
  window.INS._idleHack(31000);
  window.INS._rescueCore();
  await wait(80);
  const ans14 = pickAt(q14.answer).classList.contains('breathe') &&
                !animalEl.classList.contains('leg-hide') &&
                window.__lastQueue && window.__lastQueue.length === 2 &&
                window.__lastQueue[0] === 'ins_a_' + q14.anim &&
                window.__lastQueue[1] === 'ins_t_legs3';
  /* 掀叶后仍可作答（救援不锁盘） */
  const r14b = await window.INS.tapPick(q14.answer);
  const lv14ok = lv14 && dir14 && ans14 && r14b === 'picked';
  if (lv14ok) npass++;
  units.rescueLayers = { ok: lv14ok, atLegs3: lv14, dir: dir14, ans: ans14, sciExp: sciExp14, next: r14b };

  /* ---- ⑮ dch4Sweep（r26）：dch4 全 10 关（静态 15-19+生成 25/27/29/37/39）谱聚合 ---- */
  total++;
  const F4 = [15, 16, 17, 18, 19, 25, 27, 29, 37, 39];
  const sweepBad = [];
  const subjCls = { insect: 0, spider: 0, none: 0 };
  /* b40 维护挂账③：bodyseg 答案三向 tally（此前无聚合一盲区：BODY_POOL seeded
     取 1，若 many 向全不现（P(centipede 十关全不中)≈16% 随机口径）many 推导通道
     被删不红）。F4 seed 确定 → tally 为谱推导精确值（非观测）：主角序列
     bee/centipede/spider/bee/jumpspider/ant/jumpspider/bee/bee/spider =
     three×5 / two×4 / many×1（many 唯一实存=flat16 centipede）——断言取谱
     推导下界「三向各 ≥1」（禁抄运行观测值） */
  const segTally = { three: 0, two: 0, many: 0 };
  let distrSubj = 0, decoyAll = true, cond6 = 0, cond8 = 0, sweepDet = true;
  for (const f of F4) {
    const L = genLevel(f), L2 = genLevel(f);
    if (JSON.stringify(L) !== JSON.stringify(L2)) sweepDet = false;   // 含 cond/row 全字段确定性
    L.quizzes.forEach((q, qi) => {
      const why = structWhy(q, L.dch, L.lv, qi);
      if (why) sweepBad.push(f + '/' + qi + ':' + why);
      if (q.kind !== SPEC_DCH4_KINDS[qi]) sweepBad.push(f + '/' + qi + ':kind');
      if (q.answer !== deriveV(q)) sweepBad.push(f + '/' + qi + ':derive');
      if (q.kind === 'judge3' || q.kind === 'legs3') {
        const pid = pickIdOf3V(q.kind, q.anim);
        const cls = pid === 'insect' || pid === 'six' ? 'insect'
                  : (pid === 'spider' || pid === 'eight' ? 'spider' : 'none');
        subjCls[cls]++;
        if (SPEC_EXTRA.indexOf(q.anim) >= 0) distrSubj++;
      } else if (q.kind === 'bodyseg') {
        segTally[pickIdOf3V('bodyseg', q.anim)]++;   // 三向计数（SEGS 推导：3→three/2→two/其余→many）
      } else if (q.kind === 'mixfind') {
        if (!q.picks.some(p => SPEC_EXTRA.indexOf(p) >= 0)) decoyAll = false;   // 恒含干扰动物候选
        if (q.cond === 6) cond6++; else if (q.cond === 8) cond8++; else sweepBad.push(f + '/' + qi + ':cond');
      }
    });
  }
  const sweepOk = sweepBad.length === 0 && sweepDet && decoyAll &&
                  subjCls.insect > 0 && subjCls.spider > 0 && subjCls.none > 0 &&   // 三分类全现
                  distrSubj > 0 && cond6 > 0 && cond8 > 0 &&                        // 干扰主角/双条件全现
                  segTally.three > 0 && segTally.two > 0 && segTally.many > 0;      // 挂账③：bodyseg 三向实存（谱推导 5/4/1）
  if (sweepOk) npass++;
  units.dch4Sweep = { ok: sweepOk, bad: sweepBad.slice(0, 5), subjCls: subjCls,
                      distrSubj: distrSubj, decoyAll: decoyAll, cond: { 6: cond6, 8: cond8 },
                      segTally: segTally, det: sweepDet };

  const out = { game: 'ins', total: total, pass: npass, units: units };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__insVlog = out;                          // __vlog 计数（外部断言挂点，任务书钩子）
  document.title = (npass === total) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL ' + (total - npass);
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text 并留播报历史；voice.say 记录文本（__lastSayText）；
     voice.queue 记录拼播链（__lastQueue+__queueHist 全史——本款题面链走 queue） */
  window.__voiceHist = [];
  window.__queueHist = [];
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) {
    window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null;
    if (k) window.__voiceHist.push(k);
  };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    if (parts) window.__queueHist.push(parts);
    window.__lastVoiceKey = parts && parts.length
      ? (typeof parts[0] === 'string' ? parts[0] : parts[0].key) : null;
  };
  runVerify();
}

</script>
