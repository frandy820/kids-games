<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>问题拆解小博士</title>
<style>
/* ================= brk 问题拆解小博士（batch40）=================
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E。
   玩法 = 大目标拆小问题（SPEC-BATCH40 §3，7-8 岁信息素养/语言）：
   目标牌（图标+目标名+族副题）+ 槽区（pick=小问题清单 3 槽 / order=步骤
   序列 1-5 号槽）+ 候选卡池 5 张（4-6 字短句文字卡——7-8 岁文字允许，
   识字辅助=题面 TTS+模板句；卡不带来源标记——干扰不点破，排除法可玩）。
   点对=卡飞入槽（pick 清单逐格亮/order 序列按号进）；点错=干扰卡轻晃
   +brk_wrong 反馈句；题完成=确认链 brk_right。
   触摸目标：候选卡 ≥96×96（实测 ~118×112）；overflowX 恒 0。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：任务桌（目标牌+槽区+候选卡池） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;overflow:hidden;padding:6px 12px}
#scene{position:relative;flex:1 1 auto;width:100%;max-width:660px;min-height:230px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,#FDF3E3 0%,#FAE9CF 100%);
  border:3px solid #E5CDA6;border-radius:26px;overflow:hidden;
  box-shadow:inset 0 0 0 5px rgba(255,249,238,.55);padding:10px 12px}
#scene .ground{position:absolute;left:8%;right:8%;bottom:14px;height:14px;border-radius:50%;
  background:rgba(201,179,138,.3)}

/* 目标牌：图标+目标名+族副题（题面真值=目标名 clip+模板 TTS——文字双通道） */
#goal-board{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:12px;z-index:2;
  background:#FFF9EE;border:3px solid #4A3B2E;border-radius:18px;box-shadow:0 5px 0 #D8C9B4;
  padding:8px 18px;max-width:100%}
#goal-board .goal-ic{width:56px;height:56px;flex:0 0 56px;display:flex;align-items:center;
  justify-content:center;background:#F2DDC0;border-radius:14px}
#goal-board .goal-ic svg{width:46px;height:46px}
#goal-board .goal-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
#goal-name{font-size:26px;font-weight:800;color:#4A3B2E;letter-spacing:2px;line-height:1.15}
#goal-sub{font-size:14px;color:#8A7B6C;letter-spacing:1px}
#goal-board.in{animation:gb-in .45s ease}
@keyframes gb-in{0%{transform:translateY(-16px) scale(.92);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
#goal-board.repop{animation:gb-re .6s ease}
@keyframes gb-re{0%,100%{transform:scale(1)}45%{transform:scale(1.05)}}

/* 槽区：pick=小问题清单 3 槽 / order=步骤序列 1-5 号槽（序号恒可见=顺序锚） */
#slot-row{flex:0 0 auto;display:flex;justify-content:center;align-items:stretch;gap:8px;
  width:100%;max-width:620px;position:relative;z-index:2}
.slot{flex:1 1 0;min-width:92px;min-height:64px;border-radius:14px;padding:4px 6px;
  background:rgba(255,249,238,.75);border:2.6px dashed #C9A87C;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:border-color .3s,background .3s}
.slot .sn{font-size:13px;font-weight:800;color:#C9A87C;letter-spacing:1px}
.slot .sc{font-size:15px;font-weight:700;color:#4A3B2E;letter-spacing:1px;text-align:center;
  line-height:1.25;min-height:19px}
.slot.filled{border-style:solid;border-color:#8FBF7F;background:#F1F6E8}
.slot.filled .sn{color:#8FBF7F}
.slot.pop-in{animation:sl-pop .7s ease}
@keyframes sl-pop{0%{transform:translateY(-14px) scale(.7);opacity:0}
  60%{transform:translateY(2px) scale(1.06);opacity:1}100%{transform:translateY(0) scale(1)}}

/* 候选卡池：5 张文字卡（4-6 字短句；2 行 flex wrap——竖屏 3+2 横屏 1 行） */
#card-pool{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;
  width:100%;max-width:620px;position:relative;z-index:2}
#card-pool.wig{animation:cp-wig .5s ease}
@keyframes cp-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
#card-pool.bump{animation:cp-bump .22s ease}
@keyframes cp-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
.tcard{min-width:104px;min-height:96px;flex:1 1 0;max-width:128px;padding:8px 6px;
  border-radius:16px;background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:transform .15s;position:relative}
.tcard:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.tcard .dot{width:13px;height:13px;border-radius:50%;background:#F2DDC0;border:2.2px solid #4A3B2E;
  transition:background .3s}
.tcard .tx{font-size:19px;font-weight:800;color:#4A3B2E;letter-spacing:1px;
  line-height:1.3;text-align:center;word-break:keep-all}
.tcard.pop{animation:tc-pop .45s ease backwards}
@keyframes tc-pop{0%{transform:translateY(22px) scale(.86);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
/* 点对离场：卡飞入槽（缩落渐隐——进度承载在槽） */
.tcard.gone{animation:tc-gone 1s ease forwards;pointer-events:none}
@keyframes tc-gone{0%{transform:translateY(0) scale(1);opacity:1}
  55%{transform:translateY(-26px) scale(.8);opacity:.85}
  100%{transform:translateY(-44px) scale(.4);opacity:0}}
.tcard.gone .dot{background:#8FBF7F}
/* 点错：卡轻晃（不亮正确卡本体——排除法可玩） */
.tcard.miss{animation:tc-miss .5s ease}
@keyframes tc-miss{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
/* 已选卡：轻摇拒绝（家族 D——不罚） */
.tcard.shake{animation:tc-shk .4s ease}
@keyframes tc-shk{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}
  70%{transform:translateX(5px)}}
/* 救援答案级：当前该点卡高亮呼吸 */
.tcard.breathe{animation:tc-hint 1.2s ease-in-out infinite}
@keyframes tc-hint{0%,100%{box-shadow:0 5px 0 #D8C9B4}
  50%{box-shadow:0 5px 0 #D8C9B4,0 0 16px rgba(232,151,90,.95)}}

#q-text{flex:0 0 auto;font-size:15px;letter-spacing:2px;color:#8A7B6C;padding:0 0 6px}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，教学演示/帮共用；照家族形态） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：舞台收紧+卡池 3+2 两行 */
@media (orientation:portrait){
  #scene{min-height:200px;max-width:470px;gap:6px;padding:8px 8px}
  #goal-board{gap:8px;padding:6px 12px}
  #goal-board .goal-ic{width:46px;height:46px;flex:0 0 46px;border-radius:11px}
  #goal-board .goal-ic svg{width:38px;height:38px}
  #goal-name{font-size:21px}
  #goal-sub{font-size:12px}
  #slot-row{gap:6px;max-width:440px}
  .slot{min-width:76px;min-height:56px;padding:3px 4px}
  .slot .sn{font-size:11px}
  .slot .sc{font-size:12.5px;min-height:16px}
  #card-pool{gap:8px;max-width:400px}
  .tcard{min-width:104px;min-height:92px;flex-basis:30%;max-width:126px}
  .tcard .tx{font-size:16.5px}
  .tcard .dot{width:11px;height:11px}
}
</style>
</head>
<body>
<div id="game" aria-label="问题拆解小博士">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="任务桌：帮小兔子拆一拆">
      <div class="ground" aria-hidden="true"></div>
      <div id="goal-board" aria-hidden="true">
        <span class="goal-ic" id="goal-ic"></span>
        <span class="goal-tx">
          <b id="goal-name"></b>
          <span id="goal-sub"></span>
        </span>
      </div>
      <div id="slot-row" aria-label="小问题清单"></div>
      <div id="card-pool" aria-label="候选卡片：点一张"></div>
    </div>
    <div id="q-text" aria-hidden="true"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
