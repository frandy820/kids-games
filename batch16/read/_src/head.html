<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阅读小侦探</title>
<style>
/* ================= 阅读小侦探 read（batch16）=================
   视觉按 SPEC-BATCH16 §1 + 家族暖底：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E
   舞台三行纵叠：短文卡（书本卡，一句一行=大点击区跟读）→ 问句条（放大镜+问句）
   → 选项卡 3 张（主答案 ≥96，§0.9）；flex 纵向 + space-evenly，横竖屏同一结构 overflowX 恒 0
   点对：短文卡打勾收起（绿框+勾角标）+选项卡跳一下；点错：卡晃动+短文关键句高亮一下（§1）
   ch1 色圆卡 / ch2 地点简笔卡 / ch3 纯文字卡（.plain）/ ch4 表情脸卡 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#FDEBD2;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:space-evenly;padding:6px 8px;overflow:hidden}

/* 短文卡（书本卡）：一句一行（button.psent=跟读点击区 ≥64 高）；
   点对=.ok 绿框+右上勾角标（打勾收起视觉 §1） */
#pcard{position:relative;width:min(94%,720px);max-height:52vh;border-radius:22px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;padding:10px 20px 10px 16px;flex:0 0 auto}
#pcard::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:7px;border-radius:4px;
  background:#E8975A;opacity:.85}
#passage{display:flex;flex-direction:column;gap:2px}
.psent{display:block;width:100%;min-height:64px;padding:8px 8px 8px 18px;border-radius:12px;
  text-align:left;font-size:clamp(18px,2.5vw,23px);font-weight:700;color:#4A3B2E;line-height:1.5;
  transition:background .2s}
.psent.flash{animation:psent-flash .9s ease}
@keyframes psent-flash{0%,100%{background:transparent}
  40%{background:#FDEBD2;box-shadow:0 0 0 3px #E8975A inset}}
.psent.reading{background:#FDF3DF;box-shadow:0 0 0 3px #E8975A inset}
.psent.breathe{animation:psent-b 1.6s ease-in-out infinite}
@keyframes psent-b{0%,100%{background:transparent;transform:scale(1)}
  50%{background:#FDF3DF;transform:scale(1.015)}}
#pc-check{position:absolute;right:-14px;top:-16px;width:56px;height:56px;display:none;
  filter:drop-shadow(0 3px 0 #D8C9B4)}
#pcard.ok{border-color:#6FA063;box-shadow:0 5px 0 #9CBF8C,0 0 20px rgba(143,191,127,.65);
  animation:pc-ok .5s cubic-bezier(.2,1.6,.4,1)}
#pcard.ok #pc-check{display:block;animation:pc-ok .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes pc-ok{0%{transform:scale(.3) rotate(-14deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* 问句条（点击重听题句=主动学习动作，重置救援钟 §0.7a） */
#tip{min-height:64px;max-width:94%;padding:9px 30px;border-radius:32px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;gap:12px;transition:transform .15s;flex:0 0 auto}
#tip.flash{animation:tip-b .5s ease}
@keyframes tip-b{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#tip-ico{flex:0 0 auto;display:flex;align-items:center}
#tip-text{font-size:clamp(20px,2.8vw,26px);font-weight:800;color:#4A3B2E;line-height:1.2;white-space:nowrap}

/* 选项卡（主答案按钮 ≥96，§0.9）：ch1 色圆/ch2 地点/ch4 表情脸；ch3=.plain 纯文字 */
#cards{display:flex;justify-content:center;align-items:stretch;gap:clamp(12px,2.4vw,26px);
  padding:2px 6px;max-width:100%}
.card{width:clamp(110px,15vw,156px);min-height:clamp(104px,16vh,140px);border-radius:22px;
  background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:10px 8px 8px;transition:transform .15s,box-shadow .15s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card .c-ico{flex:0 0 auto;width:clamp(54px,7.5vw,72px);height:clamp(54px,7.5vw,72px)}
.card .c-ico svg{width:100%;height:100%}
.card .nm{font-size:clamp(18px,2.5vw,23px);font-weight:800;color:#4A3B2E;line-height:1.15;text-align:center}
.card.plain .nm{font-size:clamp(16px,2.1vw,19px);line-height:1.35}
.card.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}
  55%{transform:rotate(5deg)}80%{transform:rotate(-3deg)}}
.card.hop{animation:card-hop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes card-hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px) scale(1.05)}}
.card.pulse{animation:card-pulse 1s ease 2}
@keyframes card-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}
.card.breathe{animation:card-breathe 1.6s ease-in-out infinite}
@keyframes card-breathe{0%,100%{transform:scale(1);box-shadow:0 5px 0 #D8C9B4}
  50%{transform:scale(1.05);box-shadow:0 5px 0 #D8C9B4,0 0 18px rgba(232,151,90,.9)}}
.card.nudge{animation:card-nudge .34s ease}
@keyframes card-nudge{0%{outline:7px solid #F5C445;outline-offset:0}
  100%{outline:7px solid transparent;outline-offset:10px}}
.card.dim{opacity:.35;filter:grayscale(.55)}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：纵向余量大——短文卡/选项卡放大，行距收紧防溢出 */
@media (orientation:portrait){
  #pcard{width:min(96%,640px);padding:12px 22px 12px 18px}
  .psent{font-size:clamp(19px,2.9vw,24px)}
  .card{width:clamp(116px,27vw,160px)}
  .card .c-ico{width:clamp(60px,15vw,80px);height:clamp(60px,15vw,80px)}
}
</style>
</head>
<body>
<div id="game" aria-label="阅读小侦探">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="pcard" class="pcard">
      <div id="passage" aria-label="小故事"></div>
      <div id="pc-check" aria-hidden="true"></div>
    </div>
    <div id="tip" aria-live="polite"><span id="tip-ico" aria-hidden="true"></span><span id="tip-text"></span></div>
    <div id="cards" aria-label="选项卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="听读"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
