<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英语拼写</title>
<style>
/* ================= 英语拼写 spellen（batch16 · r16 难度改造）=================
   视觉按 SPEC-BATCH16 §2-r16（承家族暖米底）：三题型混排——
   listen=大喇叭（播英文单词发音 clip §0.32）+目标格 3-6（已拼字母可点退回）+字母瓦片池；
   missing=词卡亮大半字母缺 1-2 位（可见格 given 只读+缺位格 blank 呼吸）+字母选项卡；
   meaning=中文释义卡（替位喇叭；底栏「再听」可主动听）+瓦片池。
   拼满/填空判对→星星+下一词；判错→晃动零惩罚（瓦片型可退回，missing 选项不消失）。
   触摸目标：瓦片/选项卡/已拼格 ≥64、大喇叭/提示 ≥96、底栏按钮 ≥72 高；pointerdown 即响应；
   词展示一律小写（一年级课本口径） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:4px 10px}

/* ---------- 题面行：大喇叭（听单词）/ 中文释义卡（meaning 型替位）+ 目标格 ---------- */
#board{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;
  min-height:112px;padding:0 8px}
/* 释义卡（r16 meaning 型题面：中文释义大字，非按钮展示位） */
#mean-card{display:none;min-width:150px;min-height:104px;padding:10px 26px;border-radius:24px;
  background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 6px 0 #C9A87C;flex:0 0 auto;
  align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#4A3B2E;
  letter-spacing:.06em;animation:spk-in .4s cubic-bezier(.2,1.5,.4,1) both}
#game.q-meaning #mean-card{display:flex}
#game.q-meaning #speaker-btn{display:none}    /* meaning 型喇叭替位（底栏「再听」仍可主动听） */
#speaker-btn{width:104px;height:104px;border-radius:50%;background:#E8975A;border:3px solid #4A3B2E;
  box-shadow:0 6px 0 #C77A42;display:flex;align-items:center;justify-content:center;flex:0 0 104px;
  transition:transform .15s,box-shadow .15s;animation:spk-in .4s cubic-bezier(.2,1.5,.4,1) both}
@keyframes spk-in{from{transform:scale(0)}to{transform:scale(1)}}
#speaker-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C77A42}
#speaker-btn svg{width:56px;height:56px}
#speaker-btn.bounce{animation:spk-b .45s ease}
@keyframes spk-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#speaker-btn .wv{display:flex;gap:3px;align-items:flex-end;height:14px;margin-top:-2px}
#speaker-btn .wv i{width:3.5px;border-radius:2px;background:#FFF9EE;animation:wv 1s ease-in-out infinite}
#speaker-btn .wv i:nth-child(1){height:6px;animation-delay:0s}
#speaker-btn .wv i:nth-child(2){height:12px;animation-delay:.18s}
#speaker-btn .wv i:nth-child(3){height:8px;animation-delay:.36s}
@keyframes wv{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1.15)}}

/* 目标格：虚线空格→实心字母卡（可点退回）；救援 breathe；整排 wig=拼满判错 */
#slots{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
#slots.wig{animation:slots-wig .5s ease}
@keyframes slots-wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}
  40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.cell{width:76px;height:76px;padding:0;border-radius:16px;background:#F6ECD9;
  border:3px dashed #C9A87C;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,background .2s,border-color .2s}
.cell .lt{font-size:42px;font-weight:800;line-height:1;color:#4A3B2E}
.cell.full{background:#FFFAF0;border-style:solid}
.cell.full .lt{animation:lt-in .32s cubic-bezier(.2,1.6,.4,1) both}
@keyframes lt-in{from{transform:scale(.2) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.cell.full:active{transform:translateY(3px)}
.cell.win{background:#8FBF7F;border-color:#6FA063}
.cell.win .lt{color:#FFF9EE}
.cell.breathe{animation:cell-breathe 1.6s ease-in-out infinite}
@keyframes cell-breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(232,151,90,0)}
  50%{transform:scale(1.12);box-shadow:0 0 16px rgba(232,151,90,.85)}}
/* r16 missing 词卡格：可见字母格（只读，浅米实底）/ 缺位格（虚线待填，当前位呼吸高亮） */
.cell.given{background:#FFFAF0;border-style:solid;border-color:#C9A87C;cursor:default}
.cell.blank{background:#FDF6E7;border:3px dashed #E8975A}
.cell.blank.cur{animation:blank-cur 1.5s ease-in-out infinite}
@keyframes blank-cur{0%,100%{box-shadow:0 0 0 rgba(232,151,90,0);border-color:#E8975A}
  50%{box-shadow:0 0 14px rgba(232,151,90,.75);border-color:#C77A42}}

/* ---------- 桌面：字母瓦片池 ---------- */
#table-area{flex:1 1 auto;min-height:180px;width:100%;max-width:1120px;display:flex;
  flex-direction:column;justify-content:center;gap:8px}
#tile-pool{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:14px 16px;min-height:80px;padding:8px 10px;border-radius:20px;
  background:#F6ECD9;border:2.5px dashed #D9C5A6}
/* 字母瓦片：暖色积木卡轮换五色；点后 .gone（入格）；救援/帮 breathe、pulse 三连 */
.tile{position:relative;width:68px;height:68px;padding:0;border-radius:16px;
  border:2.5px solid #4A3B2E;box-shadow:0 4px 0 rgba(74,59,46,.28);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;animation:tile-in .4s cubic-bezier(.2,1.5,.4,1) both}
.tile:nth-child(2n){animation-delay:.06s}.tile:nth-child(3n){animation-delay:.12s}
@keyframes tile-in{from{transform:scale(0) rotate(-14deg)}to{transform:scale(1) rotate(0)}}
.tile:active{transform:translateY(3px)}
.tile .lt{font-size:40px;font-weight:800;line-height:1;color:#4A3B2E}
.tile.gone{visibility:hidden;pointer-events:none}
.tile.breathe{animation:tile-breathe 1.6s ease-in-out infinite}
@keyframes tile-breathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(232,151,90,0))}
  50%{transform:scale(1.12);filter:drop-shadow(0 0 12px rgba(232,151,90,.85))}}
.tile.pulse{animation:tile-pulse .5s ease 3}
@keyframes tile-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22) rotate(6deg)}}
.tile.nudge{animation:tile-nudge .4s ease}
@keyframes tile-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}
  60%{transform:translateX(5px)}}

/* ---------- 底部答案区：「提示」主按钮（≥96，首字母格 breathe 不自动填入） ---------- */
#answers{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:20px;
  flex-wrap:wrap;min-height:118px;padding:2px 12px}
#tip{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#8A7B6C}
#tip svg{width:34px;height:34px}
#hint-btn{min-width:200px;min-height:96px;padding:0 36px;border-radius:26px;background:#8FBF7F;
  border:3px solid #4A3B2E;box-shadow:0 6px 0 #6FA063;color:#FFF9EE;font-size:32px;font-weight:800;
  letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:12px;
  transition:transform .15s,box-shadow .15s;animation:spk-in .38s cubic-bezier(.2,1.5,.4,1) both}
#hint-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #6FA063}
#hint-btn svg{width:44px;height:44px}
#hint-btn.nudge{animation:hint-nudge .4s ease}
@keyframes hint-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 money/cashier） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持，通道 A=@media）：喇叭/格/瓦片/释义卡适配（已拼格/瓦片仍 ≥64）
   ——与下方 body.port 通道 B 逐条等值（r16 竖屏三件套纪律，verify simView/_selftest P1b 双锚） */
@media (orientation:portrait){
  #speaker-btn{width:96px;height:96px;flex-basis:96px}
  #speaker-btn svg{width:50px;height:50px}
  .cell{width:64px;height:64px;border-radius:14px}
  .cell .lt{font-size:36px}
  .tile{width:64px;height:64px}
  .tile .lt{font-size:36px}
  #slots{gap:8px}
  #tile-pool{gap:10px 12px}
  #hint-btn{min-width:180px;font-size:28px}
  #board{gap:14px}
  #mean-card{min-height:96px;padding:8px 18px;font-size:34px}
}
/* 竖屏通道 B：body.port 类（verify simView 模拟竖屏——与上方 @media 逐条等值，双通道同步） */
/*PORT-CLS*/
body.port #speaker-btn{width:96px;height:96px;flex-basis:96px}
body.port #speaker-btn svg{width:50px;height:50px}
body.port .cell{width:64px;height:64px;border-radius:14px}
body.port .cell .lt{font-size:36px}
body.port .tile{width:64px;height:64px}
body.port .tile .lt{font-size:36px}
body.port #slots{gap:8px}
body.port #tile-pool{gap:10px 12px}
body.port #hint-btn{min-width:180px;font-size:28px}
body.port #board{gap:14px}
body.port #mean-card{min-height:96px;padding:8px 18px;font-size:34px}
/*PORT-CLS-END*/
</style>
</head>
<body>
<div id="game" aria-label="英语拼写">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board">
      <div id="mean-card" aria-label="中文释义"></div>
      <button id="speaker-btn" aria-label="听一听这个单词"></button>
      <div id="slots" aria-label="单词拼写格"></div>
    </div>
    <div id="table-area">
      <div id="tile-pool" aria-label="字母瓦片池"></div>
    </div>
    <div id="answers" aria-label="作答区"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍单词"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
