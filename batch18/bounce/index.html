<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>弹球进洞</title>
<style>
/* ================= 弹球进洞 bounce（batch18）=================
   视觉按 SPEC-BATCH18 §3（承家族暖米底）：每题=弹球台 SVG 面板（6×5 格当量，
   格点阵整数坐标）+球起点+2-3 张方向卡（8 方向：水平/垂直/对角线）+墙
   （边界恒在+内部障碍墙段，含 ch3+ 的 45° 斜镜面）+洞 2-3 个（1 正确）。
   点方向卡→球沿格点直线飞行，入射角=反射角（水平墙翻 vy/垂直墙翻 vx/
   斜墙翻转轴向分解）→入正确洞=过关推进；入错洞/步数上限（8 段反弹）=
   零惩罚可重点。触摸目标：方向卡 ≥64（实做 ≥96）、底栏按钮 ≥72 高；
   pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:4px 10px}

/* ---------- 题面：弹球台 SVG ---------- */
#board{position:relative;flex:0 0 auto;animation:board-in .4s cubic-bezier(.2,1.5,.4,1) both}
@keyframes board-in{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#field{width:456px;height:388px;max-width:94vw;height:auto;background:#F6ECD9;border-radius:20px;
  box-shadow:0 5px 0 rgba(74,59,46,.2)}
/* 边界墙（恒在）=面板四周厚描边矩形；被弹到时闪亮 */
#field .bounds{fill:none;stroke:#7A5B41;stroke-width:8;transition:stroke .2s}
#field .bounds.hitflash{stroke:#E8975A}
/* 格点阵小圆点（帮孩子盯线） */
#field .dot{fill:#DCCBAC}
/* 内部墙段：厚圆头线；被弹到时 glow */
#field line.wall{stroke:#7A5B41;stroke-width:10;stroke-linecap:round;transition:stroke .2s}
#field line.wall.glow{stroke:#E8975A}
/* 洞：外圈深棕+内坑更暗；吞球时绿圈扩散 */
#field .hole .pit{fill:#3B2C20}
#field .hole .dark{fill:#201710}
#field .hole .ring{fill:none;stroke:transparent;stroke-width:3.5;
  transform-box:fill-box;transform-origin:center}
#field .hole.gulp .ring{stroke:#8FBF7F;animation:hole-gulp .55s ease both}
@keyframes hole-gulp{from{transform:scale(1);opacity:1}to{transform:scale(1.9);opacity:0}}
/* 起点标记：虚线圆环 */
#field .start{fill:none;stroke:#C9A87C;stroke-width:2.5;stroke-dasharray:4 4}
/* 已飞轨迹：暖橙细线（错后保留=回看弹点） */
#field #trail{fill:none;stroke:#E8975A;stroke-width:4;opacity:.5;stroke-linecap:round;stroke-linejoin:round}
/* 救援首段轨迹虚线（正确方向第一段） */
#field .hole .wrong-x{stroke:#E0503C;stroke-width:4.5;stroke-linecap:round;animation:x-pop .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes x-pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
#field #rescue-line{stroke:#8FBF7F;stroke-width:5;stroke-dasharray:9 8;stroke-linecap:round;visibility:hidden}
#field #rescue-line.show{visibility:visible;animation:rescue-blink 1.1s ease-in-out 3}
@keyframes rescue-blink{0%,100%{opacity:.95}50%{opacity:.25}}
/* 小球：CSS transform 平移（逐格飞行）；gone=淡出（入洞/步数上限） */
#field #ball{transition:transform .09s linear,opacity .3s}
#field #ball .body{fill:#E8975A;stroke:#4A3B2E;stroke-width:2.5}
#field #ball .shine{fill:#FFF;opacity:.75}
#field #ball.gone{opacity:0}

/* ---------- 底部作答区：方向卡（≥64 实做 ≥96） ---------- */
#answers{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;min-height:132px;padding:2px 12px}
#tip{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#8A7B6C}
#tip svg{width:32px;height:32px}
#cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.dcard{min-width:104px;min-height:104px;padding:8px 20px;border-radius:24px;background:#FFFAF0;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #C9A87C;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;transition:transform .15s,box-shadow .15s;
  animation:board-in .38s cubic-bezier(.2,1.5,.4,1) both}
.dcard:nth-child(2){animation-delay:.07s}
.dcard:nth-child(3){animation-delay:.14s}
.dcard:active{transform:translateY(3px);box-shadow:0 2px 0 #C9A87C}
.dcard .a-ico{width:52px;height:52px;display:flex}
.dcard .a-ico svg{width:100%;height:100%}
.dcard .nm{font-size:19px;font-weight:800;color:#4A3B2E;letter-spacing:.08em}
.dcard.breathe{animation:card-breathe 1.6s ease-in-out infinite}
@keyframes card-breathe{0%,100%{transform:scale(1);box-shadow:0 5px 0 #C9A87C,0 0 0 rgba(143,191,127,0)}
  50%{transform:scale(1.1);box-shadow:0 5px 0 #C9A87C,0 0 18px rgba(143,191,127,.9)}}
.dcard.nudge{animation:card-nudge .4s ease}
@keyframes card-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}

/* ---------- 幽灵手指教学（照 mirrormaze/read） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：方向卡仍 ≥64（实做 96），台面随宽缩放 */
@media (orientation:portrait){
  .dcard{min-width:96px;min-height:96px;padding:6px 16px}
  .dcard .a-ico{width:46px;height:46px}
  #tip{font-size:16px}
}
</style>
</head>
<body>
<div id="game" aria-label="弹球进洞">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board" aria-label="弹球台面">
      <svg id="field" viewBox="0 0 456 388" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="answers" aria-label="方向卡作答区"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增；难度章号：静态关 (ch-1)%4+1 循环，生成关随机 1-4（§0.3） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;
const sameDir = (a, b) => a[0] === b[0] && a[1] === b[1];

/* ---------- 墙段几何（游戏侧实现；verify 侧自带独立实现，禁复用 §0.39） ---------- */
/* 墙段覆盖的格点序列（端点含） */
function wallPoints(w) {
  const sx = Math.sign(w.x2 - w.x1), sy = Math.sign(w.y2 - w.y1);
  const n = Math.max(Math.abs(w.x2 - w.x1), Math.abs(w.y2 - w.y1));
  const pts = [];
  for (let k = 0; k <= n; k++) pts.push([w.x1 + sx * k, w.y1 + sy * k]);
  return pts;
}
/* 墙种类：'H' 水平（沿 x，翻 vy）/ 'V' 垂直（沿 y，翻 vx）/ 'D+' 斜(1,1) / 'D-' 斜(1,-1) */
function wallKind(w) {
  const dx = w.x2 - w.x1, dy = w.y2 - w.y1;
  if (dx === 0) return 'V';
  if (dy === 0) return 'H';
  return (dx > 0) === (dy > 0) ? 'D+' : 'D-';
}
/* 墙点占用表：格点键 -> {k:[墙种类...], w:[墙下标...]}（内部墙两两不共点 ⇒ k/w 至多一对一） */
function buildOcc(walls) {
  const occ = {};
  walls.forEach(function (w, wi) {
    const k = wallKind(w);
    wallPoints(w).forEach(function (p) {
      const key = p[0] + ',' + p[1];
      if (!occ[key]) occ[key] = { k: [], w: [] };
      occ[key].k.push(k);
      occ[key].w.push(wi);
    });
  });
  return occ;
}

/* ---------- 反弹模拟（游戏侧）：occ=buildOcc(walls)；返回
   { pts:[[x,y]...] 逐格点轨迹, outcome:'hole'|'limit'|'out'|'steps', holeIdx, bounces,
     diagHit, bounceIdx:[反弹顶点在 pts 中的下标], hitWalls:{墙下标:true} } ---------- */
function simShot(occ, W, H, ball, dir, holes) {
  let x = ball.x, y = ball.y, dx = dir[0], dy = dir[1];
  const pts = [[x, y]];
  const bounceIdx = [];
  const hitWalls = {};
  let bounces = 0, diagHit = false, fresh = true;
  for (let s = 0; s < MAX_STEPS; s++) {
    if (fresh) {                                    // 到达新格点：先按该点墙向反弹
      const o = occ[x + ',' + y];
      let ndx = dx, ndy = dy, isDiag = false;
      if (x === 0 || x === W) ndx = -ndx;           // 边界左右墙=垂直
      if (y === 0 || y === H) ndy = -ndy;           // 边界上下墙=水平
      if (o) for (let j = 0; j < o.k.length; j++) {
        const kk = o.k[j];
        if (kk === 'H') ndy = -ndy;
        else if (kk === 'V') ndx = -ndx;
        else if (kk === 'D+') { const t = ndx; ndx = ndy; ndy = t; isDiag = true; }
        else { const t = ndx; ndx = -ndy; ndy = -t; isDiag = true; }   // 'D-'
      }
      if (ndx !== dx || ndy !== dy) {                // 贴墙滑（方向不变）不计反弹
        if (o) for (let j = 0; j < o.w.length; j++) hitWalls[o.w[j]] = true;
        if (bounces >= MAX_BOUNCE)                   // 第 9 次变向=出界口径（§0.39 步上限）
          return { pts: pts, outcome: 'limit', holeIdx: -1, bounces: bounces,
            diagHit: diagHit, bounceIdx: bounceIdx, hitWalls: hitWalls };
        bounces++;
        bounceIdx.push(pts.length - 1);
        if (isDiag) diagHit = true;
        dx = ndx; dy = ndy;
      }
      fresh = false;
    }
    x += dx; y += dy;
    if (x < 0 || x > W || y < 0 || y > H)            // 保险丝（边界恒反弹，理论不可达）
      return { pts: pts, outcome: 'out', holeIdx: -1, bounces: bounces,
        diagHit: diagHit, bounceIdx: bounceIdx, hitWalls: hitWalls };
    pts.push([x, y]);
    for (let h = 0; h < holes.length; h++)           // 到点即查洞（先入洞后反弹）
      if (holes[h].x === x && holes[h].y === y)
        return { pts: pts, outcome: 'hole', holeIdx: h, bounces: bounces,
          diagHit: diagHit, bounceIdx: bounceIdx, hitWalls: hitWalls };
    fresh = true;
  }
  return { pts: pts, outcome: 'steps', holeIdx: -1, bounces: bounces,
    diagHit: diagHit, bounceIdx: bounceIdx, hitWalls: hitWalls };
}
/* ---------- 出题配置（章域；ch4 hitNeed=按反弹数动态 min(bounces,2)） ---------- */
const QUIZ_CFG = {
  1: { nAxis: 1, nDiag: 0, nDirs: 2, nHoles: 2, bLo: 1, bHi: 1, hitNeed: 1, diagNeed: false },
  2: { nAxis: 2, nDiag: 0, nDirs: 3, nHoles: 3, bLo: 2, bHi: 2, hitNeed: 2, diagNeed: false },
  3: { nAxis: 2, nDiag: 1, nDirs: 3, nHoles: 3, bLo: 3, bHi: 3, hitNeed: 2, diagNeed: true },
  4: { nAxis: 2, nDiag: 1, nDirs: 3, nHoles: 3, bLo: 1, bHi: 3, hitNeed: 2, diagNeed: false }
};

/* ---------- 墙采样（全部内藏：格点在 1..W-1 × 1..H-1；两两不共点在外层保证） ---------- */
function sampleAxisWall(rnd, W, H) {
  const len = 1 + (rnd() < 0.6 ? 1 : 0);            // 1-2 段（覆盖 2-3 格点）
  if (rnd() < 0.5) {                                // 水平墙
    const y = ri(rnd, 1, H - 1);
    const x1 = ri(rnd, 1, W - 1 - len);
    return { x1: x1, y1: y, x2: x1 + len, y2: y };
  }
  const x = ri(rnd, 1, W - 1);                      // 垂直墙
  const y1 = ri(rnd, 1, H - 1 - len);
  return { x1: x, y1: y1, x2: x, y2: y1 + len };
}
function sampleDiagWall(rnd, W, H) {                // 45° 斜镜面（1-2 段）
  const down = rnd() < 0.5;                         // '\'(x+,y+) 或 '/'(x+,y-)
  const len = 1 + (rnd() < 0.5 ? 1 : 0);
  const x1 = ri(rnd, 1, W - 1 - len);
  const y1 = down ? ri(rnd, 1, H - 1 - len) : ri(rnd, 1 + len, H - 1);
  return { x1: x1, y1: y1, x2: x1 + len, y2: down ? y1 + len : y1 - len };
}

/* ---------- 单题生成（确定性随机搜索）：墙+球+8 向扫描取合规答案方向，
   正确洞放「目标反弹数的射段」上（洞捕获即止 ⇒ 恰 N 段反弹），干扰方向经 §0.39
   唯一命中筛除，干扰洞优先放干扰路径上。
   关键口径：无洞模拟的 bounces=全程反弹数（封闭箱内球持续弹），章级反弹数必须按
   「第 B 次反弹顶点与第 B+1 次之间的射段放洞」来构造——洞放该段 ⇒ 捕获时恰 B 次反弹；
   射段点若在更早路径上出现过（自交）会早捕，须排除。 ---------- */
function genQuiz(dch, rnd) {
  return genQuizWith(dch, rnd, false) || genQuizWith(dch, rnd, true);
}
/* relaxed=true：章形约束全放宽（任意反弹数/内墙命中≥1/2 卡 2 洞），§0.39 不放宽；
   产物标 loose:true（verify 侧视为不达标=响亮信号，理论不可达） */
function genQuizWith(dch, rnd, relaxed) {
  const W = 6, H = 5, C = QUIZ_CFG[dch];
  const nHoles = relaxed ? 2 : (dch === 2 ? 2 + (rnd() < 0.5 ? 1 : 0) : C.nHoles);
  const nDirs = relaxed ? 2 : C.nDirs;
  for (let t = 0; t < 500; t++) {
    /* 墙（两两不共点；relaxed 用 1-2 面轴墙即可成题） */
    const walls = [], wpts = {};
    let bad = false;
    const nAxis = relaxed ? 2 : C.nAxis, nDiag = relaxed ? 0 : C.nDiag;
    for (let i = 0; i < nAxis && !bad; i++) {
      const w = sampleAxisWall(rnd, W, H);
      const ps = wallPoints(w);
      if (ps.some(p => wpts[p[0] + ',' + p[1]])) { bad = true; break; }
      ps.forEach(p => { wpts[p[0] + ',' + p[1]] = true; });
      walls.push(w);
    }
    for (let i = 0; i < nDiag && !bad; i++) {
      const w = sampleDiagWall(rnd, W, H);
      const ps = wallPoints(w);
      if (ps.some(p => wpts[p[0] + ',' + p[1]])) { bad = true; break; }
      ps.forEach(p => { wpts[p[0] + ',' + p[1]] = true; });
      walls.push(w);
    }
    if (bad) continue;
    const occ = buildOcc(walls);
    /* 球起点（内藏非墙点） */
    let ball = null;
    for (let a = 0; a < 24; a++) {
      const bx = ri(rnd, 1, W - 1), by = ri(rnd, 1, H - 1);
      if (!occ[bx + ',' + by]) { ball = { x: bx, y: by }; break; }
    }
    if (!ball) continue;
    /* 答案方向+B：8 向扫描。反弹数域=[bLo, min(bHi, 实际弹数)]（relaxed=[1,8]）；
       前 B 个反弹顶点的内墙命中数+斜墙要求；洞候选=第 B 射段上的内藏非墙非球点
       （排除更早出现过的格点=防自交早捕） */
    const bLo = relaxed ? 1 : C.bLo;
    const bHi = relaxed ? 8 : C.bHi;
    const order = shuffled(DIRS8, rnd);
    let pick = null;
    for (let oi = 0; oi < order.length && !pick; oi++) {
      const d = order[oi];
      const s = simShot(occ, W, H, ball, d, []);
      const bi = s.bounceIdx;
      if (bi.length < bLo) continue;
      const bMax = Math.min(bHi, bi.length);
      for (let B = bLo; B <= bMax; B++) {
        const hitSet = {}; let diagB = false;
        for (let j = 0; j < B; j++) {
          const v = s.pts[bi[j]];
          const o = occ[v[0] + ',' + v[1]];
          if (o) {
            for (let q2 = 0; q2 < o.w.length; q2++) hitSet[o.w[q2]] = true;
            for (let q2 = 0; q2 < o.k.length; q2++)
              if (o.k[q2] === 'D+' || o.k[q2] === 'D-') diagB = true;
          }
        }
        const hits = Object.keys(hitSet).length;
        if (hits < (relaxed ? 1 : (dch === 4 ? Math.min(B, 2) : C.hitNeed))) continue;
        if (!relaxed && C.diagNeed && !diagB) continue;
        const segEnd = bi.length > B ? bi[B] : s.pts.length;   // 第 B+1 次反弹顶点前（排他）
        const seenBefore = {};
        for (let i2 = 0; i2 <= bi[B - 1]; i2++) seenBefore[s.pts[i2][0] + ',' + s.pts[i2][1]] = true;
        const cs = [];
        for (let i2 = bi[B - 1] + 1; i2 < segEnd; i2++) {
          const p = s.pts[i2];
          if (p[0] >= 1 && p[0] <= W - 1 && p[1] >= 1 && p[1] <= H - 1 &&
              !occ[p[0] + ',' + p[1]] && !seenBefore[p[0] + ',' + p[1]] &&
              !(p[0] === ball.x && p[1] === ball.y)) cs.push(p);
        }
        if (!cs.length) continue;
        pick = { d: d, B: B, cs: cs, bvert: s.pts[bi[B - 1]], path: s.pts };
        break;
      }
    }
    if (!pick) continue;
    /* 正确洞：第 B 射段取点（优先离弹点 ≥2 格）；带洞复算恰 B 次反弹（防自交早捕） */
    const pref = pick.cs.filter(p =>
      Math.max(Math.abs(p[0] - pick.bvert[0]), Math.abs(p[1] - pick.bvert[1])) >= 2);
    const pool = pref.length ? pref : pick.cs;
    const hp = pool[Math.floor(rnd() * pool.length)];
    const okHolePos = { x: hp[0], y: hp[1] };
    const chk = simShot(occ, W, H, ball, pick.d, [okHolePos]);
    if (chk.outcome !== 'hole' || chk.bounces !== pick.B) continue;
    /* 干扰方向：不得进正确洞（§0.39 洞唯一命中） */
    const dists = [];
    for (let di = 0; di < DIRS8.length; di++) {
      const d = DIRS8[di];
      if (sameDir(d, pick.d)) continue;
      const s = simShot(occ, W, H, ball, d, [okHolePos]);
      if (s.outcome === 'hole') continue;            // 会进正确洞 → 排除
      dists.push({ d: d, pts: s.pts });
    }
    if (dists.length < nDirs - 1) continue;
    const chosen = shuffled(dists, rnd).slice(0, nDirs - 1);
    /* 干扰洞：优先放干扰路径上（孩子看球入错洞的反馈），不在答案路径上 */
    const ansPts = {};
    pick.path.forEach(p => { ansPts[p[0] + ',' + p[1]] = true; });
    const taken = {};
    taken[okHolePos.x + ',' + okHolePos.y] = true;
    const holes = [okHolePos];
    const dpts = [];
    chosen.forEach(c => c.pts.forEach(p => {
      const k = p[0] + ',' + p[1];
      if (p[0] >= 1 && p[0] <= W - 1 && p[1] >= 1 && p[1] <= H - 1 &&
          !occ[k] && !ansPts[k] && !taken[k] && !(p[0] === ball.x && p[1] === ball.y))
        dpts.push({ x: p[0], y: p[1] });
    }));
    const dsh = shuffled(dpts, rnd);
    for (let i = 0; i < dsh.length && holes.length < nHoles; i++) {
      const k = dsh[i].x + ',' + dsh[i].y;
      if (taken[k]) continue;                       // 多条干扰路径共点：入列环节查重
      taken[k] = true;
      holes.push(dsh[i]);
    }
    let guard2 = 0;                                  // 不足则随机内藏空位补齐
    while (holes.length < nHoles && guard2++ < 60) {
      const x = ri(rnd, 1, W - 1), y = ri(rnd, 1, H - 1), k = x + ',' + y;
      if (occ[k] || ansPts[k] || taken[k] || (x === ball.x && y === ball.y)) continue;
      taken[k] = true;
      holes.push({ x: x, y: y });
    }
    if (holes.length < nHoles) continue;
    /* 终检（§0.39 全量重算）：answer 入正确洞且恰 B 次反弹；干扰可入别洞、禁入正确洞 */
    let okAll = true;
    const finA = simShot(occ, W, H, ball, pick.d, holes);
    if (finA.outcome !== 'hole' || finA.holeIdx !== 0 || finA.bounces !== pick.B) okAll = false;
    for (let i = 0; okAll && i < chosen.length; i++) {
      const s = simShot(occ, W, H, ball, chosen[i].d, holes);
      if (s.outcome === 'hole' && s.holeIdx === 0) okAll = false;
    }
    if (!okAll) continue;
    /* 组装：卡序/洞序随机化 */
    const dirArr = [pick.d].concat(chosen.map(c => c.d));
    const dirs = shuffled(dirArr, rnd);
    let answer = 0;
    for (let i = 0; i < dirs.length; i++) if (sameDir(dirs[i], pick.d)) answer = i;
    const hsh = shuffled(holes, rnd);
    let okHole = 0;
    for (let i = 0; i < hsh.length; i++) if (hsh[i] === okHolePos) okHole = i;
    const quiz = { kind: 'bounce', W: W, H: H,
      ball: { x: ball.x, y: ball.y },
      walls: walls.map(w => ({ x1: w.x1, y1: w.y1, x2: w.x2, y2: w.y2 })),
      holes: hsh.map(h => ({ x: h.x, y: h.y })),
      dirs: dirs.map(d => [d[0], d[1]]),
      answer: answer, okHole: okHole, miss: 0, solved: false };
    if (relaxed) quiz.loose = true;
    return quiz;
  }
  return null;   // 不可达双保险；genLevel 侧跳过 null
}

/* 题签名（同关 5 题互异判据）：台面+球+墙+洞+方向全集 */
function quizSig(q) {
  const w = q.walls.map(x => x.x1 + ',' + x.y1 + ',' + x.x2 + ',' + x.y2).sort();
  const h = q.holes.map(x => x.x + ',' + x.y).sort();
  const d = q.dirs.map(x => x[0] + ',' + x[1]).sort();
  return q.W + 'x' + q.H + ':B' + q.ball.x + ',' + q.ball.y +
    ';W' + w.join('|') + ';H' + h.join('|') + ';D' + d.join('|');
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；同关 5 题互异） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 29);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // §0.3 batch11 M1 定版
  const quizzes = [];
  const seen = {};
  let guard = 0;
  while (quizzes.length < CH_LEN && guard++ < 500) {
    const q = genQuiz(dch, rnd);
    if (!q) continue;
    const sig = quizSig(q);
    if (seen[sig]) continue;                        // 同关互异：撞签名重生成
    seen[sig] = true;
    quizzes.push(q);
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 作答引擎（无 DOM） ---------- */
/* engTapDir(L, i)：点第 i 张方向卡 → 引擎先按 §0.39 反射真值判定：
   'right'|'done'（入正确洞，step 推进）/ 'wrong'（入错洞/出界/步上限，miss 计一次）
   / null（非法：越界下标、已解题、关已结束） */
function engTapDir(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.dirs.length) return null;
  const occ = buildOcc(q.walls);
  const s = simShot(occ, q.W, q.H, q.ball, q.dirs[i], q.holes);
  if (s.outcome !== 'hole' || s.holeIdx !== q.okHole) {
    q.miss++;
    L.retries++;
    return 'wrong';
  }
  q.solved = true;
  L.step++;
  if (L.step >= L.quizzes.length) L.done = true;
  return L.done ? 'done' : 'right';
}
/* 星级：0 错=3★ / 1-2 错=2★ / 更多=1★（错次口径，零惩罚=可无限重点） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 救援/教学"帮"目标（§3）：正确方向卡下标 → {i}；已解题 → null ---------- */
function rescueTarget(q) {
  if (!q || q.solved) return null;
  return { i: q.answer };
}

/* ---------- 结构校验（verify 用）：域/墙形/不共点/洞与球位置（反弹真值由 verify 分源复算） ---------- */
function structOk(q) {
  if (!q || q.kind !== 'bounce') return false;
  if (q.W !== 6 || q.H !== 5) return false;
  if (!q.ball || !Number.isInteger(q.ball.x) || !Number.isInteger(q.ball.y) ||
      q.ball.x < 1 || q.ball.x > q.W - 1 || q.ball.y < 1 || q.ball.y > q.H - 1) return false;
  if (!Array.isArray(q.walls) || q.walls.length < 1 || q.walls.length > 3) return false;
  const occ = {};
  for (let i = 0; i < q.walls.length; i++) {
    const w = q.walls[i];
    if (![w.x1, w.y1, w.x2, w.y2].every(v => Number.isInteger(v))) return false;
    const adx = Math.abs(w.x2 - w.x1), ady = Math.abs(w.y2 - w.y1);
    if (!((w.x2 - w.x1 === 0 && ady >= 1) || (w.y2 - w.y1 === 0 && adx >= 1) ||
          (adx === ady && adx >= 1))) return false;              // 轴对齐或 45°
    for (const p of wallPoints(w)) {
      if (p[0] < 1 || p[0] > q.W - 1 || p[1] < 1 || p[1] > q.H - 1) return false;  // 全内藏
      const k = p[0] + ',' + p[1];
      if (occ[k]) return false;                                  // 墙两两不共点
      occ[k] = true;
    }
  }
  if (occ[q.ball.x + ',' + q.ball.y]) return false;              // 球不在墙上
  if (!Array.isArray(q.holes) || q.holes.length < 2 || q.holes.length > 3) return false;
  const hs = {};
  for (const h of q.holes) {
    if (!Number.isInteger(h.x) || !Number.isInteger(h.y) ||
        h.x < 1 || h.x > q.W - 1 || h.y < 1 || h.y > q.H - 1) return false;
    const k = h.x + ',' + h.y;
    if (occ[k]) return false;                                    // 洞不在墙上
    if (hs[k]) return false;                                     // 洞不重复
    if (h.x === q.ball.x && h.y === q.ball.y) return false;      // 洞不在球点
    hs[k] = true;
  }
  if (!Array.isArray(q.dirs) || q.dirs.length < 2 || q.dirs.length > 3) return false;
  const dseen = {};
  for (const d of q.dirs) {
    if (!DIRS8.some(x => x[0] === d[0] && x[1] === d[1])) return false;   // 8 方向域
    const k = d[0] + ',' + d[1];
    if (dseen[k]) return false;                                  // 方向卡互异
    dseen[k] = true;
  }
  if (!Number.isInteger(q.answer) || q.answer < 0 || q.answer >= q.dirs.length) return false;
  if (!Number.isInteger(q.okHole) || q.okHole < 0 || q.okHole >= q.holes.length) return false;
  return q.miss === 0 && q.solved === false;
}
/* ================= bounce 主逻辑（台面渲染 / 点方向卡放飞 / 逐段飞行 / 教学 / 救援 / 推进）
   玩法（SPEC-BATCH18 §3）：每题=弹球台 SVG+球起点+2-3 张方向卡+墙+洞 2-3 个（1 正确）。
   点方向卡→球沿格点直线飞行，遇墙反弹（动画逐段，轨迹留痕）→入正确洞=bc_right+下一题；
   入错洞/步数上限（8 段反弹）=零惩罚可重点（miss 照计=星级口径）。
   §0.7a 救援钟口径：点方向卡（无论对错）=作答不重置；入正确洞推进=唯一重置；
   空白/兔子不重置。错点防重入窗：飞行期+错后 1000ms 连点只记一次 miss（b16/b17 定案）。
   教学看-帮-独：watch=演示看球弹一段（首段飞行+墙闪）→指正确方向卡→点对入洞
   （返回值存 window.__bcDemoR §0.27，watch ≤16s）→重发同关，"你猜它进哪个洞"交接
   →帮=幽灵手指指正确卡；独=首次答对放手。
   验收钩子：window.BC = { get currentLevel, get quiz(){W,H,ball,holes,walls,dirs,answer,
   phase,step,miss}, tapDir(i), start(flat), async autoSolve(), get tutorial, get rescues }
   轨迹导出：window.__bcTrace = {dir, pts, outcome, holeIdx, bounces}（每次放飞即写全量） */
'use strict';

const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/开场任务语音/教学/反馈不受 flat 门限制（§0.5） */

/* 纠错轻语音：flat<3 每错必播；flat≥3 走 10s 节流；force 豁免恰一次——不灰化款 miss 无上限，
   必须 === 2（豁免只在每题 miss 首达 2 时发一次） */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) {
    lastWrongVoice = now;
    KIDS.voice.play(key, text);
  }
};

const stageEl = $id('stage'), boardEl = $id('board'), fieldEl = $id('field'),
      answersEl = $id('answers'), ghostEl = $id('ghost'),

/* 台面几何：格点阵 7×6（6×5 格当量），U=格距 px，PAD=面板内边距 */
const U = 68, PAD = 24;
const px = v => PAD + v * U;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);

/* ================= 渲染 ================= */
/* 台面 SVG：边界墙矩形+格点阵+内部墙线+洞+起点环+轨迹+救援线+球（全部按格点整数坐标对齐） */
function renderField(q) {
  const s = [];
  s.push('<rect class="bounds" x="' + PAD + '" y="' + PAD + '" width="' + (q.W * U) +
    '" height="' + (q.H * U) + '" rx="12"/>');
  for (let y = 0; y <= q.H; y++)
    for (let x = 0; x <= q.W; x++)
      s.push('<circle class="dot" cx="' + px(x) + '" cy="' + px(y) + '" r="2.6"/>');
  q.walls.forEach(function (w, i) {
    s.push('<line class="wall" data-wi="' + i + '" data-x1="' + w.x1 + '" data-y1="' + w.y1 +
      '" data-x2="' + w.x2 + '" data-y2="' + w.y2 + '" x1="' + px(w.x1) + '" y1="' + px(w.y1) +
      '" x2="' + px(w.x2) + '" y2="' + px(w.y2) + '"/>');
  });
  q.holes.forEach(function (h) {
    s.push('<g class="hole" data-x="' + h.x + '" data-y="' + h.y + '" transform="translate(' +
      px(h.x) + ',' + px(h.y) + ')"><circle class="pit" r="13.5"/><circle class="dark" r="7"/>' +
      '<circle class="ring" r="13.5"/></g>');
  });
  s.push('<circle class="start" cx="' + px(q.ball.x) + '" cy="' + px(q.ball.y) + '" r="15"/>');
  s.push('<polyline id="trail" points=""/>');
  s.push('<line id="rescue-line" x1="0" y1="0" x2="0" y2="0"/>');
  s.push('<g id="ball"><circle class="body" r="11.5"/><circle class="shine" cx="-3.5" cy="-3.5" r="3"/></g>');
  fieldEl.innerHTML = s.join('');
  setBall(q.ball.x, q.ball.y);
}
/* 作答区：提示句 + 方向卡（≥64 实做 ≥96；箭头按 8 方向旋转+文字标签） */

}
function renderStep() {                          // HUD 本关 5 题进度点

/* 开场顺序链（§0.5/§0.6）：hint（或教学交接 turn clip），queue 单通道顺序播（无词 clip） */
function openingSpeak(turn) {
  if (!cur) return;

}
function renderQuiz() {

/* ================= 球动画（逐格点飞行；verify 提速但轨迹数据全量导出） ================= */
function setBall(x, y) {
  const b = ballEl();
  if (b) b.style.transform = 'translate(' + px(x) + 'px,' + px(y) + 'px)';
}
function addTrail(x, y) {
  const t = fieldEl.querySelector('#trail');
  if (!t) return;
  t.setAttribute('points', (t.getAttribute('points') || '') + ' ' + px(x) + ',' + px(y));
}
function clearTrail() {
  const t = fieldEl.querySelector('#trail');
  if (t) t.setAttribute('points', '');
}
/* 弹点反馈：命中的内墙 glow / 边界闪亮（SVG 元素重触发动画用 getBoundingClientRect 促排） */
function glowAt(q, x, y) {
  let wi = -1;
  q.walls.forEach(function (w, i) {
    if (wallPoints(w).some(p => p[0] === x && p[1] === y)) wi = i;
  });
  let el = null;
  if (wi >= 0) el = fieldEl.querySelector('.wall[data-wi="' + wi + '"]');
  else el = fieldEl.querySelector('.bounds');
  if (!el) return;
  el.classList.remove('glow', 'hitflash');
  void el.getBoundingClientRect();
  el.classList.add(wi >= 0 ? 'glow' : 'hitflash');
  setTimeout(function () {
    if (el && el.isConnected) el.classList.remove('glow', 'hitflash');
  }, 460 * SPEED + 80);
}
/* 沿 sim.pts 逐格点飞（upto=只飞前缀，教学演示用；quiet=不播 boing 句） */
async function flyPath(q, sim, upto, quiet) {
  const pts = sim.pts;
  const last = upto == null ? pts.length - 1 : upto;
  const bendMap = {};
  sim.bounceIdx.forEach(function (i) { bendMap[i] = true; });
  let boingDone = false;
  for (let k = 1; k <= last; k++) {
    const diag = pts[k - 1][0] !== pts[k][0] && pts[k - 1][1] !== pts[k][1];
    await wait((diag ? 120 : 85) * SPEED);
    if (!ballEl() || !ballEl().isConnected) return false;
    setBall(pts[k][0], pts[k][1]);
    addTrail(pts[k][0], pts[k][1]);
    if (bendMap[k]) {                             // 到达反弹顶点：墙闪+音+boing 句（每趟首弹一次）
      glowAt(q, pts[k][0], pts[k][1]);
      tickSfx();
      if (!boingDone && !quiet) {
        boingDone = true;
        sayR(VOICE.boing.key, VOICE.boing.text);
      }
      await wait(110 * SPEED);
      if (!ballEl()) return false;
    }
  }
  await wait(130 * SPEED);
  return true;
}
/* 飞行收尾：入洞=洞吞球；步数上限/出界=小球淡出 */
async function flyEnd(sim) {
  await wait(140 * SPEED);
  const b = ballEl();
  if (!b) return;
  if (sim.outcome === 'hole') {
    const e = sim.pts[sim.pts.length - 1];
    const hg = fieldEl.querySelector('.hole[data-x="' + e[0] + '"][data-y="' + e[1] + '"]');
    if (hg) { hg.classList.remove('gulp'); void hg.getBoundingClientRect(); hg.classList.add('gulp'); }
  }
  b.classList.add('gone');
  await wait(380 * SPEED);
}
/* 球回起点（错后零惩罚可重点）：瞬移回起点再显形 */
function resetBall(q) {
  const b = ballEl();
  fieldEl.querySelectorAll('.wrong-x').forEach(function (e) { e.remove(); });   /* 错洞叉随回位清除 */
  if (!b) return;
  b.style.transition = 'none';
  setBall(q.ball.x, q.ball.y);
  void b.getBoundingClientRect();
  b.style.transition = '';
  setTimeout(function () { if (b.isConnected) b.classList.remove('gone'); }, 40);
}
function nudgeCard(i) {
  const el = cardEl(i);
  if (!el) return;
  el.classList.remove('nudge'); void el.offsetWidth; el.classList.add('nudge');
}

/* ================= 放飞主路径（真实点击 / BC 钩子 / autoSolve / 教学演示共用） ================= */
async function uiTapDir(i, demo) {
  if (!cur || state.won) return false;
  if ((state.locked && !demo) || (state.demo && !demo)) {
    if (!demo) { sfx('pop'); nudgeCard(i); }      /* 吞输入+轻叮+卡圈轻闪（§0.22） */
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  const r = engTapDir(cur, i);                    // 引擎真值先行（miss/推进同步落账）
  if (r === null) return false;
  const run = cur;                                // 身份守卫：演出窗口内重玩会重建 cur
  const occ = buildOcc(q.walls);
  const sim = simShot(occ, q.W, q.H, q.ball, q.dirs[i], q.holes);
  window.__bcTrace = {                            // 轨迹全量导出（§10：verify 可断言）
    dir: q.dirs[i].slice(),
    pts: sim.pts.map(p => p.slice()),
    outcome: sim.outcome, holeIdx: sim.holeIdx, bounces: sim.bounces
  };
  state.phase = 'fly';
  state.locked = true;                            // 飞行+错后窗口=防重入（连点只记一次 miss）
  clearRescueVisual();
  clearTrail();
  sfx('click');
  await flyPath(q, sim, null, false);
  await flyEnd(sim);
  if (cur !== run) return r;
  if (r === 'wrong') {                            // 入错洞/出界/步上限：零惩罚可重点
    sfx('fail');
    if (sim.outcome === 'hole') {                 /* 试玩 P1：进错洞语义化——打叉+直说， */
      markWrongHole(sim, q);                      /* 防「球明明进去了呀」的成败语义断裂 */
      KIDS.voice.play('bc_hole', '进错洞啦，换个方向再试试');   /* T46 阶段2：keyless→clip 化（bc_hole 在册） */
    } else {
      sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2);     /* 三态（§0.5） */
    }
    if (q.miss >= 1) showFirstSeg(q);             /* 试玩 P1：梯度脚手架——错 1 次即闪首段虚线 */
    if (q.miss >= 2) applyRescueVisual(q);        /* 连错 2 次全套：正确卡 breathe（§0.7） */
    await wait(1000 * SPEED);                     /* 错点防重入窗收尾（§0 b16/b17 定案 1000ms 口径，禁偏离） */
    if (cur !== run) return r;
    resetBall(q);
    state.locked = false;
    state.phase = 'aim';
    if (state.tut === 'help') pointHelpNext();    /* "帮"：跟着节奏指回正确卡 */
    return r;
  }
  /* ---- 入正确洞：推进（唯一重置救援钟 §0.7a） ---- */
  lastAct = Date.now();
  if (state.tut === 'help') {                     // 教学"独"：首次答对放手
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  sayR(VOICE.right.key, VOICE.right.text);
  sfx('ok');
  await wait(2000 * SPEED);                       // 等 bc_right clip（≈2s）主体播完
  if (cur !== run) return r;
  state.locked = false;
  state.phase = 'aim';
  if (r === 'done') winFlow();
  else {
    renderQuiz();
    if (state.tut === 'help') pointHelpNext();
  }
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关用 GEN 文案（不带"明天："前缀，core 模板自带） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1)  /* 已完成到 lim-1，预告其下一章（§0.4 防跳章） */ });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true, phase: 'aim' };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.bounce && sv.bounce.tutSeen);
  if (VERIFY) { openingSpeak(); return; }        // verify 页恒走开场链（stub 记录供断言）
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  openingSpeak();                                /* 开场任务语音链（§0.5） */
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  answersEl.querySelectorAll('.breathe').forEach(k => k.classList.remove('breathe'));
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向（rescueTarget 同源策略）：正确方向卡 */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  pointGhostAt(cardEl(q.answer));
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独（save.bounce.tutSeen）
   看=演示指球→飞首段看反弹（墙闪+轨迹）→回起点→指正确方向卡→点对入洞（返回值存
   window.__bcDemoR §0.27）→重发同关，"你猜它进哪个洞"交接 →帮=指正确卡；独=放手 ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);       /* 教学开场 sayR 不受 flat 门（§0.6） */
  await wait(700 * SPEED);
  const q = cur.quizzes[0];
  pointGhostAt(ballEl());                        // 看：手指先指小球
  await wait(900 * SPEED);
  await flyDemoSegment(q);                       // 看球弹一段：首段飞行+墙闪，再回起点
  await wait(650 * SPEED);
  pointGhostAt(cardEl(q.answer));                // 指"方向"：正确方向卡
  await wait(750 * SPEED);
  ghost.press();
  await wait(260 * SPEED);
  const demoR = await uiTapDir(q.answer, true);  // demo 通道豁免 locked 门（演示吞输入）
  window.__bcDemoR = demoR;                      /* 演示生效证据（§0.27，verify 断言 'right'） */
  const sv = KIDS._save();                       // 真实页 save 恒非 null；verify 直驱时跳过写档
  if (sv) {
    sv.bounce = sv.bounce || {};
    sv.bounce.tutSeen = true;
    KIDS.store.persist();
  }
  tutorialHandoff();
}
/* 演示首段：飞到第一个反弹顶点（不播 boing 句，避免盖 watch clip） */

window.BC = {

      step: cur.step, retries: cur.retries, done: cur.done, won: state.won, locked: state.locked };

      ball: { x: q.ball.x, y: q.ball.y },
      holes: q.holes.map(h => ({ x: h.x, y: h.y })),
      walls: q.walls.map(w => ({ x1: w.x1, y1: w.y1, x2: w.x2, y2: w.y2 })),
      dirs: q.dirs.map(d => d.slice()),
      answer: q.answer, phase: state.phase, step: cur.step, miss: q.miss,
      okHole: q.okHole, solved: q.solved };                  /* 测试辅助字段（okHole=正确洞下标） */
  },
  tapDir(i) { return uiTapDir(i); },
  start(flat) {                                   /* 测试钩子：跳关（教学演示期拒防打断） */
    if (!cur || state.demo) return false;

  },
  async autoSolve() {                             /* 引擎真值直驱 UI 路径：逐题点正确方向卡 */
    const run = cur;                              /* 身份守卫（审查 m3：winFlow 延迟 proceed 换关即中止） */
    let n = 0, quizzes = 0, ok = true;
    while (cur && cur === run && !cur.done && n++ < 40) {
