<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔编程</title>
<style>
/* ================= 小兔编程 coder2（batch18）=================
   视觉按 SPEC-BATCH18 §1（承家族暖米底）：每题=网格地图（6×6 内，草地棋盘）+
   小兔（含朝向箭头）+胡萝卜目标+可选障碍灌木+指令卡池（前进/左转/右转/重复2次/3次）。
   点指令卡入底部程序序列（虚线槽）；点序列内指令=退回；点「运行」小兔逐格动画执行。
   触摸目标：指令卡/程序槽 ≥64、运行按钮 ≥96 高、底栏按钮 ≥72 高；pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:40px;height:40px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 40px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:9px;overflow:hidden;padding:4px 10px}

/* ---------- 地图（草地棋盘 60px 格；非触摸目标） ---------- */
#map-area{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
#grid{position:relative;display:grid;grid-template-columns:repeat(var(--gw,5),60px);
  grid-auto-rows:60px;border-radius:16px;border:3px solid #4A3B2E;overflow:hidden;
  box-shadow:0 5px 0 rgba(74,59,46,.22);animation:map-in .4s ease both}
@keyframes map-in{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.gcell{position:relative;width:60px;height:60px;background:#EAF2DC;display:flex;
  align-items:center;justify-content:center}
.gcell.alt{background:#DFEDCB}
.gcell.wall{background:#D5E5C2}
.gcell.wall svg{width:44px;height:44px}
.gcell.goal{background:#FBF0D2}
.gcell.goal svg{width:42px;height:42px;animation:carrot-bob 2.2s ease-in-out infinite}
@keyframes carrot-bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
.gcell.goal.win{background:#8FBF7F}
.gcell.goal.win svg{animation:carrot-pop .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes carrot-pop{from{transform:scale(.4)}to{transform:scale(1.25)}}
.gcell.goal.breathe{animation:cell-breathe 1.6s ease-in-out infinite}
@keyframes cell-breathe{0%,100%{box-shadow:inset 0 0 0 3px #E8975A;filter:brightness(1)}
  50%{box-shadow:inset 0 0 0 5px #E8975A;filter:brightness(1.1)}}
/* 小兔：绝对定位逐格移动；箭头在旋转坐标系上方=实际前进方向 */
#bunny{position:absolute;left:0;top:0;width:60px;height:60px;z-index:5;pointer-events:none;
  transition:transform .36s ease}
#bunny-rot{width:100%;height:100%;position:relative;transition:transform .26s ease;
  display:flex;align-items:center;justify-content:center}
#bunny-rot .bunny-body{width:46px;height:46px}
#bunny-rot .bunny-body.bump{animation:body-bump .43s ease}
@keyframes body-bump{0%,100%{transform:scale(1)}30%{transform:scale(1.18) rotate(-6deg)}
  60%{transform:scale(.94) rotate(5deg)}}
#bunny .dir-arrow{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-bottom:11px solid #E8975A;filter:drop-shadow(0 1px 1px rgba(74,59,46,.45))}

/* ---------- 指令卡池 ---------- */
#pool-area{flex:1 1 auto;min-height:130px;width:100%;max-width:1120px;display:flex;
  flex-direction:column;justify-content:center;gap:6px}
#card-pool{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:12px 14px;min-height:84px;padding:8px 10px;border-radius:20px;
  background:#F6ECD9;border:2.5px dashed #D9C5A6}
/* 指令卡：暖色积木卡（rep 块青蓝系区分）；点后 .gone（入程序）；救援/帮 breathe、pulse 三连 */
.card{position:relative;width:76px;height:76px;padding:2px;border-radius:16px;
  border:2.5px solid #4A3B2E;box-shadow:0 4px 0 rgba(74,59,46,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .15s;animation:card-in .4s cubic-bezier(.2,1.5,.4,1) both}
.card:nth-child(2n){animation-delay:.06s}.card:nth-child(3n){animation-delay:.12s}
@keyframes card-in{from{transform:scale(0) rotate(-14deg)}to{transform:scale(1) rotate(0)}}
.card:active{transform:translateY(3px)}
.card .ci{width:30px;height:30px}
.card .ci svg{width:30px;height:30px}
.card.t-rep2 .ci svg,.card.t-rep3 .ci svg{width:28px;height:28px}
.card .ct{font-size:13px;font-weight:800;line-height:1.15;color:#4A3B2E}
.card.t-rep2,.card.t-rep3{border-color:#3E6E8E;box-shadow:0 4px 0 rgba(62,110,142,.35)}
.card.gone{visibility:hidden;pointer-events:none}
.card.breathe{animation:card-breathe 1.6s ease-in-out infinite}
@keyframes card-breathe{0%,100%{transform:scale(1);box-shadow:0 4px 0 rgba(74,59,46,.28)}
  50%{transform:scale(1.12);box-shadow:0 4px 14px rgba(232,151,90,.85)}}
.card.pulse{animation:card-pulse .5s ease 3}
@keyframes card-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22) rotate(6deg)}}

/* ---------- 程序序列条 + 运行按钮 ---------- */
#prog-wrap{flex:0 0 auto;width:100%;max-width:1120px;display:flex;flex-direction:column;
  align-items:center;gap:5px;padding:0 8px}
#tip{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#8A7B6C}
#tip .dot{width:10px;height:10px;border-radius:50%;background:#E8975A;flex:0 0 10px}
#prog-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;
  min-height:104px;padding:2px 6px}
#prog-bar{display:flex;align-items:center;gap:7px;flex:0 0 auto;
  padding:6px 9px;border-radius:18px;background:#F6ECD9;border:2.5px dashed #D9C5A6}
/* 程序槽：虚线空槽（序号）→已排 mini 指令卡（可点退回） */
.pslot{width:64px;height:64px;padding:1px;border-radius:14px;background:#FBF8EF;
  border:2.5px dashed #C9A87C;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;transition:transform .15s}
.pslot .num{font-size:22px;font-weight:800;color:#D9C5A6}
.pslot.full{border-style:solid;border-color:#4A3B2E;box-shadow:0 3px 0 rgba(74,59,46,.25);
  animation:slot-in .3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slot-in{from{transform:scale(.3)}to{transform:scale(1)}}
.pslot.full:active{transform:translateY(3px)}
.pslot .ci{width:24px;height:24px}
.pslot .ci svg{width:24px;height:24px}
.pslot .ct{font-size:11px;font-weight:800;line-height:1.1;color:#4A3B2E}
.pslot.full.t-rep2,.pslot.full.t-rep3{border-color:#3E6E8E}
/* 循环作用域分组（审查 M2）：rep 卡与其后 2 位槽=一个重复组，虚线框可视化「重复哪几张」
   （槽保持 64px 不缩——§0 触摸门 ≥64） */
.pgroup{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:18px;
  border:2.5px dashed #3E6E8E;background:rgba(62,110,142,.10)}
.pslot.breathe{animation:card-breathe 1.6s ease-in-out infinite}
#run-btn{min-width:132px;min-height:96px;padding:0 26px;border-radius:26px;background:#8FBF7F;
  border:3px solid #4A3B2E;box-shadow:0 6px 0 #6FA063;color:#FFF9EE;font-size:32px;font-weight:800;
  letter-spacing:.1em;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s,box-shadow .15s;animation:card-in .38s cubic-bezier(.2,1.5,.4,1) both}
#run-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #6FA063}
#run-btn svg{width:40px;height:40px}
#run-btn.nudge{animation:run-nudge .4s ease}
@keyframes run-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}}
#run-btn.pulse{animation:card-pulse .5s ease 3}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 read/spellen） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：指令卡仍 ≥64；地图格 60 不变（非触摸目标） */
@media (orientation:portrait){
  .card{width:66px;height:66px}
  .card .ct{font-size:12px}
  .card .ci{width:26px;height:26px}
  .card .ci svg{width:26px;height:26px}
  .pslot{width:64px;height:64px}
  #run-btn{min-width:118px;font-size:27px;padding:0 18px}
  #prog-row{gap:9px}
  #pool-area{min-height:118px}
}
</style>
</head>
<body>
<div id="game" aria-label="小兔编程">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="map-area">
      <div id="grid" aria-label="地图，小兔要去胡萝卜那里"></div>
    </div>
    <div id="pool-area">
      <div id="card-pool" aria-label="指令卡池"></div>
    </div>
    <div id="prog-wrap">
      <div id="tip" aria-label="玩法提示"><span class="dot"></span><span>点指令卡排程序，多余的卡可以不放，点「运行」出发</span></div>
      <div id="prog-row">
        <div id="prog-bar" aria-label="程序序列"></div>
        <button id="run-btn" aria-label="运行"></button>
      </div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读一读程序"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

  finger: '<svg viewBox="0 0 64 76" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M28 8 a8 8 0 0 1 16 0 v30 l8 4 a10 10 0 0 1 6 9 v10 a12 12 0 0 1 -12 12 h-12 a14 14 0 0 1 -14 -14 V30 Z" fill="#FFF" opacity=".93" stroke="#E8DCC8" stroke-width="2"/>' +
    '<ellipse cx="35" cy="44" rx="10" ry="6" fill="#F2B8C6" opacity=".35"/></svg>'
};
/* 指令卡图标取用（pool 卡与程序槽共用） */
const instrIcon = t =>
  t === 'f' ? ICONS.fwd : t === 'l' ? ICONS.tl : t === 'r' ? ICONS.tr :
  t === 'rep2' ? ICONS.loop : ICONS.loop;
/* ================= coder2 纯引擎：确定性关卡生成 + 指令执行（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   方向编码 dir：0=上 1=右 2=下 3=左（左转=(dir+3)%4，右转=(dir+1)%4）
   重复块单卡语义（SPEC §1）：repN 是单卡，展开时重复其后紧邻的 min(2, 后继数) 条指令 N 次；
   尾部无后继=空块无操作。展开为基本步序列后逐格执行；§0.37 展开后 ≤24 基本步。
   生成路线（先程序后地图）：按章模板出 REF 指令序列 → 无限网格模拟得相对跨幅 →
   加随机 padding 得 3-6 尺寸地图与起点（路径必在界内，零重试）→ 不在路径上的格
   放障碍（ch3 1-2 / ch4 2-3）→ 池=REF 卡+干扰卡 ≤2（恒 ⊇ REF 多重集 ⇒ 池内必可解 §0.37）。
   数据模型：q._prog[]（池索引紧缩序列，点序列指令=移除后继前移）；q._used[i]=卡已入程序。
   引擎纯算 engRun 返回逐帧轨迹与胜负；engCommitRun 提交 miss/推进（UI 动画层与其对账）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增；难度章号：静态关 (ch-1)%4+1 循环，生成关随机 1-4（§0.3） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 方向向量与移动模拟（生成器与游戏执行共用；verify 侧另立 refSim 分源） ---------- */
const DIRV = [[0, -1], [1, 0], [0, 1], [-1, 0]];
function wallKeySet(q) {
  const s = {};
  for (const w of q.walls) s[w[0] + ',' + w[1]] = 1;
  return s;
}
/* simSteps：从 start 逐步执行基本指令；越界 hit=1 / 撞障碍 hit=2（停在撞前格，末帧 bump 标记）
   path=逐帧轨迹（含起始帧；转向帧与移动帧都记录） */
function simSteps(start, steps, wallSet, W, H) {
  let x = start.x, y = start.y, dir = start.dir;
  const path = [{ x: x, y: y, dir: dir }];
  let hit = 0;
  for (const t of steps) {
    if (t === 'l') dir = (dir + 3) % 4;
    else if (t === 'r') dir = (dir + 1) % 4;
    else {
      const nx = x + DIRV[dir][0], ny = y + DIRV[dir][1];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) { hit = 1; path.push({ x: x, y: y, dir: dir, bump: true }); break; }
      if (wallSet[nx + ',' + ny]) { hit = 2; path.push({ x: x, y: y, dir: dir, bump: true }); break; }
      x = nx; y = ny;
    }
    path.push({ x: x, y: y, dir: dir });
  }
  return { end: { x: x, y: y, dir: dir }, hit: hit, path: path };
}
/* expandProg：程序类型序列 → 基本指令序列（repN 单卡：重复其后 min(2,后继数) 条 N 次，消耗它们） */
function expandProg(prog) {
  const out = [];
  let i = 0;
  while (i < prog.length) {
    const t = prog[i];
    if (t === 'rep2' || t === 'rep3') {
      const n = t === 'rep2' ? 2 : 3;
      const k = Math.min(2, prog.length - 1 - i);
      const body = prog.slice(i + 1, i + 1 + k);
      for (let r = 0; r < n; r++) out.push.apply(out, body);
      i += 1 + k;
    } else { out.push(t); i++; }
  }
  return out;
}

/* ---------- 章模板（先程序后地图的 REF 来源；turn 镜像 + dir 四向 + 随机 padding 出多样性）
   dch1 纯序列：f×a turn f×b，a+b∈[3,4]
   dch2 一个 rep2：A[rep2,f,t] 半方 / B[f,rep2,f,t]
   dch3 一个 rep3：A[rep3,f,t] 四三方 / B[f,rep3,f,t] / C[f,rep2,f,f] 直线（5 格）
   dch4 生成形：A[repN,f,t] / B[f,rep2,t,f] 之字 / C[t,rep3,f,t] 方形圈 ---------- */
function refPattern(dch, rnd) {
  const turn = rnd() < 0.5 ? 'l' : 'r';
  if (dch === 1) {
    const total = ri(rnd, 3, 4);
    const a = ri(rnd, 1, total - 1), b = total - a;
    const ref = [];
    for (let k = 0; k < a; k++) ref.push('f');
    ref.push(turn);
    for (let k = 0; k < b; k++) ref.push('f');
    return ref;
  }
  if (dch === 2) {
    return ri(rnd, 0, 1) === 0 ? ['rep2', 'f', turn] : ['f', 'rep2', 'f', turn];
  }
  if (dch === 3) {
    /* ch3 恒 rep3（SPEC §1：重复 3 次）——直线型 (f f)×3 跨 7 格超 6×6 地图，不入模板 */
    return ri(rnd, 0, 1) === 0 ? ['rep3', 'f', turn] : ['f', 'rep3', 'f', turn];
  }
  const v = ri(rnd, 0, 2);
  if (v === 0) return [ri(rnd, 0, 1) === 0 ? 'rep2' : 'rep3', 'f', turn];
  if (v === 1) return ['f', 'rep2', turn, 'f'];
  return [turn, 'rep3', 'f', turn];
}

/* ---------- 干扰指令（≤2，SPEC §0.37）：类型不在 REF 内的候选拦洗牌取 n 个
   ch1=1（对面转向卡）/ ch2=1 / ch3=2 / ch4=2；池恒 ⊇ REF ⇒ 池内可解性不受干扰影响 ---------- */
function pickDistracts(dch, rnd, ref) {
  const n = (dch <= 2) ? 1 : 2;
  const inRef = {};
  ref.forEach(t => { inRef[t] = 1; });
  const cands = [];
  if (!inRef.f) cands.push('f');
  if (!inRef.l) cands.push('l');
  if (!inRef.r) cands.push('r');
  if (dch >= 2 && !inRef.rep2) cands.push('rep2');
  if (dch >= 2 && !inRef.rep3) cands.push('rep3');
  if (!cands.length) return [];
  return shuffled(cands, rnd).slice(0, Math.min(n, cands.length));
}

/* ---------- 单题生成（确定性；span 定位保证路径在界内，零重试路径） ---------- */
function genQuiz(dch, rnd) {
  const ref = refPattern(dch, rnd);
  const dir = ri(rnd, 0, 3);
  const steps = expandProg(ref);
  /* 无限网格模拟：相对坐标极值 + 途经格集合 */
  let x = 0, y = 0, d = dir, minX = 0, maxX = 0, minY = 0, maxY = 0;
  const relCells = { '0,0': 1 };
  for (const t of steps) {
    if (t === 'l') d = (d + 3) % 4;
    else if (t === 'r') d = (d + 1) % 4;
    else {
      x += DIRV[d][0]; y += DIRV[d][1];
      relCells[x + ',' + y] = 1;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  const spanW = maxX - minX + 1, spanH = maxY - minY + 1;
  const maxPadW = Math.max(0, Math.floor((6 - spanW) / 2)), maxPadH = Math.max(0, Math.floor((6 - spanH) / 2));
  const padL = ri(rnd, 0, maxPadW), padR = ri(rnd, 0, maxPadW);
  const padT = ri(rnd, 0, maxPadH), padB = ri(rnd, 0, maxPadH);
  const W = Math.max(3, spanW + padL + padR), H = Math.max(3, spanH + padT + padB);
  const extraL = W - (spanW + padL + padR), extraT = H - (spanH + padT + padB);
  const start = { x: -minX + padL + extraL, y: -minY + padT + extraT, dir: dir };
  const goal = { x: start.x + x, y: start.y + y };
  /* 路径格集合（平移到真实坐标；start/goal 恒在集合内 ⇒ 障碍避让完整路径） */
  const pathSet = {};
  Object.keys(relCells).forEach(k => {
    const p = k.split(',');
    pathSet[(Number(p[0]) + start.x) + ',' + (Number(p[1]) + start.y)] = 1;
  });
  const nWalls = dch === 1 ? 0 : dch === 2 ? 0 : dch === 3 ? ri(rnd, 1, 2) : ri(rnd, 2, 3);
  const cands = [];
  for (let wy = 0; wy < H; wy++) for (let wx = 0; wx < W; wx++) {
    if (!pathSet[wx + ',' + wy]) cands.push([wx, wy]);
  }
  const walls = shuffled(cands, rnd).slice(0, Math.min(nWalls, cands.length));
  const pool = shuffled(ref.concat(pickDistracts(dch, rnd, ref)), rnd)
    .map(t => ({ t: t }));
  return { kind: 'coder2', W: W, H: H, start: start, goal: goal, walls: walls,
    pool: pool, slots: pool.length, ref: ref,
    _prog: [], _used: pool.map(function () { return false; }),
    miss: 0, solved: false };
}

/* ---------- 手解安全网模板（genLevel 极端防御；verify 侧 REF_FALLBACKS 双写对账） ---------- */
const FALLBACKS = {
  1: { W: 4, H: 3, start: { x: 0, y: 1, dir: 1 }, goal: { x: 2, y: 2 }, walls: [], ref: ['f', 'f', 'r', 'f'] },
  2: { W: 4, H: 4, start: { x: 1, y: 2, dir: 0 }, goal: { x: 0, y: 1 }, walls: [], ref: ['rep2', 'f', 'l'] },
  3: { W: 4, H: 4, start: { x: 2, y: 1, dir: 3 }, goal: { x: 2, y: 2 }, walls: [[0, 0], [3, 0]], ref: ['rep3', 'f', 'l'] },
  4: { W: 5, H: 5, start: { x: 1, y: 1, dir: 1 }, goal: { x: 1, y: 0 }, walls: [[3, 3], [0, 3], [4, 1]], ref: ['f', 'rep2', 'l', 'f'] }
};
function fallbackQuiz(dch) {
  const f = FALLBACKS[dch] || FALLBACKS[1];
  const pool = f.ref.concat(pickDistracts(dch, { next: function () { return 0.9; } }, f.ref))
    .map(t => ({ t: t }));
  return { kind: 'coder2', W: f.W, H: f.H, start: { x: f.start.x, y: f.start.y, dir: f.start.dir },
    goal: { x: f.goal.x, y: f.goal.y },
    walls: f.walls.map(w => [w[0], w[1]]), pool: pool, slots: pool.length, ref: f.ref.slice(),
    _prog: [], _used: pool.map(function () { return false; }), miss: 0, solved: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；同关 5 题签名互异）
   sig 不含 W/H：地图尺寸差不参与路径=玩法同构（b18 复验实锤 flat2 同构题），按体验互异从严 ---------- */
const sigOf = q => [q.start.x, q.start.y, q.start.dir, q.goal.x, q.goal.y,
  q.walls.map(w => w.join(':')).sort().join('|'), q.pool.map(c => c.t).sort().join('')].join(',');
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);
  const quizzes = [], sigs = {};
  let guard = 0;
  while (quizzes.length < CH_LEN && guard++ < 120) {
    const q = genQuiz(dch, rnd);
    const sig = sigOf(q);
    if (sigs[sig]) continue;
    sigs[sig] = 1;
    quizzes.push(q);
  }
  while (quizzes.length < CH_LEN) quizzes.push(fallbackQuiz(dch));   // 不可达防御
  return { flat: flat, ch: ch, dch: dch, lv: lv, quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 指令编排引擎（无 DOM）：点池卡入程序 / 点程序卡退回 ---------- */
/* engTapPool(L,i)：点池中第 i 张卡 → 追加到程序序列末尾；返回 'placed'，
   非法（越界/已用/关已结束/嵌套循环）→ null。放卡=探索不计 miss 不重置救援钟（§0.7a）
   嵌套拦截（审查 F2）：rep 卡的前 1-2 位存在 rep 卡=将落入其重复作用域——
   展开（重复其后 min(2,后继) 条）会让内层 rep 被当作前进执行，卡面语义失真，
   故放置期直接阻止（玩家排不出嵌套程序，expandProg 恒见平坦序列） */
function engTapPool(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (typeof i !== 'number' || Math.floor(i) !== i || i < 0 || i >= q.pool.length) return null;
  if (q._used[i]) return null;
  if (q._prog.length >= q.slots) return null;
  const t = q.pool[i].t;
  if (t === 'rep2' || t === 'rep3') {
    const n = q._prog.length;
    for (let k = n - 1; k >= n - 2 && k >= 0; k--) {
      const pt = q.pool[q._prog[k]].t;
      if (pt === 'rep2' || pt === 'rep3') return null;
    }
  }
  q._used[i] = true;
  q._prog.push(i);
  return 'placed';
}
/* engTapProg(L,j)：点程序序列第 j 指令=退回池（后继前移紧缩）→ 返回新程序长度；
   非法下标/空位 → null。退回=探索不计 miss 不重置救援钟（§0.7a） */
function engTapProg(L, j) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (typeof j !== 'number' || Math.floor(j) !== j || j < 0 || j >= q._prog.length) return null;
  q._used[q._prog[j]] = false;
  q._prog.splice(j, 1);
  return q._prog.length;
}
/* 空闲池中第一个类型 t 的卡（教学演示/帮/救援/autoSolve 共用） */
function freePoolFor(q, t) {
  for (let i = 0; i < q.pool.length; i++) if (!q._used[i] && q.pool[i].t === t) return i;
  return -1;
}
/* engRun(L)：纯算执行当前程序 → {types,steps,frames,end,hit,win}（UI 逐帧动画对账用）；
   空程序/已解题/关尾 → null */
function engRun(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved || q._prog.length === 0) return null;
  const types = q._prog.map(i => q.pool[i].t);
  const steps = expandProg(types);
  const sim = simSteps(q.start, steps, wallKeySet(q), q.W, q.H);
  const win = sim.hit === 0 && sim.end.x === q.goal.x && sim.end.y === q.goal.y;
  return { types: types, steps: steps, frames: sim.path, end: sim.end, hit: sim.hit, win: win };
}
/* engCommitRun(L,plan)：提交运行结果。win → solved+推进，返回 'right'/'done'；
   未达（含撞墙/出界）→ miss/retries 各 +1 返回 'wall'/'short'（错次口径 §1：运行未达=1 错） */
function engCommitRun(L, plan) {
  const q = L.quizzes[L.step];
  if (plan.win) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  q.miss++;
  L.retries++;
  return plan.hit > 0 ? 'wall' : 'short';
}
/* 星级：0 错=3★ / 1-2 错=2★ / 更多=1★（运行未达口径，退回不计，永不 0 星） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 救援/教学"帮"目标（§1：目标格 breathe+首条应放指令卡 pulse 的目标计算）
   程序序列与 REF 逐位比对：首个不一致处之前已一致——
   该位有错卡 → {act:'undo', j}（先退回）；空 → {act:'prog', i}（点应放的池卡）；
   程序已是 REF 前缀 → {act:'run'}（指运行按钮）；已解题 → null。
   池 ⊇ REF 多重集 ⇒ 所需卡必有空闲（数学保证，见注释收敛性） ---------- */
function rescueTarget(q) {
  if (!q || q.solved) return null;
  const cur = q._prog.map(i => q.pool[i].t);
  for (let j = 0; j < q.ref.length; j++) {
    if (j >= cur.length) {
      const i = freePoolFor(q, q.ref[j]);
      if (i >= 0) return { act: 'prog', i: i, j: j };
      return { act: 'undo', j: cur.length - 1 };
    }
    if (cur[j] !== q.ref[j]) return { act: 'undo', j: j };
  }
  /* REF 前缀一致但尾长超出（审查 M1）：多余尾卡会让运行多走必 miss——先退回尾卡 */
  if (cur.length > q.ref.length) return { act: 'undo', j: cur.length - 1 };
  return { act: 'run' };
}

/* ---------- 结构校验（verify 用）：地图域+池约束（可解性由 verify 侧 refSim 分源复算） ---------- */
function structOk(q) {
  if (!q || q.kind !== 'coder2') return false;
  if (!(q.W >= 3 && q.W <= 6 && q.H >= 3 && q.H <= 6)) return false;
  const inB = p => p.x >= 0 && p.y >= 0 && p.x < q.W && p.y < q.H;
  if (!inB(q.start) || !inB(q.goal)) return false;
  if (q.start.dir == null || Math.floor(q.start.dir) !== q.start.dir || q.start.dir < 0 || q.start.dir > 3) return false;
  if (q.start.x === q.goal.x && q.start.y === q.goal.y) return false;
  if (!Array.isArray(q.walls) || q.walls.some(w => !inB({ x: w[0], y: w[1] }))) return false;
  if (q.walls.some(w => (w[0] === q.start.x && w[1] === q.start.y) ||
                        (w[0] === q.goal.x && w[1] === q.goal.y))) return false;
  if (!Array.isArray(q.pool) || q.pool.some(c => !INSTR_TEXT[c.t])) return false;
  if (q.slots !== q.pool.length) return false;
  return true;
}
/* ================= coder2 主逻辑（地图渲染 / 点卡编排与退回 / 运行动画 / 教学 / 救援 / 推进）
   玩法（SPEC-BATCH18 §1）：每题=网格地图+小兔（含朝向）+胡萝卜目标（+可选障碍格）+
   指令卡池。点卡入底部程序序列；点序列内指令=退回（紧缩，后继前移）；点「运行」
   小兔逐格动画执行——到达=cd2_right+下一题；撞障碍/出界=cd2_wall、未到=cd2_wrong（三态），
   小兔回起点零惩罚可改程序。
   救援钟口径（§0.7a）：点卡/退回=探索不重置；运行到达推进/读程序重置；失败/空白/兔子不重置。
   教学看-帮-独：watch=演示看地图→排指令→运行到达（返回值存 window.__cd2DemoR §0.27）；
   帮=幽灵手指指向下一步（rescueTarget 同源）；独=首次运行到达放手。
   验收钩子：window.CD2 = { get currentLevel, get quiz(){W,H,start,goal,walls,pool,prog,runState,
   step,miss}, tapPool(i), tapProg(i), run(), start(flat), async autoSolve(), get tutorial,
   get rescues }（getter 拷贝非活引用） */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/开场任务语音/教学/反馈不受 flat 门限制（§0.5） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音：flat<3 每错必播；flat≥3 走 10s 节流；force 豁免恰一次（miss===2） */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) {
    lastWrongVoice = now;
    KIDS.voice.play(key, text);
  }
};
/* 指令词朗读（T46 阶段2 2026-09-19：cd2_i_<t> 5 键全在册——静态域 clip 化，
   play 带原文=缺 clip 防御性 TTS 兜底；原 §1「TTS 豁免」口径由 Task#46 红线取代） */
const sayInstr = t => KIDS.voice.play('cd2_i_' + t, INSTR_TEXT[t]);

const CELL = 60;                               // 地图格边长（px，与 head.html .gcell 严格一致；非触摸目标）
const STEP_MS = 430, TURN_MS = 340;            // 运行动画：前进/转向帧时长（×SPEED）
const stageEl = $id('stage'), gridEl = $id('grid'), poolAreaEl = $id('pool-area'),
      cardPoolEl = $id('card-pool'), progBarEl = $id('prog-bar'), runBtnEl = $id('run-btn'),
      answersEl = $id('answers'), ghostEl = $id('ghost'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none' };
let runState = 'idle';                          // 'idle'|'running'|'win'|'fail'（SPEC 钩子）
let lastAct = Date.now();
let lastBlankHint = 0;                          // 点空白/探索区轻提示节流（§0.16，10s）
let helpTimer = null, helpRedemo = false;
let rescueCount = 0;                            // 救援触发计数（CD2.rescues）

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const cardEl = i => cardPoolEl.querySelector('.card[data-i="' + i + '"]');
const progSlotEl = j => progBarEl.querySelector('.pslot[data-j="' + j + '"]');
const goalCellEl = () => gridEl.querySelector('.gcell.goal');
const cellAt = (x, y) => gridEl.querySelector('.gcell[data-k="' + x + ',' + y + '"]');

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  runBtnEl.innerHTML = ICONS.play;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.speakerSmall;

  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：放卡=双音上扬 / 退回=低柔单音（轻反馈不惩罚） */
const cardHi = () => { if (!VERIFY) { KIDS.audio.note(760, 0.09, 0, 0.5); KIDS.audio.note(950, 0.12, 0.07, 0.4); } };
const takeLo = () => { if (!VERIFY) KIDS.audio.note(520, 0.09, 0, 0.3); };

/* ================= 渲染 ================= */
/* 地图：W×H 草地格（棋盘双色）+障碍格灌木+目标格胡萝卜+绝对定位小兔（含朝向） */
function renderGrid(q) {
  gridEl.innerHTML = '';
  gridEl.style.setProperty('--gw', q.W);
  gridEl.style.setProperty('--gh', q.H);
  const wallSet = wallKeySet(q);
  for (let y = 0; y < q.H; y++) for (let x = 0; x < q.W; x++) {
    const c = document.createElement('div');
    c.className = 'gcell' + ((x + y) % 2 ? ' alt' : '');
    c.dataset.k = x + ',' + y;
    if (wallSet[x + ',' + y]) { c.classList.add('wall'); c.innerHTML = ICONS.bush; }
    if (x === q.goal.x && y === q.goal.y) { c.classList.add('goal'); c.innerHTML = ICONS.carrot; }
    gridEl.appendChild(c);
  }
  const b = document.createElement('div');
  b.id = 'bunny';
  b.setAttribute('aria-label', '小兔');
  b.innerHTML = '<div id="bunny-rot"><div class="dir-arrow" aria-hidden="true"></div>' +
    '<div class="bunny-body">' + KIDS.assets.rabbit('normal', 46) + '</div></div>';
  gridEl.appendChild(b);
  bunnyHome();
}
/* 小兔归位起点朝向（渲染/失败回退共用） */
function bunnyHome() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  moveBunny({ x: q.start.x, y: q.start.y, dir: q.start.dir });
}
function moveBunny(f) {
  const b = $id('bunny'), r = $id('bunny-rot');
  if (!b || !r) return;
  b.style.transform = 'translate(' + (f.x * CELL) + 'px,' + (f.y * CELL) + 'px)';
  r.style.transform = 'rotate(' + (f.dir * 90) + 'deg)';
}
function bumpAnim() {
  const b = gridEl.querySelector('.bunny-body');
  if (!b) return;
  b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
}
/* 指令卡池：data-t=类型；点后 .gone（入程序）；救援/帮 breathe、pulse 三连 */
function renderPool(q) {
  cardPoolEl.innerHTML = '';
  q.pool.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'card t-' + c.t;
    b.dataset.i = i;
    b.dataset.t = c.t;
    b.style.background = CARD_PALETTE[c.t];
    b.setAttribute('aria-label', '指令卡 ' + INSTR_TEXT[c.t]);
    b.innerHTML = '<span class="ci">' + instrIcon(c.t) + '</span><span class="ct">' +
      INSTR_TEXT[c.t] + '</span>';
    cardPoolEl.appendChild(b);
  });
}
/* 程序序列条：slots=池大小个槽（虚线）；已排卡显示 mini 指令（可点退回）。
   循环作用域分组（审查 M2）：rep 卡与其后 2 位槽包进 .pgroup 虚线框——
   「重复的是框里这几张」视觉锚点（与展开语义 min(2,后继) 对齐，REF 模板作用域恒 2 张） */
function renderProg(q) {
  progBarEl.innerHTML = '';
  const mkSlot = j => {
    const b = document.createElement('button');
    const t = j < q._prog.length ? q.pool[q._prog[j]].t : null;
    b.className = 'pslot' + (t ? ' full t-' + t : '');
    b.dataset.j = j;
    if (t) b.style.background = CARD_PALETTE[t];
    b.setAttribute('aria-label', t ? '第' + (j + 1) + '条指令 ' + INSTR_TEXT[t] + '，点一点放回去' : '第' + (j + 1) + '条，空');
    b.innerHTML = t ? '<span class="ci">' + instrIcon(t) + '</span><span class="ct">' + INSTR_TEXT[t] + '</span>'
                    : '<span class="num">' + (j + 1) + '</span>';
    return b;
  };
  let j = 0;
  while (j < q.slots) {
    const t = j < q._prog.length ? q.pool[q._prog[j]].t : null;
    if (t === 'rep2' || t === 'rep3') {
      const grp = document.createElement('span');
      grp.className = 'pgroup';
      grp.appendChild(mkSlot(j));
      if (j + 1 < q.slots) grp.appendChild(mkSlot(j + 1));   /* 作用域后 2 位（含空槽=「往框里放」暗示） */
      if (j + 2 < q.slots) grp.appendChild(mkSlot(j + 2));
      progBarEl.appendChild(grp);
      j += 3;
    } else {
      progBarEl.appendChild(mkSlot(j));
      j++;
    }
  }
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
/* 开场顺序链（§0.5/§0.6）：hint（或教学交接 turn）单段 queue 单通道 */
function openingSpeak(turn) {
  KIDS.voice.queue([turn ? VOICE.turn.key : VOICE.hint.key]);
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  clearRescueVisual();
  runState = 'idle';
  renderGrid(q);
  renderPool(q);
  renderProg(q);
  renderStep();
}

/* ================= 点卡主路径（真实点击 / CD2 钩子 / autoSolve / 教学演示共用） ================= */
/* uiTapPool(i, demo)：点池中第 i 张卡 → 追加程序末槽 + 指令词朗读（cd2_i_ clip，T46）；
   demo=true 仅 tutorialWatch 演示通道（豁免 locked 门） */
function uiTapPool(i, demo) {
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) {
    if (!demo) sfx('pop');                        /* §0.22 吞输入轻叮（审查 m4，对齐家族口径） */
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  const t = q.pool[i] && q.pool[i].t;
  const r = engTapPool(cur, i);
  if (r === null) {
    /* 嵌套拦截（审查 F2）：rep 卡前 1-2 位有 rep=落重复作用域——专属提示非静默 */
    if ((t === 'rep2' || t === 'rep3') && q._prog.length) {
      const n = q._prog.length;
      for (let k = n - 1; k >= n - 2 && k >= 0; k--) {
        const pt = q.pool[q._prog[k]].t;
        if (pt === 'rep2' || pt === 'rep3') {
          sfx('pop');
          KIDS.voice.play('cd2_loop', '循环块里不放循环块哦');   /* T46 clip 化（cd2_loop 在册） */
          return false;
        }
      }
    }
    return false;
  }
  cardHi();
  const el = cardEl(i);
  if (el) el.classList.add('gone');
  renderProg(q);                                  /* 全量重排（分组框随新卡即时归位，审查 M2） */
  sayInstr(q.pool[i].t);                         // 指令词=cd2_i_ clip（T46 阶段2）
  if (state.tut === 'help') scheduleHelpGhost(350);
  return 'placed';
}
/* uiTapProg(j)：点程序第 j 指令=退回池（后继前移紧缩）；空槽/非法下标 false。
   退回=探索零惩罚（§0.7a） */
function uiTapProg(j) {
  if (!cur || state.locked || state.won || state.demo) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  if (typeof j !== 'number' || j < 0 || j >= q._prog.length) return false;
  const ti = q._prog[j];                         // 退回前留档池卡索引
  const r = engTapProg(cur, j);
  if (r === null) return false;
  takeLo();
  const el = cardEl(ti);
  if (el) el.classList.remove('gone');           // 池卡复活（避免全池重渲染闪烁）
  renderProg(q);                                 // 程序条紧缩重排
  if (state.tut === 'help') scheduleHelpGhost(350);
  return r;
}

/* ================= 运行主路径（engRun 纯算对账 + 逐帧动画） ================= */
/* uiRun(demo)：点「运行」→ 展开程序逐帧执行（前进 STEP_MS/转向 TURN_MS/撞停 bump）；
   到达=cd2_right+推进；撞障碍出界=cd2_wall、未到=cd2_wrong（sayW 三态）+回起点零惩罚；
   失败防重入窗 1000ms（§0.26 b16 定案 b17 M1 实锤，禁偏离）；身份守卫 const run=cur */
async function uiRun(demo) {
  if (!cur || state.won) return false;
  if ((state.locked && !demo) || (state.demo && !demo)) { if (!demo) sfx('pop'); return false; }
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  if (q._prog.length === 0) {                    // 空程序：轻拍提示不计数
    sfx('pop');
    runBtnEl.classList.remove('nudge'); void runBtnEl.offsetWidth; runBtnEl.classList.add('nudge');
    return false;
  }
  const run = cur;                               // 身份守卫：演出窗口内重玩会重建 cur
  const plan = engRun(cur);
  if (!plan) return false;
  state.locked = true;
  runState = 'running';
  clearRescueVisual();
  sayR(VOICE.run.key, VOICE.run.text);           // 出发喽
  await wait(500 * SPEED);
  if (cur !== run) return false;
  q._trace = [{ x: plan.frames[0].x, y: plan.frames[0].y, dir: plan.frames[0].dir }];
  for (let k = 1; k < plan.frames.length; k++) {
    const f = plan.frames[k];
    moveBunny(f);
    q._trace.push({ x: f.x, y: f.y, dir: f.dir });
    if (f.bump) {                                // 撞障碍/出界：撞停反馈
      bumpAnim();
      await wait(430 * SPEED);
    } else if (f.x === plan.frames[k - 1].x && f.y === plan.frames[k - 1].y) {
      await wait(TURN_MS * SPEED);               // 原地转向帧（位置不变）
    } else {
      await wait(STEP_MS * SPEED);               // 前进帧
    }
    if (cur !== run) return false;
  }
  const res = engCommitRun(cur, plan);
  if (plan.win) {                                // 到达：反馈+推进（点对重置救援钟 §0.7a）
    runState = 'win';
    lastAct = Date.now();
    if (state.tut === 'help') {                  // 教学"独"：首次运行到达放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    const g = goalCellEl();
    if (g) { g.classList.add('win'); }
    sfx('ok');
    sayR(VOICE.right.key, VOICE.right.text);
    await wait(2100 * SPEED);                    // 等 cd2_right（≈1.8s）主体播完
    if (cur !== run) return res;
    state.locked = false;
    if (res === 'done') winFlow();
    else renderQuiz();
    return res;
  }
  /* 失败：撞墙/出界专属句；未到=wrong 三态；miss 已计入；连错 2 次给视觉线索（§0.7） */
  runState = 'fail';
  sfx('fail');
  if (plan.hit > 0) sayR(VOICE.wall.key, VOICE.wall.text);
  else sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2);
  if (q.miss >= 2) applyRescueVisual(q);
  if (state.tut === 'help') scheduleHelpGhost(400);
  await wait(1000 * SPEED);                      /* 错点防重入窗 1000ms（b16 定案） */
  if (cur !== run) return res;
  bunnyHome();                                   // 小兔回起点（零惩罚，程序保留可改）
  await wait(480 * SPEED);
  if (cur !== run) return res;
  runState = 'idle';
  state.locked = false;
  return res;
}

/* ================= 读程序（主动学习重置救援钟 §0.7a）：逐条朗读已排指令 ================= */
function uiHear() {
  if (!cur) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  lastAct = Date.now();
  hearBtn.classList.remove('bounce'); void hearBtn.offsetWidth; hearBtn.classList.add('bounce');
  if (q._prog.length) {
    /* 读程序（T46 阶段2）：cd2_i_* 段链全在册 → queue 拼播（零 keyless 段，Mj-1 满足）；
       缺段整句 TTS 兜底（shop-math playChain 家族先例；本任务后段链恒在册=防御死分支） */
    const ks = q._prog.map(i => 'cd2_i_' + q.pool[i].t);
    if (ks.every(k => KIDS.voice.clips[k])) KIDS.voice.queue(ks);
    else KIDS.voice.say(q._prog.map(i => INSTR_TEXT[q.pool[i].t]).join('，'));
  } else {
    sayR(VOICE.hint.key, VOICE.hint.text);
  }
  return true;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关用 GEN 文案（不带"明天："前缀，core 模板自带） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  clearTimeout(helpTimer);
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1)  /* 已完成到 lim-1，预告其下一章（§0.4 防跳章） */ });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  clearTimeout(helpTimer);
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none' };
  runState = 'idle';
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.coder2 && sv.coder2.tutSeen);
  if (VERIFY) { openingSpeak(); return; }        // verify 页恒走开场链（stub 记录供断言）
  if (freshTut) { tutorialWatch(); return; }
  openingSpeak();
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  /* 指新目标前清旧 breathe/pulse（numberdet P1-3：逐位引导不清除会叠亮失效） */
  clearRescueVisual();
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向（rescueTarget 同源策略）：先退错卡→再点应放池卡→齐了指运行 */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const t = rescueTarget(q);
  if (!t) return;
  if (t.act === 'prog') pointGhostAt(cardEl(t.i));
  else if (t.act === 'undo') pointGhostAt(progSlotEl(t.j));
  else pointGhostAt(runBtnEl);
}
function scheduleHelpGhost(delay) {
  clearTimeout(helpTimer);
  helpTimer = setTimeout(() => {
    if (state.tut !== 'help' || state.won || state.locked || VERIFY) return;
    pointHelpNext();
  }, delay == null ? 700 : delay);
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独（save.coder2.tutSeen）
   看=演示看地图（目标格 breathe）→排指令（前 2 张完整手指演示，其余快放控时长）
   →幽灵手指点「运行」→运行到达（demo 通道，返回值存 window.__cd2DemoR §0.27）
   →立即重发同关（确定性关卡，题面一致），"你来排一排"交接 →帮=指向下一步；独=放手 ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);       /* 教学开场 sayR 不受 flat 门（§0.6） */
  await wait(700 * SPEED);
  const q = cur.quizzes[0];
  const g = goalCellEl();

async function runVerify() {

  /* ---- verify 侧独立复算实现（SPEC §0.37 分源：递归展开 + 方位名称制模拟，

  function refExpand(prog) {
    function take(i) {
      if (i >= prog.length) return [];
      const t = prog[i];
      if (t !== 'rep2' && t !== 'rep3') return [t].concat(take(i + 1));
      const n = (t === 'rep2') ? 2 : 3;
      const k = Math.min(2, prog.length - 1 - i);
      const body = prog.slice(i + 1, i + 1 + k);
      let seq = [];
      for (let r = 0; r < n; r++) seq = seq.concat(body);

    }

  }

  const V_MOVE = { up: [0, -1], right: [1, 0], down: [0, 1], left: [-1, 0] };
  function refSim(q, prog) {
    let cx = q.start.x, cy = q.start.y, face = V_NAME[q.start.dir];
    const blocked = {};
    for (const w of q.walls) blocked[w[0] + '/' + w[1]] = true;
    const path = [{ x: cx, y: cy, dir: q.start.dir }];
    for (const t of refExpand(prog)) {
      const fi = V_NAME.indexOf(face);
      if (t === 'l') face = V_NAME[(fi + 3) % 4];
      else if (t === 'r') face = V_NAME[(fi + 1) % 4];
      else {
        const nx = cx + V_MOVE[face][0], ny = cy + V_MOVE[face][1];
        if (nx < 0 || ny < 0 || nx >= q.W || ny >= q.H) return { hit: 1, x: cx, y: cy, win: false, path: path };
        if (blocked[nx + '/' + ny]) return { hit: 2, x: cx, y: cy, win: false, path: path };
        cx = nx; cy = ny;
      }
      path.push({ x: cx, y: cy, dir: V_NAME.indexOf(face) });

  const REF_FALLBACKS = {

    2: { W: 4, H: 4, start: [1, 2, 0], goal: [0, 1], walls: [], ref: ['rep2', 'f', 'l'] },
    3: { W: 4, H: 4, start: [2, 1, 3], goal: [2, 2], walls: [[0, 0], [3, 0]], ref: ['rep3', 'f', 'l'] },
    4: { W: 5, H: 5, start: [1, 1, 1], goal: [1, 0], walls: [[3, 3], [0, 3], [4, 1]], ref: ['f', 'rep2', 'l', 'f'] }

  function vFreeIdx(q, t) {
    for (let i = 0; i < q.pool.length; i++) if (!q._used[i] && q.pool[i].t === t) return i;
    return -1;
  }
  function vDistrIdx(q) {

  function vSolveRef(L, q) {

  /* 章约束分源复算（SPEC §1 题型定稿） */
  function refChapOk(dch, q) {
    const r = q.ref;
    const cnt = t => r.filter(x => x === t).length;
    const nf = r.filter(x => x === 'f').length;
    if (dch === 1) {
      if (cnt('rep2') || cnt('rep3')) return false;                    // ch1 无循环
      if (nf < 3 || nf > 4 || cnt('l') + cnt('r') !== 1) return false; // 3-4 步直角路径

      if (q.walls.length !== 0) return false;
    } else if (dch === 3) {
      if (cnt('rep3') !== 1 || cnt('rep2')) return false;              // ch3 恰 1 个 rep3
      if (q.walls.length < 1 || q.walls.length > 2) return false;      // +障碍 1-2

      if (q.walls.length < 2 || q.walls.length > 3) return false;      // +障碍 2-3
      const rp = r.findIndex(t => t === 'rep2' || t === 'rep3');
      const k = Math.min(2, r.length - 1 - rp);

    const need = {}, have = {};
    r.forEach(t => { need[t] = (need[t] || 0) + 1; });
    q.pool.forEach(c => { have[c.t] = (have[c.t] || 0) + 1; });

  function fallbackDualityOk() {

      const a = FALLBACKS[d], b = REF_FALLBACKS[d];
      if (!a || !b) return false;
      if (a.W !== b.W || a.H !== b.H) return false;
      if (a.start.x !== b.start[0] || a.start.y !== b.start[1] || a.start.dir !== b.start[2]) return false;
      if (a.goal.x !== b.goal[0] || a.goal.y !== b.goal[1]) return false;
      if (a.walls.length !== b.walls.length ||

      if (a.ref.length !== b.ref.length || a.ref.some((t, i) => t !== b.ref[i])) return false;

  const fbOk = fallbackDualityOk();

    if (L1.dch < 1 || L1.dch > 4) rangeAll = false;

      if (refExpand(q.ref).length > 24) rangeAll = false;                // 展开后 ≤24 基本步
      const sig = sigOf(q);                                              // 同关 5 题签名互异
      if (seen[sig]) rangeAll = false;
      seen[sig] = 1;
      /* 障碍不在 REF 路径上（独立途经格复算；start/goal 恒在路径上） */
      const onPath = {};
      sim.path.forEach(p => { onPath[p.x + ',' + p.y] = 1; });
      if (q.walls.some(w => onPath[w[0] + ',' + w[1]])) rangeAll = false;
      /* 池全点展开上限（§0.37 防死循环口径） */
      if (refExpand(q.pool.map(c => c.t)).length > 24) rangeAll = false;
    }
    if (!fbOk) structAll = false;                                        // 安全网双写并入结构档

    /* ①b 引擎直驱 */
    const Ld = genLevel(flat);
    if (engTapPool(Ld, -1) !== null || engTapPool(Ld, 99) !== null) driveOk = false;   // 非法下标
    if (engTapProg(Ld, 0) !== null) driveOk = false;                    // 空程序退回=拒绝
    if (engRun(Ld) !== null) driveOk = false;                           // 空程序运行=拒绝
    for (let k = 0; k < Ld.quizzes.length && driveOk; k++) {
      const q = Ld.quizzes[k];
      const base = Ld.retries;
      const di = vDistrIdx(q);
      if (di < 0) { driveOk = false; break; }
      if (engTapPool(Ld, di) === null) { driveOk = false; break; }
      if (engTapPool(Ld, di) !== null) { driveOk = false; break; }      // 已用卡再点=拒绝
      const p1 = engRun(Ld);
      if (!p1 || p1.win) { driveOk = false; break; }                    // 干扰单卡程序必未达
      const r1 = engCommitRun(Ld, p1);
      if (r1 !== 'short' && r1 !== 'wall') { driveOk = false; break; }
      if (q.miss !== 1 || Ld.retries !== base + 1) { driveOk = false; break; }   // 运行未达=1 错
      if (engRun(Ld) === null) { driveOk = false; break; }              // 程序保留可再运行
      engCommitRun(Ld, engRun(Ld));
      if (q.miss !== 2 || Ld.retries !== base + 2) { driveOk = false; break; }
      if (engTapProg(Ld, 0) !== 0) { driveOk = false; break; }          // 退回（程序空）
      if (q.miss !== 2 || Ld.retries !== base + 2) { driveOk = false; break; }   // 退回=探索零计数
      vSolveRef(Ld, q);                                                 // 排 REF 运行
      const p2 = engRun(Ld);
      if (!p2 || !p2.win) { driveOk = false; break; }
      if (engCommitRun(Ld, p2) !== (k === Ld.quizzes.length - 1 ? 'done' : 'right')) { driveOk = false; break; }
      if (Ld.step !== k + 1) { driveOk = false; break; }
    }
    if (Ld.done !== true) driveOk = false;                              // 5 题全解=关完成
    /* ①b-2 嵌套拦截（审查 F2）：rep 卡前 1-2 位有 rep=放置拒绝（玩家排不出嵌套程序） */
    const Ln = genLevel(flat);
    {
      const q = Ln.quizzes[0];
      const reps = q.pool.map((c, idx) => (c.t === 'rep2' || c.t === 'rep3') ? idx : -1).filter(i => i >= 0);
      if (reps.length >= 2) {                                           // ch2+ 池恒有 rep+另一 rep 干扰
        if (engTapPool(Ln, reps[0]) !== 'placed') driveOk = false;
        if (engTapPool(Ln, reps[1]) !== null) driveOk = false;          // 紧随 rep=落作用域，必拒
        if (q._prog.length !== 1) driveOk = false;
        if (engTapProg(Ln, 0) !== 0) driveOk = false;                   // 清场
        if (engTapPool(Ln, reps[0]) !== 'placed') driveOk = false;
        const basic = q.pool.findIndex((c, idx) => !q._used[idx] && c.t === 'f');
        if (basic >= 0 && engTapPool(Ln, basic) !== 'placed') driveOk = false;
        if (engTapPool(Ln, reps[1]) !== null) driveOk = false;          // 隔 1 张基本卡仍=作用域内，必拒
      }
    }
    /* ①b-3 救援前缀+尾卡（审查 M1）：REF 排满后再补干扰卡 → rescueTarget 指退回非运行 */
    const Lr2 = genLevel(flat);
    {
      const q = Lr2.quizzes[0];
      vSolveRef(Lr2, q);
      if (q._prog.length === q.ref.length) {                            // REF 已满
        const di = vDistrIdx(q);
        if (di >= 0) {
          engTapPool(Lr2, di);                                           // 尾巴多一张
          const rt = rescueTarget(q);
          if (!rt || rt.act !== 'undo' || rt.j !== q._prog.length - 1) driveOk = false;
          engTapProg(Lr2, q._prog.length - 1);                           // 清尾
          const rt2 = rescueTarget(q);
          if (!rt2 || rt2.act !== 'run') driveOk = false;               // 清尾后恢复指运行
        }
      }
    }
    /* 星级三档独立驱动（3/1/0 错 → 1★/2★/3★） */
    const La = genLevel(flat);
    const qa = La.quizzes[0];
    let ga = 0;
    while (qa.miss < 3 && ga++ < 12) {                                  // 首题连错 3 次
      const di = vDistrIdx(qa);
      if (di < 0) break;
      engTapPool(La, di);
      engCommitRun(La, engRun(La));
      engTapProg(La, 0);
    }
    let g2 = 0;
    while (!La.done && g2++ < 30) { vSolveRef(La, La.quizzes[La.step]); engCommitRun(La, engRun(La)); }
    const s1 = La.done && La.retries === 3 && engStars(La) === 1;
    const Lb = genLevel(flat);
    const qb = Lb.quizzes[0];
    const db = vDistrIdx(qb);
    if (db >= 0) { engTapPool(Lb, db); engCommitRun(Lb, engRun(Lb)); engTapProg(Lb, 0); }  // 仅首题错一次
    let g3 = 0;
    while (!Lb.done && g3++ < 30) { vSolveRef(Lb, Lb.quizzes[Lb.step]); engCommitRun(Lb, engRun(Lb)); }
    const s2 = Lb.done && Lb.retries === 1 && engStars(Lb) === 2;
    const Lc = genLevel(flat);
    let g4 = 0;
    while (!Lc.done && g4++ < 30) { vSolveRef(Lc, Lc.quizzes[Lc.step]); engCommitRun(Lc, engRun(Lc)); }
    const s3 = Lc.done && Lc.retries === 0 && engStars(Lc) === 3;
    if (!s1 || !s2 || !s3) driveOk = false;

    /* ①c 救援目标闭环：干扰程序起步 → rescueTarget 步进 → 收敛（act=run 时独立复算到达） */
    const Lr = genLevel(flat);
    const qr = Lr.quizzes[0];
    const dr = vDistrIdx(qr);
    if (dr >= 0) engTapPool(Lr, dr);
    let chainOk = true, steps = 0;
    while (!qr.solved && steps++ < 40) {
      const t = rescueTarget(qr);
      if (!t) { chainOk = false; break; }
      if (t.act === 'prog') {
        if (engTapPool(Lr, t.i) === null) { chainOk = false; break; }
      } else if (t.act === 'undo') {
        if (engTapProg(Lr, t.j) === null) { chainOk = false; break; }
      } else {                                                          // act=run：程序=REF 前缀
        const types = qr._prog.map(i => qr.pool[i].t);
        if (!refSim(qr, types).win) { chainOk = false; break; }         // 独立模拟器复算到达
        engCommitRun(Lr, engRun(Lr));
        break;
      }
    }
    if (!qr.solved) chainOk = false;
    if (rescueTarget(qr) !== null) chainOk = false;                     // 已解题无救援目标
    rescueOk = chainOk;

    const ok = det && rangeAll && structAll && driveOk && rescueOk;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, rangeAll: rangeAll,
      structAll: structAll, driveOk: driveOk, rescueOk: rescueOk,
      stars: { many1: engStars(La), wrong1: engStars(Lb), clean: engStars(Lc) },
      qs: L1.quizzes.map(q => q.W + 'x' + q.H + '[' + q.ref.join('') + ']' +
        (q.walls.length ? '{' + q.walls.map(w => w.join(':')).join(';') + '}' : '')) };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② tapPool/tapProg 单元（flat0 真实 UI）：入槽/退回 DOM 同步 + 非法下标 ---- */
  total++;
  startLevel(0);
  const q0 = cur.quizzes[0];
  let domOk = true;
  const seq = [];
  for (let k = 0; k < 2; k++) {                                          // 排 REF 前 2 张
    const i = vFreeIdx(q0, q0.ref[k]);
    seq.push(i);
    const r = await CD2.tapPool(i);
    if (r !== 'placed') domOk = false;
    const qz = CD2.quiz;
    if (qz.prog[k] !== q0.ref[k] || qz.prog.filter(x => x !== null).length !== k + 1) domOk = false;
    const cEl = cardEl(i);
    if (!cEl || !cEl.classList.contains('gone')) domOk = false;         // 池卡 .gone
    const pEl = progSlotEl(k);
    if (!pEl || !pEl.classList.contains('full') || pEl.dataset.j !== String(k)) domOk = false;  // 槽 .full
  }
  if (CD2.tapProg(0) !== 1) domOk = false;                              // 退回首条（后继前移）
  const c0 = cardEl(seq[0]);
  if (c0 && c0.classList.contains('gone')) domOk = false;               // 首卡复活
  const p0 = progSlotEl(0);

  if (CD2.tapProg(0) !== 0) domOk = false;                              // 退回末条（程序空）
  const badIdx = (await CD2.tapPool(-1)) === false && (await CD2.tapPool(99)) === false &&
    CD2.tapProg(-1) === false && CD2.tapProg(99) === false;             // 非法下标
  const emptyOk = (await CD2.run()) === false;                          // 空程序运行=拒绝（轻提示不计数）
  const reUse = (await CD2.tapPool(seq[0])) === 'placed' &&
    (await CD2.tapPool(seq[0])) === false;                              // 已用卡再点=拒绝
  startLevel(0);                                                        // 重发还原 DOM
  const selfOk = domOk && badIdx && emptyOk && reUse;
  if (selfOk) npass++;
  units.tapPool = { ok: selfOk, domOk: domOk, badIdx: badIdx, emptyOk: emptyOk, reUse: reUse,
    ref: q0.ref.join(''), slots: q0.slots };

  /* ---- ②b sayW 三态（flat<3 每错必播 / flat≥3 10s 节流 / miss===2 force 豁免恰一次） ---- */
  total++;
  const wLog = [];
