<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子的游戏屋 · 一二年级的新游戏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FBF3E4;color:#4A3B2E;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:34px 22px}
  .logo{width:150px;height:150px}
  h1{font-size:clamp(26px,5vw,38px);letter-spacing:.05em}
  .ageband{display:inline-flex;align-items:center;gap:8px;background:#6E9BD8;color:#fff;font-size:16px;font-weight:700;
           padding:7px 18px;border-radius:999px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px;width:100%;max-width:760px}
  a.card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 24px;border-radius:26px;
         background:#FFF9EE;border:2.5px solid #4A3B2E;text-decoration:none;color:#4A3B2E;
         box-shadow:0 5px 0 #D8C9B4;transition:transform .2s}
  a.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
  @media (hover:hover){
    a.card:hover{transform:translateY(-4px);box-shadow:0 9px 0 #D8C9B4}
  }
  .card .icon{width:92px;height:92px}
  .card .name{font-size:22px;font-weight:700}
  .card .desc{font-size:14px;color:#8A7B6C;line-height:1.6;text-align:center}
  .foot{font-size:12.5px;color:#8A7B6C;text-align:center;line-height:1.8;max-width:520px}
</style>
</head>
<body>
  <div class="logo" id="logo"></div>
  <h1>小兔子的游戏屋 · 一二年级的新游戏</h1>
  <div class="ageband">★ 7-8 岁 · 一二年级 ★</div>
  <div class="grid">
    <a class="card" href="coder2/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#4A3B2E" stroke-width="1.4">
          <rect x="10" y="16" width="56" height="56" rx="6" fill="#FFF9EE" stroke-width="2.5"/>
          <path d="M10 30 h56 M10 44 h56 M10 58 h56 M24 16 v56 M38 16 v56 M52 16 v56" stroke="#EADFCB" stroke-width="1.2"/>
        </g>
        <rect x="14" y="18" width="20" height="12" fill="#8FBF7F" stroke="#4A3B2E" stroke-width="2"/>
        <rect x="48" y="60" width="16" height="12" fill="#F5C445" stroke="#4A3B2E" stroke-width="2"/>
        <path d="M14 26 h8 v14 h14 v14 h14 v14 h10" fill="none" stroke="#E0503C" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
        <g font-family="system-ui,sans-serif" font-weight="700" font-size="12" text-anchor="middle">
          <rect x="72" y="16" width="20" height="16" rx="4" fill="#6E9BD8" stroke="#4A3B2E" stroke-width="2"/><text x="82" y="28" fill="#fff">↑</text>
          <rect x="72" y="38" width="20" height="16" rx="4" fill="#6E9BD8" stroke="#4A3B2E" stroke-width="2"/><text x="82" y="50" fill="#fff">↰</text>
          <rect x="70" y="60" width="24" height="16" rx="4" fill="#E8975A" stroke="#4A3B2E" stroke-width="2"/><text x="82" y="72" fill="#fff" font-size="10">×2</text>
        </g>
      </svg></div>
      <div class="name">循环指令</div>
      <div class="desc">排好指令卡<br>让小兔走到胡萝卜</div>
    </a>
    <a class="card" href="stack/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 88 h80" stroke="#4A3B2E" stroke-width="3" stroke-linecap="round"/>
        <g stroke="#4A3B2E" stroke-width="2">
          <rect x="24" y="70" width="48" height="14" rx="3" fill="#6E9BD8"/>
          <rect x="30" y="56" width="36" height="14" rx="3" fill="#8FBF7F"/>
          <rect x="34" y="42" width="28" height="14" rx="3" fill="#F5C445"/>
          <rect x="38" y="28" width="20" height="14" rx="3" fill="#E8975A"/>
        </g>
        <path d="M62 12 q4 -5 8 0 q4 5 8 0" fill="none" stroke="#8A7B6C" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M74 16 l4 3 -4 3" fill="none" stroke="#8A7B6C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg></div>
      <div class="name">搭高楼</div>
      <div class="desc">对整齐才不会倒<br>小心风吹歪楼</div>
    </a>
    <a class="card" href="bounce/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="14" width="80" height="64" rx="6" fill="#FFF9EE" stroke="#4A3B2E" stroke-width="2.5"/>
        <path d="M10 46 h80" stroke="#8A7B6C" stroke-width="2.4"/>
        <path d="M46 78 l24 -24" stroke="#C9A87C" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="22" cy="28" r="7" fill="#E8975A" stroke="#4A3B2E" stroke-width="2"/>
        <circle cx="36" cy="64" r="6.5" fill="none" stroke="#4A3B2E" stroke-width="2.4"/>
        <circle cx="66" cy="30" r="6.5" fill="none" stroke="#C9A87C" stroke-width="2.2" stroke-dasharray="3 3"/>
        <path d="M24 38 q10 8 4 20 q-2 6 4 4" fill="none" stroke="#E0503C" stroke-width="2.6" stroke-dasharray="1 5.5" stroke-linecap="round"/>
        <path d="M30 30 l8 4 -8 4" fill="none" stroke="#E0503C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg></div>
      <div class="name">弹球角度</div>
      <div class="desc">想一想球会怎么弹<br>指对方向进洞洞</div>
    </a>
  </div>
    <p class="foot">每天有新关卡，玩完今天的小兔子会说"明天见"。<br>每款游戏右上角 🔒 家长面板：进度 / 时长 / 今日多玩关数。<br>完全离线，无广告无内购，进度保存在本机。</p>
