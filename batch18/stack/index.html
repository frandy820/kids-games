<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>搭高楼</title>
<style>
/* ================= 搭高楼 stack（batch18）=================
   视觉按 SPEC-BATCH18 §2：暖米底 #FBF3E4、正视角楼层块塔（rect+顶高光条伪立体）、
   石色地基+列虚线（与底部列按钮带呼应）、托盘显示待放块序列（当前块橙框）
   风摆块：红色风箭头 + sway 往返动画（预判启蒙锚点）
   触摸目标：列按钮 ≥72×76、底栏按钮 ≥72 高；pointerdown 即响应；倒塌零惩罚可重点 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;overflow:hidden;padding:4px 10px}

/* ---------- 题面行 ---------- */
#board{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  min-height:70px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:14px;padding:6px 24px;border-radius:22px;
  background:#FFFAF0;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #DFCFB6}
#prompt-chip .mini{width:54px;height:54px;flex:0 0 54px}
#prompt-chip .ask{font-size:26px;font-weight:800;color:#4A3B2E;letter-spacing:.02em}

/* ---------- 塔区（SVG 自动 contain 适配） ---------- */
#scene-area{flex:1 1 auto;min-height:200px;width:100%;max-width:900px;display:flex;
  align-items:center;justify-content:center;padding:2px 6px}
#scene{width:100%;height:100%;min-height:200px;display:flex;align-items:center;justify-content:center}
#scene svg.scene{width:100%;height:100%}

/* 塔区动画（§0.13 transition 坑：动画只挂一次性 class，重放靠重绘） */
.blk.drop{animation:st-drop .38s cubic-bezier(.35,1.1,.45,1) both}
@keyframes st-drop{from{transform:translateY(-150px)}60%{transform:translateY(0)}
  75%{transform:translateY(-7px)}100%{transform:translateY(0)}}
.blk.fallout{animation:st-fallout .85s ease-in forwards}
@keyframes st-fallout{to{transform:translate(var(--fx,60px),210px) rotate(var(--fr,38deg));opacity:.08}}
.tower.tshake{animation:st-shake .55s ease}
@keyframes st-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.curwrap.sway{animation:st-sway 1.3s ease-in-out infinite}
@keyframes st-sway{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--sw,8px))}}
.base.lit{animation:st-basepulse 1.2s ease-in-out infinite}
@keyframes st-basepulse{0%,100%{opacity:1}50%{opacity:.55}}
.tower .badge{animation:st-badge .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes st-badge{from{transform:scale(0)}to{transform:scale(1)}}

/* ---------- 列按钮带（点格子列放置） ---------- */
#colbar{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:8px;
  flex-wrap:nowrap;min-height:96px;padding:4px 8px}
.colbtn{min-width:72px;min-height:76px;border-radius:16px;background:#FFFAF0;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;transition:transform .15s,box-shadow .15s;position:relative;
  animation:col-in .38s cubic-bezier(.2,1.5,.4,1) both}
.colbtn:nth-child(2){animation-delay:.04s}.colbtn:nth-child(3){animation-delay:.08s}
.colbtn:nth-child(4){animation-delay:.12s}.colbtn:nth-child(5){animation-delay:.16s}
.colbtn:nth-child(6){animation-delay:.2s}.colbtn:nth-child(7){animation-delay:.24s}
@keyframes col-in{from{transform:scale(0)}to{transform:scale(1)}}
.colbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
.colbtn .cell{width:42px;height:14px;border-radius:4px;background:#E7D8C0;border:2px solid #4A3B2E}
.colbtn .cn{font-size:15px;font-weight:800;color:#8A7B6C}
.colbtn.breathe{animation:col-breathe 1.6s ease-in-out infinite}
@keyframes col-breathe{0%,100%{transform:scale(1);box-shadow:0 4px 0 #DFCFB6}
  50%{transform:scale(1.09);box-shadow:0 4px 0 #DFCFB6,0 0 16px rgba(232,151,90,.9)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 blocks/read） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：题面/列带/塔区适配 */
@media (orientation:portrait){
  #prompt-chip .ask{font-size:22px}
  #prompt-chip .mini{width:46px;height:46px;flex:0 0 46px}
  #scene-area{min-height:240px}
  .colbtn{min-width:64px;min-height:72px}
  #colbar{gap:6px}
}
</style>
</head>
<body>
<div id="game" aria-label="搭高楼">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
    </div>
    <div id="scene-area">
      <div id="scene" aria-label="高楼塔区"></div>
    </div>
    <div id="colbar" aria-label="放置列"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

const colCx = c => GEO.left + c * GEO.cell;

/* 楼层块（rect+顶高光条伪立体；cls=动画类） */
function blockRect(cx, w, y, color, cls) {

/* 风箭头（dir=1 右 / -1 左；起点 (x,y)） */

/* ---------- 塔区 SVG（q=引擎题模型；opts：fallout+fallCol=倒塌 / drop=最新块落位动画
   / done=塔立打勾 / litBase=地基高亮（教学）
   返回 svg 字符串；楼块数=q.placed.length、托盘块数=q.floors.length ---------- */
function sceneSvg(q, opts) {
  opts = opts || {};

  let s = '';

  s += '<g class="base' + (opts.litBase ? ' lit' : '') + '">' +
    '<rect x="' + (bc - GRID.baseW * 20) + '" y="' + GEO.ground + '" width="' + (GRID.baseW * 40) +
    '" height="' + GEO.baseH + '" rx="9" fill="' + BASE_FILL + '" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<rect x="' + (bc - GRID.baseW * 20 + 6) + '" y="' + (GEO.ground + 5) + '" width="' + (GRID.baseW * 40 - 12) +
    '" height="6" rx="3" fill="#FFF" opacity=".22"/></g>';
  /* 7 条列虚线（地基下延到塔区底，与列按钮带呼应） */
  for (let c = 0; c < GRID.cols; c++)
    s += '<line x1="' + colCx(c) + '" y1="' + (GEO.ground + GEO.baseH) + '" x2="' + colCx(c) +
      '" y2="' + (GEO.vbH - 6) + '" stroke="' + GROUND_LINE + '" stroke-width="2" stroke-dasharray="4 6" opacity=".8"/>';
  /* 塔身（已放楼层；倒塌时塔身 shake） */
  let tower = '';
  q.placed.forEach((p, i) => {
    const f = q.floors[i];
    const isLast = i === q.placed.length - 1;
    tower += blockRect(colCx(p.col + f.wind), f.w, GEO.ground - (i + 1) * GEO.lh, COLORS[f.ci],
      opts.drop && isLast ? 'drop' : '');
  });
  if (opts.done) {                                          /* 塔立：塔顶打勾角标 */
    const ty = GEO.ground - q.placed.length * GEO.lh - 26;
    tower += '<g class="badge"><circle cx="' + bc + '" cy="' + ty + '" r="17" fill="#8FBF7F" stroke="#FFFAF0" stroke-width="3"/>' +
      '<path d="M' + (bc - 8) + ',' + ty + ' L' + (bc - 2) + ',' + (ty + 7) + ' L' + (bc + 9) + ',' + (ty - 7) +
      '" stroke="#FFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>';
  }
  s += '<g class="tower' + (opts.fallout ? ' tshake' : '') + '">' + tower + '</g>';
  /* 倒塌块：画在尝试落点（col+wind 中心，塔顶+1 层位），向偏移方向翻滚散落 */
  if (opts.fallout && !q.solved && q.floors[q.step]) {
    const f = q.floors[q.step];
    const offDir = (opts.fallCol + f.wind - (q.placed.length ? q.placed[q.placed.length - 1].col +
      q.floors[q.placed.length - 1].wind : GRID.baseC)) || f.wind || 1;
    const fx = offDir > 0 ? 70 : -70, fr = offDir > 0 ? 42 : -42;
    const cx = colCx(opts.fallCol + f.wind);
    const y = GEO.ground - (q.placed.length + 1) * GEO.lh;
    s += '<g class="blk fallout" style="--fx:' + fx + 'px;--fr:' + fr + 'deg">' +
      '<rect x="' + (cx - f.w * 20) + '" y="' + y + '" width="' + (f.w * GEO.cell) + '" height="' + GEO.lh +
      '" rx="6" fill="' + COLORS[f.ci] + '" stroke="' + INK + '" stroke-width="2.5"/></g>';
  }
  /* 当前块（悬停塔上方中央；风摆块 sway+大红箭头；solved/倒塌期不画） */
  if (!q.solved && !opts.fallout && q.floors[q.step]) {
    const f = q.floors[q.step];
    s += '<g class="curwrap' + (f.wind ? ' sway' : '') + '"' + (f.wind ? ' style="--sw:' + (f.wind * 8) + 'px"' : '') + '>' +
      blockRect(colCx(GRID.baseC), f.w, GEO.curY, COLORS[f.ci], '') +
      (f.wind ? windArrowSvg(colCx(GRID.baseC) + (f.wind > 0 ? f.w * 20 + 16 : -f.w * 20 - 16),
        GEO.curY + GEO.lh / 2, f.wind) : '') + '</g>';
  }
  /* 托盘（待放块序列小图：已放淡化、当前橙框、风摆块小红箭头） */
  let tw = 0;
  q.floors.forEach(f => { tw += f.w * 11 + 8; });
  tw -= 8;
  let tx = bc - tw / 2;
  q.floors.forEach((f, i) => {
    const bw = f.w * 11;
    s += '<rect class="trayb" x="' + tx + '" y="12" width="' + bw + '" height="22" rx="4" fill="' + COLORS[f.ci] +
      '" stroke="' + (i === q.step ? '#E8873A' : INK) + '" stroke-width="' + (i === q.step ? 3 : 1.6) +
      '" opacity="' + (i < q.step ? '.32' : '1') + '"/>';
    if (f.wind) {
      const ax = f.wind > 0 ? tx + bw - 11 : tx + 11;
      s += '<path d="M' + (ax - (f.wind > 0 ? 5 : -5)) + ',23 h10 l-3,-3 m3,3 l-3,3" stroke="' + WIND_RED +
        '" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    tx += bw + 8;
  });
  return '<svg class="scene" viewBox="' + GEO.vbX + ' 0 ' + GEO.vbW + ' ' + GEO.vbH +
    '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + s + '</svg>';
}

/* ================= stack 纯引擎：确定性关卡生成 + 堆叠平衡判定 + 稳定解求解（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   平衡模型（SPEC-BATCH18 §0.38/§2，简化确定性）：
   - 每层偏移 off = (col + wind) - 下层实际中心（格单位；首层下层=地基中心列 baseC）
   - 层稳定：|off| ≤ max(0, 下层半宽 - 当前块半宽) + 0.5（安全裕度）
     （clamp 0：下层更窄时=必须对齐才能放——"宽的放窄的要放正"题型语义；
       无 clamp 则下窄上宽任何放置全倒，ch2 该型不可玩）
   - 累积稳定：|Σ各层 off| ≤ 地基半宽 2.5（每放一层即时判定 → 越叠越险）
   - 全对齐路径（每块 off=0）恒满足两条件 → 每题稳定解存在性平凡成立；
     ch4 生成关另要求稳定解数 ≥2（解不唯一，countSols 截断计数）
   风摆块：放置实际中心 = col + wind（wind ±1），孩子须点反向列抵消（预判启蒙）
   章型：
     dch1 单列堆 3-4 块（宽度非增自 4 起，对齐宽容）
     dch2 块宽渐变（下宽上窄=非增 / 下窄上宽=非降，均含至少一处严格变化）
     dch3 含 1 个风摆块（4 块，wind 块不在首层）
     dch4 生成关 5-6 块 + 2 个风摆块，稳定解 ≥2
     dch2/3/4 首题（qi0）=dch1 型热身（SPEC §0 家族先例）
   同关相邻题楼层序列 sig 互异
   判定：engPlace(L, col) —— 'placed'/'win'（推进）/ 'fall'（misses 计一次，倒塌零惩罚从当前层重搭）/ null
   solveSeq：从当前部分塔续解（列序中心向外，优先对齐贴近孩子直觉）；verify 侧 refSolve 分源复算 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
const pick = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];
/* 进度章号单调递增；难度章号：静态关 (ch-1)%4+1 循环，生成关随机 1-4（§0.3） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 平衡判定（引擎唯一真值源；verify 侧 refLayerOk/refCumOk 分源独立实现） ---------- */
const layerOk = (off, wLower, wUpper) =>
  Math.abs(off) <= Math.max(0, wLower / 2 - wUpper / 2) + GRID.margin;
const cumOk = sum => Math.abs(sum) <= GRID.baseW / 2;
const cumSum = q => q.placed.reduce((s, p) => s + p.off, 0);
const lowC = (q, i) => i === 0 ? GRID.baseC : q.placed[i - 1].col + q.floors[i - 1].wind;
const lowW = (q, i) => i === 0 ? GRID.baseW : q.floors[i - 1].w;

/* 楼层序列 sig（同关相邻题互异对账） */
const sig = q => q.floors.map(f => '' + f.w + (f.wind > 0 ? '+' : f.wind < 0 ? '-' : '0')).join('');

/* ---------- 稳定解求解：从 q 当前部分塔续解（DFS；列序中心向外优先对齐）
   返回剩余块的放置列数组，或 null（无解） ---------- */
function solveSeq(q) {
  const res = [];
  const ORDER = [3, 2, 4, 1, 5, 0, 6];
  const lc0 = q.placed.length ? q.placed[q.placed.length - 1].col + q.floors[q.placed.length - 1].wind : GRID.baseC;
  function dfs(i, lc, sum) {
    if (i >= q.floors.length) return true;
    const f = q.floors[i], lw = lowW(q, i);
    for (let k = 0; k < ORDER.length; k++) {
      const col = ORDER[k];
      const off = col + f.wind - lc;
      if (!layerOk(off, lw, f.w)) continue;
      if (!cumOk(sum + off)) continue;
      res.push(col);
      if (dfs(i + 1, col + f.wind, sum + off)) return true;
      res.pop();
    }
    return false;
  }
  return dfs(q.step, lc0, cumSum(q)) ? res : null;
}
/* 稳定解计数（cap 截断；ch4 生成用"解不唯一"断言） */
function countSols(q, cap) {
  let n = 0;
  const total = q.floors.length;
  function dfs(i, lc, sum) {
    if (n >= cap) return;
    if (i >= total) { n++; return; }
    const f = q.floors[i], lw = lowW(q, i);
    for (let col = 0; col < GRID.cols; col++) {
      const off = col + f.wind - lc;
      if (!layerOk(off, lw, f.w)) continue;
      if (!cumOk(sum + off)) continue;
      dfs(i + 1, col + f.wind, sum + off);
      if (n >= cap) return;
    }
  }
  dfs(0, GRID.baseC, 0);
  return n;
}

/* ---------- 生成器 ---------- */
/* 楼层块工厂：宽度数组 + wind 指定 → floors（ci 轮转 4 色相邻互异） */
function mkFloors(rnd, ws, winds) {
  const start = ri(rnd, 0, 3);
  return ws.map((w, i) => ({ w: w, ci: (start + i) % 4, wind: (winds && winds[i]) || 0 }));
}
function mkQuiz(ws, winds, rnd) {
  const floors = mkFloors(rnd, ws, winds);
  const q = { floors: floors, placed: [], step: 0, miss: 0, solved: false, warm: false };
  return q;
}
/* dch1 热身/单列堆：首块 4 宽，后续非增（2..前块），3-4 块无风（对齐宽容） */
function genWarm(rnd) {
  const n = ri(rnd, 3, 4);
  const ws = [4];
  for (let i = 1; i < n; i++) ws.push(ri(rnd, 2, ws[i - 1]));
  return mkQuiz(ws, null, rnd);
}
/* dch2 宽渐变：narrow 下宽上窄（4 起非增）/ wide 下窄上宽（2 起非降），3-4 块，至少一处严格变化 */
function genCh2(rnd) {
  let ws, tries = 0;
  do {
    if (rnd() < 0.5) {                       // 下宽上窄
      const n = ri(rnd, 3, 4);
      ws = [4];
      for (let i = 1; i < n; i++) ws.push(ri(rnd, 2, ws[i - 1]));
    } else {                                 // 下窄上宽
      const n = ri(rnd, 3, 4);
      ws = [2];
      for (let i = 1; i < n; i++) ws.push(ri(rnd, ws[i - 1], 4));
    }
    tries++;
  } while ((!ws.some((w, i) => i > 0 && w !== ws[i - 1]) || ws.length < 3) && tries < 40);
  if (!ws.some((w, i) => i > 0 && w !== ws[i - 1])) ws = [4, 3, 2];   // 兜底（40 次全败概率极低）
  return mkQuiz(ws, null, rnd);
}
/* dch3 风摆：4 块非增自 4，恰 1 个风摆块（非首层），wind ±1 */
function genCh3(rnd) {
  const n = 4;
  const ws = [4];
  for (let i = 1; i < n; i++) ws.push(ri(rnd, 2, ws[i - 1]));
  const wi = ri(rnd, 1, n - 1);
  const winds = {};
  winds[wi] = rnd() < 0.5 ? -1 : 1;
  return mkQuiz(ws, winds, rnd);
}
/* dch4 生成关：5-6 块随机步进宽度 + 2 个风摆块（不同层非首层），稳定解 ≥2 */
function genCh4(rnd) {
  let q = null, tries = 0;
  do {
    const n = ri(rnd, 5, 6);
    const ws = [ri(rnd, 2, 4)];
    for (let i = 1; i < n; i++) ws.push(Math.max(2, Math.min(4, ws[i - 1] + ri(rnd, -1, 1))));
    const i1 = ri(rnd, 1, n - 2), i2 = ri(rnd, i1 + 1, n - 1);
    const winds = {};
    winds[i1] = rnd() < 0.5 ? -1 : 1;
    winds[i2] = rnd() < 0.5 ? -1 : 1;
    q = mkQuiz(ws, winds, rnd);
    tries++;
  } while (countSols(q, 3) < 2 && tries < 40);
  if (countSols(q, 3) < 2) {                 // 兜底模板：解数充裕的确定性序列
    const winds = { 1: 1, 3: -1 };
    q = mkQuiz([4, 4, 3, 3, 2], winds, rnd);
  }
  return q;
}
/* 单题生成（rnd 同流确定性；avoid=同关已出题 sig 集合，全关互异） */
function genOne(dch, qi, rnd, avoid) {
  let q = null, tries = 0;
  do {
    q = (dch === 1 || (qi === 0 && dch !== 1)) ? genWarm(rnd)
      : dch === 2 ? genCh2(rnd)
      : dch === 3 ? genCh3(rnd)
      : genCh4(rnd);
    tries++;
  } while (avoid != null && avoid.has(sig(q)) && tries < 120);
  q.warm = qi === 0 && dch !== 1;
  return q;
}
/* 关卡生成（静态 20 关与生成关同一确定性通道） */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);
  const quizzes = [];
  const avoid = new Set();
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genOne(dch, qi, rnd, avoid);
    avoid.add(sig(q));
    quizzes.push(q);
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, quizzes: quizzes, step: 0, misses: 0, done: false };
}

/* ---------- 放置引擎（无 DOM）：engPlace(L, col) —— 点列放置当前块
   'placed' 放稳待续 / 'win' 本题楼层放完塔立（推进） / 'fall' 倒塌（misses 计一次，零惩罚重搭）
   null 非法列/关已结束 */
function engPlace(L, col) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (q.solved) return null;
  if (typeof col !== 'number' || Math.floor(col) !== col || col < 0 || col >= GRID.cols) return null;
  const f = q.floors[q.step];
  const off = col + f.wind - lowC(q, q.step);
  if (!layerOk(off, lowW(q, q.step), f.w) || !cumOk(cumSum(q) + off)) {
    q.miss++;
    L.misses++;                              // 倒塌一次 = 1 错（星级口径）
    return 'fall';
  }
  q.placed.push({ col: col, off: off });
  q.step++;
  if (q.step >= q.floors.length) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return 'win';
  }
  return 'placed';
}
/* 星级：0 错=3★ / 1-2 错=2★ / 更多=1★（家族口径，永不 0 星） */
const engStars = L => L.misses === 0 ? 3 : (L.misses <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：楼层序列域 + 运行态自洽 */
function structOk(q) {
  if (!q || !Array.isArray(q.floors) || q.floors.length < 3 || q.floors.length > 6) return false;
  for (let i = 0; i < q.floors.length; i++) {
    const f = q.floors[i];
    if (!Number.isInteger(f.w) || f.w < 2 || f.w > 4) return false;              // 宽 2-4 格
    if (!(f.wind === -1 || f.wind === 0 || f.wind === 1)) return false;          // 风 ∈ {0,±1}
    if (!Number.isInteger(f.ci) || f.ci < 0 || f.ci > 3) return false;           // 色板 4 色
    if (i > 0 && f.ci === q.floors[i - 1].ci) return false;                      // 相邻互异
  }
  if (!Array.isArray(q.placed) || q.placed.length !== q.step) return false;      // placed/step 自洽
  if (!Number.isInteger(q.miss) || q.miss < 0) return false;
  if (q.solved !== (q.step === q.floors.length)) return false;
  for (let i = 0; i < q.placed.length; i++) {
    if (!Number.isInteger(q.placed[i].col) || q.placed[i].col < 0 || q.placed[i].col >= GRID.cols) return false;
    const want = q.placed[i].col + q.floors[i].wind - (i === 0 ? GRID.baseC : q.placed[i - 1].col + q.floors[i - 1].wind);
    if (q.placed[i].off !== want) return false;                                  // 偏移可复算
  }
  return true;
}
/* ================= stack 主逻辑（塔区渲染 / 点列放置 / 倒塌重搭 / 教学 / 救援 / 推进）
   玩法（SPEC-BATCH18 §2）：地基+待放楼层块序列（宽 2-4 格+颜色；风摆块带 wind ±1）
   → 点底部格子列放置，块落到当前最高层上。全部楼层放完且塔不倒=celebrate+下一题；
   某层偏移超平衡域=倒塌动画（块翻滚散落+塔身晃）+从倒塌层重搭零惩罚（misses+1）。
   §0.26 倒塌防重入窗 1000ms + 身份守卫（const run=cur，await 后 cur!==run 丢弃旧续体）。
   §0.7a 口径：放稳一块（placed/win）重置救援钟；错点/空白/兔子不重置；听题重置。
   教学（仅 flat0 首次）：看=地基高亮→幽灵手指点安全列演示放 1-2 块→塔立（≤16s）
   →演示结果存 window.__stDemoR（§0.27）→重发同关→帮=指安全列；独=放手。
   验收钩子：window.ST = { get currentLevel, get quiz(){cols,floors[],placed[],wind,
   phase('placing'|'falling'|'win'),step,miss}, tapCol(c), start(flat), async autoSolve(),
   get tutorial, get rescues }（getter 拷贝非活引用） */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);

const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };

const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音：flat<3 每次倒必播；flat≥3 走 10s 节流；miss===2 force 豁免恰一次 */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;

let lastAct = Date.now();

/* ================= 渲染 ================= */
/* 题面：三层小楼图 + 章型问句（题面句 TTS 兜底豁免 clip） */
function renderChip() {

    '<span class="ask">' + qAsk(cur.dch) + '</span>';

/* 题面句=T46 阶段2 clip 化：st_q_1..4 全在册（章问句静态域）；ASKS 域外 dch 落

/* 换题渲染（题面/塔区/进度点）；风摆块成为当前块时播 st_wind（教学关键提示不受 flat 门） */

/* ================= 点列放置主路径（真实点击 / ST.tapCol / autoSolve / 教学演示共用）
   demo=true 仅教学"看"演示通道（豁免 locked 门，batch5 M1 教训） ================= */
async function uiTapCol(c, demo) {
  if (!cur || state.won) return false;
  if ((state.locked && !demo) || (state.demo && !demo)) {
    if (!demo) sfx('pop');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  const run = cur;                               // 身份守卫：演出窗口内重玩会重建 cur
  const r = engPlace(cur, c);
  if (r === null) return false;
  if (r === 'fall') {                            // 倒塌：块翻滚散落+塔身晃，零惩罚重搭
    state.phase = 'falling';
    sfx('fail');
    sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2);   /* miss 首达 2 豁免恰一次（§0.5） */
    renderScene(q, { fallout: true, fallCol: c });
    state.locked = true;                         /* 防重入窗（§0.26：连点一次倒只记一次 miss） */
    await wait(1000 * SPEED);                    /* b16 定案 1000ms */
    if (cur !== run) return r;
    state.phase = 'placing';
    state.locked = false;
    renderScene(q, {});                          // 当前块回悬停位（placed 保留，从倒塌层重搭）
    if (state.tut === 'help') scheduleHelpGhost(300);
    /* 试玩 P1：连倒时孩子瞎猜方向——倒塌恢复后立即闪一次安全列（复用救援视觉，
       不计救援数不重置钟；孩子看得到「往哪放不倒」，试错有锚点） */
    { const seq = solveSeq(q); if (seq && seq.length) breatheCol(seq[0]); }
    return r;                                    // 错点不重置救援钟（§0.7a）
  }
  /* ---- 放稳：块落到塔顶 + 轻反馈 → 下一块/下一题（放稳重置救援钟 §0.7a） ---- */
  lastAct = Date.now();
  if (state.tut === 'help') {                    // 教学"独"：首次放稳 → 强化反馈放手
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  clearColBreathe();
  state.phase = 'placing';
  sfx(r === 'win' ? 'ok' : 'coin');
  if (r === 'placed') sayP(VOICE.place.key, VOICE.place.text);
  renderScene(q, { drop: true });
  const nxt = q.floors[q.step];
  if (nxt && nxt.wind) sayWindDir(nxt.wind);   /* 风摆块登场提示 */
  state.locked = true;
  await wait((r === 'win' ? 860 : 520) * SPEED);
  if (cur !== run) return r;
  if (r === 'win') {                             // 本题楼层放完塔立：st_right+打勾 → 推进
    state.phase = 'win';
    sayR(VOICE.right.key, VOICE.right.text);
    renderScene(q, { done: true });
    await wait(880 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    state.phase = 'placing';
    if (cur.done) winFlow();
    else renderQuiz();
    return r;
  }
  state.locked = false;
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关用 GEN 文案（不带"明天："前缀，core 模板自带） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  clearTimeout(helpTimer);
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);   // 写档在 celebrate then 内
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1)  /* 已完成到 lim-1，预告其下一章（§0.4 防跳章） */ });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  clearTimeout(helpTimer);
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true, phase: 'placing' };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.stack && sv.stack.tutSeen);
  if (VERIFY) { openingSpeak(); return; }        /* verify 页恒走开场链（stub 记录供断言） */
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;

}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {

}
/* 风摆登场提示：st_wind clip+既有风向大红箭头（「哪边」信息由视觉承载——
   clip 与 TTS 双通道叠播有混音风险，动态方向句不叠 say，试玩 P2 处置记录） */

}
/* 教学"帮"指向：当前块的一个安全放置列 breathe + 手指（本款认知脚手架=往哪放不倒） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];

  if (!seq || !seq.length) return;

}
function scheduleHelpGhost(delay) {
  clearTimeout(helpTimer);

    if (state.tut !== 'help' || state.won || state.locked || VERIFY) return;
    pointHelpNext();
  }, delay == null ? 700 : delay);
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独（save.stack.tutSeen）
   看=看地基（高亮）→幽灵手指点安全列演示放 1-2 块（demo 通道真实路径 uiTapCol）→塔立
   →重发同关 → 帮=指安全列；独=首次放稳放手。紧凑演示 ~8s（≤16s §0.30） ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);
  await wait(700 * SPEED);
  const q = cur.quizzes[0];
  renderScene(q, { litBase: true });             // 看地基：石色地基呼吸高亮
  await wait(1000 * SPEED);
  const demoN = Math.min(2, q.floors.length - 1);   // 演示放 1-2 块（留块给孩子）
  let allRight = true;
  for (let k = 0; k < demoN; k++) {
    const seq = solveSeq(q);
    if (!seq || !seq.length) { allRight = false; break; }
    breatheCol(seq[0]);
    pointGhostAt(colBtnEl(seq[0]));
    await wait(900 * SPEED);
    ghost.press();
    await wait(280 * SPEED);
    const r = await uiTapCol(seq[0], true);      // demo 通道豁免 locked（演示吞输入）
    if (r !== 'placed' && r !== 'win') allRight = false;
    await wait(560 * SPEED);
  }
  window.__stDemoR = allRight ? 'right' : 'fall';   /* §0.27 演示生效实证：verify 断言 ==='right' */
  renderScene(q, { litBase: true, done: q.solved }); /* 塔立：保留地基光+已完成打勾 */
  await wait(800 * SPEED);
  const sv = KIDS._save();                       // 真实页 save 恒非 null；verify 直驱时跳过写档
  if (sv) {
    sv.stack = sv.stack || {};
    sv.stack.tutSeen = true;
    KIDS.store.persist();
  }

}
/* 教学"帮"交接（独立成函数：verify 教学链断言直调）：重发同关 + 顺序链 + 幽灵手指 */
function tutorialHandoff() {
  ghost.hide();
  clearColBreathe();
  cur = genLevel(0);                             // 确定性关卡：同一关重来（题面一致）
  state = { locked: false, won: false, demo: false, tut: 'help', quiet: true, phase: 'placing' };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  state.quiet = false;

async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;

  /* ---- verify 侧独立平衡复算器（分源 §0.38：不引 GRID.margin/baseW/layerOk/solveSeq，

  function refStep(floors, placed, col) {          // 一步放置独立判定
    const i = placed.length;
    if (i >= floors.length) return null;
    if (typeof col !== 'number' || Math.floor(col) !== col || col < 0 || col > 6) return null;
    const f = floors[i];
    const pc = i === 0 ? 3 : placed[i - 1].col + floors[i - 1].wind;
    const pw = i === 0 ? 5 : floors[i - 1].w;
    const off = col + f.wind - pc;
    let sum = 0;
    for (let k = 0; k < placed.length; k++) sum += placed[k].off;
    if (Math.abs(off) > Math.max(0, pw / 2 - f.w / 2) + 0.5) return { r: 'fall', off: off };
    if (Math.abs(sum + off) > 2.5) return { r: 'fall', off: off };
    return { r: i + 1 >= floors.length ? 'win' : 'placed', off: off };
  }
  function refSolveFrom(floors, placed) {          // 独立稳定解（从部分塔续解）
    const res = [];
    const ORD = [3, 4, 2, 5, 1, 6, 0];
    function dfs(i, pc, sum) {

      const pw = i === 0 ? 5 : floors[i - 1].w, f = floors[i];
      for (let k = 0; k < ORD.length; k++) {
        const col = ORD[k];
        const off = col + f.wind - pc;
        if (Math.abs(off) > Math.max(0, pw / 2 - f.w / 2) + 0.5) continue;
        if (Math.abs(sum + off) > 2.5) continue;
        res.push(col);
        if (dfs(i + 1, col + f.wind, sum + off)) return true;
        res.pop();

      if (i >= floors.length) { n++; return; }

      for (let col = 0; col <= 6; col++) {
        const off = col + f.wind - pc;
        if (Math.abs(off) > Math.max(0, pw / 2 - f.w / 2) + 0.5) continue;
        if (Math.abs(sum + off) > 2.5) continue;

        if (n >= cap) return;

  function refRangeOk(dch, qi, q) {

    if (!Array.isArray(fs) || fs.length < 3 || fs.length > 6) return false;

      if (!(f.wind === -1 || f.wind === 0 || f.wind === 1)) return false;
      if (!(Number.isInteger(f.ci) && f.ci >= 0 && f.ci <= 3)) return false;
      if (i > 0 && f.ci === fs[i - 1].ci) return false;

  if (!curR || !Number.isInteger(Number(curR.getAttribute('x')))) intOk = false;
  const selfOk = !!(domOk && intOk);
  if (selfOk) npass++;
  units.ui = { ok: selfOk, domOk: domOk, intOk: intOk, cols: colBtns.length,
    trays: sceneEl.querySelectorAll('.trayb').length, floors: q0.floors.length };

  /* ---- ④ sayW 三态（flat<3 每倒必播 / flat≥3 10s 节流 / miss===2 force 豁免恰一次） ---- */
  total++;
  const wLog = [];
  const origPlay2 = KIDS.voice.play;
  KIDS.voice.play = function (key) { wLog.push(String(key)); };
  const wrongPlays = () => wLog.filter(k => k === 'st_wrong').length;
  startLevel(0);                                          // flat0：每倒必播
  await ST.tapCol(refFindFall(ST.quiz));
  await ST.tapCol(refFindFall(ST.quiz));
  const sayA = wrongPlays();                              // → 2
  startLevel(3);                                          // flat3：10s 节流
  lastWrongVoice = Date.now();                            /* 显式进入节流窗口内 */
  await ST.tapCol(refFindFall(ST.quiz));
  const sayB = wrongPlays() - 2;                          // 增量 → 0
  startLevel(3);                                          // 同关重发 fresh quiz：miss===2 force 豁免
  lastWrongVoice = 0;                                     /* 隔离上一子用例时间戳 */
  await ST.tapCol(refFindFall(ST.quiz));                  // miss=1 → 播（窗口外）
  await ST.tapCol(refFindFall(ST.quiz));                  // miss=2 → force → 播
  const sayC = wrongPlays() - 2 - sayB;                   // 增量 → 2
  KIDS.voice.play = origPlay2;
  const sayWOk = sayA === 2 && sayB === 0 && sayC === 2;
  if (sayWOk) npass++;
  units.sayW = { ok: sayWOk, flat0Plays: sayA, flat3Throttle: sayB, flat3Force: sayC };

  /* ---- ⑤ UI 冒烟 A：flat0 真实通路（首题先倒一次 → 1 错=2 星）
     倒塌判定即时可断言（miss/phase 同步查）+ 防重入窗同步续调只记一次 miss ---- */
  total++;
  startLevel(0);
  let smokeA = true, immOk = false, reOk = false;
  const fc0 = refFindFall(ST.quiz);
  if (fc0 < 0) smokeA = false;
  else {
    const p1 = ST.tapCol(fc0);
    const missNow = ST.quiz.miss;                         // 触发判定即时（不等动画）
    const phaseNow = ST.quiz.phase;
    const falloutNow = !!sceneEl.querySelector('.blk.fallout');
    const p2 = ST.tapCol(fc0);                            // 防重入窗内同步续调
    const r1 = await p1, r2 = await p2;
    immOk = missNow === 1 && phaseNow === 'falling' && falloutNow;
    reOk = r1 === 'fall' && r2 === false && ST.quiz.miss === 1 && ST.currentLevel.misses === 1;
  }
  const a0 = await ST.autoSolve();
  const lvA = ST.currentLevel;
  const smokeOkA = smokeA && immOk && reOk && a0.done && lvA.done && lvA.won &&
    lvA.misses === 1 && engStars(cur) === 2 && !document.querySelector('.k-celebrate');
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, immOk: immOk, reentryOk: reOk, taps: a0.taps,
    misses: lvA.misses, stars: engStars(cur) };

  /* ---- ⑥ UI 冒烟 B1：flat5（ch2 宽渐变）首题热身 + autoSolve 3★ ---- */
  total++;
  startLevel(5);
  const L5 = genLevel(5);
  const warm5 = cur.dch === 2 && L5.quizzes[0].warm === true &&
    L5.quizzes[0].floors.every(f => f.wind === 0);
  const grad5 = L5.quizzes.some((q, i) => i > 0 && !q.warm &&
    (() => { let ch2 = false; q.floors.forEach((f, j) => { if (j > 0 && f.w !== q.floors[j - 1].w) ch2 = true; }); return ch2; })());
  const a5 = await ST.autoSolve();
  const lv5 = ST.currentLevel;
  const smokeOkB1 = warm5 && grad5 && a5.done && lv5.done && lv5.won &&
    lv5.misses === 0 && engStars(cur) === 3;
  if (smokeOkB1) npass++;
  smokes.flat5 = { ok: smokeOkB1, warm: warm5, grad: grad5, taps: a5.taps, stars: engStars(cur) };

  /* ---- ⑦ UI 冒烟 B2：flat10（ch3 风摆）autoSolve 3★ + st_wind 播报实证 ---- */
  total++;
  startLevel(10);
  const L10 = genLevel(10);
  const windQs = L10.quizzes.filter(q => !q.warm && q.floors.filter(f => f.wind !== 0).length === 1);
  const windOk10 = L10.dch === 3 && L10.quizzes.length - 1 === windQs.length;
  const wLog10 = [];
  const origPlay10 = KIDS.voice.play;
  KIDS.voice.play = function (key) { wLog10.push(String(key)); };
  const a10 = await ST.autoSolve();
  KIDS.voice.play = origPlay10;
  const windPlayed = wLog10.indexOf('st_wind') >= 0 && wLog10.indexOf('st_right') >= 0;
  const lv10 = ST.currentLevel;
  const smokeOkB2 = windOk10 && windPlayed && a10.done && lv10.done && lv10.won &&
    lv10.misses === 0 && engStars(cur) === 3;
  if (smokeOkB2) npass++;
  smokes.flat10 = { ok: smokeOkB2, windQs: windQs.length, windPlayed: windPlayed,
    taps: a10.taps, stars: engStars(cur) };

  /* ---- ⑧ UI 冒烟 B3：flat15（ch4 生成关）5-6 块两风摆 + autoSolve 3★ ---- */
  total++;
  startLevel(15);
  const L15 = genLevel(15);
  const genOk15 = L15.dch === 4 && L15.quizzes.every(q => q.warm ||
    (q.floors.length >= 5 && q.floors.length <= 6 && q.floors.filter(f => f.wind !== 0).length === 2));
  const a15 = await ST.autoSolve();
  const lv15 = ST.currentLevel;
  const smokeOkB3 = genOk15 && a15.done && lv15.done && lv15.won &&
    lv15.misses === 0 && engStars(cur) === 3;
  if (smokeOkB3) npass++;
  smokes.flat15 = { ok: smokeOkB3, gen: genOk15, taps: a15.taps, stars: engStars(cur) };

  /* ---- ⑨ 教学链（verify 直驱 tutorialWatch）：演示 → demoR 实证 → 重发同关 → 交接链 ---- */
  total++;
  const origQ7 = KIDS.voice.queue, origP7 = KIDS.voice.play;
  const qLog7 = [], pLog7 = [];
  KIDS.voice.queue = function (parts) { qLog7.push(parts.slice()); };
  KIDS.voice.play = function (key) { pLog7.push(String(key)); };
  window.__stDemoR = null;
  startLevel(0);
  await tutorialWatch();                        // 看：watch clip → 地基高亮 → 演示放 1-2 块 → 塔立 → 帮
  KIDS.voice.queue = origQ7; KIDS.voice.play = origP7;
  const lastQ7 = qLog7[qLog7.length - 1];
  const demoR = window.__stDemoR;
  const q0t = ST.quiz;
  /* 演示紧凑性算术断言（SPEED=1 口径常量和 ≤16s §0.30；demoN=min(2,n-1) 与 tutorialWatch 同式） */
  const estWatch = 700 + 1000 + Math.min(2, q0t.floors.length - 1) * (900 + 280 + 520 + 560) + 800;
  const tutOk = pLog7.indexOf('st_tut_watch') >= 0 &&                    /* 看=演示配 watch clip */
    demoR === 'right' &&                                                   /* §0.27 演示真实生效 */
    state.tut === 'help' && !state.demo && !state.locked &&               /* 帮：解锁等孩子动手 */
    ST.currentLevel && ST.currentLevel.flat === 0 &&                      /* 重发同关 */
    ST.quiz && ST.quiz.step === 0 && ST.quiz.miss === 0 &&                /* 新题面初态 */
    lastQ7 && lastQ7.length === 1 && lastQ7[0] === 'st_tut_turn' &&       /* 交接链单通道 */
    estWatch <= 16000 && q0t.floors.length >= 3;
  if (tutOk) npass++;
  units.tutorial = { ok: tutOk, watchClip: pLog7.indexOf('st_tut_watch') >= 0,
    demoR: demoR, handoff: !!lastQ7, parts: lastQ7, tut: state.tut, estWatchMs: estWatch };

  /* ---- ⑩ 布局：双 viewport ×（flat0/5/10/15）
     量测前等列按钮入场 stagger 动画结束（§0.11 transform 中途陷阱） ---- */
  async function simLevel(w, h, flat) {
    startLevel(flat);
    const s0 = solveSeq(cur.quizzes[0]);
    await ST.tapCol(s0[0]);                       // 放一块使塔非空（整数坐标双 viewport 复查）
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    await wait(620);                              // 列按钮入场动画（真实 ms，不吃 SPEED）
    const de = document.documentElement;
    const btns = Array.prototype.slice.call(colbarEl.querySelectorAll('.colbtn'));
    const colOk = btns.length === 7 &&
      btns.every(b => { const r = b.getBoundingClientRect(); return r.width >= 64 && r.height >= 64; });
    let btnOk = true;                             // 全部按钮 ≥64（.k-parentbtn 家长按钮豁免）
    document.querySelectorAll('button').forEach(b => {
      if (b.classList.contains('k-parentbtn')) return;
      const r = b.getBoundingClientRect();
      if (r.width > 4 && r.height > 4 && (r.width < 64 || r.height < 64)) btnOk = false;
    });
    const sv = sceneEl.querySelector('svg.scene');
    const sr = sv ? sv.getBoundingClientRect() : null;
    const sceneOk = !!sr && sr.width >= 100 && sr.height >= 80;   // 场景 SVG 可见非零
    let intOk2 = true;                            // 楼块整数坐标（双 viewport 复查）
    sceneEl.querySelectorAll('.tower .blkr, .curwrap .blkr').forEach(r => {
      ['x', 'y', 'width', 'height'].forEach(a => {
        if (!Number.isInteger(Number(r.getAttribute(a)))) intOk2 = false;
      });
    });
    const ox = Math.max($id('game').scrollWidth - $id('game').clientWidth,
      de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, flat: flat, colOk: colOk, btnOk: btnOk, sceneOk: sceneOk,
      intOk: intOk2, ox: ox, pass: colOk && btnOk && sceneOk && intOk2 && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const f of [0, 5, 10, 15]) {
    sims.push(await simLevel(1280, 800, f));
    sims.push(await simLevel(800, 1180, f));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                // 还原真实 viewport 布局
  const layoutOk = sims.length === 8 && sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑪ 专项：文案对账 / clips 恰 14 / 开场链 / 题面 st_q_ clip（T46） ---- */
  total++;
  const refVoice = VOICE.watch.text === '看！把高楼搭起来' &&
    VOICE.turn.text === '你来搭一搭' && VOICE.hint.text === '对整齐就不倒啦' &&
    VOICE.right.text === '搭好啦，真稳' && VOICE.wrong.text === '歪了歪了，再来一次' &&
    VOICE.wind.text === '风来了，放另一边' && VOICE.place.text === '放好一层';
  const refAsk = qAsk(1) === '把楼层一块块搭上去' && qAsk(2) === '看看宽窄，稳稳地搭' &&
    qAsk(3) === '风来了，往另一边放' && qAsk(4) === '大风天，搭一座高楼';
  /* clips 注入恰 14 条（st_ 11=教学反馈 7+T46 章问句 4+core 3）且全在场 */
  const ST_KEYS = ['st_tut_watch', 'st_tut_turn', 'st_hint', 'st_right', 'st_wrong', 'st_wind', 'st_place',
                   'st_q_1', 'st_q_2', 'st_q_3', 'st_q_4'];
  const CORE_KEYS = ['core_chapter_end', 'core_day_end', 'core_rest'];
  const allKeys = Object.keys(KIDS.voice.clips);
  const clipOk = ST_KEYS.concat(CORE_KEYS).every(k => !!KIDS.voice.clips[k]) && allKeys.length === 14;
  const coreOk = CORE_KEYS.every(k => !!KIDS.voice.clips[k]);
  /* 开场顺序链（stub 记录）：queue([st_hint]) 单通道不叠音 */
  const origQ = KIDS.voice.queue, origP = KIDS.voice.play, origS = KIDS.voice.say;
  const qLog = [], playLog = [], sayLog = [];
  KIDS.voice.queue = function (parts) { qLog.push(parts.slice()); };
  KIDS.voice.play = function (key, text) { playLog.push(String(key)); };
  KIDS.voice.say = function (t) { sayLog.push(String(t)); };
  startLevel(0);                                // verify 页恒走开场链
  const lastQ = qLog[qLog.length - 1];
  const openChain = qLog.length >= 1 && lastQ.length === 1 && lastQ[0] === 'st_hint';
  askSpeak();                                    // 换题读题面：T46 章问句 clip（st_q_，期望从 ASKS 静态域推导）
  const askClip = playLog.length >= 1 && playLog[playLog.length - 1] === 'st_q_1' && sayLog.length === 0;
  KIDS.voice.queue = origQ; KIDS.voice.play = origP; KIDS.voice.say = origS;
  const specOk = refVoice && refAsk && clipOk && coreOk && openChain && askClip;
  if (specOk) npass++;
  units.dist = { ok: specOk, refVoice: refVoice, refAsk: refAsk, clips: clipOk,
    clipN: allKeys.length, core: coreOk, openChain: openChain, askClip: askClip };

  const out = { game: 'stack', total: total, pass: npass, levels: levels, gen: gen,
    units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
