<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>齿轮转起来</title>
<style>
/* ================= 齿轮转起来 gear v3（batch38·r3 难度升档 2026-09-13）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   v3 双答制：先答预判（转向 cw/ccw｜快慢 small/same/big｜转不动 jam）再选齿数——
   两答全对才 right（SPEC-BATCH38 §3 v3）。
   齿数制 5 档 t8-t16（直径 53-106 相邻差 13.2px——去恒等须数齿，统一暖橙
   防色码跳过数齿）；齿圈 8-16 齿参数化+3 辐条=转向可视锚。
   转速=齿数×70ms 周期（--dur 内联变量——传动比可视化：齿少者恒快）。
   触摸目标：槽位/候选 ≥96×96、底栏按钮 ≥72；overflowX 恒 0（6 槽链收窄 100px）。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：机器墙（槽位链）+ 先答一答预判行（v3 判定层阶段1） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:6px 12px}
#scene{flex:0 0 auto;position:relative;width:min(680px,94vw);border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F0E7CC 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:10px 12px 14px;transition:transform .4s,box-shadow .4s}
#scene.panorama{transform:scale(1.03);box-shadow:0 0 0 6px rgba(232,151,90,.45),0 4px 0 #D8C9B4}

/* 先答一答预判行（v3 判定层：阶段1 答预判——转向/快慢/转不动；答对钉住进阶段2） */
#guessbar{flex:0 0 auto;display:none;align-items:center;gap:12px;padding:2px 0}
#guessbar.show{display:flex}
#guessbar .g-label{font-size:16px;font-weight:800;color:#8A6F52}
#guessbar .ab-btns{display:flex;gap:10px}
.guess-btn{min-width:64px;height:64px;border-radius:14px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 3px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:0 8px;transition:all .15s}
.guess-btn svg{width:34px;height:34px}
.guess-btn span{font-size:12px;font-weight:800;color:#8A6F52;line-height:1}
.guess-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #D8C9B4}
.guess-btn.picked{background:#FFF3D9;box-shadow:0 0 0 4px rgba(232,151,90,.5),0 3px 0 #D8C9B4;
  transform:scale(1.06)}
.guess-btn.rej{animation:ab-rej .5s ease}
@keyframes ab-rej{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.guess-btn.breathe{animation:ab-br 1.2s ease-in-out infinite}
@keyframes ab-br{0%,100%{box-shadow:0 3px 0 #D8C9B4}
  50%{box-shadow:0 0 0 7px rgba(143,191,127,.8),0 3px 0 #D8C9B4}}
#guessbar.done{opacity:.55}   /* 阶段1 已答对：降透明持续可见（转向答案钉住锚） */

/* ---------- 机器墙：槽位横排（3-6 槽自适应；6 槽收窄仍 ≥96 触摸目标；
   超窄屏允许墙内横滑——页面级 overflowX 恒 0，触摸目标不缩水） ---------- */
#wall{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:150px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
#wall[data-n="6"]{gap:8px}
#wall[data-n="6"] .slot{width:100px}
#wall.bump{animation:gr-bump .22s ease}
@keyframes gr-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
.slot{position:relative;width:118px;height:140px;border-radius:16px;background:#EFE2C3;
  border:3px solid #4A3B2E;box-shadow:inset 0 -4px 0 rgba(74,59,46,.12);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.slot:active{background:#EADAB4}
/* 槽内开口虚框（判定槽开口直径=需求齿数直径——几何匹配具象可比对，13.2px 差须细看） */
.slot .mouth{position:absolute;border:3px dashed #B99F73;border-radius:50%;background:rgba(217,196,154,.4);
  transition:all .2s}
.slot[data-type=blank] .mouth{border-color:#E8975A}
/* 阶段1 答对钉住标记（转向箭头/快慢/转不动——钉在判定槽上方，选齿数时持续可见） */
.slot .pindir{position:absolute;z-index:7;top:-26px;left:50%;transform:translateX(-50%);opacity:0;
  transition:opacity .25s}
.slot .pindir.show{opacity:1}
.slot .pindir svg{width:44px;height:44px;filter:drop-shadow(0 2px 0 #FFF9EE)}
/* 驱动轮手柄标签（观察句视觉锚；B=第二驱动右手柄——conflict 题） */
.slot[data-type=D]::before{content:'手柄';position:absolute;top:4px;left:50%;transform:translateX(-50%);
  font-size:13px;font-weight:800;color:#8A6F52;white-space:nowrap}
.slot[data-type=B]::before{content:'右手柄';position:absolute;top:4px;left:50%;transform:translateX(-50%);
  font-size:13px;font-weight:800;color:#C96F5A;white-space:nowrap}
.slot[data-type=W]::before{content:'风车';position:absolute;top:4px;left:50%;transform:translateX(-50%);
  font-size:13px;font-weight:800;color:#8A6F52;white-space:nowrap}
/* 齿轮/风车主体（.rot 承担旋转） */
.slot .rot{position:relative;z-index:2}
.slot .rot svg{display:block}
/* 驱动轮 idle 恒转（cw 慢——「看一看手柄往哪转」观察锚）；其余静止待联动；
   .spin=全链联动起转（转速周期=--dur 齿数×70ms——传动比可视化）；
   data-dir=ccw 反向（r2 M1：视觉方向与判定真值一致——verify computed 对账） */
.slot[data-type=D] .rot{animation:rot-cw 2.6s linear infinite}
.slot.spin .rot{animation:rot-cw var(--dur,1.2s) linear infinite}
.slot.spin[data-dir=ccw] .rot{animation:rot-cw var(--dur,1.2s) linear infinite reverse}
@keyframes rot-cw{to{transform:rotate(360deg)}}
/* 放对=齿轮咬合 pop（判定槽——先 pop 后随链转动，ccw 反向） */
.slot.meshed{background:#DCE8CC}
.slot.meshed.pop .rot{animation:gear-in .9s cubic-bezier(.2,1.5,.4,1) backwards,rot-cw var(--dur,1.2s) linear infinite .9s}
.slot.meshed.pop[data-dir=ccw] .rot{animation:gear-in .9s cubic-bezier(.2,1.5,.4,1) backwards,rot-cw var(--dur,1.2s) linear infinite reverse .9s}
@keyframes gear-in{0%{transform:scale(0) rotate(-120deg);opacity:0}
  70%{transform:scale(1.14) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
/* 判定槽开题呼吸高亮（当前任务锚） */
.slot.focus .mouth{animation:mouth-br 1.4s ease-in-out infinite}
@keyframes mouth-br{0%,100%{box-shadow:0 0 0 0 rgba(232,151,90,0)}
  50%{box-shadow:0 0 0 7px rgba(232,151,90,.55)}}
/* 方向级反馈：错时相邻已固定齿轮高亮+转向箭头浮现（「看看旁边的齿轮」） */
.slot.lit{background:#F6E3C8;box-shadow:0 0 0 5px rgba(232,151,90,.55),inset 0 -4px 0 rgba(74,59,46,.12)}
.slot.lit::after{content:'';position:absolute;z-index:5;width:30px;height:30px;top:-8px;right:-8px;
  background:#FFF9EE;border:2.5px solid #E8975A;border-radius:50%;opacity:.95}
.slot .dir-pop{position:absolute;z-index:6;top:-24px;left:50%;transform:translateX(-50%);opacity:0;
  transition:opacity .2s}
.slot.lit .dir-pop{opacity:1}
.slot .dir-pop svg{width:40px;height:40px;filter:drop-shadow(0 2px 0 #FFF9EE)}
/* 答案级提示：判定槽 breathe（miss≥2） */
.slot.breathe{animation:slot-br 1.2s ease-in-out infinite}
@keyframes slot-br{0%,100%{box-shadow:inset 0 -4px 0 rgba(74,59,46,.12)}
  50%{box-shadow:0 0 0 7px rgba(143,191,127,.8),inset 0 -4px 0 rgba(74,59,46,.12)}}
/* 关末全速（纯演出层；ch4 无风车=全轮全速） */
.slot.fullspeed .rot{animation-duration:.55s}
/* v3 冲突锁死演出（jam 题：放对后全链卡住微抖不转——「先猜后试」验证闭环；
   规则置后覆盖 idle/spin（特异性同级后者胜）；关末 B 手柄拆除断言锚 .unhands */
.slot.jammed .rot{animation:gr-jam .5s ease-in-out infinite}
.slot[data-type=B].unhands{opacity:.25;filter:grayscale(.8)}
@keyframes gr-jam{0%,100%{transform:rotate(0)}30%{transform:rotate(5deg)}65%{transform:rotate(-4deg)}}

/* ---------- 齿轮库（候选——触摸目标 ≥96；阶段1 未答时 .dim 引导先答预判） ---------- */
#tray-wrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;padding:2px 0}
#tray-wrap .t-label{font-size:15px;font-weight:700;color:#8A6F52;padding:3px 10px;border-radius:10px;
  background:#F2DDC0;border:2px solid #4A3B2E}
#picks{display:flex;gap:12px;align-items:center;transition:opacity .3s}
#picks.dim{opacity:.45}
.pick{width:104px;height:104px;border-radius:18px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.pick:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
.pick.breathe{animation:pick-br 1.2s ease-in-out infinite}
@keyframes pick-br{0%,100%{box-shadow:0 4px 0 #D8C9B4}
  50%{box-shadow:0 0 0 7px rgba(143,191,127,.8),0 4px 0 #D8C9B4}}
.pick.rej{animation:pick-rej .5s ease}
@keyframes pick-rej{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:76px;height:76px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:44px;height:44px}
#btn-replay.bounce{animation:rep-b .4s ease}
@keyframes rep-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-38） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：舞台收紧，槽位 104 仍 ≥96 触摸目标；6 槽链 96 收窄 */
@media (orientation:portrait){
  #scene{width:min(600px,96vw)}
  .slot{width:104px;height:126px;gap:6px}
  #wall{gap:7px}
  #wall[data-n="6"]{gap:5px}
  #wall[data-n="6"] .slot{width:96px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="齿轮转起来">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="机器墙，先答一答再选齿轮装进空槽">
      <div id="guessbar" aria-label="先答一答（判定第一步）">
        <span class="g-label"></span>
        <div class="ab-btns"></div>
      </div>
      <div id="wall" aria-label="齿轮槽位链"></div>
      <div id="tray-wrap">
        <span class="t-label">齿轮库</span>
        <div id="picks" aria-label="候选齿轮"></div>
      </div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再听一遍观察句"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

/* ================= gear 纯引擎 v3：确定性关卡生成 + 双答判定（无 DOM，UI 与 verify 共用）

   静态关 flat<20：dch=diffOfCh(ch) 静态档，关内 5 题=章池 5 行 rotate (lv+k)%5

   先取保确定性——b33 硬性②+quickcmp 先例；本款常量 847），再从该 dch 档行池
   seeded 无放回抽 5（域全档成立型：四档布局域均自洽）——同 flat 永远同关。
   阶段1 真值（v3 双答制——SPEC §3 独立推导式，verify 用独立副本复算禁抄本层）：
   dirAt(k)      = k % 2 === 0 ? 'cw' : 'ccw'（驱动轮 0 号恒 cw，相邻反向交替）
   conflict jam  = (blank % 2) !== ((n - 1 - blank) % 2)（双驱两端均 cw，两路奇偶
                   冲突=锁死「转不动」——代数等价 iff n 为偶数）
   speed dirAns  = dteeth === need ? 'same' : 'small'（啮合角速度与齿数成反比——
                   齿少者恒快；'big'=misconception 干扰恒非真值）
   候选去恒等：picks = [need] + NEIGHBOR[need]（邻档两干扰，|齿数差|∈{2,4}），
   seeded 打散 → answer = picks.indexOf(need) 唯一。
   quiz 结构：{ kind, layout, slots[], blank, need, dteeth, dirAns, jam, picks[],
   answer, obs, obsWin, phase(1 预判答|2 选齿数), _miss, _dirOk, _answered }
   slots[]：{ k, type('D'|'W'|'B'|'fix'|'blank'), gear(齿数档 id|'D'|'W'|'B'|null),
   teeth(数字|null), dir('cw'|'ccw'|'jam'|null——固定轮真值), meshed }
   铁律：每关 5 题；每题恰一枚正确候选（邻档池互异——structWhy 校验）；
   阶段1 未答对（_dirOk=false）阶段2 判定不可入（engTapGear null）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 转向律（SPEC §0.93/§3 v3 数学锚——verify 独立复算依据） ---------- */
const dirAt = k => (k % 2 === 0 ? 'cw' : 'ccw');

/* ---------- 阶段1 真值推导（引擎真源；verify 独立副本禁调本函数） ---------- */
function deriveDirAns(row) {
  if (row.kind === 'speed') return row.dteeth === row.need ? 'same' : 'small';
  const n = row.layout.length, k = row.blank;
  if (row.kind === 'conflict') {
    const jam = (k % 2) !== ((n - 1 - k) % 2);   /* 双驱两路奇偶冲突=锁死 iff n 偶 */
    return jam ? 'jam' : dirAt(k);
  }
  return dirAt(k);
}

/* ---------- 布局解析：记法串 → 槽位骨架（D/W/B/x/_；fixes 表给 x 位齿数） ---------- */
function parseLayout(row) {
  const slots = [];
  const dt = row.dteeth || DTEETH_DEFAULT;         // 驱动轮齿数（speed 章 dteeth 表定）
  for (let k = 0; k < row.layout.length; k++) {
    const c = row.layout.charAt(k);
    if (c === 'D') slots.push({ k: k, type: 'D', gear: 'D', teeth: TEETH[dt], dir: 'cw', meshed: false });
    else if (c === 'W') slots.push({ k: k, type: 'W', gear: 'W', teeth: null, dir: dirAt(k), meshed: false });
    else if (c === 'B') slots.push({ k: k, type: 'B', gear: 'B', teeth: TEETH[DTEETH_DEFAULT], dir: 'cw', meshed: false });
    else if (c === 'x') slots.push({ k: k, type: 'fix', gear: row.fixes[k], teeth: TEETH[row.fixes[k]], dir: dirAt(k), meshed: false });
    else slots.push({ k: k, type: 'blank', gear: null, teeth: null, dir: null, meshed: false });
  }
  return slots;
}

/* ---------- seeded 打散（Fisher-Yates，确定性） ---------- */
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = ri(rnd, 0, i);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---------- 单题构建：SPEC_TABLE 行 + 槽位骨架 + seeded 候选序；answer=唯一正确下标 ---------- */
function buildQuiz(rowIdx, rnd) {
  const row = SPEC_TABLE[rowIdx];
  const ch = Math.floor(rowIdx / 5) + 1;                       // 行→章（封闭表域 1-4）
  const slots = parseLayout(row);
  const picks = shuffled([row.need].concat(NEIGHBOR[row.need]), rnd);   // 去恒等邻档池
  const answer = picks.indexOf(row.need);                      // 唯一正确候选（先验验算 ✓）
  const dirAns = deriveDirAns(row);                            // 阶段1 真值（SPEC 独立式）
  return { kind: row.kind, layout: row.layout, slots: slots, blank: row.blank,
           need: row.need,
           dteeth: row.dteeth || DTEETH_DEFAULT,               // 驱动轮齿数档（非 speed 恒 t12）
           dirAns: dirAns, jam: dirAns === 'jam',
           picks: picks, answer: answer,
           obs: CHAPTERS[ch].obs, obsKey: CHAPTERS[ch].obsKey, obsWin: CHAPTERS[ch].obsWin,
           phase: 1, _miss: 0, _dirOk: false, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   静态关章池 rotate：flat 关 5 题 = SPEC_TABLE[(dch-1)*5 + (lv+k)%5]（章池全 5 题轮转取尽）
   生成关：dch=ri(rnd,1,4) 先取，再从 dch 档行池 seeded 无放回抽 5 ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 847);                   // 本款常量 847（SPEC §0.93）
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);     // 生成关随机章参数（先取数保确定性）
  let rows;
  if (flat < STATIC_LEVELS) {
    const base = (dch - 1) * 5;                                // 静态关 dch===ch：章池 rotate
    rows = [];
    for (let k = 0; k < CH_LEN; k++) rows.push(base + (lv + k) % 5);
  } else {
    const pool = [(dch - 1) * 5, (dch - 1) * 5 + 1, (dch - 1) * 5 + 2, (dch - 1) * 5 + 3, (dch - 1) * 5 + 4];
    const a = pool.slice(), out = [];
    for (let k = 0; k < CH_LEN; k++) out.push(a.splice(ri(rnd, 0, a.length - 1), 1)[0]);
    rows = out;                                                // 生成关：档池 seeded 无放回抽 5
  }
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(rows[qi], rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv, rows: rows,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 阶段1 预判答引擎（无 DOM）：engTapDir(L, d) —— 选项 d（cw/ccw/jam/small/same/big）
   'ok'     答对：_dirOk=true，phase→2（开放选齿数）
   'wrong'  答错：该题 miss+1（retries 全关累计=星级口径），可重答
   null     关卡已结束 / 本题已答过 / 阶段1 已过 / 非法选项 ---------- */
function engTapDir(L, d) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered || q._dirOk || q.phase !== 1) return null;
  if (DIR_KINDS[q.kind].indexOf(d) < 0) return null;
  if (d === q.dirAns) {
    q._dirOk = true; q.phase = 2;
    return 'ok';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}

/* ---------- 阶段2 放齿轮引擎（无 DOM）：engTapGear(L, i) —— 点候选下标 i 的齿轮
   'meshed' 放对且本题完成推进 / 'done' 放对且末题=通关
   'wrong'  放错（干扰齿数不合槽）：miss+1，可重放
   null     阶段1 未答对（双答制顺序守卫）/ 非法下标 / 关卡已结束 / 本题已答 ---------- */
function engTapGear(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered || !q._dirOk) return null;             // 双答制：先答预判再选尺寸
  if (!Number.isInteger(i) || i < 0 || i >= q.picks.length) return null;
  if (i === q.answer) {
    q._answered = true;
    const bs = q.slots[q.blank];                               // 判定槽真值落位（渲染层 .meshed 之源）
    bs.gear = q.need; bs.teeth = TEETH[q.need]; bs.meshed = true;
    bs.dir = q.jam ? 'jam' : dirAt(bs.k);                      // jam 题锁死=演出不转锚
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'meshed';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（§0.93 miss 口径）：全关放错 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：当前步正确选项（阶段1=dirAns / 阶段2=answer 下标） */
const correctPick = q => !q ? -1 : q.answer;

/* ---------- 结构校验（verify 用，返回失败原因或 null）：
   布局域封闭（D 首位 / 尾位 W（dir|speed）或 B（conflict）/ 字符集 D W B x _ /
   恰 1 空槽 / blank 在 '_' 位非两端 / fixes 恰覆盖 x 位）
   / kind 域与布局匹配 / need∈齿数档域 / dteeth∈域
   / dirAns=deriveDirAns 复算 / picks=need+NEIGHBOR 邻档池（去恒等：差 2/4 互异）
   / answer=indexOf / 转向律真值（固定槽 dir===dirAt(k)；B 恒 cw）/ 初始态干净 ---------- */
function structWhy(q, dch, qi) {
  if (!q) return 'quiz';
  if (!CHAPTERS[dch]) return 'dch';
  const lay = q.layout;
  if (!lay || lay.length < 3 || lay.length > 6) return 'layout';
  if (lay.charAt(0) !== 'D') return 'head';                    // 驱动轮恒 0 号位
  const tail = lay.charAt(lay.length - 1);
  if (q.kind === 'conflict') { if (tail !== 'B') return 'tail'; }
  else if (tail !== 'W') return 'tail';                        // 风车恒链尾（conflict=B）
  let blanks = 0, dN = 0, wN = 0, bN = 0;
  const fixes = {};
  for (let i = 0; i < lay.length; i++) {
    const c = lay.charAt(i);
    if (c === '_') blanks++;
    else if (c === 'D') dN++;
    else if (c === 'W') wN++;
    else if (c === 'B') bN++;
    else if (c === 'x') fixes[i] = null;
    else return 'chr';
  }
  if (dN !== 1) return 'dw';
  if (q.kind === 'conflict' && bN !== 1) return 'dw';          // conflict 恰一 B
  if (q.kind !== 'conflict' && (wN !== 1 || bN !== 0)) return 'dw';
  if (blanks !== 1) return 'blanks';                           // v3 每题恰 1 判定空槽
  if (!Number.isInteger(q.blank) || q.blank < 1 || q.blank >= lay.length - 1) return 'blank';
  if (lay.charAt(q.blank) !== '_') return 'blankAt';
  if (q.kind !== 'dir' && q.kind !== 'speed' && q.kind !== 'conflict') return 'kind';
  if (q.kind === 'speed' && lay !== 'D_W') return 'speedLay';  // 传动比=两轮直驱
  if (!TEETH[q.need] || !TEETH[q.dteeth]) return 'need';       // 齿数档域（need/dteeth）
  /* 阶段1 真值自洽复算（q 自身字段——禁反查 SPEC_TABLE：rotate 行序会错位；
     行对账归 verify specFlow 独立通道） */
  if (q.dirAns !== deriveDirAns({ kind: q.kind, layout: q.layout, blank: q.blank,
                                  dteeth: q.dteeth, need: q.need })) return 'dirAns';
  if (q.jam !== (q.dirAns === 'jam')) return 'jam';
  if (q.picks.length !== 3) return 'picks';
  const pool = [q.need].concat(NEIGHBOR[q.need]);
  if (q.picks.slice().sort().join('') !== pool.slice().sort().join('')) return 'picksSet';   // 去恒等邻档池
  if (q.answer !== q.picks.indexOf(q.need) || q.answer < 0) return 'answer';   // 唯一（池互异已检）
  for (let i = 0; i < q.slots.length; i++) {                   // 槽位真值：固定轮 dir、空槽 null
    const s = q.slots[i];
    if (s.k !== i) return 'slotK';
    if ((lay.charAt(i) === 'x') !== (s.type === 'fix')) return 'slotFixAt';   // fixes 恰覆盖 x 位
    if (s.type === 'D' || s.type === 'B') {
      if (s.gear !== s.type || s.dir !== 'cw' || s.meshed || !s.teeth) return 'slotFix';
    } else if (s.type === 'W') {
      if (s.gear !== 'W' || s.dir !== dirAt(s.k) || s.meshed) return 'slotFix';
    } else if (s.type === 'fix') {
      if (!TEETH[s.gear] || s.teeth !== TEETH[s.gear] || s.dir !== dirAt(s.k) || s.meshed) return 'slotFix';
    } else if (s.type === 'blank') {
      if (s.gear !== null || s.dir !== null || s.meshed) return 'slotEmpty';
    } else return 'slotType';
  }
  if (q.phase !== 1 || q._miss !== 0 || q._dirOk || q._answered) return 'init';
  return null;
}

  state.showUntil = Date.now() + q.obsWin * SPEED + 140;   // 真时钟演出锁（题面句窗）
  if (cur) KIDS.voice.play(q.obsKey, q.obs);      /* 题面句 clip 化（T46 阶段2：gr_obs_ 章档键，
                                                     同句 play 落空自动回退 TTS——B 类键） */
  const bs = slotAt(q.blank);
  if (bs) replayAnim(bs, 'focus');                // 判定空槽呼吸高亮（当前任务锚）
  await wait(q.obsWin * SPEED);                   /* 3660=estMs(8)+300 / 4350=estMs(10)+300 /
                                                     3315=estMs(7)+300（家族 T/H） */
  if (token !== showRun || cur !== run) return;
  state.locked = false;
  lastAct = Date.now();                           /* 题面句完成开放点选（b25 M4：重置 idle 锚） */
  lastDir = Date.now();
}

/* ================= 重听：重播题面句+判定槽高亮（user=true 走 3s 节流；
   救援路径 false 不重置 lastAct——契约 B；轻提示不锁输入） ================= */
function reReadObs(user) {
  const q = cur && cur.quizzes[cur.step];
  if (!q || state.won) return false;
  if (cur.flat < 0) return false;                 /* 教学迷你关禁重听（重发=破坏教学时序） */
  if (user) {
    if (Date.now() - lastReplayAt < 3000) return false;   // 3s 节流
    lastReplayAt = Date.now();
  }
  const bs = slotAt(q.blank);
  if (bs) replayAnim(bs, 'focus');
  if (cur) KIDS.voice.play(q.obsKey, q.obs);      // 重读题面句（clip 化——T46 阶段2）
  if (user) lastAct = Date.now();                 /* 主动重听重置 idle（救援路径不动——契约 B） */
  return true;
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向：按 phase 分流（阶段1=正确预判按钮 / 阶段2=正确候选——教学期
   泄答案=家族先例，帮→独后撤） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  if (q.phase === 1) pointGhostAt(dirBtnAt(q.dirAns));
  else pointGhostAt(pickAt(correctPick(q)));
}

/* ================= 咬合落位（渲染层 .meshed 类+data-dir 转向真值+--dur 转速；
   引擎真值源 q.slots[k].dir=dirAt(k)——契约 M） ================= */
function meshInto(q) {
  const bs = slotAt(q.blank);
  if (bs) {
    bs.classList.remove('focus', 'breathe');
    bs.innerHTML = gearHtml(q.need) + '<div class="dir-pop"></div><div class="pindir"></div>';
    void bs.offsetWidth;
    bs.classList.add('meshed', 'pop');
    bs.dataset.dir = q.slots[q.blank].dir;        // 转向真值（k%2 律；jam='jam'）
    bs.style.setProperty('--dur', TEETH[q.need] * TOOTH_MS + 'ms');   // 转速周期=齿数×70
  }
}
/* ================= 全链联动预演：逐轮延迟起转（SPIN_STEP 180 波次——转向交替可视化，
   SPEC §3 教学核心；--dur=齿数×TOOTH_MS 传动比可视化；jam 题=全链卡住微抖） ================= */
function chainSpin(q) {
  for (const s of q.slots) {
    const el = slotAt(s.k);
    if (!el) continue;
    if (q.jam) {                                  // 双驱动奇偶冲突：锁死演出（不转——先猜后试验证）
      setTimeout(() => { if (el) el.classList.add('jammed'); }, s.k * SPIN_STEP * SPEED);
      continue;
    }
    if (s.dir && s.dir !== 'jam') {
      el.dataset.dir = s.dir;
      el.style.setProperty('--dur', Math.round((s.teeth || 12) * TOOTH_MS) + 'ms');
      setTimeout(() => { if (el) el.classList.add('spin'); }, s.k * SPIN_STEP * SPEED);
    }
  }
}

/* ================= 阶段1 预判答主路径（真实点击 / GR.tapDir / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（answerbar 容器 bump / 按钮 rej——家族 D）；演出锁真时钟；
   豁免窗 guard（I 补：错答吞/对答放行）========== */
async function uiTapDir(d, demo) {
  if (!cur || state.won) { sfx('pop'); replayAnim(sceneEl, 'bump'); return null; }
  if (!demo && (state.locked || state.demo || Date.now() < state.showUntil)) {
    sfx('pop');                                   /* 演出锁（真时钟）：吞+轻叮+bump */
    replayAnim(sceneEl, 'bump');
    return null;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  if (DIR_KINDS[q.kind].indexOf(d) < 0) { sfx('pop'); replayAnim(sceneEl, 'bump'); return null; }   // 非法选项
  /* b31 家族 I 补口径：错链豁免窗（真时钟）内错答吞——pop+bump 不计 miss；对答放行 */
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil && d !== q.dirAns) {
    sfx('pop'); replayAnim(sceneEl, 'bump'); return false;
  }
  const run = cur, token = showRun;               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapDir(cur, d);
  if (r === null) { sfx('pop'); replayAnim(sceneEl, 'bump'); return null; }
  const btn = dirBtnAt(d);

  if (r === 'wrong') {                            /* 预判答错：专向反馈 miss（不泄答案）+错链+视觉梯度 */
    const isSpeed = q.kind === 'speed';
    const chainWin = isSpeed ? SPEED_CHAIN_WIN : DIR_CHAIN_WIN;
    const lock1 = isSpeed ? SPEED_LOCK_1 : DIR_LOCK_1;
    const lock = q._miss === 1 ? lock1 : WRONG_LOCK_2;
    state.locked = true;
    state.showUntil = Date.now() + lock * SPEED;  /* 首错锁=clip+150 顶格（b37 R3 收窄——不叠尾窗） */
    dodgeLo();
    if (btn) replayAnim(btn, 'rej');
    litNeighbors(q);                              /* 方向级：高亮相邻已固定齿轮+箭头（奇偶视觉锚） */
    const vk = isSpeed ? VOICE.speedWrong : VOICE.dirWrong;
    if (sayW([vk.key, VOICE.hint.key]))           /* 错链全 clip 无 keyless（契约 N） */
      wrongChainUntil = Date.now() + chainWin;    /* 链豁免：dir 5538 / speed 5442 真时钟（契约 I） */
    if (q._miss >= 2) {                           /* miss≥2=正确预判按钮 breathe（答案级梯度） */
      const okBtn = dirBtnAt(q.dirAns);
      if (okBtn) replayAnim(okBtn, 'breathe');
    }
    await wait(lock * SPEED);
    if (cur !== run || token !== showRun) return r;
    state.locked = false;
    return r;
  }

  /* ---- ok（预判答对：选项钉在空槽+短锁→进阶段2） ---- */
  lastAct = Date.now();                           /* 正确答重置救援钟（§0.7a） */
  state.locked = true;
  state.showUntil = Date.now() + DIR_OK_MS * SPEED + 140;
  renderPhase(q);                                 /* answerbar done+pindir 钉住+齿轮库亮起 */
  chimeGoal();
  await wait(DIR_OK_MS * SPEED);
  if (cur !== run || token !== showRun) return r;
  state.locked = false;
  if (state.tut === 'help') pointHelpNext();      /* 教学"帮"两步：答对预判→指向正确候选 */
  return r;
}

/* ================= 阶段2 放齿轮主路径（真实点击 / GR.tapGear / autoSolve / 教学演示共用）
   双答制顺序守卫：阶段1 未答对=吞+轻叮 null；演出锁真时钟；豁免窗 guard ========== */
async function uiTapGear(i, demo) {
  if (!cur || state.won) { sfx('pop'); replayAnim(wallEl, 'bump'); return null; }
  if (!demo && (state.locked || state.demo || Date.now() < state.showUntil)) {
    sfx('pop');                                   /* 演出锁（真时钟）：吞+轻叮+bump */
    replayAnim(wallEl, 'bump');
    return null;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  if (!q._dirOk) { sfx('pop'); replayAnim(wallEl, 'bump'); return null; }   // 先答预判（顺序引导）
  if (!Number.isInteger(i) || i < 0 || i >= q.picks.length) { sfx('pop'); replayAnim(wallEl, 'bump'); return null; }   // 越界
  if (q._answered) return null;
  /* b31 家族 I 补口径：错链豁免窗（真时钟）内错点吞——pop+bump 不计 miss；
     对选放行（缓解吞输入急性子观察）；窗后二错照常计 miss（miss≥2 梯度可达） */
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil && i !== q.answer) {
    sfx('pop'); replayAnim(wallEl, 'bump'); return false;
  }
  const run = cur, token = showRun;               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapGear(cur, i);
  if (r === null) { sfx('pop'); replayAnim(wallEl, 'bump'); return null; }
  const pickBtn = pickAt(i);

  if (r === 'wrong') {                            /* 放错：干扰齿数不合槽——空转抖动+错链+视觉梯度 */
    state.locked = true;
    state.showUntil = Date.now() + (q._miss === 1 ? WRONG_LOCK_1 : WRONG_LOCK_2) * SPEED;   /* b37 R3+b38 R1：首错锁 2334=2184+150 顶格 */
    dodgeLo();
    if (pickBtn) replayAnim(pickBtn, 'rej');
    litNeighbors(q);                              /* 方向级：高亮相邻已固定齿轮+箭头（不亮判定槽本体） */
    if (sayW([VOICE.wrong.key, VOICE.hint.key]))  /* 错链全 clip 无 keyless（契约 N） */
      wrongChainUntil = Date.now() + WRONG_CHAIN_WIN;   /* 链豁免：2184+150+2328+300=4962 真时钟（契约 I） */
    if (q._miss >= 2) {                           /* miss≥2=判定槽 breathe（答案级梯度） */
      const bs = slotAt(q.blank);
      if (bs) replayAnim(bs, 'breathe');
    }
    await wait((q._miss === 1 ? WRONG_LOCK_1 : WRONG_LOCK_2) * SPEED);
    if (cur !== run || token !== showRun) return r;
    state.locked = false;
    return r;
  }

  /* ---- meshed / done（放对：咬合 pop+全链联动预演+确认链单 clip） ---- */
  lastAct = Date.now();                           /* 正确选择重置救援钟（§0.7a） */
  if (state.tut === 'help') {                     /* 教学"独"：首次放对 → 放手 */
    state.tut = 'solo';
    window.__grTutSolo = true;                    /* 帮→独实证（verify 单元②断言；solo 为瞬时态） */
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  state.showUntil = Date.now() + (MESH_MS + CHAIN_MS) * SPEED + 140;
  meshInto(q);                                    /* 判定槽咬合（--dur 转速齿数正比） */
  chimeGoal();
  sfx('coin');
  KIDS.voice.queue([VOICE.right.key]);            /* 确认链：风车转起来啦（单 clip 2088——契约 N） */
  await wait(MESH_MS * SPEED);                    /* 咬合落位主窗 1100 */
  if (cur !== run) return r;
  chainSpin(q);                                   /* 全链逐轮延迟起转（jam 题卡住演出） */
  await wait(CHAIN_MS * SPEED);                   /* 收尾窗：1100+1500=2600 ≥ 2088+300=2388（家族 G/H） */
  if (cur !== run) return r;
  state.locked = false;
  if (r === 'done') {
    if (cur.flat < 0) {                           /* 教学迷你关完成：帮→独后进正式关（watch 期由
                                                     tutorialWatch 接管，不进关） */
      if (state.tut === 'solo') startLevel(firstFlat);
      return 'done';
    }
    winFlow(); return 'done';
  }
  presentQuiz();                                  /* 新机器开题（SPEC §3 每题一台机器） */
  return r;
}

/* ================= 过关推进（关末全速全景 → celebrate → persistWin → 章末/日末）
   persistWin 抽独立函数：verify 页 KIDS 未 init（save=null）安全跳过，
   verify 单元⑪ init 后=真实写档链（localStorage kidsgame_gear） ================= */
function persistWin(stars) {
  const sv = KIDS._save();
  if (!sv || !sv.levels) return { chapterDone: false };   /* verify 沙盒未 init=安全跳过 */
  return KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
}
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关静态章档 GEN[dch-1]
     （家族 F：genLevel 纯函数确定性——预告与实际恒一致，禁 (ci+1)%4） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
/* 关末全速+全景（纯演出层——判定每步即判；FULL_WIN 2400 ≥ gr_right 2088+300=2388
   罩 winFlow 重播；ch4 冲突关末=拆右手柄 .unhands 后全链转——「拆手柄」修好叙事） */
async function fullShow() {
  if (cur && cur.retries === 0) {
    const w0 = wallEl.querySelector('.slot[data-type="W"], .slot[data-type="B"]');
    if (w0) replayAnim(w0, 'breathe');            // 零错加成：链尾槽泛光（纯演出层）
  }
  const bHand = wallEl.querySelector('.slot[data-type="B"]');
  if (bHand) bHand.classList.add('unhands');      // 冲突关末：右手柄拆除（视觉降隐）
  wallEl.querySelectorAll('.slot.jammed').forEach(s => s.classList.remove('jammed'));
  sceneEl.classList.add('panorama');
  wallEl.querySelectorAll('.slot').forEach(s => s.classList.add('fullspeed'));
  await wait(FULL_WIN * SPEED);
  sceneEl.classList.remove('panorama');
}
function winFlow() {
  state.won = true;
  state.locked = true;
  showRun++;                                      /* 通关中止在途演出 */
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  sayR(VOICE.right.key, VOICE.right.text);        /* gr_right：风车转起来啦（2088ms） */
  if (VERIFY) { persistWin(stars); return; }      // verify 页：不弹层不写档（init 沙盒除外——单元⑪）
  fullShow().then(() => KIDS.ui.celebrate(stars)).then(async () => {
    await wait(400);                              /* 家族 H：celebrate 2620+400=3020 ≥ 2088+300=2388 */
    const pr = persistWin(stars);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });   /* 家族 A：winFlow 传 nextHint(null)（b25 形态定版） */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */

/* ================= 教学迷你关（仅关 1-0 首次，SPEC §3 v3：双答演示=两步幽灵手指）

   —— watch 段分账 3324+3660+800+320+500+800+320+2600=12324 ≤ 16000（单步演示款 ≤16s）
   turn clip 1776 → 延 2076（≥1776+300）→ presentQuiz → 帮指（两步分流）---------- */
function tutWatchLevel() {                        // 双题迷你关：题 0=演示题（demo 放对返回 'meshed'）

async function tutorialWatch() {

  const sv = KIDS._save() || {};

  /* 独立 mulberry32 副本（禁调引擎同名函数——生成关 dch/picks 复算独立性） */
  const specMul = a => function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const specRi = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));
  /* 独立 seeded 打散副本（Fisher-Yates 与引擎 shuffled 同构——picks 序对账） */
  const specShuffle = (arr, rnd) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = specRi(rnd, 0, i);
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  /* 关题行序独立复算（SPEC §0.93：静态关章池 rotate (lv+k)%5；生成关 dch=
     mulberry32(flat*7919+847) 首随机数+档池 seeded 无放回抽 5——先取数保确定性）
     返回流状态 rnd：已消耗到**题 0 picks 打散起点**（与引擎 genLevel 严格同构——
     静态关零消耗；生成关首数耗 dch+5 数耗抽序） */
  const specFlow = flat => {
    const rnd = specMul(flat * 7919 + 847);
    const d0 = Math.floor(flat / 5) % 4 + 1;
    const dch = flat < 20 ? d0 : specRi(rnd, 1, 4);
    const lv = flat % 5;
    let rows;
    if (flat < 20) {
      const base = (dch - 1) * 5;
      rows = [];
      for (let k = 0; k < 5; k++) rows.push(base + (lv + k) % 5);
    } else {
      const pool = [(dch - 1) * 5, (dch - 1) * 5 + 1, (dch - 1) * 5 + 2, (dch - 1) * 5 + 3, (dch - 1) * 5 + 4];
      const a = pool.slice();
      rows = [];
      for (let k = 0; k < 5; k++) rows.push(a.splice(specRi(rnd, 0, a.length - 1), 1)[0]);
    }
    return { dch: dch, rows: rows, rnd: rnd };
  };
  /* 单题期望独立推导（行→槽位真值+阶段1 真值+picks 打散+answer；从 SPEC 表+

  const specQuiz = (rowIdx, rnd) => {
    const row = specTable[rowIdx];
    const dt = row.dteeth || 't12';                // 驱动轮齿数（非 speed 恒 t12）
    const dirAns = specDirAnsOf(row);

      const c = row.layout.charAt(k);
      if (c === '_') slots.push({ k: k, type: 'blank', gear: null, teeth: null, dir: null });
      else if (c === 'D') slots.push({ k: k, type: 'D', gear: 'D', teeth: specTeeth[dt], dir: 'cw' });
      else if (c === 'B') slots.push({ k: k, type: 'B', gear: 'B', teeth: specTeeth.t12, dir: 'cw' });
      else if (c === 'W') slots.push({ k: k, type: 'W', gear: 'W', teeth: null, dir: specDirAt(k) });
      else slots.push({ k: k, type: 'fix', gear: row.fixes[k], teeth: specTeeth[row.fixes[k]], dir: specDirAt(k) });
    }

    return { row: row, slots: slots, picks: picks, answer: picks.indexOf(row.need),

  /* ---- ⑤ 错路径（v3 双答两段）：开题锁吞+阶段1 错链/豁免窗/锁+顺序守卫+

  }
  /* 清理：恢复原 localStorage（不污染真实存档）——U12 继续用真实函数 */
  if (origLS === null) localStorage.removeItem('kidsgame_gear');
  else localStorage.setItem('kidsgame_gear', origLS);
  if (saveOk) npass++;
  units.save = { ok: saveOk, detail: saveDetail };

  /* ---- ⑫ realPath：预置存档 v1.0+tutSeen → GR.start(0) 非教学直达题面（契约 E 分流；
     审查 m4：try/finally 保异常时 origLS 也恢复） ---- */
  total++;
  {
    const today = new Date();
    const tstr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    const pre = { v: '1.0', game: 'gear', firstDay: tstr, lastDay: tstr, levels: {},
                  dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 },
                  restTip: { day: '', shown: 0 }, gear: { tutSeen: true } };
    let q12 = null, realOk = false;
    try {
      localStorage.setItem('kidsgame_gear', JSON.stringify(pre));
      KIDS.store.load();                             // 重读预置档
      window.__grDemoR = null;                       // 教学实证清零（非教学路径不应重设）
      window.GR.start(0);
      await unlocked();
      q12 = window.GR.quiz;
      const sf12 = specFlow(0);
      const exp12 = specQuiz(sf12.rows[0], sf12.rnd);
      realOk = state.tut === 'none' && window.__grDemoR === null &&
               q12 && q12.kind === 'dir' && q12.layout === exp12.row.layout && q12.blank === exp12.row.blank &&
               q12.dirAns === exp12.dirAns && q12.answer === exp12.answer && q12.picks.length === 3 &&
               q12.phase === 1 && q12.step === 0 && q12.miss === 0 &&
               window.GR.currentLevel.flat === 0 && window.GR.currentLevel.n === 5 &&
               window.GR.currentLevel.dch === 1 &&
               typeof window.GR.tapDir === 'function' &&   // v3 阶段1 钩子（b29 坑⑥）
               typeof window.GR.tapGear === 'function' &&  // b29 坑⑥：真实页钩子暴露
               (KIDS._save() || {}).v === '1.0';
    } finally {
      /* 收尾清理：恢复原 localStorage + 沙盒 stub（防真实页误写）——异常路径也执行 */
      if (origLS === null) localStorage.removeItem('kidsgame_gear');
      else localStorage.setItem('kidsgame_gear', origLS);
      KIDS._save = function () { return { levels: {} }; };
      KIDS.store.persist = function () {};
    }
    if (realOk) npass++;
    units.realPath = { ok: realOk, tut: state.tut, quiz: q12 && { layout: q12.layout, blank: q12.blank } };
  }

  const out = { game: 'gear', total: total, pass: npass, units: units };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__grVlog = out;                          // 外部断言挂点（任务书钩子）
  document.title = (npass === total) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL ' + (total - npass) + '/' + total;
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text（__lastVoiceKey/__lastVoiceText）并留播报历史
     （__voiceHist）；voice.say 记录 keyless 题面句（__lastSayText——T46 题面句 clip 化
     后题面锚=play 的 __lastVoiceKey/__lastVoiceText）；
     voice.queue 记录拼播链（__lastQueue） */
  window.__voiceHist = [];
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) {
    window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null;
    if (k) window.__voiceHist.push(k);
  };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    window.__lastVoiceKey = parts && parts.length ? parts[0] : null;
  };
  runVerify();
}

</script>
