<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>分类归档小图书</title>
<style>
/* ================= libr 分类归档小图书（batch38 + R48 难度批）=================
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E。
   玩法 = 小图书室归档（SPEC-BATCH38 §0.92/§2 + SPEC-R48）：书架**恒四格**
   （每格主题标签牌：小图标+主题名+主题色——R48 ch1 起即四格）+题面区双形态
   （sort=当前卡大图 / pick=三卡跨维挑书盘，图形为主+名称小字——识字辅助非
   依赖，TTS 双通道）。题面=提示句（say 非队列链，零文字依赖；普通「它住哪
   一格呢」/维度句 R48 去泄漏只述标准/pick「帮X格挑一本新书」反向句）。
   归对=卡片飞入格+书立起（格内已归卡可视化堆叠）+lb_right；归错=卡弹回
   +lb_wrong+错链（lb_hint）+方向级=错链播毕重读题面句（不亮答案本体）。
   ch1 四格普通/ch2 维度句/ch3 冲突深化/ch4 跨维二级题（pick 盘+目标格脉冲）。
   触摸目标：书架格 ≥96×96（实测 ~132×128）、盘卡 ≥96×126；overflowX 恒 0。
   四格主题色互异+标签牌小图标（识别锚=读标签，非颜色歧视）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：图书室（当前卡大图+书架） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;overflow:hidden;padding:6px 12px}
#scene{position:relative;flex:1 1 auto;width:100%;max-width:640px;min-height:230px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,#FDF3E3 0%,#FAE9CF 100%);
  border:3px solid #E5CDA6;border-radius:26px;overflow:hidden;
  box-shadow:inset 0 0 0 5px rgba(255,249,238,.55);padding:10px 12px}
/* 地毯线：图书室地面 */
#scene .ground{position:absolute;left:8%;right:8%;bottom:16px;height:14px;border-radius:50%;
  background:rgba(201,179,138,.3)}

/* 当前卡区：大图（图形为主）+名称小字+提示句（TTS 同源文字） */
#current-zone{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:2}
#card-big{position:relative;width:126px;height:126px;background:#FFF9EE;border:3px solid #4A3B2E;
  border-radius:20px;box-shadow:0 5px 0 #D8C9B4;padding:6px;transition:transform .15s}
#card-big svg{width:100%;height:100%}
/* 卡出场弹入（题面态——契约 M DOM 类层锚：题面态无 away/fly/back） */
#card-big.in{animation:cb-in .45s ease}
@keyframes cb-in{0%{transform:translateY(-18px) scale(.86);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
/* 归对：卡片飞入格（缩落下渐隐——书立起为承载叙事的演出主体） */
#card-big.fly{animation:cb-fly 1s ease forwards}
@keyframes cb-fly{0%{transform:translateY(0) scale(1);opacity:1}
  60%{transform:translateY(46px) scale(.62);opacity:.9}
  100%{transform:translateY(74px) scale(.3);opacity:0}}
/* 归错：卡弹回（摇头弹动——不指正确格本体） */
#card-big.back{animation:cb-back .5s ease}
@keyframes cb-back{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px) rotate(-3deg)}
  75%{transform:translateX(9px) rotate(3deg)}}
#card-name{font-size:20px;font-weight:800;color:#4A3B2E;letter-spacing:2px}
/* ---------- R48 跨维二级题：三卡挑书盘（#card-big 容器切 tray 形态） ---------- */
#card-big.tray{width:auto;max-width:100%;height:auto;background:transparent;border:none;
  box-shadow:none;padding:0;display:flex;gap:10px}
#card-big.tray .tray-card{width:104px;min-height:140px;background:#FFF9EE;border:3px solid #4A3B2E;
  border-radius:16px;box-shadow:0 5px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:8px 6px 6px;transition:transform .15s}
#card-big.tray .tray-card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
#card-big.tray .tray-card svg{width:82px;height:82px}
#card-big.tray .tray-card b{font-size:16px;font-weight:800;color:#4A3B2E;letter-spacing:2px}
/* 挑对：卡飞入目标格（缩落渐隐——书立起为承载叙事的演出主体，同 cb-fly 形态） */
#card-big.tray .tray-card.fly{animation:cb-fly 1s ease forwards}
/* 挑错：卡轻晃弹回（不亮正确卡本体——须靠跨维辨别） */
#card-big.tray .tray-card.miss{animation:cb-back .5s ease}
/* 答案级救援：正确卡高亮呼吸 */
#card-big.tray .tray-card.breathe{animation:tc-hint 1.2s ease-in-out infinite}
@keyframes tc-hint{0%,100%{box-shadow:0 5px 0 #D8C9B4}50%{box-shadow:0 5px 0 #D8C9B4,0 0 16px rgba(232,151,90,.95)}}
/* 盘卡出场弹入（与格弹入同形态） */
#card-big.tray .tray-card.pop{animation:sl-pop .45s ease backwards}
/* pick 题目标格恒亮脉冲（目标格=题面已知量非答案泄漏——答案是卡） */
.shelf-slot.target{border-color:#E8975A;box-shadow:0 5px 0 #D8C9B4,0 0 0 4px rgba(232,151,90,.35);
  animation:sl-target 1.2s ease-in-out infinite}
@keyframes sl-target{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
#hint-line{font-size:15px;color:#8A7B6C;letter-spacing:1px;max-width:420px;text-align:center}
/* 提示牌重亮（方向级反馈/救援：重读维度提示配动效） */
#hint-line.repop{animation:ht-re .6s ease}
@keyframes ht-re{0%,100%{transform:scale(1);color:#8A7B6C}45%{transform:scale(1.08);color:#E8975A}}

/* ---------- 书架：2-4 格（主题标签牌+格内已归书堆叠——进度可见） ---------- */
#shelf{flex:0 0 auto;display:flex;justify-content:center;align-items:stretch;gap:10px;
  width:100%;max-width:600px;position:relative;z-index:2}
#shelf.wig{animation:sh-wig .5s ease}
@keyframes sh-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.4deg)}75%{transform:rotate(1.4deg)}}
#shelf.bump{animation:sh-bump .22s ease}
@keyframes sh-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
.shelf-slot{display:flex;flex-direction:column;flex:1 1 0;min-width:96px;min-height:128px;
  padding:6px 6px 8px;border-radius:16px;gap:3px;
  background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  transition:transform .15s}
.shelf-slot:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
/* 主题标签牌：主题色底+小图标+主题名（识别锚=读标签） */
.shelf-slot .slot-tag{display:flex;align-items:center;justify-content:center;gap:4px;
  padding:3px 6px;border-radius:10px;background:var(--tcol,#F2DDC0)}
.shelf-slot .slot-tag svg{width:26px;height:26px}
.shelf-slot .slot-tag b{font-size:16px;font-weight:800;color:#4A3B2E;letter-spacing:2px}
/* 格内书堆叠（书立起可视化——契约 M 演出层 DOM 锚 .bk） */
.shelf-slot .slot-books{flex:1 1 auto;display:flex;align-items:flex-end;justify-content:center;
  gap:3px;padding:2px 2px 0;min-height:44px;
  border-bottom:5px solid #C9A87C;border-radius:0 0 6px 6px}
.shelf-slot .bk{display:block;width:15px;height:40px;border-radius:3px 3px 1px 1px;
  border:2.2px solid #4A3B2E;position:relative}
.shelf-slot .bk i{position:absolute;left:2.5px;top:5px;width:6px;height:26px;
  border-radius:2px;background:rgba(255,249,238,.75)}
/* 书立起弹立动画（归对时新增书脊） */
.shelf-slot .bk.book-in{animation:bk-in .8s ease}
@keyframes bk-in{0%{transform:translateY(-30px) scaleY(.4);opacity:0}
  55%{transform:translateY(3px) scaleY(1.08);opacity:1}100%{transform:translateY(0) scaleY(1)}}
/* 归对格：亮起一拍（演出层锚 .good——契约 M） */
.shelf-slot.good{animation:sl-good 1.1s ease}
@keyframes sl-good{0%{transform:scale(1)}35%{transform:scale(1.09) translateY(-4px)}100%{transform:scale(1)}}
/* 归错格：轻晃（不指正确格本体） */
.shelf-slot.miss{animation:sl-miss .5s ease}
@keyframes sl-miss{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* 救援答案级：正确格高亮呼吸 */
.shelf-slot.breathe{animation:sl-hint 1.2s ease-in-out infinite}
@keyframes sl-hint{0%,100%{box-shadow:0 5px 0 #D8C9B4}50%{box-shadow:0 5px 0 #D8C9B4,0 0 16px rgba(232,151,90,.95)}}
/* 出场弹入 */
.shelf-slot.pop{animation:sl-pop .45s ease backwards}
@keyframes sl-pop{0%{transform:translateY(26px) scale(.86);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}

#q-text{flex:0 0 auto;font-size:15px;letter-spacing:2px;color:#8A7B6C;padding:0 0 6px}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，教学演示/帮共用；照家族形态） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：舞台收紧+格横排收窄 */
@media (orientation:portrait){
  #scene{min-height:200px;max-width:470px;gap:6px;padding:8px 8px}
  #card-big{width:104px;height:104px}
  #card-name{font-size:18px}
  #hint-line{font-size:13px;max-width:330px}
  #shelf{gap:8px;max-width:440px}
  .shelf-slot{min-width:96px;min-height:118px;padding:4px 4px 6px}
  .shelf-slot .slot-tag b{font-size:14px}
  .shelf-slot .slot-tag svg{width:22px;height:22px}
  .shelf-slot .bk{width:12px;height:34px}
  .shelf-slot .bk i{left:2px;top:4px;width:4.5px;height:22px}
  /* R48 挑书盘竖屏收紧（触摸目标 ≥96 保持） */
  #card-big.tray{gap:8px}
  #card-big.tray .tray-card{width:96px;min-height:126px;padding:6px 4px 5px}
  #card-big.tray .tray-card svg{width:72px;height:72px}
  #card-big.tray .tray-card b{font-size:14px}
}
</style>
</head>
<body>
<div id="game" aria-label="分类归档小图书">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="小图书室归档">
      <div class="ground" aria-hidden="true"></div>
      <div id="current-zone" aria-hidden="true">
        <div id="card-big"></div>
        <div id="card-name"></div>
        <div id="hint-line"></div>
      </div>
      <div id="shelf" aria-label="书架：点一格把书放回家"></div>
    </div>
    <div id="q-text" aria-hidden="true"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

}

/* ================= libr 纯引擎：确定性关卡生成 + 点格/点卡判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 837)（本款常量 837，SPEC-BATCH38 §0.92/§2 定版，
   R48 沿用不变——rnd 流变化仅因 R48 消耗序列扩程，见 SPEC-R48 §R3）：
   同 flat 永远同关（重玩一致、verify 可检）。
   取题（SPEC-R48 §R4 题库封闭 20 题=4 章×5；每关 5 题）：
     静态关 flat<20：章 ch 的 5 题按关内偏移 rotate——row=(ch-1)*5+((lv+qi)%5)
     （20 静态关覆盖全 20 题各 5 次）；
     生成关 flat≥20：dch=ri(rnd,1,4) seeded 随机（域全档成立型——SPEC §0.92
     生成关策略=b33 硬性②显式声明：mulberry32 第一个随机数，先取数保确定性），
     从**本章题池** seeded 无放回抽 5（R48：池按 dch 分章 rows[(dch-1)*5..dch*5-1]
     ——ch1 普通/ch2 维度句/ch3 冲突/ch4 pick 四型池各自封闭）。
   书架格序：R48 恒四格（THEMES 全 4）——每关 seeded shuffle 一次、关内 5 题
   恒同序（书架=物理归档载体，格序稳定；跨关换序——禁位置学习，孩子须读主题
   标签牌=信息素养核心锚）。
   rnd 消耗顺序恒定（SPEC-R48 §R3 pycheck 位级复刻依据）：生成关先抽 dch →
   （抽题，仅生成关）→ 格序 shuffle（4 元素 3 次）→ pick 题盘序 shuffle
   （按题序每 pick 题 3 元素 2 次）。
   answer：sort 题=正确格下标（=shelf.indexOf(本题主题)——SPEC §2 唯一解锚，
   verify 从 shelf+卡主题独立推导复算，禁读 quiz.answer 直比）；pick 题=盘内
   正确卡下标（cards.indexOf(唯一属目标格的卡)——verify 独立推导）。
   quiz 结构：{ row(0-19), kind('sort'|'pick'),
     sort: { card(卡 id), label(卡名), theme(唯一归属主题 id),
             hint('none'|'farm'|'eat'|'pet'|'wear'——维度行 DIM2_TARGET 定约),
             say/sayKey(普通句 lb_hint|维度句 lb_d2_*) },
     pick: { target(目标格主题 id), theme(=target), cards(盘序 3 卡 id),
             hint:'none', say/sayKey(挑书句 lb_pick_*) },
     共: shelf(格序主题 id 数组·关内共享), answer, _miss, _answered }
   铁律：每关 5 题；每题唯一解（sort=唯一归属格/pick=候选集恰一张属目标格
   ——structWhy 校验）；miss 在本判定层计（b34 坑①：UI guard 判定前拦+预判
   与 core 严格同构——engTapShelf/engTapCard 双入口同构）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }

}
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 单题构建：sort 题（题库行 + 关内格序）；answer=shelf.indexOf(主题)
   维度行 say/sayKey=DIM2 表（R48 去泄漏句+新键 lb_d2_*，普通句复用 lb_hint） ---------- */
function buildQuiz(row, shelfOrder) {
  const qs = QUESTIONS[row];
  const card = CARDS[qs.card];
  const answer = shelfOrder.indexOf(card.theme);
  return { row: row, kind: 'sort', card: qs.card, label: card.label, theme: card.theme,
           say: qs.hint === 'none' ? NORM_HINT : DIM2_HINTS[qs.hint],
           sayKey: qs.hint === 'none' ? VOICE.hint.key : DIM2_KEYS[qs.hint],
           hint: qs.hint, shelf: shelfOrder, answer: answer,
           _miss: 0, _answered: false };
}
/* ---------- pick 题构建（R48 跨维二级题）：tray=表内候选集 seeded 盘序；
   answer=盘内唯一属目标格卡的下标（独立推导锚——恰一张，structWhy 校验） ---------- */
function buildPick(row, shelfOrder, tray) {
  const qs = QUESTIONS[row];
  let answer = -1;
  for (let k = 0; k < tray.length; k++)
    if (CARDS[tray[k]].theme === qs.pick) { answer = k; break; }
  return { row: row, kind: 'pick', target: qs.pick, theme: qs.pick,
           cards: tray, label: '',
           say: PICK_HINTS[qs.pick], sayKey: PICK_KEYS[qs.pick],
           hint: 'none', shelf: shelfOrder, answer: answer,
           _miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   生成关 seeded 无放回抽 5（顺序即题序）；R48 池按 dch 分章（四型池各自封闭） ---------- */
function pickRows(dch, rnd) {
  const pool = [];
  for (let r = (dch - 1) * 5; r < dch * 5; r++) pool.push(r);
  const a = pool.slice(), out = [];
  for (let k = 0; k < CH_LEN; k++) out.push(a.splice(ri(rnd, 0, a.length - 1), 1)[0]);
  return out;
}
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 837);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  let rows;
  if (flat < STATIC_LEVELS) {
    const base = (dch - 1) * 5;                              // 静态关 dch===ch：章池 rotate
    rows = [];
    for (let k = 0; k < CH_LEN; k++) rows.push(base + (lv + k) % 5);
  } else {
    rows = pickRows(dch, rnd);                               // 生成关：本章池 seeded 抽 5
  }
  const shelfOrder = shuffled(THEMES.slice(0, 4).map(t => t.id), rnd);   // R48 恒四格；关内格序一次定
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) {
    const qrow = rows[qi];
    quizzes.push(QUESTIONS[qrow].pick
      ? buildPick(qrow, shelfOrder, shuffled(QUESTIONS[qrow].cards, rnd))   // pick 题：盘序 seeded（rnd 序=题序）
      : buildQuiz(qrow, shelfOrder));
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, rows: rows, shelf: shelfOrder,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点格/点卡引擎（无 DOM，R48 双入口同构——b34 坑①判定层唯一真值）
   engTapShelf(L, i) —— sort 题：点书架第 i 格归档当前卡（pick 题格非作答面=null）
   engTapCard(L, i)  —— pick 题：点挑书盘第 i 张卡（sort 题盘非作答面=null）
   返回值两入口同构：'shelved' 对且非末题推进 / 'done' 对且末题=通关
   'wrong' 错（该题 miss+1——retries 全关累计=星级口径；可重点，探索不罚）
   null    非法下标 / 关卡已结束 / 本题已答 / 题型不匹配 ---------- */
function engTapShelf(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (q.kind === 'pick') return null;                         // pick 题：格非作答面
  if (!Number.isInteger(i) || i < 0 || i >= q.shelf.length) return null;
  if (i === q.answer) {
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'shelved';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
function engTapCard(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (q.kind !== 'pick') return null;                        // sort 题：盘非作答面
  if (!Number.isInteger(i) || i < 0 || i >= q.cards.length) return null;
  if (i === q.answer) {
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'shelved';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（SPEC §0.92 miss 口径：归错计）：全关归错 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：当前题答案体下标（sort=正确格/pick=正确卡；独立函数供 verify 复核） */
const correctIdx = q => !q ? -1 : q.answer;

/* ---------- 结构校验（verify 用，返回失败原因或 null）：row 域 / 恒四格 /
   格序=主题集排列 / answer 独立复算（sort=shelf.indexOf(主题)；pick=盘内
   唯一目标卡下标）/ 字段与题库行一致（含 DIM2_TARGET 定约）/ 初始态干净 ---------- */
function structWhy(q, dch) {
  if (!q) return 'quiz';
  if (!Number.isInteger(q.row) || q.row < 0 || q.row >= QUESTIONS.length) return 'row';
  const qs = QUESTIONS[q.row];
  if (q.shelf.length !== 4) return 'shelfN';                  // R48 恒四格
  const expSet = THEMES.slice(0, 4).map(t => t.id).sort().join('|');
  if (q.shelf.slice().sort().join('|') !== expSet) return 'shelfPerm';   // 格序=主题集排列
  if (q.kind === 'pick') {
    if (!qs.pick) return 'kind';                              // 行非 pick 而题 pick=表行错位
    if (q.target !== qs.pick || q.theme !== qs.pick) return 'target';
    if (!Array.isArray(q.cards) || q.cards.length !== 3) return 'cards';
    const sameSet = q.cards.slice().sort().join('|') === qs.cards.slice().sort().join('|');
    if (!sameSet) return 'cards';
    let hit = -1, n = 0;                                      // 恰一张属目标格（SPEC-R48 §R4 定约）
    for (let k = 0; k < q.cards.length; k++)
      if (CARDS[q.cards[k]].theme === qs.pick) { hit = k; n++; }
    if (n !== 1 || q.answer !== hit) return 'answer';
    if (q.say !== PICK_HINTS[qs.pick]) return 'say';
    if (q.hint !== 'none' || q.label !== '') return 'hint';
  } else {
    if (q.kind !== 'sort') return 'kind';
    if (qs.pick) return 'kind';                               // 行 pick 而题 sort=表行错位
    const card = CARDS[qs.card];
    let exp = q.shelf.indexOf(card.theme);
    if (q.answer !== exp) return 'answer';                    // answer=shelf.indexOf(主题) 复算
    if (q.card !== qs.card || q.theme !== card.theme || q.label !== card.label) return 'card';
    if (q.hint !== qs.hint) return 'hint';                    // hint 维度与题库行一致
    if (qs.hint !== 'none' && card.theme !== DIM2_TARGET[qs.hint]) return 'dimtarget';   // 维度裁定定约
    const expSay = qs.hint === 'none' ? NORM_HINT : DIM2_HINTS[qs.hint];
    if (q.say !== expSay) return 'say';                       // 提示句与句表一致
  }
  if (q._miss !== 0 || q._answered) return 'dirty';
  return null;
}

    if (!spec.pick && spec.hint === 'none' && say !== SPEC_NORM) { poolBad = 'norm ' + i; break; }
  }
  /* 冲突行计数（AUDIT-67「冲突卡升半数以上」——独立从 SPEC 表数，非读实现） */
  const conflictN = SPEC_QUESTIONS.filter(s => !s.pick && s.hint !== 'none').length;
  const conflictOk = conflictN === 11 && conflictN > 10 &&
                     QUESTIONS.filter(q => !q.pick && q.hint !== 'none').length === conflictN;
  /* 维度句表+挑书句表双录（SPEC_DIM2/SPEC_PICK 独立硬编码对账） */
  const dimOk = DIM2_HINTS.farm === SPEC_DIM2.farm && DIM2_HINTS.eat === SPEC_DIM2.eat &&
                DIM2_HINTS.pet === SPEC_DIM2.pet && DIM2_HINTS.wear === SPEC_DIM2.wear &&
                DIM2_TARGET.farm === SPEC_DIM2_TARGET.farm && DIM2_TARGET.eat === SPEC_DIM2_TARGET.eat &&
                DIM2_TARGET.pet === SPEC_DIM2_TARGET.pet && DIM2_TARGET.wear === SPEC_DIM2_TARGET.wear &&
                PICK_HINTS.animal === SPEC_PICK.animal && PICK_HINTS.food === SPEC_PICK.food &&
                PICK_HINTS.clothes === SPEC_PICK.clothes && PICK_HINTS.vehicle === SPEC_PICK.vehicle;
  /* 20 题覆盖审计：静态 20 关每题恰现 5 次（§0.92 取题域全档成立——覆盖口径
     不锁取材序：只数每行出现次数，不验出现位置） */
  const cnt = {};
  for (let flat = 0; flat < 20; flat++) {
    const L = genLevel(flat);
    L.quizzes.forEach(q => { cnt[q.row] = (cnt[q.row] || 0) + 1; });
  }
  const coverOk = Object.keys(cnt).length === 20 && SPEC_QUESTIONS.every((s, i) => cnt[i] === 5);
  const poolOk = !poolBad && conflictOk && dimOk && coverOk;
  if (poolOk) npass++;
  units.pool = { ok: poolOk, bad: poolBad, conflict: conflictOk, conflictN: conflictN,
                 dims: dimOk, cover: coverOk };

  /* ---- ⑦ stars：星级口径（0=3★/1-2=2★/≥3=1★，永不 0 星） ---- */
  total++;
  const LA = genLevel(10);
  LA.retries = 0; const st3 = engStars(LA) === 3;
  LA.retries = 1; const st2a = engStars(LA) === 2;
  LA.retries = 2; const st2b = engStars(LA) === 2;
  LA.retries = 3; const st1 = engStars(LA) === 1;
  LA.retries = 9; const stFloor = engStars(LA) === 1;   // 永不 0 星
  const starsOk = st3 && st2a && st2b && st1 && stFloor;
  if (starsOk) npass++;
  units.stars = { ok: starsOk, st3: st3, st2: st2a && st2b, st1: st1, floor: stFloor };

  /* ---- ⑧ gen：生成关 flat20+（seeded ri(rnd,1,4) 独立复算+四档全现+本章池域+确定性
       +无放回+分布断言（r39-bis：洗牌必配直方图，下界独立推导）） ---- */
  total++;
  const genBad = [];
  const genDch = {};
  for (let flat = 20; flat < 40; flat++) {
    const rnd = mulberry32V(flat * 7919 + 837);      // SPEC §0.92：独立重写 rng（python 式复刻）
    const expDch = 1 + Math.floor(rnd() * 4);        // dch=第一个随机数（先取数保确定性）
    const L = genLevel(flat), L2 = genLevel(flat);
    if (L.dch !== expDch) genBad.push(flat + ':dch ' + L.dch + '!=' + expDch);
    if (JSON.stringify(L.quizzes) !== JSON.stringify(L2.quizzes)) genBad.push(flat + ':det');
    const cfgN = SPEC_CH[L.dch].n;                   // 格数域：恒 4
    if (!L.quizzes.every(q => q.shelf.length === cfgN)) genBad.push(flat + ':slotsN');
    /* 池域：联合反查 SPEC 行号落本章池 rows[(dch-1)*5..dch*5-1]（R48 四型池分章）——b36 坑③反查口径 */
    if (!L.quizzes.every(q => {
      const row = rowOfV({ kind: q.kind, card: q.card, hint: q.hint, target: q.target, cards: q.cards });
      return row >= 0 && row >= (L.dch - 1) * 5 && row < L.dch * 5;
    })) genBad.push(flat + ':pool');
    const set = {};
    L.quizzes.forEach(q => { set[q.row] = 1; });
    if (Object.keys(set).length !== 5) genBad.push(flat + ':dupRow');             // 无放回抽 5 题
    genDch[L.dch] = (genDch[L.dch] || 0) + 1;
  }
  const distOk = [1, 2, 3, 4].every(d => genDch[d] > 0);   // 四档全现（域全档成立型）
  /* 分布断言（全域 40 关谱确定性直方图——下界从均匀期望独立推导）：
     sort 答案位 4 桶：期望 140/4=35，下界=floor(35/2)=17；
     pick 盘序答案位 3 桶：期望 60/3=20，下界=floor(20/2)=10；
     pick 目标 4 主题：静态 rotate 数学下界=每行恰现 5 次（可证）→ 每目标 ≥5 */
  const sortHist = [0, 0, 0, 0], pickHist = [0, 0, 0], pickTgt = {};
  let pickTotal = 0;
  for (let flat = 0; flat < 40; flat++) {
    const L = genLevel(flat);
    L.quizzes.forEach(q => {
      if (q.kind === 'pick') {
        pickHist[q.answer]++; pickTotal++;
        pickTgt[q.target] = (pickTgt[q.target] || 0) + 1;
      } else sortHist[q.answer]++;
    });
  }
  const histOk = sortHist.every(v => v >= 17) && pickHist.every(v => v >= 10) &&
                 ['animal', 'food', 'clothes', 'vehicle'].every(t => (pickTgt[t] || 0) >= 5);
  const genOk = genBad.length === 0 && distOk && histOk;
  if (genOk) npass++;
  units.gen = { ok: genOk, bad: genBad.slice(0, 5), dist: genDch,
                hist: { sort: sortHist, pick: pickHist, pickTgt: pickTgt, pickTotal: pickTotal } };

  /* ---- ⑨ windows+contract：窗静态断言（SPEC §4 实长表）+契约源码断言+双录+nextHint 实算 ---- */
  total++;
  const src = document.querySelectorAll('script')[2].textContent;
  const coreSrc = document.querySelectorAll('script')[0].textContent;
  const D = SPEC_DUR;
  const winOk = WRONG_CHAIN_WIN === 4170 &&                            // 豁免窗 ==4170 精确
                WRONG_CHAIN_WIN === D.lb_wrong + 150 + D.lb_hint + 300 &&   // =1728+150+1992+300
                CELE_WIN === 1836 && CELE_WIN === D.lb_right + 300 &&  // 确认窗=1536+300 精确
                SHELVE_MS === 1000 && SHELVE_MS + CELE_WIN === 2836 &&  // 书立起+确认=归对演出锁
                BOUNCE_MS <= D.lb_wrong + 150 &&                        // 首错锁 ≤1878（b37 R3）
                TUT_WATCH_WAIT >= D.lb_tut_watch + 300 &&              // watch 延 ≥3276
                TUT_TURN_WAIT >= D.lb_tut_turn + 300 &&                // turn 延 ≥2076
                (2620 + 400) >= D.lb_right + 300 &&                    // celebrate 3020 ≥ 1836
                estMsV('它住哪一格呢') === 6 * 345 + 600 &&        // estMs 全字符口径（普通句 6 字）
                estMsV('它住在农场里') === 6 * 345 + 600 &&        // R48 维度句（去泄漏版）
                estMsV('我们能吃它') === 5 * 345 + 600 &&          // R48 维度句最短
                estMsV('它是我们的好朋友') === 8 * 345 + 600 &&    // R48 维度句最长
                estMsV('天冷了要穿上它') === 7 * 345 + 600 &&
                estMsV('帮动物格挑一本新书') === 9 * 345 + 600;    // R48 pick 句 9 字
  const srcA = src.indexOf('KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) })') >= 0 &&
               src.indexOf('KIDS.ui.dayEnd({ nextHint: nextHint(null) })') >= 0;   // A：启动 lim-1+winFlow null
  const srcB = src.indexOf('lastDir') >= 0 && src.indexOf('lastAct') >= 0 &&
               src.indexOf('if (idle > 14000 && Date.now() - lastDir > 14000)') >= 0 &&
               src.indexOf('idle > 30000') >= 0;   // B：救援双锚（14s 方向级独立节流/30s 答案级）
  const srcC = coreSrc.indexOf("VER = '1.0'") >= 0 &&                       // C：存档版本 1.0（core）
               coreSrc.indexOf("'kidsgame_' + cfg.game") >= 0 &&            // C：存档键名
               src.indexOf("KIDS.init({ game: 'libr'") >= 0;               // C：本款存档键 kidsgame_libr
  const srcE = src.indexOf('sv.libr && sv.libr.tutSeen') >= 0;   // E：行为分流先查教学特例
  const srcF = src.indexOf('GEN_HINTS[genLevel(f + 1).dch - 1]') >= 0 &&   // F：生成关实算 dch-1
               src.indexOf('(ci + 1)' + ' % 4') < 0;   // 禁章序右移（检索串拼接防 verify 源码自匹配）
  const srcI = src.indexOf('wrongChainUntil = Date.now() + WRONG_CHAIN_WIN') >= 0 &&
               src.indexOf('if (Date.now() < wrongChainUntil) return;') >= 0 &&
               src.indexOf('lastWrongVoice = 0; wrongChainUntil = 0;') >= 0 &&   // I：豁免窗+救援守卫+重置
               src.indexOf('wrongChainUntil && Date.now() < wrongChainUntil && i !== q.answer') >= 0;   // I 补：豁免窗 guard
  const srcJ = src.indexOf('now - lastWrongVoice > 10000') >= 0 &&          // J：语义句 10s 节流在场
               src.indexOf('cur.flat < 3') >= 0;                            // J b36 m3：教学迷你关每错必播
  const srcK = src.indexOf("if (document.querySelector('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel')) return;") >= 0 &&
               src.indexOf('function rescueTick()') >= 0;   // K：面板守卫+命名函数
  const srcD = src.indexOf("replayAnim(shelfEl, 'bump')") >= 0;           // D：吞输入轻叮配容器 bump
  /* SPEC §2/R48 方向级反馈=错链播毕重读题面句（clip 化 play——检索锚与 main 真源核对） */
  const srcDir = src.indexOf('KIDS.voice.play(q.sayKey, q.say)') >= 0 &&
                 src.indexOf('hintResayTimer') >= 0 &&
                 src.indexOf('WRONG_CHAIN_WIN + 60') >= 0;
  /* R48 双题型引擎锚：点卡入口/盘事件分流/答案体定位/维度定约（检索字面与真源核对） */
  const srcR48 = src.indexOf('function engTapCard(L, i)') >= 0 &&
                 src.indexOf('tapCard(i) { return uiTapCard(i); }') >= 0 &&
                 src.indexOf("e.target.closest('.tray-card')") >= 0 &&
                 src.indexOf('const answerElOf') >= 0 &&
                 src.indexOf('DIM2_TARGET[qs.hint]') >= 0 &&
                 src.indexOf("q.kind === 'pick' ? await uiTapCard(q.answer) : await uiTapShelf(q.answer)") >= 0;
  const srcHint = CHAPTERS[1].hint === SPEC_CHAPTER_HINTS[1] &&   // 双录独立硬编码对账
                  CHAPTERS[2].hint === SPEC_CHAPTER_HINTS[2] &&
                  CHAPTERS[3].hint === SPEC_CHAPTER_HINTS[3] &&
                  CHAPTERS[4].hint === SPEC_CHAPTER_HINTS[4] &&
                  GEN_HINTS[0] === SPEC_GEN_HINTS[0] && GEN_HINTS[1] === SPEC_GEN_HINTS[1] &&
                  GEN_HINTS[2] === SPEC_GEN_HINTS[2] && GEN_HINTS[3] === SPEC_GEN_HINTS[3] &&
                  nextHint(4) === SPEC_CHAPTER_HINTS[1] && nextHint(9) === SPEC_CHAPTER_HINTS[2] &&
                  nextHint(14) === SPEC_CHAPTER_HINTS[3] && nextHint(19) === SPEC_CHAPTER_HINTS[4] &&   // 章末关 ci<4 → CHAPTERS[ci+1].hint（hint 字段语义=预告下一章）
                  nextHint(20) === GEN_HINTS[genLevel(21).dch - 1] &&
                  [24, 29, 34, 39].every(f => nextHint(f) === GEN_HINTS[genLevel(f + 1).dch - 1]);   // F：实算（b35 m5 范式）
  const srcSpeed = SPEED === 0.12;                       // verify 提速
  const contractOk = srcA && srcB && srcC && srcD && srcE && srcF && srcI && srcJ && srcK && srcDir && srcR48 && srcHint && srcSpeed;
  const winUnitOk = winOk && contractOk;
  if (winUnitOk) npass++;
  units.windows = { ok: winUnitOk, win: winOk, A: srcA, B: srcB, C: srcC, D: srcD, E: srcE, F: srcF,
                    I: srcI, J: srcJ, K: srcK, dir: srcDir, r48: srcR48, hints: srcHint };

  /* ---- ⑩ confirmChain：确认链构成（__lastQueue===['lb_right'] 单 clip；题面提示句走
       voice.play 不动 __lastQueue——SPEC §2 明示 say 非队列链；flat20 生成关 dch3 首题
       egg/eat 维度句——双题型确认链同构验证由 ⑤b pick 段 passP 补充） ---- */
  total++;
  startLevel(20);
  await unlocked();
  const q10 = window.LB.quiz;
  const goodI10 = deriveAnswerV(q10);
  const h0 = window.__queueHist.length;      // 订阅起点
  const r10 = q10.kind === 'pick' ? await window.LB.tapCard(goodI10) : await window.LB.tapShelf(goodI10);
  const LQ = window.__lastQueue;
  const chainOk10 = r10 === 'shelved' &&
                    LQ && LQ.length === 1 && LQ[0] === 'lb_right' &&        // 确认链=right 单 clip
                    JSON.stringify(LQ) === JSON.stringify(['lb_right']) &&
                    !keylessLast(LQ) &&                                     // 全 clip 无 keyless（契约 N）
                    window.__queueHist.slice(h0).some(h =>
                      h.length === 1 && h[0] === 'lb_right');
  if (chainOk10) npass++;
  units.confirmChain = { ok: chainOk10, r: r10,
                         queue: LQ && LQ.map(p => typeof p === 'string' ? p : JSON.stringify(p)) };

  /* ---- ⑪ save：真实写档链（init libr→autoSolve 通关→localStorage 更新，测后还原） ---- */
  total++;
  const origSave = window.__lbOrig.save, origPersist = window.__lbOrig.persist;
  const origLS = localStorage.getItem('kidsgame_libr');
  let saveOk = false, saveDetail = '';
  try {
    KIDS._save = origSave;                       // 还原真函数（init 用）
    KIDS.store.persist = origPersist;
    localStorage.removeItem('kidsgame_libr');
    KIDS.init({ game: 'libr', title: '分类归档小图书' });   // 真实 init：store.load 新档 v1.0
    startLevel(0);                               // verify 页 freshTut 恒 false → 直接开题
    const a11 = await window.LB.autoSolve();     // 真实判定链通关 → winFlow verify 分支 persistWin
    const raw = localStorage.getItem('kidsgame_libr');
    const j = raw ? JSON.parse(raw) : null;
    saveOk = !!(a11.done && a11.taps === 5 && j && j.v === '1.0' && j.game === 'libr' &&
                j.levels && j.levels['1-0'] &&
                j.levels['1-0'].stars === 3 && j.levels['1-0'].plays === 1);
    if (!saveOk) saveDetail = JSON.stringify({ taps: a11.taps, raw: raw && raw.slice(0, 200) });
  } catch (err) {
    saveDetail = 'ERR ' + (err && err.message);
  }
  /* 清理：恢复原 localStorage（不污染真实存档）——U12 继续用真实函数 */
  if (origLS === null) localStorage.removeItem('kidsgame_libr');
  else localStorage.setItem('kidsgame_libr', origLS);
  if (saveOk) npass++;
  units.save = { ok: saveOk, detail: saveDetail };

  /* ---- ⑫ realPath：预置存档 v1.0+tutSeen → start(0) 非教学直达题面（契约 E 分流；
     R48 恒四格——shelf.length===4；审查 m4：try/finally 保异常时 origLS 也恢复） ---- */
  total++;
  const today = new Date();
  const tstr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  const pre = { v: '1.0', game: 'libr', firstDay: tstr, lastDay: tstr, levels: {},
                dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 },
                restTip: { day: '', shown: 0 }, libr: { tutSeen: true } };
  let q12 = null, realOk = false;
  try {
    localStorage.setItem('kidsgame_libr', JSON.stringify(pre));
    KIDS.store.load();                             // 重读预置档
    window.__lbDemoR = null;                       // 教学实证清零（非教学路径不应重设）
    window.LB.start(0);
    await unlocked();
    q12 = window.LB.quiz;
    realOk = state.tut === 'none' && window.__lbDemoR === null &&
             q12 && q12.kind === 'sort' && q12.card === 'cat' && q12.shelf.length === 4 &&
             q12.step === 0 && q12.miss === 0 &&
             q12.say === SPEC_NORM &&
             q12.answer === deriveAnswerV(q12) &&        // answer 独立推导
             window.LB.currentLevel.flat === 0 && window.LB.currentLevel.n === 5 &&
             (KIDS._save() || {}).v === '1.0' &&
             typeof window.LB === 'object' && typeof window.LB.tapShelf === 'function' &&
             typeof window.LB.tapCard === 'function' &&   // R48 双题型钩子真实页同暴露（b29 坑⑥）
             typeof window.LB.autoSolve === 'function';        // b29 坑⑥：钩子真实页同暴露
  } finally {
    /* 收尾清理：恢复原 localStorage + 沙盒 stub（防真实页误写）——异常路径也执行 */
    if (origLS === null) localStorage.removeItem('kidsgame_libr');
    else localStorage.setItem('kidsgame_libr', origLS);
    KIDS._save = function () { return { levels: {} }; };
    KIDS.store.persist = function () {};
  }
  if (realOk) npass++;
  units.realPath = { ok: realOk, tut: state.tut,
                     quiz: q12 && { kind: q12.kind, card: q12.card, n: q12.shelf.length } };

  const out = { game: 'libr', total: total, pass: npass, units: units };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__lbVlog = out;                          // __vlog 计数（外部断言挂点，任务书钩子）
  document.title = (npass === total) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL ' + (total - npass);
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text 并留播报历史（题面句锚=（__lastVoiceKey/
     __lastVoiceText——R48 含未注册新键 lb_d2_* 与 lb_pick_*，stub 照记）；voice.say
     记录 keyless 残留句（__lastSayText——防回归锚，改造后应恒 undefined）；
     voice.queue 记录拼播链（__lastQueue+__queueHist 全史） */
  window.__voiceHist = [];
  window.__queueHist = [];
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) {
    window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null;
    if (k) window.__voiceHist.push(k);
  };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    if (parts) window.__queueHist.push(parts);
    window.__lastVoiceKey = parts && parts.length
      ? (typeof parts[0] === 'string' ? parts[0] : parts[0].key) : null;
  };
  runVerify();
}
