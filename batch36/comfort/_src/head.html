<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>安慰选择</title>
<style>
/* ================= comfort 安慰选择（batch36 · r11 难度改造 2026-09-14）=================
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E。
   玩法 = 情景卡选做法（SPEC-BATCH36 §6）：舞台小动物朋友伤心
   （角色 SVG+眼泪+耷拉），题面=情景句 keyless TTS（say 非队列链，
   零文字依赖）；best2 题题面后播方向锚 co_pick「都很好，哪个现在最好」
   （不指认）；下方 2-3 张做法卡（图+短词，tier=best/gray/bad）：
   选 best=朋友破涕为笑+#outcome 问题解决小动画+right+co_right；
   选 gray（有点用但不是最好）=朋友半好 meh（不哭了但还没开心）+
   #outcome 部分缓解+co_gray「这样有点用，还有更好的办法」+miss；
   选 bad=wrong+miss+「这样朋友会更难过哦」（SEL 铁律：温和指向行为后果）。
   ch1-2 择优二选（1 best 1 gray）/ ch3-4 梯度三选（1 best 1 gray 1 bad）。
   触摸目标：做法卡 ≥96×96（实测 ~160）；overflowX 恒 0。
   三 tier 卡视觉同构（不靠颜色歧视——语义承载在图+语音）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：朋友演出区（伤心→半好→破涕为笑，r11 三态后果链） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;overflow:hidden;padding:6px 12px}
#scene{position:relative;flex:1 1 auto;width:100%;max-width:560px;min-height:230px;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:2px;
  background:linear-gradient(180deg,#FDF3E3 0%,#FAE9CF 100%);
  border:3px solid #E5CDA6;border-radius:26px;overflow:hidden;
  box-shadow:inset 0 0 0 5px rgba(255,249,238,.55)}
/* 地面线：朋友站的地方 */
#scene .ground{position:absolute;left:8%;right:8%;bottom:34px;height:14px;border-radius:50%;
  background:rgba(201,179,138,.35)}
#friend{width:168px;height:156px;pointer-events:none;position:relative;z-index:2}
#friend svg{width:100%;height:100%}
/* 表情组切换（容器类控 mood：sad 题面态 / meh 灰卡后果半好态（r11）/
   happy 破涕为笑——契约 M DOM 类层锚） */
#friend .fx-happy,#friend .fx-meh{display:none}
#friend.meh .fx-sad{display:none}
#friend.meh .fx-meh{display:block}
#friend.happy .fx-sad,#friend.happy .fx-meh{display:none}
#friend.happy .fx-happy{display:block}
/* 伤心出场：轻微耷拉呼吸（下缩+慢摆） */
#friend.sad{animation:fr-droop 2.2s ease-in-out infinite}
@keyframes fr-droop{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(4px) scale(1.015,.97)}}
/* 更难过（点坏卡瞬间：加深耷拉一拍） */
#friend.sadder{animation:fr-sadder .5s ease}
@keyframes fr-sadder{0%,100%{transform:translateY(0)}40%{transform:translateY(12px) rotate(-2deg)}}
/* 半好（r11 点灰卡后果：不哭了但还没开心——缓慢轻晃，头微抬） */
#friend.meh{animation:fr-meh 1.8s ease-in-out infinite}
@keyframes fr-meh{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(2px) rotate(1.2deg)}}
/* 破涕为笑：开心跳两下 */
#friend.happy{animation:fr-joy .55s ease 2}
@keyframes fr-joy{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px) scale(1.04)}}
/* 眼泪（fx-sad 组内，下落循环；meh/happy 态整组隐藏无泪） */
#friend .tear{animation:tear-fall 1.5s ease-in infinite}
#friend .tear.t2{animation-delay:.75s}
@keyframes tear-fall{0%{transform:translateY(0);opacity:0}25%{opacity:1}85%{opacity:1}100%{transform:translateY(26px);opacity:0}}
/* 后果气泡（r11 选择-后果因果链：best=问题解决/gray=部分缓解；data-out 控内容） */
#outcome{position:absolute;left:14px;top:12px;width:76px;height:76px;z-index:4;
  opacity:0;transform:scale(.5);transition:opacity .45s,transform .45s;pointer-events:none}
#outcome.show{opacity:1;transform:scale(1)}
#outcome svg{width:100%;height:100%}
/* 情景道具（舞台右下小图标） */
#prop{position:absolute;right:16px;bottom:14px;width:56px;height:56px;z-index:1;opacity:.95}
#prop svg{width:100%;height:100%}
/* 星星彩带（破涕为笑演出层：JS 撒 6 颗） */
.spark{position:absolute;z-index:5;pointer-events:none;width:22px;height:22px;
  animation:spark-fly .9s ease-out forwards}
@keyframes spark-fly{0%{transform:translateY(0) scale(.4);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
#q-text{flex:0 0 auto;font-size:15px;letter-spacing:2px;color:#8A7B6C;padding:0 0 6px}

/* ---------- 做法 2-3 张：大卡（图+短词），≥96×96 ---------- */
#cards{flex:0 0 auto;display:flex;justify-content:center;align-items:stretch;gap:18px;
  width:100%;max-width:760px;padding:4px 14px 10px}
#cards.wig{animation:cds-wig .5s ease}
@keyframes cds-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.6deg)}75%{transform:rotate(1.6deg)}}
#cards.bump{animation:cds-bump .22s ease}
@keyframes cds-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  width:210px;min-height:158px;padding:10px 12px 12px;border-radius:22px;
  background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  transition:transform .15s}
.card-wrap:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card-wrap .art{width:104px;height:76px;pointer-events:none}
.card-wrap .art svg{width:100%;height:100%}
.card-wrap .word{font-size:21px;font-weight:800;color:#4A3B2E;letter-spacing:1px}
/* 好卡被选中：亮起+心跳（演出层锚 .good——契约 M） */
.card-wrap.good{animation:cd-good 1.1s ease}
@keyframes cd-good{0%{transform:scale(1)}35%{transform:scale(1.12) translateY(-6px)}100%{transform:scale(1)}}
/* 坏卡被点：左右摇头（行为后果反馈，不羞辱） */
.card-wrap.bad{animation:cd-bad .5s ease}
@keyframes cd-bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* 救援答案级：好卡高亮呼吸 */
.card-wrap.breathe{animation:cd-hint 1.2s ease-in-out infinite}
@keyframes cd-hint{0%,100%{box-shadow:0 5px 0 #D8C9B4}50%{box-shadow:0 5px 0 #D8C9B4,0 0 16px rgba(232,151,90,.95)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，教学演示/帮共用；照家族形态） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：舞台收紧+卡横排收窄
   r11 纪律⑤：媒体查询跟视口不跟元素——页内 verify simView 无法改视口，须 body.port 类通道
   （下方 body.port 副本与 @media 段逐条等值，verify 断言两通道渲染一致） */
@media (orientation:portrait){
  #scene{min-height:200px;max-width:460px}
  #friend{width:140px;height:130px}
  #cards{gap:12px;max-width:640px}
  .card-wrap{width:168px;min-height:140px}
  .card-wrap .art{width:88px;height:64px}
  .card-wrap .word{font-size:18px}
}
/* body.port 副本（页内竖屏模拟通道——与上 @media 段逐条等值，改一处须两处同步） */
body.port #scene{min-height:200px;max-width:460px}
body.port #friend{width:140px;height:130px}
body.port #cards{gap:12px;max-width:640px}
body.port .card-wrap{width:168px;min-height:140px}
body.port .card-wrap .art{width:88px;height:64px}
body.port .card-wrap .word{font-size:18px}
</style>
</head>
<body>
<div id="game" aria-label="安慰选择">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="朋友难过的情景">
      <div class="ground" aria-hidden="true"></div>
      <div id="friend" aria-hidden="true"></div>
      <div id="prop" aria-hidden="true"></div>
      <div id="outcome" aria-hidden="true"></div>
    </div>
    <div id="q-text" aria-hidden="true"></div>
    <div id="cards" aria-label="选一个让朋友开心的做法"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
