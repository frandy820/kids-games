<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>井字棋小冠军</title>
<style>
/* ================= 井字棋小冠军 tictac（batch36·扩容批 6·r18 难度改造版）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法（SPEC-BATCH36 §-r18-tictac 现行版，7 章×6 关）：
   ch1-4 classic 3×3 井字棋 vs 兔子四档（随机→只堵→聪明→minimax 完美）；
   ch5 残局小侦探（win1 一步制胜/block1 必堵/fork 双威胁，答错计 miss）；
   ch6 大棋盘三连（4×4 得 3 连 24 胜线，.w16/.b16 四列布局）；
   ch7 三子滚动（每方场上 ≤3 子 FIFO，.cell.oldest=己方最旧子标记）。
   负局 AI 复盘（classic）：.k-review 层=失误步迷你棋盘（红 .rev-miss=实际格/
   绿 .rev-best=更优格 breathe）。
   顶部双头像指示（孩子执子恒亮，兔子思考期亮兔子侧）；
   HUD 局点（对战 3 局 win 绿/draw 橙/lose 灰；残局 5 题 win 绿）。
   触摸目标：棋盘格 ≥96×96（3×3 横竖双档核 + 4×4 双档核：横 1280×800 格≈101px/
   竖 800×1180 格≈111px）；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。
   miss 分题型（§-r18 §5）：对战恒 0（点已占格=拒绝 bump 不响 wrong）；残局点错计 miss。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 46px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:36px;height:36px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 36px}
#step-dots{display:flex;gap:9px;align-items:center;flex:1 1 auto}
#step-dots i{width:15px;height:15px;border-radius:50%;background:#E5D5BC;border:2.5px solid #D8C9B4;
  transition:all .3s}
#step-dots i.cur{background:#E8975A;transform:scale(1.3)}
#step-dots i.w{background:#8FBF7F;border-color:#6FA35F}
#step-dots i.d{background:#F6C96B;border-color:#DCA63E}
#step-dots i.l{background:#CFC4B2;border-color:#B7AA94}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 轮到指示条：双头像（孩子执子恒亮；兔子思考演出期亮兔子侧） ---------- */
#turn-bar{flex:0 0 auto;display:flex;justify-content:center;gap:56px;padding:4px 0 2px}
.who{display:flex;flex-direction:column;align-items:center;gap:2px;width:76px}
.who .avatar{width:52px;height:52px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  display:flex;align-items:center;justify-content:center;overflow:hidden;transition:all .25s}
.who .avatar svg{width:80%;height:80%}
.who .name{font-size:13px;font-weight:700;opacity:.5;transition:all .25s}
.who.active .avatar{box-shadow:0 0 0 5px rgba(232,151,90,.55);animation:tk-who .8s ease infinite alternate}
.who.active .name{opacity:1;color:#C4702F}
.who:not(.active) .avatar{filter:grayscale(.55);opacity:.55}
@keyframes tk-who{from{transform:scale(1)}to{transform:scale(1.07)}}

/* ---------- 舞台：棋盘（主点选区）+ 题面句条 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:4px 12px}

/* 棋盘垫：暖色木牌（3×3 格浮层；.w16=4×4 变体放大垫） */
#board-wrap{position:relative;flex:0 0 auto;width:min(430px,94vw,calc((100vh - 330px)*1.06));
  aspect-ratio:380/340;border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,#FDF3DC 0%,#F6E9C8 60%,#EFE0BE 100%);
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;padding:22px}
#board{position:relative;width:100%;height:100%;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:9px}
/* v44 大棋盘（ch6）：4×4 得 3 连——正方形垫+四列网格，格 ≥96×96 双档核 */
#board-wrap.w16{width:min(508px,94vw,calc(100vh - 330px));aspect-ratio:1/1;padding:20px}
#board.b16{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.cell{position:relative;border-radius:16px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 3px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .12s}
.cell:active{transform:scale(.95)}
.cell svg.mark{width:76%;height:76%;overflow:visible}
.cell.pop-in{animation:tk-cell .32s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes tk-cell{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.cell svg.mark{animation:tk-mark .34s cubic-bezier(.2,1.6,.4,1)}
@keyframes tk-mark{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
/* vroll 最旧子标记（ch7）：己方满 3 子后，下新子时会被移走的子（虚线框+角标） */
.cell.oldest{border-style:dashed;border-color:#C4702F;opacity:.8}
.cell.oldest:after{content:'';position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;
  background:#E8975A;border:2px solid #C4702F}
/* 胜线三格高亮（演出层锚：终局连线格渲染 .wincell） */
.cell.wincell{background:#FDE9C8;border-color:#C4702F;box-shadow:0 3px 0 #C9A87C,0 0 14px rgba(232,151,90,.65);
  animation:tk-winc .5s ease infinite alternate}
@keyframes tk-winc{from{transform:scale(1)}to{transform:scale(1.05)}}
/* 反馈动效：wig=已占格/吞输入拒绝摇头（家族 D 轻叮配 bump）/ breathe=救援答案级 */
.cell.wig{animation:tk-wig .4s ease}
@keyframes tk-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.cell.breathe{animation:tk-br 1.2s ease-in-out infinite}
@keyframes tk-br{0%,100%{filter:drop-shadow(0 0 0 rgba(232,151,90,0))}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
.cell.pulse{animation:tk-pulse .95s ease 1}
@keyframes tk-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

/* 兔子思考演出：小兔头像浮到棋盘边（思考气泡三点） */
.bunny-g{position:absolute;bottom:4%;right:-20%;width:20%;z-index:8;pointer-events:none;opacity:0;
  transition:right .6s ease,opacity .3s ease}
.bunny-g.show{opacity:1;right:2%}
.bunny-g .bsvg{width:100%;height:auto;animation:tk-bthink .6s ease infinite alternate}
@keyframes tk-bthink{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.bunny-g .think{position:absolute;left:-34%;top:8%;width:52%;aspect-ratio:1;background:#FFF9EE;
  border:2.5px solid #4A3B2E;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:4px}
.bunny-g .think i{width:7%;aspect-ratio:1;border-radius:50%;background:#4A3B2E;animation:tk-dot .9s ease infinite}
.bunny-g .think i:nth-child(2){animation-delay:.15s}
.bunny-g .think i:nth-child(3){animation-delay:.3s}
@keyframes tk-dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* 负局 AI 复盘层（§-r18：失误步局面迷你棋盘，红=实际格/绿=更优格；tap 提前关） */
.k-review{position:fixed;inset:0;z-index:66;background:rgba(74,59,46,.58);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:20px}
.k-review .rv-title{font-size:24px;font-weight:800;color:#FFF9EE;text-shadow:0 2px 0 rgba(74,59,46,.6)}
.k-review .rv-board{width:min(300px,80vw,52vh);aspect-ratio:1/1;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:7px;
  background:#F6E9C8;border:3px solid #4A3B2E;border-radius:18px;padding:12px;box-shadow:0 5px 0 #D8C9B4}
.k-review .rv-cell{position:relative;border-radius:12px;background:#FFF9EE;border:2.5px solid #D8C9B4;
  display:flex;align-items:center;justify-content:center}
.k-review .rv-cell svg.mark{width:72%;height:72%}
.k-review .rv-cell.rev-miss{border-color:#D9534F;box-shadow:0 0 12px rgba(217,83,79,.55)}
.k-review .rv-cell.rev-best{border-style:dashed;border-color:#6FA35F;animation:rv-best 1.2s ease-in-out infinite}
@keyframes rv-best{0%,100%{box-shadow:0 0 0 rgba(111,163,95,0)}50%{box-shadow:0 0 14px rgba(111,163,95,.85)}}
.k-review .rv-legend{font-size:15px;font-weight:700;color:#FFF9EE;background:rgba(74,59,46,.5);
  padding:4px 14px;border-radius:10px}

/* 题面句条 */
#qbar{flex:0 0 auto;max-width:94vw}
#qbar .q-text{font-size:21px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:tk-hearb .45s ease}
@keyframes tk-hearb{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-35） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：棋盘收紧，格子仍 ≥96×96 */
@media (orientation:portrait){
  #board-wrap{width:min(410px,94vw)}
  #board-wrap.w16{width:min(508px,94vw)}
  #qbar .q-text{font-size:18px;padding:3px 14px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
/*PORT-CLS*/
body.port #board-wrap{width:min(410px,94vw)}
body.port #board-wrap.w16{width:min(508px,94vw)}
body.port #qbar .q-text{font-size:18px;padding:3px 14px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
</style>
</head>
<body>
<div id="game" aria-label="井字棋小冠军">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="turn-bar" aria-label="轮到谁">
    <div class="who who-k" data-side="k"><div class="avatar"></div><div class="name">你</div></div>
    <div class="who who-r" data-side="r"><div class="avatar"></div><div class="name">小兔子</div></div>
  </div>
  <div id="stage">
    <div id="board-wrap" aria-label="井字棋棋盘">
      <div id="board"></div>
      <div class="bunny-g" aria-hidden="true"><div class="bsvg"></div><div class="think"><i></i><i></i><i></i></div></div>
    </div>
    <div id="qbar"><div class="q-text"></div></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= tictac 引擎（纯函数无 DOM）：关卡生成 / 胜负扫描 / 兔子 AI / 残局题库 /
   4×4 与限子变体 / minimax 复盘回溯 / 时长模型
   ─ 关卡确定性（SPEC-BATCH36 §0.90）
   种子 = mulberry32(flat * 7919 + 911)（本款常量 tictac=911）：dch=ri(1,4) 仅生成关 flat≥42
   消耗此流（同 flat 永远同 dch，重玩一致）。
   ─ 局内 RNG 分流（SPEC §0.90/§3 定版）
   每局兔子随机档用独立 mulberry32(flat * 7919 + 911 + round * 77)（round=1-3 局号），
   与 dch RNG 分流；残局题库第三分流 mulberry32(flat*7919+911+7777+qi*131)（§-r18 §2）。
   ─ 关型（§-r18 §1）：battle=classic 3×3 四档；puzzle=残局三类题；
   v44=4×4 得 3 连（LINES16 24 线，AI=engV44 确定性 depth-4，零 rng）；
   vroll=限子滚动（每方 ≤3 子 FIFO 移出，AI=engRollPick 确定性，零 rng）。
   ─ 兔子 AI 四档（rng 消耗序——verify 独立复算锚；仅 battle 用 rng）
   dch1 random  ：empties[floor(rnd()*empties.length)]（每次应手恰 1 次 rnd()）
   dch2 block   ：先堵孩子成三连格（0 次 rnd()）；否则同 dch1 随机（1 次 rnd()）
   dch3 smart   ：①自己一步杀（0 次）→②堵孩子一步杀（0 次）→③漏率 rnd()<0.2 走随机
                  （此分支共 2 次 rnd()：判定 1 次+选格 1 次）→④中心空则占中（0 次）
                  →⑤角 [0,2,6,8] 升序首个空角（0 次）→⑥随机（1 次 rnd()）
   dch4 perfect ：minimax 全展开，不消耗 rnd()（全谱遍历断言：X 全策略×O perfect 无 X 胜）
   ─ minimax 平分裁决（verify 独立复算同格锚）
   深度计分：O 胜=10-depth / X 胜=depth-10 / 平=0（O 视角）；候选格升序遍历，
   严格更优才替换（平分取最小下标）——同局面恒同应手（确定性）。v44 同裁决公约。
   ─ 星级（§-r18 §1 分题型）：battle/v44/vroll 分值制（≥2.5=3★/≥1.5=2★/完成=1★）；
   puzzle miss 制（0=3★/1-2=2★/≥3=1★），永不 0★。
   miss 口径（§-r18 §5）：对战关恒 0（I 豁免备案）；残局题答错计 miss（契约 I 全量适用）。 */
'use strict';

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数

const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;
/* 关型（§-r18 §1）：静态关按章映射；生成关 flat≥42 恒 battle（dch=ri(1,4) 四档） */
const kindOfFlat = flat => flat < STATIC_LEVELS ? KIND_OF_CH[chOfFlat(flat)] : 'battle';

/* ---------- 八条胜线（井字棋 3×3 全量） ---------- */
const LINES = [
  [0, 1, 2], [3, 4, 5], [6, 7, 8],    // 三横
  [0, 3, 6], [1, 4, 7], [2, 5, 8],    // 三竖
  [0, 4, 8], [2, 4, 6]                // 两对角
];

/* ---------- 胜负扫描：返回 { who:'X'|'O', line:[a,b,c] } 或 null ---------- */
function engScanWin(b) {
  for (let k = 0; k < LINES.length; k++) {
    const L = LINES[k];
    if (b[L[0]] && b[L[0]] === b[L[1]] && b[L[1]] === b[L[2]])
      return { who: b[L[0]], line: [L[0], L[1], L[2]] };
  }
  return null;
}
/* ---------- 某方一步成三连的格集合（升序） ---------- */
function winPoints(b, p) {
  const out = [];
  for (let k = 0; k < LINES.length; k++) {
    const L = LINES[k];
    const vals = [b[L[0]], b[L[1]], b[L[2]]];
    if (vals.filter(v => v === p).length === 2 && vals.indexOf('') >= 0)
      out.push(L[vals.indexOf('')]);
  }
  return out;
}
const emptiesOf = b => { const e = []; for (let i = 0; i < b.length; i++) if (!b[i]) e.push(i); return e; };

/* ---------- 兔子 AI 四档（纯函数；rng 消耗序见头注——verify 复算锚） ---------- */
function engRandomPick(b, rnd) {
  const e = emptiesOf(b);
  return e.length ? e[Math.floor(rnd() * e.length)] : null;      // 恰 1 次 rnd()
}
function engBlockPick(b, rnd) {
  const fw = winPoints(b, 'X');
  if (fw.length) return fw[0];                                   // 必堵孩子成三连格（0 次 rnd()）
  return engRandomPick(b, rnd);                                  // 否则 seeded 随机（会挡不会杀）
}
function engSmartPick(b, rnd) {
  const ow = winPoints(b, 'O');
  if (ow.length) return ow[0];                                   // ① 自己一步杀
  const fw = winPoints(b, 'X');
  if (fw.length) return fw[0];                                   // ② 堵孩子一步杀
  if (rnd() < 0.2) return engRandomPick(b, rnd);                 // ③ 漏率 20%：seeded 走随机（2 次 rnd()）
  if (b[4] === '') return 4;                                     // ④ 中心启发
  const CORNERS = [0, 2, 6, 8];
  for (let k = 0; k < 4; k++) if (b[CORNERS[k]] === '') return CORNERS[k];   // ⑤ 空角启发（升序）
  return engRandomPick(b, rnd);                                  // ⑥ 随机（1 次 rnd()）
}
/* ---------- minimax（O 视角：O 胜=10-depth / X 胜=depth-10 / 平=0） ---------- */
function mm(b, turn, depth) {
  const w = engScanWin(b);
  if (w) return w.who === 'O' ? 10 - depth : depth - 10;
  const e = emptiesOf(b);
  if (!e.length) return 0;
  let best = turn === 'O' ? -99 : 99;
  for (let k = 0; k < e.length; k++) {
    b[e[k]] = turn;
    const s = mm(b, turn === 'O' ? 'X' : 'O', depth + 1);
    b[e[k]] = '';
    if (turn === 'O' ? s > best : s < best) best = s;
  }
  return best;
}
/* ch4 perfect：minimax 全展开永不输（全盘谱遍历断言——X 全策略×O perfect 无 X 胜，
   verify 单元⑰+selftest 独立 minimax 全谱对账）；候选升序严格更优才替换（确定性） */
function engPerfectPick(b) {
  const e = emptiesOf(b);
  if (!e.length) return null;
  let best = -99, pick = e[0];
  for (let k = 0; k < e.length; k++) {
    b[e[k]] = 'O';
    const s = mm(b, 'X', 1);
    b[e[k]] = '';
    if (s > best) { best = s; pick = e[k]; }
  }
  return pick;
}
/* 孩子方最优（autoSolve / 救援答案级提示共用）：X 视角=最小化 O 分 */
function engBestX(b) {
  const e = emptiesOf(b);
  if (!e.length) return null;
  let best = 99, pick = e[0];
  for (let k = 0; k < e.length; k++) {
    b[e[k]] = 'X';
    const s = mm(b, 'O', 1);
    b[e[k]] = '';
    if (s < best) { best = s; pick = e[k]; }
  }
  return pick;
}
/* autoSolve 通关策略：minimax 最优集合内优先制造双威胁（对随机/弱兔子胜率最大，
   对 ch4 仍恒最优=平局保障）；升序严格更优（分数或威胁数）才替换 */
function engAutoPick(b) {
  const e = emptiesOf(b);
  if (!e.length) return null;
  let best = 99, pick = e[0], bestTh = -1;
  for (let k = 0; k < e.length; k++) {
    b[e[k]] = 'X';
    const s = mm(b, 'O', 1);
    const th = winPoints(b, 'X').length;                         // 落后己方一步杀点数（双威胁）
    b[e[k]] = '';
    if (s < best || (s === best && th > bestTh)) { best = s; bestTh = th; pick = e[k]; }
  }
  return pick;
}
/* 四档总入口（dch 1-4；dch=1 随机在无胜线局面恒消耗 1 次 rnd） */
function engAiPick(b, dch, rnd) {
  if (emptiesOf(b).length === 0) return null;
  if (dch <= 1) return engRandomPick(b, rnd);
  if (dch === 2) return engBlockPick(b, rnd);
  if (dch === 3) return engSmartPick(b, rnd);
  return engPerfectPick(b);
}

/* ---------- v44：4×4 得 3 连（§-r18 §3 判定器——24 条胜线全枚举）
   横 8（4 行×2 窗）+竖 8（4 列×2 窗）+↘对角 4+↗对角 4；同色 3 连即胜；棋满无三连=平局。 */
const LINES16 = [
  [0, 1, 2], [1, 2, 3], [4, 5, 6], [5, 6, 7],            // 四横×2 窗
  [8, 9, 10], [9, 10, 11], [12, 13, 14], [13, 14, 15],
  [0, 4, 8], [4, 8, 12], [1, 5, 9], [5, 9, 13],          // 四竖×2 窗
  [2, 6, 10], [6, 10, 14], [3, 7, 11], [7, 11, 15],
  [0, 5, 10], [5, 10, 15], [1, 6, 11], [4, 9, 14],       // ↘对角 4
  [3, 6, 9], [6, 9, 12], [2, 5, 8], [7, 10, 13]          // ↗对角 4
];
function engScanWin16(b) {
  for (let k = 0; k < LINES16.length; k++) {
    const L = LINES16[k];
    if (b[L[0]] && b[L[0]] === b[L[1]] && b[L[1]] === b[L[2]])
      return { who: b[L[0]], line: [L[0], L[1], L[2]] };
  }
  return null;
}
function winPoints16(b, p) {
  const out = [];
  for (let k = 0; k < LINES16.length; k++) {
    const L = LINES16[k];
    const vals = [b[L[0]], b[L[1]], b[L[2]]];
    if (vals.filter(v => v === p).length === 2 && vals.indexOf('') >= 0)
      out.push(L[vals.indexOf('')]);
  }
  return out;
}
/* v44 启发估值（§-r18 §3）：Σ线 2 己+1 空=+50 / 1 己+2 空=+5；对方对称负分（混线不计） */
function eval16(b, me) {
  const op = me === 'O' ? 'X' : 'O';
  let s = 0;
  for (let k = 0; k < LINES16.length; k++) {
    const L = LINES16[k];
    let m = 0, o = 0;
    for (let j = 0; j < 3; j++) { if (b[L[j]] === me) m++; else if (b[L[j]] === op) o++; }
    if (m && o) continue;
    if (m === 2) s += 50; else if (m === 1) s += 5;
    if (o === 2) s -= 50; else if (o === 1) s -= 5;
  }
  return s;
}
/* v44 depth-4 minimax（§-r18 §3）：胜=±(1000-depth)；平=0；到深=eval16 */
function mm16(b, turn, me, depth) {
  const w = engScanWin16(b);
  if (w) return w.who === me ? 1000 - depth : depth - 1000;
  if (depth >= 4) return eval16(b, me);
  const e = emptiesOf(b);
  if (!e.length) return 0;
  let best = turn === me ? -9999 : 9999;
  for (let k = 0; k < e.length; k++) {
    b[e[k]] = turn;
    const s = mm16(b, turn === 'O' ? 'X' : 'O', me, depth + 1);
    b[e[k]] = '';
    if (turn === me ? s > best : s < best) best = s;
  }
  return best;
}
/* v44 AI（§-r18 §3，确定性零 rng）：①己方一步杀（升序首格）→②堵对方一步杀→
   ③depth-4 minimax（升序严格更优，平分取最小下标——verify 独立复算锚） */
function engV44(b, me) {
  const op = me === 'O' ? 'X' : 'O';
  const mw = winPoints16(b, me);
  if (mw.length) return mw[0];
  const ow = winPoints16(b, op);
  if (ow.length) return ow[0];
  const e = emptiesOf(b);
  if (!e.length) return null;
  let best = -9999, pick = e[0];
  for (let k = 0; k < e.length; k++) {
    b[e[k]] = me;
    const s = mm16(b, op, me, 1);
    b[e[k]] = '';
    if (s > best) { best = s; pick = e[k]; }
  }
  return pick;
}

/* ---------- vroll：限子滚动（§-r18 §3 判定器——与 classic 差异全枚举）
   每方场上 ≤3 子（ROLL_CAP_PIECES）：落子时己方已满 3 ⇒ 先移出己方最旧子（FIFO）再落子；
   胜负判定在移出+落子完成后整盘扫描；对方一步杀=模拟对方含自身移子的成线集合；
   棋满不可能（3+3=6<9），平局唯一来源=总手数 ROLL_MOVE_CAP 收束。 ---------- */
const ROLL_CAP_PIECES = 3;    // 每方场上最多 3 子（「6 子摆满后」=双方 3+3）
const ROLL_MOVE_CAP = 36;     // 总手数上限→平局收束（X 最多 18 手）
/* 落子原子（含移出）：g={board,xq,oq}；返回被移出格或 -1 */
function engRollApply(g, me, i) {
  const myq = me === 'X' ? g.xq : g.oq;
  let removed = -1;
  if (myq.length >= ROLL_CAP_PIECES) { removed = myq.shift(); g.board[removed] = ''; }
  g.board[i] = me; myq.push(i);
  return removed;
}
/* p 方当前一步可胜格集合（升序；含 p 自身移子模拟——滚动杀） */
function engRollThreats(g, p) {
  const out = [];
  for (let i = 0; i < 9; i++) {
    if (g.board[i]) continue;
    const sim = { board: g.board.slice(), xq: g.xq.slice(), oq: g.oq.slice() };
    engRollApply(sim, p, i);
    const w = engScanWin(sim.board);
    if (w && w.who === p) out.push(i);
  }
  return out;
}
/* vroll AI（§-r18 §3，确定性零 rng）：①己方含移子一步杀→②堵对方一步杀格（占位即堵）→
   ③启发（中心+3/角+1/落后己方威胁数×2，升序严格更优）——verify 独立复算锚 */
function engRollPick(g, me) {
  const op = me === 'X' ? 'O' : 'X';
  const mw = engRollThreats(g, me);
  if (mw.length) return mw[0];
  const ow = engRollThreats(g, op);
  if (ow.length) return ow[0];
  let best = -1, pick = -1;
  for (let i = 0; i < 9; i++) {
    if (g.board[i]) continue;
    let sc = 0;
    if (i === 4) sc += 3;
    if (i === 0 || i === 2 || i === 6 || i === 8) sc += 1;
    const sim = { board: g.board.slice(), xq: g.xq.slice(), oq: g.oq.slice() };
    engRollApply(sim, me, i);
    sc += winPoints(sim.board, me).length * 2;
    if (sc > best) { best = sc; pick = i; }
  }
  return pick;
}

/* ---------- 残局题库（§-r18 §2：30 题封闭，确定性生成，三型谓词唯一解） ----------
   谓词（数学先验写前验算 ✓）：
   win1   |winPoints(X)|==1 ∧ |winPoints(O)|==0 ⇒ 答案=该格；
   block1 |winPoints(O)|==1 ∧ |winPoints(X)|==0 ⇒ 答案=该格；
   fork   双方均无一步杀 ∧ 恰一格 c 落 X 后 winPoints(X)≥2 ⇒ 答案=c（无一步杀在先
          ⇒ c 不可能直接成三连，威胁恒为开放双线）。 */
function puzAnswerOf(b, ptype) {
  const xw = winPoints(b, 'X'), ow = winPoints(b, 'O');
  if (ptype === 'win1') return xw.length === 1 && ow.length === 0 ? xw[0] : null;
  if (ptype === 'block1') return ow.length === 1 && xw.length === 0 ? ow[0] : null;
  if (xw.length || ow.length) return null;
  let fork = -1;
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = 'X';
    const t = winPoints(b, 'X').length;
    b[i] = '';
    if (t >= 2) { if (fork >= 0) return null; fork = i; }        // 双解=废题
  }
  return fork >= 0 ? fork : null;
}
/* 题型日程（§-r18 §2）：lv0 win1(k=2)/lv1 win1(k=3)/lv2 block1(k=2)/lv3 fork(k=2)/
   lv4 win1+block1 混(k=3)/lv5 三型混(k=3)——k=每方子数（X 到手 kX==kO） */
function puzSched(lv) {
  return [
    { types: ['win1'], k: 2 },
    { types: ['win1'], k: 3 },
    { types: ['block1'], k: 2 },
    { types: ['fork'], k: 2 },
    { types: ['win1', 'block1'], k: 3 },
    { types: ['win1', 'block1', 'fork'], k: 3 }
  ][lv];
}
/* 静态兜底题（生成 4000 次未中时用——三题均人工验算唯一解；确定性恒同） */
const PUZ_FALLBACK = {
  win1:   { board: ['O', '', '', 'X', 'X', '', '', '', 'O'], ptype: 'win1',   answer: 5 },
  block1: { board: ['O', 'O', '', '', 'X', '', '', '', 'X'], ptype: 'block1', answer: 2 },
  fork:   { board: ['X', 'X', 'O', 'O', '', '', '', '', ''], ptype: 'fork',   answer: 4 }
};
/* 残局 5 题生成（种子=flat*7919+911+7777+qi*131——与 dch/局 RNG 三重分流） */
function genPuzzles(flat) {
  const lv = flat % CH_LEN, sch = puzSched(lv), out = [];
  for (let qi = 0; qi < PUZZLES; qi++) {
    const ptype = sch.types.length === 1 ? sch.types[0] : sch.types[qi % sch.types.length];
    const rnd = mulberry32(flat * 7919 + 911 + 7777 + qi * 131);
    let made = null;
    for (let att = 0; att < 4000 && !made; att++) {
      const b = ['', '', '', '', '', '', '', '', ''];
      const cells = [0, 1, 2, 3, 4, 5, 6, 7, 8];
      for (let c = 8; c > 0; c--) {                              // seeded 洗牌（Fisher-Yates）
        const j = Math.floor(rnd() * (c + 1));
        const t = cells[c]; cells[c] = cells[j]; cells[j] = t;
      }
      for (let m = 0; m < sch.k * 2; m++) b[cells[m]] = m % 2 === 0 ? 'X' : 'O';   // X 先手交替=可达局面
      if (engScanWin(b)) continue;
      const a = puzAnswerOf(b, ptype);
      if (a != null) made = { board: b, ptype: ptype, answer: a };
    }
    const f = made || PUZ_FALLBACK[ptype];
    out.push({ board: f.board.slice(), ptype: f.ptype, answer: f.answer, solved: false });
  }
  return out;
}

/* ---------- 局 RNG 种子（SPEC §3：flat*7919+911+round*77，round=1-3） ---------- */
const roundSeed = (flat, round) => (flat * 7919 + 911 + round * 77) | 0;

/* ---------- 关卡生成（静态 42 关与生成关同一确定性通道）
   取数序：dch（flat≥42 时 ri(1,4) 先取保确定性）；局 RNG 在 UI startRound 时
   按局号独立播种（与 dch RNG 分流）。rounds 三局占位（battle/v44/vroll）；
   puzzle 关装载 puzzles 5 题。 ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 911);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);       // 生成关随机章参数
  const kind = kindOfFlat(flat);
  const L = { flat: flat, ch: ch, dch: dch, lv: lv, kind: kind,
              roundIdx: 0, rounds: [null, null, null], puzzles: null,
              score: 0, step: 0, miss: 0, results: [], done: false,
              lastFinal: null, rng: null, review: null };
  if (kind === 'puzzle') L.puzzles = genPuzzles(flat);
  return L;
}

/* ---------- 星级（§-r18 §1 分题型）：分值制/miss 制，永不 0★ ---------- */
function engStars(L) {
  if (L.kind === 'puzzle') return L.miss === 0 ? 3 : L.miss <= 2 ? 2 : 1;
  return L.score >= 2.5 ? 3 : L.score >= 1.5 ? 2 : 1;
}

/* ---------- r18 时长模型（§-r18 §4；verify+selftest 双端独立重列对账） ----------
   battle=3*(4*7000+3*800+2820)=99660 / puzzle=5*(3000+12000+2604)=88020（全 42 关最低）/
   v44=vroll=3*(6*8000+6*800+2820)=166860；生成关=battle 值；全关 ≥LEVEL_MIN_MS 40000。 */
function modeled(flat) {
  const kind = kindOfFlat(flat);
  if (kind === 'puzzle') return PUZZLES * (PROMPT_WIN_MS + DECIDE_MS.puzzle + RIGHT_WIN_MS);
  const n = NOMINAL[kind];
  return ROUNDS * (n.moves * DECIDE_MS[kind] + n.rabbit * RABBIT_MS + END_WIN_MS);
}

/* ---------- 负局复盘回溯（§-r18 delta3：首误步=minimax 视角首个「局面前最优值非负、
   实际落子后转入必败」的 X 手；先手最优≥平局⇒任何负局必存在——数学先验） ---------- */
function engReview(hist) {
  const b = ['', '', '', '', '', '', '', '', ''];
  for (let t = 0; t < hist.length; t++) {
    const mv = hist[t];
    if (mv.p === 'O') { b[mv.i] = 'O'; continue; }
    let bestV = 99, bestC = -1;                                  // X 视角=最小化 O 分（升序严格更优）
    for (let c = 0; c < 9; c++) {
      if (b[c]) continue;
      b[c] = 'X';
      const s = mm(b, 'O', 1);
      b[c] = '';
      if (s < bestV) { bestV = s; bestC = c; }
    }
    b[mv.i] = 'X';
    const actV = mm(b, 'O', 1);                                  // 与 bestV 同深同侧（O 到手）
    if (actV > bestV)                                            // 严格更差=失误（首处即返）
      return { moveNo: Math.floor(t / 2) + 1, missCell: mv.i, bestCell: bestC,
               boardBefore: b.slice() };
  }
  return null;
}

/* ---------- 结构校验（verify 用，返回失败原因或 null）：章映射 / dch 域 / 关型 / 初始态干净 ---------- */
function structWhy(L) {
  if (!L) return 'null';
  if (L.rounds.length !== ROUNDS) return 'rounds';
  if (L.ch !== Math.floor(L.flat / CH_LEN) + 1 || L.lv !== L.flat % CH_LEN) return 'chmap';
  const dch0 = (L.ch - 1) % 4 + 1;
  if (L.flat < STATIC_LEVELS ? L.dch !== dch0 : (L.dch < 1 || L.dch > 4)) return 'dch';
  if (L.flat < STATIC_LEVELS ? L.kind !== KIND_OF_CH[L.ch] : L.kind !== 'battle') return 'kind';
  if (L.score !== 0 || L.step !== 0 || L.done) return 'init';
  if (L.miss !== 0) return 'initMiss';
  if (L.results.length !== 0 || L.lastFinal !== null || L.rng !== null || L.review !== null) return 'initRounds';
  if (L.roundIdx !== 0) return 'initIdx';
  if (L.kind === 'puzzle') {
    if (!Array.isArray(L.puzzles) || L.puzzles.length !== PUZZLES) return 'puzLen';
    for (let k = 0; k < L.puzzles.length; k++) {
      const q = L.puzzles[k];
      if (!q || q.solved !== false || puzAnswerOf(q.board.slice(), q.ptype) !== q.answer) return 'puzQ' + k;
    }
  } else if (L.puzzles !== null) return 'puzNull';
  return null;
}

/* ================= 键基迁移 IIFE（§-r18 §6：CH_LEN 5→6——先于 KIDS.init 读档执行）
   脏键=格式非法或关号 >CH_LEN-1（章号上界放开容纳生成关 ch≥8）；矛盾态=存在

   →一次性重置；合法新基档（含 ch≥8 生成关键）保留。 ================= */
(() => {
  let raw = null;
  try { raw = localStorage.getItem('kidsgame_tictac'); } catch (e) { return; }

  let sv = null;
  try { sv = JSON.parse(raw); } catch (e) { return; }
  if (!sv || typeof sv !== 'object' || !sv.levels) return;
  const lv = sv.levels;
  let bad = false;
  for (const k of Object.keys(lv)) {
    const m = /^([1-9]\d*)-([0-9]\d*)$/.exec(k);
    if (!m) { bad = true; break; }                              // 脏键：仅判格式
    if (+m[2] > CH_LEN - 1) { bad = true; break; }              // 关号域 >CH_LEN-1
  }
  if (!bad) {
    for (let c = 2; c <= N_CHAPTERS; c++) {                     // 矛盾态检测（旧基特征）
      if (lv[c + '-0'] && !lv[(c - 1) + '-5']) { bad = true; break; }
    }
  }
  if (bad) { try { localStorage.removeItem('kidsgame_tictac'); } catch (e) {} }
})();

  boardEl.classList.toggle('b16', cur.kind === 'v44');
  boardWrapEl.classList.toggle('w16', cur.kind === 'v44');
  renderBoard(); renderTurnUI(); renderRoundDots();
  qText(cur.kind === 'v44' ? P44_TEXT : cur.kind === 'vroll' ? VROLL_TEXT : PROMPT_TEXT);
}
/* 残局题装载（qbar 按型文案+题面句；换题重置错链窗——契约 I 换题语义） */
function loadPuzzle(qi) {
  const q = cur.puzzles[qi];
  wrongChainUntil = 0;
  boardEl.classList.remove('b16');
  boardWrapEl.classList.remove('w16');
  renderBoard(); renderRoundDots();

  qText(q.ptype === 'win1' ? PUZ_WIN_TEXT : q.ptype === 'block1' ? PUZ_BLOCK_TEXT : PUZ_FORK_TEXT);
  sayR(vk.key, vk.text);
}

/* ================= 落子主路径分发（真实点击 / TK.tapCell / autoSolve / 教学演示共用）
   残局关走 uiPuzzleTap（判定/miss/错链窗）；对战型走 uiBattleTap。
   已占格=false+wig 轻叮（家族 D）；演示期 null；兔子思考/终局结算窗=false 轻吞。 ========== */
async function uiTapCell(i, demo) {
  if (cur && cur.kind === 'puzzle' && !demo) return uiPuzzleTap(i);
  return uiBattleTap(i, demo);
}
/* ---------- 对战型（battle classic / v44 4×4 / vroll 限子滚动） ---------- */
async function uiBattleTap(i, demo) {
  if (!cur || state.won) return false;
  if (state.demo && !demo) return null;         // 教学演示期 null（SPEC §3）
  if (cur.done) return null;
  const g = cur.rounds[cur.roundIdx];
  if (!g || g.over) return null;
  if (state.rabbit || state.roundEnd || state.review) {   // 思考/结算/复盘窗：轻叮+摇头（家族 D）
    if (!demo) { sfx('pop'); bumpCell(i); }
    return false;
  }
  const N = cur.kind === 'v44' ? 16 : 9;
  if (!Number.isInteger(i) || i < 0 || i >= N) return null;
  if (g.board[i] !== '') {                      // 已占格：拒绝 bump 不响 wrong（对战 miss 恒 0 备案）
    sfx('pop');
    bumpCell(i);
    return false;
  }
  const run = cur, token = perfRun;             /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  lastAct = Date.now();                         /* 孩子落子=主交互，重置救援钟（§0.7a） */
  lastDir = Date.now();
  if (state.tut === 'help' && !demo) {          /* 教学"独"：首次合法落子 → 放手 */
    state.tut = 'solo';
    window.__tkTutSolo = true;                  /* 帮→独实证（verify 单元②断言；solo 为瞬时态） */
    ghost.hide();
    hopRabbit();
  }
  /* ---- X 落子（vroll 含移出最旧子——先移后落原子完成） ---- */
  if (cur.kind === 'vroll') {
    const removedX = engRollApply(g, 'X', i);
    if (removedX >= 0) renderClear(removedX);
    g.moves++;
  } else g.board[i] = 'X';
  g.hist.push({ p: 'X', i: i });
  renderCell(i, 'X');
  placeTone();
  const w = cur.kind === 'v44' ? engScanWin16(g.board) : engScanWin(g.board);
  if (w) return await endRound('win', w, demo);
  const fullX = cur.kind === 'vroll' ? g.moves >= ROLL_MOVE_CAP : g.board.indexOf('') < 0;
  if (fullX) return await endRound('draw', null, demo);
  /* ---- 兔子应手（思考演出 800ms → 落子 O） ---- */
  state.rabbit = true;
  renderTurnUI();
  bunnyShow();
  qText(RABBIT_TEXT);
  await wait(800 * SPEED);
  if (cur !== run || token !== perfRun) { state.rabbit = false; bunnyHide(); return false; }
  let mv;
  if (demo && cur._scriptO && cur._scriptO.length) mv = cur._scriptO.shift();   // 教学演示定版应手
  else if (cur.kind === 'v44') mv = engV44(g.board, 'O');
  else if (cur.kind === 'vroll') mv = engRollPick(g, 'O');
  else mv = engAiPick(g.board, cur.dch, cur.rng);
  if (mv == null || g.board[mv] !== '') { state.rabbit = false; bunnyHide(); return false; }
  if (cur.kind === 'vroll') {
    const ro = engRollApply(g, 'O', mv);
    if (ro >= 0) renderClear(ro);
    g.moves++;
  } else g.board[mv] = 'O';
  g.hist.push({ p: 'O', i: mv });
  renderCell(mv, 'O');
  markOldest();
  window.__tkAiMoves = (window.__tkAiMoves || 0) + 1;   /* verify 观测：真 AI 应手计数 */
  placeLo();
  const w2 = cur.kind === 'v44' ? engScanWin16(g.board) : engScanWin(g.board);
  if (w2) { state.rabbit = false; bunnyHide(); return await endRound('lose', w2, demo); }
  const fullO = cur.kind === 'vroll' ? g.moves >= ROLL_MOVE_CAP : g.board.indexOf('') < 0;
  if (fullO) { state.rabbit = false; bunnyHide(); return await endRound('draw', null, demo); }
  state.rabbit = false;
  bunnyHide();
  renderTurnUI();
  qText(cur.kind === 'v44' ? P44_TEXT : cur.kind === 'vroll' ? VROLL_TEXT : PROMPT_TEXT);
  return 'moved';
}
/* ---------- 残局判定（§-r18 §5 分题型 miss 口径） ----------
   答案格='right'（末题 'done'）；空格点错='wrong'+miss+1（错链豁免窗挂判定前：窗内
   错点吞 false、对选放行；契约 J 10s 节流内 miss 照计链不重播不设窗）；已占格=false；
   反馈窗=null。miss≥2=答案格 breathe（答案级线索）。 ---------- */
async function uiPuzzleTap(i) {
  if (!cur || state.won) return false;
  if (cur.done) return null;
  const q = cur.puzzles && cur.puzzles[cur.step];
  if (!q || q.solved) return null;
  if (state.roundEnd || state.review) {         // 反馈窗/复盘期：轻叮+摇头（家族 D）
    sfx('pop');
    bumpCell(i);
    return false;
  }
  if (!Number.isInteger(i) || i < 0 || i > 8) return null;
  if (q.board[i] !== '') {                      // 已占格拒绝（非判定格——不计 miss）
    sfx('pop');
    bumpCell(i);
    return false;
  }
  lastAct = Date.now();                         /* 有效判定格交互重置救援钟 */
  lastDir = Date.now();
  if (i === q.answer) {                         /* ---- 判对：落子演出+成线/威胁可视化 ---- */
    const run = cur, token = perfRun;
    q.solved = true;
    state.roundEnd = true;
    renderCell(i, 'X');
    const b2 = q.board.slice();
    b2[i] = 'X';
    if (q.ptype === 'win1') {
      const w = engScanWin(b2);
      if (w) for (const c of w.line) { const el = cellEl(c); if (el) el.classList.add('wincell'); }
    } else if (q.ptype === 'fork') {
      for (const t of winPoints(b2, 'X')) { const el = cellEl(t); if (el) replayAnim(el, 'pulse'); }
    } else {
      const el = cellEl(i); if (el) replayAnim(el, 'pulse');   /* block1：堵子 pulse */
    }
    KIDS.voice.queue([VOICE.right.key]);        /* 单 clip 链（⑩ 对账：__lastQueue===['tk_right']） */
    chimeWin();
    await wait(WIN_MS * SPEED);
    if (cur !== run || token !== perfRun) return 'right';
    state.roundEnd = false;
    cur.step++;
    if (cur.step >= PUZZLES) { cur.done = true; winFlow(); return 'done'; }
    loadPuzzle(cur.step);
    return 'right';
  }
  /* ---- 错答：计 miss 不吞（§-r18 §5）；契约 I 豁免窗挂判定前+契约 J 节流 ---- */
  if (wrongChainUntil && Date.now() < wrongChainUntil) {   /* 窗内错点吞（不计二次 miss） */
    sfx('pop');
    bumpCell(i);
    return false;
  }
  cur.miss++;
  const now = Date.now();
  if (now - lastWrongVoice > 10000) {           /* 契约 J：语义句 10s 节流（节流内 miss 照计不设窗） */
    KIDS.voice.queue([VOICE.wrong.key]);        /* 错链=wrong 单 clip（⑩ 对账） */
    wrongChainUntil = now + WRONG_CHAIN_WIN;
    lastWrongVoice = now;
  }
  bumpCell(i);
  if (cur.miss >= 2) {                          /* 答案级线索：miss≥2 才亮（残局） */
    const el = cellEl(q.answer);
    if (el) replayAnim(el, 'breathe');
  }
  return 'wrong';
}

/* ================= 局结算（b19 坑②定版：终局字串分流，不自动重开）
   胜/平/负三链独立单发（right/draw/lose 单 clip，窗=实长+300：2604/2844/3012）；
   classic 负局→AI 复盘（engReview 首误步+.k-review 层，REVIEW_MS 窗/tap 提前关）。 ========== */
async function endRound(result, w, demo) {
  const run = cur, token = perfRun;
  state.roundEnd = true;
  const g = cur.rounds[cur.roundIdx];
  g.over = true;
  cur.lastFinal = { result: result, line: w ? w.line.slice() : null };   /* 终局快照（TK.final） */
  bunnyHide();
  renderTurnUI();
  if (w) for (const i of w.line) { const el = cellEl(i); if (el) el.classList.add('wincell'); }   /* 演出层 */
  qText(result === 'win' ? WIN_TEXT : result === 'draw' ? DRAW_TEXT : LOSE_TEXT);
  const vk = result === 'win' ? VOICE.right.key : result === 'draw' ? VOICE.draw.key : VOICE.lose.key;
  KIDS.voice.queue([vk]);                       /* 单 clip 链（⑩ 对账） */
  if (result === 'win') chimeWin();
  else if (result === 'draw') chimeDraw();
  else dodgeLo();
  const ms = result === 'win' ? WIN_MS : result === 'draw' ? DRAW_MS : LOSE_MS;
  await wait(ms * SPEED);
  if (cur !== run || token !== perfRun) return result;
  state.roundEnd = false;
  if (cur.flat < 0) {                           /* 教学迷你局：不推进不计分不复盘 */
    if (state.tut === 'watch') return result;   /* watch 演示局：tutorialWatch 收尾接管（不重开） */
    startLevel(firstFlat);                      /* turn 阶段迷你局走完 → 进正式首关 */
    return result;
  }
  cur.results.push(result);
  cur.score += result === 'win' ? 1 : result === 'draw' ? 0.5 : 0;
  cur.step++;                                   /* 完成局数（quiz.step 由局号派生） */
  renderRoundDots();
  if (result === 'lose' && cur.kind === 'battle') {   /* 负局 AI 复盘（classic 专属，§-r18 delta3） */
    cur.review = engReview(g.hist);             /* 末次负局复盘快照（TK.review） */
    if (cur.review) {
      await showReview(cur.review);
      if (cur !== run || token !== perfRun) return result;
    }
  }
  if (cur.roundIdx >= ROUNDS - 1) {             /* 第 3 局走完=通关（负/平也完成——永不 0★） */
    cur.done = true;
    winFlow();
    return result;
  }
  startRound(cur.roundIdx + 2);                 /* 起下一局（演出窗已覆盖防重入——新局可交互） */
  return result;
}
/* 负局复盘层：迷你棋盘（失误步局面）+红=实际格/绿=更优格 breathe+tk_review；
   REVIEW_MS 窗自动关/tap 提前关（verify 页 SPEED 提速） */
async function showReview(rv) {
  state.review = true;
  const ov = document.createElement('div');
  ov.className = 'k-review';
  const mk = (cls, html) => { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; return d; };
  ov.appendChild(mk('rv-title', '第' + rv.moveNo + '手，想一想'));
  const bd = mk('rv-board');
  for (let i = 0; i < 9; i++) {
    const c = mk('rv-cell' + (i === rv.missCell ? ' rev-miss' : i === rv.bestCell ? ' rev-best' : ''));
    c.dataset.i = i;
    if (rv.boardBefore[i]) c.innerHTML = rv.boardBefore[i] === 'X' ? X_SVG : O_SVG;
    bd.appendChild(c);
  }
  ov.appendChild(bd);
  ov.appendChild(mk('rv-legend', '红=刚才那一手，绿=更好的一步'));
  document.body.appendChild(ov);
  sayR(VOICE.review.key, VOICE.review.text);
  await new Promise(res => {
    let done = false;
    const fin = () => {
      if (done) return;
      done = true;
      clearTimeout(tid);
      ov.removeEventListener('pointerdown', fin);
      ov.remove();
      res();
    };
    const tid = setTimeout(fin, REVIEW_MS * SPEED);
    ov.addEventListener('pointerdown', fin);
  });
  state.review = false;
}

/* ================= 过关推进（celebrate → persistWin → 章末/日末）
   persistWin 抽独立函数：verify 页 KIDS 未 init（save=null）安全跳过，
   verify 单元⑪ init 后=真实写档链（localStorage kidsgame_tictac） ================= */
function persistWin(stars) {
  const sv = KIDS._save();
  if (!sv || !sv.levels) return { chapterDone: false };   /* verify 沙盒未 init=安全跳过 */
  return KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4, 5]);
}
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<7——r18 七章域）；生成关=实算下一关随机章型
     GEN[dch-1]（家族 F：genLevel 纯函数确定性，同 flat 恒同 dch——禁章序右移） */
  return ci < N_CHAPTERS ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  perfRun++;                                    /* 通关中止在途演出 */
  ghost.hide();
  bunnyHide();
  const stars = engStars(cur);
  sfx('win');
  sayR(VOICE.right.key, VOICE.right.text);      /* tk_right：赢啦，小冠军（2304ms） */
  if (VERIFY) { persistWin(stars); return; }    // verify 页：不弹层不写档（init 沙盒除外——单元⑪）
  KIDS.ui.celebrate(stars).then(async () => {
    await wait(400);                            /* 家族 H：celebrate 2620+400=3020 ≥ 2304+300=2604 */
    const pr = persistWin(stars);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars6 = [0, 1, 2, 3, 4, 5].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars6, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) });   /* 家族 A（r17 双 lim-1）：winFlow 传 lim-1 */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);               // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  bunnyHide();
  perfRun++;                                    /* 中止在途演出（重玩/换关） */
  cur = genLevel(flat);
  state = { won: false, demo: false, tut: 'none', rabbit: false, roundEnd: false, review: false };
  helpRedemo = false;
  lastAct = Date.now();                         /* 开局重置 idle 锚（helpRedemo 已死保留防引用） */
  lastDir = Date.now();
  wrongChainUntil = 0; lastWrongVoice = 0;      /* 契约 I/J：关切换重置（残局错链窗/节流锚） */
  renderDots();
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] &&
                   !(sv.tictac && sv.tictac.tutSeen);   /* 契约 E：先查教学特例再定行为 */
  if (freshTut) { tutorialWatch(); return; }
  if (cur.kind === 'puzzle') { loadPuzzle(0); return; }
  startRound(1);                                // 备局（verify 页同跑——autoSolve 需其推进）
  if (cur.kind === 'v44') sayR(VOICE.v44.key, VOICE.v44.text);          /* 变体开题句（不阻塞输入） */
  else if (cur.kind === 'vroll') sayR(VOICE.vroll.key, VOICE.vroll.text);
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   watch=幽灵手指看一局（5 手定版：X4 O1 X0 O2 X8——0-4-8 对角三连获胜，
   兔子应手为定版演出不走 AI；整局走完 __tkDemoR='done'——gate 口径）
   →turn=你来下一局（帮→独：迷你局2 真兔子随机档）。
   时序（家族 G/H）：watch clip 2952 → 延 3300（≥2952+300）；每手 ghost 600+320；
   兔子应手演出 800×2；胜局窗 2604——名义分账 10864ms ≤ 16000（build 静态断言）。
   turn clip 1752 → 延 2100（≥1752+300 防尾截）后读题。 ---------- */
function tutLevel() {
  const L = genLevel(0);
  L.flat = -1; L.ch = 0; L.dch = 1;             /* 教学迷你关（flat<0 不计分不救援不复盘） */
  return L;
}
async function tutorialWatch() {
  const t0w = Date.now();                       // watch 段计时锚（verify 单元② 预算 ≤16s 只罩 watch）
  perfRun++;
  state = { won: false, demo: true, tut: 'watch', rabbit: false, roundEnd: false, review: false };
  cur = tutLevel();
  cur.roundIdx = 0;
  cur.rounds[0] = { board: ['', '', '', '', '', '', '', '', ''], over: false, hist: [], xq: null, oq: null, moves: 0 };
  cur.rng = mulberry32(90001);                  /* 教学局独立种子（不进正式局 RNG 域） */
  cur._scriptO = [1, 2];                        /* 演示局定版兔子应手（教学期不走 AI） */
  renderDots(); renderBoard(); renderTurnUI(); renderRoundDots();
  qText('看，三个连一线就赢啦');
  sayR(VOICE.watch.key, VOICE.watch.text);      /* tk_tut_watch：看！三个连一线（2952ms） */
  await wait(3300 * SPEED);                     /* t=3300 ≥ 2952+300=3252：clip 播完再演（不撞头） */
  if (state.tut !== 'watch') return;
  /* —— 看一局（demo：幽灵手指逐手点格，5 手走完整局） —— */
  const plan = [4, 0, 8];                       /* X 三手：4 中心 → 0 角 → 8 对角成三连 */
  for (const i of plan) {
    pointGhostAt(cellEl(i));                    /* 幽灵手指指向落子格 */
    await wait(600 * SPEED);
    ghost.press();
    await wait(320 * SPEED);
    const r = await uiTapCell(i, true);         /* demo 通道豁免 demo 门（演示吞真实输入） */
    if (state.tut !== 'watch') return;
    if (r === 'win') break;                     /* 第 3 手 X8 终局（endRound 演出已含胜局窗） */
    await wait(200 * SPEED);
  }
  window.__tkDemoR = 'done';                    /* 整局演示走完实证（§0.27，gate 断言 'done'——终值语义） */
  window.__tkWatchMs = Date.now() - t0w;        /* watch 段实测时长（verify 单元② 家族预算 ≤16s） */
  /* —— turn 你来下一局（帮→独）：迷你局2 走完 → startLevel(firstFlat) —— */
  const sv = KIDS._save() || {};
  sv.tictac = sv.tictac || {};
  sv.tictac.tutSeen = true;
  if (KIDS._save()) KIDS.store.persist();
  state = { won: false, demo: false, tut: 'help', rabbit: false, roundEnd: false, review: false };
  cur = tutLevel();                             /* 迷你局2（真兔子随机档，rng 独立种子） */
  cur.roundIdx = 0;
  cur.rounds[0] = { board: ['', '', '', '', '', '', '', '', ''], over: false, hist: [], xq: null, oq: null, moves: 0 };
  cur.rng = mulberry32(90002);
  renderDots(); renderBoard(); renderTurnUI(); renderRoundDots();
  qText(PROMPT_TEXT);
  helpRedemo = false;
  lastAct = Date.now();
  lastDir = Date.now();
  sayR(VOICE.turn.key, VOICE.turn.text);        /* tk_tut_turn：你来下一局（1752ms） */
  setTimeout(() => {
    if (state.tut === 'help') sayR(VOICE.hint.key, VOICE.hint.text);   /* 开题读题 */
  }, 2100);                                     /* ≥1752+300=2052 防尾截（turn 后读题延） */
  setTimeout(() => { if (state.tut === 'help') pointHelpNext(); }, 600 * SPEED);
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth;
  el.classList.add('breathe');

        oldestSeen = true;
      }
      const xi = vRollPick({ board: sim.board.slice(), xq: sim.xq.slice(), oq: sim.oq.slice() }, 'X');
      if (xi == null || sim.board[xi] !== '') return { r: 'noMove', oldestSeen: oldestSeen };
      const r = await window.TK.tapCell(xi);
      if (r === 'win' || r === 'draw' || r === 'lose') return { r: r, oldestSeen: oldestSeen };
      if (r !== 'moved') { await sleep(60); continue; }
      vRollApply(sim, 'X', xi); sim.moves++;
      const oi = vRollPick({ board: sim.board.slice(), xq: sim.xq.slice(), oq: sim.oq.slice() }, 'O');
      if (oi == null) return { r: 'noRabbit', oldestSeen: oldestSeen };
      vRollApply(sim, 'O', oi); sim.moves++;
    }
    return { r: null, oldestSeen: oldestSeen };
  }
  let vrDrive = null;
  if (vrOk && semOk) {
    window.TK.start(36);
    const rs = [];
    let oldestAny = false, bad = null;
    for (let r = 1; r <= 3; r++) {
      let rr = null;
      for (let t = 0; t < 60 && !rr; t++) {
        const pr = await driveVrollRound();
        if (pr.oldestSeen) oldestAny = true;
        if (!pr.r) { await sleep(80); continue; }
        if (pr.r !== 'win' && pr.r !== 'draw' && pr.r !== 'lose') { bad = pr.r; break; }
        rr = pr.r;
      }
      if (bad) break;
      rs.push(rr);
    }
    const lvV = window.TK.currentLevel;
    vrDrive = { rs: rs, bad: bad, oldest: oldestAny,
                lv: lvV && { done: lvV.done, score: lvV.score, stars: lvV.stars } };
    vrOk = !bad && rs.every(x => x === 'win' || x === 'draw' || x === 'lose') &&
      !!lvV && lvV.done === true && lvV.stars === vStars(lvV.score) && oldestAny;
    if (!vrOk) vrBad = bad || 'drive';
  } else if (!semOk) {
    vrOk = false; vrBad = 'sem';
  }
  if (vrOk) npass++;
  units.vroll = { ok: vrOk, bad: vrBad, sem: semOk, drive: vrDrive };

  window.__tkProg = 'U16';
  /* ---- ⑯ 复盘专项（负局=独立回溯对账+DOM 红绿格+胜局无复盘） ---- */
  total++;
  /* 胜局无复盘：重驱构造胜局 → review null */
  let rvWinOk = false;
  if (cw) {
    window.TK.start(cw.flat);
    for (let r = 1; r < cw.round; r++) await playRound(bd => vEmpties(bd)[0]);
    await unlockedT();
    for (const m of cw.moves) {
      const okw = await unlockedT();
      if (!okw || !cur || cur.done) break;
      const qq = window.TK.quiz;
      if (!qq || qq.board[m] !== '') break;
      const rr = await window.TK.tapCell(m);
      if (rr === 'win' || rr === 'draw' || rr === 'lose') break;
    }
    rvWinOk = window.TK.review === null;
  }
  /* 负局：独立重建手序（cl X 手+vPerfect O 应手）→ vReview 首误步 → TK.review 对账 */
  let rvOk = false, rvDetail = null;
  if (cl) {
    const histV = [];
    const bdS = ['', '', '', '', '', '', '', '', ''];
    for (let k = 0; k < cl.length; k++) {
      histV.push({ p: 'X', i: cl[k] });
      bdS[cl[k]] = 'X';
      if (vScan(bdS)) break;
      const oi = vPerfect(bdS.slice());
      histV.push({ p: 'O', i: oi });
      bdS[oi] = 'O';
      if (vScan(bdS)) break;
    }
    const expRv = vReview(histV);
    window.TK.start(18);
    await unlockedT();
    /* 走到最后一手前（复盘层在末手结算窗内出现——fire-and-forget 捕获） */
    for (let k = 0; k < cl.length - 1; k++) {
      const okw = await unlockedT();
      if (!okw || !cur || cur.done) break;
      const qq = window.TK.quiz;
      if (!qq || qq.board[cl[k]] !== '') break;
      const rr = await window.TK.tapCell(cl[k]);
      if (rr === 'win' || rr === 'draw' || rr === 'lose') break;
    }
    const pFinal = window.TK.tapCell(cl[cl.length - 1]);        /* 末手不 await——先捕层 */
    let ov = null;
    for (let g = 0; g < 160; g++) {
      ov = document.querySelector('.k-review');
      if (ov) break;
      await sleep(25);
    }
    let domRv = null;
    if (ov) {
      const missEl = ov.querySelector('.rv-cell.rev-miss');
      const bestEl = ov.querySelector('.rv-cell.rev-best');
      domRv = { miss: missEl ? Number(missEl.dataset.i) : -1,
                best: bestEl ? Number(bestEl.dataset.i) : -1,
                cells: ov.querySelectorAll('.rv-cell').length };
    }
    const rFinal = await pFinal;
    const tkRv = window.TK.review;
    rvDetail = { exp: expRv, got: tkRv, dom: domRv, rFinal: rFinal };
    rvOk = rFinal === 'lose' && !!expRv && !!tkRv &&
      tkRv.moveNo === expRv.moveNo && tkRv.missCell === expRv.missCell &&
      tkRv.bestCell === expRv.bestCell &&
      JSON.stringify(tkRv.boardBefore) === JSON.stringify(expRv.boardBefore) &&
      !!domRv && domRv.cells === 9 && domRv.miss === expRv.missCell &&
      domRv.best === expRv.bestCell;
  }
  const reviewOk = rvWinOk && rvOk;
  if (reviewOk) npass++;
  units.review = { ok: reviewOk, winNoReview: rvWinOk, lose: rvDetail };

  window.__tkProg = 'U17';
  /* ---- ⑰ 全谱实证（§-r18 delta4：X 全策略×O=页面 engPerfectPick 整树 DFS） ---- */
  total++;
  let spTotal = 0, spONodes = 0, spXWin = false, spAgree = true;
  const dfs17 = (bd, turn) => {
    spTotal++;
    const w = vScan(bd);
    if (w) { if (w.who === 'X') spXWin = true; return; }
    const e = vEmpties(bd);
    if (!e.length) return;
    if (turn === 'X') {
      for (const i of e) { bd[i] = 'X'; dfs17(bd, 'O'); bd[i] = ''; }
    } else {
      spONodes++;
      const pg = engPerfectPick(bd.slice());      /* 页面引擎（被验对象） */
      const vg = vPerfect(bd.slice());            /* verify 独立复算 */
      if (pg !== vg || e.indexOf(pg) < 0) spAgree = false;
      bd[pg] = 'O'; dfs17(bd, 'X'); bd[pg] = '';
    }
  };
  dfs17(['', '', '', '', '', '', '', '', ''], 'X');
  const spOk = !spXWin && spAgree && spTotal >= 1500 && spONodes >= 500;   /* python 先验 768 */
  if (spOk) npass++;
  units.fullSpectrum = { ok: spOk, xWin: spXWin, agree: spAgree,
                        totalNodes: spTotal, oNodes: spONodes };

  window.__tkProg = 'U18';
  /* ---- ⑱ 时长模型（§-r18 §4 精确值钉死，禁约数） ---- */
  total++;
  let mdOk = true, mdBad = null;
  const pinFlats = { 0: SPEC_MODELED.battle, 6: SPEC_MODELED.battle,
                     18: SPEC_MODELED.battle, 24: SPEC_MODELED.puzzle, 29: SPEC_MODELED.puzzle,
                     30: SPEC_MODELED.v44, 35: SPEC_MODELED.v44,
                     36: SPEC_MODELED.vroll, 41: SPEC_MODELED.vroll,
                     42: SPEC_MODELED.battle, 61: SPEC_MODELED.battle };
  for (const f of Object.keys(pinFlats)) {
    if (modeled(Number(f)) !== pinFlats[f]) {
      mdOk = false; mdBad = 'pin flat' + f + '=' + modeled(Number(f)) + '/' + pinFlats[f]; break;
    }
  }
  let minMd = Infinity;
  for (let f = 0; f < SPEC_CONSTS.STATIC_LEVELS; f++) {
    const m = modeled(f), vm = vModeled(f);
    if (m !== vm) { mdOk = false; mdBad = 'vmodeled flat' + f + '=' + m + '/' + vm; break; }
    if (m < SPEC_LEVEL_MIN) { mdOk = false; mdBad = 'min flat' + f + '=' + m; break; }
    if (m < minMd) minMd = m;
  }
  for (let f = SPEC_CONSTS.STATIC_LEVELS; f < 62; f++) {
    if (modeled(f) !== vModeled(f)) { mdOk = false; mdBad = 'gen flat' + f; break; }
  }
  if (minMd !== SPEC_MODELED.puzzle) { mdOk = false; mdBad = 'min=' + minMd; }
  if (mdOk) npass++;
  units.modeled = { ok: mdOk, bad: mdBad, min: minMd,
                    pins: SPEC_MODELED };

  window.__tkProg = 'U19';
  /* ---- ⑲ 章预告（7 章名+hint 双录+nextHint 章末逐点+生成关实算） ---- */
  total++;
  const chOk = Object.keys(SPEC_CHAPTERS).every(c =>
    CHAPTERS[Number(c)].name === SPEC_CHAPTERS[c] && CHAPTERS[Number(c)].hint === SPEC_CHAPTER_HINTS[c]);
  const nhOk = [5, 11, 17, 23, 29, 35, 41].every((f, k) =>
    nextHint(f) === SPEC_CHAPTER_HINTS[k + 1]);                 /* 章末预告=下一章 hint */
  const genHintOk = [47, 53, 59].every(f =>
    nextHint(f) === SPEC_GEN_HINTS[genLevel(f + 1).dch - 1]) && /* 生成关实算（家族 F） */
    GEN_HINTS[0] === SPEC_GEN_HINTS[0] && GEN_HINTS[1] === SPEC_GEN_HINTS[1] &&
    GEN_HINTS[2] === SPEC_GEN_HINTS[2] && GEN_HINTS[3] === SPEC_GEN_HINTS[3];
  const hintOk = chOk && nhOk && genHintOk;
  if (hintOk) npass++;
  units.hints = { ok: hintOk, chapters: chOk, nextHint: nhOk, gen: genHintOk };

  window.__tkProg = 'U20';
  /* ---- ⑳ SPEED 口径 ---- */
  total++;
  const sp20 = SPEED === 0.12;
  if (sp20) npass++;
  units.speed = { ok: sp20, speed: SPEED };

  const out = { game: 'tictac', total: total, pass: npass, units: units };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__tkVlog = out;                          /* 外部断言挂点（任务书钩子） */
  document.title = (npass === total) ? 'VERIFY PASS ' + npass + '/' + total
                                     : 'VERIFY FAIL ' + (total - npass) + '/' + total;
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text（__lastVoiceKey/__lastVoiceText）；
     voice.queue 记录拼播链（__lastQueue——胜/平/负/残局链绑定断言） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) { window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null; };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    window.__lastVoiceKey = parts && parts.length ? parts[0] : null;
  };
  /* 沙盒三件（b34 教训族）：_save stub / persist no-op / level.pass no-op——
     单元③在 KIDS.init 前通关 24 次，persistWin→KIDS.level.pass 在 core 内部 save=null
     上必炸（本款 verify 必须 stub，⑪ 再还原真函数） */
  window.__tkOrig = { save: KIDS._save, persist: KIDS.store.persist, pass: KIDS.level.pass };
  KIDS._save = function () { return { levels: {} }; };
  KIDS.store.persist = function () {};
  KIDS.level.pass = function () { return { chapterDone: false }; };
  runVerify();
}

</script>
