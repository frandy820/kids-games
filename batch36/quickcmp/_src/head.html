<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>快速比大小</title>
<style>
/* ================= 快速比大小 quickcmp（batch36·扩容批 6）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 左右两组圆点阵闪现（ch1/ch3 1200ms / ch2/ch4 1400ms 感知窗——FLASH_EASY/MID
   按章，r46 大数域档）→ 消隐
   （.veil 透明度过渡——DOM 恒在=闪现后残留计数锚）→ qc_ask+按钮点选
   （ch1 两按钮禁一样多 / ch2+ 三按钮含一样多）。
   渲染铁律：圆点等大同半径（r=8|7.5 同 viewBox——n≥13 大簇 7.5，r46）+网格抖动不重叠+左右区对称面板。
   闪现后无限时压力（反应款不抢快）；闪现窗内输入吞 null。
   章：ch1 subitizing 1-5 / ch2 10-20+等数 / ch3 Weber 10-20 比例带 0.85-0.90 / ch4 dual 双闪两问（seed 887）。
   触摸目标：答案按钮 ≥96×96、圆点面板 ≥120 高；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：左右对称圆点面板 + 中缝 VS 徽章 + 问句条 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:6px 12px}
/* 题面：暖色舞台垫（左右对称圆点面板+VS 徽章+问句条）——点按=再看一眼圆点 */
#scene{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:6px 8px;border-radius:24px;background:transparent;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#dots-row{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:18px}
.panel{position:relative;width:min(300px,38vw);height:min(300px,38vw);border-radius:26px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F8E7C2 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.panel .tag{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  font-size:17px;font-weight:700;padding:2px 14px;border-radius:10px;background:#FFF9EE;
  border:2px solid #4A3B2E;box-shadow:0 2px 0 #D8C9B4}
.panel svg{width:84%;height:74%;pointer-events:none}
/* 闪现态：入场 pop 逐点绽放（.dot stagger）→ .veil 消隐（透明度过渡，DOM 恒在） */
.panel .dot{animation:dot-pop .3s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes dot-pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.panel.veil .dot{opacity:0;transition:opacity .35s ease}
.panel.pulse{animation:qc-pulse 1.1s ease-in-out 1}
@keyframes qc-pulse{0%,100%{box-shadow:0 4px 0 #D8C9B4}50%{box-shadow:0 0 0 12px rgba(232,151,90,.5)}}
.panel.breathe{animation:qc-br 1.2s ease-in-out infinite}
@keyframes qc-br{0%,100%{box-shadow:0 4px 0 #D8C9B4}50%{box-shadow:0 0 0 14px rgba(232,151,90,.75)}}
/* r46 dual 第一问对：多的一侧面板 lit 记忆锚（保持到题末——第二问差值比较的视觉对象提示） */
.panel.lit{border-color:#E8975A;box-shadow:0 4px 0 #E8B98F,0 0 0 5px rgba(232,151,90,.28)}
.panel .demo-pet{position:absolute;right:8px;top:8px;opacity:0;transform:translateY(-16px);
  transition:all .5s cubic-bezier(.2,1.4,.4,1)}
.panel .demo-pet.show{opacity:1;transform:translateY(0)}
#vs{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
#scene .q-text{font-size:21px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}

/* ---------- 答案按钮排（主答案按钮 ≥96×96；ch1 2 个/ch2+ 3 个居中）
   按钮图示=圆点多少的方向示意（左多/一样多/右多——零文字依赖仍配短词双通道） ---------- */
#choices{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:14px;max-width:760px;padding:2px 4px}
#choices.bump{animation:ch-bump .22s ease}
@keyframes ch-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.side-btn{position:relative;width:150px;min-height:110px;border-radius:20px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;padding:8px 6px;transition:transform .15s}
.side-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.side-btn .lbl{font-size:21px;font-weight:700}
.side-btn svg{width:96px;height:34px;pointer-events:none}
.side-btn.pop{animation:btn-in .4s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes btn-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.side-btn.lit{border-color:#E8975A;background:#FDEFDC;animation:btn-lit .5s ease}
@keyframes btn-lit{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
.side-btn.wig{animation:btn-wig .4s ease}
@keyframes btn-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
.side-btn.breathe{animation:btn-br 1.2s ease-in-out infinite}
@keyframes btn-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.05)}}
/* r46 dual 第二问差值三档按钮（2/4/6 大数字——零识字依赖视觉主通道） */
.side-btn.gap .gapnum{font-size:44px;font-weight:800;line-height:1;color:#E8975A;
  -webkit-text-stroke:1.5px #4A3B2E}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-flash{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-flash:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-flash svg{width:48px;height:48px}
#btn-flash.bounce{animation:eye-b .45s ease}
@keyframes eye-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}

/* ---------- 幽灵手指教学（照 batch21-35） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：面板收小仍左右并排（比大小需同屏对照），答案按钮仍 ≥96 */
@media (orientation:portrait){
  #dots-row{gap:10px}
  .panel{width:min(158px,44vw);height:min(158px,44vw);border-radius:20px}
  .panel .tag{font-size:14px;padding:1px 10px;bottom:5px}
  .panel svg{width:88%;height:70%}
  .panel .demo-pet{transform:translateY(-10px) scale(.7)}
  .panel .demo-pet.show{transform:translateY(0) scale(.7)}
  #vs svg{width:32px;height:32px}
  #scene .q-text{font-size:18px;padding:3px 14px}
  #choices{gap:10px}
  .side-btn{width:31vw;min-height:104px}
  .side-btn .lbl{font-size:18px}
  .side-btn svg{width:86px;height:30px}
  .side-btn.gap .gapnum{font-size:36px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="快速比大小">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="哪边的圆点多，点我再看一遍圆点">
      <div id="dots-row">
        <div class="panel" id="panelL" aria-label="左边圆点"></div>
        <div id="vs" aria-hidden="true"></div>
        <div class="panel" id="panelR" aria-label="右边圆点"></div>
      </div>
    </button>
    <div id="choices" aria-label="答案按钮"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-flash" aria-label="再看一眼圆点"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
