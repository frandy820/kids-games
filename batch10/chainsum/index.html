<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>算术接龙</title>
<style>
/* ================= 算术接龙 chainsum（batch10）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   玩法 = 小兔子火车接龙：首节车厢=起点数字，尾部空车厢上方运算牌（+3/-2 大字），
   底部 3 张数字候选卡点选（主答案 ≥96 §0.9）；车厢为非交互数轴锚点（div 免 64 门，照 neighbors 房子）。
   数字=训练目标大字恒亮（§0.19）；题面指令全语音承载（§0.19），题面行=等式装饰性冗余；
   + 暖橙 / - 灰蓝 双色（与 batch8 up1/down1 同源）；overflowX 恒 0 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#BFD9A8;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：草地铁道（小火车） + 题面行 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:6px 10px}
#field{position:relative;width:100%;max-width:1180px;flex:1 1 auto;min-height:200px;
  background:#CBE7F0;border:3px solid #A8D3E2;border-radius:26px;overflow:hidden;
  box-shadow:inset 0 0 0 6px rgba(255,249,238,.4)}
#field .scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- 小火车（车厢横排，底部对齐坐轨；opsign 恒占位保车厢齐高）
   car[0]=车头（起点数字），car[i]=quizzes[i-1].answer，尾部 1 节空车厢=当前题 ---------- */
#trainwrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
  padding:14px 14px 20px;pointer-events:none}
#trainwrap::before{content:'';position:absolute;left:16px;right:16px;bottom:24px;height:6px;
  border-radius:3px;background:#C9A87C;box-shadow:0 3px 0 #B08A5E}
#trainwrap::after{content:'';position:absolute;left:16px;right:16px;bottom:12px;height:10px;
  background:repeating-linear-gradient(90deg,#B08A5E 0 12px,transparent 12px 27px);opacity:.75}
#train{display:flex;align-items:flex-end;gap:9px;max-width:100%;z-index:1}
.carslot{flex:1 1 0;max-width:122px;min-width:54px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end}
/* 运算牌：+ 暖橙 / - 灰蓝；空车厢上方大字；已填车厢侧占位空 div 保对齐 */
.opsign{height:46px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
.opsign b{display:inline-block;padding:3px 13px;border-radius:14px;background:#FFF9EE;
  border:2.5px solid #4A3B2E;font-size:clamp(24px,4.4vmin,33px);font-weight:800;line-height:1.1;
  box-shadow:0 3px 0 #D8C9B4;white-space:nowrap;font-variant-numeric:tabular-nums;
  animation:op-bounce 1.5s ease-in-out infinite}
.opsign.plus b{color:#E8873A}
.opsign.minus b{color:#5E82A6}
@keyframes op-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* 车厢：数字大字恒亮（§0.19 训练目标可见） */
.car{position:relative;width:100%;aspect-ratio:5/4;max-height:100px;min-height:52px;
  background:#FFF9EE;border:3px solid #4A3B2E;border-radius:14px;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center}
.car .cv{font-size:clamp(24px,5vmin,42px);font-weight:800;color:#4A3B2E;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
/* 车头（首节=起点数字）：烟囱 + 暖色车身 */
.carslot.head .car{background:#FBE9D2;border-color:#C77A42;box-shadow:0 4px 0 #D9B285}
.carslot.head .car .cv{color:#B05F22}
.carslot.head .car::before{content:'';position:absolute;top:-17px;left:50%;transform:translateX(-50%);
  width:13px;height:16px;border-radius:4px 4px 0 0;background:#C77A42;border:2.5px solid #4A3B2E;
  border-bottom:none}
.carslot.head .car::after{content:'';position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  width:11px;height:11px;border-radius:50%;background:#E8DCC8;opacity:0;
  animation:puff 2.6s ease-out infinite}
@keyframes puff{0%{opacity:0;transform:translateX(-50%) translateY(0) scale(.5)}
  25%{opacity:.85}100%{opacity:0;transform:translateX(-50%) translateY(-20px) scale(1.5)}}
/* 空车厢：虚线框 + 问号 + 呼吸高亮（当前题目标位） */
.car.empty{background:#FDF6E7;border:2.5px dashed #E8975A;box-shadow:0 4px 0 #E5D5BC}
.car.empty .cv{color:#E8873A}
.carslot.tail{animation:empty-breathe 1.9s ease-in-out infinite}
@keyframes empty-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 10px rgba(232,151,90,.75))}}
/* 刚填上：数字弹出 + 绿闪 */
.car.justlit{background:#8FBF7F;border-color:#6FA063;box-shadow:0 4px 0 #6FA063;
  animation:car-lit .5s cubic-bezier(.2,1.6,.4,1)}
.car.justlit .cv{color:#FFF9EE;animation:cv-in .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes car-lit{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes cv-in{from{transform:scale(0)}to{transform:scale(1)}}
/* 车轮（纯装饰） */
.wheels{display:flex;gap:22%;justify-content:center;padding-top:3px;height:20px}
.wheels i{width:15px;height:15px;border-radius:50%;background:#FBF7F0;border:3px solid #4A3B2E}

/* ---------- 题面行：等式（数字+运算符装饰性冗余，指令全语音承载 §0.19） ---------- */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:78px;
  padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:12px;padding:6px 26px;min-height:66px;
  border-radius:22px;background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  transition:transform .15s}
#prompt-chip:active{transform:translateY(3px)}
#prompt-chip .fnum{font-size:34px;font-weight:800;color:#4A3B2E;line-height:1;
  font-variant-numeric:tabular-nums}
#prompt-chip .fop{font-size:32px;font-weight:800;line-height:1}
#prompt-chip .fop.plus{color:#E8873A}
#prompt-chip .fop.minus{color:#5E82A6}
#prompt-chip .feq{font-size:26px;font-weight:800;color:#8A7B6C;line-height:1}
#prompt-chip .fq{font-size:34px;font-weight:800;color:#E8873A;line-height:1}

/* ---------- 候选数字卡（主答案按钮 ≥96） ---------- */
#cards{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:22px;
  padding:12px 10px 4px}
.cardbtn{width:116px;height:128px;border-radius:22px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;transition:transform .15s,box-shadow .15s;position:relative}
.cardbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.cardbtn .changer{width:44px;height:7px;border-radius:4px;background:#E5D5BC}
.cardbtn .cv{font-size:54px;font-weight:800;color:#4A3B2E;line-height:1;
  font-variant-numeric:tabular-nums}
/* 答对：绿底弹起 */
.cardbtn.lit{background:#8FBF7F;border-color:#6FA063;box-shadow:0 5px 0 #6FA063;
  animation:opt-lit .5s cubic-bezier(.2,1.6,.4,1)}
.cardbtn.lit .cv{color:#FFF9EE}
@keyframes opt-lit{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 答错：晃动后灰掉（零惩罚，排除法保底）；已灰卡不可点（真实点击落空白轻提示路径 §0.7） */
.cardbtn.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}
  55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
.cardbtn.dim{filter:grayscale(.75);opacity:.42;transform:scale(.93);pointer-events:none;
  box-shadow:0 3px 0 #D8C9B4}
/* 连错 2 次后 / 救援视觉重现：正确卡呼吸高亮（首错不 pulse，给再想机会） */
.cardbtn.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch8/9） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：候选卡/题面适配，主答案仍 ≥96 */
@media (orientation:portrait){
  .cardbtn{width:104px;height:116px}
  .cardbtn .cv{font-size:48px}
  #cards{gap:16px}
  #prompt-chip{gap:10px;padding:5px 20px}
  #prompt-chip .fnum,#prompt-chip .fq{font-size:29px}
  #prompt-chip .fop{font-size:27px}
  .opsign b{font-size:clamp(22px,4.6vw,29px)}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="算术接龙">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="field" aria-label="数字小火车">
      <div class="scene" aria-hidden="true"></div>
      <div id="trainwrap"><div id="train" aria-label="火车车厢数字"></div></div>
    </div>
    <div id="prompt">
      <button id="prompt-chip" aria-label="题目，点我再听一遍"></button>
    </div>
    <div id="cards" aria-label="候选数字卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= chainsum 纯引擎：确定性关卡生成 + 候选卡点选判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   链结构（SPEC-BATCH10 §1）：同关五题首尾相接——q0 以 s0 为当前数，q(i) 以 q(i-1).answer 为当前数，
   每题 cur 经 op(±)d 得 answer；全程数域 [lo,hi]（cur 与 answer 都在域内，s0 取自 PARAMS 恒在域内）
   op 多样性：逐题随机 + 禁连续 3 题同 op（长度 5 下必然 ± 各 ≥1）；ch4(alt) 高频交替=与上一题相反
   取数顺序：先定 op（多样性规则）→ 在 op 可行域内取 d（d∈[dmin,dmax] 且结果 ∈[lo,hi]；
   数域宽 ≥10 > 2*dmin，两 op 必有一个可行，多样性规则恒可满足，无重抽死循环）
   候选 3 张数字卡 = 答案 + 2 干扰（答案±(1|2|d) 中按 |1|,|2|,|d| 优先取，互异、≥1 禁 0 禁负、域内） */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- op 选择：多样性规则先行，可行域兜底（不可行换向——数域宽保证另一向恒可行）
   span = 该 op 在当前数下可用的最大跨度（+ 向 hi-cur / - 向 cur-lo） */
function pickOp(P, qi, rnd, ops, c) {
  let pref;
  if (P.alt && qi >= 1) pref = ops[qi - 1] === '+' ? '-' : '+';      // ch4：高频交替偏好
  else pref = rnd() < 0.5 ? '+' : '-';                              // 逐题随机
  if (qi >= 2 && ops[qi - 1] === pref && ops[qi - 2] === pref)       // 禁连续 3 题同 op
    pref = pref === '+' ? '-' : '+';
  const span = op => op === '+' ? P.hi - c : c - P.lo;
  if (span(pref) >= P.d[0]) return pref;
  return pref === '+' ? '-' : '+';                                  // 换向（至多 2 连同向，不违 3 连禁）
}

/* ---------- 单题生成（rnd 同流保证确定性） ---------- */
function genOne(P, qi, rnd, ops, c) {
  const op = pickOp(P, qi, rnd, ops, c);
  /* 试玩 P1②：每关首题热身 d≤2（ch2 实测五题全 d≥3 对 6 岁无过渡档）；
     warmCap≥dmin 各章恒成立（ch1 d=[1,2] cap=2 / ch3 dmin=2 cap=2 / ch2、4 dmin=1 cap=2） */
  const warmCap = qi === 0 ? Math.max(P.d[0], Math.min(2, P.d[1])) : P.d[1];
  const maxD = Math.min(warmCap, op === '+' ? P.hi - c : c - P.lo);  // op 可行域内取 d
  const d = ri(rnd, P.d[0], maxD);
  const answer = op === '+' ? c + d : c - d;
  /* 干扰池：答案±(1|2|d) 按 |1|→|2|→|d| 优先（d 与 1/2 重合时天然去重），过滤 ≥1 禁 0 禁负、域内、≠答案 */
  const pool = [answer + 1, answer - 1, answer + 2, answer - 2, answer + d, answer - d];
  const seen = [answer], ds = [];
  for (let k = 0; k < pool.length && ds.length < 2; k++) {
    const v = pool[k];
    if (v >= 1 && v <= P.hi && seen.indexOf(v) < 0) { seen.push(v); ds.push(v); }
  }
  const options = shuffled([answer, ds[0], ds[1]], rnd);
  return { cur: c, op: op, d: d, answer: answer, options: options,
    lo: P.lo, hi: P.hi, _miss: 0, _dim: [], _filled: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关=随机取章参数，pid 记录取的参数组） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const pid = flat < STATIC_LEVELS ? dch : ri(rnd, 1, 4);
  const P = PARAMS[pid];
  const s0 = ri(rnd, P.s0[0], P.s0[1]);
  const quizzes = [];
  const ops = [];
  let c = s0;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genOne(P, qi, rnd, ops, c);
    ops.push(q.op);
    c = q.answer;                                // 链推进：下一题当前数 = 本题结果
    quizzes.push(q);
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, pid: pid, s0: s0,
    quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点选引擎（无 DOM）：engTap(L, i) —— 点第 i 张候选数字卡（0-2）
   'goal' 答对（本题完成）/ 'done' 答对且最后一题（本关通关）
   'wrong' 答错（灰掉该卡零惩罚，排除法保底——灰化款 SPEC §1）
   'again' 点已灰卡（早退零惩罚不计数，防御层；真实点击被 pointer-events:none 拦，hook 兜底）
   null 非法下标或关卡已结束 ---------- */
function engTap(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  if (i !== 0 && i !== 1 && i !== 2) return null;
  const q = L.quizzes[L.step];
  if (q._dim && q._dim[i]) return 'again';
  if (q.options[i] === q.answer) {
    q._filled = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'goal';
  }
  q._dim[i] = true;
  q._miss = (q._miss || 0) + 1;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级：一关零错点（retries=0）=3 星；总错点 ≤2=2 星；否则 1 星。永不 0 星 */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 链校验（verify 用）：q0.cur===s0 且 q(i).cur===q(i-1).answer（首尾相接成链） ---------- */
function chainWhy(L) {
  if (!L || !Array.isArray(L.quizzes) || L.quizzes.length !== CH_LEN) return 'len';
  for (let k = 0; k < L.quizzes.length; k++) {
    const want = k === 0 ? L.s0 : L.quizzes[k - 1].answer;
    if (L.quizzes[k].cur !== want) return 'chain' + k;
  }
  return null;
}

/* ---------- 结构校验（verify 用）：op/d/answer 三元自洽、cur·answer 在数域内、
   候选 3 张含答案互异、干扰项 ≥1 禁 0 禁负域内且 |v-answer|∈{1,2,d}。
   返回具体失败原因便于审计 ---------- */
function structWhy(q) {
  if (!q || (q.op !== '+' && q.op !== '-')) return 'op';
  if (!Number.isInteger(q.d) || q.d < 1 || q.d > 6) return 'dRange';
  if (q.answer !== (q.op === '+' ? q.cur + q.d : q.cur - q.d)) return 'answer';
  if (!(q.cur >= q.lo && q.cur <= q.hi)) return 'curRange';
  if (!(q.answer >= q.lo && q.answer <= q.hi)) return 'ansRange';
  if (!Array.isArray(q.options) || q.options.length !== 3) return 'optLen';
  if (q.options.indexOf(q.answer) < 0) return 'noAnswer';
  const uniq = q.options.filter((v, i, a) => a.indexOf(v) === i);
  if (uniq.length !== 3) return 'optDup';
  if (!q.options.every(v => Number.isInteger(v) && v >= 0 && v <= q.hi)) return 'optRange';
  const ds = q.options.filter(v => v !== q.answer);
  if (!ds.every(v => v >= 1)) return 'distractorZero';
  if (!ds.every(v => [1, 2, q.d].indexOf(Math.abs(v - q.answer)) >= 0)) return 'distractorDist';
  return null;
}

async function uiTapCard(i, demo) {

    sfx('pop');

  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const run = cur;                              /* 身份守卫：演出窗口内重玩会重建 cur，防旧续体错推进 */
  const r = engTap(cur, i);
  if (r === null) return false;
  if (r === 'again') return 'again';            /* 已灰卡：早退零惩罚不计数（§0.7 防御层） */
  const el = cardEl(i);

  if (r === 'wrong') {                          /* 答错：晃动+灰掉（pointer-events:none）零惩罚，排除法保底 */
    if (el) { el.classList.remove('wig'); void el.offsetWidth; el.classList.add('wig', 'dim'); }

    if (q._miss >= 2) {                         /* 首错不 pulse：连错 2 次才高亮正确数字卡 */
      const ok = cardEl(q.options.indexOf(q.answer));
      if (ok) { ok.classList.remove('breathe'); void ok.offsetWidth; ok.classList.add('breathe'); }
    }
    await wait(480 * SPEED);
    return r;
  }

  /* ---- 答对：空车厢填数亮起（同步前缀）→ 演出窗 → 尾部挂新空车厢 ---- */
  lastAct = Date.now();                         /* 仅正确推进重置救援钟（§0.7a） */
  if (state.tut === 'help') {                   /* 教学"独"：首次答对 → 强化反馈放手 */
    state.tut = 'solo';

}

/* ================= ?verify=1 自检（仅 verify 分支加载执行）

   ③ UI 冒烟 A：flat0 真实通路通关（1 错=2 星，verify 页不弹层）
   ④ UI 冒烟 B1：flat10（ch3 大数字域 [0,20] d∈[2,5]）链值全在域内+车厢 DOM 与引擎链对账+

async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;
  const opDist = { 1: { plus: 0, minus: 0 }, 2: { plus: 0, minus: 0 },
                   3: { plus: 0, minus: 0 }, 4: { plus: 0, minus: 0 } };
  const genOp = { plus: 0, minus: 0 };
  const dMax = { 1: 0, 2: 0, 3: 0, 4: 0 };

  /* ---- ① 40 关全量审计（flat 0-39） ---- */
  for (let flat = 0; flat < 40; flat++) {

    const det = JSON.stringify(L1.quizzes) === JSON.stringify(L2.quizzes);   // 确定性
    let structAll = true, chainOk = true, ruleOk = true, opsOk = true, driveOk = true;

      if (structWhy(q)) structAll = false;
      if (q.lo !== P.lo || q.hi !== P.hi) ruleOk = false;                    // 数域随参数组
      if (!(q.d >= P.d[0] && q.d <= P.d[1])) ruleOk = false;                 // d 在章区间
      if (k === 0 && q.d > 2) ruleOk = false;                                // 试玩 P1②：每关首题热身 d<=2（warmCap=max(dmin,min(2,dmax))）
      cnt[q.op === '+' ? 'plus' : 'minus']++;
      if (flat < STATIC_LEVELS) { opDist[L1.dch][q.op === '+' ? 'plus' : 'minus']++; dMax[L1.dch] = Math.max(dMax[L1.dch], q.d); }
      else genOp[q.op === '+' ? 'plus' : 'minus']++;
      if (k >= 2 && L1.quizzes[k - 1].op === q.op && L1.quizzes[k - 2].op === q.op) opsOk = false;   // 禁连续 3 同
      if (k >= 1 && L1.quizzes[k - 1].op !== q.op) switches++;
    }
    if (cnt.plus < 1 || cnt.minus < 1) opsOk = false;                        // 每关 ± 各 ≥1
    if (L1.dch === 4 && flat < STATIC_LEVELS && switches < 3) opsOk = false; // ch4 高频交替
    /* 引擎直驱：首题两张干扰连错（灰化款 miss 封顶 2）→ 已灰 again 早退 → 逐题全对通关（2 星）；
       另取新关全对通关（3 星） */
    const Ld = genLevel(flat);
    const q0 = Ld.quizzes[0];
    const ws = q0.options.map((v, i) => v !== q0.answer ? i : -1).filter(x => x >= 0);
    if (engTap(Ld, ws[0]) !== 'wrong' || Ld.retries !== 1 || q0._miss !== 1 || !q0._dim[ws[0]]) driveOk = false;
    if (engTap(Ld, ws[1]) !== 'wrong' || Ld.retries !== 2 || q0._miss !== 2 || !q0._dim[ws[1]]) driveOk = false;
    if (engTap(Ld, ws[0]) !== 'again' || Ld.retries !== 2) driveOk = false;  // 已灰卡防御层
    for (let k = 0; k < CH_LEN && driveOk; k++) {
      const q = Ld.quizzes[k];
      const want = k === CH_LEN - 1 ? 'done' : 'goal';
      if (engTap(Ld, q.options.indexOf(q.answer)) !== want) driveOk = false;
      if (!q._filled) driveOk = false;
    }
    const solvedAll = Ld.done && Ld.step === CH_LEN && Ld.retries === 2 && engStars(Ld) === 2;
    const L3 = genLevel(flat);
    for (let k = 0; k < CH_LEN; k++) engTap(L3, L3.quizzes[k].options.indexOf(L3.quizzes[k].answer));
    if (!L3.done || engStars(L3) !== 3) driveOk = false;
    const ok = det && chainOk && structAll && ruleOk && opsOk && driveOk && Ld.done &&
      L1.quizzes.length === CH_LEN;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, pid: L1.pid, ok: ok, det: det, chainOk: chainOk,
      structAll: structAll, ruleOk: ruleOk, opsOk: opsOk, driveOk: driveOk && solvedAll,
      qs: L1.quizzes.map(q => q.cur + (q.op === '+' ? '+' : '-') + q.d + '=' + q.answer +
        '[' + q.options.join(',') + ']') };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② tapCard 单元（flat 0 真实 UI 状态机） ---- */
  total++;
  startLevel(0);
  const q0 = CS.quiz;
  const cards0 = Array.prototype.slice.call(cardsEl.querySelectorAll('.cardbtn'));
  /* DOM 对账：3 张卡 data-i 0-2、卡面数字与引擎 options 一致（渲染即引擎） */
  const alignOk = q0 && cards0.length === 3 && cards0.every((c, i) =>
    Number(c.dataset.i) === i &&
    c.querySelector('.cv').textContent === String(q0.options[i]));
  const ws0 = q0.options.map((v, i) => v !== q0.answer ? i : -1).filter(x => x >= 0);
  const wIdx = ws0[0], okIdx = q0.options.indexOf(q0.answer);
  const rW = await CS.tapCard(wIdx);              // 首错：晃动+灰掉+miss 计数+dead 标记+首错不 pulse
  const wEl = cardEl(wIdx), okEl = cardEl(okIdx);
  const wrongOk = rW === 'wrong' && CS.quiz.miss === 1 && CS.currentLevel.retries === 1 &&
    CS.quiz.step === 0 && !!CS.quiz.dead[wIdx] && !CS.quiz.dead[okIdx] &&
    wEl.classList.contains('dim') && wEl.classList.contains('wig') &&
    getComputedStyle(wEl).pointerEvents === 'none' &&      /* 灰掉：排除法保底（SPEC §1 灰化款） */
    !okEl.classList.contains('breathe');                   /* 首错不 pulse */
  const rA = await CS.tapCard(wIdx);              // 已灰卡 hook 点击：again 早退零惩罚
  const againOk = rA === 'again' && CS.quiz.miss === 1 && CS.currentLevel.retries === 1;
  const badIdx = (await CS.tapCard(3)) === false && (await CS.tapCard(-1)) === false &&
    (await CS.tapCard('x')) === false;
  const pOk = CS.tapCard(okIdx);                  // 答对：空车厢同步填数亮起（950ms 演出窗内读）
  const litCard = cardEl(okIdx).classList.contains('lit');
  const slot1 = carEl(1);
  const fillOk = !!slot1 && slot1.querySelector('.car').classList.contains('justlit') &&
    !slot1.querySelector('.car').classList.contains('empty') &&
    slot1.querySelector('.cv').textContent === String(q0.answer) &&
    !slot1.querySelector('.opsign b');                     /* 运算牌随填车摘牌 */
  const rOk = await pOk;
  /* 演出窗收尾 renderQuiz：3 节车（车头+1 已填）+ 新空车厢带新运算牌，等式 chip 同步 */
  const q1 = CS.quiz;
  const slot2 = carEl(2);
  const growOk = rOk === 'goal' && q1 && q1.step === 1 && trainEl.querySelectorAll('.carslot').length === 3 &&
    !!slot2 && slot2.querySelector('.car').classList.contains('empty') &&
    slot2.querySelector('.cv').textContent === '?' &&
    slot2.querySelector('.opsign b').textContent === q1.op + q1.d &&
    chipEl.querySelector('.fnum').textContent === String(q1.cur);
  const tapOk = alignOk && wrongOk && againOk && badIdx && litCard && fillOk && growOk;
  if (tapOk) npass++;
  units.tapCard = { ok: tapOk, align: alignOk, wrong: wrongOk, again: againOk,
    badIdx: badIdx, lit: litCard, fill: fillOk, grow: growOk };

  /* ---- ②b sayW 三态（页面单元）：flat<3 每错必播 / flat≥3 10s 节流 / 灰化款豁免恰一次 ---- */
  total++;
  const wLog = [];
  const origPlay2 = KIDS.voice.play;
  KIDS.voice.play = function (key, text) { wLog.push([key, String(text).slice(0, 4)]); };
  /* T46 阶段2：纠错句 clip 化——key 从 null 变 cs_wrong（文本族不变） */
  const wrongPlays = () => wLog.filter(p => p[0] === 'cs_wrong' && p[1].indexOf('再想') === 0).length;
  const wrongPair = () => {
    const q = CS.quiz;
    return q.options.map((v, i) => v !== q.answer ? i : -1).filter(x => x >= 0);
  };
  startLevel(0);                                   // flat0：每错必播（两张干扰各错一次）
  const wp0 = wrongPair();
  await CS.tapCard(wp0[0]);
  await CS.tapCard(wp0[1]);
  const sayA = wrongPlays();                       // → 2
  startLevel(3);                                   // flat3：10s 节流
  lastWrongVoice = Date.now();                     /* flat0 分支不写时间戳，显式进入窗口内 */
  const wp3 = wrongPair();
  await CS.tapCard(wp3[0]);                        // miss=1 窗口内 → 节流不播
  const sayB = wrongPlays() - 2;                   // 增量 → 0
  startLevel(3);                                   // 同关重发 fresh quiz：miss 封顶 2 → force 豁免恰一次
  lastWrongVoice = 0;                              /* 隔离上一子用例时间戳 */
  const wp3b = wrongPair();
  await CS.tapCard(wp3b[0]);                       // miss=1 → 播（10s 窗口早已过）
  await CS.tapCard(wp3b[1]);                       // miss=2 → force → 播
  const sayC = wrongPlays() - 2 - sayB;            // 增量 → 2
  KIDS.voice.play = origPlay2;
  const sayWOk = sayA === 2 && sayB === 0 && sayC === 2;
  if (sayWOk) npass++;
  units.sayW = { ok: sayWOk, flat0Plays: sayA, flat3Throttle: sayB, flat3Force: sayC };

  /* ---- ③ UI 冒烟 A：flat0 真实通路通关（首题先错一次 → 1 错=2 星，verify 页不弹层） ---- */
  total++;
  startLevel(0);
  let smokeA = true, wrongOk2 = false, steps = 0;
  for (let s = 0; s < CH_LEN && smokeA; s++) {
    const q = CS.quiz;
    if (!q) { smokeA = false; break; }
    if (s === 0) {                               // 首错：灰牌零惩罚；首错不 pulse 正确卡
      const w = q.options.findIndex(v => v !== q.answer);
      await CS.tapCard(w);
      wrongOk2 = CS.currentLevel.retries === 1 && CS.currentLevel.step === 0 &&
        !cardEl(q.options.indexOf(q.answer)).classList.contains('breathe');
    }
    const r = await CS.tapCard(q.options.indexOf(q.answer));
    if (r !== 'goal' && r !== 'done') smokeA = false;
    steps++;
  }
  const lvA = CS.currentLevel;
  const smokeOkA = smokeA && wrongOk2 && steps === CH_LEN && lvA.done && lvA.won &&
    lvA.retries === 1 && engStars(cur) === 2 && !document.querySelector('.k-celebrate');
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, wrongOk: wrongOk2, steps: steps, retries: lvA.retries, stars: engStars(cur) };

  /* ---- ④ UI 冒烟 B1：flat10（ch3 大数字域 [0,20] d∈[2,5]）链值域内+车厢 DOM 对账+autoSolve 3 星 ---- */
  total++;
  startLevel(10);
  const L10 = genLevel(10);
  /* 首题态：车头=s0 + 空车厢=?（2 节车） */
  const headOk10 = !!carEl(0) && carEl(0).querySelector('.cv').textContent === String(L10.s0);
  const tailOk10 = !!carEl(1) && carEl(1).querySelector('.car').classList.contains('empty');
  const dOk10 = L10.quizzes.every(q => q.d >= 2 && q.d <= 5 &&
    q.cur >= 0 && q.cur <= 20 && q.answer >= 0 && q.answer <= 20);
  const a10 = await CS.autoSolve();
  const lv10 = CS.currentLevel;
  /* 通关态：6 节车全填（车头 s0 + 5 个结果），车厢 DOM 数字与引擎链逐一一致 */
  const chainVals = [L10.s0].concat(L10.quizzes.map(q => q.answer));
  const slotsAll = Array.prototype.slice.call(trainEl.querySelectorAll('.carslot'));
  const domChainOk = lv10.done && slotsAll.length === 6 &&
    chainVals.every((v, i) => slotsAll[i] &&
      slotsAll[i].querySelector('.cv').textContent === String(v));
  const smokeOkB1 = headOk10 && tailOk10 && dOk10 && domChainOk && a10.done && lv10.done &&
    lv10.won && lv10.retries === 0 && engStars(cur) === 3;
  if (smokeOkB1) npass++;
  smokes.flat10 = { ok: smokeOkB1, headOk: headOk10, tailOk: tailOk10, dOk: dOk10,
    domChain: domChainOk, taps: a10.taps, stars: engStars(cur),
    qs: L10.quizzes.map(q => q.cur + q.op + q.d + '=' + q.answer) };

  /* ---- ④ UI 冒烟 B2：flat17（ch4 高频交替）± 各 ≥1+切换 ≥3+真实点击通关 ---- */
  total++;
  startLevel(17);
  const L17 = genLevel(17);
  const ops17 = L17.quizzes.map(q => q.op);
  let sw17 = 0;
  for (let k = 1; k < ops17.length; k++) if (ops17[k] !== ops17[k - 1]) sw17++;
  const kindsOk = ops17.indexOf('+') >= 0 && ops17.indexOf('-') >= 0 && sw17 >= 3;
  let mixTapOk = true;
  for (let s = 0; s < CH_LEN && mixTapOk; s++) {
    const q = CS.quiz;
    if (!q) { mixTapOk = false; break; }
    const r = await CS.tapCard(q.options.indexOf(q.answer));
    if (r !== 'goal' && r !== 'done') mixTapOk = false;
  }
  const lv17 = CS.currentLevel;
  const smokeOkB2 = kindsOk && mixTapOk && lv17.done && lv17.won && lv17.retries === 0;
  if (smokeOkB2) npass++;
  smokes.flat17 = { ok: smokeOkB2, kinds: kindsOk, switches: sw17, ops: ops17, retries: lv17.retries };

  /* ---- ⑤ 布局：双 viewport 模拟 ×（flat0 首题 2 节车 / flat17 推进至 6 节车=最宽链） ---- */
  async function simView(w, h) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    renderQuiz();                                 // 按新场地尺寸重排
    await wait(750);                              /* 等入场动画结束再量（§0.11 transform 中途陷阱） */
    const de = document.documentElement;
    const q = CS.quiz;
    const slots = Array.prototype.slice.call(trainEl.querySelectorAll('.carslot'));
    const nCars = Math.min(cur.step, CH_LEN) + 2;
    let carsOk = slots.length === nCars;          // 车厢数=step+2 + 车厢数字与链一致（尾部=?）
    slots.forEach((s, i) => {
      const t = s.querySelector('.cv').textContent;
      const want = i === nCars - 1 ? '?' : String(i === 0 ? cur.s0 : cur.quizzes[i - 1].answer);
      if (t !== want) carsOk = false;
    });
    const carRects = slots.map(s => s.getBoundingClientRect());
    const carSzOk = carRects.every(r => r.width >= 64 && r.height >= 56);    /* 车厢可读尺寸 */
    const sign = trainEl.querySelector('.carslot.tail .opsign b');
    const sr = sign ? sign.getBoundingClientRect() : null;
    const signOk = !!sr && sr.width >= 36 && sr.height >= 22 &&
      sign.textContent === q.op + q.d;            /* 运算牌大字可见且与题面同步 */
    const cards = Array.prototype.slice.call(cardsEl.querySelectorAll('.cardbtn'));
    const rects = cards.map(c => c.getBoundingClientRect());
    const cardOk = rects.length === 3 &&
      rects.every(r => r.width >= 96 && r.height >= 96);          /* 主答案按钮 ≥96（§0.9） */
    let btnOk = true;                             // 全部按钮 ≥64（.k-parentbtn 家长按钮豁免）
    document.querySelectorAll('button').forEach(b => {
      if (b.classList.contains('k-parentbtn')) return;
      const r = b.getBoundingClientRect();
      if (r.width > 4 && r.height > 4 && (r.width < 64 || r.height < 64)) btnOk = false;
    });
    const fRect = fieldEl.getBoundingClientRect();
    const insideOk = carRects.every(r =>          // 车厢在场景内（不溢出）
      r.left >= fRect.left - 1 && r.right <= fRect.right + 1 &&
      r.top >= fRect.top - 1 && r.bottom <= fRect.bottom + 1);
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, dch: cur.dch, step: cur.step, carsOk: carsOk, carSz: carSzOk,
      signOk: signOk, card96: cardOk, btn64: btnOk, insideOk: insideOk, ox: ox,
      pass: carsOk && carSzOk && signOk && cardOk && btnOk && insideOk && ox <= 0 };
  }
  total++;
  const sims = [];
  startLevel(0);                                  // 首题态：车头+空车厢（2 节）
  sims.push(await simView(1280, 800)); sims.push(await simView(800, 1180));
  startLevel(17);                                 // ch4 推进 4 题：6 节车=最宽链
  for (let k = 0; k < 4; k++) engTap(cur, cur.quizzes[k].options.indexOf(cur.quizzes[k].answer));
  renderQuiz();
  sims.push(await simView(1280, 800)); sims.push(await simView(800, 1180));
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                  // 还原真实 viewport 布局
  const layoutOk = sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑥ 分布与专项：op 分布 / d 上限覆盖 / numCn 字表 / qSpeech 拼句 / clips 注入 / 开场链 ---- */
  total++;
  /* numCn 独立字表对账（零手抄）：1-20 逐一相符且互异 */
  const NUMCN = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十',
    '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十'];
  let cnOk = true;
  const seenCn = {};
  if (numCn(0) !== '零') cnOk = false;             /* 审查 M1：0 数词臂（answer=0 链推进可达 cur=0） */
  for (let i = 1; i <= 20; i++) {
    if (numCn(i) !== NUMCN[i]) cnOk = false;
    if (seenCn[numCn(i)]) cnOk = false;
    seenCn[numCn(i)] = 1;
  }
  /* qSpeech 独立拼句对账（SPEC §1 例句 '八加三等于几呀'） */
  const spOk = qSpeech({ cur: 8, op: '+', d: 3 }) === '八加三等于几呀' &&
    qSpeech({ cur: 9, op: '-', d: 2 }) === '九减二等于几呀' &&
    qSpeech({ cur: 12, op: '+', d: 5 }) === '十二加五等于几呀' &&
    qSpeech({ cur: 20, op: '-', d: 6 }) === '二十减六等于几呀' &&
    qSpeech({ cur: 0, op: '+', d: 2 }) === '零加二等于几呀';    /* 审查 M1：cur=0 型 */
  /* cs_* clips 注入对账（T46 阶段2：3 句+25 段=cs_n_ 0-20/op×2/tail+wrong） */
  const CS_KEYS = ['cs_hint', 'cs_tut_turn', 'cs_tut_watch', 'cs_wrong',
    'cs_op_add', 'cs_op_sub', 'cs_tail']
    .concat(Array.from({ length: 21 }, (_, i) => 'cs_n_' + i));
  const clipOk = CS_KEYS.every(k => !!KIDS.voice.clips[k]);
  /* 开场顺序链（stub 记录；T46 阶段2）：queue([cs_hint, 题面段…]) 单通道链 */
  const origP = KIDS.voice.play, origS = KIDS.voice.say, origQ = KIDS.voice.queue;
  const playLog = [], sayLog = [], qLog = [];
  KIDS.voice.play = function (key) { playLog.push(String(key)); };
  KIDS.voice.say = function (t) { sayLog.push(String(t)); };
  KIDS.voice.queue = function (parts) { qLog.push(parts.slice()); };
  startLevel(0);
  const q0b = genLevel(0).quizzes[0];
  const openQ = qLog.some(p => p.length === 5 && p[0] === 'cs_hint' &&
    p.slice(1).every((k, i) => k === qParts(q0b)[i]));       // 开场链=hint+题面 4 段
  KIDS.voice.play = origP; KIDS.voice.say = origS; KIDS.voice.queue = origQ;
  const distOk = cnOk && spOk && clipOk && openQ &&
    opDist[1].plus >= 1 && opDist[1].minus >= 1 &&
    opDist[2].plus >= 1 && opDist[2].minus >= 1 &&
    opDist[3].plus >= 1 && opDist[3].minus >= 1 &&
    opDist[4].plus >= 1 && opDist[4].minus >= 1 &&
    genOp.plus >= 1 && genOp.minus >= 1 &&                         /* 生成关随机参数两类都出现 */
    dMax[1] === PARAMS[1].d[1] && dMax[2] === PARAMS[2].d[1] &&    /* 各章 d 上限有覆盖 */
    dMax[3] === PARAMS[3].d[1] && dMax[4] === PARAMS[4].d[1];
  if (distOk) npass++;
  units.dist = { ok: distOk, numCn: cnOk, speech: spOk, clips: clipOk,
    openQ: openQ, opDist: opDist, genOp: genOp, dMax: dMax };

  const out = { game: 'chainsum', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
</body>
