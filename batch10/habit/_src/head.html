<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>好习惯排序</title>
<style>
/* ================= 好习惯排序 habit（batch10 r5）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   玩法 = 题面流程名（hb_q_* clip+'，先做什么呀' 拼句）+ 上方"顺序条" n 槽（6-8）
   + 下方 6-9 张乱序步骤卡（真实步+干扰卡交错；圆底色块+emoji 大字+步骤短词）。
   点对=卡 CSS transition 飞入顺序条第 pos 位亮起；点错/点干扰卡=晃动（不灰化可重点，
   SPEC §3-r5 不灰化款）。
   触摸目标：步骤卡 = 主答案按钮 ≥96×96（§0.9）；底栏按钮 ≥64；overflowX 恒 0。
   题面指令全语音承载（§0.19），步骤短词=识字训练目标，大字可见 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#BFD9A8;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面行 + 顺序条 + 步骤卡区 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:8px 14px}

/* 题面行：流程图标 emoji + 流程名大字 + '，先做什么呀？'（指令全语音承载，文字为识字冗余） */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:76px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:12px;padding:5px 24px;min-height:66px;
  border-radius:22px;background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  transition:transform .15s}
#prompt-chip:active{transform:translateY(3px)}
#prompt-chip .p-ico{font-size:36px;line-height:1}
#prompt-chip .p-name{font-size:32px;font-weight:800;color:#E8873A;line-height:1;white-space:nowrap}
#prompt-chip .p-ask{font-size:21px;font-weight:700;color:#4A3B2E;line-height:1;white-space:nowrap}

/* 顺序条：n 槽横排居中；空槽=虚线+序号大字，亮槽=绿底+emoji+角标序号 */
#strip-wrap{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 4px}
#strip{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:nowrap}
.slot{width:84px;height:84px;border-radius:20px;border:3px dashed #D8C9B4;background:#FFF9EE;
  display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.slot .s-num{font-style:normal;font-size:30px;font-weight:800;color:#D8C9B4;line-height:1}
.slot.lit{border-style:solid;border-color:#6FA063;background:#8FBF7F;
  animation:slot-lit .5s cubic-bezier(.2,1.6,.4,1)}
.slot.lit .s-num{position:absolute;top:-9px;right:-9px;width:27px;height:27px;border-radius:50%;
  background:#FFF9EE;border:2px solid #6FA063;color:#4A3B2E;font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.slot.lit .s-emoji{font-size:40px;line-height:1}
@keyframes slot-lit{0%{transform:scale(.4)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
/* 飞入动画克隆体（CSS transition：源卡矩形 → 目标槽矩形） */
.fly{position:fixed;z-index:90;border-radius:20px;background:#FFF9EE;border:3px solid #6FA063;
  box-shadow:0 4px 0 #6FA063;display:flex;align-items:center;justify-content:center;
  font-size:44px;line-height:1;pointer-events:none;
  transition:transform .42s cubic-bezier(.3,.85,.35,1.08)}

/* 步骤卡区：6-9 张卡（真实步+干扰卡交错，乱序展示），卡=主答案按钮 ≥96×96。
   r5 卡数增多：flex-wrap 换行（桌面 1280 一行 9 张≈1158px；竖屏 800 一行 6 张，
   9 卡换行 6+3），换行临界由 verify 双 viewport bbox 实测定案 */
#board{flex:0 0 auto;display:flex;gap:12px;justify-content:center;align-items:stretch;
  flex-wrap:wrap;width:100%;max-width:1180px;padding:0 2px}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;flex:1 1 118px;min-width:96px;max-width:200px;min-height:130px;
  padding:8px 4px;transition:transform .15s}
.card:active{transform:translateY(3px)}
.card .c-emoji{font-size:44px;line-height:1.15;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.card .c-word{font-size:21px;font-weight:800;color:#4A3B2E;line-height:1.25;white-space:nowrap}
/* 入场弹跳（换题 stagger） */
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 已排入顺序条：隐藏保位（不可再点——它已不是候选；区别于点错的不灰化） */
.card.gone{visibility:hidden;pointer-events:none}
/* 答错：晃动（不灰掉——每张卡都可能是下一步，SPEC §3 不灰化款，可重点） */
.card.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}
  55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
/* 连错 2 次后：应点卡呼吸高亮（首错不 pulse，miss≥2 才高亮 §0.7） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 静置救援：当前应点卡 pulse 一次（§0.21 视觉重现——语音之外屏幕可感知） */
.card.pulse{animation:an-pulse 1.2s ease 1}
@keyframes an-pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.16)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch9） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：chip/底栏/卡适配，主答案卡仍 ≥96 */
@media (orientation:portrait){
  #prompt-chip{gap:9px;padding:5px 18px}
  #prompt-chip .p-ico{font-size:31px}
  #prompt-chip .p-name{font-size:27px}
  #prompt-chip .p-ask{font-size:18px}
  .slot{width:78px;height:78px}
  .slot.lit .s-emoji{font-size:36px}
  #board{gap:9px}
  .card{gap:3px;min-height:118px;max-width:170px}
  .card .c-emoji{font-size:38px}
  .card .c-word{font-size:18px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="好习惯排序">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <button id="prompt-chip" aria-label="题目，点我再听一遍"></button>
    </div>
    <div id="strip-wrap" aria-label="顺序条">
      <div id="strip"></div>
    </div>
    <div id="board" aria-label="步骤卡片"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
