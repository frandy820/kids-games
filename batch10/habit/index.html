<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>好习惯排序</title>
<style>
/* ================= 好习惯排序 habit（batch10 r5）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   玩法 = 题面流程名（hb_q_* clip+'，先做什么呀' 拼句）+ 上方"顺序条" n 槽（6-8）
   + 下方 6-9 张乱序步骤卡（真实步+干扰卡交错；圆底色块+emoji 大字+步骤短词）。
   点对=卡 CSS transition 飞入顺序条第 pos 位亮起；点错/点干扰卡=晃动（不灰化可重点，
   SPEC §3-r5 不灰化款）。
   触摸目标：步骤卡 = 主答案按钮 ≥96×96（§0.9）；底栏按钮 ≥64；overflowX 恒 0。
   题面指令全语音承载（§0.19），步骤短词=识字训练目标，大字可见 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#BFD9A8;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面行 + 顺序条 + 步骤卡区 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:8px 14px}

/* 题面行：流程图标 emoji + 流程名大字 + '，先做什么呀？'（指令全语音承载，文字为识字冗余） */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:76px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:12px;padding:5px 24px;min-height:66px;
  border-radius:22px;background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  transition:transform .15s}
#prompt-chip:active{transform:translateY(3px)}
#prompt-chip .p-ico{font-size:36px;line-height:1}
#prompt-chip .p-name{font-size:32px;font-weight:800;color:#E8873A;line-height:1;white-space:nowrap}
#prompt-chip .p-ask{font-size:21px;font-weight:700;color:#4A3B2E;line-height:1;white-space:nowrap}

/* 顺序条：n 槽横排居中；空槽=虚线+序号大字，亮槽=绿底+emoji+角标序号 */
#strip-wrap{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 4px}
#strip{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:nowrap}
.slot{width:84px;height:84px;border-radius:20px;border:3px dashed #D8C9B4;background:#FFF9EE;
  display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.slot .s-num{font-style:normal;font-size:30px;font-weight:800;color:#D8C9B4;line-height:1}
.slot.lit{border-style:solid;border-color:#6FA063;background:#8FBF7F;
  animation:slot-lit .5s cubic-bezier(.2,1.6,.4,1)}
.slot.lit .s-num{position:absolute;top:-9px;right:-9px;width:27px;height:27px;border-radius:50%;
  background:#FFF9EE;border:2px solid #6FA063;color:#4A3B2E;font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.slot.lit .s-emoji{font-size:40px;line-height:1}
@keyframes slot-lit{0%{transform:scale(.4)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
/* 飞入动画克隆体（CSS transition：源卡矩形 → 目标槽矩形） */
.fly{position:fixed;z-index:90;border-radius:20px;background:#FFF9EE;border:3px solid #6FA063;
  box-shadow:0 4px 0 #6FA063;display:flex;align-items:center;justify-content:center;
  font-size:44px;line-height:1;pointer-events:none;
  transition:transform .42s cubic-bezier(.3,.85,.35,1.08)}

/* 步骤卡区：6-9 张卡（真实步+干扰卡交错，乱序展示），卡=主答案按钮 ≥96×96。
   r5 卡数增多：flex-wrap 换行（桌面 1280 一行 9 张≈1158px；竖屏 800 一行 6 张，
   9 卡换行 6+3），换行临界由 verify 双 viewport bbox 实测定案 */
#board{flex:0 0 auto;display:flex;gap:12px;justify-content:center;align-items:stretch;
  flex-wrap:wrap;width:100%;max-width:1180px;padding:0 2px}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;flex:1 1 118px;min-width:96px;max-width:200px;min-height:130px;
  padding:8px 4px;transition:transform .15s}
.card:active{transform:translateY(3px)}
.card .c-emoji{font-size:44px;line-height:1.15;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.card .c-word{font-size:21px;font-weight:800;color:#4A3B2E;line-height:1.25;white-space:nowrap}
/* 入场弹跳（换题 stagger） */
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 已排入顺序条：隐藏保位（不可再点——它已不是候选；区别于点错的不灰化） */
.card.gone{visibility:hidden;pointer-events:none}
/* 答错：晃动（不灰掉——每张卡都可能是下一步，SPEC §3 不灰化款，可重点） */
.card.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}
  55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
/* 连错 2 次后：应点卡呼吸高亮（首错不 pulse，miss≥2 才高亮 §0.7） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 静置救援：当前应点卡 pulse 一次（§0.21 视觉重现——语音之外屏幕可感知） */
.card.pulse{animation:an-pulse 1.2s ease 1}
@keyframes an-pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.16)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch9） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：chip/底栏/卡适配，主答案卡仍 ≥96 */
@media (orientation:portrait){
  #prompt-chip{gap:9px;padding:5px 18px}
  #prompt-chip .p-ico{font-size:31px}
  #prompt-chip .p-name{font-size:27px}
  #prompt-chip .p-ask{font-size:18px}
  .slot{width:78px;height:78px}
  .slot.lit .s-emoji{font-size:36px}
  #board{gap:9px}
  .card{gap:3px;min-height:118px;max-width:170px}
  .card .c-emoji{font-size:38px}
  .card .c-word{font-size:18px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="好习惯排序">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <button id="prompt-chip" aria-label="题目，点我再听一遍"></button>
    </div>
    <div id="strip-wrap" aria-label="顺序条">
      <div id="strip"></div>
    </div>
    <div id="board" aria-label="步骤卡片"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

/* ================= habit 纯引擎：确定性关卡生成 + 步骤排序/干扰辨析点选判定（无 DOM，UI 与 verify 共用）
   r5 难度改造（SPEC-BATCH10 §3-r5）：
   - 流程库 12：ch1 熟知 6 步（洗手/起床/刷牙/穿衣）/ ch2 非熟知因果序（包饺子/种花/寄信）/
     ch3 近义步辨析（洗澡/洗衣服/烤蛋糕 + 干扰 ×2）/ ch4 与生成关=全库混出（≥2 条 7-8 步
     长序列）+ 干扰 seeded 0-2
   - 卡区结构：q.cards = 展示卡描述符数组——{s:步骤号}（本序列真实步）与 {d:干扰索引}
     交错；q.shown 保留=真实步展示排列（0..n-1 且 ≠恒等）；q.decoys=[{h,s}] 干扰来源
     （他序列步骤引用）。answerIdx = cards 中 {s:pos} 的下标（钩子契约 r5）
   - 干扰公平构造：干扰恒非本序列步骤；干扰文本 ∉ 本序列步骤词；干扰文本两两互异；
     同主题（THEME）优先、候选不足回落全库——verify 断言
   - 点干扰卡 = 'wrong'（辨析即训练目标，miss 计数）；点已排真实步 = 'again'（零惩罚）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   引擎返回：'step' 排对一步（题未完）/ 'goal' 排对且本题完成 / 'done' 通关
     / 'wrong' 点错（真步顺序错或点干扰卡；卡晃动不灰化可重点，每点计一次错）
     / 'again' 已排过的步骤卡或已答完的题（防御层零惩罚）
     / null 非法下标或关卡已结束 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;
/* 章型流程池（r5：ch1 熟知 / ch2 因果 / ch3 辨析池；ch4 与生成关走全库，full 分支处理） */
const HABIT_POOLS = {
  1: ['xishou', 'qichuang', 'shuaya', 'chuanyi'],
  2: ['baojiaozi', 'zhonghua', 'jixin'],
  3: ['xizao', 'xiyi', 'kaodangao']
};
/* 7-8 步长序列（ch4 混出保证 ≥2 条，"混出+长序列"章义） */
const LONG_HABITS = HABIT_IDS.filter(h => HABITS[h].steps.length >= 7);

/* ---------- 乱序生成：0..n-1 洗牌排列，恒等则重洗（必≠原序，SPEC §3 乱序约束） */
function genShown(n, rnd) {
  const idx = Array.from({ length: n }, (_, i) => i);
  let s = shuffled(idx, rnd), guard = 0;
  while (s.every((v, i) => v === i) && guard++ < 24) s = shuffled(idx, rnd);
  return s;
}

/* ---------- 干扰卡生成（r5 delta④公平构造）：
   候选=他序列全部步骤，滤掉文本 ∈ 本序列步骤词者；同主题（THEME）优先，
   同主题不足 k 才回落全库；按文本去重取 k 条（确定性 seeded） */
function genDecoys(hid, k, rnd) {
  if (!k || k <= 0) return [];
  const myTexts = HABITS[hid].steps.map(s => s.t);
  const theme = THEME[hid];
  const cands = [];
  HABIT_IDS.forEach(h => {
    if (h === hid) return;
    HABITS[h].steps.forEach((st, si) => {
      if (myTexts.indexOf(st.t) < 0) cands.push({ h: h, s: si, t: st.t, th: THEME[h] });
    });
  });
  const same = cands.filter(e => e.th === theme);
  const pool = shuffled(same.length >= k ? same : cands, rnd);
  const out = [], seen = {};
  for (let i = 0; i < pool.length && out.length < k; i++) {
    if (!seen[pool[i].t]) { seen[pool[i].t] = 1; out.push({ h: pool[i].h, s: pool[i].s }); }
  }
  return out;
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const full = dch === 4 || flat >= STATIC_LEVELS;         // 章 4 混合 / 生成关=全库混出
  const pool = full ? HABIT_IDS : HABIT_POOLS[dch];
  let seq;
  if (full) {                                              // 全库混出：长序列 2 条 + 其余 3 条，5 流程互异
    const longs = shuffled(LONG_HABITS, rnd).slice(0, 2);
    const rest = shuffled(HABIT_IDS.filter(h => longs.indexOf(h) < 0), rnd).slice(0, CH_LEN - 2);
    seq = shuffled(longs.concat(rest), rnd);
  } else {                                                 // 章 1-3 池：前 |pool| 题互异保证池内各 ≥1，余题池内随机
    seq = shuffled(pool, rnd);
    while (seq.length < CH_LEN) seq.push(pool[ri(rnd, 0, pool.length - 1)]);
  }
  const quizzes = seq.map(hid => {
    const n = HABITS[hid].steps.length;
    /* 干扰数：DECOY_RULE 按难度章（ch1/ch2=0，ch3=2，full=seeded 0-2），MAX_CARDS 封顶 */
    let dc = full ? ri(rnd, 0, 2) : DECOY_RULE[dch];
    dc = Math.max(0, Math.min(dc, MAX_CARDS - n));
    const shown = genShown(n, rnd);
    const decoys = genDecoys(hid, dc, rnd);
    const cards = shuffled(shown.map(si => ({ s: si }))
      .concat(decoys.map((_, k) => ({ d: k }))), rnd);    // 真实步与干扰卡交错展示
    return { hid: hid, name: HABITS[hid].name,
      steps: HABITS[hid].steps.map(s => s.id),              // 正序步骤 id（钩子契约）
      shown: shown, decoys: decoys, cards: cards,
      pos: 0, answerIdx: cards.findIndex(c => c.s === 0),
      miss: 0, _answered: false };
  });
  return { flat: flat, ch: ch, dch: dch, lv: lv, quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点选引擎（无 DOM）：engTap(L, i) —— 点展示卡区第 i 张卡（q.cards 下标） */
function engTap(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!Number.isInteger(i) || i < 0 || i >= q.cards.length) return null;
  if (q._answered) return 'again';
  const c = q.cards[i];
  if (c.d !== undefined) {                                  // 干扰卡：点它=错（辨析训练，可重点不灰化）
    q.miss++;
    L.retries++;
    return 'wrong';
  }
  if (c.s < q.pos) return 'again';                          // 已排入顺序条的步骤（UI .gone 拦截，兜底零惩罚）
  if (i === q.answerIdx) {
    q.pos++;
    if (q.pos >= q.steps.length) {                          // 本题全部排对
      q._answered = true;
      L.step++;
      if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
      return 'goal';
    }
    q.answerIdx = q.cards.findIndex(c2 => c2.s === q.pos);  // 下一步应点卡
    return 'step';
  }
  q.miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级：一关零错点（retries=0）=3 星；总错点 ≤2=2 星；否则 1 星。永不 0 星 */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：hid 在库、步骤表正序对账、shown=0..n-1 全排列且
   ≠恒等、cards=n+decoys 且真实步全覆盖一次、干扰公平构造（他序列/文本不撞/互异/数量规则）、
   pos/answerIdx 初始自洽、miss 起始 0。返回具体失败原因便于审计 */
function structWhy(q) {
  if (!q || !HABITS[q.hid]) return 'hid';
  const ref = HABITS[q.hid].steps, n = ref.length;
  if (n < 6 || n > 8) return 'stepsRange';                  // SPEC §3-r5：每流程 6-8 步
  if (!Array.isArray(q.steps) || q.steps.length !== n) return 'stepsLen';
  if (!q.steps.every((id, i) => id === ref[i].id)) return 'stepsOrder';
  if (!Array.isArray(q.shown) || q.shown.length !== n) return 'shownLen';
  const sorted = q.shown.slice().sort((a, b) => a - b);
  for (let i = 0; i < n; i++) if (sorted[i] !== i) return 'shownPerm';
  if (q.shown.every((v, i) => v === i)) return 'shownIdentity';   // 乱序必≠原序
  const myTexts = ref.map(s => s.t);
  if (!Array.isArray(q.decoys)) return 'decoysType';
  if (q.cards.length !== n + q.decoys.length || q.cards.length > MAX_CARDS) return 'cardsLen';
  const seenStep = [], seenDecoy = [], decoyTexts = [];
  for (let i = 0; i < q.cards.length; i++) {                // cards：真实步 0..n-1 各一次 + 干扰引用各一次
    const c = q.cards[i];
    if (c.d !== undefined) {
      if (!Number.isInteger(c.d) || c.d < 0 || c.d >= q.decoys.length || seenDecoy[c.d]) return 'cardsDecoy';
      seenDecoy[c.d] = 1;
      const dc = q.decoys[c.d];
      if (!dc || !HABITS[dc.h] || dc.h === q.hid) return 'decoyForeign';   // 干扰恒非本序列步骤
      if (!Number.isInteger(dc.s) || dc.s < 0 || dc.s >= HABITS[dc.h].steps.length) return 'decoyRef';
      const t = HABITS[dc.h].steps[dc.s].t;
      if (myTexts.indexOf(t) >= 0) return 'decoyTextClash';                // 干扰文本 ∉ 本序列步骤词
      if (decoyTexts.indexOf(t) >= 0) return 'decoyDup';                   // 干扰文本两两互异
      decoyTexts.push(t);
    } else {
      if (!Number.isInteger(c.s) || c.s < 0 || c.s >= n || seenStep[c.s]) return 'cardsStep';
      seenStep[c.s] = 1;
    }
  }
  if (q.pos !== 0) return 'pos';
  if (q.answerIdx !== q.cards.findIndex(c => c.s === 0)) return 'answerIdx';
  if (q.miss !== 0) return 'miss';
  return null;
}
/* ================= habit 主逻辑（顺序条/步骤卡渲染 / 飞入动画 / 教学 / 推进）
   r5：卡区=q.cards（真实步 {s} 与干扰卡 {d} 交错，6-9 张）；点干扰卡=晃动计错（辨析训练）。
   纠错语音=方向锚中性句（feedbackFor：起点/依赖/顺序锚，不泄步骤名——SPEC §3-r5）；
   反馈句走 TTS 拼句，estMs=TTS_MAX_CHARS*345+600=5430（r4 m-5 家族定版口径，非阻塞不设窗）。
   玩法：题面=流程名（hb_q_* clip + hb_suffix 尾段 clip，T46 阶段2 全 clip 拼句，queue 顺序播不叠音）。
   点对=卡 CSS transition 飞入上方顺序条第 pos 位亮起；点错=晃动（不灰化可重点，SPEC §3），
   首错不 pulse，miss≥2 应点卡 breathe。已排卡 .gone 隐藏保位（非灰化——已非候选）。
   每关 5 题；救援=重读题面+应点卡 pulse 一次（§0.21 视觉重现）。
   验收钩子：window.HB = { get currentLevel, get quiz(){hid,name,steps,shown,decoys,cards,
   pos,answerIdx,step,miss}, tapCard(i), async autoSolve(), get tutorial }（getter 拷贝非活引用） */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/开场任务语音/读题不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音：flat<3 每错必播；flat≥3 走 10s 节流；force 豁免恰一次——不灰化款（miss 无上限）
   必须 === 2（batch9 定版）：豁免只在每题 miss 首达 2 时发一次，防豁免变每错必播 */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.play(key, text); }
};

const stageEl = $id('stage'), stripEl = $id('strip'), boardEl = $id('board'),
      chipEl = $id('prompt-chip'), ghostEl = $id('ghost'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();
let lastBlankHint = 0;                          // 点空白/探索区轻提示节流（§0.16，10s）
let helpRedemo = false;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const cardEl = i => boardEl.querySelector('.card[data-i="' + i + '"]');
const slotEl = p => stripEl.querySelector('.slot[data-pos="' + p + '"]');

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;

  hearBtn.innerHTML = ICONS.hear;

  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：排对一步=短双音 / 答错=低柔单音 / 排完一题=叮咚 */
const chimeStep = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.12, 0, 0.55); KIDS.audio.note(880, 0.18, 0.07, 0.6); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };

/* ================= 题面语音（读题 sayR 级不受 flat 门）
   整句 = hb_q_* clip + hb_suffix 尾段 clip（T46 阶段2 全 clip 零 keyless），queue 顺序播（段间 0.15s，禁叠音） */
function speakQuiz(q) {
  if (!q) return;
  KIDS.voice.queue(qSpeechParts(q.hid));
}
/* r5 纠错方向锚（去泄序）：按错位选中性句，不泄具体步骤名——
   相邻交换（点到下一步）→ 顺序锚；开头错（pos=0）→ 起点锚；中间错（pos>0）→ 依赖锚；
   点干扰卡不揭示干扰身份，按位置走起点/依赖锚（verify 负向断言：反馈不含步骤名/流程名） */
function feedbackFor(q, i) {
  const c = q.cards[i];
  if (c && c.s !== undefined && c.s === q.pos + 1) return VOICE.wrongAdj;
  return q.pos === 0 ? VOICE.wrongStart : VOICE.wrongMid;
}
/* 开场顺序链（§0.5/§0.6）：hint（或教学交接 turn）→ 题面两段，queue 单通道顺序播 */
function openingSpeak(turn) {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  KIDS.voice.queue([turn ? VOICE.turn.key : VOICE.hint.key].concat(qSpeechParts(q.hid)));
}

/* ================= 渲染 ================= */
function buildStrip(n) {                        // 顺序条：n 空槽（虚线+序号大字）
  stripEl.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'slot';
    d.dataset.pos = i;
    d.innerHTML = '<i class="s-num">' + (i + 1) + '</i>';
    stripEl.appendChild(d);
  }
}
function buildBoard(q) {                        // 步骤卡：q.cards 交错展示（真实步 shown 序+干扰卡），入场 stagger
  boardEl.innerHTML = '';
  q.cards.forEach((c, i) => {
    const st = c.d !== undefined ? stepOf(q.decoys[c.d].h, q.decoys[c.d].s) : stepOf(q.hid, c.s);
    const b = document.createElement('button');
    b.className = 'card pop';
    b.dataset.i = i;
    b.dataset.sid = st.id;                      // verify 对账（渲染即引擎；干扰卡=来源序列步骤 id）
    b.setAttribute('aria-label', st.t);
    b.style.animationDelay = (i * 70) + 'ms';
    b.innerHTML = '<span class="c-emoji">' + st.e + '</span><span class="c-word">' + st.t + '</span>';
    boardEl.appendChild(b);
  });
}
function renderPrompt(q) {                      // 题面行：流程图标 + 名称大字 + 问句（指令全语音承载）
  chipEl.innerHTML = '<span class="p-ico">' + HABITS[q.hid].icon + '</span>' +
    '<span class="p-name">' + q.name + '</span><span class="p-ask">' + Q_SUFFIX + '？</span>';
  chipEl.setAttribute('aria-label', q.name + Q_SUFFIX + '，点我再听一遍');
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  buildStrip(q.steps.length);
  buildBoard(q);
  renderPrompt(q);
  renderStep();
  if (!VERIFY && !state.demo && !state.quiet) speakQuiz(q);  /* 开场/换题读题；demo 门防演示收尾叠播；quiet=开场/教学交接改顺序链 */
}
function renderStep() {                         // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 飞入动画（§0.11：CSS transition，时长随 SPEED）
   源卡立即 .gone 隐藏保位 → 克隆飞行体 fixed 从源卡矩形 transform 到目标槽矩形
   → transition 结束后目标槽填充+亮起（槽亮与飞行体到达同步） */
function flyStep(el, pos, step) {
  const dur = 420 * SPEED;
  if (el) el.classList.add('gone');
  const slot = slotEl(pos);
  if (el && slot) {
    const from = el.getBoundingClientRect();
    const to = slot.getBoundingClientRect();
    const fly = document.createElement('div');
    fly.className = 'fly';
    fly.textContent = step.e;
    fly.style.left = from.left + 'px';
    fly.style.top = from.top + 'px';
    fly.style.width = from.width + 'px';
    fly.style.height = from.height + 'px';
    fly.style.transitionDuration = dur + 'ms';
    document.body.appendChild(fly);
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    const k = Math.min(to.width, to.height) / Math.max(from.width, from.height);
    requestAnimationFrame(() => {
      fly.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + k + ')';
    });
    setTimeout(() => fly.remove(), dur + 90);   // transition 结束后移除飞行体
  }
  setTimeout(() => fillSlot(pos, step), dur);   // 到达即填充亮起
  return dur;
}
function fillSlot(pos, step) {
  const s = slotEl(pos);
  if (!s) return;
  s.classList.remove('lit'); void s.offsetWidth;
  s.classList.add('lit');
  s.innerHTML = '<span class="s-emoji">' + step.e + '</span><i class="s-num">' + (pos + 1) + '</i>';
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show(reason) { ghostReason = reason; ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostReason = null; ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el, reason) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show(reason);
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向：当前题当前应点的步骤卡 */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  pointGhostAt(cardEl(q.answerIdx), 'tut');
}

/* ================= 步骤卡点选主路径（真实点击 / HB.tapCard / autoSolve 共用） ================= */
async function uiTapCard(i, demo) {
  /* locked 门拦真实输入；demo 通道仅 tutorialWatch 内部传 true（豁免 locked） */
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const run = cur;                              /* 身份守卫：演出窗口内重玩会重建 cur，防旧续体错推进 */
  const r = engTap(cur, i);
  if (r === null) return false;
  if (r === 'again') return 'again';            /* 已排卡/已答题：早退零惩罚不计数（§0.7 防御层） */
  const el = cardEl(i);

  if (r === 'wrong') {                          /* 答错（顺序错/点干扰卡）：晃动不灰掉可重点（SPEC §3-r5） */
    if (el) { el.classList.remove('wig', 'breathe'); void el.offsetWidth; el.classList.add('wig'); }
    dodgeLo();
    const fb = feedbackFor(q, i);               /* r5 方向锚中性句（起点/依赖/顺序），不泄步骤名 */
    sayW(fb.key, fb.text, q.miss === 2);   /* flat<3 每错必播 / flat≥3 10s 节流+豁免恰一次（miss 无上限，===2 防豁免变每错必播） */
    if (q.miss >= 2) {                          /* 首错不 pulse：连错 2 次才高亮应点卡 */
      const ok = cardEl(q.answerIdx);
      if (ok && !ok.classList.contains('gone')) { ok.classList.remove('breathe'); void ok.offsetWidth; ok.classList.add('breathe'); }
    }
    await wait(480 * SPEED);
    return r;
  }

  /* ---- 答对：源卡飞入顺序条第 q.pos-1 位亮起 →（题末）推进 ---- */
  lastAct = Date.now();                         /* 仅正确推进重置救援钟（§0.7a） */
  if (state.tut === 'help') {                   /* 教学"独"：首次答对 → 强化反馈放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  if (el) el.classList.remove('breathe', 'wig');
  const dur = flyStep(el, q.pos - 1, stepOf(q.hid, q.pos - 1));   /* 引擎已 pos++，目标槽=pos-1 */
  chimeStep();
  await wait(dur + 220 * SPEED);                /* 等飞入 transition 结束再量测/推进（§0.11） */
  if (cur !== run) return r;                    /* 演出窗内重玩已重建关卡：丢弃旧续体 */
  if (r === 'step') {                           /* 题内排对一步：不换题 */
    state.locked = false;
    return r;
  }
  sfx('coin');                                  /* 排完一题/通关：全槽亮起小停顿 */
  if (r === 'done') { winFlow(); return r; }
  await wait(430 * SPEED);
  if (cur !== run) return r;
  state.locked = false;
  renderQuiz();
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关章型 GEN[dch-1]（家族 F，r5 审查 m-1：
     (ci+1)%4 章序推进仅 dch 循环策略下巧合等值，防御性禁式——habitat r4 M-1 同型） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);               // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  /* verify 页恒走 openingSpeak（stub 记录开场链供断言，教学由真实页自测覆盖） */
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.habit && sv.habit.tutSeen);
  if (VERIFY) { openingSpeak(); return; }
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  openingSpeak();                                /* 开场任务语音+题面顺序链（§0.5；hint 不得切断题面） */
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=幽灵手指演示排对一步（locked 吞输入，demo 参数豁免）→帮=指向应点卡；独=首次答对放手 */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);
  await wait(700 * SPEED);
  const q = cur.quizzes[0];
  const idx = q.answerIdx;
  pointGhostAt(cardEl(idx), 'tut');
  await wait(900 * SPEED);
  ghost.press();
  await wait(320 * SPEED);
  await uiTapCard(idx, true);                    // demo 通道豁免 locked（演示吞真实输入）
  await wait(1000 * SPEED);                      // 飞入亮起演出窗口
  const sv = KIDS._save();
  sv.habit = sv.habit || {};
  sv.habit.tutSeen = true;
  KIDS.store.persist();
  /* 立即重发同关（确定性关卡，题面一致），"你来排一排"在重发后的题面上说（照 batch5-9） */
  ghost.hide();
  cur = genLevel(0);
  state = { locked: false, won: false, demo: false, tut: 'help', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  state.quiet = false;
  /* 交接顺序链：turn→题面两段，queue 单通道顺序播不叠音（§0.6） */
  openingSpeak(true);
  setTimeout(() => { if (state.tut === 'help') pointHelpNext(); }, 600);
}

/* ================= 底栏与舞台交互 ================= */

});
chipEl.addEventListener('pointerdown', e => {

stageEl.addEventListener('pointerdown', e => {
  const p = e.target.closest('.card');

  get currentLevel() {
    if (!cur) return null;
    const q = cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)] || {};
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.quizzes.length,
      step: cur.step, retries: cur.retries, done: cur.done, won: state.won,
      hid: q.hid || null, pos: q.pos || 0 };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    return { hid: q.hid, name: q.name,                         /* SPEC §3-r5 钩子契约 */
      steps: q.steps.slice(), shown: q.shown.slice(),
      decoys: q.decoys.map(d => ({ h: d.h, s: d.s })),
      cards: q.cards.map(c => (c.d !== undefined ? { d: c.d } : { s: c.s })),
      pos: q.pos, answerIdx: q.answerIdx, step: cur.step, miss: q.miss };
  },
  tapCard(i) { return uiTapCard(i); },
  async autoSolve() {                           // UI 路径自动点完当前关（逐题逐步点应点卡）
    let taps = 0, guard = 0;
    while (cur && !cur.done && guard++ < 60) {  // 5 题 × 最多 8 步 = 40 tap 上界（r5 6-8 步），guard 60 余量
      const q = cur.quizzes[cur.step];
      if (!q) break;
      const r = await uiTapCard(q.answerIdx);
      taps++;
      if (r === false || r === null) break;     // 锁死/重玩保护
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
  get tutorial() { return state.tut; }
};

  total++;
  const fLog = [];
  KIDS.voice.play = function (key, text) { fLog.push(String(text)); };
  startLevel(10);
  const qc = HB.quiz;                                     // ch3 首题（确定性：干扰 2 在场）
  const stepWords = SPEC_REF[qc.hid].map(p => p.split('|')[0]);
  const adjIdx = qc.cards.findIndex(c => c.s === 1);      // 相邻交换样本：下一步卡（n≥6 恒在）
  const decIdx = qc.cards.findIndex(c => c.d !== undefined); // 干扰卡（ch3 ===2 恒在）
  let fbOk = qc.decoys.length === 2 && adjIdx >= 0 && decIdx >= 0;
  lastWrongVoice = 0;
  const rAdj = await HB.tapCard(adjIdx);                  // pos=0 点下一步 → 顺序锚
  fbOk = fbOk && rAdj === 'wrong' && fLog[fLog.length - 1] === SPEC_FEEDBACK.adj;
  lastWrongVoice = 0;
  const rDec = await HB.tapCard(decIdx);                  // pos=0 点干扰卡 → 起点锚（不揭示干扰身份）
  fbOk = fbOk && rDec === 'wrong' && fLog[fLog.length - 1] === SPEC_FEEDBACK.start;
  const rSt = await HB.tapCard(HB.quiz.answerIdx);        // 排对第一步 → pos=1
  const farIdx = HB.quiz.cards.findIndex(c => c.d !== undefined || c.s >= 3);  // 中间错样本
  lastWrongVoice = 0;
  const rFar = await HB.tapCard(farIdx);                  // pos=1 点远步/干扰 → 依赖锚
  fbOk = fbOk && rSt === 'step' && rFar === 'wrong' &&
    fLog[fLog.length - 1] === SPEC_FEEDBACK.mid;
  /* 负向断言：实测播句不含当前序列任何步骤名（r2/r4 纪律：反馈禁泄步骤名） */
  const played = fLog.filter(t => FB_ALL.indexOf(t) >= 0);
  const noLeakRuntime = played.every(t => stepWords.every(w => t.indexOf(w) < 0));
  /* SPEC 级负向：三锚句 × 全部 12 序列步骤词+流程名 零包含（独立于引擎实现） */
  let noLeakSpec = true;
  const names = { xishou: '洗手', qichuang: '起床', shuaya: '刷牙', chuanyi: '穿衣', guomal: '过马路',
    shuijiao: '睡觉', baojiaozi: '包饺子', zhonghua: '种花', jixin: '寄信', kaodangao: '烤蛋糕',
    xizao: '洗澡', xiyi: '洗衣服' };
  Object.keys(SPEC_REF).forEach(h => {
    const words = SPEC_REF[h].map(p => p.split('|')[0]);
    FB_ALL.forEach(t => {
      if (words.some(w => t.indexOf(w) >= 0) || t.indexOf(names[h]) >= 0) noLeakSpec = false;
    });
  });
  KIDS.voice.play = origPlay2;
  const fbUnitOk = fbOk && noLeakRuntime && noLeakSpec && played.length >= 3;
  if (fbUnitOk) npass++;
  units.feedback = { ok: fbUnitOk, dirOk: fbOk, noLeakRuntime: noLeakRuntime,
    noLeakSpec: noLeakSpec, played: played };

  /* ---- ③ UI 冒烟 A：flat0 真实通路通关（首题错一次 → 1 错=2 星，verify 页不弹层） ---- */
  total++;
  startLevel(0);
  let smokeA = true, wrongOk2 = false, quizzesA = 0;
  for (let s = 0; s < CH_LEN && smokeA; s++) {
    const q = HB.quiz;
    if (!q) { smokeA = false; break; }
    if (s === 0) {                               // 首错：零惩罚；首错不 pulse 应点卡
      await HB.tapCard((q.answerIdx + 1) % q.cards.length);
      wrongOk2 = HB.currentLevel.retries === 1 && HB.currentLevel.step === 0 &&
        !cardEl(HB.quiz.answerIdx).classList.contains('breathe');
    }
    let g3 = 0, lastT = null;
    while (HB.quiz && HB.quiz.step === s && g3++ < 12) lastT = await HB.tapCard(HB.quiz.answerIdx);
    if (lastT !== 'goal' && lastT !== 'done') smokeA = false;
    quizzesA++;
  }
  const lvA = HB.currentLevel;
  const smokeOkA = smokeA && wrongOk2 && quizzesA === CH_LEN && lvA.done && lvA.won &&
    lvA.retries === 1 && engStars(cur) === 2 && !document.querySelector('.k-celebrate');
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, wrongOk: wrongOk2, quizzes: quizzesA,
    retries: lvA.retries, stars: engStars(cur) };

  /* ---- ④ UI 冒烟 B1：flat10（ch3 辨析池）三流程各 ≥1+每题干扰 2+autoSolve 3 星+题面 chip ---- */
  total++;
  startLevel(10);
  const L10 = genLevel(10);
  const c10 = {};
  SPEC_POOLS[3].forEach(h => { c10[h] = 0; });
  L10.quizzes.forEach(q => { c10[q.hid]++; });
  const chipName = chipEl.querySelector('.p-name');       // 题面行流程名大字=当前题流程名
  const chipOk = chipName && chipName.textContent === L10.quizzes[0].name &&
    chipEl.querySelector('.p-ask') !== null;
  const decoyOk10 = L10.quizzes.every(q => q.decoys.length === SPEC_DECOY[3] &&
    q.cards.length <= SPEC_MAX_CARDS);
  const a10 = await HB.autoSolve();
  const lv10 = HB.currentLevel;
  const smokeOkB1 = SPEC_POOLS[3].every(h => c10[h] >= 1) && decoyOk10 && chipOk &&
    a10.done && lv10.done && lv10.won && lv10.retries === 0 && engStars(cur) === 3;
  if (smokeOkB1) npass++;
  smokes.flat10 = { ok: smokeOkB1, dist: c10, decoys: decoyOk10, chip: chipOk,
    taps: a10.taps, stars: engStars(cur) };

  /* ---- ④ UI 冒烟 B2：flat17（ch4 混出）5 流程互异+≥2 长序列+真实点击通关 ---- */
  total++;
  startLevel(17);
  const L17 = genLevel(17);
  const uniq17 = {};
  L17.quizzes.forEach(q => { uniq17[q.hid] = 1; });
  const kindsOk = Object.keys(uniq17).length === CH_LEN &&                // 5 流程互异
    Object.keys(uniq17).every(h => SPEC_REF[h] != null) &&
    L17.quizzes.filter(q => SPEC_REF[q.hid].length >= 7).length >= 2 &&   // ≥2 条 7-8 步长序列
    L17.quizzes.every(q => q.decoys.length >= 0 && q.decoys.length <= 2);
  let mixTapOk = true, quizzesB = 0;
  for (let s = 0; s < CH_LEN && mixTapOk; s++) {
    const q = HB.quiz;
    if (!q) { mixTapOk = false; break; }
    let g4 = 0, lastT = null;
    while (HB.quiz && HB.quiz.step === s && g4++ < 12) lastT = await HB.tapCard(HB.quiz.answerIdx);
    if (lastT !== 'goal' && lastT !== 'done') mixTapOk = false;
    quizzesB++;
  }
  const lv17 = HB.currentLevel;
  const smokeOkB2 = kindsOk && mixTapOk && quizzesB === CH_LEN && lv17.done && lv17.won &&
    lv17.retries === 0;
  if (smokeOkB2) npass++;
  smokes.flat17 = { ok: smokeOkB2, kinds: kindsOk, taps: quizzesB,
    hids: L17.quizzes.map(q => q.hid), retries: lv17.retries };

  /* ---- ⑤ 布局：双 viewport 模拟 ×（6 卡题 / 9 卡满载题） ---- */
  const rectsOverlap = (a, b) => a.left < b.right - 1 && b.left < a.right - 1 &&
    a.top < b.bottom - 1 && b.top < a.bottom - 1;
  async function simView(w, h) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    renderQuiz();                                 // 按新场地尺寸重排
    await wait(1050);                             /* 等入场 stagger（9 卡 8×70=560ms）+pop 动画结束再量 */
    const de = document.documentElement;
    const q = HB.quiz;
    const n = q.cards.length;
    const cards = Array.prototype.slice.call(boardEl.querySelectorAll('.card'));
    let countOk = cards.length === n;             // n 卡 + data-sid 与引擎对账
    const wantSid = sidOf(q);
    cards.forEach((c, i) => {
      if (Number(c.dataset.i) !== i || c.dataset.sid !== wantSid[i]) countOk = false;
    });
    const rects = cards.map(c => c.getBoundingClientRect());
    const cardOk = rects.length === n &&
      rects.every(r => r.width >= 96 && r.height >= 96);          /* 主答案按钮 ≥96（§0.9） */
    const slotRects = Array.prototype.slice.call(stripEl.querySelectorAll('.slot'))
      .map(s => s.getBoundingClientRect());
    const slotOk = slotRects.length === q.steps.length &&
      slotRects.every(r => r.width >= 64 && r.height >= 64);      /* 顺序条槽 ≥64 专项 */
    const wordOk = cards.every(c =>                             /* 步骤短词不溢出卡（nowrap 断行病害 §0.15） */
      c.querySelector('.c-word') &&
      c.querySelector('.c-word').scrollWidth <= c.clientWidth + 2);
    let sepOk = true;                             /* 换行临界：卡两两 bbox 实测不相交（r3 m3） */
    for (let i = 0; i < rects.length && sepOk; i++)
      for (let j = i + 1; j < rects.length && sepOk; j++)
        if (rectsOverlap(rects[i], rects[j])) sepOk = false;
    let btnOk = true;                             // 全部按钮 ≥64（.k-parentbtn 家长按钮豁免）
    document.querySelectorAll('button').forEach(b => {
      if (b.classList.contains('k-parentbtn')) return;
      const r = b.getBoundingClientRect();
      if (r.width > 4 && r.height > 4 && (r.width < 64 || r.height < 64)) btnOk = false;
    });
    const bRect = boardEl.getBoundingClientRect();
    const sRect = stageEl.getBoundingClientRect();
    const insideOk = rects.every(r =>             // 卡在卡区内且不溢出舞台（overflow:hidden 不裁卡）
      r.left >= bRect.left - 1 && r.right <= bRect.right + 1 &&
      r.top >= bRect.top - 1 && r.bottom <= bRect.bottom + 1 &&
      r.top >= sRect.top - 1 && r.bottom <= sRect.bottom + 1);
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, hid: q.hid, n: n, countOk: countOk, card96: cardOk,
      slot64: slotOk, wordOk: wordOk, sepOk: sepOk, btn64: btnOk, insideOk: insideOk, ox: ox,
      pass: countOk && cardOk && slotOk && wordOk && sepOk && btnOk && insideOk && ox <= 0 };
  }
  total++;
  const sims = [];
  /* 6 卡题（ch1 首题）与 9 卡满载题（ch3 首题 7 步+2 干扰）各一关（确定性扫描首题卡数） */
  let flat6 = -1, flat9 = -1;
  for (let f = 0; f < 30 && (flat6 < 0 || flat9 < 0); f++) {
    const qq = genLevel(f).quizzes[0];
    if (qq.cards.length === 6 && flat6 < 0) flat6 = f;
    if (qq.cards.length === 9 && flat9 < 0) flat9 = f;
  }
  const layoutFound = flat6 >= 0 && flat9 >= 0;
  if (layoutFound) {
    startLevel(flat6);
    sims.push(await simView(1280, 800)); sims.push(await simView(800, 1180));
    startLevel(flat9);
    sims.push(await simView(1280, 800)); sims.push(await simView(800, 1180));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                  // 还原真实 viewport 布局
  const layoutOk = layoutFound && sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, found: layoutFound, flat6: flat6, flat9: flat9, sims: sims };

  /* ---- ⑥ 分布与专项：12 序列表独立对账 / estMs 家族 / clip 文本=流程名 / SPEC_DUR 实长 /
     clips 注入 / 开场链 ---- */
  total++;
  /* SPEC §3-r5 步骤表独立字面量（零手抄对账：词|emoji 逐字、步数 6-8 精确） */
  let refOk = Object.keys(SPEC_REF).length === 12 && HABIT_IDS.length === 12;
  HABIT_IDS.forEach(h => {
    const ref = SPEC_REF[h], lib = HABITS[h] && HABITS[h].steps;
    if (!ref || !lib || lib.length !== ref.length || lib.length < 6 || lib.length > 8) { refOk = false; return; }
    ref.forEach((pair, i) => { if (lib[i].t + '|' + lib[i].e !== pair) refOk = false; });
    if (VOICE['q_' + h].text !== HABITS[h].name) refOk = false;   // clip 文本=流程名（manifest 一致）
  });
  /* estMs 家族（r4 m-5 定版 n*345+600；禁 +300 变体）：数值断言+源码负向（无 + 300 家族字面） */
  const estOk = estMs(1) === 945 && estMs(TTS_MAX_CHARS) === 14 * 345 + 600 &&
    TTS_MAX_CHARS === Math.max.apply(null, FB_ALL.map(t => t.length)) &&
    estMs.toString().indexOf('345') >= 0 && estMs.toString().indexOf('+ 300') < 0 &&
    FB_ALL.every(t => t.length <= TTS_MAX_CHARS);
  /* hb_* 19 条 + core_* 3 条注入对账（T46 阶段2 +4：hb_suffix/hb_w_start/hb_w_mid/hb_w_adj） */
  const HB_KEYS = ['hb_hint', 'hb_tut_turn', 'hb_tut_watch',
    'hb_q_baojiaozi', 'hb_q_chuanyi', 'hb_q_guomal', 'hb_q_jixin', 'hb_q_kaodangao',
    'hb_q_qichuang', 'hb_q_shuaya', 'hb_q_shuijiao', 'hb_q_xishou', 'hb_q_xiyi',
    'hb_q_xizao', 'hb_q_zhonghua',
    'hb_suffix', 'hb_w_start', 'hb_w_mid', 'hb_w_adj',
    'core_chapter_end', 'core_day_end', 'core_rest'];
  const preOk = HB_KEYS.every(k => !!KIDS.voice.clips[k]);
  /* SPEC_DUR 实长断言（±60ms，Promise.all+8000ms 超时；浏览器实测真值表）
     T46 阶段2 新 4 键（hb_suffix/hb_w_*）真值=mp3 容器实测（ffprobe，2026-09-19） */
  const durSpec = { /* SPEC_DUR r5 真值表（无头 chromium Audio.metadata 实测，2026-09-13） */
    hb_tut_watch: 3384, hb_tut_turn: 1776, hb_hint: 2616,
    hb_q_xishou: 1464, hb_q_qichuang: 1344, hb_q_shuaya: 1440,
    hb_q_chuanyi: 1344, hb_q_guomal: 1536, hb_q_shuijiao: 1440,
    hb_q_baojiaozi: 1560, hb_q_zhonghua: 1368, hb_q_jixin: 1344,
    hb_q_kaodangao: 1512, hb_q_xizao: 1440, hb_q_xiyi: 1608,
    hb_suffix: 1896, hb_w_start: 3192, hb_w_mid: 3408, hb_w_adj: 3240
  };
  const durKeys = Object.keys(durSpec);
  const durs = await Promise.all(durKeys.map(k => new Promise(res => {
    let done = false;
    const a = new Audio(KIDS.voice.clips[k]);
    const t = setTimeout(() => { if (!done) { done = true; res(-2); } }, 8000);   // 8s 超时（纪律）
    a.onloadedmetadata = () => { if (!done) { done = true; clearTimeout(t); res(Math.round(a.duration * 1000)); } };
    a.onerror = () => { if (!done) { done = true; clearTimeout(t); res(-1); } };
  })));
  const durOk = durs.every((d, i) => Math.abs(d - durSpec[durKeys[i]]) <= 60);
  /* 开场顺序链（stub 记录）：queue([hb_hint, hb_q_*, hb_suffix]) 单通道全 clip
     （T46 阶段2：尾段 {key:null,text}→hb_suffix，零 keyless 段）；
     speakQuiz 救援拼句=queue 两段（[hb_q_*, hb_suffix]） */
  const origQ = KIDS.voice.queue, origP = KIDS.voice.play, origS = KIDS.voice.say;
  const qLog = [], playLog = [], sayLog = [];
  KIDS.voice.queue = function (parts) { qLog.push(parts.slice()); };
  KIDS.voice.play = function (key) { playLog.push(String(key)); };
  KIDS.voice.say = function (t) { sayLog.push(String(t)); };
  startLevel(0);                                  // flat0 首题 hid 确定性
  const h0 = genLevel(0).quizzes[0].hid;
  const lastQ = qLog[qLog.length - 1];
  const openChain = qLog.length >= 1 && lastQ.length === 3 &&
    lastQ[0] === 'hb_hint' && lastQ[1] === 'hb_q_' + h0 &&
    lastQ[2] === 'hb_suffix';
  speakQuiz(genLevel(0).quizzes[0]);              // 救援/重听拼句：两段
  const lastQ2 = qLog[qLog.length - 1];
  const rescueChain = qLog.length >= 2 && lastQ2 !== lastQ && lastQ2.length === 2 &&
    lastQ2[0] === 'hb_q_' + h0 && lastQ2[1] === 'hb_suffix';
  KIDS.voice.queue = origQ; KIDS.voice.play = origP; KIDS.voice.say = origS;
  const distOk = refOk && estOk && preOk && durOk && openChain && rescueChain &&
    HABIT_IDS.every(h => hidDist[h] >= 1);        // 40 关 12 流程全覆盖（章 1-3 池+章 4/gen 混出）
  if (distOk) npass++;
  units.dist = { ok: distOk, stepsRef: refOk, estMs: estOk, clips: preOk, dur: durOk,
    durs: durs, openChain: openChain, rescueChain: rescueChain, hidDist: hidDist };

  /* ---- 家族 F 断言单元（r5 审查 m-1 补——运行时行为级；家族 A 的 dayEnd 传参
     lim-1 断言在 build.py 静态护栏——3 块布局下 verify 内文本搜索会自匹配恒真） ---- */
  total++;
  const statHintOk = nextHint(4) === CHAPTERS[1].hint && nextHint(9) === CHAPTERS[2].hint &&
                     nextHint(14) === CHAPTERS[3].hint && nextHint(19) === CHAPTERS[4].hint;
  const genHintOk = [24, 29, 34, 39].every(fl =>
    nextHint(fl) === GEN_HINTS[genLevel(fl + 1).dch - 1]);      // 实算对账（禁 (ci+1)%4 字面）
  const famNeg = nextHint.toString().indexOf('(ci + 1) % 4') < 0 &&
                 nextHint.toString().indexOf('genLevel(f + 1).dch') >= 0;
  const famOk = statHintOk && genHintOk && famNeg;
  if (famOk) npass++;
  units.family = { ok: famOk, staticHints: statHintOk,
                   genHints: genHintOk, negLiteral: famNeg };

  const out = { game: 'habit', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
</body>
