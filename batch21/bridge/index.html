<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>过河石桥</title>
<style>
/* ================= 过河石桥 bridge（batch21 r9 纠错式改造）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E。
   r9 玩法 = 规律纠错（SPEC-BATCH21 §3-r9）：河面横列 6/8 块石头构成完整周期
   pattern 行，其中恰埋 1 块错石（位置 ≥ 首个完整周期后，视觉无标记）。
   find 找错：点中错石 = 该石弹跳高亮 + brg_found + 候选盘滑入；
   点其他石 = 晃动 + sayW + 零惩罚（miss≥2 浮现 pattern 提示条——规律可视化不指认）。
   fix 修错：候选 3 块（干扰恰差一属性），点对 = 错石替换 + 兔子逐石跳过河（演出）；
   点错候选 = 晃动零惩罚（miss≥2 正确候选 breathe §0.21）。
   零文字依赖（§0.19）：题面/候选全图形+语音承载。触摸目标：石头/候选 = 主答案
   按钮 ≥64；底栏按钮 ≥64；overflowX 恒 0；布局量测走 offsetWidth/offsetHeight。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- pattern 提示条（find miss≥2 救援：完整周期色点序列，规律可视化不指认错石；
   dual 章点内嵌形状缩形 ---------- */
#pat-tip{position:absolute;left:50%;top:2.5%;transform:translateX(-50%) translateY(-16px);
  display:flex;align-items:center;gap:8px;padding:7px 14px;background:#FFF9EE;
  border:2.5px solid #4A3B2E;border-radius:26px;box-shadow:0 3px 0 rgba(74,59,46,.25);
  opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;z-index:8}
#pat-tip.show{opacity:1;transform:translateX(-50%) translateY(0)}
#pat-tip i{width:22px;height:22px;border:2px solid #4A3B2E;flex:0 0 auto}
#pat-tip i.p-sq{border-radius:6px}
#pat-tip i.p-rd{border-radius:50%}

/* ---------- 舞台：河面 + 石头行 + 兔子（布局坐标同系：石头/岸/兔子均以 #scene 为参照，
   量测用 offsetLeft/offsetTop/offsetWidth/offsetHeight，禁 getBoundingClientRect 动画帧坑） ---------- */
#scene{position:relative;flex:1 1 auto;min-height:180px;overflow:hidden}
#river{position:absolute;left:0;right:0;top:26%;bottom:26%;
  background:linear-gradient(180deg,#CFEBE5 0%,#BCDFD7 100%);
  border-top:3px solid #9FD2C9;border-bottom:3px solid #9FD2C9}
#river::before{content:'';position:absolute;left:4%;right:4%;top:22%;height:3px;border-radius:2px;
  background:rgba(255,255,255,.55);box-shadow:0 16px 0 rgba(255,255,255,.38),0 34px 0 rgba(255,255,255,.28)}
.bank{position:absolute;top:21%;bottom:21%;width:72px;background:#BFDCA6;
  border:2.5px solid #4A3B2E;border-radius:16px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -8px 0 rgba(122,158,92,.4)}
#bank-l{left:10px}
#bank-r{right:10px}
#bank-l .flag{font-size:34px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#bank-r .goal{font-size:38px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  animation:goal-bob 1.6s ease-in-out infinite}
@keyframes goal-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- 石头行：6/8 块石头横列（主答案按钮 ≥64，8 石章自动收紧），奇偶错落 ----------
   dual 章形状：.s-round=椭圆石（默认）/ .s-square=圆角方石（色+形第二维） */
#stones{position:absolute;left:0;right:0;top:26%;bottom:26%;display:flex;align-items:center;
  justify-content:center;gap:18px;padding:0 96px}
#stones.tight{gap:12px;padding:0 90px}
.stone{position:relative;flex:0 0 auto;width:86px;height:70px;
  border-radius:50% 50% 46% 46%/58% 58% 42% 42%;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 rgba(74,59,46,.28);
  transition:transform .15s}
.stone:active{transform:translateY(2px)}
.stone:nth-child(even){margin-top:18px}
.stone.c-stone{background:radial-gradient(ellipse at 38% 30%,var(--c-body) 0%,var(--c-body) 58%,var(--c-deep) 100%)}
.stone.c-stone::after{content:'';position:absolute;left:18%;top:13%;width:27%;height:16%;
  border-radius:50%;background:rgba(255,255,255,.5)}
.stone.s-square{border-radius:16px 16px 12px 12px}
.stone.s-square::after{border-radius:45%}
/* 入场弹跳（换桥 stagger） */
.stone.pop{animation:stone-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes stone-in{from{transform:scale(.3) translateY(14px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
/* find 找对错石：弹跳 + 高亮标记（此刻起错石不再是秘密） */
.stone.baddie{animation:an-baddie .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes an-baddie{0%{transform:scale(1)}45%{transform:scale(1.18) rotate(-4deg)}100%{transform:scale(1)}}
.stone.baddie{box-shadow:0 4px 0 rgba(74,59,46,.28),0 0 0 6px rgba(232,151,90,.75)}
/* fix 修对：新石弹入替换 */
.stone.fixed-in{animation:an-fixedin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes an-fixedin{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
/* 兔子跳上：落点脉冲 */
.stone.lit{animation:stone-lit .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stone-lit{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 兔子走过的石头：降饱和 + 脚印（walk 演出逐石盖） */
.stone.done{filter:saturate(.5) brightness(.97)}
.stone .paw{position:absolute;right:5px;bottom:0;font-size:17px;line-height:1;opacity:.9;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
/* 点错（find 点非错石 / fix 点错候选）：晃动（零惩罚可重点） */
.stone.wig{animation:an-wig .55s ease}
.cand.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}
  55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
/* 救援方向级：已确认正确的石头序列 flash（这些排得对——间接定位错石） */
.stone.flash{animation:an-flash .5s ease}
@keyframes an-flash{0%,100%{box-shadow:0 4px 0 rgba(74,59,46,.28)}
  50%{box-shadow:0 0 0 9px rgba(232,151,90,.55),0 4px 0 rgba(74,59,46,.28)}}
/* 救援答案级（fix miss≥2）：正确候选 breathe 循环（§0.21 在屏） */
.cand.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}

/* ---------- 兔子（过河 walk 演出：外层 left/top transition + 内层跳弧） ---------- */
#rabbit{position:absolute;left:0;top:0;width:56px;height:56px;z-index:6;pointer-events:none;
  transition:left .42s cubic-bezier(.45,.05,.35,1),top .42s cubic-bezier(.45,.05,.35,1)}
#rabbit .rab-in{width:100%;height:100%}
#rabbit .rab-in.hop{animation:rab-hop .42s ease}
@keyframes rab-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-30px) scale(1.06)}
  70%{transform:translateY(2px) scaleY(.94)}}

/* ---------- 候选盘（fix 修错步）：河面下方横排 3 块候选石（≥64），find 阶段收起 ---------- */
#cands{position:absolute;left:0;right:0;bottom:4.5%;display:flex;align-items:center;
  justify-content:center;gap:26px;transform:translateY(150%);opacity:0;
  transition:transform .38s cubic-bezier(.2,1.4,.4,1),opacity .3s;z-index:7}
#cands.show{transform:translateY(0);opacity:1}
.cand{position:relative;flex:0 0 auto;width:78px;height:64px;
  border-radius:50% 50% 46% 46%/58% 58% 42% 42%;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 rgba(74,59,46,.28);
  transition:transform .15s}
.cand:active{transform:translateY(2px)}
.cand.c-stone{background:radial-gradient(ellipse at 38% 30%,var(--c-body) 0%,var(--c-body) 58%,var(--c-deep) 100%)}
.cand.c-stone::after{content:'';position:absolute;left:18%;top:13%;width:27%;height:16%;
  border-radius:50%;background:rgba(255,255,255,.5)}
.cand.s-square{border-radius:14px 14px 11px 11px}
.cand.s-square::after{border-radius:45%}
.cand.pop{animation:stone-in .42s cubic-bezier(.2,1.6,.4,1) backwards}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch9-11） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：石头/候选仍 ≥64（§0.10），8 石章间距收紧。
   body.port=竖屏规则的类通道：媒体查询跟视口不跟元素，verify simView 页内模拟竖屏
   靠注入 .port 才能真正吃到这段 CSS（REPORT-REVIEW-r9 M-A1），两段规则必须同步改 */
@media (orientation:portrait){
  #stones{gap:12px;padding:0 84px}
  #stones.tight{gap:6px;padding:0 74px}
  .stone{width:72px;height:64px}
  #stones.tight .stone{width:64px;height:64px}
  .stone:nth-child(even){margin-top:14px}
  .bank{width:60px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
  #cands{gap:16px}
  .cand{width:70px;height:64px}
}
body.port #stones{gap:12px;padding:0 84px}
body.port #stones.tight{gap:6px;padding:0 74px}
body.port .stone{width:72px;height:64px}
body.port #stones.tight .stone{width:64px;height:64px}
body.port .stone:nth-child(even){margin-top:14px}
body.port .bank{width:60px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
body.port #cands{gap:16px}
body.port .cand{width:70px;height:64px}
</style>
</head>
<body>
<div id="game" aria-label="过河石桥">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="scene">
    <div id="pat-tip" aria-hidden="true"></div>
    <div id="river" aria-hidden="true"></div>
    <div id="bank-l" class="bank" aria-hidden="true"><span class="flag">🚩</span></div>
    <div id="bank-r" class="bank" aria-hidden="true"><span class="goal">🥕</span></div>
    <div id="stones" aria-label="过河石头"></div>
    <div id="cands" aria-label="候选石头"></div>
    <div id="rabbit" aria-hidden="true"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

   ③ 修对后兔子逐石跳过河（演出窗）→ 下一题。
   周期维度超越 ABC：ABCD 四元 / AABB 重复元 / 色+形双属性（红方块→蓝圆石→红方块…，

'use strict';

const INK = '#4A3B2E'; // 统一暖棕描边（DESIGN-SPEC §8）

/* ---------- 颜色石库（r9 扩 5 色：abcd 四元周期需 4 色+候选第三干扰需第 5 色）
   name=颜色词 TTS 拼句用 / short=口诀短名 / body=石面主色 / deep=暗部（径向渐变底） */
const COLORS = {
  red:    { name: '红色', short: '红', body: '#E8543F', deep: '#C43B2A' },
  blue:   { name: '蓝色', short: '蓝', body: '#3E82C4', deep: '#2F68A4' },
  green:  { name: '绿色', short: '绿', body: '#47A86B', deep: '#368552' },

  orange: { name: '橙色', short: '橙', body: '#F0904A', deep: '#D97E30' }
};
const COLOR_POOL = ['red', 'blue', 'green', 'purple', 'orange'];

/* ---------- 形状库（r9 dual 章：色+形双属性维度的第二维）
   dual 周期元 = (色A, 方) (色B, 圆) 交替；错石/候选干扰与应值恰差一属性 */
const SHAPES = {
  square: { name: '方形' },
  round:  { name: '圆形' }
};
const SHAPE_POOL = ['square', 'round'];

/* ---------- estMs 家族定版字面（r9 启用；四处同步=本定义 / game-main 注释 /
   game-verify 独立副本断言 / build.py 源码级 assert；禁 +300 变体）
   SAPI 拼句/clip 时长估计：n=码点数 */
const estMs = n => n * 345 + 600;

/* ---------- r9 单关推算时长模型（5-6 岁试玩口径，保守下界；SPEC §3-r9）
   SCAN_MS   找错观察窗（按周期长/维度分档：观察 pattern≥1 轮扫视+周期定位+点击）
   FOUND_MS  找错对反馈窗（brg_found ≈1.3s clip+停顿）
   FIX_MS    修错决策窗（3 选 1，干扰恰差一属性的辨别）
   STEP_MS   兔子过河逐石跳步进 / BANK_MS 上对岸窗
   RIGHT_MS  答对窗（brg_right ≈1.9s + 演出等待）
   指引句 fix_do=每关首题播（后续题孩子已会，救援 14s 静置重读）——first 参数与 main 行为一致
   LEVEL_MIN_MS 单关推算时长下限（verify 硬断言：Σ[题句+SCAN+FOUND+(首题指引句)+FIX+走桥+窗] ≥ 40s） */
const SCAN_MS = { ab: 4200, abc: 5200, abcd: 6800, aabb: 6300, dual: 7800 };
const FIX_MS = 3000, FOUND_MS = 1600, STEP_MS = 460, BANK_MS = 900, RIGHT_MS = 2400;
const LEVEL_MIN_MS = 40000;
function quizDurMs(q, first) {                   // 单题推算（r9 纠错双步分账；first=本关首题）
  return estMs(FIXQ_TEXT.length) + SCAN_MS[q.kind] + FOUND_MS +
         (first ? estMs(FIXDO_TEXT.length) : 0) + FIX_MS +
         q.stones.length * STEP_MS + BANK_MS + RIGHT_MS;
}
const levelDurMs = L => L.quizzes.reduce((s, q, i) => s + quizDurMs(q, i === 0), 0);

/* ---------- 章配置（章号 1 基；dch=难度章号 (ch-1)%6+1 循环取材；生成关 seeded 随机章参数）

const N_CH = 6;
const CHAPTERS = {

  2: { name: '三色找错', hint: '四种颜色轮流排队的桥，更难找啦' },         /* 预告 ch3 ABCD */
  3: { name: '四色找错', hint: '两块两块挨着排队的桥来啦' },               /* 预告 ch4 AABB */
  4: { name: '双胞胎桥', hint: '石头又有颜色又有形状，要看两样啦' },       /* 预告 ch5 dual */
  5: { name: '彩色形状桥', hint: '接下来什么花样的桥都有，都来考考你' },   /* 预告 ch6 混合 */
  6: { name: '花样找错', hint: '桥变不完啦，你是找错小能手' }             /* 预告生成关 */
};
const GEN_HINTS = ['两色桥找错石头', '三色桥找错石头', '四色桥找错石头',
                   '双胞胎桥找错石头', '彩色形状桥找错石头', '花样桥找错石头'];
const CH_LEN = 5;          // 5 题 = 1 关
const STATIC_LEVELS = 30;  // 静态 30 关 = 6 章（r9 六章）

/* ---------- 语音文案（与 voice/clips/manifest.json 严格一致，禁改 key/text；

const FIXQ_TEXT = '小桥上有一块石头放错啦，找一找';

const VOICE = {

const colorWord = c => (COLORS[c] ? COLORS[c].name : '');

function speechOf(q) {

/* ================= bridge 纯引擎：确定性纠错关卡生成 + 找错/修错双步判定（无 DOM，UI 与 verify 共用）
   r9 玩法（SPEC-BATCH21 §3-r9）：石桥序列完整给出（周期 pattern 行，恰埋 1 块错石），孩子
   find 找错（点出错石）→ fix 修错（3 候选修对）→ 修对后兔子逐石过河（演出）→ 下一题。
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   章型（进度章号单调递增、难度章号 (ch-1)%6+1 循环；生成关 flat≥30 seeded 随机 dch∈[1,6]）：
     dch1 'ab'    AB 二色周期：行 = A B A B A B（n=6，per=2），错位 badPos∈[2,5]
     dch2 'abc'   ABC 三色周期：行 = A B C A B C（n=6，per=3），badPos∈[3,5]
     dch3 'abcd'  ABCD 四元周期：行 = A B C D A B C D（n=8，per=4），badPos∈[4,7]
     dch4 'aabb'  AABB 重复元：行 = A A B B A A B B（n=8，per=4），badPos∈[4,7]
     dch5 'dual'  色+形双属性：行 = (cA 方)(cB 圆) ×3（n=6，per=2），badPos∈[2,5]，

     dch6 混合：每题 seeded 取五型之一，保证每关 ≥3 型（多样性）
   错石规则（认知真值）：badPos ≥ per（行首首个完整周期无误——孩子从行首读周期）；
     错石值 = pattern 用色内异值（单色章：不能靠"颜色陌生"排除，必须数周期位置）/
     恰差一属性（dual 章）。候选 3 = [应值, 错石值, 第三干扰]，第三干扰与应值差恰一属性，
     行内用色不足时（ab/aabb 仅 2 色）取行外色。
   引擎返回：engTap（find 点石头）'found' 点中错石（题内过半，转 fix）/ 'wrong' 点非错石
     （晃动零惩罚，每点计一次错）/ null 非法下标或非 find 阶段（walk 演出锁）；
     engFix（fix 点候选）'goal' 修对且本题过河（本关继续）/ 'done' 修对且通关 /
     'wrong' 点错候选（零惩罚可重点）/ null 非法下标或非 fix 阶段。
   纠错真值独立可算（specBadPos，verify/Python 对账用，不读引擎 badPos 字段）：
     从行首 per 位读周期元 → 逐位比对 → 唯一不符位 = badPos，期望值 = 周期元[badPos%per]。 */
function mulberry32(a) {
  return function() {

    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

function shuffled(arr, rnd) {

const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号六章循环取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % N_CH + 1;
const KIND_ALL = ['ab', 'abc', 'abcd', 'aabb', 'dual'];
const PERIOD = { ab: 2, abc: 3, abcd: 4, aabb: 4 };   // dual 周期=2（双属性对交替）
const kindPeriod = kind => kind === 'dual' ? 2 : PERIOD[kind];

/* ---------- 章型计划（每关 5 题；dch6 混合 ≥3 型） */
function kindsPlan(dch, rnd) {
  if (dch >= 1 && dch <= 5) {
    const k = KIND_ALL[dch - 1];
    return [k, k, k, k, k];
  }
  const plan = [];
  for (let t = 0; t < CH_LEN; t++) plan.push(KIND_ALL[Math.floor(rnd() * 5)]);
  if (new Set(plan).size < 3) {                    // 混合多样性：每关 ≥3 型（seeded 重排保确定性）
    plan.length = 0;
    const base = shuffled(KIND_ALL, rnd).slice(0, 3);   // 3 型打底
    for (let t = 0; t < CH_LEN; t++) plan.push(base[Math.floor(rnd() * base.length)]);
  }

/* ---------- 周期行生成：n 石 + 恰 1 错石（badPos ≥ per）+ 候选 3 */
function genOne(kind, rnd) {
  const per = kindPeriod(kind);

  const badPos = ri(rnd, per, n - 1);
  let expectVal;                                    // badPos 位应值（color 或 {color,shape}）
  if (kind === 'dual') {
    const cs = shuffled(COLOR_POOL, rnd).slice(0, 2);          // 2 色互异
    const ss = shuffled(SHAPE_POOL, rnd);                      // 2 形互异（方/圆）
    expectVal = null;
    stones = [];
    for (let i = 0; i < n; i++) stones.push({ color: cs[i % 2], shape: ss[i % 2], bad: false, pos: i });
    const exp = stones[badPos];
    /* 错石=恰差一属性（随机差色或差形；另一差一属性组合留给第三干扰） */
    const offColor = rnd() < 0.5;
    const badVal = offColor ? { color: cs[1 - badPos % 2], shape: exp.shape }
                            : { color: exp.color, shape: ss[1 - badPos % 2] };
    const third = offColor ? { color: exp.color, shape: ss[1 - badPos % 2] }
                           : { color: cs[1 - badPos % 2], shape: exp.shape };
    stones[badPos] = { color: badVal.color, shape: badVal.shape, bad: true, pos: badPos };
    const cand = [{ color: exp.color, shape: exp.shape }, badVal, third];   // [应值, 错石值, 第三干扰]
    return finishOne(kind, stones, badPos, cand, rnd);
  }
  const cols = shuffled(COLOR_POOL, rnd).slice(0, kind === 'aabb' ? 2 : per);  // aabb 2 色/其余 per 色
  const cyc = kind === 'aabb' ? [cols[0], cols[0], cols[1], cols[1]] : cols;  // aabb 周期元=同同异异
  stones = [];
  for (let i = 0; i < n; i++) stones.push({ color: cyc[i % per], bad: false, pos: i });
  const expect = cyc[badPos % per];
  const others = cols.filter(c => c !== expect);                        // 行内异色（必 ≥1）
  const badVal = others[Math.floor(rnd() * others.length)];
  stones[badPos] = { color: badVal, bad: true, pos: badPos };
  /* 第三干扰：行内取（abc/abcd 有余量）；ab/aabb 仅 2 色 → 行外色（入门档允许视觉排除） */
  let third = others.find(c => c !== badVal);
  if (!third) {
    const outPool = COLOR_POOL.filter(c => cols.indexOf(c) < 0);
    third = outPool[Math.floor(rnd() * outPool.length)];
  }
  const cand = [{ color: expect }, { color: badVal }, { color: third }];
  return finishOne(kind, stones, badPos, cand, rnd);
}
/* 候选洗牌 + 组装题对象（phase 初值 'find'） */
function finishOne(kind, stones, badPos, cand, rnd) {
  const okVal = JSON.stringify(cand[0]);
  const mixed = shuffled(cand.map((c, i) => ({ c: c, k: i })), rnd);
  const candMix = mixed.map(m => m.c);
  const candOk = mixed.findIndex(m => JSON.stringify(m.c) === okVal);
  return { kind: kind, stones: stones, badPos: badPos,
           cand: candMix, candOk: candOk,
           phase: 'find', miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 30 关与生成关同一确定性通道） */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, N_CH);        // 生成关随机章参数（先取数保确定性）
  const kinds = kindsPlan(dch, rnd);
  const quizzes = kinds.map(kind => genOne(kind, rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv, kinds: kinds,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点选引擎（无 DOM）—— find 阶段点石头第 i 块 */
function engTap(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!Number.isInteger(i) || i < 0 || i >= q.stones.length) return null;
  if (q.phase !== 'find') return null;              // walk 演出/fix 阶段点石头=非法（UI 锁）
  if (i === q.badPos) {                             // 找对错石：题内过半（转修错）
    q.phase = 'fix';
    return 'found';
  }
  q.miss++;                                         // 点非错石：晃动零惩罚（每点计一次错）
  L.retries++;
  return 'wrong';
}
/* ---------- 点选引擎（无 DOM）—— fix 阶段点候选第 i 块 */
function engFix(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!Number.isInteger(i) || i < 0 || i >= q.cand.length) return null;
  if (q.phase !== 'fix') return null;
  if (i === q.candOk) {                             // 修对：兔子过河（演出）→ 本题完成
    q.phase = 'walk';
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'goal';
  }

}
const engWon = L => !!L && L.done;
/* 星级：一关零错点（retries=0）=3 星；总错点 ≤2=2 星；否则 1 星。永不 0 星（SPEC §3） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 独立纠错计算器（SPEC §3-r9 真值：不读引擎 badPos/candOk——从行首周期元重建）
   单色章：周期=PERIOD[kind]，head=行首 per 位色 → 唯一不符位；
   dual：head=行首 2 位属性对（色形各自比对）→ 唯一不符位。
   返回 { badPos, expColor, expShape }；推演不出（非法题面/不符位≠1）返回 null */
function specBadPos(q) {
  const per = kindPeriod(q.kind);
  const st = q.stones, n = st.length;
  if (n < per * 2) return null;                     // 至少两个完整周期（结构前提）
  const headC = [], headS = [];
  for (let i = 0; i < per; i++) {
    headC.push(st[i].color);
    headS.push(st[i].shape || null);
  }
  if (q.kind === 'aabb') {                                            // AABB 首 4 位 = 同同异异成对
    if (headC[0] !== headC[1] || headC[2] !== headC[3] || headC[0] === headC[2]) return null;
  } else if (new Set(headC).size !== per) return null;                // 周期色互异（ab/abc/abcd/dual）
  if (q.kind === 'dual' && (headS[0] === null || headS[0] === headS[1])) return null;  // 双属性形互异

  for (let i = 0; i < n; i++) {

    const badHere = st[i].color !== expC || (q.kind === 'dual' && st[i].shape !== expS);
    if (badHere) { if (bad >= 0) return null; bad = i; }              // 恰一不符位
  }

  return { badPos: bad, expColor: headC[bad % per], expShape: headS[bad % per] };

/* ---------- 结构校验（verify 用）：石数/周期行规则/恰一错石/错位 ≥per/候选 3 互异/

  const st = q.stones, n = st.length;
  const per = kindPeriod(q.kind);
  if (n !== (per === 4 ? 8 : 6)) return 'nStones';  // per4→8 石（两完整周期）；其余 6 石
  for (let i = 0; i < n; i++) if (st[i].pos !== i) return 'pos';

  if (!spec) return 'specRow';                      // 周期重建失败（周期破坏/不符位≠1/首周期破坏）
  if (spec.badPos !== q.badPos) return 'badPos';    // 引擎错位=独立推演错位
  if (!st[q.badPos].bad) return 'badFlag';
  let nBad = 0;
  for (let i = 0; i < n; i++) if (st[i].bad) nBad++;
  if (nBad !== 1) return 'nBad';
  /* 属性纯度：单色章不得带 shape / dual 必带 shape */
  for (let i = 0; i < n; i++) {
    if (q.kind === 'dual') {
      if (!st[i].shape || !SHAPES[st[i].shape]) return 'shapeLib';
      if (st[i].num !== undefined && st[i].num !== null) return 'numLeak';
    } else {
      if (st[i].shape) return 'shapeLeak';
      if (st[i].num !== undefined && st[i].num !== null) return 'numLeak';
    }
    if (!COLORS[st[i].color]) return 'colorLib';
  }
  if (q.kind === 'dual') {                          // dual 错石=恰差一属性（同色异形/异色同形）
    const badStone = st[q.badPos];
    const cSame = badStone.color === spec.expColor, sSame = badStone.shape === spec.expShape;
    if (cSame === sSame) return 'dualAttr';         // 须恰差一（一真一假=异或）
  }
  /* 候选 3：互异 / 含应值恰一次 / 错石值在场 / 每干扰与应值恰差一属性 */
  if (!Array.isArray(q.cand) || q.cand.length !== 3) return 'nCand';
  const keys = q.cand.map(c => JSON.stringify({ color: c.color, shape: c.shape || null }));
  if (new Set(keys).size !== 3) return 'candDup';
  const expKey = JSON.stringify({ color: spec.expColor, shape: q.kind === 'dual' ? spec.expShape : null });
  if (keys.filter(k => k === expKey).length !== 1) return 'candExpect';
  if (keys.indexOf(expKey) !== q.candOk) return 'candOk';

    const dc = c.color !== spec.expColor, ds = (c.shape || null) !== (q.kind === 'dual' ? spec.expShape : null);

  };
  for (const c of q.cand) {
    const k = JSON.stringify({ color: c.color, shape: c.shape || null });

    if (k !== expKey && !COLORS[c.color]) return 'candColor';

}

  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.play(key, text); }
};

const sceneEl = $id('scene'), stonesEl = $id('stones'), rabbitEl = $id('rabbit'),
      bankLEl = $id('bank-l'), bankREl = $id('bank-r'), ghostEl = $id('ghost'),
      candsEl = $id('cands'), patTipEl = $id('pat-tip'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear');

const RAB = 56;                                   // 兔子显示尺寸（px）

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();

let helpRedemo = false;
let ghostReason = null;                         // 'tut' | 'scaffold'

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const stoneEl = i => stonesEl.querySelector('.stone[data-i="' + i + '"]');
const candEl = i => candsEl.querySelector('.cand[data-ci="' + i + '"]');

/* ================= 静态构建 ================= */
function buildStatic() {

/* 音效（Web Audio 合成）：找到错石=短双音 / 点错=低柔单音 / 修对过河=叮咚 */
const chimeStep = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.12, 0, 0.55); KIDS.audio.note(880, 0.18, 0.07, 0.6); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };

/* ================= 题面语音（读题 sayR 级不受 flat 门）
   开场/交接顺序链（§0.5/§0.6）：queue 单通道——hint（或 turn clip）播完接题面 clip */
function speakQuiz(q) {
  if (!q) return;
  KIDS.voice.play(q.phase === 'fix' ? VOICE.fixDo.key : VOICE.fixQ.key, speechOf(q));
}
function openingSpeak(turn) {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  KIDS.voice.queue([turn ? VOICE.turn.key : VOICE.hint.key, VOICE.fixQ.key]);
}
/* T46 阶段2 段链播放器：全段在册走 queue 拼播，缺段整句 TTS 兜底
   （shop-math playChain 先例；段恒在册=防御性死分支） */
const playChain = (keys, fallback) => {
  if (keys.every(k => KIDS.voice.clips[k])) KIDS.voice.queue(keys);
  else KIDS.voice.say(fallback);
};

/* ================= 兔子摆放与前进动画（布局量测 offsetLeft/offsetTop，禁 getBoundingClientRect） */
function setRabbitPose(pose) {
  const inner = rabbitEl.firstElementChild;
  if (inner) inner.innerHTML = KIDS.assets.rabbit(pose, RAB);
}
function placeRabbit(stoneIdx, bank) {
  let L, T;
  if (bank === 'start') {
    L = bankLEl.offsetLeft + (bankLEl.offsetWidth - RAB) / 2;
    T = bankLEl.offsetTop + 10;
  } else if (bank === 'end') {
    L = bankREl.offsetLeft + (bankREl.offsetWidth - RAB) / 2;
    T = bankREl.offsetTop + 10;
  } else {
    const st = stoneEl(stoneIdx);
    if (!st) return;
    L = st.offsetLeft + (st.offsetWidth - RAB) / 2;
    T = st.offsetTop - Math.round(RAB * 0.52);          // 站在石头顶上
  }
  rabbitEl.style.left = L + 'px';
  rabbitEl.style.top = T + 'px';
}
function hopRabbitTo(stoneIdx, bank) {                  // 前进动画：外层位移 transition + 内层跳弧
  placeRabbit(stoneIdx, bank);
  const inner = rabbitEl.firstElementChild;
  if (inner) {
    inner.classList.remove('hop'); void inner.offsetWidth;
    inner.classList.add('hop');
  }
}
function markPaw(el) {                                  // 走过的石头留脚印（视觉轨迹）
  if (!el || el.querySelector('.paw')) return;
  const p = document.createElement('i');

/* ================= 渲染 ================= */
function applyStoneFace(el, s) {                        // 石面（色 var + 形状类）——cand 共用
  el.dataset.color = s.color;
  el.style.setProperty('--c-body', COLORS[s.color].body);
  el.style.setProperty('--c-deep', COLORS[s.color].deep);
  el.classList.add('c-stone');
  if (s.shape) el.classList.add(s.shape === 'square' ? 's-square' : 's-round');
}
function renderScene(q) {                               // 河面石头行：色/形石（渲染即引擎；错石无视觉标记）
  stonesEl.innerHTML = '';
  stonesEl.classList.toggle('tight', q.stones.length > 6);   // 8 石章收紧间距（竖屏 ≥64）
  candsEl.classList.remove('show');
  patTipEl.classList.remove('show');
  q.stones.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'stone pop';
    b.dataset.i = i;
    b.dataset.bad = s.bad ? '1' : '0';                  // verify 对账（渲染即引擎；无视觉差异）
    if (s.shape) b.dataset.shape = s.shape;
    applyStoneFace(b, s);
    b.setAttribute('aria-label', COLORS[s.color].name + (s.shape ? SHAPES[s.shape].name : '') + '石头');
    b.style.animationDelay = (i * 70) + 'ms';
    stonesEl.appendChild(b);
  });
  setRabbitPose('normal');
  placeRabbit(null, 'start');                           // 兔子回左岸
}
function renderCands(q) {                               // 候选盘：3 块候选石滑入（fix 修错步）
  candsEl.innerHTML = '';
  q.cand.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'cand pop';
    b.dataset.ci = i;
    if (c.shape) b.dataset.shape = c.shape;
    applyStoneFace(b, c);
    b.setAttribute('aria-label', COLORS[c.color].name + (c.shape ? SHAPES[c.shape].name : '') + '石头');
    b.style.animationDelay = (i * 90) + 'ms';
    candsEl.appendChild(b);
  });
  candsEl.classList.add('show');
}
function renderPatTip(q) {                              // pattern 提示条：完整周期色点（miss≥2 规律可视化）
  const per = kindPeriod(q.kind);
  const dots = Math.min(per * 2, 8);
  patTipEl.innerHTML = '';
  for (let i = 0; i < dots; i++) {
    const s = q.stones[i % per];                        // 首周期（无误不变量）读周期元
    const d = document.createElement('i');
    d.style.background = COLORS[s.color].body;
    d.classList.add(s.shape === 'square' ? 'p-sq' : 'p-rd');
    patTipEl.appendChild(d);
  }
  patTipEl.classList.add('show');
}
function renderStep() {                                 // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                                 // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };            // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(N_CH, cur.ch); c++) {
    const i = document.createElement('i');
    const done = Array.from({ length: CH_LEN }, (_, l) => l).every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderScene(q);
  renderStep();
  if (!VERIFY && !state.demo && !state.quiet) speakQuiz(q);  /* 开场/换题读题；demo 门防演示收尾叠播；quiet=开场/教学交接改顺序链 */
}

/* ================= 幽灵手指（教学"帮"/演示共用） */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show(reason) { ghostReason = reason; ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostReason = null; ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el, reason) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show(reason);
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向：find=错石 / fix=正确候选（教学期答案级指引，家族先例承 feed 目标堆） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  pointGhostAt(q.phase === 'fix' ? candEl(q.candOk) : stoneEl(q.badPos), 'tut');
}

/* ================= find 找错主路径（真实点击 / BG.tapStone / autoSolve / 教学演示共用）
   uiTapStone(i, demo)：locked 门拦真实输入（吞输入轻叮 §0.22）；demo 通道仅教学用 */
async function uiTapStone(i, demo) {
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) {
    if (!demo) sfx('pop');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.phase !== 'find') { if (!demo) sfx('pop'); return false; }
  const run = cur;                              /* 身份守卫：演出窗口内重玩会重建 cur，防旧续体错推进 */
  const r = engTap(cur, i);
  if (r === null) { if (!demo) sfx('pop'); return false; }

  if (r === 'wrong') {                          /* find 点非错石：晃动+sayW+零惩罚（不泄答案） */
    dodgeLo();
    sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2);
    const el = stoneEl(i);
    if (el) { el.classList.remove('wig'); void el.offsetWidth; el.classList.add('wig'); }
    if (q.miss >= 2) renderPatTip(q);            /* miss≥2：pattern 提示条（规律可视化，不指认错石） */
    state.locked = true;
    await wait(1000 * SPEED);                    /* 错点防重入窗 1000ms（§0.26 b16 定案）；窗内点=pop 拒绝 */
    if (cur !== run) return r;
    state.locked = false;                        /* 不灰化可重点（零惩罚） */
    return r;
  }

  /* ---- found 找对错石：baddie 高亮 + brg_found → 候选盘滑入（题内过半） ---- */
  lastAct = Date.now();                         /* 仅正确推进重置救援钟（§0.7a） */
  if (state.tut === 'help') {                   /* 教学"独"：首次找对 → 强化反馈放手 */
    state.tut = 'solo';
    ghost.hide();
    dockHop();
  }
  state.locked = true;
  chimeStep();
  sayR(VOICE.found.key, VOICE.found.text);
  const el = stoneEl(i);
  if (el) { el.classList.remove('breathe', 'wig'); void el.offsetWidth; el.classList.add('baddie'); }
  await wait(FOUND_MS * SPEED);                 /* found 反馈窗（r9 模型 FOUND_MS） */
  if (cur !== run) return r;
  renderCands(q);                               /* 候选盘滑入 */
  if (cur.step === 0) sayR(VOICE.fixDo.key, VOICE.fixDo.text);   /* 修错指引=每关首题播（r9 模型 first） */
  state.locked = false;
  return r;
}

/* ================= fix 修错主路径（真实点击 / BG.tapCand / autoSolve / 教学演示共用） */
async function uiFix(i, demo) {
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) {
    if (!demo) sfx('pop');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.phase !== 'fix') { if (!demo) sfx('pop'); return false; }
  const run = cur;
  const r = engFix(cur, i);
  if (r === null) { if (!demo) sfx('pop'); return false; }

  if (r === 'wrong') {                          /* fix 点错候选：晃动+sayW+零惩罚可重点 */
    dodgeLo();
    sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2);
    const el = candEl(i);
    if (el) { el.classList.remove('wig'); void el.offsetWidth; el.classList.add('wig'); }
    if (q.miss >= 2) {                          /* miss≥2 答案级：正确候选 breathe（§0.21） */
      const ok = candEl(q.candOk);
      if (ok) { ok.classList.remove('breathe'); void ok.offsetWidth; ok.classList.add('breathe'); }
    }
    state.locked = true;
    await wait(1000 * SPEED);                   /* 错选防重入窗 1000ms */
    if (cur !== run) return r;
    state.locked = false;
    return r;
  }

  /* ---- 修对：错石替换弹入 → 候选盘收起 → 兔子逐石跳过河（walk 演出）→ 下一题/通关 ---- */
  lastAct = Date.now();
  state.locked = true;
  const el = stoneEl(q.badPos);
  const fixed = q.cand[q.candOk];
  if (el) {                                     /* 替换动画：剥旧面（色 var/形状类）→ 新石弹入 */
    el.classList.remove('baddie', 'breathe', 'wig');
    el.classList.remove('s-square', 's-round');
    el.dataset.color = fixed.color;
    if (fixed.shape) el.dataset.shape = fixed.shape; else delete el.dataset.shape;
    el.style.setProperty('--c-body', COLORS[fixed.color].body);
    el.style.setProperty('--c-deep', COLORS[fixed.color].deep);
    el.classList.add(fixed.shape === 'square' ? 's-square' : (fixed.shape ? 's-round' : 'c-stone'));
    if (!fixed.shape) el.classList.add('c-stone');
    void el.offsetWidth;
    el.classList.add('fixed-in');
    el.setAttribute('aria-label', COLORS[fixed.color].name + (fixed.shape ? SHAPES[fixed.shape].name : '') + '石头');
  }
  chimeStep();
  await wait(600 * SPEED);                      /* 替换弹入窗 */
  if (cur !== run) return r;
  candsEl.classList.remove('show');             /* 候选盘收起（新面已上桥） */
  patTipEl.classList.remove('show');
  await wait(320 * SPEED);
  if (cur !== run) return r;
  for (let k = 0; k < q.stones.length; k++) {   /* walk 演出：兔子逐石跳过河（脚印+落点脉冲） */
    const st = stoneEl(k);
    if (st) { st.classList.remove('pop', 'fixed-in'); void st.offsetWidth; st.classList.add('lit'); markPaw(st); }
    hopRabbitTo(k, null);
    await wait(STEP_MS * SPEED);
    if (cur !== run) return r;
  }
  hopRabbitTo(null, 'end');                     /* 上对岸 */
  setRabbitPose('happy');
  sayR(VOICE.right.key, VOICE.right.text);
  if (r === 'done') {
    await wait(700 * SPEED);
    if (cur !== run) return r;
    winFlow();
    return r;
  }
  await wait(BANK_MS * SPEED);
  if (cur !== run) return r;
  setRabbitPose('normal');
  state.locked = false;
  renderQuiz();                                 /* 换桥：新石头行 + 新题面 */
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = (flat == null ? cur.flat : flat);
  /* 家族契约 F（r9）：生成关预告禁"章索引加一取模"字面——须实算 genLevel(f+1).dch 取 GEN_HINTS；
     家族契约 M1：静态章末预告=CHAPTERS[floor(f/CH_LEN)+1]（SPEC §0.4 口径） */
  if (f + 1 < STATIC_LEVELS) return CHAPTERS[Math.floor(f / CH_LEN) + 1].hint;
  return GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, Array.from({ length: CH_LEN }, (_, l) => l));
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = Array.from({ length: CH_LEN }, (_, l) => l)
        .reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1)  /* 家族契约 A：dayEnd 预告传 nextHint(lim-1)（§0.4 防跳章） */ });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);               // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  /* verify 页恒走 openingSpeak（stub 记录开场链供断言，教学由真实页自测覆盖） */
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.bridge && sv.bridge.tutSeen);
  if (VERIFY) { openingSpeak(); return; }
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  openingSpeak();                                /* 开场任务语音+题面顺序链（§0.5；hint 不得切断题面） */
}

/* ================= 教学（仅关 1-0 首次，save.bridge.tutSeen）：看→帮→独
   看=完整演示一题纠错流程（pattern 读出「红蓝红蓝，有一块不对哦」→ 指点错石 found →
   候选滑入 → 指选对候选 → 修对兔子过河；≤16s §0.25）→ 帮=按 phase 指向下一动作；
   独=首次找对放手（SPEC §3-r9） ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);
  await wait(700 * SPEED);
  const q = cur.quizzes[0];                      // flat0=ch1 ab（确定性）
  playChain(chantKeys(q), chantText(q));         /* pattern 读出 clip 段链（T46 阶段2）：「红 蓝 红 蓝，有一块不对哦」 */
  pointGhostAt(stoneEl(q.badPos), 'tut');
  await wait(1600 * SPEED);
  ghost.press();
  await wait(320 * SPEED);
  const r1 = await uiTapStone(q.badPos, true);   // demo 通道豁免 locked——演示 find 找错（判对证据）
  window.__bgDemoR = r1;                         /* 演示判对真实生效证据（§0.27，verify/gate 断言 'found'） */
  await wait(500 * SPEED);                       // 候选盘已滑入（uiTapStone found 分支内含窗）
  pointGhostAt(candEl(q.candOk), 'tut');
  await wait(1200 * SPEED);
  ghost.press();
  await wait(320 * SPEED);
  await uiFix(q.candOk, true);                   // 演示 fix 修对 → walk 过河演出完整走完
  const sv = KIDS._save();                       // 真实页 save 恒非 null；verify 直驱时跳过写档
  if (sv) {
    sv.bridge = sv.bridge || {};
    sv.bridge.tutSeen = true;
    KIDS.store.persist();
  }
  /* 立即重发同关（确定性关卡，题面一致），"你来走一走"在重发后的桥上说（照 batch5-11） */
  ghost.hide();
  cur = genLevel(0);
  state = { locked: false, won: false, demo: false, tut: 'help', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  state.quiet = false;
  openingSpeak(true);                            /* 交接顺序链：turn clip → 题面 clip（queue 单通道 §0.6） */
  setTimeout(() => { if (state.tut === 'help') pointHelpNext(); }, 600);
}

/* ================= 底栏与舞台交互 ================= */
function dockHop() {
  rabbitBtn.classList.remove('hop'); void rabbitBtn.offsetWidth; rabbitBtn.classList.add('hop');
}
rabbitBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur) return;

    sfx('pop');
    return;
  }

                      19: '石头又有颜色又有形状，要看两样啦',
                      24: '接下来什么花样的桥都有，都来考考你' };
  const V_GEN = ['两色桥找错石头', '三色桥找错石头', '四色桥找错石头',
                 '双胞胎桥找错石头', '彩色形状桥找错石头', '花样桥找错石头'];
  const hintOk = Object.keys(SPEC_HINT).every(f => nextHint(+f) === SPEC_HINT[f]) &&
    nextHint(29) === V_GEN[genLevel(30).dch - 1];
  const hintNeg = nextHint(4) !== SPEC_HINT[9];
  const distOk = srcOk && clipOk && clipDurOk && estOk && spOk && chantOk && specSynthOk && openOk &&
    hintOk && hintNeg &&
    genDch[1] >= 1 && genDch[2] >= 1 && genDch[3] >= 1 && genDch[4] >= 1 &&
    genDch[5] >= 1 && genDch[6] >= 1 &&                          /* 生成关章参数全覆盖 */
    kindCov.ab >= 1 && kindCov.abc >= 1 && kindCov.abcd >= 1 &&
    kindCov.aabb >= 1 && kindCov.dual >= 1 &&                    /* 60 关五 kind 全覆盖 */
    durMin >= V_MIN;                                             /* r9 时长硬断言（每关推算 ≥40s） */
  if (distOk) npass++;
  units.dist = { ok: distOk, voiceSrc: srcOk, clips: clipOk, clipDurs: durs, estMs: estOk, speech: spOk,
    chant: chantOk, specSynth: specSynthOk, openChain: openOk,
    hintOk: hintOk, hintNeg: hintNeg, genDch: genDch, kindCov: kindCov,
    durMin: durMin, durMax: durMax, durLevels: durAll.length };

  const out = { game: 'bridge', total: total, pass: npass, layoutOk: layoutOk,
                levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
