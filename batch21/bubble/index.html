<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>泡泡数数</title>
<style>
/* ================= 泡泡数数 bubble（batch21）v2/r9：去计数器+颜色子集+提交制+倒计时收尾 ================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、天空浅青场、暖橙主色；
   触摸目标：泡泡按钮热区恒 76px（大泡 96px，均 ≥64），「好了」提交按钮 96、底栏按钮 ≥72；
   泡位由引擎 rAF 驱动（transform translate3d，布局断言用 offsetWidth/offsetHeight 稳定值）；
   5-6 岁零文字依赖：顶部=目标色色卡+目标数大数字（当前计数不显示——数在心里），
   语义全靠语音承载；「好了」=绿色大对勾图形按钮（零文字）；
   r9：#timer 温和琥珀倒计时条（章后段收尾，零文字）+#field.sleep 超时静息（泡泡缓浮不爆） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#8FCBE0;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：目标卡（色卡+目标数）+ 泡泡天空 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 10px}
/* 目标卡 v2：目标色色卡（泡泡图形按目标色渲染）+大数字 N——当前计数不显示（孩子心里数） */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0 8px}
#counter{display:flex;align-items:center;gap:12px;padding:6px 34px;border-radius:26px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;min-height:76px}
#counter .tgt{display:flex;align-items:center;gap:12px}
#counter .tgt .bicon{width:56px;height:56px;display:block}
#counter .tgt .bicon svg{width:100%;height:100%}
#counter b{font-weight:800;color:#4A3B2E;line-height:1;font-variant-numeric:tabular-nums}
#target-n{font-size:54px}
#counter.rescue{animation:d-rescue 1.1s ease-in-out 3}
@keyframes d-rescue{0%,100%{box-shadow:0 5px 0 #D8C9B4,0 0 0 0 rgba(232,151,90,0)}
  50%{box-shadow:0 5px 0 #D8C9B4,0 0 0 12px rgba(232,151,90,.42)}}

/* r9 倒计时收尾：温和琥珀条（仅 count 相位可见，零文字；末 3 秒转橙轻脉冲） */
#timer{display:none;width:92px;height:14px;border-radius:8px;background:#F0E4CC;
  border:2px solid #4A3B2E;overflow:hidden;flex:0 0 auto}
#timer.on{display:block}
#timer i{display:block;height:100%;background:#F7CE55;border-radius:5px;transition:width .12s linear}
#timer.low i{background:#E8975A}
#timer.low{animation:t-low .9s ease-in-out infinite}
@keyframes t-low{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

/* 泡泡天空场（引擎 rAF 定位，overflow 剪裁出顶泡与爆裂） */
#field{position:relative;width:100%;max-width:1180px;flex:1 1 auto;min-height:200px;
  background:linear-gradient(180deg,#DDEFF6 0%,#D5EAF2 55%,#CFE6EC 100%);
  border:3px solid #A9C6D4;border-radius:26px;overflow:hidden;
  box-shadow:inset 0 0 0 6px rgba(255,249,238,.5)}
#field .sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.95}
/* r9 超时静息（泡泡缓浮不爆）：天色转暮+泡体缓摆（缓浮由引擎 DRIFT_K 放慢上飘速度） */
#field.sleep{background:linear-gradient(180deg,#D8E6EE 0%,#D2E0EA 55%,#CCDCE7 100%)}
#field.sleep .bubble .bod{animation-duration:6.5s}
#field.sleep .bubble.cloud .bod{animation-duration:8.5s}

/* ---------- 场上泡泡：绝对定位按钮（坐标由引擎逐帧 transform） ---------- */
.bubble{position:absolute;left:0;top:0;width:76px;height:76px;padding:0;border:none;background:none;
  will-change:transform;z-index:4;transform-origin:50% 50%}
.bubble.big{width:96px;height:96px}
.bubble .bod{display:block;width:100%;height:100%;pointer-events:none;
  animation:b-bob 2.6s ease-in-out infinite}
.bubble .bod svg{width:100%;height:100%}
.bubble.cloud .bod{animation-duration:4.2s}
@keyframes b-bob{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
/* 非目标色泡抖动（不破——色不对的可见提示；加在内层避免与定位 transform 冲突） */
.bubble.nope .bod{animation:b-nope .42s ease}
@keyframes b-nope{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  45%{transform:translateX(6px)}70%{transform:translateX(-4px)}}
/* 点破爆裂圈（云朵灰色版） */
.burst{position:absolute;z-index:6;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;
  border:5px solid rgba(255,255,255,.92);box-shadow:0 0 0 4px rgba(232,151,90,.35);
  pointer-events:none;animation:burst .32s ease-out forwards}
.burst.cloud{border-color:#B9C2CB;box-shadow:0 0 0 4px rgba(150,160,170,.3)}
@keyframes burst{from{transform:scale(.35);opacity:1}to{transform:scale(1.55);opacity:0}}

/* ---------- 底栏（左侧=兔子+「好了」提交；右侧=听题/重玩） ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#dock-l{display:flex;align-items:center;gap:16px;flex:0 0 auto}
#dock-r{display:flex;align-items:center;gap:12px;flex:0 0 auto}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-submit{width:96px;height:96px;border-radius:50%;background:#DCEED2;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #9DBE8C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-submit:active{transform:translateY(3px);box-shadow:0 1px 0 #9DBE8C}
#btn-submit svg{width:58px;height:58px}
#btn-submit.press{animation:sub-press .4s ease}
@keyframes sub-press{0%,100%{transform:scale(1)}45%{transform:scale(.93)}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，坐标逐帧跟泡泡/静态指按钮；照 batch5/6/7） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：目标卡适度收紧（泡按 field 实际宽高定位，无需改）。
   body.port=竖屏规则的类通道（媒体查询跟视口不跟元素，verify simView 靠注入 .port 吃到这段，
   REPORT-REVIEW-r9 M-A1），两段规则必须同步改 */
@media (orientation:portrait){
  #counter{gap:10px;padding:6px 24px}
  #target-n{font-size:46px}
  #counter .tgt .bicon{width:48px;height:48px}
  #timer{width:68px}
  #dock-l{gap:10px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
  #btn-submit{width:86px;height:86px}
}
body.port #counter{gap:10px;padding:6px 24px}
body.port #target-n{font-size:46px}
body.port #counter .tgt .bicon{width:48px;height:48px}
body.port #timer{width:68px}
body.port #dock-l{gap:10px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
body.port #btn-submit{width:86px;height:86px}
</style>
</head>
<body>
<div id="game" aria-label="泡泡数数">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <div id="counter" role="heading" aria-label="题目">
        <span class="tgt"><span class="bicon" id="bicon" aria-hidden="true"></span><b id="target-n">3</b></span>
        <span id="timer" aria-hidden="true"><i></i></span>
      </div>
    </div>
    <div id="field" aria-label="泡泡天空">
      <div class="sky" aria-hidden="true"></div>
    </div>
  </div>
  <div id="dock">
    <div id="dock-l">
      <button id="btn-rabbit" aria-label="小兔子"></button>
      <button id="btn-submit" aria-label="好了"></button>
    </div>
    <div id="dock-r">
      <button id="btn-hear" aria-label="再听一遍"></button>
      <button id="btn-replay" aria-label="再玩一次"></button>
    </div>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= bubble 纯引擎 v2/r9：确定性关卡生成 + 泡泡场模拟 + 颜色子集点数 + 提交判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)（关卡题面/场色板）/ mulberry32(flat * 7919 + 71)（泡泡场独立流）：
   同 flat 永远同关同场（重玩一致、verify 可检）。
   章难度 v2（2026-09-13 家长审计改造——去计数器+颜色子集+提交制）：
   dch1 单色场 N∈[3,5] 泡慢 / dch2 两色场（蓝+黄）N∈[4,6] / dch3 三色场（+粉）N∈[5,8] 泡快 /
   dch4 生成关 seeded 色组合（2-3 色）+数量 N∈[3,8] 混速+偶发大泡
   r9（2026-09-14 AUDIT-56 #17）：genLevel 增 timed 字段（lv>=TIMED_FROM_LV=每章第 4/5 关）——
   倒计时状态机在 UI 层（game-main advance，走 field.t 模拟钟），引擎直驱（engFieldTick
   批量模拟）不涉计时，保 verify ①⑨ 大批量模拟的确定性。
   规则铁律 v2：顶部无计数显示——判定全靠提交（tapSubmit）；
   只点目标色泡才计数；点非目标色=不破不计数（探索）；点灰云=破但不计数（只记 cloudPops）；
   提交 ==N→right / >N→wrong_more（计数清零+submitErr+1）/ <N→wrong_less（保留计数）；
   屏上目标色泡恒 ≥2（respawn 秒级）；泡飘出顶=自然消失不罚；
   miss=submitErr + (cloudPops≥3 折 1)；星级 0=3★/1-2=2★/≥3=1★ */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致，杜绝生成关软锁）；难度章号四章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 关色板（dch1 单色 seeded / dch2-3 定版 / dch4 2-3 色 seeded；flat0 恒蓝=教学演示色） ---------- */
function genPalette(dch, flat, rnd) {
  let palette;
  if (dch === 1) palette = [ALL_COLORS[ri(rnd, 0, 2)]];                    // 单色场：每关抽 1 色
  else if (dch === 4) {                                                    // 生成关：2 或 3 色
    const k = ri(rnd, 2, 3);
    palette = k === 3 ? ALL_COLORS.slice() : COLOR_PAIRS[ri(rnd, 0, 2)].slice();
  } else palette = CHAPTERS[dch].colors.slice();
  if (flat === 0) palette = ['blue'];                                      // 教学关：演示=点 3 个蓝泡
  return palette;
}

/* ---------- 单题生成（rnd 同流保证确定性；lastN=避免与上一题目标数相同；color=palette 内抽） ---------- */
function genOne(dch, rnd, lastN, palette) {
  const C = CHAPTERS[dch];
  let n = ri(rnd, C.nMin, C.nMax);
  for (let t = 0; t < 8 && lastN != null && n === lastN; t++) n = ri(rnd, C.nMin, C.nMax);  // 相邻题目标数不同
  const color = palette[ri(rnd, 0, palette.length - 1)];
  return { type: 'bubble', n: n, color: color, seed: 0, _cnt: 0, solved: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   flat0 题0 恒 n=3 color='blue'（§2 v2 教学"演示点 3 个蓝泡"=恰好演示完整一题） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const colors = genPalette(dch, flat, rnd);
  const quizzes = [];
  let lastN = null;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genOne(dch, rnd, lastN, colors);
    if (flat === 0 && qi === 0) { q.n = 3; q.color = 'blue'; lastN = 3; }   // 教学演示定数（先改 lastN 再进下一题去重）
    else lastN = q.n;
    q.seed = (flat * 5 + qi) * 7919 + 13;                 // 题 seed（家族字段惯例）
    quizzes.push(q);
  }
  return { flat, ch, dch, lv, colors: colors, quizzes: quizzes, step: 0, done: false,
    timed: lv >= TIMED_FROM_LV,                           // r9 章后段（每章第 4/5 关）启用温和倒计时（确定性规则）
    cloudPops: 0, totalPops: 0, submitErr: 0 };           // cloudPops=干扰云点破数 / totalPops=累计点破含云 / submitErr=多点提交错次
}

/* ---------- 泡泡场（纯逻辑模拟，坐标归一化 0-1：x 左→右，y 底 0 → 顶 1，与视口尺寸无关）
   bubbles: { id, kind:'color'|'cloud', color('blue'|'yellow'|'pink'|null), x, y, v(每秒穿屏比=1/riseSec),
             big, hue, wobA/wobP/wobF(左右摆幅/相位/频率) }
   sawCloud/sawBig=verify 审计用（是否出现过云朵/大泡） ---------- */
function engField(L) {
  const C = CHAPTERS[L.dch];
  const rnd = mulberry32(L.flat * 7919 + 71);
  const F = { L: L, t: 0, nextId: 1, bubbles: [], spawnAt: 0, cloudAt: 0, rnd: rnd, cfg: C,
    colors: L.colors, popTarget: ri(rnd, C.popMin, C.popMax), sawCloud: false, sawBig: false };
  for (let i = 0; i < F.popTarget; i++) {                 // 初始彩泡错峰铺屏（0.14-0.9，即刻可点）
    engSpawn(F, 'color', 0.14 + 0.76 * (i + 1) / (F.popTarget + 1));
  }
  for (let k = 0; k < C.cloudMax; k++) engSpawn(F, 'cloud', 0.12 + rnd() * 0.7);
  engEnsure(F);                                            // 目标色保底 ≥2
  return F;
}

/* 生成一只泡（x 含摆幅护栏收敛在场内；forceColor=保底补目标色时指定，rnd 消耗与随机路径一致；
   大泡仅章 4 概率出现且计数仍 1） */
function engSpawn(F, kind, y, forceColor) {
  const rnd = F.rnd, C = F.cfg;
  const big = kind === 'color' && rnd() < (C.bigP || 0);
  const wobA = rnd() * 0.022;
  let x = 0.1 + rnd() * 0.8;
  x = Math.min(0.92 - wobA, Math.max(0.08 + wobA, x));
  const rise = C.riseMin + rnd() * (C.riseMax - C.riseMin);   // 章 4 riseMin-riseMax 宽区间=混速
  const ci = Math.floor(rnd() * F.colors.length);             // 色抽签恒消耗（确定性不受 force 影响）
  const color = kind === 'color' ? (forceColor || F.colors[ci]) : null;
  const b = { id: F.nextId++, kind: kind, color: color, x: x, y: y == null ? -0.08 : y,
    v: 1 / rise, big: big, hue: color != null ? HUE_OF[color] : -1,
    wobA: wobA, wobP: rnd() * Math.PI * 2, wobF: 0.7 + rnd() * 1.1 };
  if (kind === 'cloud') { F.sawCloud = true; b.v = 1 / (rise * 1.25); }   // 云朵略慢更耐看
  if (big) F.sawBig = true;
  F.bubbles.push(b);
  return b;
}

/* ---------- 目标色保底（提交制核心不变量：场上目标色泡恒 ≥2——孩子随时点得到） ---------- */
function engTargetColor(F) {
  const L = F.L;
  if (!L || L.done) return null;
  const q = L.quizzes[L.step];
  return q ? q.color : null;
}
function engEnsure(F) {
  const c = engTargetColor(F);
  if (!c) return;
  let n = 0;
  for (let i = 0; i < F.bubbles.length; i++) {
    const b = F.bubbles[i];
    if (b.kind === 'color' && b.color === c) n++;
  }
  let g = 0;
  while (n < 2 && g++ < 4) { engSpawn(F, 'color', -0.08, c); n++; }
}

/* ---------- 场推进（dt=模拟秒；UI 以 dt/SPEED 喂入 → verify 页 8.3 倍速）
   铁律：目标色彩泡恒 ≥2（跌破立即补）；飘出顶 y>1.1 自然移除不罚；respawn 秒级 ---------- */
function engFieldTick(F, dt) {
  F.t += dt;
  for (let i = F.bubbles.length - 1; i >= 0; i--) {
    const b = F.bubbles[i];
    b.y += b.v * dt;
    if (b.y > 1.1) F.bubbles.splice(i, 1);               // 飘出顶=自然消失不扣不罚
  }
  engEnsure(F);                                            // 目标色保底（换题换色后同样生效）
  let colors = 0;
  for (let i = 0; i < F.bubbles.length; i++) if (F.bubbles[i].kind === 'color') colors++;
  if (colors < F.popTarget && F.t >= F.spawnAt) {        // 常规补给：0.45-1.1s 一只（秒级 respawn）
    engSpawn(F, 'color', -0.08);
    F.spawnAt = F.t + 0.45 + F.rnd() * 0.65;
  }
  if (F.cfg.cloudMax > 0) {
    let clouds = 0;
    for (let i = 0; i < F.bubbles.length; i++) if (F.bubbles[i].kind === 'cloud') clouds++;
    if (clouds < F.cfg.cloudMax && F.t >= F.cloudAt) {
      engSpawn(F, 'cloud', -0.08);
      F.cloudAt = F.t + 0.9 + F.rnd() * 1.2;
    }
  }
}
const engLiveColors = F => F.bubbles.reduce((n, b) => n + (b.kind === 'color' ? 1 : 0), 0);
const engLiveTarget = F => {
  const c = engTargetColor(F);
  if (!c) return 0;
  return F.bubbles.reduce((n, b) => n + (b.kind === 'color' && b.color === c ? 1 : 0), 0);
};
/* 最早出场（y 最小=余量最足）的目标色彩泡（color 省略=任意彩泡）：教学指向/autoSolve 取泡共用 */
function engFirstColor(F, color) {
  let best = null;
  for (let i = 0; i < F.bubbles.length; i++) {
    const b = F.bubbles[i];
    if (b.kind === 'color' && (color == null || b.color === color) && (!best || b.y < best.y)) best = b;
  }
  return best;
}

/* ---------- 点泡引擎 v2（无 DOM）：engTapBubble(F, id) —— 点场上一只泡
   'pop' = 目标色彩泡点破（计数+1，无自动判定——提交制）；
   'nope' = 点非目标色彩泡（不破不计数不移除——探索，UI 抖动提示）；
   'cloud' = 点破灰云朵（不计数，cloudPops+1，探索≠错误）；
   null = 非法 id / 泡已不在场 / 关卡已结束 ---------- */
function engTapBubble(F, id) {
  const L = F.L;
  if (!L || L.done) return null;
  let idx = -1;
  for (let i = 0; i < F.bubbles.length; i++) if (F.bubbles[i].id === id) { idx = i; break; }
  if (idx < 0) return null;
  const b = F.bubbles[idx];
  const q = L.quizzes[L.step];
  if (!q) return null;
  if (b.kind === 'cloud') {
    F.bubbles.splice(idx, 1);
    L.totalPops++;
    L.cloudPops++;                                       // 只记 cloudPops 入星级折算（≥3 次=1 miss）
    return 'cloud';
  }
  if (b.color !== q.color) return 'nope';                // 非目标色：泡不破、计数不动
  F.bubbles.splice(idx, 1);
  L.totalPops++;
  q._cnt++;
  return 'pop';                                          // 点满不再自动判——孩子自己数自己提交
}

/* ---------- 提交引擎 v2：engSubmit(F) —— 点「好了」按钮的判定真值
   'right' = 计数==N 本题成（step 前进）；
   'done' = 末题提交成=通关；
   'wrong_more' = 计数>N：计数清零重数（UI 侧另重置泡场）+submitErr+1（真实错误路径）；
   'wrong_less' = 计数<N：不清空继续点（合法路径，不算 miss）；
   null = 关卡已结束 ---------- */
function engSubmit(F) {
  const L = F.L;
  if (!L || L.done) return null;
  const q = L.quizzes[L.step];
  if (!q) return null;
  if (q._cnt > q.n) {
    L.submitErr++;
    q._cnt = 0;
    q.solved = false;
    return 'wrong_more';
  }
  if (q._cnt === q.n) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  return 'wrong_less';
}
const engWon = L => !!L && L.done;
/* miss = 多点提交错次 + 干扰云点破 ≥3 次折 1（承宽容口径）；星级 0=3★/1-2=2★/≥3=1★ */
const engMiss = L => (L.submitErr || 0) + ((L.cloudPops || 0) >= 3 ? 1 : 0);
const engStars = L => { const m = engMiss(L); return m === 0 ? 3 : (m <= 2 ? 2 : 1); };

/* ---------- 结构校验（verify 用）：题数 5 / n 落章区间 / color ∈ 关色板 / 相邻题 n 不同 / flat0 题0 恒 3 蓝 ---------- */
function structOk(q, dch, flat, qi, prevN, palette) {
  const C = CHAPTERS[dch];
  if (!q || q.n < C.nMin || q.n > C.nMax) return false;
  if (prevN != null && q.n === prevN) return false;
  if (flat === 0 && qi === 0 && !(q.n === 3 && q.color === 'blue')) return false;
  if (ALL_COLORS.indexOf(q.color) < 0) return false;
  if (palette.indexOf(q.color) < 0) return false;
  return true;
}
/* ================= bubble 主逻辑 v2/r9（去计数器+颜色子集+提交制+倒计时收尾 / 泡泡场渲染 / 教学 / 推进）
   玩法：天空持续冒彩泡（蓝/黄/粉三色上飘+左右摆+灰云朵干扰），顶部只显示目标数 N+目标色色卡
   ——当前计数不显示，孩子必须自己在心里数。点破目标色泡=计数+1+数词语音；点非目标色泡=
   不破+抖动+轻「呜」（探索）；点灰云=破但不计数（探索）。点够后点兔子旁「好了」大按钮提交：
   ==N→right / >N→「多点了，重新数一数」清空重数（泡重置，miss+1）/ <N→「还差几个，再点点」
   不清空继续点。泡飘出顶=自然消失不罚；场恒保目标色泡 ≥2（respawn 秒级）。
   r9 倒计时收尾（章后段=每章第 4/5 关 cur.timed）：每题先静默数数 QUIET_SEC(n)（无计时显示），
   后 COUNT_SEC 可见温和倒计时（#timer 琥珀条收缩，末 3 秒转橙轻脉冲）；超时泡泡缓浮不爆
   SLEEP_SEC（静息：点泡/提交软吞 'sleep' 零惩罚，queue 播 bub_timeup+题面重读），随后自动
   温和重来（计数清零+计时重臂，泡唤醒不重建场——miss/submitErr/cloudPops/step 全不动）。
   estMs 家族定版字面 `const estMs = n => n * 345 + 600;`（n=码点数；四处同步=game-data 定义 /
   本注释 / game-verify 独立副本+数值断言 / build.py 字面 assert；禁 +300 变体）。
   验收钩子：window.BB = { get currentLevel, get quiz, get bubbles, tapBubble(id), tapSubmit(),
   async autoSolve(), get tutorial, get timer } */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出与泡场模拟提速（dt/SPEED 喂引擎）
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/开场任务语音/读题不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音（承 feed 款口径）：flat<3 每错必播；flat≥3 走 10s 节流；
   force=miss===2 豁免恰一次（wrong_less 不清空可连续触发，===2 保证豁免只发一次） */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.play(key, text); }
};

const fieldEl = $id('field'), counterEl = $id('counter'),
      rabbitBtn = $id('btn-rabbit'), submitBtn = $id('btn-submit'),
      replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear'),
      ghostEl = $id('ghost'), timerEl = $id('timer');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let field = null;                               // 当前泡泡场（engField 产物）
let state = { locked: false, won: false, demo: false, tut: 'none' };
let tstate = { phase: 'off', t0: 0, countEnd: 0, sleepEnd: 0 };   // r9 倒计时状态机（UI 层，走 field.t 模拟钟）
let lastAct = Date.now();
let lastBlankHint = 0;                          // 点天空空白轻提示节流（§0.16，10s）
let helpRedemo = false;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  submitBtn.innerHTML = ICONS.submit;
  $id('bicon').innerHTML = ICONS.bubbleMini;
  fieldEl.querySelector('.sky').innerHTML = skySvg();
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 72);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：点破=清脆双音 / 云朵与非目标色「呜」=低柔下滑 / 提交成=轻铃上扬 */
const popSfx = () => { if (!VERIFY) { KIDS.audio.note(988, 0.1, 0, 0.55); KIDS.audio.note(1319, 0.12, 0.05, 0.4); } };
const wooSfx = () => { if (!VERIFY) { KIDS.audio.note(233, 0.2, 0, 0.4); KIDS.audio.note(175, 0.24, 0.1, 0.35); } };
const chimeFull = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.24, 0, 0.5); KIDS.audio.note(783.99, 0.3, 0.09, 0.5); } };

/* ================= 泡泡场渲染（引擎逐帧 → DOM；transform 定位，量测走 offsetWidth/offsetHeight） ================= */
const bubbleEls = new Map();                    // id → button
const lastPos = new Map();                      // id → {x,y} 场内像素（爆裂圈/幽灵手指定位用）
function mkBubbleEl(b) {
  const el = document.createElement('button');
  el.className = 'bubble' + (b.kind === 'cloud' ? ' cloud' : '') + (b.big ? ' big' : '');
  el.dataset.id = b.id;
  el.setAttribute('aria-label', b.kind === 'cloud' ? '小云朵' : '泡泡');
  el._hw = b.big ? 48 : 38;                     // 半宽（命中盒 96/76 的一半，transform 中心定位用）
  el.innerHTML = '<span class="bod">' + (b.kind === 'cloud' ? cloudSvg() : bubbleSvg(b.hue)) + '</span>';
  return el;
}
function renderField() {
  if (!cur || !field) return;
  const W = fieldEl.clientWidth, H = fieldEl.clientHeight;
  const seen = {};
  for (let i = 0; i < field.bubbles.length; i++) {
    const b = field.bubbles[i];
    seen[b.id] = 1;
    let el = bubbleEls.get(b.id);
    if (!el) { el = mkBubbleEl(b); bubbleEls.set(b.id, el); fieldEl.appendChild(el); }
    const x = (b.x + b.wobA * Math.sin(b.wobP + field.t * b.wobF)) * W;
    const y = (1 - b.y) * H;
    lastPos.set(b.id, { x: x, y: y });
    el.style.transform = 'translate3d(' + Math.round(x - el._hw) + 'px,' + Math.round(y - el._hw) + 'px,0)';
  }
  bubbleEls.forEach((el, id) => { if (!seen[id]) { el.remove(); bubbleEls.delete(id); lastPos.delete(id); } });
  if (ghost.trackId != null) {                  // 幽灵手指逐帧跟泡
    const p = lastPos.get(ghost.trackId);
    if (p) {
      const r = fieldEl.getBoundingClientRect();  // fixed 手指换算屏幕坐标（运行时定位，非布局断言）
      ghostEl.style.left = Math.round(r.left + p.x) + 'px';
      ghostEl.style.top = Math.round(r.top + p.y) + 'px';
    } else {
      ghost.trackId = null;
      if (state.tut === 'help') pointHelpNext();
    }
  }
}
/* 点破裂圈：在场内像素位放一枚扩散环（云朵灰色版），340ms 后移除 */
function burstAt(id, cloud) {
  const p = lastPos.get(id);
  if (!p) return;
  const d = document.createElement('div');
  d.className = 'burst' + (cloud ? ' cloud' : '');
  d.style.left = Math.round(p.x) + 'px';
  d.style.top = Math.round(p.y) + 'px';
  fieldEl.appendChild(d);
  setTimeout(() => d.remove(), 340 * SPEED + 80);
}
/* 非目标色泡抖动（不破——色不对的可见提示） */
function shakeBubble(id) {
  const el = bubbleEls.get(id);
  if (!el) return;
  el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope');
  setTimeout(() => { el.classList.remove('nope'); }, 500 * SPEED + 100);
}
function resetField() {
  field = engField(cur);
  armTimer();                                   /* r9：场重建（新关/多点重数）→ 倒计时重臂（模拟钟归零重启） */
  bubbleEls.forEach(el => el.remove());
  bubbleEls.clear();
  lastPos.clear();
}

/* ---------- 模拟驱动：rAF 为主 + 250ms interval 兜底（后台/降频帧停摆不断流）；dt 钳 250ms ---------- */
let lastT = 0;
function advance(now) {
  if (!cur || !field) { lastT = now; return; }
  const dtReal = Math.min(now - lastT, 250);
  lastT = now;
  if (dtReal > 0 && !state.won) {
    const drift = tstate.phase === 'sleep' ? DRIFT_K : 1;   /* r9 静息期缓浮（泡泡缓浮不爆——泡速/生成/模拟钟同步放慢） */
    engFieldTick(field, dtReal / 1000 / SPEED * drift);     // 泡速/生成按 SPEED 缩放
    timerTick();                                            // r9 倒计时推进（静息窗按 DRIFT_K 折算的同一模拟钟）
  }
  renderField();
}

/* ================= r9 倒计时收尾状态机（UI 层；引擎 engFieldTick 直驱不涉计时保确定性）
   armTimer  新题/泡场重建时重臂（renderQuiz 与 resetField 双锚点）
   quiet     静默数数窗 QUIET_SEC(n)：无计时显示（不打扰数数）
   count     可见倒计时 COUNT_SEC：#timer.on 琥珀条收缩，remain<3s 转 .low（橙+轻脉冲）
   sleep     超时静息 SLEEP_SEC（模拟钟按 DRIFT_K 折算）：field.sleep 缓浮、输入软吞 'sleep'、
             queue 播 bub_timeup→题面重读；lastAct 刷新（静息不计救援静置）
   roll      温和重来：q._cnt 清零+重臂 quiet（泡唤醒不重建场；miss/submitErr/cloudPops/step 零改动） */
function armTimer() {
  tstate = { phase: cur && cur.timed && !cur.done ? 'quiet' : 'off',
             t0: field ? field.t : 0, countEnd: 0, sleepEnd: 0 };
  fieldEl.classList.remove('sleep');
  if (timerEl) timerEl.classList.remove('on', 'low');   /* 立即摘除（不等下一帧 timerTick） */
}
function timerTick() {
  if (!cur || state.won || cur.done) { if (timerEl) timerEl.classList.remove('on', 'low'); return; }
  const q = cur.quizzes[cur.step];
  if (!q) return;
  if (tstate.phase === 'quiet' && cur.timed && field.t - tstate.t0 >= QUIET_SEC(q.n)) {
    tstate.phase = 'count';                                // 收尾开始：温和单音+琥珀条登场
    tstate.countEnd = field.t + COUNT_SEC;
    if (!VERIFY) KIDS.audio.note(523.25, 0.16, 0, 0.22);
  } else if (tstate.phase === 'count' && field.t >= tstate.countEnd) {
    tstate.phase = 'sleep';                                // 超时：泡泡缓浮不爆（非惩罚）
    tstate.sleepEnd = field.t + SLEEP_SEC * DRIFT_K;       // 静息窗按缓浮钟折算（真实体感=SLEEP_SEC）
    fieldEl.classList.add('sleep');
    lastAct = Date.now();
    counterEl.classList.remove('rescue'); void counterEl.offsetWidth; counterEl.classList.add('rescue');
    KIDS.voice.queue([{ key: VOICE.timeup.key, text: VOICE.timeup.text },   /* 睡着啦不着急→题面重读（顺序播） */
                      { key: quizKey(q), text: quizSpeech(q) }]);   /* T46 阶段2 题面 clip（链尾段，缺 clip 文本自愈） */
  } else if (tstate.phase === 'sleep' && field.t >= tstate.sleepEnd) {
    q._cnt = 0;                                            // 温和重来：从零重数（零惩罚）
    tstate.phase = cur.timed ? 'quiet' : 'off';
    tstate.t0 = field.t;
    tstate.countEnd = 0; tstate.sleepEnd = 0;
    fieldEl.classList.remove('sleep');
  }
  if (timerEl) {                                           // #timer 渲染（仅 count 相位可见）
    const on = tstate.phase === 'count';
    timerEl.classList.toggle('on', on);
    if (!on) { timerEl.classList.remove('low'); }
    else {
      const rem = Math.max(0, tstate.countEnd - field.t);
      timerEl.firstElementChild.style.width = (rem / COUNT_SEC * 100).toFixed(1) + '%';
      timerEl.classList.toggle('low', rem < 3.05);
    }
  }
}
function rafCB(now) { advance(now); requestAnimationFrame(rafCB); }
requestAnimationFrame(rafCB);
setInterval(() => { if (performance.now() - lastT > 300) advance(performance.now()); }, 250);

/* ================= 题面渲染（v2：目标色色卡+目标数——当前计数不显示） ================= */
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  $id('target-n').textContent = q.n;
  $id('bicon').innerHTML = bubbleSvg(HUE_OF[q.color]);      // 目标色色卡（图形呈现，零文字）
  armTimer();                                   /* r9：新题 → 倒计时重臂（题面即计时锚） */
  renderStep();
  if (!VERIFY && !state.demo) KIDS.voice.play(quizKey(q), quizSpeech(q)); // 读题：题面 clip（T46 阶段2，缺 clip 文本自愈）
}
function renderStep() {                         // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 幽灵手指（教学"帮"/演示共用；逐帧跟泡） ================= */
const ghost = {
  trackId: null,
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { this.trackId = null; ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(id) {
  if (VERIFY || id == null) return;
  ghost.trackId = id;
  ghost.show();
  setTimeout(() => { if (ghost.trackId === id) ghost.press(); }, 800 * SPEED);
}
function ghostToSubmit() {                      // 幽灵手指静态指向「好了」按钮（教学提交步演示）
  if (VERIFY) return;
  ghost.trackId = null;
  const r = submitBtn.getBoundingClientRect();
  ghostEl.style.left = Math.round(r.left + r.width / 2) + 'px';
  ghostEl.style.top = Math.round(r.top + r.height / 2) + 'px';
  ghost.show();
}
function pointHelpNext() {                      // 教学"帮"：未点够指目标色泡；点够了指「好了」按钮
  if (!cur || !field) return;
  const q = cur.quizzes[cur.step];
  if (!q) return;
  if (q._cnt >= q.n) { ghostToSubmit(); return; }
  const b = engFirstColor(field, q.color);
  if (b) pointGhostAt(b.id);
}

/* ================= 点泡主路径（真实点击 / BB.tapBubble / autoSolve / 教学演示共用）
   v2 返回值：'pop' 目标色点破 / 'skip' 非目标色或干扰云（不计数）/ null 演出期吞输入 /
   'sleep' r9 静息期软吞（泡泡缓浮不爆——零声零惩罚）/ false 非法 id 或泡已离场 ---------- */
async function uiTapBubble(id, demo) {
  if (!cur || state.won) return false;
  if (tstate.phase === 'sleep') return 'sleep';             /* r9 静息期：泡不爆不响（软吞非惩罚） */
  if ((state.locked && !demo) || (state.demo && !demo)) { sfx('pop'); return null; }   // 吞输入轻叮（演出期 null）
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const run = cur;                              /* 身份守卫：演出窗口内重玩会重建 cur——防旧续体错推进 */
  const r = engTapBubble(field, id);
  if (r === null) { sfx('pop'); return false; } /* 泡已不在场/非法 id：轻叮零惩罚 */
  if (r === 'nope') {                           /* 非目标色：泡不破+抖动+「呜」轻反馈（探索≠错误） */
    wooSfx();
    shakeBubble(id);
    return 'skip';
  }
  burstAt(id, r === 'cloud');
  if (r === 'cloud') {                          /* 干扰云朵：点破不计数+「呜」（探索≠错误，不说 wrong） */
    wooSfx();
    if (state.tut === 'help') pointHelpNext();
    return 'skip';
  }
  lastAct = Date.now();                         /* 仅目标色点破重置救援钟（§0.7a） */
  if (state.tut === 'help') {                   /* 教学"独"：首次点破目标色 → 强化反馈放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  popSfx();
  KIDS.voice.play(numKey(q._cnt), numCn(q._cnt));   /* 跟数数词 clip（T46 阶段2，缺 clip 文本自愈——计数不显示，耳朵是刻度） */
  return 'pop';
}

/* ================= 提交主路径 v2/r9（「好了」按钮 / BB.tapSubmit / autoSolve / 教学演示共用）
   返回值：'right'（含末题成——通关内部走 winFlow）/ 'wrong_more' / 'wrong_less' /
   'sleep' r9 静息期软吞（重来前不收卷——零惩罚）/ null 演出期吞输入或无题 ---------- */
async function uiSubmit(demo) {
  if (!cur || state.won) return null;
  if (tstate.phase === 'sleep') return 'sleep';             /* r9 静息期：提交软吞（重来后再数） */
  if ((state.locked && !demo) || (state.demo && !demo)) { sfx('pop'); return null; }   // 吞输入（演出期 null）
  const run = cur;                              /* 身份守卫（同上） */
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  const r = engSubmit(field);
  if (r === null) return null;

  if (r === 'wrong_less') {                     /* 少点：不清空继续点（合法路径不算 miss） */
    lastAct = Date.now();
    state.locked = true;                        /* 短窗防连点提交刷语音 */
    wooSfx();
    hopRabbit();
    sayW(VOICE.wrongLess.key, VOICE.wrongLess.text, engMiss(cur) === 2);
    await wait(500 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    if (state.tut === 'help') pointHelpNext();
    return 'wrong_less';
  }
  if (r === 'wrong_more') {                     /* 多点：清空重数+泡重置+miss+1（真实错误路径） */
    lastAct = Date.now();
    state.locked = true;
    wooSfx();
    resetField();                               /* 泡重置（确定性种子=同构新场） */
    hopRabbit();
    sayW(VOICE.wrongMore.key, VOICE.wrongMore.text, engMiss(cur) === 2);
    await wait(600 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    if (state.tut === 'help') pointHelpNext();
    return 'wrong_more';
  }
  /* right / done：提交成 */
  lastAct = Date.now();
  state.locked = true;                          /* 120ms 防重入窗（承原节奏） */
  chimeFull();
  await wait(120 * SPEED);
  if (cur !== run) return r;
  state.locked = false;
  if (r === 'done') winFlow();
  else {
    renderQuiz();
    if (state.tut === 'help') pointHelpNext();
  }
  return 'right';
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  /* 家族契约 F（r9）：生成关预告禁"章索引加一取模"字面——须实算 genLevel(f+1).dch 取 GEN_HINTS
     （旧式按章索引加一取模在生成关章中段 off-by-one——dayEnd 传 lim-1 常为章中段，必错章）

  const pre = BB.quiz;                               /* 静息软吞：点泡/提交 'sleep' 零惩罚泡不破 */
  const tb = tgt()[0];
  const rSlp = tb ? await BB.tapBubble(tb.id) : null;
  const rSub = await BB.tapSubmit();
  const post = BB.quiz;
  okA = okA && rSlp === 'sleep' && rSub === 'sleep' &&
    post.count === pre.count && post.miss === pre.miss && post.submitErr === pre.submitErr &&
    post.step === pre.step && post.cloudPops === pre.cloudPops &&
    (tb ? BB.bubbles.some(b => b.id === tb.id) : false);
  let rolled = false, w4 = 0;                        /* 自动温和重来：计数清零+重臂+sleep 摘除+星级无损 */
  while (w4++ < 200) {
    if (BB.timer.phase === 'quiet') { rolled = true; break; }
    await wait(30);
  }
  const rolledOk = rolled && BB.quiz.count === 0 && !fieldEl.classList.contains('sleep') &&
    BB.quiz.miss === 0 && BB.quiz.submitErr === 0 && BB.quiz.step === 0 && engStars(cur) === 3;
  let sawCount2 = false, w5 = 0;                     /* count 期答对=计时取消（新题 quiet 重臂） */
  while (w5++ < 260) {
    if (BB.timer.phase === 'count') { sawCount2 = true; break; }
    await wait(60);
  }
  await popTo(BB.quiz.n);
  const rRight = await BB.tapSubmit();
  const cancelOk = sawCount2 && rRight === 'right' && BB.quiz.step === 1 &&
    BB.timer.phase === 'quiet' && BB.timer.timed === true && !timEl.classList.contains('on');
  const countOk = timedRuleOk && offA && offB && okA && rolledOk && cancelOk;
  if (countOk) npass++;
  units.r9count = { ok: countOk, timedRule: timedRuleOk, off: offA && offB, cycle: okA,
    driftRate: Math.round(driftRate * 100) / 100, rolled: rolledOk, cancel: cancelOk, n8: n8 };

  /* ---- ⑫b estMs 家族 + nextHint 章末逐点独立副本断言（SPEC §2 文案重列） ---- */
  total++;
  const estOk = estMs(1) === 945 && estMs(12) === 12 * 345 + 600 &&
    estMs.toString().indexOf('345') >= 0 && estMs.toString().indexOf('+ 300') < 0;
  /* 静态章末 flat∈{4,9,14} 预告下一章；19=ch4 末→生成关 flat20（dch1）；
     21=生成关章中段（dch(22)=1→GEN[0]；旧式 (ci+1)%4 会错给 GEN[1]——契约 F off-by-one 哨兵）；
     24→flat25（dch2）；29→flat30（dch3）；负哨兵=nextHint(4)≠ch3 文案（M1 同型） */
  const SPEC_HINT = { 4: '下次泡泡有两种颜色，听好点哪种', 9: '又多了一种颜色，数要更大啦',
    14: '泡泡有快有慢，数清楚了再按大对勾', 19: '新一轮泡泡数数挑战',
    21: '新一轮泡泡数数挑战', 24: '更多泡泡快点一点', 29: '听好颜色再点' };
  const hintOk = Object.keys(SPEC_HINT).every(f => nextHint(+f) === SPEC_HINT[f]);
  const hintNeg = nextHint(4) !== '泡泡有快有慢，数清楚了再按大对勾' &&
    nextHint(21) !== '更多泡泡快点一点';
  const famOk = estOk && hintOk && hintNeg;
  if (famOk) npass++;
  units.r9fam = { ok: famOk, estMs: estOk, hintOk: hintOk && hintNeg,
    durMin: durMin, durMax: durMax, durLevels: durAll.length };

  const out = { game: 'bubble', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  runVerify();
}
