<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>泡泡数数</title>
<style>
/* ================= 泡泡数数 bubble（batch21）v2/r9：去计数器+颜色子集+提交制+倒计时收尾 ================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、天空浅青场、暖橙主色；
   触摸目标：泡泡按钮热区恒 76px（大泡 96px，均 ≥64），「好了」提交按钮 96、底栏按钮 ≥72；
   泡位由引擎 rAF 驱动（transform translate3d，布局断言用 offsetWidth/offsetHeight 稳定值）；
   5-6 岁零文字依赖：顶部=目标色色卡+目标数大数字（当前计数不显示——数在心里），
   语义全靠语音承载；「好了」=绿色大对勾图形按钮（零文字）；
   r9：#timer 温和琥珀倒计时条（章后段收尾，零文字）+#field.sleep 超时静息（泡泡缓浮不爆） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#8FCBE0;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：目标卡（色卡+目标数）+ 泡泡天空 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 10px}
/* 目标卡 v2：目标色色卡（泡泡图形按目标色渲染）+大数字 N——当前计数不显示（孩子心里数） */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0 8px}
#counter{display:flex;align-items:center;gap:12px;padding:6px 34px;border-radius:26px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;min-height:76px}
#counter .tgt{display:flex;align-items:center;gap:12px}
#counter .tgt .bicon{width:56px;height:56px;display:block}
#counter .tgt .bicon svg{width:100%;height:100%}
#counter b{font-weight:800;color:#4A3B2E;line-height:1;font-variant-numeric:tabular-nums}
#target-n{font-size:54px}
#counter.rescue{animation:d-rescue 1.1s ease-in-out 3}
@keyframes d-rescue{0%,100%{box-shadow:0 5px 0 #D8C9B4,0 0 0 0 rgba(232,151,90,0)}
  50%{box-shadow:0 5px 0 #D8C9B4,0 0 0 12px rgba(232,151,90,.42)}}

/* r9 倒计时收尾：温和琥珀条（仅 count 相位可见，零文字；末 3 秒转橙轻脉冲） */
#timer{display:none;width:92px;height:14px;border-radius:8px;background:#F0E4CC;
  border:2px solid #4A3B2E;overflow:hidden;flex:0 0 auto}
#timer.on{display:block}
#timer i{display:block;height:100%;background:#F7CE55;border-radius:5px;transition:width .12s linear}
#timer.low i{background:#E8975A}
#timer.low{animation:t-low .9s ease-in-out infinite}
@keyframes t-low{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

/* 泡泡天空场（引擎 rAF 定位，overflow 剪裁出顶泡与爆裂） */
#field{position:relative;width:100%;max-width:1180px;flex:1 1 auto;min-height:200px;
  background:linear-gradient(180deg,#DDEFF6 0%,#D5EAF2 55%,#CFE6EC 100%);
  border:3px solid #A9C6D4;border-radius:26px;overflow:hidden;
  box-shadow:inset 0 0 0 6px rgba(255,249,238,.5)}
#field .sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.95}
/* r9 超时静息（泡泡缓浮不爆）：天色转暮+泡体缓摆（缓浮由引擎 DRIFT_K 放慢上飘速度） */
#field.sleep{background:linear-gradient(180deg,#D8E6EE 0%,#D2E0EA 55%,#CCDCE7 100%)}
#field.sleep .bubble .bod{animation-duration:6.5s}
#field.sleep .bubble.cloud .bod{animation-duration:8.5s}

/* ---------- 场上泡泡：绝对定位按钮（坐标由引擎逐帧 transform） ---------- */
.bubble{position:absolute;left:0;top:0;width:76px;height:76px;padding:0;border:none;background:none;
  will-change:transform;z-index:4;transform-origin:50% 50%}
.bubble.big{width:96px;height:96px}
.bubble .bod{display:block;width:100%;height:100%;pointer-events:none;
  animation:b-bob 2.6s ease-in-out infinite}
.bubble .bod svg{width:100%;height:100%}
.bubble.cloud .bod{animation-duration:4.2s}
@keyframes b-bob{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
/* 非目标色泡抖动（不破——色不对的可见提示；加在内层避免与定位 transform 冲突） */
.bubble.nope .bod{animation:b-nope .42s ease}
@keyframes b-nope{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  45%{transform:translateX(6px)}70%{transform:translateX(-4px)}}
/* 点破爆裂圈（云朵灰色版） */
.burst{position:absolute;z-index:6;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;
  border:5px solid rgba(255,255,255,.92);box-shadow:0 0 0 4px rgba(232,151,90,.35);
  pointer-events:none;animation:burst .32s ease-out forwards}
.burst.cloud{border-color:#B9C2CB;box-shadow:0 0 0 4px rgba(150,160,170,.3)}
@keyframes burst{from{transform:scale(.35);opacity:1}to{transform:scale(1.55);opacity:0}}

/* ---------- 底栏（左侧=兔子+「好了」提交；右侧=听题/重玩） ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#dock-l{display:flex;align-items:center;gap:16px;flex:0 0 auto}
#dock-r{display:flex;align-items:center;gap:12px;flex:0 0 auto}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-submit{width:96px;height:96px;border-radius:50%;background:#DCEED2;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #9DBE8C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-submit:active{transform:translateY(3px);box-shadow:0 1px 0 #9DBE8C}
#btn-submit svg{width:58px;height:58px}
#btn-submit.press{animation:sub-press .4s ease}
@keyframes sub-press{0%,100%{transform:scale(1)}45%{transform:scale(.93)}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，坐标逐帧跟泡泡/静态指按钮；照 batch5/6/7） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：目标卡适度收紧（泡按 field 实际宽高定位，无需改）。
   body.port=竖屏规则的类通道（媒体查询跟视口不跟元素，verify simView 靠注入 .port 吃到这段，
   REPORT-REVIEW-r9 M-A1），两段规则必须同步改 */
@media (orientation:portrait){
  #counter{gap:10px;padding:6px 24px}
  #target-n{font-size:46px}
  #counter .tgt .bicon{width:48px;height:48px}
  #timer{width:68px}
  #dock-l{gap:10px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
  #btn-submit{width:86px;height:86px}
}
body.port #counter{gap:10px;padding:6px 24px}
body.port #target-n{font-size:46px}
body.port #counter .tgt .bicon{width:48px;height:48px}
body.port #timer{width:68px}
body.port #dock-l{gap:10px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
body.port #btn-submit{width:86px;height:86px}
</style>
</head>
<body>
<div id="game" aria-label="泡泡数数">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <div id="counter" role="heading" aria-label="题目">
        <span class="tgt"><span class="bicon" id="bicon" aria-hidden="true"></span><b id="target-n">3</b></span>
        <span id="timer" aria-hidden="true"><i></i></span>
      </div>
    </div>
    <div id="field" aria-label="泡泡天空">
      <div class="sky" aria-hidden="true"></div>
    </div>
  </div>
  <div id="dock">
    <div id="dock-l">
      <button id="btn-rabbit" aria-label="小兔子"></button>
      <button id="btn-submit" aria-label="好了"></button>
    </div>
    <div id="dock-r">
      <button id="btn-hear" aria-label="再听一遍"></button>
      <button id="btn-replay" aria-label="再玩一次"></button>
    </div>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
