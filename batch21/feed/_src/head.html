<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>喂小兔</title>
<style>
/* ================= 喂小兔 feed（batch21）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   玩法 = 食物堆（1-3 堆）+ 大碗 + 小兔子：点堆取物入碗（数词 TTS 同步），碗内计数 == 目标时
   「喂给小兔」按钮亮起脉冲（≥96×96 主按钮 §0.9），点满自动判或点按钮判（两款并用 §0.46）；
   错堆=轻反馈不计数；答错=零惩罚碗不清空，点碗内食物取回（计数-1+数词倒读）。
   5-6 岁零文字依赖（§0.19）：题面 chip=食物图形+大数字（承 bridge 石头显大数字先例），
   题面/选项零文字标签，语义语音承载；底栏/家长面板除外。
   触摸目标：食物堆/碗内件 ≥64、喂食主按钮 ≥96、底栏 ≥64；overflowX 恒 0 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面行 + 场地（堆/碗/兔）+ 喂食按钮行 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:6px 12px}

/* 题面行：食物图形簇 + 大数字（零文字标签 §0.19）；点题卡 = 重听题面
   r8：combo=双组图形+数字+加号（合计订单全显）；left 问句=图形+'?'（去自动计数器） */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0 6px}
#prompt-chip{position:relative;display:flex;align-items:center;gap:14px;min-height:96px;
  padding:8px 30px;border-radius:26px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 5px 0 #D8C9B4;transition:transform .15s}
#prompt-chip:active{transform:translateY(3px)}
#prompt-chip .glyph{width:86px;height:76px;display:flex;align-items:center;justify-content:center}
#prompt-chip .glyph svg{width:100%;height:100%}
#prompt-chip .num{font-size:62px;font-weight:800;color:#4A3B2E;line-height:1;
  font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
/* combo 双食物合计订单：双组图形+数字收窄 + 加号（纯图形分隔） */
#prompt-chip.combo{gap:10px;padding:8px 22px}
#prompt-chip.combo .glyph{width:70px;height:62px}
#prompt-chip.combo .num{font-size:52px;min-width:38px}
#prompt-chip .plus{width:30px;height:30px;flex:0 0 30px;display:flex}
#prompt-chip .plus svg{width:100%;height:100%}
/* left 问句阶段角标 + '?' 主色转暖橙（问句态）；chip 数字位显 '?' 非数字 */
#prompt-chip.add2 .num{color:#E8975A}
#prompt-chip.add2::after{content:"";position:absolute;top:10px;right:12px;width:14px;height:14px;
  border-radius:50%;background:#E8975A;border:2.5px solid #FFF9EE;box-shadow:0 0 0 2px #E8975A}

/* ---------- 场地：上=食物堆一行，下=大碗+小兔子 ---------- */
#field{flex:1 1 auto;min-height:220px;width:100%;max-width:1080px;display:flex;flex-direction:column;
  justify-content:center;gap:8px;background:linear-gradient(180deg,#EDF4DC 0%,#E2ECCB 60%,#DCE7C2 100%);
  border:3px solid #C9D8A8;border-radius:26px;overflow:hidden;padding:10px 12px;
  box-shadow:inset 0 0 0 6px rgba(255,249,238,.5)}

/* 食物堆：主取物目标 ≥96（触摸面 ≥64 §0.9，主交互路径放大） */
#piles{flex:0 0 auto;display:flex;gap:20px;justify-content:center;align-items:flex-end;
  flex-wrap:wrap;padding:2px 4px}
.pile{position:relative;width:128px;height:112px;border-radius:22px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;transition:transform .15s}
.pile:active{transform:translateY(3px)}
.pile svg{width:96px;height:84px;pointer-events:none}
/* 点错堆轻反馈：摆头摆脑（零惩罚，不计数——§0.46 探索≠错） */
.pile.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}
  55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
/* 取到一件：堆轻弹一下 */
.pile.pulse-tap{animation:pile-tap .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pile-tap{0%,100%{transform:scale(1)}45%{transform:scale(1.06)}}
/* 答案级脚手架/救援：目标堆呼吸高亮循环（miss≥2 才出 §0.21） */
.pile.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 幽灵手指指向目标堆（通用 pulse） */
.pile.pulse{animation:an-pulse 1s ease 2}
@keyframes an-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px rgba(232,151,90,.95))}}

/* 剩物餐垫（r8 left 问句阶段：兔兔吃掉后剩 rem 件搬到这里可见——不清屏；
   点一件=亮一个圆点+数词（点数圆点支持，去自动计数器：总数永不上屏） */
#leftovers{display:none;flex:0 0 auto;min-height:78px;width:100%;justify-content:center;
  align-items:center;gap:7px;flex-wrap:wrap;padding:4px 6px;border-radius:18px;
  border:2.5px dashed #C9BDA8;background:rgba(255,249,238,.72)}
#leftovers.pulse{animation:an-pulse 1s ease 2}
.leftover{position:relative;width:64px;height:64px;border-radius:13px;background:#FFF9EE;
  border:2px solid #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .15s}
.leftover:active{transform:translateY(2px)}
.leftover svg{width:46px;height:46px;pointer-events:none}
.leftover .dot{display:block;width:15px;height:15px;border-radius:50%;background:#E8975A;
  border:2px solid #FFF9EE;box-shadow:0 0 0 2px #E8975A;position:absolute;right:-5px;top:-5px;
  opacity:0;transform:scale(.3);transition:all .25s cubic-bezier(.2,1.6,.4,1)}
.leftover.counted .dot{opacity:1;transform:scale(1)}   /* 点过才亮（圆点=孩子自己的计数轨迹） */
.leftover.in{animation:bitem-in .42s cubic-bezier(.2,1.6,.4,1)}
.leftover.wig{animation:an-wig .55s ease}
.leftover.eaten{animation:bitem-eaten .5s ease forwards}
/* 问句阶段高度预算：垫上要摆 ≤8 件，堆/碗略收（触摸面仍 ≥64） */
#field.left2 .pile{width:104px;height:92px}
#field.left2 .pile svg{width:80px;height:70px}
#field.left2 #bench{gap:10px}
#field.left2 #bowl-wrap{min-height:150px}

/* 大碗 + 小兔子一行 */
#bench{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;gap:14px;
  flex-wrap:wrap;padding:0 4px}
#bowl-wrap{position:relative;flex:1 1 320px;max-width:640px;min-height:176px;
  border-radius:24px;border:3px dashed #C9BDA8;background:rgba(255,249,238,.55);
  display:flex;align-items:flex-end;justify-content:center;padding:10px 12px 6px}
#bowl-wrap.pulse{animation:an-pulse 1s ease 2}
#bowl-art{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:92%;
  max-width:520px;pointer-events:none;opacity:.9}
#bowl-art svg{width:100%;height:auto}
/* 碗内食物件（取回通道按钮 ≥64）：新入碗弹跳 / 被吃掉飞向兔兔 */
#bowl-items{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px;
  align-items:flex-end;justify-content:center;width:100%;min-height:70px}
.bitem{width:66px;height:66px;border-radius:14px;background:rgba(255,249,238,.75);
  border:2px solid #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .15s}
.bitem:active{transform:translateY(2px)}
.bitem svg{width:52px;height:52px;pointer-events:none}
.bitem.in{animation:bitem-in .42s cubic-bezier(.2,1.6,.4,1)}
.bitem.breathe{animation:an-breathe 1.6s ease-in-out infinite}
#bowl-items.bump{animation:bowl-bump .22s ease}
@keyframes bowl-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
@keyframes bitem-in{from{transform:translateY(-46px) scale(.5);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.bitem.eaten{animation:bitem-eaten .5s ease forwards}
@keyframes bitem-eaten{to{transform:translate(40px,-72px) scale(.4);opacity:0}}

/* 小兔子（吃食演出：happy 姿 + 弹跳） */
#rabbit{flex:0 0 auto;width:112px;height:112px;display:flex;align-items:flex-end;
  justify-content:center;pointer-events:none}
#rabbit svg{width:104px;height:104px}
#rabbit.munch{animation:rabbit-munch .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes rabbit-munch{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) scale(1.05)}}

/* 取物飞行克隆体（装饰，pointer-events:none） */
.fly-food{position:fixed;z-index:90;width:52px;height:52px;pointer-events:none;
  transition:transform .43s cubic-bezier(.3,.85,.35,1.08)}
.fly-food svg{width:52px;height:52px}

/* ---------- 喂食主按钮（≥96×96 §0.9 主按钮）：取够时亮起脉冲（§0.46 两款并用） ---------- */
#feedbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:2px 8px}
#btn-feed{width:132px;height:132px;border-radius:50%;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 6px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s,background .25s,border-color .25s}
#btn-feed:active{transform:translateY(3px)}
#btn-feed svg{width:92px;height:92px;pointer-events:none}
/* 就绪（碗内计数==目标）：亮绿 + 脉冲提示（点按钮判或点满自动判） */
#btn-feed.ready{background:#EAF3DF;border-color:#6FA063;box-shadow:0 6px 0 #8FBF7F;
  animation:feed-ready 1.15s ease-in-out infinite}
@keyframes feed-ready{0%,100%{transform:scale(1);filter:none}
  50%{transform:scale(1.07);filter:drop-shadow(0 0 14px rgba(143,191,127,.95))}}
/* 提交错（≠目标）：晃动（零惩罚，碗不清空） */
#btn-feed.wig{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#btn-feed.pulse{animation:an-pulse 1s ease 2}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch9-11） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：堆/碗/按钮适配，主按钮仍 ≥96、堆/剩物 ≥64 */
@media (orientation:portrait){
  #prompt-chip{min-height:88px;padding:6px 24px;gap:10px}
  #prompt-chip .glyph{width:72px;height:64px}
  #prompt-chip .num{font-size:52px;min-width:38px}
  #prompt-chip.combo .glyph{width:60px;height:54px}
  #prompt-chip.combo .num{font-size:44px;min-width:32px}
  #piles{gap:14px}
  .pile{width:108px;height:96px}
  .pile svg{width:82px;height:72px}
  #field{min-height:200px;padding:8px 10px}
  #leftovers{min-height:74px;gap:6px}
  #field.left2 .pile{width:100px;height:88px}
  #field.left2 .pile svg{width:76px;height:66px}
  #bowl-wrap{flex:1 1 100%;min-height:150px}
  #field.left2 #bowl-wrap{min-height:140px}
  #rabbit{width:96px;height:96px}
  #rabbit svg{width:90px;height:90px}
  #btn-feed{width:116px;height:116px}
  #btn-feed svg{width:80px;height:80px}
  #btn-rabbit{width:76px;height:76px}
  #btn-rabbit svg{width:62px;height:62px}
}
</style>
</head>
<body>
<div id="game" aria-label="喂小兔">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <button id="prompt-chip" aria-label="题目，点我再听一遍"></button>
    </div>
    <div id="field" aria-label="喂食场地">
      <div id="piles" aria-label="食物堆"></div>
      <div id="leftovers" aria-label="剩下的食物"></div>
      <div id="bench">
        <div id="bowl-wrap" aria-label="大碗">
          <div id="bowl-items" aria-label="碗里的食物"></div>
          <div id="bowl-art" aria-hidden="true"></div>
        </div>
        <div id="rabbit" aria-hidden="true"></div>
      </div>
    </div>
    <div id="feedbar">
      <button id="btn-feed" aria-label="喂给小兔"></button>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
