<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天气穿衣</title>
<style>
/* ================= 天气穿衣 weather v2（batch23 条件推理改造）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E；
   5-6 岁零文字依赖：题面=条件区 chips（天气/体感/场景/温度数宇/人物头像）+场景卡
   （天气动画/温度计/角色）+TTS 题面句承载全部语义；
   触摸目标：衣物卡 = 主答案按钮 ≥96×96（§0.9，6 卡排布）；场景卡可点重听；底栏按钮 ≥72；
   多件题=点卡勾选（.held）+「穿好啦」提交钮（勾满 .ready 呼吸邀请）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 50px;display:flex;align-items:center;padding:5px 60px 0 14px;gap:14px}
#logo{width:40px;height:40px;border-radius:12px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 40px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：场景卡 → 条件区 → 衣物卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}

/* 天气场景卡：可点重听题面；SVG 天空动画；角色（小兔子/妈妈）站右侧穿衣服 */
#scene{position:relative;width:min(560px,94vw);height:172px;border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;overflow:hidden;padding:0;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene .sky{position:absolute;inset:0;border-radius:23px}
#scene .sky text{pointer-events:none}
#scene .bunny-slot{position:absolute;right:10px;bottom:6px;width:104px;display:flex;
  flex-direction:column;align-items:center;gap:0}
#scene #bunny-wear{display:flex;gap:2px;min-height:46px;align-items:flex-end;justify-content:center;z-index:3}
#scene #bunny-wear .wear{width:44px;height:44px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  border-radius:14px;display:flex;align-items:center;justify-content:center;
  animation:wear-pop .45s cubic-bezier(.2,1.7,.4,1) backwards;box-shadow:0 2px 0 #D8C9B4}
#scene #bunny-wear .wear svg{width:36px;height:36px}
@keyframes wear-pop{0%{transform:scale(.2) translateY(14px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
#scene #bunny{animation:bun-idle 2.4s ease-in-out infinite}
#scene #bunny svg{width:96px;height:96px}
#scene #bunny.is-mom svg{width:92px;height:92px}
#scene #bunny.hop{animation:bun-jump .5s ease 2}
@keyframes bun-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bun-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
/* 救援方向级：条件区 pulse（条件整体呼吸放大 3 次） */
#scene.pulse{animation:scene-pulse 1s ease-in-out 3}
@keyframes scene-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#scene.bounce{animation:scene-b .4s ease}
@keyframes scene-b{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}

/* 天气动画（纯 CSS keyframes，确定性零 JS） */
.sunrays{transform-origin:70px 52px;animation:sun-spin 18s linear infinite}
@keyframes sun-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.drop{animation:drop-fall 1.15s linear infinite}
.drop:nth-of-type(1){animation-delay:0s}.drop:nth-of-type(2){animation-delay:.22s}
.drop:nth-of-type(3){animation-delay:.44s}.drop:nth-of-type(4){animation-delay:.1s}
.drop:nth-of-type(5){animation-delay:.32s}.drop:nth-of-type(6){animation-delay:.54s}
@keyframes drop-fall{0%{transform:translateY(0);opacity:0}12%{opacity:1}
  85%{opacity:1}100%{transform:translateY(64px);opacity:0}}
.flake{animation:flake-fall 3s linear infinite}
.flake:nth-of-type(1){animation-delay:0s}.flake:nth-of-type(2){animation-delay:.7s}
.flake:nth-of-type(3){animation-delay:1.4s}.flake:nth-of-type(4){animation-delay:.35s}
.flake:nth-of-type(5){animation-delay:1.05s}
@keyframes flake-fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}
  25%{transform:translate(7px,24px) rotate(40deg)}50%{transform:translate(-5px,48px) rotate(-30deg)}
  75%{transform:translate(7px,70px) rotate(30deg)}92%{opacity:1}
  100%{transform:translate(-3px,92px) rotate(0);opacity:0}}
.wline{stroke-dasharray:30 46;animation:wind-slide 1.9s linear infinite}
.wline:nth-of-type(2){animation-delay:.5s}.wline:nth-of-type(3){animation-delay:1s}
@keyframes wind-slide{from{stroke-dashoffset:76}to{stroke-dashoffset:0}}
.leaf{animation:leaf-fly 2.8s linear infinite}
.leaf.l2{animation-delay:1.3s;animation-duration:3.3s}
@keyframes leaf-fly{0%{transform:translate(-36px,86px) rotate(0);opacity:0}
  8%{opacity:1}30%{transform:translate(90px,44px) rotate(160deg)}
  55%{transform:translate(200px,66px) rotate(300deg)}
  80%{transform:translate(300px,40px) rotate(440deg)}
  96%{opacity:1}100%{transform:translate(390px,58px) rotate(560deg);opacity:0}}

/* ---------- 条件区（题面条件 chips：天气/体感/场景/温度数宇/人物——幽灵手教学圈注锚点） ---------- */
#conds{flex:0 0 auto;display:flex;gap:10px;justify-content:center;align-items:center;
  width:100%;max-width:760px;min-height:68px}
#conds.pulse{animation:conds-pulse 1s ease-in-out 3}
@keyframes conds-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#conds .chip{position:relative;width:64px;height:64px;border-radius:18px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto}
#conds .chip svg{width:44px;height:44px}
#conds .chip.istemp{width:86px;border-radius:20px}
#conds .chip.istemp .tdeg{display:flex;align-items:baseline;justify-content:center;gap:1px;
  font-size:40px;font-weight:800;color:#4A3B2E;line-height:1}
#conds .chip.istemp .tdeg i{font-style:normal;font-size:26px;color:#E8975A}
#conds .chip.isper{border-radius:50%}
#conds .chip.isper svg{width:46px;height:46px}
#conds .chip.isper .pbadge{position:absolute;right:-9px;bottom:-7px;width:28px;height:28px;
  border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;display:flex;
  align-items:center;justify-content:center}
#conds .chip.isper .pbadge svg{width:22px;height:22px}

/* ---------- 衣物卡排：一行 4-6 卡，主答案按钮 ≥96×96；吞输入=容器 bump ---------- */
#board{display:flex;gap:12px;justify-content:center;align-items:stretch;flex:0 0 auto;
  width:100%;max-width:800px;padding:0 2px}
#board.bump{animation:board-bump .22s ease}
@keyframes board-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 5px 0 #D8C9B4;flex:0 0 auto;width:118px;min-height:138px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
.card:active{transform:translateY(3px)}
.card .gwrap{width:88px;height:92px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card .gwrap svg{width:84px;height:84px}
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 多件题勾选：绿框+角标勾+轻微上浮（等提交） */
.card.held{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;transform:translateY(-5px)}
.card.held .check{opacity:1;transform:scale(1)}
.card .check{position:absolute;right:-8px;top:-10px;width:34px;height:34px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #4A3B2E;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.3);transition:all .25s cubic-bezier(.2,1.6,.4,1)}
.card .check svg{width:20px;height:20px}
.card.bump{animation:card-bump .22s ease}
@keyframes card-bump{0%,100%{transform:scale(1)}45%{transform:scale(.94)}}
/* 答对：卡绿+弹（衣物飞到角色身上） */
.card.lit{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;
  animation:card-lit .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes card-lit{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 答错：摇头晃动（不灰掉可重选——零惩罚语义反馈款） */
.card.wig{animation:an-wig .6s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}22%{transform:rotate(-8deg) translateX(-4px)}
  50%{transform:rotate(7deg) translateX(3px)}78%{transform:rotate(-4deg) translateX(-2px)}}
/* 30s 答案级救援：下一件应选卡呼吸高亮循环（§0.21） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 换装飞行体（卡 → 角色，fixed 层 CSS transition） */
.flywear{position:fixed;z-index:90;width:64px;height:64px;border-radius:16px;display:flex;
  align-items:center;justify-content:center;background:#FFF9EE;border:3px solid #6FA063;
  box-shadow:0 4px 0 #6FA063;pointer-events:none;
  transition:transform .43s cubic-bezier(.3,.85,.35,1.08)}
.flywear svg{width:52px;height:52px}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
/* 「穿好啦」提交钮（多件题出现；勾满 need=.ready 呼吸邀请） */
#btn-wear{width:96px;height:80px;border-radius:26px;background:#8FBF7F;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #6FA063;display:none;align-items:center;justify-content:center;
  flex:0 0 auto;transition:transform .15s}
#btn-wear.show{display:flex}
#btn-wear:active{transform:translateY(3px);box-shadow:0 2px 0 #6FA063}
#btn-wear svg{width:56px;height:56px}
#btn-wear.ready{animation:wear-ready 1.5s ease-in-out infinite}
@keyframes wear-ready{0%,100%{filter:drop-shadow(0 0 0 rgba(111,160,99,0))}50%{filter:drop-shadow(0 0 14px rgba(111,160,99,.95))}}
#btn-wear.press{animation:wear-press .3s ease}
@keyframes wear-press{0%,100%{transform:scale(1)}45%{transform:scale(.92)}}
#btn-wear.bump{animation:card-bump .22s ease}
#btn-wear.breathe{animation:an-breathe 1.6s ease-in-out infinite}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21/22） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：场景/条件/卡适配，主答案卡仍 ≥96 */
/* body.port=竖屏规则的类通道（媒体查询跟视口不跟元素，verify simView 靠注入 .port 吃到这段，
   REPORT-REVIEW-r9 M-A1），两段规则必须同步改 */
@media (orientation:portrait){
  #scene{height:158px}
  #scene .bunny-slot{width:92px}
  #scene #bunny svg{width:84px;height:84px}
  #scene #bunny.is-mom svg{width:80px;height:80px}
  #scene #bunny-wear .wear{width:38px;height:38px}
  #scene #bunny-wear .wear svg{width:30px;height:30px}
  #conds{gap:8px;min-height:62px}
  #conds .chip{width:58px;height:58px;border-radius:16px}
  #conds .chip svg{width:40px;height:40px}
  #conds .chip.istemp{width:80px}
  #conds .chip.istemp .tdeg{font-size:34px}
  #board{gap:8px}
  .card{width:100px;min-height:122px;border-radius:20px}
  .card .gwrap{width:76px;height:80px}
  .card .gwrap svg{width:72px;height:72px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
  #btn-wear{width:86px;height:74px}
}
body.port   #scene{height:158px}
body.port   #scene .bunny-slot{width:92px}
body.port   #scene #bunny svg{width:84px;height:84px}
body.port   #scene #bunny.is-mom svg{width:80px;height:80px}
body.port   #scene #bunny-wear .wear{width:38px;height:38px}
body.port   #scene #bunny-wear .wear svg{width:30px;height:30px}
body.port   #conds{gap:8px;min-height:62px}
body.port   #conds .chip{width:58px;height:58px;border-radius:16px}
body.port   #conds .chip svg{width:40px;height:40px}
body.port   #conds .chip.istemp{width:80px}
body.port   #conds .chip.istemp .tdeg{font-size:34px}
body.port   #board{gap:8px}
body.port   .card{width:100px;min-height:122px;border-radius:20px}
body.port   .card .gwrap{width:76px;height:80px}
body.port   .card .gwrap svg{width:72px;height:72px}
body.port   #btn-rabbit{width:78px;height:78px}
body.port   #btn-rabbit svg{width:64px;height:64px}
body.port #btn-wear{width:86px;height:74px}
</style>
</head>
<body>
<div id="game" aria-label="天气穿衣">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="题目场景，点我再听一遍"></button>
    <div id="conds" aria-label="题目条件"></div>
    <div id="board" aria-label="衣服卡片"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-wear" aria-label="穿好啦，提交"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
