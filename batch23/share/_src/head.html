<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>分糖果</title>
<style>
/* ================= 分糖果 share（batch23 + r22 难度加深）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E；
   玩法 = 托盘 N 颗糖 + K 只动物各一深碗（两击制：点糖提起→点碗飞入）+
   ch3 小盘（均衡且剩 <K 时引导点亮，点盘收尾）。取回=点碗里的糖退回托盘。
   自动判定无错误路径：不等/有剩=未完成继续；相等且分完=celebrate（动物吃糖跳）。
   r22（SPEC-R22）：ch3 扩 k=4 四碗档（#stations.k4 碗宽 150/动物略缩）；
   ch4 新作答面——cmp 比较题（碗阵静态展示，who=点动物站作答/diff=数字钮）+
   rev 等分反推（数字钮），作答钮 .numkey/.askbtn ≥64，选错 wiggle 可重选。
   5-6 岁零文字依赖（§0.19）：题面 chip = 糖图形+大数字+箭头+动物图形+大数字，
   语义语音承载；底栏/家长面板除外。
   触摸目标：托盘糖/碗内糖/动物站/数字钮 ≥64、底栏 ≥64；overflowX 恒 0 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面行 + 场地（托盘/动物碗排/小盘） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:6px 12px}

/* 题面行：糖图形 + 大数字 + 分给箭头 + 动物图形 + 大数字（零文字标签 §0.19）；
   点题卡 = 重听题面 */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0 6px}
#prompt-chip{display:flex;align-items:center;gap:12px;min-height:92px;padding:8px 26px;
  border-radius:26px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 5px 0 #D8C9B4;transition:transform .15s}
#prompt-chip:active{transform:translateY(3px)}
#prompt-chip .glyph{width:78px;height:64px;display:flex;align-items:center;justify-content:center}
#prompt-chip .glyph svg{width:100%;height:100%}
/* r22 chip 迷你糖堆（diff/rev 题面双表征：count 颗并排小图，flex wrap） */
#prompt-chip .glyph .minis{display:flex;flex-wrap:wrap;gap:1px;justify-content:flex-end;
  align-content:center;max-width:78px}
#prompt-chip .glyph .minis svg{width:19px;height:15px}
#prompt-chip .arrow{width:40px;height:40px;flex:0 0 40px}
#prompt-chip .num{font-size:58px;font-weight:800;color:#4A3B2E;line-height:1;
  font-variant-numeric:tabular-nums;min-width:42px;text-align:center}

/* ---------- 场地：上=糖果托盘，下=动物碗排 + 小盘 ---------- */
#field{flex:1 1 auto;min-height:200px;width:100%;max-width:1120px;display:flex;flex-direction:column;
  justify-content:center;gap:8px;background:linear-gradient(180deg,#EDF4DC 0%,#E2ECCB 60%,#DCE7C2 100%);
  border:3px solid #C9D8A8;border-radius:26px;overflow:hidden;padding:10px 12px;
  box-shadow:inset 0 0 0 6px rgba(255,249,238,.5)}

/* 托盘：木色浅盘，糖果为独立按钮（≥64）；吞输入=容器 bump 微动效（可见回应）
   r22：cmp-diff/rev 题托盘区渲染数字钮排 .numkey（≥64）；cmp-who 题渲染问号大钮 */
#tray-wrap{flex:0 0 auto;display:flex;justify-content:center;padding:2px 4px}
#tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end;
  max-width:660px;padding:10px 16px 8px;border-radius:20px;
  background:linear-gradient(180deg,#F0E2C8,#EAD9BC);border:2.5px solid #D8C3A0;
  min-height:84px;min-width:220px;align-content:center}
#tray.bump{animation:tray-bump .22s ease}
@keyframes tray-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.candy{position:relative;width:64px;height:64px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;transition:transform .15s}
.candy svg{width:50px;height:42px;pointer-events:none}
.candy:active{transform:translateY(2px)}
/* r22 数字钮（cmp-diff 差几颗 / rev 一共几颗）：暖底圆角大数钮，≥64 触摸目标 */
.numkey{width:76px;height:76px;border-radius:18px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  font-size:42px;font-weight:800;color:#4A3B2E;font-variant-numeric:tabular-nums;
  transition:transform .15s}
.numkey:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
.numkey.picked{border-color:#E8975A;box-shadow:0 4px 0 #E8B98F}
.numkey.wiggle{animation:nk-wig .42s ease}
@keyframes nk-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.numkey.tease{animation:nk-tease .6s ease}
@keyframes nk-tease{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
/* r22 问号大钮（cmp-who 题托盘区占位，点=重读题面轻回应） */
.askbtn{width:84px;height:84px;border-radius:22px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .15s}
.askbtn svg{width:60px;height:60px;pointer-events:none}
.askbtn:active{transform:translateY(3px)}
.askbtn.tease{animation:nk-tease .6s ease}
/* 提起态（两击制第一击）：升高+高亮呼吸——「点糖提起」可视 */
.candy.sel{transform:translateY(-10px) scale(1.1);z-index:5;
  animation:candy-lift 1.1s ease-in-out infinite}
@keyframes candy-lift{0%,100%{filter:drop-shadow(0 6px 0 rgba(74,59,46,.28))}
  50%{filter:drop-shadow(0 10px 0 rgba(232,151,90,.55))}}
/* 救援答案级：目标糖高亮呼吸 */
.candy.hinted{animation:candy-hint 1.2s ease-in-out infinite}
@keyframes candy-hint{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95))}}

/* 动物碗排+小盘行：k2/k3/k4 三档碗宽（r22 k4=150：每碗最多 3 颗 2+1 堆叠；
   碗内糖 2-3/行×2 行堆叠随 flex-wrap 自然） */
#bench{flex:0 0 auto;display:flex;justify-content:center;align-items:flex-end;gap:12px}
#stations{display:flex;gap:12px;align-items:flex-end}
#stations.bump{animation:st-bump .22s ease}
@keyframes st-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.station{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 6px 6px;border-radius:18px;transition:transform .15s;min-width:140px;min-height:64px}
.station:active{transform:translateY(2px)}
.station .animal{width:88px;height:76px;pointer-events:none}
.station .animal svg{width:100%;height:100%}
/* r22 cmp 作答态：station 即作答钮（who 题），选错 wiggle、答对前不泄最多碗 */
#stations.ans .station{background:#FFF9EE;border:2.5px dashed #D8C3A0}
.station.wiggle{animation:st-wig .42s ease}
@keyframes st-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.station.picked{border-style:solid;border-color:#E8975A}
/* 表情组切换（SVG 内 .fx-eager/.fx-happy 二态；有糖=笑） */
.station .fx-happy{display:none}
.station.has .fx-eager{display:none}
.station.has .fx-happy{display:block}
/* 全相等=跳（容器动画，§0.53 表情三态） */
.station.jump{animation:st-jump .5s ease 2}
@keyframes st-jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
/* 两击制第二击邀请：糖已提起时全部碗轻跳邀请 */
.station.wants{animation:st-want 1.2s ease-in-out infinite}
@keyframes st-want{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* 救援方向级：未均碗 pulse */
.station.pulse{animation:st-pulse 1.1s ease-in-out 3}
@keyframes st-pulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 8px rgba(232,151,90,.4)}}
/* 深碗：宽杯身，碗内糖堆叠其中（k2 宽 234 / k3 宽 172 / r22 k4 宽 150） */
.station .bowl{position:relative;width:172px;height:148px;margin-top:-4px}
#stations.k2 .station .bowl{width:234px}
#stations.k4 .station .bowl{width:150px}
#stations.k4 .station .animal{width:76px;height:66px}    /* r22 四站并排动物略缩 */
#stations.k4{gap:8px}
.station .bowl-base{position:absolute;inset:0;border-radius:16px 16px 64px 64px;
  background:linear-gradient(180deg,#FFFDF7,#F6EAD4);border:3.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4}
.station .bowl-items{position:absolute;left:8px;right:8px;bottom:10px;display:flex;
  flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px;padding-top:8px}
.bcandy{width:64px;height:64px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;margin-top:-8px;transition:transform .15s}
.bcandy svg{width:46px;height:38px;pointer-events:none}
.bcandy:active{transform:translateY(2px)}
/* r22 cmp/rev 题碗内糖=静态展示（无取回通道），不可点 */
#stations.static .bcandy{pointer-events:none}
.bcandy.in{animation:bc-in .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes bc-in{0%{transform:scale(.3) translateY(-16px);opacity:.3}100%{transform:scale(1) translateY(0);opacity:1}}
/* 判对吃糖：碗内糖缩小飞散 */
.bcandy.eaten{animation:bc-eat .5s ease forwards}
@keyframes bc-eat{0%{transform:scale(1);opacity:1}100%{transform:scale(.1) translateY(-30px);opacity:0}}

/* 小盘（剩余题可见；引导态点亮脉冲）：盘内糖为静置展示（非按钮） */
#btn-plate{position:relative;display:none;flex-direction:column;align-items:center;
  justify-content:flex-end;width:118px;min-height:96px;padding:6px 4px 8px;border-radius:18px;
  opacity:.55;transition:transform .15s}
#btn-plate.show{display:flex}
#btn-plate.ready{opacity:1;animation:plate-ready 1.1s ease-in-out infinite}
@keyframes plate-ready{0%,100%{transform:translateY(0);filter:none}
  50%{transform:translateY(-6px);filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}
#btn-plate.bump{animation:plate-bump .22s ease}
@keyframes plate-bump{0%,100%{transform:scale(1)}45%{transform:scale(.93)}}
#btn-plate .plate-art{width:100px;height:48px;pointer-events:none}
#btn-plate .plate-items{display:flex;flex-wrap:wrap;justify-content:center;gap:0;
    width:104px;margin-bottom:-8px}
#btn-plate .plate-items svg{width:38px;height:32px}

/* 飞行糖克隆体（托盘→碗 / 碗→托盘 / 托盘→盘）：fixed 层，JS 定位起终点 */
.fly-candy{position:fixed;z-index:60;width:52px;height:44px;pointer-events:none;
  transition:transform .24s cubic-bezier(.3,.7,.5,1),opacity .24s}
.fly-candy svg{width:100%;height:100%}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，教学演示/帮/救援共用；照 batch21/22） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* r22 首次新作答视觉预告：动物站次第 bounce（承 r21 tease 范式，预告可点不指示答案） */
.station.tease{animation:st-jump .6s ease}

/* 竖屏（平板竖持）：题面/碗排同构收紧；r22 k4 四站/数字钮排适配 */
@media (orientation:portrait){
  #prompt-chip{gap:9px;min-height:84px;padding:6px 20px}
  #prompt-chip .num{font-size:48px}
  #prompt-chip .glyph{width:64px;height:54px}
  #tray{max-width:560px}
  #bench{gap:8px}
  #stations{gap:8px}
  #stations.k4 .station .bowl{width:138px}    /* r22 四站竖屏收紧（每碗 ≤3 颗 2+1 堆叠） */
  .numkey{width:70px;height:70px;font-size:38px}
}
</style>
</head>
<body>
<div id="game" aria-label="分糖果">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <button id="prompt-chip" aria-label="题面，点我再听一遍">
        <span class="glyph" id="chip-candy" aria-hidden="true"></span><span class="num" id="chip-n"></span>
        <span class="glyph arrow" id="chip-arrow" aria-hidden="true"></span>
        <span class="glyph" id="chip-animal" aria-hidden="true"></span><span class="num" id="chip-k"></span>
      </button>
    </div>
    <div id="field">
      <div id="tray-wrap"><div id="tray" aria-label="糖果托盘"></div></div>
      <div id="bench">
        <div id="stations" aria-label="小动物和它们的碗"></div>
        <button id="btn-plate" aria-label="小盘子">
          <span class="plate-items" aria-hidden="true"></span>
          <span class="plate-art" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
