<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>碰碰琴</title>
<style>
/* ================= 碰碰琴 piano（batch23）=================
   视觉按家族 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色；
   触摸目标：琴键 ≥64px（高≥150 大键）、模式/底栏按钮 ≥64（均 ≥64）；
   5-6 岁零文字依赖：键顶色点=色彩编码记忆通道（亮键+色点+音三通道同发）；
   音名不 TTS——音本身即反馈（SPEC §3）。
   r23（SPEC-R23-PIANO.md）：.sel=和弦作答选中态 / .tease=首次新作答预告波浪；
   作答面复用琴键（布局零新控件）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏：logo + 模式切换（大按钮）+ 进度点 ---------- */
#hud{flex:0 0 76px;display:flex;align-items:center;padding:6px 60px 0 12px;gap:10px}
#logo{width:42px;height:42px;border-radius:12px;background:#F2C9A0;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#mode-switch{display:flex;gap:0;flex:0 0 auto;border:3px solid #4A3B2E;border-radius:22px;
  overflow:hidden;box-shadow:0 4px 0 #D8C9B4}
#mode-switch button{width:88px;height:64px;display:flex;align-items:center;justify-content:center;
  gap:5px;background:#FFF9EE;color:#4A3B2E;font-size:15px;font-weight:700;transition:background .2s}
#mode-switch button.on{background:#E8975A;color:#FFF9EE}
#mode-switch button:active{transform:translateY(2px)}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto;justify-content:center}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：兔子 + 状态泡 + 曲子音位点 ---------- */
#stage{flex:0 0 auto;min-height:118px;display:flex;align-items:center;justify-content:center;
  gap:8px;padding:4px 12px;overflow:hidden}
#rabbit-box{position:relative;width:112px;height:104px;flex:0 0 auto}
#rabbit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#rabbit svg{width:96px;height:96px}
#rabbit.dance{animation:pi-dance 1.1s ease}
@keyframes pi-dance{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-8deg) translateY(-10px)}
  40%{transform:rotate(8deg)}60%{transform:rotate(-6deg) translateY(-8px)}80%{transform:rotate(6deg)}}
#bubble{flex:0 0 auto;width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .25s}
#bubble.pulse{animation:pi-bpulse .8s ease}
@keyframes pi-bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#seq-dots{display:flex;gap:10px;align-items:center;flex:0 0 auto;min-height:30px}
#seq-dots i{width:26px;height:26px;border-radius:50%;background:#EFE3CD;border:2.5px solid #D8C9B4;
  transition:all .25s;display:block}
#seq-dots i.hit{background:#8FBF7F;border-color:#4A3B2E;transform:scale(1.12)}
#seq-dots i.cur{border-color:#E8975A;animation:pi-sd 1.2s ease-in-out infinite}
@keyframes pi-sd{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* ---------- 琴键排：8 键 C 大调（白键造型；键顶色点=音的色彩编码） ---------- */
#keys{flex:1 1 auto;min-height:170px;display:flex;gap:8px;align-items:stretch;
  padding:10px 14px 14px;overflow:hidden}
#keys.bump{animation:pi-kbump .22s ease}
@keyframes pi-kbump{0%,100%{transform:scale(1)}45%{transform:scale(.985)}}
.key{position:relative;flex:1 1 0;min-width:64px;border:3.5px solid #4A3B2E;border-radius:10px 10px 16px 16px;
  background:linear-gradient(180deg,#FFFEFA 0%,#FFF6E3 100%);box-shadow:0 6px 0 #C9B694;
  transition:transform .12s,box-shadow .12s,background .25s;touch-action:none}
.key:active{transform:translateY(3px);box-shadow:0 3px 0 #C9B694}
.key .dot{position:absolute;left:50%;top:12px;width:26px;height:26px;border-radius:50%;
  transform:translateX(-50%);border:3px solid #4A3B2E;transition:transform .2s}
.key.active{transform:translateY(3px);box-shadow:0 2px 0 #C9B694}
.key.active .dot{transform:translateX(-50%) scale(1.3)}
.key.good{background:linear-gradient(180deg,#E4F3DB 0%,#C8E6B8 100%);box-shadow:0 2px 0 #8FBF7F,0 0 18px rgba(114,182,94,.55)}
.key.flash{animation:pi-flash .5s ease}
@keyframes pi-flash{0%,100%{background:linear-gradient(180deg,#FFFEFA 0%,#FFF6E3 100%)}
  40%,60%{background:#F2C9A0;box-shadow:0 0 16px rgba(232,151,90,.8)}}
.key.breathe{animation:pi-breathe 1.2s ease-in-out infinite}
@keyframes pi-breathe{0%,100%{box-shadow:0 6px 0 #C9B694;transform:translateY(0)}
  50%{box-shadow:0 6px 0 #C9B694,0 0 22px rgba(232,151,90,.85);transform:translateY(3px)}}
/* r23 和弦听辨：选中态（第 1 键已选待第 2 键——持续亮区别于 active 短亮） */
.key.sel{background:linear-gradient(180deg,#FCE8C8 0%,#F8D9A8 100%);
  box-shadow:0 4px 0 #C9A87C,0 0 20px rgba(232,151,90,.75)}
/* r23 首次新作答预告：8 键次第波浪一遍（播完即止不循环，不指示正确答案） */
.key.tease{animation:pi-tease .75s ease}
@keyframes pi-tease{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
.key:active{cursor:pointer}

/* 彩花粒子（fixed 层，JS 定位生成） */
.confetti{position:fixed;z-index:70;width:14px;height:14px;border-radius:50%;pointer-events:none;
  border:2.5px solid #4A3B2E;opacity:.95;transition:transform .62s cubic-bezier(.2,.7,.4,1),opacity .62s ease}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:pi-hop .45s ease 2}
@keyframes pi-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:76px;height:76px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:44px;height:44px}
#btn-replay.bounce{animation:pi-rb .45s ease}
@keyframes pi-rb{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，教学演示/帮共用；照 batch21/22） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：键排收紧仍保 ≥64 触摸目标；舞台紧凑 */
@media (orientation:portrait){
  #mode-switch button{width:76px;height:64px;font-size:13px}
  #stage{min-height:96px;gap:6px;padding:2px 8px}
  #rabbit-box{width:92px;height:86px}
  #rabbit svg{width:80px;height:80px}
  #bubble{width:60px;height:60px}
  #keys{gap:6px;padding:8px 10px 12px}
  .key .dot{width:20px;height:20px;top:10px}
  #seq-dots i{width:22px;height:22px}
}
</style>
</head>
<body>
<div id="game" aria-label="碰碰琴">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="mode-switch" role="tablist" aria-label="弹琴模式">
      <button id="btn-mode-free" aria-label="自由弹"></button>
      <button id="btn-mode-follow" aria-label="跟弹"></button>
    </div>
    <div id="step-dots" aria-label="本关曲子进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="rabbit-box" aria-hidden="true"><div id="rabbit"></div></div>
    <div id="bubble" aria-hidden="true"></div>
    <div id="seq-dots" aria-label="当前曲子音位"></div>
  </div>
  <div id="keys" aria-label="琴键"></div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再听兔子弹一遍"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

   dch1 两音 / dch2 三音（基线不动）/ dch3 五音（r23 长度上探）/ dch4 题型谱 D4_KINDS
   =[echo,rhythm,echo,chord,echo]——echo 长曲 6/5/5（qi0 首两音重复+qi4 尾 dosi 教学点保留）+
   qi1 rhythm 节奏听辨（4 互异音恰 1 长音）+ qi3 chord 和弦听辨（2 音间距≥2）。
   生成律：旋律步进 ±1..±3（ch1-3 无同音连弹——重复音是 ch4 的教学点）；ch4 echo 腿允许步 0；
   同章内 5 序列有序签名互异（禁同序列重复）。flat0 seq0 恒 [0,4] 教学定值不动。
   比对铁律（§0.54 防挫败定版）：弹对=该音位 +1；弹错=miss+1 且 pos 不进（序列不重头，当前音重试）。
   r23 作答面（§R4）：rhythm=点长音键作答；chord=选两键集合判定（pick/same 见 engTapKey）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pi_ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 单序列生成（音符存 0-7 索引，UI 层经 NOTE_IDS 还原音名）
   start 起音 0-6（不从 dosi 起）；步进池 dch4 含 0（重复音），其余不含；越界镜像折回 ---------- */
function genSeq(rnd, len, dch, forceRepeat, forceHigh) {
  const seq = [];
  let cur = pi_ri(rnd, 0, 6);
  seq.push(cur);
  for (let i = 1; i < len; i++) {
    if (forceRepeat && i === 1) { seq.push(cur); continue; }        // dch4 seq0：首两音重复（do-do-sol 型）
    if (forceHigh && i === len - 1) { seq.push(7); cur = 7; continue; } // dch4 seq4：尾音跨八度 dosi
    const pool = dch === 4 ? [-3, -2, -1, 0, 1, 2, 3] : [-3, -2, -1, 1, 2, 3];
    let nxt = cur + pool[pi_ri(rnd, 0, pool.length - 1)];
    if (nxt < 0 || nxt > 7) nxt = cur - (nxt - cur);                 // 镜像折回 [0,7]
    if (nxt < 0) nxt = 0;
    if (nxt > 7) nxt = 7;
    seq.push(nxt); cur = nxt;
  }
  if (forceHigh && seq.indexOf(7) < 0) seq[seq.length - 1] = 7;      // 兜底（理论不可达）
  return seq;
}

/* ---------- rhythm 题面生成（r23 §R3）：域 0-7 洗牌取前 RHY_LEN 个互异音 + 长音位 seeded
   互异性=「哪个音最长」答案唯一性的结构性保证（同名音不同时值会让作答歧义） ---------- */
function genRhythm(rnd) {
  const pool = [0, 1, 2, 3, 4, 5, 6, 7];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = pi_ri(rnd, 0, i);
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  return { seq: pool.slice(0, RHY_LEN), longIdx: pi_ri(rnd, 0, RHY_LEN - 1) };
}
/* ---------- chord 题面生成（r23 §R3）：a∈[0,5]，b=a+ri(2,3)（>7 折 a+2）——间距 ≥2
   （禁相邻音程：小/大二度同发人耳难分，非 6 岁可判域——SPEC-R23 §R1 选型理由） ---------- */
function genChord(rnd) {
  const a = pi_ri(rnd, 0, 5);
  let b = a + pi_ri(rnd, 2, 3);
  if (b > 7) b = a + 2;
  return [a, b];
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   flat0 序列0 恒 ['do','sol']（两音跨度大好记——教学演示题面稳定） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const seqs = [];
  const sigs = {};
  const mk = (s, extra) => Object.assign(
    { seq: s.slice(), pos: 0, solved: false, miss: 0, mode: 'echo' }, extra || {});
  let guard = 0;
  while (seqs.length < CH_LEN && guard++ < 600) {
    const qi = seqs.length;
    let kind = 'echo', s, extra;
    if (dch === 4) {
      kind = D4_KINDS[qi];                            // 题型谱：echo/rhythm/echo/chord/echo
      const eIdx = D4_KINDS.slice(0, qi + 1).filter(k => k === 'echo').length - 1;
      if (kind === 'rhythm') {
        const r = genRhythm(rnd);                     // 洗牌+longIdx 同 rnd 通道（确定性）
        s = r.seq; extra = { mode: 'rhythm', longIdx: r.longIdx };
      } else if (kind === 'chord') {
        s = genChord(rnd); extra = { mode: 'chord', sel: [] };
      } else {
        const forceRepeat = qi === 0;                 // qi0：重复音保证（承旧 seq0 教学点）
        const forceHigh = qi === CH_LEN - 1;          // qi4：跨八度保证（承旧 seq4 教学点）
        s = genSeq(rnd, D4_ECHO_LEN[eIdx], dch, forceRepeat, forceHigh);
        extra = { mode: 'echo' };
      }
    } else {
      s = (flat === 0 && qi === 0) ? [0, 4]           // 教学题面定值 do-sol（零改动）
        : genSeq(rnd, CHAPTERS[dch].len, dch, false, false);
      extra = { mode: 'echo' };
    }
    let sig = s.join(',');
    if (sigs[sig]) {                                  // 签名撞车：微扰再试（确定性）
      if (guard > 400) { s = s.map(v => (v + 1) % 8); sig = s.join(','); }
      if (sigs[sig]) continue;
    }
    sigs[sig] = 1;
    seqs.push(mk(s, extra));
  }
  /* 兜底：极端种子下不足 5 条互异（实际不可达）——顺序基型补齐（echo 长度按谱） */
  let bk = 0;
  while (seqs.length < CH_LEN) {
    const kind = dch === 4 ? D4_KINDS[seqs.length] : 'echo';
    const eIdx = dch === 4 ? D4_KINDS.slice(0, seqs.length + 1).filter(k => k === 'echo').length - 1 : 0;
    const len = dch === 4 ? (kind === 'rhythm' ? RHY_LEN : kind === 'chord' ? 2 : D4_ECHO_LEN[eIdx])
                          : CHAPTERS[dch].len;
    const s = [];
    for (let i = 0; i < len; i++) s.push((bk + i * 3) % 8);
    bk++;
    if (sigs[s.join(',')]) continue;
    sigs[s.join(',')] = 1;
    seqs.push(mk(s, kind === 'rhythm' ? { mode: 'rhythm', longIdx: 0 }
                                      : kind === 'chord' ? { mode: 'chord', sel: [] } : null));
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           seqs: seqs, step: 0, done: false, missTotal: 0 };
}

/* ---------- 弹键引擎（无 DOM）：engTapKey(L, 音名) —— 三 mode 分支（r23 §R5）
   echo（跟弹逐音比对，§0.54 定版）：
   'right'  弹对且序列未完（pos+1）
   'done'   弹对且序列完成（还有后续序列）
   'won'    末序列完成 = 通关
   'wrong'  弹错：miss+1，pos 不进（序列不重头，当前音重试）
   rhythm（节奏听辨作答，§R4）：
   点中长音键 → right/done/won；其他键 → wrong（miss+1 不换题可重选——探索≠错）
   chord（和弦听辨作答，选择集聚合）：
   'pick'   选中第 1 键（sel=[i]，不判不罚不占 busy）
   'same'   点已选键=取消该键（sel 移除，不判不罚）
   sel 满 2：集合与 seq 相等 → right/done/won（推进）；不等 → sel 清空+miss+1 'wrong'
   null     非法音名 / 关已结束（三 mode 通用） ---------- */
function engTapKey(L, name) {
  if (!L || L.done) return null;
  const q = L.seqs[L.step];
  if (!q || q.solved) return null;
  const idx = NOTE_IDS.indexOf(name);
  if (idx < 0) return null;
  const advance = () => {
    q.solved = true;
    L.step++;
    if (L.step >= L.seqs.length) { L.done = true; return 'won'; }
    return 'done';
  };
  if (q.mode === 'rhythm') {
    if (idx === q.seq[q.longIdx]) return advance();
    q.miss++; L.missTotal++;
    return 'wrong';
  }
  if (q.mode === 'chord') {
    const si = q.sel.indexOf(idx);
    if (si >= 0) { q.sel.splice(si, 1); return 'same'; }   // 取消选择（不判不罚）
    q.sel.push(idx);
    if (q.sel.length < 2) return 'pick';
    const hit = q.sel.indexOf(q.seq[0]) >= 0 && q.sel.indexOf(q.seq[1]) >= 0;
    if (hit) return advance();                           // 集合相等（互异 ⇒ 无序对）
    q.sel.length = 0;                                      // 清空可重选
    q.miss++; L.missTotal++;
    return 'wrong';
  }
  /* echo：原样逐音比对（§0.54 定版） */
  if (q.seq[q.pos] === idx) {
    q.pos++;
    if (q.pos >= q.seq.length) return advance();
    return 'right';
  }
  q.miss++;
  L.missTotal++;
  return 'wrong';
}
const engWon = L => !!L && L.done;

/* ---------- 星级（SPEC §3 定版 + r23 §R4 口径论证）：弹错次数口径 0=3★ / 1-2=2★ / ≥3=1★。
   永不 0 星。rhythm/chord 的探索性错选与 echo 弹错同档计 1 miss——单次错误成本等价，分档不动 ---------- */
const engStars = L => {
  const m = !L ? 0 : (L.missTotal || 0);
  return m === 0 ? 3 : (m <= 2 ? 2 : 1);
};

/* ---------- 结构校验（verify 用，返回失败原因或 null）
   dch1-3：长度按章（dch3=5）/ 域 0-7 / 无同音连弹 / 初始 pos0 未解。
   dch4（r23 §R5）：mode↔qi 按题型谱 / rhythm=len4+互异+longIdx 域 / chord=len2+互异+
   间距≥2+sel 空 / echo=len 按谱+qi0 首两音重复+qi4 尾 7。 ---------- */
function structWhy(q, dch, flat, qi) {
  if (!q || !Array.isArray(q.seq) || !q.seq.length) return 'shape';
  const len = q.seq.length;
  for (let i = 0; i < len; i++) if (!(q.seq[i] >= 0 && q.seq[i] <= 7)) return 'range@' + i;
  if (dch === 4) {
    const kind = D4_KINDS[qi];
    if ((q.mode || 'echo') !== kind) return 'mode@' + qi;
    if (kind === 'rhythm') {
      if (len !== RHY_LEN) return 'len:' + len + '!=' + RHY_LEN;
      if (new Set(q.seq).size !== RHY_LEN) return 'rhydup';        // 互异（答案唯一性）
      if (!(q.longIdx >= 0 && q.longIdx < RHY_LEN)) return 'longidx';
    } else if (kind === 'chord') {
      if (len !== 2) return 'len:' + len + '!=2';
      if (q.seq[0] === q.seq[1]) return 'chodup';
      if (Math.abs(q.seq[1] - q.seq[0]) < 2) return 'chogap';      // 间距 ≥2（禁相邻音程）
      if (!Array.isArray(q.sel) || q.sel.length !== 0) return 'init';
    } else {
      const eIdx = D4_KINDS.slice(0, qi + 1).filter(k => k === 'echo').length - 1;
      const want = D4_ECHO_LEN[eIdx];
      if (len !== want) return 'len:' + len + '!=' + want;
      if (qi === 0 && q.seq[1] !== q.seq[0]) return 'norepeat0';
      if (qi === CH_LEN - 1 && q.seq[len - 1] !== 7) return 'nohi4';
    }
  } else {
    const want = CHAPTERS[dch].len;
    if (len !== want) return 'len:' + len + '!=' + want;
    for (let i = 1; i < len; i++) if (q.seq[i] === q.seq[i - 1]) return 'repeat:' + dch;
  }
  if (q.pos !== 0 || q.solved || q.miss !== 0) return 'init';
  return null;
}
/* ================= piano 主逻辑（琴键渲染 / 跟弹相位机 / 自由弹 / 教学 / 推进 / 救援）
   跟弹流：小兔子逐音弹（琴键亮+音，音间 620ms）→「你来弹一弹」→孩子逐音比对：
   弹对=键绿亮+彩花；弹错=正确键轻闪 0.5s+重听该音+miss+1 且 pos 不进（序列不重头，§0.54 定版）；
   序列完成=小兔子跳舞；关完成=celebrate+写档星级。自由弹=零判定零失败（不进关卡不写档星级）。
   r23（SPEC-R23-PIANO.md §R4/§R5）：dch4 三形态——echo 长曲（原逐音复现）/ rhythm 节奏听辨
   （兔子弹短长音曲→问「哪个音最长」点键作答）/ chord 和弦听辨（两键齐发→选两键集合判定：
   pick=选中第 1 键（.sel 亮）/same=取消/wrong=集合错清空可重选）。作答面=琴键（无新控件）；
   题面/答错语音不受 flat<3 门（听不到题面=不可收，§0.5 同理）；首次进 dch4 琴键 tease 预告。
   验收钩子：window.PI = { get currentLevel, get quiz, tapKey(name), mode(), setMode(m), start(flat),
                          async autoSolve(), get tutorial, get phase } */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);

/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */

/* 救援/教学/正误核心反馈不受 flat 门限制（§0.5：不识字孩子静置零救援=不可收） */
const sayR = (v) => { if (v) KIDS.voice.play(v.key, v.text); };

/* 八音盒音色：家族通道 KIDS.audio.note（sine+2.9 泛音+快 attack+指数衰减）+ 高八度微光
   r23：long 参数=节奏题长音（dur 0.45→1.9 约 4 倍可听时长差——note 的 dur 直接控制
   exponentialRamp 衰减全程，时值听辨域可靠，SPEC-R23 §R4）；echo 题音长 1.05 原样不动 */
function boxNote(name, long, short) {
  if (VERIFY) return;
  const f = FREQ[name];
  if (!f) return;
  /* 三态 dur：long=1.9（rhythm 长音）/ short=0.45（rhythm 短音，SPEC-R23 §R4 对比 4.2x——
     试玩P2-1：原实现短音复用 echo 默认 1.05 系偏差）/ 缺省=1.05（echo 全系原样不动） */
  const dur = long ? 1.9 : short ? 0.45 : 1.05;
  KIDS.audio.note(f, dur, 0, 0.85);
  KIDS.audio.note(f * 2, long ? 0.5 : 0.4, 0.012, 0.2);
}
/* r23 和弦演示：两音同时发（每音 vol 0.6 防 linear 叠加削波；泛音同步衰减） */
function boxChord(n1, n2) {
  if (VERIFY) return;
  const f1 = FREQ[n1], f2 = FREQ[n2];
  if (!f1 || !f2) return;
  KIDS.audio.note(f1, 1.5, 0, 0.6);
  KIDS.audio.note(f2, 1.5, 0, 0.6);
  KIDS.audio.note(f1 * 2, 0.5, 0.012, 0.12);
  KIDS.audio.note(f2 * 2, 0.5, 0.012, 0.12);
}
function keyLight(name, hold) {                 // 按下/演示亮键（DOM 断言通道 .active）
  const el = keyEl(name);                       // hold=长音时值可视化（亮多久=时值表征）
  if (!el) return;
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), hold ? 1500 * SPEED + 400 : 280 * SPEED + 260);
}
function keyGood(name) {                        // 弹对：绿亮（.good）

}
function keyFlash(name) {                       // 弹错/救援方向级：该键轻闪 0.5s（.flash）

/* r23 首次新作答视觉预告（每存档一次 sv.piano.ansSeen）：8 键次第波浪一遍——

function confettiBurst(name) {                  // 彩花粒子（弹对/自由弹；verify 页跳过）
  if (VERIFY) return;
  const el = keyEl(name);
  if (!el) return;

    c.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];

    c.style.top = Math.round(r.top + r.height * 0.3 - 7) + 'px';

/* ================= 渲染 ================= */
function renderModeBtns() {
  btnFree.classList.toggle('on', state.mode === 'free');
  btnFollow.classList.toggle('on', state.mode === 'follow');
}
function renderStep() {                         // HUD 本关 5 序列进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  if (!cur) return;
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  if (!cur) return;
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
function renderSeqDots(listenIdx) {             // 当前序列音位点：弹对填充绿 / 兔子弹到哪颗脉冲
  seqDotsEl.innerHTML = '';                     // r23：chord=两颗齐脉冲；作答题 play 期无音位 cur
  if (!cur || state.mode !== 'follow') return;
  const q = cur.seqs[Math.min(cur.step, cur.seqs.length - 1)];
  if (!q) return;
  for (let i = 0; i < q.seq.length; i++) {
    const d = document.createElement('i');
    if (state.phase === 'listen')
      d.className = (listenIdx != null && (i === listenIdx - 1 ||
        (q.mode === 'chord' && listenIdx === 2))) ? 'cur' : '';
    else if (q.mode !== 'echo') d.className = q.solved ? 'hit' : '';
    else d.className = q.solved ? 'hit' : (i < q.pos ? 'hit' : (i === q.pos && !cur.done ? 'cur' : ''));
    seqDotsEl.appendChild(d);
  }
}
function danceRabbit() {
  replayAnim(rabbitEl, 'dance');
  replayAnim(rabbitBtn, 'hop');
}

/* ================= 幽灵手指（教学"看/帮"共用） ================= */
const ghost = {
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAtKey(name) {
  if (VERIFY || !name) return;
  const el = keyEl(name);
  if (!el) return;
  const r = el.getBoundingClientRect();
  ghostEl.style.left = Math.round(r.left + r.width / 2) + 'px';
  ghostEl.style.top = Math.round(r.top + r.height * 0.45) + 'px';
  ghost.show();
  setTimeout(() => ghost.press(), 700 * SPEED);
}
function pointHelpNext() {                      // 教学"帮"：指向当前应弹键（方向级提示）
  if (!cur || state.mode !== 'follow') return;
  const q = cur.seqs[cur.step];
  if (!q || q.solved) return;
  pointGhostAtKey(NOTE_IDS[q.seq[q.pos]]);
}

/* ================= 跟弹相位机：runSequence（听 → 你来弹/作答）
   令牌+身份双守卫：startLevel/切模式/教学会使在途 listen 失效（防旧续体推进新关）。
   r23 mode 分支（SPEC-R23 §R4）：echo=原样逐音 620ms；rhythm=短/长音差异化时长
   （长音 dur 1.9s+键亮 ~1.9s=时值可视化）；chord=两键齐亮齐发。
   play 相位末语音：echo=「你来弹一弹」（flat<3）；作答题=题面问句（不受 flat 门）。 ================= */
function cancelRuns() { runId++; }
async function runSequence() {
  const run = cur, my = ++runId;
  if (!run || run.done) return;
  state.phase = 'listen';
  state.locked = true;
  ghost.hide(); clearBreathe(); clearSel();
  const q0 = run.seqs[run.step];                // 重听=replay 重发：chord 引擎侧 sel 同步清（重选）
  if (q0 && q0.mode === 'chord' && q0.sel) q0.sel.length = 0;
  renderStep(); setBubble('listen'); renderSeqDots(0);
  const q = run.seqs[run.step];
  if (!q) return;
  await wait(650 * SPEED);
  if (q.mode === 'chord') {                     // 和弦：两键同时亮+两音同时发
    if (runId !== my || cur !== run) return;
    const n1 = NOTE_IDS[q.seq[0]], n2 = NOTE_IDS[q.seq[1]];
    keyLight(n1, true); keyLight(n2, true);
    boxChord(n1, n2);
    renderSeqDots(2);
    await wait(1500 * SPEED);
  } else {
    for (let i = 0; i < q.seq.length; i++) {
      if (runId !== my || cur !== run) return;  // 作废：关已切/模式已切
      const nm = NOTE_IDS[q.seq[i]];
      const long = q.mode === 'rhythm' && i === q.longIdx;
      keyLight(nm, long); boxNote(nm, long, q.mode === 'rhythm' && !long);    // 长音=双通道拉长；短音=0.45（时值表征）
      renderSeqDots(i + 1);
      await wait((long ? 1900 : 620) * SPEED);
    }
  }
  if (runId !== my || cur !== run) return;
  state.phase = 'play';
  state.locked = false;
  lastAct = Date.now(); rescueDirDone = false; rescueAnsDone = false;
  setBubble('play'); renderSeqDots();
  if (q.mode === 'rhythm') sayR(VOICE.rhyQ);    /* 哪个音弹得最长呀（题面，不受 flat 门） */
  else if (q.mode === 'chord') sayR(VOICE.choQ);/* 兔子弹了哪两个音呀（题面，不受 flat 门） */
  else sayP(VOICE.turn);                        /* 你来弹一弹（flat<3） */
  if (state.tut === 'help') setTimeout(pointHelpNext, 500 * SPEED);
}

/* ================= 弹键主路径（真实点击 / PI.tapKey / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（琴键容器 bump 微动效——b21 feed 定版）；
   busy=比对反馈占位锁（错音重听窗/right 绿亮窗，同步置位→紧邻弹键必被拦，§0.47） ================= */
async function uiTapKey(name, demo) {
  if (!cur || state.won || state.mode !== 'follow') {
    if (state.mode === 'follow') { sfx('pop'); replayAnim(keysEl, 'bump'); }
    return false;
  }
  if ((state.busy && !demo) || (state.locked && !demo) || (state.demo && !demo) ||
      (state.phase !== 'play' && !demo)) {      // 听音相位/演示期/演出窗=吞输入
    sfx('pop'); replayAnim(keysEl, 'bump');
    return false;
  }
  const run = cur;
  const q = cur.seqs[cur.step];
  const r0 = engTapKey(cur, name);
  if (r0 === null) { sfx('pop'); replayAnim(keysEl, 'bump'); return false; }   // 非法音名
  keyLight(name); boxNote(name);                // 先听自己的音（正误都出声——音本身即反馈）
  lastAct = Date.now(); rescueDirDone = false; rescueAnsDone = false; clearBreathe();
  if (state.tut === 'help' && !demo) {          // 教学"独"：首次真弹 → 放手
    state.tut = 'solo';
    ghost.hide();
    danceRabbit();
  }
  if (r0 === 'pick') {                          // r23 chord 第 1 键选中：不判不罚不占 busy（连选）
    keySel(name, true);
    return 'pick';
  }
  if (r0 === 'same') {                          // r23 chord 取消选择：不判不罚
    keySel(name, false);
    return 'same';
  }
  state.busy = true;

  if (r0 === 'wrong') {                         // 弹错/选错：miss+1 不进（不重头/不换题可重试重选）
    await wait(200 * SPEED);
    if (cur === run) {
      if (q.mode === 'echo') {                  // echo：正确键轻闪 0.5s+重听该音（原样）
        const want = NOTE_IDS[q.seq[q.pos]];
        keyFlash(want); boxNote(want);
        KIDS.voice.play(VOICE.wrong.key, VOICE.wrong.text);   /* 再听一次这个音（核心反馈不受 flat 门） */
      } else {                                  // r23 作答：选错键闪+鼓励语；chord sel 引擎已清（UI 同步）
        keyFlash(name);
        clearSel();
        KIDS.voice.play(VOICE.ansWrong.key, VOICE.ansWrong.text);   /* 再听一听，再选一次吧 */
      }
    }
    await wait(800 * SPEED);                   /* 审查m1：错音防重入 200+800=1000ms（家族定案） */
    state.busy = false;
    return 'wrong';
  }

  if (q.mode === 'chord') clearSel();           /* 审查M1(r23)：.sel 与 .good 同特异性且源码序在后——
                                                   不先清则答对反馈窗 700ms 内两键显橙（sel）不显绿（good） */
  keyGood(name);
  confettiBurst(name);
  if (q.mode === 'chord') {                     // r23 chord 答对：另一键同报 good（集合对=双键对）
    const other = q.sel && q.sel[0] === NOTE_IDS.indexOf(name) ? q.sel[1] : q.sel[0];
    if (other != null) { keyGood(NOTE_IDS[other]); confettiBurst(NOTE_IDS[other]); }
  }
  await wait(200 * SPEED);                     /* 审查m3：right 路径缩短防连弹吞 */
  if (r0 === 'right') { state.busy = false; return 'right'; }

  if (r0 === 'done') {                          // 序列完成：兔子跳舞 → 下一序列（演示不自动续）
    danceRabbit();                              // r23：答对反馈=视觉（good+彩花+跳舞），语音仍 flat<3 密度门
    sayP(VOICE.right);
    await wait(700 * SPEED);                  /* 审查M2 附带：+140 补 pia_right 尾音 */
    state.busy = false;
    if (cur !== run) return 'done';
    if (!demo) runSequence();
    return 'done';
  }
  /* won：整关通关 */
  danceRabbit();
  state.busy = false;
  winFlow();
  return 'won';
}

/* ================= 自由弹（零判定零失败——纯玩具层，不进关卡不写档星级） ================= */
function freeTap(name) {
  if (NOTE_IDS.indexOf(name) < 0) { sfx('pop'); replayAnim(keysEl, 'bump'); return false; }
  keyLight(name); boxNote(name);
  confettiBurst(name);
  freeTapN++;
  if (freeTapN % 3 === 1) danceRabbit();        // 偶发兔子跳
  return 'free';
}

/* ================= 模式切换（顶部大按钮；教学演示期拒绝） ================= */
function setMode(m) {
  if (state.mode === m) return state.mode;
  if (state.demo || state.tut === 'watch') {    // 教学"看"演示期不打断
    sfx('pop'); replayAnim(keysEl, 'bump');
    return state.mode;
  }
  state.mode = m;
  renderModeBtns();
  ghost.hide(); clearBreathe(); clearSel();
  if (m === 'free') {
    cancelRuns();
    state.phase = 'free'; state.locked = false; state.busy = false; state.won = false;
    setBubble('free'); renderSeqDots();
    danceRabbit();
  } else {
    startLevel(cur ? cur.flat : 0);             // 跟弹：确定性重发当前关（兔子弹→你来弹）
  }
  return state.mode;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true; state.locked = true; state.phase = 'won';
  ghost.hide(); clearBreathe();
  renderStep(); renderSeqDots();
  const stars = engStars(cur);
  sfx('win');
  sayR(VOICE.right);                            /* 弹对啦，真好听 */
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) });   /* 审查 m4（2026-09-13）：b23 修复轮漏网，与 weather M2 同型统一 */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  cancelRuns();
  ghost.hide(); clearBreathe(); clearSel();
  state.mode = 'follow'; renderModeBtns();
  cur = genLevel(flat);
  state = { mode: 'follow', phase: 'listen', locked: false, busy: false, won: false, demo: false, tut: 'none' };
  helpRedemo = false; rescueDirDone = false; rescueAnsDone = false;
  lastAct = Date.now();
  renderStep(); renderDots(); setBubble('listen'); renderSeqDots(0);
  if (VERIFY) {                                  // verify 页：相位机照跑（提速），无教学无存档
    if (cur.dch === 4) teaseKeys();              // dch4 每次重触发（⑯断言口径，不写档）
    runSequence(); return;
  }
  const sv = KIDS._save();
  if (cur.dch === 4 && !(sv.piano && sv.piano.ansSeen)) {   // r23 首次新作答预告（一次性写档）
    sv.piano = sv.piano || {};
    sv.piano.ansSeen = true;
    KIDS.store.persist();
    teaseKeys();
  }
  const freshTut = flat === 0 && !sv.levels['1-0'] && !(sv.piano && sv.piano.tutSeen);
  if (freshTut) { tutorialWatch(); return; }
  sayP(VOICE.hint);                              /* 先听兔子弹哦（flat<3） */
  runSequence();
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=兔子弹 do-sol 两音 → 幽灵手指跟着弹两音（演示跟弹全过程）→ __piDemoR='right'；
   帮=指向应弹键；独=首次真弹放手（watch 全程 ≤16s） ================= */
async function tutorialWatch() {
  cancelRuns();
  state.demo = true; state.locked = true; state.tut = 'watch';
  setBubble('listen');
  sayR(VOICE.watch);                             /* 看！兔子弹什么你弹什么 */
  await wait(650 * SPEED);
  const run = cur;
  const q0 = run.seqs[0];                        // flat0 序列0 恒 do-sol（两音）
  for (let i = 0; i < q0.seq.length; i++) {      // 兔子弹
    const nm = NOTE_IDS[q0.seq[i]];
    keyLight(nm); boxNote(nm);
    renderSeqDots(i + 1);
    await wait(620 * SPEED);
    if (cur !== run) { state.demo = false; return; }
  }
  state.phase = 'play';                          // 进入"你来弹"（demo 通道豁免锁）
  setBubble('play'); renderSeqDots();
  await wait(420 * SPEED);
  let demoR = null;
  const q = run.seqs[run.step];
  for (let k = 0; k < q.seq.length; k++) {       // 幽灵手指逐音复现
    pointGhostAtKey(NOTE_IDS[q.seq[q.pos]]);
    await wait(760 * SPEED);
    ghost.press();
    await wait(280 * SPEED);
    const r = await uiTapKey(NOTE_IDS[q.seq[q.pos]], true);
    if (r && !demoR) demoR = r;                  // 首音弹对='right'（gate 断言口径）
    await wait(460 * SPEED);
    if (cur !== run) { state.demo = false; ghost.hide(); return; }
  }
  KIDS.voice.play(VOICE.like.key, VOICE.like.text);   // 演示收束语（T46 阶段2 clip 化）
  window.__piDemoR = demoR;                      // 演示生效证据（§0.27，gate 断言 'right'）
  await wait(500 * SPEED);
  const sv = KIDS._save();
  sv.piano = sv.piano || {};
  sv.piano.tutSeen = true;
  KIDS.store.persist();
  /* 立即重发同关（确定性关卡，题面一致），"你来弹一弹"在重发后的题面上说 */
  ghost.hide();
  startLevel(0);
  state.tut = 'help';
  /* 「你来弹一弹」由重发后的 runSequence 在听音结束时说（单一时点，不重复播） */
}

/* ================= 救援钟（跟弹 listen→play 后静置；verify 页由 verify 直驱函数测）
   14s 方向级=重听当前音（应弹键闪+音）/ 30s 答案级=应弹键 breathe 循环（动作即清）
   r23 适配（SPEC-R23 §R4）：作答题方向级=重弹全曲（听辨题材料重听=方向提示不泄答案）；
   答案级=rhythm 长音键 / chord 两答案键齐 breathe（答案级可指真值，承家族先例） ================= */
function rescueDir() {
  if (!cur || cur.done) return false;
  const q = cur.seqs[cur.step];
  if (!q || q.solved) return false;
  if (q.mode === 'rhythm' || q.mode === 'chord') {
    sayR(VOICE.hint);                           /* 先听兔子弹哦 + 重弹全曲 */
    /* 试玩P1-1：救援重弹须保留空闲计时与救援旗标——runSequence 完成段会重置
       lastAct/两旗标，若不恢复则 30s 答案级阈值每 14s 被清零永不可达（退化单级）。
       恢复语义：idle 从重弹触发时刻连续积累（重弹 listen 期后 resume）→ 30s breathe
       可达；rescueDirDone 保持 true 不再每 14s 重弹同一材料 */
    const keepAct = lastAct, keepD = rescueDirDone, keepA = rescueAnsDone, run = cur;
    /* 挂账①（r23 收尾）：续体身份守卫——救援 listen 期切关/切模式后 cur 已是新关，
       作废续体若照常回写 keepD 会吞新关首个 14s 救援一周期（旧值不得覆盖新关初始态） */
    runSequence().then(() => {
      if (cur !== run) return;
      lastAct = keepAct; rescueDirDone = keepD; rescueAnsDone = keepA;
    });
    return true;
  }
  const nm = NOTE_IDS[q.seq[q.pos]];
  keyFlash(nm); boxNote(nm);
  sayR(VOICE.hint);
  return true;
}
function rescueAns() {
  if (!cur || cur.done) return false;
  const q = cur.seqs[cur.step];
  if (!q || q.solved) return false;
  const names = q.mode === 'rhythm' ? [NOTE_IDS[q.seq[q.longIdx]]]
    : q.mode === 'chord' ? [NOTE_IDS[q.seq[0]], NOTE_IDS[q.seq[1]]]
    : [NOTE_IDS[q.seq[q.pos]]];
  const els = names.map(keyEl).filter(Boolean);
  if (!els.length) return false;
  clearBreathe();
  els.forEach(el => el.classList.add('breathe'));
  return true;
}
setInterval(() => {
  if (VERIFY || !cur || state.won || state.mode !== 'follow' || state.phase !== 'play' ||
      state.locked || state.demo) return;
  const idle = Date.now() - lastAct;
  if (idle > 30000 && !rescueAnsDone) { rescueAnsDone = true; rescueAns(); return; }
  if (idle > 14000 && !rescueDirDone) { rescueDirDone = true; rescueDir(); return; }
  if (idle > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {
    helpRedemo = true;
    pointHelpNext();
  }
}, 1000);

/* ================= 底栏与输入 ================= */
function hopRabbit() { replayAnim(rabbitBtn, 'hop'); }
rabbitBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  KIDS.audio.unlock();
  if (VERIFY || state.locked || state.demo) return;   // 教学/演出期点兔子不打断
  lastAct = Date.now();
  hopRabbit();
  if (state.mode === 'follow' && cur && !state.won && state.phase === 'play') sayR(VOICE.hint);
  else if (state.mode === 'free') sayR(null);
});
replayBtn.addEventListener('pointerdown', e => {      // 再听兔子弹一遍（当前序列重听——记忆类核心救援入口）
  e.preventDefault();
  KIDS.audio.unlock();
  if (VERIFY || state.mode !== 'follow' || !cur || state.won || state.demo || state.busy) return;
  lastAct = Date.now();
  replayBtn.classList.remove('bounce'); void replayBtn.offsetWidth; replayBtn.classList.add('bounce');
  runSequence();
});
keysEl.addEventListener('pointerdown', e => {
  const k = e.target.closest('.key');
  if (!k) return;
  e.preventDefault();
  KIDS.audio.unlock();
  if (state.mode === 'free') freeTap(k.dataset.name);
  else uiTapKey(k.dataset.name);
});
btnFree.addEventListener('pointerdown', e => {
  e.preventDefault(); KIDS.audio.unlock(); sfx('click');
  setMode('free');
});
btnFollow.addEventListener('pointerdown', e => {
  e.preventDefault(); KIDS.audio.unlock(); sfx('click');
  setMode('follow');
});

/* ================= 启动（verify 分支由 game-verify.js 接管） ================= */
buildStatic();
renderModeBtns();
if (!VERIFY) {
  KIDS.init({ game: 'piano', title: '碰碰琴' });
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  let first = 0;
  for (let i = 0; i < lim; i++) { if (!sv.levels[keys[i]]) { first = i; break; } }
  if (lim > 0 && KIDS.calendar.dayDone(keys)) {  // 今日新关已玩完：收尾画面（可关闭继续重玩）

window.PI = {
  start(flat) {
    cancelRuns();
    state.mode = 'follow'; renderModeBtns();
    startLevel(flat);
  },
  get currentLevel() {
    if (!cur) return null;
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.seqs.length,
             step: cur.step, done: cur.done, won: state.won,
             miss: cur.missTotal || 0, stars: engStars(cur) };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.seqs[cur.step];
    if (!q) return null;
    return { seq: q.seq.map(i => NOTE_IDS[i]),        /* 音名序列 */
             pos: q.pos,                               /* 当前比对位（作答题恒 0） */
             step: cur.step,
             miss: q.miss,                             /* 本序列弹错/选错数 */
             mode: q.mode || 'echo',                   /* r23 题型（echo/rhythm/chord） */
             longIdx: q.mode === 'rhythm' ? q.longIdx : undefined,   /* 长音位（rhythm） */
             sel: q.mode === 'chord' ? q.sel.slice() : undefined };  /* 已选键索引拷贝（chord） */
  },
  tapKey(name) {
    if (state.mode === 'free') return freeTap(name);
    return uiTapKey(name);
  },
  mode() { return state.mode; },
  setMode(m) { return setMode(m); },
  async autoSolve() {                    // UI 路径自动弹完当前关（含听音相位等待；r23 按 mode 分支）
    let taps = 0, guard = 0;             // echo=逐音 / rhythm=点长音键 / chord=点两答案键（pick+判定）
    while (cur && !cur.done && guard++ < 900) {
      if (state.mode !== 'follow') break;
      if (state.phase !== 'play' || state.locked || state.busy || state.won) { await wait(60); continue; }
      const q = cur.seqs[cur.step];
      if (!q) break;
      let nm;
      if (q.mode === 'rhythm') nm = NOTE_IDS[q.seq[q.longIdx]];
      else if (q.mode === 'chord') {
        if (!q.sel || !q.sel.length) nm = NOTE_IDS[q.seq[0]];
        else nm = NOTE_IDS[q.sel.indexOf(q.seq[1]) >= 0 ? q.seq[0] : q.seq[1]];
      }
      else nm = NOTE_IDS[q.seq[q.pos]];
      const r = await uiTapKey(nm);
      if (r !== false && r != null) taps++;
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
  get tutorial() { return state.tut; },
  get phase() { return state.phase; }
};

  if (clipsOk) npass++;
  units.clips = { ok: clipsOk, n: keysC.length, keys: keysC };

  /* ---- ⑬ 章末 hint=预告下一章 + GEN_HINTS[k]↔dch=k+1（C7 型关键词断言） ---- */
  total++;
  /* 语义：flat4=ch1 末关 → CHAPTERS[1].hint（挂在 ch1 上、预告 ch2），依次类推；
     生成关 flat24=ch5(dch1) 末 → 下一章 ch6=dch2 → GEN_HINTS[1]（k↔dch=k+1，禁右移） */
  const hintMapOk = nextHint(4) === CHAPTERS[1].hint && nextHint(9) === CHAPTERS[2].hint &&
                    nextHint(14) === CHAPTERS[3].hint && nextHint(19) === CHAPTERS[4].hint &&
                    nextHint(24) === GEN_HINTS[1] && nextHint(34) === GEN_HINTS[3];
  /* r23 新文案：dch3=五个音；dch4=重复+小do+长音+双音（C7 型关键词断言） */
  const kwOk = GEN_HINTS[0].indexOf('两个音') >= 0 && GEN_HINTS[1].indexOf('三个音') >= 0 &&
               GEN_HINTS[2].indexOf('五个音') >= 0 && GEN_HINTS[3].indexOf('重复') >= 0 &&
               GEN_HINTS[3].indexOf('小do') >= 0 && GEN_HINTS[3].indexOf('长音') >= 0 &&
               GEN_HINTS[3].indexOf('双音') >= 0 &&
               CHAPTERS[1].hint.indexOf('三个音') >= 0 && CHAPTERS[2].hint.indexOf('五个音') >= 0 &&
               CHAPTERS[3].hint.indexOf('重复') >= 0 && CHAPTERS[3].hint.indexOf('双音') >= 0;
  const hintOk = hintMapOk && kwOk;
  if (hintOk) npass++;
  units.hint = { ok: hintOk, map: hintMapOk, kw: kwOk,
                 n4: nextHint(4), n24: nextHint(24), n34: nextHint(34) };

  /* ---- ⑭ verify 提速 + verify 页零写档（r23 适配：MUTE 种子档在场时=首末快照相等，
     语义=verify 流程零写档；无前置（主线直跑）时 null===null 同过） ---- */
  total++;
  let lsPiano = null;
  try { lsPiano = localStorage.getItem('kidsgame_piano'); } catch (e) {}
  const speedOk = SPEED === 0.12 && lsPiano === lsBase;
  if (speedOk) npass++;
  units.speed = { ok: speedOk, SPEED: SPEED, lsUnchanged: lsPiano === lsBase };

  /* ---- ⑮ r23 作答语义（flat15=dch4 真实 UI：echo 长曲+rhythm+chord） ---- */
  total++;
  PI.start(15);
  await until(() => PI.phase === 'play' && !state.locked);
  const L15 = genLevel(15);                      // 独立实例推导答案（确定性=题面一致）
  const driveEcho = async (q, final) => {        // echo 腿逐音驱动
    for (let s = 0; s < q.seq.length; s++) {
      const exp = s === q.seq.length - 1 ? (final ? 'won' : 'done') : 'right';
      if (await PI.tapKey(NOTE_IDS[q.seq[s]]) !== exp) return false;
    }
    return true;
  };
  const e0 = await driveEcho(L15.seqs[0], false);      // qi0 echo6 → step1
  await until(() => PI.phase === 'play' && !state.locked);   // done→runSequence listen 等待
  const rq15 = L15.seqs[1];                            // qi1 rhythm
  const ansName = NOTE_IDS[rq15.seq[rq15.longIdx]];
  const rhyWrongName = NOTE_IDS[(rq15.seq[rq15.longIdx] + 3) % 8];   // 恒异于答案
  /* 挂账⑤：作答题救援两级直调（SPEC §R4 救援分层推导——14s 方向级=重弹全曲 /
     30s 答案级=正确键 breathe；verify 直驱函数测不等真实钟摆阈值，⑩ 已测 echo 侧）。
     直调无 miss/step 副作用，后续 miss 断言（k1/k5/k7）不受污染 */
  const rDir = rescueDir() === true && PI.phase === 'listen' && state.locked;
  await until(() => PI.phase === 'play' && !state.locked);   // 重弹全曲完成回作答面
  const rAns = rescueAns() === true &&
               document.getElementById('key-' + ansName).classList.contains('breathe');
  clearBreathe();                                      // 还原（「动作即清」语义 ⑩ 已测）
  const rw1 = await PI.tapKey(rhyWrongName);           // 错选：wrong+miss+1+不换题可重选
  const k1 = rw1 === 'wrong' && PI.quiz.miss === 1 && PI.quiz.step === 1 &&
             PI.quiz.mode === 'rhythm' && PI.currentLevel.miss === 1;
  const rr1 = await PI.tapKey(ansName);                // 答案键：done 推进
  const k2 = rr1 === 'done' && PI.currentLevel.step === 2;
  await until(() => PI.phase === 'play' && !state.locked);   // qi3 listen 等待
  const e2 = await driveEcho(L15.seqs[2], false);      // qi2 echo5 → step3
  await until(() => PI.phase === 'play' && !state.locked);   // qi3 作答等待
  const cq15 = L15.seqs[3];                            // qi3 chord
  const ca = NOTE_IDS[cq15.seq[0]], cb = NOTE_IDS[cq15.seq[1]];
  const cxi = (cq15.seq[0] + 1) % 8;                   // 恒非答案（间距≥2 ⇒ b≥a+2 ⇒ a+1≠b）
  const cx = NOTE_IDS[cxi];
  const p1 = await PI.tapKey(ca);                      // 选中第 1 键：.sel 在场
  const k3 = p1 === 'pick' && document.getElementById('key-' + ca).classList.contains('sel');
  const p2 = await PI.tapKey(ca);                      // 取消选择：same+.sel 灭
  const k4 = p2 === 'same' && !document.getElementById('key-' + ca).classList.contains('sel');
  /* 挂账⑤ chord 侧：方向级=重弹全曲 / 答案级=两答案键齐 breathe（SPEC §R4 分层） */
  const cDir = rescueDir() === true && PI.phase === 'listen' && state.locked;
  await until(() => PI.phase === 'play' && !state.locked);   // 重弹完成回作答面（sel 本空幂等）
  const cAns = rescueAns() === true &&
               document.getElementById('key-' + ca).classList.contains('breathe') &&
               document.getElementById('key-' + cb).classList.contains('breathe');
  clearBreathe();                                      // 还原
  const p3 = await PI.tapKey(cx);                      // 错集合 {x,a}：pick 后 wrong 清空
  const p4 = await PI.tapKey(ca);
  const k5 = p3 === 'pick' && p4 === 'wrong' && PI.quiz.miss === 1 &&
             PI.currentLevel.miss === 2 &&                 /* 本序列 1 错+前题 1 错=总 2 */
             !document.querySelector('.key.sel') && PI.currentLevel.step === 3;
  const p5 = await PI.tapKey(ca);                      // 重选：pick+补 b=集合对 → done
  /* 审查M1(r23)+挂账②：.sel/.good 断言采样点=反馈窗内（tapKey 发起后 wait(50*SPEED)，
     早于 busy 窗 200*SPEED 与 runSequence 重发的 clearSel）——原版稳态采样时
     runSequence 已 clearSel 洗掉 .sel，删 clearSel 修复照样绿=无判别力；窗内断言
     才锁死「chord 答对先清 .sel 再上 .good」这一修复面 */
  const p6p = PI.tapKey(cb);
  await wait(50 * SPEED);                              // 反馈窗内采样（busy 窗未出）
  const gElA = document.getElementById('key-' + ca), gElB = document.getElementById('key-' + cb);
  const wSel = !document.querySelector('.key.sel');    // 窗内 .sel 必须已清（M1 修复面）
  const wGood = gElA.classList.contains('good') && gElB.classList.contains('good');
  const p6 = await p6p;
  const k6 = p5 === 'pick' && p6 === 'done' && PI.currentLevel.step === 4 && wSel && wGood;
  const a15 = await PI.autoSolve();                    // qi4 echo5 收尾（autoSolve mode 分支）
  const k7 = a15.done && PI.currentLevel.done && PI.currentLevel.won &&
             PI.currentLevel.miss === 2 && engStars(cur) === 2;   /* 两次探索错选=2★（口径实证） */
  const ansOk = e0 && k1 && k2 && e2 && k3 && k4 && k5 && k6 && k7 &&
                rDir && rAns && cDir && cAns;          /* 挂账⑤：救援两级直调并入单元判据 */
  if (ansOk) npass++;
  units.answer = { ok: ansOk, e0: e0, rhyWrongKeep: k1, rhyDone: k2, e2: e2, pick: k3,
                   same: k4, chWrongClear: k5, chDone: k6, wonMiss2Stars2: k7,
                   rhyRescueDir: rDir, rhyRescueAns: rAns,
                   choRescueDir: cDir, choRescueAns: cAns };

  /* ---- ⑯ r23 首次新作答预告：start(dch4 关) .tease 在场（verify 页不写档每次重触发） ---- */
  total++;
  PI.start(15);
  const teaseOk = await until(() => !!document.querySelector('.key.tease'), 4000);
  if (teaseOk) npass++;
  units.tease = { ok: teaseOk };

  const out = { game: 'piano', total: total, pass: npass, layoutOk: layoutOk,
                levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  runVerify();
}

</script>
