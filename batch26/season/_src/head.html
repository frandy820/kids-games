<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>季节衣橱</title>
<style>
/* ================= 季节衣橱 season r4（batch26 双约束整套装决策改造）=================
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E；
   6-7 岁幼小衔接段：题面=双条件 chips（气温带很冷0°/凉爽15°/很热35° + 场合上学/运动/
   睡觉/派对）+ 季节场景卡（band 映射冬/春秋/夏景）+ 题面句文字条（识字萌芽），
   下方 5-6 张物品卡（30 物品封闭，干扰恒 !fits——双约束唯一性）。
   套装题点卡=勾选（.held 绿框+角标勾，物品飞挂小兔 badge），勾满点「穿好啦」提交：
   含错件=清空重选+miss / 少选=保留继续；反向题=单选即时判定。
   触摸目标：物品卡=主答案按钮 ≥96×96（§0.9）；季节场景卡可点重听；底栏按钮 ≥72。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{color:#4A3B2E;font-family:inherit;cursor:pointer;border:none;background:none}   /* 契约 O：自建 button 显式 color（r4 审查 m-8） */
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 50px;display:flex;align-items:center;padding:5px 60px 0 14px;gap:14px}
#logo{width:40px;height:40px;border-radius:12px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 40px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：季节场景卡 → 条件区 → 物品卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}

/* 季节场景卡：可点重听题面；季节动画（雨丝/落叶/雪花）纯 CSS 循环零 JS */
#scene{position:relative;width:min(560px,94vw);height:172px;border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;overflow:hidden;padding:0;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene .sky{position:absolute;inset:0;margin:auto;border-radius:23px}
/* 天气循环动画：春雨丝 / 秋落叶 / 冬雪花 */
#scene .rain{animation:weather-fall 1.5s linear infinite}
#scene .leaffall{animation:weather-fall 2.8s ease-in infinite}
#scene .leaffall.l2{animation-delay:1.1s}
#scene .leaffall.l3{animation-delay:2s;animation-duration:3.2s}
#scene .snow{animation:weather-fall 3s linear infinite}
#scene .snow.s2{animation-delay:.8s;animation-duration:3.4s}
#scene .snow.s3{animation-delay:1.7s}
#scene .snow.s4{animation-delay:2.4s;animation-duration:3.6s}
@keyframes weather-fall{0%{transform:translateY(-10px);opacity:0}20%{opacity:1}
  85%{opacity:.9}100%{transform:translateY(26px);opacity:0}}
/* 小兔（右下）+季节衣着配件+已勾选物品 badge 层 */
#scene .bunny-slot{position:absolute;right:8px;bottom:4px;width:112px;display:flex;
  flex-direction:column;align-items:center;z-index:3}
#scene #bunny-wear{display:flex;gap:2px;min-height:44px;align-items:flex-end;justify-content:center;z-index:3}
#scene #bunny-wear .wear{width:42px;height:42px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  border-radius:13px;display:flex;align-items:center;justify-content:center;
  animation:wear-pop .45s cubic-bezier(.2,1.7,.4,1) backwards;box-shadow:0 2px 0 #D8C9B4}
#scene #bunny-wear .wear svg{width:34px;height:34px}
@keyframes wear-pop{0%{transform:scale(.2) translateY(12px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
#scene #bunny{position:relative;animation:bun-idle 2.4s ease-in-out infinite}
#scene #bunny svg{width:88px;height:88px}
#scene #bunny.hop{animation:bun-jump .5s ease 2}
@keyframes bun-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bun-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
#scene .bunny-acc{position:absolute;left:50%;top:52%;transform:translateX(-56%);z-index:2;pointer-events:none}
/* 题面句文字条（6-7 岁识字萌芽，照 habitat） */
#scene .q-text{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:5;
  background:rgba(255,249,238,.94);border:2.5px solid #4A3B2E;border-radius:16px;
  padding:5px 18px;font-size:23px;font-weight:700;letter-spacing:1px;white-space:nowrap}
/* 救援方向级：季节场景区 pulse（整体呼吸放大 3 次） */
#scene.pulse{animation:scene-pulse 1s ease-in-out 3}
@keyframes scene-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#scene.bounce{animation:scene-b .4s ease}
@keyframes scene-b{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}

/* ---------- 条件区（r4 双约束 chips：气温带（图标+大数字°）+ 场合（图标）——幽灵手教学圈注锚点） */
#conds{flex:0 0 auto;display:flex;gap:10px;justify-content:center;align-items:center;
  width:100%;max-width:760px;min-height:68px}
#conds.pulse{animation:conds-pulse 1s ease-in-out 3}
@keyframes conds-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#conds .chip{position:relative;width:64px;height:64px;border-radius:18px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto}
#conds .chip.isband{width:92px;justify-content:center;gap:2px}
#conds .chip.isband .bdeg{display:flex;align-items:baseline;justify-content:center;gap:1px;
  font-size:32px;font-weight:800;color:#4A3B2E;line-height:1}
#conds .chip.isband .bdeg i{font-style:normal;font-size:22px;color:#E8975A}
#conds .chip svg{width:44px;height:44px}
#conds .chip.isband svg{width:34px;height:34px}

/* ---------- 物品卡排：一行 5-6 卡，主答案按钮 ≥96×96；吞输入=容器 bump ---------- */
#board{display:flex;gap:12px;justify-content:center;align-items:stretch;flex:0 0 auto;
  width:100%;max-width:800px;padding:0 2px}
#board.bump{animation:board-bump .22s ease}
@keyframes board-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 5px 0 #D8C9B4;flex:0 0 auto;width:118px;min-height:136px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s;overflow:visible}
.card:active{transform:translateY(3px)}
.card .gwrap{width:88px;height:92px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card .gwrap svg{width:84px;height:84px}
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 套装题勾选：绿框+角标勾+轻微上浮（等提交） */
.card.held{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;transform:translateY(-5px)}
.card.held .check{opacity:1;transform:scale(1)}
.card .check{position:absolute;right:-8px;top:-10px;width:34px;height:34px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #4A3B2E;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.3);transition:all .25s cubic-bezier(.2,1.6,.4,1)}
.card .check svg{width:20px;height:20px}
.card.bump{animation:card-bump .22s ease}
@keyframes card-bump{0%,100%{transform:scale(1)}45%{transform:scale(.94)}}
/* 答对：卡绿+弹（物品飞到小兔身上） */
.card.lit{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;
  animation:card-lit .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes card-lit{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 答错：物品卡摇头（不灰掉可重选——探索不罚，语义反馈款） */
.card.wig{animation:an-wig .6s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}22%{transform:rotate(-8deg) translateX(-4px)}
  50%{transform:rotate(7deg) translateX(3px)}78%{transform:rotate(-4deg) translateX(-2px)}}
/* 30s 答案级救援：下一件应选卡呼吸高亮循环（§0.21） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 换装飞行体（卡 → 小兔 badge，fixed 层 CSS transition） */
.flywear{position:fixed;z-index:90;width:64px;height:64px;border-radius:16px;display:flex;
  align-items:center;justify-content:center;background:#FFF9EE;border:3px solid #6FA063;
  box-shadow:0 4px 0 #6FA063;pointer-events:none;
  transition:transform .43s cubic-bezier(.3,.85,.35,1.08)}
.flywear svg{width:52px;height:52px}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
/* 「穿好啦」提交钮（套装题出现；勾满 need=.ready 呼吸邀请，weather v2 先例） */
#btn-wear{width:96px;height:80px;border-radius:26px;background:#8FBF7F;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #6FA063;display:none;align-items:center;justify-content:center;
  flex:0 0 auto;transition:transform .15s}
#btn-wear.show{display:flex}
#btn-wear:active{transform:translateY(3px);box-shadow:0 2px 0 #6FA063}
#btn-wear svg{width:56px;height:56px}
#btn-wear.ready{animation:wear-ready 1.5s ease-in-out infinite}
@keyframes wear-ready{0%,100%{filter:drop-shadow(0 0 0 rgba(111,160,99,0))}50%{filter:drop-shadow(0 0 14px rgba(111,160,99,.95))}}
#btn-wear.press{animation:wear-press .3s ease}
@keyframes wear-press{0%,100%{transform:scale(1)}45%{transform:scale(.92)}}
#btn-wear.bump{animation:card-bump .22s ease}
#btn-wear.breathe{animation:an-breathe 1.6s ease-in-out infinite}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-25） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：场景/条件/卡适配，主答案卡仍 ≥96 */
@media (orientation:portrait){
  #scene{height:158px}
  #scene .bunny-slot{width:96px}
  #scene #bunny svg{width:80px;height:80px}
  #scene #bunny-wear .wear{width:36px;height:36px}
  #scene #bunny-wear .wear svg{width:28px;height:28px}
  #scene .q-text{font-size:20px;padding:4px 14px}
  #conds{gap:8px;min-height:62px}
  #conds .chip{width:58px;height:58px;border-radius:16px}
  #conds .chip svg{width:40px;height:40px}
  #conds .chip.isband{width:84px}
  #conds .chip.isband svg{width:30px;height:30px}
  #conds .chip.isband .bdeg{font-size:28px}
  #board{gap:8px}
  .card{width:100px;min-height:122px;border-radius:20px}
  .card .gwrap{width:76px;height:80px}
  .card .gwrap svg{width:72px;height:72px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
  #btn-wear{width:86px;height:74px}
}
</style>
</head>
<body>
<div id="game" aria-label="季节衣橱">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="季节场景，点我再听一遍"></button>
    <div id="conds" aria-label="题目条件"></div>
    <div id="board" aria-label="衣物物品"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-wear" aria-label="穿好啦，提交"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
