<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子的游戏屋 · 又来三款新游戏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FBF3E4;color:#4A3B2E;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:34px 22px}
  .logo{width:150px;height:150px}
  h1{font-size:clamp(26px,5vw,38px);letter-spacing:.05em}
  .ageband{display:inline-flex;align-items:center;gap:8px;background:#E8975A;color:#fff;font-size:16px;font-weight:700;
           padding:7px 18px;border-radius:999px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px;width:100%;max-width:760px}
  a.card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 24px;border-radius:26px;
         background:#FFF9EE;border:2.5px solid #4A3B2E;text-decoration:none;color:#4A3B2E;
         box-shadow:0 5px 0 #D8C9B4;transition:transform .2s}
  a.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
  @media (hover:hover){
    a.card:hover{transform:translateY(-4px);box-shadow:0 9px 0 #D8C9B4}
  }
  .card .icon{width:92px;height:92px}
  .card .name{font-size:22px;font-weight:700}
  .card .desc{font-size:14px;color:#8A7B6C;line-height:1.6;text-align:center}
  .foot{font-size:12.5px;color:#8A7B6C;text-align:center;line-height:1.8;max-width:520px}
</style>
</head>
<body>
  <div class="logo" id="logo"></div>
  <h1>小兔子的游戏屋 · 又来三款新游戏</h1>
  <div class="ageband">★ 6-7 岁 · 幼小衔接 ★</div>
  <div class="grid">
    <a class="card" href="sign/index.html">

        <path d="M36 72 v18 M44 72 v18 M58 72 v18 M66 72 v18" stroke="#4A3B2E" stroke-width="2.4" stroke-linecap="round"/>

      </svg></div>
      <div class="name">交通标志</div>

    </a>

        <path d="M50 14 l-26 14 v10 h52 v-10 Z" fill="#F2C94C" stroke="#4A3B2E" stroke-width="2.4" stroke-linejoin="round"/>

        <path d="M28 52 h44" stroke="#4A3B2E" stroke-width="2" opacity=".5"/>
        <path d="M20 22 q4 -6 8 0 M72 22 q4 -6 8 0" stroke="#E8975A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M14 64 q2 -5 4 0 q2 5 4 0" stroke="#7FB3E0" stroke-width="2.2" fill="none" stroke-linecap="round"/>

        <path d="M40 74 q10 8 20 0" stroke="#4A3B2E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <circle cx="42" cy="66" r="2.2" fill="#4A3B2E"/><circle cx="58" cy="66" r="2.2" fill="#4A3B2E"/>
      </svg></div>
      <div class="name">季节衣橱</div>
      <div class="desc">春天穿什么<br>帮小兔子挑衣服</div>
    </a>
    <a class="card" href="calendar/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="14" y="18" width="72" height="66" rx="10" fill="#FFF9EE" stroke="#4A3B2E" stroke-width="2.6"/>
        <path d="M14 36 h72" stroke="#4A3B2E" stroke-width="2.6"/>
        <path d="M32 10 v12 M68 10 v12" stroke="#4A3B2E" stroke-width="3.4" stroke-linecap="round"/>
        <rect x="24" y="44" width="16" height="12" rx="3" fill="#9CC288"/>
        <rect x="44" y="44" width="16" height="12" rx="3" fill="#F9E4C8"/>
        <rect x="64" y="44" width="12" height="12" rx="3" fill="#F9E4C8"/>
        <rect x="24" y="62" width="16" height="12" rx="3" fill="#F9E4C8"/>
        <rect x="44" y="62" width="16" height="12" rx="3" fill="#F2C94C"/>
        <path d="M52 64 l2.4 4.6 5 .8 -3.6 3.6 .8 5 -4.6 -2.4 -4.6 2.4 .8 -5 -3.6 -3.6 5 -.8 Z" fill="#FFF" stroke="#4A3B2E" stroke-width="1.4" stroke-linejoin="round"/>
        <rect x="64" y="62" width="12" height="12" rx="3" fill="#F9E4C8"/>
      </svg></div>
      <div class="name">日历小星</div>
      <div class="desc">星期的后面是谁<br>排排队点亮小星</div>
    </a>
  </div>
    <p class="foot">每天有新关卡，玩完今天的小兔子会说"明天见"。<br>每款游戏右上角 🔒 家长面板：进度 / 时长 / 今日多玩关数。<br>完全离线，无广告无内购，进度保存在本机。</p>
