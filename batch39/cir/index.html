<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>电路小灯泡</title>
<style>
/* ================= 电路小灯泡 cir（batch39·扩容批 9）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 电路断了一处，选对导线让小灯泡亮起来（SPEC-BATCH39 §0.96/§3，
   7-8 岁科学/工程·闭合回路拓扑判定）：电路板 SVG 环形（电池+灯泡+导线槽）→
   候选导线 S/M/L 跨距档唯一匹配缺口 → 落位瞬间灯亮（即时因果）+电流粒子环流。
   导线跨距 56/84/112 视觉可辨（差≥28px）+铜色双通道；
   灯亮=.lamp.on（玻壳暖黄+8 光芒浮现+光晕）；电流=g[data-anim=flow] 环流虚线动画。
   触摸目标：候选 ≥96×96、底栏按钮 ≥72；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：电路板 + 导线库 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:6px 12px}
#scene{flex:0 0 auto;position:relative;width:min(680px,94vw);border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F0E7CC 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:10px 12px 14px;transition:transform .4s,box-shadow .4s}
#scene.panorama{transform:scale(1.03);box-shadow:0 0 0 6px rgba(232,151,90,.45),0 4px 0 #D8C9B4}

/* ---------- 电路板（SVG 环形） ---------- */
#board{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
#board.bump{animation:cir-bump .22s ease}
@keyframes cir-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
#board svg{width:min(560px,88vw);height:auto}
/* 导线槽：固定槽实线（主线+铜芯双通道）——泛化选择器（并联板固定右干路是 svg
   直接子级非 .slotg 内，同形导线同色） */
.wmain{stroke:#4A3B2E;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wcopper{stroke:#C97E4A;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* 缺口槽：浅虚线路由（走线提示，不泄跨距）+橙色缺口线+两端触点垫 */
.slotg[data-type=blank] .routefaint,.slotg[data-type=bunny] .routefaint{
  stroke:#B99F73;stroke-width:7;fill:none;stroke-dasharray:4 10;stroke-linecap:round}
.slotg .solid{display:none;stroke:#4A3B2E;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.slotg .solidc{display:none;stroke:#C97E4A;stroke-width:3;fill:none;stroke-linecap:round}
.slotg.closed .routefaint{display:none}
.slotg.closed .solid,.slotg.closed .solidc{display:block}
.slotg .gapline{stroke:#E8975A;stroke-width:6;stroke-dasharray:10 8;stroke-linecap:round}
.slotg[data-type=bunny] .gapline{stroke:#C9B08A}
.slotg .pad{fill:#FFF9EE;stroke:#4A3B2E;stroke-width:3}
.slotg[data-type=bunny] .qmark{font-size:22px;font-weight:800;fill:#B99F73}
/* 落位导线弹入（先弹后随路实线——放对瞬间灯亮主演出） */
.slotg.closed .wirepiece{animation:wire-in .8s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes wire-in{0%{transform:scale(.2);opacity:0}
  70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
.slotg.closed{transform-box:fill-box;transform-origin:center}
/* 判定缺口开题呼吸高亮（当前任务锚） */
.slotg.focus .gapline{animation:gap-br 1.4s ease-in-out infinite}
@keyframes gap-br{0%,100%{filter:drop-shadow(0 0 0 rgba(232,151,90,0))}
  50%{filter:drop-shadow(0 0 7px rgba(232,151,90,.95))}}
/* 方向级反馈：错时高亮缺口两端触点（「看看哪里断了」——不亮正确件本体不泄答案） */
.slotg.lit .pad{fill:#FFE7C4;stroke:#E8975A;stroke-width:4}
.slotg.lit .gapline{stroke:#E8975A;stroke-width:7}
.slotg.lit{animation:gap-lit .7s ease}
@keyframes gap-lit{0%,100%{opacity:1}50%{opacity:.55}}
/* 答案级提示：缺口 breathe（miss≥2） */
.slotg.breathe .gapline{animation:gap-br2 1.2s ease-in-out infinite}
@keyframes gap-br2{0%,100%{stroke:#E8975A}
  50%{stroke:#8FBF7F;filter:drop-shadow(0 0 8px rgba(143,191,127,.9))}}
/* 「先猜后试」悬停预览虚影（非判定层——只显形不改 miss/answer/step） */
.slotg .ghostwire{stroke:#C97E4A;stroke-width:8;stroke-linecap:round;opacity:0;transition:opacity .15s}
.slotg[data-pv] .ghostwire{opacity:.38}
/* 灯泡：默认熄灭（玻壳米白）；.on=亮（暖黄玻壳+光芒+光晕——SPEC §4 灯亮 DOM 断言锚） */
.lamp .glass{transition:fill .25s}
.lamp .rays{opacity:0;transition:opacity .25s}
.lamp .halo{transition:opacity .3s}
.lamp.on .glass{fill:#FFE28A}
.lamp.on .rays{opacity:1}
.lamp.on .halo{opacity:.5}
.lamp.on{filter:drop-shadow(0 0 9px rgba(255,217,102,.95));animation:lamp-pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes lamp-pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.lamp{transform-box:fill-box;transform-origin:center}
/* 电流粒子环流（g[data-anim=flow]——契约 M 锚；.flowing=闭合后环流） */
.flowpath{stroke:#F2B33D;stroke-width:6;fill:none;stroke-linecap:round;
  stroke-dasharray:3 15;opacity:0;transition:opacity .2s}
.flowpath.flowing{opacity:.95;animation:flow-run 1.1s linear infinite}
@keyframes flow-run{to{stroke-dashoffset:-72}}
/* 结点（并联板分叉/汇合——干路分叉两支路可视化锚） */
.junction{fill:#4A3B2E}
/* 关末全板通电泛光（纯演出层） */
#board.fullglow svg{filter:drop-shadow(0 0 12px rgba(242,179,61,.8))}
/* ---------- 导线库（候选——触摸目标 ≥96） ---------- */
#tray-wrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;padding:2px 0}
#tray-wrap .t-label{font-size:15px;font-weight:700;color:#8A6F52;padding:3px 10px;border-radius:10px;
  background:#F2DDC0;border:2px solid #4A3B2E}
#picks{display:flex;gap:12px;align-items:center;transition:opacity .3s}
#picks.dim{opacity:.34;pointer-events:none}   /* 阶段1 预判未答：元件库降透明（顺序引导——r4 双答制） */
.pick{width:104px;height:104px;border-radius:18px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.pick:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
.pick.breathe{animation:pick-br 1.2s ease-in-out infinite}
@keyframes pick-br{0%,100%{box-shadow:0 4px 0 #D8C9B4}
  50%{box-shadow:0 0 0 7px rgba(143,191,127,.8),0 4px 0 #D8C9B4}}
.pick.rej{animation:pick-rej .5s ease}
@keyframes pick-rej{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
/* 同尺寸死支路干扰（r4）：dead 徽记候选描边灰化+角标（拓扑排除可视锚） */
.pick.pick-dead{border-color:#B99F73;background:#F4EDDD}
.pick.pick-dead::after{content:"支路";position:absolute;font-size:12px;font-weight:800;color:#FFF9EE;
  background:#B99F73;border-radius:8px;padding:2px 7px;transform:translate(30px,-34px)}
.pick{position:relative}
/* 悬停预览联动：候选 hover 时描边微亮（虚影在缺口端——见 .slotg[data-pv]） */
.pick:hover{box-shadow:0 0 0 5px rgba(201,126,74,.35),0 4px 0 #D8C9B4}

/* ---------- 先猜一猜预判行（r4 判定层阶段1——answerbar 按钮组） ---------- */
#answerbar{flex:0 0 auto;display:none;align-items:center;justify-content:center;gap:10px;padding:2px 0}
#answerbar.show{display:flex}
#answerbar .a-label{font-size:15px;font-weight:700;color:#8A6F52;padding:3px 10px;border-radius:10px;
  background:#F2DDC0;border:2px solid #4A3B2E}
#answerbar .a-btns{display:flex;gap:10px}
.guess-btn{min-width:96px;min-height:64px;border-radius:16px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:6px 14px;transition:transform .15s}
.guess-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
.guess-btn span{font-size:16px;font-weight:800;color:#4A3B2E}
.guess-btn.rej{animation:pick-rej .5s ease}
.guess-btn.breathe{animation:pick-br 1.2s ease-in-out infinite}
#answerbar.done .guess-btn{opacity:.5}
#answerbar.done .guess-btn.picked{opacity:1;border-color:#8FBF7F;
  box-shadow:0 0 0 5px rgba(143,191,127,.55),0 4px 0 #D8C9B4}

/* ---------- r4 板面新件 ---------- */
/* 开关（闸刀）：默认断开（闸刀抬起）——.closed 合上（闸刀转正+触点亮点） */
.sw .lever{transform-box:fill-box;transform-origin:0 50%;transition:transform .35s ease}
.sw.closed .lever{transform:rotate(0deg);stroke:#8FBF7F}
.sw .lever{transform:rotate(-28deg)}
.sw.closed circle:nth-child(4){fill:#8FBF7F}
/* 跨接线（断/短分型锚：短路=红纹跨接）：拆线卡剪断淡出+方向级轻点 */
.jumper{transition:opacity .5s}
.jumper.gone{opacity:0}
.jumper.nudge{animation:jm-nudge .6s ease}
@keyframes jm-nudge{0%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}60%{transform:translateY(2px)}}
.jumper{transform-box:fill-box;transform-origin:center}
/* 小风扇（死支路负载指示——支路修好后 .spin） */
.fan{transform-box:fill-box;transform-origin:50% 20%;transition:opacity .3s;opacity:.55}
.fan.spin{opacity:1;animation:fan-run 1.2s linear infinite}
@keyframes fan-run{to{transform:rotate(360deg)}}
/* 断口毛边（断/短分型锚：断路=毛边断口） */
.fraymark{stroke:#D96A5A;stroke-width:3;stroke-linecap:round;fill:none;opacity:.85}
.slotg[data-frayed] .gapline{stroke-dasharray:3 7}
/* 串联弱光（ch4 亮度演示锚：两灯串联=比单灯暗——弱光晕无光芒） */
.lamp.on.dim .glass{fill:#FBE9A9}
.lamp.on.dim .rays{opacity:.28}
.lamp.on.dim .halo{opacity:.22}
.lamp.on.dim{filter:drop-shadow(0 0 4px rgba(255,217,102,.55))}
/* 主路走线流光（阶段1 方向级反馈——拓扑追路径视觉锚，一遍即撤） */
.wmain.trace,.routefaint.trace{stroke:#F2B33D;stroke-width:9;stroke-dasharray:10 14;
  animation:trace-run 1.8s linear 1}
@keyframes trace-run{from{stroke-dashoffset:0}to{stroke-dashoffset:-240}}
/* 预判钉 chip（阶段1 答对钉在判定缺口上方——.pindir） */
.pindir{opacity:0;transition:opacity .25s}
.pindir.show{opacity:1}
.pindir .pintxt{font-size:20px;font-weight:800;fill:#4A3B2E;paint-order:stroke;stroke:#FFF9EE;stroke-width:5px}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:76px;height:76px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:44px;height:44px}
#btn-replay.bounce{animation:rep-b .4s ease}
@keyframes rep-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-38） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：舞台收紧（电路板 svg 自适应缩放） */
@media (orientation:portrait){
  #scene{width:min(600px,96vw)}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
  #picks{gap:8px}
  .pick{width:98px;height:98px}
}
</style>
</head>
<body>
<div id="game" aria-label="电路小灯泡">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="电路板，先猜一猜灯泡亮不亮，再选对元件接上缺口">
      <div id="board" aria-label="电路板"></div>
      <div id="answerbar" aria-label="先猜一猜预判行">
        <span class="a-label">先猜一猜</span>
        <div class="a-btns"></div>
      </div>
      <div id="tray-wrap">
        <span class="t-label">导线库</span>
        <div id="picks" aria-label="候选元件"></div>
      </div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再听一遍观察句"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }

    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();

      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

/* ================= cir 纯引擎 r4：确定性关卡生成 + 双答判定（无 DOM，UI 与 verify 共用）
   取题（SPEC-BATCH39 §3 r4：题库封闭 20 题=4 章×5；每关 5 题）：
   静态关 flat<20：dch=diffOfCh(ch) 静态档，关内 5 题=章池 5 行 rotate (lv+k)%5
   （thanks 先例同构）；候选序 seeded 打散。
   生成关 flat≥20：dch=seeded 随机 ri(rnd,1,4)（mulberry32(flat*7919+877) 首随机数
   先取保确定性——b33 硬性②+quickcmp 先例；本款常量 877），再从该 dch 档行池
   seeded 无放回抽 5（域全档成立型：四题型档池均自洽）——同 flat 永远同关。
   阶段1 真值（r4 双答制——SPEC §3 独立推导式，verify 用独立副本复算禁抄本层）：
   predAnsOf(row)：
     twogap  second.at==='main' → 'dark'（两缺口都在主环，只接判定位一根不亮）;
             否则 'lit'（第二缺口在死支路，主环只有判定位一个缺口）
     fault   !short && blankAt!=='main' → 'lit'（主环完好——断口只在死支路）;
             否则 'dark'（主路断口 或 跨接线短路灯）
     switch  branch.bridge==='lamp' && branch.sw → 'dark'（支路开关合上跨灯短路）;
             否则 'lit'（跨线段支路开关 / 开关在主路）
     bright  branch ? 'same'（并联=与单灯一样亮） : 'down'（串联=比单灯更暗）;
             'up'（更亮）=误解干扰项恒非真值
   候选构造 r4（同尺寸干扰——SPEC §3）：decoy ⟺ second && second.at==='dead'
   → 3 枚=[need(通路导线), 同尺寸死支路元件(dead 标), 邻档线]（两根同尺寸按目测失效，
   须按拓扑排除）；F3（need=null）→ [拆线卡, 线 M, 线 L]（answer=卡位）；余经典
   [need + 两异档线] → answer=picks 内 need 唯一位。
   quiz 结构：{ kind, layout, slots[], blank, blankAt, need, second, branch, short, sw,
   litAns, brightAns, predAns, picks[], answer, deadIdx, obs, obsWin, phase, _miss,
   _predOk, _answered }
   slots[]：{ k, type('fix'|'blank'|'bunny'), part, on }——死支路缺口槽追加为末槽
   （index=layout.length）；on=终点态（本题完成后全 true——回路闭合律终点口径；
   阶段中途的灯亮为渲染层 .lamp.on 非槽真值）。
   铁律：每关 5 题；每题恰一枚正确候选（structWhy 校验）；阶段1 未答对（_predOk=false）
   阶段2 判定不可入（engTapPart null——顺序守卫）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 阶段1 真值推导（引擎真源；verify specLitOf 独立副本禁调本函数） ---------- */
function predAnsOf(row) {
  if (row.kind === 'bright') return row.branch ? 'same' : 'down';
  if (row.kind === 'twogap') return (row.second && row.second.at === 'main') ? 'dark' : 'lit';
  if (row.kind === 'fault') return (!row.short && row.blankAt !== 'main') ? 'lit' : 'dark';
  return !(row.branch && row.branch.bridge === 'lamp' && row.branch.sw) ? 'lit' : 'dark';
}

/* ---------- 布局解析：记法串 → 主环槽位骨架（part=FIX_PART/on=false） ---------- */
function parseLayout(layout) {
  const slots = [];
  for (let k = 0; k < layout.length; k++) {
    slots.push({ k: k, type: 'fix', part: FIX_PART, on: false });
  }
  return slots;
}

/* ---------- seeded 打散（Fisher-Yates，确定性——对象数组按引用交换） ---------- */
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = ri(rnd, 0, i);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---------- 单题构建：SPEC_TABLE 行 + 槽位骨架 + seeded 候选序；answer=唯一正确下标 ---------- */
function buildQuiz(rowIdx, rnd) {
  const row = SPEC_TABLE[rowIdx];
  const ch = Math.floor(rowIdx / 5) + 1;                       // 行→章（封闭表域 1-4）
  const kind = row.kind;
  const branch = row.branch ? { bridge: row.branch.bridge, sw: !!row.branch.sw, lamp: !!row.branch.lamp } : null;
  const layout = kind === 'bright' ? (row.branch ? 'B??L?' : 'B??L') : 'B??L';
  const isCut = kind === 'fault' && row.short;                 // F3 拆线卡题：无缺口
  const blankAt = row.blankAt === 'dead' ? 'dead' : 'main';
  const deadSlot = layout.length;                              // 死支路缺口槽=追加末槽
  const blank = isCut ? -1 : (blankAt === 'dead' ? deadSlot : row.blank);
  const slots = parseLayout(layout);
  if (blankAt === 'dead' || (row.second && row.second.at === 'dead'))
    slots.push({ k: deadSlot, type: 'fix', part: FIX_PART, on: false });
  if (!isCut) {
    slots[blank].type = 'blank';                               // 判定缺口槽（孩子放）
    slots[blank].part = null;
  }
  let bunny = -1, bunnySize = null;
  if (row.second) {                                            // 第二缺口（兔子补齐——演出层）
    bunny = row.second.at === 'main' ? row.second.i : deadSlot;
    slots[bunny].type = 'bunny';
    slots[bunny].part = null;
    bunnySize = row.second.size;
  }
  /* 候选构造 r4（SPEC §3）：F3 拆线卡 / decoy 同尺寸死支路元件 / 经典三异档 */
  let picks, answer, deadIdx = -1;
  if (kind === 'fault' && row.short) {
    picks = shuffled([{ t: 'cut', size: null }, { t: 'wire', size: 'M' }, { t: 'wire', size: 'L' }], rnd);
    answer = picks.findIndex(p => p.t === 'cut');
  } else if (row.second && row.second.at === 'dead') {
    const adj = row.need === 'M' ? (rnd() < 0.5 ? 'S' : 'L') : 'M';   // 邻档干扰（need M 时 seeded 二选）
    picks = shuffled([{ t: 'wire', size: row.need }, { t: 'wire', size: row.need, dead: true },
                      { t: 'wire', size: adj }], rnd);
    deadIdx = picks.findIndex(p => p.dead);
    answer = picks.findIndex(p => p.t === 'wire' && p.size === row.need && !p.dead);
  } else {
    const others = ['S', 'M', 'L'].filter(s => s !== row.need);
    picks = shuffled([{ t: 'wire', size: row.need }, { t: 'wire', size: others[0] },
                      { t: 'wire', size: others[1] }], rnd);
    answer = picks.findIndex(p => p.size === row.need);
  }
  const predAns = predAnsOf({ kind: kind, second: row.second ? { at: row.second.at } : null,
                              blankAt: blankAt, short: !!row.short,
                              branch: row.branch ? { bridge: row.branch.bridge, sw: !!row.branch.sw } : null });   // 阶段1 真值（SPEC 独立式——归一化行口径与 structWhy 复算一致）
  return { kind: kind, layout: layout, slots: slots, blank: blank, blankAt: blankAt,
           need: row.need || null,
           second: row.second ? { at: row.second.at, i: bunny,
                                  size: row.second.size } : null,
           branch: branch, short: !!row.short, sw: !!row.sw,
           litAns: kind === 'bright' ? null : predAns === 'lit',
           brightAns: kind === 'bright' ? predAns : null,
           predAns: predAns,
           picks: picks, answer: answer, deadIdx: deadIdx,
           obs: CHAPTERS[ch].obs, obsKey: CHAPTERS[ch].obsKey, obsWin: CHAPTERS[ch].obsWin,
           phase: 1, _miss: 0, _predOk: false, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   静态关章池 rotate：flat 关 5 题 = SPEC_TABLE[(dch-1)*5 + (lv+k)%5]（章池全 5 题轮转取尽）
   生成关：dch=ri(rnd,1,4) 先取，再从 dch 档行池 seeded 无放回抽 5 ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 877);                   // 本款常量 877（SPEC §0.96）
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);     // 生成关随机章参数（先取数保确定性）
  let rows;
  if (flat < STATIC_LEVELS) {
    const base = (dch - 1) * 5;                                // 静态关 dch===ch：章池 rotate
    rows = [];
    for (let k = 0; k < CH_LEN; k++) rows.push(base + (lv + k) % 5);
  } else {
    const pool = [(dch - 1) * 5, (dch - 1) * 5 + 1, (dch - 1) * 5 + 2, (dch - 1) * 5 + 3, (dch - 1) * 5 + 4];
    const a = pool.slice(), out = [];
    for (let k = 0; k < CH_LEN; k++) out.push(a.splice(ri(rnd, 0, a.length - 1), 1)[0]);
    rows = out;                                                // 生成关：档池 seeded 无放回抽 5
  }
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(rows[qi], rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv, rows: rows,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 阶段1 预判答引擎（无 DOM）：engTapPred(L, d) —— 选项 d（lit/dark/up/same/down）
   'ok'     答对：_predOk=true，phase→2（开放元件库——顺序守卫之源）
   'wrong'  答错：该题 miss+1（retries 全关累计=星级口径），可重答
   null     关卡已结束 / 本题已答过 / 阶段1 已过 / 非法选项 ---------- */
function engTapPred(L, d) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered || q._predOk || q.phase !== 1) return null;
  if (PRED_KINDS[q.kind].indexOf(d) < 0) return null;
  if (d === q.predAns) {
    q._predOk = true; q.phase = 2;
    return 'ok';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}

/* ---------- 阶段2 放元件引擎（无 DOM）：engTapPart(L, i) —— 点候选下标 i 的元件
   'lit'    放对且本题完成推进（判定槽真值落位；F3=short 置 false（跨接线拆掉）；
            兔子槽联动补齐；终点态全槽 on=true——回路闭合律终点口径）
   'done'   放对且末题=通关
   'wrong'  放错（干扰跨距/死支路元件/拆线卡题选了线）：miss+1，可重放
   null     阶段1 未答对（双答制顺序守卫）/ 非法下标 / 关卡已结束 / 本题已答 ---------- */
function engTapPart(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered || !q._predOk) return null;             // 双答制：先答预判再放元件
  if (!Number.isInteger(i) || i < 0 || i >= q.picks.length) return null;
  if (i === q.answer) {
    q._answered = true;
    if (q.kind === 'fault' && q.short) {
      q.short = false;                                          // F3：拆掉跨接线（真值落位）
    } else {
      const bs = q.slots[q.blank];                              // 判定槽真值落位（渲染层 .closed 之源）
      bs.part = q.need;
    }
    let bunnyK = -1;
    if (q.second) bunnyK = q.second.i;   // 兔子槽下标（dead 型 second.i 已上游归一化为死支路槽号——r4 审查 m-4 删恒等三元）
    if (q.second && bunnyK >= 0) q.slots[bunnyK].part = q.second.size;         // 兔子补齐槽联动落位
    for (let s = 0; s < q.slots.length; s++) q.slots[s].on = true;   // 回路律终点态：全槽通电
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'lit';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（miss 口径承 v1）：全关放错 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：当前步正确候选下标（阶段2） */
const correctPick = q => !q ? -1 : q.answer;

/* ---------- 结构校验 r4（verify 用，返回失败原因或 null）：
   kind 域 / 布局域封闭（记法串字符数=槽数 4|5 / 字符域 B L ?）/ 预判域（PRED_KINDS）
   / predAns=predAnsOf 复算 / litAns·brightAns 派生一致 / blank 在槽数域内且=blankAt 口径
   / need∈{S,M,L}（F3=null）/ second 仅 4 槽板在（tw 板无第二缺口）/ second main 时 i≠blank
   且 size≠need / decoy ⟺ second dead（picks 含恰一根 dead 同尺寸线）
   / picks 恰 3 枚 / answer=picks 内唯一非 dead need 位（F3=cut 位）/ deadIdx 对位
   / 槽位真值（fix 槽 part≠null、blank/bunny 槽 part=null、初始全 on=false）
   / 分支域（bridge∈{lamp,seg}）/ 初始态干净 ---------- */
function structWhy(q, dch, qi) {
  if (!q) return 'quiz';
  if (!CHAPTERS[dch]) return 'dch';
  if (q.kind !== 'twogap' && q.kind !== 'fault' && q.kind !== 'switch' && q.kind !== 'bright') return 'kind';
  const lay = q.layout;
  const expLay = q.kind === 'bright' ? (q.branch ? 'B??L?' : 'B??L') : 'B??L';
  if (lay !== expLay) return 'layout';
  for (let i = 0; i < lay.length; i++) {
    const c = lay.charAt(i);
    if (c !== 'B' && c !== 'L' && c !== '?') return 'chr';
  }
  if (PRED_KINDS[q.kind].indexOf(q.predAns) < 0) return 'predDom';
  const rowLike = { kind: q.kind, second: q.second ? { at: q.second.at } : null,
                    blankAt: q.blankAt, short: q.short,
                    branch: q.branch ? { bridge: q.branch.bridge, sw: q.branch.sw } : null };
  if (q.predAns !== predAnsOf(rowLike)) return 'predAns';       // 阶段1 真值自洽复算
  if (q.kind === 'bright') {
    if (q.litAns !== null || q.brightAns !== q.predAns) return 'litBright';
  } else {
    if (q.brightAns !== null || q.litAns !== (q.predAns === 'lit')) return 'litBright';
  }
  const blankAt = q.blankAt === 'dead' ? 'dead' : 'main';
  if (blankAt !== q.blankAt) return 'blankAt';
  const isCutQ = q.kind === 'fault' && q.short;
  if (isCutQ) {
    if (q.blank !== -1) return 'blankCut';                      // F3 拆线卡题无缺口
  } else if (!Number.isInteger(q.blank) || q.blank < 0 || q.blank >= q.slots.length) return 'blank';
  if (!isCutQ && blankAt === 'dead' && q.blank !== lay.length) return 'blankDead';   // 死支路槽=追加末槽
  if (q.kind === 'fault' && q.short) {
    if (q.need !== null) return 'needCut';                      // F3 拆线卡题 need=null
  } else if (q.need !== 'S' && q.need !== 'M' && q.need !== 'L') return 'need';
  if (q.second) {
    if (lay.length !== 4) return 'second5';                     // 第二缺口仅 4 槽板（tw 无）
    if (q.second.at === 'main') {
      if (!Number.isInteger(q.second.i) || q.second.i < 0 || q.second.i >= lay.length) return 'secondI';
      if (q.second.i === q.blank) return 'secondBlank';
      if (q.second.size === q.need) return 'secondEq';          // 主环第二缺口≠need（视觉可辨）
    } else if (q.second.at !== 'dead') return 'secondAt';
  }
  if (q.branch && q.branch.bridge !== 'lamp' && q.branch.bridge !== 'seg') return 'bridge';
  if (q.branch && q.kind === 'bright') {
    /* bright-PR 的 branch=拓扑标记非渲染支路（tw 板本身即两灯并联）：恒 bridge='lamp' 无开关 */
    if (lay.length !== 5 || q.branch.bridge !== 'lamp' || q.branch.sw) return 'brightBranch';
  } else if (q.branch && lay.length !== 4) return 'branch5';    // 渲染支路仅 4 槽板
  if (q.picks.length !== 3) return 'picks';
  const hasDead = !!(q.second && q.second.at === 'dead');
  let cutN = 0, wireSizes = [], deadN = 0;
  for (let i = 0; i < 3; i++) {
    const p = q.picks[i];
    if (p.t === 'cut') { cutN++; if (p.size !== null) return 'pickCut'; }
    else if (p.t === 'wire') { if (!SPAN[p.size]) return 'pickSize'; wireSizes.push(p.size); if (p.dead) deadN++; }
    else return 'pickT';
  }
  if (q.kind === 'fault' && q.short) {                          // F3：恰一卡+两线，answer=卡位
    if (cutN !== 1 || deadN !== 0) return 'cutMix';
    if (q.answer !== q.picks.findIndex(p => p.t === 'cut') || q.answer < 0) return 'answer';
    if (q.deadIdx !== -1) return 'deadCut';
  } else {
    if (cutN !== 0) return 'cutMix';
    if (hasDead) {                                              // 同尺寸干扰：need×2（一真一 dead）+邻档
      if (deadN !== 1) return 'deadN';
      if (q.deadIdx < 0 || !q.picks[q.deadIdx].dead || q.picks[q.deadIdx].size !== q.need) return 'deadIdx';
      const needN = wireSizes.filter(s => s === q.need).length;
      if (needN !== 2) return 'deadPair';                       // 恰两根同尺寸=need（拓扑排除前提）
      const other = wireSizes.filter(s => s !== q.need);
      if (other.length !== 1) return 'deadOther';
      if (q.answer !== q.picks.findIndex(p => p.t === 'wire' && p.size === q.need && !p.dead) || q.answer < 0) return 'answer';
    } else {                                                    // 经典：三枚全异（need+两邻档）
      if (deadN !== 0 || q.deadIdx !== -1) return 'deadClassic';
      if (wireSizes.filter(s => s === q.need).length !== 1) return 'uniq';
      if (q.answer !== q.picks.findIndex(p => p.size === q.need) || q.answer < 0) return 'answer';
    }
  }
  for (let i = 0; i < q.slots.length; i++) {                    // 槽位真值：类型对位+part 域+初始不通电
    const s = q.slots[i];
    if (s.k !== i) return 'slotK';
    const expType = i === q.blank ? 'blank'
      : (q.second && q.second.i === i ? 'bunny' : 'fix');
    if (s.type === 'fix') {
      if (s.part !== 'S' && s.part !== 'M' && s.part !== 'L') return 'slotFix';
    } else if (s.type === 'blank' || s.type === 'bunny') {
      if (s.part !== null) return 'slotEmpty';
    } else return 'slotType';
    if (s.on) return 'slotOn';
    if (s.type !== expType) return 'slotMap';
  }
  if (q.phase !== 1 || q._miss !== 0 || q._predOk || q._answered) return 'init';
  return null;
}
/* ================= cir 主逻辑 r4（双答制：预判 → 钉住 → 选元件 → 拓扑揭示 → 关末全板通电）
   开题演出（presentQuiz）：渲染电路板（每题一块板）→ 题面句 clip 播报（voice.play
   cir_obs_ 章档键——T46 阶段2 clip 化）→ 判定缺口 .focus 呼吸高亮 → 开放阶段1 预判行。演出锁=真时钟
   state.showUntil（tapPred/tapPart 演出期返 null——测试驱动须轮询等可交互）。
   阶段1 预判（uiTapPred）：亮/不亮（ch1-3）或 更亮/一样亮/更暗（ch4）——答对

   （picks.dim 解除）；ch2 答对续合开关亮真相（REVEAL_MS 1800——开关 .sw.closed
   +灯按 litAns 显真值，即时验证）；答错=按钮 rej+专向错链 [cir_pred_wrong|

   立亮+兔子补死支路（风扇转，灯不变）；fault-F1 立亮+兔子补死支路；fault-F2
   风扇转（主灯已亮）；fault-F3 剪线 1000ms 后亮；switch-SW1 合支路开关→灯暗
   （短路真相）→SW_AUTO_MS 后支路开关自动弹开（禁合教学）→亮；switch-SW2/SW3
   合开关立亮；bright-SR 两灯 .on.dim 弱光齐亮 / bright-PR .on 全亮（亮度演示）。
   → 确认链 [cir_right]（单 clip 1968——演出窗 LIT_MS 1400+FLOW_MS 1600=3000 ≥
   1968+300=2268 家族 G/H；F3 窗 CUT_MS 1000+FLOW_MS 1600=2600 ≥ 2268）。
   放错=候选抖动 rej+错链 [cir_wrong,cir_hint]+方向级反馈 litGapEnds（高亮缺口

   窗口径：锁=clip+150 顶格禁叠尾窗）1998/3222/2694；二错起防重入锁 1000。
   救援：14s 方向级=重播题面句+（phase1 主路走线 .trace 流光一遍 / phase2 缺口
   触点高亮——lastDir 独立节流锚不重置 lastAct，契约 B）/30s 答案级=phase 感知
   （phase1=正确预判按钮 / phase2=正确元件 breathe）；错链豁免窗让路（契约 I）。
   关末=全板通电泛光 fullglow → celebrate → persistWin。
   验收钩子：window.CIR = { get currentLevel, get quiz{kind,phase,slots,blank,blankAt,
   need,picks,answer,deadIdx,second,branch,short,litAns,brightAns,step,miss,say},
   tapPred(d), tapPart(i), start(flat), autoSolve(), reread(), get tutorial }——真实页
   同暴露（b29 坑⑥）。tapPred 返回：真值→'ok' / 干扰→'wrong' / 豁免窗内错答吞
   false / 演出期·阶段2·已答·非法 null；tapPart 返回：对非末题 'lit' / 对末题
   'done' / 干扰 'wrong' / 阶段1 未答 null / 豁免窗内错点吞 false / 演出期·越界·

'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速

const replayAnim = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const estMs = s => s.length * 345 + 600;       // b25 定版：SAPI ~345ms/字 + 600 落定余量（全字符口径）
/* 救援/开场任务语音不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */

/* 纠错链节流：flat<3（含教学迷你关 -1）每错必播；flat≥3 走 10s 节流
   （契约 J：语义句全程保留，禁切通用 clip） */
let lastWrongVoice = 0;

const sayW = parts => {

  return false;                            /* 节流未播返回 false——豁免窗仅链起播时设（契约 I「起播设」） */
};

const sceneEl = $id('scene'), boardEl = $id('board'), picksEl = $id('picks'),
      answerbarEl = $id('answerbar'), rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'),
      ghostEl = $id('ghost');

let cur = null;                                 // 当前关模型（genLevel/教学迷你关产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', showUntil: 0 };   /* r4 审查 m-3：死状态 quiet 只写不读，删（b39 §5.1 backlog） */
let lastAct = Date.now();                       /* 30s 答案级 idle 锚（方向级不得重置它——契约 B） */
let lastDir = Date.now();                       /* 14s 方向级独立节流锚（家族 B：与 lastAct 分离） */
let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const slotAt = k => boardEl.querySelector('.slotg[data-k="' + k + '"]');
const pickAt = i => picksEl.querySelector('.pick[data-i="' + i + '"]');
const predBtnAt = d => answerbarEl.querySelector('.guess-btn[data-guess="' + d + '"]');
/* 板型路由（SPEC §3 r4）：bright-PR=twin 并联板 / bright-SR=sr2 串联板 / 他=sgl 单灯板 */
const boardOf = q => q.kind === 'bright' ? (q.branch ? BOARD.twin : BOARD.sr2) : BOARD.sgl;
/* 槽位几何：主环槽 k<layout.length 取板槽；死支路槽=branchSeg.gap（追加末槽） */
function slotGeo(q, k) {
  const G = boardOf(q);
  return k < q.layout.length ? G.slots[k] : (G.branchSeg ? { d: G.branchSeg.d, gap: G.branchSeg.gap } : G.slots[0]);
}
const isDecoyQ = q => !!(q.second && q.second.at === 'dead');
const isCutQ = q => q.kind === 'fault' && q.need === null;
const isSwShortQ = q => q.kind === 'switch' && !!(q.branch && q.branch.bridge === 'lamp' && q.branch.sw);

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;

/* 音效（Web Audio 合成，家族马林巴音色）：预判钉住/通电亮灯=双音上行 / 放错=低柔单音 */
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };

/* ================= 缺口几何：跨距线段两端点（gap 锚点+方向 → SPAN[档] 定长）
   落位导线 piece=跨距线段上粗铜线（与候选导线同形——几何匹配具象） ---------- */
function gapEnds(g, size) {
  const half = SPAN[size] / 2;
  return g.vert
    ? [{ x: g.x, y: g.y - half }, { x: g.x, y: g.y + half }]
    : [{ x: g.x - half, y: g.y }, { x: g.x + half, y: g.y }];
}
function pieceSvg(e1, e2) {
  return '<g class="wirepiece" data-anim="wire">' +
    '<line x1="' + e1.x + '" y1="' + e1.y + '" x2="' + e2.x + '" y2="' + e2.y +
    '" stroke="' + INK + '" stroke-width="12" stroke-linecap="round"/>' +
    '<line x1="' + e1.x + '" y1="' + e1.y + '" x2="' + e2.x + '" y2="' + e2.y +
    '" stroke="' + COPPER + '" stroke-width="7" stroke-linecap="round"/></g>';
}

/* ================= 渲染（每题一块电路板——开题整建；契约 M 渲染即引擎） ================= */
function renderBoard(q) {
  const G = boardOf(q);
  let s = '<svg viewBox="' + G.vb + '" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">';
  /* 电流粒子环流层（板底——g[data-anim="flow"] 契约 M 锚；闭合后 .flowing） */
  s += '<g data-anim="flow">' +
    G.flows.map(f => '<path class="flowpath" d="' + f + '"/>').join('') + '</g>';
  /* 固定右干路（tw 并联板铬件——非槽） */
  if (G.trunk) s += '<path class="wmain" d="' + G.trunk + '"/><path class="wcopper" d="' + G.trunk + '"/>';
  /* 死支路层（sgl 板：跨线段下穿 / 跨灯上拱；支路开关合上=演出 .sw.closed） */
  if (q.branch && G.branchSeg) {
    const BR = q.branch.bridge === 'lamp' ? G.branchLamp : G.branchSeg;
    s += '<g class="branchg" data-bridge="' + q.branch.bridge + '">';
    s += '<path class="wmain" d="' + BR.d + '"/><path class="wcopper" d="' + BR.d + '"/>';
    if (q.branch.sw) s += swSvg(BR.swAt.x1, BR.swAt.y1, BR.swAt.x2, BR.swAt.y2);
    s += '<g class="pindir"></g></g>';
    if (q.branch.bridge === 'seg') {
      for (const j of G.junctions) s += '<circle class="junction jbranch" cx="' + j.x + '" cy="' + j.y + '" r="6"/>';
    }
  }
  /* 跨接线短路层（fault-F3：跨灯两端红纹——断/短可视分型锚；拆线卡 .gone） */
  if (q.short && G.branchLamp) {
    s += jumperSvg(G.branchLamp.a, G.branchLamp.b);
  }
  /* 主路开关（fault/SW3：swLead 引线上的闸刀 .swmaing——阶段1 答对合上） */
  if (q.sw && G.swLead) {
    s += '<g class="swmaing">' +
      '<path class="wmain" d="M ' + G.swLead.x1 + ' ' + G.swLead.y + ' L ' + G.swLead.x2 + ' ' + G.swLead.y + '"/>' +
      swSvg(G.swLead.x1, G.swLead.y, G.swLead.x2, G.swLead.y) + '</g>';
  }
  /* 导线槽序列（骨架字符串——data-k/data-type 渲染后经 dataset API 盖章=渲染即引擎，契约 M） */
  for (const sl of q.slots) {
    const geo = slotGeo(q, sl.k);
    s += '<g class="slotg">';
    if (sl.type === 'fix') {
      s += '<path class="wmain" d="' + geo.d + '"/><path class="wcopper" d="' + geo.d + '"/>';   // 已连固定槽：实线即成
    } else {
      const size = sl.type === 'blank' ? q.need : q.second.size;   // 缺口跨距=判定真值 / 兔子槽=补齐档
      const e = gapEnds(geo.gap, size);
      s += '<path class="solid" d="' + geo.d + '"/><path class="solidc" d="' + geo.d + '"/>';   // 落位后实线（CSS 显隐）
      s += '<path class="routefaint" d="' + geo.d + '"/>';           // 浅虚线路由（走线提示）
      s += '<line class="gapline" x1="' + e[0].x + '" y1="' + e[0].y + '" x2="' + e[1].x + '" y2="' + e[1].y + '"/>';
      s += '<circle class="pad" cx="' + e[0].x + '" cy="' + e[0].y + '" r="6"/>' +
           '<circle class="pad" cx="' + e[1].x + '" cy="' + e[1].y + '" r="6"/>';
      s += '<line class="ghostwire" x1="' + e[0].x + '" y1="' + e[0].y + '" x2="' + e[1].x + '" y2="' + e[1].y + '"/>';   // 悬停预览虚影（非判定）
      if (sl.type === 'bunny') s += '<text class="qmark" x="' + geo.gap.x + '" y="' + (geo.gap.y - 12) +
        '" text-anchor="middle">?</text>';
      if (q.kind === 'fault') s += '<path class="fraymark" d="' + frayPath(geo.gap, size) + '"/>';   // 断口毛边（断路可视分型）
    }
    s += '<g class="pindir"></g></g>';
  }
  /* 死支路小风扇（seg 支路含缺口时——支路修好后 .spin；主灯不受其影响） */
  if (G.branchSeg && G.branchSeg.fanAt && qHasDeadGap(q)) {
    s += fanSvg(G.branchSeg.fanAt.x, G.branchSeg.fanAt.y);
  }
  /* 结点+灯泡+电池（板面铬件；结点=seg 支路分叉点（支路块内已画）/tw 并联板分叉点） */
  if (G === BOARD.twin) {
    for (const j of G.junctions) s += '<circle class="junction" cx="' + j.x + '" cy="' + j.y + '" r="6"/>';
  }
  for (const l of G.lamps) s += lampSvg(l);
  s += battSvg(G.batt);
  s += '</svg>';
  boardEl.innerHTML = s;
  /* 渲染即引擎盖章（契约 M）：槽位号+类型经 dataset API 写真值（verify 扁平对账依据） */
  const slotEls = boardEl.querySelectorAll('.slotg');
  q.slots.forEach((sl, idx) => {
    const g = slotEls[idx];
    if (!g) return;
    g.dataset.k = String(sl.k);
    g.dataset.type = sl.type;
    if (q.kind === 'fault' && sl.type !== 'fix') g.dataset.frayed = '1';   // 断口毛边章标记
  });
  boardEl.dataset.n = String(q.slots.length);     // 帧内容锚（verify 断言渲染即引擎）
}
const qHasDeadGap = q => !!(q.second && q.second.at === 'dead') || q.blankAt === 'dead';
/* 断口毛边小径（缺口两端锯齿毛刺——断路 vs 短路可视分型：断路=毛边断口 / 短路=红纹跨接） */
function frayPath(g, size) {
  const e = gapEnds(g, size);
  const jag = (p, dir) => {
    let d = '';
    for (let i = 0; i < 3; i++)
      d += 'M ' + (p.x + dir * (2 + i * 4)) + ' ' + (p.y - 6 + i * 2) + ' L ' + (p.x + dir * (8 + i * 4)) + ' ' + (p.y + 6 - i * 2) + ' ';
    return d;
  };
  const dirx = e[1].x !== e[0].x ? (e[1].x > e[0].x ? 1 : -1) : 0;
  return jag(e[0], dirx || -1) + jag(e[1], -dirx || 1);
}
function renderPicks(q) {                        // 元件库候选 3 枚（触摸目标 ≥96 容器；含拆线卡/死支路干扰）
  picksEl.innerHTML = '';
  q.picks.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'pick' + (p.dead ? ' pick-dead' : '') + (p.t === 'cut' ? ' pick-cut' : '');
    b.dataset.i = String(i);
    if (p.t === 'wire') {
      b.dataset.size = p.size;                   // 悬停预览档源（非判定层）
      b.setAttribute('aria-label', (p.dead ? '支路' : '') +
        (p.size === 'S' ? '短' : p.size === 'M' ? '中' : '长') + '导线');
      b.innerHTML = wireSvg(p.size, 96, 44, !!p.dead);
    } else {
      b.setAttribute('aria-label', '拆线卡，剪掉跨接线');
      b.innerHTML = cutSvg(96, 44);
    }
    picksEl.appendChild(b);
  });
}
function renderAnswerbar(q) {                    // 先猜一猜预判行（r4 判定层阶段1——按 kind 渲染按钮组）
  answerbarEl.querySelector('.a-label').textContent = q.kind === 'bright' ? '先猜亮度' : '先猜一猜';
  const box = answerbarEl.querySelector('.a-btns');
  box.innerHTML = '';
  PRED_KINDS[q.kind].forEach(d => {
    const b = document.createElement('button');
    b.className = 'guess-btn';
    b.dataset.guess = d;
    b.setAttribute('aria-label', PRED_LABELS[d]);
    b.innerHTML = predIconSvg(d, 34) + '<span>' + PRED_LABELS[d] + '</span>';
    box.appendChild(b);
  });
  renderPhase(q);
}
function renderPhase(q) {                        // 阶段视觉态：answerbar done+预判钉 chip+元件库 dim 解除
  const done = !!q._predOk;
  answerbarEl.classList.toggle('done', done);
  answerbarEl.classList.add('show');
  answerbarEl.querySelectorAll('.guess-btn').forEach(b => b.classList.remove('picked'));
  if (done) {
    const ok = predBtnAt(q.predAns);
    if (ok) ok.classList.add('picked');
  }
  picksEl.classList.toggle('dim', !done);        // 阶段1 元件库降透明（顺序引导）
  /* 预判钉 chip：钉在判定缺口上方（F3 无缺口=钉在灯下方跨接线近旁） */
  boardEl.querySelectorAll('.pindir').forEach(p => { p.classList.remove('show'); p.innerHTML = ''; });
  if (done) {
    let pin = null, tx = 0, ty = 0;
    if (q.blank >= 0) {
      const gs = slotAt(q.blank);
      const pg = gs && gs.querySelector('.pindir');
      if (pg) {
        const geo = slotGeo(q, q.blank);
        pin = pg; tx = geo.gap.x; ty = geo.gap.y - 42;
      }
    } else {
      const jp = boardEl.querySelector('.jumper');
      const pg = jp && jp.querySelector('.pindir');
      if (pg) { pin = pg; tx = 280; ty = 112; }
    }
    if (pin) {
      pin.setAttribute('transform', 'translate(' + tx + ',' + ty + ')');
      pin.innerHTML = predIconSvg(q.predAns, 40) +
        '<text class="pintxt" x="20" y="52" text-anchor="middle">' + PRED_LABELS[q.predAns] + '</text>';
      pin.classList.add('show');
    }
  }
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderBoard(q); renderPicks(q); renderAnswerbar(q); renderStep();
}

/* ================= 方向级反馈：高亮缺口两端触点（「看看哪里断了」——只亮触点+缺口
   脉动，不亮正确件本体——不泄答案；错反馈/救援共用；F3 无缺口=跨接线轻点） ================= */
function litGapEnds(q) {
  const gs = q.blank >= 0 ? slotAt(q.blank) : null;
  if (!gs) {                                      // F3：短路故障方向=跨接线 nudge
    const jp = boardEl.querySelector('.jumper');
    if (jp) replayAnim(jp.closest('g') || jp, 'nudge');
    return;
  }
  gs.classList.remove('lit'); void gs.offsetWidth;
  gs.classList.add('lit');
  setTimeout(() => { if (gs) gs.classList.remove('lit'); }, (NIGH_MS + 1100) * SPEED);
}
/* 阶段1 方向级反馈：主路走线流光一遍（.trace——拓扑追路径视觉锚，不泄答案） */
function traceMain() {
  const paths = boardEl.querySelectorAll('.slotg[data-type="fix"] .wmain, .slotg[data-type="blank"] .routefaint, .slotg[data-type="bunny"] .routefaint');
  paths.forEach(p => { p.classList.remove('trace'); void p.getBoundingClientRect(); p.classList.add('trace'); });
  setTimeout(() => paths.forEach(p => p.classList.remove('trace')), 2200 * SPEED);
}

/* ================= 「先猜后试」悬停预览虚影（演出层不判定：hover 只显形，
   不改 miss/answer/step；放上即亮=孩子自己比对验证） ================= */
function setPreview(q, size) {
  if (q.blank < 0) return;                        // F3 无缺口不预览
  const gs = slotAt(q.blank);
  if (!gs) return;
  if (!size) { gs.removeAttribute('data-pv'); return; }
  const geo = slotGeo(q, q.blank);
  const e = gapEnds(geo.gap, size);                    // 虚影线长=悬停导线跨距（预览匹配）
  const gw = gs.querySelector('.ghostwire');
  if (gw) {
    gw.setAttribute('x1', String(e[0].x)); gw.setAttribute('y1', String(e[0].y));
    gw.setAttribute('x2', String(e[1].x)); gw.setAttribute('y2', String(e[1].y));
  }
  gs.setAttribute('data-pv', size);
}

/* ================= 开题呈现：新电路板 → 题面句 keyless TTS → 缺口呼吸高亮 → 开放阶段1
   演出锁=真时钟 showUntil（tapPred/tapPart 演出期返 null——测试驱动须轮询等可交互） ================= */
async function presentQuiz() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  renderBoard(q); renderPicks(q); renderAnswerbar(q); renderStep();
  const run = cur, token = ++showRun;
  state.locked = true;
  state.showUntil = Date.now() + q.obsWin * SPEED;   // 真时钟演出锁（题面句窗——总窗口径无尾窗叠加）
  if (cur) KIDS.voice.play(q.obsKey, q.obs);      /* 题面句 clip 化（T46 阶段2：cir_obs_ 章档键，
                                                     落空自动回退 TTS——B 类键） */
  const bs = q.blank >= 0 ? slotAt(q.blank) : null;
  if (bs) replayAnim(bs, 'focus');                // 判定缺口呼吸高亮（当前任务锚）
  await wait(q.obsWin * SPEED);                   /* 4350=estMs(10)+300 / 4005=estMs(9)+300 / 4695=estMs(11)+300（家族 T/H） */
  if (token !== showRun || cur !== run) return;
  state.locked = false;
  lastAct = Date.now();                           /* 题面句完成开放作答（b25 M4：重置 idle 锚） */
  lastDir = Date.now();
}

/* ================= 重听：重播题面句+缺口高亮（user=true 走 3s 节流；
   救援路径 false 不重置 lastAct——契约 B；轻提示不锁输入） ================= */
function reReadObs(user) {
  const q = cur && cur.quizzes[cur.step];
  if (!q || state.won) return false;
  if (cur.flat < 0) return false;                 /* 教学迷你关禁重听（重发=破坏教学时序） */
  if (user) {
    if (Date.now() - lastReplayAt < 3000) return false;   // 3s 节流
    lastReplayAt = Date.now();
  }
  const bs = q.blank >= 0 ? slotAt(q.blank) : null;
  if (bs) replayAnim(bs, 'focus');
  if (cur) KIDS.voice.play(q.obsKey, q.obs);      // 重读题面句（clip 化——T46 阶段2）
  if (user) lastAct = Date.now();                 /* 主动重听重置 idle（救援路径不动——契约 B） */
  return true;
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向：按 phase 分流（阶段1=正确预判按钮 / 阶段2=正确元件——教学期
   泄答案=家族先例，帮→独后撤） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  if (q.phase === 1) pointGhostAt(predBtnAt(q.predAns));
  else pointGhostAt(pickAt(correctPick(q)));
}

/* ================= 落位+通电（放对主演出——拓扑揭示）
   placeWire=判定槽导线弹入（.closed+wirepiece 跨距线段）；powerOn=灯亮（.lamp.on
   ——串联板 +.dim 弱光）+电流粒子环流（.flowing 全环）；引擎真值源 q.slots[*].on
   （engTapPart 终点落位）——契约 M ================= */
function placeWire(q, k, size) {
  const gs = slotAt(k);
  if (!gs) return;
  const geo = slotGeo(q, k);
  const e = gapEnds(geo.gap, size);
  const old = gs.querySelector('.wirepiece');
  if (old) old.remove();
  gs.insertAdjacentHTML('beforeend', pieceSvg(e[0], e[1]));
  gs.removeAttribute('data-pv');                  // 撤悬停虚影
  void gs.offsetWidth;
  gs.classList.remove('focus', 'breathe');
  gs.classList.add('closed', 'pop');
  gs.dataset.part = size;                         // 渲染即引擎：落位导线档
  if (qHasDeadGap(q)) spinFan();                  // 死支路缺口闭合=小风扇转（支路负载指示）
}
function spinFan() {
  const f = boardEl.querySelector('.fan');
  if (f) f.classList.add('spin');
}
function powerOn(q) {
  const dim = q.kind === 'bright' && !q.branch;   // 串联两灯=弱光（亮度判断演示锚）
  boardEl.querySelectorAll('.lamp').forEach(l => {
    l.classList.add('on');
    if (dim) l.classList.add('dim');
  });
  boardEl.querySelectorAll('.flowpath').forEach(f => f.classList.add('flowing'));   // 电流粒子环流
}
function closeMainSwitch() {
  boardEl.querySelectorAll('.swmaing .sw').forEach(s => s.classList.add('closed'));
}
function closeBranchSwitch() {
  const b = boardEl.querySelector('.branchg .sw');
  if (b) b.classList.add('closed');
}
function openBranchSwitch() {                     // SW1 短路禁合教学：支路开关自动弹开
  const b = boardEl.querySelector('.branchg .sw');
  if (b) { b.classList.remove('closed'); replayAnim(b.closest('g') || b, 'nudge'); }
}
function removeJumper() {                         // F3 拆线：跨接线剪断淡出
  const j = boardEl.querySelector('.jumper');
  if (j) j.classList.add('gone');
}

/* ================= 阶段1 预判答主路径（真实点击 / CIR.tapPred / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（answerbar 容器 bump / 按钮 rej——家族 D）；演出锁真时钟；
   豁免窗 guard（I 补：错答吞/对答放行）========== */
async function uiTapPred(d, demo) {
  if (!cur || state.won) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }
  if (!demo && (state.locked || state.demo || Date.now() < state.showUntil)) {
    sfx('pop');                                   /* 演出锁（真时钟）：吞+轻叮+bump */
    replayAnim(boardEl, 'bump');
    return null;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  if (PRED_KINDS[q.kind].indexOf(d) < 0) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }   // 非法选项
  /* b31 家族 I 补口径：错链豁免窗（真时钟）内错答吞——pop+bump 不计 miss；对答放行 */
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil && d !== q.predAns) {
    sfx('pop'); replayAnim(boardEl, 'bump'); return false;
  }
  const run = cur, token = showRun;               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapPred(cur, d);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }
  const btn = predBtnAt(d);

  if (r === 'wrong') {                            /* 预判答错：专向反馈 miss（不泄答案）+错链+视觉梯度 */
    const isBright = q.kind === 'bright';
    const chainWin = isBright ? BRIGHT_CHAIN_WIN : PRED_CHAIN_WIN;
    const lock1 = isBright ? BRIGHT_LOCK_1 : PRED_LOCK_1;
    const lock = q._miss === 1 ? lock1 : WRONG_LOCK_2;
    state.locked = true;
    state.showUntil = Date.now() + lock * SPEED;  /* 首错锁=clip+150 顶格（b37 R3 收窄——不叠尾窗） */
    dodgeLo();
    if (btn) replayAnim(btn, 'rej');
    traceMain();                                  /* 方向级：主路走线流光一遍（拓扑追路径视觉锚） */
    const vk = isBright ? VOICE.brightWrong : VOICE.predWrong;
    if (sayW([vk.key, VOICE.hint.key]))           /* 错链全 clip 无 keyless（契约 N） */
      wrongChainUntil = Date.now() + chainWin;    /* 链豁免：pred 5490 / bright 4962 真时钟（契约 I） */
    if (q._miss >= 2) {                           /* miss≥2=正确预判按钮 breathe（答案级梯度） */
      const okBtn = predBtnAt(q.predAns);
      if (okBtn) replayAnim(okBtn, 'breathe');
    }
    await wait(lock * SPEED);
    if (cur !== run || token !== showRun) return r;
    state.locked = false;
    return r;
  }

  /* ---- ok（预判答对：钉 chip+短锁→进阶段2；ch2 续合开关亮真相 REVEAL_MS） ---- */
  lastAct = Date.now();                           /* 正确答重置救援钟（§0.7a） */
  state.locked = true;
  state.showUntil = Date.now() + PRED_OK_MS * SPEED + 140;
  renderPhase(q);                                 /* answerbar done+预判钉 chip+元件库亮起 */
  chimeGoal();
  await wait(PRED_OK_MS * SPEED);
  if (cur !== run || token !== showRun) return r;
  if (state.tut === 'help') pointHelpNext();      /* 教学"帮"两步：答对预判→指向正确元件 */
  if (q.kind === 'fault') {                       /* ch2 即时验证：合开关亮真相（REVEAL_MS 锁窗） */
    state.showUntil = Date.now() + REVEAL_MS * SPEED;
    closeMainSwitch();
    if (q.litAns) setTimeout(() => {
      if (cur && cur.quizzes[cur.step] === q) powerOn(q);   /* F2 主环完好=合上即亮 */
    }, 300 * SPEED);
    await wait(REVEAL_MS * SPEED);
    if (cur !== run || token !== showRun) return r;
    state.locked = false;
    return r;
  }
  state.locked = false;
  return r;
}

/* ================= 阶段2 放元件主路径（真实点击 / CIR.tapPart / autoSolve / 教学演示共用）
   双答制顺序守卫：阶段1 未答对=吞+轻叮 null；演出锁真时钟；豁免窗 guard ========== */
async function uiTapPart(i, demo) {
  if (!cur || state.won) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }
  if (!demo && (state.locked || state.demo || Date.now() < state.showUntil)) {
    sfx('pop');                                   /* 演出锁（真时钟）：吞+轻叮+bump */
    replayAnim(boardEl, 'bump');
    return null;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.picks.length) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }   // 越界
  if (q._answered) return null;
  /* b31 家族 I 补口径：错链豁免窗（真时钟）内错点吞——pop+bump 不计 miss；
     对选放行（缓解吞输入急性子观察）；窗后二错照常计 miss（miss≥2 梯度可达） */
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil && i !== q.answer) {
    sfx('pop'); replayAnim(boardEl, 'bump'); return false;
  }
  const run = cur, token = showRun;               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapPart(cur, i);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }
  const pickBtn = pickAt(i);

  if (r === 'wrong') {                            /* 放错：干扰跨距/死支路元件/拆线卡题选线——抖动+错链+视觉梯度 */
    state.locked = true;
    state.showUntil = Date.now() + (q._miss === 1 ? WRONG_LOCK_1 : WRONG_LOCK_2) * SPEED;   /* 首错锁 1998=1848+150 顶格（b37 R3+b38 R1 总窗口径：锁=常量×SPEED 禁叠尾窗常数） */
    dodgeLo();
    if (pickBtn) replayAnim(pickBtn, 'rej');
    litGapEnds(q);                                /* 方向级：高亮缺口两端触点（F3=跨接线轻点；不亮正确件本体） */
    if (sayW([VOICE.wrong.key, VOICE.hint.key]))  /* 错链全 clip 无 keyless（契约 N） */
      wrongChainUntil = Date.now() + WRONG_CHAIN_WIN;   /* 链豁免：1848+150+1968+300=4266 真时钟（契约 I） */
    if (q._miss >= 2) {                           /* miss≥2=判定缺口 breathe（答案级梯度；F3=拆线卡 breathe） */
      if (q.blank >= 0) {
        const bs = slotAt(q.blank);
        if (bs) replayAnim(bs, 'breathe');
      } else if (pickBtn) {
        replayAnim(pickAt(q.answer), 'breathe');
      }
    }
    await wait((q._miss === 1 ? WRONG_LOCK_1 : WRONG_LOCK_2) * SPEED);
    if (cur !== run || token !== showRun) return r;
    state.locked = false;
    return r;
  }

  /* ---- lit / done（放对：拓扑揭示演出——四题型分镜；确认链单 clip） ---- */
  lastAct = Date.now();                           /* 正确选择重置救援钟（§0.7a） */
  if (state.tut === 'help') {                     /* 教学"独"：首次放对 → 放手 */
    state.tut = 'solo';
    window.__cirTutSolo = true;                   /* 帮→独实证（verify 单元②断言；solo 为瞬时态） */
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  const isCut = isCutQ(q);
  state.showUntil = Date.now() + (isCut ? CUT_MS + FLOW_MS : LIT_MS + FLOW_MS) * SPEED;
  chimeGoal();
  sfx('coin');
  KIDS.voice.queue([VOICE.right.key]);            /* 确认链：小灯泡亮啦（单 clip 1968——契约 N） */
  const guardQ = () => !cur || !cur.quizzes || cur.quizzes[cur.step - 1] !== q;   // 身份守卫（换题/换关中止在途）
  if (isCut) {                                    /* F3 拆线：剪断跨接线→灯亮 */
    removeJumper();
    setTimeout(() => { if (!guardQ()) powerOn(q); }, 700 * SPEED);
    await wait(CUT_MS * SPEED);
    if (cur !== run) return r;
    await wait(FLOW_MS * SPEED);
    if (cur !== run) return r;
  } else if (q.kind === 'switch') {               /* 开关因果：修好→合开关→亮/不亮真相 */
    placeWire(q, q.blank, q.need);
    setTimeout(() => {
      if (guardQ()) return;
      if (q.sw) closeMainSwitch(); else closeBranchSwitch();   /* SW3 主路开关 / SW1-2 支路开关 */
    }, 400 * SPEED);
    setTimeout(() => {
      if (guardQ()) return;
      if (q.litAns) powerOn(q);                   /* SW2/SW3：合上即亮 */
    }, 700 * SPEED);
    if (isSwShortQ(q)) {                          /* SW1：合上短路灯暗（真相揭示）→支路开关自动弹开→亮 */
      setTimeout(() => { if (!guardQ()) openBranchSwitch(); }, (700 + REVEAL_MS) * SPEED);
      setTimeout(() => { if (!guardQ()) powerOn(q); }, (700 + REVEAL_MS + 200) * SPEED);
    }
    await wait(LIT_MS * SPEED);
    if (cur !== run) return r;
    await wait(FLOW_MS * SPEED);
    if (cur !== run) return r;
  } else {                                        /* twogap/fault/bright：落位→按分镜亮 */
    placeWire(q, q.blank, q.need);
    const delayLit = (q.kind === 'twogap' && q.litAns === false) ? BUNNY_MS + 250 : 200;
    setTimeout(() => { if (!guardQ()) powerOn(q); }, delayLit * SPEED);   /* A 变体=兔子补齐后才亮 */
    if (q.second) {                               /* 兔子补齐槽延迟实心化（演出层） */
      setTimeout(() => {
        if (guardQ()) return;
        placeWire(q, q.second.i, q.second.size);
      }, BUNNY_MS * SPEED);
    }
    await wait(LIT_MS * SPEED);
    if (cur !== run) return r;
    await wait(FLOW_MS * SPEED);
    if (cur !== run) return r;
  }
  state.locked = false;
  if (r === 'done') {
    if (cur.flat < 0) {                           /* 教学迷你关完成：帮→独后进正式关（watch 期由
                                                     tutorialWatch 接管，不进关） */
      if (state.tut === 'solo') startLevel(firstFlat);
      return 'done';
    }
    winFlow(); return 'done';
  }
  presentQuiz();                                  /* 新电路板开题（SPEC §3 每题一块板） */
  return r;
}

/* ================= 过关推进（全板通电泛光 → celebrate → persistWin → 章末/日末）
   persistWin 抽独立函数：verify 页 KIDS 未 init（save=null）安全跳过，
   verify 单元⑪ init 后=真实写档链（localStorage kidsgame_cir） ================= */
function persistWin(stars) {
  const sv = KIDS._save();
  if (!sv || !sv.levels) return { chapterDone: false };   /* verify 沙盒未 init=安全跳过 */
  return KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
}
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关静态章档 GEN[dch-1]
     （家族 F：genLevel 纯函数确定性——预告与实际恒一致，禁 (ci+1)%4） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
/* 关末全板通电泛光（纯演出层——判定每步即判；FULL_WIN 2400 ≥
   cir_right 1968+300=2268 罩 winFlow 重播；双灯板=双灯全亮+双路环流） */
async function fullShow() {
  if (cur && cur.retries === 0) {
    boardEl.querySelectorAll('.lamp').forEach(l => replayAnim(l, 'breathe'));   // 零错加成：灯泡泛光
  }
  sceneEl.classList.add('panorama');
  boardEl.classList.add('fullglow');
  await wait(FULL_WIN * SPEED);
  sceneEl.classList.remove('panorama');
}
function winFlow() {
  state.won = true;
  state.locked = true;
  showRun++;                                      /* 通关中止在途演出 */
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  sayR(VOICE.right.key, VOICE.right.text);        /* cir_right：小灯泡亮啦（1968ms） */
  if (VERIFY) { persistWin(stars); return; }      // verify 页：不弹层不写档（init 沙盒除外——单元⑪）
  fullShow().then(() => KIDS.ui.celebrate(stars)).then(async () => {
    await wait(400);                              /* 家族 H：celebrate 2620+400=3020 ≥ 1968+300=2268 */
    const pr = persistWin(stars);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });   /* 家族 A：winFlow 传 nextHint(null)（b25 形态定版） */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  showRun++;                                      /* 中止在途演出（重玩/换关） */
  cur = genLevel(flat);
  lastWrongVoice = 0; wrongChainUntil = 0; lastReplayAt = 0;   /* 换关重置节流锚与链豁免（契约 I/J 配套） */
  state = { locked: true, won: false, demo: false, tut: 'none', showUntil: 0 };
  helpRedemo = false;
  lastAct = Date.now();                           /* 开题重置 idle 锚 */
  lastDir = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] &&
                   !(sv.cir && sv.cir.tutSeen);   /* 契约 E：先查教学特例再定行为 */
  if (freshTut) { tutorialWatch(); return; }
  presentQuiz();                                 // 开题演出（verify 页同跑——autoSolve 需其解锁）
}
