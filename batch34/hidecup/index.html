<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>藏猫猫摄像头</title>
<style>
/* ================= 藏猫猫摄像头 hidecup（batch34·扩容批 4）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 经典杯子戏（SPEC-BATCH34 §0.82 + SPEC-R25 难度加深，5-6 岁视觉记忆）：
   动物探头亮相 1.5s → 躲进某杯 → 杯子换位（两杯互换，换位期杯恒盖住）
   → 静止 800ms → 点杯开杯。
   r25 章型：ch1=2杯1换1100ms / ch2=2杯2换1100ms（基线不动）、ch3=3杯2换
   900ms（提速）、ch4 谱=qi0/2/4 4杯4换 + qi1/3 双动物3杯3换（700ms 提速）；
   4 杯走 #cups[data-cups="4"] 缩杯档位（触摸面恒 ≥96×96、不溢出）。
   动物池 5（rabbit/cat/bear/dog/duck，每关一主；dch4 双动物腿另挂一副≠主）。
   触摸目标：杯 wrap ≥96×96、底栏按钮 ≥72；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：桌面垫 + 杯阵 + 问句条 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}
#scene{flex:0 0 auto;position:relative;width:min(640px,94vw);border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F6E2BE 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;gap:2px;padding:10px 14px 12px}
#scene .demo-pet{position:absolute;right:10px;bottom:8px;opacity:0;transform:translateX(24px);
  transition:all .5s cubic-bezier(.2,1.4,.4,1)}
#scene .demo-pet.show{opacity:1;transform:translateX(0)}

/* 桌面（杯站立的桌面线）：暖木色横带 */
#table{width:100%;height:16px;border-radius:12px;background:#E9CD9F;border:2.5px solid #4A3B2E;
  box-shadow:0 3px 0 #D8C9B4;flex:0 0 auto}

/* ---------- 杯阵（换位动画区） ----------
   .cup-wrap = 一只杯（绝对定位，left 由 JS 按 slot 设置；transition-duration
   由 JS 逐次设定=换位动画时长，verify 页乘 SPEED 同步缩短——契约 M 帧断言
   在换位结束后读 rect 需过渡已完成）；data-cup=杯身份 / data-pos=当前位置
   （演出器逐次互换=帧内容相位标签锚）。
   .peek = 杯后小动物（z 低于杯身，translateY 升起=探头亮相；挂在 start 杯
   wrap 内随杯走——换位期动物随杯移动，视觉一致不泄最终位）。 */
#cups{position:relative;width:100%;height:230px;flex:0 0 auto}
#cups.bump{animation:hc-bump .22s ease}
@keyframes hc-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
#cups.wig{animation:hc-wig .5s ease}
@keyframes hc-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}
  50%{transform:translateX(9px)}75%{transform:translateX(-6px)}}
.cup-wrap{position:absolute;bottom:6px;width:170px;height:200px;transition:left 1.1s cubic-bezier(.5,.05,.3,1)}
/* r25 4 杯档位适配（dch4 量域腿 c=4）：杯缩窄排一行——桌面 slot 612/4=153、
   竖屏 432/4=108，wrap 138/102 < slot 保证不溢出；触摸面恒 ≥96×96（竖屏
   wrap 102×150 为下限）；peek/杯 svg 等比缩（藏态顶边 < 杯口高=恒被盖住） */
#cups[data-cups="4"] .cup-wrap{width:138px;height:172px}
#cups[data-cups="4"] .cup-wrap .cup svg{width:106px;height:122px}
#cups[data-cups="4"] .cup-wrap .peek{width:88px;height:88px;bottom:84px}
/* peek 三态几何（杯高 150 顶边即 wrap 150px 线）：
   藏 translateY(88%)（下移 93px，顶边 123px<150 全被杯遮）/ 亮相 up translateY(2%)
   （顶边 214px，探头 64px）/ 蹦出 found translateY(-30%)（顶边 248px 露全身） */
.cup-wrap .peek{position:absolute;left:50%;bottom:110px;width:106px;height:106px;
  transform:translate(-50%,88%);transition:transform .4s cubic-bezier(.3,1.3,.5,1);z-index:1}
.cup-wrap .peek.up{transform:translate(-50%,2%)}
.cup-wrap .cup{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:2;
  transition:transform .5s cubic-bezier(.35,1.2,.5,1)}
.cup-wrap .cup svg{width:130px;height:150px}
.cup-wrap.pop{animation:cup-in .45s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes cup-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
/* 开杯（错=空开：杯身抬起露出空底，随后盖回） */
.cup-wrap.opened .cup{transform:translateX(-50%) translateY(-52px) rotate(-7deg)}
/* 开杯（对=动物蹦出：杯身抬起+动物弹跳） */
.cup-wrap.found .cup{transform:translateX(-50%) translateY(-56px) rotate(6deg)}
.cup-wrap.found .peek{transform:translate(-50%,-30%);animation:hc-hop .5s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes hc-hop{0%,100%{margin-bottom:0}50%{margin-bottom:16px}}
.cup-wrap.breathe{animation:cup-br 1.2s ease-in-out infinite}
@keyframes cup-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.05)}}
.cup-wrap:active .cup{transform:translateX(-50%) translateY(-4px)}
.cup-wrap.opened:active .cup,.cup-wrap.found:active .cup{transform:translateX(-50%) translateY(-52px) rotate(-7deg)}

/* 问句条（纯文字不播——本款无问句 clip，玩法自明） */
#q-text{font-size:21px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4;flex:0 0 auto}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:76px;height:76px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:44px;height:44px}
#btn-replay.bounce{animation:rep-b .4s ease}
@keyframes rep-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-33） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：舞台收紧，杯触摸面仍 ≥96 */
@media (orientation:portrait){
  #scene{width:min(460px,96vw)}
  #cups{height:206px}
  .cup-wrap{width:150px;height:180px}
  .cup-wrap .cup svg{width:114px;height:132px}
  .cup-wrap .peek{width:94px;height:94px;bottom:56px}
  #cups[data-cups="4"] .cup-wrap{width:102px;height:150px}
  #cups[data-cups="4"] .cup-wrap .cup svg{width:80px;height:92px}
  #cups[data-cups="4"] .cup-wrap .peek{width:76px;height:76px;bottom:50px}
  #q-text{font-size:18px;padding:3px 14px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="藏猫猫摄像头">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="藏猫猫舞台，小动物藏在杯子里">
      <div id="cups" aria-label="杯子"></div>
      <div id="q-text">小动物藏在哪里呀</div>
      <div id="table" aria-hidden="true"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再看一遍换杯子"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

/* ================= hidecup 纯引擎：确定性关卡生成 + 点杯判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 311)（本款常量 311，SPEC-BATCH34 §0.82 定版）：
   同 flat 永远同关（重玩一致、verify 可检）。
   章型（SPEC-BATCH34 §0.82 + SPEC-R25 §R2；进度章号单调递增、难度章号 dch=1+flat//5 静态四档）：
     dch1 c=2 s=1 / dch2 c=2 s=2 / dch3 c=3 s=2（r25 提速 900ms）/ dch4 谱=
     qi0/2/4 hide c=4 s=4 + qi1/3 hidedual c=3 s=3（r25：4杯4换+双动物+700ms）
     生成关（flat≥20）dch=ri(rnd,1,4) seeded 随机（域全档成立型——b33 硬性②）
   swaps 真值约束：每对 (a,b) a≠b 且 ⊆[0,c)；相邻两次换位至少一杯不同
   （数值对不全等——禁连续同一对回滚式假换；c=2 唯一可行解=数值交替
   (0,1)/(1,0)，c=3+ 优先异集合对）。
   answer=动物初始杯下标 start 经 swaps 逐次互换推导（derive 独立函数——
   verify 从 start+swaps 复算=对账锚，禁读 quiz.answer 直比）。hidedual（r25）
   双动物双答案 answerA/answerB 各自推导（双射恒推互异），q.answer=当前步
   真值（phase 0=A / 'half' 后引擎置=B）。
   quiz 结构：hide { kind, cups, swaps, start, answer, anim, _miss, _answered } /
   hidedual { kind, cups, swaps, startA/startB, answerA/answerB, animA/animB,
   phase, start/answer/anim(兼容面), _miss, _answered }
   铁律：每关 5 题；每关一主（level 级 anim，全题共用）+仅 dch4 一副（anim2≠主，
   双动物腿出场，其余不出场）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- answer 推导（对账锚：动物随杯走，位置跟踪模型）
   swap [a,b] 互换位置 a、b 的两杯——动物杯在位置 a 则到 b，在 b 则到 a ---------- */
function derive(start, swaps) {
  let p = start;
  for (let k = 0; k < swaps.length; k++) {
    const sw = swaps[k];
    if (p === sw[0]) p = sw[1];
    else if (p === sw[1]) p = sw[0];
  }
  return p;
}
/* ---------- swaps 生成：相邻两次至少一杯不同（禁连续同一对回滚式假换）
   c=3+ 优先异集合候选（更强防假换）；c=2 集合恒同 → 数值交替 (0,1)/(1,0) ---------- */
function genSwaps(c, s, rnd) {
  const swaps = [];
  let prev = null;
  const norm = p => p[0] < p[1] ? p[0] + ',' + p[1] : p[1] + ',' + p[0];
  for (let k = 0; k < s; k++) {
    const all = [];
    for (let a = 0; a < c; a++) for (let b = 0; b < c; b++) if (a !== b) all.push([a, b]);
    let cand = prev ? all.filter(p => norm(p) !== norm(prev)) : all;          // 优先异集合
    if (!cand.length)
      cand = all.filter(p => !(p[0] === prev[0] && p[1] === prev[1]));       // c=2：数值交替
    const p = cand[Math.floor(rnd() * cand.length)];
    swaps.push([p[0], p[1]]);
    prev = p;
  }
  return swaps;
}

/* ---------- 单题构建（SPEC-R25 §R3：dch4 按 DUAL_KINDS[qi] 分腿） ---------- */
function buildQuiz(dch, qi, rnd, anim, anim2) {
  const cfg = CH_CFG[dch];
  if (dch === 4 && DUAL_KINDS[qi] === 'hidedual') {
    /* 双动物腿：c=3 s=3（量域留旧 dch4 域——负荷在双轨迹不在杯数）；
       startA/startB 压缩采样互异（startB>=startA 则 +1，不耗重掷）；
       一串 swaps 两动物共用（同串换位各自追踪）；双射恒推 answerA≠answerB */
    const c = cfg.dc, s = cfg.ds;
    const startA = ri(rnd, 0, c - 1);
    let startB = ri(rnd, 0, c - 2);
    if (startB >= startA) startB++;
    const swaps = genSwaps(c, s, rnd);
    return { kind: 'hidedual', cups: c, swaps: swaps,
             startA: startA, startB: startB,
             answerA: derive(startA, swaps), answerB: derive(startB, swaps),
             animA: anim, animB: anim2, phase: 0,
             start: startA, answer: derive(startA, swaps),   /* 兼容面：answer 恒=当前步真值（phase0=A） */
             anim: anim, _miss: 0, _answered: false };
  }
  const c = cfg.c, s = cfg.s;
  const start = ri(rnd, 0, c - 1);
  const swaps = genSwaps(c, s, rnd);
  return { kind: 'hide', cups: c, start: start, swaps: swaps,
           answer: derive(start, swaps), anim: anim, _miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关
   随机章参数 dch=ri(rnd,1,4) 先取数保确定性；每关一主=level 级动物（池 5 随机） ---------- */
/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关
   随机章参数 dch=ri(rnd,1,4) 先取数保确定性；每关一主=level 级动物（池 5 随机）。
   r25：anim2（关副，≠主，同掷定值替换不耗种子）**仅 dch===4 取数**——
   dch1-3 rnd 消耗序列与 r25 前逐位一致（基线真不动） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 311);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const anim = ANIMALS[Math.floor(rnd() * ANIMALS.length)];  // 每关一主（先取数保确定性）
  let anim2 = null;                                          // 每关一副（仅 dch4 双动物腿出场）
  if (dch === 4) {
    anim2 = ANIMALS[Math.floor(rnd() * ANIMALS.length)];
    if (anim2 === anim) anim2 = ANIMALS[(ANIMALS.indexOf(anim) + 1) % ANIMALS.length];   // 同掷定值替换
  }
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(dch, qi, rnd, anim, anim2));
  return { flat: flat, ch: ch, dch: dch, lv: lv, anim: anim, anim2: anim2,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点杯引擎（无 DOM）：engTapCup(L, i) —— 点当前位置 i 的杯
   'right' 开对且本题完成推进 / 'done' 开对且末题=通关
   'half'  双动物第一步对（r25）：phase 0→1 切第二问，不置 _answered 不推 step
          （q.answer 同步=answerB——autoSolve/救援/豁免窗 guard 共用单一口径）
   'wrong' 开空：该题 miss+1（retries 全关累计=星级口径），杯盖回可重点（探索不罚）
   null    非法下标 / 关卡已结束 / 本题已答 ---------- */
function engTapCup(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.cups) return null;
  if (i === q.answer) {
    if (q.kind === 'hidedual' && q.phase === 0) {
      q.phase = 1;
      q.answer = q.answerB;              /* 当前步真值切 B（breathe/guard/autoSolve 自动 phase 感知） */
      return 'half';
    }
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（§0.82 miss 口径）：全关开空 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：当前题正确杯位置（=q.answer，独立函数供 verify 复核） */
const correctIdx = q => !q ? -1 : q.answer;

/* ---------- 结构校验（verify 用，返回失败原因或 null）：章型 c/s 真值表（r25：
   dch4 谱=hide c4s4 / hidedual c3s3 按 DUAL_KINDS[qi] 分腿——关级谱构成断言在
   game-verify ③ 聚合，此处单题） / swaps 形状域（a≠b ⊆[0,c)）/ 相邻对非全等
   （禁假换）/ answer=derive 复算（hidedual 双答案复算互异）/ 动物池封闭 /
   初始态干净 ---------- */
function structWhy(q, dch, qi) {
  if (!q) return 'quiz';
  const cfg = CH_CFG[dch];
  if (!cfg) return 'dch';
  if (q.kind === 'hidedual') {                       /* r25 双动物腿（仅 dch4 谱位） */
    if (dch !== 4 || DUAL_KINDS[qi] !== 'hidedual') return 'dualPos';
    if (q.cups !== cfg.dc) return 'cups';
    if (!Array.isArray(q.swaps) || q.swaps.length !== cfg.ds) return 'swapsLen';
    const why = swapShapeWhy(q);
    if (why) return why;
    for (const s of ['startA', 'startB']) {
      if (!Number.isInteger(q[s]) || q[s] < 0 || q[s] >= q.cups) return s + 'Range';
    }
    if (q.startA === q.startB) return 'startSame';               // 两动物不同杯
    if (q.answerA !== derive(q.startA, q.swaps)) return 'answerA';   // 双答案独立复算
    if (q.answerB !== derive(q.startB, q.swaps)) return 'answerB';
    if (q.answerA === q.answerB) return 'answerSame';            // 双射恒推互异
    if (ANIMALS.indexOf(q.animA) < 0 || ANIMALS.indexOf(q.animB) < 0) return 'animPool';
    if (q.animA === q.animB) return 'animSame';                  // 两动物互异（链内无同键连播）
    if (q.phase !== 0) return 'phase';                           // 初始问 A
    if (q.answer !== q.answerA) return 'answer';                 // 兼容面=当前步真值（phase0=A）
    if (ANIMALS.indexOf(q.anim) < 0 || q.anim !== q.animA) return 'anim';
    if (q._miss !== 0 || q._answered) return 'init';
    return null;
  }
  if (q.kind !== 'hide') return 'kind';
  if (q.cups !== cfg.c) return 'cups';
  if (!Array.isArray(q.swaps) || q.swaps.length !== cfg.s) return 'swapsLen';
  const why2 = swapShapeWhy(q);
  if (why2) return why2;
  if (!Number.isInteger(q.start) || q.start < 0 || q.start >= q.cups) return 'startRange';
  if (q.answer !== derive(q.start, q.swaps)) return 'answer';     // answer 推导自洽
  if (ANIMALS.indexOf(q.anim) < 0) return 'anim';                 // 动物池封闭
  if (q._miss !== 0 || q._answered) return 'init';
  return null;
}
/* swaps 形状域公共段（两 kind 共用）：a≠b ⊆[0,c) / 相邻对非全等（禁假换） */
function swapShapeWhy(q) {
  for (let k = 0; k < q.swaps.length; k++) {
    const sw = q.swaps[k];
    if (!Array.isArray(sw) || sw.length !== 2) return 'swapShape';
    if (!Number.isInteger(sw[0]) || !Number.isInteger(sw[1])) return 'swapInt';
    if (sw[0] === sw[1]) return 'swapSame';                       // a≠b
    if (sw[0] < 0 || sw[0] >= q.cups || sw[1] < 0 || sw[1] >= q.cups) return 'swapRange';
    if (k > 0) {
      const pv = q.swaps[k - 1];
      if (sw[0] === pv[0] && sw[1] === pv[1]) return 'swapRepeat';   // 同序重复=假换
      if (q.cups >= 3 && sw[0] === pv[1] && sw[1] === pv[0]) return 'swapBack';   // c>=3 同集合反向=真回滚（SPEC §5 裁决；c=2 数值交替例外）
    }
  }
  return null;
}
/* ================= hidecup 主逻辑（亮相→躲杯→换位→静止→点杯开杯）
   开题演出（presentQuiz）：动物探头亮相 1.5s（peek 升起 CSS）→ 缩回杯内 400ms

   → 换位演出（swaps 逐次两杯互换，速度按档 swapMsOf：dch1/2=1100/dch3=900/

   SHOW_WIN_DUAL 5400）+两只轮流探头（3800ms 窗）+q-text 双名；第一步点对=
   'half'（A found+链 [hc_right,hc_n_A,hc_n_B] 窗 HALF_WIN 5800+q-text 切 B 名）

   测试驱动须轮询等可交互）。
   点对=杯抬+动物蹦出+确认链 [hc_right, hc_n_<id>]（全 clip 无 keyless——契约 N）
   演出窗 1600+3000=4600 ≥ 2232+150+1440+300=4122（家族 G/H）；教学演示窗
   1600+2450=4050 ≥ 2232+150+1368+300=4050（rabbit 名音）。

   真时钟，契约 I）+首错杯阵整体 wiggle（方向级不指杯）/miss≥2 正确杯 breathe（答案级）。

   验收钩子：window.HC = { get currentLevel, get quiz{kind,cups,swaps,start,answer,
   anim,step,miss,(dual:startA/B,answerA/B,animA/B,phase)}, tapCup(i), start(flat),

   tapCup 返回：对且非末题 'right' / 对且末题 'done' / dual 第一步对 'half'（r25）/
   错 'wrong' / 豁免窗内错点吞 false / 换位演出期 null（真时钟锁）/ 越界·已答·无题 null。 */

/* ================= 渲染 ================= */
function layoutCups() {                          // 按当前位置布杯（slot 均布居中）
  const W = cupsEl.clientWidth || 560;
  const n = (window.__hcPerm || []).length;

    const pos = Number(w.dataset.pos), wrapW = w.offsetWidth || 170;

  });
}
function renderCups(q) {                         // 杯阵初始排列（identity）+动物挂 start 杯随杯走
  cupsEl.innerHTML = '';                         // r25 hidedual：A/B 各挂 startA/startB 杯（两只随杯走）

    ? (cupId === q.startA ? q.animA : (cupId === q.startB ? q.animB : null))

}

function renderQuiz() {

/* r25 q-text 动态：hide=通用问句 / hidedual 按 phase=当前问的动物名（pre-literate
   由亮相名音链预告，文字为陪读锚） */
function setQText(t) { qTextEl.textContent = t; }
const dualQText = (q, phase) => ANIMAL_NAME[phase === 1 ? q.animB : q.animA] + '藏在哪里呀';

/* ================= 换位动画：两杯互换（transition-duration 由 JS 设定=verify 同步提速；
   r25 按档 swapMsOf：dch1/2=1100/dch3=900/dch4=700，教学 1600——Math.round 防
   700×0.12 浮点尾差产出非整串（verify ⑭ 精确断言配套））
   dataset.pos/__hcPerm 即时同步（逻辑排列已定，视觉过渡平滑） ================= */
function doSwapAnim(sw, durMs) {
  const wa = cupWrapAt(sw[0]), wb = cupWrapAt(sw[1]);
  if (!wa || !wb) return;
  const d = Math.round(durMs * SPEED) + 'ms';
  wa.style.transitionDuration = d; wb.style.transitionDuration = d;
  const la = wa.style.left, lb = wb.style.left;
  wa.style.left = lb; wb.style.left = la;
  wa.dataset.pos = sw[1]; wb.dataset.pos = sw[0];
  const t = window.__hcPerm[sw[0]];
  window.__hcPerm[sw[0]] = window.__hcPerm[sw[1]];
  window.__hcPerm[sw[1]] = t;
  whoosh();
}
/* 重演回位：瞬时（无过渡）复位到初始排列（盖住态摆回，重演与初看一致） */
function resetCups(q) {
  cupsEl.querySelectorAll('.cup-wrap').forEach(w => {
    w.style.transitionDuration = '0ms';
    w.dataset.pos = w.dataset.cup;               // identity 复位
  });
  window.__hcPerm = [];
  for (let k = 0; k < q.cups; k++) window.__hcPerm.push(k);
  layoutCups();
  void cupsEl.offsetWidth;                       // 强制 reflow 落定复位，再恢复过渡
  cupsEl.querySelectorAll('.cup-wrap').forEach(w => { w.style.transitionDuration = ''; });
}

/* ================= 开题演出：渲染 → 亮相链+peek → 换位 → 静止 → 开放点选
   演出锁=真时钟 showUntil（tapCup 演出期返 null——测试驱动须轮询等可交互）。
   r25：换位速度按档 swapMsOf(cur.dch)（dch3 900/dch4 700，教学 slow 恒 1600）；
   hidedual 亮相链 3 段 [名音A, 名音B, hc_show]（窗 SHOW_WIN_DUAL）+两只轮流
   探头（A 升 1.1s 收 0.4s → B 同律，与名音链 A→B 顺序对应）；q-text 按 kind。 ================= */
async function presentQuiz(slow) {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  renderQuiz();
  const run = cur, token = ++showRun;
  const dual = q.kind === 'hidedual';
  const swapMs = slow ? SWAP_MS_TUT : swapMsOf(cur.dch);
  const peekTotal = dual ? (PEEK_MS + HIDE_MS) * 2 : PEEK_MS + HIDE_MS;   // dual 两只轮流=3800
  const chainWin = slow ? SHOW_WIN_TUT : (dual ? SHOW_WIN_DUAL : SHOW_WIN);
  const total = chainWin + q.swaps.length * swapMs + STILL_MS;
  state.locked = true;
  state.showUntil = Date.now() + total * SPEED + 140;      // 真时钟演出锁（余量）
  setQText(dual ? (ANIMAL_NAME[q.animA] + '和' + ANIMAL_NAME[q.animB] + '藏在哪里呀') : Q_TEXT);
  if (dual) {
    KIDS.voice.queue([nameClip(q.animA), nameClip(q.animB), VOICE.show.key]);   // 双动物亮相链（3 段全 clip）
    requestAnimationFrame(() => requestAnimationFrame(() => {
      /* m3 竞态守卫（r25 审查挂账②）：双层闭包在 showRun++（重开关卡/通关/重演）后
         仍可能对旧关 wrap——重渲染后 querySelector 命中的是**新关同号杯**——加 'up'
         （非死锁竞态瑕疵）；token/cur 双判与下方 await 点守卫同款（r46 S1 旗标回收
         不变式：++ 到新启动之间旗标恒一致，消费前先验） */
      if (token !== showRun || cur !== run) return;
      const upA = cupsEl.querySelector('.cup-wrap[data-cup="' + q.startA + '"] .peek');
      const upB = cupsEl.querySelector('.cup-wrap[data-cup="' + q.startB + '"] .peek');
      if (upA) {
        upA.classList.add('up');                           // A 先探头（对应名音链首段）
        setTimeout(() => upA.classList.remove('up'), (PEEK_MS - HIDE_MS) * SPEED);
      }
      setTimeout(() => {
        if (token !== showRun || cur !== run) return;   /* B 探头同守卫：A 升起后切关，B 不再对旧 q 探头 */
        if (upB) {
          upB.classList.add('up');                         // B 后探头（对应名音链次段）
          setTimeout(() => upB.classList.remove('up'), (PEEK_MS - HIDE_MS) * SPEED);
        }
      }, PEEK_MS * SPEED);
    }));
  } else {
    KIDS.voice.queue([nameClip(q.anim), VOICE.show.key]);  // 亮相链（T46 化全 clip，原 keyless 尾段→hc_show）
    const peekEl = cupsEl.querySelector('.cup-wrap[data-cup="' + q.start + '"] .peek');
    if (peekEl) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        peekEl.classList.add('up');                        // 探头亮相 1.5s（CSS 升起）
        setTimeout(() => { peekEl.classList.remove('up'); }, (PEEK_MS - HIDE_MS) * SPEED);
      }));
    }
  }
  await wait(peekTotal * SPEED);                           // 亮相+缩回（dual=3800 两只轮流）
  if (token !== showRun || cur !== run) return;
  await wait((chainWin - peekTotal) * SPEED);              // 等亮相链播完（TTS 尾段）
  if (token !== showRun || cur !== run) return;
  for (let k = 0; k < q.swaps.length; k++) {
    doSwapAnim(q.swaps[k], swapMs);                        // 换位（r25 按档：1100/900/700，教学 1600 慢速）
    await wait(swapMs * SPEED);
    if (token !== showRun || cur !== run) return;
  }
  await wait(STILL_MS * SPEED);                            // 换完全场静止 800ms
  if (token !== showRun || cur !== run) return;
  state.locked = false;
  lastAct = Date.now();                                    /* 演出完成开放点选（b25 M4：重置 idle 锚） */
  lastDir = Date.now();
}

/* ================= 重看：同 swaps 重放全程（记忆任务重演不泄答案）
   user=true 走 3s 节流（题面后可点）；救援 false 不重置 lastAct（契约 B）。
   r25：速度同初看（swapMsOf 档位——重演不降难度）；hidedual phase1 重演时
   A 杯 found 先移除（藏回完整重看换位、不露已开杯跟随移动）、演毕恢复
   （已完成步的视觉不吞）——恢复动作在 user=false 救援路径同样不刷 lastAct。 ================= */
async function doReplay(user) {
  const q = cur && cur.quizzes[cur.step];
  if (!q || state.won) return false;
  if (cur.flat < 0) return false;                /* 教学迷你关禁重演（重发=破坏教学时序） */
  if (user) {
    if (Date.now() - lastReplayAt < 3000) return false;   // 3s 节流（SPEC §0.82）
    lastReplayAt = Date.now();
  }
  const run = cur, token = ++showRun;
  const swapMs = swapMsOf(cur.dch);              // r25：与初看同速（1100/900/700）
  const total = RESET_MS + q.swaps.length * swapMs + STILL_MS;
  state.locked = true;
  state.showUntil = Date.now() + total * SPEED + 140;
  const wa = q.kind === 'hidedual' && q.phase === 1
    ? cupsEl.querySelector('.cup-wrap[data-cup="' + q.startA + '"]') : null;
  if (wa) wa.classList.remove('found');          // 重演期 A 藏回（杯身份锚 data-cup 不随 pos 变）
  resetCups(q);                                  // 瞬时回初始排列
  await wait(RESET_MS * SPEED);
  if (token !== showRun || cur !== run) return false;
  for (let k = 0; k < q.swaps.length; k++) {
    doSwapAnim(q.swaps[k], swapMs);              // 同 swaps 重演（与初看一致）
    await wait(swapMs * SPEED);
    if (token !== showRun || cur !== run) return false;
  }
  await wait(STILL_MS * SPEED);
  if (token !== showRun || cur !== run) return false;
  if (wa) wa.classList.add('found');             // 恢复已开 A 杯视觉（第一问已完成）
  state.locked = false;
  if (user) lastAct = Date.now();                /* 主动重看重置 idle（救援路径不动 lastAct——契约 B；r24 审查 M1 防回归锚） */
  return true;
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向：当前题正确杯位置（教学期泄答案=家族先例，帮→独后撤） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];

}

/* ================= 点杯主路径（真实点击 / HC.tapCup / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（杯阵容器 bump 微动效——家族 D）；
   演出锁真时钟（演出期 null）；豁免窗 guard（I 补：错点吞/对选放行）========== */
async function uiTapCup(i, demo) {
  if (!cur || state.won) { sfx('pop'); replayAnim(cupsEl, 'bump'); return null; }
  if (!demo && (state.locked || state.demo || Date.now() < state.showUntil)) {
    sfx('pop');                                  /* 演出锁（真时钟）：吞+轻叮+bump */
    replayAnim(cupsEl, 'bump');
    return null;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.cups) { sfx('pop'); replayAnim(cupsEl, 'bump'); return null; }   // 越界
  if (q._answered) return null;
  /* b31 家族 I 补口径（2026-09-11）：错链豁免窗（真时钟）内错点吞——pop+bump 不计 miss；
     对选放行（缓解吞输入急性子观察）；窗后第二错照常计 miss（miss≥2 梯度可达） */
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil && i !== q.answer) {
    sfx('pop'); replayAnim(cupsEl, 'bump'); return false;
  }
  const run = cur, token = showRun;              /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapCup(cur, i);
  if (r === null) { sfx('pop'); replayAnim(cupsEl, 'bump'); return null; }
  const el = cupWrapAt(i);

  if (r === 'wrong') {                           /* 开空：空开 600+盖回 500+错链两段+视觉梯度 */
    state.locked = true;
    state.showUntil = Date.now() + (OPEN_MS + CLOSE_MS) * SPEED + 140;
    dodgeLo();
    if (el) el.classList.add('opened');          /* 空开（该杯无动物——动物只挂 start 杯） */
    if (sayW([VOICE.wrong.key, VOICE.hint.key]))           /* 错链全 clip 无 keyless（契约 N） */
      wrongChainUntil = Date.now() + WRONG_CHAIN_WIN;      /* 链豁免：1656+150+3048+300=5154 真时钟（契约 I） */
    if (q._miss === 1) replayAnim(cupsEl, 'wig');          /* 方向级：三杯整体 wiggle 不指杯 */
    if (q._miss >= 2) {                                   /* miss≥2=正确杯 breathe（答案级梯度） */
      const ok = cupWrapAt(q.answer);
      if (ok) replayAnim(ok, 'breathe');
    }
    await wait(OPEN_MS * SPEED);
    if (cur !== run || token !== showRun) return r;
    if (el) el.classList.remove('opened');       /* 盖回 */
    await wait(CLOSE_MS * SPEED);
    if (cur !== run || token !== showRun) return r;
    state.locked = false;
    return r;
  }

  /* ---- r25 half（双动物第一步对：A 蹦出+确认链尾名音预告第二问+q-text 切 B，
     不推 step 不置 _answered；窗 HALF_WIN 5800 ≥ 2232+150+1440+150+1440+300=5712） ---- */
  if (r === 'half') {
    state.locked = true;
    state.showUntil = Date.now() + HALF_WIN * SPEED + 140;
    const wa = cupWrapAt(q.answerA);             /* 引擎已切 phase=1（q.answer=answerB），A 位置读 answerA */
    if (wa) { wa.classList.remove('breathe'); wa.classList.add('found'); }
    chimeGoal();
    sfx('coin');
    KIDS.voice.queue([VOICE.right.key, nameClip(q.animA), nameClip(q.animB)]);   /* 确认链 3 段：找到啦+A 名+B 名（链尾=第二问预告） */
    setQText(dualQText(q, 1));                   /* q-text 切『<B名>藏在哪里呀』（视觉先行） */
    await wait(1600 * SPEED);
    if (cur !== run || token !== showRun) return r;
    await wait((HALF_WIN - 1600) * SPEED);       /* 罩 3 段确认链收尾 */
    if (cur !== run || token !== showRun) return r;
    state.locked = false;
    lastAct = Date.now();              /* 审查M2 r25：half 亦是正确作答——解锁即重置救援钟（§0.7a 与
                                          right 路径一致）。不刷则第一问思考 ≥24s 的孩子 half 解锁后
                                          idle 已越 30s，第二问被答案级救援即刻泄题（breathe 指 answerB） */
    return r;
  }

  /* ---- right·done（开对：杯抬+动物蹦出+确认链拼播） ---- */
  lastAct = Date.now();                          /* 正确选择重置救援钟（§0.7a） */
  if (state.tut === 'help') {                    /* 教学"独"：首次选对 → 放手 */
    state.tut = 'solo';
    window.__hcTutSolo = true;                   /* 帮→独实证（verify 单元②断言；solo 为瞬时态） */
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  const celeWin = demo ? TUT_CELE : CELE_MAIN + CELE_TAIL;   /* 教学演示窗 4050=2232+150+1368+300 精确 */
  state.showUntil = Date.now() + celeWin * SPEED + 140;
  if (el) { el.classList.remove('breathe'); el.classList.add('found'); }
  chimeGoal();
  sfx('coin');
  /* 试玩P1 r25：dual 第二步（phase=1 问 B）末步名音须=B——q.anim 兼容字段恒=animA，
     三元分流（不动 q.anim 语义，SPEC §R4 末步名音=当前答案口径） */
  KIDS.voice.queue([VOICE.right.key, nameClip(q.kind === 'hidedual' ? q.animB : q.anim)]);
  await wait(1600 * SPEED);                      /* 杯抬+动物蹦出+确认链主窗 */
  if (cur !== run) return r;
  await wait((demo ? 2450 : 3000) * SPEED);      /* 确认链收尾窗：4600 ≥ 2232+150+1440+300=4122（家族 G/H） */
  if (cur !== run) return r;
  state.locked = false;
  if (r === 'done') {
    if (cur.flat < 0) {                          /* 教学迷你关完成：帮→独后进正式关（watch 期由
                                                   tutorialWatch 接管，不进关） */
      if (state.tut === 'solo') startLevel(firstFlat);
      return 'done';
    }
    winFlow(); return 'done';
  }
  presentQuiz();                                 /* 新题开题（亮相→换位→静止） */
  return r;
}

/* ================= 过关推进（celebrate → persistWin → 章末/日末）
   persistWin 抽独立函数：verify 页 KIDS 未 init（save=null）安全跳过，
   verify 单元⑪ init 后=真实写档链（localStorage kidsgame_hidecup） ================= */
function persistWin(stars) {
  const sv = KIDS._save();
  if (!sv || !sv.levels) return { chapterDone: false };   /* verify 沙盒未 init=安全跳过 */
  return KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
}
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关随机章型 GEN[dch-1]（家族 F：
     genLevel 纯函数确定性，同 flat 恒同 dch——预告与实际章型恒一致，禁 (ci+1)%4） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  showRun++;                                     /* 通关中止在途演出 */
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  sayR(VOICE.right.key, VOICE.right.text);       /* hc_right：找到啦，真棒（2232ms） */
  if (VERIFY) { persistWin(stars); return; }     // verify 页：不弹层不写档（init 沙盒除外——单元⑪）
  KIDS.ui.celebrate(stars).then(async () => {
    await wait(400);                             /* 家族 H：celebrate 2620+400=3020 ≥ 2232+300=2532 */
    const pr = persistWin(stars);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });   /* 家族 A：winFlow 传 nextHint(null)（b25 形态定版） */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  showRun++;                                     /* 中止在途演出（重玩/换关） */
  cur = genLevel(flat);
  lastWrongVoice = 0; wrongChainUntil = 0; lastReplayAt = 0;   /* 换关重置节流锚与链豁免（契约 I/J 配套） */
  state = { locked: true, won: false, demo: false, tut: 'none', quiet: true, showUntil: 0 };
  helpRedemo = false;
  lastAct = Date.now();                          /* 开题重置 idle 锚 */
  lastDir = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] &&
                   !(sv.hidecup && sv.hidecup.tutSeen);   /* 契约 E：先查教学特例再定行为 */
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  presentQuiz();                                 // 开题演出（verify 页同跑——autoSolve 需其解锁）
}

/* ================= 教学迷你关（仅关 1-0 首次，SPEC §1：watch=2 杯 1 换慢速/turn=2 杯 1 换）
   watch=播 hc_tut_watch「看！小动物藏起来啦」→ 兔子亮相躲杯+1 次慢速换位（1600ms）→
   幽灵手指点正确杯 →开对（__hcDemoR）；turn=重立猫猫 2 杯 1 换迷你关「你来试一试」，
   帮（指向正确杯）→首对独（solo）→进正式关。时序（家族 G/H）：
   watch clip 3264 → 延 3564（≥3264+300）→ 开题演出（亮相窗 4200 ≥ rabbit 名音 1368+150+
   estMs('要躲猫猫啦')2325+300=4143 + 慢速换位 1600 + 静止 800）→ ghost 移入 800+press 320
   → demo 演出窗 1600+2450=4050（罩确认链 2232+150+1368+300=4050）→
   turn clip 1824 → 延 2124（≥1824+300）→ presentQuiz 4300+1100+800
   —— watch 段分账 3564+4200+1600+800+800+320+4050=15334 ≤ 16000 ---------- */
function tutWatchLevel() {                       // 双题迷你关：题 0=演示题（demo 开对返回 'right'）
  const mk = (start, anim) => ({ kind: 'hide', cups: 2, swaps: [[0, 1]], start: start,
    answer: derive(start, [[0, 1]]), anim: anim, _miss: 0, _answered: false });
  return { flat: -1, ch: 0, dch: 0, lv: 0, step: 0, retries: 0, done: false, anim: 'rabbit',
           quizzes: [mk(0, 'rabbit'), mk(1, 'cat')] };
}
function tutTurnLevel() {                        // 单题迷你关：猫猫 2 杯 1 换（末题=开对返回 'done'→帮转独）
  return { flat: -1, ch: 0, dch: 0, lv: 0, step: 0, retries: 0, done: false, anim: 'cat',
           quizzes: [{ kind: 'hide', cups: 2, swaps: [[0, 1]], start: 1,
                       answer: 0, anim: 'cat', _miss: 0, _answered: false }] };
}
async function tutorialWatch() {
  const t0w = Date.now();                        // watch 段计时锚（verify 单元② 预算 ≤16s 只罩 watch）
  state = { locked: true, won: false, demo: true, tut: 'watch', quiet: true, showUntil: 0 };
  cur = tutWatchLevel();
  renderQuiz(); renderDots();
  sayR(VOICE.watch.key, VOICE.watch.text);       /* hc_tut_watch：看！小动物藏起来啦（3264ms） */
  await wait(3564 * SPEED);                      /* ≥3264+300=3564：clip 播完再开题演出（不撞头） */
  if (state.tut !== 'watch') return;
  await presentQuiz(true);                       /* 兔子亮相躲杯+1 次慢速换位+静止（demo 吞真实输入） */
  if (state.tut !== 'watch') return;
  const q = cur.quizzes[0];
  const idx = correctIdx(q);
  pointGhostAt(cupWrapAt(idx));                  /* 幽灵手指指向正确杯 */
  await wait(800 * SPEED);
  ghost.press();
  await wait(320 * SPEED);
  const demoR = await uiTapCup(idx, true);       /* demo 通道豁免演出锁（演示吞真实输入） */
  window.__hcDemoR = demoR;                      /* 演示生效证据（§0.27，gate 断言 'right'——终值语义） */
  window.__hcWatchMs = Date.now() - t0w;         /* watch 段实测时长（verify 单元② 家族预算 ≤16s） */
  const sv = KIDS._save() || {};
  sv.hidecup = sv.hidecup || {};
  sv.hidecup.tutSeen = true;
  if (KIDS._save()) KIDS.store.persist();
  /* turn：重立猫猫 2 杯 1 换迷你关「你来试一试」（帮→独），首对放手进正式关 */
  ghost.hide();
  showRun++;                                     /* 显式中止在途（演示 right 的 presentQuiz 新题） */
  cur = tutTurnLevel();
  state = { locked: true, won: false, demo: false, tut: 'help', quiet: true, showUntil: 0 };
  helpRedemo = false;
  lastAct = Date.now();
  lastDir = Date.now();
  renderQuiz(); renderDots();
  state.quiet = false;
  sayR(VOICE.turn.key, VOICE.turn.text);         /* hc_tut_turn：你来试一试（1824ms） */
  await wait(2124 * SPEED);                      /* ≥1824+300=2124 防尾截（turn 后开题演出延） */
  if (cur.flat < 0) await presentQuiz();         /* 猫猫亮相+1 次换位+静止 → 开放点选（demo 已撤可真点） */
  setTimeout(() => {
    if (state.tut === 'help' && cur && cur.quizzes[cur.step]) pointHelpNext();
  }, 600 * SPEED);
}

/* ================= 底栏与舞台交互 ================= */
function hopRabbit() {
  rabbitBtn.classList.remove('hop'); void rabbitBtn.offsetWidth; rabbitBtn.classList.add('hop');
}
rabbitBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur) return;
  hopRabbit();
  if (state.locked || state.demo || state.won) { sfx('pop'); return; }   /* §0.20 三件门+轻反馈 */
  lastAct = Date.now();
  sayR(VOICE.hint.key, VOICE.hint.text);         /* 戳兔子=方向提示：再想一想，看杯子怎么动 */
});
replayBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur || state.locked || state.demo || state.won) return; /* §0.20 演出/教学期重演门 */
  if (cur.flat < 0) return;                      /* 教学迷你关禁重演 */
  lastAct = Date.now();
  replayAnim(replayBtn, 'bounce');
  doReplay(true);                                /* 同 swaps 重放（3s 节流在 doReplay 内） */
});
cupsEl.addEventListener('pointerdown', e => {
  const p = e.target.closest('.cup-wrap');
  if (!p) return;                                // 杯间空白走 stage 空白路径
  e.preventDefault();
  uiTapCup(Number(p.dataset.pos));               /* 点的是当前位置的杯（tapCup 位置语义） */
});
$id('stage').addEventListener('pointerdown', e => {
  if (e.target.closest('.cup-wrap')) return;     // 杯点击已由 cupsEl 处理
  /* 空白/探索点击（含舞台垫非杯区）：10s 节流轻提示（§0.16）；不重置救援钟（§0.7a） */
  e.preventDefault();
  if (VERIFY || !cur) return;
  if (state.locked || state.won || state.demo) { sfx('pop'); return; }   /* 教学/演出期空白轻叮（§0.22） */
  if (Date.now() - lastBlankHint > 10000) {
    lastBlankHint = Date.now();
    sayR(VOICE.hint.key, VOICE.hint.text);       /* 空白探索=方向提示 */
  }
});

/* ================= 无操作看护：14s 方向级（重演换位，lastDir 独立节流锚，
   不重置 lastAct——30s 答案级不被饿死）/ 30s 答案级（正确杯 breathe+重演）/
   教学"帮"5s 重演示 ================= */
function rescueTick() {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  if (Date.now() < state.showUntil) return;      /* 演出锁期不救援 */
  if (Date.now() < wrongChainUntil) return;   /* 错反馈链豁免窗（契约 I）：链播完前救援不掐断 */
  if (document.querySelector('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel')) return;
  /* 面板在场守卫（契约 K）：面板遮挡期救援静默（试玩 P2-3：层在时点击全吞却重播读题） */
  const idle = Date.now() - lastAct;
  if (idle > 30000) {                            /* 答案级：静音也能看见答案线索 */
    const q = cur.quizzes[cur.step];
    if (q) {
      const i = correctIdx(q);
      if (i >= 0) { const ok = cupWrapAt(i); if (ok) replayAnim(ok, 'breathe'); }
      doReplay(false);
    }
    lastAct = Date.now();
    return;
  }
  if (idle > 14000 && Date.now() - lastDir > 14000) {   /* 方向级：重演换位（不动 lastAct） */
    doReplay(false);
    lastDir = Date.now();
    return;
  }
  if (idle > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {
    helpRedemo = true;
    pointHelpNext();
  }
}
setInterval(rescueTick, 1000);   /* 命名函数 rescueTick（契约 K 源码级断言，照 b28 m4） */

/* ================= 启动（verify 分支由 game-verify.js 接管） ================= */
buildStatic();
if (!VERIFY) {
  KIDS.init({ game: 'hidecup', title: '藏猫猫摄像头' });   // 存档键 kidsgame_hidecup（core VER 1.0，家族 C）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  let first = 0;
  for (let i = 0; i < lim; i++) { if (!sv.levels[keys[i]]) { first = i; break; } }
  if (lim > 0 && KIDS.calendar.dayDone(keys)) {  // 今日新关已玩完：收尾画面（可关闭继续重玩）
    KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) });          /* 家族 A：启动处传 lim-1 */
    first = 0;
  }
  firstFlat = first;
  startLevel(first);
}

/* ================= 验收钩子（getter 模式，返回拷贝非活引用；start(flat)=外部切关入口；
   真实页同暴露 window.HC——b29 坑⑥：verify 页独占钩子=驱动假阳性）
   quiz getter 返回快照拷贝（含 start/swaps/answer 真值——verify 从 start+swaps
   独立复算 answer=对账锚）；step=全关题号 0-4（b33 坑①：题号语义，非杯进度）。
   tapCup 返回：对且非末题 'right' / 对且末题 'done' / 错 'wrong' /
   豁免窗内错点吞 false / 换位演出期 null（真时钟锁）/ 越界 null；
   replay()=同 swaps 重放（3s 节流内 false）================= */
window.HC = {
  start(flat) { startLevel(flat); },
  get currentLevel() {
    if (!cur) return null;
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.quizzes.length,
             step: cur.step, done: cur.done, won: state.won,
             miss: cur.retries, stars: engStars(cur), anim: cur.anim };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    const dual = q.kind === 'hidedual';
    return { kind: q.kind,                             /* SPEC §1 钩子契约：'hide'|'hidedual'（r25） */
             cups: q.cups,                             /* 杯数 2|3|4（r25 dch4 量域腿=4） */
             swaps: q.swaps.map(s => s.slice()),       /* 换位对 [a,b][] 真值序列 */
             start: q.start,                           /* 动物初始杯下标（dual=A 兼容面） */
             answer: q.answer,                         /* 经 swaps 推导的动物杯下标（dual=当前步真值） */
             anim: q.anim,                             /* 动物 id（池 5；dual=A 兼容面） */
             startA: dual ? q.startA : undefined,      /* r25 dual：A/B 初始杯（互异） */
             startB: dual ? q.startB : undefined,
             answerA: dual ? q.answerA : undefined,    /* r25 dual：A/B 终位（独立复算对账锚） */
             answerB: dual ? q.answerB : undefined,
             animA: dual ? q.animA : undefined,
             animB: dual ? q.animB : undefined,
             phase: dual ? q.phase : undefined,        /* 0=问 A / 1=问 B */
             step: cur.step,                           /* 全关题号 0-4（b33 坑①） */
             miss: q._miss || 0 };
  },
  tapCup(i) { return uiTapCup(i); },

  const rH = await window.HC.tapCup(q13.answerA);  // 第一步对 → 'half'
  const halfChain = window.__queueHist.slice(hq0).some(h => h.length === 3 &&
    h[0] === 'hc_right' && h[1] === 'hc_n_' + q13.animA && h[2] === 'hc_n_' + q13.animB &&
    h.every(p => typeof p === 'string') && !keylessLast(h));          // 确认链 3 段（链尾名音=第二问预告）
  await unlocked();                                // 等 HALF_WIN 演出锁过
  const q13b = window.HC.quiz;
  const wa13 = cupWrapAt(q13b.answerA);
  const halfOk = rH === 'half' && q13b.phase === 1 && q13b.answer === q13b.answerB &&
    window.HC.currentLevel.step === 1 && q13b.miss === 0 && window.HC.currentLevel.miss === 0 &&
    qTextEl.textContent === (ANIMAL_NAME[q13b.animB] + '藏在哪里呀') &&
    !!wa13 && wa13.classList.contains('found');    // A 杯蹦出态（half 不推 step 不计 miss）
  const rW13 = await window.HC.tapCup(q13b.answerA);   // 第二步错：点 A 已开杯（≠answerB 双射恒）
  await unlocked();
  const wrongB = rW13 === 'wrong' && window.HC.quiz.miss === 1 &&
    window.HC.currentLevel.miss === 1 && window.HC.currentLevel.step === 1;
  const hq1 = window.__queueHist.length;
  const rR13 = await window.HC.tapCup(window.HC.quiz.answer);   // 第二步对（豁免窗内对选放行）→ 推进 qi2
  const rightChain = window.__queueHist.slice(hq1).some(h => h.length === 2 &&
    h[0] === 'hc_right' && h[1] === 'hc_n_' + q13b.animB &&          /* 试玩P1 r25 补断言：
                                                                       末步名音=B（q.anim 兼容字段恒=A，
                                                                       错用则链尾=A 名——修复前盲区） */
    h.every(p => typeof p === 'string') && !keylessLast(h));
  const rightB = rR13 === 'right' && window.HC.currentLevel.step === 2 && rightChain;
  const dualOk = dualForm && qt0 && showDual && halfChain && halfOk && wrongB && rightB;
  if (dualOk) npass++;
  units.dual = { ok: dualOk, form: dualForm, qt0: qt0, showChain: showDual, half: halfOk,
                 chain3: halfChain, wrongB: wrongB, rightB: rightB, rightChain: rightChain, rH: rH };

  /* ---- ⑭ swapSpeed（r25）：提速档实读——doSwapAnim 设定 transitionDuration 终值
     =档位×SPEED 精确整串（1100/900/700×0.12=132/108/84ms——Math.round 配套）。
     m4 修复（r25 审查挂账③）：改取**参与换位的 wrap**（末次 swap 对的两只，
     data-pos 定位）——原 wraps[0] 取 DOM 首杯，首杯不在任一 swap 对中则
     transitionDuration 未被设定（现谱三档首杯恰都参与首换=碰巧通过，隐含依赖） ---- */
  total++;
  async function swapDurCheck(flat, wantMs) {
    startLevel(flat);
    await unlocked();
    const q = window.HC.quiz;                       /* 演毕当前题（swaps 全播完，dataset.pos=终位） */
    const last = q && q.swaps[q.swaps.length - 1];  /* 末次换位对：其两 pos 的 wrap 必被设过 duration */
    const wa = last ? cupWrapAt(last[0]) : null, wb = last ? cupWrapAt(last[1]) : null;
    const want = Math.round(wantMs * SPEED) + 'ms';
    return !!wa && !!wb && wa.style.transitionDuration === want &&
           wb.style.transitionDuration === want;
  }
  const sp2 = await swapDurCheck(5, 1100);         // dch2 基线 1100
  const sp3 = await swapDurCheck(10, 900);         // dch3 提速 900
  const sp4 = await swapDurCheck(15, 700);         // dch4 提速 700（qi0 hide c4s4）
  const spFn = swapMsOf(1) === 1100 && swapMsOf(3) === 900 && swapMsOf(4) === 700;
  const speedOk = sp2 && sp3 && sp4 && spFn;
  if (speedOk) npass++;
  units.swapSpeed = { ok: speedOk, d2: sp2, d3: sp3, d4: sp4, fn: spFn };

  /* ---- ⑮ dualFrame（r25）：hidedual 帧内容（双 host 对位）+重演回归（found 恢复） ---- */
  total++;
  startLevel(15);
  await unlocked();
  await window.HC.tapCup(window.HC.quiz.answer);   // qi0 → qi1（hidedual）
  await unlocked();
  const q15 = window.HC.quiz;
  const perm15 = [];
  for (let k = 0; k < q15.cups; k++) perm15.push(k);
  for (const sw of q15.swaps) { const t = perm15[sw[0]]; perm15[sw[0]] = perm15[sw[1]]; perm15[sw[1]] = t; }
  const hosts15 = Array.from(cupsEl.querySelectorAll('.cup-wrap'))
    .filter(w => w.querySelector('.peek') && w.querySelector('.peek').innerHTML !== '');
  const hostOk15 = hosts15.length === 2 && hosts15.every(w => {          // 双动物挂杯对位（渲染即引擎）
    const cup = Number(w.dataset.cup);
    const expPos = cup === q15.startA ? deriveV(q15.startA, q15.swaps)
                 : (cup === q15.startB ? deriveV(q15.startB, q15.swaps) : -1);
    const expAnim = cup === q15.startA ? q15.animA : q15.animB;
    return Number(w.dataset.pos) === expPos &&
           !!w.querySelector('.peek svg > g[data-anim="' + expAnim + '"]');
  });
  await window.HC.tapCup(q15.answerA);             // half → A found
  await unlocked();
  const waF1 = cupsEl.querySelector('.cup-wrap[data-cup="' + q15.startA + '"]');
  const found1 = !!waF1 && waF1.classList.contains('found');
  const rp15 = await window.HC.replay();           // 重演（user 通道，lastReplayAt=0 开关重置不节流）
  await unlocked();
  const waF2 = cupsEl.querySelector('.cup-wrap[data-cup="' + q15.startA + '"]');
  const found2 = !!waF2 && waF2.classList.contains('found');   // 演毕恢复已开 A 杯视觉
  const permOk15 = Array.isArray(window.__hcPerm) &&
    window.__hcPerm.every((c, p) => c === perm15[p]);           // 重演后排列对账
  const r15 = await window.HC.tapCup(window.HC.quiz.answer);    // 第二步对 → 推进 qi2
  const adv15 = r15 === 'right' && window.HC.currentLevel.step === 2;
  const frameOk15 = hostOk15 && found1 && rp15 === true && found2 && permOk15 && adv15;
  if (frameOk15) npass++;
  units.dualFrame = { ok: frameOk15, hosts: hostOk15, found1: found1, replay: rp15,
                      found2: found2, perm: permOk15, adv: adv15 };

  const out = { game: 'hidecup', total: total, pass: npass, units: units };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__hcVlog = out;                          // 外部断言挂点（任务书钩子）
  document.title = (npass === total) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL ' + (total - npass);
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text 并留播报历史；voice.queue 记录拼播链（__lastQueue+
     __queueHist 全史——right 后下一题亮相链会即时覆盖 __lastQueue，链断言用全史） */
  window.__voiceHist = [];
  window.__queueHist = [];
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) {
    window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null;
    if (k) window.__voiceHist.push(k);
  };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    if (parts) window.__queueHist.push(parts);
    window.__lastVoiceKey = parts && parts.length
      ? (typeof parts[0] === 'string' ? parts[0] : parts[0].key) : null;
  };
  runVerify();
}

</script>
