<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>藏猫猫摄像头</title>
<style>
/* ================= 藏猫猫摄像头 hidecup（batch34·扩容批 4）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 经典杯子戏（SPEC-BATCH34 §0.82 + SPEC-R25 难度加深，5-6 岁视觉记忆）：
   动物探头亮相 1.5s → 躲进某杯 → 杯子换位（两杯互换，换位期杯恒盖住）
   → 静止 800ms → 点杯开杯。
   r25 章型：ch1=2杯1换1100ms / ch2=2杯2换1100ms（基线不动）、ch3=3杯2换
   900ms（提速）、ch4 谱=qi0/2/4 4杯4换 + qi1/3 双动物3杯3换（700ms 提速）；
   4 杯走 #cups[data-cups="4"] 缩杯档位（触摸面恒 ≥96×96、不溢出）。
   动物池 5（rabbit/cat/bear/dog/duck，每关一主；dch4 双动物腿另挂一副≠主）。
   触摸目标：杯 wrap ≥96×96、底栏按钮 ≥72；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：桌面垫 + 杯阵 + 问句条 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}
#scene{flex:0 0 auto;position:relative;width:min(640px,94vw);border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F6E2BE 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;gap:2px;padding:10px 14px 12px}
#scene .demo-pet{position:absolute;right:10px;bottom:8px;opacity:0;transform:translateX(24px);
  transition:all .5s cubic-bezier(.2,1.4,.4,1)}
#scene .demo-pet.show{opacity:1;transform:translateX(0)}

/* 桌面（杯站立的桌面线）：暖木色横带 */
#table{width:100%;height:16px;border-radius:12px;background:#E9CD9F;border:2.5px solid #4A3B2E;
  box-shadow:0 3px 0 #D8C9B4;flex:0 0 auto}

/* ---------- 杯阵（换位动画区） ----------
   .cup-wrap = 一只杯（绝对定位，left 由 JS 按 slot 设置；transition-duration
   由 JS 逐次设定=换位动画时长，verify 页乘 SPEED 同步缩短——契约 M 帧断言
   在换位结束后读 rect 需过渡已完成）；data-cup=杯身份 / data-pos=当前位置
   （演出器逐次互换=帧内容相位标签锚）。
   .peek = 杯后小动物（z 低于杯身，translateY 升起=探头亮相；挂在 start 杯
   wrap 内随杯走——换位期动物随杯移动，视觉一致不泄最终位）。 */
#cups{position:relative;width:100%;height:230px;flex:0 0 auto}
#cups.bump{animation:hc-bump .22s ease}
@keyframes hc-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
#cups.wig{animation:hc-wig .5s ease}
@keyframes hc-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}
  50%{transform:translateX(9px)}75%{transform:translateX(-6px)}}
.cup-wrap{position:absolute;bottom:6px;width:170px;height:200px;transition:left 1.1s cubic-bezier(.5,.05,.3,1)}
/* r25 4 杯档位适配（dch4 量域腿 c=4）：杯缩窄排一行——桌面 slot 612/4=153、
   竖屏 432/4=108，wrap 138/102 < slot 保证不溢出；触摸面恒 ≥96×96（竖屏
   wrap 102×150 为下限）；peek/杯 svg 等比缩（藏态顶边 < 杯口高=恒被盖住） */
#cups[data-cups="4"] .cup-wrap{width:138px;height:172px}
#cups[data-cups="4"] .cup-wrap .cup svg{width:106px;height:122px}
#cups[data-cups="4"] .cup-wrap .peek{width:88px;height:88px;bottom:84px}
/* peek 三态几何（杯高 150 顶边即 wrap 150px 线）：
   藏 translateY(88%)（下移 93px，顶边 123px<150 全被杯遮）/ 亮相 up translateY(2%)
   （顶边 214px，探头 64px）/ 蹦出 found translateY(-30%)（顶边 248px 露全身） */
.cup-wrap .peek{position:absolute;left:50%;bottom:110px;width:106px;height:106px;
  transform:translate(-50%,88%);transition:transform .4s cubic-bezier(.3,1.3,.5,1);z-index:1}
.cup-wrap .peek.up{transform:translate(-50%,2%)}
.cup-wrap .cup{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:2;
  transition:transform .5s cubic-bezier(.35,1.2,.5,1)}
.cup-wrap .cup svg{width:130px;height:150px}
.cup-wrap.pop{animation:cup-in .45s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes cup-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
/* 开杯（错=空开：杯身抬起露出空底，随后盖回） */
.cup-wrap.opened .cup{transform:translateX(-50%) translateY(-52px) rotate(-7deg)}
/* 开杯（对=动物蹦出：杯身抬起+动物弹跳） */
.cup-wrap.found .cup{transform:translateX(-50%) translateY(-56px) rotate(6deg)}
.cup-wrap.found .peek{transform:translate(-50%,-30%);animation:hc-hop .5s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes hc-hop{0%,100%{margin-bottom:0}50%{margin-bottom:16px}}
.cup-wrap.breathe{animation:cup-br 1.2s ease-in-out infinite}
@keyframes cup-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.05)}}
.cup-wrap:active .cup{transform:translateX(-50%) translateY(-4px)}
.cup-wrap.opened:active .cup,.cup-wrap.found:active .cup{transform:translateX(-50%) translateY(-52px) rotate(-7deg)}

/* 问句条（纯文字不播——本款无问句 clip，玩法自明） */
#q-text{font-size:21px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4;flex:0 0 auto}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:76px;height:76px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:44px;height:44px}
#btn-replay.bounce{animation:rep-b .4s ease}
@keyframes rep-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-33） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：舞台收紧，杯触摸面仍 ≥96 */
@media (orientation:portrait){
  #scene{width:min(460px,96vw)}
  #cups{height:206px}
  .cup-wrap{width:150px;height:180px}
  .cup-wrap .cup svg{width:114px;height:132px}
  .cup-wrap .peek{width:94px;height:94px;bottom:56px}
  #cups[data-cups="4"] .cup-wrap{width:102px;height:150px}
  #cups[data-cups="4"] .cup-wrap .cup svg{width:80px;height:92px}
  #cups[data-cups="4"] .cup-wrap .peek{width:76px;height:76px;bottom:50px}
  #q-text{font-size:18px;padding:3px 14px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="藏猫猫摄像头">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="藏猫猫舞台，小动物藏在杯子里">
      <div id="cups" aria-label="杯子"></div>
      <div id="q-text">小动物藏在哪里呀</div>
      <div id="table" aria-hidden="true"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再看一遍换杯子"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
