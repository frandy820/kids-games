<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数据收集员</title>
<style>
/* ================= datacollect r14 难度改造（batch34 · 2026-09-15，7-8 岁信息素养·制表）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   r14 玩法 = 草地场景（动物成对布点——一格=2 只视觉锚）+ 图表每行 15 格槽（8 列 grid 换行）
   + 图例徽章「1格=2只」恒显 + dch4 每类双条带（上次=淡格静态/这次=交互）
   + 数值卡 4 选 1（sum/diff/mostdiff/change/totalchange 读表计算）。
   竖屏双通道：@media(orientation:portrait) 与 body.port 逐条等值两段同步（build 对账+
   verify simView 三件+_selftest P1b 真竖 800×1180）；行标签=div（most 下线不再点选）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：草地场景 + 图表（图例+行×条带）+ 数值卡区 + 题面句 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;overflow:hidden;padding:6px 12px}

/* 草地场景：动物成对布点（.beast 带 data-cat——契约 M 场景对账锚）；
   点动物=数数辅助（pulse 单只），点草地=重听题面（6s 节流） */
#scene{position:relative;flex:1 1 auto;min-height:140px;width:min(640px,94vw);
  border-radius:22px;border:3px solid #4A3B2E;overflow:hidden;
  background:linear-gradient(180deg,#EEF5DA 0%,#DDE9C0 58%,#C9DCAC 100%);
  box-shadow:0 4px 0 #D8C9B4}
#scene .tuft{position:absolute;pointer-events:none}
#scene .beast{position:absolute;transform:translate(-50%,-50%);display:flex;
  align-items:center;justify-content:center;pointer-events:auto}
#scene .beast svg{width:100%;height:auto}
#scene .beast .flip{transform:scaleX(-1)}
#scene .beast.pulse{animation:dc-beast 1.1s ease-in-out 3}
@keyframes dc-beast{0%,100%{filter:none}50%{filter:drop-shadow(0 0 9px rgba(232,151,90,.9))}}
#scene .beast.tick{animation:dc-tick .35s ease}
@keyframes dc-tick{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.16)}}

/* 图表：图例徽章（1格=2只 恒显——r14 换算教学锚）+ 行（div 标签+条带）
   dch4 每类双条带：.band.old=上次静态淡格（lit=scene1/2）/ .band.cur=这次交互（15 格槽） */
#chart{position:relative;flex:0 0 auto;width:min(660px,94vw);border-radius:22px;
  background:linear-gradient(180deg,#FFFDF6 0%,#FBF3E2 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;padding:8px 14px 10px;display:flex;flex-direction:column;
  justify-content:center;gap:6px;max-height:52vh}
#chart.bump{animation:dc-bump .22s ease}
@keyframes dc-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
.legend{display:flex;align-items:center;gap:7px;flex:0 0 auto;
  width:max-content;padding:2px 12px;border-radius:12px;background:#FFF9EE;
  border:2px solid #C9B48A;font-size:12.5px;font-weight:800;color:#6B5A48}
.legend .lg-mini{width:24px;height:24px}
.legend .lg-mini svg{width:24px;height:24px}
.row{display:grid;grid-template-columns:64px 1fr;align-items:center;
  border-radius:12px;padding:2px 4px;transition:background .25s}
.row.ask{background:rgba(232,151,90,.16)}
.rlabel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  width:60px;min-height:44px;border-radius:12px;pointer-events:none;padding:2px}
.rlabel svg{width:30px;height:30px}
.rlabel .rn{font-size:12px;line-height:1;color:#6B5A48;font-weight:700}
.row.ask .rlabel{background:#FFF3DF;border:2.5px solid #E8975A;box-shadow:0 2px 0 #D8C9B4}
.row.ask .rlabel .askq{font-size:11px;line-height:1;color:#E8975A;font-weight:800}
.bands{display:flex;flex-direction:column;gap:3px;padding-left:6px}
.band{display:flex;align-items:center;gap:5px}
.band .btag{flex:0 0 26px;font-size:10.5px;font-weight:800;color:#8A7A64;line-height:1.1;text-align:center}
.band.old .btag{color:#A89C88}
.cells{display:grid;grid-template-columns:repeat(8,40px);gap:4px}
.cell{width:40px;height:40px;border-radius:10px;
  border:2.5px dashed #C9B48A;background:rgba(255,249,238,.5);pointer-events:none;
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
#chart.count .row.ask .band.cur .cell{pointer-events:auto}
#chart.count .row.ask .band.cur .cell:active{transform:scale(.94)}
.cell .mini{width:30px;height:30px;pointer-events:none}
.cell .mini svg{width:30px;height:30px}
.cell.lit{border-style:solid;border-color:#8FBF7F;background:#EFF6E6;
  animation:dc-lit .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes dc-lit{0%{transform:scale(.3)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.band.old .cell.softlit{border-style:solid;border-color:#D8C9B4;background:#F6EFDF;opacity:.62}
.cell.bad{border-style:solid;border-color:#E8483C;background:#FBE3DE;
  animation:dc-bad .7s ease}
@keyframes dc-bad{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}}
.cell.breathe{animation:dc-cell-br 1.2s ease-in-out infinite}
@keyframes dc-cell-br{0%,100%{border-color:#C9B48A;box-shadow:none}
  50%{border-color:#E8975A;border-style:dashed;box-shadow:0 0 12px rgba(232,151,90,.9)}}

/* 数值卡区（sum/diff/mostdiff/change/totalchange 读表计算 4 选 1） */
#cards{flex:0 0 auto;display:none;align-items:center;justify-content:center;gap:14px;
  max-width:94vw;padding:2px 8px}
#cards.show{display:flex}
.ncard{width:96px;height:74px;border-radius:16px;background:#FFF9EE;
  border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;
  font-size:24px;font-weight:800;color:#4A3B2E;
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
.ncard:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
.ncard.wig{animation:dc-wig .4s ease}
@keyframes dc-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
.ncard.lit{border-color:#8FBF7F;background:#EFF6E6;
  animation:dc-card-lit .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes dc-card-lit{0%{transform:scale(.86)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.ncard.breathe{animation:dc-card-br 1.2s ease-in-out infinite}
@keyframes dc-card-br{0%,100%{border-color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
  50%{border-color:#E8975A;box-shadow:0 0 14px rgba(232,151,90,.9)}}

/* 题面句条（7-8 岁文字题面） */
#qbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  max-width:94vw;padding:2px 8px}
#qbar .q-text{font-size:21px;font-weight:700;color:#4A3B2E;padding:4px 20px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}
#qbar.pop .q-text{animation:dc-q-pop .35s ease}
@keyframes dc-q-pop{0%{transform:scale(.9)}55%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:dc-hop .45s ease 2}
@keyframes dc-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:dc-hear .45s ease}
@keyframes dc-hear{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-33） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:dc-g-press .6s ease}
@keyframes dc-g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:dc-g-ripple .6s ease}
@keyframes dc-g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* ---------- 竖屏双通道（@media 与 body.port 逐条等值两段同步——build 对账+verify simView；
   格 36px 仍可触达（7-8 岁精细动作），卡 84px，双条带收窄） ---------- */
@media (orientation:portrait){
#scene{width:min(440px,95vw);min-height:126px}
#chart{width:min(452px,95vw);padding:7px 10px 9px;gap:5px}
.legend{font-size:11.5px;padding:2px 10px}
.rlabel{width:52px}
.rlabel svg{width:26px;height:26px}
.rlabel .rn{font-size:11px}
.cells{grid-template-columns:repeat(8,36px);gap:3px}
.cell{width:36px;height:36px;border-radius:9px}
.cell .mini,.cell .mini svg{width:26px;height:26px}
.ncard{width:84px;height:64px;font-size:20px;border-radius:14px}
#qbar .q-text{font-size:17px;padding:3px 14px}
#btn-rabbit{width:74px;height:74px}
#btn-rabbit svg{width:60px;height:60px}
#btn-replay{width:64px;height:64px}
#btn-hear{width:72px;height:72px}
}
/*PORT-CLS*/
body.port #scene{width:min(440px,95vw);min-height:126px}
body.port #chart{width:min(452px,95vw);padding:7px 10px 9px;gap:5px}
body.port .legend{font-size:11.5px;padding:2px 10px}
body.port .rlabel{width:52px}
body.port .rlabel svg{width:26px;height:26px}
body.port .rlabel .rn{font-size:11px}
body.port .cells{grid-template-columns:repeat(8,36px);gap:3px}
body.port .cell{width:36px;height:36px;border-radius:9px}
body.port .cell .mini,body.port .cell .mini svg{width:26px;height:26px}
body.port .ncard{width:84px;height:64px;font-size:20px;border-radius:14px}
body.port #qbar .q-text{font-size:17px;padding:3px 14px}
body.port #btn-rabbit{width:74px;height:74px}
body.port #btn-rabbit svg{width:60px;height:60px}
body.port #btn-replay{width:64px;height:64px}
body.port #btn-hear{width:72px;height:72px}
/*PORT-CLS-END*/
</style>
</head>
<body>
<div id="game" aria-label="数据收集员">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="草地场景，点小动物帮它蹦一下，点草地再听一遍题目"></div>
    <div id="chart" aria-label="统计表格"></div>
    <div id="cards" aria-label="答案卡"></div>
    <div id="qbar" aria-live="polite"><div class="q-text"></div></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
