<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水果切切</title>
<style>
/* ================= 水果切切 fruitsplit（batch7 · r7 难度改造）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、木案浅色场景、暖橙主色、灰蓝错误色（不用大红）
   五模式：辨识（一半，含一大一小陷阱）/ 等分选择（2/3/4 人选切法）/ 公平判断 /
   切分（点刀→判公平两段）/ 拼合（半块配对）
   触摸目标：大卡 ≥128×148、拼合候选 ≥128×148、小刀按钮 ≥128×128、底栏按钮 ≥64；
   pointerdown 即响应；两半 SVG 由同一路径镜像 + 等宽 clipPath 生成（严格等大）；
   等分切块=扇形中心角相等（构造性等大），不公平展示是题面判断对象非错误示范 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#F2B8C6;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：木案 + 题面 + 模式板 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:6px 10px}
/* 木案：浅木色圆角台面（低干扰装饰条，pointer-events:none） */
#board-wrap{position:relative;width:100%;max-width:1180px;flex:1 1 auto;min-height:200px;
  background:linear-gradient(180deg,#F6ECD9 0%,#F1E3C8 70%,#ECDDBE 100%);
  border:3px solid #DDC9A4;border-radius:26px;overflow:hidden;
  box-shadow:inset 0 0 0 6px rgba(255,249,238,.55)}
#board-wrap .wood{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
#board{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:10px}

/* ---------- 辨识模式：大卡 ---------- */
#cards{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;align-items:stretch;padding:4px}
.card{position:relative;min-width:150px;min-height:170px;padding:10px 14px;border-radius:26px;
  background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:transform .15s,box-shadow .15s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card .art{width:118px;height:118px;display:flex;align-items:center;justify-content:center;gap:5px}
.card .art svg{max-width:100%;max-height:100%}
.card.right{background:#8FBF7F;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.card.right .mark{position:absolute;top:-13px;right:-13px;width:40px;height:40px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.card.right .mark svg{width:26px;height:26px}
@keyframes opt-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.card.wrong{background:#EFE3CD;border-color:#C9BDA8;box-shadow:0 3px 0 #C9BDA8;
  opacity:.55;pointer-events:none;animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.card.pulse{animation:opt-pulse 1s ease 2}
@keyframes opt-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}

/* ---------- 切分模式：大水果 + 小刀 + 两个娃娃 ---------- */
#cut-zone{display:flex;align-items:center;justify-content:center;gap:44px;flex-wrap:wrap;padding:4px}
#fruit-wrap{position:relative;width:250px;height:250px;display:flex;align-items:center;justify-content:center}
#fruit-whole{width:230px;height:230px;transition:opacity .3s,transform .3s}
#fruit-whole.wig{animation:fruit-wig .5s ease}
@keyframes fruit-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}
  55%{transform:rotate(5deg)}80%{transform:rotate(-3deg)}}
#fruit-whole.hide{opacity:0;transform:scale(.9);pointer-events:none}
.fhalf{position:absolute;left:50%;top:50%;width:125px;height:250px;transform:translate(-50%,-50%);
  opacity:0;pointer-events:none}
.fhalf svg{width:100%;height:100%}
.fhalf.go-l{animation:spread-l .6s cubic-bezier(.25,1,.4,1) forwards}
.fhalf.go-r{animation:spread-r .6s cubic-bezier(.25,1,.4,1) forwards}
@keyframes spread-l{0%{opacity:0;transform:translate(-50%,-50%) rotate(0)}
  25%{opacity:1}
  100%{opacity:1;transform:translate(-118%,-50%) rotate(-6deg)}}
@keyframes spread-r{0%{opacity:0;transform:translate(-50%,-50%) rotate(0)}
  25%{opacity:1}
  100%{opacity:1;transform:translate(18%,-50%) rotate(6deg)}}
#btn-knife{width:132px;height:132px;border-radius:28px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #C9A87C;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s;animation:knife-breathe 1.8s ease-in-out infinite}
#btn-knife:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-knife svg{width:92px;height:92px}
#btn-knife.off{display:none}
@keyframes knife-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* 切完：两个娃娃各拿一半 + 语义字幕 */
#cut-result{display:none;align-items:center;justify-content:center;gap:34px;flex-wrap:wrap;padding:4px}
#cut-result.on{display:flex;animation:rise-in .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes rise-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.taker{display:flex;flex-direction:column;align-items:center;gap:4px}
.taker .who{display:flex;align-items:flex-end;gap:2px}
.taker .who svg.doll{width:104px;height:104px}
.taker .who .phalf{width:56px;height:112px;margin-bottom:10px}
.taker .phalf svg{width:100%;height:100%}
#cut-say{min-height:56px;padding:4px 26px;border-radius:20px;background:#FFF9EE;
  border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;font-size:25px;font-weight:800;color:#4A3B2E}

/* ---------- 拼合模式：给半块 + 空槽 + 3 候选 ---------- */
#match-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:4px}
#match-top{display:flex;align-items:center;justify-content:center;gap:22px}
.mhalf{width:124px;height:160px;border-radius:24px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;padding:6px}
.mhalf svg{width:100%;height:100%}
#given-slot .mhalf{background:#F6EEDD;border-style:dashed;box-shadow:none}
#slot{position:relative;background:#FFFDF6}
#slot.dashed{border:3px dashed #C9BDA8;background:#FFFDF6;box-shadow:none}
#slot .seam{position:absolute;left:50%;top:12%;height:76%;border-left:3px dashed rgba(74,59,46,.4);
  transform:translateX(-50%);pointer-events:none}
#slot.lit{background:#8FBF7F;border-color:#6FA063;box-shadow:0 4px 0 #6FA063;animation:opt-pop .5s cubic-bezier(.2,1.6,.4,1)}
.mplus{font-size:52px;font-weight:800;color:#C9BDA8;line-height:1}
.mq{font-size:44px;font-weight:800;color:#E8873A;line-height:1}
#cands{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.mopt{position:relative;min-width:128px;min-height:164px;padding:8px 12px;border-radius:26px;
  background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
.mopt:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.mopt .art{width:104px;height:132px;display:flex;align-items:center;justify-content:center}
.mopt .art svg{width:100%;height:100%}
.mopt.right{background:#8FBF7F;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.mopt.right .mark{position:absolute;top:-13px;right:-13px;width:40px;height:40px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.mopt.right .mark svg{width:26px;height:26px}
.mopt.wrong{background:#EFE3CD;border-color:#C9BDA8;box-shadow:0 3px 0 #C9BDA8;
  opacity:.55;pointer-events:none;animation:shake .42s ease}
.mopt.pulse{animation:opt-pulse 1s ease 2}

/* ---------- r7 choose 等分选择：人数图示 + 主水果 + 切法卡 + 分块演出 ---------- */
#choose-zone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px}
#cho-people{display:flex;gap:8px}
#cho-people .dhead{width:56px;height:56px}
#cho-fruit{width:176px;height:176px;display:flex;align-items:center;justify-content:center}
#cho-fruit>svg{width:164px;height:164px}
.cho-pieces{display:flex;align-items:center;justify-content:center;gap:4px}
.chop{width:66px;height:66px;animation:chop-fly .7s cubic-bezier(.25,1,.4,1) forwards}
.chop svg{width:100%;height:100%}
@keyframes chop-fly{from{transform:translate(-50%,0)}to{transform:translate(calc(-50% + var(--dx)),0)}}
#cho-takers{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;animation:rise-in .5s cubic-bezier(.2,1.5,.4,1)}
.piecehold{width:54px;height:54px;margin-bottom:12px}
.piecehold svg{width:100%;height:100%}
.unevenpair{display:flex;align-items:center;justify-content:center;gap:2px}
.unevenpair svg:first-child{width:34%;height:56%}
.unevenpair svg:last-child{width:58%;height:98%}
.cutcard .art{width:112px;height:112px}

/* ---------- r7 fair 公平判断：两块展示 + 2 娃娃 + 公平/不公平按钮 ---------- */
#fair-zone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px}
#fair-show{display:flex;align-items:center;justify-content:center;gap:26px}
.fpiece{width:122px;height:122px;display:flex;align-items:center;justify-content:center}
.fpiece svg{width:100%;height:100%}
#fair-show.recut .fpiece{animation:opt-pop .5s cubic-bezier(.2,1.6,.4,1)}
#fair-people{display:flex;gap:10px}
#fair-people .dhead{width:56px;height:56px}
#fair-people.happy .dhead,#cut-result.happy .taker{animation:hop2 .45s ease 2}
@keyframes hop2{0%,100%{margin-top:0}50%{margin-top:-12px}}
.fbtn .art{width:110px;height:110px}
#judge-row{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}

/* ---------- 题面行 ---------- */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  min-height:72px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:14px;padding:6px 26px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4}
#prompt-chip .big{font-size:32px;font-weight:800;color:#4A3B2E;line-height:1.25;white-space:nowrap}
#prompt-chip svg.pm{width:46px;height:46px;flex:0 0 46px}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch5 countchick） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：大卡与拼合区适配（gap 收窄、卡宽微降，仍 ≥96 主触摸目标） */
@media (orientation:portrait){
  .card{min-width:140px;min-height:160px;gap:4px}
  .card .art{width:106px;height:106px}
  #cut-zone{gap:26px}
  #fruit-wrap{width:224px;height:224px}
  #fruit-whole{width:206px;height:206px}
  .fhalf{width:112px;height:224px}
  .mhalf{width:112px;height:146px}
  .mopt{min-width:118px;min-height:150px}
  .mopt .art{width:94px;height:120px}
  #prompt-chip .big{font-size:28px}
  #cho-fruit{width:150px;height:150px}
  #cho-fruit>svg{width:140px;height:140px}
  .chop{width:56px;height:56px}
  #cho-people .dhead,#fair-people .dhead{width:48px;height:48px}
  .fpiece{width:104px;height:104px}
  .cutcard .art{width:98px;height:98px}
  .fbtn .art{width:98px;height:98px}
}
</style>
</head>
<body>
<div id="game" aria-label="水果切切">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board-wrap" aria-label="木案">
      <div class="wood" aria-hidden="true"></div>
      <div id="board" aria-label="游戏区"></div>
    </div>
    <div id="prompt">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }

    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }

      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

/* ================= fruitsplit 纯引擎：确定性关卡生成 + 五模式判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   r7 难度改造（AUDIT-56 #11）：切分无对错→全部模式真判定——
   pick   辨识一半（三态卡：整个/一半/一大一小陷阱——"一半"= 等分两块之一，非随便一块）
   choose 等分选择（n=2/3/4 人按人数选切法：halves/thirds/quarters 正确，unfair/wrongN 干扰）
   fair   公平判断（展示等大或一大一小，判断公平/不公平；不公平答对→重切演出）
   cut    切两半（手感保留）→ 判公平（真判定：切完必须点对"公平"才推进）
   match  拼合（半块配对，保留）
   章难度：dch1 [pick,cut,choose,cut,pick] / dch2 [fair,cut,fair,choose,fair]（fair 双态 T,F,T 或 F,T,F）
           dch3 [choose,fair,choose,cut,choose]（人数 3/4）/ dch4 五模式各一洗牌
   生成关（flat≥20）同通道：难度章号 (ch-1)%4+1 循环取材 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致，杜绝生成关软锁）；难度章号四章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 每关 5 题的模式/参数序列（rnd 流顺序固定 → 确定性）
   dch1 对半 / dch2 公平判断（fair 公平+不公平双态都出现）/ dch3 三四等分 / dch4 五模式各一洗牌 */
function modeSpecs(dch, rnd) {
  if (dch === 1) return [
    { mode: 'pick' }, { mode: 'cut' }, { mode: 'choose', parts: 2 },
    { mode: 'cut' }, { mode: 'pick' }];
  if (dch === 2) {
    const f0 = rnd() < 0.5;                        // fair 双态交替：T,F,T 或 F,T,F（两种都出现）
    return [
      { mode: 'fair', fair: f0 }, { mode: 'cut' },
      { mode: 'fair', fair: !f0 }, { mode: 'choose', parts: 2 },
      { mode: 'fair', fair: f0 }];
  }
  if (dch === 3) {
    const lastP = rnd() < 0.5 ? 3 : 4;             // 第三道 choose 人数（3/4 都稳定出现）
    const f = rnd() < 0.5;
    return [
      { mode: 'choose', parts: 3 }, { mode: 'fair', fair: f },
      { mode: 'choose', parts: 4 }, { mode: 'cut' },
      { mode: 'choose', parts: lastP }];
  }
  const seq = shuffled(['pick', 'choose', 'fair', 'cut', 'match'], rnd);
  return seq.map(m => ({ mode: m,
    parts: m === 'choose' ? ri(rnd, 2, 4) : 0,
    fair: m === 'fair' ? rnd() < 0.5 : true }));
}

/* ---------- 单题生成（rnd 同流保证确定性；lastKind=避免与上一题同水果连出）
   kind 池：pick/match→DCH_KINDS[dch]；choose/fair/cut→eqKindsOf(dch)（等分切法池） */
function pickKind(pool, rnd, lastKind) {
  let kind = pool[Math.floor(rnd() * pool.length)];
  for (let t = 0; t < 8 && lastKind != null && kind === lastKind; t++) {
    kind = pool[Math.floor(rnd() * pool.length)];
  }
  return kind;
}
function genOne(dch, qi, rnd, lastKind, spec) {
  const eq = spec.mode === 'choose' || spec.mode === 'fair' || spec.mode === 'cut';
  const pool = eq ? eqKindsOf(dch) : DCH_KINDS[dch];
  const kind = pickKind(pool, rnd, lastKind);
  const base = { mode: spec.mode, kind: kind, wrong: [], _miss: 0, seed: 0, solved: false };

  if (spec.mode === 'pick') {
    /* 辨识：2 选 1（整个 vs 一半，dch1 前两题）→ 3 选 1（整个/一半/一大一小陷阱）
       —— 陷阱态升级（r7）：旧"切开拼回"改为"一大一小"，半=等分概念（不是随便一块） */
    const nOpt = dch === 1 && qi < 2 ? 2 : 3;
    const states = nOpt === 2 ? ['whole', 'half'] : ['whole', 'half', 'uneven'];
    const cards = shuffled(states.map(s => ({ state: s })), rnd);
    const answerIdx = cards.findIndex(c => c.state === 'half');
    const options = cards.map(c => ({
      kind: kind, state: c.state,
      side: c.state === 'half' ? (rnd() < 0.5 ? 'L' : 'R') : null
    }));
    return Object.assign(base, { nOpt: nOpt, given: null, options: options,
      answerIdx: answerIdx, cutDone: false });
  }
  if (spec.mode === 'choose') {
    /* 等分选择：n 人 → 正确切法 cutForN(n)；干扰 = unfair（一大一小）+ wrongCutForN(n)（份数不对） */
    const n = spec.parts;
    const cuts = shuffled([cutForN(n), 'unfair', wrongCutForN(n)], rnd);
    return Object.assign(base, { parts: n, given: null,
      options: cuts.map(c => ({ cut: c })),
      answerIdx: cuts.indexOf(cutForN(n)), nOpt: 3, cutDone: false });
  }
  if (spec.mode === 'fair') {
    /* 公平判断：展示 spans（公平=[180,180] 等大 / 不公平=[120,240] 一大一小）；
       答案 = 与展示一致的按钮（公平展示→"公平"，不公平展示→"不公平"） */
    const isFair = !!spec.fair;
    const opts = shuffled([{ fair: true }, { fair: false }], rnd);
    return Object.assign(base, { fairIsFair: isFair, spans: fairSpans(isFair),
      given: { kind: kind, side: null },
      options: opts, answerIdx: opts.findIndex(o => o.fair === isFair), nOpt: 2, cutDone: false });
  }
  if (spec.mode === 'cut') {
    /* 切两半 → 判公平（两段）：knife 阶段点刀（engCut→'judge'）→ judging 阶段点按钮
       （engPick；两半等大恒公平 → answerIdx=judgeOpts 中"公平"按钮，位置随机防位置记忆） */
    const judge = shuffled([{ fair: true }, { fair: false }], rnd);
    return Object.assign(base, { given: { kind: kind, side: null }, options: [],
      judgeOpts: judge, answerIdx: judge.findIndex(o => o.fair === true),
      nOpt: 2, cutDone: false, judging: false });
  }
  /* match 拼合：给左半（L），候选 3 半块；正确=同款右半（R），干扰=不同水果半块（kind 互异） */
  const others = shuffled(pool.filter(k => k !== kind), rnd).slice(0, 2);
  const opts = shuffled([
    { kind: kind, side: 'R' },
    { kind: others[0], side: rnd() < 0.5 ? 'L' : 'R' },
    { kind: others[1], side: rnd() < 0.5 ? 'L' : 'R' }
  ], rnd);
  return Object.assign(base, { given: { kind: kind, side: 'L' }, options: opts,
    answerIdx: opts.findIndex(o => o.kind === kind), nOpt: 3, cutDone: false });
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const specs = modeSpecs(dch, rnd);               // 先抽序列（rnd 流稳定）
  const quizzes = [];
  let lastKind = null;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genOne(dch, qi, rnd, lastKind, specs[qi]);
    q.seed = (flat * 5 + qi) * 7919 + 13;
    lastKind = q.kind;
    quizzes.push(q);
  }
  return { flat, ch, dch, lv, quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 答题引擎（无 DOM，pick/choose/fair/match + cut 判定段共用）：i = 选项下标
   'right' 答对推进 / 'done' 最后一题答对通关 / 'wrong' 首次点错（该选项灰掉、计重试）
   'again' 点已灰选项 / null 非法、cut 刀阶段（未切先判）或关卡已结束 ---------- */
function engPick(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  let opts;
  if (q.mode === 'cut') {                          // 切分题：判定段才可点（刀阶段走 engCut）
    if (!q.judging) return null;
    opts = q.judgeOpts;
  } else opts = q.options;
  if (i < 0 || i >= opts.length) return null;
  if (i === q.answerIdx) {
    q.solved = true;
    if (q.mode === 'cut') q.judging = false;       // 判定完成（cutDone 保持 true）
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  if (q.wrong.indexOf(i) >= 0) return 'again';
  q.wrong.push(i);
  L.retries++;
  return 'wrong';
}
/* ---------- 切分引擎（无 DOM）：'judge' 切完进入判公平阶段（r7 真判定——不再"切了就算过"）
   0 = 本题已切过（重按早退） / null 非法、非切分题或关卡已结束 ---------- */
function engCut(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (q.mode !== 'cut') return null;
  if (q.cutDone) return 0;
  q.cutDone = true;
  q.judging = true;
  return 'judge';
}
const engWon = L => !!L && L.done;
/* 星级：一关全对（retries=0）=3 星；总重试 ≤2=2 星；否则 1 星。永不 0 星 */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用，按模式分支；dch=难度章号定 kind 池） ---------- */
function structOk(q, dch) {
  if (!q || typeof q.mode !== 'string') return false;
  if (q.cutDone !== false) return false;           // 生成期恒未切
  const eqPool = eqKindsOf(dch), allPool = DCH_KINDS[dch];
  if (q.mode === 'pick') {
    if (q.options.length !== q.nOpt || (q.nOpt !== 2 && q.nOpt !== 3)) return false;
    const halves = q.options.filter(o => o.state === 'half');
    if (halves.length !== 1 || q.options[q.answerIdx].state !== 'half') return false;
    const states = q.options.map(o => o.state);
    for (let i = 0; i < states.length; i++)
      for (let j = i + 1; j < states.length; j++) if (states[i] === states[j]) return false;
    if (q.nOpt === 3 && states.indexOf('uneven') < 0) return false;   // 3 选 1 必含一大一小陷阱
    return q.options.every(o => o.kind === q.kind && allPool.indexOf(o.kind) >= 0);
  }
  if (q.mode === 'choose') {
    if (q.options.length !== 3) return false;
    if ([2, 3, 4].indexOf(q.parts) < 0 || eqPool.indexOf(q.kind) < 0) return false;
    const cuts = q.options.map(o => o.cut);
    for (let i = 0; i < cuts.length; i++) {
      if (!CUTS[cuts[i]]) return false;
      for (let j = i + 1; j < cuts.length; j++) if (cuts[i] === cuts[j]) return false;
    }
    if (q.options[q.answerIdx].cut !== cutForN(q.parts)) return false;   // 答案=份数匹配的等分
    if (cuts.indexOf('unfair') < 0) return false;                        // 必含非等分陷阱
    if (cuts.indexOf(wrongCutForN(q.parts)) < 0) return false;           // 必含份数不对干扰
    return true;
  }
  if (q.mode === 'fair') {
    if (q.options.length !== 2) return false;
    if (eqPool.indexOf(q.kind) < 0 || typeof q.fairIsFair !== 'boolean') return false;
    if (q.options[0].fair === q.options[1].fair) return false;
    const spans = q.spans || [];
    const want = fairSpans(q.fairIsFair);
    if (spans.length !== 2 || spans[0] !== want[0] || spans[1] !== want[1]) return false;
    return q.options[q.answerIdx].fair === q.fairIsFair;   // 答案=与展示一致
  }
  if (q.mode === 'cut') {
    if (q.options.length !== 0 || q.judging !== false) return false;
    if (eqPool.indexOf(q.kind) < 0) return false;
    if (q.judgeOpts.length !== 2 || q.judgeOpts[0].fair === q.judgeOpts[1].fair) return false;
    return q.judgeOpts[q.answerIdx].fair === true;         // 两半等大恒公平 → 答案=公平按钮
  }
  /* match：3 候选 kind 全互异（干扰 ≠ 正确半块同款）；正确=同款另一侧 */
  if (q.options.length !== 3) return false;
  if (!q.given || q.given.kind !== q.kind || q.given.side !== 'L') return false;
  const kinds = q.options.map(o => o.kind);
  for (let i = 0; i < kinds.length; i++)
    for (let j = i + 1; j < kinds.length; j++) if (kinds[i] === kinds[j]) return false;
  const okOpt = q.options[q.answerIdx];
  return !!okOpt && okOpt.kind === q.kind && okOpt.side === 'R' &&
    kinds.every(k => allPool.indexOf(k) >= 0);
}
/* ================= fruitsplit 主逻辑（r7：五模式渲染 / 切分两段判定 / 教学 / 推进）
   玩法（SPEC-BATCH7 §2 r7）：
   pick 辨识：哪个是一半（三态卡：整个/一半/一大一小陷阱）；
   choose 等分选择：n(2/3/4) 人图示+语音，选份数匹配的等分切法（halves/thirds/quarters）；
   fair 公平判断：展示等大或一大一小，判断公平/不公平（不公平答对→重切演出）；
   cut 切分：点刀切两半（手感保留）→ 判公平（真判定：必须点对"公平"才推进）；
   match 拼合：半块配对拼回整个。
   验收钩子：window.FRU = { get currentLevel, get quiz, tapOption(i), doCut(), async autoSolve(), get tutorial } */

/* 刀声（Web Audio 合成）：刀落=高频短击+低频滑落；切开展开=双音 */
const sndKnife = () => {
  if (VERIFY) return;
  KIDS.audio.note(1318, 0.06, 0, 0.5);

/* ================= 渲染 ================= */
function chipFor(q) {
  const icon = q.mode === 'pick' ? ICONS.pm_pick : (q.mode === 'choose' ? ICONS.pm_choose :
    (q.mode === 'fair' || (q.mode === 'cut' && q.judging) ? ICONS.pm_fair :
    (q.mode === 'cut' ? ICONS.pm_cut : ICONS.pm_match)));
  chipEl.innerHTML = icon + '<div class="big">' + qBigText(q) + '</div>';
}
function cardArt(o) {                           // 辨识卡图形：整个/单半/一大一小陷阱（r7 第三态）
  if (o.state === 'whole') return '<span class="art">' + fruitSvg(o.kind) + '</span>';
  if (o.state === 'half') return '<span class="art">' + halfFruitSvg(o.kind, o.side, null) + '</span>';
  return '<span class="art unevenpair">' + pieceSvg(o.kind, 0, 120) + pieceSvg(o.kind, 120, 360) + '</span>';
}
function renderPick(q) {
  chipFor(q);
  const row = document.createElement('div');
  row.id = 'cards';
  q.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'card';
    b.dataset.i = i;
    b.setAttribute('aria-label', o.state === 'whole' ? '整个水果' :
      (o.state === 'half' ? '半个水果' : '一大一小两块'));
    b.innerHTML = cardArt(o);
    row.appendChild(b);
  });
  boardEl.appendChild(row);
}
/* ---------- choose：人数图示 + 主水果 + 3 切法卡 ---------- */
function renderChoose(q) {
  chipFor(q);
  const zone = document.createElement('div');
  zone.id = 'choose-zone';
  let heads = '';
  for (let i = 0; i < q.parts; i++) heads += dollHeadSvg(i);
  zone.innerHTML =
    '<div id="cho-people" aria-label="' + NUM_CN[q.parts] + '个人">' + heads + '</div>' +
    '<div id="cho-fruit" aria-label="水果">' + fruitSvg(q.kind) + '</div>';
  boardEl.appendChild(zone);
  const row = document.createElement('div');
  row.id = 'cards';
  q.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'card cutcard';
    b.dataset.i = i;
    b.setAttribute('aria-label', CUT_ARIA[o.cut]);
    b.innerHTML = '<span class="art">' + cutStyleSvg(q.kind, o.cut) + '</span>';
    row.appendChild(b);
  });
  boardEl.appendChild(row);
}
/* choose 答对：主水果按正确切法切开 → 块分离 → n 个娃娃各拿一块（块中心角相等=等大） */
function chooseCutShow(q) {
  const fruit = $id('cho-fruit');
  if (!fruit) return;
  const n = q.parts;
  let pieces = '';
  for (let i = 0; i < n; i++) {
    const a0 = pieceAngles(n, i), a1 = pieceAngles(n, i + 1);
    pieces += '<span class="chop" data-i="' + i + '" style="--dx:' + (i - (n - 1) / 2) * 46 + 'px">' +
      pieceSvg(q.kind, a0, a1) + '</span>';
  }
  fruit.innerHTML = '<div class="cho-pieces">' + pieces + '</div>';
  fruit.classList.add('cut');
}
function chooseTakers(q) {
  const zone = $id('choose-zone');
  if (!zone) return;
  const n = q.parts;
  let takers = '';
  for (let i = 0; i < n; i++) {
    const a0 = pieceAngles(n, i), a1 = pieceAngles(n, i + 1);
    takers += '<div class="taker"><div class="who">' + dollSvg(DOLL_SHIRTS[i % 4]) +
      '<div class="phalf piecehold">' + pieceSvg(q.kind, a0, a1) + '</div></div></div>';
  }
  const res = document.createElement('div');
  res.id = 'cho-takers';
  res.setAttribute('aria-label', NUM_CN[q.parts] + '个人一样多');
  res.innerHTML = takers;
  zone.appendChild(res);
  zone.classList.add('taken');
}
/* ---------- fair：两块展示（等大/一大一小）+ 2 娃娃 + 公平/不公平按钮 ---------- */
function renderFair(q) {
  chipFor(q);
  const zone = document.createElement('div');
  zone.id = 'fair-zone';
  let show = '', people = '';
  for (let i = 0; i < 2; i++) {
    show += '<div class="fpiece" data-i="' + i + '" data-span="' + q.spans[i] + '">' +
      pieceSvg(q.kind, i === 0 ? 180 : 180 + q.spans[0], i === 0 ? 180 + q.spans[0] : 540) + '</div>';
    people += dollHeadSvg(i);
  }
  zone.innerHTML =
    '<div id="fair-show" aria-label="切好的两块">' + show + '</div>' +
    '<div id="fair-people" aria-label="两个人">' + people + '</div>';
  boardEl.appendChild(zone);
  const row = document.createElement('div');
  row.id = 'cards';
  q.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'card fbtn';
    b.dataset.i = i;
    b.setAttribute('aria-label', FAIR_ARIA[o.fair]);
    b.innerHTML = '<span class="art">' + fairBtnSvg(o.fair) + '</span>';
    row.appendChild(b);

}
/* fair 不公平答对后的重切演出：两块收回 → 等大切法线闪 → 两个等大半块 */
function fairRecut(q) {
  const show = $id('fair-show');
  if (!show) return;
  show.classList.add('recut');
  let eq = '';
  for (let i = 0; i < 2; i++) {
    eq += '<div class="fpiece" data-i="' + i + '" data-span="180">' +
      pieceSvg(q.kind, 180 + 180 * i, 360 + 180 * i) + '</div>';
  }
  show.innerHTML = eq;
  const zone = $id('fair-zone');
  if (zone) zone.classList.add('recut-done');
}
/* ---------- cut：大水果+小刀（刀阶段）→ 两半展开+娃娃（判定段） ---------- */
function renderCut(q) {
  chipFor(q);
  const zone = document.createElement('div');
  zone.id = 'cut-zone';
  zone.innerHTML =
    '<div id="fruit-wrap">' +
      '<div id="fruit-whole" aria-label="水果">' + fruitSvg(q.kind) + '</div>' +
      '<div id="half-l" class="fhalf" data-half="L">' + halfFruitSvg(q.kind, 'L', 'hl' + q.seed) + '</div>' +

/* 判定段：两个娃娃各拿一半 + 公平/不公平按钮行（r7 真判定） */
function addJudgeRow(q) {

    '<div class="taker"><div class="who"><div class="phalf">' + halfFruitSvg(q.kind, 'R', null) + '</div>' +

      row.appendChild(b);

}
/* ---------- match：给半块 + 空槽 + 3 候选（保留） ---------- */
function renderMatch(q) {
  chipFor(q);
  const zone = document.createElement('div');
  zone.id = 'match-zone';
  zone.innerHTML =
    '<div id="match-top">' +
      '<div id="given-slot"><div class="mhalf" aria-label="给到的半个水果">' +
        halfFruitSvg(q.given.kind, q.given.side, 'gv' + q.seed) + '</div></div>' +
      '<span class="mplus" aria-hidden="true">+</span>' +
      '<div id="slot" class="mhalf dashed" aria-label="另一半的位置"><span class="mq">?</span></div>' +
    '</div>';

  cands.id = 'cands';
  q.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'mopt';
    b.dataset.i = i;
    b.setAttribute('aria-label', '候选半个水果' + (i + 1));
    b.innerHTML = '<span class="art">' + halfFruitSvg(o.kind, o.side, 'mo' + q.seed + '_' + i) + '</span>';
    cands.appendChild(b);

function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  boardEl.innerHTML = '';
  if (q.mode === 'pick') renderPick(q);
  else if (q.mode === 'choose') renderChoose(q);
  else if (q.mode === 'fair') renderFair(q);
  else if (q.mode === 'cut') renderCut(q);
  else renderMatch(q);
  renderStep();
  if (!VERIFY && !state.demo) playChain([qKey(q)], qSpeech(q));   /* 题面整句（T46 阶段2 clip 化） */
}
function renderStep() {                         // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show(reason) { ghostReason = reason; ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostReason = null; ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el, reason) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show(reason);
  el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向：cut 刀阶段→小刀；cut 判定段/fair/choose→正确按钮；match→正确候选 */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  if (q.mode === 'cut' && !q.judging) pointGhostAt($id('btn-knife'), 'tut');
  else pointGhostAt(optEl(q, q.answerIdx), 'tut');
}

/* ================= 答题主路径（真实点击 / FRU.tapOption / autoSolve 共用） ================= */
async function uiTapOption(i, demo) {
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;   /* 反方审查 m7：对齐 uiCut 的 demo 豁免 */
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  if (q.mode === 'cut' && !q.judging) return false;        // 刀阶段不可点选项（走 uiCut）
  const run = cur;                              /* 演出窗口内点重玩会重建 cur——身份守卫防旧续体在新 cur 上 winFlow */
  const r = engPick(cur, i);
  if (r === null || r === 'again') return r;
  const el = optEl(q, i);
  if (r === 'right' || r === 'done') {
    lastAct = Date.now();                        /* 仅正确推进重置救援钟（5.5 岁试玩 P1：乱点孩子等得到救援） */
    if (state.tut === 'help') {                 // 教学"独"：首次答对 → 强化反馈放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    state.locked = true;
    if (el) {
      el.classList.add('right');
      const m = document.createElement('span');
      m.className = 'mark';
      m.innerHTML = ICONS.check;
      el.appendChild(m);
    }
    let fb = 880;                                /* 答对演出窗（ms，SPEC_T.fb 口径——verify 时序分账源） */
    if (q.mode === 'choose') {                   // 等分切开演出：切线闪→块分离→n 娃娃各拿一块
      chooseCutShow(q);
      sfx('ok');
      await wait(900 * SPEED);
      if (cur !== run) return r;
      chooseTakers(q);
      /* T46 阶段2：公平反馈+等分句合并 queue 链（原 clip+TTS 双通道重叠播） */
      playChain([VOICE.fairYes.key, 'fru_q_fair3_' + q.parts],
        VOICE.fairYes.text + '，' + NUM_CN[q.parts] + '块一样大，很公平');
      fb = 1900;
    } else if (q.mode === 'fair') {
      if (q.fairIsFair) {                        // 公平：娃娃开心跳
        const fp = $id('fair-people');
        if (fp) fp.classList.add('happy');
        KIDS.voice.play(VOICE.fairYes.key, VOICE.fairYes.text);
        fb = 2600;
      } else {                                   // 不公平：指出→重切演出（等大切法线闪→两等大块）
        KIDS.voice.play(VOICE.fairNo.key, VOICE.fairNo.text);
        await wait(1300 * SPEED);
        if (cur !== run) return r;
        fairRecut(q);
        KIDS.voice.play(VOICE.recut.key, VOICE.recut.text);
        fb = 1900;
      }
      sfx('ok');
    } else if (q.mode === 'cut') {               // 判定段答对：两半等大=公平
      const res = $id('cut-result');
      if (res) res.classList.add('happy');
      KIDS.voice.play(VOICE.fairYes.key, VOICE.fairYes.text);
      sfx('ok');
      fb = 2600;
    } else if (q.mode === 'match') {
      fillSlot(q);                               // 拼合成功：两半拼回整个（中缝虚线示意切线）
      sfx('coin');
    } else sfx('coin');
    await wait(fb * SPEED);
    if (cur !== run) return r;                   /* 末题演出窗内重玩已重建关卡，丢弃旧续体 */
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
  } else {                                      // 答错：晃动+灰掉（零惩罚，可重点其它）；首错只轻提示，连错 2 次才高亮正确项
    q._miss = (q._miss || 0) + 1;
    if (el) el.classList.add('wrong');
    const ok = optEl(q, q.answerIdx);
    if (ok && q._miss >= 2) { ok.classList.remove('pulse'); void ok.offsetWidth; ok.classList.add('pulse'); }
    sfx('fail');
    sayW(VOICE.wrong.key, VOICE.wrong.text);   /* 6 岁试玩共性 P1：flat≥3 也给纠错语音（10s 节流） */
    await wait(520 * SPEED);
  }
  return r;
}
/* 拼合槽：两半拼回整个（整个水果 + 中缝虚线=切线可见） */
function fillSlot(q) {
  const slot = $id('slot');
  if (!slot) return;
  slot.classList.remove('dashed');
  slot.classList.add('lit');
  slot.innerHTML = fruitSvg(q.kind) + '<i class="seam"></i>';
}

/* ================= 切分主路径（真实点刀 / FRU.doCut / autoSolve 共用）
   r7 两段：切（手感）→ 判公平（engPick）。返回 'judge'=进入判定段 ---------- */
async function uiCut(demo) {
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  if (q.mode !== 'cut' || q.cutDone) return q.mode === 'cut' ? 0 : false;
  const run = cur;                              /* 身份守卫（同 uiTapOption） */
  const r = engCut(cur);
  if (r !== 'judge') return r === 0 ? 0 : false;
  lastAct = Date.now();
  state.locked = true;
  ghost.hide();
  const knife = $id('btn-knife'), whole = $id('fruit-whole'),
        hl = $id('half-l'), hr = $id('half-r');
  if (knife) knife.classList.add('off');
  sndKnife();
  if (whole) whole.classList.add('hide');
  if (hl) hl.classList.add('go-l');
  if (hr) hr.classList.add('go-r');
  await wait(650 * SPEED);
  sndSplit();
  addJudgeRow(q);                                // 两娃娃各拿一半 + 公平/不公平按钮（真判定）
  chipFor(q);                                    // 题面切到"公平吗？"
  KIDS.voice.play(VOICE.fairQ.key, VOICE.fairQ.text);   /* 判定段题面（救援/任务语音口径，不受 flat 门） */
  sfx('ok');
  await wait(600 * SPEED);
  if (cur !== run) return r;                     /* 演出窗内重玩：丢弃旧续体 */
  state.locked = false;
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(f) {
  const fl = f == null ? cur.flat : f;
  const ci = Math.floor(fl / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关预告实算下一关难度章（家族 F：禁 (ci+1)%4 字面） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(fl + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) });   /* 家族 A：dayEnd 预告传 nextHint(lim - 1) */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);               // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none' };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  if (VERIFY) return;
  const sv = KIDS._save();
  const freshTut = flat === 0 && !sv.levels['1-0'] && !(sv.fru && sv.fru.tutSeen);
  if (freshTut) { tutorialWatch(); return; }
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=幽灵手指演示点选正确大卡（一半，flat0 首题恒为辨识 2 选 1）；帮=指向正确选项/小刀；独=首次答对放手 */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);
  await wait(700 * SPEED);
  const q = cur.quizzes[0];                     // 关 1-0 首题恒为辨识 2 选 1（确定性生成）
  pointGhostAt(cardEl(q.answerIdx), 'tut');
  await wait(900 * SPEED);
  ghost.press();
  await wait(320 * SPEED);
  await uiTapOption(q.answerIdx, true);         /* demo 通道豁免 locked（m7 对齐 uiCut），无需变通解锁 */
  const sv = KIDS._save();
  sv.fru = sv.fru || {};

    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.quizzes.length,

      mode: q ? q.mode : null, cutDone: !!(q && q.cutDone), judging: !!(q && q.judging) };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    const opts = q.mode === 'cut'
      ? (q.judging ? q.judgeOpts.map(o => ({ fair: o.fair })) : [])
      : q.options.map(o => ({
          kind: o.kind === undefined ? null : o.kind,
          state: o.state === undefined ? null : o.state,
          side: o.side === undefined ? null : o.side,
          cut: o.cut === undefined ? null : o.cut,
          fair: o.fair === undefined ? null : o.fair }));
    return { mode: q.mode, kind: q.kind, target: q.answerIdx, answerIdx: q.answerIdx,
      parts: q.parts === undefined ? null : q.parts,
      fairIsFair: q.fairIsFair === undefined ? null : q.fairIsFair,
      spans: q.spans ? q.spans.slice() : null,
      given: q.given ? { kind: q.given.kind, side: q.given.side } : null,
      options: opts,

      wrongs: (q.wrong || []).slice() };
  },
  tapOption(i) { return uiTapOption(i); },
  doCut() { return uiCut(); },
  async autoSolve() {                           // UI 路径自动答完当前关（按题面模式走真实流程）
    let acts = 0;
    while (cur && !cur.done && acts++ < 60) {
      const q = cur.quizzes[cur.step];

      const spans = Array.prototype.map.call(document.querySelectorAll('#cho-fruit .chop svg'),
        s => Number(s.getAttribute('data-span')));
      if (spans.length) chopSnap = { spans: spans, takers: document.querySelectorAll('#cho-takers .taker').length };
    }
    return origR3();
  };
  await FRU.tapOption(qCh.answerIdx);
  renderQuiz = origR3;                           // 还原
  const chopSpans = chopSnap ? chopSnap.spans : [];
  const choOk = qCh.mode === 'choose' && chopSpans.length === qCh.parts &&
    chopSpans.every(s => s === 360 / qCh.parts) &&
    !!chopSnap && chopSnap.takers === qCh.parts;                       // n 娃娃各拿一块
  startLevel(5);                                 // dch2 quiz0 恒为 fair
  const qF = cur.quizzes[0];
  const fpSpans = Array.prototype.map.call(document.querySelectorAll('#fair-show .fpiece'),
    p => Number(p.getAttribute('data-span')));
  const wantF = qF.fairIsFair ? V_SPAN_FAIR : V_SPAN_UNFAIR;
  const fairShowOk = qF.mode === 'fair' && fpSpans.length === 2 &&
    fpSpans[0] === wantF[0] && fpSpans[1] === wantF[1] &&
    (qF.fairIsFair ? (fpSpans[0] === fpSpans[1]) : (fpSpans[0] !== fpSpans[1]));  // 公平=等大/不公平=不等
  const piecesAll = choOk && fairShowOk;
  if (piecesAll) npass++;
  units.pieces = { ok: piecesAll, choose: { parts: qCh.parts, spans: chopSpans, takers: chopSnap && chopSnap.takers },
    fairShow: { fair: qF.fairIsFair, spans: fpSpans, want: wantF } };

  /* ---- ④ 判定边界单元 ---- */
  total++;
  const LU = genLevel(0);
  const qu = LU.quizzes[0];                      // flat0 首题：pick 2 选 1（教学依赖）
  const flat0Tut = qu.mode === 'pick' && qu.nOpt === 2;
  const widx = qu.options.findIndex((o, i) => i !== qu.answerIdx);
  const u1 = engPick(LU, widx);                  // 首错：灰掉计重试
  const u2 = engPick(LU, widx);                  // 已灰再点：'again' 不计数
  const u3 = engPick(LU, qu.answerIdx);          // 答对推进（下一题=cut）
  const u4 = engPick(LU, 0);                     // cut 刀阶段点选项：null
  const u5 = engCut(LU);                         // 切：'judge'
  const u6 = engCut(LU);                         // 重按：0
  const jc = LU.quizzes[1];
  const jw = jc.judgeOpts.findIndex((o, i) => i !== jc.answerIdx);
  const u7 = engPick(LU, jw);                    // 判定错（点"不公平"）：wrong
  const u8 = engPick(LU, 99);                    // 非法下标：null
  const u9 = engPick(LU, jc.answerIdx);          // 判定对：right
  const L2 = genLevel(1);
  const u10 = engCut(L2);                        // pick 题调切分：null
  const starsOk = engStars({ retries: 0 }) === 3 && engStars({ retries: 1 }) === 2 &&
    engStars({ retries: 2 }) === 2 && engStars({ retries: 5 }) === 1;
  const edgeOk = flat0Tut && u1 === 'wrong' && u2 === 'again' && u3 === 'right' && u4 === null &&
    u5 === 'judge' && u6 === 0 && u7 === 'wrong' && u8 === null && u9 === 'right' && u10 === null &&
    LU.retries === 2 && jc.judging === false && jc.cutDone === true && starsOk;
  if (edgeOk) npass++;
  units.edge = { ok: edgeOk, flat0Tut: flat0Tut, wrong: u1, again: u2, right: u3,
    pickOnKnife: u4, cutJudge: u5, recut: u6, judgeWrong: u7, badIdx: u8, judgeRight: u9,
    cutOnPick: u10, starsOk: starsOk };

  /* ---- ⑤ UI 冒烟 A：flat0 首错零惩罚（quiz0 恒 pick 2 选 1）+ 真实流程通关（1 重试=2 星） ---- */
  total++;
  startLevel(0);
  let smokeA = true, wrongOk = false, steps = 0;
  const widxOf = q => q.options.findIndex((o, i) => i !== q.answerIdx);
  {                                             // 首错：晃动+灰掉零惩罚；首错不 pulse 正确项
    const q0 = cur.quizzes[0];
    const wEl0 = cardEl(widxOf(q0));
    const okEl0 = cardEl(q0.answerIdx);
    await FRU.tapOption(widxOf(q0));
    wrongOk = q0.mode === 'pick' && !!wEl0 && wEl0.classList.contains('wrong') &&
      !okEl0.classList.contains('pulse') &&
      FRU.currentLevel.retries === 1 && FRU.currentLevel.step === 0;
  }
  while (cur && !cur.done && steps < 12) {      // 按模式真实流程打完（cut 走两段）
    const q = cur.quizzes[cur.step];
    if (!q) { smokeA = false; break; }
    if (q.mode === 'cut') {
      if (!q.cutDone) { const rc = await FRU.doCut(); if (rc !== 'judge') smokeA = false; }
      else { const rj = await FRU.tapOption(q.answerIdx); if (rj !== 'right' && rj !== 'done') smokeA = false; }
    } else {
      const r = await FRU.tapOption(q.answerIdx);
      if (r !== 'right' && r !== 'done') smokeA = false;
    }
    steps++;
  }
  const lvA = FRU.currentLevel;
  /* flat0 序列=[pick,cut,choose,cut,pick]：5 题 + cut 两段各计一步 = 7 步 */
  const smokeOkA = smokeA && wrongOk && steps === 7 && lvA.done && lvA.won && lvA.retries === 1 &&
    engStars(cur) === 2 && !document.querySelector('.k-celebrate');   // verify 页不弹层
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, wrongOk: wrongOk, steps: steps, retries: lvA.retries, stars: engStars(cur) };

  /* ---- ⑤ UI 冒烟 B：flat15（dch4 五模式混排）autoSolve 通关（cut 走两段） ---- */
  total++;
  startLevel(15);
  const m15 = {};
  cur.quizzes.forEach(q => { m15[q.mode] = (m15[q.mode] || 0) + 1; });
  const a15 = await FRU.autoSolve();
  const lv15 = FRU.currentLevel;
  const smokeOkB = m15.pick === 1 && m15.cut === 1 && m15.choose === 1 && m15.fair === 1 && m15.match === 1 &&
    a15.done && lv15.done && lv15.won && lv15.retries === 0 && engStars(cur) === 3;
  if (smokeOkB) npass++;
  smokes.flat15 = { ok: smokeOkB, modes: m15, acts: a15.acts, retries: lv15.retries, stars: engStars(cur) };

  /* ---- ⑥ 布局：双 viewport 模拟 × 五模式（含 cut 判定段） ---- */
  function simView(w, h) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    renderQuiz();
    const de = document.documentElement;
    const q = cur.quizzes[cur.step];
    /* 主触摸目标按模式：辨识/等分/公平大卡 .card / 切分小刀 / 拼合候选，全部 ≥96 */
    const mains = Array.prototype.map.call(
      q.mode === 'cut' ? (q.judging ? document.querySelectorAll('#judge-row .card') : document.querySelectorAll('#btn-knife')) :
      q.mode === 'match' ? boardEl.querySelectorAll('.mopt') :
      boardEl.querySelectorAll('.card'), b => b.getBoundingClientRect());
    const mainOk = mains.length > 0 && mains.every(r => r.width >= 96 && r.height >= 96);
    /* 板内全部可点按钮 ≥64 */
    const btns = Array.prototype.map.call(boardEl.querySelectorAll('button'), b => b.getBoundingClientRect());
    const btnOk = btns.every(r => r.width >= 64 && r.height >= 64);
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, mode: q.mode + (q.mode === 'cut' && q.judging ? ':judge' : ''),
      mainOk: mainOk, btnOk: btnOk, n: mains.length, ox: ox, pass: mainOk && btnOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const flat of [0, 5, 10]) {              // pick / fair / choose
    startLevel(flat);
    sims.push(simView(1280, 800));
    sims.push(simView(800, 1180));
  }
  startLevel(1);                                // cut 刀阶段（flat1 quiz1 恒为 cut）
  await FRU.tapOption(cur.quizzes[0].answerIdx);
  sims.push(simView(1280, 800));
  sims.push(simView(800, 1180));
  await FRU.doCut();                            // cut 判定段
  await wait(400);
  sims.push(simView(1280, 800));
  sims.push(simView(800, 1180));
  startLevel(15);                               // match（dch4 内步进到 match 题）
  for (let s = 0; s < CH_LEN; s++) {
    const q = cur.quizzes[cur.step];
    if (!q) break;
    if (q.mode === 'match') { sims.push(simView(1280, 800)); sims.push(simView(800, 1180)); break; }
    if (q.mode === 'cut') { await FRU.doCut(); await FRU.tapOption(q.answerIdx); }
    else await FRU.tapOption(q.answerIdx);
    await wait(150);
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                // 还原真实 viewport 布局
  const layoutOk = sims.length >= 10 && sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑦ 分布断言：pick 3选1 / choose / fair 答案索引多位置出现；choose 人数 2/3/4 都出现 ---- */
  total++;
  const nPick = pickDist[0] + pickDist[1] + pickDist[2];
  const nCho = choDist[0] + choDist[1] + choDist[2];
  const nFair = fairDist[0] + fairDist[1];
  const distOk = nPick > 0 && nCho > 0 && nFair > 0 &&
    pickDist[0] > 0 && pickDist[1] > 0 && pickDist[2] > 0 && pickDist[0] < nPick * 0.6 &&
    choDist[0] > 0 && choDist[1] > 0 && choDist[2] > 0 && choDist[0] < nCho * 0.6 &&
    fairDist[0] > 0 && fairDist[1] > 0 &&
    partsDist[2] > 0 && partsDist[3] > 0 && partsDist[4] > 0;
  if (distOk) npass++;
  units.dist = { ok: distOk, pick: pickDist, choose: choDist, fair: fairDist, parts: partsDist };

  /* ---- ⑧ estMs 家族（n*345+600 定版，禁 +300 变体）+ 与独立复算同步 ---- */
  total++;
  const estSrc = estMs.toString();
  const estOk = estMs(5) === 5 * 345 + 600 && estMs(14) === 14 * 345 + 600 &&
    estSrc.indexOf('345') >= 0 && estSrc.indexOf('600') >= 0 && estSrc.indexOf('+ 300') < 0 &&
    [1, 2, 5, 10, 14, 20].every(n => estMs(n) === V_EST(n));
  if (estOk) npass++;
  units.estMs = { ok: estOk, est5: estMs(5), est14: estMs(14) };

  /* ---- ⑨ 家族 F 行为断言：静态章预告 + 生成关预告实算（禁 (ci+1)%4 字面——源码级在 build.py） ---- */
  total++;
  const statHintOk = nextHint(4) === V_CHAPTER_HINT[1] && nextHint(9) === V_CHAPTER_HINT[2] &&
                     nextHint(14) === V_CHAPTER_HINT[3] && nextHint(19) === V_CHAPTER_HINT[4];
  const genHintOk = [24, 29, 34, 39, 44].every(fl =>        // 生成关（flat≥20，ci≥4）实算对账
    nextHint(fl) === V_GEN[genLevel(fl + 1).dch - 1]);
  const famOk = statHintOk && genHintOk;
  if (famOk) npass++;
  units.family = { ok: famOk, staticHints: statHintOk, genHints: genHintOk };

  const out = { game: 'fruitsplit', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  runVerify();
}

</script>
