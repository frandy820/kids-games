<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>跳格子数数</title>
<style>
/* ================= 跳格子数数 hopscotch（batch7 · r7 难度改造）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、河边浅蓝水面、暖橙主色、灰蓝石头色（不用大红警示）
   圆石格 5 列蛇形（span10=2 行 1-10 / span20=4 行 1-20，行末折行；行数由 JS 按章 span 设），
   800px 竖屏宽放得下且格 ≥64px（overflowX=0 硬指标）；格间箭头标示顺数方向（mode2 双箭头 »）
   触摸目标：圆石格 ≥64×64；旗=目标格视觉锚（红=往前/蓝=往回，§0.19 零文字自解释）；
   每格数字大字 + 点数圆点双重冗余（11-20=十点阵+个位）；pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#9FB4C7;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：河面 + 题面 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 10px}
#field{position:relative;width:100%;max-width:1180px;flex:1 1 auto;min-height:230px;
  background:#BFE0EA;border:3px solid #9FCCDA;border-radius:26px;overflow:hidden;
  box-shadow:inset 0 0 0 6px rgba(255,249,238,.4)}
#field .river{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- 圆石格路径：5 列 × 2 行 S 形（JS 按 n 定 grid 位置） ---------- */
#path{position:absolute;inset:34px 18px 18px;display:grid;
  grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:12px}
.cell{position:relative;min-width:64px;min-height:64px;max-width:200px;width:100%;height:100%;
  max-height:205px;justify-self:center;align-self:center;border-radius:38%;
  background:linear-gradient(180deg,#E8EDF4 0%,#C9D3E0 78%,#B7C4D4 100%);
  border:3px solid #8FA0B5;box-shadow:0 4px 0 rgba(99,117,140,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  padding:4px 6px;transition:transform .15s}
.cell:active{transform:translateY(2px)}
.cell .num{font-size:clamp(22px,4.6vh,42px);font-weight:800;color:#4A3B2E;line-height:1;
  font-variant-numeric:tabular-nums}
/* 藏数字格：数字藏起只显点数圆点（点对才亮——数序内化）；亮出时弹跳出现 */
.cell.masked .num{visibility:hidden}
.cell.reveal .num{visibility:visible;animation:num-pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes num-pop{from{transform:scale(0) rotate(-16deg)}to{transform:scale(1) rotate(0)}}
/* 点数圆点：flex 三列换行居中（1-3 一行/4-6 两行/7-9 三行/10 四行 3+3+3+1）
   r7 11-20：.ten 十点阵边框格（内恰 10 小点 2×5）+ 个位圆点——「一个整十+几」结构化显示 */
.cell .dots{width:58%;display:flex;flex-wrap:wrap;gap:5%;justify-content:center;align-content:center}
.cell .dots i{width:24%;aspect-ratio:1;border-radius:50%;background:#5B6B7E;
  box-shadow:inset 0 -2px 0 rgba(74,59,46,.25)}
.cell .dots .ten{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;
  padding:6% 8%;margin:3% 0;border:2px solid #5B6B7E;border-radius:8px;
  background:rgba(91,107,126,.10);box-shadow:none}
.cell .dots .ten i{width:100%;aspect-ratio:1;box-shadow:none}
/* 目标格：旗插角上 + 柔和描边圈（旗色=方向：红往前/蓝往回） */
.cell.goal{border-color:#E8975A;box-shadow:0 4px 0 rgba(199,122,66,.5),inset 0 0 0 4px rgba(232,151,90,.35)}
.cell .flag{position:absolute;top:-15%;right:-7%;width:34%;min-width:26px;z-index:2;
  transform-origin:50% 100%;animation:flag-wave 2.2s ease-in-out infinite;pointer-events:none}
.cell .flag.back{animation-name:flag-wave-b}
@keyframes flag-wave{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes flag-wave-b{0%,100%{transform:rotate(-4deg) scale(-1,1)}50%{transform:rotate(3deg) scale(-1,1)}}
/* 当前所站格：淡圈提示 */
.cell.here{box-shadow:0 4px 0 rgba(99,117,140,.45),inset 0 0 0 4px rgba(255,249,238,.7)}
/* 点非相邻格：该格轻晃（零惩罚） */
.cell.shake{animation:cell-shake .45s ease}
@keyframes cell-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* 连错 2 次才高亮下一格（首错不 pulse，给再想机会——§0.7） */
.cell.pulse{animation:cell-pulse 1s ease 2}
@keyframes cell-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95))}}
/* 到达目标格：石头亮起 */
.cell.win{animation:cell-win .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes cell-win{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 格间顺数方向小三角（1→4 右 / 5 下折 / 6→9 左）：纯装饰；
   r7 mode2（跳两格）双箭头 » 同位挂链上格（aR2/aL2/aD2）；非链上石头减淡（.off，仍可点零惩罚） */
.cell .nxt{position:absolute;width:16px;height:16px;pointer-events:none;opacity:.8}
.cell.aR .nxt,.cell.aR2 .nxt{right:-15px;top:50%;transform:translateY(-50%)}
.cell.aD .nxt,.cell.aD2 .nxt{bottom:-16px;left:50%;transform:translateX(-50%)}
.cell.aL .nxt,.cell.aL2 .nxt{left:-15px;top:50%;transform:translateY(-50%)}
.cell.aR2 .nxt,.cell.aD2 .nxt,.cell.aL2 .nxt{width:18px;height:14px}
.cell.off{opacity:.55}

/* ---------- 小兔子（JS 依当前格定位，left/top 过渡=跳过去） ---------- */
#rabbit{position:absolute;left:0;top:0;width:76px;z-index:5;pointer-events:none;
  transition:left .34s cubic-bezier(.35,1.3,.55,1),top .34s cubic-bezier(.35,1.3,.55,1)}
#rabbit svg{width:100%;height:auto}
#rabbit.hoppy{animation:rab-hop .34s ease}
@keyframes rab-hop{0%,100%{transform:scale(1)}45%{transform:scale(1.14,.88)}}
#rabbit.shake{animation:rab-shake .5s ease}
@keyframes rab-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}
  55%{transform:rotate(7deg)}80%{transform:rotate(-4deg)}}

/* ---------- 题面行：旗 + 跳到 N（文字为装饰性冗余，题面信息全语音承载 §0.19） ---------- */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  min-height:78px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:14px;padding:6px 26px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4}
#prompt-chip .flagmini{width:44px;height:52px;flex:0 0 44px}
#prompt-chip .big{font-size:32px;font-weight:800;color:#4A3B2E;line-height:1.25;white-space:nowrap}
#prompt-chip .big b{color:#E8873A;font-size:38px;font-variant-numeric:tabular-nums}
#prompt-chip .sub{display:none;font-size:16px;font-weight:700;color:#6B8CB8}
#prompt-chip.back .sub,#prompt-chip.skip .sub{display:block}
#prompt-chip.skip .sub{color:#E8873A}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch5 countchick） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：两行格子随场地变高，数字/旗适配 */
@media (orientation:portrait){
  .cell{max-height:230px}
  #prompt-chip .big{font-size:28px}
  #prompt-chip .big b{font-size:33px}
}
</style>
</head>
<body>
<div id="game" aria-label="跳格子数数">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="field" aria-label="河边石头路">
      <div class="river" aria-hidden="true"></div>
      <div id="path" aria-label="十块圆石格子"></div>
      <div id="rabbit" aria-hidden="true"></div>
    </div>
    <div id="prompt">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

   r7 难度改造（AUDIT-56 #12 / 建议行 69）：数域 1-10 扩到 1-20 分段进阶 + 跳 2 格模式（数序模式化）
   + 藏格加大（途中格数字全藏，心算内化数序）。圆石格 S 形蛇形排布：每行 5 格，
   span10=2 行（1→5 / 6→10），span20=4 行（1→5 / 6→10 / 11→15 / 16→20）；
   每格数字大字 + 点数圆点双重冗余显示（11-20=十点阵+个位圆点）；红旗=往前跳，蓝旗=往回跳（§0.19） */
'use strict';

const INK = '#4A3B2E'; // 统一暖棕描边（DESIGN-SPEC §8）

/* ---------- 章配置（章号 1 基；生成关 flat≥30 按 (ch-1)%6+1 循环六章取材）
   r7 六章：1 顺数 1-10 / 2 跨十顺数 11-20 / 3 倒数 / 4 藏格心算(1-10) / 5 大石头阵(1-20 藏格)
   / 6 跳两格（偶数链 2-4-6-8… + 奇数链 1-3-5-7…，跳 2 递进）
   name 供章末预告；hint=章末预告下一章文案（按"预告下一章"语义写，GEN 文案不带"明天："前缀） */
const CHAPTERS = {
  1: { name: '往前跳',   hint: '要数到二十啦，从十一接着往上数' },
  2: { name: '数到二十', hint: '插蓝旗啦，小兔子要往回跳' },
  3: { name: '往回跳',   hint: '石头藏起数字啦，数一数圆点' },
  4: { name: '猜石头',   hint: '更大的石头阵，数字也藏起来' },
  5: { name: '大石头阵', hint: '两块两块跳，一次跳过一块石头' },
  6: { name: '跳两格',   hint: '新一轮跳格子数数' }
};
const GEN_HINTS = ['顺数往前跳到十', '跨过十数到二十', '拿蓝旗往回跳', '藏数字的石头猜一猜', '大石头阵数圆点', '两块两块跳'];
const CH_LEN = 5;          // 5 题 = 1 关
const STATIC_LEVELS = 30;  // 静态 30 关 = 6 章（r7：原 4 章 20 关扩容）
const N_CH = 6;            // 章数（renderDots / 难度章循环）
const CELL_N = 20;         // 圆石格数上限（数域 1-20；每关实际格数=span，由章配置）
const COLS = 5;            // 每行格数（蛇形换行）
/* 各难度章的格数（span）：dch1/4=1-10 两行，dch2/3/5/6=1-20 四行 */
const SPAN = { 1: 10, 2: 20, 3: 20, 4: 10, 5: 20, 6: 20 };

/* ---------- SAPI 拼句时长估计（家族定版字面，禁 +300 变体——四处同步：
   本定义 / game-main 注释 / game-verify 断言 / build.py 字面 assert）
   TTS 全部题面/读题句的最大码点数（r7 时长模型用） */
const estMs = n => n * 345 + 600;
const TTS_MAX_CHARS = 12;  // estMs(12)=4740；最长题面句「两块两块跳，跳到十六」（12 码点，dch6 恒顺向无倒数变体——r7 审查 m-7 注释勘误）

/* ---------- r7 单关推算时长模型（5-6 岁试玩口径，保守下界；SPEC §3-r7 定稿）
   HOP_MS      每跳一格：决策+触摸+兔子跳+报数（数字可见时 1.8s）
   HOP_HIDDEN_MS 下一格数字藏起（藏格章）：须回忆数序不能直接读，心算加成 2.6s
   GOAL_MS     到旗庆祝演出窗（game-main 既有 900ms wait）
   LEVEL_MIN_MS 单关推算时长下限（verify 硬断言：每关 Σ[estMs(题面句长)+Σhop+GOAL] ≥ 40s） */
const HOP_MS = 1800, HOP_HIDDEN_MS = 2600, GOAL_MS = 900, LEVEL_MIN_MS = 40000;
function quizDurMs(q) {                          // 单题推算（直线路径：逐格/逐 2 格走到旗）
  const step = q.mode === 2 ? 2 : 1;
  let ms = 0, pos = q.from;
  for (let k = 0; k < q.len / step; k++) {
    pos += step * q.dir;
    ms += q.hidden.indexOf(pos) >= 0 ? HOP_HIDDEN_MS : HOP_MS;
  }
  return estMs(qSpeech(q).length) + ms + GOAL_MS;
}
const levelDurMs = L => L.quizzes.reduce((s, q) => s + quizDurMs(q), 0);

/* ---------- 语音文案（前三条与 voice/clips/manifest.json 严格一致，禁改 key/text——r7 亦一字未动）
   仅前 3 关播 sayP；救援/读题走 sayR；wrong/wrong2 无既有 clip 约束（wrong2 为 r7 新键，
   gen_clips.py hopscotch 块注册）→ KIDS.voice.play 缺 clip 自动整句 TTS 兜底（§0.13）；
   到达目标格=报数+旗帜+chime 音效（庆祝视觉/音效承载，无额外语音） */
const VOICE = {
  watch: { key: 'hop_tut_watch', text: '看！跳格子数数' },
  turn:  { key: 'hop_tut_turn',  text: '你来跳一跳' },
  hint:  { key: 'hop_hint',      text: '听一听，跳到几' },
  wrong: { key: 'hop_wrong',     text: '一格一格跳' },   /* mode1 点非步长格：纠错轻语音 sayW（10s 节流 flat≥3） */
  wrong2:{ key: 'hop_wrong2',    text: '两块两块跳' }    /* r7 mode2（跳两格章）纠错：步长是 2 不是 1 */
};

/* ---------- 中文数词（报数/读题 TTS 用；范围 1-20，r7 扩容） ---------- */
function numCn(n) {
  const D = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  if (n < 10) return D[n];
  if (n === 10) return '十';
  if (n < 20) return '十' + D[n - 10];
  return '二十';
}
/* 题面整句朗读（T46 阶段2：拆段 clip 化，qSpeech 保留=TTS 兜底文案）：
   倒数明示"往回跳"；mode2（跳 2）明示"两块两块"——规则全语音承载（§0.19 视觉+语音双载） */
const qSpeech = q => (q.mode === 2
  ? (q.to > q.from ? '两块两块跳，跳到' : '两块两块往回跳，跳到')
  : (q.to > q.from ? '跳到' : '往回跳，跳到')) + numCn(q.to);
/* T46 阶段2（2026-09-19）：题面拆段键链（hop_p_1-4 方向前缀 + hop_n_1-20 数词，全在 manifest）
   ——与 qSpeech 文本逐段一致；全段在册 queue 拼播 */
const qParts = q => [
  q.mode === 2 ? (q.to > q.from ? 'hop_p_3' : 'hop_p_4') : (q.to > q.from ? 'hop_p_1' : 'hop_p_2'),
  'hop_n_' + q.to
];

/* ---------- 图标（全部内嵌 SVG，描线风，主色 INK 暖棕 / 暖橙点缀 / 灰蓝石头色）
   r7 新增双箭头（»：跳 2 格方向标，链上格间跨一格指向下一落点） ---------- */
const FLAG_RED = '#D96A5A', FLAG_BLUE = '#6B8CB8';
function flagSvg(color, dark) {

    '<ellipse cx="10" cy="45" rx="7" ry="2.6" fill="' + (dark || '#C9BDA8') + '"/></svg>';
}
const chev2 = (d1, d2) => '<svg viewBox="0 0 30 24" xmlns="http://www.w3.org/2000/svg">' +
  '<path d="' + d1 + '" fill="#9FB4C7"/><path d="' + d2 + '" fill="#9FB4C7"/></svg>';
const ICONS = {
  logo: '<svg viewBox="0 0 44 44" width="32" height="32" xmlns="http://www.w3.org/2000/svg" fill="none">' +
    '<ellipse cx="22" cy="29" rx="17" ry="12" fill="#C9D3E0" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<path d="M22 29 V10" stroke="' + INK + '" stroke-width="3" stroke-linecap="round"/>' +
    '<path d="M22 11 L36 15.5 L22 20 Z" fill="' + FLAG_RED + '" stroke="' + INK + '" stroke-width="2" stroke-linejoin="round"/>' +
    '<circle cx="15" cy="30" r="1.8" fill="' + INK + '"/><circle cx="22" cy="33" r="1.8" fill="' + INK + '"/>' +
    '<circle cx="29" cy="30" r="1.8" fill="' + INK + '"/></svg>',
  hear: '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M11 25 h10 l13 -11 v36 l-13 -11 h-10 Z" fill="#E8975A" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M43 23 q6 9 0 18 M50 16 q11 16 0 32" stroke="' + INK + '" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>',
  replay: '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">' +
    '<path d="M46 30 a17 17 0 1 0 -3 13" stroke="#8A9BAE" stroke-width="6" stroke-linecap="round" fill="none"/>' +
    '<path d="M40 12 L48 30 L30 30 Z" fill="#8A9BAE"/></svg>',
  finger: '<svg viewBox="0 0 64 76" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M28 8 a8 8 0 0 1 16 0 v30 l8 4 a10 10 0 0 1 6 9 v10 a12 12 0 0 1 -12 12 h-12 a14 14 0 0 1 -14 -14 V30 Z" fill="#FFF" opacity=".93" stroke="#E8DCC8" stroke-width="2"/>' +
    '<ellipse cx="35" cy="44" rx="10" ry="6" fill="#F2B8C6" opacity=".35"/></svg>',
  flagR: flagSvg(FLAG_RED),
  flagB: flagSvg(FLAG_BLUE),
  /* 顺数方向小三角（mode1 格间箭头：行内顺向 / 行末下折；纯装饰 pointer-events:none） */
  aR: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 4 L20 12 L6 20 Z" fill="#9FB4C7"/></svg>',
  aL: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18 4 L4 12 L18 20 Z" fill="#9FB4C7"/></svg>',
  aD: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 6 L12 20 L20 6 Z" fill="#9FB4C7"/></svg>',
  /* mode2 双箭头（»）：跳 2 格的落点方向（跨过一块石头） */
  aR2: chev2('M3 4 L13 12 L3 20 Z', 'M14 4 L24 12 L14 20 Z'),
  aL2: chev2('M27 4 L17 12 L27 20 Z', 'M16 4 L6 12 L16 20 Z'),
  aD2: chev2('M3 3 L13 10 L3 17 Z', 'M16 3 L26 10 L16 17 Z')
};

/* ---------- 河边场景背景（低干扰，pointer-events:none）：水面 + 波纹 + 芦苇 + 岸 */
function riverSvg() {
  let s = '<svg viewBox="0 0 1000 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">';
  s += '<rect width="1000" height="600" fill="#BFE0EA"/>';
  s += '<rect width="1000" height="600" fill="url(#rv-g)"/>';
  s += '<defs><linearGradient id="rv-g" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#CFE9F0"/><stop offset="1" stop-color="#AED7E4"/></linearGradient></defs>';
  const wave = (x, y, w) =>
    '<path d="M' + x + ' ' + y + ' q' + (w / 2) + ' -7 ' + w + ' 0' +
    ' q' + (w / 2) + ' 7 ' + w + ' 0" stroke="#9FCCDA" stroke-width="4" fill="none" stroke-linecap="round" opacity=".55"/>';
  [[80, 70], [420, 55], [760, 75], [180, 545], [560, 555], [860, 540], [300, 300], [700, 310]]
    .forEach((p, i) => { s += wave(p[0], p[1], 34 + (i % 3) * 8); });
  const reed = (x, y, k, flip) =>
    '<g transform="translate(' + x + ' ' + y + ') scale(' + (flip ? -k : k) + ' ' + k + ')">' +
    '<path d="M0 0 V-52 M0 -52 q-3 -14 -13 -18 M0 -52 q3 -16 12 -20" stroke="#8FAe7E" stroke-width="4" fill="none" stroke-linecap="round"/>' +
    '<ellipse cx="12" cy="-70" rx="4.5" ry="12" fill="#C9A87C" transform="rotate(14 12 -70)"/></g>';
  [[26, 120, 1], [46, 470, .8, 1], [966, 150, 1, 1], [948, 500, .9, 1]].forEach(r => { s += reed(r[0], r[1], r[2] || 1, r[3]); });
  s += '</svg>';
  return s;
}

/* ---------- 点数圆点 DOM（r7：1-10 纯圆点 / 11-20 十点阵+个位圆点）
   n≤10：n 个小圆点 flex 三列换行居中（1-3 一行 / 4-6 两行 / 7-9 三行 / 10 四行）
   n≥11：floor(n/10) 个 .ten 十点阵边框格（内恰 10 小点，2×5）+ n%10 个个位圆点——
   「一个整十 + 几」结构化显示（5-6 岁数感：十进制嵌位），.dots 内 <i> 总数恒等于 n（verify 不变量） */
function dotsHtml(n) {
  let s = '<span class="dots" aria-hidden="true">';
  const tens = Math.floor(n / 10), ones = n % 10;
  for (let t = 0; t < tens; t++) {
    s += '<b class="ten">';
    for (let i = 0; i < 10; i++) s += '<i></i>';
    s += '</b>';
  }
  for (let i = 0; i < ones; i++) s += '<i></i>';
  return s + '</span>';
}
/* ================= hopscotch 纯引擎：确定性关卡生成 + 逐格/跳 2 跳步判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   r7 六章难度（SPEC-BATCH7 §3-r7；span=该关格数，mode=跳步长，hide=途中格数字全藏）：
   dch1 顺数 1-10：span10，from=1，to=5-8（走 4-7 格），全显数字
   dch2 跨十顺数：span20，to=15-20，len=4-8（from=to-len，路径必经 11-20 段），全显
   dch3 倒数：span20，len=5-8（from=to+len≤20），蓝旗，全显
   dch4 藏格心算：span10，len=4-8，偶顺（from=1）奇倒（to=1）双向都有；途中格（inner）数字全藏
   dch5 大石头阵：span20，len=4-8，偶顺奇倒；途中格全藏；远端≥14 必跨 11-20 段
   dch6 跳两格：span20，mode=2，偶链 from=2→to=8-16 偶 / 奇链 from=1→to=7-15 奇（qi 偶奇交替，
     跳距恒 2，跳 2 递进数序模式化而非逐 1 数；len 为距离 6-14=2×(3-7) 跳）
   合法步 = 与当前位置相距恰一个步长的格（mode1=|n-cur|1；mode2=|n-cur|2，方向不限——旗色指方向
   但反向仍是合法跳）；点其余格 = 'far' 零惩罚（计一次错点，星级用）；点当前格 = 'self' 不计错
   藏格规则（r7）：dch4/5 途中格（不含 from/to）数字全藏（hidden=inner 全集）——起点锚+已跳格
   点亮轨迹+语音读题为支持面，去「逐格发光」兜底（game-main 已删连错 pulse） */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号六章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % N_CH + 1;

/* ---------- 途中介格（不含 from/to）：r7 藏格章 hidden=inner 全集（中间格不亮，心算内化数序） */
const pathInner = q => {
  const s = Math.min(q.from, q.to) + 1, e = Math.max(q.from, q.to) - 1, r = [];
  for (let v = s; v <= e; v++) r.push(v);
  return r;
};

/* ---------- 单题生成（rnd 同流保证确定性；lastPair=避免与上一题完全同起终点） ---------- */
function genOne(dch, qi, rnd, lastPair) {
  let from = 1, to = 5, mode = 1;
  for (let t = 0; t < 8; t++) {
    if (dch === 1) {                                    // 顺数 1-10：from=1，走 4-7 格
      from = 1; to = ri(rnd, 5, 8);
    } else if (dch === 2) {                             // 跨十顺数：to 15-20，len 4-8（必经 11-20）
      to = ri(rnd, 15, 20); from = to - ri(rnd, 4, 8);
    } else if (dch === 3) {                             // 倒数：差 5-8，from=to+len≤20
      const len = ri(rnd, 5, 8);
      to = ri(rnd, 5, 20 - len); from = to + len;
    } else if (dch === 4) {                             // 藏格心算（1-10）：len 4-8，偶顺（锚 1 起）奇倒（锚 1 终）
      const len = ri(rnd, 4, 8);
      if (qi % 2 === 0) { from = 1; to = 1 + len; } else { to = 1; from = 1 + len; }
    } else if (dch === 5) {                             // 大石头阵（1-20 藏格）：远端 14-19 必跨十段
      const len = ri(rnd, 4, 8);
      if (qi % 2 === 0) { to = ri(rnd, 14, 19); from = to - len; }
      else { from = ri(rnd, 14, 19); to = from - len; }
    } else {                                            // 跳两格：偶链 2→8-16 / 奇链 1→7-15（3-7 跳）
      mode = 2;
      if (qi % 2 === 0) { from = 2; to = 2 * ri(rnd, 4, 8); }
      else { from = 1; to = 2 * ri(rnd, 3, 7) + 1; }
    }
    if (lastPair == null || from !== lastPair[0] || to !== lastPair[1]) break;
  }
  const q = { type: 'hop', from: from, to: to, dir: to > from ? 1 : -1,
    len: Math.abs(to - from), mode: mode, hide: dch === 4 || dch === 5, hidden: [] };
  if (q.hide) q.hidden = pathInner(q);                  // 途中格全藏（不涉起终点，structOk 保证）
  q._cur = from;
  q._miss = 0;
  q._shown = [];
  return q;
}

/* ---------- 关卡生成（静态 30 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const quizzes = [];
  let lastPair = null;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genOne(dch, qi, rnd, lastPair);
    lastPair = [q.from, q.to];
    quizzes.push(q);
  }
  return { flat, ch, dch, lv, span: SPAN[dch], quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 跳步引擎（无 DOM）：engTap(L, n) —— 点第 n 号格（步长=当题 mode：1 或 2）
   'step' 跳到相距一个步长的格（未到目标）/ 'goal' 跳上目标格（本题完成）
   'done' 最后一题跳上目标格（本关通关）/ 'self' 点当前所站格（无事发生不计错）
   'far' 点其余格（跳过格/相邻但步长不符；零惩罚，计一次错点）/ null 非法或关卡已结束 ---------- */
function engTap(L, n) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (typeof n !== 'number' || !isFinite(n) || Math.floor(n) !== n || n < 1 || n > L.span) return null;
  const step = q.mode === 2 ? 2 : 1;
  if (n === q._cur) return 'self';
  if (Math.abs(n - q._cur) !== step) {            // 非步长格（mode1 跳过格 / mode2 只跳一格）：摇头零惩罚
    q._miss = (q._miss || 0) + 1;
    L.retries++;
    return 'far';
  }
  q._cur = n;                                      // 兔子跳过去（mode2 跨过中间一块石头）
  if (q.hidden.indexOf(n) >= 0 && q._shown.indexOf(n) < 0) q._shown.push(n);   // 藏数字格：点对才亮
  if (n === q.to) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'goal';
  }
  return 'step';
}

const engNext = q => q._cur + (q.to > q._cur ? 1 : -1) * (q.mode === 2 ? 2 : 1);

/* ---------- 结构校验（verify 用，规则从 SPEC §3-r7 重列）：
   from≠to、方向与起终点一致、len=|to-from|、起终点在 1..20 内、藏数字格不涉起终点；
   mode2：len 偶且 6-14（3-7 跳）、from/to 同奇偶（同一跳 2 链）、无藏格；
   mode1：len 4-8；hide 章 hidden 恰为 inner 全集，非 hide 章 hidden 恒空 ---------- */
function structOk(q) {
  if (!q || q.from === q.to) return false;
  if (q.dir !== (q.to > q.from ? 1 : -1)) return false;
  if (q.len !== Math.abs(q.to - q.from)) return false;
  if (q.from < 1 || q.from > CELL_N || q.to < 1 || q.to > CELL_N) return false;
  if (q.hidden.indexOf(q.from) >= 0 || q.hidden.indexOf(q.to) >= 0) return false;
  const inner = pathInner(q);
  if (!q.hidden.every(h => inner.indexOf(h) >= 0)) return false;
  if (q.mode === 2) {
    if (q.len % 2 !== 0 || q.len < 6 || q.len > 14) return false;
    if (q.from % 2 !== q.to % 2) return false;
    return !q.hide && q.hidden.length === 0;

/* ================= 渲染 ================= */
/* 格间方向箭头：mode1=行内顺向小三角+行末下折；mode2=链上格双箭头（»）跨一格指向下一落点 */
function arrowFor(n, q, span) {
  if (q.mode === 2) {
    if (n % 2 !== q.from % 2) return '';               // 非链上格（被跨过的石头）无箭头
    const nx = n + 2 * q.dir;
    if (nx < 1 || nx > span) return '';                // 链尾无箭头
    const nrow = rowOf(nx);
    if (nrow !== rowOf(n)) return 'aD2';               // 跨行折返：下折双箭头
    return colOf(nx) > colOf(n) ? 'aR2' : 'aL2';
  }
  if (n >= span) return '';                            // 末格无箭头
  if (n % COLS === 0) return 'aD';                     // 行末下折
  return rowOf(n) % 2 ? 'aR' : 'aL';
}
function renderQuiz() {

  const back = q.dir < 0, skip = q.mode === 2;

  chipEl.innerHTML = '<span class="flagmini">' + (back ? ICONS.flagB : ICONS.flagR) + '</span>' +
    '<div><div class="big">' + (skip ? '两块两块' : '') + (back ? '往回跳，跳到 <b>' : '跳到 <b>') + q.to + '</b></div>' +
    '<div class="sub">' + (skip ? '»» 跳两格' : '蓝旗 · 往回跳 ↩') + '</div></div>';
  for (let n = 1; n <= cur.span; n++) {
    const el = cellEl(n);
    if (!el) continue;
    const isGoal = n === q.to, isHere = n === q._cur;
    const masked = q.hidden.indexOf(n) >= 0 && q._shown.indexOf(n) < 0;
    const arr = arrowFor(n, q, cur.span);
    const off = skip && n % 2 !== q.from % 2;          // mode2 非链上石头减淡（视觉自解释，仍可点）

    const nxt = el.querySelector('.nxt');

/* 小兔子站当前格：依格位置定位（#path inset 偏移换算到 #field 坐标；left/top 过渡=跳） */
function placeRabbit(anim) {

/* ================= 跳步主路径（真实点击 / HOP.tapCell / autoSolve 共用） ================= */
async function uiTapCell(n, demo) {
  /* locked 门拦真实输入；demo 通道仅 tutorialWatch 内部传 true（豁免 locked，照 countchick M1 修复） */
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const run = cur;                              /* 身份守卫：演出窗口内重玩会重建 cur，防旧续体错推进 */
  const oldCur = q._cur;                        // 跳步前所站格（"here"圈迁移用）
  const r = engTap(cur, n);
  if (r === null) return false;
  const el = cellEl(n);
  if (r === 'far') {                            // 非步长格（mode1 跳过/相邻越级，mode2 只跳一格）：兔子摇头+该格轻晃，零惩罚
    if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    rabbitEl.classList.remove('shake'); void rabbitEl.offsetWidth; rabbitEl.classList.add('shake');
    hopBad();
    sayWrong(q);                                /* 6 岁试玩共性 P1：flat≥3 也给纠错语音（10s 节流） */
    await wait(480 * SPEED);                    /* r7：去逐格发光兜底——连错不再 pulse 下一格（救援=14s idle 重读题） */
    return r;
  }
  if (r === 'self') {                           // 点当前所站格：轻晃不计错（"again"型早退）
    if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    hopLo();
    return r;
  }
  /* 'step' | 'goal' | 'done'：兔子跳过去 + 报数 + 藏数字格点亮 */
  lastAct = Date.now();                          /* 仅合法跳（含反方向探索）重置救援钟；错点 far 不重置（5.5 岁试玩 P1） */
  if (q.hidden.indexOf(n) >= 0 && el) {         // 点对才亮出数字（数序内化：已跳格轨迹）
    el.classList.remove('masked');
    el.classList.add('reveal');
  }
  const oldEl = cellEl(oldCur);                 // "here"圈：旧格移除、新格加上
  if (oldEl && oldCur !== n) oldEl.classList.remove('here');
  if (el) el.classList.add('here');
  placeRabbit(true);
  hopHi();
  KIDS.voice.play('hop_n_' + n, numCn(n));     // 报数 clip（T46 阶段2；hop_n_1-20 在册，SPEC §3）
  if (state.tut === 'help') {                   // 教学"独"：首次跳对 → 强化反馈放手
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  if (r === 'step') {
    if (state.tut === 'help') pointHelpNext();
    return r;
  }

  state.locked = true;
  if (el) { el.classList.remove('win'); void el.offsetWidth; el.classList.add('win'); }
  chimeGoal();

  if (cur !== run) return r;                    /* 演出窗内重玩已重建关卡：丢弃旧续体 */
  state.locked = false;

  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = Math.max(0, (flat == null ? cur.flat : flat) | 0);
  /* 预告=接下来首个新关（flat+1）的难度章文案：静态段取其所属章 CHAPTERS 章末预告；
     生成关（家族契约 F）禁"章索引加一取模"字面——须实算 genLevel(f+1).dch 取 GEN_HINTS */
  /* r7 审查 M1（试玩 P2 截图实锤）：章末预告=CHAPTERS[floor(f/CH_LEN)+1]（SPEC §0.4 口径）。
     原式 floor((f+1)/CH_LEN)+1 在全部静态章末（f≡4 mod 5）恒多进一章 */
  if (f + 1 < STATIC_LEVELS) return CHAPTERS[Math.floor(f / CH_LEN) + 1].hint;
  return GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) });   /* 家族契约 A：dayEnd 预告传 nextHint(lim-1) */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);               // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  buildPath(cur.span);                          // r7：按章 span 重建路径（10/20 格蛇形）
  state = { locked: false, won: false, demo: false, tut: 'none' };
  helpRedemo = false;

  const freshTut = flat === 0 && !sv.levels['1-0'] && !(sv.hop && sv.hop.tutSeen);
  if (freshTut) { tutorialWatch(); return; }
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独

  helpRedemo = false;

window.HOP = {
  get currentLevel() {
    if (!cur) return null;
    const q = cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)] || { _cur: 0 };
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.quizzes.length,
      span: cur.span, step: cur.step, retries: cur.retries, done: cur.done, won: state.won,
      cur: q._cur || 0 };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    return { type: q.type, from: q.from, to: q.to, dir: q.dir, mode: q.mode, hide: q.hide, /* SPEC §3-r7 钩子契约 */
      span: cur.span, cur: q._cur, len: q.len, hidden: q.hidden.slice(), shown: q._shown.slice(),
      step: cur.step, miss: q._miss || 0 };
  },
  tapCell(n) { return uiTapCell(n); },
  async autoSolve() {                           // UI 路径自动跳完当前关（逐落点走真实流程）
    let hops = 0;
    while (cur && !cur.done && hops < 150) {
      const q = cur.quizzes[cur.step];
      if (!q || q._cur === q.to) break;
      const r = await uiTapCell(engNext(q));
      hops++;
      if (r === false) break;                   // 锁死/重玩保护
    }
    return { done: !!(cur && cur.done), hops: hops };
  },
  get tutorial() { return state.tut; }
};
/* ================= ?verify=1 自检（仅 verify 分支加载执行）
   ① 50 关全量审计（flat 0-49：静态 30 + 生成 20）：确定性（同 flat 两次生成 JSON 一致）/
     structOk（from≠to、方向与起终点一致、len=|to-from|、起终点 1-20、藏格不涉起终点且在途中）/
     r7 章规则独立重列（SPEC §3-r7 文字直译，禁引引擎常量互证）：
       dch1 顺数 1-10（span10，from=1，to 5-8，全显）/ dch2 跨十顺数（span20，to 15-20，len 4-8）/
       dch3 倒数（span20，len 5-8）/ dch4 藏格心算（span10，len 4-8，偶顺奇倒，途中格全藏）/
       dch5 大石头阵（span20，len 4-8，偶顺奇倒，途中格全藏，远端≥14 跨十段）/
       dch6 跳两格（span20，mode2，偶链 2→8-16/奇链 1→7-15，len 偶 6-14=3-7 跳）/
     相邻题起终点不重样 / 引擎直驱（self 不计错→far 计一次错→逐落点 step→goal/done，藏格全点亮）/
     r7 时长硬断言：每关推算 Σ[estMs(题面句长)+Σhop(1800|藏 2600)+900] ≥ 40000ms（独立副本重列）
   ② tapCell 单元：far/self/step 判定 + miss 计数 + 非法下标 false
   ③ r7 跳 2 单元（flat25 dch6）：±1=far / ±2=step、链上双箭头+非链减淡、autoSolve 3 星

   ⑤ r7 数域 20 单元（flat5 dch2）：20 格 4 行蛇形、十点阵（.dots i 总数=n 不变量）
   ⑥ 布局：双 viewport（1280×800 / 800×1180）×（span10 基础/span20/藏格/跳 2）：
     格 ≥64×64、格不出界、旗可见、点数齐全、藏格数字 visibility 遮蔽、overflowX ≤0
   ⑦ 分布与家族：章 1 目标多值（不恒定）/ dch4·5 每关双向 / dch6 每关偶奇双链都有 /
     estMs 家族（n*345+600 定版，禁 +300 变体）+ 与源模型 levelDurMs 对账一致
   结果写 #verify-result + document.title='VERIFY PASS n/n' */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;
  const ch1Tos = {}, durAll = [];
  let durMin = Infinity, durMax = 0;

  /* ---- r7 独立副本：SPEC §3-r7 数值/文案重列（禁引 SPAN/HOP_MS 等引擎常量互证） ---- */
  const V_SPAN = { 1: 10, 2: 20, 3: 20, 4: 10, 5: 20, 6: 20 };
  const V_EST = c => c * 345 + 600;
  const V_HOP = 1800, V_HID = 2600, V_GOAL = 900, V_MIN = 40000;
  function vNum(n) {
    const D = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
    if (n <= 9) return D[n - 1];
    if (n === 10) return '十';
    if (n <= 19) return '十' + D[n - 11];
    return '二十';
  }
  function vSpeech(q) {                          // SPEC §3-r7 题面句模板（mode2 前缀"两块两块"）
    const head = q.mode === 2 ? (q.dir > 0 ? '两块两块跳，跳到' : '两块两块往回跳，跳到')
                              : (q.dir > 0 ? '跳到' : '往回跳，跳到');
    return head + vNum(q.to);
  }
  function vDur(q) {                             // 单题推算：听题+逐落点（藏格加成）+到旗窗
    const st = q.mode === 2 ? 2 : 1;
    let ms = 0, pos = q.from;
    for (let h = 0; h < q.len / st; h++) {
      pos += st * q.dir;
      ms += q.hidden.indexOf(pos) >= 0 ? V_HID : V_HOP;
    }

  }
  const vInner = q => {                          // 途中介格（不含起终点）
    const r = [];
    for (let v = Math.min(q.from, q.to) + 1; v <= Math.max(q.from, q.to) - 1; v++) r.push(v);

    const det = JSON.stringify(L1.quizzes) === JSON.stringify(L2.quizzes);   // 确定性
    let structAll = true, ruleOk = true, adjOk = true, driveOk = true, spanOk = true, durOk = true;
    let fwdN = 0, backN = 0, chainEv = 0, chainOd = 0, durMs = 0;
    spanOk = L1.span === V_SPAN[L1.dch];
    for (let k = 0; k < L1.quizzes.length; k++) {
      const q = L1.quizzes[k];
      if (!structOk(q)) structAll = false;
      const inner = vInner(q);
      /* r7 章规则：独立重列（SPEC 文字直译） */
      if (L1.dch === 1) {
        if (!(q.from === 1 && q.to >= 5 && q.to <= 8 && q.dir === 1 && q.mode === 1 &&
              q.hidden.length === 0 && q.len === q.to - 1)) ruleOk = false;

        if (!(q.dir === 1 && q.mode === 1 && q.to >= 15 && q.to <= 20 &&
              q.len >= 4 && q.len <= 8 && q.len === q.to - q.from && q.hidden.length === 0)) ruleOk = false;
      } else if (L1.dch === 3) {
        if (!(q.dir === -1 && q.mode === 1 && q.len >= 5 && q.len <= 8 &&
              q.len === q.from - q.to && q.from <= 20 && q.to >= 5 && q.hidden.length === 0)) ruleOk = false;
      } else if (L1.dch === 4) {
        if (!(q.mode === 1 && q.len >= 4 && q.len <= 8 && q.len === Math.abs(q.to - q.from) &&
              q.hidden.length === inner.length && inner.every(v => q.hidden.indexOf(v) >= 0) &&
              (k % 2 === 0 ? (q.from === 1 && q.dir === 1) : (q.to === 1 && q.dir === -1)))) ruleOk = false;
      } else if (L1.dch === 5) {
        if (!(q.mode === 1 && q.len >= 4 && q.len <= 8 && q.len === Math.abs(q.to - q.from) &&
              q.hidden.length === inner.length && inner.every(v => q.hidden.indexOf(v) >= 0) &&

      if (k > 0) {

      }

    durMs += vDur(q);
    }
    if ((L1.dch === 4 || L1.dch === 5) && (fwdN < 2 || backN < 2)) ruleOk = false;   // 每关双向都有
    if (L1.dch === 6 && (chainEv < 2 || chainOd < 2)) ruleOk = false;               // 每关偶奇双链都有

    durAll.push(durMs);

    if (durMs > durMax) durMax = durMs;
    if (levelDurMs(L1) !== durMs) durOk = false;                                   // 源模型与独立副本对账一致
    /* 引擎直驱：self 不计错 → far 计一次错 → 还原（重生成同关干净驱动）→ 逐落点到旗

    const Ld = genLevel(flat);

    const farOff = (q0.mode === 2 ? 1 : 2) * q0.dir;                         // mode1 far=±2，mode2 far=±1
    let farN = q0._cur + farOff;

      if (q._cur !== q.to) driveOk = false;
    }

    const ok = det && L1.quizzes.length === CH_LEN && structAll && ruleOk && adjOk &&

      durOk: durOk, fwd: fwdN, back: backN,

    const el = cellEl(n);
    const iN = el.querySelectorAll('.dots i').length;                          // 十点阵内 10 点也计 <i>
    if (iN !== n) dotsOk20 = false;                                            // .dots i 总数=n 不变量
    const tenN = el.querySelectorAll('.dots .ten').length;
    if (tenN !== Math.floor(n / 10)) tenOk = false;                            // 十点阵个数=十位数（10=1 框，20=2 框）
  }
  const rowOk20 = cellEl(1).style.gridArea.startsWith('1 /') && cellEl(6).style.gridArea.startsWith('2 /') &&
    cellEl(11).style.gridArea.startsWith('3 /') && cellEl(16).style.gridArea.startsWith('4 /');
  const spanOk20 = cells5 === 20 && lv5.span === 20 && rowOk20 && HOP.quiz.to >= 15;
  const dom20Ok = spanOk20 && dotsOk20 && tenOk;
  if (dom20Ok) npass++;
  units.span20 = { ok: dom20Ok, cells: cells5, dots: dotsOk20, ten: tenOk, rows: rowOk20 };

  /* ---- ⑥ 布局：双 viewport 模拟 ×（dch1 基础 / dch2 数域20 / dch4 藏格 / dch6 跳2） ---- */
  function simView(w, h) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    renderQuiz();                               // 按新场地尺寸重排（旗/藏格/兔子随题重挂）
    const de = document.documentElement;
    const cells = Array.prototype.map.call(pathEl.querySelectorAll('.cell'), b => b.getBoundingClientRect());
    const span = HOP.currentLevel ? HOP.currentLevel.span : 0;
    const hitOk = cells.length === span && cells.every(r => r.width >= 64 && r.height >= 64);
    const fRect = fieldEl.getBoundingClientRect();
    const insideOk = cells.every(r => r.left >= fRect.left - 1 && r.right <= fRect.right + 1 &&
      r.top >= fRect.top - 1 && r.bottom <= fRect.bottom + 1);                // 格不出界
    const flag = fieldEl.querySelector('.cell.goal .flag');
    const flagR = flag ? flag.getBoundingClientRect() : null;
    const flagOk = !!flagR && flagR.width >= 14 && flagR.height >= 16;        // 旗可见
    let dotsOk = true;
    for (let n = 1; n <= span; n++) {                                         // 数字+点数双显齐全（.dots i=n）
      const d = cellEl(n).querySelectorAll('.dots i').length;
      if (d !== n) dotsOk = false;
    }
    let maskVisOk = true;
    for (let n = 1; n <= span; n++) {
      const masked = cellEl(n).classList.contains('masked');
      const v = getComputedStyle(cellEl(n).querySelector('.num')).visibility;
      if (masked !== (v === 'hidden')) maskVisOk = false;
    }
    const rabOk = rabbitEl.getBoundingClientRect().width >= 56;               // 兔子在场上
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, flat: cur.flat, dch: cur.dch, hitOk: hitOk, insideOk: insideOk,
      flagOk: flagOk, dotsOk: dotsOk, maskVisOk: maskVisOk, rabOk: rabOk, ox: ox,
      pass: hitOk && insideOk && flagOk && dotsOk && maskVisOk && rabOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const flat of [0, 5, 15, 25]) {           // dch1 基础 / dch2 数域20 / dch4 藏格 / dch6 跳2
    startLevel(flat);
    sims.push(simView(1280, 800));
    sims.push(simView(800, 1180));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                // 还原真实 viewport 布局
  const layoutOk = sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑦ 分布与家族：章 1 目标多值 / 章规则性 / estMs 家族定版 ---- */
  total++;
  const tos = Object.keys(ch1Tos).map(Number).sort((a, b) => a - b);
  const distOk = tos.length >= 2 && tos.every(t => t >= 5 && t <= 8) &&
    durAll.length === 50 && Math.min.apply(null, durAll) >= V_MIN;
  const estOk = estMs(1) === 945 && estMs(12) === 12 * 345 + 600 &&
    estMs.toString().indexOf('345') >= 0 && estMs.toString().indexOf('+ 300') < 0;
  /* r7 审查 M1：nextHint 家族断言（期望文案独立副本重列，禁引 CHAPTERS 互证）——
     原实现 floor((f+1)/CH_LEN)+1 全部静态章末（f≡4 mod 5）多进一章，试玩 P2 截图实锤 */
  const SPEC_HINT = { 4: '要数到二十啦，从十一接着往上数', 9: '插蓝旗啦，小兔子要往回跳',
    14: '石头藏起数字啦，数一数圆点', 19: '更大的石头阵，数字也藏起来',
    24: '两块两块跳，一次跳过一块石头', 28: '新一轮跳格子数数' };
  const hintOk = Object.keys(SPEC_HINT).every(f => nextHint(+f) === SPEC_HINT[f]);
  const hintNeg = nextHint(4) !== '插蓝旗啦，小兔子要往回跳';   /* off-by-one 回归哨兵 */
  const famOk = distOk && estOk && hintOk && hintNeg;
  if (famOk) npass++;
  units.dist = { ok: famOk, ch1Tos: ch1Tos, estMs: estOk, hintOk: hintOk && hintNeg,
    durMin: durMin, durMax: durMax, durLevels: durAll.length };

  const out = { game: 'hopscotch', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
