<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>钓鱼颜色</title>
<style>
/* ================= 钓鱼颜色 fishcolor（batch7）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、池塘浅青水面、暖橙主色、灰蓝错误色（不用大红）
   触摸目标：小鱼热区 ≥64（章 4 密集档 86×69）、底栏按钮 ≥72、"再听" ≥80 高；
   pointerdown 即响应（命中按元素实时位置）；鱼位由 JS 撒点（中心距 ≥90px 防重叠不可点）
   游动在内层 .swim 上做（按钮盒静止→布局断言/命中判定稳定）；摆尾在 SVG 尾巴 g 上做 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#7FC4BB;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：池塘 + 题面色卡 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 10px}
/* 池塘：浅青水面 + 内嵌水波/荷叶/芦苇（低干扰不响应点击） */
#pond{position:relative;width:100%;max-width:1180px;flex:1 1 auto;min-height:200px;
  background:linear-gradient(180deg,#D8ECE8 0%,#C8E2DC 55%,#BEDAD3 100%);
  border:3px solid #A9CCC4;border-radius:26px;overflow:hidden;
  box-shadow:inset 0 0 0 6px rgba(255,249,238,.5)}
#pond .water{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.95}
/* 钓竿（右上装饰，钓起时抖动拉起） */
#rod{position:absolute;top:-1px;right:22px;width:112px;height:98px;pointer-events:none;z-index:2;
  transform-origin:96% 4%}
#rod.tug{animation:rod-tug .5s ease}
@keyframes rod-tug{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg) translateY(-3px)}65%{transform:rotate(3deg)}}

/* ---------- 场上小鱼：绝对定位按钮，尺寸/坐标由 JS 撒点 ---------- */
.animal{position:absolute;padding:0;border:none;background:none;transform-origin:50% 60%;
  transition:none;will-change:transform}
.animal .swim{display:block;width:100%;height:100%;pointer-events:none;
  animation:an-swim var(--dur,9s) ease-in-out var(--del,0s) infinite alternate}
@keyframes an-swim{from{transform:translateX(-9%)}to{transform:translateX(9%)}}
.animal .swim svg{width:100%;height:100%}
/* 摆尾（SVG 尾巴独立 g，transform-box 锚在鱼身一侧） */
.fishsvg .tail{transform-box:fill-box;transform-origin:86% 50%;animation:an-tail .46s ease-in-out infinite alternate}
@keyframes an-tail{from{transform:rotate(12deg)}to{transform:rotate(-12deg)}}
.animal.fish{filter:drop-shadow(0 3px 0 rgba(150,190,182,.55))}
/* 钓起：角标弹出 → 鱼咬钩被拉出水面（.rise 0.68s）→ .gone 隐藏 */
.animal.rise{animation:an-rise .68s cubic-bezier(.4,.05,.6,1) forwards;pointer-events:none;z-index:5}
@keyframes an-rise{
  0%{transform:translateY(0) scale(1);opacity:1}
  22%{transform:translateY(7%) scale(1.07);opacity:1}
  100%{transform:translateY(-270%) scale(.4) rotate(-14deg);opacity:0}}
.animal.gone{visibility:hidden;pointer-events:none}
/* 点非目标色鱼：摆尾躲开（零惩罚，不计数） */
.animal.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}22%{transform:rotate(-9deg) translateX(5%)}
  55%{transform:rotate(8deg) translateX(-4%)}80%{transform:rotate(-4deg)}}
/* 连错 2 次后：目标色鱼呼吸高亮（首错不 pulse，给再想机会） */
.animal.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{
  0%,100%{filter:none}
  50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 计数角标：钓起序号圆片（1..K） */
.animal .badge{position:absolute;top:-12%;right:-7%;min-width:34px;height:34px;padding:0 5px;
  border-radius:17px;background:#FFF9EE;border:3px solid #E8975A;color:#4A3B2E;
  font-size:21px;font-weight:800;display:none;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;box-shadow:0 2px 0 #D8C9B4;pointer-events:none;z-index:3}
.animal .badge.on{display:flex;animation:badge-pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes badge-pop{from{transform:scale(0) rotate(-18deg)}to{transform:scale(1) rotate(0)}}
/* r7 鱼群游散：散去=内层游出+淡出，按钮 .away 不可点（按钮盒不动=布局断言稳定） */
.animal.away{pointer-events:none}
.animal.away .swim{animation:an-away .55s ease-in forwards}
@keyframes an-away{to{transform:translateY(-46px) scale(.55);opacity:0}}

/* ---------- 题面行：目标色卡（视觉自解释：大色鱼+需钓数圆点，双色依次显示） ---------- */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  min-height:104px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:12px;padding:8px 24px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 14px 5px;border-radius:18px;background:#FFFDF6;border:3px solid var(--c,#E8975A);
  transition:transform .2s}
.card .swatch{width:78px;height:56px;display:block}
.card .swatch svg{width:100%;height:100%}
.card .pips{display:flex;gap:6px}
.card .pips i{width:17px;height:17px;border-radius:50%;border:3px solid var(--c);background:transparent;
  transition:background .2s}
.card .pips i.on{background:var(--c)}
.card .lbl{font-size:15px;font-weight:800;color:#4A3B2E;line-height:1.1}
.card.cur .swatch{animation:card-bob 1.3s ease-in-out infinite}
@keyframes card-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.card.next{opacity:.42;transform:scale(.78)}
.card.done{opacity:.9}
.card .mark{position:absolute;right:-11px;top:-11px;width:32px;height:32px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.card .mark svg{width:22px;height:22px}
@keyframes opt-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
#prompt-chip .then{width:34px;height:34px;flex:0 0 34px}
/* r7 间色卡：成分迷你鱼行（当前步亮/未到暗）+ 目标间色大鱼（合成目标视觉自解释） */
.card.mix{flex-direction:column;align-items:center;gap:3px}
.card.mix .mixrow{display:flex;align-items:center;gap:5px}
.card.mix .mini{display:flex;flex-direction:column;align-items:center;gap:1px;width:64px;
  padding:4px 3px 3px;border-radius:12px;background:#FFFDF6;border:2.5px solid var(--c);
  transition:opacity .2s,transform .2s}
.card.mix .mini .fishsvg{width:52px;height:38px}
.card.mix .mini.cur{animation:card-bob 1.3s ease-in-out infinite}
.card.mix .mini.dim{opacity:.45;transform:scale(.86)}
.card.mix .mini.fin{opacity:.85}
.card.mix .mini .pips{display:flex;gap:4px}
.card.mix .mini .pips i{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--c);
  background:transparent;transition:background .2s}
.card.mix .mini .pips i.on{background:var(--c)}
.card.mix .plus{font-style:normal;font-size:22px;font-weight:800;color:#4A3B2E;line-height:1}
.card.mix .swatch{width:88px;height:60px}
.card.mix.done .mini{opacity:.9;transform:none}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch5/6） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：色卡与题面适配（鱼按 pond 实际宽高撒点，无需改） */
@media (orientation:portrait){
  .card .swatch{width:70px;height:50px}
  .card.next{transform:scale(.72)}
  #prompt-chip{gap:9px;padding:8px 16px}
  .card.mix .mini{width:56px}
  .card.mix .mini .fishsvg{width:46px;height:34px}
  .card.mix .swatch{width:76px;height:52px}
  #prompt{min-height:96px}
}
</style>
</head>
<body>
<div id="game" aria-label="钓鱼颜色">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="pond" aria-label="池塘">
      <div class="water" aria-hidden="true"></div>
      <div id="rod" aria-hidden="true"></div>
    </div>
    <div id="prompt">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= fishcolor 纯引擎：确定性关卡生成 + 钓鱼判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   章难度（r7 改造，SPEC-BATCH7 §1 r7 块；进度章号单调递增、难度章号 (ch-1)%4+1 循环）：
   dch1 单色：基础 4 色，6-8 鱼，K=2-3，干扰 2-3
   dch2 两步序：两目标先后（need 组合和 2-3），6-9 鱼，黑白干扰 ≥1，无近似干扰（序记忆为主负荷）
   dch3 间色：橙=红+黄/绿=黄+蓝/紫=红+蓝，成分各 2 条+非成分干扰，6-8 鱼，场上无间色目标鱼
   dch4 混排：TYPE_PATTERNS[lv%3] 轮换三题型（single K=3 近似干扰 ≥2 / two 和 3-4 / mix），
     8-10 鱼；生成关=同通道 dch 循环
   规则铁律：每步目标色鱼数 ≥ need；干扰色绝不与目标色同名；间色题场上绝无间色鱼 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致，杜绝生成关软锁）；难度章号四章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

function engActive(q) {
  for (let k = 0; k < q.targets.length; k++) {
    if ((q.got[k] || 0) < q.need[k]) return k;
  }
  return -1;
}
/* 干扰鱼总数（色不在 targets 中的鱼） */
const engDistract = q => q.fishes.filter(f => q.targets.indexOf(f.c) < 0).length;
/* 近似色干扰鱼数（色与任一目标构成近似对） */
const engNearFish = q => q.fishes.filter(f =>
  q.targets.indexOf(f.c) < 0 && q.targets.some(t => isNearPair(t, f.c))).length;

/* ---------- 题型常量（r7） ---------- */
const DUAL_NEEDS = [[1, 1], [2, 1], [1, 2]];        // dch2 两步序（和 2-3）
const DUAL_NEEDS4 = [[2, 1], [1, 2], [2, 2]];       // dch4 两步序（和 3-4）
const MIX_KEYS = ['orange', 'green', 'purple'];
const TYPE_PATTERNS = [                             // dch4 每关三题型轮换（每关三型各 ≥1）
  ['single', 'two', 'mix', 'two', 'single'],
  ['two', 'mix', 'single', 'mix', 'two'],
  ['mix', 'single', 'two', 'single', 'mix']
];

/* ---------- 单题生成（rnd 同流保证确定性；lastC=避免与上一题主目标色相同）
   返回 { kind('single'|'two'|'mix'), mix, shortMix, targets, need, got, fishes } */
function genOne(dch, qi, rnd, lastC, lv) {
  const pool = POOLS[dch];
  let t1 = pool[Math.floor(rnd() * pool.length)];
  for (let t = 0; t < 8 && lastC && t1 === lastC; t++) t1 = pool[Math.floor(rnd() * pool.length)];
  const others = pool.filter(c => c !== t1);
  let targets = [t1], need = [0], mix = null, shortMix = false;
  let tN1 = 0, tN2 = 0, distr = [];

  if (dch === 1) {                                   // 章 1：单色，6-8 鱼，K=2-3
    const C = CHAPTERS[1];
    const K = ri(rnd, 2, 3), total = ri(rnd, C.tMin, C.tMax);
    const dn = ri(rnd, 2, Math.min(3, total - K));
    need = [K]; tN1 = total - dn;
    distr = shuffled(others, rnd).slice(0, dn);
  } else if (dch === 2) {                            // 章 2：两步序，6-9 鱼，黑白 ≥1，无近似干扰
    const C = CHAPTERS[2];
    const t2 = others[Math.floor(rnd() * others.length)];
    const nd = DUAL_NEEDS[Math.floor(rnd() * DUAL_NEEDS.length)];
    const bwPick = shuffled(['black', 'white'], rnd).slice(0, ri(rnd, 1, 2));
    const restPool = shuffled(pool.filter(c =>
      c !== t1 && c !== t2 && !isNearPair(c, t1) && !isNearPair(c, t2)), rnd);
    /* 总数恒落 [tMin,tMax]：先定干扰 dn，再按剩余区间定目标鱼数（防 clamp 掉下界） */
    const base = nd[0] + nd[1];
    const dn = Math.min(ri(rnd, 2, 4), bwPick.length + restPool.length, C.tMax - base - 1);
    const lo = Math.max(base, C.tMin - dn), hi = C.tMax - dn;
    const tn = lo + Math.floor(rnd() * (hi - lo + 1));
    const extra = tn - base, e1 = ri(rnd, 0, extra), e2 = extra - e1;
    targets = [t1, t2]; need = [nd[0], nd[1]];
    tN1 = nd[0] + e1; tN2 = nd[1] + e2;
    distr = bwPick.concat(restPool.slice(0, Math.max(0, dn - bwPick.length)));
  } else if (dch === 3) {                            // 章 3：间色合成，6-8 鱼，成分各 2 条
    const C = CHAPTERS[3];
    let mk = MIX_KEYS[Math.floor(rnd() * MIX_KEYS.length)];
    for (let t = 0; t < 8 && lastC && MIXES[mk][0] === lastC; t++) mk = MIX_KEYS[Math.floor(rnd() * MIX_KEYS.length)];
    targets = MIXES[mk].slice(); need = [1, 1]; mix = mk;
    tN1 = 2; tN2 = 2;
    const rem = pool.filter(c => targets.indexOf(c) < 0)[0];   // 非成分原色（恰一种）
    const extras = shuffled(['pink', 'black', 'white'], rnd);
    const dn = ri(rnd, 2, 4);                                  // rem 1 + extras dn-1 → 总 6-8
    distr = [rem].concat(extras.slice(0, dn - 1));
  } else {                                           // 章 4：混排三题型，8-10 鱼
    const C = CHAPTERS[4];
    const kind = TYPE_PATTERNS[lv % 3][qi];
    if (kind === 'single') {                         // 单色 K=3 + 近似干扰 ≥2（t1 必带近似色）
      for (let t = 0; t < 8 && !nearOf(t1).some(c => pool.indexOf(c) >= 0 && c !== t1); t++) {
        t1 = pool[Math.floor(rnd() * pool.length)];
      }
      const oth4 = pool.filter(c => c !== t1);       // t1 重取后重算（防 others 过期混入目标色）
      const near = nearOf(t1).filter(c => oth4.indexOf(c) >= 0);
      const total = ri(rnd, C.tMin, C.tMax);
      need = [3]; tN1 = 3 + ri(rnd, 0, 1);
      const dn = total - tN1;
      distr = near.length === 1 ? [near[0], near[0]] : near.slice(0, 2);
      const rest = shuffled(oth4.filter(c => distr.indexOf(c) < 0), rnd);
      distr = distr.concat(rest.slice(0, Math.max(0, dn - distr.length)));
    } else if (kind === 'two') {                     // 两步序（和 3-4）
      const t2 = others[Math.floor(rnd() * others.length)];
      const nd = DUAL_NEEDS4[Math.floor(rnd() * DUAL_NEEDS4.length)];
      const restPool = shuffled(pool.filter(c => c !== t1 && c !== t2), rnd);
      const base = nd[0] + nd[1];
      const dn = Math.min(ri(rnd, 2, 5), restPool.length, C.tMax - base - 1);
      const lo = Math.max(base, C.tMin - dn), hi = C.tMax - dn;
      const tn = lo + Math.floor(rnd() * (hi - lo + 1));
      const extra = tn - base, e1 = ri(rnd, 0, extra), e2 = extra - e1;
      targets = [t1, t2]; need = [nd[0], nd[1]];
      tN1 = nd[0] + e1; tN2 = nd[1] + e2;
      distr = restPool.slice(0, dn);
    } else {                                         // 间色（复习短句）
      let mk = MIX_KEYS[Math.floor(rnd() * MIX_KEYS.length)];
      for (let t = 0; t < 8 && lastC && MIXES[mk][0] === lastC; t++) mk = MIX_KEYS[Math.floor(rnd() * MIX_KEYS.length)];
      targets = MIXES[mk].slice(); need = [1, 1]; mix = mk; shortMix = true;
      tN1 = 2; tN2 = 2;
      const rem = POOLS[3].filter(c => targets.indexOf(c) < 0)[0];
      const extras = shuffled(['pink', 'black', 'white'], rnd);
      const dn = ri(rnd, 4, 5);                                 // rem 1 + extras → 总 8-9
      distr = [rem].concat(extras.slice(0, dn - 1));
    }
  }

  /* 鱼色列表（目标色 tN1+tN2 条 + 干扰 distr 条）→ 洗牌 → 逐条生成姿态参数
     （mix 题 targets[0] ≠ 初始 t1——一律按 targets 取色，两步/单色不受影响） */
  const cols = [];
  for (let i = 0; i < tN1; i++) cols.push(targets[0]);
  for (let i = 0; i < tN2; i++) cols.push(targets[1]);
  distr.forEach(c => cols.push(c));
  const fishes = shuffled(cols, rnd).map(c => ({
    c: c, f: rnd() < 0.5 ? 1 : 0, e: rnd() < 0.15 ? 1 : 0,
    s: Math.round(94 + rnd() * 12) / 100, w1: rnd(), w2: rnd()
  }));
  return { kind: mix ? 'mix' : (need.length > 1 ? 'two' : 'single'),
    mix: mix, shortMix: shortMix,
    targets: targets, need: need, got: need.map(() => 0),
    fishes: fishes, seed: 0, _cnt: 0, _gone: [], _miss: 0 };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const quizzes = [];
  let lastC = null;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genOne(dch, qi, rnd, lastC, lv);
    q.seed = (flat * 5 + qi) * 7919 + 13;           // 撒点专用种子（渲染期独立流，同题同尺寸同布局）
    lastC = q.targets[0];
    quizzes.push(q);
  }
  return { flat, ch, dch, lv, quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 钓鱼引擎（无 DOM）：engTapFish(L, i) —— 点第 i 条鱼
   返回数值 = 钓起（本题累计钓起数 1..K，题继续）；
   'done' = 最后一钓本题完成（末题则通关）；'wrong' = 点非目标色鱼（躲开，计错点）；
   'again' = 点已钓起的鱼（早退零惩罚不计数）；null = 非法/关卡已结束
   两步序/间色：未到当前步的目标色鱼一律 'wrong'（顺序须自行记住，按序完成才过题） ---------- */
function engTapFish(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || i < 0 || i >= q.fishes.length) return null;
  q._gone = q._gone || [];
  if (q._gone[i]) return 'again';
  const act = engActive(q);
  if (act < 0) return 'again';
  if (q.fishes[i].c === q.targets[act]) {
    q._gone[i] = 1;
    q.got[act] = (q.got[act] || 0) + 1;
    q._cnt = (q._cnt || 0) + 1;
    if (engActive(q) < 0) {                          // 本题钓满：推进
      q.solved = true;
      L.step++;
      if (L.step >= L.quizzes.length) L.done = true;
      return 'done';
    }
    return q._cnt;
  }
  q._miss = (q._miss || 0) + 1;
  L.retries++;                                       // 错点次数（星级判据：0=3★ / 1-2=2★ / 更多=1★）
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级：一关零错点=3 星；错点 ≤2=2 星；否则 1 星。永不 0 星 */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：kind/目标数形状、need 1-3、目标色互异、
   每步目标色鱼数 ≥need、间色题 targets=配方序且场上绝无间色鱼 */
function structOk(q) {
  if (!q || !q.targets || !q.targets.length) return false;
  if (q.need.length !== q.targets.length || q.got.length !== q.targets.length) return false;
  const shapeOk = (q.kind === 'single' && q.targets.length === 1) ||
    ((q.kind === 'two' || q.kind === 'mix') && q.targets.length === 2);
  if (!shapeOk) return false;
  for (let k = 0; k < q.targets.length; k++) {
    if (!COLORS[q.targets[k]]) return false;
    if (!(q.need[k] >= 1 && q.need[k] <= 3)) return false;
    if (q.got[k] !== 0) return false;
    for (let j = k + 1; j < q.targets.length; j++) if (q.targets[k] === q.targets[j]) return false;
  }
  if (!q.fishes.length) return false;
  if (q.kind === 'mix') {                            // 间色：配方在册、targets=配方序、场上无间色鱼
    if (!MIXES[q.mix]) return false;
    if (q.targets[0] !== MIXES[q.mix][0] || q.targets[1] !== MIXES[q.mix][1]) return false;
    for (let i = 0; i < q.fishes.length; i++) if (q.fishes[i].c === q.mix) return false;
  }
  const targetCount = {};
  q.targets.forEach(t => targetCount[t] = 0);
  for (let i = 0; i < q.fishes.length; i++) {
    if (!COLORS[q.fishes[i].c]) return false;
    if (targetCount[q.fishes[i].c] != null) targetCount[q.fishes[i].c]++;
  }
  for (let k = 0; k < q.targets.length; k++) {       // 每步目标色鱼数 ≥ need（钓起后仍够数）
    if (targetCount[q.targets[k]] < q.need[k]) return false;
  }
  return true;
}

/* ---------- 位置撒点（渲染像素空间，确定性纯函数：同 (seed,W,H,n,D) 同布局）——照 batch5/6
   拒绝采样：每点最多 160 试，全部失败按 0.92 逐级放宽兜底（标准 viewport 下 n≤10 恒不需放宽）
   返回 [{x,y}...]（场内中心坐标，已含 margin 收缩） */
function scatterPts(rnd, W, H, n, D, margin) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    let placed = false, d = D, guard = 0;
    while (!placed && guard++ < 24) {
      for (let t = 0; t < 160 && !placed; t++) {
        const x = margin + rnd() * Math.max(1, W - 2 * margin);
        const y = margin + rnd() * Math.max(1, H - 2 * margin);
        let ok = true;
        for (let k = 0; k < pts.length; k++) {
          const dx = pts[k].x - x, dy = pts[k].y - y;
          if (dx * dx + dy * dy < d * d) { ok = false; break; }
        }
        if (ok) { pts.push({ x: Math.round(x), y: Math.round(y) }); placed = true; }
      }
      if (!placed) d *= 0.92;                        // 极小场地兜底（verify 断言标准 viewport ≥90px 不触发）
    }
    if (!placed) pts.push({ x: Math.round(W / 2), y: Math.round(H / 2) }); // 理论不可达保险
  }
  return pts;
}

/* 题面色卡：视觉自解释（大色鱼+需钓数圆点，钓起点亮）；两步序=两张卡依次显示（当前大/下一暗） */
function chipCard(q, k, cls) {
  const C = COLORS[q.targets[k]];

  for (let i = 0; i < n; i++) pips += '<i class="' + (i < g ? 'on' : '') + '"></i>';

    '<span class="swatch">' + fishSvg({ c: q.targets[k], f: 0, e: 0 }) + '</span>' +
    '<span class="pips">' + pips + '</span>' +

/* r7 间色卡：成分迷你鱼×2（各带圆点，当前步亮）+ 目标间色大鱼（配方序=点钓序，视觉自解释） */

    let pips = '';
    for (let i = 0; i < n; i++) pips += '<i class="' + (i < g ? 'on' : '') + '"></i>';
    return '<span class="mini ' + (act === k ? 'cur' : (act < 0 ? 'fin' : 'dim')) + '" style="--c:' + C.body + '">' +
      fishSvg({ c: q.targets[k], f: 0, e: 0 }) + '<span class="pips">' + pips + '</span></span>';
  };
  return '<div class="card mix ' + cls + '" style="--c:' + M.body + '" aria-label="钓' +
    COLORS[q.targets[0]].name + '和' + COLORS[q.targets[1]].name + '小鱼，变' + M.name + '">' +
    '<span class="mixrow">' + mini(0) + '<i class="plus" aria-hidden="true">+</i>' + mini(1) + '</span>' +
    '<span class="swatch">' + fishSvg({ c: q.mix, f: 0, e: 0 }) + '</span>' +
    '<span class="lbl">' + M.name + '</span>' +
    (cls === 'done' ? '<span class="mark">' + ICONS.check + '</span>' : '') +
    '</div>';
}

  const actBefore = engActive(q);

  const r = engTapFish(cur, i);

  if (r === 'again') return 'again';             /* 已钓起：早退零惩罚不计数（§0.7） */

  if (r === 'wrong') {                           /* 点非目标色鱼：摆尾躲开零惩罚+sayW 纠错方向锚 */

    sayW(vw.key, vw.text);                       /* flat<3 每错必播 / flat≥3 10s 节流（P1） */

    state.locked = true;

    sfx('coin');

      KIDS.voice.play('fis_mix_' + q.mix + '_' + (MIXES[q.mix][0] === q.targets[0] ? '12' : '21'),

    }

    if (cur !== run) return r;                   /* 演出窗内重玩已重建关卡，丢弃旧续体 */
    state.locked = false;

    if (engActive(q) !== actBefore) chimeStep(); /* r7 分步推进：换卡+轻铃，不重播语音（序自记） */
    if (state.tut === 'help') pointHelpNext();   /* "帮"：跟着孩子的节奏指向下一条 */
  }

}

      q.fishes.forEach(f => { fishHist[f.c]++; });                            // 场上鱼色统计

          if (q.fishes.some(f => f.c === q.mix)) ruleOk = false;
          if (q.fishes.filter(f => f.c === q.targets[0]).length < 2 ||
              q.fishes.filter(f => f.c === q.targets[1]).length < 2) ruleOk = false;
        }
      }
      if (speechV(q) !== quizSpeech(q)) ruleOk = false;                       // 题句漂移对账
      if (k > 0 && L1.quizzes[k - 1].targets[0] === q.targets[0]) adjOk = false;   // 相邻主目标互异
    }
    if (L1.dch === 4) {                                                       // dch4 每关三型各 ≥1
      ['single', 'two', 'mix'].forEach(t => { if (kindsSeen.indexOf(t) < 0) ruleOk = false; });
    }
    /* 顺序铁律探针（独立实例）：每题先点后步色必 wrong，再按步序正常通关推进 */
    const Lp = genLevel(flat);
    for (let k = 0; k < Lp.quizzes.length && orderOk; k++) {
      const q = Lp.quizzes[Lp.step];
      const early = q.fishes.findIndex(f => f.c === q.targets[1]);
      if (q.targets.length === 2 && early >= 0 && engTapFish(Lp, early) !== 'wrong') orderOk = false;
      while (orderOk && engActive(q) >= 0) {
        const act = engActive(q);
        const i = q.fishes.findIndex((f, j) => f.c === q.targets[act] && !(q._gone && q._gone[j]));
        if (i < 0) { orderOk = false; break; }
        engTapFish(Lp, i);
      }
    }
    /* 引擎直驱：按步序钓起目标色鱼（累计数递增断言→末钓 'done'）→ 0 错点通关 3 星 */
    let driveOk = true;
    for (let k = 0; k < L1.quizzes.length && driveOk; k++) {
      const q = L1.quizzes[k];
      let want = 0;
      while (engActive(q) >= 0) {
        const act = engActive(q);
        const i = q.fishes.findIndex((f, j) => f.c === q.targets[act] && !(q._gone && q._gone[j]));
        if (i < 0) { driveOk = false; break; }
        want++;
        const last = q.got[act] + 1 >= q.need[act] && act === q.targets.length - 1;
        const r = engTapFish(L1, i);
        if (r !== (last ? 'done' : want)) { driveOk = false; break; }
      }
      if (!driveOk || engActive(q) >= 0) driveOk = false;
    }
    const solvedAll = L1.done && L1.step === CH_LEN && L1.retries === 0 && engStars(L1) === 3;
    const ok = det && L1.quizzes.length === CH_LEN && ruleOk && structAll && adjOk &&
      rangeOk && orderOk && driveOk && solvedAll;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, ruleOk: ruleOk, structAll: structAll,
      adjOk: adjOk, rangeOk: rangeOk, orderOk: orderOk, driveOk: driveOk, solvedAll: solvedAll,
      modeledMs: modeledMs(L1),
      qs: L1.quizzes.map(q => q.kind[0] + ':' + q.targets.map((t, j) => NAMES[t][0] + q.need[j]).join('>') + '(' + q.fishes.length + ')') };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② 钓鱼单元（flat 0 真实 UI 状态机；钓 need-1 条留题开放 → 补最后一钓 'done'） ---- */
  total++;
  startLevel(0);
  const q0 = FIS.quiz;
  const act0 = q0.act;
  const tcol = q0.targets[act0];
  const needN = q0.need[act0];
  const live = [];
  q0.fishes.forEach((f, i) => { if (f.c === tcol && !q0.gone[i]) live.push(i); });
  const taps = [];
  for (let k = 0; k < needN - 1 && k < live.length - 1; k++) {
    taps.push(await FIS.tapFish(live[k]));
    await wait(40);
  }
  const openN = taps.length;                     // 题仍开放时的已钓数（1..need-1）
  const incOk = openN >= 1 && taps.every((v, i) => v === i + 1) &&
    FIS.currentLevel.caught === openN;
  const domOk = pondEl.querySelectorAll('.badge.on').length === openN;   // 每钓一条一个角标
  const againOk = (await FIS.tapFish(live[0])) === 'again';             // 已钓起：早退零惩罚
  const againKeep = FIS.currentLevel.step === 0 && FIS.currentLevel.retries === 0 && FIS.currentLevel.caught === openN;
  const badIdx = (await FIS.tapFish(99)) === false && (await FIS.tapFish(-1)) === false;
  const lastR = await FIS.tapFish(live[openN]);                        // 最后一钓：'done' 推进换题
  await wait(160);                                                      // 推进演出窗（SPEED 提速）
  const doneOk = lastR === 'done' && FIS.currentLevel.step === 1 && FIS.currentLevel.caught === 0;
  const tapOk = incOk && domOk && againOk && againKeep && badIdx && doneOk;
  if (tapOk) npass++;
  units.tapFish = { ok: tapOk, taps: taps, domBadges: pondEl.querySelectorAll('.badge.on').length,
    again: againOk, badIdx: badIdx, lastDone: doneOk };

  /* ---- ②b 错点单元 + sayW 节流（flat0 每错必播 / flat3 10s 一条；均点干扰色→fis_wrong） ---- */
  total++;
  let playLog = [];
  const origPlay = KIDS.voice.play;
  KIDS.voice.play = function (key, text) { playLog.push(key); };
  startLevel(0);                                 /* flat0：每错必播 */
  const qw = FIS.quiz;
  const widx = qw.fishes.findIndex(f => f.c !== qw.targets[qw.act]);
  const t0 = firstLiveTarget(cur.quizzes[cur.step]);
  const noPulse1 = !(t0 >= 0 && fishEl(t0) && fishEl(t0).classList.contains('breathe'));
  await FIS.tapFish(widx);                       /* 首错：躲开，不 pulse 目标鱼 */
  await FIS.tapFish(widx);                       /* 二错：目标鱼 breathe 高亮出现 */
  await wait(500);
  const t1 = firstLiveTarget(cur.quizzes[cur.step]);
  const wrongOk = FIS.currentLevel.retries === 2 && FIS.currentLevel.step === 0 &&
    noPulse1 && !!(t1 >= 0 && fishEl(t1) && fishEl(t1).classList.contains('breathe'));
  const sayA = playLog.filter(k2 => k2 === 'fis_wrong').length;   // flat0 两错 → 2 条
  startLevel(3);                                 /* flat3：10s 节流 → 两错只 1 条 */
  const qw3 = FIS.quiz;
  const widx3 = qw3.fishes.findIndex(f => f.c !== qw3.targets[qw3.act]);
  playLog = [];
  await FIS.tapFish(widx3);
  await FIS.tapFish(widx3);
  const sayB = playLog.filter(k2 => k2 === 'fis_wrong').length;
  KIDS.voice.play = origPlay;
  const sayWOk = sayA === 2 && sayB === 1 && wrongOk;
  if (sayWOk) npass++;
  units.sayW = { ok: sayWOk, flat0Plays: sayA, flat3Plays: sayB, wrong: wrongOk };

  /* ---- ②c 序错单元（flat5 两步序）：点后步色=fis_wrong_seq；节流窗时间快进后干扰色=fis_wrong ---- */
  total++;
  KIDS.voice.play = function (key, text) { playLog.push(key); };
  startLevel(5);
  playLog = [];
  const qs5 = FIS.quiz;
  const seqOk5 = qs5.kind === 'two' && qs5.targets.length === 2;
  const early5 = qs5.fishes.findIndex(f => f.c === qs5.targets[1]);
  const realNow = Date.now; let vNow = realNow() + 20000;   // 起点即过节流窗（②b 刚播过一条）
  Date.now = () => vNow;
  const rSeq = await FIS.tapFish(early5);        /* 点第二步骤色：wrong + 序错方向锚 */
  const seqClip = playLog.indexOf('fis_wrong_seq') >= 0;
  vNow += 11000;                                 /* 快进 11s：过 sayW 10s 节流窗（flat5≥3） */
  const d5 = FIS.quiz.fishes.findIndex(f => f.c !== FIS.quiz.targets[0] && f.c !== FIS.quiz.targets[1]);
  const rD5 = await FIS.tapFish(d5);             /* 点干扰色：wrong + 颜色方向锚 */
  Date.now = realNow;
  const colClip = playLog.indexOf('fis_wrong') >= 0;
  KIDS.voice.play = origPlay;
  const seqUnitOk = seqOk5 && early5 >= 0 && rSeq === 'wrong' && seqClip &&
    d5 >= 0 && rD5 === 'wrong' && colClip &&
    FIS.currentLevel.retries === 2 && FIS.currentLevel.step === 0;
  if (seqUnitOk) npass++;
  units.seqWrong = { ok: seqUnitOk, kind: qs5.kind, rSeq: rSeq, seqClip: seqClip,
    rD5: rD5, colClip: colClip, log: playLog.slice(0, 4) };

  /* ---- ③ UI 冒烟 A：flat0 首错零惩罚 + 通关（1 错点=2 星） ---- */
  total++;
  startLevel(0);
  let smokeA = true, wrongDone = false, steps = 0;
  for (let s = 0; s < CH_LEN && smokeA; s++) {
    const q = FIS.quiz;
    if (!q) { smokeA = false; break; }
    if (!wrongDone) {                            /* 首题先错一次：躲开零惩罚，不推进不弹层 */
      const w = q.fishes.findIndex(f => f.c !== q.targets[q.act]);
      const r = await FIS.tapFish(w);
      wrongDone = r === 'wrong' && FIS.currentLevel.step === 0 && FIS.currentLevel.retries === 1;
      if (!wrongDone) smokeA = false;
    }
    while (smokeA && FIS.quiz && FIS.quiz.step === s) {
      const i = firstLiveTarget(cur.quizzes[cur.step]);
      if (i < 0) break;
      const r = await FIS.tapFish(i);
      if (r === false || r === null || r === 'again') { smokeA = false; break; }
      await wait(40);
    }
    steps++;
  }
  const lvA = FIS.currentLevel;
  const smokeOkA = smokeA && wrongDone && steps === CH_LEN && lvA.done && lvA.won && lvA.retries === 1 &&
    engStars(cur) === 2 && !document.querySelector('.k-celebrate');   // verify 页不弹层
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, wrongDone: wrongDone, steps: steps, retries: lvA.retries, stars: engStars(cur) };

  /* ---- ③ UI 冒烟 B：flat15（章 4 混排）题型模式 + autoSolve UI 通路通关 ---- */
  total++;
  const L15 = genLevel(15);
  const patOk = L15.quizzes.every((q, k) => q.kind === PATTERNS[L15.lv % 3][k]) &&
    ['single', 'two', 'mix'].every(t => L15.quizzes.some(q => q.kind === t));
  startLevel(15);
  const q15 = FIS.quiz;
  const fishOk = q15.fishes.length >= 8 && q15.fishes.length <= 10;
  const a15 = await FIS.autoSolve();
  const lv15 = FIS.currentLevel;
  const smokeOkB = patOk && fishOk && a15.done && lv15.done && lv15.won && lv15.retries === 0 && engStars(cur) === 3;
  if (smokeOkB) npass++;
  smokes.flat15 = { ok: smokeOkB, pattern: patOk, fishes: q15.fishes.length,
    kinds: L15.quizzes.map(q => q.kind).join(','), taps: a15.taps, stars: engStars(cur) };

  /* ---- ③C 间色单元（flat10 章 3）：无间色鱼+双成分卡+序错=wrong+按序合成=done ---- */
  total++;
  startLevel(10);
  let mixOk = true;
  const qm = FIS.quiz;
  if (qm.kind !== 'mix' || !MIXV[qm.mix] ||
      qm.targets[0] !== MIXV[qm.mix][0] || qm.targets[1] !== MIXV[qm.mix][1]) mixOk = false;
  if (qm.fishes.some(f => f.c === qm.mix)) mixOk = false;                 // 场上无间色目标鱼
  const domMix = !!(chipEl.querySelector('.card.mix') &&
    chipEl.querySelectorAll('.card.mix .mini').length === 2);              // 双成分迷你鱼卡
  const e2 = qm.fishes.findIndex(f => f.c === qm.targets[1]);
  const rE2 = await FIS.tapFish(e2);                                     // 先点第二成分=wrong
  const i1 = qm.fishes.findIndex((f, i) => f.c === qm.targets[0] && !qm.gone[i]);
  const r1 = await FIS.tapFish(i1);                                      // 第一成分=1
  await wait(60);
  const pip1 = chipEl.querySelectorAll('.card.mix .mini .pips i.on').length;
  const i2 = qm.fishes.findIndex((f, i) => f.c === qm.targets[1] && !qm.gone[i]);
  const r2 = await FIS.tapFish(i2);                                      // 第二成分=done
  await wait(160);
  const mixUnitOk = mixOk && domMix && rE2 === 'wrong' && r1 === 1 && r2 === 'done' &&
    pip1 === 1 && FIS.currentLevel.step === 1 && FIS.currentLevel.retries === 1;
  if (mixUnitOk) npass++;
  units.mix = { ok: mixUnitOk, mix: qm.mix, targets: qm.targets.slice(), noMixFish: mixOk,
    domMix: domMix, earlyWrong: rE2, r1: r1, r2: r2, pip1: pip1 };

  /* ---- ④ 布局：双 viewport 模拟 ×（章 3 间色卡 / 章 4 密集） ---- */
  function simView(w, h) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    renderQuiz();                                // 按新池塘尺寸重新撒点（同 seed 同尺寸同布局）
    const de = document.documentElement;
    const fishes = Array.prototype.map.call(pondEl.querySelectorAll('.animal'), b => {
      const r = b.getBoundingClientRect();
      const sw = b.querySelector('.swim');
      const sr = sw ? sw.getBoundingClientRect() : r;   // 游动内层实时盒（translateX 动画进行中）
      return { x: r.left + r.width / 2, y: r.top + r.height / 2,
        w: r.width, h: r.height, lw: sr.width, lh: sr.height };
    });
    const hitOk = fishes.length > 0 && fishes.every(a => a.w >= 64 && a.h >= 64 && a.lw >= 64 && a.lh >= 64);
    let distOk = true, minD = 1e9;
    for (let i = 0; i < fishes.length; i++) {
      for (let j = i + 1; j < fishes.length; j++) {
        const d = Math.hypot(fishes[i].x - fishes[j].x, fishes[i].y - fishes[j].y);
        if (d < minD) minD = d;
        if (d < 90) distOk = false;              // 撒点中心距 ≥90px：防重叠不可点
      }
    }
    const chipOk = chipEl.getBoundingClientRect().height >= 78;   // 色卡题面行可视高度
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, hitOk: hitOk, distOk: distOk, minD: Math.round(minD),
      fishes: fishes.length, chipOk: chipOk, ox: ox, pass: hitOk && distOk && chipOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const flat of [10, 15]) {                 // 章 3 间色卡（最高卡）/ 章 4 最密 10 鱼
    startLevel(flat);
    sims.push(simView(1280, 800));
    sims.push(simView(800, 1180));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                 // 还原真实 viewport 布局
  const layoutOk = sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ④ 附：scatterPts 确定性 + 最密场景 ≥90px 单元（章 4 极值 10 鱼 D=106，留余量 12 点） ---- */
  total++;
  const sc1 = scatterPts(mulberry32(987654), 900, 460, 12, 96, 54);
  const sc2 = scatterPts(mulberry32(987654), 900, 460, 12, 96, 54);
  const scDet = JSON.stringify(sc1) === JSON.stringify(sc2) && sc1.length === 12;
  const minOf = pts => {
    let mn = 1e9;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
      if (d < mn) mn = d;
    }
    return mn;
  };
  const scMin = minOf(sc1);
  const dense = [
    scatterPts(mulberry32(700001), 1172, 420, 10, 106, 51),    // 横屏最密（章 4 极值 10 鱼）
    scatterPts(mulberry32(700002), 740, 700, 10, 106, 51),     // 竖屏最密
    scatterPts(mulberry32(700003), 1172, 420, 12, 106, 51)     // 余量（>实际最多 10）
  ].map(minOf);
  const denseOk = dense.every(d => d >= 90);
  const scOk = scDet && scMin >= 96 && denseOk;
  if (scOk) npass++;
  units.scatter = { ok: scOk, det: scDet, minD: Math.round(scMin), dense: dense.map(d => Math.round(d)) };

  /* ---- ⑤ 时长硬断言（r7 ≥40s/关）+ estMs 家族字面验算 + 题句漂移对账 ---- */
  total++;
  const estOk = estMs(9) === 9 * 345 + 600 && estMs(9) === 3705 &&
    estMs(0) === 600 && estMs(1) === 945;
  const modeledAll = [];
  for (let flat = 0; flat < 40; flat++) modeledAll.push(modeledMs(genLevel(flat)));
  const minMs = Math.min.apply(null, modeledAll);
  let speechOk = true;                            // 题句本地副本 vs 引擎 quizSpeech 逐字符（防漂移）
  for (let flat = 0; flat < 40; flat++) {
    genLevel(flat).quizzes.forEach(q => { if (speechV(q) !== quizSpeech(q)) speechOk = false; });
  }
  const durOk = estOk && minMs >= 40000 && speechOk;
  if (durOk) npass++;
  units.duration = { ok: durOk, estOk: estOk, minMs: minMs, floorMs: 40000,
    perDch: [1, 2, 3, 4].map(d => {
      const v = [];
      for (let flat = 0; flat < 40; flat++) { const L = genLevel(flat); if (L.dch === d) v.push(modeledMs(L)); }
      return Math.round(v.reduce((a, b) => a + b, 0) / v.length);
    }) };

  /* ---- ⑥ 鱼群游散单元：ch1 不启用；ch3 在场→散去→重出（进度保留/散去期不可点） ---- */
  total++;
  const waitPhase = async (ph, timeout) => {      // 轮询等相位（away 窗仅 384ms，固定 sleep 会跳过）
    const t0 = Date.now();
    while (Date.now() - t0 < timeout) {
      if (FIS.school.phase === ph) return true;
      await wait(50);
    }
    return FIS.school.phase === ph;
  };
  startLevel(0);
  const offOk = FIS.school.on === false;
  startLevel(10);                                 // ch3（SPEED 压缩：present 1.8s / away 0.384s）
  const sOn = FIS.school.on === true && FIS.school.phase === 'present' && FIS.school.cycle === 0;
  const q10 = FIS.quiz;
  const tgt10 = q10.fishes.findIndex((f, i) => f.c === q10.targets[q10.act] && !q10.gone[i]);
  const rc = await FIS.tapFish(tgt10);            // 在场期钓一条当前步目标鱼（进度）
  const sawAway = await waitPhase('away', 4000);  // 过 present 窗（1800ms）→ 散去
  const awayOk = sawAway &&
    pondEl.querySelectorAll('.animal.away').length === FIS.quiz.fishes.length &&
    FIS.currentLevel.caught === 1 && FIS.currentLevel.step === 0;     // 进度保留
  const missBefore = FIS.quiz.miss, retBefore = FIS.currentLevel.retries;
  pondEl.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));   // 散去期空白点
  const blankOk = FIS.quiz.miss === missBefore && FIS.currentLevel.retries === retBefore;
  const sawBack = await waitPhase('present', 3000) && FIS.school.cycle === 1; // 过 away 窗 → 重出
  const backOk = sawBack &&
    pondEl.querySelectorAll('.animal').length === FIS.quiz.fishes.length &&
    FIS.quiz.gone.filter(g => g).length === 1;    // 已钓鱼仍 gone
  const schoolOk = offOk && sOn && rc === 1 && awayOk && blankOk && backOk;
  if (schoolOk) npass++;
  units.school = { ok: schoolOk, ch1Off: offOk, on: sOn, away: awayOk, blank: blankOk, back: backOk };

  /* ---- ⑦ 覆盖：目标色 5 色各 ≥1 + 间色 3 键各 ≥1 + 9 色场上鱼各 ≥1 ---- */
  total++;
  const tgtOk = ['red', 'yellow', 'blue', 'green', 'orange'].every(c => colorHist[c] >= 1);
  const mixCovOk = Object.keys(MIXV).every(c => mixHist[c] >= 1);
  const fishCovOk = Object.keys(NAMES).every(c => fishHist[c] >= 1);
  const distOk = tgtOk && mixCovOk && fishCovOk;
  if (distOk) npass++;
  units.colorDist = { ok: distOk, targets: colorHist, mixes: mixHist, fishes: fishHist };

  /* ---- ⑧ 教学/演出吞输入单元：demo+locked 门拦真实与钩子输入 ---- */
  total++;
  startLevel(0);
  state.demo = true; state.locked = true;        // 模拟教学"看"演示期（locked 吞输入）
  const swallow1 = (await FIS.tapFish(0)) === false;
  state.demo = false; state.locked = true;       // 演出窗口（locked）
  const swallow2 = (await FIS.tapFish(0)) === false;
  state.locked = false;                          // 还原
  const swallowOk = swallow1 && swallow2 && FIS.currentLevel.step === 0;
  if (swallowOk) npass++;
  units.swallow = { ok: swallowOk, demo: swallow1, locked: swallow2 };

  const out = { game: 'fishcolor', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  runVerify();
}

</script>
</body>
