<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四子棋</title>
<style>
/* ================= 四子棋 gomoku4（batch19）=================
   视觉按 SPEC-BATCH19 §2：暖米底 #FBF3E4、小兔 IP 对战
   棋盘 5×5（ch1 4×4）：孩子执胡萝卜橙子先行/后行，兔子 AI 应手（600-1200ms 假思考）；
   横/竖/斜恰四连即胜（极大段==4，五连不判胜）；负局零惩罚重下；胜/平过题；
   触摸目标：棋格 ≥64（800×1180 实测 124+ / 1280×800 实测 96+）、底栏按钮 ≥72 高；
   pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:4px 10px}

/* ---------- 状态条：轮到谁 + 图例 ---------- */
#statusbar{flex:0 0 auto;width:100%;max-width:640px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:5px 16px;border-radius:20px;
  background:#F6ECD9;border:2.5px dashed #D9C5A6}
#turn-tag{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;color:#4A3B2E}
#turn-tag .t-ico{width:30px;height:30px}
#turn-tag .think{display:none;margin-left:2px}
#turn-tag.thinking .think{display:flex;gap:4px;align-items:flex-end;height:16px}
#turn-tag .think i{width:6px;height:6px;border-radius:50%;background:#8A9BAE;animation:tk 1s ease-in-out infinite}
#turn-tag .think i:nth-child(2){animation-delay:.18s}
#turn-tag .think i:nth-child(3){animation-delay:.36s}
@keyframes tk{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-7px);opacity:1}}
#legend{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:700;color:#8A7B6C;white-space:nowrap}
#legend .lg{display:flex;align-items:center;gap:5px}
#legend .lg i{width:17px;height:17px;border-radius:50%;border:2px solid #4A3B2E}
#legend .lg.me i{background:#F08A3C}
#legend .lg.foe i{background:#B7C2CE}

/* ---------- 棋盘 ---------- */
#bwrap{flex:0 0 auto;width:min(92vw, calc(100vh - 320px), calc(100dvh - 320px), 620px);
  aspect-ratio:1;position:relative}
#bgrid{position:absolute;inset:0;display:grid;gap:0;border-radius:22px;overflow:hidden;
  border:3.5px solid #C9A87C;box-shadow:0 7px 0 #D9C5A6, inset 0 0 0 2.5px #EAD9BC;
  background:#F3E2C4;
  grid-template-columns:repeat(var(--n,5),1fr);grid-template-rows:repeat(var(--n,5),1fr)}
.cell{position:relative;border:none;background:rgba(255,250,240,.16);
  outline:2px dashed rgba(122,96,60,.16);outline-offset:-7px;transition:background .15s}
.cell:nth-child(-n + 5){border-top:none}
.cell:hover{background:rgba(255,255,255,.3)}
.cell .stone{position:absolute;left:50%;top:50%;width:76%;height:76%;
  transform:translate(-50%,-50%);animation:st-in .3s cubic-bezier(.2,1.6,.4,1) both;
  display:flex;align-items:center;justify-content:center;pointer-events:none}
@keyframes st-in{from{transform:translate(-50%,-90%) scale(.2);opacity:0}
  to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.cell.last::after{content:'';position:absolute;left:50%;top:50%;width:20%;height:20%;
  transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.85);
  box-shadow:0 0 0 2.5px rgba(74,59,46,.35)}
/* 胜利四连：金圈脉冲；负局四连：红调 */
.cell.wincell{background:rgba(245,196,69,.4)}
.cell.wincell::before{content:'';position:absolute;inset:6%;border-radius:16px;
  border:3.5px solid #E8B33A;animation:win-ring 1s ease-in-out infinite}
@keyframes win-ring{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.06);opacity:.65}}
.cell.losecell{background:rgba(217,138,138,.38)}
.cell.losecell::before{content:'';position:absolute;inset:6%;border-radius:16px;
  border:3.5px solid #D98A8A;animation:win-ring 1s ease-in-out infinite}
#bgrid.over .cell:not(.wincell):not(.losecell) .stone{opacity:.45;transition:opacity .4s}
/* 救援/答案级 breathe：可制胜点/必堵点持续呼吸 */
.cell.breathe{animation:cell-breathe 1.6s ease-in-out infinite}
@keyframes cell-breathe{0%,100%{background:rgba(255,250,240,.16);box-shadow:none}
  50%{background:rgba(232,151,90,.45);box-shadow:inset 0 0 0 4px rgba(232,151,90,.8)}}
/* 方向级线索：单次 pulse */
.cell.pulse{animation:cell-pulse .9s ease 2}
@keyframes cell-pulse{0%,100%{background:rgba(255,250,240,.16)}
  50%{background:rgba(143,191,127,.55)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop2 .45s ease 2}
@keyframes bun-hop2{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 multibattle） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：棋盘占宽主导，状态条字号微收 */
@media (orientation:portrait){
  #turn-tag{font-size:17px}
  #legend{font-size:13px;gap:9px}
}
</style>
</head>
<body>
<div id="game" aria-label="四子棋">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关对局进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="statusbar" aria-label="当前轮次">
      <span id="turn-tag"><span class="t-ico" aria-hidden="true"></span><span id="turn-txt">轮到你啦</span>
        <span class="think" aria-hidden="true"><i></i><i></i><i></i></span></span>
      <span id="legend" aria-hidden="true">
        <span class="lg me"><i></i>你</span>
        <span class="lg foe"><i></i>兔子</span>
      </span>
    </div>
    <div id="bwrap" aria-label="四子棋棋盘">
      <div id="bgrid" role="grid" aria-label="棋盘格"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="听提示"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

/* ================= gomoku4 纯引擎：确定性关卡生成 + 恰四扫描 + AI 决策 + solver + 对局模拟（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   胜负口径（SPEC §0.41，审查 M1 裁决）：横/竖/斜极大连续段 ≥4 即胜（Connect-Four 惯例）
   AI 决策纯函数（任务指示：同局面同应手，禁 Math.random 在决策路径）：
     规则序 = ①己方一步制胜点 ②堵玩家一步制胜点 ③己方活三延伸·双威胁优先（造≥2 制胜点）
              ④堵玩家活三（玩家落后出现制胜点的空点） ⑤中心/邻子偏好（seeded 平手打破） ⑥seeded 兜底
     强度档：block（ch1）跳①③ / mid（ch4）跳③ / full（ch2-3）全规则
   seeded 兜底 rnd = mulberry32(boardHash ^ aiSeed)：同局面+同关内变体 → 同应手（确定性）；
     同关 5 局 aiSeed 互异（v0-v4）→ 兜底层分叉 → 5 局棋谱互异（sig 体验互异）
   miss 口径（家族统一）：负局=1 错（miss/retries 计一次）；平/胜不计；零惩罚重下+换先手（M2）
   星级：0 错=3★ / 1-2 错=2★ / 更多=1★（永不 0） */
'use strict';
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 局配置（章 → 棋盘边/先手/AI 强度档；ch4 交替先手：局 0/2/4 玩家先、1/3 AI 先） ---------- */
function gameCfgFor(dch, k) {
  if (dch === 1) return { n: 4, first: 1, aiMode: 'block' };
  if (dch === 2) return { n: 5, first: 1, aiMode: 'full' };
  if (dch === 3) return { n: 5, first: 2, aiMode: 'full' };
  return { n: 5, first: (k % 2 === 0 ? 1 : 2), aiMode: 'mid' };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // §0.3 batch11 M1 定版
  const games = [];
  for (let k = 0; k < CH_LEN; k++) {
    const c = gameCfgFor(dch, k);
    const aiSeed = (flat * 131 + k * 17 + 7) | 0;                     // 关内变体种子（v0-v4 互异）
    games.push({ n: c.n, first: c.first, aiMode: c.aiMode, aiSeed,
      sig: c.n + '-' + c.first + '-' + c.aiMode + '-v' + k });
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, games: games,
    step: 0, retries: 0, done: false };
}

/* ================= 连线扫描（游戏侧唯一胜负判定；verify 侧另写独立扫描器对账 §0.41）
   段首判定法：格 i 有色 c 且反方向邻格非 c → i 是极大段首；沿方向数段长，≥4 → 胜 ================= */
const DIRS4 = [[1, 0], [0, 1], [1, 1], [1, -1]];
function engScanWin(board, n) {
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const c = board[y * n + x];
      if (!c) continue;
      for (let d = 0; d < 4; d++) {
        const dx = DIRS4[d][0], dy = DIRS4[d][1];
        const px = x - dx, py = y - dy;
        if (px >= 0 && px < n && py >= 0 && py < n && board[py * n + px] === c) continue; // 非段首
        let len = 1, cx = x, cy = y;
        const line = [y * n + x];
        for (;;) {
          cx += dx; cy += dy;
          if (cx < 0 || cx >= n || cy < 0 || cy >= n || board[cy * n + cx] !== c) break;
          len++; line.push(cy * n + cx);
        }
        if (len >= 4) return { who: c, line: line };                   // ≥4 连即胜（审查 M1 裁决：
                                                                       // Connect-Four 惯例+连五不赢对 7-8 岁
                                                                       // 是教育黑洞；极大段≥4 含整线）
      }
    }
  }
  return null;
}

/* ---------- 空位表 ---------- */
function emptiesOf(board) {
  const out = [];
  for (let i = 0; i < board.length; i++) if (!board[i]) out.push(i);
  return out;
}
/* ---------- 棋盘 hash（seeded 兜底种子派生：局面内容 + 关内变体） ---------- */
function boardHash(board) {
  let h = 5381;
  for (let i = 0; i < board.length; i++) h = (Math.imul(h, 33) + board[i]) | 0;
  return h >>> 0;
}
/* ---------- 落点局部判定：who 落 i 后是否形成含 i 的 ≥4 极大段
   （落子只影响过 i 的 4 条线——局部数段，与 engScanWin 全盘口径一致：
   此前局面无四连时，新四连必含 i；性能 O(32) vs 全盘扫描 O(board)） ---------- */
function makesFourAt(board, n, i, who) {
  const x = i % n, y = (i / n) | 0;
  for (let d = 0; d < 4; d++) {
    const dx = DIRS4[d][0], dy = DIRS4[d][1];
    let len = 1;
    let cx = x + dx, cy = y + dy;
    while (cx >= 0 && cx < n && cy >= 0 && cy < n && board[cy * n + cx] === who) { len++; cx += dx; cy += dy; }
    cx = x - dx; cy = y - dy;
    while (cx >= 0 && cx < n && cy >= 0 && cy < n && board[cy * n + cx] === who) { len++; cx -= dx; cy -= dy; }
    if (len >= 4) return true;                   /* ≥4 连即胜（审查 M1 裁决，与 engScanWin 同口径） */
  }
  return false;
}
/* ---------- 制胜点集：who 落该空点后出现「≥4 连」的全体空点（就地试落+局部判定） ---------- */
function winPointsFor(board, n, who) {
  const out = [];
  for (let i = 0; i < board.length; i++) {
    if (board[i]) continue;
    board[i] = who;
    const four = makesFourAt(board, n, i, who);
    board[i] = 0;
    if (four) out.push(i);
  }
  return out;
}
/* ---------- 中心/邻子偏好分（距中心近 + 2 格窗口内己方/对方子多者优） ---------- */
function prefScore(board, n, i, me) {
  const x = i % n, y = (i / n) | 0, cx = (n - 1) / 2;
  let s = -(Math.abs(x - cx) + Math.abs(y - cx));
  for (let dy = -2; dy <= 2; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || nx >= n || ny < 0 || ny >= n) continue;
      const v = board[ny * n + nx];
      if (v === me) s += 3; else if (v) s += 2;
    }
  }
  return s;
}
/* 偏好最优——稳定版（solver 用：无抖动，同分取索引第一——首手恒中心，必胜确定性） */
function bestByPrefStable(board, n, me) {
  const es = emptiesOf(board);
  let best = es[0], bs = -1e9;
  for (const i of es) {
    const s = prefScore(board, n, i, me);
    if (s > bs) { bs = s; best = i; }
  }
  return best;
}
/* 偏好最优——抖动版（AI 用：±JITTER 内 seeded 翻转，主干中心/邻子偏好保留——
   变体种子在此生效；同局面同 seed 同选=确定性，不同变体不同选=体验多样） */
const PREF_JITTER = 3.5;
function bestByPref(board, n, me, rnd) {
  const es = emptiesOf(board);
  let best = es[0], bs = -1e9;
  for (const i of es) {
    const s = prefScore(board, n, i, me) + rnd() * PREF_JITTER;
    if (s > bs) { bs = s; best = i; }
  }
  return best;
}
/* 变体开局表（AI 先手空盘首手：表长 5=关内 5 局必互异；≥4 口径下中心/星位均合理）
   5×5=中心+四星（实测 40 关 200 局 solver 0 负——确定性引擎测过即恒成立）
   4×4=四中+角 */
const OPEN5 = [12, 6, 7, 16, 18];
const OPEN4 = [5, 6, 9, 10, 0];

/* ================= 兔子 AI 决策（纯函数：board,n,mode,aiSeed → 格 idx；同局面同应手）
   规则序见文件头；block=②④⑤ / mid=①②④⑤ / full=①②③④⑤ ================= */
function engAiPick(board, n, mode, aiSeed) {
  if (!emptiesOf(board).length) return null;                         /* 满盘防御（理论不可达） */
  const rnd = mulberry32((boardHash(board) ^ Math.imul(aiSeed || 0, 2654435761)) >>> 0);
  if (board.every(v => v === 0)) {                                   /* AI 先手空盘：变体开局表（5 局必互异） */
    const table = n === 4 ? OPEN4 : OPEN5;
    return table[Math.abs(aiSeed || 0) % table.length];
  }
  let stoneCnt = 0, only = -1;
  for (let i = 0; i < board.length; i++) { if (board[i]) { stoneCnt++; only = i; } }
  if (stoneCnt === 1 && board[only] === 1) {                         /* AI 后手第一应手：贴身变体表
                                                                       （邻域空格索引序 + aiSeed 取模——关内 5 局必互异；
                                                                       贴玩家子=防守语义，不伤 AI 强度） */
    const ox = only % n, oy = (only / n) | 0, near = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = ox + dx, ny = oy + dy;
      if (nx >= 0 && nx < n && ny >= 0 && ny < n) near.push(ny * n + nx);
    }
    if (near.length) return near[Math.abs(aiSeed || 0) % near.length];
  }
  if (mode !== 'block') {                                            // ① 己方一步制胜（block 跳过——只堵不攻）
    const w = winPointsFor(board, n, 2);
    if (w.length) return w[0];
  }
  const fw = winPointsFor(board, n, 1);                              // ② 堵玩家一步制胜点
  if (fw.length) return fw[0];
  if (mode === 'full') {                                             // ③ 己方活三延伸（双威胁优先）
    let single = -1;
    for (let i = 0; i < board.length; i++) {
      if (board[i]) continue;
      board[i] = 2;
      const w2 = winPointsFor(board, n, 2);
      board[i] = 0;
      if (w2.length >= 2) return i;                                  // 落后 ≥2 制胜点=双威胁必杀
      if (w2.length === 1 && single < 0) single = i;                 // 单威胁延伸（活三）
    }
    if (single >= 0) return single;
  }
  for (let i = 0; i < board.length; i++) {                           // ④ 堵玩家活三（玩家落后出现制胜点）
    if (board[i]) continue;
    board[i] = 1;
    const w1 = winPointsFor(board, n, 1);
    board[i] = 0;
    if (w1.length) return i;
  }
  return bestByPref(board, n, 2, rnd);                               // ⑤/⑥ 中心邻子偏好（seeded 平手打破=兜底）
}

/* ================= 玩家侧 solver（autoSolve / verify 直驱 / 教学"帮"指向共用）
   比 AI 多一层：④'防对方双威胁抢先封点——压制规则 AI 保障通关
   （⑥ 兜底稳定版：首手恒中心；实测 40 关 200 局胜平率 199/200，
   唯一残余风险局由 AI 开局表选点规避——确定性引擎测过即恒成立） ================= */
function engSolverPick(board, n) {
  const w = winPointsFor(board, n, 1);                               // ① 制胜
  if (w.length) return w[0];
  const fw = winPointsFor(board, n, 2);                              // ② 堵（多点=输定局，选偏好最高的堵）
  if (fw.length) {
    let best = fw[0], bs = -1e9;
    for (const i of fw) { const s = prefScore(board, n, i, 1); if (s > bs) { bs = s; best = i; } }
    return best;
  }
  let single = -1, singleScore = -1e9;
  for (let i = 0; i < board.length; i++) {                           // ③ 双威胁构造（先于防——我先成杀先赢）
    if (board[i]) continue;
    board[i] = 1;
    const w1 = winPointsFor(board, n, 1);
    board[i] = 0;
    if (w1.length >= 2) return i;
    if (w1.length === 1) {
      const s = prefScore(board, n, i, 1);
      if (s > singleScore) { singleScore = s; single = i; }
    }
  }
  for (let i = 0; i < board.length; i++) {                           // ④ 防对方双威胁（对方落后 ≥2 制胜点的点=抢先占）
    if (board[i]) continue;
    board[i] = 2;
    const w2 = winPointsFor(board, n, 2);
    board[i] = 0;
    if (w2.length >= 2) return i;
  }
  if (single >= 0) return single;                                    // ③b 单威胁延伸
  for (let i = 0; i < board.length; i++) {                           // ⑤ 堵对方活三延伸
    if (board[i]) continue;
    board[i] = 2;
    const w2 = winPointsFor(board, n, 2);
    board[i] = 0;
    if (w2.length === 1) return i;
  }
  return bestByPrefStable(board, n, 1);                              // ⑥ 中心/邻子（稳定版：首手恒中心——必胜确定性）
}

/* ---------- 送命策略（verify 负局路径实测用）：永远不堵——选与全部棋子最远的空点 ---------- */
function engSuicidePick(board, n) {
  let best = -1, bs = -1e9;
  for (let i = 0; i < board.length; i++) {
    if (board[i]) continue;
    const x = i % n, y = (i / n) | 0;
    let dmin = 99;
    for (let j = 0; j < board.length; j++) {
      if (!board[j]) continue;
      const jx = j % n, jy = (j / n) | 0;
      const d = Math.max(Math.abs(x - jx), Math.abs(y - jy));
      if (d < dmin) dmin = d;
    }
    const s = dmin * 10 - (Math.abs(x - (n - 1) / 2) + Math.abs(y - (n - 1) / 2));
    if (s > bs) { bs = s; best = i; }
  }
  return best;
}

/* ---------- 教学 watch 演示配步 AI：避开玩家全部子 ≥3 曼哈顿距离（永不堵演示线）
   距离取曼哈顿而非切比雪夫：切比雪夫 2 允许同排隔 2 格（会挡 row0 演示线）；曼哈顿 ≥3
   把整段演示行连同斜贴位都让开（4×4 实测每步避让候选 ≥4 格） ---------- */
function engDemoPick(board, n, seed) {
  const rnd = mulberry32((boardHash(board) ^ (seed || 99)) >>> 0);
  const far = [];
  for (let i = 0; i < board.length; i++) {
    if (board[i]) continue;
    const x = i % n, y = (i / n) | 0;
    let dmin = 99;
    for (let j = 0; j < board.length; j++) {
      if (board[j] !== 1) continue;
      const jx = j % n, jy = (j / n) | 0;
      const d = Math.abs(x - jx) + Math.abs(y - jy);
      if (d < dmin) dmin = d;
    }
    if (dmin >= 3) far.push(i);                                      // 避让区：距玩家全部子曼哈顿 ≥3
  }
  if (!far.length) return bestByPref(board, n, 2, rnd);              // 无处可避（理论不可达）退化
  const a = far.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a[0];
}

/* ================= 对局模拟（引擎直驱，无 DOM）：solver vs AI 全程落子
   返回 {result:'win'|'lose'|'draw'|'ERR', winline, moves, aiMoves, board}
   AI 每步合法内置断言（空位；轮替由循环保证；界内由索引保证）——ERR=非法即终止 ================= */
function engPlayGame(g) {
  const n = g.n, board = new Array(n * n).fill(0);
  let turn = g.first;
  const moves = [], aiMoves = [];
  for (let guard = 0; guard <= n * n; guard++) {
    const idx = turn === 1 ? engSolverPick(board, n) : engAiPick(board, n, g.aiMode, g.aiSeed);
    if (idx == null || idx < 0 || idx >= n * n || board[idx] !== 0) { // AI/solver 每步合法（空位+界内）
      return { result: 'ERR', bad: idx, moves: moves, aiMoves: aiMoves, board: board };
    }
    board[idx] = turn; moves.push(idx);
    if (turn === 2) aiMoves.push(idx);
    const w = engScanWin(board, n);
    if (w) return { result: w.who === 1 ? 'win' : 'lose', winline: w.line, moves: moves, aiMoves: aiMoves, board: board };
    if (moves.length === n * n) return { result: 'draw', winline: null, moves: moves, aiMoves: aiMoves, board: board };
    turn = 3 - turn;
  }
  return { result: 'ERR', moves: moves, aiMoves: aiMoves, board: board };
}

/* ---------- 关级通关模拟（含负局零惩罚重下：lose→同局重开再战，miss 计一次） ---------- */
function engPlayLevel(L) {
  const results = [];
  let retries = 0;
  for (let k = 0; k < L.games.length; k++) {
    for (let att = 0; att < 40; att++) {                             // 重下上限防御
      const r = engPlayGame(L.games[k]);
      results.push(r.result);
      if (r.result === 'lose') { retries++; continue; }              // 负局=1 错，重下不推进
      break;                                                         // win/draw 过题
    }
  }
  return { results: results, retries: retries, done: true };
}
/* 星级：0 错=3★ / 1-2 错=2★ / 更多=1★（miss=retries=负局总数口径，家族统一） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- AI 假思考时长（600-1200ms，seeded 确定性派生；verify 页乘 SPEED） ---------- */
function thinkMs(g) {
  const rnd = mulberry32((boardHash(g.board) ^ Math.imul(g.cfg.aiSeed, 2246822519)) >>> 0);
  return AI_THINK_MIN + Math.floor(rnd() * AI_THINK_SPAN);
}
/* ================= gomoku4 主逻辑（棋盘渲染 / 落子判定 / 兔子 AI 应手 / 教学 / 救援 / 推进）

   （600-1200ms 假思考）。横/竖/斜 ≥4 连即胜（审查 M1 裁决）。

   - 兔子四连 → gk_lose（sayW 三态）+ 负局=1 错 miss+1 → 零惩罚重下同局（不推进不换先手）

   - 梯度脚手架：负局 miss==1 重开闪中心 pulse（方向级）；miss>=2 局中轮到孩子时常驻

   §0.7a 救援钟口径：孩子落子/听提示=重置；AI 落子（系统行为）/点空白/点兔子不重置。
   验收钩子：window.GK = { get currentLevel, get quiz{N,board,turn,phase,winline,step,miss},

/* 答案级（miss>=2 常驻，b18 定案）：轮到孩子时可制胜点 breathe，否则必堵点 breathe */

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */

/* ================= 兔子 AI 应手（假思考 → 落子 → 负局/平局结算）
   aiRun 防双驱（内联续体 vs GK.aiMove 钩子）；身份守卫（cur/curGame await 后比对）。
   尾部等待防重入窗走满（AI think 600ms < 1000ms 时补足——b16 定案禁偏离） ================= */
async function aiTurn(demo) {
  if (!curGame || curGame.phase !== 'play' || curGame.turn !== 2 || aiRun) return false;
  const run = cur, g = curGame;
  aiRun = true;
  state.locked = true;                           // AI 期吞输入（点击→pop §0.22）
  const think = demo ? 400 * SPEED : thinkMs(g) * SPEED;   // demo 演出快放（watch ≤16s）
  await wait(think);
  if (cur !== run || curGame !== g) { aiRun = false; return false; }
  const i = demo ? engDemoPick(g.board, g.n, 99) : engAiPick(g.board, g.n, g.cfg.aiMode, g.cfg.aiSeed);
  if (i == null || g.board[i] !== 0) { aiRun = false; return false; }
  placeStone(2, i);
  if (!demo) window.__gkAiMoves = (window.__gkAiMoves || 0) + 1;   /* verify 观测：真 AI 应手计数 */
  const w = engScanWin(g.board, g.n);
  if (w) {                                       // 兔子四连 → 负局：零惩罚重下
    aiRun = false;
    return await loseGame(g, w);
  }
  if (g.board.indexOf(0) < 0) {                  // AI 落子满盘 → 平局过题
    aiRun = false;
    return await endGame(g, 'draw', null, demo);
  }
  g.turn = 1;
  renderStatus();
  aiRun = false;
  while (performance.now() < lockUntil) {        // 防重入窗：孩子落子起 1000ms（AI 先手局无此限）
    await wait(Math.max(4, lockUntil - performance.now()));   // while 过线：防 timer 提前唤醒
    if (cur !== run || curGame !== g) return 'ai';
  }
  settleLock();
  applyScaffold();                               // miss>=2：轮到孩子 → 答案级 breathe
  return 'ai';
}

/* ================= 落子主路径（真实点击 / GK.tapCell / autoSolve / 教学演示共用）
   demo=true 仅教学"看"演示通道（豁免 locked 门，batch5 M1 教训） ================= */
async function uiPlay(i, demo) {
  if (!cur || !curGame || state.won) return false;
  if ((state.locked && !demo) || (state.demo && !demo)) {
    if (!demo) {                                 /* 吞输入期轻叮+格子闪（§0.22+试玩 P4：无声环境下须有可见反馈） */
      sfx('pop');
      const el = cellEl(i);
      if (el) { el.classList.add('breathe'); setTimeout(() => el.classList.remove('breathe'), 600); }
    }
    return false;
  }
  if (curGame.phase !== 'play') return false;
  if (typeof i !== 'number' || Math.floor(i) !== i || i < 0 || i >= curGame.n * curGame.n || curGame.board[i] !== 0) return false;
  if (curGame.turn !== 1) { if (!demo) sfx('pop'); return false; }   /* AI 回合点棋盘轻叮 */
  const run = cur, g = curGame;
  lastAct = Date.now();                          /* 孩子落子=主交互，重置救援钟（§0.7a） */
  clearScaffold();
  placeStone(1, i);
  state.locked = true;                           /* 防重入窗 1000ms（b16 定案禁偏离） */
  lockUntil = performance.now() + 1000 * SPEED;
  const w = engScanWin(g.board, g.n);
  if (w) return await endGame(g, 'win', w, demo);
  if (g.board.indexOf(0) < 0) return await endGame(g, 'draw', null, demo);
  g.turn = 2;
  renderStatus();
  const r = await aiTurn(demo);                  /* 内联 AI 应手（负局/平局在内结算并换 curGame；尾部等满防重入窗） */
  if (cur !== run) return r || false;            /* 身份守卫：演出窗内重玩已重建关卡 */
  if (curGame === g) {                           /* 正常回到孩子回合（aiTurn 已等满窗解锁） */
    if (state.tut === 'help') scheduleHelpGhost(300);
    return 'moved';
  }
  /* curGame 已换（负局重开/平局推进）：结算演出 1300/1400ms 已覆盖防重入窗，新局可交互 */
  return r || false;
}

/* ================= 局结算 ================= */
/* 胜/平：金圈四连（胜）或全盘定格（平）→ 过题推进（末局=winFlow） */
async function endGame(g, kind, w, demo) {
  const run = cur;
  g.phase = kind === 'win' ? 'win' : 'draw';
  g.winline = w ? w.line : null;
  renderStatus();
  if (kind === 'win') {
    renderWin('wincell');
    sfx('win');
    sayR(VOICE.right.key, VOICE.right.text);     /* 己方胜=核心反馈每局一次 */
  } else {
    sfx('fail');
    sayR(VOICE.draw.key, VOICE.draw.text);
  }
  await wait(1300 * SPEED);
  if (cur !== run) return kind === 'win' ? 'right' : 'draw';
  if (demo) return kind === 'win' ? 'right' : 'draw';   /* 教学/演示：不推进（tutorialWatch 收尾重发） */
  if (state.tut === 'help') {                    /* 教学"独"：首次成四放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbitBtn();
  }
  cur.step++;
  if (cur.step >= cur.games.length) {
    cur.done = true;
    winFlow();
    return 'done';

     （engPlayGame 内置空位/界内断言，ERR=FAIL）+ 关级 retries=0（3★ 前提）

   ③ AI 必备两断言（§0.41，构造局面，两漏一=FAIL）：AI 己方活三 → full/mid 必下第四子

   ⑦ 布局：双 viewport（1280×800 / 800×1180）×（flat0/5/10/15）棋格 ≥64、全按钮 ≥64
     （.k-parentbtn 豁免）、overflowX ≤0
   ⑧ 文案与 clips：VOICE 六条字面量对账（SPEC §2 定稿）+ gk_ 6 条注入 + core 3 条注入
     （恰 9 条）+ 开场链 play(gk_hint)
   结果写 #verify-result + document.title='VERIFY PASS n/n' */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;

  /* ---- verify 侧独立棋盘扫描器（§0.41 禁复用游戏侧胜负判定）：
       线枚举法（行/列/两向对角线逐条切段）——与游戏侧「段首+方向增量」不同实现 ---- */
  function indepScan(board, n) {
    const lines = [];
    for (let y = 0; y < n; y++) lines.push(Array.from({ length: n }, (_, x) => y * n + x));         // 行
    for (let x = 0; x < n; x++) lines.push(Array.from({ length: n }, (_, y) => y * n + x));         // 列
    for (let s = 0; s < 2 * n - 1; s++) {                                                          // 主对角（x-y=s-（n-1））
      const L = [];
      for (let y = 0; y < n; y++) { const x = y + (s - (n - 1)); if (x >= 0 && x < n) L.push(y * n + x); }
      if (L.length >= 4) lines.push(L);
    }
    for (let s = 0; s < 2 * n - 1; s++) {                                                          // 反对角（x+y=s）
      const L = [];
      for (let y = 0; y < n; y++) { const x = s - y; if (x >= 0 && x < n) L.push(y * n + x); }
      if (L.length >= 4) lines.push(L);
    }
    for (const line of lines) {
      let i = 0;
      while (i < line.length) {
        const c = board[line[i]];
        if (!c) { i++; continue; }
        let j = i + 1;
        while (j < line.length && board[line[j]] === c) j++;
        if (j - i >= 4) return { who: c, line: line.slice(i, j).sort((a, b) => a - b) };  // ≥4 即胜（M1）
        i = j;
      }
    }
    return null;
  }
  const sameWin = (a, b) => {                     // 对账：同 null 或 who 同且线集合同（排序比较）
    if (!a && !b) return true;
    if (!a || !b || a.who !== b.who) return false;
    const la = a.line.slice().sort((x, y) => x - y), lb = b.line.slice().sort((x, y) => x - y);
    return la.length === lb.length && la.every((v, i) => v === lb[i]);
  };

  /* ---- ① 40 关全量审计 + 引擎直驱（flat 0-39） ---- */
  const CH_EXPECT = {                             // 章约束（SPEC §2 定稿）
    1: { n: 4, first: 1, aiMode: 'block' },
    2: { n: 5, first: 1, aiMode: 'full' },
    3: { n: 5, first: 2, aiMode: 'full' },
    4: { n: 5, aiMode: 'mid', alt: true }
  };
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1) === JSON.stringify(L2);
    let chOk = true, sigOk = true, driveOk = true, repOk = true, aiDet = true, agree = true;
    /* 章约束 */
    if (flat < STATIC_LEVELS && L1.dch !== diffOfCh(chOfFlat(flat))) chOk = false;
    if (L1.dch < 1 || L1.dch > 4) chOk = false;
    for (const g of L1.games) {
      const e = CH_EXPECT[L1.dch];
      if (g.n !== e.n || g.aiMode !== e.aiMode) chOk = false;
      if (e.alt) { if (g.first !== (L1.games.indexOf(g) % 2 === 0 ? 1 : 2)) chOk = false; }
      else if (g.first !== e.first) chOk = false;
    }
    /* sig 互异 */
    sigOk = new Set(L1.games.map(g => g.sig)).size === CH_LEN;
    /* 引擎直驱：双跑对弈（AI 应手确定性）+ 独立扫描器对账 + 关级全胜平 */
    const results = [], moveSigs = [];
    for (let k = 0; k < L1.games.length; k++) {
      const r1 = engPlayGame(L1.games[k]);
      const r2 = engPlayGame(L1.games[k]);
      if (r1.result !== r2.result || JSON.stringify(r1.aiMoves) !== JSON.stringify(r2.aiMoves)) aiDet = false;
      if (r1.result === 'ERR' || r1.result === 'lose') driveOk = false;          // AI 每步合法 + solver 不许输
      const w = indepScan(r1.board, L1.games[k].n);                              // 独立扫描器对账胜负（§0.41）
      const agreeOne = r1.result === 'draw' ? w === null :
        (w !== null && ((r1.result === 'win' && w.who === 1) || (r1.result === 'lose' && w.who === 2)));
      if (!agreeOne || !sameWin(w, engScanWin(r1.board, L1.games[k].n))) agree = false;
      results.push(r1.result);
      moveSigs.push(JSON.stringify(r1.moves));
    }
    if (results.filter(r => r === 'lose').length !== 0) driveOk = false;          // retries=0（3★ 前提）
    repOk = new Set(moveSigs).size === CH_LEN;                                   // 同关 5 局棋谱互异（体验互异）
    const ok = det && chOk && sigOk && driveOk && repOk && aiDet && agree;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, chOk: chOk, sigOk: sigOk,
      driveOk: driveOk, repOk: repOk, aiDet: aiDet, agree: agree, results: results,
      games: L1.games.map(g => g.sig) };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② 恰四连口径断言组（构造局面 + 双扫描器对账） ---- */
  total++;
  const mkB = (n, ones, twos) => {
    const b = new Array(n * n).fill(0);
    ones.forEach(i => b[i] = 1); twos.forEach(i => b[i] = 2);
    return b;
  };
  const fourCases = [                             // [说明, n, 玩家格, AI 格, 期望谁胜]
    ['横四', 5, [0, 1, 2, 3], [], 1],
    ['竖四', 5, [1, 6, 11, 16], [], 1],
    ['主斜四', 5, [0, 6, 12, 18], [], 1],
    ['反斜四', 5, [4, 8, 12, 16], [], 1],
    ['AI竖四', 5, [], [2, 7, 12, 17], 2],
    ['三连不胜', 5, [0, 1, 2], [], 0],
    ['五连即胜', 5, [10, 11, 12, 13, 14], [], 1],     // ≥4 连即胜（审查 M1 裁决：五连补满空档应奖励）
    ['五连斜即胜', 5, [0, 6, 12, 18, 24], [], 1]      // 主对角五连=胜
  ];
  fourCases.push(['四斜胜4x4', 4, [0, 5, 10, 15], [], 1]);
  let fourOk = true, agreeCnt = 0;
  for (const [name, n, ones, twos, who] of fourCases) {
    const b = mkB(n, ones, twos);
    const g = engScanWin(b, n), r = indepScan(b, n);
    if (!sameWin(g, r)) fourOk = false;           // 双扫描器对账
    else agreeCnt++;
    if (who === 0 && (g !== null)) fourOk = false;
    if (who !== 0 && (!g || g.who !== who)) fourOk = false;
  }
  if (fourOk) npass++;
  units.exactFour = { ok: fourOk, cases: fourCases.length, agree: agreeCnt };

  /* ---- ③ AI 必备两断言（构造局面，§0.41：两漏一=FAIL） ---- */
  total++;
  let mustOk = true;
  { /* 局面 A：AI(2) 活三（row1 c1-3，两端 5/9 空）→ full/mid 必下第四子（∈ AI 制胜点）；block 跳①不攻 */
    const b = mkB(5, [18, 22], [6, 7, 8]);
    const aiWin = winPointsFor(b.slice(), 5, 2);
    if (aiWin.indexOf(5) < 0 || aiWin.indexOf(9) < 0 || aiWin.length !== 2) mustOk = false;  // 局面自检
    for (const mode of ['full', 'mid']) {
      const mv = engAiPick(b.slice(), 5, mode, 1);
      if (aiWin.indexOf(mv) < 0) mustOk = false;                          // 必下第四子成四
    }
    const mvB = engAiPick(b.slice(), 5, 'block', 1);
    if (aiWin.indexOf(mvB) >= 0) mustOk = false;                          // block 跳①（章约束行为差异）
  }
  { /* 局面 B：玩家双端开放活三（row1 c1-3，5/9 空）→ 三档 AI 必堵（∈ 玩家制胜点） */
    const b = mkB(5, [6, 7, 8], [18, 22]);
    const pWin = winPointsFor(b.slice(), 5, 1);
    if (pWin.indexOf(5) < 0 || pWin.indexOf(9) < 0 || pWin.length !== 2) mustOk = false;
    for (const mode of ['block', 'full', 'mid']) {
      const mv = engAiPick(b.slice(), 5, mode, 2);
      if (pWin.indexOf(mv) < 0) mustOk = false;                           // 必堵
    }
  }
  { /* 局面 C：玩家单端活三（9 被 AI 占）→ 唯一制胜点 5 必堵 */
    const b = mkB(5, [6, 7, 8], [9, 22]);
    const mv = engAiPick(b.slice(), 5, 'full', 3);
    if (mv !== 5) mustOk = false;
  }
  if (mustOk) npass++;
  units.aiMust = { ok: mustOk };

  /* ---- ④ sayW 三态（单元直驱：gomoku 负局在 ch1 不可达——block AI 永不制胜，
       每负必播分支用直调验证；真实负局路径在 ⑤B 另测 gk_lose 播报在场） ---- */
  total++;
  const wLog = [];
  const origPlay2 = KIDS.voice.play;
  KIDS.voice.play = function (key, text) { wLog.push([key, String(text).slice(0, 4)]); };
  const losePlays = () => wLog.filter(p => p[0] === 'gk_lose').length;
  startLevel(0);                                          // flat0：每呼必播
  sayW(VOICE.lose.key, VOICE.lose.text, false);
  sayW(VOICE.lose.key, VOICE.lose.text, false);
  const sayA = losePlays();                               // → 2
  startLevel(10);                                         // flat10：10s 节流
  lastWrongVoice = Date.now();                            /* 显式进入节流窗口内 */
  sayW(VOICE.lose.key, VOICE.lose.text, false);           // 窗口内 → 不播
  const sayB = losePlays() - 2;                           // 增量 → 0
  sayW(VOICE.lose.key, VOICE.lose.text, true);            // force 豁免 → 播
  const sayC = losePlays() - 2 - sayB;                    // 增量 → 1
  KIDS.voice.play = origPlay2;
  const sayWOk = sayA === 2 && sayB === 0 && sayC === 1;
  if (sayWOk) npass++;
  units.sayW = { ok: sayWOk, flat0Plays: sayA, flat3Throttle: sayB, force: sayC };

  /* ---- ⑤A 教学链（verify 直驱 tutorialWatch）：watch clip → demo 真实成四（demoR 实证）→
       重发同关棋盘清零 → 交接 gk_tut_turn → help 解锁；watch 期真 AI 零应手 ---- */
  total++;
  const origQ7 = KIDS.voice.queue, origP7 = KIDS.voice.play;
  const pLog7 = [];
  KIDS.voice.play = function (key) { pLog7.push(String(key)); };
  KIDS.voice.queue = function (keys) { (keys || []).forEach(k => pLog7.push(String(k))); };  /* m2 开场改 queue 后日志双通道 */
  KIDS.voice.say = function (t) { pLog7.push('say:' + String(t).slice(0, 12)); };
  startLevel(0);
  const aiBefore = window.__gkAiMoves || 0;
  const demoSamples = [];
  const tw = tutorialWatch();                    // 不 await：watch 进行中采样（真 AI 计数/局面态）
  for (let i = 0; i < 3; i++) {
    demoSamples.push(GK.quiz ? GK.quiz.phase : null);
    await wait(90);
  }
  await tw;
  KIDS.voice.play = origP7; KIDS.voice.queue = origQ7;
  const q0 = GK.quiz;
  const tutOk = pLog7.indexOf('gk_tut_watch') >= 0 &&                    /* 看=演示配 watch clip */
    window.__gkDemoR === 'right' &&                                     /* 演示真实生效（§0.27） */
    state.tut === 'help' && !state.demo && !state.locked &&             /* 帮：解锁等孩子动手 */
    GK.currentLevel && GK.currentLevel.flat === 0 &&                    /* 重发同关 */
    q0 && q0.step === 0 && q0.board.every(v => v === 0) &&              /* 重发后棋盘清零 */
    pLog7.indexOf('gk_tut_turn') >= 0 &&                                /* 交接=你来下一局（§0.6） */
    (window.__gkAiMoves || 0) === aiBefore &&                           /* watch 期真 AI 零应手（demo 配步不算） */
    demoSamples.every(v => v === 'play');                               /* watch 期无终局态泄漏 */
  if (tutOk) npass++;
  units.tutorial = { ok: tutOk, demoR: window.__gkDemoR, tut: state.tut,
    aiMoves: (window.__gkAiMoves || 0) - aiBefore, handoff: pLog7.indexOf('gk_tut_turn') >= 0,
    samples: demoSamples };

  /* ---- ⑤B 负局路径（flat10=ch3 AI 先手 full）：suicide 驱动 → 'wrong' + miss/retries 恰一次 +
       零惩罚重下（棋盘清零、step 不推进、phase 回 play）+ gk_lose 播报在场 ---- */
  total++;
  startLevel(10);
  const pLogB = [];
  KIDS.voice.play = function (key) { pLogB.push(String(key)); };
  let guardB = 0, rB = null;
  while (guardB++ < 60) {
    const q = GK.quiz;
    if (!q) break;
    if (q.phase === 'play' && q.turn === 1 && !state.locked) {
      rB = await uiPlay(engSuicidePick(q.board, q.N));
      if (rB === 'wrong') break;
    } else await wait(80);
  }
  KIDS.voice.play = origPlay2;
  const qB = GK.quiz;
  const loseOk = rB === 'wrong' && !!qB && qB.step === 0 &&                       /* 不推进 */
    qB.phase === 'play' && qB.board.every(v => v === 0) &&                        /* 重开棋盘清零 */
    qB.miss === 1 && GK.currentLevel.retries === 1 &&                             /* miss/retries 恰一次 */
    pLogB.indexOf('gk_lose') >= 0 &&                                              /* 负局播报在场 */
    window.__gkLoseSeen === true;
  if (loseOk) npass++;
  units.losePath = { ok: loseOk, r: rB, miss: qB ? qB.miss : null, step: qB ? qB.step : null,
    phase: qB ? qB.phase : null, boardEmpty: qB ? qB.board.every(v => v === 0) : null,
    retries: GK.currentLevel.retries, voice: pLogB.indexOf('gk_lose') >= 0,
    loseSeen: window.__gkLoseSeen === true };

  /* ---- ⑤C autoSolve 冒烟：flat5（ch2 玩家先手 full）整关 3★——UI 通路（tapCell 演出+推进链）
     flat10/15 的全胜性已由 ① 引擎直驱覆盖（retries=0 断言），UI 层单关冒烟控制 verify 总时长 ---- */
  total++;
  startLevel(5);
  const a = await GK.autoSolve();
  const lv = GK.currentLevel;
  const okC = a.done && lv.done && lv.retries === 0 && a.stars === 3 &&
    (a.taps >= 20   /* 审查 m5：5 局×每局≥4 子=≥20 下界 */);                                       /* 至少每局一子（5 局×≥4 子下界） */
  if (okC) npass++;
  smokes.flat5 = { ok: okC, done: a.done, retries: a.retries, stars: a.stars, taps: a.taps };

  /* ---- ⑥ 救援行为直驱：可制胜局面 rescueAct → breathe 在场 + rescues 计数 ---- */
  total++;
  startLevel(5);
  await wait(50);
  placeStone(1, 6); placeStone(1, 7); placeStone(1, 8);     /* 手摆玩家活三（row1 c1-3） */
  curGame.turn = 1; curGame.phase = 'play'; state.locked = false; aiRun = false;
  const resBefore = GK.rescues;
  rescueAct();
  const rescueOk = GK.rescues === resBefore + 1 &&
    (cellEl(5).classList.contains('breathe') || cellEl(9).classList.contains('breathe'));   /* 可制胜点 breathe */
  if (rescueOk) npass++;
  units.rescue = { ok: rescueOk, count: GK.rescues };

  /* ---- ⑦ 布局：双 viewport ×（flat0/5/10/15）；棋格 ≥64、全按钮 ≥64、overflowX ≤0 ---- */
  async function simView(w, h, flat) {
    startLevel(flat);
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    await wait(620);                             /* 入场稳定（真实 ms，不吃 SPEED） */
    const de = document.documentElement;
    const cells = Array.prototype.slice.call(bgridEl.querySelectorAll('.cell'));
    const cellOk = cells.length >= 16 &&
      cells.every(b => { const r = b.getBoundingClientRect(); return r.width >= 64 && r.height >= 64; });
    let btnOk = true;                            // 全部按钮 ≥64（.k-parentbtn 家长按钮豁免）
    document.querySelectorAll('button').forEach(b => {
      if (b.classList.contains('k-parentbtn')) return;
      const r = b.getBoundingClientRect();
      if (r.width > 4 && r.height > 4 && (r.width < 64 || r.height < 64)) btnOk = false;
    });
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, flat: flat, cellOk: cellOk, btnOk: btnOk, ox: ox,
      pass: cellOk && btnOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const f of [0, 5, 10, 15]) {
    sims.push(await simView(1280, 800, f));
    sims.push(await simView(800, 1180, f));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                 // 还原真实 viewport 布局
  const layoutOk = sims.length === 8 && sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑧ 文案与 clips：VOICE 六条字面量对账 + 恰 9 条注入 + 开场链 ---- */
  total++;
  /* SPEC §2 定稿文案独立字面量（manifest 一致，禁改） */
  const refVoice = VOICE.watch.text === '看！连成四个子' &&
    VOICE.turn.text === '你来下一局' && VOICE.hint.text === '想想哪里能连四个' &&
    VOICE.right.text === '四个连上啦，你赢了' && VOICE.lose.text === '兔子赢啦，再来一局' &&
    VOICE.draw.text === '平局，再来一局';
  /* gk_ 6 条 + core 3 条 = 恰 9 条注入对账（build 断言同口径，verify 侧复检） */
  const GK_KEYS = ['gk_tut_watch', 'gk_tut_turn', 'gk_hint', 'gk_right', 'gk_lose', 'gk_draw'];
  const CORE_KEYS = ['core_chapter_end', 'core_day_end', 'core_rest'];
  const nClips = Object.keys(KIDS.voice.clips).length;
  const clipOk = nClips === 9 &&
    GK_KEYS.concat(CORE_KEYS).every(k => !!KIDS.voice.clips[k]);
  /* 开场链：verify 页 startLevel 恒走 openingSpeak（stub 记录 play(gk_hint)） */
  const pLog8 = [];
  KIDS.voice.play = function (key) { pLog8.push(String(key)); };
  KIDS.voice.queue = function (keys) { (keys || []).forEach(k => pLog8.push(String(k))); };  /* m2 同 */
  startLevel(0);
  KIDS.voice.play = origPlay2;
  const openOk = pLog8.length >= 1 && pLog8[0] === 'gk_hint';
  const specOk = refVoice && clipOk && openOk;
  if (specOk) npass++;
  units.dist = { ok: specOk, refVoice: refVoice, clips: nClips, openChain: openOk };

  const out = { game: 'gomoku4', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
