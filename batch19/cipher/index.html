<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔密码破译</title>
<style>
/* ================= 小兔密码破译 cipher（batch19）=================
   视觉按 SPEC-BATCH19 §1（承家族暖米底）：每题=密码表（4-6 对「符号↔数字或字」行卡，
   ch3 缺角行显示 ?）+密文列（上符号下解码槽，点符号=表行闪联）+候选答案卡池。
   点卡按序填入第一个空槽，拼满自动判定：对=绿框+下一题；错=晃动零惩罚可退回重拼。
   触摸目标：表行/解码槽/候选卡 ≥64、底栏按钮 ≥72 高；pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:40px;height:40px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 40px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:4px 10px}
#tip{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#8A7B6C}
#tip .dot{width:10px;height:10px;border-radius:50%;background:#E8975A;flex:0 0 10px}
#tip.flash{animation:tip-flash .55s ease}
@keyframes tip-flash{0%,100%{background:none}40%{background:#F6E3C5;border-radius:10px}}

/* ---------- 密码表区（表行卡 + ch3 情报例卡） ---------- */
#table-area{flex:0 0 auto;width:100%;max-width:1120px;display:flex;flex-wrap:wrap;align-items:center;
  justify-content:center;gap:8px 12px}
#cipher-table{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:8px 10px;padding:8px 12px;border-radius:20px;background:#F6ECD9;border:2.5px solid #D9C5A6;
  box-shadow:0 3px 0 rgba(74,59,46,.12)}
/* 表行卡：符号 ↔ 像（可点=朗读该行，主动学习 §0.7a） */
.trow{position:relative;min-width:96px;min-height:64px;padding:4px 12px;border-radius:16px;
  background:#FFFAF0;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 rgba(74,59,46,.22);
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s;animation:trow-in .4s cubic-bezier(.2,1.5,.4,1) both}
.trow:nth-child(2n){animation-delay:.06s}.trow:nth-child(3n){animation-delay:.12s}
@keyframes trow-in{from{transform:scale(0) rotate(-10deg)}to{transform:scale(1) rotate(0)}}
.trow:active{transform:translateY(2px)}
.trow .tsym{width:40px;height:40px}
.trow .tsym svg{width:40px;height:40px}
.trow .tarrow{font-size:16px;font-weight:800;color:#C9A87C;line-height:1}
.trow .timg{font-size:26px;font-weight:800;color:#4A3B2E;min-width:22px;text-align:center;line-height:1.15}
/* 缺角行（ch3）：虚线+? 锁定样式 */
.trow.hiddenrow{border-style:dashed;border-color:#C9A87C;background:#F6EFDE;box-shadow:none}
.trow.hiddenrow .timg{color:#C9A87C}
.trow.flash{animation:trow-flash .55s ease 3}
@keyframes trow-flash{0%,100%{background:#FFFAF0}40%{background:#F6C55A}}
.trow.pulse{animation:trow-pulse .5s ease 3}
@keyframes trow-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14) rotate(-3deg)}}
.trow.breathe{animation:trow-breathe 1.6s ease-in-out infinite}
@keyframes trow-breathe{0%,100%{box-shadow:0 3px 0 rgba(74,59,46,.22)}
  50%{box-shadow:0 3px 12px rgba(232,151,90,.85)}}

/* ---------- ch3 情报例卡（破译好的对照） ---------- */
#intel{display:none;align-items:center;gap:8px;padding:6px 12px;min-height:64px;border-radius:16px;
  background:#EDF2F7;border:2.5px dashed #8A9BAE;cursor:pointer}
#intel.show{display:flex;animation:trow-in .4s cubic-bezier(.2,1.5,.4,1) both}
#intel .ilabel{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto}
#intel .ipair{display:flex;align-items:center;gap:5px}
#intel .ipair .isym{width:32px;height:32px}
#intel .ipair .isym svg{width:32px;height:32px}
#intel .ipair .iimg{font-size:21px;font-weight:800;color:#3E6E8E;min-width:18px;text-align:center}
#intel.flash{animation:trow-flash .55s ease 3}
#intel.pulse{animation:trow-pulse .5s ease 3}

/* ---------- 密文解码区（每列=上密文符号+下解码槽） ---------- */
#cipher-area{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
#cipher-row{display:flex;align-items:flex-start;justify-content:center;gap:12px;
  padding:10px 14px;border-radius:22px;background:#F6ECD9;border:2.5px solid #D9C5A6;
  box-shadow:0 3px 0 rgba(74,59,46,.12);animation:map-in .4s ease both}
@keyframes map-in{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.ccol{display:flex;flex-direction:column;align-items:center;gap:6px;width:80px}
.ccol .csym{width:64px;height:64px;border-radius:16px;background:#FFFAF0;
  border:2px solid #E3D5BC;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .15s}
.ccol .csym svg{width:46px;height:46px}
.ccol .csym:active{transform:scale(.94)}
.ccol .csym.flash{animation:trow-flash .55s ease 3}
#cipher-row.breathe .ccol .csym{animation:sym-breathe 1.4s ease-in-out infinite}
@keyframes sym-breathe{0%,100%{box-shadow:0 0 0 0 rgba(232,151,90,0)}50%{box-shadow:0 0 0 4px rgba(232,151,90,.55)}}
/* 解码槽：空=虚线+序号点；满=mini 卡（点=退回） */
.cslot{width:64px;height:64px;padding:1px;border-radius:14px;background:#FBF8EF;
  border:2.5px dashed #C9A87C;display:flex;align-items:center;justify-content:center;
  transition:transform .15s}
.cslot .num{width:10px;height:10px;border-radius:50%;background:#E3D5BC}
.cslot.full{border-style:solid;border-color:#4A3B2E;background:#FFFAF0;
  box-shadow:0 3px 0 rgba(74,59,46,.25);animation:slot-in .3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slot-in{from{transform:scale(.3)}to{transform:scale(1)}}
.cslot.full:active{transform:translateY(3px)}
.cslot .cv{font-size:30px;font-weight:800;color:#4A3B2E;line-height:1}
.cslot.ok{border-color:#8FBF7F;background:#EDF5E3}
#cipher-row.wig{animation:crow-wig .5s ease}
@keyframes crow-wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  45%{transform:translateX(8px)}70%{transform:translateX(-5px)}90%{transform:translateX(3px)}}
#cipher-row.okrow{animation:crow-ok .55s ease}
@keyframes crow-ok{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- 候选卡池 ---------- */
#pool-area{flex:1 1 auto;min-height:120px;width:100%;max-width:1120px;display:flex;
  flex-direction:column;justify-content:center;gap:6px}
#card-pool{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:12px 14px;min-height:84px;padding:8px 10px;border-radius:20px;
  background:#F6ECD9;border:2.5px dashed #D9C5A6}
/* 候选卡：数字/字大字卡；点后 .gone（入槽）；救援 breathe、pulse 三连 */
.card{position:relative;width:76px;height:76px;border-radius:18px;background:#FFFAF0;
  border:2.5px solid #4A3B2E;box-shadow:0 4px 0 rgba(74,59,46,.28);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;animation:card-in .4s cubic-bezier(.2,1.5,.4,1) both}
.card:nth-child(2n){animation-delay:.06s}.card:nth-child(3n){animation-delay:.12s}
@keyframes card-in{from{transform:scale(0) rotate(-14deg)}to{transform:scale(1) rotate(0)}}
.card:active{transform:translateY(3px)}
.card .cv{font-size:34px;font-weight:800;color:#4A3B2E;line-height:1}
.card.gone{visibility:hidden;pointer-events:none}
.card.breathe{animation:card-breathe 1.6s ease-in-out infinite}
@keyframes card-breathe{0%,100%{transform:scale(1);box-shadow:0 4px 0 rgba(74,59,46,.28)}
  50%{transform:scale(1.12);box-shadow:0 4px 14px rgba(232,151,90,.85)}}
.card.pulse{animation:card-pulse .5s ease 3}
@keyframes card-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22) rotate(6deg)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 coder2/read 家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：候选卡/槽仍 ≥64；表行 wrap 两行 */
@media (orientation:portrait){
  .card{width:66px;height:66px}
  .card .cv{font-size:29px}
  .trow{min-width:88px;min-height:64px;padding:4px 9px;gap:6px}
  .trow .tsym{width:36px;height:36px}
  .trow .tsym svg{width:36px;height:36px}
  .trow .timg{font-size:23px}
  .ccol{width:70px}
  .cslot{width:64px;height:64px}
  .cslot .cv{font-size:27px}
  #pool-area{min-height:110px}
  #cipher-row{gap:9px;padding:8px 10px}
}
</style>
</head>
<body>
<div id="game" aria-label="小兔密码破译">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="tip" aria-label="玩法提示"><span class="dot"></span><span id="tip-text">查查密码表，把密文破译出来</span></div>
    <div id="table-area">
      <div id="cipher-table" aria-label="密码表"></div>
      <button id="intel" aria-label="破译好的情报"></button>
    </div>
    <div id="cipher-area">
      <div id="cipher-row" aria-label="密文，查表破译"></div>
    </div>
    <div id="pool-area">
      <div id="card-pool" aria-label="候选卡池"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读一读题面"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

const SYM_IDS = Object.keys(SYMS);

/* ---------- 词库（ch2/ch4 字域；词内字互异保证双射可行——「星星」类同字词不入库） ---------- */
const WORDS = ['太阳', '月亮', '白云', '花朵', '雨滴', '彩虹', '大山', '大树', '小鱼', '白马', '火山', '木头'];

/* ================= cipher 纯引擎：确定性关卡生成 + 解码槽判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）。
   §0.40 映射真值：密码表=双射（符号集↔目标集无重无漏）；密文经表解码唯一；
   干扰选项 ∉ 正确答案的映射像。ch3 缺表题无歧义铁律——情报例中每个缺符号
   恰出现且像唯一（同符号同像），缺行真值与表现有像不重（恢复表仍双射）；
   生成期即保证，verify 侧独立解密器分源复算。
   数据模型：q._built[j]（解码槽 j ← opts 下标或 null 按位对应密文），
   q._used[i]（候选卡 i 已入槽）；拼满由 UI/引擎显式 engJudge 判定。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增；难度章号：静态关 (ch-1)%4+1 循环，生成关随机 1-4（§0.3） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

const NUMS = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
const ALL_CHARS = Array.from(new Set(WORDS.join('').split('')));   // 词库全字池（互异）

/* ---------- 数字域生成（ch1/ch4 数字版共用）：表 4-6 对符号→数字，密文逐符解码
   干扰=数字 ∉ answer 像集（表外/表内非密文像均可，须查表分辨） ---------- */
function genNumQuiz(rnd, pairLo, pairHi, clenLo, clenHi, nDis) {
  const np = ri(rnd, pairLo, pairHi);
  const syms = shuffled(SYM_IDS, rnd).slice(0, np);
  const imgs = shuffled(NUMS, rnd).slice(0, np);            // 数字互异 → 双射
  const table = syms.map((s, i) => ({ sym: s, img: imgs[i] }));
  const map = {};
  syms.forEach((s, i) => { map[s] = imgs[i]; });
  const clen = ri(rnd, clenLo, clenHi);
  const cipher = [];
  for (let k = 0; k < clen; k++) cipher.push(syms[ri(rnd, 0, np - 1)]);
  const answer = cipher.map(s => map[s]);
  const ansSet = {};
  answer.forEach(v => { ansSet[v] = 1; });
  const distract = shuffled(NUMS.filter(d => !ansSet[d]), rnd).slice(0, nDis);
  return finishQuiz(table, [], null, cipher, answer, distract, rnd);
}
/* ---------- 字词域生成（ch2）：词字各配符号 + 填充行补足 4-6 对
   填充字/干扰字=词库全字池 ∉ 本词字（表内填充行像可作干扰=须查表分辨） ---------- */
function genWordQuiz(rnd, pairLo, pairHi, nDis) {
  const w = WORDS[ri(rnd, 0, WORDS.length - 1)];
  const chars = w.split('');
  const fillN = Math.max(1, ri(rnd, pairLo - chars.length, pairHi - chars.length));
  const pool = shuffled(SYM_IDS, rnd);                       // 词字符号 + 填充符号同池取
  const fillPool = ALL_CHARS.filter(c => chars.indexOf(c) < 0);
  const fillChars = shuffled(fillPool, rnd).slice(0, fillN);
  const table = chars.map((c, i) => ({ sym: pool[i], img: c }))
    .concat(fillChars.map((c, i) => ({ sym: pool[chars.length + i], img: c })));
  const map = {};
  table.forEach(t => { map[t.img] = t.sym; });
  const cipher = chars.map(c => map[c]);
  const answer = chars.slice();
  const distract = shuffled(fillPool, rnd).slice(0, nDis);
  return finishQuiz(table, [], null, cipher, answer, distract, rnd);
}
/* ---------- 缺表推理生成（ch3）：表 5-6 对缺 1-2 行（img=null），
   情报例=短密文+明文对照（含每个缺符号≥1 次），正式密文 3-5 符含全部缺符号 ---------- */
function genMissingQuiz(rnd) {
  const np = ri(rnd, 5, 6), nh = ri(rnd, 1, 2);
  const syms = shuffled(SYM_IDS, rnd).slice(0, np);
  const imgs = shuffled(NUMS, rnd).slice(0, np);             // 全表像互异（含缺行真值）
  const hidSet = {};
  shuffled(syms.map((s, i) => i), rnd).slice(0, nh).forEach(i => { hidSet[i] = 1; });
  const table = syms.map((s, i) => ({ sym: s, img: hidSet[i] ? null : imgs[i] }));
  const truth = {};                                          // 缺行真值（生成期专用，钩子不暴露）
  Object.keys(hidSet).forEach(i => { truth[syms[i]] = imgs[i]; });
  const fullMap = {};
  syms.forEach((s, i) => { fullMap[s] = imgs[i]; });
  /* 情报例：全部缺符号 + 0-1 个可见行符号，打乱；明文=完整映射解码 */
  const exSyms = shuffled(Object.keys(truth), rnd)
    .concat(shuffled(syms.filter((s, i) => !hidSet[i]), rnd).slice(0, ri(rnd, 0, 1)));
  const exCipher = shuffled(exSyms, rnd);
  const example = { cipher: exCipher.slice(), plain: exCipher.map(s => fullMap[s]) };
  /* 正式密文：含全部缺符号 + 随机表符号补到目标长（≥3） */
  const target = Math.max(nh, ri(rnd, 3, 5));
  const cip = Object.keys(truth).slice();
  while (cip.length < target) cip.push(syms[ri(rnd, 0, np - 1)]);
  const cipher = shuffled(cip, rnd);
  const answer = cipher.map(s => fullMap[s]);
  const ansSet = {};
  answer.forEach(v => { ansSet[v] = 1; });
  const distract = shuffled(NUMS.filter(d => !ansSet[d]), rnd).slice(0, 2);
  const hidden = [];
  table.forEach((t, i) => { if (t.img == null) hidden.push(i); });
  return finishQuiz(table, hidden, example, cipher, answer, distract, rnd, truth);
}
/* ---------- 生成关（ch4）：数字版 5-6 对+4-5 符+干扰 3 / 双词拼接 4-5 字+干扰 3 ---------- */
function genFinalQuiz(rnd) {
  if (ri(rnd, 0, 1) === 0) return genNumQuiz(rnd, 5, 6, 4, 5, 3);
  for (let g = 0; g < 30; g++) {                             // 双词字集无交 + 总长 4-5
    const A = WORDS[ri(rnd, 0, WORDS.length - 1)];
    const B = WORDS[ri(rnd, 0, WORDS.length - 1)];
    const chars = (A + B).split('');
    if (A === B || chars.length < 4 || chars.length > 5) continue;
    if (new Set(chars).size !== chars.length) continue;      // 字互异（双射可行）
    const pool = shuffled(SYM_IDS, rnd);
    const fillN = ri(rnd, Math.max(1, 5 - chars.length), 6 - chars.length);
    const fillPool = ALL_CHARS.filter(c => chars.indexOf(c) < 0);
    const fillChars = shuffled(fillPool, rnd).slice(0, fillN);
    const table = chars.map((c, i) => ({ sym: pool[i], img: c }))
      .concat(fillChars.map((c, i) => ({ sym: pool[chars.length + i], img: c })));
    const map = {};
    table.forEach(t => { map[t.img] = t.sym; });
    const cipher = chars.map(c => map[c]);
    const distract = shuffled(fillPool, rnd).slice(0, 3);
    return finishQuiz(table, [], null, cipher, chars.slice(), distract, rnd);
  }
  return genNumQuiz(rnd, 5, 6, 4, 5, 3);                     // 不可达防御：退数字版
}
/* ---------- 组装（候选池=answer 多重集+干扰洗牌；槽/用态初始化）
   truth=缺行真值 map（ch3 朗读用；不参与判定，verify 侧独立解密器不用它 §0.40） ---------- */
function finishQuiz(table, hidden, example, cipher, answer, distract, rnd, truth) {
  const opts = shuffled(answer.concat(distract), rnd);
  return { kind: 'cipher', table: table, hidden: hidden, example: example,
    truth: truth || null,
    cipher: cipher, answer: answer, opts: opts.map(v => ({ v: v })),
    _built: cipher.map(function () { return null; }),
    _used: opts.map(function () { return false; }),
    miss: 0, solved: false };
}

/* ---------- 单题生成入口（确定性；章分支） ---------- */
function genQuiz(dch, rnd) {
  if (dch === 1) return genNumQuiz(rnd, 4, 5, 3, 4, 2);
  if (dch === 2) return genWordQuiz(rnd, 4, 6, 2);
  if (dch === 3) return genMissingQuiz(rnd);
  return genFinalQuiz(rnd);
}

/* ---------- 手解安全网模板（genLevel 极端防御；verify 侧 REF_FALLBACKS 双写对账） ---------- */
const FALLBACKS = {
  1: { table: [['star', '3'], ['moon', '5'], ['sun', '7'], ['cloud', '2']],
       cipher: ['star', 'moon', 'star'], distract: ['6', '8'] },
  2: { table: [['star', '太'], ['moon', '阳'], ['cloud', '水'], ['flower', '果']],
       cipher: ['star', 'moon'], distract: ['山', '白'] },
  3: { table: [['star', '3'], ['moon', '5'], ['sun', '7'], ['cloud', '2'], ['fish', null]],
       hidden: [4], example: { cipher: ['fish', 'star'], plain: ['4', '3'] },
       cipher: ['fish', 'moon', 'fish'], distract: ['6', '8'] },
  4: { table: [['star', '3'], ['moon', '5'], ['sun', '7'], ['cloud', '2'], ['fish', '4'], ['tree', '6']],
       cipher: ['sun', 'tree', 'moon', 'sun'], distract: ['1', '8', '9'] }
};
function fallbackQuiz(dch) {
  const f = FALLBACKS[dch] || FALLBACKS[1];
  const table = f.table.map(p => ({ sym: p[0], img: p[1] }));
  const fullMap = {};
  f.table.forEach(p => { fullMap[p[0]] = p[1]; });
  const hidden = f.hidden ? f.hidden.slice() : [];
  const truth = {};                              // 缺行真值（从情报例推，朗读用）
  if (f.hidden && f.example) {
    f.hidden.forEach(i => {
      const k = f.example.cipher.indexOf(table[i].sym);
      if (k >= 0) truth[table[i].sym] = f.example.plain[k];
    });
  }
  const answer = f.cipher.map(s => fullMap[s]);
  const opts = shuffled(answer.concat(f.distract), { next: function () { return 0.9; } });
  return { kind: 'cipher', table: table, hidden: hidden,
    example: f.example ? { cipher: f.example.cipher.slice(), plain: f.example.plain.slice() } : null,
    truth: Object.keys(truth).length ? truth : null,
    cipher: f.cipher.slice(), answer: answer, opts: opts.map(v => ({ v: v })),
    _built: f.cipher.map(function () { return null; }),
    _used: opts.map(function () { return false; }),
    miss: 0, solved: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；同关 5 题签名互异）
   sig=表符号集+密文序+答案串（体验维度：孩子看到的符号/密文/解码结果；
   表行展示顺序等呈现维度不入签名——b18 flat2 教训） ---------- */
const sigOf = q => [q.table.map(t => t.sym).sort().join(''),
  q.cipher.join(''), q.answer.join('')].join('|');
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);
  const quizzes = [], sigs = {};
  let guard = 0;
  while (quizzes.length < CH_LEN && guard++ < 120) {
    const q = genQuiz(dch, rnd);
    const sig = sigOf(q);
    if (sigs[sig]) continue;
    sigs[sig] = 1;
    quizzes.push(q);
  }
  while (quizzes.length < CH_LEN) quizzes.push(fallbackQuiz(dch));   // 不可达防御
  return { flat: flat, ch: ch, dch: dch, lv: lv, quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 解码槽引擎（无 DOM）：点候选卡入首空槽 / 点已填槽退回 ---------- */
/* engTapOpt(L,i)：点候选卡 i → 填入第一个空槽，返回槽位 j；非法（越界/已用/已满/
   关已结束）→ null。填卡=作答动作但不重置救援钟（§0.7a 唯答对推进重置） */
function engTapOpt(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (typeof i !== 'number' || Math.floor(i) !== i || i < 0 || i >= q.opts.length) return null;
  if (q._used[i]) return null;
  const j = q._built.indexOf(null);
  if (j < 0) return null;
  q._used[i] = true;
  q._built[j] = i;
  return j;
}
/* engTapSlot(L,j)：点解码槽 j=退回该卡回池（按位退回，后继不动——每槽对应密文位）；
   空槽/非法下标 → null。退回=改答零惩罚（§0.7a 不重置） */
function engTapSlot(L, j) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (typeof j !== 'number' || Math.floor(j) !== j || j < 0 || j >= q._built.length) return null;
  if (q._built[j] == null) return null;
  q._used[q._built[j]] = false;
  q._built[j] = null;
  return 'emptied';
}
/* 空闲池中第一个值为 v 的卡（教学演示/帮/救援/autoSolve 共用） */
function freeOptFor(q, v) {
  for (let i = 0; i < q.opts.length; i++) if (!q._used[i] && q.opts[i].v === v) return i;
  return -1;
}
/* engJudge(L)：拼满判定纯算——built 值序列与 answer 逐位比对 → {win}；未满 → null */
function engJudge(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved) return null;
  if (q._built.some(x => x == null)) return null;
  const vals = q._built.map(i => q.opts[i].v);
  return { win: vals.every((v, k) => v === q.answer[k]) };
}
/* engCommitJudge(L,plan)：提交判定。win → solved+推进，返回 'right'/'done'；
   不等 → miss/retries 各 +1 返回 'wrong'（错次口径 §1：答错=1 错） */
function engCommitJudge(L, plan) {
  const q = L.quizzes[L.step];
  if (plan.win) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  q.miss++;
  L.retries++;
  return 'wrong';
}
/* 星级：0 错=3★ / 1-2 错=2★ / 更多=1★（永不 0 星） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 救援/教学"帮"目标（§1：正确首卡 breathe+密码表对应行 pulse）
   rescueTarget=答案级：首个空槽 j 的正确值 → 未用候选卡 i（{act:'opt'}）；
   dirTarget=方向级（梯度脚手架 错1次）：首个空槽对应密文符号 → 表行 r（缺角行→情报例卡）
   两目标同源策略，UI 与 verify 共用 ---------- */
function rescueTarget(q) {
  if (!q || q.solved) return null;
  const j = q._built.indexOf(null);
  if (j < 0) return null;
  const i = freeOptFor(q, q.answer[j]);
  if (i < 0) return null;
  return { act: 'opt', i: i, j: j };
}
function dirTarget(q) {
  if (!q || q.solved) return null;
  const j = q._built.indexOf(null);
  if (j < 0) return null;
  const r = q.table.findIndex(t => t.sym === q.cipher[j]);
  if (r < 0) return null;
  if (q.table[r].img == null) return { act: 'intel' };
  return { act: 'row', r: r };
}

/* ---------- 结构校验（verify 用）：表域+池约束
   （双射性/解码唯一/干扰排除由 verify 侧独立解密器分源复算 §0.40） ---------- */
function structOk(q) {
  if (!q || q.kind !== 'cipher') return false;
  if (!Array.isArray(q.table) || q.table.length < 4 || q.table.length > 6) return false;
  const syms = q.table.map(t => t.sym);
  if (syms.some(s => !SYMS[s])) return false;
  if (new Set(syms).size !== syms.length) return false;            // 符号无重
  const vis = q.table.filter(t => t.img != null).map(t => t.img);
  if (new Set(vis).size !== vis.length) return false;              // 可见行像无重
  const hidRows = q.table.map((t, i) => t.img == null ? i : -1).filter(i => i >= 0);
  const hid = q.hidden || [];
  if (hid.length !== hidRows.length || hid.some((v, k) => v !== hidRows[k])) return false;
  if (!Array.isArray(q.cipher) || q.cipher.length < 2 || q.cipher.length > 5) return false;   // ch2 词域 2-3 符（SPEC §1「太阳」2 字词合法）；ch1/3/4 长度由 verify 分章断言
  if (q.cipher.some(s => syms.indexOf(s) < 0)) return false;       // 密文符号在表内
  if (!Array.isArray(q.answer) || q.answer.length !== q.cipher.length) return false;
  if (q.example && (q.example.cipher.length !== q.example.plain.length ||
      q.example.cipher.some(s => syms.indexOf(s) < 0))) return false;
  if (!Array.isArray(q.opts) || q.opts.some(o => typeof o.v !== 'string' || !o.v)) return false;
  const need = {}, have = {};
  q.answer.forEach(v => { need[v] = (need[v] || 0) + 1; });
  q.opts.forEach(o => { have[o.v] = (have[o.v] || 0) + 1; });
  for (const k of Object.keys(need)) if (have[k] !== need[k]) return false;   // 池 ⊇ answer 多重集
  const extra = q.opts.length - q.answer.length;
  if (extra < 2 || extra > 3) return false;                        // 干扰 2-3
  const extraList = [];
  const need2 = {};
  q.answer.forEach(v => { need2[v] = (need2[v] || 0) + 1; });
  q.opts.forEach(o => { if (need2[o.v] > 0) need2[o.v]--; else extraList.push(o.v); });
  if (new Set(extraList).size !== extraList.length) return false;  // 干扰互异
  if (extraList.some(v => need[v])) return false;                  // 干扰 ∉ answer 像（§0.40）
  return true;
}
/* ================= cipher 主逻辑（密码表渲染 / 密文解码槽 / 点卡填槽与退回 /
   拼满自动判定 / 教学 / 救援 / 推进）
   玩法（SPEC-BATCH19 §1）：每题=密码表+密文列（上符号下解码槽）+候选卡池。
   点候选卡按序填入首空槽，拼满自动判定：对=绿框+ci_right+下一题；错=晃动+
   sayW+槽自动清空（卡回池零惩罚可重选）。点已填槽=退回；点密文符号=表行闪联
   +朗读映射（主动学习）；ch3 情报例卡可点朗读。
   救援钟口径（§0.7a）：作答（填卡/退回/错答）不重置；唯答对推进重置；
   读题面/点密文符号/点表行/点情报卡=主动学习动作重置。
   教学看-帮-独：watch=演示看密文→查表→逐卡解码（返回值存 window.__ciDemoR §0.27）；
   帮=幽灵手指指向下一张该点的卡（rescueTarget 同源）；独=首次答对放手。
   验收钩子：window.CI = { get currentLevel, get quiz(){table[],cipher[],answer,opts[],
   step,miss}, tapOpt(i), start(flat), async autoSolve(), get tutorial, get rescues }
   （getter 拷贝非活引用） */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/开场任务语音/教学/反馈不受 flat 门限制（§0.5） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音：flat<3 每错必播；flat≥3 走 10s 节流；force 豁免恰一次（miss===2） */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) {
    lastWrongVoice = now;
    KIDS.voice.play(key, text);
  }
};
/* T46 阶段2（2026-09-19）：值词/密码对/引导句 clip 化（原 say() 拼句通道清零）
   —— ci_v_d1-9 数字词 + ci_v_<字> 12 用字 + ci_sym_* 10 符号名 + ci_repr 连接词 + ci_look1/2
   全段在册走 queue 拼播；缺段整句 TTS 兜底（shop-math playChain 先例，防御性死分支） */
const valKey = v => /^[1-9]$/.test(v) ? 'ci_v_d' + v : 'ci_v_' + v;
const playChain = (keys, fallback) => {
  if (keys.every(k => KIDS.voice.clips[k])) KIDS.voice.queue(keys);
  else KIDS.voice.say(fallback);
};
const sayVal = v => playChain([valKey(v)], v);
const sayPair = (sid, img) => playChain(['ci_sym_' + sid, 'ci_repr', valKey(img)],
  SYMS[sid].name + '，代表，' + img);

const stageEl = $id('stage'), tableEl = $id('cipher-table'), intelEl = $id('intel'),
      cipherRowEl = $id('cipher-row'), cardPoolEl = $id('card-pool'), tipEl = $id('tip'),
      ghostEl = $id('ghost'), rabbitBtn = $id('btn-rabbit'),
      replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none' };
let lastAct = Date.now();
let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）
let lastAskAt = 0;                              // 重听题面 3s 节流
let helpTimer = null, helpRedemo = false;
let rescueCount = 0;                            // 救援触发计数（CI.rescues）

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const cardEl = i => cardPoolEl.querySelector('.card[data-i="' + i + '"]');
const slotEl = j => cipherRowEl.querySelector('.cslot[data-j="' + j + '"]');
const symEl = j => cipherRowEl.querySelector('.csym[data-j="' + j + '"]');
const rowEl = r => tableEl.querySelector('.trow[data-r="' + r + '"]');
const rowIndexOf = (q, sym) => q.table.findIndex(t => t.sym === sym);

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.speakerSmall;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 72);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：填卡=双音上扬 / 退回=低柔单音（轻反馈不惩罚） */
const cardHi = () => { if (!VERIFY) { KIDS.audio.note(760, 0.09, 0, 0.5); KIDS.audio.note(950, 0.12, 0.07, 0.4); } };
const takeLo = () => { if (!VERIFY) KIDS.audio.note(520, 0.09, 0, 0.3); };

/* ================= 渲染 ================= */
/* 密码表：行卡（符号 ↔ 像；ch3 缺角行=?虚线）；行可点=朗读映射（主动学习） */
function renderTable(q) {
  tableEl.innerHTML = '';
  q.table.forEach((t, r) => {
    const b = document.createElement('button');
    b.className = 'trow' + (t.img == null ? ' hiddenrow' : '');
    b.dataset.r = r;
    b.setAttribute('aria-label', t.img == null
      ? SYMS[t.sym].name + '，密码表缺了一角'
      : SYMS[t.sym].name + '，代表' + t.img);
    b.innerHTML = '<span class="tsym">' + SYMS[t.sym].svg + '</span>' +
      '<span class="tarrow">↔</span>' +
      '<span class="timg">' + (t.img == null ? '?' : t.img) + '</span>';
    tableEl.appendChild(b);
  });
}
/* ch3 情报例卡：破译好的对照（符号→明文对）；可点=朗读（主动学习） */
function renderIntel(q) {
  if (!q.example) { intelEl.className = ''; intelEl.innerHTML = ''; return; }
  intelEl.className = 'show';
  intelEl.innerHTML = ICONS.intel + q.example.cipher.map((s, k) =>
    '<span class="ipair"><span class="isym">' + SYMS[s].svg + '</span>' +
    '<span class="iimg">' + q.example.plain[k] + '</span></span>').join('');
}
/* 密文列：每列=上密文符号（可点=表行闪联）+下解码槽（空=虚线点/满=mini 卡可退回） */
function renderCipher(q) {
  cipherRowEl.className = '';
  cipherRowEl.innerHTML = '';
  q.cipher.forEach((s, j) => {
    const col = document.createElement('div');
    col.className = 'ccol';
    const sym = document.createElement('button');
    sym.className = 'csym';
    sym.dataset.j = j;
    sym.setAttribute('aria-label', '密文第' + (j + 1) + '个，' + SYMS[s].name + '，点一点查表');
    sym.innerHTML = SYMS[s].svg;
    const slot = document.createElement('button');
    slot.className = 'cslot';
    slot.dataset.j = j;
    slot.setAttribute('aria-label', '第' + (j + 1) + '个解码槽');
    slot.innerHTML = '<span class="num"></span>';
    col.appendChild(sym); col.appendChild(slot);
    cipherRowEl.appendChild(col);
  });
  updateSlots(q);
}
/* 槽态同步（填卡/退回/清空共用；不动符号避免闪烁） */
function updateSlots(q) {
  q._built.forEach((bi, j) => {
    const el = slotEl(j);
    if (!el) return;
    if (bi == null) { el.className = 'cslot'; el.innerHTML = '<span class="num"></span>'; }
    else {
      el.className = 'cslot full';
      el.innerHTML = '<span class="cv">' + q.opts[bi].v + '</span>';
    }
  });
}
/* 池卡 gone 态同步（错后清空复活共用） */
function updatePoolGone(q) {
  q.opts.forEach((o, i) => {
    const el = cardEl(i);
    if (el) el.classList.toggle('gone', !!q._used[i]);
  });
}
/* 候选卡池：数字/字大字卡 */
function renderPool(q) {
  cardPoolEl.innerHTML = '';
  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'card';
    b.dataset.i = i;
    b.setAttribute('aria-label', '候选卡 ' + o.v);
    b.innerHTML = '<span class="cv">' + o.v + '</span>';
    cardPoolEl.appendChild(b);
  });
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
/* 开场顺序链（§0.5/§0.6）：hint（或教学交接 turn）单段 queue 单通道 */
function openingSpeak(turn) {
  KIDS.voice.queue([turn ? VOICE.turn.key : VOICE.hint.key]);
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  clearRescueVisual();
  renderTable(q);
  renderIntel(q);
  renderCipher(q);
  renderPool(q);
  renderStep();
}

/* ================= 视觉反馈小件 ================= */
function replayAnim(el, cls) {
  if (!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
}
const wigRow = () => replayAnim(cipherRowEl, 'wig');
const okRow = () => { replayAnim(cipherRowEl, 'okrow'); cipherRowEl.querySelectorAll('.cslot').forEach(el => el.classList.add('ok')); };
function clearRescueVisual() {
  tableEl.querySelectorAll('.flash,.pulse,.breathe').forEach(k => k.classList.remove('flash', 'pulse', 'breathe'));
  intelEl.classList.remove('flash', 'pulse');
  cardPoolEl.querySelectorAll('.breathe,.pulse').forEach(k => k.classList.remove('breathe', 'pulse'));
  cipherRowEl.querySelectorAll('.flash').forEach(k => k.classList.remove('flash'));
}
/* 方向级线索（梯度脚手架 错1次）：首个空槽对应密文符号的表行 pulse / 缺角→情报卡 pulse */
function applyDirVisual(q) {
  const t = dirTarget(q);
  if (!t) return;
  if (t.act === 'row') replayAnim(rowEl(t.r), 'pulse');
  else replayAnim(intelEl, 'pulse');
}
/* 答案级视觉（miss≥2 / 14s 救援）：正确首卡 breathe（§0.7 首错不 pulse 正确项） */
function applyAnswerVisual(q) {
  const t = rescueTarget(q);
  if (!t) return;
  const el = cardEl(t.i);
  if (el) { el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe'); }
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  clearRescueVisual();                           /* 指新目标前清旧视觉（numberdet P1-3 教训） */
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向（rescueTarget 同源）：首个空槽的正确值候选卡（教逐位解码） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const t = rescueTarget(q);
  if (t) pointGhostAt(cardEl(t.i));
}
function scheduleHelpGhost(delay) {
  clearTimeout(helpTimer);
  helpTimer = setTimeout(() => {
    if (state.tut !== 'help' || state.won || state.locked || VERIFY) return;
    pointHelpNext();
  }, delay == null ? 700 : delay);
}

/* ================= 点卡主路径（真实点击 / CI 钩子 / autoSolve / 教学演示共用）
   uiTapOpt(i, demo)：点候选卡 i → 填入第一个空槽 + 数字词/字 TTS 朗读（豁免通道）；
   拼满自动判定——对=ci_right+推进；错=晃动+sayW+槽清空（卡回池零惩罚可重选）。
   失败防重入窗 1000ms（§0.26 b16 定案禁偏离）；身份守卫 const run=cur ================= */
async function uiTapOpt(i, demo) {
  if (!cur || state.won) return false;
  if ((state.locked && !demo) || (state.demo && !demo)) {
    if (!demo) sfx('pop');                       /* §0.22 吞输入轻叮 */
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  if (typeof i !== 'number' || Math.floor(i) !== i || i < 0 || i >= q.opts.length) return false;
  const j = engTapOpt(cur, i);
  if (j === null) {                              /* 已用卡/已满 */
    sfx('pop');
    return false;
  }
  cardHi();
  const el = cardEl(i);
  if (el) el.classList.add('gone');
  updateSlots(q);
  sayVal(q.opts[i].v);                           // 数字词/字 clip 串读（T46 阶段2）
  if (state.tut === 'help') scheduleHelpGhost(350);
  const plan = engJudge(cur);
  if (!plan) return 'placed';
  const run = cur;                               // 身份守卫：演出窗口内重玩会重建 cur
  const res = engCommitJudge(cur, plan);
  if (plan.win) {                                // 破译成功：反馈+推进（答对重置救援钟 §0.7a）
    lastAct = Date.now();
    if (state.tut === 'help') {                  // 教学"独"：首次答对放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    clearRescueVisual();
    okRow();
    sfx('ok');
    sayR(VOICE.right.key, VOICE.right.text);
    state.locked = true;
    await wait(2100 * SPEED);                     /* 等 ci_right（≈1.8s）主体播完 */
    if (cur !== run) return res;
    state.locked = false;
    if (res === 'done') winFlow();
    else renderQuiz();
    return res;
  }
  /* 错：晃动+sayW+梯度脚手架（miss=1 方向级表行 pulse / miss≥2 答案级正确卡 breathe）；
     1000ms 防重入窗后槽自动清空（卡回池零惩罚可重选） */
  sfx('fail');
  sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2);
  wigRow();
  if (q.miss === 1) applyDirVisual(q);           /* 错 1 次闪方向级线索（任务书梯度定案） */
  else applyAnswerVisual(q);                     /* miss≥2 才出答案级（不提前） */
  if (state.tut === 'help') scheduleHelpGhost(400);
  state.locked = true;
  await wait(1000 * SPEED);                      /* 错点防重入窗 1000ms（b16 定案） */
  if (cur !== run) return res;
  for (let k = q._built.length - 1; k >= 0; k--) {
    if (q._built[k] == null) continue;
    if (q.opts[q._built[k]].v === q.answer[k]) continue;   /* 试玩 P1：评对的位保留（built=卡 idx，按值对位——
                                                              idx 与 answer 值比较恒不等=全清，本批复验实锤） */
    engTapSlot(cur, k);                          /* 错位清空：卡回池可重选（零惩罚） */
  }
  updateSlots(q);
  updatePoolGone(q);
  state.locked = false;
  return res;
}

/* ================= 点已填槽=退回该卡（改答零惩罚，§0.7a 不重置救援钟） ================= */
function uiTapSlot(j) {
  if (!cur || state.locked || state.won || state.demo) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  if (typeof j !== 'number' || Math.floor(j) !== j || j < 0 || j >= q._built.length) return false;
  const r = engTapSlot(cur, j);
  if (r === null) { sfx('pop'); return false; }  // 空槽=轻叮不静默
  takeLo();
  updateSlots(q);
  updatePoolGone(q);
  if (state.tut === 'help') scheduleHelpGhost(350);
  return r;
}

/* ================= 查表闪联（主动学习，§0.7a 重置救援钟）
   点密文符号=表行闪+朗读映射；缺角行→情报例卡闪+读情报推得的映射 ================= */
function uiTapSym(j) {
  if (!cur) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  if (typeof j !== 'number' || j < 0 || j >= q.cipher.length) return false;
  if (state.locked || state.demo || state.won) { sfx('pop'); replayAnim(symEl(j), 'flash'); return false; }
  lastAct = Date.now();
  replayAnim(symEl(j), 'flash');
  const r = rowIndexOf(q, q.cipher[j]);
  if (r >= 0 && q.table[r].img != null) {
    replayAnim(rowEl(r), 'flash');
    sayPair(q.cipher[j], q.table[r].img);
  } else {
    replayAnim(intelEl, 'flash');
    const truthV = q.truth && q.truth[q.cipher[j]];
    if (truthV != null) sayPair(q.cipher[j], truthV);

    const out = [];

    if (!q.example) return false;
    for (const r of hid) {
      const sym = q.table[r].sym;
      let seen = null, times = 0;
      for (let k = 0; k < q.example.cipher.length; k++) {

  /* 章约束分源复算（SPEC §1 题型定稿） */
  function refChapOk(dch, q) {
    const nTab = q.table.length, nCip = q.cipher.length;
    const extra = q.opts.length - q.answer.length;
    const isNum = v => v >= '1' && v <= '9';
    const ansStr = q.answer.join('');
    if (dch === 1) {
      if (nTab < 4 || nTab > 5 || nCip < 3 || nCip > 4) return false;
      if (extra !== 2 || q.hidden.length || q.example) return false;
      if (!q.table.every(t => t.img != null && isNum(t.img))) return false;

      if (nTab < 4 || nTab > 6 || extra !== 2) return false;
      if (nCip < 2 || nCip > 3) return false;                 // 词长 2-3（SPEC §1「太阳」）

      if (WORDS.indexOf(ansStr) < 0) return false;            // 解码=词库词

      rows.every(b => { const r = b.getBoundingClientRect(); return r.height >= 64 && r.width >= 60; });
    const slots = Array.prototype.slice.call(cipherRowEl.querySelectorAll('.cslot'));
    const slotOk = slots.length >= 2 &&                                      // ch2 词域密文 2 符（SPEC §1）
      slots.every(b => { const r = b.getBoundingClientRect(); return r.width >= 64 && r.height >= 64; });
    const syms = Array.prototype.slice.call(cipherRowEl.querySelectorAll('.csym'));
    const symOk = syms.length >= 2 &&
      syms.every(b => { const r = b.getBoundingClientRect(); return r.width >= 64 && r.height >= 64; });
    const cards = Array.prototype.slice.call(cardPoolEl.querySelectorAll('.card'));
    const cardOk = cards.length > 0 &&
      cards.every(b => { const r = b.getBoundingClientRect(); return r.width >= 64 && r.height >= 64; });
    const intel = document.getElementById('intel');
    let intelOk = true;                         // 情报例卡（ch3 在场）≥64 高
    if (cur.dch === 3) {
      const r = intel.getBoundingClientRect();
      intelOk = intel.classList.contains('show') && r.height >= 64;
    }
    let btnOk = true;                           // 全部按钮 ≥64（.k-parentbtn 家长按钮豁免）
    document.querySelectorAll('button').forEach(b => {
      if (b.classList.contains('k-parentbtn')) return;
      const r = b.getBoundingClientRect();
      if (r.width > 4 && r.height > 4 && (r.width < 64 || r.height < 64)) btnOk = false;
    });
    const de = document.documentElement;
    const ox = Math.max(document.getElementById('game').scrollWidth - document.getElementById('game').clientWidth,
      de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, flat: flat, rowOk: rowOk, slotOk: slotOk, symOk: symOk,
      cardOk: cardOk, intelOk: intelOk, btnOk: btnOk, ox: ox,
      pass: rowOk && slotOk && symOk && cardOk && intelOk && btnOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const f of [0, 5, 10, 15]) {
    sims.push(await simLayout(1280, 800, f));
    sims.push(await simLayout(800, 1180, f));
  }
  const g0 = document.getElementById('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                // 还原真实 viewport 布局
  const layoutOk = sims.length === 8 && sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑥ 分布与专项：文案对账 / clip 注入 / 开场链 / TTS 豁免 / 读题面 / 查表闪联 ---- */
  total++;
  /* SPEC §1 定稿文案独立字面量（manifest 一致，禁改） */
  const refVoice = VOICE.watch.text === '看！破译小密码' &&
    VOICE.turn.text === '你来破一破' && VOICE.hint.text === '查查密码表' &&
    VOICE.right.text === '破译成功，真聪明' && VOICE.wrong.text === '再对对密码表';
  /* 42 条 clips 注入对账（ci_ 39=5 句+T46 阶段2 34 段 + core 3，manifest games:['cipher']）
     T46 段族：ci_sym_*10（SYM_IDS 全集）/ci_v_d1-9/ci_v_<字>（WORDS 全集）/ci_repr/ci_look1/2 */
  const CI_KEYS = ['ci_tut_watch', 'ci_tut_turn', 'ci_hint', 'ci_right', 'ci_wrong',
    'ci_repr', 'ci_look1', 'ci_look2']
    .concat(SYM_IDS.map(s => 'ci_sym_' + s))
    .concat(WORDS.map(w => 'ci_v_' + w))
    .concat(Array.from({ length: 9 }, (_, i) => 'ci_v_d' + (i + 1)));
  const coreKeys = Object.keys(KIDS.voice.clips).filter(k => k.indexOf('core_') === 0);
  const nClips = Object.keys(KIDS.voice.clips).length;
  const clipOk = nClips === 42 && CI_KEYS.every(k => !!KIDS.voice.clips[k]) && coreKeys.length === 3;
  /* 开场链 / 填卡值词段 / 读题面 / 查表闪联（stub 记录；T46 阶段2：say 通道清零，全走 queue 段链） */
  const origQ = KIDS.voice.queue, origP = KIDS.voice.play, origS = KIDS.voice.say;
  const qLog = [], playLog = [], sayLog = [];
  KIDS.voice.queue = function (parts) { qLog.push(parts.slice()); };
  KIDS.voice.play = function (key, text) { playLog.push([String(key), text === undefined ? null : String(text)]); };
  KIDS.voice.say = function (t) { sayLog.push(String(t)); };
  startLevel(0);                                // verify 页恒走开场链
  const lastQ = qLog[qLog.length - 1];
  const openChain = qLog.length >= 1 && lastQ.length === 1 && lastQ[0] === 'ci_hint';   // 开场=[hint] 单通道
  const qw0 = cur.quizzes[0];
  await CI.tapOpt(vFreeIdx(qw0, qw0.answer[0]));                       // 填首卡
  const valSaid = qLog.some(p => p.length === 1 && p[0] === valKey(qw0.answer[0]));   // 值词单段链
  const symOk2 = uiTapSym(0) === true &&
    qLog.some(p => p.length === 3 && p[0] === 'ci_sym_' + qw0.cipher[0] &&
      p[1] === 'ci_repr' && p[2] === valKey(qw0.table[rowIndexOf(qw0, qw0.cipher[0])].img || ''));   // 查表闪联映射句（主动学习）
  const rowOk2 = uiTapRow(0) === true;                                 // 表行朗读（主动学习）
  const hearOk = uiHear() === true &&
    qLog.some(p => p.length === 1 + qw0.cipher.length && p[0] === 'ci_hint' &&
      p.slice(1).every((k, i) => k === 'ci_sym_' + qw0.cipher[i]));    // 读题面=hint+符号名段链
  KIDS.voice.queue = origQ; KIDS.voice.play = origP; KIDS.voice.say = origS;
  startLevel(0);                                // 还原
  const specOk = refVoice && clipOk && openChain && valSaid && symOk2 && rowOk2 && hearOk;
  if (specOk) npass++;
  units.dist = { ok: specOk, refVoice: refVoice, clips: clipOk, nClips: nClips,
    openChain: openChain, valSaid: valSaid, symFlash: symOk2, rowSpeak: rowOk2, hearOk: hearOk,
    missing: CI_KEYS.filter(k => !KIDS.voice.clips[k]) };

  const out = { game: 'cipher', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  document.getElementById('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
