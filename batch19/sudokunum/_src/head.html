<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数独数字版</title>
<style>
/* ================= 数独数字版 sudokunum（batch19）=================
   视觉按 SPEC-BATCH19 §3 + 家族暖底：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E
   舞台两行纵叠：玩法提示条（lens+「每行每列不重复」）→ 6×6 盘（2×3 宫粗描边分区，
   band 3 组×stack 2 组）；底栏数字卡 1-6（主答案 ≥96，§0.9）+小兔+再玩一次。
   点对：格子 hop+数字入格；全盘对：盘框转绿+波浪跳+sn_right；点错：格子摇头+
   红数字闪过（不进格）+冲突源格边框红闪，零惩罚可改（§0.8）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#FDEBD2;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:space-evenly;padding:6px 8px;overflow:hidden}

/* 玩法提示条（点击=sayP hint 重听玩法，主动学习动作重置救援钟 §0.7a） */
#tip{min-height:64px;max-width:94%;padding:9px 30px;border-radius:32px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;gap:12px;transition:transform .15s;flex:0 0 auto}
#tip.flash{animation:tip-b .5s ease}
@keyframes tip-b{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#tip-ico{flex:0 0 auto;display:flex;align-items:center}
#tip-text{font-size:clamp(19px,2.7vw,25px);font-weight:800;color:#4A3B2E;line-height:1.2;white-space:nowrap}

/* 6×6 盘：2×3 宫（boxR=2 行一 band、boxC=3 列一 stack），宫界粗描边分区
   尺寸链：宽 min(94vw, 64vh, 560px) → 横竖屏格均 ≥64（verify ⑧ 量测门禁） */
#board{position:relative;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);
  gap:3px;width:min(94vw,64vh,560px);aspect-ratio:1;flex:0 0 auto;
  background:#4A3B2E;border:4px solid #4A3B2E;border-radius:14px;padding:3px;
  box-shadow:0 5px 0 #D8C9B4}
#board.ok{border-color:#6FA063;box-shadow:0 5px 0 #9CBF8C,0 0 22px rgba(143,191,127,.75)}
#board.ok .cell.wave{animation:cell-wave .6s ease both}
@keyframes cell-wave{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px) scale(1.06)}}
#bd-check{position:absolute;right:-16px;top:-18px;width:58px;height:58px;display:none;
  filter:drop-shadow(0 3px 0 #D8C9B4);z-index:5}
#board.ok #bd-check{display:block;animation:bd-ok .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes bd-ok{0%{transform:scale(.3) rotate(-14deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

.cell{position:relative;min-width:0;min-height:0;border-radius:8px;background:#FFF9EE;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(22px,7.2vw,50px);font-weight:900;line-height:1;color:#4A3B2E;
  transition:transform .15s,box-shadow .15s}
.cell.empty{background:#FDF6E7;box-shadow:inset 0 0 0 2px #E5D5BC}
.cell.given{background:#FDEBD2}
.cell.mine{color:#E8975A}
.cell.sel{background:#FFF3DC;box-shadow:inset 0 0 0 4px #E8975A,0 0 14px rgba(232,151,90,.55);z-index:2}
/* 宫分区：band 界（r=1,3 下边粗）/stack 界（c=2 右边粗）——2×3 宫视觉描边（§3）
   border-box 下粗边不占盒子尺寸（保格 ≥64），与深棕盘底融为一体成分隔带 */
.cell.bxb{border-bottom:5px solid #4A3B2E}
.cell.bxr{border-right:5px solid #4A3B2E}
.cell.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}
  55%{transform:rotate(5deg)}80%{transform:rotate(-3deg)}}
.cell.hop{animation:cell-hop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes cell-hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px) scale(1.08)}}
.cell.bad{color:#D9776A;animation:cell-bad .6s ease both}
@keyframes cell-bad{0%,100%{background:#FFF9EE;box-shadow:inset 0 0 0 2px #E5D5BC}
  30%,60%{background:#F9DCD6;box-shadow:inset 0 0 0 3px #D9776A}}
.cell.foe{animation:cell-foe .6s ease}
@keyframes cell-foe{0%,100%{box-shadow:inset 0 0 0 2px transparent}
  30%,60%{box-shadow:inset 0 0 0 4px #D9776A}}
.cell.breathe{animation:cell-b 1.6s ease-in-out infinite;z-index:2}
@keyframes cell-b{0%,100%{transform:scale(1);box-shadow:inset 0 0 0 2px #E5D5BC}
  50%{transform:scale(1.06);box-shadow:inset 0 0 0 4px #E8975A,0 0 16px rgba(232,151,90,.85)}}
.cell.nudge{animation:cell-nudge .34s ease}
@keyframes cell-nudge{0%{outline:7px solid #F5C445;outline-offset:0}
  100%{outline:7px solid transparent;outline-offset:10px}}

/* ---------- 底栏：小兔 / 数字卡 1-6（主答案 ≥96 §0.9）/ 再玩一次
   宽度预算（800 竖屏）：72+6×96+72+gap×2+padding 20 ≈ 790 ≤ 800 不横溢 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px 12px;gap:8px}
#btn-rabbit{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;flex:0 0 72px}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:58px;height:58px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#nums{display:flex;justify-content:center;align-items:stretch;gap:clamp(4px,0.8vw,8px);flex:1 1 auto;min-width:0}
.num{flex:0 0 auto;width:min(12vw,96px);height:min(12vw,96px);min-width:64px;min-height:64px;border-radius:20px;
  background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(30px,6vw,46px);font-weight:900;color:#4A3B2E;line-height:1;
  transition:transform .15s,box-shadow .15s}
.num:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
/* 选中格后数字卡区点亮（提示"现在点数字"） */
#nums.live .num{background:#FFF3DC;box-shadow:0 5px 0 #E8B77F,inset 0 0 0 2px #E8975A}
.num.pulse{animation:num-pulse 1s ease 2}
@keyframes num-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}
.num.nudge{animation:cell-nudge .34s ease}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;flex:0 0 72px}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}

/* ---------- 幽灵手指教学（照家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：宽度充裕——盘放宽至 560，数字卡走满行 */
@media (orientation:portrait){
  #board{width:min(94vw,66vh,560px)}
  .cell{font-size:clamp(24px,7.4vw,52px)}
}
</style>
</head>
<body>
<div id="game" aria-label="数独数字版">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="tip" aria-live="polite"><span id="tip-ico" aria-hidden="true"></span><span id="tip-text"></span></div>
    <div id="board" aria-label="数独盘">
      <div id="bd-check" aria-hidden="true"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <div id="nums" aria-label="数字卡"></div>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
