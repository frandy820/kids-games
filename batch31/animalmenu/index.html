<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>动物三餐菜单</title>
<style>
/* ================= 动物三餐菜单 animalmenu v2（batch31·扩容批 1·r11 难度改造 2026-09-14）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   r11 四题型五族（SPEC-BATCH31 §0.76 r11）：ch1 findfood/findwho 两族混出恒 4 候选 /
   ch2 multifood 多食全选（勾选 .held+check 徽章+「点好啦」#btn-go 提交，.ready 呼吸）/
   ch3 dietclass 食性三盘分放（plmeat/plgrass/plmix 三盘卡）/ ch4 chaindir 谁吃谁
   （题面双卡并排 .ask-mini×2，出示序=听序；点「吃的一方」）。
   图卡=SVG 零文字（5-6 岁不识字可玩，语义语音承载）；封闭 10 动物×15 食物。
   触摸目标：候选卡/盘卡 ≥96×96、题面大图 ≥120 高、#btn-go ≥100×76；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面大图 + 候选图卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}

/* 题面：暖色餐垫 + 动物/食物大图 + 题面句文字条（点=重听+大图 pulse 方向级回锚） */
#scene{flex:0 0 auto;position:relative;width:min(420px,92vw);min-height:216px;border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F8E7C2 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene .ask-slot{position:relative;display:flex;align-items:flex-end;justify-content:center;
  min-height:150px}
#scene .ask-slot svg{width:150px;height:150px}
/* r11 chaindir 双卡并排（出示序=听序；两卡同大并排，中间牙齿分隔点） */
#scene .ask-slot.multi{gap:14px;align-items:flex-end}
#scene .ask-slot.multi .ask-mini{position:relative;display:flex;align-items:flex-end}
#scene .ask-slot.multi .ask-mini svg{width:118px;height:118px}
#scene .ask-slot.multi .ask-mini .ask-shadow{width:88px}
#scene .chain-arrow{flex:0 0 auto;margin:0 2px 52px;font-size:26px;font-weight:900;
  color:#E8975A;line-height:1}
#scene .ask-slot .ask-shadow{position:absolute;left:50%;bottom:2px;width:110px;height:14px;
  border-radius:50%;background:#EAD3A8;opacity:.75;transform:translateX(-50%)}
#scene .q-text{font-size:21px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}
#scene.pulse{animation:sc-pulse 1.1s ease-in-out 3}
@keyframes sc-pulse{0%,100%{box-shadow:0 4px 0 #D8C9B4}50%{box-shadow:0 0 0 10px rgba(232,151,90,.4)}}
#scene .ask-slot.jump{animation:ask-jump .5s ease 2}
@keyframes ask-jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
#scene .demo-pet{position:absolute;right:10px;bottom:8px;opacity:0;transform:translateX(24px);
  transition:all .5s cubic-bezier(.2,1.4,.4,1)}
#scene .demo-pet.show{opacity:1;transform:translateX(0)}

/* ---------- 候选图卡排（主答案按钮 ≥96×96；ch1 2 卡居中） ---------- */
#board{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:14px;max-width:760px;padding:2px 4px}
#board.bump{animation:bd-bump .22s ease}
@keyframes bd-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;width:150px;min-height:128px;border-radius:20px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;padding:8px 6px;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card svg{width:104px;height:104px;pointer-events:none}
.card.pop{animation:card-in .4s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes card-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.card.lit{border-color:#E8975A;background:#FDEFDC;
  animation:card-lit .5s ease}
@keyframes card-lit{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
.card.wig{animation:card-wig .4s ease}
@keyframes card-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
.card.breathe{animation:card-br 1.2s ease-in-out infinite}
@keyframes card-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.05)}}
/* r11 勾选徽章（multifood .held 卡右上角绿圆白勾——零惩罚勾选切换） */
.card .check{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:50%;
  background:#6FA063;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.4);transition:all .18s cubic-bezier(.2,1.4,.4,1)}
.card .check svg{width:19px;height:19px}
.card.held{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;transform:translateY(-5px)}
.card.held .check{opacity:1;transform:scale(1)}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- r11「点好啦」提交钮（multifood 提交入口——iftrain v2/weather v2 先例；
   勾满 need 数 .ready 呼吸邀请（计数驱动，不泄答案）；非提交题型隐藏 ---------- */
#btn-go{width:116px;height:86px;border-radius:24px;background:#8FBF7F;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #6FA063;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:#4A3B2E;transition:transform .15s}
#btn-go.show{display:flex}
#btn-go:active{transform:translateY(3px);box-shadow:0 2px 0 #6FA063}
#btn-go svg{width:44px;height:44px}
#btn-go .go-name{font-size:17px;font-weight:700;color:#4A3B2E;line-height:1}
#btn-go.ready{animation:go-ready 1.5s ease-in-out infinite}
@keyframes go-ready{0%,100%{filter:drop-shadow(0 0 0 rgba(111,160,99,0))}
  50%{filter:drop-shadow(0 0 14px rgba(111,160,99,.95))}}
#btn-go.bump{animation:go-bump .22s ease}
@keyframes go-bump{0%,100%{transform:scale(1)}45%{transform:scale(.94)}}
#btn-go.breathe{animation:go-br 1.6s ease-in-out infinite}
@keyframes go-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 14px rgba(111,160,99,.95));transform:scale(1.06)}}

/* ---------- 幽灵手指教学（照 batch21-30） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：题面/卡收紧，主答案卡仍 ≥96。
   body.port=竖屏规则的类通道（媒体查询跟视口不跟元素，verify simView 靠注入 .port 吃到
   这段——REPORT-REVIEW-r10 M-1），两段规则必须同步改 */
@media (orientation:portrait){
  #scene{width:min(340px,94vw);min-height:196px}
  #scene .ask-slot{min-height:124px}
  #scene .ask-slot svg{width:124px;height:124px}
  #scene .ask-slot.multi .ask-mini svg{width:100px;height:100px}
  #scene .chain-arrow{font-size:22px;margin-bottom:44px}
  #scene .q-text{font-size:18px;padding:3px 14px}
  #board{gap:11px}
  .card{width:132px;min-height:112px}
  .card svg{width:90px;height:90px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
  #btn-go{width:100px;height:76px}
  #btn-go svg{width:38px;height:38px}
  #btn-go .go-name{font-size:15px}
}
body.port #scene{width:min(340px,94vw);min-height:196px}
body.port #scene .ask-slot{min-height:124px}
body.port #scene .ask-slot svg{width:124px;height:124px}
body.port #scene .ask-slot.multi .ask-mini svg{width:100px;height:100px}
body.port #scene .chain-arrow{font-size:22px;margin-bottom:44px}
body.port #scene .q-text{font-size:18px;padding:3px 14px}
body.port #board{gap:11px}
body.port .card{width:132px;min-height:112px}
body.port .card svg{width:90px;height:90px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
body.port #btn-go{width:100px;height:76px}
body.port #btn-go svg{width:38px;height:38px}
body.port #btn-go .go-name{font-size:15px}
</style>
</head>
<body>
<div id="game" aria-label="动物三餐菜单">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="题面，点我再听一遍"></button>
    <div id="board" aria-label="候选图卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-go" aria-label="点好啦，提交"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

     dch2 multifood ×5（洗牌 ANIMALS10 取 5 互异）· 4 候选 · 勾选+「点好啦」提交
        （need=MULTI[动物] 恰 2 件；干扰 ⊆ DISTRACT_OK[动物]∖need 公平表恰 2）
     dch3 dietclass ×5（洗牌 ANIMALS10 取 5，补换保每关 ≥1 肉食+≥1 草食）· 3 盘候选
        （opts=PLATES 洗牌，answer=DIET_PLATE[DIET[动物]] 下标）
     dch4 chaindir ×5（CHAIN_PREY 动物-动物取 2+其余取 3 洗牌——每关 ≥2 对真方向判定）
        · 2 候选（出示序=seeded 洗牌，answer=eater 下标）
   flat0 题0 锚定 findfood/rabbit（教学「看兔子点胡萝卜」演示锚点，候选 4）。
   铁律：候选互异含全部真值 ⊆对应集（findfood=食物 8/findwho=动物 8/multifood=食物 15
   ∩DISTRACT_OK∪need/dietclass=三盘全/dchain=对成员）；干扰恰 n-|need|；相邻题（kind:签名）互异。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

function shuffled(arr, rnd) {

const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;
/* 提交制题型（判定在 engSubmit；点卡=勾选切换零惩罚）——multifood */
const isSubmitKind = k => k === 'multifood';

/* ---------- 每关题序表 {kind, pair/animal/chain}（genLevel 预生成，rnd 同流保确定性）
   dch1 逐题掷 findfood/findwho+随机对（ANIMALS8）；dch2/3 洗牌 ANIMALS10 取 5（互异
   →相邻互异天然成立；dch3 采样后补换保 ≥1 肉食+≥1 草食）；dch4=CHAIN_PREY 取 2+
   非猎物对取 3 洗牌（5 对互异+≥2 动物-动物）；相邻 (kind:签名) 互异兜底重掷 ≤8 ---------- */
function specSeqOf(dch, rnd, flat) {
  const coin = () => rnd() < 0.5 ? 'findfood' : 'findwho';
  const pick8 = () => ANIMALS8[Math.floor(rnd() * ANIMALS8.length)];
  const specKey = s => s.kind + ':' + (s.pair || s.animal || (s.chain ? s.chain.eater + '>' + s.chain.eaten : ''));
  let specs = [];
  if (dch === 1) {
    if (flat === 0) specs.push({ kind: 'findfood', pair: 'rabbit' });   // 教学锚先行（防全同翻位撞锚）
    for (let qi = specs.length; qi < CH_LEN; qi++) specs.push({ kind: coin(), pair: pick8() });
    const nF = specs.filter(s => s.kind === 'findfood').length;      // 混出：全同翻 1（每关两族在场；
    if (nF === 0) specs[0].kind = 'findfood';                        // flat0 锚已保 findfood 在场）
    else if (nF === CH_LEN) specs[flat === 0 ? 1 : 0].kind = 'findwho';   // flat0 翻位 1（位 0=教学锚不动）
  } else if (dch === 2) {
    shuffled(ANIMALS10, rnd).slice(0, CH_LEN).forEach(a => specs.push({ kind: 'multifood', animal: a }));
  } else if (dch === 3) {
    let pool = shuffled(ANIMALS10, rnd).slice(0, CH_LEN);             // 采样后补换：≥1 肉食+≥1 草食
    const hasMeat = () => pool.some(a => DIET[a] === 'meat');
    const hasGrass = () => pool.some(a => DIET[a] === 'grass');
    const swapIn = want => {                                         // 换入一个 want 类动物（非样本内）
      const cands = ANIMALS10.filter(a => DIET[a] === want && pool.indexOf(a) < 0);
      if (!cands.length) return;
      const rep = pool.filter(a => DIET[a] === 'mix');                // 只换出冗余杂食（保两类都在）
      if (!rep.length) return;
      pool[pool.indexOf(rep[Math.floor(rnd() * rep.length)])] = cands[Math.floor(rnd() * cands.length)];
    };
    if (!hasMeat()) swapIn('meat');
    if (!hasGrass()) swapIn('grass');
    pool.forEach(a => specs.push({ kind: 'dietclass', animal: a }));
  } else {
    const prey = shuffled(CHAIN_PREY, rnd).slice(0, 2);               // 每关 ≥2 对动物-动物（真方向判定）
    const rest = shuffled(CHAIN.filter(p => CHAIN_PREY.indexOf(p) < 0), rnd).slice(0, CH_LEN - 2);
    specs = prey.concat(rest);                                        // 5 对互异（表内无重复对）
    specs = shuffled(specs, rnd);
    specs = specs.map(p => ({ kind: 'chaindir', chain: p }));
  }
  /* flat===0 恒 dch1（教学锚已在 dch1 分支内置位 0）——无跨分支锚替换 */
  const oneSpec = k =>                                               // 按 kind 精确构造（单一参数键，防签名键污染）
    k === 'findfood' || k === 'findwho' ? { kind: k, pair: pick8() } :
    k === 'multifood' ? { kind: k, animal: ANIMALS10[Math.floor(rnd() * ANIMALS10.length)] } :
    k === 'dietclass' ? { kind: k, animal: ANIMALS10[Math.floor(rnd() * ANIMALS10.length)] } :
                        { kind: k, chain: CHAIN[Math.floor(rnd() * CHAIN.length)] };
  const retryKinds = dch === 1 ? ['findfood', 'findwho'] :
                     dch === 2 ? ['multifood'] :
                     dch === 3 ? ['dietclass'] : ['chaindir'];
  let prev = null;                                                   // 相邻题互异（kind:签名）
  for (let qi = 0; qi < CH_LEN; qi++) {
    let s = specs[qi], pk = prev && specKey(prev);
    for (let g = 0; g < 8 && specKey(s) === pk; g++) {
      s = oneSpec(retryKinds[Math.floor(rnd() * retryKinds.length)]);
      specs[qi] = s;
    }
    prev = specs[qi];
  }
  return specs;
}

/* ---------- 单题构建（候选+干扰公平性；洗牌 + answer/need 语义）
   findfood：ask=动物 8，need=[PAIRS8 对]，候选 ⊆FOODS8 恒 4（真值+3 干扰）
   findwho：ask=食物 8，need=[animalOf]，候选 ⊆ANIMALS8 恒 4
   multifood：ask=动物 10，need=MULTI[动物]（2 件），候选=need+干扰 2 ⊆DISTRACT_OK∖need，
             answer=-1（提交制），picked=[]
   dietclass：ask=动物 10，need=[DIET_PLATE[DIET[动物]]]，候选=PLATES 洗牌 3 盘
   chaindir：pair=[eater,eaten]（CHAIN 行），出示序洗牌 2 卡，answer=eater 下标 ---------- */
function buildQuiz(spec, rnd) {
  let ask = null, pair = null, need = [], answer = -1, picks = [];
  if (spec.kind === 'findfood' || spec.kind === 'findwho') {
    const isFood = spec.kind === 'findfood';
    const truth = isFood ? PAIRS8[spec.pair] : spec.pair;
    ask = isFood ? spec.pair : PAIRS8[spec.pair];
    need = [truth];
    const pool = isFood ? FOODS8 : ANIMALS8;
    picks = [truth].concat(shuffled(pool.filter(x => x !== truth), rnd).slice(0, 3));
  } else if (spec.kind === 'multifood') {
    ask = spec.animal;
    need = MULTI[ask].slice();
    picks = need.concat(shuffled(DISTRACT_OK[ask].filter(x => need.indexOf(x) < 0), rnd).slice(0, 2));
  } else if (spec.kind === 'dietclass') {
    ask = spec.animal;
    need = [DIET_PLATE[DIET[ask]]];
    picks = PLATES.slice();                                          // 三盘全出示（洗牌定序）
  } else {                                                           // chaindir
    pair = [spec.chain.eater, spec.chain.eaten];
    need = [spec.chain.eater];
    picks = pair.slice();
  }
  const order = shuffled(picks, rnd);
  const opts = order.map(x => ({ anim: x }));
  if (!isSubmitKind(spec.kind)) {
    answer = -1;
    for (let j = 0; j < order.length; j++) if (order[j] === need[0]) answer = j;
  }
  const q = { kind: spec.kind, ask: ask, opts: opts, need: need, answer: answer,
              picked: [], _miss: 0, _answered: false };
  if (pair) q.pair = pair.slice();                                   // chaindir：[eater, eaten] 规范序（钩子对账）
  return q;
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关随机章参数）
   flat0 题0 恒 findfood/rabbit（§1 教学演示锚点） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 313);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const specs = specSeqOf(dch, rnd, flat);
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(specs[qi], rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点卡引擎（无 DOM）：engTapOpt(L, i) —— 点第 i 张候选卡（opts 数组下标）
   单答案题型（findfood/findwho/dietclass/chaindir）即时判定：
     'right' 答对且本题完成推进 / 'done' 答对且末题=通关
     'wrong' 点错：该题 miss+1（retries 全关累计=星级口径），卡不灰可重选（探索不罚）
   提交题型（multifood）：点卡=勾选切换（判定在 engSubmit）：
     'pick' 勾选 / 'unpick' 取消勾选（零惩罚）
   null    非法下标或关卡已结束 ---------- */
function engTapOpt(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.opts.length) return null;
  if (isSubmitKind(q.kind)) {
    const p = q.picked.indexOf(i);
    if (p >= 0) { q.picked.splice(p, 1); return 'unpick'; }
    q.picked.push(i);
    return 'pick';
  }
  if (i === q.answer) {
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}

/* ---------- 提交引擎（multifood「点好啦」；iftrain v2/weather v2 先例）：
   'right' 勾选集==need 推进 / 'done' 末题提交成=通关
   'wrong_more' 勾选含非 need 件（漏选外多选/选错件）：清空重选 + miss+1（真实错误路径）
   'wrong_less' 勾选 ⊂ need 且未选满：保留勾选继续找（合法路径不算 miss）
   null 关卡已结束 / 单答案题型不适用 ---------- */
function engSubmit(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered || !isSubmitKind(q.kind)) return null;
  const ids = q.picked.map(i => q.opts[i].anim);
  for (let k = 0; k < ids.length; k++) {
    if (q.need.indexOf(ids[k]) < 0) {
      q.picked = [];
      q._miss++;
      L.retries++;
      return 'wrong_more';
    }
  }
  if (ids.length < q.need.length) return 'wrong_less';
  q._answered = true;
  L.step++;
  if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
  return 'right';
}
const engWon = L => !!L && L.done;
/* 星级（§0.76 r11 口径）：全关错选/多选 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 救援/教学帮指用：单答案题=真值卡下标；提交题=未勾选的 need 卡（勾满=-1 指提交钮） */
function nextNeededIdx(q) {
  if (!q) return -1;
  if (!isSubmitKind(q.kind)) {
    for (let i = 0; i < q.opts.length; i++) if (q.opts[i].anim === q.need[0]) return i;
    return -1;
  }
  for (let i = 0; i < q.opts.length; i++) {
    if (q.need.indexOf(q.opts[i].anim) >= 0 && q.picked.indexOf(i) < 0) return i;
  }
  return -1;                                       // 勾满 → 调用方 breathe 提交钮
}
/* 兼容别名（UI/教学沿用旧名）：当前题正确卡下标 */
const correctIdx = q => nextNeededIdx(q);

/* ---------- 结构校验（verify 用，返回失败原因或 null）：封闭表真值 / 章型规则 /
   候选互异含全部真值 ⊆对应集 / 干扰恰 n-|need| 且公平 / answer 自洽 / 相邻互异 /
   flat0q0 锚点 / 初始态干净 ---------- */
function structWhy(q, dch, flat, qi, prevQ) {
  if (!q) return 'quiz';
  const KINDS = ['findfood', 'findwho', 'multifood', 'dietclass', 'chaindir'];
  if (KINDS.indexOf(q.kind) < 0) return 'kind';
  const vals = q.opts.map(o => o.anim);
  const isAnchor = flat === 0 && qi === 0;         // 教学演示题（兔子点胡萝卜）锚点
  if (isAnchor && (q.kind !== 'findfood' || q.ask !== 'rabbit')) return 'anchor';
  if (dch === 1 && (q.kind !== 'findfood' && q.kind !== 'findwho')) return 'dch1';
  if (dch === 2 && q.kind !== 'multifood') return 'dch2';
  if (dch === 3 && q.kind !== 'dietclass') return 'dch3';
  if (dch === 4 && q.kind !== 'chaindir') return 'dch4';
  /* 候选长度：pair=4 / multifood=4 / dietclass=3 / chaindir=2 */
  const wantLen = q.kind === 'dietclass' ? 3 : q.kind === 'chaindir' ? 2 : 4;
  if (vals.length !== wantLen) return 'optLen';
  if (new Set(vals).size !== vals.length) return 'optDup';          // 候选互异
  /* ask/pair 域 + need 真值独立推导（按题型对封闭表） */
  let expNeed = null, pool = null;
  if (q.kind === 'findfood') {
    if (ANIMALS8.indexOf(q.ask) < 0) return 'askAnimal';
    expNeed = [PAIRS8[q.ask]]; pool = FOODS8;
  } else if (q.kind === 'findwho') {
    if (FOODS8.indexOf(q.ask) < 0) return 'askFood';
    expNeed = [animalOf(q.ask)]; pool = ANIMALS8;
  } else if (q.kind === 'multifood') {
    if (ANIMALS10.indexOf(q.ask) < 0) return 'askAnimal10';
    expNeed = MULTI[q.ask].slice(); pool = FOODS15;
  } else if (q.kind === 'dietclass') {
    if (ANIMALS10.indexOf(q.ask) < 0) return 'askAnimal10';
    expNeed = [DIET_PLATE[DIET[q.ask]]]; pool = PLATES;
    if (vals.slice().sort().join() !== PLATES.slice().sort().join()) return 'plateSet';   // 三盘全出示
  } else {
    if (!q.pair || q.pair.length !== 2) return 'chainPair';
    const hit = CHAIN.filter(p => p.eater === q.pair[0] && p.eaten === q.pair[1]);
    if (!hit.length) return 'chainPair';                            // 对 ∈ CHAIN 表（表外不出题）
    expNeed = [q.pair[0]]; pool = [q.pair[0], q.pair[1]];
  }
  for (const v of vals) if (pool.indexOf(v) < 0) return 'optPool';  // 候选恒 ∈ 对应集
  if (!expNeed || q.need.length !== expNeed.length ||
      expNeed.some(x => q.need.indexOf(x) < 0)) return 'needTruth';
  for (const x of expNeed) if (vals.indexOf(x) < 0) return 'optTruth';   // 含全部真值
  const inters = vals.filter(v => expNeed.indexOf(v) < 0);              // 干扰=去真值，恰 n-|need|
  if (inters.length !== vals.length - expNeed.length) return 'distract';
  /* 干扰公平性（r11）：multifood 干扰 ⊆ DISTRACT_OK[ask]（半有效排除） */
  if (q.kind === 'multifood') {
    for (const v of inters) if (DISTRACT_OK[q.ask].indexOf(v) < 0) return 'fairBan';
  }
  /* answer 自洽（单答案题型=真值卡下标；提交型=-1） */
  if (isSubmitKind(q.kind)) { if (q.answer !== -1) return 'ansSubmit'; }
  else {
    if (q.answer < 0 || q.answer >= vals.length) return 'ansRange';
    if (vals[q.answer] !== q.need[0]) return 'ansIdx';
  }
  const sig = q.kind + ':' + (q.pair ? q.pair.join('>') : q.ask);
  const psig = prevQ ? prevQ.kind + ':' + (prevQ.pair ? prevQ.pair.join('>') : prevQ.ask) : null;
  if (psig && psig === sig) return 'adjacent';
  if (q._miss !== 0 || q._answered) return 'init';
  if (q.kind === 'multifood' && q.picked.length !== 0) return 'initPick';
  return null;
}
/* ================= animalmenu 主逻辑 v2（r11 难度改造 2026-09-14）
   玩法四题型五族（SPEC §0.76 r11）：题面=动物/食物大图（chaindir 双卡并排）+ 名音
   anm_n_<id>×N 与题面句（anm_q1/q2/q_multi/q_diet/q_chain）拼播（开题链全 clip 无

   不算 miss）——单段 clip，视觉锁 600/500 防连点。

   breathe（multifood 勾满=提交钮 breathe）+重读题面；错反馈链豁免窗 7800 让路（契约 I）。
   验收钩子：window.AN = { get currentLevel, get quiz(){kind,ask,pair?,opts[]{anim},

'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);

const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };

  if (now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.queue(parts); return true; }
  return false;                            /* 节流未播返回 false——豁免窗仅链起播时设（契约 I「起播设」） */
};
const sayWOne = v => {                        /* 单段 clip 反馈（提交 less/more——同节流口径） */
  if (!cur) return false;
  if (cur.flat < 3) { KIDS.voice.play(v.key, v.text); return true; }
  const now = Date.now();
  if (now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.play(v.key, v.text); return true; }
  return false;
};

const sceneEl = $id('scene'), boardEl = $id('board'), goBtn = $id('btn-go'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear'),
      ghostEl = $id('ghost');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();                       /* 30s 答案级 idle 锚（方向级不得重置它） */
let lastDir = Date.now();                       /* 14s 方向级独立节流锚（家族 B：与 lastAct 分离） */
let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）
let helpRedemo = false;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const cardEl = i => boardEl.querySelector('.card[data-i="' + i + '"]');
/* chaindir 出示序（=opts 序=听序）；其余题型出示=ask 单图 */
const shownIds = q => q.kind === 'chaindir' ? q.opts.map(o => o.anim) : [q.ask];

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 70);
  goBtn.innerHTML = ICONS.go + '<div class="go-name">点好啦</div>';
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：答对=双音上行 / 答错=低柔单音 */
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };

/* ================= 题面语音（开题链=名音×N+题面句拼播，全 clip 无 keyless——契约 N 安全；
   家族 G 链后窗按 §4 r11 实长表：chaindir 最长 wolf+sheep 3216+2×150+q_chain 1776=5292，
   读题异步不占 UI 等待窗） ================= */
function speakQuiz() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const ask = shownIds(q).map(nameClip);
  const qk = q.kind === 'findfood' ? VOICE.q1.key
           : q.kind === 'findwho' ? VOICE.q2.key
           : q.kind === 'multifood' ? VOICE.qMulti.key
           : q.kind === 'dietclass' ? VOICE.qDiet.key : VOICE.qChain.key;
  KIDS.voice.queue(ask.concat([qk]));
}
/* 重听路径（hear/题面共用）：重播开题链+大图再 pulse（方向级回锚） */
function replayQuiz(withPulse) {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  speakQuiz();
  if (withPulse) pulseAsk();
}
/* 方向级回锚：题面大图再 pulse（错反馈/重听/救援共用） */
function pulseAsk() {
  if (sceneEl) replayAnim(sceneEl, 'pulse');
}
/* 方向提示（小兔子/救援按题型分流——iftrain v2 先例；不泄答案） */
function hintVoiceOf(q) {
  return q.kind === 'multifood' ? VOICE.qMulti        /* 它爱吃的都要呀（计数交给自己） */
       : q.kind === 'dietclass' ? VOICE.hDiet         /* 想一想，它爱吃什么 */
       : q.kind === 'chaindir' ? VOICE.hChain         /* 想一想，谁吃谁 */
       : VOICE.hint;
}

/* ================= 渲染 ================= */
const Q_TEXT = { findfood: VOICE.q1.text, findwho: VOICE.q2.text,
                 multifood: VOICE.qMulti.text, dietclass: VOICE.qDiet.text,
                 chaindir: VOICE.qChain.text };
function renderScene(q) {                        // 题面：暖色餐垫 + 大图（chaindir 双卡并排）+ 题面句
  sceneEl.dataset.kind = q.kind;
  sceneEl.dataset.ask = shownIds(q).join('+');   // 帧内容锚（契约 M：verify 断言；chaindir=a+b）
  sceneEl.setAttribute('aria-label', shownIds(q).map(nameOf).join('，') + '，点我再听一遍');
  if (q.kind === 'chaindir') {
    const s = q.opts.map(o => o.anim);
    sceneEl.innerHTML = '<div class="ask-slot multi">' +
      '<div class="ask-mini"><div class="ask-shadow" aria-hidden="true"></div>' + animSvg(s[0], 118) + '</div>' +
      '<div class="chain-arrow" aria-hidden="true">?</div>' +
      '<div class="ask-mini"><div class="ask-shadow" aria-hidden="true"></div>' + animSvg(s[1], 118) + '</div>' +
      '</div><div class="q-text">' + Q_TEXT[q.kind] + '</div>';
    return;
  }
  sceneEl.innerHTML = '<div class="ask-slot"><div class="ask-shadow" aria-hidden="true"></div>' +
    animSvg(q.ask, 150) + '</div>' +
    '<div class="q-text">' + Q_TEXT[q.kind] + '</div>';
}
function renderBoard(q) {                        // 候选图卡排（SVG 零文字；multifood=勾选卡+check 徽章）
  boardEl.innerHTML = '';
  const multi = isSubmitKind(q.kind);
  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'card pop' + (multi && q.picked.indexOf(i) >= 0 ? ' held' : '');
    b.dataset.i = i;
    b.dataset.anim = o.anim;                     // verify 对账（渲染即引擎）
    b.setAttribute('aria-label', nameOf(o.anim) + '卡');
    b.innerHTML = animSvg(o.anim, 104) +
      (multi ? '<span class="check" aria-hidden="true">' + ICONS.check + '</span>' : '');
    b.style.animationDelay = (i * 70) + 'ms';
    boardEl.appendChild(b);
  });
}
/* 「点好啦」提交钮：multifood 才出现；勾满 need 数=.ready 呼吸邀请（计数驱动，不泄答案） */
function updateGoBtn(q) {
  const multi = !!(q && isSubmitKind(q.kind));
  goBtn.classList.toggle('show', multi);
  goBtn.classList.toggle('ready', multi && q.picked.length === q.need.length);
}
function syncHeld(q, i) {                        // 勾选态增量同步（pick/unpick 后）
  const el = cardEl(i);
  if (el) el.classList.toggle('held', q.picked.indexOf(i) >= 0);
  updateGoBtn(q);
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderScene(q);
  renderBoard(q);
  updateGoBtn(q);
  renderStep();
  if (!VERIFY && !state.demo && !state.quiet) speakQuiz();   // 开题读题（教学演示期静默）
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 答对演出：大图跳 + 小兔子滑入示范（确认句拼播由 uiTapOpt/uiSubmit 播）
   verify 页跳过装饰直接落定 ================= */
function celebrateScene(run) {
  const slot = sceneEl.querySelector('.ask-slot');
  if (slot) replayAnim(slot, 'jump');
  if (!sceneEl.querySelector('.demo-pet')) {
    const pet = document.createElement('div');
    pet.className = 'demo-pet';
    pet.innerHTML = KIDS.assets.rabbit('happy', 54);   /* 小兔子开心示范 */
    sceneEl.appendChild(pet);
    requestAnimationFrame(() => pet.classList.add('show'));
  }
  hopRabbit();
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向：当前题下一件应选卡（multifood 勾满指提交钮） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const i = nextNeededIdx(q);
  pointGhostAt(i >= 0 ? cardEl(i) : goBtn);
}

/* ================= 答对收尾（单答案 tap 与提交 submit 共用）：
   lit 高亮下标集 + 确认链 anm_right+名音拼播 + 演出窗。
   窗（家族 G/H，§4 r11 实长表）：单名链 max right+150+sheep 1632+300=4338 → 1600+2800=4400；
   multifood 双名链 max right+150+honey+150+berry+300=5754 → 1600+4800=6400 ================= */
async function finishQuestion(r, run, litIdx, nameIds) {
  const q = cur.quizzes[cur.step - 1] || run.quizzes[run.step];   /* 已推进：取刚完成的题 */
  litIdx.forEach(i => { const el = cardEl(i); if (el) { el.classList.remove('breathe'); el.classList.add('lit'); } });
  chimeGoal();
  sfx('coin');
  if (cur === run) celebrateScene(run);          /* 大图跳 + 小兔子滑入示范 */
  KIDS.voice.queue([VOICE.right.key].concat(nameIds.map(nameClip)));   /* 确认链：全 clip 无 keyless（契约 N） */
  return q;
}
async function finishWait(r, run, twoNames) {
  await wait(1600 * SPEED);                      /* 大图跳+卡亮+确认链主窗 */
  if (cur !== run) return r;
  await wait(twoNames ? 4800 * SPEED : 2800 * SPEED);   /* 确认链收尾窗：双名 6400 ≥5754 / 单名 4400 ≥4338 */
  if (cur !== run) return r;
  state.locked = false;
  if (r === 'done') { updateGoBtn(null); winFlow(); return 'done'; }
  renderQuiz();                                  /* 新题（大图/卡全换）+读题 */
  return r;
}

/* ================= 点卡主路径（真实点击 / AN.tapOpt / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（卡排容器 bump 微动效——家族 D）；
   错防重入窗/判对演出窗共用 locked 门；错点 1000ms 防重入窗（b16 定案）========== */
async function uiTapOpt(i, demo) {
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  /* b31 复验修（2026-09-11）：错链豁免窗（真时钟）内错点吞——locked 窗 verify 页乘 SPEED 缩水防
     40ms 漏点（b30 家族 T7 口径 miss 只+1）；对选放行（缓解 b30 P1-1 吞输入急性子观察）；
     窗后第二错照常计 miss（miss≥2 梯度脚手架可达）。r11：仅单答案题型适用（multifood 勾选
     切换零惩罚、不设错链豁免窗——iftrain v2 同口径） */
  if (!demo && !isSubmitKind(q.kind) && wrongChainUntil && Date.now() < wrongChainUntil && i !== q.answer) {
    sfx('pop'); replayAnim(boardEl, 'bump'); return false;
  }
  const run = cur;                               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapOpt(cur, i);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }   // 越界/已答=null+pop+bump

  if (r === 'pick' || r === 'unpick') {          /* multifood 勾选切换（零惩罚，不判对错） */
    lastAct = Date.now();                        /* 主动操作重置救援钟（§0.7a） */
    sfx('pop');
    syncHeld(q, i);
    return r;
  }

  if (r === 'wrong') {                           /* 答错：摇头+错链（按题型三段）+大图 pulse */
    state.locked = true;
    const el = cardEl(i);
    if (el) replayAnim(el, 'wig');
    dodgeLo();
    /* 错链构成（r11；T46 阶段2 语义句 clip 化 anm_again_* 键段，text=TTS 兜底）：
       findfood=[anm_hint,名音,anm_again_food] / findwho=[anm_q2,名音,anm_again_who]
       / dietclass=[anm_hint,名音,anm_again_diet]（clip+clip+clip 尾）；
       chaindir=[名音A,名音B,anm_again_chain]（双名回锚+clip 尾，无 clip 头——三名链最长
       wolf+sheep 3216+300+2688，+300 落定 ≤7800 窗） */
    let parts;
    if (q.kind === 'findfood')
      parts = [VOICE.hint.key, nameClip(q.ask), { key: 'anm_again_food', text: FOOD_AGAIN }];
    else if (q.kind === 'findwho')
      parts = [VOICE.q2.key, nameClip(q.ask), { key: 'anm_again_who', text: WHO_AGAIN }];
    else if (q.kind === 'dietclass')
      parts = [VOICE.hint.key, nameClip(q.ask), { key: 'anm_again_diet', text: DIET_AGAIN }];
    else
      parts = [nameClip(q.opts[0].anim), nameClip(q.opts[1].anim), { key: 'anm_again_chain', text: CHAIN_AGAIN }];
    if (sayW(parts))
      wrongChainUntil = Date.now() + 7800;      /* 链豁免：findfood 2016+150+1464+150+2664+300=6744 / findwho
                                                   1944+150+1560+150+2496+300=6600
                                                   / dietclass 2016+150+1632+150+2232+300=6480
                                                   / chaindir 1584+150+1632+150+2688+300=6504（契约 I，均+300 内收口） */
    pulseAsk();                                  /* 方向级：题面大图再 pulse（看清楚再想） */
    await wait(1000 * SPEED);                    /* 错点防重入窗 1000ms；对选可打断链；救援由 wrongChainUntil 让路 */
    if (cur !== run) return r;
    state.locked = false;
    return r;
  }

  /* ---- right·done（本题完成：大图跳+兔子示范+确认句拼播） ---- */
  lastAct = Date.now();                          /* 正确选择重置救援钟（§0.7a） */
  if (state.tut === 'help') {                    /* 教学"独"：首次选对 → 放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  /* 确认链名音：findfood/findwho/chaindir=点中卡 id / dietclass=动物名（盘 id 无名音） */
  const nameId = q.kind === 'dietclass' ? q.ask : q.opts[q.answer].anim;
  finishQuestion(r, run, [q.answer], [nameId]);
  return await finishWait(r, run, false);
}

/* ================= 提交主路径（「点好啦」/ AN.tapSubmit / autoSolve / 教学共用）
   返回：'right'（含末题 done 内部走 winFlow）/ 'wrong_more'（多选/含错件：清空重选+miss）/
   'wrong_less'（少选：保留继续）/ false（吞输入/单答案题型不适用）——iftrain v2 先例 */
async function uiSubmit(demo) {
  if (!cur || state.won) return false;
  if ((state.locked && !demo) || (state.demo && !demo)) { sfx('pop'); replayAnim(goBtn, 'bump'); return false; }
  const run = cur;                               /* 身份守卫（同上） */
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const r = engSubmit(cur);
  if (r === null || r === false) return false;

  if (r === 'wrong_less') {                      /* 少选：保留勾选继续找（合法路径不算 miss） */
    lastAct = Date.now();
    state.locked = true;                         /* 短窗防连点提交刷语音 */
    dodgeLo();
    hopRabbit();
    sayWOne(VOICE.less);                         /* anm_less 2832：还差一样，再找一找哦 */
    await wait(500 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    if (state.tut === 'help') pointHelpNext();
    return 'wrong_less';
  }
  if (r === 'wrong_more') {                      /* 多选/含错件：清空重选+miss（真实错误路径） */
    lastAct = Date.now();
    state.locked = true;
    dodgeLo();
    replayAnim(boardEl, 'bump');
    renderBoard(q);                              /* 清勾选态（held 全撤） */
    updateGoBtn(q);
    sayWOne(VOICE.more);                         /* anm_more 3072：多选了一样，重新挑一挑哦 */
    await wait(600 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    if (state.tut === 'help') pointHelpNext();
    return 'wrong_more';
  }
  /* right / done：提交成 */
  lastAct = Date.now();
  if (state.tut === 'help') {                    /* 教学"独"：提交成 → 放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  goBtn.classList.remove('ready');
  finishQuestion(r, run, q.picked.slice(), q.need.slice());
  return await finishWait(r, run, true);
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关随机章型 GEN[dch-1]（家族 F：
     genLevel 纯函数确定性，同 flat 恒同 dch——预告与实际章型恒一致，禁 (ci+1)%4） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  sayR(VOICE.right.key, VOICE.right.text);       /* anm_right：点对啦，真棒（2256ms） */
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(async () => {
    await wait(400);                             /* 家族 H：celebrate 2620+400=3020 ≥ 2256+300=2556 */
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) });   /* 家族 A（r11 升级，weather M2 同款）：dayEnd 实算 lim-1——两处同款 */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  lastWrongVoice = 0; wrongChainUntil = 0;      /* 换关重置错反馈节流锚与链豁免（契约 I/J 配套） */
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();                          /* 主动读题路径重置 idle 锚（b25 M4） */
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] &&
                   !(sv.animalmenu && sv.animalmenu.tutSeen);   /* 契约 E：先查教学特例再定行为 */
  if (VERIFY) return;                            // verify 页：教学链由 runVerify 单元直调
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  speakQuiz();
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独（r11 沿用——flat0 题0 恒 findfood/rabbit）

  ghost.hide();

  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  if (Date.now() < wrongChainUntil) return;   /* 错反馈链豁免窗（契约 I）：链播完前救援不掐断 */

    const q = cur.quizzes[cur.step];

      const i = nextNeededIdx(q);

      speakQuiz();
    }
    lastAct = Date.now();
    return;
  }
  if (idle > 14000 && Date.now() - lastDir > 14000) {   /* 方向级：重读题面+大图 pulse（不动 lastAct） */
    speakQuiz();
    pulseAsk();
    lastDir = Date.now();

  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    return { kind: q.kind,                             /* SPEC §1 r11：findfood|findwho|multifood|dietclass|chaindir */
             ask: q.ask,                               /* 出示图 id（findfood=动物8 / findwho=食物8 / multifood·dietclass=动物10 / chaindir=null） */
             pair: q.pair ? q.pair.slice() : null,     /* chaindir：[eater, eaten] 规范序 */
             opts: q.opts.map(o => ({ anim: o.anim })), /* 图卡 {anim}（封闭 25 之一+盘 3） */
             answer: q.answer,                         /* 单答案题型=正确卡下标 / multifood=-1 */
             need: q.need.slice(),                     /* 真值集（单答案=1 / multifood=2） */
             picked: q.picked.slice(),                 /* multifood 勾选下标集 */
             step: cur.step,
             miss: q._miss || 0 };
  },
  tapOpt(i) { return uiTapOpt(i); },
  tapSubmit() { return uiSubmit(false); },
  async autoSolve() {                    // UI 路径自动点完当前关（单答案=点真值卡；multifood=勾满+提交；
    let taps = 0, guard = 0;             // 演出窗内 tap=false → 等窗结束重试，非 break）
    while (cur && !cur.done && guard++ < 160) {
      let wg = 0;
      while ((state.locked || state.demo) && wg++ < 600) await wait(50);
      const q = cur && cur.quizzes[cur.step];
      if (!q) break;
      if (isSubmitKind(q.kind)) {
        let acted = false;
        for (const g of q.need) {
          const i = q.opts.findIndex(o => o.anim === g);
          if (i >= 0 && q.picked.indexOf(i) < 0) { await uiTapOpt(i); acted = true; break; }
        }
        if (!acted) {
          const r = await uiSubmit();
          if (r === 'right' || r === 'done') taps++;
          else if (guard >= 158) break;
        }
      } else {
        const r = await uiTapOpt(q.answer);
        if (r === 'right' || r === 'done') taps++;
        else if (guard >= 158) break;
      }
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
  get tutorial() { return state.tut; }
};

  /* r11 modeled 时长常量（SPEC §0.76 r11：认知步主体非演出窗）：

                    chainFood: SPEC_DUR.anm_hint + 150 + SPEC_DUR.anm_n_squirrel + 150 + SPEC_DUR.anm_again_food + 300,
                    chainWho: SPEC_DUR.anm_q2 + 150 + SPEC_DUR.anm_n_carrot + 150 + SPEC_DUR.anm_again_who + 300,
                    chainDiet: SPEC_DUR.anm_hint + 150 + SPEC_DUR.anm_n_sheep + 150 + SPEC_DUR.anm_again_diet + 300,
                    chainChain: SPEC_DUR.anm_n_wolf + 150 + SPEC_DUR.anm_n_sheep + 150 + SPEC_DUR.anm_again_chain + 300,
                    submitLess: SPEC_DUR.anm_less, submitMore: SPEC_DUR.anm_more };
  if (winOk) npass++;
  units.estWin = { ok: winOk, est: estData };

  /* ---- ⑱ wall-clock：三关节奏驱动实测 ×(1/SPEED) 折算 ≥Σ判对窗×0.95（演出窗完整在场）。
     认知时长门槛在 ① modeled（listen+nOpts×1500+taps×1200 ≥40000，认知步主体非演出窗）——
     机器人即时点击天然测不到浏览/思考时间，此处只验演出窗（判对 4400/提交 6400）未被削减：
     若 finishWait 窗被删/缩水，实测将低于每关 5 题×窗之和×0.95 ---- */
  total++;
  const wcOf = async flat => {
    startLevel(flat);
    const t = Date.now();
    let guard = 0;
    while (cur && !cur.done && guard++ < 200) {
      let wg = 0;
      while ((state.locked || state.demo) && wg++ < 900) await wait(50);
      const q = window.AN.quiz;
      if (!q) break;
      const r = await driveQ(q);                     // 单答案=真值卡 / 提交=勾满+提交
      if (r === 'done') break;
    }
    return Math.round((Date.now() - t) / SPEED);
  };
  const wc0 = await wcOf(0), wc5 = await wcOf(5), wc15 = await wcOf(15);
  const needWC = flat => flat === 5 ? 5 * 6400 : 5 * 4400;   // ch2 提交窗 / 其余单名窗
  const wcOk = wc0 >= needWC(0) * 0.95 && wc5 >= needWC(5) * 0.95 && wc15 >= needWC(15) * 0.95;
  if (wcOk) npass++;
  smokes.wallClock = { ok: wcOk, flat0: wc0, flat5: wc5, flat15: wc15,
                       need0: needWC(0), need5: needWC(5), need15: needWC(15) };

  /* ---- ⑲ verify 提速断言 ---- */
  total++;
  const speedOk = SPEED === 0.12;
  if (speedOk) npass++;
  units.speed = { ok: speedOk, SPEED: SPEED };

  const out = { game: 'animalmenu', total: total, pass: npass, layoutOk: layoutOk,
                levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__anVlog = out;                          // 外部断言挂点（任务书钩子）
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text（__lastVoiceKey/__lastVoiceText）；
     voice.queue 记录拼播链（__lastQueue）供反馈链/确认链绑定断言 */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) { window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null; };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    window.__lastVoiceKey = parts && parts.length ? parts[0] : null;
  };
  runVerify();
}

</script>
