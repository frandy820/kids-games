<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>图表小读者</title>
<style>
/* ================= 图表小读者 chartread（batch31 · r17 难度改造版）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 行式象形统计图（每行=类目头 icon + 值个 icon，行高>=48px）+
   问句点选（类目图卡 / 数字卡）。r17：值域 10-20 + unit=2 成对格（轴角标
   「一格=2」）+ 两图对比（上午/下午双图）+ 合计/多步约束/第二多问法。
   类目封闭 6（rabbit 兔子/cat 猫/dog 狗/bird 小鸟/fish 鱼/chick 小鸡）；
   每题独立图表：3-4 类目、值 10-20 互异（无并列=排序族唯一性先验）；
   unit=1 每格 1 icon（每第 5 格组距=五个一群点数支架）。
   章：ch1 读图数一数 / ch2 一格代表2 / ch3 两图比一比+多步约束
   / ch4 混合+第二多（生成关 seeded）。7-8 岁段：文字题面允许（类目名小字）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：象形图面板 + 题面句 + 候选卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:6px 12px}

/* 象形统计图（点=重听题面，图容器 bump=吞输入可见回应） */
#chart{position:relative;flex:0 0 auto;width:min(600px,94vw);border-radius:22px;
  background:linear-gradient(180deg,#FFFDF6 0%,#FBF3E2 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;padding:10px 14px;display:flex;flex-direction:column;
  justify-content:center;flex:1 1 auto;min-height:0;transition:transform .15s}
#chart:active{transform:translateY(2px)}
#chart.pulse{animation:ch-pulse 1.1s ease-in-out 3}
@keyframes ch-pulse{0%,100%{box-shadow:0 4px 0 #D8C9B4}50%{box-shadow:0 0 0 10px rgba(232,151,90,.4)}}
#chart .rows{display:flex;flex-direction:column;gap:6px}
/* 行式象形图：每行 = 类目头(icon+名小字) + 值个 24px icon 重复；行高≥48px 触摸安全 */
.row{display:grid;grid-template-columns:44px 1fr;align-items:center;min-height:48px;
  border-radius:12px;padding:2px 4px}
.row-head{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.row-head svg{width:34px;height:34px}
.row-head .rn{font-size:12px;line-height:1;color:#6B5A48;font-weight:700}
.row-units{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding-left:6px}
.unit{width:24px;height:24px;flex:0 0 24px}
.unit svg{width:24px;height:24px}
/* 方向级：行 pulse（howmany 目标行逐格/compare 两行/miss≥2 答案行） */
.row.pulse{animation:row-pulse .55s ease-in-out 2}
@keyframes row-pulse{0%,100%{background:transparent;transform:scale(1)}
  50%{background:rgba(232,151,90,.28);transform:scale(1.06)}}
.unit.pulse{animation:unit-pulse .5s ease 2 both}
@keyframes unit-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3) translateY(-3px)}}
.row.lit{animation:row-lit 1.2s ease-in-out infinite}
@keyframes row-lit{0%,100%{background:rgba(143,191,127,.18);box-shadow:none}
  50%{background:rgba(143,191,127,.4);box-shadow:0 0 0 4px rgba(143,191,127,.35)}}

/* 单位换算轴角标（unit=2 在场铁证——一格代表 2 的读图标注） */
.axis-tag{position:absolute;top:8px;right:10px;z-index:2;font-size:12.5px;font-weight:800;
  color:#4A3B2E;background:#F5C445;border:2px solid #4A3B2E;border-radius:10px;padding:2px 8px;
  box-shadow:0 2px 0 #D8C9B4}
/* 成对格（一格=2 只）：暖底小框并置 2 icon——「格」的视觉锚 */
.unit.pair{width:46px;height:26px;flex:0 0 46px;display:flex;gap:2px;align-items:center;
  justify-content:center;background:rgba(232,151,90,.12);border-radius:7px;padding:1px 2px}
.unit.pair svg{width:20px;height:20px}
/* 五个一群组距（unit=1 点数支架：视觉分群点数） */
.unit.g5{margin-left:9px}
/* 两图对比（twocompare）：上午/下午双图并置（竖屏纵向堆叠见竖屏段） */
.two-wrap{display:flex;flex-direction:row;gap:10px;justify-content:center;align-items:stretch;width:100%}
.sub-chart{flex:1 1 0;min-width:0;position:relative;border:2px dashed #C9A87C;border-radius:14px;
  padding:6px 8px 8px;background:rgba(255,253,246,.55)}
.sub-chart .sub-tag{display:inline-block;font-size:13px;font-weight:800;color:#4A3B2E;
  background:#FFF9EE;border:2px solid #4A3B2E;border-radius:9px;padding:1px 9px;margin-bottom:4px}
.sub-chart[data-lab="1"] .sub-tag{background:#F2DDC0}
.sub-chart .rows{gap:4px}

/* 题面句条（点=重听；7-8 岁文字题面） */
#qbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  max-width:94vw;padding:4px 8px}
#qbar .q-text{font-size:21px;font-weight:700;color:#4A3B2E;padding:4px 20px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}
#qbar.pop .q-text{animation:q-pop .35s ease}
@keyframes q-pop{0%{transform:scale(.9)}55%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- 候选卡排（主答案按钮 ≥96×96） ---------- */
#board{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:12px;max-width:760px;padding:2px 4px}
#board.bump{animation:bd-bump .22s ease}
@keyframes bd-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;width:118px;min-height:96px;border-radius:18px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:6px 4px;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card svg{width:76px;height:76px;pointer-events:none}
.card .nm{font-size:13px;font-weight:700;color:#6B5A48;margin-top:1px}
.card .num{font-size:52px;font-weight:800;line-height:1;color:#4A3B2E;pointer-events:none}
.card .unit-tag{font-size:13px;font-weight:700;color:#8A7B6C;margin-top:1px}
.card.pop{animation:card-in .4s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes card-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.card.lit{border-color:#8FBF7F;background:#EFF6E6;animation:card-lit .5s ease}
@keyframes card-lit{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
.card.wig{animation:card-wig .4s ease}
@keyframes card-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
.card.breathe{animation:card-br 1.2s ease-in-out infinite}
@keyframes card-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.05)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-30） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：图表/卡收紧，主答案卡仍 ≥96 高 */
@media (orientation:portrait){
  #chart{width:min(400px,95vw);padding:8px 10px}
  .row{min-height:48px}
  .row-head svg{width:30px;height:30px}
  .row-head .rn{font-size:11px}
  .unit{width:24px;height:24px;flex:0 0 24px}
  .unit svg{width:24px;height:24px}
.unit.pair{width:44px;flex:0 0 44px}
.unit.pair svg{width:20px;height:20px}
.two-wrap{flex-direction:column}
.axis-tag{font-size:11px;top:6px;right:8px}
  #qbar .q-text{font-size:18px;padding:3px 14px}
  #board{gap:10px}
  .card{width:104px;min-height:96px}
  .card svg{width:64px;height:64px}
  .card .num{font-size:44px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
/*PORT-CLS*/
body.port #chart{width:min(400px,95vw);padding:8px 10px}
body.port .row{min-height:48px}
body.port .row-head svg{width:30px;height:30px}
body.port .row-head .rn{font-size:11px}
body.port .unit{width:24px;height:24px;flex:0 0 24px}
body.port .unit svg{width:24px;height:24px}
body.port .unit.pair{width:44px;flex:0 0 44px}
body.port .unit.pair svg{width:20px;height:20px}
body.port .two-wrap{flex-direction:column}
body.port .axis-tag{font-size:11px;top:6px;right:8px}
body.port #qbar .q-text{font-size:18px;padding:3px 14px}
body.port #board{gap:10px}
body.port .card{width:104px;min-height:96px}
body.port .card svg{width:64px;height:64px}
body.port .card .num{font-size:44px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
/*PORT-CLS-END*/
</style>
</head>
<body>
<div id="game" aria-label="图表小读者">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="chart" aria-label="象形统计图，点我再听一遍"></button>
    <div id="qbar" aria-live="polite"><div class="q-text"></div></div>
    <div id="board" aria-label="候选卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
