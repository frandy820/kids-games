<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乘法捕鱼</title>
<style>
/* ================= 乘法捕鱼 times =================
   池塘蓝绿场景，底色仍暖米 #FBF6EC 基调；描边 #4A3B2E（DESIGN-SPEC §8）
   触摸目标：数字鱼 ≥96×96、底栏主按钮 ≥88、间距 ≥16；pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 池塘（数字鱼泳区；分组图辅助与转化动画覆盖此区） ---------- */
#pond-wrap{position:relative;flex:1 1 auto;min-height:228px;margin:2px 10px 0;display:flex}
#pond{position:relative;flex:1 1 auto;background:#D8EBE3;border:3px solid #4A3B2E;
  border-radius:28px;overflow:hidden}
#pond-bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.pbub{animation:pb-float 7s ease-in-out infinite alternate}
.pbub.b2{animation-duration:9.5s;animation-delay:-3s}
.pbub.b3{animation-duration:8s;animation-delay:-5.4s}
.pbub.b4{animation-duration:10s;animation-delay:-1.6s}
@keyframes pb-float{0%{transform:translateY(0)}100%{transform:translateY(-24px)}}

/* 数字鱼：气泡=答案数字，鱼身缓游（动画只在 .bob 内层，外层按钮几何稳定供验收断言） */
#fish-grid{position:absolute;inset:26px 16px 12px;display:grid;grid-template-columns:repeat(4,1fr);
  grid-auto-rows:1fr;gap:16px;z-index:2}
.fish-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;min-width:96px;min-height:96px;border-radius:22px;transition:transform .15s}
.fish-btn:active{transform:translateY(3px)}
.fish-btn .bubble{min-width:70px;height:70px;border-radius:50%;background:#FFF9EE;border:3px solid #4A3B2E;
  display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:#4A3B2E;
  font-variant-numeric:tabular-nums;box-shadow:0 4px 0 rgba(74,59,46,.16);position:relative;z-index:2}
.fish-btn .bubble::after{content:'';position:absolute;left:50%;bottom:-12px;margin-left:-7px;
  border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid #4A3B2E}
.fish-btn .bob{line-height:0;animation:swim 3.6s ease-in-out infinite}
.fish-btn:nth-child(2) .bob{animation-duration:4.2s;animation-delay:-1.2s}
.fish-btn:nth-child(3) .bob{animation-duration:3.9s;animation-delay:-2.1s}
.fish-btn:nth-child(4) .bob{animation-duration:4.5s;animation-delay:-.7s}
@keyframes swim{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.fish-btn svg{width:clamp(96px,13vw,150px);height:auto}
.fish-btn.alt svg{transform:scaleX(-1)}
.fish-btn.right .bubble{background:#8FBF7F;color:#fff;border-color:#6FA063}
.fish-btn.right .bob{animation:catch .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes catch{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-10px) scale(1.16) rotate(-5deg)}
  100%{transform:translateY(0) scale(1.05)}}
.fish-btn.wrong{opacity:.5;pointer-events:none}
.fish-btn.wrong .bubble{background:#EFE3CD;color:#B7AA96;border-color:#C9BDA8}
.fish-btn.wrong .bob{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fish-btn.pulse .bubble{animation:ans-pulse 1s ease 2}
@keyframes ans-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}

/* ---------- 分组图辅助（鱼群可视化：同数连加一行行排，不代答） ---------- */
#aid{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:#EAF4EE;padding:8px 12px;gap:7px}
#aid.open{display:flex}
#aid .aid-title{font-size:16px;font-weight:700;color:#5E7A6E}
#aid .aid-cap{font-size:15px;font-weight:700;color:#4A3B2E}
.a-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:center;max-width:100%}
.a-group{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:center;max-width:46%;
  padding:7px 9px;border-radius:14px;background:rgba(255,249,238,.78);border:2.5px dashed #9DC3B4;
  transition:border-color .25s,background .25s;
  animation:pop-in .32s cubic-bezier(.2,1.5,.4,1) both}
.a-group.lit{border-style:solid;border-color:#E8975A;background:#FFF9EE;box-shadow:0 3px 0 rgba(74,59,46,.15)}
.a-fish{display:block;animation:pop-in .32s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop-in{from{transform:scale(0)}to{transform:scale(1)}}
.a-plus{font-size:34px;font-weight:800;color:#B36A35;padding:0 2px}
/* 面板内答案气泡（面板覆盖池塘，答案必须可达） */
#aid .aid-ans-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.aid-ans{min-width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:3px solid #4A3B2E;
  font-size:32px;font-weight:800;color:#4A3B2E;font-variant-numeric:tabular-nums;
  box-shadow:0 4px 0 rgba(74,59,46,.16);transition:transform .15s;padding:0 10px}
.aid-ans:active{transform:translateY(3px)}
.aid-ans.wrong{background:#EFE3CD;color:#B7AA96;border-color:#C9BDA8;opacity:.55;pointer-events:none}
.aid-ans.pulse{animation:ans-pulse 1s ease 2}

/* ---------- 连加→乘法 转化动画卡 ---------- */
#convert{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.4);z-index:8;
  display:flex;align-items:center;gap:14px;padding:16px 26px;border-radius:22px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 6px 0 rgba(74,59,46,.2);font-size:clamp(24px,3.4vw,38px);
  font-weight:800;color:#4A3B2E;opacity:0;pointer-events:none;
  transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .3s;
  font-variant-numeric:tabular-nums;white-space:nowrap}
#convert.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#convert .cv-sum{color:#8A7B6C}
#convert .cv-arrow{color:#E8975A;font-size:1.15em}
#convert .cv-mul{color:#C77A42}

/* ---------- 题面大字卡 ---------- */
#quiz-zone{flex:0 0 auto}
#quiz-card{display:flex;justify-content:center;align-items:baseline;padding:4px 12px 10px}
#quiz-text{font-size:clamp(38px,5.4vw,66px);font-weight:800;color:#4A3B2E;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;white-space:nowrap}
#quiz-text #qm{color:#C77A42}
#quiz-text #qm.ok{color:#6FA063;animation:qm-pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes qm-pop{from{transform:scale(.2) rotate(-14deg);display:inline-block}
  to{transform:scale(1) rotate(0);display:inline-block}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-groups{min-width:126px;min-height:88px;border-radius:22px;background:#C77A42;color:#fff;
  box-shadow:0 4px 0 #C77A42;font-size:19px;font-weight:700;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;transition:transform .15s}
#btn-groups:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
#btn-groups svg{width:36px;height:36px}
#btn-groups.pulse{animation:cnt-pulse 1s ease 2}
@keyframes cnt-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px rgba(232,151,90,.95)) brightness(1.06)}}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}

/* ---------- 幽灵手指教学 ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：鱼 2×2、题面与按钮适配 */
@media (orientation:portrait){
  #fish-grid{grid-template-columns:repeat(2,1fr);gap:16px}
  .fish-btn svg{width:clamp(96px,16vw,150px)}
  #quiz-text{font-size:clamp(34px,6.2vw,60px)}
}
</style>
</head>
<body>
<div id="game" aria-label="乘法捕鱼">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="pond-wrap" aria-label="鱼塘">
    <div id="pond">
      <svg id="pond-bg" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
        <path d="M0 76 Q25 70 50 76 T100 76 L100 100 L0 100 Z" fill="#C6E0D4"/>
        <path d="M0 88 Q25 83 50 88 T100 88 L100 100 L0 100 Z" fill="#B9D5C8" opacity=".8"/>
        <path d="M4 96 Q3 86 8 78 Q12 86 10 96 Z" fill="#9DC3B4" opacity=".75"/>
        <path d="M92 98 Q90 88 96 80 Q99 88 97 98 Z" fill="#9DC3B4" opacity=".6"/>
        <ellipse cx="12" cy="84" rx="9" ry="3.4" fill="#8FBF7F" stroke="#4A3B2E" stroke-width="1" opacity=".85"/>
        <ellipse cx="88" cy="90" rx="7.5" ry="3" fill="#8FBF7F" stroke="#4A3B2E" stroke-width="1" opacity=".8"/>
        <ellipse cx="22" cy="94" rx="6" ry="2.5" fill="#8FBF7F" stroke="#4A3B2E" stroke-width="1" opacity=".7"/>
        <path d="M6 16 Q10 14 14 16 T22 16" stroke="#FFF" stroke-width="1.1" opacity=".3"/>
        <path d="M70 8 Q74 6 78 8 T86 8" stroke="#FFF" stroke-width="1.1" opacity=".26"/>
        <path d="M30 66 Q34 64 38 66 T46 66" stroke="#FFF" stroke-width="1.1" opacity=".24"/>
        <circle class="pbub" cx="92" cy="28" r="2.2" fill="#FFF" opacity=".5"/>
        <circle class="pbub b2" cx="6" cy="40" r="1.7" fill="#FFF" opacity=".45"/>
        <circle class="pbub b3" cx="84" cy="58" r="1.4" fill="#FFF" opacity=".4"/>
        <circle class="pbub b4" cx="16" cy="66" r="1.9" fill="#FFF" opacity=".42"/>
      </svg>
      <div id="fish-grid" role="group" aria-label="数字鱼选项"></div>
      <div id="aid" role="region" aria-label="鱼群分组图"></div>
      <div id="convert" aria-hidden="true"></div>
    </div>
  </div>
  <div id="quiz-zone">
    <div id="quiz-card"><div id="quiz-text" aria-live="polite">…</div></div>
  </div>
  <div id="dock">
    <button id="btn-groups" aria-label="看一看鱼群分组"></button>
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
