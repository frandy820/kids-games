<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数独小动物</title>
<style>
/* ================= 数独小动物 sudoku（batch4） =================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、纸面 #FFF9EE、暖棕描边 #4A3B2E、
   暖橙主色、冲突用中饱和暖红 #D96A5A + 晃动（状态不单靠颜色）
   触摸目标：4×4 格 ≥72px、6×6 格 ≥64px（视觉=命中）、动物按钮 ≥64px */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏：图标 + 提示灯（每关 3 次）+ 章节点 ---------- */
#hud{height:56px;flex:0 0 56px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:44px;height:44px;border-radius:12px;background:#E8975A;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
#hint-lamps{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#hint-lamps i{width:13px;height:13px;border-radius:50%;background:#F2C94C;box-shadow:inset 0 -2.5px 0 #D8862B;transition:all .3s ease}
#hint-lamps i.off{background:#E5D5BC;box-shadow:none;transform:scale(.82)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 棋盘 ---------- */
#stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;min-height:120px}
#board{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,4),var(--cell,72px));
  background:#EFE3CD;border:3px solid #4A3B2E;border-radius:18px;padding:8px;
  box-shadow:0 6px 0 #D8C9B4}
.cell{width:var(--cell,72px);height:var(--cell,72px);border-radius:20%;
  background:#FFF9EE;border:2.5px solid #D8C9B4;position:relative;
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.cell:active{transform:scale(.94)}
.cell svg.an{width:76%;height:76%}
/* 宫边界：加厚暖棕分隔+外扩间隙（4×4：第 3 列/行起；6×6：第 4 列、第 3/5 行起） */
.cell.bl{border-left:5px solid #4A3B2E;margin-left:4px}
.cell.bt{border-top:5px solid #4A3B2E;margin-top:4px}
/* 宫分组：宫底色深浅棋盘交替（儿童数独双通道表达，色弱亦可辨） */
.cell.bx1{background:#F0E5C9}
/* 给定格（题目自带）：更深底 + 微暗描边，提示不可改 */
.cell.given{background:#EBDDBE;border-color:#C9B896}
/* 空格：极淡爪印占位（零文字依赖） */
.cell .ph{width:46%;height:46%;opacity:.16}
/* 选中格：暖橙粗框 + 光环 */
.cell.sel{border-color:#E8975A;border-width:3px;background:#FFFDF6;
  box-shadow:0 0 0 5px rgba(232,151,90,.38)}
/* 玩家填对（无冲突）格：白底即可，右上角小绿点冗余标识 */
.cell.byuser::after{content:"";position:absolute;top:7%;right:9%;width:11%;height:11%;
  border-radius:50%;background:#8FBF7F;opacity:.9}
/* 冲突：中饱和暖红框 + 轻晃 1s（可改零惩罚，颜色+动效双通道） */
.cell.conflict{border-color:#D96A5A;border-width:3px;background:#FBEBE5;
  animation:cell-shake .5s ease 2}
@keyframes cell-shake{0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}40%{transform:translateX(5px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
/* 点了给定格：轻摆（不可改的表达） */
.cell.fixedwig{animation:fixed-wig .4s ease}
.abtn.wig{animation:fixed-wig .4s ease}
@keyframes fixed-wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}
/* 提示/教学高亮：脉冲光环 */
.cell.pulse{animation:cell-pulse 1.1s ease 2}
@keyframes cell-pulse{0%,100%{box-shadow:none}
  50%{box-shadow:0 0 0 7px rgba(242,201,76,.65)}}

/* ---------- 动物大按钮面板 ---------- */
#animals{flex:0 0 auto;display:flex;gap:16px;align-items:center;justify-content:center;padding:10px 16px}
.abtn{width:var(--abtn,72px);height:var(--abtn,72px);border-radius:26%;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.abtn:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
.abtn svg{width:74%;height:74%;pointer-events:none}
.abtn.pulse{animation:abtn-pulse 1.1s ease 2}
@keyframes abtn-pulse{0%,100%{box-shadow:0 4px 0 #D8C9B4}
  50%{box-shadow:0 4px 0 #D8C9B4,0 0 0 8px rgba(242,201,76,.6)}}

/* ---------- 底栏：小兔子（鼓励）+ 再来一次 + 帮帮我 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 18px 14px;gap:12px}
#btn-rabbit{width:96px;height:96px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:78px;height:78px}
#btn-rabbit.hop{animation:hop .45s ease 2}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hint{width:84px;height:84px;border-radius:26px;background:#E8975A;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C77A42;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hint:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
#btn-hint svg{width:48px;height:48px}
#btn-hint.spent{background:#EFE3CD;box-shadow:0 4px 0 #D8C9B4;opacity:.85}

/* ---------- 幽灵手指教学 ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:40vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 宽屏（≥820px）：棋盘限宽居中 */
@media (min-width:820px){
  #board{max-width:none}
}
</style>
</head>
