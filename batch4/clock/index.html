<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>时间小管家</title>
<style>
/* ================= 时间小管家 clock（batch4）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、灰蓝错误色（不用大红）
   触摸目标：答案按钮 ≥96×96、钟面 ≥200px 且章 3 拖拨区即钟面；间距 ≥16；pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：钟面区 + 题面 + 答案 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 10px}
#clock-zone{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.clock-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
.clock-card svg.clock{width:var(--clk,300px);height:var(--clk,300px)}
.clock-card.small svg.clock{width:var(--clk4,260px);height:var(--clk4,260px)}
.clock-cap{font-size:17px;font-weight:700;color:#8A7B6C;letter-spacing:.08em}
/* 章 3 可拖拨钟：暖橙虚线外环提示可动 + 轻微呼吸（无频闪，1.4s 慢频） */
.clock-card.drag .dialring{opacity:1}
.clock-card .dialring{opacity:0;transition:opacity .3s;animation:breathe 1.4s ease infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.clock-card.drag{cursor:grab}
.clock-card.drag:active{cursor:grabbing}
.clock-card.ok .dialring{stroke:#8FBF7F;animation:none;opacity:1}
.clock-card.ok svg.clock{animation:clk-pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes clk-pop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.clock-card.wob .hands{animation:wob .55s ease}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}
  75%{transform:rotate(-2.5deg)}}
.hands{transform-origin:100px 100px}
.clock-card.pulse svg.clock{animation:clk-pulse 1s ease 2}
@keyframes clk-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px rgba(232,151,90,.9))}}

/* ---------- 题面行：章 3 数字时间大卡 / 章 4 问句；拨针读数 ---------- */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  min-height:76px;padding:0 8px}
#prompt-chip{display:none;align-items:center;gap:14px;padding:8px 26px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4}
#prompt-chip.show{display:flex}
#prompt-chip .big{font-size:52px;font-weight:800;color:#4A3B2E;font-variant-numeric:tabular-nums;line-height:1.1}
#prompt-chip svg{width:46px;height:46px}
#prompt-chip.elapsed .big{font-size:38px}
#prompt-chip.elapsed svg{width:76px;height:40px}
#dial-readout{display:none;min-width:150px;min-height:60px;padding:6px 24px;border-radius:18px;
  background:#EFE3CD;border:2.5px dashed #C9BDA8;color:#4A3B2E;font-size:34px;font-weight:800;
  align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
#dial-readout.show{display:flex}
#dial-readout.ok{background:#8FBF7F;border:2.5px solid #6FA063;color:#4A3B2E}

/* ---------- 答案大按钮（主触摸目标 ≥96） ---------- */
#answers{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:2px 12px;min-height:96px}
.opt{min-width:132px;min-height:96px;padding:0 26px;border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;font-size:44px;font-weight:800;color:#4A3B2E;
  font-variant-numeric:tabular-nums;transition:transform .15s,box-shadow .15s;position:relative}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.opt.right{background:#8FBF7F;color:#4A3B2E;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.opt.right .mark{position:absolute;top:-13px;right:-13px;width:40px;height:40px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.opt.right .mark svg{width:26px;height:26px}
@keyframes opt-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.opt.wrong{background:#EFE3CD;color:#B7AA96;border-color:#C9BDA8;box-shadow:0 3px 0 #C9BDA8;
  opacity:.55;pointer-events:none}
.opt.wrong{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.opt.pulse{animation:opt-pulse 1s ease 2}
@keyframes opt-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:46px;height:46px}
#btn-hear .lab{position:absolute;bottom:-4px;font-size:12px;font-weight:700;color:#8A7B6C}
#btn-hear{position:relative}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch3） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：钟面与按钮适配 */
@media (orientation:portrait){
  .opt{min-width:150px;min-height:104px;font-size:50px}
  #prompt-chip .big{font-size:46px}
}
</style>
</head>
<body>
<div id="game" aria-label="时间小管家">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="clock-zone" aria-label="钟面"></div>
    <div id="prompt">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
      <div id="dial-readout" aria-label="当前拨出的时间"></div>
    </div>
    <div id="answers" aria-label="答案选项"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

  const H = ri(rnd, 0, 11);                    // 小时 0..11（显示 1..12）
  if (dch === 1) {                             // 认整点/半点：前期整点为主，后期混合
    const minute = lv < 2 ? (qi < 3 ? 0 : 30) : (rnd() < 0.5 ? 0 : 30);
    const target = H * 60 + minute;
    if (used.indexOf(target) >= 0) return null;
    used.push(target);
    const hourNbr = (H + (rnd() < 0.5 ? 1 : 11)) % 12 * 60 + minute;  // 时针近邻：相邻小时同时刻
    const halfConf = H * 60 + (minute === 0 ? 30 : 0);                // 半点混淆：同小时另半刻
    const items = shuffled([fmtClock(target), fmtClock(hourNbr), fmtClock(halfConf)], rnd);
    return { type: 'read', clockMin: target, items: items, answer: items.indexOf(fmtClock(target)),
      rules: ['hourNbr', 'halfConf'] };
  }
  if (dch === 2) {                             // 认五分钟刻度：分针任意 ×5（5..55），必有镜像干扰
    const minute = ri(rnd, 1, 11) * 5;
    const target = H * 60 + minute;
    if (used.indexOf(target) >= 0) return null;
    used.push(target);
    const mirror = mirrorOf(target);                                 // 镜像读针（必含）
    const d2m = minute === 5 ? 10 : minute === 55 ? 50 : minute + (rnd() < 0.5 ? -5 : 5);
    const step5 = H * 60 + d2m;                                      // 相邻 5 分钟刻度
    const items = shuffled([fmtClock(target), fmtClock(mirror), fmtClock(step5)], rnd);
    return { type: 'read', clockMin: target, items: items, answer: items.indexOf(fmtClock(target)),
      rules: ['mirror', 'step5'] };
  }
  if (dch === 3) {                             // 拨分针：目标任意 ×5（含 :00），拖拨判定
    const minute = ri(rnd, 0, 11) * 5;
    const target = H * 60 + minute;
    if (used.indexOf(target) >= 0) return null;
    used.push(target);
    return { type: 'dial', clockMin: target, items: [fmtClock(target)], answer: 0 };
  }
  /* dch === 4 经过时间：跨整点优先（如 2:40→3:05 过 25 分钟） */
  const DURS = [15, 20, 25, 30, 35, 40, 45, 50];
  const dur = DURS[ri(rnd, 0, DURS.length - 1)];
  const startMin = rnd() < 0.6
    ? ri(rnd, (60 - dur) / 5, 11) * 5          // 跨整点：startMin + dur ≥ 60
    : ri(rnd, 0, (55 - dur) / 5) * 5;          // 不跨：同一小时内
  const target = H * 60 + startMin;
  if (used.indexOf(target) >= 0) return null;
  used.push(target);
  let d1 = dur + (qi % 2 === 0 ? 5 : -5);      // ±5 分钟干扰（逐题交替方向）
  if (d1 < 5 || d1 > 55) d1 = dur + (qi % 2 === 0 ? -5 : 5);
  let d2 = 60 - dur;                           // 整点混淆：差多少到下一个整点
  if (d2 === dur || d2 === d1 || d2 < 5 || d2 > 55) d2 = dur + (d1 === dur + 5 ? -5 : 5);
  const lab = v => v + '分钟';
  const items = shuffled([lab(dur), lab(d1), lab(d2)], rnd);
  return { type: 'elapsed', clockMin: target, endMin: (target + dur) % 720, dur: dur,
    items: items, answer: items.indexOf(lab(dur)), rules: ['pm5', 'hourConf'] };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const used = [];
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) {
    let q = null;
    for (let t = 0; t < 40 && !q; t++) q = genOne(dch, lv, qi, rnd, used);  // 撞目标重试兜底
    if (q) quizzes.push(q);
  }
  return { flat, ch, dch, lv, quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 答题引擎（无 DOM）：i = 答案按钮下标（read/elapsed 题）
   'right' 答对推进 / 'done' 最后一题答对通关 / 'wrong' 首次点错（该按钮灰掉、计重试）
   'again' 点已灰按钮 / null 非点选题或关卡已结束 ---------- */
function engPick(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (q.type === 'dial') return null;
  q.wrong = q.wrong || [];
  if (i === q.answer) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  if (q.wrong.indexOf(i) >= 0) return 'again';
  q.wrong.push(i);
  L.retries++;
  return 'wrong';
}
/* ---------- 拨针判定（章 3）：mins=拨到的分钟数（0..59），吸附最近 5 分钟刻度后与目标比对
   'right'/'done' 吸附到位 / 'wrong' 松手不在目标刻度（计重试，零惩罚）/ 'bad' 非法输入 ---------- */
function engDial(L, mins) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (q.type !== 'dial') return null;
  if (typeof mins !== 'number' || !isFinite(mins)) return 'bad';
  const snap = ((Math.round(mins / 5) % 12) + 12) % 12 * 5;   // 吸附最近 5 分钟刻度（0..55）
  if (snap === q.clockMin % 60) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级：一关全对（retries=0）=3 星；总重试 ≤2=2 星；否则 1 星。永不 0 星 */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：answer 在 items 中且唯一、选项无重复 ---------- */
function structOk(q) {
  if (!q || !q.items || !q.items.length) return false;
  if (q.answer < 0 || q.answer >= q.items.length) return false;
  const t = q.items[q.answer];
  let cnt = 0;
  q.items.forEach(it => { if (it === t) cnt++; });
  if (cnt !== 1) return false;
  for (let i = 0; i < q.items.length; i++) {
    for (let j = i + 1; j < q.items.length; j++) if (q.items[i] === q.items[j]) return false;
  }
  return true;
}
/* ================= clock 主逻辑（钟面渲染 / 章 3 拖拨分针 / 教学 / 推进）
   章 1-2 认时间：钟面大图 + 3 个数字时间大按钮；章 3 拨针：数字时间卡 + 拖分针（5 分钟吸附，时针联动）
   章 4 经过时间：两钟面 + 时长 3 选 1；答错晃动+灰掉（零惩罚）
   验收钩子：window.CLK = { get currentLevel, get quiz(), pick(i), setDial(mins), autoSolve() } */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援语音不受 flat 门限制（7 岁半玩家评估 P1：flat≥3 静置 20s 零救援——常规提示保持 sayP 防语音过频回潮） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };

const zoneEl = $id('clock-zone'), answersEl = $id('answers'), chipEl = $id('prompt-chip'),
      readoutEl = $id('dial-readout'), ghostEl = $id('ghost'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none' };
let lastAct = Date.now();
let helpRedemo = false;
let ghostReason = null;                         // 'tut' | 'scaffold'
let helpTimer = null;
let dragSt = null;                              // 章 3 拖拨状态 {id, card, mins}

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const optEl = i => answersEl.querySelector('.opt[data-i="' + i + '"]');
const clockCardEl = () => zoneEl.querySelector('.clock-card');

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 72);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}

/* ================= 钟面 SVG（内嵌，时针短粗/分针长细，12 短刻度+4 长刻度） ================= */
function clockSvg(clockMin, o) {
  o = o || {};
  let ticks = '';
  for (let i = 0; i < 12; i++) {                // 4 长刻度（12/3/6/9）+ 8 短刻度
    const a = i * 30 * Math.PI / 180, long = i % 3 === 0;
    const r1 = long ? 66 : 73, sin = Math.sin(a), cos = Math.cos(a);
    ticks += '<line x1="' + (100 + sin * r1).toFixed(1) + '" y1="' + (100 - cos * r1).toFixed(1) +
      '" x2="' + (100 + sin * 82).toFixed(1) + '" y2="' + (100 - cos * 82).toFixed(1) +
      '" stroke="' + INK + '" stroke-width="' + (long ? 4 : 2.5) + '" stroke-linecap="round"' +
      (long ? '' : ' opacity=".55"') + '/>';
  }
  let nums = '';
  for (let n = 1; n <= 12; n++) {               // 章 1-2 显示 / 章 3-4 淡显
    const a = n * 30 * Math.PI / 180;
    nums += '<text x="' + (100 + Math.sin(a) * 54).toFixed(1) + '" y="' + (100 - Math.cos(a) * 54 + 6).toFixed(1) +
      '" font-size="16" font-weight="700" text-anchor="middle" fill="' + INK + '"' +
      (o.dim ? ' opacity=".55"' : '') + '>' + n + '</text>';
  }
  const ring = o.drag ? '<circle class="dialring" cx="100" cy="100" r="97" fill="none" stroke="#E8975A" ' +
    'stroke-width="4" stroke-dasharray="6 10" stroke-linecap="round"/>' : '';
  return '<svg class="clock" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">' +
    ring + '<circle cx="100" cy="100" r="90" fill="#FFF9EE" stroke="' + INK + '" stroke-width="5"/>' +
    ticks + nums +
    '<g class="hands">' +
    '<line class="clk-h" x1="100" y1="114" x2="100" y2="52" stroke="' + INK + '" stroke-width="9" stroke-linecap="round" transform="rotate(' + angleHour(clockMin).toFixed(2) + ' 100 100)"/>' +
    '<line class="clk-m" x1="100" y1="120" x2="100" y2="28" stroke="#C77A42" stroke-width="6" stroke-linecap="round" transform="rotate(' + angleMin(clockMin).toFixed(2) + ' 100 100)"/>' +
    '</g><circle cx="100" cy="100" r="7" fill="' + INK + '"/><circle cx="100" cy="100" r="2.8" fill="#FFF9EE"/></svg>';
}
const clockCard = (m, o, cap) => '<div class="clock-card' + (o.drag ? ' drag' : '') + (o.small ? ' small' : '') + '">' +
  clockSvg(m, o) + (cap ? '<div class="clock-cap">' + cap + '</div>' : '') + '</div>';
/* 直驱指针角度（拖拨实时/判定吸附共用；设置 attribute 不走 CSS 过渡，几何可同步断言） */
function setHands(card, clockMin) {
  if (!card) return;
  const h = card.querySelector('.clk-h'), m = card.querySelector('.clk-m');
  if (h) h.setAttribute('transform', 'rotate(' + angleHour(clockMin).toFixed(2) + ' 100 100)');
  if (m) m.setAttribute('transform', 'rotate(' + angleMin(clockMin).toFixed(2) + ' 100 100)');
}

/* ================= 渲染 ================= */
function optBtn(t, i) {
  const b = document.createElement('button');
  b.className = 'opt';
  b.dataset.i = i;
  b.textContent = t;
  b.setAttribute('aria-label', '选 ' + t);
  return b;
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  answersEl.innerHTML = '';
  chipEl.className = '';
  chipEl.innerHTML = '';
  readoutEl.className = '';
  readoutEl.textContent = '';
  if (q.type === 'elapsed') {                   // 章 4：两个钟面 + 时长 3 选 1
    zoneEl.innerHTML = clockCard(q.clockMin, { dim: true, small: true }, '开始') +
      clockCard(q.endMin, { dim: true, small: true }, '结束');
    chipEl.className = 'show elapsed';
    chipEl.innerHTML = ICONS.elapsed + '<span class="big">过了多久？</span>';
    q.items.forEach((t, i) => answersEl.appendChild(optBtn(t, i)));
  } else if (q.type === 'dial') {               // 章 3：目标数字时间 + 可拖拨钟面
    const base = Math.floor(q.clockMin / 60) * 60;   // 初始长针归 12，时针在本小时
    zoneEl.innerHTML = clockCard(base, { dim: true, drag: true });
    chipEl.className = 'show';
    chipEl.innerHTML = ICONS.dial + '<span class="big">' + fmtClock(q.clockMin) + '</span>';
    readoutEl.className = 'show';
    readoutEl.textContent = fmtClock(base);
  } else {                                      // 章 1-2：钟面 + 数字时间 3 选 1
    zoneEl.innerHTML = clockCard(q.clockMin, { dim: cur.dch >= 3 });
    q.items.forEach((t, i) => answersEl.appendChild(optBtn(t, i)));
  }
  renderStep();
  layoutStage();
}
function renderStep() {                         // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 尺寸（双 viewport 均保钟面 ≥200、答案按钮 ≥96×96） ================= */
function layoutStage() {
  if (!cur) return;
  const st = $id('stage').getBoundingClientRect();
  const root = document.documentElement.style;
  const q = cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)] || { type: 'read' };
  if (q.type === 'elapsed') {
    const c4 = Math.max(200, Math.min(Math.floor(st.width * 0.42), Math.floor(st.height - 215), 270));
    root.setProperty('--clk4', c4 + 'px');
  } else {
    const c = Math.max(200, Math.min(Math.floor(st.width * 0.55), Math.floor(st.height - 205), 330));
    root.setProperty('--clk', c + 'px');
  }
}
window.addEventListener('resize', () => { if (cur) layoutStage(); });

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show(reason) { ghostReason = reason; ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostReason = null; ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el, reason) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show(reason);
  if (el.classList.contains('opt') || el.classList.contains('clock-card')) {
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  }
  setTimeout(() => ghost.press(), 800);
}

/* ================= 答题主路径（真实点击 / CLK.pick / autoSolve 共用；read/elapsed 题） ================= */
async function uiPick(i, demo) {
  if (!cur || state.locked || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q.type === 'dial') return false;
  const r = engPick(cur, i);
  if (r === null || r === 'again') return r;
  lastAct = Date.now();
  const el = optEl(i);
  if (r === 'right' || r === 'done') {
    if (state.tut === 'help') {                 // 教学"独"：首次答对 → 强化反馈放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    state.locked = true;
    if (el) {
      el.classList.add('right');
      const m = document.createElement('span');
      m.className = 'mark';
      m.innerHTML = ICONS.check;
      el.appendChild(m);
    }
    sfx('coin');
    await wait(880 * SPEED);
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
  } else {                                      // 答错：晃动+灰掉（零惩罚，可重点其它）；首错只轻提示，连错 2 次才高亮正确项（给再想一次的机会）
    q._miss = (q._miss || 0) + 1;
    if (el) el.classList.add('wrong');
    const ok = optEl(q.answer);
    if (ok && q._miss >= 2) { ok.classList.remove('pulse'); void ok.offsetWidth; ok.classList.add('pulse'); }
    sfx('fail');
    sayP(VOICE.hint.key, VOICE.hint.text);
    await wait(520 * SPEED);
  }
  return r;
}

/* ================= 拨针主路径（章 3：拖拨松手 / CLK.setDial / autoSolve 共用） ================= */
async function uiDial(mins) {
  if (!cur || state.locked || state.won || state.demo) return 'locked';
  const q = cur.quizzes[cur.step];
  if (!q || q.type !== 'dial') return 'not-dial';
  const r = engDial(cur, mins);
  if (r === null || r === 'bad') return r;
  lastAct = Date.now();
  const card = clockCardEl();
  if (r === 'right' || r === 'done') {
    if (state.tut === 'help') {
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    state.locked = true;
    setHands(card, q.clockMin);                 // 吸附归位到正确时间（时针含分针联动分量）
    if (card) card.classList.add('ok');
    readoutEl.textContent = fmtClock(q.clockMin);
    readoutEl.classList.add('ok');
    sfx('coin');
    await wait(880 * SPEED);
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
  } else {                                      // 松手不在目标刻度：指针轻微摆动重试（零惩罚）
    if (card) { card.classList.remove('wob'); void card.offsetWidth; card.classList.add('wob'); }
    sfx('fail');
    sayP(VOICE.hint.key, VOICE.hint.text);
    await wait(300 * SPEED);
  }
  return r;
}

/* ================= 章 3 拖拨：pointer capture + 角度吸附最近 5 分钟刻度 ================= */
function applyDrag(e) {
  const svg = dragSt.card.querySelector('svg.clock');
  if (!svg) return;
  const r = svg.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = e.clientX - cx, dy = e.clientY - cy;
  let ang = Math.atan2(dx, -dy) * 180 / Math.PI;   // 12 点方向为 0，顺时针为正
  if (ang < 0) ang += 360;
  const snap = Math.round(ang / 30) * 5 % 60;      // 吸附最近 5 分钟刻度（30 度=5 分钟）
  dragSt.mins = snap;
  const q = cur.quizzes[cur.step];
  setHands(dragSt.card, Math.floor(q.clockMin / 60) * 60 + snap);  // 时针联动：h + min/60
  readoutEl.textContent = fmtClock(Math.floor(q.clockMin / 60) * 60 + snap);
}
zoneEl.addEventListener('pointerdown', e => {
  if (!cur || state.locked || state.won || state.demo) return;
  const q = cur.quizzes[cur.step];
  if (!q || q.type !== 'dial') return;
  const card = e.target.closest('.clock-card.drag');
  if (!card) return;
  e.preventDefault();
  try { card.setPointerCapture(e.pointerId); } catch (err) {}
  dragSt = { id: e.pointerId, card: card, mins: null };
  lastAct = Date.now();
  applyDrag(e);
});
zoneEl.addEventListener('pointermove', e => {
  if (!dragSt || e.pointerId !== dragSt.id) return;
  e.preventDefault();
  applyDrag(e);
});
zoneEl.addEventListener('pointerup', e => {
  if (!dragSt || e.pointerId !== dragSt.id) return;
  const mins = dragSt.mins;
  dragSt = null;
  if (mins == null) return;
  uiDial(mins);                                 // 松手判定
});
zoneEl.addEventListener('pointercancel', e => {
  if (dragSt && e.pointerId === dragSt.id) dragSt = null;
});

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  /* 反方审查 M1：GEN 文案指"明天"的难度章=下一章（dch=(ch)%4+1），原 ci%4 指向刚打完的章 */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  clearTimeout(helpTimer);
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);               // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  clearTimeout(helpTimer);
  ghost.hide();
  dragSt = null;
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none' };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  if (VERIFY) return;
  const sv = KIDS._save();
  const freshTut = flat === 0 && !sv.levels['1-0'] && !(sv.clock && sv.clock.tutSeen);
  if (freshTut) { tutorialWatch(); return; }
  const freshDial = flat === 10 && cur.dch === 3 && !sv.levels['3-0'] && !(sv.clock && sv.clock.dialSeen);
  if (freshDial) { dialDemo(); return; }        // 章 3 首进：看阶段演示拖针动画一次
  sayP(VOICE.hint.key, VOICE.hint.text);
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独 ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayP(VOICE.watch.key, VOICE.watch.text);
  await wait(700 * SPEED);
  const q = cur.quizzes[0];
  const el = optEl(q.answer);
  pointGhostAt(el, 'tut');
  await wait(1500 * SPEED);
  ghost.press();
  await wait(400 * SPEED);
  el.classList.remove('pulse');
  state.demo = false;                           // 临时解锁走真实路径演示一次完整答对演出
  state.locked = false;
  await uiPick(q.answer, true);
  const sv = KIDS._save();
  sv.clock = sv.clock || {};
  sv.clock.tutSeen = true;
  KIDS.store.persist();
  sayP(VOICE.turn.key, VOICE.turn.text);
  await wait(500 * SPEED);
  ghost.hide();
  cur = genLevel(0);                            // 确定性关卡：同一关重来（题面一致）
  state = { locked: false, won: false, demo: false, tut: 'help' };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  setTimeout(() => { if (state.tut === 'help') pointGhostAt(optEl(cur.quizzes[0].answer), 'tut'); }, 600);
}
/* 章 3 教学看阶段：长针从 12 点扫到目标刻度（逐 5 分钟步进） */
async function dialDemo() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayP(VOICE.watch.key, VOICE.watch.text);
  await wait(600 * SPEED);
  const q = cur.quizzes[0];
  const card = clockCardEl();
  pointGhostAt(card, 'tut');
  await wait(1000 * SPEED);
  const target = q.clockMin % 60;
  sfx('pop');
  /* 反方审查 m6：目标=整点(0 分)时原循环零次（演示空转）——拨满一圈回到 12 点 */
  const end = target === 0 ? 60 : target;
  for (let m = 5; m <= end; m += 5) {           // 演示拖针动画（真实吸附节奏）
    await wait(120 * SPEED);
    setHands(card, Math.floor(q.clockMin / 60) * 60 + (m % 60));
    readoutEl.textContent = fmtClock(Math.floor(q.clockMin / 60) * 60 + (m % 60));
    sfx('pop');
  }
  await wait(500 * SPEED);
  const sv = KIDS._save();
  sv.clock = sv.clock || {};
  sv.clock.dialSeen = true;
  KIDS.store.persist();
  sayP(VOICE.turn.key, VOICE.turn.text);
  await wait(400 * SPEED);
  ghost.hide();
  cur = genLevel(cur.flat);                     // 同关重来（确定性一致），进入"帮"
  state = { locked: false, won: false, demo: false, tut: 'help' };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  setTimeout(() => { if (state.tut === 'help') pointGhostAt(clockCardEl(), 'tut'); }, 600);
}

/* ================= 底栏交互 ================= */
function hopRabbit() {
  rabbitBtn.classList.remove('hop'); void rabbitBtn.offsetWidth; rabbitBtn.classList.add('hop');
}
rabbitBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur) return;
  lastAct = Date.now();
  hopRabbit();
  sayP(VOICE.hint.key, VOICE.hint.text);
});
replayBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur) return;
  lastAct = Date.now();
  startLevel(cur.flat);
});
hearBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur || state.locked) return;
  lastAct = Date.now();
  hearBtn.classList.remove('bounce'); void hearBtn.offsetWidth; hearBtn.classList.add('bounce');
  sayP(VOICE.hint.key, VOICE.hint.text);
});
answersEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.opt');
  if (!el) return;
  e.preventDefault();
  uiPick(Number(el.dataset.i));
});

/* ================= 无操作看护：20s 轻声提示目标 / 教学"帮"5s 重演示一次 ================= */
setInterval(() => {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  const idle = Date.now() - lastAct;
  if (idle > 20000) {
    sayR(VOICE.hint.key, VOICE.hint.text);      // 救援语音不受 flat 门（评估 P1）
    lastAct = Date.now();
    return;
  }
  if (idle > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {
    helpRedemo = true;
    const q = cur.quizzes[cur.step];
    if (!q) return;
    pointGhostAt(q.type === 'dial' ? clockCardEl() : optEl(q.answer), 'tut');
  }
}, 1000);

/* ================= 启动（verify 分支由 game-verify.js 接管） ================= */
buildStatic();
if (!VERIFY) {
  KIDS.init({ game: 'clock', title: '时间小管家' });
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  let first = 0;
  for (let i = 0; i < lim; i++) { if (!sv.levels[keys[i]]) { first = i; break; } }
  if (lim > 0 && KIDS.calendar.dayDone(keys)) { // 今日新关已玩完：收尾画面（可关闭继续重玩）
    KIDS.ui.dayEnd({ nextHint: nextHint(lim) });   /* 明日首解锁关=今日上限（M1：原硬编码 0 恒指章 1） */
    first = 0;
  }
  startLevel(first);
}

/* ================= 验收钩子（getter 模式，返回拷贝非活引用） ================= */
window.CLK = {
  get currentLevel() {
    return cur ? { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.quizzes.length,
      step: cur.step, retries: cur.retries, done: cur.done, won: state.won } : null;
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    const out = { type: q.type, clockMin: q.clockMin, items: q.items.slice(), answer: q.answer, step: cur.step };
    if (q.type === 'elapsed') { out.endMin = q.endMin; out.dur = q.dur; }
    if (q.type === 'dial') out.targetMin = q.clockMin % 60;
    return out;
  },
  pick(i) { return uiPick(i); },
  setDial(mins) { return uiDial(mins); },       // 章 3 直驱拨针判定（verify/测试用）
  async autoSolve() {                           // UI 路径自动答完当前关（走真实 pick/dial 流程）
    let n = 0;
    while (cur && !cur.done && n++ < 30) {
      const q = cur.quizzes[cur.step];
      if (!q) break;
      if (q.type === 'dial') await uiDial(q.clockMin % 60);
      else await uiPick(q.answer);
    }
    return { done: !!(cur && cur.done), picks: n };
  },
  get tutorial() { return state.tut; }
};
/* ================= ?verify=1 自检（仅 verify 分支加载执行）
   ① 静态 20 + 生成 20 关全量审计：确定性 / 钟面角度与 clockMin 一致（角度函数=渲染真值源）/
     answer 在 items 且唯一（structOk）/ 干扰项规则合规（章 1=时针近邻+半点混淆、章 2=镜像必含+相邻刻度、
     章 4=±5 分钟+整点混淆）/ 引擎直驱 autoSolve 通关（0 重试 3 星）
   ② setDial 判定单元：正/负例各 4（负例=错误刻度计重试不推进，正例=吸附归位推进）
   ③ UI 冒烟：autoSolve UI 路径通关 read(flat0)/dial(flat10)/elapsed(flat15) + DOM 针角一致性
   ④ 布局：钟面 ≥200px、答案按钮 ≥80px、overflowX ≤0；答案位置分布不恒首位
   结果写 #verify-result + document.title='VERIFY PASS n/n' */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;
  const idxDist = [0, 0, 0];
  const parseT = s => {                         // '3:05' → 185（独立解析，审计不抄生成器）
    const p = String(s).split(':');
    return ((parseInt(p[0], 10) % 12) * 60 + parseInt(p[1], 10)) % 720;
  };
  const hourNbrs = m => { const H = Math.floor(m / 60), mm = m % 60; return [((H + 1) % 12) * 60 + mm, ((H + 11) % 12) * 60 + mm]; };
  const halfConfOf = m => Math.floor(m / 60) * 60 + (m % 60 === 0 ? 30 : 0);

  /* ---- ① 40 关全量审计（flat 0-39） ---- */
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1.quizzes) === JSON.stringify(L2.quizzes);   // 确定性
    const n = L1.quizzes.length;
    let ruleOk = true, angOk = true, structAll = true;
    for (let k = 0; k < n; k++) {
      const q = L1.quizzes[k];
      if (!structOk(q)) structAll = false;
      /* 角度一致性：渲染真值源 angleHour/angleMin 与 clockMin 互推闭合（12 小时制往返无漂移） */
      const h = angleHour(q.clockMin), m = Math.round(h / 360 * 720);
      if (m !== q.clockMin || angleMin(q.clockMin) !== (q.clockMin % 60) * 6) angOk = false;
      if (q.type === 'read') {
        if (q.items[q.answer] !== fmtClock(q.clockMin)) ruleOk = false;      // 答案即钟面时间
        const others = q.items.filter((v, i2) => i2 !== q.answer).map(parseT);
        if (L1.dch === 1) {
          if (q.clockMin % 30 !== 0) ruleOk = false;                         // 整点/半点
          const hn = hourNbrs(q.clockMin), hc = halfConfOf(q.clockMin);
          if (!((others[0] === hc || others[1] === hc) &&
                (hn.indexOf(others[0]) >= 0 || hn.indexOf(others[1]) >= 0))) ruleOk = false;
        } else {
          if (q.clockMin % 5 !== 0 || q.clockMin % 60 === 0) ruleOk = false; // 任意 ×5 分钟（非整点）
          const mir = mirrorOf(q.clockMin);
          if (others.indexOf(mir) < 0) ruleOk = false;                       // 镜像干扰必含
          const other = others[0] === mir ? others[1] : others[0];
          if (Math.abs(other - q.clockMin) !== 5) ruleOk = false;            // 另一干扰=相邻刻度
        }
        idxDist[q.answer]++;
      } else if (q.type === 'dial') {
        if (q.items.length !== 1 || q.answer !== 0 || q.items[0] !== fmtClock(q.clockMin) || q.clockMin % 5 !== 0) ruleOk = false;
      } else {                                                               // elapsed
        if ((q.clockMin + q.dur) % 720 !== q.endMin) ruleOk = false;
        if (q.items[q.answer] !== q.dur + '分钟' || q.dur < 5 || q.dur > 55 || q.dur % 5 !== 0) ruleOk = false;
        const ds = q.items.filter((v, i2) => i2 !== q.answer).map(s => parseInt(s, 10));
        const pm5 = d => Math.abs(d - q.dur) === 5, hourConf = d => d + q.dur === 60;
        if (!((pm5(ds[0]) && hourConf(ds[1])) || (pm5(ds[1]) && hourConf(ds[0])) ||
              (pm5(ds[0]) && pm5(ds[1])))) ruleOk = false;                    // dur=30 退化：双 ±5
        idxDist[q.answer]++;
      }
    }
    let guard = 0;                                                            // 引擎直驱全对通关
    while (!L1.done && guard++ < 12) {
      const q = L1.quizzes[L1.step];
      if (q.type === 'dial') engDial(L1, q.clockMin % 60);
      else engPick(L1, q.answer);
    }
    const solvedAll = L1.done && L1.step === CH_LEN && L1.retries === 0 && engStars(L1) === 3;
    const ok = det && n === CH_LEN && ruleOk && angOk && structAll && solvedAll;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, ruleOk: ruleOk, angOk: angOk,
      structAll: structAll, solvedAll: solvedAll, types: L1.quizzes.map(q => q.type) };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② setDial 判定单元：负例 4（错误刻度=计重试不推进）+ 正例 4（目标刻度=吸附推进） ---- */
  total++;
  const dialNeg = [], dialPos = [];
  for (let i = 0; i < 4; i++) {
    startLevel(10 + i);                       // 章 3 dial 关（10-13 均为 dch3）
    const t = cur.quizzes[0].clockMin % 60;
    let w = (t + 5 * (i + 1)) % 60;
    if (w === t) w = (t + 10) % 60;
    const rw = await CLK.setDial(w);
    dialNeg.push({ t: t, w: w, r: rw, step: cur.step, retries: cur.retries });
    const rr = await CLK.setDial(t);
    dialPos.push({ t: t, r: rr, step: cur.step, retries: cur.retries });
  }
  const dialOk = dialNeg.every(d => d.r === 'wrong' && d.step === 0 && d.retries === 1) &&
    dialPos.every(d => (d.r === 'right' || d.r === 'done') && d.step === 1 && d.retries === 1);
  if (dialOk) npass++;
  units.setDial = { ok: dialOk, neg: dialNeg, pos: dialPos };

  /* ---- ③ UI 冒烟：autoSolve UI 路径通关 read/dial/elapsed 三形态 ---- */
  for (const f of [0, 10, 15]) {
    total++;
    startLevel(f);
    const a = await CLK.autoSolve();
    const lv = CLK.currentLevel;
    const ok = a.done && lv.done && lv.won && lv.retries === 0 && engStars(cur) === 3;
    if (ok) npass++;
    smokes['autoSolve' + f] = { done: a.done, picks: a.picks, won: lv.won, retries: lv.retries, type: cur.quizzes[0].type, ok: ok };
  }

  /* ---- ③ DOM 针角一致性：渲染出的指针 transform 与 clockMin 角度逐一相符 ---- */
  total++;
  const angDom = [];
  const rotOf = el => {
    const m = /rotate\((-?[\d.]+)/.exec(el.getAttribute('transform') || '');
    return m ? Math.round(parseFloat(m[1]) * 10) / 10 : null;
  };
  const chk = () => {
    const card = zoneEl.querySelectorAll('.clock-card')[0];
    const q = cur.quizzes[cur.step];
    if (!card || !q) return false;
    let ok = rotOf(card.querySelector('.clk-h')) === Math.round(angleHour(q.clockMin) * 10) / 10 &&
             rotOf(card.querySelector('.clk-m')) === Math.round(angleMin(q.clockMin) * 10) / 10;
    angDom.push({ type: q.type, clockMin: q.clockMin, ok: ok });
    return ok;
  };
  startLevel(0);                               // read：钟面=目标时间
  let domA = chk();
  startLevel(15);                              // elapsed：两钟面（起/止）均需一致
  const cards = zoneEl.querySelectorAll('.clock-card');
  const q4 = cur.quizzes[0];
  const rot4h = rotOf(cards[1].querySelector('.clk-h')), rot4m = rotOf(cards[1].querySelector('.clk-m'));
  let domB = rot4h === Math.round(angleHour(q4.endMin) * 10) / 10 && rot4m === Math.round(angleMin(q4.endMin) * 10) / 10;
  angDom.push({ type: 'elapsed-end', clockMin: q4.endMin, ok: domB });
  startLevel(10);                              // dial：setDial 到位后针角=完整目标时间（时针含联动分量）
  for (let k = 0; k < 4; k++) await CLK.setDial(cur.quizzes[cur.step].clockMin % 60);   // 推进到末题
  const t3 = cur.quizzes[4].clockMin;
  await CLK.setDial(t3 % 60);                  // 末题 → done → verify 不重渲，指针停在目标时间
  const card3 = clockCardEl();
  const rot3h = rotOf(card3.querySelector('.clk-h')), rot3m = rotOf(card3.querySelector('.clk-m'));
  let domC = rot3h === Math.round(angleHour(t3) * 10) / 10 && rot3m === Math.round(angleMin(t3) * 10) / 10;
  angDom.push({ type: 'dial-set', clockMin: t3, ok: domC });
  const domOk = domA && domB && domC && angDom.every(a => a.ok);
  if (domOk) npass++;
  units.anglesDom = { ok: domOk, checks: angDom };

  /* ---- ④ 布局：钟面 ≥200、答案按钮 ≥80×80、overflowX ≤0（read 与 elapsed 双钟面两种形态） ---- */
  total++;
  startLevel(0);
  const clk1 = clockCardEl().querySelector('svg.clock').getBoundingClientRect();
  const opts = answersEl.querySelectorAll('.opt');
  const rs = Array.prototype.map.call(opts, b => b.getBoundingClientRect());
  const de = document.documentElement;
  const layoutRead = { w: Math.round(clk1.width), h: Math.round(clk1.height),
    optW: Math.round(Math.min.apply(null, rs.map(r => r.width))), optH: Math.round(Math.min.apply(null, rs.map(r => r.height))),
    n: opts.length, overflowX: de.scrollWidth - window.innerWidth };
  startLevel(15);
  const cs = zoneEl.querySelectorAll('svg.clock');
  const rs2 = Array.prototype.map.call(cs, s => s.getBoundingClientRect());
  const layoutEl = { w: Math.round(Math.min.apply(null, rs2.map(r => r.width))),
    h: Math.round(Math.min.apply(null, rs2.map(r => r.height))), n: cs.length,
    optW: Math.round(Math.min.apply(null, Array.prototype.map.call(answersEl.querySelectorAll('.opt'), b => b.getBoundingClientRect().width)) )};
  /* 反方审查 m7：阈值对齐 SPEC 头部公约 ≥96px（原 80 偏松，CSS 回归到 80-95 区间会漏报） */
  const layoutOk = layoutRead.w >= 200 && layoutRead.h >= 200 && layoutRead.optW >= 96 && layoutRead.optH >= 96 &&
    layoutRead.n === 3 && layoutRead.overflowX <= 0 && layoutEl.w >= 200 && layoutEl.h >= 200 && layoutEl.n === 2;
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, layout: layoutRead, layoutElapsed: layoutEl };

  /* ---- 分布断言：answerIdx 三位置都出现、首位不恒定（<60%） ---- */
  total++;
  const distOk = idxDist[0] > 0 && idxDist[1] > 0 && idxDist[2] > 0 && idxDist[0] < 200 * 0.6;
  if (distOk) npass++;
  units.dist = { ok: distOk, idx0: idxDist[0], idx1: idxDist[1], idx2: idxDist[2], n: idxDist[0] + idxDist[1] + idxDist[2] };

  const out = { game: 'clock', total: total, pass: npass, layoutOk: layoutOk, dist: idxDist,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  runVerify();
}

</script>
