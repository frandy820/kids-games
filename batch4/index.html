<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子的游戏屋 · 一二年级</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FBF3E4;color:#4A3B2E;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:34px 22px}
  .logo{width:150px;height:150px}
  h1{font-size:clamp(26px,5vw,38px);letter-spacing:.05em}
  .ageband{display:inline-flex;align-items:center;gap:8px;background:#6E9BD8;color:#fff;font-size:16px;font-weight:700;
           padding:7px 18px;border-radius:999px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px;width:100%;max-width:760px}
  a.card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 24px;border-radius:26px;
         background:#FFF9EE;border:2.5px solid #4A3B2E;text-decoration:none;color:#4A3B2E;
         box-shadow:0 5px 0 #D8C9B4;transition:transform .2s}
  a.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
  @media (hover:hover){
    a.card:hover{transform:translateY(-4px);box-shadow:0 9px 0 #D8C9B4}
  }
  .card .icon{width:92px;height:92px}
  .card .name{font-size:22px;font-weight:700}
  .card .desc{font-size:14px;color:#8A7B6C;line-height:1.6;text-align:center}
  .foot{font-size:12.5px;color:#8A7B6C;text-align:center;line-height:1.8;max-width:520px}
</style>
</head>
<body>
  <div class="logo" id="logo"></div>
  <h1>小兔子的游戏屋 · 一二年级</h1>
  <div class="ageband">★ 7-8 岁 · 一二年级 ★</div>
  <div class="grid">
    <a class="card" href="clock/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="54" r="38" fill="#FFF9EE" stroke="#4A3B2E" stroke-width="3"/><path d="M50 20 v7 M50 81 v7 M16 54 h7 M77 54 h7" stroke="#4A3B2E" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="54" x2="50" y2="32" stroke="#4A3B2E" stroke-width="5" stroke-linecap="round"/><line x1="50" y1="54" x2="72" y2="62" stroke="#E8975A" stroke-width="3.4" stroke-linecap="round"/><circle cx="50" cy="54" r="4" fill="#4A3B2E"/><circle cx="84" cy="20" r="9" fill="#F5C445" stroke="#4A3B2E" stroke-width="2.5"/><path d="M84 15 v5 l3 3" stroke="#4A3B2E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="name">时间小管家</div>
      <div class="desc">认时钟 拨长针<br>算一算过了多久</div>
    </a>
    <a class="card" href="times/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="56" cy="58" rx="26" ry="17" fill="#6E9BD8" stroke="#4A3B2E" stroke-width="2.5"/><path d="M30 58 l-14 -11 v22 z" fill="#6E9BD8" stroke="#4A3B2E" stroke-width="2.5" stroke-linejoin="round"/><circle cx="64" cy="52" r="3.4" fill="#FFF9EE"/><path d="M50 41 q3 -9 12 -9" stroke="#4A3B2E" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="18" y="14" width="64" height="24" rx="9" fill="#FFF9EE" stroke="#4A3B2E" stroke-width="2.5"/><text x="50" y="32" font-size="17" font-weight="700" fill="#4A3B2E" text-anchor="middle">3×4=?</text></svg></div>
      <div class="name">乘法捕鱼</div>
      <div class="desc">数鱼群 学口诀<br>捕到对的答案鱼</div>
    </a>
    <a class="card" href="sudoku/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="14" y="14" width="72" height="72" rx="10" fill="#FFF9EE" stroke="#4A3B2E" stroke-width="3"/><line x1="50" y1="14" x2="50" y2="86" stroke="#4A3B2E" stroke-width="3"/><line x1="14" y1="50" x2="86" y2="50" stroke="#4A3B2E" stroke-width="3"/><circle cx="32" cy="32" r="8" fill="#E8975A" stroke="#4A3B2E" stroke-width="2"/><rect x="58" y="24" width="16" height="16" rx="4" fill="#8FBF7F" stroke="#4A3B2E" stroke-width="2"/><path d="M32 66 l5 -9 5 9 z" fill="#F5C445" stroke="#4A3B2E" stroke-width="2" stroke-linejoin="round"/><circle cx="66" cy="70" r="8" fill="#F2B8C6" stroke="#4A3B2E" stroke-width="2"/><circle cx="63.5" cy="67.5" r="1.4" fill="#4A3B2E"/><circle cx="68.5" cy="67.5" r="1.4" fill="#4A3B2E"/></svg></div>
      <div class="name">数独小动物</div>
      <div class="desc">每行每列不重复<br>小动物排排坐</div>
    </a>
  </div>
  <p class="foot">每天有新关卡，玩完今天的小兔子会说"明天见"。<br>每款游戏右上角 🔒 家长面板：进度 / 时长 / 今日多玩关数。<br>完全离线，无广告无内购，进度保存在本机。</p>

</body>
