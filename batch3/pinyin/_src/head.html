<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼音小火车</title>
<style>
/* ================= 拼音小火车 pinyin =================
   视觉按 DESIGN-SPEC §8：奶油暖白底、暖橙主色、灰蓝错误色（不用大红）
   触摸目标：车厢卡 ≥96×96（JS 按舞台实算，下限 96）、间距 ≥16、重听/兔子 ≥80 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏：logo + 火车进度（车头+车厢，答对点亮）+ 章节点 ---------- */
#hud{height:58px;flex:0 0 58px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:12px}
#logo{width:44px;height:44px;border-radius:12px;background:#E8975A;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
#train-tray{flex:1 1 auto;display:flex;align-items:flex-end;gap:5px;overflow:hidden;padding-bottom:4px}
#train-tray .loco{height:34px;flex:0 0 auto}
#train-tray .loco svg{height:34px;width:auto}
#train-tray .mini-car{width:34px;height:32px;border-radius:8px;background:#E5D5BC;border:2px solid #D8C9B4;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#C9B69C;
  transition:all .35s cubic-bezier(.2,1.6,.4,1)}
#train-tray .mini-car.on{background:#FFF9EE;border-color:#4A3B2E;color:#4A3B2E;transform:translateY(-3px)}
#train-tray .mini-car.on svg{width:24px;height:24px}
#train-tray.nudge{animation:nudge .4s ease}
@keyframes nudge{0%,100%{transform:translateX(0)}40%{transform:translateX(7px)}}
#train-tray.depart .inner{animation:depart .8s ease-in both}
#train-tray .inner{display:flex;gap:5px;align-items:flex-end}
@keyframes depart{0%{transform:translateX(0)}100%{transform:translateX(60vw)}}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：目标区（车头/大字母）+ 候选车厢 ---------- */
#stage{flex:1 1 auto;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;overflow:hidden;min-height:120px;padding:6px 10px}
#target-zone{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}

/* 目标卡：章 1/2 大字母卡 */
#target-card{min-width:var(--tgt,150px);min-height:var(--tgt,150px);max-width:calc(var(--tgt,150px) + 90px);
  border-radius:22px;background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 18px}
#target-card .glyph{font-size:calc(var(--tgt,150px) * .42);font-weight:800;line-height:1.05;color:#4A3B2E}
#target-card .glyph.narrow{letter-spacing:.02em}
#target-card .tag{font-size:20px;color:#8A7B6C;display:flex;align-items:center;gap:6px}
#target-card .tag svg{width:32px;height:32px}
/* 章 3/4：车头 + 货物（图/字） */
#target-card.pin{flex-direction:row;gap:12px;padding:8px 22px}
#target-card .loco-side{display:flex;flex-direction:column;align-items:center;gap:2px}
#target-card .loco-side .glyph{font-size:calc(var(--tgt,150px) * .34)}
#target-card .loco-side svg{width:74px;height:auto}
#target-card .plus{font-size:34px;font-weight:800;color:#C9A87C}
#target-card .cargo{display:flex;flex-direction:column;align-items:center;gap:2px}
#target-card .cargo svg{width:calc(var(--tgt,150px) * .62);height:calc(var(--tgt,150px) * .62)}
#target-card .cargo .zi{font-size:calc(var(--tgt,150px) * .3);font-weight:800;color:#4A3B2E}
#target-card .result{font-size:calc(var(--tgt,150px) * .3);font-weight:800;color:#8FBF7F;letter-spacing:.04em}

/* 重听按钮（≥80 主按钮级） */
#btn-hear{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s;flex:0 0 auto}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:52px;height:52px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---------- 候选车厢（主触摸目标 ≥96） ---------- */
#track{display:flex;align-items:stretch;justify-content:center;gap:var(--gap,16px);flex-wrap:wrap;padding:4px 8px}
.car{width:var(--car,120px);height:calc(var(--car,120px) * .88);border-radius:18px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #C9A87C;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  position:relative;transition:transform .15s}
.car:active{transform:translateY(3px);box-shadow:0 2px 0 #C9A87C}
.car .glyph{font-size:calc(var(--car,120px) * .4);font-weight:800;color:#4A3B2E;line-height:1}
.car .glyph.long{font-size:calc(var(--car,120px) * .26)}   /* yuan 等长音节缩小防溢出 */
.car .roof{width:70%;height:9px;border-radius:6px;background:#E8975A;margin-top:0}  /* 车厢顶檐 */
.car .wheels{display:flex;gap:14px}
.car .wheels i{width:14px;height:14px;border-radius:50%;background:#4A3B2E}
/* 答对：柔绿+勾标（形状冗余，不只靠颜色） */
.car.correct{background:#8FBF7F;box-shadow:0 5px 0 #6FA361;animation:car-hop .45s ease}
.car.correct .glyph{color:#FFF}
.car.correct .roof{background:#FFF9EE}
.car.correct .wheels i{background:#FFF9EE}
.car.correct .mark{position:absolute;top:-12px;right:-12px;width:38px;height:38px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:car-hop .45s ease}
.car.correct .mark svg{width:24px;height:24px}
@keyframes car-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
/* 答错：晃动+灰蓝描边（零惩罚，可重点） */
.car.wrong{animation:car-shake .5s ease;background:#EFE3CD;box-shadow:0 3px 0 #C9BDA8;opacity:.55;pointer-events:none}
.car.wrong .glyph{color:#B7AA96}
@keyframes car-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* 支架高亮脉冲（正确项指认 / 教学帮共用） */
.car.pulse{animation:car-pulse 1s ease 2}
@keyframes car-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}
.car.dim{opacity:.45;pointer-events:none}

/* ---------- 底栏：小兔子（鼓励）+ 再玩一次 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 18px 14px;gap:12px}
#btn-rabbit{width:96px;height:96px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:78px;height:78px}
#btn-rabbit.hop{animation:hop .45s ease 2}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:44px;height:44px}

/* ---------- 幽灵手指教学 ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:40vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

@media (min-width:820px){ #target-card{max-width:none} }
</style>
</head>
