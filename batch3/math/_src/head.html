<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>算术小勇士</title>
<style>
/* ================= 算术小勇士 math =================
   视觉按 DESIGN-SPEC §8：奶油暖白底、暖橙主色、灰蓝错误色（不用大红）
   触摸目标：答案按钮 ≥96×96、数一数按钮 ≥120×88；间距 ≥16；pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 冒险地图区（山路 + 站点 + 小兔子；计数辅助展开时覆盖此区） ---------- */
#mapwrap{position:relative;flex:1 1 auto;min-height:132px;max-height:340px;margin:2px 10px 0}
#map{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;width:17px;height:17px;border-radius:50%;background:#FFF9EE;
  border:3px solid #C9BDA8;transform:translate(-50%,-50%);z-index:3;
  display:flex;align-items:center;justify-content:center}
.stop.done{background:#8FBF7F;border-color:#6FA063}
.stop.done::after{content:'✓';font-size:11px;font-weight:800;color:#fff;line-height:1}
.stop.goal{background:#E8975A;border-color:#C77A42;animation:st-pulse 1.2s ease infinite}
@keyframes st-pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,151,90,.55)}50%{box-shadow:0 0 0 9px rgba(232,151,90,0)}}
.stop.summit{width:34px;height:34px;background:none;border:none}
.stop.summit svg{width:34px;height:34px}
.stop.summit .st-star{fill:#E5D5BC;stroke:#C9BDA8;stroke-width:2.5;transition:all .3s}
.stop.summit.done .st-star{fill:#F2C94C;stroke:#C99B2E;animation:st-spin .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes st-spin{from{transform:rotate(-90deg) scale(.3)}to{transform:rotate(0) scale(1)}}
#bun{position:absolute;width:62px;height:62px;transform:translate(-50%,-84%);z-index:4;
  transition:left .75s cubic-bezier(.35,1.3,.45,1),top .75s cubic-bezier(.35,1.3,.45,1)}
#bun.hop{animation:bun-hop .5s ease}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}

/* ---------- 计数辅助（数一数）---------- */
#aid{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:#FBF3E4;padding:6px 10px}
#aid.open{display:flex}
#aid .aid-title{font-size:15px;font-weight:700;color:#8A7B6C;margin-bottom:4px}
.a-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:100%}
.a-group{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;max-width:44%}
.a-plus{font-size:40px;font-weight:800;color:#E8975A;padding:0 3px}
.appl{width:38px;height:38px;animation:pop-in .32s cubic-bezier(.2,1.5,.4,1) both;position:relative}
@keyframes pop-in{from{transform:scale(0)}to{transform:scale(1)}}
.appl.crossed{opacity:.42;filter:grayscale(.9)}
.appl.crossed::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:24px;font-weight:800;color:#8A9BAE}
#aid .numline{width:min(94%,560px)}
.nl-ring{animation:nl-ring 1.4s ease infinite;transform-box:fill-box;transform-origin:center}
@keyframes nl-ring{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.55);opacity:.15}}

/* ---------- 题目大字卡 ---------- */
#quiz-zone{flex:0 0 auto}
#quiz-card{display:flex;justify-content:center;align-items:baseline;padding:4px 12px 10px}
#quiz-text{font-size:clamp(42px,7vw,74px);font-weight:800;color:#4A3B2E;letter-spacing:.05em;
  font-variant-numeric:tabular-nums;white-space:nowrap}
#quiz-text #qm{color:#C77A42}
#quiz-text #qm.ok{color:#6FA063;animation:qm-pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes qm-pop{from{transform:scale(.2) rotate(-14deg);display:inline-block}to{transform:scale(1) rotate(0);display:inline-block}}

/* ---------- 答案大按钮 ---------- */
#answers{display:flex;justify-content:center;gap:20px;padding:0 12px 12px}
.ans{min-width:132px;min-height:96px;padding:0 26px;border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;font-size:46px;font-weight:800;
  color:#4A3B2E;font-variant-numeric:tabular-nums;transition:transform .15s,box-shadow .15s}
.ans:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.ans.right{background:#8FBF7F;color:#fff;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.ans.wrong{background:#EFE3CD;color:#B7AA96;border-color:#C9BDA8;box-shadow:0 3px 0 #C9BDA8;
  opacity:.55;pointer-events:none}
.ans.shake{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ans.pulse{animation:ans-pulse 1s ease 2}
@keyframes ans-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-count{min-width:126px;min-height:88px;border-radius:22px;background:#E8975A;color:#fff;
  box-shadow:0 4px 0 #C77A42;font-size:19px;font-weight:700;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;transition:transform .15s}
#btn-count:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
#btn-count svg{width:34px;height:34px}
#btn-count.pulse{animation:cnt-pulse 1s ease 2}
@keyframes cnt-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px rgba(232,151,90,.95)) brightness(1.06)}}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}

/* ---------- 幽灵手指教学（照 memory） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：地图限宽保山形比例（SVG 与站点同容器百分比定位，不失配）；答案按钮放大
   注：auto margins 会取消 flex stretch 且 mapwrap 无在流内容 → 必须显式 width 防塌 0 */
@media (orientation:portrait){
  #mapwrap{width:calc(100% - 20px);max-width:620px;margin-left:auto;margin-right:auto}
  .ans{min-width:150px;min-height:104px;font-size:52px}
}
</style>
</head>
<body>
<div id="game" aria-label="算术小勇士">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="mapwrap" aria-label="上山冒险地图">
    <svg id="map" viewBox="0 0 100 62" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M0 62 L0 42 Q18 38 30 31 Q56 23 76 11 Q86 6 100 1 L100 62 Z" fill="#EAF2E2"/>
      <path d="M0 62 L0 52 Q24 50 44 40 Q66 30 84 15 L100 5 L100 62 Z" fill="#DFECd4" opacity=".75"/>
      <ellipse cx="26" cy="12" rx="9" ry="3.6" fill="#FFF" opacity=".8"/>
      <ellipse cx="33" cy="10" rx="6" ry="2.8" fill="#FFF" opacity=".8"/>
      <circle cx="9" cy="9" r="5" fill="#F2C94C" opacity=".9"/>
      <path d="M6 55 C12 52 16 49 22 47 C28 45 33 42 38 39 C44 36 48 33 53 30 C58 27 63 24 68 21 C75 17 82 14 89 9"
        stroke="#E5D5BC" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
    <div id="bun" aria-hidden="true"></div>
    <div id="aid" role="region" aria-label="计数辅助"></div>
  </div>
  <div id="quiz-zone">
    <div id="quiz-card"><div id="quiz-text" aria-live="polite">…</div></div>
    <div id="answers" aria-label="答案选项"></div>
  </div>
  <div id="dock">
    <button id="btn-count" aria-label="数一数"></button>
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
