<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>规律侦探</title>
<style>
/* ================= 规律侦探 pattern =================
   视觉按 DESIGN-SPEC §8：奶油暖白底、暖橙主色、灰蓝错误色（不用大红）、状态不单靠红绿
   触摸目标：选项按钮 ≥80px（实际 ≥96）；序列卡按 stage 实测算尺寸（下限 64）；间距 ≥16 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏：图标 + 本关题目进度点 + 章节点 ---------- */
#hud{height:58px;flex:0 0 58px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:12px}
#logo{width:44px;height:44px;border-radius:12px;background:#E8975A;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
#quiz-tray{display:flex;gap:7px;align-items:center;flex:1 1 auto;flex-wrap:wrap;overflow:hidden}
#quiz-tray i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s ease}
#quiz-tray i.cur{background:#E8975A;transform:scale(1.25)}
#quiz-tray i.on{background:#8FBF7F}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 序列区 ---------- */
#stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;min-height:130px}
#seq{display:flex;gap:var(--gap,16px);align-items:center;justify-content:center;flex-wrap:nowrap}
.seqcard{width:var(--card);height:var(--card);flex:0 0 auto;border-radius:calc(var(--card) * .16);
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;align-items:center;justify-content:center;position:relative}
.seqcard>svg{width:78%;height:78%}
/* 问号卡：3D 翻转（答对翻开） */
.seqcard.q{background:#E8975A;box-shadow:0 5px 0 #C77A42;perspective:560px}
.seqcard .qinner{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .38s cubic-bezier(.3,1.2,.4,1)}
.seqcard.q.rev .qinner{transform:rotateY(180deg)}
.seqcard .qface,.seqcard .aface{position:absolute;inset:0;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;border-radius:inherit;display:flex;align-items:center;justify-content:center}
.seqcard .qface svg{width:58%;height:58%}
.seqcard .aface{background:#FFF9EE;border:2.5px solid #4A3B2E;transform:rotateY(180deg)}
.seqcard .aface svg{width:74%;height:74%}
/* 答对后序列逐张弹跳回放（强化规律感） */
.seqcard.bounce{animation:seq-bounce .55s cubic-bezier(.3,1.5,.4,1)}
@keyframes seq-bounce{0%,100%{transform:none}
  35%{transform:translateY(-16%) scale(1.1)}70%{transform:translateY(3%) scale(.97)}}
/* 教学"帮"：高亮序列前段（规律起点） */
.seqcard.lead{animation:lead-glow 1s ease 2}
@keyframes lead-glow{0%,100%{filter:none;box-shadow:0 5px 0 #D8C9B4}
  50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9));box-shadow:0 5px 0 #E8975A}}

/* ---------- 选项：3 选 1 大按钮（≥80px，实际按 vw 放大到 ~96-148） ---------- */
#choices{flex:0 0 auto;display:flex;gap:18px;align-items:center;justify-content:center;padding:10px 14px}
.choice{width:clamp(96px,24vw,148px);height:clamp(96px,24vw,148px);border-radius:24px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .3s}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
.choice svg{width:70%;height:70%}
/* 答对 */
.choice.right{border-color:#8FBF7F;box-shadow:0 5px 0 #8FBF7F;animation:choice-pop .45s ease}
@keyframes choice-pop{0%,100%{transform:none}45%{transform:scale(1.12)}}
/* 答错：晃 + 灰蓝描边（不用大红）+ 灰掉不可再点；正确项高亮 1.2s（支架） */
.choice.wrong{animation:choice-shake .45s ease;border-color:#8A9BAE;opacity:.5;pointer-events:none}
@keyframes choice-shake{0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.choice.reveal{animation:choice-reveal 1.2s ease;border-color:#8FBF7F}
@keyframes choice-reveal{0%,100%{filter:none}
  50%{filter:drop-shadow(0 0 14px rgba(143,191,127,.95))}}

/* ---------- 底栏：小兔子（鼓励）+ 再看一看 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 18px 14px;gap:12px}
#btn-rabbit{width:96px;height:96px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:78px;height:78px}
#btn-rabbit.hop{animation:hop .45s ease 2}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:44px;height:44px}

/* ---------- 幽灵手指教学 ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:40vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 宽屏（≥820px）：序列区限宽居中 */
@media (min-width:820px){
  #seq{max-width:900px}
}
/* 竖屏（平板竖持）：选项按钮放大（宽度充裕，视觉评估 P1） */
@media (orientation:portrait) and (min-width:600px){
  .choice{width:168px;height:168px}
}
</style>
</head>

<body>
<div id="game" aria-label="规律侦探">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="quiz-tray" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="seq" aria-label="图案序列"></div>
  </div>
  <div id="choices" aria-label="选项"></div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再看一看"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

    for (let c = 0; c < m; c++) out.push({ x: x0 + c * (s + gap), y: y0 + r * (s + gap), s: s });
  });
  return out;
}

/* ---------- 图案 → SVG（count=1 单图案；>1 数量网格） ---------- */
function iconSVG(item) {

/* ---------- 图案池 12 种（每 (形状,颜色) 组合唯一） ---------- */
const POOL = [
  ['ball', 'red'], ['cushion', 'yellow'], ['drop', 'orange'], ['star', 'red'], ['heart', 'blue'], ['flower', 'orange'],
  ['ball', 'blue'], ['cushion', 'green'], ['drop', 'purple'], ['star', 'yellow'], ['heart', 'green'], ['flower', 'purple']
].map(function (p) { return { shape: p[0], color: p[1], count: 1 }; });

function poolItem(shape, color) {
  for (let i = 0; i < POOL.length; i++) {
    if (POOL[i].shape === shape && POOL[i].color === color) return { shape: shape, color: color, count: 1 };
  }
  return { shape: 'ball', color: 'red', count: 1 };
}
/* 同形状的另一枚（颜色不同）/ 同颜色的另一枚（形状不同）——双维度关干扰项 */
function sameShape(item) {
  for (let i = 0; i < POOL.length; i++) {
    if (POOL[i].shape === item.shape && POOL[i].color !== item.color) return cloneItem(POOL[i]);
  }
  return null;
}
function sameColor(item) {
  for (let i = 0; i < POOL.length; i++) {
    if (POOL[i].color === item.color && POOL[i].shape !== item.shape) return cloneItem(POOL[i]);
  }
  return null;
}
function cloneItem(it) { return { shape: it.shape, color: it.color, count: it.count || 1 }; }

/* ---------- 问号卡面 ---------- */
const QUESTION_SVG = '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">' +

/* ---------- 确定性随机（与 batch1/2 同实现） ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ================= pattern 纯引擎：规律显式纯函数 ruleAt + 关卡生成 + 判定
   规律一律写成纯函数 ruleAt(rule, i)——任意位置可程序推断：
     cycle: {icons:[图案...]} 周期=icons.length（AB 仅教学链+flat0 首题；正式谱周期≥3）
     dual:  {shapes:[s0,s1], colors:[c0,c1]} 双维度——形状轴/颜色轴各自周期 2
     dualP: {shapes:[s0,s1], colors:[c0,c1,c2]} 双轴独立周期（r27）——形状轴 2 ×
            颜色轴 3，合成周期 6：无法按 2 长单元整块复读，必须两轴分别归纳
     count: {shape,color,start,step} 数量规律 count(i)=start+step*i
     compound: {shapes:[s0,s1],color,start,step} 双变量复合（r27）——形状轴交替 ×
            数量轴等差同步，缺失项须同时满足两轴
   缺失项 answer = ruleAt(missingIdx)；序列可见项 = ruleAt(i)（i≠missingIdx）
   UI 与 ?verify=1 共用同一代码路径，防两套逻辑漂移 */
'use strict';

const CH_LEN = 5; // 5 关 = 1 章
const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);

function ruleAt(rule, i) {
  if (rule.kind === 'cycle') {
    const it = rule.icons[i % rule.icons.length];
    return { shape: it.shape, color: it.color, count: 1 };
  }
  if (rule.kind === 'dual') {
    return { shape: rule.shapes[i % 2], color: rule.colors[i % 2], count: 1 };
  }
  if (rule.kind === 'dualP') {
    return { shape: rule.shapes[i % rule.shapes.length], color: rule.colors[i % rule.colors.length], count: 1 };
  }
  if (rule.kind === 'compound') {
    return { shape: rule.shapes[i % 2], color: rule.color, count: rule.start + rule.step * i };
  }
  return { shape: rule.shape, color: rule.color, count: rule.start + rule.step * i };
}
function rulePeriod(rule) {
  if (rule.kind === 'cycle') return rule.icons.length;
  if (rule.kind === 'dual') return 2;
  if (rule.kind === 'dualP') return rule.shapes.length * rule.colors.length; // 2×3 互素=lcm=6
  if (rule.kind === 'compound') return 2; // 形状轴周期（数量轴单调不循环；此值供教学 helpPulse 高亮一个形状单元）
  return 1;
}
function ruleOutputs(rule, len) {
  const s = [];
  for (let i = 0; i < len; i++) s.push(ruleAt(rule, i));
  return s;
}
function sameItem(a, b) {
  return a.shape === b.shape && a.color === b.color && (a.count || 1) === (b.count || 1);
}
function itemKey(a) { return a.shape + '|' + a.color + '|' + (a.count || 1); }

/* ---------- 题型模板（章难度阶梯，r27 上探谱） ----------
   ch1 周期单元≥3 + 双维入门（AB 仅教学链+flat0 首题坡度锚）
   ch2 中间缺失（双侧推断）+ 复杂单元（ABCD/ABBC）
   ch3 双维度（2/2 → 章末 2/3 独立周期）| ch4 数量规律 + 形状×数量复合
   退役模板（r27 移除，低段概念_floor 根因）：AABB_END / AB_MID */
const QUIZ_T = {
  AB_END: { kind: 'cycle', pat: [0, 1], total: 5, miss: 4 },
  ABB_END: { kind: 'cycle', pat: [0, 1, 1], total: 6, miss: 5 },
  ABC_END: { kind: 'cycle', pat: [0, 1, 2], total: 6, miss: 5 },
  ABCD_END: { kind: 'cycle', pat: [0, 1, 2, 3], total: 8, miss: 7 },
  ABC_MID: { kind: 'cycle', pat: [0, 1, 2], total: 7, miss: 4 },
  ABCD_MID: { kind: 'cycle', pat: [0, 1, 2, 3], total: 7, miss: 4 },
  ABBC_END: { kind: 'cycle', pat: [0, 1, 1, 2], total: 8, miss: 7 },
  ABBC_MID: { kind: 'cycle', pat: [0, 1, 1, 2], total: 8, miss: 5 },
  DUAL_END: { kind: 'dual', total: 5, miss: 4 },
  DUAL_MID: { kind: 'dual', total: 5, miss: 2 },
  DUALP_END: { kind: 'dualP', total: 6, miss: 5 },
  DUALP_MID: { kind: 'dualP', total: 6, miss: 3 },
  CNT_UP1: { kind: 'count', step: 1, total: 5, miss: 4 },
  CNT_DN1: { kind: 'count', step: -1, total: 5, miss: 4 },
  CNT_UP2: { kind: 'count', step: 2, total: 5, miss: 4 },
  CNT_UP1M: { kind: 'count', step: 1, total: 5, miss: 2 },
  CMP_END: { kind: 'compound', step: 1, total: 5, miss: 4 },
  CMP_MID: { kind: 'compound', step: 1, total: 5, miss: 2 },
  CMP2_END: { kind: 'compound', step: 2, total: 5, miss: 4 }
};

/* 静态 20 关（4 章 × 5）：flat 0-19 题型谱（r27 上探）——
   flat0 首题保留 AB_END（教学链演示题，逐字节锚：rnd 首题消耗序列不变，教程
   "看/帮"演示题与改造前完全一致）；flat0 第 2/3 题起坡度上探；
   flat10-13 / flat15-16 六关原样保留（基线谱，字节级不动——对照证据见 SPEC-R27）；
   flat14 章末上探 dualP；flat17-19 引入复合 CMP。
   【图标预算铁律】图案池 12 枚+材料袋整级去重借出（refill 无法扩容，见 makeBag）：
   每关 cycle/dual/dualP/compound 题材去重图标需求（cycle=pat 去重数、dual/dualP=2、
   count=1、compound=2）的任意前缀和恒 ≤12，超限=take 返短→icons[p] undefined 崩。 */
const STATIC_SPECS = [
  ['AB_END', 'ABB_END', 'ABC_END'],
  ['ABC_END', 'ABC_MID', 'ABC_END'],
  ['ABC_END', 'DUAL_END', 'ABBC_END'],
  ['ABCD_END', 'ABC_END', 'DUAL_END'],
  ['ABCD_END', 'ABBC_END', 'DUAL_MID'],
  ['ABC_MID', 'ABBC_END', 'ABC_MID', 'ABBC_END'],
  ['ABCD_MID', 'ABC_MID', 'DUAL_MID', 'ABBC_END'],
  ['ABCD_MID', 'ABBC_END', 'DUAL_END', 'ABBC_MID'],
  ['ABBC_MID', 'ABCD_MID', 'ABC_MID', 'DUAL_MID'],
  ['ABCD_MID', 'ABBC_MID', 'DUAL_MID', 'ABC_END'],
  ['DUAL_END', 'DUAL_END', 'DUAL_MID', 'DUAL_END'],
  ['DUAL_END', 'DUAL_MID', 'DUAL_END', 'DUAL_MID'],
  ['DUAL_MID', 'DUAL_END', 'DUAL_END', 'DUAL_MID'],
  ['DUAL_END', 'DUAL_MID', 'DUAL_MID', 'DUAL_END'],
  ['DUAL_END', 'DUALP_END', 'DUAL_MID', 'DUALP_END'],
  ['CNT_UP1', 'CNT_UP1', 'CNT_DN1', 'CNT_UP1', 'CNT_UP1'],
  ['CNT_UP1', 'CNT_DN1', 'CNT_UP2', 'CNT_UP1', 'CNT_DN1'],
  ['CMP_END', 'CNT_UP2', 'CNT_DN1', 'CMP_MID', 'CMP_END'],
  ['CNT_UP2', 'CMP2_END', 'CNT_DN1', 'CMP_MID', 'CMP_END'],
  ['CMP2_END', 'CNT_UP1M', 'CMP_MID', 'CNT_UP2', 'CMP_END']
];
/* flat≥20 生成关：主题按章循环（r27：进阶周期→中间缺失→双维度→数量+复合），
   关卡 key 随章号单调不重复；AB_END 不入生成池（生成关为后期内容，恒进阶谱）；
   生成池同样受图标预算 ≤12 约束（theme1 含 dual 系稀释 ABCD 的 4 图标成本） */
const CH_TPL = [
  ['ABC_END', 'ABBC_END', 'ABCD_END', 'ABC_MID', 'DUAL_END'],
  ['ABCD_MID', 'ABBC_MID', 'DUAL_END', 'ABC_MID', 'DUAL_MID'],
  ['DUAL_END', 'DUAL_MID', 'DUALP_END', 'DUALP_MID'],
  ['CNT_UP1', 'CNT_DN1', 'CNT_UP2', 'CNT_UP1M', 'CMP_END', 'CMP_MID', 'CMP2_END']
];
const CH_QUIZN = [3, 4, 4, 5];
function levelSpec(flat) {
  if (flat < STATIC_SPECS.length) return { ch: Math.floor(flat / CH_LEN) + 1, tks: STATIC_SPECS[flat] };
  const ch = Math.floor(flat / CH_LEN) + 1, theme = (ch - 1) % 4;
  const pool = CH_TPL[theme], n = CH_QUIZN[theme], tks = [];
  for (let i = 0; i < n; i++) tks.push(pool[(flat + i) % pool.length]);
  return { ch: ch, tks: tks };
}

/* ---------- 材料袋：从图案池按种子抽取（耗竭自动重洗） ---------- */
function makeBag(rnd) {
  let bag = shuffled(POOL, rnd);
  function refill(keep) {
    bag = shuffled(POOL, rnd);
    for (let i = 0; i < keep.length; i++) {  // 避开本轮已借出的组合
      const j = bag.findIndex(function (b) { return itemKey(b) === itemKey(keep[i]); });
      if (j >= 0) bag.splice(j, 1);
    }
  }
  return {
    take: function (k, keep) {
      if (bag.length < k) refill(keep || []);
      return bag.splice(0, k);
    },
    dualPair: function () {
      for (let t = 0; t < 8; t++) {
        for (let i = 0; i < bag.length; i++) {
          for (let j = i + 1; j < bag.length; j++) {
            if (bag[i].shape !== bag[j].shape && bag[i].color !== bag[j].color) {
              const a = bag.splice(i, 1)[0];
              const b = bag.splice(j - 1, 1)[0];
              return [a, b];
            }
          }
        }
        bag = shuffled(POOL, rnd);
      }
      return [poolItem('ball', 'red'), poolItem('cushion', 'green')]; // 不可达兜底
    }
  };
}

/* ---------- 干扰项：同池、规律外（≠ruleAt 任何输出）、≠answer、互异 ---------- */
function iconDistractors(outs, answer, rnd) {
  const outKeys = outs.map(itemKey);
  const cand = shuffled(POOL, rnd).filter(function (p) { return outKeys.indexOf(itemKey(p)) < 0; });
  cand.sort(function (a, b) {  // 优先与 answer 共享形状或颜色的（真干扰，非一眼排除）
    const sa = (a.shape === answer.shape || a.color === answer.color) ? 0 : 1;
    const sb = (b.shape === answer.shape || b.color === answer.color) ? 0 : 1;
    return sa - sb;
  });
  return cand.slice(0, 2).map(cloneItem);
}
function countDistractors(outs, answer, rnd) {
  const used = outs.map(function (o) { return o.count; });
  const cand = [];
  for (let c = 1; c <= 9; c++) if (used.indexOf(c) < 0 && c !== answer.count) cand.push(c);
  cand.sort(function (a, b) { return Math.abs(a - answer.count) - Math.abs(b - answer.count); });
  return cand.slice(0, 2).map(function (c) {
    return { shape: answer.shape, color: answer.color, count: c };
  });
}
/* 复合题干扰（r27）：两个「半对」干扰——d1 形状错·数量对，d2 形状对·数量近错；
   每个错项恰在一根轴上违律（另一轴成立），逼双向校验；均在规律外且互异 */
function compoundDistractors(rule, outs, answer) {
  const otherShape = rule.shapes[0] === answer.shape ? rule.shapes[1] : rule.shapes[0];
  const usedC = outs.map(function (o) { return o.count; });
  const cand = [];
  for (let c = 1; c <= 9; c++) if (usedC.indexOf(c) < 0 && c !== answer.count) cand.push(c);
  cand.sort(function (a, b) { return Math.abs(a - answer.count) - Math.abs(b - answer.count); });
  return [
    { shape: otherShape, color: rule.color, count: answer.count },
    { shape: answer.shape, color: rule.color, count: cand[0] }
  ];
}

/* ---------- 组题 ---------- */
function buildQuiz(tk, rnd, bag, used) {
  const t = QUIZ_T[tk];
  let rule;
  if (t.kind === 'cycle') {
    const icons = bag.take(Math.max.apply(null, t.pat) + 1, used);
    icons.forEach(function (it) { used.push(it); });
    rule = { kind: 'cycle', icons: t.pat.map(function (p) { return icons[p]; }) };
  } else if (t.kind === 'dual') {
    const pair = bag.dualPair();
    pair.forEach(function (it) { used.push(it); });
    rule = { kind: 'dual', shapes: [pair[0].shape, pair[1].shape], colors: [pair[0].color, pair[1].color] };
  } else if (t.kind === 'dualP') { // 双轴独立周期：形状 2 色 3（第三色 seeded 抽取）
    const pair = bag.dualPair();
    pair.forEach(function (it) { used.push(it); });
    const c2 = shuffled(COLOR_KEYS.filter(function (c) {
      return c !== pair[0].color && c !== pair[1].color;
    }), rnd)[0];
    rule = { kind: 'dualP', shapes: [pair[0].shape, pair[1].shape], colors: [pair[0].color, pair[1].color, c2] };
  } else if (t.kind === 'compound') { // 形状×数量复合：池内同色异形对（每色恰 2 形状）
    const it = bag.take(1, used)[0];
    used.push(it);
    const other = sameColor(it);
    used.push(other);
    const start = t.step === 2 ? 1 : 1 + Math.floor(rnd() * 3); // step2:1(1,3,5,7,9)；step1:1-3(max 7)
    rule = { kind: 'compound', shapes: [it.shape, other.shape], color: it.color, start: start, step: t.step };
  } else {
    const it = bag.take(1, used)[0];
    used.push(it);
    const start = t.step === 2 ? 1 : (t.step < 0 ? 5 + Math.floor(rnd() * 5) : 1 + Math.floor(rnd() * 5));
    rule = { kind: 'count', shape: it.shape, color: it.color, start: start, step: t.step };
  }
  const len = t.total, miss = t.miss;
  const seq = [];
  for (let i = 0; i < len; i++) seq.push(ruleAt(rule, i));
  const answer = ruleAt(rule, miss);
  const outs = ruleOutputs(rule, len);
  const ds = t.kind === 'dual'
    ? shuffled([sameShape(answer), sameColor(answer)], rnd)
    : (t.kind === 'count' ? countDistractors(outs, answer, rnd)
    : (t.kind === 'compound' ? compoundDistractors(rule, outs, answer)
    : iconDistractors(outs, answer, rnd))); // cycle + dualP 同通道（池内真干扰、规律外）
  const items = shuffled([cloneItem(answer), ds[0], ds[1]], rnd);
  const correctIdx = items.findIndex(function (it) { return sameItem(it, answer); });
  return { tk: tk, rule: rule, len: len, missingIdx: miss, seq: seq, answer: answer, items: items, correctIdx: correctIdx };
}

/* ---------- 关卡生成：静态 20 与生成关同一确定性通道
   种子 = mulberry32(flat * 7919 + 13)，同 flat 永远同关（重玩一致、verify 可检） ---------- */
function makeLevel(flat) {
  flat = Math.max(0, flat | 0);
  const rnd = mulberry32(flat * 7919 + 13);
  const spec = levelSpec(flat);
  const bag = makeBag(rnd), used = [];
  return {
    flat: flat, ch: spec.ch,
    quizzes: spec.tks.map(function (tk) { return buildQuiz(tk, rnd, bag, used); }),
    qi: 0, misses: 0, won: false
  };
}

/* ---------- 纯引擎（无 DOM） ---------- */
function engPick(L, i) { // 点选项：对=推进下一题（末题→won）；错=计一次重试、停留本题
  if (engWon(L)) return false;
  const q = L.quizzes[L.qi];
  if (!q || i < 0 || i >= q.items.length) return false;
  if (i === q.correctIdx) {
    L.qi++;
    if (L.qi >= L.quizzes.length) L.won = true;
    return 'correct';
  }
  L.misses++;
  return 'wrong';
}
function engWon(L) { return L.qi >= L.quizzes.length; }
/* 星级：全对=3 星；总重试≤3=2 星；否则 1 星（永不 0 星） */
function engStars(L) { return L.misses === 0 ? 3 : (L.misses <= 3 ? 2 : 1); }

/* ================= pattern 主逻辑 =================
   玩法：图案序列（5-8 可见 + 1 问号卡，缺失在末尾或中间）→ 下方 3 选 1 大按钮
   答对 = 问号卡 3D 翻开 + 序列从头逐张弹跳回放（马林巴音阶随行，强化"规律感"）
   答错 = 按钮 3D 晃 + 灰掉 + 正确项高亮 1.2s（支架，零惩罚可重点）
   全关 3-5 题过关：全对 3 星 / 总重试≤3 2 星 / 否则 1 星
   验收钩子：window.PAT = { currentLevel, quiz(), pick(i), autoSolve() }
   verify=1：stub 发声 + 提速（同一代码路径） */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const VD = VERIFY ? 0.22 : 1; // verify 模式动画整体提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
const note = (f, d) => { if (!VERIFY) KIDS.audio.note(f, d, 0, 0.5); };
/* 游戏语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };

const seqEl = $id('seq'), stageEl = $id('stage'), choicesEl = $id('choices'), ghostEl = $id('ghost'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay');

let cur = null;                       // 当前关模型（makeLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none' };
let lastAct = Date.now();
let settleP = Promise.resolve();      // 最近一次 pick 的动画管道（autoSolve 顺序等待）
let tutRedemo = false, ghostOn = false;

const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 78);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}

/* ================= 渲染 ================= */
function renderQuiz() {
  const q = cur && cur.quizzes[Math.min(cur.qi, cur.quizzes.length - 1)];
  if (!q) return;
  layoutSeq(q.len);
  seqEl.innerHTML = '';
  for (let i = 0; i < q.len; i++) {
    const d = document.createElement('div');
    d.className = 'seqcard';
    d.dataset.i = i;
    d.setAttribute('aria-label', '第' + (i + 1) + '张图案');
    if (i === q.missingIdx) {
      d.classList.add('q');
      d.innerHTML = '<div class="qinner"><div class="qface">' + QUESTION_SVG + '</div>' +
        '<div class="aface">' + iconSVG(q.answer) + '</div></div>';
    } else {
      d.innerHTML = iconSVG(q.seq[i]);
    }
    seqEl.appendChild(d);
  }
  choicesEl.innerHTML = '';
  q.items.forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.dataset.i = i;
    b.setAttribute('aria-label', '选项' + (i + 1));
    b.innerHTML = iconSVG(it);
    choicesEl.appendChild(b);
  });
  renderTray();
}
function choiceEl(i) { return choicesEl.querySelector('.choice[data-i="' + i + '"]'); }
/* 卡尺寸按 stage 实时算：序列卡下限 64、上限 132（问号卡与图案卡同尺寸） */
function layoutSeq(n) {
  const availW = stageEl.clientWidth - 24, availH = stageEl.clientHeight - 14, g = 16;
  const cap = window.matchMedia('(orientation:portrait)').matches ? 152 : 132; // 竖屏宽度充裕，序列卡放大（视觉评估 P1）
  const size = Math.max(64, Math.min(Math.floor((availW - (n - 1) * g) / n), Math.floor(availH * 0.88), cap));
  document.documentElement.style.setProperty('--card', size + 'px');
  document.documentElement.style.setProperty('--gap', g + 'px');
}
window.addEventListener('resize', () => {
  if (cur && cur.quizzes.length) layoutSeq(cur.quizzes[Math.min(cur.qi, cur.quizzes.length - 1)].len);
});
function renderTray() { // 本关题目进度点
  const t = $id('quiz-tray');
  t.innerHTML = '';
  if (!cur) return;
  for (let i = 0; i < cur.quizzes.length; i++) {
    const d = document.createElement('i');
    if (i < cur.qi) d.className = 'on';
    else if (i === cur.qi && !cur.won) d.className = 'cur';
    t.appendChild(d);
  }
}
function renderDots() { // 章节点（ch 1 基；无限生成章只画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  if (!cur) return;
  const ch = Math.floor(cur.flat / CH_LEN) + 1, sv = KIDS._save() || { levels: {} };
  for (let c = 0; c < ch; c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[(c + 1) + '-' + l]);
    i.className = done ? 'done' : (c === ch - 1 ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 幽灵手指（教学"帮"） ================= */
const ghost = {
  toEl(el) {
    const r = el.getBoundingClientRect();
    ghostEl.style.left = (r.left + r.width / 2) + 'px';
    ghostEl.style.top = (r.top + r.height * 0.62) + 'px';
  },
  show() { ghostOn = true; ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostOn = false; ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAtChoice() {
  if (VERIFY || !cur) return;
  const q = cur.quizzes[Math.min(cur.qi, cur.quizzes.length - 1)];
  const el = q && choiceEl(q.correctIdx);
  if (!el) return;
  ghost.toEl(el); ghost.show();
  setTimeout(() => ghost.press(), 800);
}

/* ================= 点选主路径（真实点击 / PAT.pick / autoSolve 共用） ================= */
function pick(i) {
  if (!cur || state.locked || state.won || state.demo) return false;
  const q = cur.quizzes[cur.qi];
  if (!q || i < 0 || i >= q.items.length) return false;
  lastAct = Date.now();
  const r = engPick(cur, i);
  state.locked = true;
  settleP = r === 'correct' ? correctFlow(q, i) : wrongFlow(q, i);
  return r;
}
async function wrongFlow(q, i) { // 错=晃+灰掉；正确项高亮 1.2s；同题连错 2 次幽灵手指救援；停留本题零惩罚
  sfx('fail');
  const wb = choiceEl(i);
  if (wb) wb.classList.add('wrong');
  const rb = choiceEl(q.correctIdx);
  if (rb) {
    rb.classList.add('reveal');
    setTimeout(() => rb.classList.remove('reveal'), 1200 * VD + 60);
  }
  q._miss = (q._miss || 0) + 1;                 // 同题连错救援（6 岁玩家评估：无人救援直接放弃；教玩观察 P1：3.6s 会错过 → 常驻至答对，correctFlow 收指）
  if (q._miss >= 2 && rb) {
    ghost.toEl(rb); ghost.show();
    setTimeout(() => ghost.press(), 400);
  }
  await wait(1280 * VD);
  state.locked = false;
}
async function correctFlow(q, i) { // 问号翻开 → 序列逐张弹跳回放 → 下一题/过关（救援手指随之收起）
  ghost.hide();
  const btn = choiceEl(i);
  if (btn) btn.classList.add('right');
  sfx('coin');
  const qc = seqEl.querySelector('.seqcard[data-i="' + q.missingIdx + '"]');
  if (qc) qc.classList.add('rev');
  await wait(600 * VD);
  const cards = seqEl.children;
  for (let k = 0; k < cards.length; k++) {
    const c = cards[k], kk = k;
    setTimeout(() => {
      if (!seqEl.contains(c)) return;
      c.classList.remove('bounce'); void c.offsetWidth; c.classList.add('bounce');
      note(523.25 * Math.pow(2, (kk % 5) * 0.2), 0.16); // 五声音阶随行
    }, k * 150 * VD);
  }
  await wait((cards.length * 150 + 600) * VD);
  if (state.tut === 'help') { // 教学"独"：首次答对 → 强化反馈，放手独立完成
    state.tut = 'solo';
    ghost.hide();
    sfx('ok');
    hopRabbit();
  }
  if (engWon(cur)) { winFlow(); return; }
  state.locked = false;
  if (!state.demo) renderQuiz(); // 教学演示态不推进（由 tutorialWatch 重发同一关）
}

/* ================= 教学：看-帮-独（仅关 1-0 首次，save.pat.tutSeen 记住演示已放过） ================= */
function helpPulse() { // "帮"：高亮序列前段（规律起点，第一个周期）
  const q = cur.quizzes[Math.min(cur.qi, cur.quizzes.length - 1)];
  if (!q) return;
  const p = rulePeriod(q.rule);
  for (let i = 0; i < Math.min(p + 1, q.len); i++) {
    if (i === q.missingIdx) continue;
    const c = seqEl.querySelector('.seqcard[data-i="' + i + '"]');
    if (c) c.classList.add('lead');
  }
}
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayP('pat_tut_watch', '看！找一找图案的秘密');
  await wait(800 * VD);
  const q = cur.quizzes[0];
  const rb = choiceEl(q.correctIdx);          // 看：先亮出正确项
  if (rb) rb.classList.add('reveal');
  await wait(900 * VD);
  if (rb) rb.classList.remove('reveal');
  engPick(cur, q.correctIdx);                 // 引擎走真路径
  await correctFlow(q, q.correctIdx);         // 翻开 + 回放（demo 态不推进渲染）
  const sv = KIDS._save();
  sv.pat = sv.pat || {};
  sv.pat.tutSeen = true;
  KIDS.store.persist();
  sayP('pat_tut_turn', '你来接着摆');
  await wait(500 * VD);
  /* 重新发同一关（确定性布局一致），进入"帮" */
  cur = makeLevel(0);
  state = { locked: false, won: false, demo: false, tut: 'help' };
  tutRedemo = false;
  lastAct = Date.now();
  renderQuiz();
  helpPulse();
  setTimeout(() => { if (state.tut === 'help' && !ghostOn) pointGhostAtChoice(); }, 900);
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
const HINTS = { 1: '图案排队的秘密规律哦', 2: '中间藏起来的图案哦', 3: '颜色和形状的新规律', 4: '数量和形状一起变哦' };
const GEN_HINTS = ['更长的图案队伍哦', '中间缺失的侦探挑战哦', '双维度的秘密排列哦', '数量和形状一起变哦'];
function nextHint(ci) {
  if (ci == null) ci = Math.floor(KIDS.calendar.limit(Infinity) / CH_LEN);
  if (ci >= 4) return '明天有' + GEN_HINTS[ci % GEN_HINTS.length];
  return HINTS[ci] || '有新的关卡哦';
}
function winFlow() {
  state.won = true; state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return; // verify：不弹层不写档（KIDS 未 init；引擎态已到 won）
  KIDS.ui.celebrate(stars).then(() => {
    const ci = Math.floor(cur.flat / CH_LEN), ch = ci + 1, lv = cur.flat % CH_LEN;
    const pr = KIDS.level.pass(ch, lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity); // 关卡无限：日历不设内容上限
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: ch, stars: stars5, nextHint: nextHint(ci + 1) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() { // 进入今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur.flat); // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = makeLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none' };
  tutRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  if (VERIFY) return;
  const sv = KIDS._save();
  const fresh = flat === 0 && !sv.levels['1-0'] && !(sv.pat && sv.pat.tutSeen);
  if (fresh) { tutorialWatch(); return; }
  sayP('pat_hint', '看看前面的图案');
}

/* ================= 底栏交互 ================= */
function hopRabbit() {
  rabbitBtn.classList.remove('hop'); void rabbitBtn.offsetWidth; rabbitBtn.classList.add('hop');
}
function bounceVisible() { // "再看一看"：重放当前可见序列（不改变状态）
  const cards = seqEl.children;
  for (let k = 0; k < cards.length; k++) {
    const c = cards[k], kk = k;
    setTimeout(() => {
      if (!seqEl.contains(c)) return;
      c.classList.remove('bounce'); void c.offsetWidth; c.classList.add('bounce');
      note(523.25 * Math.pow(2, (kk % 5) * 0.2), 0.14);
    }, k * 130);
  }
}
rabbitBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur) return;
  lastAct = Date.now();
  hopRabbit();
  sayP('pat_hint', '看看前面的图案');
});
replayBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur || state.locked || state.won || state.demo) return;
  lastAct = Date.now();
  bounceVisible();
});
choicesEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.choice');
  if (!el) return;
  e.preventDefault();
  if (el.classList.contains('wrong')) return;
  pick(Number(el.dataset.i));
});

/* ================= 无操作看护：20s 轻声提示目标 / 教学 5s 重演示一次 ================= */
setInterval(() => {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  const idle = Date.now() - lastAct;
  if (idle > 20000) {
    sayP('pat_hint', '看看前面的图案');
    lastAct = Date.now();
    return;
  }
  if (idle > 5000 && state.tut === 'help' && !tutRedemo && !ghostOn) {
    tutRedemo = true;
    pointGhostAtChoice();
  }
}, 1000);

/* ================= ?verify=1 自检 =================
   ① 静态 20 + 生成 20 关（flat 20-39）：确定性 / 规律正确性（按 ruleAt 复推；
     双维度关形状轴/颜色轴分别校验；r27 复合关三轴分别校验+每题几何与模板表对账）/
     干扰项 ≠answer 且三项互异且规律外
   ② autoSolve 引擎直驱 40 关全通关（每题点正确项，0 重试）
   ③ 单元：星级映射（含永不 0 星）/ 错选零惩罚（计重试停留本题，重点后推进）
   ④ r27 单元：谱对账（SPEC 独立字面副本 vs 引擎谱/模板/保留基线六关）+
     新形态性质（dualP 合成周期 6 互异 / compound 半对干扰轴性质 / 正式谱零低段
     模板 / 中间缺失非末位 / 最长序列=8）
   ⑤ UI 路径 autoSolve 通关关 0（真实 pick+动画管线，提速）
   ⑥ 布局抽查：最长序列实建 DOM，卡 ≥64、选项 ≥80、无横向溢出 */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {};
  let npass = 0, total = 0;
  const strip = L => ({ ch: L.ch, quizzes: L.quizzes.map(q => ({ len: q.len, miss: q.missingIdx, seq: q.seq, items: q.items, correctIdx: q.correctIdx })) });
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = makeLevel(flat), L2 = makeLevel(flat), tmp = makeLevel(flat);
    const det = JSON.stringify(strip(L1)) === JSON.stringify(strip(L2));
    let ruleOk = true, uniqOk = true, distinctOk = true, outOk = true;
    L1.quizzes.forEach(q => {
      for (let i = 0; i < q.len; i++) { // ① 规律正确性：程序按 ruleAt 推断
        const exp = ruleAt(q.rule, i);
        if (i === q.missingIdx) { if (!sameItem(exp, q.answer)) ruleOk = false; }
        else if (!sameItem(exp, q.seq[i])) ruleOk = false;
      }
      if (q.rule.kind === 'dual' || q.rule.kind === 'dualP') { // 双维度：两轴分别校验（含 answer 位；dualP 两轴周期不同长）
        const sp = q.rule.shapes.length, cp = q.rule.colors.length;
        for (let i = 0; i < q.len; i++) {
          const at = i === q.missingIdx ? q.answer : q.seq[i];
          if (at.shape !== q.rule.shapes[i % sp] || at.color !== q.rule.colors[i % cp]) ruleOk = false;
        }
      }
      if (q.rule.kind === 'compound') { // 复合：形状轴交替 + 数量轴等差 + 固定颜色，三轴分别校验
        for (let i = 0; i < q.len; i++) {
          const at = i === q.missingIdx ? q.answer : q.seq[i];
          if (at.shape !== q.rule.shapes[i % 2] || at.color !== q.rule.color ||
              at.count !== q.rule.start + q.rule.step * i) ruleOk = false;
        }
      }
      // r27 谱对账：每题几何（len/miss/kind）与模板表逐题一致（防模板表与谱漂移）
      if (!q.tk || !QUIZ_T[q.tk] || q.len !== QUIZ_T[q.tk].total ||
          q.missingIdx !== QUIZ_T[q.tk].miss || q.rule.kind !== QUIZ_T[q.tk].kind) ruleOk = false;
      // ② 唯一性：answer 在 items 中恰一次且 correctIdx 指向它；三项互异
      if (q.correctIdx < 0 || !sameItem(q.items[q.correctIdx], q.answer)) uniqOk = false;
      if (q.items.filter(it => sameItem(it, q.answer)).length !== 1) uniqOk = false;
      if (new Set(q.items.map(itemKey)).size !== 3) distinctOk = false;
      // ③ 干扰项取自同池且规律外（≠ruleAt 任何输出）
      const outs = ruleOutputs(q.rule, q.len).map(itemKey);
      q.items.forEach((it, i) => { if (i !== q.correctIdx && outs.indexOf(itemKey(it)) >= 0) outOk = false; });
    });
    // ④ autoSolve 引擎直驱通关
    let solveOk = true;
    while (!engWon(tmp)) {
      const q = tmp.quizzes[tmp.qi];
      if (engPick(tmp, q.correctIdx) !== 'correct') { solveOk = false; break; }
    }
    if (tmp.misses !== 0) solveOk = false;
    const ok = det && ruleOk && uniqOk && distinctOk && outOk && solveOk;
    if (ok) npass++;
    const rec = { ch: L1.ch, quizzes: L1.quizzes.length, det, ruleOk, uniqOk, distinctOk, outOk, solveOk, ok };
    if (flat < 20) levels[keyOf(flat)] = rec;
    else gen[flat] = Object.assign({ key: keyOf(flat) }, rec);
  }
  /* 单元 1：星级映射（全对 3 / ≤3 重试 2 / 否则 1，永不 0） */
  total++;
  const s = m => engStars({ misses: m });
  const starsOk = s(0) === 3 && s(3) === 2 && s(4) === 1 && s(99) === 1;
  if (starsOk) npass++;
  units.stars = { ok: starsOk, map: { 0: s(0), 3: s(3), 4: s(4), 99: s(99) } };
  /* 单元 2：错选零惩罚（计一次重试、停留本题），重点正确后推进 */
  total++;
  const L = makeLevel(2);
  const w1 = engPick(L, (L.quizzes[0].correctIdx + 1) % 3);
  const stayed = w1 === 'wrong' && L.misses === 1 && L.qi === 0;
  const w2 = engPick(L, L.quizzes[0].correctIdx);
  const advanced = w2 === 'correct' && L.qi === 1;
  const wrongOk = stayed && advanced;
  if (wrongOk) npass++;
  units.wrongPick = { ok: wrongOk, stayed, advanced };
  /* 单元 3（r27）：谱对账——SPEC 独立字面副本 vs 引擎（谱/模板/保留基线被改而本表未同步即红） */
  total++;
  const specOk = (function () {
    const TPL = { // 模板几何+kind 独立副本（含 cycle 的 pat）
      AB_END: { kind: 'cycle', pat: [0, 1], total: 5, miss: 4 },
      ABB_END: { kind: 'cycle', pat: [0, 1, 1], total: 6, miss: 5 },
      ABC_END: { kind: 'cycle', pat: [0, 1, 2], total: 6, miss: 5 },
      ABCD_END: { kind: 'cycle', pat: [0, 1, 2, 3], total: 8, miss: 7 },
      ABC_MID: { kind: 'cycle', pat: [0, 1, 2], total: 7, miss: 4 },
      ABCD_MID: { kind: 'cycle', pat: [0, 1, 2, 3], total: 7, miss: 4 },
      ABBC_END: { kind: 'cycle', pat: [0, 1, 1, 2], total: 8, miss: 7 },
      ABBC_MID: { kind: 'cycle', pat: [0, 1, 1, 2], total: 8, miss: 5 },
      DUAL_END: { kind: 'dual', total: 5, miss: 4 },
      DUAL_MID: { kind: 'dual', total: 5, miss: 2 },
      DUALP_END: { kind: 'dualP', total: 6, miss: 5 },
      DUALP_MID: { kind: 'dualP', total: 6, miss: 3 },
      CNT_UP1: { kind: 'count', total: 5, miss: 4 },
      CNT_DN1: { kind: 'count', total: 5, miss: 4 },
      CNT_UP2: { kind: 'count', total: 5, miss: 4 },
      CNT_UP1M: { kind: 'count', total: 5, miss: 2 },
      CMP_END: { kind: 'compound', total: 5, miss: 4 },
      CMP_MID: { kind: 'compound', total: 5, miss: 2 },
      CMP2_END: { kind: 'compound', total: 5, miss: 4 }
    };
    const SPEC_T27_STATIC = [ // r27 静态 20 关谱独立副本
      ['AB_END', 'ABB_END', 'ABC_END'],
      ['ABC_END', 'ABC_MID', 'ABC_END'],
      ['ABC_END', 'DUAL_END', 'ABBC_END'],
      ['ABCD_END', 'ABC_END', 'DUAL_END'],
      ['ABCD_END', 'ABBC_END', 'DUAL_MID'],
      ['ABC_MID', 'ABBC_END', 'ABC_MID', 'ABBC_END'],
      ['ABCD_MID', 'ABC_MID', 'DUAL_MID', 'ABBC_END'],
      ['ABCD_MID', 'ABBC_END', 'DUAL_END', 'ABBC_MID'],
      ['ABBC_MID', 'ABCD_MID', 'ABC_MID', 'DUAL_MID'],
      ['ABCD_MID', 'ABBC_MID', 'DUAL_MID', 'ABC_END'],
      ['DUAL_END', 'DUAL_END', 'DUAL_MID', 'DUAL_END'],
      ['DUAL_END', 'DUAL_MID', 'DUAL_END', 'DUAL_MID'],
      ['DUAL_MID', 'DUAL_END', 'DUAL_END', 'DUAL_MID'],
      ['DUAL_END', 'DUAL_MID', 'DUAL_MID', 'DUAL_END'],
      ['DUAL_END', 'DUALP_END', 'DUAL_MID', 'DUALP_END'],
      ['CNT_UP1', 'CNT_UP1', 'CNT_DN1', 'CNT_UP1', 'CNT_UP1'],
      ['CNT_UP1', 'CNT_DN1', 'CNT_UP2', 'CNT_UP1', 'CNT_DN1'],
      ['CMP_END', 'CNT_UP2', 'CNT_DN1', 'CMP_MID', 'CMP_END'],
      ['CNT_UP2', 'CMP2_END', 'CNT_DN1', 'CMP_MID', 'CMP_END'],
      ['CMP2_END', 'CNT_UP1M', 'CMP_MID', 'CNT_UP2', 'CMP_END']
    ];
    const SPEC_T27_GEN = [ // r27 生成关主题池独立副本（审查M1 r27：theme0 池 ABB_END→DUAL_END
      // ——原池回混低段模板与 §R1「ABB 仅 flat0 坡度」声明矛盾，合审计原判全退役）
      ['ABC_END', 'ABBC_END', 'ABCD_END', 'ABC_MID', 'DUAL_END'],
      ['ABCD_MID', 'ABBC_MID', 'DUAL_END', 'ABC_MID', 'DUAL_MID'],
      ['DUAL_END', 'DUAL_MID', 'DUALP_END', 'DUALP_MID'],
      ['CNT_UP1', 'CNT_DN1', 'CNT_UP2', 'CNT_UP1M', 'CMP_END', 'CMP_MID', 'CMP2_END']
    ];
    // 图标预算对账：cycle=实借数 max(pat)+1（=pat 去重数——pat 是池位索引连续从 0 起，
    // [0,1,1] 去重 {0,1} 恰 max+1=2；试玩P3-4 r27 勘误：审查M2 首判与主线首轮修复均误算
    // max([0,1,1])=2，实为 1→实借 2，COST 曾误改 3 已回精确口径 2）、dual/dualP=2、count=1、
    // compound=2——每关前缀和恒 ≤12（材料袋 12 枚整级借出，超限=take 返短崩溃）；生成池按
    // CH_QUIZN 窗口全旋转枚举同检（谱动预算不动=红，防未来改谱复发本崩类）
    const COST = { AB_END: 2, ABB_END: 2, ABC_END: 3, ABC_MID: 3, ABCD_END: 4, ABCD_MID: 4,
      ABBC_END: 3, ABBC_MID: 3, DUAL_END: 2, DUAL_MID: 2, DUALP_END: 2, DUALP_MID: 2,
      CNT_UP1: 1, CNT_DN1: 1, CNT_UP2: 1, CNT_UP1M: 1, CMP_END: 2, CMP_MID: 2, CMP2_END: 2 };
    const prefixOk = tks => tks.every((_, i) => tks.slice(0, i + 1).reduce((s, t) => s + COST[t], 0) <= 12);
    if (!STATIC_SPECS.every(prefixOk)) return false;
    let genBudgetOk = true;
    SPEC_T27_GEN.forEach(function (pool, ti) {
      const n = [3, 4, 4, 5][ti];
      for (let s = 0; s < pool.length; s++) {
        const win = [];
        for (let i = 0; i < n; i++) win.push(pool[(s + i) % pool.length]);
        if (!prefixOk(win)) genBudgetOk = false;
      }
    });
    if (!genBudgetOk) return false;
    if (JSON.stringify(Object.keys(QUIZ_T).sort()) !== JSON.stringify(Object.keys(TPL).sort())) return false;
    for (const k in TPL) {
      if (QUIZ_T[k].kind !== TPL[k].kind || QUIZ_T[k].total !== TPL[k].total || QUIZ_T[k].miss !== TPL[k].miss) return false;
      if (TPL[k].pat && JSON.stringify(QUIZ_T[k].pat) !== JSON.stringify(TPL[k].pat)) return false;
    }
    if (JSON.stringify(STATIC_SPECS) !== JSON.stringify(SPEC_T27_STATIC)) return false;
    if (JSON.stringify(CH_TPL) !== JSON.stringify(SPEC_T27_GEN) || JSON.stringify(CH_QUIZN) !== JSON.stringify([3, 4, 4, 5])) return false;
    const BASE = { // 保留基线谱字面副本（r27 前原谱——六关必须原样，改一字即红）
      10: ['DUAL_END', 'DUAL_END', 'DUAL_MID', 'DUAL_END'],
      11: ['DUAL_END', 'DUAL_MID', 'DUAL_END', 'DUAL_MID'],
      12: ['DUAL_MID', 'DUAL_END', 'DUAL_END', 'DUAL_MID'],
      13: ['DUAL_END', 'DUAL_MID', 'DUAL_MID', 'DUAL_END'],
      15: ['CNT_UP1', 'CNT_UP1', 'CNT_DN1', 'CNT_UP1', 'CNT_UP1'],
      16: ['CNT_UP1', 'CNT_DN1', 'CNT_UP2', 'CNT_UP1', 'CNT_DN1']
    };
    for (const f in BASE) if (JSON.stringify(STATIC_SPECS[f]) !== JSON.stringify(BASE[f])) return false;
    return STATIC_SPECS[0][0] === 'AB_END'; // 教学链首题锚
  })();
  if (specOk) npass++;
  units.spec27 = { ok: specOk };
  /* 单元 4（r27）：新形态性质——dualP 独立双轴 / compound 半对干扰 / 谱上探锚 / 序列长度 */
  total++;
  let nk = true, longest = 0;
  const flatKinds = {}, flatTks = {};
  for (let f = 0; f < 40; f++) {
    const L = makeLevel(f);
    flatKinds[f] = L.quizzes.map(q => q.rule.kind);
    flatTks[f] = L.quizzes.map(q => q.tk);
  }
  if (flatTks[14].indexOf('DUALP_END') < 0) nk = false;                                // ch3 章末 dualP
  [17, 18, 19].forEach(f => { if (flatKinds[f].indexOf('compound') < 0) nk = false; });   // 静态复合关
  [30, 31, 32, 33, 34].forEach(f => { if (flatKinds[f].indexOf('dualP') < 0) nk = false; }); // 生成关 theme2
  [35, 36, 37, 38, 39].forEach(f => { if (flatKinds[f].indexOf('compound') < 0) nk = false; }); // 生成关 theme3
  for (let f = 1; f < 40; f++) { // 零低段模板全域断言（审查M1 r27 扩生成关：AB/ABB 限 flat0
    // 坡度、AABB/AB_MID 全退役——原 flat1-9 范围漏生成关，theme0 池曾回混 ABB 无断言拦截）
    flatTks[f].forEach(tk => { if (tk === 'AB_END' || tk === 'ABB_END' || tk === 'AABB_END' || tk === 'AB_MID') nk = false; });
  }
  for (let f = 0; f < 40; f++) makeLevel(f).quizzes.forEach(q => {
    longest = Math.max(longest, q.len);
    if (/_MID$/.test(q.tk) && !(q.missingIdx >= 2 && q.missingIdx < q.len - 1)) nk = false; // 中间缺失=非末位
    if (q.rule.kind === 'dualP') { // 合成周期 6 且 6 项互异（颜色轴若退化回 2 → 仅 2 项 → 红）
      if (rulePeriod(q.rule) !== 6 || new Set(ruleOutputs(q.rule, 6).map(itemKey)).size !== 6) nk = false;
    }
    if (q.rule.kind === 'compound') { // 复合：数量轴全程 1-9 + 半对干扰轴性质（d1 形错数对 / d2 形对数错且规律外）
      const outs = ruleOutputs(q.rule, q.len);
      const usedC = outs.map(o => o.count);
      if (outs.some(o => o.count < 1 || o.count > 9)) nk = false;
      if (rulePeriod(q.rule) !== 2) nk = false;
      const wrongs = q.items.filter((it, i) => i !== q.correctIdx);
      if (!wrongs.some(w => w.count === q.answer.count && w.shape !== q.answer.shape)) nk = false;
      if (!wrongs.some(w => w.shape === q.answer.shape && w.count !== q.answer.count && usedC.indexOf(w.count) < 0)) nk = false;
      if (wrongs.some(w => w.color !== q.rule.color)) nk = false;
    }
  });
  if (longest !== 8) nk = false; // 序列长度上探锚（ABCD/ABBC=8 卡）
  if (nk) npass++;
  units.newKinds = { ok: nk, longest: longest };
  /* 单元 5：UI 路径 autoSolve 通关关 0（真实 pick/翻开/回放管线） */
  total++;
  startLevel(0);
  await autoSolveAsync();
  const uiOk = !!(cur && cur.won && engStars(cur) === 3 && cur.misses === 0);
  if (uiOk) npass++;
  units.autoSolveUI = { ok: uiOk, misses: cur.misses, stars: engStars(cur) };
  /* 布局抽查：40 关里最长序列实建 DOM 量尺寸 */
  let big = null;
  for (let f = 0; f < 40; f++) {
    makeLevel(f).quizzes.forEach(q => { if (!big || q.len > big.len) big = q; });
  }
  cur = { flat: 0, ch: 1, quizzes: [big], qi: 0, misses: 0, won: false };
  state = { locked: false, won: false, demo: false, tut: 'none' };
  renderQuiz();
  const de = document.documentElement;
  const card0 = seqEl.querySelector('.seqcard').getBoundingClientRect();
  const ch0 = choicesEl.querySelector('.choice').getBoundingClientRect();
  const layout = {
    overflowX: de.scrollWidth - window.innerWidth,
    cardW: Math.round(card0.width), cardH: Math.round(card0.height),
    choiceW: Math.round(ch0.width), choiceH: Math.round(ch0.height), cards: big.len
  };
  const layoutOk = layout.overflowX <= 0 && layout.cardW >= 64 && layout.cardH >= 64 &&
    layout.choiceW >= 80 && layout.choiceH >= 80;
  const out = { game: 'pattern', total, pass: npass, layoutOk, layout, levels, gen, units };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

/* ================= autoSolve：经 pick 真实管线通关当前关 ================= */
async function autoSolveAsync() {
  let guard = 0;
  while (cur && !cur.won && guard++ < 80) {
    const q = cur.quizzes[cur.qi];
    if (!q) break;
    pick(q.correctIdx);
    await settleP;
    await wait(30);
  }
  return !!(cur && cur.won);
}

/* ================= 启动 ================= */
buildStatic();
if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  runVerify();
} else {
  KIDS.init({ game: 'pattern', title: '规律侦探' });
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  let first = 0;
  for (let i = 0; i < lim; i++) { if (!sv.levels[keys[i]]) { first = i; break; } }
  if (lim > 0 && KIDS.calendar.dayDone(keys)) { // 今日新关已玩完：先收尾画面（可关闭继续重玩）
    KIDS.ui.dayEnd({ nextHint: nextHint(null) });
    first = 0;
  }
  startLevel(first);
}

/* ================= 验收钩子 ================= */
window.PAT = {
  get currentLevel() {
    return cur ? {
      flat: cur.flat,
      ch: Math.floor(cur.flat / CH_LEN) + 1,   // 章号 1 基
      lv: cur.flat % CH_LEN,
      qi: cur.qi, quizCount: cur.quizzes.length,
      misses: cur.misses, won: cur.won
    } : null;
  },
  quiz() {
    if (!cur) return null;
    const q = cur.quizzes[Math.min(cur.qi, cur.quizzes.length - 1)];
    if (!q) return null;
    return {
      seq: q.seq.map((it, i) => (i === q.missingIdx ? null : it)), // 缺失位为 null
      items: q.items.map(cloneItem),
      answer: cloneItem(q.answer),
      missingIdx: q.missingIdx,
      answerIdx: q.correctIdx,
      kind: q.rule.kind,   // r27：规律族（cycle/dual/dualP/count/compound）——新形态测试锚
      tk: q.tk,            // r27：题型模板名——谱回归锚
      len: q.len
    };
  },
  pick(i) { return pick(i); },
  autoSolve() { return autoSolveAsync(); },
  start(f) { startLevel(f); },
  get tutorial() { return state.tut; }
};
