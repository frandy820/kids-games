<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>描红数字</title>
<style>
/* ================= 描红数字 trace r5（batch24，自推笔顺+听数选字+镜像辨析）=================
   视觉按家族 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边；
   触摸目标：锚点圆 64x64（命中半径 32px，SPEC-BATCH24 §0.56）、数字卡 ≥64、底栏按钮 ≥64；
   r5 自推：仅起点呼吸（.current 恒挂 0 号锚）、ends 模式终点静态标记（.endmark 绿环），
   中间锚点=浅虚圆永不发光；选卡题：#cards 卡行（listen 数字卡 / mirror 变体卡）+#ask 问号板。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏：logo + 进度点 ---------- */
#hud{flex:0 0 68px;display:flex;align-items:center;padding:6px 12px 0;gap:10px}
#logo{width:42px;height:42px;border-radius:12px;background:#F2C9A0;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto;justify-content:center}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：兔子 + 状态泡 ---------- */
#stage{flex:0 0 auto;min-height:104px;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:2px 12px;overflow:hidden}
#rabbit-box{position:relative;width:104px;height:96px;flex:0 0 auto}
#rabbit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#rabbit svg{width:88px;height:88px}
#rabbit.dance{animation:tr-dance 1.1s ease}
@keyframes tr-dance{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-8deg) translateY(-10px)}
  40%{transform:rotate(8deg)}60%{transform:rotate(-6deg) translateY(-8px)}80%{transform:rotate(6deg)}}
#bubble{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .25s}
#bubble.pulse{animation:tr-bpulse .8s ease}
@keyframes tr-bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---------- r5 选卡行（listen 数字卡 / mirror 变体卡；仅 pick 相位显示） ---------- */
#cards{flex:0 0 auto;display:none;align-items:center;justify-content:center;gap:18px;
  padding:4px 14px 8px;overflow:hidden}
#cards.bump{animation:tr-bump .22s ease}
#cards.pulse{animation:tr-bpulse .8s ease}
.card{width:84px;height:84px;border-radius:18px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,opacity .3s}
.card:active{transform:translateY(3px)}
.card .g{font-size:56px;font-weight:800;color:#4A3B2E;line-height:1}
.g.v-m{transform:scaleX(-1)}             /* 左右镜像（v-* 挂内层 .g——r5 试玩 P1 修正选择器） */
.g.v-r{transform:rotate(180deg)}         /* 倒置（6↔9、2↔5） */
.g.v-f{transform:scaleY(-1)}             /* 上下翻转（倒置 3 亦经 r/f 呈现） */
.card.ok{border-color:#57B368;background:#EAF4E2}
.card.ok .g{color:#57B368}
.card.ok{animation:tr-cpop .45s ease}
@keyframes tr-cpop{0%{transform:scale(1)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
.card.dim{opacity:.35}
.card.shake{animation:tr-cshake .5s ease}
@keyframes tr-cshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.card.rescued{animation:tr-resc 1s ease-in-out infinite !important;
  border-color:#E8483C;box-shadow:0 0 0 3px rgba(232,72,60,.25)}

/* ---------- 描红板：底图数字 + 骨架虚线 + 描红亮线 + 锚点 + r5 问号板 ---------- */
#board-wrap{flex:1 1 auto;min-height:180px;display:flex;align-items:center;justify-content:center;
  padding:8px 14px;overflow:hidden}
#board{position:relative;width:min(64vmin,440px);height:min(64vmin,440px);max-width:100%;max-height:100%;
  background:#FFF9EE;border:3.5px solid #4A3B2E;border-radius:26px;
  box-shadow:0 6px 0 #D8C9B4;touch-action:none}
#board.bump{animation:tr-bump .22s ease}
@keyframes tr-bump{0%,100%{transform:scale(1)}45%{transform:scale(.985)}}
#board svg{position:absolute;inset:0;width:100%;height:100%}
#ghost-num{fill:#F0E4CC;stroke:none;font-weight:800;font-family:inherit}
#skeleton{fill:none;stroke:#D8C9B4;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:0.5 4.5}
#lit{fill:none;stroke:#E8975A;stroke-width:5.4;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke-dasharray .3s ease}
#demo-path{fill:none;stroke:#4E8FD0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;
  opacity:.85;display:none}
#lit.full{stroke:#57B368;stroke-width:6;filter:drop-shadow(0 0 6px rgba(114,182,94,.75));
  animation:tr-fullglow 1.1s ease}
@keyframes tr-fullglow{0%{filter:drop-shadow(0 0 2px rgba(114,182,94,.3))}
  50%{filter:drop-shadow(0 0 14px rgba(114,182,94,.95))}100%{filter:drop-shadow(0 0 6px rgba(114,182,94,.75))}}
#ask{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;
  border-radius:50%;background:#F2C9A0;border:3px solid #4A3B2E;display:none;
  align-items:center;justify-content:center;z-index:1}
#ask.pulse{animation:tr-bpulse .8s ease}

/* 锚点：64x64 命中区 + 中心视觉圆；r5 状态：current（起点呼吸，恒 0 号锚）/
   endmark（ends 模式终点静态绿环）/ done（绿实心）/ future（浅虚圆） */
.anchor{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;z-index:2;border-radius:50%}
.anchor .dot{width:26px;height:26px;border-radius:50%;border:3px dashed #C9B694;background:#FBF4E4;
  transition:all .2s;pointer-events:none}
.anchor.current{z-index:5}
.anchor.current .dot{width:32px;height:32px;border:3.5px solid #E8975A;background:#F2C9A0;
  animation:tr-breathe 1.2s ease-in-out infinite}
@keyframes tr-breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(232,151,90,0)}
  50%{transform:scale(1.28);box-shadow:0 0 20px rgba(232,151,90,.85)}}
.anchor.endmark{z-index:4}
.anchor.endmark .dot{width:30px;height:30px;border:3.5px solid #8FBF7F;background:#EAF4E2}
.anchor.done{z-index:1}
.anchor.done .dot{width:22px;height:22px;border:3px solid #4A3B2E;background:#8FBF7F;
  animation:none;transform:scale(1)}
.anchor.done .dot.pop{animation:tr-pop .4s ease}
@keyframes tr-pop{0%{transform:scale(.6)}55%{transform:scale(1.4)}100%{transform:scale(1)}}
.anchor.flash .dot{animation:tr-flash .5s ease !important}
@keyframes tr-flash{0%,100%{background:#F2C9A0;box-shadow:0 0 0 rgba(232,151,90,0)}
  40%,60%{background:#E8975A;box-shadow:0 0 18px rgba(232,151,90,.9)}}
.anchor.shake .dot{animation:tr-ashake .5s ease !important}
@keyframes tr-ashake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.anchor.rescued .dot{animation:tr-resc 1s ease-in-out infinite !important;
  border-style:solid;border-color:#E8483C}
@keyframes tr-resc{0%,100%{transform:scale(1.15);box-shadow:0 0 8px rgba(232,72,60,.55)}
  50%{transform:scale(1.55);box-shadow:0 0 26px rgba(232,72,60,.95)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:6px 18px 12px;gap:34px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:68px;height:68px}
#btn-rabbit.hop{animation:tr-hop .45s ease 2}
@keyframes tr-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-demo{width:76px;height:76px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-demo:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-demo svg{width:44px;height:44px}
#btn-demo.bounce{animation:tr-rb .45s ease}
@keyframes tr-rb{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，教学演示/帮/答案级救援共用；照 batch23/piano） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：板与舞台收紧仍保锚点/卡 64 命中 */
@media (orientation:portrait){
  #hud{flex-basis:60px}
  #stage{min-height:88px;gap:6px;padding:2px 8px}
  #rabbit-box{width:84px;height:78px}
  #rabbit svg{width:72px;height:72px}
  #bubble{width:56px;height:56px}
  #cards{gap:12px;padding:2px 10px 6px}
  .card{width:72px;height:72px;border-radius:15px}
  .card .g{font-size:46px}
  #board-wrap{padding:6px 10px}
  #board{width:min(86vmin,420px);height:min(86vmin,420px)}
}
</style>
</head>
<body>
<div id="game" aria-label="描红数字">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="rabbit-box" aria-hidden="true"><div id="rabbit"></div></div>
    <div id="bubble" aria-hidden="true"></div>
  </div>
  <div id="cards" aria-label="数字卡"></div>
  <div id="board-wrap">
    <div id="board" aria-label="描红板">
      <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <text id="ghost-num" x="50" y="52" text-anchor="middle" dominant-baseline="central"></text>
        <path id="skeleton" d=""></path>
        <path id="lit" d=""></path>
        <path id="demo-path" d=""></path>
      </svg>
      <div id="ask" aria-label="再听一次" role="button"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-demo" aria-label="看笔顺"></button>
    <button id="btn-rabbit" aria-label="小兔子"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
