<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>描红数字</title>
<style>
/* ================= 描红数字 trace r5（batch24，自推笔顺+听数选字+镜像辨析）=================
   视觉按家族 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边；
   触摸目标：锚点圆 64x64（命中半径 32px，SPEC-BATCH24 §0.56）、数字卡 ≥64、底栏按钮 ≥64；
   r5 自推：仅起点呼吸（.current 恒挂 0 号锚）、ends 模式终点静态标记（.endmark 绿环），
   中间锚点=浅虚圆永不发光；选卡题：#cards 卡行（listen 数字卡 / mirror 变体卡）+#ask 问号板。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏：logo + 进度点 ---------- */
#hud{flex:0 0 68px;display:flex;align-items:center;padding:6px 12px 0;gap:10px}
#logo{width:42px;height:42px;border-radius:12px;background:#F2C9A0;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto;justify-content:center}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：兔子 + 状态泡 ---------- */
#stage{flex:0 0 auto;min-height:104px;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:2px 12px;overflow:hidden}
#rabbit-box{position:relative;width:104px;height:96px;flex:0 0 auto}
#rabbit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#rabbit svg{width:88px;height:88px}
#rabbit.dance{animation:tr-dance 1.1s ease}
@keyframes tr-dance{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-8deg) translateY(-10px)}
  40%{transform:rotate(8deg)}60%{transform:rotate(-6deg) translateY(-8px)}80%{transform:rotate(6deg)}}
#bubble{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .25s}
#bubble.pulse{animation:tr-bpulse .8s ease}
@keyframes tr-bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---------- r5 选卡行（listen 数字卡 / mirror 变体卡；仅 pick 相位显示） ---------- */
#cards{flex:0 0 auto;display:none;align-items:center;justify-content:center;gap:18px;
  padding:4px 14px 8px;overflow:hidden}
#cards.bump{animation:tr-bump .22s ease}
#cards.pulse{animation:tr-bpulse .8s ease}
.card{width:84px;height:84px;border-radius:18px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,opacity .3s}
.card:active{transform:translateY(3px)}
.card .g{font-size:56px;font-weight:800;color:#4A3B2E;line-height:1}
.g.v-m{transform:scaleX(-1)}             /* 左右镜像（v-* 挂内层 .g——r5 试玩 P1 修正选择器） */
.g.v-r{transform:rotate(180deg)}         /* 倒置（6↔9、2↔5） */
.g.v-f{transform:scaleY(-1)}             /* 上下翻转（倒置 3 亦经 r/f 呈现） */
.card.ok{border-color:#57B368;background:#EAF4E2}
.card.ok .g{color:#57B368}
.card.ok{animation:tr-cpop .45s ease}
@keyframes tr-cpop{0%{transform:scale(1)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
.card.dim{opacity:.35}
.card.shake{animation:tr-cshake .5s ease}
@keyframes tr-cshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.card.rescued{animation:tr-resc 1s ease-in-out infinite !important;
  border-color:#E8483C;box-shadow:0 0 0 3px rgba(232,72,60,.25)}

/* ---------- 描红板：底图数字 + 骨架虚线 + 描红亮线 + 锚点 + r5 问号板 ---------- */
#board-wrap{flex:1 1 auto;min-height:180px;display:flex;align-items:center;justify-content:center;
  padding:8px 14px;overflow:hidden}
#board{position:relative;width:min(64vmin,440px);height:min(64vmin,440px);max-width:100%;max-height:100%;
  background:#FFF9EE;border:3.5px solid #4A3B2E;border-radius:26px;
  box-shadow:0 6px 0 #D8C9B4;touch-action:none}
#board.bump{animation:tr-bump .22s ease}
@keyframes tr-bump{0%,100%{transform:scale(1)}45%{transform:scale(.985)}}
#board svg{position:absolute;inset:0;width:100%;height:100%}
#ghost-num{fill:#F0E4CC;stroke:none;font-weight:800;font-family:inherit}
#skeleton{fill:none;stroke:#D8C9B4;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:0.5 4.5}
#lit{fill:none;stroke:#E8975A;stroke-width:5.4;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke-dasharray .3s ease}
#demo-path{fill:none;stroke:#4E8FD0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;
  opacity:.85;display:none}
#lit.full{stroke:#57B368;stroke-width:6;filter:drop-shadow(0 0 6px rgba(114,182,94,.75));
  animation:tr-fullglow 1.1s ease}
@keyframes tr-fullglow{0%{filter:drop-shadow(0 0 2px rgba(114,182,94,.3))}
  50%{filter:drop-shadow(0 0 14px rgba(114,182,94,.95))}100%{filter:drop-shadow(0 0 6px rgba(114,182,94,.75))}}
#ask{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;
  border-radius:50%;background:#F2C9A0;border:3px solid #4A3B2E;display:none;
  align-items:center;justify-content:center;z-index:1}
#ask.pulse{animation:tr-bpulse .8s ease}

/* 锚点：64x64 命中区 + 中心视觉圆；r5 状态：current（起点呼吸，恒 0 号锚）/
   endmark（ends 模式终点静态绿环）/ done（绿实心）/ future（浅虚圆） */
.anchor{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;z-index:2;border-radius:50%}
.anchor .dot{width:26px;height:26px;border-radius:50%;border:3px dashed #C9B694;background:#FBF4E4;
  transition:all .2s;pointer-events:none}
.anchor.current{z-index:5}
.anchor.current .dot{width:32px;height:32px;border:3.5px solid #E8975A;background:#F2C9A0;
  animation:tr-breathe 1.2s ease-in-out infinite}
@keyframes tr-breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(232,151,90,0)}
  50%{transform:scale(1.28);box-shadow:0 0 20px rgba(232,151,90,.85)}}
.anchor.endmark{z-index:4}
.anchor.endmark .dot{width:30px;height:30px;border:3.5px solid #8FBF7F;background:#EAF4E2}
.anchor.done{z-index:1}
.anchor.done .dot{width:22px;height:22px;border:3px solid #4A3B2E;background:#8FBF7F;
  animation:none;transform:scale(1)}
.anchor.done .dot.pop{animation:tr-pop .4s ease}
@keyframes tr-pop{0%{transform:scale(.6)}55%{transform:scale(1.4)}100%{transform:scale(1)}}
.anchor.flash .dot{animation:tr-flash .5s ease !important}
@keyframes tr-flash{0%,100%{background:#F2C9A0;box-shadow:0 0 0 rgba(232,151,90,0)}
  40%,60%{background:#E8975A;box-shadow:0 0 18px rgba(232,151,90,.9)}}
.anchor.shake .dot{animation:tr-ashake .5s ease !important}
@keyframes tr-ashake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.anchor.rescued .dot{animation:tr-resc 1s ease-in-out infinite !important;
  border-style:solid;border-color:#E8483C}
@keyframes tr-resc{0%,100%{transform:scale(1.15);box-shadow:0 0 8px rgba(232,72,60,.55)}
  50%{transform:scale(1.55);box-shadow:0 0 26px rgba(232,72,60,.95)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:6px 18px 12px;gap:34px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:68px;height:68px}
#btn-rabbit.hop{animation:tr-hop .45s ease 2}
@keyframes tr-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-demo{width:76px;height:76px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-demo:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-demo svg{width:44px;height:44px}
#btn-demo.bounce{animation:tr-rb .45s ease}
@keyframes tr-rb{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，教学演示/帮/答案级救援共用；照 batch23/piano） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：板与舞台收紧仍保锚点/卡 64 命中 */
@media (orientation:portrait){
  #hud{flex-basis:60px}
  #stage{min-height:88px;gap:6px;padding:2px 8px}
  #rabbit-box{width:84px;height:78px}
  #rabbit svg{width:72px;height:72px}
  #bubble{width:56px;height:56px}
  #cards{gap:12px;padding:2px 10px 6px}
  .card{width:72px;height:72px;border-radius:15px}
  .card .g{font-size:46px}
  #board-wrap{padding:6px 10px}
  #board{width:min(86vmin,420px);height:min(86vmin,420px)}
}
</style>
</head>
<body>
<div id="game" aria-label="描红数字">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="rabbit-box" aria-hidden="true"><div id="rabbit"></div></div>
    <div id="bubble" aria-hidden="true"></div>
  </div>
  <div id="cards" aria-label="数字卡"></div>
  <div id="board-wrap">
    <div id="board" aria-label="描红板">
      <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <text id="ghost-num" x="50" y="52" text-anchor="middle" dominant-baseline="central"></text>
        <path id="skeleton" d=""></path>
        <path id="lit" d=""></path>
        <path id="demo-path" d=""></path>
      </svg>
      <div id="ask" aria-label="再听一次" role="button"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-demo" aria-label="看笔顺"></button>
    <button id="btn-rabbit" aria-label="小兔子"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function shuffleArr(arr, rnd) {              // Fisher-Yates（rnd 消耗 arr.length-1 次）
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = tr_ri(rnd, 0, i);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function listenCards(num, rnd) {            // 听数候选：[num]+近伙伴+随机补足 → 洗牌
  const cards = [num];
  const near = LISTEN_NEAR[num] || [];
  for (let k = 0; k < near.length && cards.length < 4; k++) {
    if (cards.indexOf(near[k]) < 0) cards.push(near[k]);
  }
  while (cards.length < 4) {                // 随机补足（拒绝重复——消耗次数不定但确定）
    const c = tr_ri(rnd, 1, 10);
    if (cards.indexOf(c) < 0) cards.push(c);
  }
  return shuffleArr(cards, rnd);
}
function mirrorCards(num, rnd) {            // 镜像候选：正体+3 变体（m/r/f 后缀）洗牌
  return shuffleArr([String(num), num + 'm', num + 'r', num + 'f'], rnd);
}
function mkTrace(num, mode) {
  const d = DIGITS[num];
  return { kind: 'trace', num: num,
           anchors: d.anchors.map(a => a.slice()), strokes: d.strokes.slice(),
           loop: d.loop, pos: 0, miss: 0, solved: false,
           phase: 'write', hintMode: mode, cards: null, right: -1 };
}
function mkPick(kind, num, cards, right) {
  const d = DIGITS[num];
  return { kind: kind, num: num,
           anchors: d.anchors.map(a => a.slice()), strokes: d.strokes.slice(),
           loop: d.loop, pos: 0, miss: 0, solved: false,
           phase: 'pick', hintMode: 'start', cards: cards, right: right };
}
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const quizzes = [];
  let pool = ALL10.slice();
  if (dch === 1) {                          // 自推笔顺 1-5：起点+终点
    const p = [1, 2, 3, 4, 5];
    const off = flat === 0 ? 0 : tr_ri(rnd, 0, 4);
    pool = p.slice();
    for (let i = 0; i < CH_LEN; i++) quizzes.push(mkTrace(p[(off + i) % 5], 'ends'));
  } else if (dch === 2) {                   // 自推笔顺 6-10：仅起点
    const p = [6, 7, 8, 9, 10];
    const off = tr_ri(rnd, 0, 4);
    pool = p.slice();
    for (let i = 0; i < CH_LEN; i++) quizzes.push(mkTrace(p[(off + i) % 5], 'start'));
  } else if (dch === 3) {                   // 听数选字+描（1-10 轮转）
    const off = tr_ri(rnd, 0, 9);
    for (let i = 0; i < CH_LEN; i++) {
      const num = ALL10[(off + i) % 10];
      const cards = listenCards(num, rnd);
      quizzes.push(mkPick('listen', num, cards, cards.indexOf(num)));
    }
  } else {                                  // 镜像辨析混出（固定型序）
    const kinds = ['mirror', 'listen', 'trace', 'mirror', 'trace'];
    const mOff = tr_ri(rnd, 0, MIRROR_POOL.length - 1);
    const lOff = tr_ri(rnd, 0, 9);
    const tOff = tr_ri(rnd, 0, 9);
    let mi = 0, li = 0, ti = 0;
    for (let k = 0; k < kinds.length; k++) {
      const kk = kinds[k];
      if (kk === 'mirror') {
        const num = MIRROR_POOL[(mOff + mi++) % MIRROR_POOL.length];
        const cards = mirrorCards(num, rnd);
        quizzes.push(mkPick('mirror', num, cards, cards.indexOf(String(num))));
      } else if (kk === 'listen') {
        const num = ALL10[(lOff + li++) % 10];
        const cards = listenCards(num, rnd);
        quizzes.push(mkPick('listen', num, cards, cards.indexOf(num)));
      } else {
        quizzes.push(mkTrace(ALL10[(tOff + ti++) % 10], 'start'));
      }
    }
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, pool: pool,
           quizzes: quizzes, step: 0, done: false, missTotal: 0 };
}

/* ---------- 点锚引擎（无 DOM）：engTapAnchor(L, 锚点序号 i) —— 自推笔顺比对
   'right'  点对且未到题尾（pos+1）
   'done'   点对且该题完成（还有后续题）
   'won'    末题完成 = 通关
   'wrong'  点错（i ≠ 当前锚点序号）：miss+1，pos 不进（不重头——§0.56 定版沿承）
   null     序号越界 / 关已结束 / 非 write 相位（选卡期点板无效） ---------- */
function engTapAnchor(L, i) {
  if (!L || L.done) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved || q.phase !== 'write') return null;
  if (!(i >= 0 && i < q.anchors.length)) return null;
  if (i === q.pos) {
    q.pos++;
    if (q.pos >= q.anchors.length) {
      q.solved = true;
      L.step++;
      if (L.step >= L.quizzes.length) { L.done = true; return 'won'; }
      return 'done';
    }
    return 'right';
  }
  q.miss++;
  L.missTotal++;
  return 'wrong';
}
/* ---------- 选卡引擎（r5 新题型）：engPickCard(L, 卡下标 i)
   'right'  选对 → phase 'pick'→'write'（进描红）
   'wrong'  选错：miss+1，phase 不变（重选）
   null     越界 / 非 pick 相位 / 关已结束 ---------- */
function engPickCard(L, i) {
  if (!L || L.done) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved || q.phase !== 'pick') return null;
  if (!(i >= 0 && i < q.cards.length)) return null;
  if (i === q.right) { q.phase = 'write'; return 'right'; }
  q.miss++;
  L.missTotal++;
  return 'wrong';
}
/* ---------- 错型分类（自推方向反馈真值，§7）：engWrongType(q, i)
   i>pos = 跳笔（点了后面的笔）→ 'skip'；
   i<pos = 逆笔（回点已写过的）→ 'back' + 期望段（pos→pos+1）主轴方向：
   |dy|>=|dx| 竖向（dy>0 'down' / dy<0 'up'），否则横向（dx>0 'right' / dx<0 'left'）。
   返回 null = i 不是错点。verify 从 SPEC 锚点表独立重算对账。 ---------- */
function engWrongType(q, i) {
  if (i === q.pos) return null;
  if (i > q.pos) return { type: 'skip', dir: null };
  const a = q.anchors, p = q.pos;
  const j = p + 1 < a.length ? p + 1 : a.length - 1;   // 末锚未点时=最后一段来向
  const k = j === p ? p - 1 : p;
  const dx = a[j][0] - a[k][0], dy = a[j][1] - a[k][1];
  const dir = Math.abs(dy) >= Math.abs(dx) ? (dy > 0 ? 'down' : 'up') : (dx > 0 ? 'right' : 'left');
  return { type: 'back', dir: dir };
}
const engWon = L => !!L && L.done;

/* ---------- 星级（SPEC §2/§7 定版）：失败尝试总数口径（点错+选错同计）
   0=3★ / 1-2=2★ / ≥3=1★。永不 0 星 ---------- */
const engStars = L => {
  const m = !L ? 0 : (L.missTotal || 0);
  return m === 0 ? 3 : (m <= 2 ? 2 : 1);
};

/* ---------- 结构校验（verify 用，返回失败原因或 null）
   题型封闭（dch1 全 trace-ends / dch2 全 trace-start / dch3 全 listen / dch4 固定型序）/
   数字在封闭池 / 锚点数 2-6 / 首锚方向（y<中位 或 x<左半）/ 笔数 4/5/7/10 ≥2 其余 1 /
   选卡题：4 卡唯一 / listen 近伙伴在场+right 指向 num / mirror 目标在池+变体集封闭+right 指正体 /
   初始 pos0 未解 ---------- */
function structWhy(q, dch, flat, qi, pool) {
  if (!q || typeof q.num !== 'number') return 'shape';
  const KINDS = ['trace', 'listen', 'mirror'];
  if (KINDS.indexOf(q.kind) < 0) return 'kind:' + q.kind;
  if (dch === 1 && !(q.kind === 'trace' && q.hintMode === 'ends')) return 'dch1:' + q.kind;
  if (dch === 2 && !(q.kind === 'trace' && q.hintMode === 'start')) return 'dch2:' + q.kind;
  if (dch === 3 && q.kind !== 'listen') return 'dch3:' + q.kind;
  if (dch === 4 && q.kind !== ['mirror', 'listen', 'trace', 'mirror', 'trace'][qi]) return 'dch4pat:' + qi;
  if (q.kind === 'listen' && ALL10.indexOf(q.num) < 0) return 'pool:' + q.num;
  if (q.kind === 'mirror' && MIRROR_POOL.indexOf(q.num) < 0) return 'mirpool:' + q.num;
  if (q.kind === 'trace' && pool.indexOf(q.num) < 0) return 'pool:' + q.num;
  const n = q.anchors.length;
  if (!(n >= 2 && n <= 6)) return 'nanchors:' + n;
  const a0 = q.anchors[0];
  if (!(a0[1] < 50 || a0[0] < 50)) return 'startdir:' + q.num;
  const multi = [4, 5, 7, 10].indexOf(q.num) >= 0;
  if (multi && q.strokes.length < 2) return 'strokes:' + q.num;
  if (!multi && q.strokes.length !== 1) return 'strokes1:' + q.num;
  if (q.strokes[0] !== 0) return 'strokes0:' + q.num;
  for (let k = 1; k < q.strokes.length; k++) if (q.strokes[k] <= q.strokes[k - 1]) return 'strokesasc:' + q.num;
  if (q.strokes[q.strokes.length - 1] >= n) return 'strokesrange:' + q.num;
  if (q.kind === 'trace' && q.phase !== 'write') return 'phase';
  if (q.kind !== 'trace') {
    if (q.phase !== 'pick') return 'phase';
    if (!Array.isArray(q.cards) || q.cards.length !== 4) return 'cards';
    if (Array.from(new Set(q.cards.map(String))).length !== 4) return 'cardsdup';
    if (!(q.right >= 0 && q.right < 4)) return 'right';
    if (q.kind === 'listen') {
      if (String(q.cards[q.right]) !== String(q.num)) return 'listenright';
      const near = LISTEN_NEAR[q.num] || [];
      if (near.length && !near.some(p => q.cards.indexOf(p) >= 0)) return 'near';
    } else {
      const want = new Set([String(q.num), q.num + 'm', q.num + 'r', q.num + 'f']);
      if (!q.cards.every(c => want.has(String(c)))) return 'mirset';
      if (String(q.cards[q.right]) !== String(q.num)) return 'mirright';
    }
  }
  if (q.pos !== 0 || q.solved || q.miss !== 0) return 'init';
  return null;
}
/* ================= trace 主逻辑 r5（自推笔顺 / 选卡题面 / 描红板渲染 / 教学 / 推进 / 救援）
   玩法流（SPEC-BATCH24 §7）：题型三族——
   trace 自推笔顺：只亮起点（ends 模式另挂终点静态绿环），中间笔序孩子自己判断；

   mirror 镜像辨析：queue(tra_m_q+tra_n)「哪个是正的六」→ 4 卡=同数字 3 变体

   题完成=完整描红线亮起+数词朗读（tra_n_<num>）+兔子跳；关完成=celebrate+写档星级。
   窗常量（game-data WIN，四处同步）：WRONG=1000 错点/错选防重入 / PICK_RIGHT=600 选对演出窗
   （hint2 语音并发不锁）/ DONE=4100 数词链窗。
   验收钩子：window.TR = { get currentLevel, get quiz, tapAnchor(i), tapCard(i), start(flat),

/* ================= 描红板渲染 =================
   锚点弧长表：path 采样找每锚最近点（首锚恒 0、末锚恒全长、单调强制——多笔 path 的
   M 跳变处弧长连续，笔序天然单调）；亮线=完整 path 按弧长 dasharray 延伸 */
function computeArc(pathEl, anchors) {
  const total = pathEl.getTotalLength();
  const N = 480, pts = [];
  for (let k = 0; k <= N; k++) {
    const p = pathEl.getPointAtLength(total * k / N);
    pts.push([p.x, p.y]);
  }
  const s = [];
  let lastS = 0;
  for (let i = 0; i < anchors.length; i++) {
    let si;
    if (i === 0) si = 0;
    else if (i === anchors.length - 1) si = total;
    else {
      let best = 0, bd = Infinity;
      for (let k = 0; k <= N; k++) {
        const dx = pts[k][0] - anchors[i][0], dy = pts[k][1] - anchors[i][1];
        const d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = k; }
      }
      si = total * best / N;
    }
    if (si <= lastS) si = Math.min(lastS + 0.01, total);   // 单调强制
    lastS = si;
    s.push(si);
  }
  return { total: total, s: s };
}
function setLit(q) {                            // 亮线延伸到已点亮的末锚

}

}
/* r5 自推锚点态（负向真值：中间锚点永不发光——verify 断言 class/animation 缺席）：

  skeletonEl.setAttribute('d', d.path);
  litEl.setAttribute('d', d.path);
  litEl.classList.remove('full');
  litEl.style.strokeDasharray = '0 ' + (arc.total + 2);
  arc = computeArc(litEl, q.anchors);
  setLit(q);
  for (let i = 0; i < q.anchors.length; i++) {
    const b = document.createElement('button');
    b.className = 'anchor';
    b.dataset.idx = String(i);
    b.setAttribute('aria-label', '第' + (i + 1) + '个点');
    b.style.left = q.anchors[i][0] + '%';
    b.style.top = q.anchors[i][1] + '%';
    b.innerHTML = '<span class="dot"></span>';
    boardEl.appendChild(b);
    anchorsEls.push(b);
  }
  renderAnchorStates(q);
}
function renderQuiz() {                         // 新题：按相位分流（pick=选卡 / write=描红板）
  const q = cur && !cur.done ? cur.quizzes[cur.step] : null;
  anchorsEls.forEach(el => el.remove());
  anchorsEls = [];
  cardsEl.classList.remove('pulse', 'bump');   // 清残留动画类（display none→flex 会重放旧动画）
  ghost.hide();
  if (!q) {
    cardsEl.style.display = 'none';
    askEl.style.display = 'none';
    return;
  }
  if (q.phase === 'pick') renderPick(q);
  else renderWrite(q);
  setBubble();
}
function renderStep() {                         // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  if (!cur) return;
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  if (!cur) return;
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 题面语音（r5：pick 题必播题面；write 题 flat<3 提示） ================= */
function stemParts(q) {                         // 听数/镜像题面链（queue 0.15s 段间停顿）
  return [{ key: q.kind === 'listen' ? VOICE.l_q.key : VOICE.m_q.key,
            text: q.kind === 'listen' ? VOICE.l_q.text : VOICE.m_q.text },
          { key: 'tra_n_' + q.num, text: numCn(q.num) }];
}
function playCue() {
  const q = cur && !cur.done ? cur.quizzes[cur.step] : null;
  if (!q) return;
  if (q.phase === 'pick') KIDS.voice.queue(stemParts(q));   // 题面必播（听觉题不播不可解）
  else sayP(VOICE.hint2);
}

/* ================= 点锚主路径（真实点击 / TR.tapAnchor / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（描红板 bump 微动效——家族 D）；
   busy=反馈占位锁（wrong 1000ms 防重入窗（WIN.WRONG 200+800）/ right 200ms，同步置位→紧邻点击必被拦） ================= */
async function uiTapAnchor(i, demo) {
  if (!cur || state.won) {
    sfx('pop'); replayAnim(boardEl, 'bump');
    return false;
  }
  if ((state.busy && !demo) || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop'); replayAnim(boardEl, 'bump');    // 教学演示期/演出窗=吞输入
    return false;
  }
  const run = cur;
  const r0 = engTapAnchor(cur, i);
  if (r0 === null) {                            // 序号越界/题已结束/选卡期点板
    sfx('pop'); replayAnim(boardEl, 'bump');
    return false;
  }
  lastAct = Date.now(); rescueDirDone = false; rescueAnsDone = false;
  anchorsEls.forEach(el => el.classList.remove('rescued'));   // 答案级救援视觉：动作即清
  cardEls().forEach(el => el.classList.remove('rescued'));
  ghost.hide();
  if (state.tut === 'help' && !demo) {          // 教学"独"：首次真点 → 放手
    state.tut = 'solo';
    danceRabbit();
  }
  state.busy = true;

  if (r0 === 'wrong') {                         // 点错：错锚 shake+错型方向反馈；pos 不进（不重头）
    await wait(200 * SPEED);
    if (cur === run) {
      const q = cur.quizzes[cur.step];
      if (q && !q.solved) {
        shakeAnchor(i);                         /* 所点错锚自身 shake（不 flash 正确锚=不泄答案，r5 核心） */
        const wt = engWrongType(q, i);
        const v = wt.type === 'skip' ? VOICE.w_wait : VOICE['w_' + (wt.dir || 'down')];
        KIDS.voice.play(v.key, v.text);         /* 方向反馈（核心反馈不受 flat 门） */
      }
    }
    await wait(800 * SPEED);                    /* 错点防重入 200+800=1000ms=WIN.WRONG（家族定案） */
    state.busy = false;
    return 'wrong';
  }

  /* 点对：连线延伸+轻音（音高逐锚递升——点击序号=推进后 pos-1）。
     done/won 时 engTapAnchor 已 step++：题引用取**刚完成的题**（step-1），数词按题内数字取 */
  const qCur = run.quizzes[Math.min(run.step, run.quizzes.length - 1)];
  const qRef = r0 !== 'right' ? run.quizzes[run.step - 1] : qCur;
  anchorNote(qRef.pos - 1);
  anchorDoneFx(i);
  setLit(qRef);
  renderAnchorStates(qRef);
  renderStep();
  await wait(200 * SPEED);                      /* right 路径缩短防连点吞 */
  if (r0 === 'right') { state.busy = false; return 'right'; }

  if (r0 === 'done') {                          // 题完成：描红线全亮+数词朗读+兔子跳 → 下一题
    litFull();
    danceRabbit();
    KIDS.voice.queue([{ key: VOICE.right.key, text: VOICE.right.text },
                      { key: 'tra_n_' + qRef.num, text: numCn(qRef.num) }]);   /* 写好啦，真棒 + 数词 */
    await wait(WIN.DONE * SPEED);               /* 审查M1：tra_right 2280+150+tra_n_10 1248+余量——链播完再读下一题 */
    state.busy = false;
    if (cur !== run) return 'done';
    if (!demo) nextQuiz();
    return 'done';
  }
  /* won：末题完成 = 整关通关（数词照读——末题也是题） */
  litFull();
  danceRabbit();
  KIDS.voice.queue([{ key: VOICE.right.key, text: VOICE.right.text },
                    { key: 'tra_n_' + qRef.num, text: numCn(qRef.num) }]);
  state.busy = false;
  await wait(WIN.DONE * SPEED);                 /* 审查M1：末题数词链播完再进 celebrate */
  winFlow();
  return 'won';
}

/* ================= 选卡主路径（r5 新题型：真实点击 / TR.tapCard / autoSolve 共用）
   选对=WIN.PICK_RIGHT 600ms 演出窗（卡 pop+其余淡出）→ 进描红相位+hint2 并发（不锁不空等）；
   选错=卡 shake+方向锚语音（listen=tra_w_pick/mirror=tra_w_mir，不泄答案）+1000ms 防重入 ================= */
async function uiTapCard(i, demo) {
  if (!cur || state.won) {
    sfx('pop'); replayAnim(cardsEl, 'bump');
    return false;
  }
  if ((state.busy && !demo) || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop'); replayAnim(cardsEl, 'bump'); // 演出期=吞输入（卡行 bump 可见回应）
    return false;
  }
  const run = cur;
  const q0 = run.quizzes[run.step];
  if (!q0 || q0.phase !== 'pick') {
    sfx('pop'); replayAnim(cardsEl, 'bump');
    return false;
  }
  const r0 = engPickCard(run, i);
  if (r0 === null) {                            // 卡下标越界
    sfx('pop'); replayAnim(cardsEl, 'bump');
    return false;
  }
  lastAct = Date.now(); rescueDirDone = false; rescueAnsDone = false;
  anchorsEls.forEach(el => el.classList.remove('rescued'));
  cardEls().forEach(el => el.classList.remove('rescued'));
  ghost.hide();
  if (state.tut === 'help' && !demo) {
    state.tut = 'solo';
    danceRabbit();
  }
  state.busy = true;

  if (r0 === 'wrong') {                         // 选错：卡 shake+方向锚反馈；phase 不变（重选）
    await wait(200 * SPEED);
    if (cur === run) {
      const q = cur.quizzes[cur.step];
      if (q && !q.solved) {
        const el = cardEl(i);
        if (el) {
          replayAnim(el, 'shake');
          setTimeout(() => el.classList.remove('shake'), 540 * SPEED + 320);
        }
        const v = q.kind === 'listen' ? VOICE.w_pick : VOICE.w_mir;
        KIDS.voice.play(v.key, v.text);         /* 再听一遍/转一转再看看（不泄答案） */
      }
    }
    await wait(800 * SPEED);                    /* 错选防重入 200+800=1000ms=WIN.WRONG */
    state.busy = false;
    return 'wrong';
  }

  /* 选对：正确卡 ok pop+其余淡出 → PICK_RIGHT 演出窗 → 描红板（hint2 并发播不锁） */
  const el = cardEl(i);
  if (el) replayAnim(el, 'ok');
  cardEls().forEach((c, k) => { if (k !== i) c.classList.add('dim'); });
  sfx('pop');
  await wait(WIN.PICK_RIGHT * SPEED);
  state.busy = false;
  if (cur !== run) return 'right';
  if (!demo) {
    renderQuiz();                               // phase 已 'write' → 描红板
    sayR(VOICE.hint2);                          /* 从发亮的起点开始（并发不锁——窗内即可看板） */
  }
  return 'right';
}
function nextQuiz() {                           // 下一题（同关内）
  if (!cur || cur.done) return;
  runId++;                                      // 作废在途演出定时器
  state.phase = 'play'; state.locked = false; state.busy = false;
  renderStep();
  renderQuiz();
  playCue();                                    /* pick 题面必播 / write 提示 flat<3 */
}

/* ================= 笔顺演示（底栏"看笔顺"）：幽灵手指沿 path 走一遍（演示实证）
   只演不改状态；期间锁输入，结束恢复当前进度渲染；选卡期禁用（演示会泄答案数字） ================= */
async function playStrokeDemo() {
  const q0 = cur && !cur.done ? cur.quizzes[cur.step] : null;
  if (!q0 || q0.phase !== 'write' || state.won || state.demo || state.busy) {
    sfx('pop'); replayAnim(boardEl, 'bump');
    return;
  }
  const my = ++runId, run = cur;
  const q = run.quizzes[run.step];
  if (!q || q.solved) return;
  state.demo = true;
  demoPathEl.setAttribute('d', DIGITS[q.num].path);
  demoPathEl.style.display = '';
  const total = arc.total;
  demoPathEl.style.strokeDasharray = '0 ' + (total + 2);
  const t0 = Date.now(), DUR = (VERIFY ? 400 : 1600);
  const move = () => {                          // 幽灵手指沿弧长移动
    if (runId !== my || cur !== run) { demoPathEl.style.display = 'none'; ghost.hide(); return; }
    const k = Math.min(1, (Date.now() - t0) / DUR);
    const s = total * k;
    demoPathEl.style.strokeDasharray = s.toFixed(2) + ' ' + (total + 2);
    const pt = litEl.getPointAtLength(s);
    const r = boardEl.getBoundingClientRect();
    ghostEl.style.left = Math.round(r.left + r.width * pt.x / 100) + 'px';
    ghostEl.style.top = Math.round(r.top + r.height * pt.y / 100) + 'px';
    ghost.show();
    if (k < 1) requestAnimationFrame(move);
    else setTimeout(() => {                     // 收束：恢复进度渲染
      demoPathEl.style.display = 'none';
      ghost.hide();
      if (runId === my && cur === run) { state.demo = false; renderQuiz(); }
    }, 420 * SPEED);
  };
  requestAnimationFrame(move);
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关章型 GEN[dch-1]（家族 F，r5 审查 m-1：
     (ci+1)%4 章序推进仅 dch 循环策略下巧合等值，防御性禁式——habitat r4 M-1 同型） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true; state.locked = true; state.phase = 'won';
  ghost.hide();
  renderStep();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  runId++;
  ghost.hide();
  cur = genLevel(flat);
  state = { phase: 'play', locked: false, busy: false, won: false, demo: false, tut: 'none' };
  helpRedemo = false; rescueDirDone = false; rescueAnsDone = false;
  lastAct = Date.now();
  demoPathEl.style.display = 'none';
  renderStep(); renderDots();
  renderQuiz();
  if (VERIFY) return;                            // verify 页：无教学无存档
  const sv = KIDS._save();
  const freshTut = flat === 0 && !sv.levels['1-0'] && !(sv.trace && sv.trace.tutSeen);
  if (freshTut) { tutorialWatch(); return; }
  playCue();
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=幽灵手指逐锚点按下（数字 1 两锚点，走真实比对链）→ __trDemoR='right'；
   帮=起点未点时指起点（自推不指下一锚）；独=首次真点放手（watch 全程 ≤16s） ================= */
async function tutorialWatch() {
  const my = ++runId;
  state.demo = true; state.locked = true; state.tut = 'watch';
  setBubble();
  sayR(VOICE.watch);                             /* 看！从发亮的点开始点（r5 语义仍准确：起点发亮） */
  await wait(650 * SPEED);
  const run = cur;
  const q0 = run.quizzes[0];                     // flat0 题 0 恒数字 1（两锚点，trace/ends）
  let demoR = null;
  for (let k = 0; k < q0.anchors.length; k++) {  // 幽灵手指逐锚点复现
    if (runId !== my || cur !== run) { state.demo = false; return; }
    pointGhostAt(anchorEl(q0.pos));
    await wait(760 * SPEED);
    ghost.press();
    await wait(280 * SPEED);
    const r = await uiTapAnchor(q0.pos, true);   // demo 通道豁免锁
    if (r && !demoR) demoR = r;                  // 首锚点对='right'（gate 断言口径）
    await wait(460 * SPEED);
  }
  /* 审查M1：删演示收束语 say('写得真像')——与 queue(tra_right+tra_n) 撞头互掐 */
  window.__trDemoR = demoR;                      // 演示生效证据（§0.27，gate 断言 'right'）
  await wait(500 * SPEED);
  const sv = KIDS._save();
  sv.trace = sv.trace || {};
  sv.trace.tutSeen = true;
  KIDS.store.persist();
  /* 立即重发同关（确定性关卡，题面一致），"你来连一连"在重发后的题面上说 */
  ghost.hide();
  startLevel(0);
  state.tut = 'help';
  sayP(VOICE.turn);                              /* 你来连一连（flat=0 <3） */
  setTimeout(() => {
    if (state.tut === 'help' && !ghostEl.classList.contains('show')) pointHelpNext();
  }, 500 * SPEED);
}

/* ================= 救援钟（play 后静置；verify 页由 verify 直驱函数测）
   14s 方向级=按相位分流：write=已写到位锚 pulse+hint2（不泄下一锚）/ pick=重读题面+卡行 pulse；
   30s 答案级=幽灵手指指到当前锚点位/正确卡+rescued 强化呼吸；
   双锚各自独立节流，有效动作即清（piano 结构照抄，家族 B） ================= */
function rescueDir() {
  if (!cur || cur.done) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  if (q.phase === 'pick') {
    replayAnim(cardsEl, 'pulse');
    KIDS.voice.queue(stemParts(q));              /* 重读题面（方向级不泄答案） */
  } else {
    flashAnchor(q.pos > 0 ? q.pos - 1 : 0);      /* 已写到的位置（pos=0 时=起点） */
    sayR(VOICE.hint2);                           /* 从发亮的起点开始，想一想下一笔 */
  }
  return true;
}
function rescueAns() {
  if (!cur || cur.done) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  if (q.phase === 'pick') {
    const el = cardEl(q.right);
    if (el) el.classList.add('rescued');         // 正确卡 breathe 强化
    pointGhostAt(el);                            // + 幽灵手指指到位（非 verify 页）
  } else {
    const el = anchorEl(q.pos);
    if (el) el.classList.add('rescued');         // 当前锚 breathe 强化（红光大呼吸）
    pointGhostAt(el);
  }
  return true;
}
setInterval(() => {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  const idle = Date.now() - lastAct;
  if (idle > 30000 && !rescueAnsDone) { rescueAnsDone = true; rescueAns(); return; }
  if (idle > 14000 && !rescueDirDone) { rescueDirDone = true; rescueDir(); return; }
  if (idle > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {
    helpRedemo = true;
    pointHelpNext();
  }
}, 1000);

/* ================= 底栏与输入 ================= */

/* ================= 启动（verify 分支由 game-verify.js 接管） ================= */
buildStatic();
if (!VERIFY) {

    startLevel(flat);

  get currentLevel() {
    if (!cur) return null;
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.quizzes.length,
             step: cur.step, done: cur.done, won: state.won,
             miss: cur.missTotal || 0, stars: engStars(cur) };
  },
  get quiz() {
    if (!cur || cur.done) return null;

    if (!q) return null;
    return { kind: q.kind,                       /* 题型真值：'trace'|'listen'|'mirror' */
             phase: q.phase,                     /* 相位：'pick'（选卡）|'write'（描红） */
             num: q.num,                         /* 题内数字 1-10 */
             hintMode: q.hintMode,               /* 自推提示档：'ends'|'start' */
             anchors: q.phase === 'write' ? q.anchors.map((_, i) => i) : null,
             cards: q.phase === 'pick' ? q.cards.slice() : null,   /* 候选卡 id 序 */
             right: q.phase === 'pick' ? q.right : -1,             /* 正确卡下标 */
             pos: q.pos,                         /* 当前比对位 */
             step: cur.step,
             miss: q.miss };                     /* 本题失败尝试数 */
  },
  tapAnchor(i) {
    return uiTapAnchor(i);
  },
  tapCard(i) {
    return uiTapCard(i);
  },
  async autoSolve() {                    // UI 路径自动点完当前关（选卡→逐锚走真实比对链）
    let taps = 0, guard = 0;
    while (cur && !cur.done && guard++ < 900) {
      if (state.busy || state.won || state.demo || state.locked) { await wait(60); continue; }
      const q = cur.quizzes[cur.step];
      if (!q) break;
      if (q.phase === 'pick') {
        const r = await uiTapCard(q.right);
        if (r !== false && r != null) taps++;
      } else {
        const r = await uiTapAnchor(q.pos);
        if (r !== false && r != null) taps++;
      }
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
  get tutorial() { return state.tut; },
  get phase() { return state.phase; }

                   q10.cards.length === 4 && cardsS.indexOf(String(q10.num)) === q10.right;
  const nearArr = SPEC_NEAR[q10.num] || [];
  const nearIn = nearArr.length ? nearArr.some(p => cardsS.indexOf(String(p)) >= 0) : true;
  const wI = (q10.right + 1) % 4;
  const rw6 = await TR.tapCard(wI);
  const c61 = rw6 === 'wrong' && TR.quiz.miss === 1 && TR.quiz.phase === 'pick' &&
              TR.quiz.right === q10.right && TR.currentLevel.miss === 1;
  const rr6 = await TR.tapCard(q10.right);
  const c62 = rr6 === 'right' && TR.quiz.phase === 'write' && TR.quiz.kind === 'listen' &&
              TR.quiz.anchors.join() === Array.from({ length: DIGITS[q10.num].anchors.length }, (_, i) => i).join();
  TR.start(15);
  const kinds15 = [];
  const L15 = genLevel(15);
  L15.quizzes.forEach(q => kinds15.push(q.kind));
  const q15 = TR.quiz;
  const mirSet = new Set([String(q15.num), q15.num + 'm', q15.num + 'r', q15.num + 'f']);
  const c63 = JSON.stringify(kinds15) === JSON.stringify(SPEC_KINDS4) &&
              q15.kind === 'mirror' && SPEC_MIRROR_POOL.indexOf(q15.num) >= 0 &&
              q15.cards.every(c => mirSet.has(c)) && String(q15.cards[q15.right]) === String(q15.num);
  /* r5 试玩 P1 防回归：变体 computed transform 实测（CSS 选择器错配时数据层全对但视觉全 none——
     v-* 挂内层 .g，选择器须 .g.v-*；正体恒 none，m=matrix(-1,0,0,1 / r=matrix(-1,0,0,-1 / f=matrix(1,0,0,-1） */
  const mirTf = { m: 'matrix(-1, 0, 0, 1', r: 'matrix(-1, 0, 0, -1', f: 'matrix(1, 0, 0, -1' };
  const gEls = Array.prototype.map.call(document.querySelectorAll('.card'), b => b.querySelector('.g'));
  const c65 = gEls.length === 4 && gEls.every((gEl, i) => {
    const cs = String(q15.cards[i]).match(/([mrf])$/);
    const tf = getComputedStyle(gEl).transform;
    return cs ? tf.indexOf(mirTf[cs[1]]) === 0 : tf === 'none';
  });
  KIDS.voice.play = function (k) { plog.push(typeof k === 'string' ? k : k.key); };
  await TR.tapCard((q15.right + 1) % 4);
  KIDS.voice.play = origPlay;
  const c64 = plog.indexOf('tra_w_mir') >= 0 && TR.quiz.miss === 1;
  const pickOk = stListen && nearIn && c61 && c62 && c63 && c64 && c65;
  if (pickOk) npass++;
  units.pick = { ok: pickOk, listen: stListen && nearIn, wrong: c61, right: c62,
                 mirror: c63, mirTf: c65, mirWrongClip: c64, kinds15: kinds15 };

  /* ---- ⑦ UI 冒烟 A：flat0 autoSolve 通关（taps=Σ锚，3 星不弹层不写档） ---- */
  total++;
  TR.start(0);
  const wantTaps = cur.quizzes.reduce((s, q) => s + (q.phase === 'pick' ? 1 : 0) + q.anchors.length, 0);
  const a0 = await TR.autoSolve();
  const lv0 = TR.currentLevel;
  const smokeA = a0.done && a0.taps === wantTaps && lv0.done && lv0.won &&
                 engStars(cur) === 3 && !document.querySelector('.k-celebrate');
  if (smokeA) npass++;
  smokes.flat0 = { ok: smokeA, taps: a0.taps, want: wantTaps, stars: engStars(cur) };

  /* ---- ⑧ UI 冒烟 B：flat0 先点错 1 次再 autoSolve（miss=1 → 2 星） ---- */
  total++;
  TR.start(0);
  const wrongIdx = TR.quiz.anchors[TR.quiz.pos] + 1;
  const rw = await TR.tapAnchor(wrongIdx);
  const a1 = await TR.autoSolve();
  const lv1 = TR.currentLevel;
  const smokeB = rw === 'wrong' && a1.done && lv1.done && lv1.miss === 1 && engStars(cur) === 2;
  if (smokeB) npass++;
  smokes.flat0miss1 = { ok: smokeB, rw: rw, miss: lv1.miss, stars: engStars(cur) };

  /* ---- ⑨ 星级规则（引擎构造直测：失败尝试总数 0=3★/1-2=2★/≥3=1★） ---- */
  total++;
  const LS = genLevel(5);
  const s9 = [];
  [0, 1, 2, 3, 7].forEach(m => { LS.missTotal = m; s9.push(engStars(LS)); });
  const starsOk = s9[0] === 3 && s9[1] === 2 && s9[2] === 2 && s9[3] === 1 && s9[4] === 1;
  if (starsOk) npass++;
  units.stars = { ok: starsOk, got: s9, want: [3, 2, 2, 1, 1] };

  /* ---- ⑩ 救援钟：方向级/答案级（相位分流；动作即清） ---- */
  total++;
  TR.start(0);
  const wantAnchor = () => anchorsEls[TR.quiz.pos];
  const dOkW = rescueDir() && anchorsEls[0].classList.contains('flash');   // pos0=起点 flash
  const aOkW = rescueAns() && wantAnchor().classList.contains('rescued');
  const actClear = await (async () => {
    await TR.tapAnchor(TR.quiz.pos);
    return !wantAnchor().classList.contains('rescued');
  })();
  TR.start(10);                                    // pick 相位：方向级=卡行 pulse；答案级=正确卡 rescued
  const dOkP = rescueDir() && cardsEl.classList.contains('pulse');
  const aOkP = rescueAns() && cardEls()[TR.quiz.right].classList.contains('rescued');
  const rescueOk = dOkW && aOkW && actClear && dOkP && aOkP;
  if (rescueOk) npass++;
  units.rescue = { ok: rescueOk, dirW: dOkW, ansW: aOkW, clearOnAct: actClear,
                   dirP: dOkP, ansP: aOkP };

  /* ---- ⑪ 布局：双 viewport × flat 0/5/10/15（锚点/卡 ≥64 + 镜像 glyph bbox 在卡内 + ask 显隐） ---- */
  function simView(w, h) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    TR.start(g._simFlat);
    const qz = TR.quiz;
    const ans = Array.prototype.map.call(document.querySelectorAll('.anchor'), b => ({
      w: b.offsetWidth, h: b.offsetHeight }));
    const cards = Array.prototype.map.call(document.querySelectorAll('.card'), b => ({
      w: b.offsetWidth, h: b.offsetHeight }));
    const btns = [rabbitBtn, demoBtn].map(b => ({ w: b.offsetWidth, h: b.offsetHeight }));
    /* 镜像/倒置变体 glyph bbox：transform 后仍在卡盒内（±1px 容差） */
    const cardDom = document.querySelectorAll('.card');
    const bboxOk = Array.prototype.every.call(cardDom, cEl => {
      const gEl = cEl.querySelector('.g');
      if (!gEl) return false;
      const cr = cEl.getBoundingClientRect(), gr = gEl.getBoundingClientRect();
      return gr.width > 8 && gr.height > 8 &&
             gr.left >= cr.left - 1 && gr.right <= cr.right + 1 &&
             gr.top >= cr.top - 1 && gr.bottom <= cr.bottom + 1;
    });
    const askOk = qz.phase === 'pick' ? askEl.style.display === 'flex' &&
                                         askEl.offsetWidth >= 64 : askEl.style.display === 'none';
    const ansOk = qz.phase === 'write' ? ans.length >= 2 && ans.every(b => b.w >= 64 && b.h >= 64)
                                       : ans.length === 0;
    const cardsOk = qz.phase === 'pick' ? cards.length === 4 && cards.every(b => b.w >= 64 && b.h >= 64)
                                        : cards.length === 0;
    const btnOk = btns.every(b => b.w >= 64 && b.h >= 64);
    const de = document.documentElement;
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, flat: g._simFlat, phase: qz.phase, anchors: ans.length, cards: cards.length,
             ansOk: ansOk, cardsOk: cardsOk, bboxOk: bboxOk, askOk: askOk, btnOk: btnOk, ox: ox,
             pass: ansOk && cardsOk && bboxOk && askOk && btnOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const flat of [0, 5, 10, 15]) {
    $id('game')._simFlat = flat;
    sims.push(simView(1280, 800));
    sims.push(simView(800, 1180));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  TR.start(0);                                    // 还原
  const layoutOk = sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑫ clips 28 全注入 + SPEC_DUR ±60ms 实长断言 + WIN 窗常量 ---- */
  total++;
  const keysC = Object.keys(KIDS.voice.clips);
  const need = ['tra_tut_watch', 'tra_tut_turn', 'tra_hint', 'tra_right', 'tra_wrong']
               .concat(Array.from({ length: 10 }, (_, i) => 'tra_n_' + (i + 1)))
               .concat(['tra_hint2', 'tra_l_q', 'tra_m_q', 'tra_w_pick', 'tra_w_mir',
                        'tra_w_wait', 'tra_w_down', 'tra_w_right', 'tra_w_up', 'tra_w_left'])
               .concat(['core_chapter_end', 'core_day_end', 'core_rest']);
  const preOk = keysC.length === 28 &&
    need.every(k => keysC.indexOf(k) >= 0 && KIDS.voice.clips[k].indexOf('data:audio/mpeg;base64,') === 0);
  const durKeys = Object.keys(SPEC_DUR);
  const durs = await Promise.all(durKeys.map(k => new Promise(res => {
    let done = false;
    const a = new Audio(KIDS.voice.clips[k]);
    const t = setTimeout(() => { if (!done) { done = true; res(-2); } }, 8000);   // 8s 超时（纪律）
    a.onloadedmetadata = () => { if (!done) { done = true; clearTimeout(t); res(Math.round(a.duration * 1000)); } };
    a.onerror = () => { if (!done) { done = true; clearTimeout(t); res(-1); } };
  })));
  const durOk = durs.every((d, i) => Math.abs(d - SPEC_DUR[durKeys[i]]) <= 60);
  const winOk = WIN.WRONG === 1000 && WIN.PICK_RIGHT === 600 && WIN.DONE === 4100 &&
                WIN.DONE >= SPEC_DUR.tra_right + 150 + SPEC_DUR.tra_n_10 + 300;   // 数词链窗下界
  const clipsOk = preOk && durOk && winOk;
  if (clipsOk) npass++;
  units.clips = { ok: clipsOk, n: keysC.length, durs: durs, winOk: winOk };

  /* ---- ⑬ 章末 hint=预告下一章 + GEN_HINTS[k]↔dch=k+1（C7 型关键词断言） ---- */
  total++;
  const hintMapOk = nextHint(4) === CHAPTERS[1].hint && nextHint(9) === CHAPTERS[2].hint &&
                    nextHint(14) === CHAPTERS[3].hint && nextHint(19) === CHAPTERS[4].hint &&
                    [24, 29, 34, 39].every(f => nextHint(f) === GEN_HINTS[genLevel(f + 1).dch - 1]);
  /* r5 审查 m-1：实算对账替代原 (ci+1)%4 巧合等值断言（原式循环论证无判别力）+
     负向禁字面（habitat r4 M-1 同型防御） */
  const negHint = nextHint.toString().indexOf('(ci + 1) % 4') < 0 &&
                  nextHint.toString().indexOf('genLevel(f + 1).dch') >= 0;
  const kwOk = CHAPTERS[1].hint.indexOf('6') >= 0 && CHAPTERS[1].hint.indexOf('起点') >= 0 &&
               CHAPTERS[2].hint.indexOf('听') >= 0 &&
               CHAPTERS[3].hint.indexOf('镜子') >= 0 && CHAPTERS[3].hint.indexOf('正') >= 0 &&
               CHAPTERS[4].hint.indexOf('挑战') >= 0 &&
               GEN_HINTS[0].indexOf('1') >= 0 && GEN_HINTS[0].indexOf('终点') >= 0 &&
               GEN_HINTS[1].indexOf('6') >= 0 && GEN_HINTS[1].indexOf('起点') >= 0 &&
               GEN_HINTS[2].indexOf('听') >= 0 &&
               GEN_HINTS[3].indexOf('挑战') >= 0;
  const hintOk = hintMapOk && kwOk && negHint;
  if (hintOk) npass++;
  units.hint = { ok: hintOk, map: hintMapOk, kw: kwOk, neg: negHint,
                 n4: nextHint(4), n24: nextHint(24), n34: nextHint(34) };

  /* ---- ⑭ verify 提速 + verify 页零写档 ---- */
  total++;
  let lsTrace = null;
  try { lsTrace = localStorage.getItem('kidsgame_trace'); } catch (e) {}
  const speedOk = SPEED === 0.12 && lsTrace === null;
  if (speedOk) npass++;
  units.speed = { ok: speedOk, SPEED: SPEED, lsTrace: lsTrace === null };

  /* ---- ⑮ 数词朗读对拍（完成朗读按题内数字取 tra_n_<num>，逐题序对拍） ---- */
  total++;
  const qGroups = [];
  KIDS.voice.queue = function (parts) {
    qGroups.push(parts.map(p => typeof p === 'string' ? p : p.key));
  };
  TR.start(0);
  const a15 = await TR.autoSolve();
  KIDS.voice.queue = origQ;
  /* flat0 题序恒 [1,2,3,4,5]（offset=0 轮转）：第 k 题完成恰播 [tra_right, tra_n_<第k题num>] */
  const wantSeq = [1, 2, 3, 4, 5];
  const gotSeq = cur.quizzes.map(q => q.num);
  const wantLog = wantSeq.map(n => ['tra_right', 'tra_n_' + n]);
  const numOk = JSON.stringify(qGroups) === JSON.stringify(wantLog);
  const numOkAll = a15.done && JSON.stringify(gotSeq) === JSON.stringify(wantSeq) && numOk;
  if (numOkAll) npass++;
  units.numword = { ok: numOkAll, done: a15.done, seq: gotSeq, groups: qGroups };

  /* ---- ⑯ 听数/镜像题面链对拍（stub queue/play log；题面必播=不播不可解） ---- */
  total++;
  const sGroups = [];
  KIDS.voice.queue = function (parts) { sGroups.push(parts.map(p => typeof p === 'string' ? p : p.key)); };
  const sPlay = [];
  KIDS.voice.play = function (k) { sPlay.push(typeof k === 'string' ? k : k.key); };
  TR.start(10);
  playCue();                                        // 真实页 startLevel 走 playCue（verify 页早退，此处补走）
  const a16 = await TR.autoSolve();
  KIDS.voice.queue = origQ; KIDS.voice.play = origPlay;
  const seq10 = genLevel(10).quizzes.map(q => q.num);
  const wantStems = seq10.map(n => ['tra_l_q', 'tra_n_' + n]);
  const gotStems = sGroups.filter(g => g[0] === 'tra_l_q');
  const done16 = sGroups.filter(g => g[0] === 'tra_right').length;
  const hint2N = sPlay.filter(k => k === 'tra_hint2').length;
  const stemOk = a16.done && JSON.stringify(gotStems) === JSON.stringify(wantStems) &&
                 done16 === 5 && hint2N === 5;
  if (stemOk) npass++;
  units.stem = { ok: stemOk, seq: seq10, stems: gotStems, doneChains: done16, hint2: hint2N };

  /* ---- ⑰ 单关净时长 modeled 下界 ≥40s（40 关全量；§7 时序分账保守下界口径） ---- */
  total++;
  const modeledMs = L => L.quizzes.reduce(
    (m, q) => m + q.anchors.length * (1200 + 200) + 4100, 0);
  let minMod = Infinity, minFlat = -1;
  for (let flat = 0; flat < 40; flat++) {
    const m = modeledMs(genLevel(flat));
    if (m < minMod) { minMod = m; minFlat = flat; }
  }
  const modeledOk = minMod >= 40000;
  if (modeledOk) npass++;
  units.modeled = { ok: modeledOk, minMs: minMod, minFlat: minFlat };

  /* ---- ⑱ 吞输入轻叮+可见回应（write：demo/locked/busy 拦+板 bump；pick：busy 拦+卡行 bump） ---- */
  total++;
  TR.start(0);
  state.demo = true; state.locked = true;                          // 模拟教学"看"演示期
  const swallow1 = (await TR.tapAnchor(0)) === false && boardEl.classList.contains('bump');
  state.demo = false; state.locked = true;                         // 演出窗口（locked）
  const swallow2 = (await TR.tapAnchor(0)) === false;
  state.locked = false; state.busy = true;                         // 反馈占位锁（busy）
  const swallow3 = (await TR.tapAnchor(0)) === false;
  TR.start(10);                                                    // pick 相位 busy 拦（卡行 bump）
  state.busy = true;
  const swallow4 = (await TR.tapCard(0)) === false && cardsEl.classList.contains('bump');
  state.busy = false;                                              // 还原（后续单元自行 start）
  const swallowOk = swallow1 && swallow2 && swallow3 && swallow4 &&
                    TR.currentLevel.step === 0 && TR.quiz.miss === 0;
  if (swallowOk) npass++;
  units.swallow = { ok: swallowOk, demo: swallow1, locked: swallow2, busy: swallow3, pickBusy: swallow4 };

  /* ---- ⑲ 教学链：tutorialWatch 真实走完 → __trDemoR='right' ---- */
  total++;
  KIDS._save = function () { return { levels: {} }; };
  KIDS.store.persist = function () {};
  TR.start(0);
  const t0 = Date.now();
  await tutorialWatch();
  const tw = (Date.now() - t0) / SPEED;           // 折算真实页时长
  const tutOk = window.__trDemoR === 'right' && state.tut === 'help' &&
                cur.flat === 0 && tw <= 16000;
  if (tutOk) npass++;
  units.tutorial = { ok: tutOk, demoR: window.__trDemoR, tut: state.tut, watchMs: Math.round(tw) };

  const out = { game: 'trace', total: total, pass: npass, layoutOk: layoutOk,
                levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     听数/镜像题面断言走 stub 语音文本/key log（非真播放——纪律） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  runVerify();
}

</script>
</body>
