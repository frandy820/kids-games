<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>贴纸装扮</title>
<style>
/* ================= 贴纸装扮 dressup（batch24）=================
   视觉按家族 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E；
   5-6 岁零文字依赖：题面=主题场景 SVG 动画+语音承载全部语义，贴纸零文字标签（§0.19）；
   触摸目标：贴纸片=主答案按钮 ≥64、模式/底栏按钮 ≥64、场景卡（第二击热区）≥64；
   两击制：点贴纸选中高亮（.sel）→ 点场景内小兔子贴上（飞到身上挂 badge）；
   need 全贴上才过：对一件挂起可见（badge），全齐=推进；贴错=弹回（.wig）不灰可重选。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏：logo + 模式切换（大按钮）+ 进度点 ---------- */
#hud{flex:0 0 76px;display:flex;align-items:center;padding:6px 60px 0 12px;gap:10px}
#logo{width:42px;height:42px;border-radius:12px;background:#F2C9A0;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#mode-switch{display:flex;gap:0;flex:0 0 auto;border:3px solid #4A3B2E;border-radius:22px;
  overflow:hidden;box-shadow:0 4px 0 #D8C9B4}
#mode-switch button{width:88px;height:64px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;background:#FFF9EE;color:#4A3B2E;font-size:14px;font-weight:700;
  transition:background .2s}
#mode-switch button.on{background:#E8975A;color:#FFF9EE}
#mode-switch button:active{transform:translateY(2px)}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto;justify-content:center}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：主题场景卡（动画+小兔子换装）→ 贴纸栏 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:6px 12px}

/* 场景卡：第二击热区（有选中=贴上）；点小兔子/badge 均在其内 */
#scene{position:relative;width:min(600px,94vw);height:184px;border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;overflow:hidden;padding:0;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene .sky{position:absolute;inset:0;border-radius:23px}
#scene .bunny-slot{position:absolute;right:10px;bottom:6px;width:104px;display:flex;
  flex-direction:column;align-items:center;gap:0}
#scene #bunny-wear{display:flex;gap:2px;min-height:46px;align-items:flex-end;justify-content:center;
  flex-wrap:wrap-reverse;max-width:150px;z-index:3}
#scene #bunny-wear .wear{width:42px;height:42px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  border-radius:13px;display:flex;align-items:center;justify-content:center;
  animation:wear-pop .45s cubic-bezier(.2,1.7,.4,1) backwards;box-shadow:0 2px 0 #D8C9B4}
#scene #bunny-wear .wear svg{width:34px;height:34px}
@keyframes wear-pop{0%{transform:scale(.2) translateY(14px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
#scene #bunny{animation:bun-idle 2.4s ease-in-out infinite}
#scene #bunny svg{width:96px;height:96px}
#scene #bunny.hop{animation:bun-jump .5s ease 2}
@keyframes bun-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bun-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
/* celebrate：兔子转圈展示（§0.57） */
#scene #bunny.spin{animation:bun-spin 1.1s ease}
@keyframes bun-spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
/* 救援方向级：场景整体轻弹（吞输入/反馈共用）；.bounce=轻回应 */
#scene.pulse{animation:scene-pulse 1s ease-in-out 3}
@keyframes scene-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#scene.bump{animation:scene-bump .22s ease}
@keyframes scene-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
#scene.bounce{animation:scene-b .4s ease}
@keyframes scene-b{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}

/* 场景动画（纯 CSS keyframes，确定性零 JS） */
.sunrays{transform-origin:66px 52px;animation:sun-spin 18s linear infinite}
@keyframes sun-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.drop{animation:drop-fall 1.15s linear infinite}
.drop:nth-of-type(1){animation-delay:0s}.drop:nth-of-type(2){animation-delay:.22s}
.drop:nth-of-type(3){animation-delay:.44s}.drop:nth-of-type(4){animation-delay:.1s}
.drop:nth-of-type(5){animation-delay:.32s}
@keyframes drop-fall{0%{transform:translateY(0);opacity:0}12%{opacity:1}
  85%{opacity:1}100%{transform:translateY(64px);opacity:0}}
.flake{animation:flake-fall 3s linear infinite}
.flake:nth-of-type(1){animation-delay:0s}.flake:nth-of-type(2){animation-delay:.7s}
.flake:nth-of-type(3){animation-delay:1.4s}.flake:nth-of-type(4){animation-delay:.35s}
.flake:nth-of-type(5){animation-delay:1.05s}
@keyframes flake-fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}
  25%{transform:translate(7px,24px) rotate(40deg)}50%{transform:translate(-5px,48px) rotate(-30deg)}
  75%{transform:translate(7px,70px) rotate(30deg)}92%{opacity:1}
  100%{transform:translate(-3px,92px) rotate(0);opacity:0}}
.flag{transform-origin:center top;animation:flag-sway 2.2s ease-in-out infinite}
@keyframes flag-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.moon{transform-origin:294px 60px;animation:moon-breathe 3.2s ease-in-out infinite}
@keyframes moon-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.star-tw{animation:star-tw 2s ease-in-out infinite}
@keyframes star-tw{0%,100%{opacity:1}50%{opacity:.25}}
.balloon{transform-origin:center 116px;animation:balloon-sway 3s ease-in-out infinite}
@keyframes balloon-sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-5px)}}

/* ---------- r10 budget 装备预算：场景左侧三槽书包（badge 装包；点 badge=揭回） ---------- */
#scene .pack{position:absolute;left:12px;bottom:8px;z-index:2;padding:24px 10px 10px;
  background:#F5D9A8;border:3px solid #4A3B2E;border-radius:16px;box-shadow:0 4px 0 #D8C9B4}
#scene .pack::before{content:'';position:absolute;left:50%;top:-15px;transform:translateX(-50%);
  width:64px;height:24px;border:3px solid #4A3B2E;border-bottom:none;border-radius:12px 12px 0 0;
  background:#E8B8A0}
#scene .pack-slots{display:flex;gap:9px;justify-content:center}
#scene .pack-slots i{width:52px;height:52px;border:3px dashed #C9A06C;border-radius:14px;
  background:rgba(255,249,238,.6)}
#scene[data-kind='budget'] .pack #bunny-wear{position:absolute;left:10px;right:10px;bottom:10px;
  display:flex;gap:9px;justify-content:center;align-items:center;min-height:0;max-width:none;
  flex-wrap:nowrap;z-index:3}
#scene[data-kind='budget'] .pack #bunny-wear .wear{width:52px;height:52px;cursor:pointer;position:relative}
#scene[data-kind='budget'] .pack #bunny-wear .wear::after{content:'';position:absolute;left:-6px;top:-6px;right:-6px;bottom:-6px}
#scene[data-kind='budget'] .pack #bunny-wear .wear svg{width:42px;height:42px}

/* ---------- 贴纸栏：一行 6-8 片（free 模式 18 片 wrap 两行），主答案按钮 ≥64；吞输入=容器 bump ---------- */
#tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:stretch;flex:0 0 auto;
  width:100%;max-width:860px;padding:0 2px}
#tray.bump{animation:tray-bump .22s ease}
@keyframes tray-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
.stk{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:20px;
  box-shadow:0 5px 0 #D8C9B4;flex:0 0 auto;width:78px;min-height:88px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s,border-color .15s}
.stk:active{transform:translateY(3px)}
.stk .gwrap{width:64px;height:70px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.stk .gwrap svg{width:62px;height:62px}
.stk.pop{animation:stk-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes stk-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 第一击：选中高亮（拿起态——上浮+橙框+光晕） */
.stk.sel{border-color:#E8975A;box-shadow:0 5px 0 #E8975A,0 0 16px rgba(232,151,90,.55);
  transform:translateY(-7px) scale(1.06)}
/* 已贴上：勾选挂起（badge 已挂兔子身上，栏中变淡） */
.stk.held{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;opacity:.55}
.stk.held .check{opacity:1;transform:scale(1)}
.stk .check{position:absolute;right:-8px;top:-10px;width:32px;height:32px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #4A3B2E;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.3);transition:all .25s cubic-bezier(.2,1.6,.4,1)}
.stk .check svg{width:18px;height:18px}
.stk.bump{animation:stk-bump .22s ease}
@keyframes stk-bump{0%,100%{transform:scale(1)}45%{transform:scale(.92)}}
/* 贴错：弹回摇头（不灰掉可重选——零惩罚语义反馈款） */
.stk.wig{animation:an-wig .6s ease}
/* r10 anti 判对：点中错位件闪绿（非挂起——排除正确即完成） */
.stk.good{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;animation:an-pulse .5s ease-in-out 2}
@keyframes an-wig{0%,100%{transform:rotate(0)}22%{transform:rotate(-8deg) translateX(-4px)}
  50%{transform:rotate(7deg) translateX(3px)}78%{transform:rotate(-4deg) translateX(-2px)}}
/* 救援方向级：need 未贴片 pulse（呼吸放大 3 次）；答案级/教学指向：breathe 循环高亮 */
.stk.pulse{animation:an-pulse 1s ease-in-out 3}
@keyframes an-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.stk.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 换装飞行体（贴纸 → 小兔子，fixed 层 CSS transition） */
.flywear{position:fixed;z-index:90;width:64px;height:64px;border-radius:16px;display:flex;
  align-items:center;justify-content:center;background:#FFF9EE;border:3px solid #6FA063;
  box-shadow:0 4px 0 #6FA063;pointer-events:none;
  transition:transform .43s cubic-bezier(.3,.85,.35,1.08)}
.flywear svg{width:52px;height:52px}

/* 彩花粒子（fixed 层，JS 定位生成；celebrate 全场+free 偶发） */
.confetti{position:fixed;z-index:70;width:14px;height:14px;border-radius:50%;pointer-events:none;
  border:2.5px solid #4A3B2E;opacity:.95;transition:transform .62s cubic-bezier(.2,.7,.4,1),opacity .62s ease}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:dock-hop .45s ease 2}
@keyframes dock-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#dock .mid{display:flex;gap:12px;align-items:center}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#btn-clear{width:78px;height:78px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;display:none}
#btn-clear.show{display:flex}
#btn-clear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-clear svg{width:44px;height:44px}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}

/* ---------- 幽灵手指教学（照 batch21-23） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：场景/贴纸适配，主答案贴纸仍 ≥64
   r8 纪律⑥：媒体查询跟视口不跟元素——页内 verify simView 无法改视口，须 body.port 类通道
   （下方 body.port 副本与 @media 段逐条等值，verify 断言两通道渲染一致） */
@media (orientation:portrait){
  #mode-switch button{width:76px;height:64px;font-size:13px}
  #scene{height:168px}
  #scene .bunny-slot{width:92px}
  #scene #bunny svg{width:84px;height:84px}
  #scene #bunny-wear .wear{width:38px;height:38px}
  #scene #bunny-wear .wear svg{width:30px;height:30px}
  #tray{gap:8px}
  .stk{width:70px;min-height:80px}
  .stk .gwrap{width:60px;height:64px}
  .stk .gwrap svg{width:58px;height:58px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
/* body.port 副本（页内竖屏模拟通道——与上 @media 段逐条等值，改一处须两处同步） */
body.port #mode-switch button{width:76px;height:64px;font-size:13px}
body.port #scene{height:168px}
body.port #scene .bunny-slot{width:92px}
body.port #scene #bunny svg{width:84px;height:84px}
body.port #scene #bunny-wear .wear{width:38px;height:38px}
body.port #scene #bunny-wear .wear svg{width:30px;height:30px}
body.port #tray{gap:8px}
body.port .stk{width:70px;min-height:80px}
body.port .stk .gwrap{width:60px;height:64px}
body.port .stk .gwrap svg{width:58px;height:58px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
body.port #scene[data-kind='budget'] .pack #bunny-wear .wear{width:52px;height:52px}   /* budget 槽 badge 不随竖屏缩 */
</style>
</head>
<body>
<div id="game" aria-label="贴纸装扮">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="mode-switch" role="tablist" aria-label="装扮模式">
      <button id="btn-mode-free" aria-label="自由装扮"></button>
      <button id="btn-mode-task" aria-label="任务装扮"></button>
    </div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="主题场景，装扮小兔子"></button>
    <div id="tray" aria-label="贴纸栏"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <div class="mid">
      <button id="btn-hear" aria-label="再听一遍"></button>
      <button id="btn-clear" aria-label="清空装扮"></button>
      <button id="btn-replay" aria-label="再玩一次"></button>
    </div>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  function init(config) {

       配对主题（rain↔winter / school↔sports / nap↔party——太阳帽 vs 遮阳帽近形跨主题干扰）；
       两击制（share 同构）贴上小兔子，need=主题全集，错贴即弹回（v1 机制）。
     budget 装备预算（dch2）：场景左侧三槽书包，只能带 3 件：候选 6 片（need 3+配对干扰 ≥2+1 补位），
       装包无即时对错反馈（错件不弹回——预算取舍核心），满 3 件自动检查：全对=过；
       有错=miss+1+错件自动退回（对件保留）；已装 badge 可点揭回（零惩罚，解槽重选）。
     anti 场景反向排除（dch3）：题面「哪一样不用带」，候选=主题全集+1 错位件（MISFIT 封闭表），
       单击即判（weather r9 anti 同构）；错位点=贴纸摇头+反向重定向反馈。
     dch4 混合：三族各 ≥1+2 seeded；flat≥20 生成关 dch=ri(1,4)。
   主题封闭表 6（表外不出题，v1 沿用）：
     去上学=[书包,太阳帽,小挎包] / 运动会=[运动鞋,遮阳帽,小背包] / 睡午觉=[睡帽,睡衣,小熊]
     开派对=[皇冠,蝴蝶结,裙子] / 雨天出门=[雨衣,雨靴] / 冬天出门=[围巾,手套,厚外套]
   贴纸池封闭 = 6 主题物品并集 17 + 2 自由装饰（花朵,星星——theme:'free'）= 19 片
   （注：v1 SPEC §0.57 汇总数"18"为算术笔误，以逐项清单为真值源——历史勘误沿记）。
   r10 时长模型（estMs 家族定版 n*345+600——data 定义/main 注释/verify 独立副本/build 字面
   四处同步，禁 +300 变体；语音窗与决策重叠取大者不重复计，weather r9 先例）：
     DECIDE_MS：conflict 6200（7 片跨主题扫描≈885/片）/ budget 7800（6 片全评估+三选规划，
     无即时反馈须先想后装）/ anti 5400（3-4 片反向排除，抑制「都合适」直觉）；
     TAP_MS 430=两击第二击挂 badge 飞行窗 / ADV_MS 3200=判对推进窗（dru_right 2664 实长+余量，
     b24 审查 M2 定版）/ SW_MS 900=换题场景重建+贴纸 stagger 入场。
     全题型 DECIDE_MS ≥ estMs(该题型最长题面句)（conflict 10 码点 4050<6200 / budget 10→4050<7800
     / anti 11→4395<5400）——语音窗从不撑时长。全 40 关 modeled 最低=anti 章 47500 ≥ LEVEL_MIN_MS 40000。 */
'use strict';

const INK = '#4A3B2E'; // 统一暖棕描边（家族 DESIGN-SPEC §8）

   KINDS：题型封闭 3 族；PAIR_OF：冲突配对（跨主题干扰来源，近形/近义互混）；
   BUDGET_THEMES：预算章主题池=5 个 3 件主题（排除 rain 2 件——budget=3 须 need 恰满 3）；
   MISFIT：反向排除错位件池（每主题 ≥2 选项供 seeded 轮换，均属远主题=场景内明显不合适）；
   POOL_OF_KIND：贴纸栏候选片数（anti=主题全集+1 错位件=3-4 片，无固定池） ---------- */
const KINDS = ['conflict', 'budget', 'anti'];
const PAIR_OF = { rain: 'winter', winter: 'rain', school: 'sports', sports: 'school', nap: 'party', party: 'nap' };

  party:  ['rboots', 'raincoat'], // 雨靴/雨衣→开派对

  winter: ['dress', 'bow']        // 裙子/蝴蝶结→冬天出门（单薄盛装顶风雪）

/* ---------- 章配置（章号 1 基；生成关 flat≥20 按 dch=ri(1,4) 随机章参数）
   hint=章末预告**下一章**文案（hint[i] ↔ CHAPTERS[i+1]，b21 教训禁右移）；
   GEN_HINTS[k] ↔ dch=k+1（b22 教训，verify 带 C7 关键词断言） ---------- */
const CHAPTERS = {

};

                   '只能带三样，挑最需要的',         // dch2 装备预算

                   '大混搭挑战，想好再动手'];        // dch4 混合

/* ---------- 题面句（按题型+主题三族封闭域；T46 阶段2 起 clip 化 dru_q/qb/qa，零文字依赖由语音承载语义） ---------- */
const BUDGET_Q = {

  party: '开派对，只能带三样', winter: '冬天出门，只能带三样'

  party: '开派对，哪一样不用带', rain: '雨天出门，哪一样不用带', winter: '冬天出门，哪一样不用带'
};
const quizSpeech = q => q.kind === 'budget' ? BUDGET_Q[q.theme]
                     : (q.kind === 'anti' ? ANTI_Q[q.theme] : THEMES[q.theme].q);
/* T46 阶段2 题面 clip 键：conflict=dru_q_{theme} 6 / budget=dru_qb_{theme} 5 / anti=dru_qa_{theme} 6
   （17 键与 manifest 逐条对账过文本一致；q.stem 同款三族分流） */
const quizKey = q => q.kind === 'budget' ? 'dru_qb_' + q.theme
                 : (q.kind === 'anti' ? 'dru_qa_' + q.theme : 'dru_q_' + q.theme);

/* ---------- r10 时长模型（SPEC-BATCH24 §8；estMs 家族定版字面四处同步） ---------- */
const estMs = n => n * 345 + 600;
const DECIDE_MS = { conflict: 6200, budget: 7800, anti: 5400 };
const TAP_MS = 430;    // 两击第二击挂 badge 飞行窗
const ADV_MS = 3200;   // 判对推进窗（dru_right 2664 实长+余量，b24 审查 M2 定版沿用）
const SW_MS = 900;     // 换题场景重建+贴纸 stagger 入场
const quizDurMs = q => Math.max(estMs(q.stem.length), DECIDE_MS[q.kind]) +
                       (q.kind === 'anti' ? 0 : q.need.length * TAP_MS) + ADV_MS;
const levelDurMs = L => L.quizzes.reduce((s, q) => s + quizDurMs(q), 0) + CH_LEN * SW_MS;
const LEVEL_MIN_MS = 40000;   // 5-6 岁段单关硬指标（AUDIT-56 口径，r10 起 verify 硬断言）

/* ================= dressup 纯引擎：确定性关卡生成 + 三族判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）。
   r10 题型三族（SPEC-BATCH24 §8；进度章号单调递增、难度章号 (ch-1)%4+1 循环）：
     dch1 conflict 主题冲突池：主题=3 配对 seeded 轮换（flat0 题0 锚 rain 全 2 件——教学演示沿 v1）；
       need=主题全集；候选 7=need+配对主题干扰 ≥min(3,配对件数)+补位（封闭池内）
     dch2 budget 装备预算：主题∈BUDGET_THEMES（5 个 3 件主题）；need=全集 3；budget=3；
       候选 6=need+配对干扰 2+补位 1；装包无即时对错反馈，满 3 即检（对留错退）
     dch3 anti 反向排除：主题 6 池 seeded；need=[错位件]∈MISFIT[主题]（相邻错位件互异）；
       候选=主题全集+错位件（3-4 片）；单击即判
     dch4 混合：题型序=三族轮转(seeded 偏移)+2 seeded（每关三族各 ≥1）；主题按各族规则
   铁律：need ⊆ 主题封闭表；贴纸候选 ⊆ 19 片封闭池且 need 片全在场；干扰不含 need 片；
   候选互异；相邻主题互异（anti 连题再叠加错位件互异）。
   判定（r10）：
     两击制（conflict/budget，share 同构）：tapSticker=选中/取消（同步），tapRabbit=贴上判定；
     anti 单击即判（weather r9 anti 同构）：tapSticker=对('right'/'done')/错('wrong')。
     budget 满员即检：错件自动退回（对件保留）——「取舍」而非「全选」；
     engPeel=budget 专属揭回（零惩罚，不计数）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const dr_ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 题型序（mix 章：三族轮转+2 seeded——每关三族各 ≥1）
   rnd 消耗序=Python 对拍真值：off 1 次 + 尾 2 次（各 1 次），固定 ---------- */
function kindSeqOf(rnd) {
  const off = dr_ri(rnd, 0, 2);
  const seq = KINDS.map((k, i) => KINDS[(i + off) % 3]);
  seq.push(KINDS[dr_ri(rnd, 0, 2)], KINDS[dr_ri(rnd, 0, 2)]);
  return seq;
}

/* ---------- 每关主题序（rnd 同流保确定性；相邻主题互异 ≤8 掷兜底）
   conflict：3 配对池 seeded 掷（flat0 题0 恒 rain 教学锚——取数后覆写，消耗数不变）；
   budget：5 主题池 seeded 掷；anti：6 主题池 seeded 掷 ---------- */
function pickTheme(kind, rnd, flat, qi, prev) {
  let t;
  if (kind === 'conflict') {
    const pi = dr_ri(rnd, 0, 2), si = dr_ri(rnd, 0, 1);
    t = CONFLICT_PAIRS[pi][si];
    if (flat === 0 && qi === 0) t = 'rain';                 // 教学锚（v1 沿用：题面恒雨衣+雨靴）
  } else if (kind === 'budget') {
    t = BUDGET_THEMES[dr_ri(rnd, 0, BUDGET_THEMES.length - 1)];
  } else {
    t = THEME_IDS[Math.floor(rnd() * THEME_IDS.length)];
  }
  for (let k = 0; k < 8 && t === prev; k++) {
    if (kind === 'conflict') t = CONFLICT_PAIRS[dr_ri(rnd, 0, 2)][dr_ri(rnd, 0, 1)];
    else if (kind === 'budget') t = BUDGET_THEMES[dr_ri(rnd, 0, BUDGET_THEMES.length - 1)];
    else t = THEME_IDS[Math.floor(rnd() * THEME_IDS.length)];
  }
  return t;
}

/* ---------- 单题构建（按 kind；stem=题面句快照，时长模型与 UI 读它） ---------- */
function buildQuiz(theme, kind, misfit, rnd) {
  if (kind === 'anti') {
    const need = [misfit];
    const ids = shuffled(THEMES[theme].items.concat(need), rnd);
    const stickers = ids.map(id => ({ id: id, theme: STICKERS[id].theme, right: id === misfit }));
    return { kind: kind, theme: theme, stem: quizSpeech({ kind: kind, theme: theme }),
             need: need, stickers: stickers, placed: [], sel: null, budget: null,
             _miss: 0, _answered: false };
  }
  const need = THEMES[theme].items.slice();                 // conflict/budget：need=主题全集
  const pairItems = THEMES[PAIR_OF[theme]].items;
  if (kind === 'budget') {
    /* 预算：候选 6=need 3+配对干扰 2+补位 1（配对近形干扰保证取舍负荷） */
    const pairDs = shuffled(pairItems, rnd).slice(0, 2);
    const rest = STICKER_IDS.filter(id => need.indexOf(id) < 0 && pairDs.indexOf(id) < 0);
    const fill = shuffled(rest, rnd).slice(0, POOL_OF_KIND.budget - need.length - pairDs.length);
    const ids = shuffled(need.concat(pairDs, fill), rnd);
    const stickers = ids.map(id => ({ id: id, theme: STICKERS[id].theme, right: need.indexOf(id) >= 0 }));
    return { kind: kind, theme: theme, stem: quizSpeech({ kind: kind, theme: theme }),
             need: need, stickers: stickers, placed: [], sel: null, budget: BUDGET_N,
             _miss: 0, _answered: false };
  }
  /* conflict：候选 7=need+配对干扰 min(3,配对件数)+补位（跨主题干扰筛负荷） */
  const pairDs = shuffled(pairItems, rnd).slice(0, Math.min(3, pairItems.length));
  const rest = STICKER_IDS.filter(id => need.indexOf(id) < 0 && pairDs.indexOf(id) < 0);
  const fill = shuffled(rest, rnd).slice(0, POOL_OF_KIND.conflict - need.length - pairDs.length);
  const ids = shuffled(need.concat(pairDs, fill), rnd);
  const stickers = ids.map(id => ({ id: id, theme: STICKERS[id].theme, right: need.indexOf(id) >= 0 }));
  return { kind: kind, theme: theme, stem: quizSpeech({ kind: kind, theme: theme }),
           need: need, stickers: stickers, placed: [], sel: null, budget: null,
           _miss: 0, _answered: false };
}

/* ---------- 错位件序（anti：相邻错位件互异——确定性直选：prev 在池内则从余集取，池全 ≥2 恒可异） ---------- */
function pickMisfit(theme, rnd, prev) {
  const pool = MISFIT[theme];
  const cands = prev != null && pool.indexOf(prev) >= 0 ? pool.filter(x => x !== prev) : pool;
  return cands[dr_ri(rnd, 0, cands.length - 1)];
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关随机章参数）
   rnd 消耗序（Python 对拍真值）：[dch(仅 flat≥20)] → 每题 [kind 序(mix：off+尾2)]
   →[theme 掷(+互异兜底掷)]→[misfit 掷(anti)]→[干扰构造+洗牌] ---------- */
const sigOfQ = q => q.kind + '|' + q.theme + '|' + q.need.join(',') + '|' + q.stickers.map(s => s.id).join(',');

function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? dch0 : dr_ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const kSeq = dch === 4 ? kindSeqOf(rnd) : null;
  const quizzes = [], sigs = new Set();                          // 关内签名互异（v1 同关 5 题互异沿袭）
  let prevTheme = null, prevMisfit = null;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const kind = dch === 4 ? kSeq[qi] : KINDS[dch - 1];
    let t = pickTheme(kind, rnd, flat, qi, prevTheme);
    let misfit = kind === 'anti' ? pickMisfit(t, rnd, prevMisfit) : null;
    let q = buildQuiz(t, kind, misfit, rnd);
    let k = 0;
    while (sigs.has(sigOfQ(q)) && k++ < 8) {                     // 签名重复（同题面同栏序）→ 整题重掷（确定性有界）
      t = pickTheme(kind, rnd, flat, qi, prevTheme);
      misfit = kind === 'anti' ? pickMisfit(t, rnd, prevMisfit) : null;
      q = buildQuiz(t, kind, misfit, rnd);
    }
    sigs.add(sigOfQ(q));
    quizzes.push(q);
    prevTheme = t; prevMisfit = misfit;
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 第一击引擎（无 DOM）：engTapSticker(L, i) —— 点贴纸栏第 i 片
   anti（单击即判，weather r9 同构）：
   'right'  点中错位件 → 本题完成推进（非末题）
   'done'   末题点中 = 整关通关
   'wrong'  点中合适件：该题 miss+1（retries 全关累计=星级口径），片摇头不推进
   conflict/budget（两击制，share 同构）：
   'sel'    选中（高亮，等第二击点兔子）
   'unsel'  再点同一片=取消选中
   'again'  点已贴上的片（早退零惩罚不计数，防御层）
   null     非法下标 / 关卡已结束 ---------- */
function engTapSticker(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.stickers.length) return null;
  if (q.kind === 'anti') {
    if (q.stickers[i].right) {
      q._answered = true;
      L.step++;
      if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
      return 'right';
    }
    q._miss++;
    L.retries++;
    return 'wrong';
  }
  if (q.placed.indexOf(q.stickers[i].id) >= 0) return 'again';
  q.sel = (q.sel === i) ? null : i;
  return q.sel === i ? 'sel' : 'unsel';
}

/* ---------- 第二击引擎（无 DOM）：engTapRabbit(L) —— 把选中片贴上（conflict/budget）
   'hold'   conflict：贴对一件 need 未齐挂起 / budget：装入未满员（对错都不判——预算取舍核心）
   'right'  conflict：need 全贴齐 / budget：满员检查全对 → 本题完成推进（非末题）
   'done'   末题完成 = 整关通关
   'wrong'  conflict：贴错（非 need 片）弹回 / budget：满员检查有错件（miss+1，错件自动
            退回对件保留——「放回去再挑一挑」）
   'full'   budget：槽满（防御层——满员即检下 placed 恒 <budget，正常不可达）
   'nosel'  无选中 / anti 题点兔子（反向题无第二击语义）
   null     关卡已结束 ---------- */
function engTapRabbit(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (q.kind === 'anti') return 'nosel';
  if (q.sel == null) return 'nosel';
  const st = q.stickers[q.sel];
  q.sel = null;
  if (q.kind === 'budget') {
    if (q.placed.length >= q.budget) return 'full';
    q.placed.push(st.id);
    if (q.placed.length < q.budget) return 'hold';          // 未满员：无即时对错反馈
    const hasWrong = q.placed.some(id => q.need.indexOf(id) < 0);
    if (!hasWrong) {                                        // 恰满且全对
      q._answered = true;
      L.step++;
      if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
      return 'right';
    }
    q._miss++;
    L.retries++;
    q.placed = q.placed.filter(id => q.need.indexOf(id) >= 0);   // 错件退回，对件保留
    return 'wrong';
  }
  /* conflict（v1） */
  if (st.right && q.placed.indexOf(st.id) < 0) {
    q.placed.push(st.id);
    if (q.need.every(id => q.placed.indexOf(id) >= 0)) {
      q._answered = true;
      L.step++;
      if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
      return 'right';
    }
    return 'hold';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}

/* ---------- 揭回引擎（budget 专属）：engPeel(L, idx) —— 揭回已装第 idx 件（零惩罚）
   返回揭回的贴纸 id；非 budget / 越界 / 已答 → false ---------- */
function engPeel(L, idx) {
  if (!L || L.done || L.step >= L.quizzes.length) return false;
  const q = L.quizzes[L.step];
  if (!q || q.kind !== 'budget' || q._answered) return false;
  if (!Number.isInteger(idx) || idx < 0 || idx >= q.placed.length) return false;
  const id = q.placed[idx];
  q.placed.splice(idx, 1);
  return id;
}
const engWon = L => !!L && L.done;
/* 星级（§0.57 口径沿 v1）：全关贴错 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 救援/教学用：下一件未完成目标片下标（conflict/budget=未贴 need 片；anti=错位件） */
const nextNeededIdx = q => {
  if (!q) return -1;
  for (let i = 0; i < q.stickers.length; i++) {
    if (q.stickers[i].right && q.placed.indexOf(q.stickers[i].id) < 0) return i;
  }
  return -1;
};

/* ---------- 结构校验（verify 用，返回失败原因或 null）：题型/封闭表/件数/干扰构成/
   贴纸池封闭 19/need 片在场/干扰不含 need/候选互异/相邻互异/初始态干净 ---------- */
function structWhy(q, dch, flat, qi, prevQ) {
  if (!q || !THEMES[q.theme]) return 'theme';
  if (KINDS.indexOf(q.kind) < 0) return 'kind';
  if (dch === 1 && q.kind !== 'conflict') return 'dch1kind';
  if (dch === 2 && q.kind !== 'budget') return 'dch2kind';
  if (dch === 3 && q.kind !== 'anti') return 'dch3kind';
  const items = THEMES[q.theme].items;
  const isAnchor = flat === 0 && qi === 0;                  // 教学演示题（贴雨衣雨靴）锚点
  if (isAnchor && (q.theme !== 'rain' || q.kind !== 'conflict')) return 'anchor';
  /* 封闭表：need ⊆ 主题表（anti 除外——错位件按定义跨主题，由下方 antiMisfit 校验） */
  if (q.kind !== 'anti') {
    for (let k = 0; k < q.need.length; k++) if (items.indexOf(q.need[k]) < 0) return 'needTable';
  }
  const ids = q.stickers.map(s => s.id);
  const poolOk = q.stickers.length === (q.kind === 'anti' ? items.length + 1 : POOL_OF_KIND[q.kind]);
  if (!poolOk) return 'poolLen:' + q.stickers.length;
  if (ids.filter((v, i, a) => a.indexOf(v) === i).length !== ids.length) return 'poolDup';
  if (!ids.every(v => STICKERS[v])) return 'poolLib';
  for (let k = 0; k < q.need.length; k++) if (ids.indexOf(q.need[k]) < 0) return 'needMissing';
  const rights = q.stickers.filter(s => s.right);
  if (rights.length !== q.need.length) return 'rightCount';
  for (let k = 0; k < q.stickers.length; k++) {
    const inNeed = q.need.indexOf(q.stickers[k].id) >= 0;
    if (q.stickers[k].right !== inNeed) return 'rightFlag';
    if (q.stickers[k].theme !== STICKERS[q.stickers[k].id].theme) return 'themeField';
  }
  if (q.kind === 'anti') {
    /* 反向：need=[错位件]∈MISFIT 表；其余片=主题全集（对件）；相邻错位件互异 */
    if (q.need.length !== 1) return 'antiLen';
    if (MISFIT[q.theme].indexOf(q.need[0]) < 0) return 'antiMisfit';
    if (!items.every(id => ids.indexOf(id) >= 0)) return 'antiItems';
    if (prevQ && prevQ.kind === 'anti' && prevQ.need[0] === q.need[0]) return 'adjMisfit';
  } else {
    /* conflict/budget：need=主题全集（rain 2/其余 3）；配对主题干扰下限 */
    const setEq = q.need.length === items.length && items.every(v => q.need.indexOf(v) >= 0);
    if (!setEq) return 'needFull';
    const pairN = q.stickers.filter(s => s.theme === PAIR_OF[q.theme] && !s.right).length;
    const wantPair = q.kind === 'budget' ? 2 : Math.min(3, THEMES[PAIR_OF[q.theme]].items.length);
    if (pairN < wantPair) return 'pairDistract:' + pairN;
    if (q.kind === 'budget') {
      if (BUDGET_THEMES.indexOf(q.theme) < 0) return 'budgetTheme';   // rain 2 件不入预算章
      if (q.budget !== BUDGET_N) return 'budgetN';
    }
  }
  /* 相邻主题互异（防同关连题同主题单调） */
  if (prevQ && prevQ.theme === q.theme) return 'adjacent';
  /* 初始态干净 */
  if (q.placed.length !== 0 || q.sel !== null || q._miss !== 0 || q._answered) return 'init';
  if (q.stem !== quizSpeech({ kind: q.kind, theme: q.theme })) return 'stem';
  return null;
}
/* ================= dressup 主逻辑（r10 三族判定 / 场景渲染 / 换装动画 / 教学 / 救援 / 推进 / 自由装扮）
   任务模式题型三族（SPEC-BATCH24 §8）：
   conflict 主题冲突池：题面=主题场景+TTS 题面句，候选 7 片（配对主题干扰 ≥min(3,配对件数)）。

/* ================= 换装动画：贴纸从栏飞到小兔子身上（.fly 克隆体 CSS transition §0.11）
   飞行结束后挂 badge；verify 页跳飞行只挂 badge ---------- */
function flySticker(el, id, run) {
  const wear = sceneEl.querySelector('#bunny-wear');
  const addBadge = () => {
    if (run && cur !== run) return;                       // 演出窗内重玩已重建关卡：丢弃迟到 badge
    if (!sceneEl.querySelector('#bunny-wear')) return;   // 场景已换题/换模式重建：丢弃迟到 badge
    renderBadge();
  };
  if (VERIFY || !el) { addBadge(); return; }
  const from = el.getBoundingClientRect();
  if (!wear) { addBadge(); return; }
  const to = wear.getBoundingClientRect();
  const fly = document.createElement('div');
  fly.className = 'flywear';
  fly.innerHTML = stickerSvg(id, 52);
  fly.style.left = from.left + 'px';
  fly.style.top = from.top + 'px';
  fly.style.transitionDuration = '430ms';
  document.body.appendChild(fly);
  const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  requestAnimationFrame(() => {
    fly.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.8)';
  });
  setTimeout(() => { fly.remove(); addBadge(); }, 450);
}
function bounceBack(el) {                        // 贴错：贴纸弹回（wig 晃动——卡不灰可重选）
  if (!el) return;
  replayAnim(el, 'wig');
}
/* 全场彩花（celebrate / free 偶发；verify 页跳过） */
function confettiBurst(cx, cy, n) {
  if (VERIFY) return;
  for (let i = 0; i < (n || 12); i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    c.style.left = Math.round(cx - 7) + 'px';
    c.style.top = Math.round(cy - 7) + 'px';
    document.body.appendChild(c);
    const dx = Math.round(Math.random() * 240 - 120), dy = Math.round(-50 - Math.random() * 130),
          rot = Math.round(Math.random() * 320 - 160);
    requestAnimationFrame(() => {
      c.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg)';
      c.style.opacity = '0';
    });
    setTimeout(() => c.remove(), 750);
  }
}
function sceneCenter() {

function danceRabbit(spin) {                     // 兔子跳；spin=true 章末转圈展示（§0.57 celebrate）

/* ================= 幽灵手指（教学"看/帮"/救援答案级共用） ================= */
const ghost = {

/* 教学"帮"阶段指向：当前题下一件未贴 need 片（教学锚恒 conflict 章——budget/anti 无教学期，

/* ================= 判定主路径（真实点击 / DR 钩子 / autoSolve / 教学演示共用）
   anti 单击即判 uiTapSticker：同步返回 'right'/'done'/'wrong'，反馈演出异步不阻塞返回值；
   conflict/budget 第一击 uiTapSticker：同步（选中/取消/again 早退零惩罚）；
   第二击 uiTapRabbit：飞行动画+判定（hold/right/done/wrong/full；nosel=无效 pop+bump）；
   budget：装入无即时对错反馈（hold），满员即检（错件退回+miss+1）；badge 可点揭回（零惩罚）；
   吞输入轻叮必配可见回应（贴纸栏容器 bump——b21 定版）；错贴 1000ms 防重入窗（b16 定案）；
   demo 通道仅 tutorialWatch/rescueAns 内部传 true（豁免锁，演示吞真实输入不误伤）========== */
function uiTapSticker(i, demo) {
  if (state.mode === 'free') return freeTapSticker(i);     // 自由模式分流（零判定零写档）
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo) || (state.busy && !demo)) {
    sfx('pop');
    replayAnim(trayEl, 'bump');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  if (q.kind === 'anti') {                          /* 反向题：单击即判（引擎同步判定，演出异步） */
    const r = engTapSticker(cur, i);
    if (r === null) { sfx('pop'); replayAnim(trayEl, 'bump'); return false; }
    lastAct = Date.now(); rescueDirDone = false; rescueAnsDone = false;
    if (!demo) void uiAntiFeedback(i, r);           /* 真实输入：反馈演出（fire-and-forget 不吞返回值） */
    return r;
  }
  const r = engTapSticker(cur, i);
  if (r === null) { sfx('pop'); replayAnim(trayEl, 'bump'); return false; }
  if (r === 'again') {                             /* 点已贴片：早退零惩罚不计数（§0.7 防御层）+可见回应 */
    sfx('pop');
    const el = stkBtnOf(i);
    if (el) replayAnim(el, 'bump');
    return 'again';
  }
  sfx('click');
  setSelHighlight(r === 'sel' ? i : null);          /* 选中高亮（class 切换，不重绘） */
  return r;                                        /* 'sel' | 'unsel' */
}

/* ================= anti 反馈演出（单击判定的异步半边：错=摇头+反向重定向；对=闪绿+ADV 窗推进）
   demo=true 时由 rescueAns 显式调用（uiTapSticker 演示路径不再自动触发，防双发）========== */
async function uiAntiFeedback(i, r, demo) {
  const run = cur;
  const el = stkBtnOf(i);
  if (r === 'wrong') {
    if (el) replayAnim(el, 'wig');
    dodgeLo();
    sayW(VOICE.antiHint);                           /* 要找不用带的一样哦（反向重定向，不泄答案） */
    state.locked = true;
    await wait(1000 * SPEED);                       /* 错点防重入窗（b16 定案） */
    if (cur === run) state.locked = false;
    return r;
  }
  /* right / done */
  if (el) { el.classList.remove('breathe'); el.classList.add('good'); }
  chimeGoal();
  danceRabbit();
  const cc = sceneCenter();
  confettiBurst(cc.x, cc.y, 10);
  sayP(VOICE.antiRight);                            /* 找对啦，它不用带 */
  state.locked = true;
  await wait(ADV_MS * SPEED);                       /* 推进窗=ADV_MS（M2 口径，注释对账 3200） */
  if (cur !== run) { state.locked = false; return r; }
  state.locked = false;
  if (r === 'done') { winFlow(); return r; }
  renderQuiz();
  return r;
}

/* ================= budget 揭回（任务模式）：点已装 badge=放回贴纸栏（零惩罚不计数）========== */
function taskPeel(idx) {
  if (!cur || state.won || state.locked || state.busy || state.demo) { sfx('pop'); return false; }
  const q = cur.quizzes[cur.step];
  if (!q || q.kind !== 'budget') { sfx('pop'); return false; }
  const id = engPeel(cur, idx);
  if (id === false) { sfx('pop'); replayAnim(sceneEl, 'bump'); return false; }
  sfx('pop');
  const ti = q.stickers.findIndex(s => s.id === id);
  if (ti >= 0) markHeld(ti, false);                 /* 该片恢复可选（class 切换） */
  renderBadge();
  lastAct = Date.now(); rescueDirDone = false; rescueAnsDone = false;
  return id;
}
async function uiTapRabbit(demo) {
  if (state.mode === 'free') return freeTapRabbit();       // 自由模式分流
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo) || (state.busy && !demo)) {
    sfx('pop');
    replayAnim(sceneEl, 'bump');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  if (q.kind === 'anti') {                        /* 反向题无第二击：点兔子=轻反馈（题面由 hear 钮重读） */
    sfx('pop');
    replayAnim(sceneEl, 'bump');
    return false;
  }
  if (q.sel == null) {                             /* 未选贴纸点兔子=无效（share 定版） */
    sfx('pop');
    replayAnim(sceneEl, 'bump');
    return false;
  }
  const run = cur;                                 /* 身份守卫：演出窗内重玩会重建 cur */
  const i = q.sel;
  const el = stkBtnOf(i);
  const sid = q.stickers[i].id;
  const prePlaced = q.placed.slice();              /* budget：检查后退回错片对账用 */
  state.busy = true;                               /* 占位锁同步置位：飞行窗内紧邻输入=拒绝 */
  flySticker(el, sid, run);
  await wait(300 * SPEED);
  if (cur !== run) { state.busy = false; return false; }
  const r = engTapRabbit(cur);
  if (r === null || r === 'nosel') { state.busy = false; sfx('pop'); replayAnim(sceneEl, 'bump'); return false; }
  if (r === 'full') {                              /* budget 槽满防御层：须先揭回（正常不可达——满员即检） */
    state.busy = false;
    sfx('pop'); replayAnim(sceneEl, 'bump');
    sayR(VOICE.budgetHint);
    return 'full';
  }
  lastAct = Date.now(); rescueDirDone = false; rescueAnsDone = false;   /* 有效动作重置救援钟（§0.7a） */
  if (r !== 'wrong') renderBadge();    /* verify 页飞行即渲染（真实页 flySticker 450ms 后幂等重绘） */

  if (r === 'wrong') {
    if (q.kind === 'budget') {                     /* 满员检查未过：错件已退回（对件保留）——错片摇头+栏态复原 */
      const gone = prePlaced.concat([sid]).filter(id => q.placed.indexOf(id) < 0);
      renderBadge();
      gone.forEach(id => {
        const ti = q.stickers.findIndex(s => s.id === id);
        const gel = ti >= 0 ? stkBtnOf(ti) : null;
        if (gel) { markHeld(ti, false); replayAnim(gel, 'wig'); }
      });
      setSelHighlight(null);
      dodgeLo();
      sayW(VOICE.budgetHint);                      /* 只能带三样，放回去再挑一挑（核心反馈不受 flat 门） */
    } else {                                       /* conflict 贴错：弹回+软反馈（v1） */
      bounceBack(el);
      setSelHighlight(null);
      dodgeLo();
      sayW(VOICE.wrong);                           /* 现在不用这个哦（核心反馈不受 flat 门） */
    }
    state.locked = true;
    await wait(1000 * SPEED);                      /* 错贴防重入窗 1000ms（b16 定案） */
    if (cur !== run) return r;
    state.locked = false;
    state.busy = false;
    return r;
  }

  if (state.tut === 'help' && !demo) {             /* 教学"独"：首次真贴 → 放手 */
    state.tut = 'solo';
    ghost.hide();
    danceRabbit();
  }
  if (el) { el.classList.remove('breathe'); el.classList.add('held'); }
  chimeHold();
  sfx('coin');
  await wait(TAP_MS * SPEED);                      /* 挂 badge 飞行窗（TAP_MS=430，时长模型同名窗） */
  if (cur !== run) { state.busy = false; return r; }
  state.busy = false;
  if (r === 'hold') { danceRabbit(); return 'hold'; }   /* 装入未齐/未满：挂起（badge 已可见——budget 对错都不判） */

  /* right / done：本题完成——兔子跳+彩花 → 下一题/通关 */
  chimeGoal();
  danceRabbit();
  const cc = sceneCenter();
  confettiBurst(cc.x, cc.y, 10);
  if (r === 'right') sayP(VOICE.right);            /* 中题 clip（flat<3）；done 的收尾语由 winFlow 全量播 */
  state.locked = true;
  await wait(ADV_MS * SPEED);                 /* 推进窗=ADV_MS 3200（M2：dru_right 2664 实长+余量，播完再读新题） */
  if (cur !== run) { state.locked = false; return r; }
  state.locked = false;
  if (r === 'done') { winFlow(); return 'done'; }
  renderQuiz();                                    /* 新题（场景/贴纸栏/badge 全换）+读题 */
  if (state.tut === 'help') pointHelpNext();
  return r;
}

/* ================= 幽灵手指两击演示（教学"看"与 30s 答案级救援共用）
   指贴纸→按→选中；指兔子→按→贴上（demo 通道豁免锁）。返回第二击结果。 ================= */

/* ================= 自由装扮（零判定零写档零星级——piano free 同构 §0.13 不计步）
   任意贴（两击同构）/ 点已贴 badge 揭下 / 清空钮；freeState 独立于 cur（levels/step 永不动）========== */

/* ================= 教学（仅关 1-0 首次）：看→帮→独

async function tutorialWatch() {

/* ================= 救援钟（任务模式静置；verify 页由 verify 直驱函数测）——piano 双锚结构

   （一次性锚 rescueDirDone，不重置 lastAct——30s 答案级可达）
   30s 答案级=帮做：conflict 幽灵手指演示贴一件 / budget 先揭回一件错件（若有）再演示装一件
   对的（帮做不制造 miss）/ anti 幽灵手指点错位件；演示=有效动作重开救援窗 ================= */
function rescueDir() {
  if (!cur || cur.done) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q._answered) return false;
  speakQuiz(q);                                    /* 重读题面（TTS） */
  if (q.kind === 'conflict') {
    const i = nextNeededIdx(q);                    /* need 中未贴物品在贴纸栏 pulse */
    if (i >= 0) {
      const el = stkBtnOf(i);
      if (el) replayAnim(el, 'pulse');
    }
    return true;
  }
  replayAnim(sceneEl, 'pulse');                    /* budget/anti：场景脉冲（方向锚不泄答案） */
  return true;
}
async function rescueAns() {
  if (!cur || cur.done) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q._answered) return false;
  if (q.kind === 'anti') {                         /* 反向：幽灵手指点错位件（单击即判，帮做整题） */
    const i = nextNeededIdx(q);
    if (i < 0) return false;
    state.demo = true;
    pointGhostAt(stkBtnOf(i));
    await wait(780 * SPEED);
    ghost.press();
    await wait(320 * SPEED);
    const r = uiTapSticker(i, true);
    await uiAntiFeedback(i, r, true);
    ghost.hide();
    state.demo = false;
    const ok = r === 'right' || r === 'done';
    if (ok) { lastAct = Date.now(); rescueDirDone = false; rescueAnsDone = false; }
    return ok;
  }
  if (q.kind === 'budget') {                       /* 预算：先揭回一件错件（若有）再演示装一件对的 */
    state.demo = true;
    const wrongIdx = q.placed.findIndex(id => q.need.indexOf(id) < 0);
    if (wrongIdx >= 0) {
      const badge = sceneEl.querySelectorAll('#bunny-wear .wear')[wrongIdx];
      if (badge) {
        pointGhostAt(badge);
        await wait(700 * SPEED);
        ghost.press();
        await wait(300 * SPEED);
      }
      const id = engPeel(cur, wrongIdx);
      if (id !== false) {
        const ti = q.stickers.findIndex(s => s.id === id);
        if (ti >= 0) markHeld(ti, false);
        renderBadge();
        sfx('pop');
      }
      await wait(400 * SPEED);
    }
    const i = nextNeededIdx(q);
    let r = false;
    if (i >= 0) r = await demoPlace(i);
    state.demo = false;
    const ok = r === 'hold' || r === 'right' || r === 'done';
    if (ok) { lastAct = Date.now(); rescueDirDone = false; rescueAnsDone = false; }
    return ok;
  }
  /* conflict（v1）：幽灵手指演示贴一件 */
  const i = nextNeededIdx(q);
  if (i < 0) return false;
  const before = q.placed.length;
  state.demo = true;                               /* 审查m2：救援演出期关真实输入门（与教学路径对称） */
  const r = await demoPlace(i);                    /* 幽灵手指两击演示贴一件（真贴——帮做一件） */
  state.demo = false;                              /* demoPlace 全路径返回后恢复 */
  const ok = r === 'hold' || r === 'right' || r === 'done';
  if (ok && q.placed.length === before + 1) {
    lastAct = Date.now();                          /* 演示=有效动作：重开救援窗（答案级不饿死） */
    rescueDirDone = false; rescueAnsDone = false;
  }
  return ok;
}

  if (idle > 14000 && !rescueDirDone) { rescueDirDone = true; rescueDir(); return; }

/* ================= 验收钩子（getter 模式，返回拷贝非活引用；start(flat)=外部切关入口） ================= */
window.DR = {
  start(flat) { startLevel(flat); },
  get currentLevel() {
    if (!cur) return null;
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.quizzes.length,
             step: cur.step, done: cur.done, won: state.won,
             miss: cur.retries, stars: engStars(cur) };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    return { kind: q.kind,                                     /* SPEC §8 钩子契约（r10 三族） */
             budget: q.budget,                                 /* 预算章槽位数（他族 null） */
             theme: q.theme,
             need: q.need.slice(),                             /* 需贴 id 数组（anti=[错位件]） */
             stickers: q.stickers.map(s => ({ id: s.id, theme: s.theme, right: s.right })),
             sel: q.sel,                                       /* 选中态下标（两击制外部驱动观测面——wall-clock 驱动靠它分流第二击；null=未选） */
             placed: q.placed.slice(),                         /* 已贴 id 数组 */
             step: cur.step,
             miss: q._miss || 0 };                             /* 本题贴错数 */
  },
  tapSticker(i) { return uiTapSticker(i); },                   /* 第一击/anti 单击即判：i=stickers 下标 */
  tapRabbit() { return uiTapRabbit(); },                       /* 第二击：把选中贴上（conflict/budget） */
  peel(i) { return taskPeel(i); },                             /* budget：揭回第 i 个已装件（零惩罚） */
  mode() { return state.mode; },
  setMode(m) { return setMode(m); },
  freePeel(i) { return freePeel(i); },                         /* free：揭下第 i 个 badge（辅助观测） */
  freeClear() { return freeClear(); },
  async autoSolve() {                    // UI 路径自动完成当前关（三族分流，走真实判定链）
    let taps = 0, guard = 0;
    while (cur && !cur.done && guard++ < 400) {
      if (state.mode !== 'task') break;
      if (state.locked || state.busy || state.won || state.demo) { await wait(60); continue; }
      const q = cur.quizzes[cur.step];
      if (!q) break;
      if (q.kind === 'anti') {                    // 反向：单击错位件 → 等演出窗走完推进
        const i = q.stickers.findIndex(s => s.right);
        if (i < 0) break;
        const before = cur.step;
        const r = uiTapSticker(i);
        if (r === false) break;
        if (r === 'right' || r === 'done') {
          taps++;
          for (let k = 0; k < 120 && cur.step === before && !cur.done; k++) await wait(80);

        continue;

        const i = nextNeededIdx(q);
        if (i < 0) break;
        const r = uiTapSticker(i);
        if (r === false) break;
        continue;
      }
      const r = await uiTapRabbit();
      if (r === false || r === null) break;
      if (r === 'wrong') continue;               // 弹回后重选重贴（正常不发生——need 片恒 right）
      taps++;
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
  get tutorial() { return state.tut; }
};
