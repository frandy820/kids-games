<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影子配对</title>
<style>
/* ================= 影子配对 shadow（batch11 · r8 难度改造版）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   r8 玩法 = 多物同框连解（题面 3-4 彩色 emoji 一排，当前目标高亮圈，连对消显）+
   全卡随机旋转 0/90/180/270（.glyph rotate 心像旋转）+ 灌木遮蔽只露 30% 轮廓（.veil 层
   挡卡下方 70%）+ 两物影子重叠拆解（题面叠影团，双选配对）。
   剪影 = 同款 emoji CSS filter:brightness(0) opacity(.82)（零资源离线）。
   点对 = 剪影点亮回彩色 + 消显（.gone 保留布局）+ 题面对应 emoji 亮绿；本题全部连对才换题。
   点错 = 晃动（干扰卡灰掉排除法保底；未来目标卡不灰——接下来还要连）。
   题面/选项零文字标签（§0.19，emoji 大字 + 语音承载全部语义）；
   触摸目标：剪影卡 = 主答案按钮 ≥96×96（§0.9）；底栏按钮 ≥64；overflowX 恒 0 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面行（多物 emoji 一排 / 重叠叠影团）+ 剪影卡区 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;overflow:hidden;padding:8px 14px}

/* 题面行：点题卡 = 重听当前题面（儿童高发探索动作） */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:132px;padding:0 8px}
#prompt-chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
  min-height:120px;padding:8px 30px 12px;border-radius:26px;background:#FFF9EE;
  border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;transition:transform .15s}
#prompt-chip:active{transform:translateY(3px)}
/* r8 多物题面行：3-4 个彩色 emoji 一排；当前目标 .cur 橙圈跳动；连对后 .hit 亮绿定格 */
.t-row{display:flex;align-items:center;justify-content:center;gap:14px;min-height:84px}
.t-item{position:relative;display:flex;align-items:center;justify-content:center;
  width:72px;height:78px;border-radius:18px;transition:transform .25s}
.t-item .t-glyph{font-size:56px;line-height:1.15;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.t-item.cur{background:rgba(232,151,90,.16);box-shadow:inset 0 0 0 3px #E8975A;
  animation:t-bob 1.9s ease-in-out infinite}
.t-item.hit{background:rgba(143,191,127,.2);box-shadow:inset 0 0 0 3px #8FBF7F;
  animation:t-hug .55s cubic-bezier(.2,1.6,.4,1)}
.t-item.hit .t-glyph{filter:saturate(1.15)}
@keyframes t-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes t-hug{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px) scale(1.08)}}
#prompt-chip .t-shadow{width:74px;height:13px;border-radius:50%;background:rgba(74,59,46,.16)}
/* r8 重叠拆解题面：两个剪影叠成一团（错位 ~35%，各自半透明；选中配对后对应物 .hit 点亮回彩色） */
.ovl-wrap{position:relative;width:132px;height:84px}
.ovl-g{position:absolute;font-size:58px;line-height:1.15;filter:brightness(0) opacity(.8);
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  transition:filter .4s,transform .4s}
.ovl-g.g1{left:6px;top:2px}
.ovl-g.g2{left:52px;top:24px}
.ovl-wrap .ovl-g.hit{filter:none;transform:scale(1.14)}
/* 答对配对（本题全部连对）：题面亮绿 + 弹一下 */
#prompt-chip.paired{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;
  animation:chip-pair .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes chip-pair{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}

/* ---------- 剪影卡区：一行 3-5 张卡（多物 3-4 + 1 干扰），卡 = 主答案按钮 ≥96×96 ---------- */
#board{flex:0 0 auto;display:flex;gap:18px;justify-content:center;align-items:stretch;
  width:100%;max-width:780px;padding:0 2px}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 5px 0 #D8C9B4;flex:0 0 auto;width:128px;min-height:150px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
.card:active{transform:translateY(3px)}
/* 剪影 = 同款 emoji brightness(0) opacity(.82)；.gwrap 固定方盒承旋转（量测稳定 §0.11） */
.card .gwrap{width:98px;height:102px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card .glyph{display:inline-block;font-size:68px;line-height:1.15;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  filter:brightness(0) opacity(.82);
  transform:rotate(var(--rot,0deg));transition:filter .5s}
/* r8 灌木遮蔽层：挡住卡下方 70%（只露 30% 轮廓）；草丛齿形 SVG 拉伸铺满 */
.card .veil{position:absolute;left:-3px;right:-3px;bottom:-3px;height:70%;
  pointer-events:none;z-index:3}
.card .veil svg{width:100%;height:100%;display:block}
/* 答对：剪影点亮回彩色 + 卡绿（连对一步演出前半） */
.card.lit{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;
  animation:card-lit .5s cubic-bezier(.2,1.6,.4,1);z-index:2}
.card.lit .glyph{filter:none}
@keyframes card-lit{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
/* r8 连对消显：点亮后淡出定格（保留布局稳定，后续目标继续连）；pointer-events 收走防重点 */
.card.gone{opacity:.18;transform:scale(.9);pointer-events:none;filter:saturate(1.4)}
/* overlap 双选第一张选中态：亮边定格等待第二张 */
.card.sel{border-color:#E8975A;box-shadow:0 5px 0 #E8975A}
.card.sel .glyph{filter:none}
/* 入场弹跳（换题 stagger） */
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 答错：晃动后灰掉（干扰卡排除法保底；未来目标卡只晃不灰——还要连） */
.card.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}
  55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
.card.dim{opacity:.42;transform:scale(.93);pointer-events:none;box-shadow:0 3px 0 #D8C9B4}
/* 连错 2 次后 / 救援视觉重现：当前应点剪影呼吸高亮循环（§0.21 breathe 持续在屏；首错不 pulse） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 点亮后的飞行克隆体（本题完成：飞到题面配对） */
.fly{position:fixed;z-index:90;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:52px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  background:#FFF9EE;border:3px solid #6FA063;box-shadow:0 4px 0 #6FA063;pointer-events:none;
  transition:transform .43s cubic-bezier(.3,.85,.35,1.08)}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch9/10） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：卡/题面适配，主答案卡仍 ≥96 */
@media (orientation:portrait){
  #board{gap:12px}
  .card{width:114px;min-height:138px}
  .card .gwrap{width:86px;height:90px}
  .card .glyph{font-size:60px}
  #prompt{min-height:120px}
  #prompt-chip{min-height:108px;padding:6px 22px 10px}
  .t-row{gap:8px;min-height:72px}
  .t-item{width:60px;height:64px;border-radius:14px}
  .t-item .t-glyph{font-size:46px}
  .ovl-wrap{width:112px;height:70px}
  .ovl-g{font-size:48px}
  #prompt-chip .t-shadow{width:62px;height:11px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="影子配对">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <button id="prompt-chip" aria-label="题目，点我再听一遍"></button>
    </div>
    <div id="board" aria-label="影子卡片"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
