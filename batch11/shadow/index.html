<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影子配对</title>
<style>
/* ================= 影子配对 shadow（batch11 · r8 难度改造版）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   r8 玩法 = 多物同框连解（题面 3-4 彩色 emoji 一排，当前目标高亮圈，连对消显）+
   全卡随机旋转 0/90/180/270（.glyph rotate 心像旋转）+ 灌木遮蔽只露 30% 轮廓（.veil 层
   挡卡下方 70%）+ 两物影子重叠拆解（题面叠影团，双选配对）。
   剪影 = 同款 emoji CSS filter:brightness(0) opacity(.82)（零资源离线）。
   点对 = 剪影点亮回彩色 + 消显（.gone 保留布局）+ 题面对应 emoji 亮绿；本题全部连对才换题。
   点错 = 晃动（干扰卡灰掉排除法保底；未来目标卡不灰——接下来还要连）。
   题面/选项零文字标签（§0.19，emoji 大字 + 语音承载全部语义）；
   触摸目标：剪影卡 = 主答案按钮 ≥96×96（§0.9）；底栏按钮 ≥64；overflowX 恒 0 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面行（多物 emoji 一排 / 重叠叠影团）+ 剪影卡区 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;overflow:hidden;padding:8px 14px}

/* 题面行：点题卡 = 重听当前题面（儿童高发探索动作） */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:132px;padding:0 8px}
#prompt-chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
  min-height:120px;padding:8px 30px 12px;border-radius:26px;background:#FFF9EE;
  border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;transition:transform .15s}
#prompt-chip:active{transform:translateY(3px)}
/* r8 多物题面行：3-4 个彩色 emoji 一排；当前目标 .cur 橙圈跳动；连对后 .hit 亮绿定格 */
.t-row{display:flex;align-items:center;justify-content:center;gap:14px;min-height:84px}
.t-item{position:relative;display:flex;align-items:center;justify-content:center;
  width:72px;height:78px;border-radius:18px;transition:transform .25s}
.t-item .t-glyph{font-size:56px;line-height:1.15;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.t-item.cur{background:rgba(232,151,90,.16);box-shadow:inset 0 0 0 3px #E8975A;
  animation:t-bob 1.9s ease-in-out infinite}
.t-item.hit{background:rgba(143,191,127,.2);box-shadow:inset 0 0 0 3px #8FBF7F;
  animation:t-hug .55s cubic-bezier(.2,1.6,.4,1)}
.t-item.hit .t-glyph{filter:saturate(1.15)}
@keyframes t-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes t-hug{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px) scale(1.08)}}
#prompt-chip .t-shadow{width:74px;height:13px;border-radius:50%;background:rgba(74,59,46,.16)}
/* r8 重叠拆解题面：两个剪影叠成一团（错位 ~35%，各自半透明；选中配对后对应物 .hit 点亮回彩色） */
.ovl-wrap{position:relative;width:132px;height:84px}
.ovl-g{position:absolute;font-size:58px;line-height:1.15;filter:brightness(0) opacity(.8);
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  transition:filter .4s,transform .4s}
.ovl-g.g1{left:6px;top:2px}
.ovl-g.g2{left:52px;top:24px}
.ovl-wrap .ovl-g.hit{filter:none;transform:scale(1.14)}
/* 答对配对（本题全部连对）：题面亮绿 + 弹一下 */
#prompt-chip.paired{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;
  animation:chip-pair .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes chip-pair{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}

/* ---------- 剪影卡区：一行 3-5 张卡（多物 3-4 + 1 干扰），卡 = 主答案按钮 ≥96×96 ---------- */
#board{flex:0 0 auto;display:flex;gap:18px;justify-content:center;align-items:stretch;
  width:100%;max-width:780px;padding:0 2px}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 5px 0 #D8C9B4;flex:0 0 auto;width:128px;min-height:150px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
.card:active{transform:translateY(3px)}
/* 剪影 = 同款 emoji brightness(0) opacity(.82)；.gwrap 固定方盒承旋转（量测稳定 §0.11） */
.card .gwrap{width:98px;height:102px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card .glyph{display:inline-block;font-size:68px;line-height:1.15;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  filter:brightness(0) opacity(.82);
  transform:rotate(var(--rot,0deg));transition:filter .5s}
/* r8 灌木遮蔽层：挡住卡下方 70%（只露 30% 轮廓）；草丛齿形 SVG 拉伸铺满 */
.card .veil{position:absolute;left:-3px;right:-3px;bottom:-3px;height:70%;
  pointer-events:none;z-index:3}
.card .veil svg{width:100%;height:100%;display:block}
/* 答对：剪影点亮回彩色 + 卡绿（连对一步演出前半） */
.card.lit{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;
  animation:card-lit .5s cubic-bezier(.2,1.6,.4,1);z-index:2}
.card.lit .glyph{filter:none}
@keyframes card-lit{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
/* r8 连对消显：点亮后淡出定格（保留布局稳定，后续目标继续连）；pointer-events 收走防重点 */
.card.gone{opacity:.18;transform:scale(.9);pointer-events:none;filter:saturate(1.4)}
/* overlap 双选第一张选中态：亮边定格等待第二张 */
.card.sel{border-color:#E8975A;box-shadow:0 5px 0 #E8975A}
.card.sel .glyph{filter:none}
/* 入场弹跳（换题 stagger） */
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 答错：晃动后灰掉（干扰卡排除法保底；未来目标卡只晃不灰——还要连） */
.card.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}
  55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
.card.dim{opacity:.42;transform:scale(.93);pointer-events:none;box-shadow:0 3px 0 #D8C9B4}
/* 连错 2 次后 / 救援视觉重现：当前应点剪影呼吸高亮循环（§0.21 breathe 持续在屏；首错不 pulse） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 点亮后的飞行克隆体（本题完成：飞到题面配对） */
.fly{position:fixed;z-index:90;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:52px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  background:#FFF9EE;border:3px solid #6FA063;box-shadow:0 4px 0 #6FA063;pointer-events:none;
  transition:transform .43s cubic-bezier(.3,.85,.35,1.08)}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch9/10） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：卡/题面适配，主答案卡仍 ≥96 */
@media (orientation:portrait){
  #board{gap:12px}
  .card{width:114px;min-height:138px}
  .card .gwrap{width:86px;height:90px}
  .card .glyph{font-size:60px}
  #prompt{min-height:120px}
  #prompt-chip{min-height:108px;padding:6px 22px 10px}
  .t-row{gap:8px;min-height:72px}
  .t-item{width:60px;height:64px;border-radius:14px}
  .t-item .t-glyph{font-size:46px}
  .ovl-wrap{width:112px;height:70px}
  .ovl-g{font-size:48px}
  #prompt-chip .t-shadow{width:62px;height:11px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="影子配对">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <button id="prompt-chip" aria-label="题目，点我再听一遍"></button>
    </div>
    <div id="board" aria-label="影子卡片"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

        ——那张卡接下来还要用；连错零惩罚口径不变）
     ③ 两物影子重叠拆解：两个影子叠成一团，选出"这两个是谁的影子"双选
   章进阶（4 章 ×5 关 = 静态 20 关；生成关随机章参数）：
     ch1 多物连解（qi0 2 物热身；qi1-4 3-4 物 +1 干扰；零旋转零遮蔽）
     ch2 + 全卡随机旋转（qi0 热身全 0；qi1-4 目标卡恒非 0）
     ch3 + 遮蔽 70%（qi0 热身无遮蔽零旋转；qi1-4 遮蔽+旋转叠加）
     ch4 重叠拆解（qi0 热身；qi1-2 overlap 双选；qi3-4 混排=多物+遮蔽+旋转）
   注：LIB 15 项按 SPEC §1 枚举实现（枚举 6+4+5=15）。 */

const CH_LEN = 5;          // 5 题 = 1 关

   r8 注：sha_tut_watch/sha_tut_turn/sha_hint 三键 2026-09-10 起在 manifest 被 batch23/share

/* 题面整句（SPEC §1 例句：'找一找，谁的影子是小猫呀'）——读题/救援/重听共用；
   multi 题每连对一物换目标重读（q.t=当前 phase 目标，sha_q_* clip 逐物复用） */
const quizSpeech = q => '找一找，谁的影子是' + nameOf(q.t) + '呀';
/* overlap 双选题面句（r8 新键 sha_q_pair；两个影子叠成一团拆解） */
const pairSpeech = q => '这两个影子叠在一起啦，找一找是谁的影子呀';

/* ---------- SAPI 拼句时长估计（家族定版字面，禁 +300 变体——四处同步：
   本定义 / game-main 注释 / game-verify 断言 / build.py 字面 assert） */
const estMs = n => n * 345 + 600;

/* ---------- r8 单关推算时长模型（5-6 岁试玩口径，保守下界；verify 硬断言 ≥40s）
   STEP_MS.plain 每连对一步（零旋转单物辨识+触摸+消显演出）2.6s
   STEP_MS.rot   全卡旋转（心像旋转加成）3.0s
   STEP_MS.veil  遮蔽 70%（部分轮廓辨识+旋转叠加）3.2s
   STEP_MS.ovl   overlap 双选每步（双物拆解）3.6s
   SWITCH_MS     每题切换演出窗 900ms（game-main 既有 wait 口径）
   每连对步 = max(题面句语音窗 estMs(句长), 辨识步值)——语音窗与辨识重叠取大者不重复计
   （原版实测锚：5 步零旋转单选关 9-18s → 每步含演出 1.8-3.6s，plain 取低端 2.6s） */
const STEP_MS = { plain: 2600, rot: 3000, veil: 3200, ovl: 3600 };
const SWITCH_MS = 900;
const LEVEL_MIN_MS = 40000;   // 审计 #13 治理线：单关推算 ≥40s
/* 单题推算时长（verify 与独立副本共用源） */
function quizDurMs(q) {
  if (q.mode === 'overlap') return estMs(pairSpeech(q).length) + 2 * STEP_MS.ovl;
  let ms = 0;
  q.targets.forEach(tg => {
    const voice = estMs(quizSpeech({ t: tg }).length);
    let cog = STEP_MS.plain;
    if (q.veil[0]) cog = STEP_MS.veil;
    else if (q.rot.some(v => v !== 0)) cog = STEP_MS.rot;
    ms += Math.max(voice, cog);
  });
  return ms;
}
/* 单关推算时长（≥LEVEL_MIN_MS 硬断言用） */
const levelDurMs = L => L.quizzes.reduce((s, q) => s + quizDurMs(q), 0) + CH_LEN * SWITCH_MS;
/* 单关决策步数（连对/双选子步总数；r8 第二道锚 ≥13——防"纯语音窗撑时长"失判别） */
const levelSteps = L => L.quizzes.reduce((s, q) => s + (q.mode === 'overlap' ? 2 : q.targets.length), 0);

/* ---------- 图标（内嵌 SVG 描线风；题面/选项图案用 emoji 系统字体） */
const ICONS = {

  logo: '<svg viewBox="0 0 44 44" width="30" height="30" xmlns="http://www.w3.org/2000/svg" fill="none">' +

    '<ellipse cx="28.5" cy="30.5" rx="10" ry="5.4" fill="' + INK + '" opacity=".82" transform="rotate(-14 28.5 30.5)"/></svg>',
  hear: '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' +

    '<path d="M40 12 L48 30 L30 30 Z" fill="#8A9BAE"/></svg>',
  finger: '<svg viewBox="0 0 64 76" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M28 8 a8 8 0 0 1 16 0 v30 l8 4 a10 10 0 0 1 6 9 v10 a12 12 0 0 1 -12 12 h-12 a14 14 0 0 1 -14 -14 V30 Z" fill="#FFF" opacity=".93" stroke="#E8DCC8" stroke-width="2"/>' +
    '<ellipse cx="35" cy="44" rx="10" ry="6" fill="#F2B8C6" opacity=".35"/></svg>',
  /* 灌木遮蔽层（r8 机制①：挡住剪影卡下方 70%，只露 30% 轮廓；草丛齿形） */
  bush: '<svg viewBox="0 0 100 76" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M0 76 V38 Q7 20 15 34 Q20 10 30 30 Q36 6 46 28 Q52 12 58 30 Q66 8 74 32 Q82 14 88 34 Q94 22 100 38 V76 Z" ' +
    'fill="#8FBF7F" stroke="' + INK + '" stroke-width="2.5" stroke-linejoin="round"/></svg>'
};
/* ================= shadow 纯引擎（r8）：确定性关卡生成 + 连解/重叠点选判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   r8 题型（章进阶见 game-data 头注；dch=难度章号 (ch-1)%4+1 循环，生成关随机 1-4）：
     multi   多物同框连解：targets 2-4 物 + 1 干扰卡；逐物连对（连对消显 _pick，_phase 推进）；
             点"未来目标卡"= 晃动零惩罚不灰（该卡接下来还要连）——wrong 但不 _dim
     overlap 两物重叠拆解：pair 同组 2 物 + 2 同组干扰；双选（选对 2 张完成本题）
   旋转（机制①）：全卡随机（multi qi1+ 于 dch2/3：目标卡恒 ∈{90,180,270}、干扰卡含 0 随机）；
     热身题（各章 qi0）与 dch1 全 0——新维度首现给无新维度样本（§1 承 batch10 P1②）
   遮蔽（机制①叠加）：q.veil 全卡一致（只遮答案卡会反向泄题）；dch3 qi1+ 与 dch4 qi3+ 开启
   干扰：同组优先（round 组恰 4 物：multi4 时组内不足补邻组）；相邻题主目标互异（首目标代表） */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
const pick1 = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;
const GROUPS = ['quad', 'round', 'feat'];

/* ---------- 目标组选取：随机起组轮询，组内（排除上题主目标 avoidOne）够 cnt 物则取。
   avoidOne=上题首目标单 id（组容量 quad6/feat5/round4，排 1 后恒有组可选——
   "相邻题主目标互异"原口径，multi 下取首目标代表，避免全集不交约束击穿小组容量） */
function pickGroupIds(rnd, cnt, avoidOne) {
  const g0 = Math.floor(rnd() * GROUPS.length);
  for (let k = 0; k < GROUPS.length; k++) {
    const pool = LIB_IDS.filter(id => groupOf(id) === GROUPS[(g0 + k) % GROUPS.length] && id !== avoidOne);
    if (pool.length >= cnt) return shuffled(pool, rnd).slice(0, cnt);
  }
  return shuffled(LIB_IDS.filter(id => id !== avoidOne), rnd).slice(0, cnt);   // 理论不可达兜底
}

/* ---------- 单题生成（rnd 同流保证确定性；avoidOne=上题首目标，相邻题主目标互异）
   返回 {mode, targets[](multi 连解目标序/overlap=pair 双选), options[](库 id 含全部目标+干扰，互异),
   rot[](各卡旋转), veil[](各卡遮蔽——全卡一致), _dim[](灰化), _pick[](连对消显), _phase(子步), _miss, _answered} */
function genOne(dch, qi, rnd, avoidOne) {
  const warm = qi === 0;                                // 各章首题热身：无本章新维度（§1 承 batch10 P1②）
  if (dch === 4 && !warm && qi <= 2) {                  // ---- overlap 两物重叠拆解（dch4 qi1-2）----
    /* pair 同组 2 物 + 2 同组干扰，零旋转零遮蔽（重叠本身即本章新维度）；组内排除首目标后 ≥4 则取 */
    const g0 = Math.floor(rnd() * GROUPS.length);
    let pool = [];
    for (let k = 0; k < GROUPS.length; k++) {
      const cand = LIB_IDS.filter(id => groupOf(id) === GROUPS[(g0 + k) % GROUPS.length] && id !== avoidOne);
      if (cand.length >= 4) { pool = shuffled(cand, rnd); break; }
    }
    if (pool.length < 4) pool = shuffled(LIB_IDS.filter(id => groupOf(id) === 'quad' && id !== avoidOne), rnd);
    const options = shuffled(pool.slice(0, 4), rnd);
    return { mode: 'overlap', targets: null, pair: pool.slice(0, 2),
             options: options, rot: options.map(() => 0), veil: options.map(() => false),
             _dim: options.map(() => 0), _pick: options.map(() => 0), _phase: 0,
             _miss: 0, _answered: false };
  }
  /* ---- multi 多物连解：dch1 qi0=2 物热身 / dch1 qi1-4=3-4 物 / dch2-4 qi0=3 物热身 / 其余 3 物 ---- */
  const cnt = dch === 1 ? (warm ? 2 : ri(rnd, 3, 4)) : 3;
  const targets = pickGroupIds(rnd, cnt, avoidOne);
  const tg = groupOf(targets[0]);
  /* 干扰 1 张：同组优先（组内非目标剩余），不足补邻组（multi4 round 组场景） */
  let ds = shuffled(LIB_IDS.filter(id => groupOf(id) === tg && targets.indexOf(id) < 0), rnd).slice(0, 1);
  if (!ds.length) {
    ds = shuffled(LIB_IDS.filter(id => groupOf(id) !== tg && targets.indexOf(id) < 0), rnd).slice(0, 1);
  }
  const options = shuffled(targets.concat(ds), rnd);
  /* 旋转：热身/dch1 全 0；dch2/3 qi1-4 与 dch4 qi3-4——目标卡恒非 0（每题必有旋转样本），
     干扰卡含 0 随机（全卡随机=公平无元线索，不泄答案） */
  const spin = !warm && dch !== 1 && !(dch === 4 && qi <= 2);
  const rot = options.map(id => {
    if (!spin) return 0;
    return targets.indexOf(id) >= 0 ? pick1(rnd, [90, 180, 270]) : pick1(rnd, [0, 90, 180, 270]);
  });
  /* 遮蔽 70%（全卡一致）：dch3 qi1+ 与 dch4 qi3+ 开启（机制①叠加态） */
  const veilOn = !warm && (dch === 3 || (dch === 4 && qi >= 3));
  return { mode: 'multi', targets: targets, pair: null,
           options: options, rot: rot, veil: options.map(() => veilOn),
           _dim: options.map(() => 0), _pick: options.map(() => 0), _phase: 0,
           _miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关随机章参数） */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const quizzes = [];
  let avoidOne = null;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genOne(dch, qi, rnd, avoidOne);
    avoidOne = (q.targets || q.pair)[0];           // 相邻题主目标互异（首目标代表）
    quizzes.push(q);
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 当前应点卡下标（multi=当前 phase 目标卡 / overlap=pair 中第一张未选卡）
   UI 高亮、救援 breathe、autoSolve、verify 驱动共用同一真值源 */
function wantOf(q) {
  if (!q) return -1;
  if (q.mode === 'overlap') {
    return q.options.findIndex((id, i) => q.pair.indexOf(id) >= 0 && !q._pick[i]);
  }
  return q.options.indexOf(q.targets[q._phase]);
}

/* ---------- 点选引擎（无 DOM）：engTap(L, i) —— 点第 i 张剪影卡
   'right' 连对一步（本题未完）/ 'done' 最后一步完成且本关通关（right 的完成态超集在题末返回）
   'wrong' 答错（干扰卡灰掉排除法保底；未来目标卡晃动零惩罚不灰——还要连）
   'again' 已灰/已消显卡（早退零惩罚不计数，防御层；真实点击被 pointer-events:none 拦，hook 兜底）
   null 非法下标或关卡已结束 ---------- */
function engTap(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!Number.isInteger(i) || i < 0 || i >= q.options.length) return null;
  if (q._dim[i] || q._pick[i]) return 'again';
  const hit = q.mode === 'overlap'
    ? q.pair.indexOf(q.options[i]) >= 0
    : i === wantOf(q);
  if (hit) {
    q._pick[i] = 1;
    q._phase++;                                    // multi=已连对物数 / overlap=已选对数
    if (q._phase >= (q.mode === 'overlap' ? 2 : q.targets.length)) {
      q._answered = true;
      L.step++;
      if (L.step >= L.quizzes.length) L.done = true;
      return L.done ? 'done' : 'right';
    }
    return 'right';                                // 连对一步，本题未完（消显后连下一物）
  }
  /* wrong：multi 未来目标卡不灰（该卡接下来还要连——"连错零惩罚"不破坏后续连解） */
  const future = q.mode === 'multi' && q.targets.indexOf(q.options[i]) >= 0;
  if (!future) q._dim[i] = 1;
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级：一关零错点（retries=0）=3 星；总错点 ≤2=2 星；否则 1 星。永不 0 星（SPEC §1） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：mode 合法 / 目标在库互异 / 候选含全部目标互异
   / 旋转 ∈{0,90,180,270} / veil 布尔全卡一致 / 初始态干净。返回具体失败原因便于审计 */
function structWhy(q) {
  if (!q) return 'q';
  if (q.mode !== 'multi' && q.mode !== 'overlap') return 'mode';
  const tg = q.targets, n = q.options.length;
  if (q.mode === 'multi') {
    if (!Array.isArray(tg) || tg.length < 2 || tg.length > 4) return 'tgtLen';
    if (tg.some(id => !LIB[id])) return 'tgtLib';
    if (tg.filter((v, i, a) => a.indexOf(v) === i).length !== tg.length) return 'tgtDup';
    if (n !== tg.length + 1) return 'optLen';             // multi = targets + 1 干扰
  } else {
    if (!Array.isArray(q.pair) || q.pair.length !== 2) return 'pairLen';
    if (q.pair.some(id => !LIB[id])) return 'pairLib';
    if (q.pair[0] === q.pair[1]) return 'pairDup';
    if (groupOf(q.pair[0]) !== groupOf(q.pair[1])) return 'pairGrp';   // 重叠双物同组
    if (n !== 4) return 'optLen';                        // overlap = pair + 2 干扰
  }
  const uniq = q.options.filter((v, i, a) => a.indexOf(v) === i);
  if (uniq.length !== n) return 'optDup';
  if (!q.options.every(v => LIB[v])) return 'optLib';
  if (!(q.mode === 'multi' ? tg.every(id => q.options.indexOf(id) >= 0)
                           : q.pair.every(id => q.options.indexOf(id) >= 0))) return 'optCover';
  if (!Array.isArray(q.rot) || q.rot.length !== n) return 'rotLen';
  for (let i = 0; i < n; i++) {
    if ([0, 90, 180, 270].indexOf(q.rot[i]) < 0) return 'rotVal';
  }
  if (!Array.isArray(q.veil) || q.veil.length !== n) return 'veilLen';
  if (!q.veil.every(v => v === q.veil[0])) return 'veilMix';    // 全卡一致（公平无元线索）
  if (q._miss !== 0) return 'miss';
  if (!q._dim.every(v => !v)) return 'dim';
  if (!q._pick.every(v => !v)) return 'pick';
  if (q._phase !== 0) return 'phase';
  if (q._answered) return 'answered';
  return null;
}
/* ================= shadow 主逻辑（r8：多物连解 / 旋转遮蔽 / 重叠拆解）
   玩法：题面 = 3-4 个彩色 emoji 一排（当前目标橙圈高亮；overlap 题 = 两个剪影叠成一团），
   下方 3-5 张黑色剪影卡（同款 emoji CSS filter 生成；r8 全卡随机旋转 0/90/180/270，
   ch3+ 灌木遮蔽只露 30% 轮廓）。点对 = 剪影点亮回彩色 → 消显（.gone 定格）→ 题面下一目标
   高亮 + 播新目标题面句（sha_q_* 逐物复用）；本题全部连对 = 最后一物飞到题面配对换题。
   点错 = 晃动（干扰卡灰掉排除法保底；未来目标卡只晃不灰——接下来还要连，连错零惩罚），
   首错不 pulse，miss≥2 当前应点卡 breathe。救援 = 重读题面 + 应点卡 breathe 循环（§0.21）。
   开场/交接语音走顺序链（chainsum 定版形态）：play(sha_help) 后 2000ms 接力题面
   （qTimer 接力，禁双通道叠音）。语音窗估计=estMs n*345+600 家族定版（game-data 定义，
   注释/verify/build 四处同步；r8 时长模型用）。
   验收钩子：window.SH = { get currentLevel, get quiz(){mode,target,name,targets,options,rot,
   veil,answerIdx,phase,picked,step,miss,dead}, tapCard(i), async autoSolve(), get tutorial }
   （getter 返回拷贝非活引用） */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/开场任务语音/读题不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音：flat<3 每错必播；flat≥3 走 10s 节流；force=q._miss===2 豁免恰一次
   （r8 multi 干扰只 1 张可灰但"未来目标卡"错点也计 miss——miss 无上限，===2 恰一次仍真值） */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.play(key, text); }
};

const stageEl = $id('stage'), boardEl = $id('board'), chipEl = $id('prompt-chip'),
      ghostEl = $id('ghost'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();
let lastBlankHint = 0;                          // 点空白/探索区轻提示节流（§0.16，10s）
let helpRedemo = false;
let ghostReason = null;                         // 'tut' | 'scaffold'
let qTimer = null;                              // 开场/教学链 clip→题面 的接力定时器

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const cardEl = i => boardEl.querySelector('.card[data-i="' + i + '"]');
/* 当前目标 id（multi=targets[phase] / overlap=pair[phase]）——读题/题面/救援共用 */
const curTarget = q => q.mode === 'overlap' ? q.pair[q._phase] : q.targets[q._phase];

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 72);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：连对成功=双音上行 / 答错=低柔单音 */
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };

/* ================= 题面语音（读题 sayR 级不受 flat 门）
   multi=当前目标句（连对换物即换句，sha_q_* 逐物 clip 复用）；overlap=叠影双选句（sha_q_pair）；
   重入先清接力定时器（防旧题残留切断新题面） */
function speakQuiz(q) {
  if (!q) return;
  if (qTimer) { clearTimeout(qTimer); qTimer = null; }
  if (q.mode === 'overlap') {
    KIDS.voice.play('sha_q_pair', pairSpeech(q));
  } else {
    const t = curTarget(q);
    KIDS.voice.play('sha_q_' + t, quizSpeech({ t: t }));
  }
}

/* ================= 开场顺序链（§0.5/§0.6，chainsum 定版形态：quiet 标志防渲染插播）
   play(sha_help) 后 2000ms 接力题面（hint clip ~1.6s，留白 2s 防叠音；禁 play 直接切断题面） */
function openingSpeak() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  if (qTimer) { clearTimeout(qTimer); qTimer = null; }   /* 防上一关接力残留切断本关 */
  sayR(VOICE.hint.key, VOICE.hint.text);
  qTimer = setTimeout(() => {
    qTimer = null;
    speakQuiz(cur.quizzes[cur.step]);
  }, 2000);
}

/* ================= 渲染 ================= */
function renderChip(q) {                        // 题面行：多物一排 / 重叠叠影团（零文字标签 §0.19）
  chipEl.classList.remove('paired');
  if (q.mode === 'overlap') {
    chipEl.innerHTML = '<span class="ovl-wrap">' +
      '<span class="ovl-g g1">' + emojiOf(q.pair[0]) + '</span>' +
      '<span class="ovl-g g2">' + emojiOf(q.pair[1]) + '</span></span>' +
      '<span class="t-shadow" aria-hidden="true"></span>';
    chipEl.setAttribute('aria-label', pairSpeech(q) + '，点我再听一遍');
    return;
  }
  let row = '<span class="t-row">';
  q.targets.forEach((tg, k) => {
    row += '<span class="t-item" data-k="' + k + '"><span class="t-glyph">' + emojiOf(tg) + '</span></span>';
  });
  chipEl.innerHTML = row + '</span><span class="t-shadow" aria-hidden="true"></span>';
  chipEl.setAttribute('aria-label', quizSpeech({ t: q.targets[q._phase] }) + '，点我再听一遍');
  updateChipPhase(q);
}
function updateChipPhase(q) {                   // multi：连对项 .hit 定格 / 当前项 .cur 橙圈跳动
  if (q.mode !== 'multi') return;
  const items = chipEl.querySelectorAll('.t-item');
  Array.prototype.forEach.call(items, (it, k) => {
    it.classList.toggle('hit', k < q._phase);
    it.classList.toggle('cur', k === q._phase && !q._answered);
  });
}
function renderBoard(q) {                       // 剪影卡：emoji 剪影 + 旋转 --rot + 灌木遮蔽层
  boardEl.innerHTML = '';
  q.options.forEach((id, i) => {
    const b = document.createElement('button');
    b.className = 'card pop' + (q._dim[i] ? ' dim' : '') + (q._pick[i] ? ' gone' : '');
    b.dataset.i = i;
    b.dataset.sid = id;                         // verify 对账（渲染即引擎）
    b.setAttribute('aria-label', nameOf(id) + '的影子');
    b.style.setProperty('--rot', (q.rot[i] || 0) + 'deg');
    b.style.animationDelay = (i * 70) + 'ms';
    b.innerHTML = '<span class="gwrap"><span class="glyph">' + emojiOf(id) + '</span></span>' +
      (q.veil[i] ? '<span class="veil" aria-hidden="true">' + ICONS.bush + '</span>' : '');
    boardEl.appendChild(b);
  });
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderChip(q);
  renderBoard(q);
  renderStep();
  if (!VERIFY && !state.demo && !state.quiet) speakQuiz(q);  /* 开场/换题读题；demo 门防演示收尾叠播；quiet=开场/教学交接改顺序链 */
}
function renderStep() {                         // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 点亮消显配对（§0.11：CSS transition，时长随 SPEED）
   连对一步：源卡 .lit 点亮回彩色 → .gone 消显定格（同步前缀供验收窗内读 DOM）→ 题面
   对应项 .hit；本题最后一物：克隆飞行体 fixed 从源卡矩形到题面矩形 → 题面 .paired 亮绿 */
function flyCard(el, id) {
  const dur = 430 * SPEED;
  const to = chipEl.getBoundingClientRect();
  if (!el) return dur;
  const from = el.getBoundingClientRect();
  const fly = document.createElement('div');
  fly.className = 'fly';
  fly.textContent = emojiOf(id);
  fly.style.left = from.left + 'px';
  fly.style.top = from.top + 'px';
  fly.style.width = from.width + 'px';
  fly.style.height = from.height + 'px';
  fly.style.transitionDuration = dur + 'ms';
  document.body.appendChild(fly);
  const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  const k = Math.min(to.width, to.height) / Math.max(from.width, from.height) * 1.15;
  requestAnimationFrame(() => {
    fly.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + k.toFixed(3) + ')';
  });
  setTimeout(() => fly.remove(), dur + 90);     // transition 结束后移除飞行体
  return dur;
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show(reason) { ghostReason = reason; ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostReason = null; ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el, reason) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show(reason);
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向：当前题当前目标的剪影卡 */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  pointGhostAt(cardEl(wantOf(q)), 'tut');
}

/* ================= 剪影卡点选主路径（真实点击 / SH.tapCard / autoSolve 共用） ================= */
async function uiTapCard(i, demo) {
  /* locked 门拦真实输入；demo 通道仅 tutorialWatch 内部传 true（豁免 locked）。
     吞输入期轻反馈（§0.22）：真实点击被 locked/demo/won 吞时 sfx('pop') 轻叮，返回值/状态不变 */
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) {
    sfx('pop');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const run = cur;                              /* 身份守卫：演出窗口内重玩会重建 cur，防旧续体错推进 */
  const r = engTap(cur, i);
  if (r === null) return false;
  if (r === 'again') return 'again';            /* 已灰/已消显卡：早退零惩罚不计数（§0.7 防御层） */
  const el = cardEl(i);

  if (r === 'wrong') {                          /* 答错：晃动；干扰卡灰掉（排除法保底）/未来目标卡不灰 */
    if (el) {
      el.classList.remove('wig'); void el.offsetWidth; el.classList.add('wig');
      if (q._dim[i]) el.classList.add('dim');   /* 渲染即引擎：灰化由引擎 _dim 驱动（未来目标卡不灰） */
    }
    dodgeLo();
    sayW(VOICE.wrong.key, VOICE.wrong.text, q._miss === 2);  /* flat<3 每错必播 / flat≥3 10s 节流+豁免恰一次 */
    if (q._miss >= 2) {                         /* 首错不 pulse：连错 2 次才高亮当前应点剪影 */
      const ok = cardEl(wantOf(q));
      if (ok) { ok.classList.remove('breathe'); void ok.offsetWidth; ok.classList.add('breathe'); }
    }
    await wait(480 * SPEED);
    return r;
  }

  /* ---- 连对一步：剪影点亮回彩色（同步前缀）→ 停半拍 → 消显/本题完成则飞行配对 → 推进 ---- */
  lastAct = Date.now();                         /* 仅正确推进重置救援钟（§0.7a） */
  if (state.tut === 'help') {                   /* 教学"独"：首次答对 → 强化反馈放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  const finished = q._answered;                 /* engTap 已推进 _phase（连对+1）/置 _answered（本题完成） */
  const hitId = q.options[i];
  if (el) { el.classList.remove('breathe'); el.classList.add('lit'); }
  chimeGoal();
  sfx('coin');
  await wait(620 * SPEED);                      /* 点亮停半拍（看清彩色回来） */
  if (cur !== run) return r;                    /* 演出窗内重玩已重建关卡：丢弃旧续体 */
  if (finished) {
    chipEl.classList.add('paired');             // 题面亮绿（同步前缀，供验收窗内读 DOM）
    flyCard(el, hitId);                         /* 本题最后一物：飞到题面旁配对 */
    await wait(430 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    if (cur.done) winFlow();
    else renderQuiz();
    return r;
  }
  /* 连对但本题未完：消显定格 + 题面下一目标高亮 + 播新目标题面句（连解节奏） */
  if (el) { el.classList.add('gone'); el.classList.remove('lit'); }
  if (q.mode === 'overlap') {                   /* overlap 第一选：题面叠影对应物点亮 + 卡 .sel 定格 */
    const gs = chipEl.querySelectorAll('.ovl-g');
    Array.prototype.forEach.call(gs, g => { if (g.textContent === emojiOf(hitId)) g.classList.add('hit'); });
    if (el) el.classList.add('sel');
    if (el) el.classList.remove('gone');        /* 双选第一张不消显（等第二张一起完成） */
  } else {
    updateChipPhase(q);                         /* multi：连对项 hit 定格 / 下一目标 cur 高亮 */
  }
  if (!state.demo && !state.quiet) speakQuiz(q);  /* 新目标题面句（demo 门防演示叠播；quiet=教学交接链） */
  await wait(700 * SPEED);                      /* 消显+高亮移动演出窗 */
  if (cur !== run) return r;
  state.locked = false;
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = Math.max(0, (flat == null ? cur.flat : flat) | 0);
  /* 预告=接下来首个新关（f+1）的难度章文案：静态段取其所属章 CHAPTERS 章末预告；
     生成关（家族契约 F）禁"章索引加一取模"字面——须实算 genLevel(f+1).dch 取 GEN_HINTS */
  /* r7 审查 M1 同型坑：静态章末预告=CHAPTERS[floor(f/CH_LEN)+1]（SPEC §0.4 口径），
     禁 floor((f+1)/CH_LEN)+1 off-by-one 式（章末关恒多进一章） */
  if (f + 1 < STATIC_LEVELS) return CHAPTERS[Math.floor(f / CH_LEN) + 1].hint;
  return GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) });   /* 家族契约 A：dayEnd 预告传 nextHint(lim-1) */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);               // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  /* verify 页恒走 openingSpeak（stub 记录开场链供断言，教学由真实页自测覆盖） */

async function runVerify() {

  let npass = 0, total = 0;
  const libDist = {};
  LIB_IDS.forEach(id => { libDist[id] = 0; });
  const genDch = { 1: 0, 2: 0, 3: 0, 4: 0 };
  const rotCov = { 90: 0, 180: 0, 270: 0 };

  /* ---- r8 时长独立副本常量（SPEC §1-r8 时长模型口径，文字重列禁引引擎常量互证） ---- */
  const V_EST = c => c * 345 + 600;             // estMs 家族定版式（12 码点题面句→4740 / overlap 20 码点→7500）
  const V_PLAIN = 2600, V_ROT = 3000, V_VEIL = 3200, V_OVL = 3600, V_SW = 900, V_MIN = 40000, V_STEP_MIN = 13;
  const vQuizDur = q => {
    if (q.mode === 'overlap') return V_EST(20) + 2 * V_OVL;    // 叠影句 20 码点（独立点数）+双选两步
    let ms = 0;

      else if (q.rot.some(v => v !== 0)) cog = V_ROT;           // 全卡旋转（心像旋转）
      ms += Math.max(V_EST(12), cog);                           // 题面句 12 码点（15 物中名恒 2 字）与辨识重叠取大
    }
    return ms;

  let durMin = Infinity, stepsMin = Infinity;

  /* ---- ① 40 关全量审计（flat 0-39） ---- */
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1.quizzes) === JSON.stringify(L2.quizzes);   // 确定性
    const chOk = L1.ch === Math.floor(flat / CH_LEN) + 1;
    const dchOk = flat < STATIC_LEVELS ? L1.dch === diffOfCh(L1.ch)
                                     : (L1.dch >= 1 && L1.dch <= 4);         // 生成关随机章参数
    if (flat >= STATIC_LEVELS) genDch[L1.dch]++;

      const tg = groupOf((q.targets || q.pair)[0]);
      const n = q.options.length;
      /* r8 章规则（独立副本：SPEC §1-r8 章进阶文字重列） */
      if (k === 0) {                                                          // 各章首题热身：multi3（dch1=2 物）、零旋转无遮蔽
        if (q.mode !== 'multi' || q.veil.some(v => v) || q.rot.some(v => v !== 0)) ruleOk = false;
        if (L1.dch === 1 && (q.targets.length !== 2 || n !== 3)) ruleOk = false;

        if (q.mode !== 'multi' || q.rot.some(v => v !== 0) || q.veil.some(v => v)) ruleOk = false;
        if (q.targets.length < 3 || q.targets.length > 4 || n !== q.targets.length + 1) ruleOk = false;
      } else if (L1.dch === 2) {                                              // ch2：qi1-4 目标卡恒 90/180/270

        if (q.targets.length !== 3 || n !== 4) ruleOk = false;
        q.targets.forEach(tg2 => {

          else rotCov[r2]++;
        });

        if (k <= 2) {
          if (q.mode !== 'overlap' || n !== 4 || q.rot.some(v => v !== 0) || q.veil.some(v => v)) ruleOk = false;
          if (groupOf(q.pair[0]) !== groupOf(q.pair[1])) ruleOk = false;

        } else {

          if (q.targets.length !== 3 || n !== 4) ruleOk = false;
          q.targets.forEach(tg2 => {

      if (q.mode === 'multi') {

        if (!q.options.every(id => q.targets.indexOf(id) >= 0 ||

    const p = row.split('|');
    const it2 = LIB[p[0]];
    if (!it2 || it2.e !== p[1] || it2.n !== p[2] || it2.g !== p[3]) refOk = false;
  });
  /* quizSpeech / pairSpeech 独立拼句对账（SPEC §1 例句 + r8 重叠句） */
  const spOk = quizSpeech({ t: 'cat' }) === '找一找，谁的影子是小猫呀' &&
    quizSpeech({ t: 'frog' }) === '找一找，谁的影子是青蛙呀' &&
    quizSpeech({ t: 'ball' }) === '找一找，谁的影子是皮球呀' &&
    pairSpeech({ pair: ['cat', 'dog'] }) === '这两个影子叠在一起啦，找一找是谁的影子呀';
  /* r8 clips 注入对账（教学 3 新键 + overlap 题面 + 题面抽查 1；旧 sha_tut_watch 等 3 键已归
     batch23/share（2026-09-10 撞车事故）——shadow 侧不再引用，缺 clip=TTS 兜底）
     T46 阶段2（09-19）：wrong 纠错键 sha_w_same 在册入查 */
  const SHA_KEYS = ['sha_teach_watch', 'sha_teach_turn', 'sha_help', 'sha_q_pair', 'sha_q_cat', 'sha_w_same'];
  const clipOk = SHA_KEYS.every(k => !!KIDS.voice.clips[k]);
  /* estMs 家族定版（数值+字面双断言：12 码点→4740） */
  const estOk = estMs(12) === 4740 && estMs(20) === 7500 &&
    estMs.toString().indexOf('n * 345 + 600') >= 0 && estMs.toString().indexOf('+ 300') < 0;
  /* 开场顺序链（stub 记录）：play(sha_help) 后 2000ms 接力题面句 */
  const origP = KIDS.voice.play, origS = KIDS.voice.say;
  const playLog = [], sayLog = [];
  KIDS.voice.play = function (key) { playLog.push(String(key)); };
  KIDS.voice.say = function (t) { sayLog.push(String(t)); };
  startLevel(0);
  const openHint = playLog.indexOf('sha_help') >= 0;
  await wait(2300);                               // 等 2000ms 接力 落地
  const q0b = genLevel(0).quizzes[0];
  const t0b = q0b.targets[0];
  const qPlayAt = playLog.indexOf('sha_q_' + t0b);
  const openQ = (qPlayAt > playLog.indexOf('sha_help')) ||
    (sayLog.length >= 1 && sayLog[0] === quizSpeech({ t: t0b }));   /* clip 通道接力 / say=兜底态 */
  KIDS.voice.play = origP; KIDS.voice.say = origS;
  /* r8 家族契约 A/F/M1：nextHint 章末逐点独立副本（文字重列，禁引 CHAPTERS/GEN_HINTS 互证）。
     flat19（末静态关）的下一关 flat20=首个生成关 → 走生成关实算分支（与 24/29/34/39 同组） */
  const NH_STATIC = {
    0: '影子会转圈圈啦，转过的也要认出来',                       /* ch1 任意关 → 预告 ch2 */
    4: '影子会转圈圈啦，转过的也要认出来',                       /* 打完 ch1（章末） */
    7: '影子要躲进灌木丛啦，只露一点点',                         /* ch2 中段 → 预告 ch3 */
    9: '影子要躲进灌木丛啦，只露一点点',                         /* 打完 ch2 */
    12: '两个影子会叠成一团，拆开看看是谁',                      /* ch3 中段 → 预告 ch4 */
    14: '两个影子会叠成一团，拆开看看是谁',                      /* 打完 ch3 */
    17: '新一轮影子配对大挑战'                                   /* ch4 中段 → 预告（CHAPTERS[4]） */
  };
  const nhStaticOk = Object.keys(NH_STATIC).every(f => nextHint(Number(f)) === NH_STATIC[f]);
  const nhGenOk = [19, 24, 29, 34, 39].every(f => nextHint(f) === GEN_HINTS[genLevel(f + 1).dch - 1]) &&
    nextHint.toString().indexOf('genLevel(f + 1).dch') >= 0 &&    /* 生成关实算式在场（契约 F） */
    nextHint.toString().indexOf('(ci + 1) %') < 0 &&              /* 禁章索引取模字面（契约 F） */
    nextHint.toString().indexOf('CHAPTERS[Math.floor(f / CH_LEN) + 1].hint') >= 0;  /* M1 定版式 */
  const nhOk = nhStaticOk && nhGenOk;
  const distOk = refOk && spOk && clipOk && estOk && openHint && openQ && nhOk &&
    genDch[1] >= 1 && genDch[2] >= 1 && genDch[3] >= 1 && genDch[4] >= 1 &&  /* 生成关随机章参数全覆盖 */
    rotCov[90] >= 1 && rotCov[180] >= 1 && rotCov[270] >= 1 &&              /* 旋转三向覆盖 */
    LIB_IDS.every(id => libDist[id] >= 1);        // 40 关 15 项剪影目标全覆盖（确定性断言）
  if (distOk) npass++;
  units.dist = { ok: distOk, libRef: refOk, speech: spOk, clips: clipOk, estMs: estOk,
                 openHint: openHint, openQ: openQ, nextHint: nhOk, genDch: genDch,
                 rotCov: rotCov, libDist: libDist };
  units.durModel = { ok: durMin >= V_MIN && stepsMin >= V_STEP_MIN,
                     minMs: durMin, minSteps: stepsMin, floorMs: V_MIN, floorSteps: V_STEP_MIN };

  const out = { game: 'shadow', total: total, pass: npass, layoutOk: layoutOk,
                levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
