<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>形状分家</title>
<style>
/* ================= 形状分家 shapeshome（batch11 · r8 难度改造 2026-09-14）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   零文字依赖（§0.19）：题面=家卡（三维目标图形 / 否定徽章+问号）或九宫格（? 缺格符号），选项=3 张图形卡
   触摸目标：图形卡（主答案按钮）≥96、题面区按钮 ≥64（实际 ~340×260）、底栏按钮 ≥72；
   卡/家内图形 SVG ≥64（大小维=盒内缩放，触摸面不变）；pointerdown 即响应；
   布局=flex column + 九宫格 HTML grid（§0.15 结构化内容优先）
   答对=图形卡飞进家山墙圆窗/九宫格缺格 + 家亮灯（.lit）；答错=晃动+灰掉 pointer-events:none（灰化款） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#F6E2C8;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：家卡（上）+ 图形卡区（下） ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:6px 12px;overflow:hidden}

/* 题面区（家卡/九宫格；点击=重听题面，3s 节流） */
#home{flex:0 0 auto;width:min(400px,88vw);background:none;border:none;padding:0;
  transition:transform .15s;position:relative}
#home:active{transform:scale(.98)}
#home>svg{width:100%;height:auto}
#home .win rect{transition:fill .25s}
/* 家亮灯（答对飞入后）：两窗暖黄 + 山墙圆窗光晕 + 图形弹一下（§2 玩法） */
#home.lit .win rect{fill:#F7D24E}
#home.lit .gwin{filter:drop-shadow(0 0 14px rgba(247,210,78,.85))}
#home .hshape{transform:translate(140px,74px) scale(.92) translate(-50px,-50px)}
#home.lit .hshape{animation:h-pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes h-pop{
  0%{transform:translate(140px,74px) scale(.92) translate(-50px,-50px) scale(1)}
  60%{transform:translate(140px,74px) scale(.92) translate(-50px,-50px) scale(1.16)}
  100%{transform:translate(140px,74px) scale(.92) translate(-50px,-50px) scale(1)}}
#home.wig{animation:home-wig .4s ease}
@keyframes home-wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-1.6deg)}70%{transform:rotate(1.6deg)}}

/* ---------- 九宫格（ch3 缺格推理）：HTML grid（§0.15）；3×92px 列 + gap/padding ≤340 竖屏放得下 ---------- */
#home .ggrid{display:grid;grid-template-columns:repeat(3,92px);grid-auto-rows:92px;gap:8px;
  padding:10px;background:#FFFDF7;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 5px 0 #D8C9B4;margin:0 auto}
#home .gcell{border-radius:14px;background:#FBF4E4;display:flex;align-items:center;justify-content:center}
#home .gcell svg{width:66px;height:66px;pointer-events:none}
/* 缺格：虚线框 + 大问号（符号非文字标签，语音"问号"锚定）；答对填入 .filled */
#home .gmiss{border:3px dashed #E8975A;background:#FFF9EE;color:#E8975A;
  font-size:52px;font-weight:700;line-height:1;font-family:inherit}
#home .gmiss.filled{border-style:solid;border-color:#8FBF7F;background:#8FBF7F}
#home.lit .ggrid{box-shadow:0 5px 0 #D8C9B4,0 0 18px rgba(247,210,78,.9)}
#home.lit .gmiss.filled{animation:h-pop2 .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes h-pop2{0%{transform:scale(1)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---------- 图形卡区：3 张卡（主答案按钮 ≥96） ---------- */
#cards{flex:0 0 auto;display:flex;align-items:stretch;justify-content:center;gap:20px;
  flex-wrap:wrap;padding:2px 8px 4px;max-width:100%}
.card{position:relative;min-width:150px;min-height:136px;padding:8px 16px;border-radius:24px;
  background:#FFFDF7;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s,background .2s,opacity .2s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card svg{width:92px;height:92px;pointer-events:none}
/* 答对：绿卡 + 勾角标（随后飞进家） */
.card.right{background:#8FBF7F;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.card.right .mark{position:absolute;top:-14px;right:-14px;width:42px;height:42px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.card.right .mark svg{width:26px;height:26px}
@keyframes opt-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
/* 答错：晃动 + 灰掉不可再点（零惩罚 §0.7；灰化款 miss 封顶 2） */
.card.wrong{background:#EFE3CD;border-color:#C9BDA8;box-shadow:0 3px 0 #C9BDA8;
  opacity:.5;pointer-events:none}
.card.wrong{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* 连错 2 次：正确卡两连脉冲高亮（首错不 pulse，给再想机会） */
.card.pulse{animation:opt-pulse 1s ease 2}
@keyframes opt-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 救援（静置 14s）：正确卡 breathe 循环在屏（§0.21 高亮类） */
.card.breathe{animation:card-breathe 1.6s ease-in-out infinite}
@keyframes card-breathe{
  0%,100%{filter:none;box-shadow:0 5px 0 #D8C9B4}
  50%{filter:drop-shadow(0 0 15px rgba(232,151,90,.95));box-shadow:0 5px 0 #E8975A}}
/* 吞输入期轻反馈摆动（§0.22，配 sfx('pop')） */
.card.wig{animation:card-wig .4s ease}
@keyframes card-wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}

/* 飞行图形（答对：卡图形克隆飞进家山墙圆窗） */
.flyer{position:fixed;z-index:90;width:92px;height:92px;pointer-events:none;opacity:.96;
  will-change:transform}
.flyer svg{width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(74,59,46,.28))}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch9） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：家与卡收紧（家 340 宽 + 3×144 卡 + gap 放得下 800 宽） */
@media (orientation:portrait){
  #home{width:min(340px,90vw)}
  .card{min-width:144px;min-height:128px}
  .card svg{width:86px;height:86px}
  #cards{gap:14px}
  #stage{gap:10px}
}
</style>
</head>
<body>
<div id="game" aria-label="形状分家">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="home" aria-label="图形的家，点我听题目"></button>
    <div id="cards" aria-label="图形卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
