<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大小排排队</title>
<style>
/* ================= 大小排序 sortsize（batch11 · r19 难度改造 2026-09-18）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   r19 三题型（SPEC §-r19）：sort 全排序（6-7 物相近档）/ dual 双属性（3 档×红蓝皮球，
   先大小再颜色）/ ord 序数（点"第 N 大/N 小"的那一个）。
   题面语音给指令 + 上方"排序条" + 下方 6-7 张 emoji 卡（font-size 级差缩放互异大小）。
   点对=emoji CSS transition 飞入排序条下一格；点错=晃动（不灰化可重点，SPEC §3）。
   零文字依赖（§0.19）：sort/dual 方向由"大象→蚂蚁 渐变示意+箭头"视觉承载（题面卡与
   排序条起点端双冗余）；dual 加"首色→次色"色序徽章；ord 题=sizes 序圆点行+第 rank 位
   套圈高亮（视觉序=尺寸序，与展示乱序区隔防"第 N 个"位置混淆）；槽内数字=序数标记。
   触摸目标：emoji 卡 = 主答案按钮 ≥96×96（§0.9）；底栏按钮 ≥64；overflowX 恒 0。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F5CFA0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面方向卡 + 排序条（带方向示意）+ emoji 卡区 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:8px 14px}

/* 方向渐变示意（大象→蚂蚁=从大到小 / 蚂蚁→大象=从小到大，+ 箭头；零文字依赖）
   prompt 卡=大号可点重听；dir-badge=排序条起点端小号冗余（SPEC §3 方向视觉承载）
   dual 追加色序徽章（首色→次色，与题面句"一样大的红/蓝皮球排在前面"同向，SPEC §-r19） */
.dir-glyphs{display:flex;align-items:center;gap:2px;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.dir-glyphs .d{line-height:1}
.dir-glyphs .d-arrow{width:30px;height:24px;flex:0 0 30px;margin:0 3px}
.d-legend{display:flex;align-items:center;gap:2px;margin-left:8px;padding-left:10px;
  border-left:2.5px dashed #E0CFAF}
.d-legend .lg{line-height:1}
.d-legend .lg-arrow{width:20px;height:17px;flex:0 0 20px}
#dir-badge .d-legend .lg-arrow{width:16px;height:14px;flex:0 0 16px}
#dir-badge .d-legend{margin-left:5px;padding-left:7px}

/* 序数题面锚（SPEC §-r19）：n 个 size 序圆点行，第 rank 位套圈高亮呼吸（橙圈） */
.ord-anchor{display:flex;align-items:flex-end;gap:6px;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ord-anchor .oa{display:inline-block;line-height:1;color:#D8C9B4;position:relative}
.ord-anchor .oa.ring{color:#E8975A}
.ord-anchor .oa.ring::after{content:'';position:absolute;inset:-7px;border:3.5px solid #E8873A;
  border-radius:50%;animation:oa-ring 1.1s ease-in-out infinite}
@keyframes oa-ring{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:76px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;justify-content:center;gap:10px;padding:5px 26px;min-height:66px;
  min-width:64px;border-radius:22px;background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  transition:transform .15s}
#prompt-chip:active{transform:translateY(3px)}
#prompt-chip .dir-glyphs{gap:3px}
#prompt-chip .d-arrow{width:34px;height:26px;flex:0 0 34px}
#prompt-chip.pulse{animation:chip-pulse 1.2s ease 1}   /* r19 救援 14s 方向级：题面卡三态脉冲（不泄答案） */
@keyframes chip-pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.16)}}

/* 排序条：方向示意（起点端）+ n 槽横排；空槽=虚线+序号大字，亮槽=绿底+emoji（按比例缩放）
   ord 题=单槽大格（槽内数字=rank，SPEC §-r19 序数承载） */
#strip-wrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 4px}
#dir-badge{display:flex;align-items:center;flex:0 0 auto;padding:4px 8px;min-height:44px;
  border-radius:14px;background:#F5E9D2;border:2px solid #E0CFAF;pointer-events:none}
#dir-badge .d-arrow{width:24px;height:20px;flex:0 0 24px}
#dir-badge.teach{animation:badgeTeach 1.2s ease 2}   /* 教学期方向徽章首现显式教学（试玩 P2③） */
@keyframes badgeTeach{0%,100%{transform:scale(1);box-shadow:none}
  50%{transform:scale(1.26);box-shadow:0 0 16px rgba(232,151,90,.85)}}
#strip{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:nowrap}
.slot{width:84px;height:84px;border-radius:20px;border:3px dashed #D8C9B4;background:#FFF9EE;
  display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.slot .s-num{font-style:normal;font-size:30px;font-weight:800;color:#D8C9B4;line-height:1;
  font-variant-numeric:tabular-nums}
#strip.ord .slot{width:110px;height:110px;border-radius:26px}
#strip.ord .slot .s-num{font-size:40px;color:#E8975A}
.slot.lit{border-style:solid;border-color:#6FA063;background:#8FBF7F;
  animation:slot-lit .5s cubic-bezier(.2,1.6,.4,1)}
.slot.lit .s-num{position:absolute;top:-9px;right:-9px;width:27px;height:27px;border-radius:50%;
  background:#FFF9EE;border:2px solid #6FA063;color:#4A3B2E;font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.slot.lit .s-emoji{line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
@keyframes slot-lit{0%{transform:scale(.4)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
/* 飞入动画克隆体（CSS transition：源卡矩形 → 目标槽矩形） */
.fly{position:fixed;z-index:90;display:flex;align-items:center;justify-content:center;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  pointer-events:none;transition:transform .42s cubic-bezier(.3,.85,.35,1.08)}

/* emoji 卡区：一行 6-7 张卡（乱序大小展示），卡=主答案按钮 ≥96×96；无文字（§0.19） */
#board{flex:0 0 auto;display:flex;gap:12px;justify-content:center;align-items:stretch;
  width:100%;max-width:1180px;padding:0 2px}
#board.bump{animation:an-bump .4s ease}                /* 家族 D：吞输入期容器 bump（轻叮+可见反馈） */
@keyframes an-bump{0%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}65%{transform:translateY(3px)}}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  flex:1 1 0;min-width:96px;max-width:200px;min-height:132px;padding:6px 4px;transition:transform .15s}
.card:active{transform:translateY(3px)}
.card .c-emoji{display:inline-block;width:1em;line-height:1;text-align:center;   /* 盒=1em（emoji 字体字宽 ~1.37em 不再撑盒；字形居中对称外溢） */
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
/* 入场弹跳（换题 stagger） */
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 已排入排序条：隐藏保位（不可再点——它已不是候选；区别于点错的不灰化） */
.card.gone{visibility:hidden;pointer-events:none}
/* 答错：晃动（不灰掉——每张卡都可能是下一步，SPEC §3 不灰化款，可重点） */
.card.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}
  55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
/* 连错 2 次后：应点卡呼吸高亮（首错不 pulse，miss≥2 才高亮 §0.7） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 静置救援 30s 答案级：当前应点卡三连脉冲 0/520/1040ms 错峰（JS 触发，§0.21 batch10 定版） */
.card.pulse{animation:an-pulse 1.2s ease 1}
@keyframes an-pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.16)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch10 habit） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：方向卡/底栏/卡适配，主答案卡仍 ≥96（r19：7 卡 96px+9gap=678<800 宽 OK） */
@media (orientation:portrait){
  #prompt-chip{padding:5px 18px;gap:8px}
  #prompt-chip .d-arrow{width:28px;height:22px;flex:0 0 28px}
  #prompt-chip .d-legend{margin-left:5px;padding-left:6px;gap:1px}
  #prompt-chip .d-legend .lg-arrow{width:15px;height:13px;flex:0 0 15px}
  #strip-wrap{gap:8px}
  #dir-badge{padding:3px 6px;min-height:40px}
  #dir-badge .d-arrow{width:20px;height:17px;flex:0 0 20px}
  .slot{width:76px;height:76px}
  #strip.ord .slot{width:96px;height:96px}
  #strip{gap:8px}
  #board{gap:9px}
  .card{min-height:128px;max-width:170px}
  .ord-anchor{gap:4px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
/*PORT-CLS*/
body.port #prompt-chip{padding:5px 18px;gap:8px}
body.port #prompt-chip .d-arrow{width:28px;height:22px;flex:0 0 28px}
body.port #prompt-chip .d-legend{margin-left:5px;padding-left:6px;gap:1px}
body.port #prompt-chip .d-legend .lg-arrow{width:15px;height:13px;flex:0 0 15px}
body.port #strip-wrap{gap:8px}
body.port #dir-badge{padding:3px 6px;min-height:40px}
body.port #dir-badge .d-arrow{width:20px;height:17px;flex:0 0 20px}
body.port .slot{width:76px;height:76px}
body.port #strip.ord .slot{width:96px;height:96px}
body.port #strip{gap:8px}
body.port #board{gap:9px}
body.port .card{min-height:128px;max-width:170px}
body.port .ord-anchor{gap:4px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
</style>
</head>
<body>
<div id="game" aria-label="大小排排队">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <button id="prompt-chip" aria-label="题目，点我再听一遍"></button>
    </div>
    <div id="strip-wrap" aria-label="排序条">
      <div id="dir-badge" aria-hidden="true"></div>
      <div id="strip"></div>
    </div>
    <div id="board" aria-label="大小卡片"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

/* ================= sortsize 纯引擎：确定性关卡生成 + 三题型点选判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   章型（SPEC-BATCH11 §-r19；进度章号单调递增 + 难度章号 (ch-1)%4+1 循环；生成关随机章参数 pdch）：
     ch1 6-7 物相近档全排序（方向恒 big）/ ch2 +方向混合 / ch3 双属性（3 档×红蓝，先大小再颜色）
     / ch4 序数题（第 N 大/N 小，rank∈[2,n-2]）+混排回顾
   每关 5 题；sort/ord 题每关种互异（全库 8 种洗牌取用）；dual 题恒双色皮球（每档恰一红一蓝）
   热身律：每章 qi0 给已学形态/明显档（ch2 方向首现放 qi1；ch4 第 N 小首现放 qi3）
   方向混合保证：混合章（2/3）除热身外随机方向，且每关 ≥1 small（全 big 则末题强制 small）
   展示乱序：sort/ord 严格非单调（升/降都不许）；dual 弱非单调（含平局的升/降都不许）
   点选坐标：items[i]=展示位 i 的 font-size 基准；left=剩余展示位；第 pos 步应点=
     sort：order='big' → left 中 items 最大者 / 'small' → 最小者（互异保证唯一）
     dual：先比尺寸（order 方向），同尺寸比颜色（q.first 色在前）——(尺寸,颜色) 对互异 → 唯一
     ord：全 items 按方向排序后第 q.rank 名（rank∈[2,n-2]，互异保证唯一；单点即完题）
   引擎返回：'step' 排对一步（题未完）/ 'goal' 排对且本题完成 / 'done' 通关
     / 'wrong' 点错（卡晃动不灰化可重点，每点计一次错）
     / 'again' 已排入排序条的卡或已答完的题（防御层零惩罚）
     / null 非法下标或关卡已结束 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

function shuffled(arr, rnd) {

/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 比较器（answerIdx 真值源）：a 是否应排在 b 前（target order 语义）
   sort：尺寸互异 → 方向直接比；dual：先尺寸（方向），同尺寸 → first 色在前（SPEC 唯一解先验） */
function engPrecedes(q, a, b) {
  const va = q.items[a], vb = q.items[b];
  if (va !== vb) return q.order === 'big' ? va > vb : va < vb;
  if (q.kind !== 'dual') return false;
  return q.colors[a] === q.first;            /* 同尺寸：a 是首色 → a 前（b 必为另一色，构造保证） */
}

/* ---------- 当前应点位（answerIdx 真值源）：left 中 target order 最前物
   sort：items 两两互异 → argmax/argmin 唯一；dual：(尺寸,颜色) 对互异 → 全序唯一 */
function engAnswerIdx(q) {
  if (q.kind === 'ord') {
    const idx = q.items.map((v, i) => [v, i])
      .sort((x, y) => q.order === 'big' ? y[0] - x[0] : x[0] - y[0]);
    return idx[q.rank - 1][1];               /* 第 rank 名（1 基；互异 → 唯一） */
  }
  let best = -1;
  for (let k = 0; k < q.left.length; k++) {
    const i = q.left[k];
    if (best < 0 || engPrecedes(q, i, best)) best = i;
  }
  return best;
}

/* ---------- 展示乱序：sort/ord 严格非单调（升/降都重洗）；dual 弱非单调（含平局序列也重洗） */
function genItems(n, tier, rnd) {
  const lad = SIZE_LADDER[tier].slice();
  const mono = a => a.every((v, i) => i === 0 || a[i - 1] < v) ||
                     a.every((v, i) => i === 0 || a[i - 1] > v);
  let s = shuffled(lad, rnd), guard = 0;
  while (mono(s) && guard++ < 24) s = shuffled(lad, rnd);
  return s;
}
/* dual 展示：(尺寸,颜色) 对洗牌；弱单调（非降/非升整列）重洗——不许"整排已排好" */
function genDualDisp(tier, rnd) {
  const pairs = [];
  SIZE_LADDER[tier].forEach(s => { pairs.push([s, 'r']); pairs.push([s, 'b']); });
  const weakMono = a => a.every((p, i) => i === 0 || a[i - 1][0] <= p[0]) ||
                         a.every((p, i) => i === 0 || a[i - 1][0] >= p[0]);
  let d = shuffled(pairs, rnd), guard = 0;
  while (weakMono(d) && guard++ < 24) d = shuffled(pairs, rnd);
  return d;
}

/* ---------- 方向序列（每关 5 题）：热身/首现槽固定（计划 ord 字段），混合章其余随机
   ch1 恒 big（方向隔离）；混合章保证每关 ≥1 small（全 big 则末槽强制） */
function planLevelOrders(pdch, rnd) {
  const plan = QUIZ_PLAN[pdch];
  const orders = plan.map(P => P.ord || 'big');
  if (MIXED_CH[pdch]) {
    plan.forEach((P, qi) => {
      if (qi > 0 && !P.ord && P.kind !== 'ord') orders[qi] = rnd() < 0.5 ? 'big' : 'small';
    });
    if (orders.indexOf('small') < 0) orders[orders.length - 1] = 'small';
  }
  return orders;
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   生成关（flat≥STATIC_LEVELS）：随机章参数 pdch ∈1-4（章型规则按 pdch 生效）
   rnd 调用序固定：pdch → KIND_IDS 洗牌 → 方向随机 → 逐题（乱序洗牌/first/rank）→ 确定性 */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const pdch = flat >= STATIC_LEVELS ? ri(rnd, 1, 4) : dch;   // 生成关=随机章参数
  const plan = QUIZ_PLAN[pdch];
  const kindsPool = shuffled(KIND_IDS, rnd);
  const orders = planLevelOrders(pdch, rnd);
  const quizzes = plan.map((P, qi) => {
    const q = { kind: P.kind, qi: qi, tier: P.tier, order: orders[qi] };
    if (P.kind === 'dual') {
      const disp = genDualDisp(P.tier, rnd);
      q.kindId = DUAL_KIND;
      q.first = P.first || (rnd() < 0.5 ? 'r' : 'b');
      q.items = disp.map(p => p[0]);
      q.colors = disp.map(p => p[1]);
    } else {
      q.kindId = kindsPool[qi];
      q.items = genItems(P.n, P.tier, rnd);
      if (P.kind === 'ord') q.rank = P.rank ||
        (P.ord === 'small' ? ri(rnd, 2, 3) : ri(rnd, 2, P.n - 2));   /* 序数域：big∈[2,n-2] / small 首现收窄 [2,3] */
    }
    q.left = q.items.map((_, i) => i);
    q.pos = 0; q.miss = 0; q._answered = false;
    q.answerIdx = engAnswerIdx(q);                             // 初始应点位（ord 恒定，sort/dual 动态重算）
    return q;
  });
  return { flat: flat, ch: ch, dch: dch, pdch: pdch, lv: lv,
    quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点选引擎（无 DOM）：engTap(L, i) —— 点展示位 i 的 emoji 卡 */
function engTap(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  const n = q.items.length;
  if (!Number.isInteger(i) || i < 0 || i >= n) return null;
  if (q._answered) return 'again';
  if (q.kind !== 'ord' && q.left.indexOf(i) < 0) return 'again';  // 已排入排序条（UI .gone 拦截，兜底零惩罚）
  if (i === q.answerIdx) {
    if (q.kind === 'ord') {                                     // 序数题：单点即完题
      q._answered = true;
      L.step++;
      if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
      return 'goal';
    }
    q.left = q.left.filter(x => x !== i);
    q.pos++;
    if (q.pos >= n) {                                          // 本题全部排对
      q._answered = true;
      L.step++;
      if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
      return 'goal';
    }
    q.answerIdx = engAnswerIdx(q);                             // 逐点后动态重算下一步应点位
    return 'step';
  }
  q.miss++;
  L.retries++;
  return 'wrong';
}

/* 星级：一关零错点（retries=0）=3 星；总错点 ≤2=2 星；否则 1 星。永不 0 星 */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：kind/档位/题计划匹配、阶梯逐值、两两互异（dual=对互异）、

  const plan = QUIZ_PLAN[pdch], P = plan[q.qi];
  if (!P || P.kind !== q.kind || P.tier !== q.tier) return 'plan';
  if (q.kind === 'dual' && (q.kindId !== DUAL_KIND || (P.first != null && P.first !== q.first))) return 'plan';
  if (q.order !== 'big' && q.order !== 'small') return 'order';

  if (q.kind === 'dual') {

    for (let i = 0; i < n; i++) {                              // 每档恰 2 物（一红一蓝）
      const c = cnt[q.items[i]] || (cnt[q.items[i]] = {});
      if (ref.indexOf(q.items[i]) < 0) return 'ladder';

    }
    for (let i = 0; i < ref.length; i++) {
      const c = cnt[ref[i]];

    }

    if (weak(q.items)) return 'mono';                          // 展示弱非单调（不许整排已排好）
  } else {
    if (q.kindId === DUAL_KIND) return 'kind';
    for (let i = 0; i < n; i++) {                              // 同题取整档阶梯（基准逐值）
      if (q.items.indexOf(ref[i]) < 0) return 'ladder';
    }
    for (let i = 0; i < n; i++)                                // 两两互异（比值 ≠1）
      for (let j = i + 1; j < n; j++) if (q.items[i] === q.items[j]) return 'dup';
    if (q.kind === 'ord') {
      if (!Number.isInteger(q.rank) || q.rank < 2 || q.rank > n - 2) return 'rank';   // 序数域 [2,n-2]
      if (P.rank != null && q.rank !== P.rank) return 'plan';  // 热身槽 rank 钉死
    }

  for (let i = 0; i < n; i++) if (q.left[i] !== i) return 'leftInit';

}
function buildBoard(q) {                        // emoji 卡：乱序大小展示，入场 stagger；无文字（§0.19）

function renderPrompt(q) {                      // 题面卡（点重听）：sort/dual=方向示意 / ord=序数锚
  if (q.kind === 'ord') chipEl.innerHTML = ordAnchorHtml(q, 1.15);
  else if (q.kind === 'dual') chipEl.innerHTML = dirHtml(q.order, 1.15) + legendHtml(q.first, 1.15);
  else chipEl.innerHTML = dirHtml(q.order, 1.15);

}
function renderQuiz() {
  const q = cur.quizzes[cur.step];

  renderPrompt(q);
  renderStep();
  if (!VERIFY && !state.demo && !state.quiet) speakQuiz(q);  /* 开场/换题读题（方向随题重申）；demo 门防演示收尾叠播；quiet=开场/教学交接改顺序链 */
}
function renderStep() {                         // HUD 本关 5 题进度点

  const dots = $id('chapter-dots');

/* ================= 飞入动画（§0.11：CSS transition，时长随 SPEED）
   源卡立即 .gone 隐藏保位 → 克隆飞行体 fixed 从源卡矩形 transform 到目标槽矩形
   → transition 结束后目标槽填充+亮起（槽内 emoji 按比例缩放呈现渐变） */
function flyStep(el, pos, q, i) {
  const dur = 420 * SPEED;
  const size = q.items[i];
  if (el) el.classList.add('gone');
  const slot = slotEl(pos);
  if (el && slot) {
    const from = el.getBoundingClientRect();
    const to = slot.getBoundingClientRect();
    const fly = document.createElement('div');
    fly.className = 'fly';
    fly.textContent = glyphOf(q, i);
    fly.style.fontSize = size + 'px';
    fly.style.left = from.left + 'px';
    fly.style.top = from.top + 'px';
    fly.style.width = from.width + 'px';
    fly.style.height = from.height + 'px';
    fly.style.transitionDuration = dur + 'ms';
    document.body.appendChild(fly);
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    const k = slotSize(size) / size;
    requestAnimationFrame(() => {
      fly.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + k + ')';
    });
    setTimeout(() => fly.remove(), dur + 90);   // transition 结束后移除飞行体
  }
  setTimeout(() => fillSlot(pos, q, i), dur);   // 到达即填充亮起
  return dur;
}
function fillSlot(pos, q, i) {
  const s = slotEl(pos);
  if (!s) return;
  s.innerHTML = '';                              // 清占位 s-num，防重复 DOM 叠放（batch11 审查 m3）
  s.classList.remove('lit'); void s.offsetWidth;
  s.classList.add('lit');
  const em = document.createElement('span');
  em.className = 's-emoji';
  em.style.fontSize = slotSize(q.items[i]) + 'px';    // 按比例缩放→整条大小渐变
  em.textContent = glyphOf(q, i);
  s.appendChild(em);
  const num = document.createElement('i');
  num.className = 's-num';
  num.textContent = q.kind === 'ord' ? q.rank : (pos + 1);
  s.appendChild(num);
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {

/* 教学"帮"阶段指向：当前题当前应点的 emoji 卡 */

/* ================= emoji 卡点选主路径（真实点击 / SO.tapCard / autoSolve 共用） ================= */
async function uiTapCard(i, demo) {
  /* locked 门拦真实输入；demo 通道仅 tutorialWatch 内部传 true（豁免 locked） */
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  /* 契约 I（r19）：错反馈豁免窗内——错点吞（对选放行），防 miss 连发与语音截断；
     吞=轻叮+容器 bump（家族 D），miss/step 不动（误触不罚，b 系惯例） */
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil && i !== q.answerIdx) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return false;
  }
  const run = cur;                              /* 身份守卫：演出窗口内重玩会重建 cur，防旧续体错推进 */
  const r = engTap(cur, i);
  if (r === null) return false;
  if (r === 'again') return 'again';            /* 已排卡/已答题：早退零惩罚不计数（§0.7 防御层） */
  const el = cardEl(i);

  if (r === 'wrong') {                          /* 答错：晃动（不灰掉可重点，SPEC §3 不灰化款） */
    if (el) { el.classList.remove('wig', 'breathe'); void el.offsetWidth; el.classList.add('wig'); }
    dodgeLo();
    if (sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2))   /* flat<3 每错必播 / flat≥3 10s 节流+豁免恰一次 */
      wrongChainUntil = Date.now() + estMs(VOICE.wrong.text) + 300;   /* 豁免窗=句长+300（契约 I，4350） */
    if (q.miss >= 2) {                          /* 首错不 pulse：连错 2 次才高亮应点卡 */
      const ok = cardEl(q.answerIdx);
      if (ok && !ok.classList.contains('gone')) { ok.classList.remove('breathe'); void ok.offsetWidth; ok.classList.add('breathe'); }
    }
    await wait(480 * SPEED);
    return r;
  }

  /* ---- 答对：源卡飞入排序条目标槽亮起 →（题末）推进 ---- */
  lastAct = Date.now();                         /* 仅正确推进重置救援钟（§0.7a） */
  if (state.tut === 'help') {                   /* 教学"独"：首次答对 → 强化反馈放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  if (el) el.classList.remove('breathe', 'wig');
  const target = q.kind === 'ord' ? 0 : q.pos - 1;   /* 引擎已推进：sort/dual 槽=pos-1 / ord=单槽 0 */
  const dur = flyStep(el, target, q, i);
  chimeStep();
  await wait(dur + 220 * SPEED);                /* 等飞入 transition 结束再量测/推进（§0.11） */
  if (cur !== run) return r;                    /* 演出窗内重玩已重建关卡：丢弃旧续体 */
  if (r === 'step') {                           /* 题内排对一步：不换题（方向/卡区不变） */
    state.locked = false;
    return r;
  }
  sfx('coin');                                  /* 排完一题/通关：全槽亮起小停顿 */
  if (r === 'done') { winFlow(); return r; }
  await wait(430 * SPEED);
  if (cur !== run) return r;
  state.locked = false;
  renderQuiz();                                 /* 换题：新题面整句重申+徽章/题面卡翻转 */
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关随机章型 GEN_HINTS[dch-1]
     （家族 F：禁 (ci+1)%4 字面——b26 审查 M3） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) });   /* 家族 A：winFlow 也实算 lim-1（双实算定版） */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);               // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  lastDir = Date.now();                         /* 家族 B：方向级锚随关重置 */
  lastWrongVoice = 0; wrongChainUntil = 0;      /* 换关重置错反馈节流锚与豁免窗（契约 I/J 配套） */
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  /* verify 页恒走 openingSpeak（stub 记录开场链供断言，教学由 verify 教学链单元直驱覆盖）
     家族 E：行为分流先查教学特例子键（freshTut 判定读 sv.sortsize.tutSeen） */
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.sortsize && sv.sortsize.tutSeen);
  if (VERIFY) { openingSpeak(); return; }
  if (freshTut) { tutorialWatch(); return; }

}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=幽灵手指演示排对一步（locked 吞输入，demo 参数豁免）→帮=指向应点卡；独=首次答对放手 */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);
  badgeEl.classList.remove('teach'); void badgeEl.offsetWidth;   /* 方向徽章首现显式教学：放大闪亮一拍（试玩 P2③） */
  badgeEl.classList.add('teach');
  await wait(700 * SPEED);
  const q = cur.quizzes[0];
  const idx = q.answerIdx;
  pointGhostAt(cardEl(idx), 'tut');
  await wait(900 * SPEED);

  await wait(320 * SPEED);

  await wait(1000 * SPEED);                      // 飞入亮起演出窗口
  const sv = KIDS._save();                       // 真实页 save 恒非 null；verify 直驱时跳过写档
  if (sv) {

  }
  /* 立即重发同关（确定性关卡，题面一致），"你来排一排"在重发后的题面上说（照 batch5-10） */
  ghost.hide();
  cur = genLevel(0);
  state = { locked: false, won: false, demo: false, tut: 'help', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  lastDir = Date.now();
  renderQuiz(); renderDots();
  state.quiet = false;
  /* 交接顺序链：turn clip→题面句，queue 单通道顺序播不叠音（§0.6） */
  openingSpeak(true);
  setTimeout(() => { if (state.tut === 'help') pointHelpNext(); }, 600);
}

/* ================= 底栏与舞台交互 ================= */
function hopRabbit() {

}
rabbitBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur) return;
  if (state.won) return;                           /* T4 m4：通关态点兔子零反应（与教学/演出轻反馈分流） */
  if (state.locked || state.demo) {                /* §0.20 三件门；教学/演出期点兔子=轻反馈不静默（试玩 P2①） */

replayBtn.addEventListener('pointerdown', e => {

chipEl.addEventListener('pointerdown', e => {
  e.preventDefault();

});
stageEl.addEventListener('pointerdown', e => {
  const p = e.target.closest('.card');
  if (p) {                                       // emoji 卡：主答路径
    e.preventDefault();

  /* 空白/探索点击：10s 节流轻提示（§0.16）；不重置救援钟（§0.7a） */
  e.preventDefault();

/* ================= 无操作看护（家族 B 双锚，r19）：14s 方向级=重读题面+题面卡 pulse
   （不泄答案；lastDir 独立节流锚，不重置 lastAct——30s 答案级不被饿死）
   / 30s 答案级=应点卡 breathe（静音也能看见答案线索）/ 教学"帮"5s 重演示一次 ================= */
function breatheAnswer(q) {
  const ok = cardEl(q.answerIdx);
  if (ok && !ok.classList.contains('gone')) { ok.classList.remove('breathe'); void ok.offsetWidth; ok.classList.add('breathe'); }
}
function rescueTick() {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  if (Date.now() < wrongChainUntil) return;      /* 契约 I：错反馈豁免窗内救援让路 */
  if (document.querySelector('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel')) return;   /* 契约 K：面板在场守卫 */
  const idle = Date.now() - lastAct;
  if (idle > 30000) {                            /* 答案级：泄答案兜底档（30s 才指答案） */
    const q = cur.quizzes[cur.step];
    if (q) { breatheAnswer(q); speakQuiz(q); }
    lastAct = Date.now();
    return;
  }
  if (idle > 14000 && Date.now() - lastDir > 14000) {   /* 方向级：重读题面+题面卡 pulse（不泄答案） */
    const q = cur.quizzes[cur.step];
    if (q) { speakQuiz(q); replayAnim(chipEl, 'pulse'); }
    else sayR(VOICE.hint.key, VOICE.hint.text);
    lastDir = Date.now();
    return;

  }

setInterval(rescueTick, 1000);   /* 命名函数 rescueTick（契约 K 源码级断言，照 b28 m4） */

/* ================= 启动（verify 分支由 game-verify.js 接管） ================= */
buildStatic();
if (!VERIFY) {
  KIDS.init({ game: 'sortsize', title: '大小排排队' });
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  let first = 0;
  for (let i = 0; i < lim; i++) { if (!sv.levels[keys[i]]) { first = i; break; } }
  if (lim > 0 && KIDS.calendar.dayDone(keys)) { // 今日新关已玩完：收尾画面（可关闭继续重玩）
    KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) });   /* 家族 A：启动处传 lim-1 */
    first = Math.max(0, lim - 1);                /* 收尾后停留今日最后一关（b14 家族修复对齐） */
  }
  startLevel(first);
}

/* ================= 验收钩子（getter 模式，返回拷贝非活引用） ================= */
window.SO = {
  get currentLevel() {
    if (!cur) return null;
    const q = cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)] || {};
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, pdch: cur.pdch, lv: cur.lv,
      n: cur.quizzes.length, step: cur.step, retries: cur.retries, done: cur.done, won: state.won,
      kind: q.kind || null, order: q.order || null, pos: q.pos || 0 };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    return { kind: q.kind, tier: q.tier, qi: q.qi, kindId: q.kindId,    /* SPEC §-r19 钩子契约 */
      order: q.order, first: q.first || null, rank: q.rank || null,
      items: q.items.slice(), colors: q.colors ? q.colors.slice() : null,
      left: q.left.slice(), pos: q.pos, answerIdx: q.answerIdx, step: cur.step, miss: q.miss };
  },
  tapCard(i) { return uiTapCard(i); },
  async autoSolve() {                           // UI 路径自动点完当前关（逐题逐步点应点卡；ord 单点）
    let taps = 0, guard = 0;
    while (cur && !cur.done && guard++ < 60) {  // 5 题 × 最多 7 物 = 35 tap 上界，guard 60 余量
      const q = cur.quizzes[cur.step];
      if (!q) break;
      const r = await uiTapCard(q.answerIdx);
      taps++;
      if (r === false || r === null) break;     // 锁死/重玩保护
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
  get tutorial() { return state.tut; }
};

</script>
<script>
/* ================= ?verify=1 自检（仅 verify 分支加载执行；r19 独立第 4 script 块）
   ① 40 关全量审计（flat 0-39，每关一记）：确定性（同 flat 两次生成 JSON 一致）/ 章规则
     （r19 题计划：ch1 6-7 物相近档恒 big；ch2 +方向混合（qi1 首现 small）；ch3 双属性
     （qi0 热身明显档 first=r）；ch4 序数（qi0 热身 rank2 / qi3 第N小 / qi4 dual 回顾）；
     每关 sort/ord 题种互异）/ structWhy（阶梯档位逐值、dual 每档恰一红一蓝、级差落带、
     展示非单调、序数域 [2,n-2]、left/pos/answerIdx/miss 自洽）/ 引擎直驱（首题连错 2
     → 排对一步 → 点已排位 again → 逐点 answerIdx 独立重算全对 → 2 星；另全对 3 星）
   ② tapCard 单元 sort（flat0 obv6）：卡 data-size 对账 / 首错=晃动不灰掉+首错不 pulse
     / 窗内二错=吞（契约 I：miss 不动返 false）/ 窗过后二错=miss2+force 播+应点卡 breathe
     / 非法下标 false / 答对一步=源卡 gone+pos 推进+locked 拦截+槽 lit / again / goal 换题
   ②b tapCard 单元 dual（flat10 热身）：色徽章 legend=first 色 / 卡 data-c 对账 /
     同档异色=错（wig）/ 首色=对 → 平局翻转（下一应点=同档另一色）独立重算
   ②c tapCard 单元 ord（flat15 热身）：单槽+槽内数字=rank / 题面锚 n 圆点降序+ring 位=rank-1
     / 错点=wig 零惩罚不推进 / 对点=goal 飞入单槽 lit
   ③ sayW 三态+豁免窗（flat0 无节流两错均播（间隔>窗）/ flat3 节流静默不设窗照计数
     / miss===2 force 起播设窗 / 窗内吞）
   ④ UI 冒烟：A flat0 真实通路（首错=2 星）/ B1 flat5 autoSolve 3 星+方向混合
     / B2 flat10 dual 真实点击通关 / B3 flat15 ord+dual 混排真实通关
   ⑦ 教学链（verify 直驱 tutorialWatch）：watch clip 播出 → demo 排对一步 → 重发同关 →
     交接链 queue([sor_tut_turn, 题面]) → tut='help' 解锁
   ⑤ 布局：双 viewport 模拟 ×（obv6 flat0/close7 flat3/dual flat10/ord flat15）：
     卡数=物数、卡 ≥96、槽 ≥64（ord=单槽）、emoji 不溢出卡、题面锚/徽章结构、全按钮 ≥64
     （.k-parentbtn 豁免）、overflowX ≤0
   ⑥ 分布与专项：SIZE_LADDER 独立字面量对账 / 三族题面句独立字面量 / 17 条 sor_* clips
     注入 / 开场链与三族读题链 stub（全 keyed，keylessLast）/ 40 关 8 种 emoji 全覆盖+
     方向分布 / script[2] 源码断言（家族 A/F/I 字面+旧字面清除，检索串拼接防自匹配）
   ⑧ 时长模型 r19 双钉：STEP/ORD 字面 === SPEC / modeled(0)===88650 / 40 关 min===82760
     max===137900 / verify 独立 SPEC 计划复算逐章对账
   结果写 #verify-result + document.title='VERIFY PASS n/n'（墙钟 <100s，SPEC §-r19 标注） */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;
  const kindDist = {};
  KIND_IDS.forEach(k => { kindDist[k] = 0; });
  let dirBig = 0, dirSmall = 0, mixedLevels = 0;

  /* answerIdx 独立重算器（不调 engAnswerIdx/engPrecedes，防同源假阳性——比较器语义从 SPEC 推导） */
  const expectIdx = q => {
    if (q.kind === 'ord') {
      const order = q.items.map((v, i) => [v, i])
        .sort((x, y) => q.order === 'big' ? y[0] - x[0] : x[0] - y[0]);
      return order[q.rank - 1][1];
    }
    const before = (a, b) => {
      if (q.items[a] !== q.items[b]) return q.order === 'big' ? q.items[a] > q.items[b] : q.items[a] < q.items[b];
      return q.kind === 'dual' ? q.colors[a] === q.first : false;   /* 同档：首色在前（SPEC 唯一解先验） */
    };
    let best = -1;
    for (const i of q.left) if (best < 0 || before(i, best)) best = i;
    return best;
  };
  const ladderSet = tier => SIZE_LADDER[tier].slice().sort((a, b) => a - b).join(',');

  /* ---- ① 40 关全量审计（flat 0-39） ---- */
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1) === JSON.stringify(L2);      // 确定性（含 pdch）
    let structAll = true, ruleOk = true, driveOk = true;
    const cnt = {};
    L1.quizzes.forEach(q => { cnt[q.kindId] = (cnt[q.kindId] || 0) + 1; if (KINDS[q.kindId]) kindDist[q.kindId]++; });
    if (L1.quizzes.length !== CH_LEN) ruleOk = false;
    if (flat < STATIC_LEVELS && L1.pdch !== L1.dch) ruleOk = false;   // 静态关 pdch=难度章号
    if (L1.pdch < 1 || L1.pdch > 4) ruleOk = false;
    const orders = L1.quizzes.map(q => q.order);
    const nonDual = L1.quizzes.filter(q => q.kindId !== DUAL_KIND);
    if (nonDual.length !== Object.keys(cnt).length - (cnt[DUAL_KIND] ? 1 : 0)) ruleOk = false;   // sort/ord 题每关种互异
    /* 章型规则（SPEC §-r19 题计划）：热身/首现槽钉死 + 混合保证 */
    const q0 = L1.quizzes[0];
    if (L1.pdch === 1) {
      if (!(q0.kind === 'sort' && q0.tier === 'obv6' && q0.order === 'big')) ruleOk = false;
      if (!orders.every(o => o === 'big')) ruleOk = false;              // ch1 方向隔离恒 big
    } else if (L1.pdch === 2) {
      if (!(q0.kind === 'sort' && q0.tier === 'close6' && q0.order === 'big')) ruleOk = false;
      if (L1.quizzes[1].order !== 'small') ruleOk = false;              // 从小到大首现放第 2 题
    } else if (L1.pdch === 3) {
      if (!(q0.kind === 'dual' && q0.tier === 'dualObv' && q0.order === 'big' && q0.first === 'r')) ruleOk = false;
      if (orders.indexOf('small') < 0) ruleOk = false;                  // 混合章每关 ≥1 small
      mixedLevels++;
    } else {
      if (!(q0.kind === 'ord' && q0.tier === 'obv6' && q0.rank === 2 && q0.order === 'big')) ruleOk = false;
      const q3 = L1.quizzes[3];
      if (!(q3.kind === 'ord' && q3.order === 'small' && q3.rank >= 2 && q3.rank <= 3)) ruleOk = false;   // 第N小首现
      if (L1.quizzes[4].kind !== 'dual') ruleOk = false;                // 混排回顾
      if (orders.indexOf('small') < 0) ruleOk = false;
      mixedLevels++;
    }
    if (L1.pdch === 2 && orders.indexOf('small') < 0) ruleOk = false;
    orders.forEach(o => { if (o === 'big') dirBig++; else dirSmall++; });
    for (let k = 0; k < L1.quizzes.length; k++) {
      if (structWhy(L1.quizzes[k], L1.pdch)) structAll = false;
    }
    /* 引擎直驱：首题连错 2（不灰掉可重点）→ 排对一步 → （非 ord）点已排位 again →
       逐点 answerIdx 独立重算全对 → 全对通关 2 星；另全对 3 星 */
    const Ld = genLevel(flat);
    const d0 = Ld.quizzes[0];
    let wi = 0; while (wi === d0.answerIdx) wi++;
    if (engTap(Ld, wi) !== 'wrong' || Ld.retries !== 1 || d0.miss !== 1) driveOk = false;
    if (engTap(Ld, wi) !== 'wrong' || Ld.retries !== 2 || d0.miss !== 2) driveOk = false;   // 同卡可重点
    const placed0 = d0.answerIdx;
    if (engTap(Ld, placed0) !== (d0.kind === 'ord' ? 'goal' : 'step')) driveOk = false;   // ord 单点即完题
    if (d0.answerIdx !== expectIdx(d0)) driveOk = false;        // 逐点后动态重算正确
    if (d0.kind !== 'ord' && engTap(Ld, placed0) !== 'again') driveOk = false;   // 已排卡零惩罚（ord 单点题无此态）
    let last = null, guard = 0;
    while (!Ld.done && guard++ < 60) {
      const q = Ld.quizzes[Ld.step];
      last = engTap(Ld, expectIdx(q));
      if (last === null || last === 'wrong' || last === 'again') { driveOk = false; break; }
      if (!q._answered && q.kind !== 'ord' && q.answerIdx !== expectIdx(q)) { driveOk = false; break; }
    }
    if (!Ld.done || Ld.step !== CH_LEN || last !== 'done' || engStars(Ld) !== 2) driveOk = false;
    const L3 = genLevel(flat);
    guard = 0;
    while (!L3.done && guard++ < 60) engTap(L3, expectIdx(L3.quizzes[L3.step]));
    if (!L3.done || engStars(L3) !== 3) driveOk = false;
    const ok = det && structAll && ruleOk && driveOk;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, pdch: L1.pdch, ok: ok, det: det, structAll: structAll,
      ruleOk: ruleOk, driveOk: driveOk,
      qs: L1.quizzes.map(q => q.kind[0] + (q.kind === 'ord' ? q.rank : '') + q.order[0] + ':' + q.items.join('/')) };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② tapCard 单元 sort（flat 0 真实 UI；q0=sort obv6 big） ---- */
  total++;
  startLevel(0);
  const q0 = SO.quiz;
  const n0 = q0.items.length;
  const cards0 = Array.prototype.slice.call(boardEl.querySelectorAll('.card'));
  const slots0 = Array.prototype.slice.call(stripEl.querySelectorAll('.slot'));
  /* DOM 对账：n0 张卡 data-i 0..n-1、data-size=引擎 items、卡内 emoji 内联字号=items；
     槽 n0 个；方向徽章/题面卡 data-order=引擎 order（渲染即引擎） */
  const alignOk = q0 && q0.kind === 'sort' && n0 === 6 && cards0.length === n0 && slots0.length === n0 &&
    cards0.every((c, i) => Number(c.dataset.i) === i && Number(c.dataset.size) === q0.items[i] &&
      c.querySelector('.c-emoji').style.fontSize === q0.items[i] + 'px') &&
    badgeEl.dataset.order === q0.order && chipEl.dataset.order === q0.order;
  const wi2 = (q0.answerIdx + 1) % n0;
  const rW = await SO.tapCard(wi2);              // 首错：晃动不灰掉+miss=1+起播设窗+首错不 pulse
  const wEl = cardEl(wi2), okEl = cardEl(q0.answerIdx);
  const wrongOk = rW === 'wrong' && SO.quiz.miss === 1 && SO.currentLevel.retries === 1 &&
    SO.quiz.step === 0 && SO.quiz.pos === 0 && wEl.classList.contains('wig') &&
    !wEl.classList.contains('dim') &&
    getComputedStyle(wEl).pointerEvents !== 'none' &&      /* 不灰掉：每张卡都可能是下一步（SPEC §3） */
    !okEl.classList.contains('breathe');                   /* 首错不 pulse */
  const rSw = await SO.tapCard((wi2 + 1) % n0);  // 窗内二错：吞（契约 I）——miss 不动返 false
  const swallowOk = rSw === false && SO.quiz.miss === 1 && SO.currentLevel.retries === 1;
  await wait(4450);                              /* 等豁免窗（4350）过期——真时钟 */
  const rW2 = await SO.tapCard(wi2);             // 窗过后同卡二错：miss=2 → force 起播+应点卡 breathe
  const wrong2Ok = rW2 === 'wrong' && SO.quiz.miss === 2 && SO.currentLevel.retries === 2 &&
    okEl.classList.contains('breathe');
  const badIdx = (await SO.tapCard(n0)) === false && (await SO.tapCard(-1)) === false &&
    (await SO.tapCard('x')) === false && (await SO.tapCard(1.5)) === false;
  /* 答对一步：演出窗内同步读源卡 .gone + pos 推进；locked 窗内 hook 拦截 */
  const pOk = SO.tapCard(q0.answerIdx);
  const goneOk = cardEl(q0.answerIdx).classList.contains('gone') &&
    SO.quiz.pos === 1 && SO.currentLevel.step === 0;
  const lockedRet = await SO.tapCard(q0.answerIdx);        // 飞入演出窗内：locked 门拦 hook
  const rStep = await pOk;                                 // 'step'（飞入 transition 已结束）
  const slot0 = slotEl(0);
  const slotLit = slot0 && slot0.classList.contains('lit') &&
    slot0.querySelector('.s-emoji') !== null &&
    parseInt(slot0.querySelector('.s-emoji').style.fontSize, 10) === slotSize(q0.items[q0.answerIdx]);
  await wait(4450);                              /* 等豁免窗过期——窗内旧应点位点击会被吞（契约 I 对非当前应点一律吞） */
  const rAgain = await SO.tapCard(q0.answerIdx);           // 点已排位（旧应点位）：'again' 零惩罚
  const againOk = rAgain === 'again' && SO.quiz.miss === 2 && SO.quiz.pos === 1;
  let lastTap = null, g2 = 0;                              // 排完本题剩余步 → 主路径 'goal'
  while (SO.quiz && SO.quiz.step === 0 && g2++ < 12) lastTap = await SO.tapCard(SO.quiz.answerIdx);
  const q1 = SO.quiz;                                      // 'goal' 后换题：新方向徽章翻转对账
  const freshOk = q1 && q1.step === 1 && q1.pos === 0 && SO.currentLevel.retries === 2 &&
    badgeEl.dataset.order === q1.order && chipEl.dataset.order === q1.order &&
    boardEl.querySelectorAll('.card').length === q1.items.length &&
    Array.prototype.every.call(boardEl.querySelectorAll('.card'), (c, i) =>
      Number(c.dataset.size) === q1.items[i]);
  const goalOk = lastTap === 'goal' && freshOk;            // 题完成不追加错次
  const tapOk = alignOk && wrongOk && swallowOk && wrong2Ok && badIdx && rStep === 'step' && goneOk &&
    lockedRet === false && slotLit && againOk && goalOk;
  if (tapOk) npass++;
  units.tapCard = { ok: tapOk, align: alignOk, wrong: wrongOk, windowSwallow: swallowOk,
    wrong2: wrong2Ok, badIdx: badIdx, step: rStep === 'step' && goneOk && slotLit, lockedGuard: lockedRet === false,
    again: againOk, goal: goalOk, freshDir: freshOk };

  /* ---- ②b tapCard 单元 dual（flat10 ch3 热身：dualObv big first=r） ---- */
  total++;
  startLevel(10);
  const dq = SO.quiz;
  /* DOM 对账：legend 首球=first 色（chip+badge 双冗余）、卡 data-c=引擎 colors、6 槽 */
  const legendOk = dq && dq.kind === 'dual' && dq.first === 'r' &&
    chipEl.dataset.first === 'r' && badgeEl.dataset.order === dq.order &&
    chipEl.querySelectorAll('.lg')[0].textContent === DUAL_COLORS.r.e &&
    chipEl.querySelectorAll('.lg')[1].textContent === DUAL_COLORS.b.e &&
    badgeEl.querySelectorAll('.lg')[0].textContent === DUAL_COLORS.r.e &&
    boardEl.querySelectorAll('.card').length === 6 &&
    stripEl.querySelectorAll('.slot').length === 6 &&
    Array.prototype.every.call(boardEl.querySelectorAll('.card'), (c, i) =>
      c.dataset.c === dq.colors[i] && Number(c.dataset.size) === dq.items[i]);
  /* 平局语义：同档两色，非首色=错（wig）；首色=对 → 下一应点=同档另一色（tie 翻转） */
  const dAns = dq.answerIdx;
  const tieIdx = dq.items.findIndex((v, i) => v === dq.items[dAns] && i !== dAns);   // 同档另一色
  const rTieW = await SO.tapCard(tieIdx);         // 同档异色=错（同尺寸非首色不该先排）
  const tieWrongOk = rTieW === 'wrong' && SO.quiz.miss === 1;
  const rTieR = await SO.tapCard(dAns);           // 首色=对（窗内对选放行——契约 I）
  const tieRightOk = rTieR === 'step' && SO.quiz.pos === 1 && cardEl(dAns).classList.contains('gone');
  const flipOk = SO.quiz.answerIdx === tieIdx && expectIdx(SO.quiz) === tieIdx;   // 平局翻转独立重算
  const rFlip = await SO.tapCard(tieIdx);
  const flip2Ok = rFlip === 'step' && SO.quiz.pos === 2 &&
    SO.quiz.answerIdx === expectIdx(SO.quiz);
  const dualOk = legendOk && tieWrongOk && tieRightOk && flipOk && flip2Ok;
  if (dualOk) npass++;
  units.tapDual = { ok: dualOk, legend: legendOk, tieWrong: tieWrongOk, tieRight: tieRightOk,
    flip: flipOk && flip2Ok };

  /* ---- ②c tapCard 单元 ord（flat15 ch4 热身：ord obv6 rank2 big） ---- */
  total++;
  startLevel(15);
  const oq = SO.quiz;
  const oas = Array.prototype.slice.call(chipEl.querySelectorAll('.oa'));
  const oAns = oq.answerIdx;
  let oWrong = (oAns + 1) % oq.items.length;
  if (oWrong === oAns) oWrong = (oWrong + 1) % oq.items.length;
  /* DOM 对账：#strip.ord 单槽+槽内数字=rank；题面锚 n 圆点 size 降序（big）+ring 位=rank-1 */
  const ordDomOk = oq && oq.kind === 'ord' && oq.rank === 2 && oq.order === 'big' &&
    chipEl.dataset.rank === '2' &&
    stripEl.classList.contains('ord') &&
    stripEl.querySelectorAll('.slot').length === 1 &&
    stripEl.querySelector('.slot .s-num').textContent === '2' &&
    oas.length === oq.items.length &&
    oas.every((e, i) => e.classList.contains('ring') === (i === oq.rank - 1)) &&
    oas.every((e, i) => i === 0 || parseInt(oas[i - 1].style.fontSize, 10) > parseInt(e.style.fontSize, 10)) &&
    oq.answerIdx === expectIdx(oq);               /* 第 2 大独立重算（≠位置序） */
  const rOW = await SO.tapCard(oWrong);           // 错点：wig 零惩罚不推进（序数题单点）
  const ordWrongOk = rOW === 'wrong' && SO.quiz.miss === 1 && SO.quiz.step === 0 &&
    cardEl(oWrong).classList.contains('wig') && !cardEl(oWrong).classList.contains('gone');
  const pOR = SO.tapCard(oAns);                   // 对点（窗内对选放行）：goal 飞入单槽（promise 内含演出窗）
  await wait(60);                                 /* 演出中段读 DOM（goal 后 renderQuiz 重建板——末态读不到飞入痕迹） */
  const flyGone = cardEl(oAns).classList.contains('gone') &&
    slotEl(0).classList.contains('lit') &&
    slotEl(0).querySelector('.s-num').textContent === '2';
  const rOR = await pOR;
  const ordRightOk = rOR === 'goal' && SO.currentLevel.step === 1 && flyGone;
  const ordOk = ordDomOk && ordWrongOk && ordRightOk;
  if (ordOk) npass++;
  units.tapOrd = { ok: ordOk, dom: ordDomOk, wrong: ordWrongOk, right: ordRightOk };

  /* ---- ③ sayW 三态+豁免窗（flat0 无节流 / flat3 节流静默不设窗 / force 起播 / 窗内吞） ---- */
  total++;
  const wLog = [];
  const origPlay2 = KIDS.voice.play;
  KIDS.voice.play = function (key, text) { wLog.push([key, String(text).slice(0, 4)]); };
  const wrongPlays = () => wLog.filter(p => p[0] === 'sor_wrong' && p[1].indexOf('再想') === 0).length;   /* T46 阶段2：wrong 已 clip 化（键化断言，text 仍对账） */
  const wrongIdx = () => { const q = SO.quiz; let i = 0; while (i === q.answerIdx) i++; return i; };
  startLevel(0);                                   // flat0：无 10s 节流（间隔>豁免窗两错均播）
  await SO.tapCard(wrongIdx());
  await wait(4450);                                /* 窗过期再错（窗内会吞——契约 I） */
  await SO.tapCard(wrongIdx());
  const sayA = wrongPlays();                       // → 2
  startLevel(3);                                   // flat3：节流档
  lastWrongVoice = Date.now();                     /* 显式进入节流窗口内 */
  const rA = await SO.tapCard(wrongIdx());         // miss=1 节流静默：不播不设窗（照计数）
  const missA = SO.quiz.miss, sayB1 = wrongPlays() - 2;
  const rB = await SO.tapCard(wrongIdx());         // miss=2 → force ===2 起播+设窗
  const missB = SO.quiz.miss, sayB2 = wrongPlays() - 2 - sayB1;
  const rC = await SO.tapCard(wrongIdx());         // 窗内吞：false 且 miss 不动
  const missC = SO.quiz.miss;
  KIDS.voice.play = origPlay2;
  const sayWOk = sayA === 2 && rA === 'wrong' && missA === 1 && sayB1 === 0 &&
    rB === 'wrong' && missB === 2 && sayB2 === 1 &&
    rC === false && missC === 2;
  if (sayWOk) npass++;
  units.sayW = { ok: sayWOk, flat0Plays: sayA, flat3ThrottleSilent: sayB1 === 0 && missA === 1,
    flat3Force: sayB2 === 1 && missB === 2, windowSwallow: rC === false && missC === 2 };

  /* ---- ④ UI 冒烟 A：flat0 真实通路通关（首题错一次 → 1 错=2 星，verify 页不弹层） ---- */
  total++;
  startLevel(0);
  let smokeA = true, wrongOk2 = false, quizzesA = 0;
  for (let s = 0; s < CH_LEN && smokeA; s++) {
    const q = SO.quiz;
    if (!q) { smokeA = false; break; }
    if (s === 0) {                               // 首错：零惩罚；首错不 pulse 应点卡
      let w = 0; while (w === q.answerIdx) w++;
      await SO.tapCard(w);
      wrongOk2 = SO.currentLevel.retries === 1 && SO.currentLevel.step === 0 &&
        !cardEl(SO.quiz.answerIdx).classList.contains('breathe');
    }
    let g3 = 0, lastT = null;
    while (SO.quiz && SO.quiz.step === s && g3++ < 12) lastT = await SO.tapCard(SO.quiz.answerIdx);
    if (lastT !== 'goal' && lastT !== 'done') smokeA = false;
    quizzesA++;
  }
  const lvA = SO.currentLevel;
  const smokeOkA = smokeA && wrongOk2 && quizzesA === CH_LEN && lvA.done && lvA.won &&
    lvA.retries === 1 && engStars(cur) === 2 && !document.querySelector('.k-celebrate');
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, wrongOk: wrongOk2, quizzes: quizzesA,
    retries: lvA.retries, stars: engStars(cur) };

  /* ---- ④ UI 冒烟 B1：flat5（ch2 方向混合）首题热身+每关 ≥1 small+autoSolve 3 星 ---- */
  total++;
  startLevel(5);
  const L5 = genLevel(5);
  const o5 = L5.quizzes.map(q => q.order);
  const nOk5 = L5.quizzes.every(q => q.items.length === 6 || q.items.length === 7);
  const ladOk5 = L5.quizzes.every(q =>
    q.items.slice().sort((a, b) => a - b).join(',') === ladderSet(q.tier));
  const warm5 = o5[0] === 'big' && o5[1] === 'small' && o5.indexOf('small') >= 0;
  const a5 = await SO.autoSolve();
  const lv5 = SO.currentLevel;
  const smokeOkB1 = warm5 && nOk5 && ladOk5 && a5.done && lv5.done && lv5.won &&
    lv5.retries === 0 && engStars(cur) === 3;
  if (smokeOkB1) npass++;
  smokes.flat5 = { ok: smokeOkB1, orders: o5, ladder: ladOk5, taps: a5.taps, stars: engStars(cur) };

  /* ---- ④ UI 冒烟 B2：flat10（ch3 双属性）真实点击通关（含平局翻转逐点） ---- */
  total++;
  startLevel(10);
  let dualTapOk = true, legendFollowOk = true, quizzesB = 0;
  for (let s = 0; s < CH_LEN && dualTapOk; s++) {
    const q = SO.quiz;
    if (!q) { dualTapOk = false; break; }
    /* 换题落地即对账：色序徽章/题面卡/卡区跟随新题（含方向与首色翻转） */
    if (badgeEl.dataset.order !== q.order || chipEl.dataset.order !== q.order ||
        chipEl.dataset.first !== q.first ||
        chipEl.querySelectorAll('.lg')[0].textContent !== DUAL_COLORS[q.first].e ||
        boardEl.querySelectorAll('.card').length !== q.items.length) legendFollowOk = false;
    let g4 = 0, lastT = null;
    while (SO.quiz && SO.quiz.step === s && g4++ < 12) lastT = await SO.tapCard(SO.quiz.answerIdx);
    if (lastT !== 'goal' && lastT !== 'done') dualTapOk = false;
    quizzesB++;
  }
  const lv10 = SO.currentLevel;
  const smokeOkB2 = dualTapOk && legendFollowOk && quizzesB === CH_LEN &&
    lv10.done && lv10.won && lv10.retries === 0;
  if (smokeOkB2) npass++;
  smokes.flat10 = { ok: smokeOkB2, legendFollow: legendFollowOk, taps: quizzesB, retries: lv10.retries };

  /* ---- ④ UI 冒烟 B3：flat15（ch4 序数+混排）真实点击通关 ---- */
  total++;
  startLevel(15);
  let ordTapOk = true, ordFollowOk = true, quizzesC = 0;
  const kindsC = [];
  for (let s = 0; s < CH_LEN && ordTapOk; s++) {
    const q = SO.quiz;
    if (!q) { ordTapOk = false; break; }
    kindsC.push(q.kind);
    if (q.kind === 'ord') {
      /* 序数题落地对账：单槽数字=rank+锚 ring 位=rank-1（方向翻转锚升降序跟随） */
      const ringIdx = Array.prototype.indexOf.call(chipEl.querySelectorAll('.oa'),
        chipEl.querySelector('.oa.ring'));
      const oasC = Array.prototype.slice.call(chipEl.querySelectorAll('.oa'));
      const descOk = q.order === 'big'
        ? oasC.every((e, i) => i === 0 || parseInt(oasC[i - 1].style.fontSize, 10) > parseInt(e.style.fontSize, 10))
        : oasC.every((e, i) => i === 0 || parseInt(oasC[i - 1].style.fontSize, 10) < parseInt(e.style.fontSize, 10));
      if (!stripEl.classList.contains('ord') ||
          stripEl.querySelector('.slot .s-num').textContent !== String(q.rank) ||
          ringIdx !== q.rank - 1 || oasC.length !== q.items.length || !descOk ||
          chipEl.dataset.rank !== String(q.rank)) ordFollowOk = false;
    }
    if (q.kind !== 'ord' && stripEl.classList.contains('ord')) ordFollowOk = false;   /* dual 回顾题无 ord 类 */
    let g5 = 0, lastT = null;
    while (SO.quiz && SO.quiz.step === s && g5++ < 12) lastT = await SO.tapCard(SO.quiz.answerIdx);
    if (lastT !== 'goal' && lastT !== 'done') ordTapOk = false;
    quizzesC++;
  }
  const lv15 = SO.currentLevel;
  const kindsOk = kindsC[0] === 'ord' && kindsC[3] === 'ord' && kindsC[4] === 'dual';
  const smokeOkB3 = ordTapOk && ordFollowOk && kindsOk && quizzesC === CH_LEN &&
    lv15.done && lv15.won && lv15.retries === 0;
  if (smokeOkB3) npass++;
  smokes.flat15 = { ok: smokeOkB3, kinds: kindsC, anchorFollow: ordFollowOk, retries: lv15.retries };

  /* ---- ⑦ 教学链（verify 直驱 tutorialWatch；真实页看-帮-独链路由无头自测覆盖） ---- */
  total++;
  const origQ7 = KIDS.voice.queue, origP7 = KIDS.voice.play;
  const qLog7 = [], pLog7 = [];
  KIDS.voice.queue = function (parts) { qLog7.push(parts.slice()); };
  KIDS.voice.play = function (key, text) { pLog7.push(String(key)); };
  startLevel(0);
  await tutorialWatch();                          // 看：watch clip → demo 排对一步 → 重发同关 → 帮
  KIDS.voice.queue = origQ7; KIDS.voice.play = origP7;
  const lastQ7 = qLog7[qLog7.length - 1];
  const tutOk = pLog7.indexOf('sor_tut_watch') >= 0 &&                        /* 看=演示配 watch clip */
    state.tut === 'help' && !state.demo && !state.locked &&                   /* 帮：解锁等孩子动手 */
    SO.currentLevel && SO.currentLevel.flat === 0 && SO.quiz && SO.quiz.pos === 0 &&  /* 重发同关=新题面 */
    lastQ7 && lastQ7.length === 2 && lastQ7[0] === 'sor_tut_turn' &&          /* 交接顺序链单通道 */
    typeof lastQ7[1] === 'object' && lastQ7[1].key === 'sor_q_big' && lastQ7[1].text === Q_BIG;
  if (tutOk) npass++;
  units.tutorial = { ok: tutOk, watchClip: pLog7.indexOf('sor_tut_watch') >= 0,
    handoff: !!lastQ7, parts: lastQ7, tut: state.tut };

  /* ---- ⑤ 布局：双 viewport 模拟 ×（obv6 flat0 / close7 flat3 / dual flat10 / ord flat15） ---- */
  async function simView(w, h) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    renderQuiz();                                 // 按新场地尺寸重排
    await wait(750);                              /* 等入场 stagger 动画结束再量（§0.11 transform 中途陷阱） */
    const de = document.documentElement;
    const q = SO.quiz;
    const n = q.items.length;
    const cards = Array.prototype.slice.call(boardEl.querySelectorAll('.card'));
    let countOk = cards.length === n;             // n 卡 + data-size 与引擎对账
    cards.forEach((c, i) => {
      if (Number(c.dataset.i) !== i || Number(c.dataset.size) !== q.items[i]) countOk = false;
    });
    const rects = cards.map(c => c.getBoundingClientRect());
    const cardOk = rects.length === n &&
      rects.every(r => r.width >= 96 && r.height >= 96);          /* 主答案按钮 ≥96（§0.9） */
    const wantSlots = q.kind === 'ord' ? 1 : n;
    const slotRects = Array.prototype.slice.call(stripEl.querySelectorAll('.slot'))
      .map(s => s.getBoundingClientRect());
    const slotOk = slotRects.length === wantSlots &&
      slotRects.every(r => r.width >= 64 && r.height >= 64);      /* 排序条槽 ≥64 专项 */
    const emojiOk = cards.every((c, i) => {       /* 级差 emoji 不溢出卡（大号 108px 专项） */
      const r = c.getBoundingClientRect(), e = c.querySelector('.c-emoji').getBoundingClientRect();
      return e.width <= r.width + 2 && e.height <= r.height + 2;
    });
    let glyphOk;                                  /* 题面锚结构按题型（方向示意/色序/序数锚） */
    if (q.kind === 'ord') {
      const oasV = Array.prototype.slice.call(chipEl.querySelectorAll('.oa'));
      const ringV = Array.prototype.indexOf.call(oasV, chipEl.querySelector('.oa.ring'));
      glyphOk = oasV.length === n && ringV === q.rank - 1 &&
        badgeEl.querySelectorAll('.d').length === 4 &&
        chipEl.getBoundingClientRect().height >= 64;
    } else if (q.kind === 'dual') {
      glyphOk = chipEl.querySelectorAll('.d').length === 4 && badgeEl.querySelectorAll('.d').length === 4 &&
        chipEl.querySelectorAll('.lg').length === 2 && badgeEl.querySelectorAll('.lg').length === 2 &&
        chipEl.querySelectorAll('.lg')[0].textContent === DUAL_COLORS[q.first].e &&
        chipEl.getBoundingClientRect().height >= 64;
    } else {
      glyphOk = chipEl.querySelectorAll('.d').length === 4 &&
        badgeEl.querySelectorAll('.d').length === 4 &&
        chipEl.getBoundingClientRect().height >= 64;
    }
    let btnOk = true;                             // 全部按钮 ≥64（.k-parentbtn 家长按钮豁免）
    document.querySelectorAll('button').forEach(b => {
      if (b.classList.contains('k-parentbtn')) return;
      const r = b.getBoundingClientRect();
      if (r.width > 4 && r.height > 4 && (r.width < 64 || r.height < 64)) btnOk = false;
    });
    const bRect = boardEl.getBoundingClientRect();
    const insideOk = rects.every(r =>             // 卡在卡区内（不溢出）
      r.left >= bRect.left - 1 && r.right <= bRect.right + 1 &&
      r.top >= bRect.top - 1 && r.bottom <= bRect.bottom + 1);
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, kind: q.kind, order: q.order, n: n, countOk: countOk, card96: cardOk,
      slot64: slotOk, emojiOk: emojiOk, glyphOk: glyphOk, btn64: btnOk, insideOk: insideOk, ox: ox,
      pass: countOk && cardOk && slotOk && emojiOk && glyphOk && btnOk && insideOk && ox <= 0 };
  }
  total++;
  const sims = [];
  const LAYOUT_FLATS = [0, 3, 10, 15];            // obv6 6 物 / close7 7 物 / dual 6 物 / ord 6 物（确定性）
  for (const f of LAYOUT_FLATS) {
    startLevel(f);
    sims.push(await simView(1280, 800)); sims.push(await simView(800, 1180));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                  // 还原真实 viewport 布局
  const layoutOk = sims.length === 8 && sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, flats: LAYOUT_FLATS, sims: sims };

  /* ---- ⑥ 分布与专项：阶梯/句族/clip 注入/三族链/源码断言（script[2]，检索串拼接防自匹配） ---- */
  total++;
  /* SPEC §-r19 梯度表独立字面量（零手抄对账：档位逐值） */
  const REF_LADDER = { obv6: '19|27|39|55|77|108', close6: '34|40|47|55|64|75',
    close7: '32|38|44|52|61|71|84', dualObv: '30|45|68', dualClose: '40|47|55' };
  const ladRefOk = Object.keys(REF_LADDER).every(t => SIZE_LADDER[t].join('|') === REF_LADDER[t]);
  /* SPEC §-r19 句族独立字面量（与 gen_clips.py/manifest 三方一致，build 对账） */
  const ORD_CN_V = { 2: '二', 3: '三', 4: '四', 5: '五' };
  const SPEC_SENT = {
    big: '从最大的开始，排一排', small: '从最小的开始，排一排',
    dbr: '从最大的开始排，一样大的，红皮球排在前面',
    dbb: '从最大的开始排，一样大的，蓝皮球排在前面',
    dsr: '从最小的开始排，一样大的，红皮球排在前面',
    dsb: '从最小的开始排，一样大的，蓝皮球排在前面'
  };
  for (let n = 2; n <= 5; n++) {
    SPEC_SENT['ob' + n] = '从最大的开始数，第' + ORD_CN_V[n] + '个，是哪一个呀';
    SPEC_SENT['os' + n] = '从最小的开始数，第' + ORD_CN_V[n] + '个，是哪一个呀';
  }
  const sentOk = qSpeech({ kind: 'sort', order: 'big' }) === SPEC_SENT.big &&
    qSpeech({ kind: 'sort', order: 'small' }) === SPEC_SENT.small &&
    qSpeech({ kind: 'dual', order: 'big', first: 'r' }) === SPEC_SENT.dbr &&
    qSpeech({ kind: 'dual', order: 'big', first: 'b' }) === SPEC_SENT.dbb &&
    qSpeech({ kind: 'dual', order: 'small', first: 'r' }) === SPEC_SENT.dsr &&
    qSpeech({ kind: 'dual', order: 'small', first: 'b' }) === SPEC_SENT.dsb &&
    [2, 3, 4, 5].every(n => qSpeech({ kind: 'ord', order: 'big', rank: n }) === SPEC_SENT['ob' + n] &&
      qSpeech({ kind: 'ord', order: 'small', rank: n }) === SPEC_SENT['os' + n]) &&
    Q_BIG === SPEC_SENT.big && Q_SMALL === SPEC_SENT.small &&
    Q_DUAL.br === SPEC_SENT.dbr && Q_DUAL.bb === SPEC_SENT.dbb &&
    Q_DUAL.sr === SPEC_SENT.dsr && Q_DUAL.sb === SPEC_SENT.dsb;
  /* sor_* clips 注入对账（build 注入后 KIDS.voice.clips 应含全部 17 条 sor + 3 core） */
  const SOR_KEYS = ['sor_hint', 'sor_tut_turn', 'sor_tut_watch', 'sor_q_big', 'sor_q_small',
    'sor_q_dbr', 'sor_q_dbb', 'sor_q_dsr', 'sor_q_dsb',
    'sor_q_ob2', 'sor_q_ob3', 'sor_q_ob4', 'sor_q_ob5',
    'sor_q_os2', 'sor_q_os3', 'sor_q_os4', 'sor_q_os5'];
  const CORE_KEYS = ['core_chapter_end', 'core_day_end', 'core_rest'];
  const clipOk = SOR_KEYS.every(k => !!KIDS.voice.clips[k]) && CORE_KEYS.every(k => !!KIDS.voice.clips[k]);
  /* 开场顺序链（stub 记录）：queue([sor_hint, {key 题面句}]) 单通道；三族读题链=单段 keyed
     （keylessLast：全部段 keyed——core queue 弃尾语义下 keyless 恒链尾，本款无 keyless 段） */
  const origQ = KIDS.voice.queue, origP = KIDS.voice.play, origS = KIDS.voice.say;
  const qLog = [], playLog = [], sayLog = [];
  KIDS.voice.queue = function (parts) { qLog.push(parts.slice()); };
  KIDS.voice.play = function (key) { playLog.push(String(key)); };
  KIDS.voice.say = function (t) { sayLog.push(String(t)); };
  startLevel(0);                                  // flat0 首题 sort big 确定性
  const lastQ = qLog[qLog.length - 1];
  const openChain = qLog.length >= 1 && lastQ.length === 2 &&
    lastQ[0] === 'sor_hint' &&
    typeof lastQ[1] === 'object' && lastQ[1] !== null && lastQ[1].key === 'sor_q_big' &&
    lastQ[1].text === Q_BIG;                      /* 题面句=sor_q_* clip（缺 clip 时 core 走 TTS 兜底） */
  speakQuiz(genLevel(0).quizzes[0]);              // 救援/重听：单题面段
  const lastQ2 = qLog[qLog.length - 1];
  const rescueChain = qLog.length >= 2 && lastQ2 !== lastQ && lastQ2.length === 1 &&
    typeof lastQ2[0] === 'object' && lastQ2[0].key === 'sor_q_big' && lastQ2[0].text === Q_BIG;
  speakQuiz(genLevel(10).quizzes[0]);             // dual 题面链：键 sor_q_dbr（warmup first=r）
  const lastQ3 = qLog[qLog.length - 1];
  const dualChain = lastQ3.length === 1 && lastQ3[0].key === 'sor_q_dbr' &&
    lastQ3[0].text === Q_DUAL.br;
  speakQuiz(genLevel(15).quizzes[0]);             // ord 题面链：键 sor_q_ob2（warmup rank2）
  const lastQ4 = qLog[qLog.length - 1];
  const ordChain = lastQ4.length === 1 && lastQ4[0].key === 'sor_q_ob2' &&
    lastQ4[0].text === SPEC_SENT.ob2;
  const keylessLast = qLog.every(parts => parts.every(p =>
    typeof p === 'string' || (p && typeof p.key === 'string' && p.key)));   /* 全 keyed（契约 N） */
  KIDS.voice.queue = origQ; KIDS.voice.play = origP; KIDS.voice.say = origS;
  /* script[2] 源码断言（游戏块=第 3 块；verify 自身在第 4 块不参与检索——b36 自匹配防回归；
     高风险串字符串拼接） */
  const gameSrc = document.querySelectorAll('script')[2].textContent;
  const srcOk = gameSrc.indexOf('next' + 'Hint(lim - 1)') >= 0 &&          /* 家族 A 双实算 */
    gameSrc.indexOf('Math.max(0, lim - 1)') >= 0 &&
    gameSrc.indexOf('GEN_' + 'HINTS[genLevel(f + 1).dch - 1]') >= 0 &&     /* 家族 F 实算 */
    gameSrc.indexOf('(ci + 1) % 4') < 0 &&                                 /* 旧字面禁再现 */
    gameSrc.indexOf('nextHint(null)') < 0 &&                               /* 旧 null 实参禁再现 */
    gameSrc.indexOf('function rescue' + 'Tick()') >= 0 &&                  /* 契约 K */
    gameSrc.indexOf('estMs(VOICE.wrong.text) + 300') >= 0;                 /* 契约 I 豁免窗 */
  const distOk = ladRefOk && sentOk && clipOk && openChain && rescueChain && dualChain && ordChain &&
    keylessLast && srcOk &&
    KIND_IDS.every(k => kindDist[k] >= 1) &&      // 40 关 8 种 emoji 全覆盖
    mixedLevels >= 10 && dirBig > dirSmall && dirSmall >= 12;   // 混合章充足+双方向分布
  if (distOk) npass++;
  units.dist = { ok: distOk, ladderRef: ladRefOk, sent: sentOk, clips: clipOk,
    openChain: openChain, rescueChain: rescueChain, dualChain: dualChain, ordChain: ordChain,
    keylessLast: keylessLast, srcOk: srcOk,
    kindDist: kindDist, dir: { big: dirBig, small: dirSmall, mixedLevels: mixedLevels } };

  /* ---- ⑧ 时长模型 r19 双钉：字面===SPEC + modeled 精确钉死 + verify 独立计划复算 ---- */
  total++;
  const SPEC_STEP = { obv6: 1500, close6: 2100, close7: 2300, dualObv: 2800, dualClose: 3400 };
  const SPEC_ORD = { obv6: 4200, close7: 7600 };
  const SPEC_MODELED_FLAT0 = 88650;
  const SPEC_MODELED_MIN = 82760;                 // §-r19 §4：ch4 关（11065+3*14465+28300，禁约数）
  const SPEC_MODELED_MAX = 137900;                // ch3 关（24700+4*28300）
  const estMsV = s => s.length * 345 + 600;       // estMs 独立副本（四方之 verify 侧，吃字符串）
  /* SPEC 计划独立副本（不复用 QUIZ_PLAN——防同源假阳性）：[kind, tier, n] × 5 题 */
  const SPEC_PLAN = {
    1: [['sort', 'obv6', 6], ['sort', 'close6', 6], ['sort', 'close6', 6], ['sort', 'close7', 7], ['sort', 'close7', 7]],
    2: [['sort', 'close6', 6], ['sort', 'close6', 6], ['sort', 'close7', 7], ['sort', 'close7', 7], ['sort', 'close7', 7]],
    3: [['dual', 'dualObv', 6], ['dual', 'dualClose', 6], ['dual', 'dualClose', 6], ['dual', 'dualClose', 6], ['dual', 'dualClose', 6]],
    4: [['ord', 'obv6', 6], ['ord', 'close7', 7], ['ord', 'close7', 7], ['ord', 'close7', 7], ['dual', 'dualClose', 6]]
  };
  const SENT_LEN = { sort: SPEC_SENT.big.length, dual: SPEC_SENT.dbr.length, ord: SPEC_SENT.ob2.length };
  const vLevelDur = d => SPEC_PLAN[d].reduce((s, P) =>
    s + estMsV('x'.repeat(SENT_LEN[P[0]])) +                      /* 题句窗（同长哨兵串——独立复算） */
    (P[0] === 'ord' ? SPEC_ORD[P[1]] : P[2] * SPEC_STEP[P[1]]) + 400, 0);
  const litOk = JSON.stringify(STEP_MS) === JSON.stringify(SPEC_STEP) &&
    JSON.stringify(ORD_MS) === JSON.stringify(SPEC_ORD) &&
    SWITCH_MS === 400 &&
    estMsV(SPEC_SENT.big) === 4050 && estMsV(SPEC_SENT.dbr) === 7500 && estMsV(SPEC_SENT.ob2) === 6465;
  const m0Ok = modeled(0) === SPEC_MODELED_FLAT0;
  let mdMin = Infinity, mdMax = 0, planBad = 0;
  for (let f = 0; f < 40; f++) {
    const m = modeled(f);
    if (m < mdMin) mdMin = m;
    if (m > mdMax) mdMax = m;
    const L = genLevel(f);
    if (m !== vLevelDur(L.pdch)) planBad++;       /* 引擎 modeled 与 SPEC 计划复算逐关对账 */
  }
  const mdOk = litOk && m0Ok && mdMin === SPEC_MODELED_MIN && mdMax === SPEC_MODELED_MAX &&
    planBad === 0 && vLevelDur(1) === 88650 && vLevelDur(2) === 95750 &&
    vLevelDur(3) === 137900 && vLevelDur(4) === 82760;
  if (mdOk) npass++;
  units.modeled = { ok: mdOk, literals: litOk, flat0: modeled(0), min: mdMin, max: mdMax,
    planBad: planBad, chDurs: { 1: vLevelDur(1), 2: vLevelDur(2), 3: vLevelDur(3), 4: vLevelDur(4) } };

  const out = { game: 'sortsize', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
</body>
