<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大小排排队</title>
<style>
/* ================= 大小排序 sortsize（batch11 · r19 难度改造 2026-09-18）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   r19 三题型（SPEC §-r19）：sort 全排序（6-7 物相近档）/ dual 双属性（3 档×红蓝皮球，
   先大小再颜色）/ ord 序数（点"第 N 大/N 小"的那一个）。
   题面语音给指令 + 上方"排序条" + 下方 6-7 张 emoji 卡（font-size 级差缩放互异大小）。
   点对=emoji CSS transition 飞入排序条下一格；点错=晃动（不灰化可重点，SPEC §3）。
   零文字依赖（§0.19）：sort/dual 方向由"大象→蚂蚁 渐变示意+箭头"视觉承载（题面卡与
   排序条起点端双冗余）；dual 加"首色→次色"色序徽章；ord 题=sizes 序圆点行+第 rank 位
   套圈高亮（视觉序=尺寸序，与展示乱序区隔防"第 N 个"位置混淆）；槽内数字=序数标记。
   触摸目标：emoji 卡 = 主答案按钮 ≥96×96（§0.9）；底栏按钮 ≥64；overflowX 恒 0。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F5CFA0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面方向卡 + 排序条（带方向示意）+ emoji 卡区 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:8px 14px}

/* 方向渐变示意（大象→蚂蚁=从大到小 / 蚂蚁→大象=从小到大，+ 箭头；零文字依赖）
   prompt 卡=大号可点重听；dir-badge=排序条起点端小号冗余（SPEC §3 方向视觉承载）
   dual 追加色序徽章（首色→次色，与题面句"一样大的红/蓝皮球排在前面"同向，SPEC §-r19） */
.dir-glyphs{display:flex;align-items:center;gap:2px;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.dir-glyphs .d{line-height:1}
.dir-glyphs .d-arrow{width:30px;height:24px;flex:0 0 30px;margin:0 3px}
.d-legend{display:flex;align-items:center;gap:2px;margin-left:8px;padding-left:10px;
  border-left:2.5px dashed #E0CFAF}
.d-legend .lg{line-height:1}
.d-legend .lg-arrow{width:20px;height:17px;flex:0 0 20px}
#dir-badge .d-legend .lg-arrow{width:16px;height:14px;flex:0 0 16px}
#dir-badge .d-legend{margin-left:5px;padding-left:7px}

/* 序数题面锚（SPEC §-r19）：n 个 size 序圆点行，第 rank 位套圈高亮呼吸（橙圈） */
.ord-anchor{display:flex;align-items:flex-end;gap:6px;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.ord-anchor .oa{display:inline-block;line-height:1;color:#D8C9B4;position:relative}
.ord-anchor .oa.ring{color:#E8975A}
.ord-anchor .oa.ring::after{content:'';position:absolute;inset:-7px;border:3.5px solid #E8873A;
  border-radius:50%;animation:oa-ring 1.1s ease-in-out infinite}
@keyframes oa-ring{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:76px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;justify-content:center;gap:10px;padding:5px 26px;min-height:66px;
  min-width:64px;border-radius:22px;background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  transition:transform .15s}
#prompt-chip:active{transform:translateY(3px)}
#prompt-chip .dir-glyphs{gap:3px}
#prompt-chip .d-arrow{width:34px;height:26px;flex:0 0 34px}
#prompt-chip.pulse{animation:chip-pulse 1.2s ease 1}   /* r19 救援 14s 方向级：题面卡三态脉冲（不泄答案） */
@keyframes chip-pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.16)}}

/* 排序条：方向示意（起点端）+ n 槽横排；空槽=虚线+序号大字，亮槽=绿底+emoji（按比例缩放）
   ord 题=单槽大格（槽内数字=rank，SPEC §-r19 序数承载） */
#strip-wrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 4px}
#dir-badge{display:flex;align-items:center;flex:0 0 auto;padding:4px 8px;min-height:44px;
  border-radius:14px;background:#F5E9D2;border:2px solid #E0CFAF;pointer-events:none}
#dir-badge .d-arrow{width:24px;height:20px;flex:0 0 24px}
#dir-badge.teach{animation:badgeTeach 1.2s ease 2}   /* 教学期方向徽章首现显式教学（试玩 P2③） */
@keyframes badgeTeach{0%,100%{transform:scale(1);box-shadow:none}
  50%{transform:scale(1.26);box-shadow:0 0 16px rgba(232,151,90,.85)}}
#strip{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:nowrap}
.slot{width:84px;height:84px;border-radius:20px;border:3px dashed #D8C9B4;background:#FFF9EE;
  display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.slot .s-num{font-style:normal;font-size:30px;font-weight:800;color:#D8C9B4;line-height:1;
  font-variant-numeric:tabular-nums}
#strip.ord .slot{width:110px;height:110px;border-radius:26px}
#strip.ord .slot .s-num{font-size:40px;color:#E8975A}
.slot.lit{border-style:solid;border-color:#6FA063;background:#8FBF7F;
  animation:slot-lit .5s cubic-bezier(.2,1.6,.4,1)}
.slot.lit .s-num{position:absolute;top:-9px;right:-9px;width:27px;height:27px;border-radius:50%;
  background:#FFF9EE;border:2px solid #6FA063;color:#4A3B2E;font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.slot.lit .s-emoji{line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
@keyframes slot-lit{0%{transform:scale(.4)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
/* 飞入动画克隆体（CSS transition：源卡矩形 → 目标槽矩形） */
.fly{position:fixed;z-index:90;display:flex;align-items:center;justify-content:center;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  pointer-events:none;transition:transform .42s cubic-bezier(.3,.85,.35,1.08)}

/* emoji 卡区：一行 6-7 张卡（乱序大小展示），卡=主答案按钮 ≥96×96；无文字（§0.19） */
#board{flex:0 0 auto;display:flex;gap:12px;justify-content:center;align-items:stretch;
  width:100%;max-width:1180px;padding:0 2px}
#board.bump{animation:an-bump .4s ease}                /* 家族 D：吞输入期容器 bump（轻叮+可见反馈） */
@keyframes an-bump{0%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}65%{transform:translateY(3px)}}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  flex:1 1 0;min-width:96px;max-width:200px;min-height:132px;padding:6px 4px;transition:transform .15s}
.card:active{transform:translateY(3px)}
.card .c-emoji{display:inline-block;width:1em;line-height:1;text-align:center;   /* 盒=1em（emoji 字体字宽 ~1.37em 不再撑盒；字形居中对称外溢） */
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
/* 入场弹跳（换题 stagger） */
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 已排入排序条：隐藏保位（不可再点——它已不是候选；区别于点错的不灰化） */
.card.gone{visibility:hidden;pointer-events:none}
/* 答错：晃动（不灰掉——每张卡都可能是下一步，SPEC §3 不灰化款，可重点） */
.card.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}
  55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
/* 连错 2 次后：应点卡呼吸高亮（首错不 pulse，miss≥2 才高亮 §0.7） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 静置救援 30s 答案级：当前应点卡三连脉冲 0/520/1040ms 错峰（JS 触发，§0.21 batch10 定版） */
.card.pulse{animation:an-pulse 1.2s ease 1}
@keyframes an-pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.16)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch10 habit） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：方向卡/底栏/卡适配，主答案卡仍 ≥96（r19：7 卡 96px+9gap=678<800 宽 OK） */
@media (orientation:portrait){
  #prompt-chip{padding:5px 18px;gap:8px}
  #prompt-chip .d-arrow{width:28px;height:22px;flex:0 0 28px}
  #prompt-chip .d-legend{margin-left:5px;padding-left:6px;gap:1px}
  #prompt-chip .d-legend .lg-arrow{width:15px;height:13px;flex:0 0 15px}
  #strip-wrap{gap:8px}
  #dir-badge{padding:3px 6px;min-height:40px}
  #dir-badge .d-arrow{width:20px;height:17px;flex:0 0 20px}
  .slot{width:76px;height:76px}
  #strip.ord .slot{width:96px;height:96px}
  #strip{gap:8px}
  #board{gap:9px}
  .card{min-height:128px;max-width:170px}
  .ord-anchor{gap:4px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
/*PORT-CLS*/
body.port #prompt-chip{padding:5px 18px;gap:8px}
body.port #prompt-chip .d-arrow{width:28px;height:22px;flex:0 0 28px}
body.port #prompt-chip .d-legend{margin-left:5px;padding-left:6px;gap:1px}
body.port #prompt-chip .d-legend .lg-arrow{width:15px;height:13px;flex:0 0 15px}
body.port #strip-wrap{gap:8px}
body.port #dir-badge{padding:3px 6px;min-height:40px}
body.port #dir-badge .d-arrow{width:20px;height:17px;flex:0 0 20px}
body.port .slot{width:76px;height:76px}
body.port #strip.ord .slot{width:96px;height:96px}
body.port #strip{gap:8px}
body.port #board{gap:9px}
body.port .card{min-height:128px;max-width:170px}
body.port .ord-anchor{gap:4px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
</style>
</head>
<body>
<div id="game" aria-label="大小排排队">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <button id="prompt-chip" aria-label="题目，点我再听一遍"></button>
    </div>
    <div id="strip-wrap" aria-label="排序条">
      <div id="dir-badge" aria-hidden="true"></div>
      <div id="strip"></div>
    </div>
    <div id="board" aria-label="大小卡片"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
