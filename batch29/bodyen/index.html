<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>身体英语</title>
<style>
/* ================= 身体英语 bodyen（batch29）=================
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E；
   6-7 岁幼小衔接段（听力辨词+词形认读）：题面 = 小兔身体大图
   （see 题高亮目标部位/hear 题中性全身+听标），下方 4 张卡
   （hear=部位图卡：迷你小兔单部位高亮 / see=英语单词文字卡小写宽字距）。
   部位高亮=暖橙底+深橙描边+辉光（.pt.hl）；方向级反馈叠 .pt-pulse 三连闪。
   点对=场景放大跳 + 小兔子滑入示范 + 确认句拼播；点错=卡摇头 + bod_wrong +
   语义句 TTS（卡不灰可重选——探索不罚）。
   触摸目标：候选卡=主答案按钮 ≥96×96（§0.9）；题面可点重听；底栏按钮 ≥72。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 50px;display:flex;align-items:center;padding:5px 60px 0 14px;gap:14px}
#logo{width:40px;height:40px;border-radius:12px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 40px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面卡（小兔身体图+题面句）→ 候选卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;overflow:hidden;padding:6px 12px}

/* 题面卡：可点重听题面；小兔身体 SVG + 题面句文字条（+hear 题听标） */
#scene{position:relative;width:min(580px,94vw);height:238px;border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;overflow:hidden;padding:0;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene .sky{position:absolute;inset:0;margin:auto}
#scene .scene-slot{position:absolute;left:0;right:0;top:14px;bottom:0;z-index:2;
  display:flex;align-items:center;justify-content:center}
#scene .scene-slot svg{width:154px;height:190px}
@keyframes slot-jump{0%,100%{transform:scale(1)}
  40%{transform:scale(1.09) rotate(-2deg)}
  75%{transform:scale(1.03) rotate(1.5deg)}}
#scene .scene-slot.jump{animation:slot-jump .55s cubic-bezier(.2,1.6,.4,1) 2}
/* 题面句文字条（顶部——浮于题面上方） */
#scene .q-text{position:absolute;left:50%;top:5px;transform:translateX(-50%);z-index:3;
  background:rgba(255,249,238,.94);border:2.5px solid #4A3B2E;border-radius:16px;
  padding:4px 18px;font-size:22px;font-weight:700;letter-spacing:1px;white-space:nowrap}
/* hear 题听标（右下角：点题面重听词音） */
#scene .snd-chip{position:absolute;right:12px;bottom:10px;z-index:3;display:flex;align-items:center;
  gap:5px;background:rgba(255,249,238,.94);border:2.5px solid #4A3B2E;border-radius:16px;
  padding:4px 12px;font-size:17px;font-weight:800}
#scene .snd-chip svg{width:26px;height:26px}
/* 部位高亮辉光（.pt.hl 恒亮；方向级反馈叠 .pt-pulse 三连闪） */
#scene .pt.hl, .card .pt.hl{filter:drop-shadow(0 0 7px rgba(232,151,90,.95))}
#scene .pt.hl.pt-pulse, .card .pt.hl.pt-pulse{animation:pt-pulse .55s ease-in-out 3}
@keyframes pt-pulse{0%,100%{filter:drop-shadow(0 0 7px rgba(232,151,90,.95))}
  50%{filter:drop-shadow(0 0 18px rgba(201,119,46,1)) brightness(1.05)}}
/* 小兔子滑入示范（答对时从右侧滑到题面旁，开心跳） */
#scene .demo-pet{position:absolute;right:14px;bottom:8px;z-index:3;
  animation:petin .5s cubic-bezier(.2,1.6,.4,1) backwards, pet-joy .8s ease .5s 3}
#scene .demo-pet svg{width:50px;height:50px;filter:drop-shadow(0 2px 0 rgba(255,255,255,.8))}
@keyframes petin{0%{transform:translateX(70px) scale(.2);opacity:0}
  100%{transform:translateX(0) scale(1);opacity:1}}
@keyframes pet-joy{0%,100%{margin-top:0}50%{margin-top:-10px}}
/* 救援方向级：题面区 pulse（整体呼吸放大 3 次；hear 题用） */
#scene.pulse{animation:scene-pulse 1s ease-in-out 3}
@keyframes scene-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#scene.bounce{animation:scene-b .4s ease}
@keyframes scene-b{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}

/* ---------- 候选卡排：hear=4 部位图卡 / see=4 词文字卡；主答案按钮 ≥96×96；
   窄屏 flex-wrap 自然落 2×2；吞输入=容器 bump ---------- */
#board{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:stretch;flex:0 0 auto;
  width:100%;max-width:660px;padding:0 2px}
#board.bump{animation:board-bump .22s ease}
@keyframes board-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 5px 0 #D8C9B4;flex:0 0 auto;width:140px;min-height:116px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s;overflow:hidden}
.card:active{transform:translateY(3px)}
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.card.bump{animation:card-bump .22s ease}
@keyframes card-bump{0%,100%{transform:scale(1)}45%{transform:scale(.94)}}
/* 图卡（hear/do-touch）：迷你小兔单部位高亮（do-touch 叠爪标 .ptouch） */
.card.pcard svg{width:76px;height:94px}
/* 词卡（see）：英语单词小写宽字距（认读对象 §0.19；r41 长词分档防溢出——
   6 字母 md=26/7 字母 sm=22/8 字母 xs=19，卡宽 140 内闭合） */
.card .w-label{font-size:29px;font-weight:800;letter-spacing:2px;white-space:nowrap;
  font-family:"Comic Sans MS","Segoe Print","PingFang SC",sans-serif}
.card .w-label.md{font-size:26px;letter-spacing:1.5px}
.card .w-label.sm{font-size:22px;letter-spacing:1px}
.card .w-label.xs{font-size:19px;letter-spacing:.5px}
/* 动作卡（do-action，r41）：动作图标+中文短语（图示即答案内容——动效符号承载数据） */
.card.acard{flex-direction:column;gap:4px;padding:8px 6px}
.card.acard svg{width:84px;height:84px}
.card .a-label{font-size:21px;font-weight:800;letter-spacing:1px;white-space:nowrap}
/* 答对：卡绿+弹 */
.card.lit{border-color:#6FA063;box-shadow:0 5px 0 #8FBF7F;
  animation:card-lit .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes card-lit{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 答错：摇头晃动（不灰掉可重选——探索不罚，语义反馈款） */
.card.wig{animation:an-wig .6s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}22%{transform:rotate(-8deg) translateX(-4px)}
  50%{transform:rotate(7deg) translateX(3px)}78%{transform:rotate(-4deg) translateX(-2px)}}
/* 30s 答案级救援：正确卡呼吸高亮循环（§0.21） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-28） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：题面/卡适配，主答案卡仍 ≥96 */
@media (orientation:portrait){
  #scene{height:222px}
  #scene .scene-slot svg{width:140px;height:172px}
  #scene .q-text{font-size:19px;padding:3px 14px}
  #scene .demo-pet svg{width:44px;height:44px}
  #scene .snd-chip{padding:3px 10px;font-size:15px}
  #scene .snd-chip svg{width:22px;height:22px}
  #board{gap:12px}
  .card{width:130px;min-height:110px}
  .card.pcard svg{width:70px;height:86px}
  .card .w-label{font-size:26px;letter-spacing:1px}
  .card .w-label.md{font-size:23px}
  .card .w-label.sm{font-size:20px}
  .card .w-label.xs{font-size:17px}
  .card.acard svg{width:76px;height:76px}
  .card .a-label{font-size:19px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="身体英语">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="听一听，点我再听一遍"></button>
    <div id="board" aria-label="候选卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ---------- 小兔身体 SVG（viewBox 0 0 210 260；hl=高亮部位 id 或 null=中性全身；
   mode='touch'=do-touch 卡叠加摸部位爪标——爪=暖橙描边小爪+指向短线，恒在最后绘制）
   r41 部位分组扩 8→24 .pt[data-part]：head 脸圆 / face 脸区椭圆（中性透明不描——区域本身
   即内容）/ hair 头顶呆毛 / eyebrow 双眉弓 / eye 双眼 / ear 双耳 / nose 鼻 / mouth 嘴 /
   tooth 门牙（兔宝宝大板牙，鼻下嘴上）/ tongue 舌（嘴下垂舌）/ chin 下巴（脸圆下缘凸起）/
   cheek 双颊红晕 / neck 脖（头躯之间竖带）/ shoulder 双肩垫（躯干上侧两角）/ arm 双臂 /
   elbow 双肘点（臂中）/ hand 双掌 / finger 掌上双指线 / thumb 掌侧拇指凸 / leg 双大腿
   （r41 改：原「脚蹄」画法移 foot，leg 重画为体侧大腿——腿/脚分离）/ knee 膝点（大腿上）/
   foot 双脚蹄 / toe 足趾小凸 / belly 肚皮（躯干中央椭圆，原中性衬底升格部位）。
   高亮=暖橙底 #F9C98A + 深橙描边 #C9772E + .pt.hl 辉光（CSS drop-shadow，方向级
   反馈再叠 .pt-pulse 三连闪）；hear 图卡=单部位高亮迷你兔，see 题面=目标部位高亮大图，
   do-touch 卡=高亮部位+爪标迷你兔。 */
function bodySvg(hl, mode) {
  const on = w => w === hl;
  const F = w => on(w) ? '#F9C98A' : '#FBF7F0';   // 部位底色（高亮=暖橙）
  const S = w => on(w) ? '#C9772E' : INK;         // 描边（高亮=深橙）
  const G = w => '<g class="pt' + (on(w) ? ' hl' : '') + '" data-part="' + w + '">';
  /* 双耳（耳廓+粉耳内；头后；两侧同包一组——与 arm/hand/leg 同构，高亮恰 1 组） */
  const earSide = (cx, rot) =>
    '<ellipse cx="' + cx + '" cy="46" rx="14" ry="34" fill="' + F('ear') + '" stroke="' + S('ear') + '" stroke-width="4" transform="rotate(' + rot + ' ' + cx + ' 46)"/>' +
    '<ellipse cx="' + cx + '" cy="50" rx="6" ry="22" fill="#F2B8C6" transform="rotate(' + rot + ' ' + cx + ' 46)"/>';
  const earG = G('ear') + earSide(84, -14) + earSide(128, 14) + '</g>';
  /* 脖子（头躯之间竖带；头后绘制露出下段——头覆盖上缘） */
  const neckG = G('neck') +
    '<rect x="93" y="150" width="24" height="34" rx="9" fill="' + F('neck') + '" stroke="' + S('neck') + '" stroke-width="4"/></g>';
  /* 双大腿（r41：体侧胶囊——与臂同构；原脚蹄画法归 foot） */
  const legG = G('leg') +
    '<ellipse cx="74" cy="228" rx="14" ry="21" fill="' + F('leg') + '" stroke="' + S('leg') + '" stroke-width="4" transform="rotate(10 74 228)"/>' +
    '<ellipse cx="136" cy="228" rx="14" ry="21" fill="' + F('leg') + '" stroke="' + S('leg') + '" stroke-width="4" transform="rotate(-10 136 228)"/></g>';
  /* 双膝点（大腿上缘小圆） */
  const kneeG = G('knee') +
    '<circle cx="74" cy="222" r="5.5" fill="' + F('knee') + '" stroke="' + S('knee') + '" stroke-width="3"/>' +
    '<circle cx="136" cy="222" r="5.5" fill="' + F('knee') + '" stroke="' + S('knee') + '" stroke-width="3"/></g>';
  /* 双脚蹄（体前趴蹄——原 leg 画法） */
  const footG = G('foot') +
    '<ellipse cx="82" cy="247" rx="17" ry="10" fill="' + F('foot') + '" stroke="' + S('foot') + '" stroke-width="4"/>' +
    '<ellipse cx="128" cy="247" rx="17" ry="10" fill="' + F('foot') + '" stroke="' + S('foot') + '" stroke-width="4"/></g>';
  /* 足趾（蹄前缘三小凸） */
  const toeFoot = cx => [cx - 8, cx, cx + 8].map(x =>
    '<circle cx="' + x + '" cy="252" r="2.4" fill="' + F('toe') + '" stroke="' + S('toe') + '" stroke-width="2"/>').join('');
  const toeG = G('toe') + toeFoot(82) + toeFoot(128) + '</g>';
  /* 双臂（体侧斜挂胶囊） */
  const armG = G('arm') +
    '<ellipse cx="63" cy="196" rx="11" ry="23" fill="' + F('arm') + '" stroke="' + S('arm') + '" stroke-width="4" transform="rotate(24 63 196)"/>' +
    '<ellipse cx="147" cy="196" rx="11" ry="23" fill="' + F('arm') + '" stroke="' + S('arm') + '" stroke-width="4" transform="rotate(-24 147 196)"/></g>';
  /* 双肘点（臂中外侧小圆） */
  const elbowG = G('elbow') +
    '<circle cx="71" cy="191" r="5" fill="' + F('elbow') + '" stroke="' + S('elbow') + '" stroke-width="3"/>' +
    '<circle cx="139" cy="191" r="5" fill="' + F('elbow') + '" stroke="' + S('elbow') + '" stroke-width="3"/></g>';
  /* 双掌（臂端圆爪） */
  const handG = G('hand') +
    '<circle cx="51" cy="217" r="10" fill="' + F('hand') + '" stroke="' + S('hand') + '" stroke-width="4"/>' +
    '<circle cx="159" cy="217" r="10" fill="' + F('hand') + '" stroke="' + S('hand') + '" stroke-width="4"/></g>';
  /* 手指（掌上双短线——中性淡棕，高亮深橙加粗） */
  const fingPaw = cx => [cx - 3.5, cx + 3.5].map(x =>
    '<line x1="' + x + '" y1="209.5" x2="' + x + '" y2="214.5" stroke="' + (on('finger') ? '#C9772E' : '#B9A88F') +
    '" stroke-width="' + (on('finger') ? 3.4 : 2.4) + '" stroke-linecap="round"/>').join('');
  const fingerG = G('finger') + fingPaw(51) + fingPaw(159) + '</g>';
  /* 大拇指（掌侧拇指凸——掌外缘小圆连掌，连指手套形） */
  const thumbG = G('thumb') +
    '<circle cx="43.5" cy="213.5" r="4.6" fill="' + F('thumb') + '" stroke="' + S('thumb') + '" stroke-width="3"/>' +
    '<circle cx="166.5" cy="213.5" r="4.6" fill="' + F('thumb') + '" stroke="' + S('thumb') + '" stroke-width="3"/></g>';
  /* 双肩垫（躯干上侧两角小椭圆，臂根上方） */
  const shoulderG = G('shoulder') +
    '<ellipse cx="72" cy="177" rx="11" ry="9" fill="' + F('shoulder') + '" stroke="' + S('shoulder') + '" stroke-width="3.5"/>' +
    '<ellipse cx="138" cy="177" rx="11" ry="9" fill="' + F('shoulder') + '" stroke="' + S('shoulder') + '" stroke-width="3.5"/></g>';
  /* 肚皮（躯干中央椭圆——原中性衬底升格部位） */
  const bellyG = G('belly') +
    '<ellipse cx="105" cy="208" rx="30" ry="26" fill="' + (on('belly') ? '#F9C98A' : '#F6EAD6') +
    '" stroke="' + (on('belly') ? '#C9772E' : 'none') + '" stroke-width="4"/></g>';
  /* 脸圆（头部；r41 cy 114→110 r 52→48 给脖/下巴让位） */
  const headG = G('head') +

  /* 呆毛（头顶三撮弧线） */
  const hairG = G('hair') +

    (on('hair') ? '#C9772E' : INK) + '" stroke-width="' + (on('hair') ? 4.4 : 3.4) + '" stroke-linecap="round"/></g>';
  /* 脸区（眼鼻嘴所在椭圆；中性透明不描——区域本身即内容，不与 head 争夺中性视觉） */
  const faceG = G('face') +
    '<ellipse cx="105" cy="118" rx="33" ry="29" fill="' + (on('face') ? '#F9C98A' : 'rgba(0,0,0,0)') +
    '" stroke="' + (on('face') ? '#C9772E' : 'none') + '" stroke-width="4"/></g>';
  /* 双眉（眉弓短线；中性淡棕） */
  const browSide = x0 =>
    '<path d="M' + x0 + ' 95 Q' + (x0 + 8) + ' 88 ' + (x0 + 16) + ' 95" fill="none" stroke="' +
    (on('eyebrow') ? '#C9772E' : '#B9A88F') + '" stroke-width="' + (on('eyebrow') ? 4.4 : 3.2) + '" stroke-linecap="round"/>';
  const browG = G('eyebrow') + browSide(79) + browSide(115) + '</g>';
  /* 双眼（高亮=橙瞳放大加描边；中性=墨点+高光） */
  const eye = cx => '<circle cx="' + cx + '" cy="104" r="' + (on('eye') ? 8.5 : 7) +
    '" fill="' + (on('eye') ? '#E8975A' : INK) + '" stroke="' + (on('eye') ? INK : 'none') + '" stroke-width="2.5"/>' +
    (on('eye') ? '' : '<circle cx="' + (cx + 2.5) + '" cy="101.5" r="2.2" fill="#FFF" opacity=".85"/>');
  const eyeG = G('eye') + eye(87) + eye(123) + '</g>';
  /* 鼻（粉鼻/高亮橙鼻） */
  const noseG = G('nose') +
    '<ellipse cx="105" cy="123" rx="6.5" ry="5" fill="' + (on('nose') ? '#E8975A' : '#D98A8A') +
    '" stroke="' + S('nose') + '" stroke-width="' + (on('nose') ? 3 : 2.5) + '"/></g>';
  /* 门牙（兔宝宝大板牙：鼻下白方块；嘴前绘制） */
  const toothG = G('tooth') +
    '<rect x="100" y="127" width="10" height="8.5" rx="2" fill="' + (on('tooth') ? '#F9C98A' : '#FFFFFF') +
    '" stroke="' + (on('tooth') ? '#C9772E' : INK) + '" stroke-width="' + (on('tooth') ? 3 : 2) + '"/></g>';
  /* 嘴（w 形兔唇） */
  const mouthG = G('mouth') +

  const tongueG = G('tongue') +

  /* 双颊红晕 */
  const cheekG = G('cheek') +
    '<ellipse cx="78" cy="124" rx="9" ry="6" fill="' + (on('cheek') ? '#F9C98A' : '#F2B8C6') +
    '" stroke="' + (on('cheek') ? '#C9772E' : 'none') + '" stroke-width="2.5"/>' +
    '<ellipse cx="132" cy="124" rx="9" ry="6" fill="' + (on('cheek') ? '#F9C98A' : '#F2B8C6') +
    '" stroke="' + (on('cheek') ? '#C9772E' : 'none') + '" stroke-width="2.5"/></g>';

  const chinG = G('chin') +

  /* do-touch 爪标：小爪圆+双趾痕+指向短线（画在最后，位置按部位锚点偏外） */
  const PAW_ANCHOR = {

    knee: [74, 221], foot: [82, 247], toe: [82, 241], belly: [113, 208]

  const pawG = (mode === 'touch' && hl && PAW_ANCHOR[hl])
    ? '<g class="ptouch" aria-hidden="true">' +

        '" x2="' + (PAW_ANCHOR[hl][0] + 9) + '" y2="' + (PAW_ANCHOR[hl][1] + 7) +
        '" stroke="#C9772E" stroke-width="3.4" stroke-linecap="round"/>' +
      '<circle cx="' + (PAW_ANCHOR[hl][0] + 15) + '" cy="' + (PAW_ANCHOR[hl][1] + 12) +
        '" r="8" fill="#FFF9EE" stroke="#C9772E" stroke-width="3.4"/>' +
      '<line x1="' + (PAW_ANCHOR[hl][0] + 12) + '" y1="' + (PAW_ANCHOR[hl][1] + 8) +
        '" x2="' + (PAW_ANCHOR[hl][0] + 14.5) + '" y2="' + (PAW_ANCHOR[hl][1] + 11) +
        '" stroke="#C9772E" stroke-width="2.2" stroke-linecap="round"/>' +
      '<line x1="' + (PAW_ANCHOR[hl][0] + 17) + '" y1="' + (PAW_ANCHOR[hl][1] + 7.5) +
        '" x2="' + (PAW_ANCHOR[hl][0] + 19) + '" y2="' + (PAW_ANCHOR[hl][1] + 11) +
        '" stroke="#C9772E" stroke-width="2.2" stroke-linecap="round"/></g>'
    : '';
  /* 总装：地影→躯干→肚→脖→大腿→膝→脚→趾→臂→肘→掌→指→拇→肩→耳→脸圆→呆毛→脸区→
     眉→眼→鼻→门牙→嘴→舌→颊→下巴（前后遮挡次序；爪标最后） */
  return '<svg class="body" viewBox="0 0 210 260" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">' +
    '<ellipse cx="105" cy="256" rx="62" ry="6" fill="#EFE3CD" opacity=".6"/>' +
    '<ellipse cx="105" cy="205" rx="52" ry="46" fill="#FBF7F0" stroke="' + INK + '" stroke-width="4"/>' +
    bellyG + neckG + legG + kneeG + footG + toeG + armG + elbowG + handG + fingerG + thumbG +
    shoulderG + earG + headG + hairG + faceG + browG + eyeG + noseG + toothG + mouthG + tongueG +
    cheekG + chinG + pawG +
    '</svg>';
}

/* ================= bodyen 纯引擎：确定性关卡生成 + 四卡点选判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 71)：同 flat 永远同关（重玩一致、verify 可检）。
   章型（SPEC-R41-BODYEN §R2/§R3；进度章号单调递增、难度章号 dch=1+flat//5 静态四档）：
     dch1 hear 5 连（真值域 ALL24——全库听力曝光起步）
     dch2 see 5 连（真值域 ALL24；真值∈近形族 ⇒ 族干扰必在场——ch2 起近形近音干扰律）
     dch3 混出+近形：kind 逐题掷 hear/see（全同翻 1 保两种题型在场）；真值域=NEAR20，
          族干扰必在场
     dch4 混合+动词指令：qi1/qi3 恒 do（动词=VERBS[家族内 do 序号 % 5]——结构性均匀，
          触摸动词取 deck 词为部位、动作动词固定短语），其余 qi hear/see 混出（全同翻 1）
          +真值∈NEAR20 族干扰在场
   r41 词覆盖结构性保证（r32 deckOf 范式）：章族牌库 deck=shuffled(域, mulberry32(dch×104729+41))
   独立种子流；族内第 idx 关取 5 连位段（idx×5+qi 回绕）——ch1/ch2 静态 5 关 25 位段 ≥24=
   ALL24 全覆盖，ch3 静态 5 关 25 位段 ≥20=NEAR20 全覆盖（verify/pycheck 机检）。
   flat0 题0 锚定 hear/eye（教学「听英语点身体」演示锚点：幽灵手指点 eye 图卡）。
   铁律：候选恒 4 互异含真值；相邻题（kind:verb:ask）互异；ch2+ 真值∈NEAR20 ⇒ 近形族干扰
   必在场；do 题=单步判定（r25 M2）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 章参数（纯函数）：dchOf 只耗生成器第 1 掷（与 genLevel 首掷同流同位）；
   familyIdx=同 dch 族内关序（deck 段位用）——对 [0,flat) 逐关复算 dchOf，O(flat) 纯函数 */
function dchOf(flat) {
  if (flat < STATIC_LEVELS) return diffOfCh(chOfFlat(flat));
  return ri(mulberry32(flat * 7919 + 71), 1, 4);
}
function familyIdx(flat, dch) {
  let n = 0;
  for (let p = 0; p < flat; p++) if (dchOf(p) === dch) n++;
  return n;
}
/* 章族牌库（r32 deckOf 范式）：族独立种子流（不耗题内 rnd），域按章：dch1/2=ALL24、
   dch3/4=NEAR20（ch3+ 真值域=有族词） */
const DOM_OF = dch => (dch >= 3 ? NEAR20 : WORDS24);
const deckOf = dch => shuffled(DOM_OF(dch), mulberry32(dch * 104729 + 41));

/* ---------- 每关题序表 {kind, verb?, ask}（genLevel 预生成；rnd 同流保确定性）
   dch4 do 槽动词=VERBS[(2×idx+槽序) % 5]（qi1 槽序 0/qi3 槽序 1）——族内 do 计数
   结构性均匀（10 关 20 do → 每动词恰 4 次，verify/pycheck 精确断言）；
   touch 部位=deck 词（NEAR20 域），动作动词 ask=verb 本身；
   混出=非 do 题全同翻 1（dch3/dch4 每关 hear+see 都在场）；
   相邻题互异（kind:verb:ask 重掷 ≤8 兜底——deck 段内互异，结构上永不触发） */
function specSeqOf(dch, rnd, flat) {
  const dom = DOM_OF(dch), deck = deckOf(dch), len = deck.length;
  const idx = familyIdx(flat, dch);
  const keyOfSpec = s => s.kind === 'do' ? 'do:' + s.verb + ':' + s.ask : s.kind + ':' + s.ask;
  const coin = () => rnd() < 0.5 ? 'hear' : 'see';
  const pick = pool => pool[Math.floor(rnd() * pool.length)];
  const kindOf = () => dch === 1 ? 'hear' : dch === 2 ? 'see' : coin();
  let specs = [];
  for (let qi = 0; qi < CH_LEN; qi++) {
    if (dch === 4 && (qi === 1 || qi === 3)) {
      const verb = VERBS[(2 * idx + (qi === 1 ? 0 : 1)) % VERBS.length];
      specs.push({ kind: 'do', verb: verb, ask: verb === 'touch' ? deck[(idx * 5 + qi) % len] : verb });
    } else {
      specs.push({ kind: kindOf(), ask: deck[(idx * 5 + qi) % len] });
    }
  }
  if (dch >= 3) {                                   // 混出：非 do 题全同翻 1（每关两种题型在场）
    const hs = specs.filter(s => s.kind !== 'do');
    const nH = hs.filter(s => s.kind === 'hear').length;
    if (hs.length > 0 && (nH === 0 || nH === hs.length)) {
      for (let i = 0; i < specs.length; i++) {
        if (specs[i].kind !== 'do') { specs[i].kind = nH === 0 ? 'hear' : 'see'; break; }
      }
    }
  }
  if (flat === 0) specs[0] = { kind: 'hear', ask: 'eye' };   // 教学演示锚点：听 eye 点 eye 图卡
  let prev = null;                                  // 相邻题互异（kind:verb:ask）
  for (let qi = 0; qi < CH_LEN; qi++) {
    let s = specs[qi], pk = prev && keyOfSpec(prev);
    for (let g = 0; g < 8 && keyOfSpec(s) === pk; g++) {
      s = s.kind === 'do'
        ? { kind: 'do', verb: s.verb, ask: s.verb === 'touch' ? pick(dom, rnd) : s.verb }
        : { kind: kindOf(), ask: pick(dom, rnd) };
      specs[qi] = s;
    }
    prev = specs[qi];
  }
  return specs;
}

/* ---------- 单题构建：候选恒 4 = 真值 +（ch2+ 真值∈NEAR20 首族干扰必在场）+ 随机补齐
   → 洗牌 + answer 下标（答案位均匀——r39-bis 分布断言口径）
   hear 题 opts=图卡 {id:'p:<en>', part}（小兔高亮该部位迷你图）；
   see 题 opts=词卡 {id:'w:<en>', text}（英语单词文字）；
   do-touch 题 opts=动作卡 {id:'t:<en>', part}（小兔高亮+爪标摸部位）；
   do-action 题 opts=动作卡 {id:'a:<verb>', verb}（四动作图标卡=拍拍手/摇摇头/跺跺脚/挥挥手） */
function buildQuiz(spec, dch, rnd) {
  const order = [], opts = [];
  let answer = -1;
  if (spec.kind === 'do') {
    if (spec.verb === 'touch') {
      const picks = [spec.ask];
      if (NEAR[spec.ask].length) picks.push(NEAR[spec.ask][0]);   // 部位∈NEAR20（deck 域）⇒ 族干扰必在场
      const others = shuffled(WORDS24.filter(w => picks.indexOf(w) < 0), rnd);
      for (const w of others) { if (picks.length >= 4) break; picks.push(w); }
      order.push.apply(order, shuffled(picks, rnd));
      for (let j = 0; j < order.length; j++) if (order[j] === spec.ask) answer = j;
      for (const w of order) opts.push({ id: 't:' + w, part: w });
    } else {
      order.push.apply(order, shuffled(['clap', 'shake', 'stomp', 'wave'], rnd));
      for (let j = 0; j < order.length; j++) if (order[j] === spec.verb) answer = j;
      for (const v of order) opts.push({ id: 'a:' + v, verb: v });
    }
  } else {
    const picks = [spec.ask];
    if (dch >= 2 && NEAR[spec.ask].length) picks.push(NEAR[spec.ask][0]);   // ch2 起近形近音干扰律
    const others = shuffled(WORDS24.filter(w => picks.indexOf(w) < 0), rnd);
    for (const w of others) { if (picks.length >= 4) break; picks.push(w); }
    order.push.apply(order, shuffled(picks, rnd));
    for (let j = 0; j < order.length; j++) if (order[j] === spec.ask) answer = j;
    for (const w of order) opts.push(spec.kind === 'hear'
      ? { id: 'p:' + w, part: w }
      : { id: 'w:' + w, text: w });
  }
  return { kind: spec.kind, ask: spec.ask, verb: spec.verb, opts: opts, answer: answer,
           _miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关随机章参数）
   flat0 题0 恒 hear/eye（§1 教学演示锚点） */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 71);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const specs = specSeqOf(dch, rnd, flat);
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(specs[qi], dch, rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点卡引擎（无 DOM）：engTapOpt(L, i) —— 点第 i 张候选卡（opts 数组下标）
   'right' 答对且本题完成推进 / 'done' 答对且末题=通关
   'wrong' 点错：该题 miss+1（retries 全关累计=星级口径），卡不灰可重选（探索不罚）
   null    非法下标或关卡已结束（do 题同单步判定——r25 M2） ---------- */
function engTapOpt(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.opts.length) return null;
  if (i === q.answer) {
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（§0.70 口径）：全关错选 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：当前题正确卡下标（=q.answer，独立函数供 verify 复核） */
const correctIdx = q => !q ? -1 : q.answer;

/* ---------- 结构校验（verify 用，返回失败原因或 null）：封闭表 / 章型规则 / do 结构 /
   近形在场 / 候选互异含真值 / answer 自洽 / 相邻题互异 / flat0q0 锚点 / 初始态干净 */
function structWhy(q, dch, flat, qi, prevQ) {
  if (!q) return 'quiz';
  if (q.kind !== 'hear' && q.kind !== 'see' && q.kind !== 'do') return 'kind';
  const keyOfQ = k => k.kind === 'do' ? 'do:' + k.verb + ':' + k.ask : k.kind + ':' + k.ask;
  const isAnchor = flat === 0 && qi === 0;         // 教学演示题（听 eye 点 eye）锚点
  if (isAnchor && (q.kind !== 'hear' || q.ask !== 'eye')) return 'anchor';
  if (dch === 1 && q.kind !== 'hear') return 'dch1kind';     // ch1 恒 hear
  if (dch === 2 && q.kind !== 'see') return 'dch2kind';      // ch2 恒 see
  if (dch === 4 && ((qi === 1 || qi === 3) !== (q.kind === 'do'))) return 'dch4slot';  // qi1/qi3 恒 do
  if (q.opts.length !== 4) return 'len';
  if (q.kind === 'do') {
    if (VERBS.indexOf(q.verb) < 0) return 'verb';
    if (q.verb === 'touch') {                       // 触摸题：4 部位动作卡互异含真值+族干扰
      if (WORDS24.indexOf(q.ask) < 0) return 'ask';
      if (dch >= 4 && NEAR20.indexOf(q.ask) < 0) return 'doAsk20';   // dch4 deck 域=NEAR20
      const vals = q.opts.map(o => o.part);
      for (const v of vals) if (WORDS24.indexOf(v) < 0) return 'optWord';
      if (new Set(vals).size !== 4) return 'optDup';
      if (vals[q.answer] !== q.ask) return 'ansIdx';
      if (dch >= 2 && NEAR[q.ask].length && !NEAR[q.ask].some(n => vals.indexOf(n) >= 0)) return 'nearMiss';
    } else {                                        // 动作题：ask=verb、四动作卡恰全集
      if (q.ask !== q.verb) return 'actAsk';
      const vs = q.opts.map(o => o.verb);
      if (vs.indexOf('touch') >= 0 || new Set(vs).size !== 4) return 'optAct';
      if (q.opts[q.answer].verb !== q.ask) return 'ansIdx';
    }
  } else {
    if (WORDS24.indexOf(q.ask) < 0) return 'ask';
    const vals = q.opts.map(o => q.kind === 'hear' ? o.part : o.text);
    for (const v of vals) if (WORDS24.indexOf(v) < 0) return 'optWord';   // 候选恒 ∈ 封闭 24
    if (new Set(vals).size !== 4) return 'optDup';            // 4 卡互异
    if (q.answer < 0 || q.answer > 3) return 'ansRange';
    if (vals[q.answer] !== q.ask) return 'ansIdx';             // answer=真值卡下标
    if (dch >= 2 && NEAR[q.ask].length && !NEAR[q.ask].some(n => vals.indexOf(n) >= 0))
      return 'nearMiss';                                       // ch2+ 真值∈族 ⇒ 族干扰在场
    if (dch >= 3 && NEAR20.indexOf(q.ask) < 0) return 'dch3ask'; // ch3+ 真值∈NEAR20
  }
  if (prevQ && keyOfQ(prevQ) === keyOfQ(q)) return 'adjacent';
  if (q._miss !== 0 || q._answered) return 'init';
  return null;
}
/* ================= bodyen 主逻辑（题面渲染 / 四卡点选 / 教学 / 救援 / 推进）

   see 题=小兔大图高亮目标部位+题面句 bod_q2 → 4 英语单词文字卡；

let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();                       /* 30s 答案级 idle 锚（方向级不得重置它） */
let lastDir = Date.now();                       /* 14s 方向级独立节流锚（家族 B：与 lastAct 分离） */
let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）
let helpRedemo = false;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const cardEl = i => boardEl.querySelector('.card[data-i="' + i + '"]');

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 70);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：答对=双音上行 / 答错=低柔单音 */
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };

/* ================= 题面语音（恒题面句 clip；hear 题英语词音紧随其后拼播——家族 G 链
   2952+150+1656=4758；see 题只读题面句：目标已高亮可见，不播词音防泄底；
   do 题（r41）=题面句 bod_q3+英语指令音拼播：touch 族三段 [q3, v_touch, 词音]（开题链
   无窗——读题不锁可即答即切，est 口径 SPEC-R41 §R9）；动作族两段 [q3, v_<verb>]） ================= */
function speakQuiz() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  if (q.kind === 'hear') KIDS.voice.queue([VOICE.q1.key, wordClip(q.ask)]);
  else if (q.kind === 'do') {
    if (q.verb === 'touch') KIDS.voice.queue([VOICE.q3.key, verbClip('touch'), wordClip(q.ask)]);
    else KIDS.voice.queue([VOICE.q3.key, verbClip(q.ask)]);
  }
  else KIDS.voice.play(VOICE.q2.key, VOICE.q2.text);
}
/* 重听路径（hear 题同句=错反馈语义句「再听一遍这个单词」，SPEC §1「重听按钮同句」：
   词音前置+语义句尾段 bod_again_hear（T46 阶段2 clip 化，text=TTS 兜底），
   与 poem 重听 [行音, 读题句] 同构；see 题=重读题面句+部位图再 pulse 高亮；
   do 题（r41）=指令音前置+语义句尾段 bod_again_do——touch 族 [v_touch, 词音, again_do]
   三段/动作族 [v_<verb>, again_do] 两段，与 hear 重听同构） */
function replayQuiz(withPulse) {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  if (q.kind === 'hear') KIDS.voice.queue([wordClip(q.ask), { key: 'bod_again_hear', text: HEAR_AGAIN }]);
  else if (q.kind === 'do') {
    KIDS.voice.queue(q.verb === 'touch'
      ? [verbClip('touch'), wordClip(q.ask), { key: 'bod_again_do', text: DO_AGAIN }]
      : [verbClip(q.ask), { key: 'bod_again_do', text: DO_AGAIN }]);
    if (withPulse) replayAnim(sceneEl, 'pulse');   /* do 题方向级：题面区整体呼吸（同 hear） */
  }
  else {
    KIDS.voice.play(VOICE.q2.key, VOICE.q2.text);
    if (withPulse) pulseAsk();
  }
}
/* 方向级回锚：目标部位图再 pulse 高亮（see 题专用——错反馈/重听/救援共用） */
function pulseAsk() {
  const q = cur && cur.quizzes[cur.step];
  if (!q || q.kind !== 'see') return;
  const el = sceneEl.querySelector('.pt.hl');
  if (el) replayAnim(el, 'pt-pulse');
}

/* ================= 渲染 ================= */
const Q_TEXT = { hear: VOICE.q1.text, see: VOICE.q2.text, do: VOICE.q3.text };
function renderScene(q) {                        // 题面：小兔身体大图（see 高亮目标/hear·do 中性）+题面句
  sceneEl.dataset.kind = q.kind;
  sceneEl.dataset.ask = q.kind === 'see' ? q.ask : '';   // 帧内容锚（契约 M：verify 断言；do 题防泄不标）
  sceneEl.setAttribute('aria-label', q.kind === 'see'
    ? PART_ZH[q.ask] + '高亮，点我再听一遍'
    : '听一听，点我再听一遍');
  sceneEl.innerHTML = '<div class="scene-slot">' + bodySvg(q.kind === 'see' ? q.ask : null) + '</div>' +
    '<div class="q-text">' + Q_TEXT[q.kind] + '？</div>' +
    (q.kind !== 'see' ? '<div class="snd-chip" aria-hidden="true">' + ICONS.hear + '<span>' + (q.kind === 'do' ? '做' : '听') + '</span></div>' : '');
}
/* see 词卡字号档（r41 长词 shoulder 8/eyebrow 7 字母——卡宽 140/竖屏 130 内闭合） */
const wSizeCls = w => w.length >= 8 ? 'xs' : w.length === 7 ? 'sm' : w.length === 6 ? 'md' : '';
function renderBoard(q) {                        // 卡排：hear=4 部位图卡 / see=4 英语词文字卡 / do=4 动作卡
  boardEl.innerHTML = '';
  boardEl.dataset.kind = q.kind;
  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'card pop ' + (q.kind === 'hear' ? 'pcard' : q.kind === 'do' ? (o.part ? 'pcard dcard' : 'acard') : 'wcard');
    b.dataset.i = i;
    b.dataset.oid = o.id;                        // verify 对账（渲染即引擎：p:/w:/t:/a:）
    if (q.kind === 'hear') {
      b.setAttribute('aria-label', PART_ZH[o.part] + '图片卡');
      b.innerHTML = bodySvg(o.part);             // 迷你小兔高亮该部位（不出现文字——纯听辨）
    } else if (q.kind === 'do') {
      if (o.part) {                              // do-touch 卡：迷你小兔高亮+爪标摸该部位
        b.setAttribute('aria-label', '摸' + PART_ZH[o.part] + '图片卡');
        b.innerHTML = bodySvg(o.part, 'touch');
      } else {                                   // do-action 卡：动作图标+中文短语（听英语→懂意思→选动作）
        b.setAttribute('aria-label', ACT_ZH[o.verb] + '动作卡');
        b.innerHTML = ACT_SVG[o.verb] + '<span class="a-label">' + ACT_ZH[o.verb] + '</span>';
      }
    } else {
      b.setAttribute('aria-label', '单词 ' + o.text);
      const cls = wSizeCls(o.text);
      b.innerHTML = '<span class="w-label' + (cls ? ' ' + cls : '') + '">' + o.text + '</span>';   // 小写词形认读（§0.19）
    }
    b.style.animationDelay = (i * 70) + 'ms';
    boardEl.appendChild(b);
  });
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderScene(q);
  renderBoard(q);
  renderStep();
  if (!VERIFY && !state.demo && !state.quiet) speakQuiz();   // 开题读题（教学演示期静默）
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 答对演出：场景放大跳 + 小兔子滑入示范（确认句拼播由 uiTapOpt 播）
   verify 页跳飞行直接落定 ---------- */
function celebrateScene(run) {
  const slot = sceneEl.querySelector('.scene-slot');
  if (slot) replayAnim(slot, 'jump');
  if (!sceneEl.querySelector('.demo-pet')) {
    const pet = document.createElement('div');
    pet.className = 'demo-pet';
    pet.innerHTML = KIDS.assets.rabbit('happy', 54);   /* 小兔子开心示范 */
    sceneEl.appendChild(pet);
  }
  hopRabbit();
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向：当前题正确卡 */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const i = correctIdx(q);
  if (i >= 0) pointGhostAt(cardEl(i));
}

/* ================= 点卡主路径（真实点击 / BE.tapOpt / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（卡排容器 bump 微动效——家族 D）；
   错防重入窗/判对演出窗共用 locked 门；错点 1000ms 防重入窗（b16 定案）========== */
async function uiTapOpt(i, demo) {
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const run = cur;                               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapOpt(cur, i);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }   // 越界/已答=null+pop+bump
  const el = cardEl(i);

  if (r === 'wrong') {                           /* 答错：摇头+bod_wrong+语义句（hear=再听词/see=再看部位/do=再听指令） */
    state.locked = true;
    if (el) replayAnim(el, 'wig');
    dodgeLo();
    const parts = q.kind === 'hear'
      ? [VOICE.wrong.key, wordClip(q.ask), { key: 'bod_again_hear', text: HEAR_AGAIN }]   /* 听力回锚：词音重播+语义句 clip（T46 阶段2；text=TTS 兜底） */
      : q.kind === 'do'
      ? [VOICE.wrong.key, { key: 'bod_again_do', text: DO_AGAIN }]                        /* 指令回锚：语义句 clip（不自动重播指令——错链 1656+150+3360est+300 ≤7200 闭合；重播走再听/救援） */
      : [VOICE.wrong.key, { key: 'bod_again_see', text: SEE_AGAIN }];                     /* 视觉回锚：语义句 clip+部位 pulse */
    if (sayW(parts))
      wrongChainUntil = Date.now() + 7200;      /* 链豁免：1656+150+1656+150+2352+300=6264（clip 实长，契约 I；m-2 勘误原 6144） */
    if (q.kind === 'see') pulseAsk();           /* see 题方向级：目标部位图再 pulse 高亮 */
    else if (q.kind === 'do') replayAnim(sceneEl, 'pulse');   /* do 题方向级：题面区整体呼吸（同 hear） */
    await wait(1000 * SPEED);                    /* 错点防重入窗 1000ms；对选可打断链；救援由 wrongChainUntil 让路 */
    if (cur !== run) return r;
    state.locked = false;
    return r;
  }

  /* ---- right·done（本题完成：场景放大跳+兔子示范+确认句拼播） ---- */
  lastAct = Date.now();                          /* 正确选择重置救援钟（§0.7a） */
  if (state.tut === 'help') {                    /* 教学"独"：首次选对 → 放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  if (el) { el.classList.remove('breathe'); el.classList.add('lit'); }
  chimeGoal();
  sfx('coin');
  if (cur === run) celebrateScene(run);          /* 场景放大跳 + 小兔子滑入示范 */
  /* 确认句拼播：hear/see/do-touch=点对啦真棒+词音尾段（≤2256+150+1656+300=4362 ≤4500 窗）；
     do-action=点对啦真棒+动词短语（r41 修复轮 §R10 挂账转增强 2026-09-22：v_* 实测
     max=bod_v_stomp 1608——2256+150+1608+300=4314≤4500 窗收；原单段右段=过渡态 est ~2500
     超窗缓挂，注册后实长落定） */
  if (q.kind === 'do' && q.verb !== 'touch') KIDS.voice.queue([VOICE.right.key, verbClip(q.ask)]);
  else KIDS.voice.queue([VOICE.right.key, wordClip(q.ask)]);
  await wait(1600 * SPEED);                      /* 场景跳+卡亮+确认链主窗 */
  if (cur !== run) return r;
  await wait(2900 * SPEED);                      /* 确认链收尾窗：总 4500 ≥ 2256+150+1656+300=4362（家族 G/H；m-2 勘误原 4242） */
  if (cur !== run) return r;
  state.locked = false;
  if (r === 'done') { winFlow(); return 'done'; }
  renderQuiz();                                  /* 新题（题面/卡全换）+读题 */
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关随机章型 GEN[dch-1]（家族 F：
     genLevel 纯函数确定性，同 flat 恒同 dch——预告与实际章型恒一致，禁 (ci+1)%4） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  sayR(VOICE.right.key, VOICE.right.text);       /* bod_right：点对啦，真棒（2256ms） */
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(async () => {
    await wait(400);                             /* 家族 H：celebrate 2620+400=3020 ≥ 2256+300=2556 */
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });   /* 家族 A：winFlow 传 nextHint(null)（b25 形态定版） */
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  lastWrongVoice = 0; wrongChainUntil = 0;      /* 换关重置错反馈节流锚与链豁免（契约 I/J 配套） */
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();                          /* 主动读题路径重置 idle 锚（b25 M4） */
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] &&
                   !(sv.bodyen && sv.bodyen.tutSeen);   /* 契约 E：先查教学特例再定行为 */
  if (VERIFY) return;                            // verify 页：教学链由 runVerify 单元直调
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  speakQuiz();
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=播 bod_tut_watch「看！听英语点身体」→ 播 eye 词音（听英语）→ 幽灵手指点 eye 图卡
   →点中（确认句拼播）→帮=指向正确卡；独=首次选对放手（watch 全程 ≤16s，分账 10188）
   时序（家族 G/H）：watch clip 3168ms → 词音演示延至 t=3468（≥3168+300，禁与词音撞头）；
   词音 eye 1296 + ghost 移入窗 1600 ≥ 1296+300；演示演出窗 4500 罩确认链 2256+150+1296+300 ---------- */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);       /* bod_tut_watch：看！听英语点身体（3168ms） */
  const run = cur;
  await wait(3468 * SPEED);                      /* t=3468 ≥ 3168+300：clip 播完再演（不撞头） */
  if (cur !== run) return;
  const q = cur.quizzes[0];                      // flat0 题0 恒 hear/eye（教学演示锚）
  KIDS.voice.play(wordClip(q.ask), q.ask);       /* 播 eye 词音：听英语（1296ms） */
  const idx = correctIdx(q);
  pointGhostAt(cardEl(idx));                     /* 幽灵手指指向 eye 图卡 */
  await wait(1600 * SPEED);                      /* ≥1296+300：词音播完+ghost 移入停顿 */
  if (cur !== run) return;
  ghost.press();
  await wait(320 * SPEED);
  const demoR = await uiTapOpt(idx, true);       /* demo 通道豁免 locked 门（演示吞真实输入） */
  window.__beDemoR = demoR;                      /* 演示生效证据（§0.27，gate 断言 'right'） */
  await wait(300 * SPEED);                       /* 收尾（确认链仍在播，由 uiTapOpt 演出窗罩满） */
  const sv = KIDS._save() || {};
  sv.bodyen = sv.bodyen || {};
  sv.bodyen.tutSeen = true;
  if (KIDS._save()) KIDS.store.persist();
  /* 立即重发同关（确定性关卡，题面一致），"你来点一点"在重发后的题面上说（照 batch5-28） */
  ghost.hide();
  cur = genLevel(0);
  state = { locked: false, won: false, demo: false, tut: 'help', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  state.quiet = false;
  sayR(VOICE.turn.key, VOICE.turn.text);         /* bod_tut_turn：你来点一点（1824ms） */
  setTimeout(() => {
    if (state.tut === 'help' && cur && cur.quizzes[cur.step]) speakQuiz();
  }, 2150);                                      /* ≥1824+300=2124 防尾截（turn 后读题延） */
  setTimeout(() => { if (state.tut === 'help') pointHelpNext(); }, 600 * SPEED);
}

/* ================= 底栏与舞台交互 ================= */
function hopRabbit() {
  rabbitBtn.classList.remove('hop'); void rabbitBtn.offsetWidth; rabbitBtn.classList.add('hop');
}
rabbitBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur) return;
  hopRabbit();
  if (state.locked || state.demo || state.won) { sfx('pop'); return; }   /* §0.20 三件门+轻反馈 */
  lastAct = Date.now();
  sayR(VOICE.hint.key, VOICE.hint.text);         /* 戳兔子=方向提示：再听一遍想一想 */
});
replayBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur || state.locked || state.demo || state.won) return;   /* §0.20 教学/演出/通关期重玩门 */
  lastAct = Date.now();
  startLevel(cur.flat);
});
hearBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur || state.locked) return;
  lastAct = Date.now();                          /* 主动重听重置 idle 锚（b25 M4） */
  replayAnim(hearBtn, 'bounce');
  replayQuiz(false);                             /* 再听一遍：hear=语义句+词音 / see=重读题面句 */
});
sceneEl.addEventListener('pointerdown', e => {   /* 点题面=重听题面（儿童高发探索动作） */

          if (SPEC_NEAR20.indexOf(q.ask) < 0 || !nearPresent(q.ask, vals)) { badCase = 'tNear ' + flat + '/' + k; specOk = false; break; }
        } else {

  /* ---- ③ 聚合独占票：覆盖结构性/混出/do 计数与动词直方图/答案位直方图/生成四型 ---- */

  /* ---- ⑩ 布局：双 viewport ×（flat0 hear/flat5 see/flat12 ch3/flat15 do-touch 板/

  function lum(hexStr) {
