<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>比较大小</title>
<style>
/* ================= 比较大小 compare（batch6）=================
   视觉按 DESIGN-SPEC §8 / SPEC-BATCH6 §0：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E
   触摸目标：物品热区 ≥64（grid 定位不重叠）、符号主按钮 ≥96×100、底栏按钮 ≥72 高；间距 ≥16；
   pointerdown 即响应；左右两组恒并排（比较型玩法，横竖屏不堆叠） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 比较区：左组 | 中槽 | 右组（恒并排） ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:4px 10px 0;gap:8px}
#duel{flex:1 1 auto;min-height:170px;width:100%;max-width:1240px;margin:0 auto;
  display:flex;align-items:stretch;gap:10px}
.group{flex:1 1 0;min-width:0;position:relative;background:linear-gradient(180deg,#FFFDF6 0%,#FBF3E1 100%);
  border:3px solid #D8C9B4;border-radius:24px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;transition:border-color .25s}
/* 答对：两组被圈（绿描边圆盘感 + 弹一下） */
.group.circled{border-color:#6FA063;box-shadow:inset 0 0 0 3px rgba(143,191,127,.4)}
.group.circled.pop{animation:g-pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes g-pop{0%{transform:scale(1)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
/* r29 三卡题（tri 三数比大小 / near 最接近 N，SPEC-R29 §R5）：三组数字卡并排 */
.group.tri{cursor:pointer}
.group.tri.wrong{border-color:#C9BDA8;opacity:.55;pointer-events:none;animation:tri-shake .42s ease}
@keyframes tri-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.group.tri.dimmed{opacity:.45;transition:opacity .3s}
.group.tri .numcard{cursor:pointer}
.numcard.pulse{animation:opt-pulse 1s ease 2}
#symbols.off{opacity:.4;pointer-events:none;filter:grayscale(.55)}
#prompt-chip .tgt{display:inline-block;min-width:1.35em;padding:1px 8px;margin:0 3px;border-radius:14px;
  background:#E8975A;color:#FFF9EE;font-size:36px;line-height:1.2;text-align:center;vertical-align:-3px}
.g-items{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:7px;
  width:100%;height:100%;padding:16px}
/* 点数物品：按钮 + 头顶序号角标（照 countchick 点数辅助） */
.item{position:relative;padding:0;border:none;background:none;border-radius:14px;
  transition:background .2s}
.item svg{width:100%;height:100%;pointer-events:none}
.item.lit{background:rgba(143,191,127,.26)}
.item.hop{animation:i-hop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes i-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-13%)}}
.item .badge{position:absolute;top:-10px;right:-6px;min-width:32px;height:32px;padding:0 5px;
  border-radius:16px;background:#FFF9EE;border:3px solid #E8975A;color:#4A3B2E;
  font-size:19px;font-weight:800;display:none;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;box-shadow:0 2px 0 #D8C9B4;pointer-events:none;z-index:3}
.item .badge.on{display:flex;animation:badge-pop .4s cubic-bezier(.2,1.6,.4,1)}
.numcard{position:relative}   /* 6 岁试玩 P1-2：数字卡点数角标（复用 .item .badge 视觉，加大一档适配大卡） */
.numcard .badge{position:absolute;top:-12px;right:-8px;min-width:38px;height:38px;padding:0 6px;
  border-radius:19px;background:#FFF9EE;border:3px solid #E8975A;color:#4A3B2E;
  font-size:22px;font-weight:800;display:none;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;box-shadow:0 2px 0 #D8C9B4;pointer-events:none;z-index:3}
.numcard .badge.on{display:flex;animation:badge-pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes badge-pop{from{transform:scale(0) rotate(-18deg)}to{transform:scale(1) rotate(0)}}
/* 数字卡侧（章 3+ 抽象化）：大数字白卡，点它读数 */
.numcard{min-width:150px;min-height:120px;width:min(88%,230px);aspect-ratio:5/4;background:#FFFDF7;
  border:3px solid #4A3B2E;border-radius:26px;box-shadow:0 5px 0 #D8C9B4;
  display:flex;align-items:center;justify-content:center;font-size:clamp(58px,9vw,104px);
  font-weight:800;color:#4A3B2E;font-variant-numeric:tabular-nums;transition:transform .15s}
.numcard:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.numcard.bounce{animation:nc-b .4s ease}
@keyframes nc-b{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- 中间符号槽：? → 正确符号飞入 ---------- */
#center-col{flex:0 0 clamp(86px,13vw,136px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;min-width:0}
#slot{width:min(100%,124px);aspect-ratio:1/1;background:#FBF3E4;border:3.5px dashed #C9BDA8;
  border-radius:24px;display:flex;align-items:center;justify-content:center;
  font-size:52px;font-weight:800;color:#C9BDA8}
#slot.wig{animation:slot-wig .5s ease}
@keyframes slot-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}55%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}}
#slot.filled{border-style:solid;border-color:#6FA063;background:#EDF5E3;animation:slot-pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slot-pop{from{transform:scale(.4) rotate(-14deg)}to{transform:scale(1) rotate(0)}}
#slot svg{width:72%;height:72%}
#slot-sem{font-size:15px;font-weight:800;color:#8A7B6C;text-align:center;line-height:1.3}
#flyer{position:fixed;z-index:90;pointer-events:none;opacity:0;display:flex;align-items:center;justify-content:center}
#flyer svg{width:100%;height:100%}

/* ---------- 题面行：问句 chip + 重新数按钮 ---------- */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  min-height:78px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:14px;padding:6px 26px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4}
#prompt-chip .big{font-size:33px;font-weight:800;color:#4A3B2E;line-height:1.2}
#prompt-chip svg{width:46px;height:46px}
#btn-recount{display:flex;align-items:center;gap:9px;min-height:72px;padding:0 24px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;
  font-size:22px;font-weight:800;color:#4A3B2E;transition:transform .15s}
#btn-recount:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-recount svg{width:40px;height:40px}
#btn-recount.bounce{animation:recount-b .4s ease}
@keyframes recount-b{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* ---------- 三个大符号按钮（主触摸目标 ≥96×100，卡通大嘴 + 语义小标） ---------- */
#symbols{flex:0 0 auto;display:flex;justify-content:center;gap:20px;flex-wrap:wrap;
  padding:2px 12px;min-height:104px}
.sym{min-width:120px;min-height:100px;padding:4px 18px 6px;border-radius:24px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .15s,box-shadow .15s;position:relative}
.sym:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.sym svg{width:60px;height:46px}
.sym .lbl{font-size:16px;font-weight:800;color:#8A7B6C;letter-spacing:.04em}
.sym.right{background:#8FBF7F;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.sym.right .lbl{color:#4A3B2E}
.sym.right .mark{position:absolute;top:-13px;right:-13px;width:40px;height:40px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.sym.right .mark svg{width:26px;height:26px}
@keyframes opt-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.sym.wrong{background:#EFE3CD;border-color:#C9BDA8;box-shadow:0 3px 0 #C9BDA8;
  opacity:.55;pointer-events:none}
.sym.wrong{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.sym.pulse{animation:opt-pulse 1s ease 2}
@keyframes opt-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 countchick） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：符号按钮放大、题面缩字；左右组仍并排（比较型布局不动） */
@media (orientation:portrait){
  .sym{min-width:148px;min-height:112px}
  .sym svg{width:66px;height:52px}
  #prompt-chip .big{font-size:29px}
  #slot{width:min(100%,110px);font-size:44px}
  #slot-sem{font-size:13px}
}
</style>
</head>
<body>
<div id="game" aria-label="比较大小">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="duel">
      <div class="group" id="g-left" aria-label="左边一组"></div>
      <div id="center-col">
        <div id="slot" aria-label="符号槽">?</div>
        <div id="slot-sem"></div>
      </div>
      <div class="group" id="g-right" aria-label="右边一组"></div>
    </div>
    <div id="prompt">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
      <button id="btn-recount" aria-label="重新数"></button>
    </div>
    <div id="symbols" aria-label="比较符号"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<div id="flyer" aria-hidden="true"></div>
<pre id="verify-result"></pre>
