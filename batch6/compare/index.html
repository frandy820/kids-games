<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>比较大小</title>
<style>
/* ================= 比较大小 compare（batch6）=================
   视觉按 DESIGN-SPEC §8 / SPEC-BATCH6 §0：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E
   触摸目标：物品热区 ≥64（grid 定位不重叠）、符号主按钮 ≥96×100、底栏按钮 ≥72 高；间距 ≥16；
   pointerdown 即响应；左右两组恒并排（比较型玩法，横竖屏不堆叠） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 比较区：左组 | 中槽 | 右组（恒并排） ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:4px 10px 0;gap:8px}
#duel{flex:1 1 auto;min-height:170px;width:100%;max-width:1240px;margin:0 auto;
  display:flex;align-items:stretch;gap:10px}
.group{flex:1 1 0;min-width:0;position:relative;background:linear-gradient(180deg,#FFFDF6 0%,#FBF3E1 100%);
  border:3px solid #D8C9B4;border-radius:24px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;transition:border-color .25s}
/* 答对：两组被圈（绿描边圆盘感 + 弹一下） */
.group.circled{border-color:#6FA063;box-shadow:inset 0 0 0 3px rgba(143,191,127,.4)}
.group.circled.pop{animation:g-pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes g-pop{0%{transform:scale(1)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
/* r29 三卡题（tri 三数比大小 / near 最接近 N，SPEC-R29 §R5）：三组数字卡并排 */
.group.tri{cursor:pointer}
.group.tri.wrong{border-color:#C9BDA8;opacity:.55;pointer-events:none;animation:tri-shake .42s ease}
@keyframes tri-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.group.tri.dimmed{opacity:.45;transition:opacity .3s}
.group.tri .numcard{cursor:pointer}
.numcard.pulse{animation:opt-pulse 1s ease 2}
#symbols.off{opacity:.4;pointer-events:none;filter:grayscale(.55)}
#prompt-chip .tgt{display:inline-block;min-width:1.35em;padding:1px 8px;margin:0 3px;border-radius:14px;
  background:#E8975A;color:#FFF9EE;font-size:36px;line-height:1.2;text-align:center;vertical-align:-3px}
.g-items{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:7px;
  width:100%;height:100%;padding:16px}
/* 点数物品：按钮 + 头顶序号角标（照 countchick 点数辅助） */
.item{position:relative;padding:0;border:none;background:none;border-radius:14px;
  transition:background .2s}
.item svg{width:100%;height:100%;pointer-events:none}
.item.lit{background:rgba(143,191,127,.26)}
.item.hop{animation:i-hop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes i-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-13%)}}
.item .badge{position:absolute;top:-10px;right:-6px;min-width:32px;height:32px;padding:0 5px;
  border-radius:16px;background:#FFF9EE;border:3px solid #E8975A;color:#4A3B2E;
  font-size:19px;font-weight:800;display:none;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;box-shadow:0 2px 0 #D8C9B4;pointer-events:none;z-index:3}
.item .badge.on{display:flex;animation:badge-pop .4s cubic-bezier(.2,1.6,.4,1)}
.numcard{position:relative}   /* 6 岁试玩 P1-2：数字卡点数角标（复用 .item .badge 视觉，加大一档适配大卡） */
.numcard .badge{position:absolute;top:-12px;right:-8px;min-width:38px;height:38px;padding:0 6px;
  border-radius:19px;background:#FFF9EE;border:3px solid #E8975A;color:#4A3B2E;
  font-size:22px;font-weight:800;display:none;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;box-shadow:0 2px 0 #D8C9B4;pointer-events:none;z-index:3}
.numcard .badge.on{display:flex;animation:badge-pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes badge-pop{from{transform:scale(0) rotate(-18deg)}to{transform:scale(1) rotate(0)}}
/* 数字卡侧（章 3+ 抽象化）：大数字白卡，点它读数 */
.numcard{min-width:150px;min-height:120px;width:min(88%,230px);aspect-ratio:5/4;background:#FFFDF7;
  border:3px solid #4A3B2E;border-radius:26px;box-shadow:0 5px 0 #D8C9B4;
  display:flex;align-items:center;justify-content:center;font-size:clamp(58px,9vw,104px);
  font-weight:800;color:#4A3B2E;font-variant-numeric:tabular-nums;transition:transform .15s}
.numcard:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.numcard.bounce{animation:nc-b .4s ease}
@keyframes nc-b{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- 中间符号槽：? → 正确符号飞入 ---------- */
#center-col{flex:0 0 clamp(86px,13vw,136px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;min-width:0}
#slot{width:min(100%,124px);aspect-ratio:1/1;background:#FBF3E4;border:3.5px dashed #C9BDA8;
  border-radius:24px;display:flex;align-items:center;justify-content:center;
  font-size:52px;font-weight:800;color:#C9BDA8}
#slot.wig{animation:slot-wig .5s ease}
@keyframes slot-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}55%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}}
#slot.filled{border-style:solid;border-color:#6FA063;background:#EDF5E3;animation:slot-pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slot-pop{from{transform:scale(.4) rotate(-14deg)}to{transform:scale(1) rotate(0)}}
#slot svg{width:72%;height:72%}
#slot-sem{font-size:15px;font-weight:800;color:#8A7B6C;text-align:center;line-height:1.3}
#flyer{position:fixed;z-index:90;pointer-events:none;opacity:0;display:flex;align-items:center;justify-content:center}
#flyer svg{width:100%;height:100%}

/* ---------- 题面行：问句 chip + 重新数按钮 ---------- */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  min-height:78px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:14px;padding:6px 26px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4}
#prompt-chip .big{font-size:33px;font-weight:800;color:#4A3B2E;line-height:1.2}
#prompt-chip svg{width:46px;height:46px}
#btn-recount{display:flex;align-items:center;gap:9px;min-height:72px;padding:0 24px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;
  font-size:22px;font-weight:800;color:#4A3B2E;transition:transform .15s}
#btn-recount:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-recount svg{width:40px;height:40px}
#btn-recount.bounce{animation:recount-b .4s ease}
@keyframes recount-b{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* ---------- 三个大符号按钮（主触摸目标 ≥96×100，卡通大嘴 + 语义小标） ---------- */
#symbols{flex:0 0 auto;display:flex;justify-content:center;gap:20px;flex-wrap:wrap;
  padding:2px 12px;min-height:104px}
.sym{min-width:120px;min-height:100px;padding:4px 18px 6px;border-radius:24px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .15s,box-shadow .15s;position:relative}
.sym:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.sym svg{width:60px;height:46px}
.sym .lbl{font-size:16px;font-weight:800;color:#8A7B6C;letter-spacing:.04em}
.sym.right{background:#8FBF7F;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.sym.right .lbl{color:#4A3B2E}
.sym.right .mark{position:absolute;top:-13px;right:-13px;width:40px;height:40px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.sym.right .mark svg{width:26px;height:26px}
@keyframes opt-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.sym.wrong{background:#EFE3CD;border-color:#C9BDA8;box-shadow:0 3px 0 #C9BDA8;
  opacity:.55;pointer-events:none}
.sym.wrong{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.sym.pulse{animation:opt-pulse 1s ease 2}
@keyframes opt-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 countchick） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：符号按钮放大、题面缩字；左右组仍并排（比较型布局不动） */
@media (orientation:portrait){
  .sym{min-width:148px;min-height:112px}
  .sym svg{width:66px;height:52px}
  #prompt-chip .big{font-size:29px}
  #slot{width:min(100%,110px);font-size:44px}
  #slot-sem{font-size:13px}
}
</style>
</head>
<body>
<div id="game" aria-label="比较大小">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="duel">
      <div class="group" id="g-left" aria-label="左边一组"></div>
      <div id="center-col">
        <div id="slot" aria-label="符号槽">?</div>
        <div id="slot-sem"></div>
      </div>
      <div class="group" id="g-right" aria-label="右边一组"></div>
    </div>
    <div id="prompt">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
      <button id="btn-recount" aria-label="重新数"></button>
    </div>
    <div id="symbols" aria-label="比较符号"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<div id="flyer" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= compare 纯引擎：确定性关卡生成 + 符号判定 + 双侧点数 + 三卡判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）

   dch1 8 以内实物差 1-3 + = 每关恒 1 / dch2 10 以内全数字卡差 1-3 /
   dch3 10 以内数字卡差 1 近邻 + tri 三数比大小每关 2（窄跨度 2-4）/
   dch4 20 以内三模式混合（count 边 ≤12 可点数）+ near 最接近 N 每关 1（近对压迫）

        'tri' 三张数字卡选最大/最小（点卡判定） / 'near' 目标 N + 三候选选最接近（点卡判定）
   分布护栏（verify 断言 40 关精确值，r29 §R3）：
   ① tri 恒 20（dch3 10 关×2）/ near 恒 10（dch4 10 关×1）→ 符号题恒 170
   ② 相等题在符号槽内选：dch1/dch3 恒 1、dch2/dch4 lv 奇 2 偶 1 → 40 关合计恒 48
   ③ 大小题关内跑量平衡器（gt>lt 强制 '<'，反之 '>'，持平随 rnd；tri/near 不参与计数）

const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;

/* ---------- 数值对生成：按 (dch, mode) 出 [small, big]，全部落章区间（非等题差恒 ≥1）
   r29 谱：dch1 8 以内差 1-3（8 超 subitizing 界 4-5，差 1 逼逐个点数）/
   dch2 10 以内差 1-3（全 num）/ dch3 10 以内差 1 近邻（全 num）/
   dch4 的 mix 模式因"大值/小值落在物品侧"两情形约束不同，由 mixPairOf 单独处理 ---------- */
function pairOf(dch, mode, rnd) {

  const diff = ri(rnd, 1, 4);

/* dch4 mix 专用：物品侧 ≤12（可点数），数字卡侧 ≤20；answer/numOnLeft 定方向

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；r29 谱 SPEC-R29 §R3） ---------- */

  let modes = null;

  else if (dch === 3) modes = shuffled(['num', 'num', 'num', 'tri', 'tri'], rnd);

  }

  const eqSet = {};

  const eqCnt = (dch === 1 || dch === 3) ? 1 : ((lv % 2 === 1) ? 2 : 1);
  shuffled(symSlots, rnd).slice(0, Math.min(eqCnt, symSlots.length)).forEach(i => { eqSet[i] = true; });

    if (mode === 'tri') {

    let answer;

    else if (gt > lt) answer = '<';
    else if (lt > gt) answer = '>';

    const numOnLeft = mode === 'mix' ? rnd() < 0.5 : false;

/* ---------- 双侧点数引擎（无 DOM）：engTap(L, side, i) —— 已数过的再点不增号

  if (side === 'L') { q._cL++; q._bL[i] = q._cL; return q._cL; }

  const q = L.quizzes[L.step];

/* ---------- 答题引擎（无 DOM）：s = '>' | '<' | '='

  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if ((q.mode !== 'tri' && q.mode !== 'near') || !q.cards || q.cards.length !== 3) return null;
  if (i !== (i | 0) || i < 0 || i > 2) return null;
  if (i === q.answer) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  if (q.wrong.indexOf(i) >= 0) return 'again';
  q.wrong.push(i);
  L.retries++;
  return 'wrong';
}
/* 星级：一关全对（retries=0）=3 星；总重试 ≤2=2 星；否则 1 星。永不 0 星 */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：answer 与题面独立复算（不复用生成函数——同源陷阱防线）
   符号题：answer 与两侧 n 一致、mode 合法、items 长度=n、count 侧种类合法且左右互异
   tri：cards 3 互异 1-10 / qtype 合法 / answer=极值下标（near 距离从 n 与 target 重算，不信 d 字段） ---------- */
function structOk(q) {
  if (!q) return false;
  if (q.mode === 'tri' || q.mode === 'near') {          // r29 三卡题
    if (!q.cards || q.cards.length !== 3) return false;
    if (q.answer == null || q.answer < 0 || q.answer > 2) return false;
    const ns = q.cards.map(c => c && c.n);
    if (ns.some(n => n == null || n !== Math.floor(n) || n < 1 || n > 20)) return false;
    if (ns[0] === ns[1] || ns[1] === ns[2] || ns[0] === ns[2]) return false;   // 三数互异=唯一解
    if (q.mode === 'tri') {
      if (q.qtype !== 'max' && q.qtype !== 'min') return false;
      if (Math.max.apply(null, ns) > 10) return false;                          // dch3 值域 10 以内
      const want = ns.indexOf(q.qtype === 'max' ? Math.max.apply(null, ns) : Math.min.apply(null, ns));
      return q.answer === want;
    }
    if (q.target == null || q.target < 8 || q.target > 17) return false;
    const ds = ns.map(n => Math.abs(n - q.target));                             // 距离从题面重算
    if (ds[0] === ds[1] || ds[1] === ds[2] || ds[0] === ds[2]) return false;    // 距离互异=唯一解
    let want = 0;
    ds.forEach((d, i) => { if (d < ds[want]) want = i; });
    return q.answer === want;
  }
  if (SYMS.indexOf(q.answer) < 0) return false;
  if (['count', 'num', 'mix'].indexOf(q.mode) < 0) return false;
  if (!q.left || !q.right) return false;
  const want = q.left.n > q.right.n ? '>' : (q.left.n < q.right.n ? '<' : '=');
  if (q.answer !== want) return false;
  const sideOk = sd => {
    if (sd.n == null || sd.n < 1) return false;
    if (sd.kind === 'num') return sd.items.length === 0;
    return KINDS.indexOf(sd.kind) >= 0 && sd.items.length === sd.n;
  };
  if (!sideOk(q.left) || !sideOk(q.right)) return false;
  /* 实物两侧种类互异（数字卡侧不参与） */
  if (q.left.kind !== 'num' && q.right.kind !== 'num' && q.left.kind === q.right.kind) return false;
  return true;
}

/* 实物侧：grid 排布（行优先，逐个可点数——顺序左→右、上→下符合数数习惯）
   物品尺寸按面板实测算（cols≈√(n·宽高比)，热区 ≥64），确定性纯布局 */
function renderItemsSide(panel, sd, badges, side) {
  panel.innerHTML = '';
  const W = panel.clientWidth, H = panel.clientHeight;
  const n = sd.items.length;
  const cols = Math.max(1, Math.min(n, Math.ceil(Math.sqrt(n * Math.max(0.6, W / Math.max(1, H))))));
  const rows = Math.ceil(n / cols);
  const pad = 18, gap = 7;
  const cell = Math.floor(Math.min((W - 2 * pad - (cols - 1) * gap) / cols,
                                   (H - 2 * pad - (rows - 1) * gap) / rows));
  const size = Math.max(64, Math.min(cell, 116));   /* 反方审查 m2：物品热区下限对齐 §0.9 的 64px 红线 */
  const wrap = document.createElement('div');
  wrap.className = 'g-items';
  sd.items.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'item';
    b.dataset.i = i;
    b.dataset.side = side;
    b.setAttribute('aria-label', (side === 'L' ? '左边' : '右边') + '第' + (i + 1) + '个' + sd.kind);
    b.style.width = Math.round(size * (p.s || 1)) + 'px';
    b.style.height = Math.round(size * (p.s || 1)) + 'px';
    b.innerHTML = ITEM_SVG[sd.kind](p) + '<span class="badge"></span>';
    wrap.appendChild(b);
  });
  panel.appendChild(wrap);
  restoreBadges(panel, badges);
}

function renderQuiz() {

function flySymbol(s) {

      flyerEl.style.width = (f.width * 0.6) + 'px';
      flyerEl.style.height = (f.height * 0.55) + 'px';
    }
    flyerEl.style.opacity = '1';
    void flyerEl.offsetWidth;                   // 强制回流后开过渡（CSS transition 坑规避）
    flyerEl.style.transition = 'left .45s cubic-bezier(.3,1.2,.4,1),top .45s cubic-bezier(.3,1.2,.4,1),' +
      'width .45s ease,height .45s ease,opacity .45s ease';

async function uiPickSym(s, demo) {
  if (!cur || state.locked || state.won || (state.demo && !demo)) return false;
  const run = cur;                                /* 反方审查 M3：演出窗口内点重玩会重建 cur——身份守卫防旧续体在新 cur 上 winFlow 白拿星 */
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const r = engPickSym(cur, s);
  if (r === null || r === 'again') return r;
  lastAct = Date.now();
  const el = symEl(s);
  if (r === 'right' || r === 'done') {
    if (state.tut === 'help') {                 // 教学"独"：首次答对 → 强化反馈放手
      state.tut = 'solo';
      ghost.hide();

      const m = document.createElement('span');
      m.className = 'mark';
      m.innerHTML = ICONS.check;

    document.querySelectorAll('#duel > .group').forEach(g => { g.classList.remove('circled', 'pop'); void g.offsetWidth; g.classList.add('circled', 'pop'); });
    KIDS.voice.play(SEM_KEY[q.answer], SEM_TEXT[q.answer]);   /* 语义语音：cmp_sem_* clip（T46 阶段2），text=TTS 兜底 */
    await wait(980 * SPEED);
    if (cur !== run) return r;                   /* 反方审查 M3：末题演出窗内重玩已重建关卡，丢弃旧续体 */
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
  } else {                                      // 答错：晃动+灰掉（零惩罚，可重点其它）；首错不 pulse 正确项，连错 2 次才高亮

/* ================= r29 三卡答题主路径（tri/near：真实点击 / CMP.pickPos / autoSolve 共用）

   right/done/wrong 全路径先刷、again（点已灰卡）早退不刷 */
async function uiPickPos(i, demo) {
  if (!cur || state.locked || state.won || (state.demo && !demo)) return false;
  const run = cur;                              /* 身份守卫（M3 同款：演出窗口内重玩防旧续体） */
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const r = engPickPos(cur, i);
  if (r === null || r === 'again') return r;
  lastAct = Date.now();
  const card = triEl(i);
  if (r === 'right' || r === 'done') {
    state.locked = true;
    /* 答案卡被圈弹跳 + 其余卡变暗（聚焦确认，演出同构符号题两组被圈） */
    document.querySelectorAll('#duel > .group').forEach(g => {
      if (Number(g.dataset.pos) === q.answer) {

      } else g.classList.add('dimmed');

    /* 语义拼句语音（SPEC §R10）：tri="X 最大/最小"；near="X 最接近 N"（段键 cmp_n_* 已注册） */
    const pickN = q.cards[q.answer].n;
    if (q.mode === 'tri') sayQ(['cmp_n_' + pickN, TRI_KEY[q.qtype].key]);
    else sayQ(['cmp_n_' + pickN, NEAR_OK.key, 'cmp_n_' + q.target]);
    await wait(980 * SPEED);
    if (cur !== run) return r;                  /* 身份守卫：末题演出窗内重玩已重建关卡 */
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
  } else {                                      // 答错：晃动+灰掉零惩罚；首错不 pulse 正确卡，连错 2 次才高亮（机制同符号题）
    q._miss = (q._miss || 0) + 1;

    }

    sayW(VOICE.wrong.key, VOICE.wrong.text);   /* 三卡错选同走纠错节流语音（SPEC §R4） */
    await wait(520 * SPEED);
  }
  return r;
}

window.CMP = {
  get currentLevel() {
    if (!cur) return null;
    const q = cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)] || {};
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, step: cur.step,
      retries: cur.retries, done: cur.done, won: state.won,
      countedL: q._cL || 0, countedR: q._cR || 0 };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    if (q.mode === 'tri' || q.mode === 'near') {     /* r29 三卡题：不暴露 d（距离为判定冗余字段） */
      return { mode: q.mode, answer: q.answer, step: cur.step,
        qtype: q.qtype || null, target: (q.target != null ? q.target : null),
        cards: q.cards.map(c => ({ n: c.n })),
        left: { n: q.cards[0].n, kind: 'num', type: 'num' },
        right: { n: q.cards[2].n, kind: 'num', type: 'num' },
        items: { left: [], right: [] },
        countedL: 0, countedR: 0,
        wrong: q.wrong.slice() };
    }
    return { mode: q.mode, answer: q.answer, step: cur.step,
      left: { n: q.left.n, kind: q.left.kind, type: q.left.kind === 'num' ? 'num' : 'items' },
      right: { n: q.right.n, kind: q.right.kind, type: q.right.kind === 'num' ? 'num' : 'items' },
      items: { left: q.left.items.map(p => ({ r: p.r, s: p.s })),
               right: q.right.items.map(p => ({ r: p.r, s: p.s })) },
      countedL: q._cL || 0, countedR: q._cR || 0,
      wrong: q.wrong.slice() };
  },
  tapItem(side, i) { return uiTapItem(side, i); },
  recount() { return uiRecount(); },
  pick(s) { return uiPickSym(s); },
  pickPos(i) { return uiPickPos(i); },               /* r29 三卡选择（真实路径同 pick） */
  async autoSolve() {                           // UI 路径自动答完当前关（点满两侧角标后选符号，走真实流程；r29 三卡分派）
    let n = 0;
    while (cur && !cur.done && n++ < 40) {
      const q = cur.quizzes[cur.step];
      if (!q) break;
      if (q.mode === 'tri' || q.mode === 'near') { await uiPickPos(q.answer); continue; }
      for (const side of ['L', 'R']) {

        for (let i = 0; i < sd.items.length; i++) uiTapItem(side, i);
      }
      await uiPickSym(q.answer);
    }
    return { done: !!(cur && cur.done), picks: n };
  },
  get tutorial() { return state.tut; }
};
/* ================= ?verify=1 自检（仅 verify 分支加载执行；r29 谱 SPEC-R29-COMPARE）
   ① 40 关全量审计（flat 0-39）：确定性（同 flat 两次生成 JSON 一致）/ 5 题 / structOk
     （符号题 answer 与两侧 n 一致；tri 三互异+极值下标；near 距离从题面重算 argmin）/
     章难度与模式合规（r29：dch1 全 count 8 内差 1-3 =恒1；dch2 全 num 10 内差 1-3 =奇2偶1；
     dch3 num 差1 + tri 恒2（窄跨度 ≤4）=恒1；dch4 count/num/mix 各≥1 + near 恒1（近对律
     d1∈[2,4]/d2-d1∈[1,2]）+ count 边≤12 差1-4 =奇2偶1）
     / 引擎直驱通关（符号题点数→重数→再点→选符号；tri/near 走 engPickPos + 非法卡位/
     非法符号交叉断言；0 重试 3 星）
   ② 分布断言（r29 §R3 精确推导）：40 关 200 题恒 tri=20/near=10/符号题=170/=48/
     gt+lt=122 且 gt,lt∈[58,64]（SPEC 窗口）；关内符号题 |gt-lt| ≤ 1（无位置惯性）
   ③ 点数辅助单元（flat 0 真实 UI 状态机）：左/右角标分别递增、已数过返 0、重数清零、非法下标 false
   ④ UI 冒烟 A：flat0 角标 DOM 逐只断言 + 首错零惩罚（晃+灰、不 pulse 正确项）+ 通关 2 星；
     UI 冒烟 B：flat15（dch4）三模式+near 在关内真实出现 + autoSolve（含 near 分派）通关（3 星）；
     UI 冒烟 C（r29 新）：flat10（dch3）tri 三卡真实上屏 + 三卡错选零惩罚首错不 pulse +
     pickPos 通路通关
     UI 冒烟 D（r29 家族修复 m2+P2-1）：#duel 刷新/新题视觉态与模型对齐——错态刷新后
     q.wrong 逐项 .wrong 在场 + 演出态 .circled/.dimmed 不在场；新题上屏三态
     （.wrong/.dimmed/.circled）全空（符号题相邻转换面+三卡重建面双路核）
   ⑤ 布局：双 viewport（1280×800 / 800×1180）×（flat10 章 3 / flat15 章 4 符号题 +
     flat10 首个 tri / flat15 首个 near 三卡形态）：热区 ≥64、符号按钮 ≥96×100、
     物品/数字卡两两不重叠、三卡题符号区置灰、overflowX ≤ 0
   结果写 #verify-result + document.title='VERIFY PASS n/n' */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;
  const symDist = { '>': 0, '<': 0, '=': 0 };
  const modesSeen = { count: 0, num: 0, mix: 0, tri: 0, near: 0 };

  /* ---- ① 40 关全量审计 + ② 分布统计 ---- */
  let distOkAll = true;
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1.quizzes) === JSON.stringify(L2.quizzes);   // 确定性
    let ruleOk = true, structAll = true;
    let eqCnt = 0, gt = 0, lt = 0, triCnt = 0, nearCnt = 0;
    const lvModes = { count: 0, num: 0, mix: 0, tri: 0, near: 0 };
    for (let k = 0; k < L1.quizzes.length; k++) {
      const q = L1.quizzes[k];
      if (!structOk(q)) structAll = false;
      modesSeen[q.mode]++; lvModes[q.mode]++;
      if (q.mode === 'tri' || q.mode === 'near') {           // 三卡题：分布与规则断言独立面
        if (q.mode === 'tri') triCnt++;
        else nearCnt++;
        let okT = true;
        if (q.mode === 'tri') {                              // dch3：三互异 10 内 + 窄跨度 ≤4
          const ns = q.cards.map(c => c.n);
          okT = Math.max.apply(null, ns) <= 10 && (Math.max.apply(null, ns) - Math.min.apply(null, ns)) <= 4;
        } else {                                             // dch4 near：N 8-17 + 近对律 d1/d2（SPEC §R3）
          const ds = q.cards.map(c => Math.abs(c.n - q.target)).sort((a, b) => a - b);
          okT = q.target >= 8 && q.target <= 17 &&
            Math.max.apply(null, q.cards.map(c => c.n)) <= 20 &&
            ds[0] >= 2 && ds[0] <= 4 && (ds[1] - ds[0]) >= 1 && (ds[1] - ds[0]) <= 2;
        }
        if (!okT) ruleOk = false;
        continue;
      }
      symDist[q.answer]++;
      if (q.answer === '=') eqCnt++;
      else if (q.answer === '>') gt++;
      else lt++;
      const d = Math.abs(q.left.n - q.right.n);
      const maxN = Math.max(q.left.n, q.right.n);
      let ok = true;
      if (L1.dch === 1) {                      // r29：8 以内全实物差 1-3
        ok = q.mode === 'count' && maxN <= 8 && (q.answer === '=' ? true : (d >= 1 && d <= 3));
      } else if (L1.dch === 2) {               // r29：10 以内全数字卡差 1-3
        ok = q.mode === 'num' && maxN <= 10 && (q.answer === '=' ? true : (d >= 1 && d <= 3));
      } else if (L1.dch === 3) {               // r29：num 差 1 近邻（全数字卡）
        ok = q.mode === 'num' && maxN <= 10 && (q.answer === '=' ? true : d === 1);
      } else {                                 // dch4：20 以内差 1-4；count 边 ≤12
        const cntN = [];
        if (q.left.kind !== 'num') cntN.push(q.left.n);
        if (q.right.kind !== 'num') cntN.push(q.right.n);
        ok = maxN <= 20 && (q.answer === '=' ? true : (d >= 1 && d <= 4)) && cntN.every(n => n <= 12);
      }
      /* num/mix 的数字卡侧不点数：kind='num' 且 items 空（structOk 已含） */
      if (!ok) ruleOk = false;
    }
    /* 关级规则：= 槽位律 + tri/near 恒定量 + dch4 三模式各 ≥1（SPEC §R2/§R3） */
    if (L1.dch === 1 && eqCnt !== 1) ruleOk = false;          // dch1 = 恒 1（r29 新律）
    if (L1.dch === 2 && eqCnt !== (L1.lv % 2 === 1 ? 2 : 1)) ruleOk = false;
    if (L1.dch === 3 && (triCnt !== 2 || eqCnt !== 1 || lvModes.num !== 3)) ruleOk = false;
    if (L1.dch === 4 && (nearCnt !== 1 || eqCnt !== (L1.lv % 2 === 1 ? 2 : 1) ||
        lvModes.count < 1 || lvModes.num < 1 || lvModes.mix < 1)) ruleOk = false;
    if (Math.abs(gt - lt) > 1) distOkAll = false;                    // 关内无方向惯性（符号题）
    /* 引擎直驱：tri/near 走 engPickPos（含非法交叉断言）；符号题点数→重数→再点→选对 */
    let driveOk = true;
    for (let k = 0; k < L1.quizzes.length && driveOk; k++) {
      const q = L1.quizzes[k];
      if (q.mode === 'tri' || q.mode === 'near') {
        if (engPickPos(L1, 5) !== null || engPickPos(L1, -1) !== null) driveOk = false;  // 非法卡位
        if (engPickSym(L1, '>') !== null) driveOk = false;           // 三卡题选符号 → null
        const r = engPickPos(L1, q.answer);
        if (r !== (k === L1.quizzes.length - 1 ? 'done' : 'right')) driveOk = false;
        continue;
      }
      for (const side of ['L', 'R']) {
        const sd = side === 'L' ? q.left : q.right;
        for (let i = 0; i < sd.items.length; i++) {
          if (engTap(L1, side, i) !== i + 1) { driveOk = false; break; }
        }
        if (!driveOk) break;
        if (sd.items.length && engTap(L1, side, 0) !== 0) driveOk = false;   // 已数过：只跳不增号
      }
      if (!driveOk) break;
      if ((q.left.kind !== 'num' || q.right.kind !== 'num') && !engRecount(L1)) driveOk = false;  // 重数清零（num 双卡题无物品可清，豁免）
      for (const side of ['L', 'R']) {
        const sd = side === 'L' ? q.left : q.right;
        for (let i = 0; i < sd.items.length; i++) {
          if (engTap(L1, side, i) !== i + 1) { driveOk = false; break; }
        }
        if (!driveOk) break;
      }
      if (!driveOk) break;
      if (engPickPos(L1, 0) !== null) driveOk = false;               // 符号题选卡 → null
      const r = engPickSym(L1, q.answer);
      const want = k === L1.quizzes.length - 1 ? 'done' : 'right';
      if (r !== want) driveOk = false;
      if (engPickSym(L1, 'x') !== null) driveOk = false;             // 非法符号恒 null
    }
    if (engPickSym(L1, '=') !== null) driveOk = false;               // 关已结束再选 → null
    if (engPickPos(L1, 0) !== null) driveOk = false;                 // 关已结束再选卡 → null
    const solvedAll = L1.done && L1.step === CH_LEN && L1.retries === 0 && engStars(L1) === 3;
    const ok = det && L1.quizzes.length === CH_LEN && ruleOk && structAll && driveOk && solvedAll;
    if (ok) npass++;
    const qstr = q => q.mode === 'tri'
      ? q.cards.map(c => c.n).join(',') + (q.qtype === 'max' ? 'max' : 'min') + '@' + q.answer
      : (q.mode === 'near'
        ? q.cards.map(c => c.n).join(',') + '~' + q.target + '@' + q.answer
        : q.left.n + (q.left.kind === 'num' ? 'N' : '') + q.answer + q.right.n + (q.right.kind === 'num' ? 'N' : ''));
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, ruleOk: ruleOk, structAll: structAll,
      driveOk: driveOk, solvedAll: solvedAll, gt: gt, lt: lt, eq: eqCnt, tri: triCnt, near: nearCnt,
      qs: L1.quizzes.map(qstr) };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② 分布断言（r29 §R3 精确推导：tri20/near10/符号170/=48/gt+lt=122，窗口 [58,64]） ---- */
  total++;
  const nAll = symDist['>'] + symDist['<'] + symDist['='] + modesSeen.tri + modesSeen.near;
  const symN = symDist['>'] + symDist['<'] + symDist['='];
  const distOk = nAll === 200 && modesSeen.tri === 20 && modesSeen.near === 10 &&
    symN === 170 && symDist['='] === 48 &&
    symDist['>'] >= 58 && symDist['>'] <= 64 && symDist['<'] >= 58 && symDist['<'] <= 64 &&
    symDist['>'] + symDist['<'] === 122 && distOkAll;
  if (distOk) npass++;
  units.dist = { ok: distOk, n: nAll, gt: symDist['>'], lt: symDist['<'], eq: symDist['='],
    tri: modesSeen.tri, near: modesSeen.near, perLevelBalanced: distOkAll, modes: modesSeen };

  /* ---- ③ 点数辅助单元（flat 0 真实 UI 状态机：双侧独立角标） ---- */
  total++;
  startLevel(0);
  const q0 = CMP.quiz;
  const tapsL = [], tapsR = [];
  for (let i = 0; i < q0.items.left.length; i++) tapsL.push(CMP.tapItem('L', i));
  for (let i = 0; i < q0.items.right.length; i++) tapsR.push(CMP.tapItem('R', i));
  const incOk = tapsL.every((v, i) => v === i + 1) && tapsR.every((v, i) => v === i + 1);
  const retap = CMP.tapItem('L', 0);            // 已数过 → 0，计数不变
  const retapOk = retap === 0 && CMP.currentLevel.countedL === q0.items.left.length;
  const domBadges = document.querySelectorAll('#g-left .badge.on, #g-right .badge.on').length;
  const domOk = domBadges === q0.items.left.length + q0.items.right.length;   // 每个物品一个角标
  CMP.recount();
  const recOk = CMP.currentLevel.countedL === 0 && CMP.currentLevel.countedR === 0 &&
    document.querySelectorAll('.badge.on').length === 0;
  const badIdx = CMP.tapItem('L', 99) === false && CMP.tapItem('R', -1) === false;
  const tapOk = incOk && retapOk && domOk && recOk && badIdx;
  if (tapOk) npass++;
  units.tapItem = { ok: tapOk, incOk: incOk, retap: retap, domBadges: domBadges,
    recount: recOk, badIdx: badIdx };

  /* ---- ④ UI 冒烟 A：flat0 逐个点数（角标 DOM 逐只断言）+ 首错零惩罚 + 通关（1 重试=2 星） ---- */
  total++;
  startLevel(0);
  let smokeA = true, wrongOk = false, steps = 0;
  for (let s = 0; s < CH_LEN && smokeA; s++) {
    const q = CMP.quiz;
    if (!q) { smokeA = false; break; }
    for (const side of ['left', 'right']) {
      for (let i = 0; i < q.items[side].length; i++) {
        if (CMP.tapItem(side === 'left' ? 'L' : 'R', i) !== i + 1) smokeA = false;
      }
    }
    const badges = document.querySelectorAll('.badge.on').length;
    if (badges !== q.items.left.length + q.items.right.length) smokeA = false;  // 逐只角标 DOM
    if (s === 0) {                              // 首错：晃动+灰掉零惩罚；首错不 pulse 正确项
      const wsym = SYMS.find(v => v !== q.answer);
      await CMP.pick(wsym);
      const wEl = symEl(wsym), okEl = symEl(q.answer);
      wrongOk = !!wEl && wEl.classList.contains('wrong') && !okEl.classList.contains('pulse') &&
        CMP.currentLevel.retries === 1 && CMP.currentLevel.step === 0;
    }
    const r = await CMP.pick(q.answer);
    if (r !== (s === CH_LEN - 1 ? 'done' : 'right')) smokeA = false;
    steps++;
  }
  const lvA = CMP.currentLevel;
  const smokeOkA = smokeA && wrongOk && steps === CH_LEN && lvA.done && lvA.won && lvA.retries === 1 &&
    engStars(cur) === 2 && !document.querySelector('.k-celebrate');   // verify 页不弹层
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, wrongOk: wrongOk, steps: steps, retries: lvA.retries, stars: engStars(cur) };

  /* ---- ④ UI 冒烟 B：flat15（dch4）三模式+near 在关内真实出现 + autoSolve（含 near 分派）通关 ---- */
  total++;
  startLevel(15);
  const seen = { count: 0, num: 0, mix: 0, tri: 0, near: 0 };
  let numcardShown = false;
  for (let s = 0; s < CH_LEN; s++) {
    const q = CMP.quiz;
    if (!q) break;
    seen[q.mode]++;
    if (q.mode === 'tri' || q.mode === 'near') {
      if (document.querySelectorAll('.group.tri').length === 3) numcardShown = true;   // 三卡真实上屏
      await CMP.pickPos(q.answer);
    } else {
      if (document.querySelector('.numcard')) numcardShown = true;     // 数字卡真实上屏
      await CMP.pick(q.answer);
    }
  }
  const lv15 = CMP.currentLevel;
  const smokeOkB = seen.count >= 1 && seen.num >= 1 && seen.mix >= 1 && seen.near >= 1 &&
    numcardShown && lv15.done && lv15.won && lv15.retries === 0;
  /* autoSolve 独立通路（flat16 生成关，dch4 循环）：真实流程通关 3 星（near 分派覆盖） */
  startLevel(16);
  const a16 = await CMP.autoSolve();
  const lv16 = CMP.currentLevel;
  const autoOk = a16.done && lv16.done && lv16.retries === 0 && engStars(cur) === 3;
  if (smokeOkB && autoOk) npass++;
  smokes.flat15 = { ok: smokeOkB && autoOk, modes: seen, numcard: numcardShown,
    autoSolve: { done: a16.done, picks: a16.picks, retries: lv16.retries, stars: engStars(cur) } };

  /* ---- ④ UI 冒烟 C（r29）：flat10（dch3）tri 三卡真实上屏 + 错选零惩罚 + pickPos 通路通关 ---- */
  total++;
  startLevel(10);
  let triShown = false, triWrongOk = false, stepsC = 0, triSeenCnt = 0;
  const seenC = { count: 0, num: 0, mix: 0, tri: 0, near: 0 };
  let guardC = 0, lastStepC = -1;                // 错选零惩罚不推进——while 按题推进；lastStep 防同题重复计数
  while (cur && !cur.done && guardC++ < 30) {
    const q = CMP.quiz;
    if (!q) break;
    if (lastStepC !== q.step) {
      seenC[q.mode]++;
      if (q.mode === 'tri') triSeenCnt++;
      lastStepC = q.step;
    }
    if (q.mode === 'tri') {
      const triN = document.querySelectorAll('.group.tri').length;
      const symOff = symbolsEl.classList.contains('off');
      if (triN === 3 && symOff && document.querySelectorAll('.group.tri .numcard').length === 3) triShown = true;
      if (!triWrongOk) {                       // 首个 tri：错选零惩罚（灰掉不推进、正确卡不 pulse）
        const wp = [0, 1, 2].find(v => v !== q.answer);
        await CMP.pickPos(wp);
        const wEl = document.querySelector('.group.tri[data-pos="' + wp + '"]');
        const okEl = document.querySelector('.group.tri[data-pos="' + q.answer + '"] .numcard');
        triWrongOk = !!wEl && wEl.classList.contains('wrong') &&
          !(okEl && okEl.classList.contains('pulse')) &&
          CMP.currentLevel.retries === 1 && CMP.currentLevel.step === q.step;
        continue;                              // 零惩罚后同题重选（while 不消耗题位）
      }
      const r = await CMP.pickPos(q.answer);
      if (r !== (q.step === CH_LEN - 1 ? 'done' : 'right')) stepsC = -99;
      else stepsC++;
      continue;
    }
    const r = await CMP.pick(q.answer);
    if (r !== (q.step === CH_LEN - 1 ? 'done' : 'right')) stepsC = -99;
    else stepsC++;
  }
  const lv10 = CMP.currentLevel;
  const smokeOkC = triShown && triWrongOk && triSeenCnt === 2 && stepsC === CH_LEN &&
    seenC.num === 3 && lv10.done && lv10.won && lv10.retries === 1 && engStars(cur) === 2;
  if (smokeOkC) npass++;
  smokes.flat10 = { ok: smokeOkC, triShown: triShown, triWrongOk: triWrongOk,
    triCount: triSeenCnt, modes: seenC, retries: lv10.retries, stars: engStars(cur) };

  /* ---- ④ UI 冒烟 D（r29 家族修复 m2+P2-1）：刷新/新题视觉态与模型对齐（真实 DOM 查询）
     断言从修复要求推导（非实现归纳）：错态刷新（resize 监听真实路径）→ q.wrong 逐项
     .wrong 在场 + 演出态 .circled/.dimmed 不在场 + 模型不动（retries/step）；
     新题上屏（答对推进）→ .wrong/.dimmed/.circled 三态全空。
     .dimmed 属答对演出态（uiPickPos 答对瞬间加于非答案卡，届时 step 已推进——题中无
     模型态可回填），归清除面与 .circled/.pop 同族，不按 q.wrong 回填（防泄答案/防与
     实点路径视觉不一致） ---- */
  total++;
  startLevel(0);                                 // dch1 全符号题：resize 刷新面+相邻转换面天然覆盖
  let vbSym = true;
  {
    const q = CMP.quiz;
    const wsym = SYMS.find(v => v !== q.answer);
    await CMP.pick(wsym);                        // 首错：模型记 wrong + 视觉灰掉
    window.dispatchEvent(new Event('resize'));   // 真实 resize 监听 → renderQuiz 刷新路径
    const wEl = symEl(wsym);
    vbSym = vbSym && !!wEl && wEl.classList.contains('wrong') &&
      !document.querySelector('#duel > .group.circled') &&
      !document.querySelector('#duel > .group.dimmed') &&
      CMP.currentLevel.retries === 1 && CMP.currentLevel.step === 0;
    vbSym = vbSym && (await CMP.pick(wsym)) === 'again';   // 模型一致：已错项重点=静默 again
    await CMP.pick(q.answer);                    // 答对 → 下一题（flat0 恒符号题=相邻转换 P2-1 面）
    const gs = document.querySelectorAll('#duel > .group');
    vbSym = vbSym && gs.length === 2 && Array.prototype.every.call(gs, g =>
        !g.classList.contains('circled') && !g.classList.contains('pop') &&
        !g.classList.contains('dimmed')) &&
      !document.querySelector('#symbols .sym.wrong') &&
      CMP.currentLevel.step === 1;
  }
  startLevel(10);                                // dch3：tri 恒 2（三卡重建面）
  let vbTri = true, triHit = false;
  for (let s = 0; s < CH_LEN; s++) {
    const q = CMP.quiz;
    if (!q) { vbTri = false; break; }
    if (q.mode !== 'tri') { await CMP.pick(q.answer); continue; }
    triHit = true;
    const wp = [0, 1, 2].find(v => v !== q.answer);
    await CMP.pickPos(wp);                       // 错选：灰掉零惩罚
    window.dispatchEvent(new Event('resize'));   // renderQuiz → renderTriQuiz 重建路径
    const wEl = document.querySelector('.group.tri[data-pos="' + wp + '"]');
    vbTri = vbTri && !!wEl && wEl.classList.contains('wrong') &&
      !document.querySelector('#duel .group.circled') &&
      !document.querySelector('#duel .group.dimmed') &&
      CMP.currentLevel.step === q.step;
    const r = await CMP.pickPos(q.answer);       // 答对推进 → 重建后零残留（首 tri 位 ≤3 恒非末题）
    vbTri = vbTri && (r === 'right' || r === 'done') &&
      !document.querySelector('#duel .group.circled') &&
      !document.querySelector('#duel .group.dimmed') &&
      !document.querySelector('#duel .group.wrong');
    break;
  }
  const smokeOkD = vbSym && vbTri && triHit;
  if (smokeOkD) npass++;
  smokes.visualBackfill = { ok: smokeOkD, symRefresh: vbSym, triRefresh: vbTri };

  /* ---- ⑤ 布局：双 viewport × 三形态——实物符号题（flat0 章1 / flat15 章4 实物题）、
     数字卡符号题（flat10 章3，r29 起 dch3 无实物）、三卡题（flat10 tri / flat15 near） ---- */
  async function stepToSym(flat, wantItems) {    // 推进到首个符号题（wantItems=true 须有实物侧）
    startLevel(flat);
    for (let s = 0; s < CH_LEN; s++) {
      const q = CMP.quiz;
      if (!q) return null;
      if (q.mode !== 'tri' && q.mode !== 'near') {
        if (!wantItems || q.items.left.length || q.items.right.length) return q;
      }
      if (q.mode === 'tri' || q.mode === 'near') await CMP.pickPos(q.answer);
      else await CMP.pick(q.answer);
    }
    return null;
  }
  async function stepToMode(flat, wantMode) {    // 推进到首个目标 mode 题
    startLevel(flat);
    for (let s = 0; s < CH_LEN; s++) {
      const q = CMP.quiz;
      if (!q) return null;
      if (q.mode === wantMode) return q;
      if (q.mode === 'tri' || q.mode === 'near') await CMP.pickPos(q.answer);
      else await CMP.pick(q.answer);
    }
    return null;
  }
  async function simView(w, h, flat, wantItems) {  // 符号题形态：物品∪数字卡热区 ≥64
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    const q = await stepToSym(flat, wantItems);
    const de = document.documentElement;
    const syms = Array.prototype.map.call(symbolsEl.querySelectorAll('.sym'), b => b.getBoundingClientRect());
    const symOk = !!q && syms.length === 3 && syms.every(r => r.width >= 96 && r.height >= 96);
    const items = Array.prototype.map.call(document.querySelectorAll('.item'), b => {
      const r = b.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height,
        l: r.left, t: r.top };
    });
    const hitOk = items.length > 0 && items.every(a => a.w >= 64 && a.h >= 64);
    /* 物品两两不重叠（同一面板内；跨面板左右分离天然不重叠） */
    let overlapOk = true;
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j];
        if (Math.abs(a.x - b.x) < (a.w + b.w) / 2 - 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2 - 2) overlapOk = false;
      }
    }
    const nc = document.querySelector('.numcard');
    const ncOk = !nc || (nc.getBoundingClientRect().width >= 64 && nc.getBoundingClientRect().height >= 64);
    const structureOk = !!q && !!$id('g-left') && !!$id('slot') && !$id('g-left').classList.contains('tri');
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, flat: flat, mode: q && q.mode, symOk: symOk, hitOk: hitOk,
      overlapOk: overlapOk, ncOk: ncOk, structureOk: structureOk, items: items.length, ox: ox,
      pass: symOk && structureOk && ((wantItems && hitOk) || (!wantItems && ncOk)) && overlapOk && ox <= 0 };
  }
  async function simTri(w, h, flat, wantMode) {  // r29 三卡形态：三组数字卡 + 符号区置灰 + near 目标徽章
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    const q = await stepToMode(flat, wantMode);
    const de = document.documentElement;
    const triOk = !!q && document.querySelectorAll('.group.tri').length === 3 &&
      document.querySelectorAll('.group.tri .numcard').length === 3;
    const symOffOk = symbolsEl.classList.contains('off');
    const cards = Array.prototype.map.call(document.querySelectorAll('.group.tri .numcard'), b => {
      const r = b.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
    });
    const hitOk = triOk && cards.length === 3 && cards.every(a => a.w >= 64 && a.h >= 64);
    let overlapOk = true;
    for (let i = 0; i < cards.length; i++) {
      for (let j = i + 1; j < cards.length; j++) {
        const a = cards[i], b = cards[j];
        if (Math.abs(a.x - b.x) < (a.w + b.w) / 2 - 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2 - 2) overlapOk = false;
      }
    }
    const tgtOk = wantMode !== 'near' || !!document.querySelector('#prompt-chip .tgt');
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, mode: wantMode, triOk: triOk, symOffOk: symOffOk, hitOk: hitOk,
      overlapOk: overlapOk, tgtOk: tgtOk, ox: ox,
      pass: triOk && symOffOk && hitOk && overlapOk && tgtOk && ox <= 0 };
  }
  total++;
  const sims = [];
  sims.push(await simView(1280, 800, 0, true));      // dch1 实物（r29 新值域 8 物品 grid 密度）
  sims.push(await simView(800, 1180, 0, true));
  sims.push(await simView(1280, 800, 10, false));    // dch3 数字卡符号题（r29 无实物）
  sims.push(await simView(800, 1180, 10, false));
  sims.push(await simView(1280, 800, 15, true));     // dch4 实物符号题（count/mix）
  sims.push(await simView(800, 1180, 15, true));
  const simsT = [];                             // r29 三卡形态：flat10 首个 tri / flat15 首个 near × 双 viewport
  for (const pair of [[10, 'tri'], [15, 'near']]) {
    simsT.push(await simTri(1280, 800, pair[0], pair[1]));
    simsT.push(await simTri(800, 1180, pair[0], pair[1]));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                // 还原真实 viewport 布局
  const layoutOk = sims.every(s => s.pass) && simsT.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims, triSims: simsT };

  const out = { game: 'compare', total: total, pass: npass, layoutOk: layoutOk, dist: symDist,
    modes: modesSeen, levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
</body>
