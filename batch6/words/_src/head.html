<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>识字积木</title>
<style>
/* ================= 识字积木 words（batch6）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   触摸目标：部件块 ≥100×100、拼字槽 ≥104×104、目标大字卡 ≥140（均主交互 ≥96）；
   布局纯 flex 纵向堆叠（题面在上、块池在下），横竖屏同一结构，overflowX 恒 0 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面（大字卡+槽）在上 / 部件块池在下 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;overflow:hidden;padding:8px 10px}
#board{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap;max-width:100%}

/* 目标大字卡（可点重听读音组词，10s 节流） */
#target-card{width:148px;height:148px;border-radius:28px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;transition:transform .15s;position:relative}
#target-card:active{transform:translateY(3px)}
#target-card .zi{font-size:88px;font-weight:800;line-height:1.05;color:#4A3B2E}
#target-card .py{font-size:16px;font-weight:700;color:#8A7B6C;letter-spacing:.12em;font-family:Georgia,serif}
/* 拼对亮起：字整体弹起+绿光（正确色柔绿，非大红） */
#target-card.lit{background:#8FBF7F;border-color:#6FA063;box-shadow:0 5px 0 #6FA063;
  animation:card-lit .6s cubic-bezier(.2,1.6,.4,1)}
#target-card.lit .zi{color:#FFF9EE}
#target-card.lit .py{color:#F0F5E8}
@keyframes card-lit{0%{transform:scale(1)}45%{transform:scale(1.14) rotate(2deg)}100%{transform:scale(1)}}
#target-card.bounce{animation:card-b .4s ease}
@keyframes card-b{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* 拼字槽（答案区，可点撤回） */
#slots{display:flex;gap:16px;align-items:center}
.slot{width:104px;height:104px;border-radius:22px;background:rgba(255,249,238,.55);
  border:3px dashed #C9BDA8;display:flex;align-items:center;justify-content:center;position:relative;
  transition:transform .15s}
.slot .zi{font-size:58px;font-weight:800;color:#4A3B2E;line-height:1}
/* 已填：实线框实底 + 从下方弹入（部件池在下，方向感=飞入） */
.slot.fill{background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;animation:slot-in .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes slot-in{from{transform:translateY(44px) scale(.5);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.slot.lit{background:#8FBF7F;border-color:#6FA063;box-shadow:0 4px 0 #6FA063}
.slot.lit .zi{color:#FFF9EE}
.slot.pulse{animation:slot-pulse 1s ease 2}
@keyframes slot-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px rgba(232,151,90,.95))}}
/* 槽满判定失败：槽区整体晃动 */
#slots.shake{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- 部件块池（主交互 ≥96） ---------- */
#tiles{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:18px;
  padding:2px 12px;min-height:112px;max-width:100%}
.tile{min-width:100px;min-height:100px;padding:0 8px;border-radius:24px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;font-size:54px;font-weight:800;color:#4A3B2E;
  line-height:1;transition:transform .15s,box-shadow .15s}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
/* 已入槽：隐藏但保占位（池不跳动，撤回即复现） */
.tile.used{visibility:hidden}
/* 干扰块被点：晃动弹回（零惩罚） */
.tile.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}
  55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
.tile.pulse{animation:tile-pulse 1s ease 2}
@keyframes tile-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch5 countchick） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：槽/块略缩仍 ≥96，大字卡缩小防挤压 */
@media (orientation:portrait){
  #target-card{width:132px;height:132px}
  #target-card .zi{font-size:76px}
  .slot{width:100px;height:100px}
  .slot .zi{font-size:54px}
  .tile{min-width:96px;min-height:96px;font-size:48px}
}
</style>
</head>
<body>
<div id="game" aria-label="识字积木">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board">
      <button id="target-card" aria-label="目标字"></button>
      <div id="slots" aria-label="拼字槽"></div>
    </div>
    <div id="tiles" aria-label="部件积木块"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读字"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
