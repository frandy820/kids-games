<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>对称画</title>
<style>
/* ================= 对称画 mirror（batch9）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   触摸目标：候选卡（主答案按钮）≥96、网格格 ≥74（4×4 84 / 5×5 74）、底栏按钮 ≥72；
   格内与候选卡图案 SVG ≥64（4×4 84×90%=75.6 / 5×5 74×90%=66.6 / 候选卡 92）
   pointerdown 即响应；布局=CSS grid（结构化内容优先 grid，SPEC §0.15） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#DCEAF4;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：对称板（上）+ 候选区（下） ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:4px 12px;overflow:hidden}

/* 对称板：CSS grid，N 图案列/行 + 中轴镜线占位（20px 一行/列，由 JS 写模板） */
#board{display:grid;gap:10px;background:#EFE3CD;border:3px solid #4A3B2E;border-radius:18px;
  padding:8px;box-shadow:0 6px 0 #D8C9B4;position:relative}
.cell{width:var(--cell,84px);height:var(--cell,84px);border-radius:20%;
  background:#FFF9EE;border:2.5px solid #D8C9B4;position:relative;
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.cell:active{transform:scale(.94)}
.cell svg{width:94%;height:94%;pointer-events:none}
/* 源侧已贴格：纸面微暖，与空格区分 */
.cell.src{background:#FFFDF6}
/* 本题目标格：橙色虚线框 + 呼吸光 + 问号水印（题面全语音承载，问号仅装饰锚点） */
.cell.target{border:3px dashed #E8975A;background:#FFFDF6;
  animation:cell-breathe 1.6s ease-in-out infinite}
@keyframes cell-breathe{0%,100%{box-shadow:0 0 0 0 rgba(232,151,90,.32)}
  50%{box-shadow:0 0 0 7px rgba(232,151,90,.32)}}
.cell.target::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:calc(var(--cell,84px)*.46);font-weight:800;color:#E8975A;opacity:.4}
/* 已贴对格：微绿底 + 小绿点冗余标识（颜色+位置双通道） */
.cell.filled{background:#EDF2E2;border-color:#BCD2A8}
.cell.filled::after{content:"";position:absolute;top:8%;right:11%;width:12%;height:12%;
  border-radius:50%;background:#8FBF7F;opacity:.9}
.cell.filled svg{width:94%;height:94%}
/* 刚贴上：贴纸落下弹跳（仅本题刚答对的格加 pop，重渲染不重放） */
.cell.filled.pop{animation:cell-pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes cell-pop{0%{transform:scale(.4) rotate(-14deg)}70%{transform:scale(1.12) rotate(3deg)}
  100%{transform:scale(1) rotate(0)}}
/* 点非目标格：轻摆（探索点击轻反馈，不动状态） */
.cell.wig{animation:cell-wig .4s ease}
@keyframes cell-wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}
/* 中轴镜线：玻璃条（横/竖由 JS 定 grid 位置；pointer-events:none 不挡格） */
.mirror{border-radius:9px;border:2.5px solid #4A3B2E;pointer-events:none;position:relative;
  overflow:hidden;   /* 玻璃条内高光 skew 位移按条长放大(~72px)，不裁剪会斜穿进图案行/列 */
  background:linear-gradient(180deg,#EAF3FA 0%,#C4DCEE 45%,#AFD0E6 55%,#DCEAF4 100%)}
#board.hAxis .mirror{background:linear-gradient(90deg,#EAF3FA 0%,#C4DCEE 45%,#AFD0E6 55%,#DCEAF4 100%)}
.mirror::before{content:"";position:absolute;top:12%;bottom:12%;left:26%;width:16%;
  border-radius:5px;background:rgba(255,255,255,.65);transform:skewX(-14deg)}
#board.hAxis .mirror::before{top:26%;bottom:26%;left:12%;right:12%;width:auto;height:16%;
  transform:skewY(-14deg)}
/* 镜面高光闪烁（缓慢、不抢注意） */
.mirror::after{content:"";position:absolute;inset:0;border-radius:7px;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);
  background-size:250% 100%;animation:glass-sheen 4.5s ease-in-out infinite}
@keyframes glass-sheen{0%,55%{background-position:120% 0}90%,100%{background-position:-60% 0}}

/* ---------- 候选区：3 张图案贴纸卡（主答案按钮 ≥96） ---------- */
#opts{flex:0 0 auto;display:flex;align-items:stretch;justify-content:center;gap:20px;
  flex-wrap:wrap;padding:2px 8px 4px;max-width:100%}
.opt{position:relative;min-width:150px;min-height:136px;padding:8px 16px;border-radius:24px;
  background:#FFFDF7;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:transform .15s,box-shadow .15s,background .2s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.opt svg{width:92px;height:92px;pointer-events:none}
/* 答对：绿卡 + 勾角标 */
.opt.right{background:#8FBF7F;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.opt.right .mark{position:absolute;top:-14px;right:-14px;width:42px;height:42px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.opt.right .mark svg{width:26px;height:26px}
@keyframes opt-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
/* 答错：晃动 + 灰掉可重点（零惩罚 §0.7；已灰项不再接收点击） */
.opt.wrong{background:#EFE3CD;border-color:#C9BDA8;box-shadow:0 3px 0 #C9BDA8;
  opacity:.5;pointer-events:none}
.opt.wrong{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* 连错 2 次后：正确项呼吸高亮（首错不 pulse，给再想机会） */
.opt.pulse{animation:opt-pulse 1s ease 2}
@keyframes opt-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch8） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：收紧间距即可（板宽最大 ~430 + 候选 3×150 放得下 800 宽） */
@media (orientation:portrait){
  .opt{min-width:144px;min-height:128px}
  .opt svg{width:86px;height:86px}
  #opts{gap:14px}
  #stage{gap:10px}
}
</style>
</head>
<body>
<div id="game" aria-label="对称画">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board" aria-label="对称画板"></div>
    <div id="opts" aria-label="候选贴纸"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
