<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>对称画</title>
<style>
/* ================= 对称画 mirror（batch9）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   触摸目标：候选卡（主答案按钮）≥96、网格格 ≥74（4×4 84 / 5×5 74）、底栏按钮 ≥72；
   格内与候选卡图案 SVG ≥64（4×4 84×90%=75.6 / 5×5 74×90%=66.6 / 候选卡 92）
   pointerdown 即响应；布局=CSS grid（结构化内容优先 grid，SPEC §0.15） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#DCEAF4;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：对称板（上）+ 候选区（下） ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:4px 12px;overflow:hidden}

/* 对称板：CSS grid，N 图案列/行 + 中轴镜线占位（20px 一行/列，由 JS 写模板） */
#board{display:grid;gap:10px;background:#EFE3CD;border:3px solid #4A3B2E;border-radius:18px;
  padding:8px;box-shadow:0 6px 0 #D8C9B4;position:relative}
.cell{width:var(--cell,84px);height:var(--cell,84px);border-radius:20%;
  background:#FFF9EE;border:2.5px solid #D8C9B4;position:relative;
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.cell:active{transform:scale(.94)}
.cell svg{width:94%;height:94%;pointer-events:none}
/* 源侧已贴格：纸面微暖，与空格区分 */
.cell.src{background:#FFFDF6}
/* 本题目标格：橙色虚线框 + 呼吸光 + 问号水印（题面全语音承载，问号仅装饰锚点） */
.cell.target{border:3px dashed #E8975A;background:#FFFDF6;
  animation:cell-breathe 1.6s ease-in-out infinite}
@keyframes cell-breathe{0%,100%{box-shadow:0 0 0 0 rgba(232,151,90,.32)}
  50%{box-shadow:0 0 0 7px rgba(232,151,90,.32)}}
.cell.target::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:calc(var(--cell,84px)*.46);font-weight:800;color:#E8975A;opacity:.4}
/* 已贴对格：微绿底 + 小绿点冗余标识（颜色+位置双通道） */
.cell.filled{background:#EDF2E2;border-color:#BCD2A8}
.cell.filled::after{content:"";position:absolute;top:8%;right:11%;width:12%;height:12%;
  border-radius:50%;background:#8FBF7F;opacity:.9}
.cell.filled svg{width:94%;height:94%}
/* 刚贴上：贴纸落下弹跳（仅本题刚答对的格加 pop，重渲染不重放） */
.cell.filled.pop{animation:cell-pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes cell-pop{0%{transform:scale(.4) rotate(-14deg)}70%{transform:scale(1.12) rotate(3deg)}
  100%{transform:scale(1) rotate(0)}}
/* 点非目标格：轻摆（探索点击轻反馈，不动状态） */
.cell.wig{animation:cell-wig .4s ease}
@keyframes cell-wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}
/* 中轴镜线：玻璃条（横/竖由 JS 定 grid 位置；pointer-events:none 不挡格） */
.mirror{border-radius:9px;border:2.5px solid #4A3B2E;pointer-events:none;position:relative;
  overflow:hidden;   /* 玻璃条内高光 skew 位移按条长放大(~72px)，不裁剪会斜穿进图案行/列 */
  background:linear-gradient(180deg,#EAF3FA 0%,#C4DCEE 45%,#AFD0E6 55%,#DCEAF4 100%)}
#board.hAxis .mirror{background:linear-gradient(90deg,#EAF3FA 0%,#C4DCEE 45%,#AFD0E6 55%,#DCEAF4 100%)}
.mirror::before{content:"";position:absolute;top:12%;bottom:12%;left:26%;width:16%;
  border-radius:5px;background:rgba(255,255,255,.65);transform:skewX(-14deg)}
#board.hAxis .mirror::before{top:26%;bottom:26%;left:12%;right:12%;width:auto;height:16%;
  transform:skewY(-14deg)}
/* 镜面高光闪烁（缓慢、不抢注意） */
.mirror::after{content:"";position:absolute;inset:0;border-radius:7px;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);
  background-size:250% 100%;animation:glass-sheen 4.5s ease-in-out infinite}
@keyframes glass-sheen{0%,55%{background-position:120% 0}90%,100%{background-position:-60% 0}}

/* ---------- 候选区：3 张图案贴纸卡（主答案按钮 ≥96） ---------- */
#opts{flex:0 0 auto;display:flex;align-items:stretch;justify-content:center;gap:20px;
  flex-wrap:wrap;padding:2px 8px 4px;max-width:100%}
.opt{position:relative;min-width:150px;min-height:136px;padding:8px 16px;border-radius:24px;
  background:#FFFDF7;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:transform .15s,box-shadow .15s,background .2s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.opt svg{width:92px;height:92px;pointer-events:none}
/* 答对：绿卡 + 勾角标 */
.opt.right{background:#8FBF7F;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.opt.right .mark{position:absolute;top:-14px;right:-14px;width:42px;height:42px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.opt.right .mark svg{width:26px;height:26px}
@keyframes opt-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
/* 答错：晃动 + 灰掉可重点（零惩罚 §0.7；已灰项不再接收点击） */
.opt.wrong{background:#EFE3CD;border-color:#C9BDA8;box-shadow:0 3px 0 #C9BDA8;
  opacity:.5;pointer-events:none}
.opt.wrong{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* 连错 2 次后：正确项呼吸高亮（首错不 pulse，给再想机会） */
.opt.pulse{animation:opt-pulse 1s ease 2}
@keyframes opt-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch8） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：收紧间距即可（板宽最大 ~430 + 候选 3×150 放得下 800 宽） */
@media (orientation:portrait){
  .opt{min-width:144px;min-height:128px}
  .opt svg{width:86px;height:86px}
  #opts{gap:14px}
  #stage{gap:10px}
}
</style>
</head>
<body>
<div id="game" aria-label="对称画">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board" aria-label="对称画板"></div>
    <div id="opts" aria-label="候选贴纸"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

/* ================= mirror 纯引擎：确定性关卡生成 + 点选判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   章难度（SPEC-BATCH9 §2；进度章号单调递增、难度章号 (ch-1)%4+1 循环）：
   dch1 竖轴 4×4 + 对称图案（星/花/爱心/圆/方）——dst=src 镜像位贴同图案，建立"等距镜像"概念
   dch2 竖轴 4×4 + 不对称图案（旗/鱼/月牙/靴子/扫帚）——候选=[镜像形,原形,干扰]，
        原形干扰是镜像训练灵魂：孩子必须认出"镜子里的样子"方向相反
   dch3 竖轴 5×5 + 多色——图案×颜色双维干扰（同形不同色 / 同色原形）
   dch4 横轴（上下镜像，认知转换）+ 竖横混合 + 规格 4/5 混合；生成关=随机轴+随机规格+随机布点
   镜像数学：竖轴 col c ↔ N-1-c；横轴 row r ↔ N-1-r（verify 断言 dst 坐标）
   规则铁律：options 含 answer（同引用）且按 mid+color+mirrored 键互异；
   answer.mid/color=src 贴纸同款；dch2+ answer.mirrored=true 且含原形干扰（mirrored=false 同 mid 同色） */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 镜像数学（verify 断言的唯一定义点） ---------- */
function mirrorOf(axis, N, r, c) {
  return axis === 'v' ? { r: r, c: N - 1 - c } : { r: N - 1 - r, c: c };
}
/* 源侧格集合（v：左半 c<half / h：上半 r<half；轴线上无格） */
function srcSideCells(axis, N) {
  const half = Math.floor(N / 2), out = [];
  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++)
      if (axis === 'v' ? c < half : r < half) out.push({ r: r, c: c });
  return out;
}

/* ---------- 章 → 轴/规格/牌库（静态 20 关显式定；生成关按同规则随机） ---------- */
function chSpec(dch, lv, rnd) {
  if (dch === 1) return { axis: 'v', N: 4, pool: SYM_KEYS };
  if (dch === 2) return { axis: 'v', N: 4, pool: ASYM_KEYS };
  if (dch === 3) return { axis: 'v', N: 5, pool: ASYM_KEYS };
  /* dch4：横轴为主 + 竖横混合 + 规格 4/5 混合（静态关 lv 定，生成关 rnd 定） */
  const axis = rnd ? (rnd() < 0.5 ? 'h' : 'v') : (lv % 2 === 0 ? 'h' : 'v');
  const N = rnd ? (rnd() < 0.5 ? 4 : 5) : (lv < 3 ? 4 : 5);
  return { axis: axis, N: N, pool: ASYM_KEYS };
}

/* ---------- 单题生成：源格 src 贴纸 → 镜像位 dst 候选三张
   dch1: [同图案, 对称图案干扰 ×2]（对称图案镜像不变，认"位置等距"）
   dch2: [镜像形, 原形, 异图案干扰]（原形=镜像训练灵魂）
   dch3: [镜像形+源色, 原形+源色, 镜像形+异色]（形×色双维干扰）
   dch4: 同 dch2 结构（轴/规格混合） ---------- */
function genOne(dch, spec, src, rnd) {
  const pool = spec.pool;
  const mid = pool[Math.floor(rnd() * pool.length)];
  const color = PALETTE[Math.floor(rnd() * PALETTE.length)];
  const dst = mirrorOf(spec.axis, spec.N, src.r, src.c);
  const pickColor = () => PALETTE[Math.floor(rnd() * PALETTE.length)];
  let answer, options;
  if (dch === 1) {                                       // 章 1：对称图案贴同款
    answer = { mid: mid, color: color, mirrored: false };
    const others = shuffled(pool.filter(m => m !== mid), rnd).slice(0, 2);
    options = [answer,
      { mid: others[0], color: pickColor(), mirrored: false },
      { mid: others[1], color: pickColor(), mirrored: false }];
  } else if (dch === 3) {                                // 章 3：形×色双维干扰
    const oc = shuffled(PALETTE.filter(cl => cl !== color), rnd)[0];
    answer = { mid: mid, color: color, mirrored: true };
    options = [answer,
      { mid: mid, color: color, mirrored: false },       // 原形干扰（同形同色，方向相反）
      { mid: mid, color: oc, mirrored: true }];          // 异色干扰（同形镜像，颜色不同）
  } else {                                               // 章 2/4：原形干扰 + 异图案干扰
    const dm = shuffled(pool.filter(m => m !== mid), rnd)[0];
    answer = { mid: mid, color: color, mirrored: true };
    options = [answer,
      { mid: mid, color: color, mirrored: false },       // 原形干扰（镜像训练灵魂）
      { mid: dm, color: pickColor(), mirrored: true }];
  }
  options = shuffled(options, rnd);
  return { axis: spec.axis, N: spec.N, src: { r: src.r, c: src.c }, dst: dst,
    mid: mid, color: color, answer: answer, options: options, _miss: 0, solved: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   源侧洗牌取前 5 格 = 本关 5 个镜像目标（互异、分布均匀） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const spec = chSpec(dch, lv, flat >= STATIC_LEVELS ? rnd : null);
  const cells = shuffled(srcSideCells(spec.axis, spec.N), rnd).slice(0, CH_LEN);
  const quizzes = cells.map(src => genOne(dch, spec, src, rnd));
  return { flat, ch, dch, lv, axis: spec.axis, N: spec.N, quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点选引擎（无 DOM）：engTap(L, i) —— 点第 i 张候选卡
   'right' = 贴对（题继续）；'done' = 末题贴对（通关）；'wrong' = 贴错（灰掉，计错点）；
   'again' = 点已灰卡（早退零惩罚不计数）；null = 非法/关卡已结束 ---------- */
function engTap(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved || i < 0 || i >= q.options.length) return null;
  if (q._dead && q._dead[i]) return 'again';              // 已灰选项：早退（防御层 §0.7）
  if (q.options[i] === q.answer) {
    q._dead = q._dead || [];
    q._dead[i] = 1;
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  q._dead = q._dead || [];
  q._dead[i] = 1;
  q._miss = (q._miss || 0) + 1;
  L.retries++;                                            // 错点次数（星级判据）
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级：一关零错点=3 星；错点 ≤2=2 星；否则 1 星。永不 0 星 */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);
const correctIdx = q => q.options.indexOf(q.answer);
/* 候选卡唯一键（互异判据） */
const optKey = o => o.mid + '|' + o.color + '|' + (o.mirrored ? 1 : 0);

/* ---------- 结构校验（verify 用）：轴/规格/镜像坐标/候选不变式/贴纸与源格一致 ---------- */
function structOk(q, dch) {
  if (!q || (q.axis !== 'v' && q.axis !== 'h')) return false;
  if (q.N !== 4 && q.N !== 5) return false;
  if (!q.src || !q.dst || !q.answer || !q.options) return false;
  const m = mirrorOf(q.axis, q.N, q.src.r, q.src.c);
  if (m.r !== q.dst.r || m.c !== q.dst.c) return false;   // dst=src 镜像位（核心断言）
  const half = Math.floor(q.N / 2);
  if (q.axis === 'v' ? !(q.src.c < half && q.dst.c >= half) : !(q.src.r < half && q.dst.r >= half))
    return false;                                         // src 在源侧 / dst 在镜像侧
  if (q.options.length !== 3) return false;
  if (q.options.indexOf(q.answer) < 0) return false;      // answer 必在候选中（同引用）
  for (let i = 0; i < 3; i++)
    for (let j = i + 1; j < 3; j++)
      if (optKey(q.options[i]) === optKey(q.options[j])) return false;   // 候选互异
  if (q.answer.mid !== q.mid || q.answer.color !== q.color) return false;   // 贴纸=源格同款
  const pool = dch === 1 ? SYM_KEYS : ASYM_KEYS;
  if (pool.indexOf(q.mid) < 0) return false;              // 图案取自本章牌库
  for (const o of q.options) if (pool.indexOf(o.mid) < 0) return false;
  if (dch === 1) {                                        // 章 1：对称图案 + 全原形
    if (q.answer.mirrored) return false;
  } else {                                                // 章 2+：answer=镜像形 + 含原形干扰
    if (!q.answer.mirrored) return false;
    if (!q.options.some(o => !o.mirrored && o.mid === q.mid && o.color === q.color)) return false;
  }
  return true;
}

/* ================= 题面语音（读题 sayR 级不受 flat 门；按轴取竖/横题面 clip） */
function qSpeak(q) {
  if (!q) return;
  const cl = qClip(q);
  KIDS.voice.play(cl.key, cl.text);
}

/* ================= 对称板渲染（纯函数于 cur.step——确定性重渲染）
   网格 = N 图案列/行 + 中轴 20px 镜线占位（v 轴插中间列 / h 轴插中间行）；
   格显式定位（镜像坐标数学不受视觉占位列影响：竖轴 col c↔N-1-c / 横轴 row r↔N-1-r） */
function renderBoard() {
  const N = cur.N, half = Math.floor(N / 2), v = cur.axis === 'v';
  boardEl.className = v ? '' : 'hAxis';
  boardEl.style.setProperty('--cell', N === 5 ? '74px' : '84px');
  const cellCol = 'var(--cell)';
  const motifN = Array(N).fill(cellCol).join(' ');
  const halfN = Array(half).fill(cellCol).join(' ');
  const mid = '20px';
  boardEl.style.gridTemplateColumns = v ? [halfN, mid, halfN].join(' ') : motifN;
  boardEl.style.gridTemplateRows = v ? motifN : [halfN, mid, halfN].join(' ');
  boardEl.innerHTML = '';

  /* 中轴镜线（占中列/中行整条；pointer-events:none） */
  const mir = document.createElement('div');
  mir.className = 'mirror';
  mir.setAttribute('aria-hidden', 'true');
  if (v) { mir.style.gridColumn = (half + 1) + ''; mir.style.gridRow = '1 / span ' + N; }
  else { mir.style.gridRow = (half + 1) + ''; mir.style.gridColumn = '1 / span ' + N; }
  boardEl.appendChild(mir);

  /* 源侧贴纸与镜像侧状态（由 quizzes 推导：k<step 已贴 / k=step 高亮 / k>step 留空） */
  const srcMap = {}, dstMap = {};
  cur.quizzes.forEach((q, k) => {
    srcMap[cellKey(q.src.r, q.src.c)] = q;
    dstMap[cellKey(q.dst.r, q.dst.c)] = { q: q, k: k };
  });
  /* 奇数 N：中列/中行=轴占位跳过（自镜像格不入局）；偶数 N：轴线在两列/行之间，无格可跳 */
  const ax = N % 2 === 1 ? half : -1;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if ((v ? c : r) === ax) continue;                     // 奇数 N 的中轴格跳过
      const b = document.createElement('button');
      b.className = 'cell';
      b.dataset.k = cellKey(r, c);
      if (v) { b.style.gridColumn = (c < half ? c + 1 : c + 2) + ''; b.style.gridRow = (r + 1) + ''; }
      else { b.style.gridRow = (r < half ? r + 1 : r + 2) + ''; b.style.gridColumn = (c + 1) + ''; }
      const sq = srcMap[cellKey(r, c)];
      const dq = dstMap[cellKey(r, c)];
      if (sq) {                                             // 源侧已贴：原形
        b.classList.add('src');
        b.innerHTML = motifSvg(sq.mid, sq.color, null);
        b.setAttribute('aria-label', MOTIFS[sq.mid].zh + '贴纸');
      } else if (dq) {
        const q = dq.q;
        if (dq.k < cur.step) {                              // 已贴对：镜像形
          b.classList.add('filled');
          if (dq.k === cur.step - 1) b.classList.add('pop');   // 仅刚贴上的格弹跳
          b.innerHTML = motifSvg(q.answer.mid, q.answer.color, flipOf(q, true));
          b.setAttribute('aria-label', MOTIFS[q.answer.mid].zh + '贴对');
        } else if (dq.k === cur.step) {                     // 本题目标格
          b.classList.add('target');
          b.setAttribute('aria-label', '要贴贴纸的格子');
        } else b.setAttribute('aria-label', '空格子');
      } else b.setAttribute('aria-label', '空格子');
      boardEl.appendChild(b);
    }
  }
}
/* 候选区：3 张贴纸卡（镜像形/原形/干扰由引擎 options 决定，渲染零手抄） */
function renderOpts(q) {
  optsEl.innerHTML = '';
  q.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.dataset.i = i;
    b.dataset.mid = o.mid;
    b.dataset.mir = o.mirrored ? '1' : '0';
    b.setAttribute('aria-label', MOTIFS[o.mid].zh + (o.mirrored ? '镜子里的样子' : '贴纸'));
    b.innerHTML = motifSvg(o.mid, o.color, flipOf(q, o.mirrored));
    optsEl.appendChild(b);
  });
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderBoard();
  renderOpts(q);
  renderStep();
  if (!state.demo && !state.quiet) qSpeak(q);  // 开题读题；quiet=开场/教学交接改走顺序链（batch8 M1/M3）
}
function renderStep() {                         // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');

    tray.appendChild(i);

}
function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('pulse'); void el.offsetWidth;
  el.classList.add('pulse');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向：当前题正确选项 */
function pointHelpNext() {

/* ================= 答题主路径（真实点击 / MIR.tapOption / autoSolve 共用） ================= */
async function uiPick(i, demo) {
  /* locked 门拦真实输入；demo 通道仅 tutorialWatch 内部传 true（豁免 locked 门） */
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q || i < 0) return false;
  const run = cur;                              /* 演出窗口内点重玩会重建 cur——身份守卫防旧续体错推进 */
  const r = engTap(cur, i);
  if (r === null) return false;
  const el = optEl(i);

  if (r === 'wrong') {                          /* 贴错：晃动+灰掉可重点（零惩罚）；首错不 pulse 正确项 */
    if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('wrong'); }
    sfx('fail');
    sayW(VOICE.wrong.key, VOICE.wrong.text, q._miss >= 2);   /* flat<3 每错必播 / flat≥3 10s 节流+miss≥2 豁免 */
    if (q._miss >= 2) {                         /* 连错 2 次才高亮正确项 */
      const ok = optEl(correctIdx(q));
      if (ok) { ok.classList.remove('pulse'); void ok.offsetWidth; ok.classList.add('pulse'); }
    }
    await wait(420 * SPEED);
    return 'wrong';
  }
  if (r === 'again') return 'again';            /* 已灰选项：早退零惩罚不计数（防御层） */

  /* ---- 贴对 ---- */
  lastAct = Date.now();                         /* 仅正确推进重置救援钟（§0.7a） */
  if (state.tut === 'help') {                   /* 教学"独"：首次答对 → 强化反馈放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  if (el) {
    el.classList.add('right');
    el.classList.remove('pulse');
    const m = document.createElement('span');
    m.className = 'mark';
    m.innerHTML = ICONS.check;
    el.appendChild(m);
  }
  /* 目标格即刻贴上镜像形弹跳（板面即时反馈，正式重渲染在演出窗后） */
  const tCell = cellEl(q.dst.r, q.dst.c);
  if (tCell) {
    tCell.className = 'cell filled pop';
    tCell.innerHTML = motifSvg(q.answer.mid, q.answer.color, flipOf(q, true));
  }
  sfx('coin');
  if (r === 'done') hopRabbit();
  await wait(950 * SPEED);
  if (cur !== run) return r;                    /* 演出窗内重玩已重建关卡，丢弃旧续体 */
  state.locked = false;
  if (r === 'done') winFlow();
  else renderQuiz();
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关用 GEN 文案（不带"明天："前缀，core 模板自带） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);               // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  lastReplayAt = 0;
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = flat === 0 && !sv.levels['1-0'] && !(sv.mir && sv.mir.tutSeen);
  if (VERIFY) { if (!freshTut) openingSpeak(); return; }   /* verify 页 stub 记录开场链（autoplay 断言） */
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  openingSpeak();                                /* 开场任务语音+题面顺序链（§0.5；hint 不切断题面） */
}
function openingSpeak() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  KIDS.voice.queue([VOICE.hint.key, qClip(q).key]);
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=幽灵手指演示贴对第一题（贴上弹跳+绿卡勾，locked 吞输入）→
   重发同关（确定性关卡，题面一致）；帮=指向正确卡；独=首次答对放手 */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);
  await wait(700 * SPEED);
  const q = cur.quizzes[0];
  const idx = correctIdx(q);
  pointGhostAt(optEl(idx));
  await wait(900 * SPEED);
  ghost.press();
  await wait(320 * SPEED);
  state.demo = false;                           // 临时解锁走真实路径演示一次完整贴对演出
  state.locked = false;                         /* 时序锚点（审查 m6）：吞输入依赖 uiPick 正确路径
     在首个 await 前同步重设 locked=true——禁在 uiPick 的 gate 与 locked=true 之间插入 await */
  state.quiet = true;                           // 演示贴对的换题渲染不插播下一题指令（batch8 M2）
  await uiPick(idx, true);
  const sv = KIDS._save();
  sv.mir = sv.mir || {};
  sv.mir.tutSeen = true;
  KIDS.store.persist();
  /* 立即重发同关（确定性关卡，题面一致），"你来贴一贴"在重发后的题面上说（照 batch5-8） */
  ghost.hide();
  cur = genLevel(0);
  state = { locked: false, won: false, demo: false, tut: 'help', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  state.quiet = false;
  const q0 = cur.quizzes[0];                    // 交接顺序链：turn→题面（play(turn) 不得切断题面）
  KIDS.voice.queue([VOICE.turn.key, qClip(q0).key]);
  setTimeout(() => { if (state.tut === 'help') pointHelpNext(); }, 600);
}

/* ================= 底栏与板面交互 ================= */
let helpRedemo = false;
function hopRabbit() {
  rabbitBtn.classList.remove('hop'); void rabbitBtn.offsetWidth; rabbitBtn.classList.add('hop');
}
/* 重听题面（听按钮/目标格共用）：sayR 不受 flat 门；3s 节流防连点轰炸（force=测试钩子直通） */
function replaySpeech(force) {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return false;
  const now = Date.now();
  if (!force && now - lastReplayAt < 3000) return false;
  lastReplayAt = now;
  qSpeak(q);                                    // 按轴重读题面（竖轴/横轴 clip 不同）
  return true;
}
function wigCell(el) {

}
rabbitBtn.addEventListener('pointerdown', e => {

});
/* 板面：目标格=重听题面（3s 节流）；其余格=探索点击轻提示（10s 节流，不重置救援钟） */
boardEl.addEventListener('pointerdown', e => {

/* ================= 无操作看护：14s 救援（5.5 岁等待极限 15s 内）/ 教学"帮"5s 重演示一次
   救援=重读当前题面；只有本看护与正确推进写 lastAct（错点/探索点击不重置 §0.7a） */
setInterval(() => {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  const idle = Date.now() - lastAct;
  if (idle > 14000) {
    const q = cur.quizzes[cur.step];            /* 救援：重读题面（不受 flat 门，§0.5） */
    if (q) qSpeak(q);
    if (q) {                                    /* 视觉重现（试玩共性 P1）：正确贴纸 pulse 一次，静音也能看见答案线索 */
      const ai = q.options.findIndex(o => o.mid === q.answer.mid && o.color === q.answer.color && o.mirrored === q.answer.mirrored);
      const ok = optEl(ai);
      if (ok) { ok.classList.remove('pulse'); void ok.offsetWidth; ok.classList.add('pulse'); }
    }
    lastAct = Date.now();
    return;
  }
  if (idle > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {
    helpRedemo = true;
    pointHelpNext();
  }
}, 1000);

/* ================= 启动（verify 分支由 game-verify.js 接管） ================= */

  if (lim > 0 && KIDS.calendar.dayDone(keys)) { // 今日新关已玩完：收尾画面（可关闭继续重玩）

}

/* ================= 验收钩子（getter 模式，返回拷贝非活引用） ================= */
window.MIR = {
  get currentLevel() {
    if (!cur) return null;
    const q = cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)] || {};
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, axis: cur.axis, N: cur.N,
      n: cur.quizzes.length, step: cur.step, retries: cur.retries, done: cur.done, won: state.won,
      solved: !!q.solved };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    return { axis: q.axis, N: q.N,
      src: { r: q.src.r, c: q.src.c }, dst: { r: q.dst.r, c: q.dst.c },
      answer: { mid: q.answer.mid, color: q.answer.color, mirrored: q.answer.mirrored },
      options: q.options.map(o => ({ mid: o.mid, color: o.color, mirrored: o.mirrored })),
      step: cur.step, miss: q._miss || 0,
      dead: q.options.map((o, i) => !!(q._dead && q._dead[i])) };
  },
  tapOption(i) { return uiPick(i); },
  replay() { return replaySpeech(true); },      /* 测试钩子：无视节流直通重播 */
  async autoSolve() {                           // UI 路径自动贴完当前关（每题贴正确卡，走真实流程）
    let taps = 0, guard = 0;
    while (cur && !cur.done && guard++ < 40) {
      const q = cur.quizzes[cur.step];
      if (!q) break;
      const i = correctIdx(q);
      if (i < 0) break;
      const r = await uiPick(i);
      if (r === false || r === null || r === 'again' || r === 'wrong') break;
      taps++;
      await wait(60);
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
  get tutorial() { return state.tut; }
};
/* ================= ?verify=1 自检（仅 verify 分支加载执行）
   ① 静态 20 + 生成 20 关全量审计（flat 0-39）：确定性（同 flat 两次生成 JSON 一致）/
     章规则（dch1 竖轴4×4对称图案 / dch2 竖轴4×4不对称+原形干扰 / dch3 竖轴5×5多色双维 /
     dch4 轴竖横混合+规格4/5混合）/ structOk（dst=src 镜像坐标·候选互异·贴纸同源）/
     引擎直驱通关（每题贴正确卡 right→末题 done→0 错 3 星）
   ② 覆盖：对称 5 图案章 1 全用 / 不对称 5 图案 40 关全用 / 两轴均有 / 规格 4/5 均有
   ③ 镜像数学专项：逐题断言 dst（竖 col N-1-c / 横 row N-1-r）与 src 两侧分布
   ④ 点选单元：首错零惩罚不 pulse / 已灰 pointer-events:none + 再点 'again' / 二错 pulse 正确卡
   ⑤ sayW 节流：flat<3 每错必播 / flat≥3 10s 一条
   ⑥ 开场顺序链 stub：queue([mir_hint, mir_q_v|mir_q_h])（按轴）+ replay() 直通
   ⑦ 候选卡与引擎严格同源（DOM dataset.mid/mir==引擎 options，零手抄）
   ⑧ 教学/演出吞输入单元：demo+locked 门拦真实与钩子输入
   ⑨ 布局：双 viewport（模拟 1280×800 / 800×1180）× 四代表关：
     候选卡 ≥96、格按钮与图案 SVG ≥64、底栏按钮 ≥64、overflowX ≤0
   ⑩ UI 冒烟：flat0 首错零惩罚+通关（1 错=2 星）；flat15（章 4 横轴）autoSolve 3 星
   结果写 #verify-result + document.title='VERIFY PASS n/n' */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;
  const midHist = {}, axisHist = {}, sizeHist = {};
  /* MIR.quiz 返回拷贝——按值判等（mid+color+mirrored 三字段全同=答案卡；
     dch3 颜色干扰与答案同 mid 同 mirrored 仅色不同，禁用两字段判等） */
  const isAns = (q, o) => o.mid === q.answer.mid && o.color === q.answer.color &&
    o.mirrored === q.answer.mirrored;
  const ansIdx = q => q.options.findIndex(o => isAns(q, o));
  const wrongIdx = q => q.options.findIndex(o => !isAns(q, o));

  /* ---- ① 40 关全量审计（flat 0-39） ---- */
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1.quizzes) === JSON.stringify(L2.quizzes);   // 确定性
    let ruleOk = true, structAll = true, dchOk = true, driveOk = true, srcOk = true;
    if (L1.ch !== Math.floor(flat / CH_LEN) + 1 || L1.dch !== (L1.ch - 1) % 4 + 1) dchOk = false;
    const srcSeen = {};
    for (let k = 0; k < L1.quizzes.length; k++) {
      const q = L1.quizzes[k];
      if (!structOk(q, L1.dch)) structAll = false;
      midHist[q.mid] = (midHist[q.mid] || 0) + 1;
      srcSeen[q.src.r + '-' + q.src.c] = (srcSeen[q.src.r + '-' + q.src.c] || 0) + 1;
      const orig = q.options.filter(o => !o.mirrored);
      if (L1.dch === 1) {                                    // 章 1：竖轴 4×4 对称图案全原形
        if (L1.axis !== 'v' || L1.N !== 4) ruleOk = false;
        if (q.options.some(o => SYM_KEYS.indexOf(o.mid) < 0)) ruleOk = false;
        if (q.options.filter(o => o.mid !== q.mid).length !== 2) ruleOk = false;
      } else if (L1.dch === 2) {                             // 章 2：竖轴 4×4 [镜像,原形,异图案]
        if (L1.axis !== 'v' || L1.N !== 4) ruleOk = false;
        if (orig.length !== 1 || orig[0].mid !== q.mid || orig[0].color !== q.color) ruleOk = false;
        const third = q.options.filter(o => o !== q.answer && o.mirrored);
        if (third.length !== 1 || third[0].mid === q.mid) ruleOk = false;
      } else if (L1.dch === 3) {                             // 章 3：竖轴 5×5 形×色双维
        if (L1.axis !== 'v' || L1.N !== 5) ruleOk = false;
        if (orig.length !== 1 || orig[0].mid !== q.mid || orig[0].color !== q.color) ruleOk = false;
        const third = q.options.filter(o => o !== q.answer && o.mirrored);
        if (third.length !== 1 || third[0].mid !== q.mid || third[0].color === q.color) ruleOk = false;
      } else {                                               // 章 4：轴/规格混合（静态 lv 定/生成 rnd 定）
        if (L1.axis !== 'v' && L1.axis !== 'h') ruleOk = false;
        if (L1.N !== 4 && L1.N !== 5) ruleOk = false;
        if (flat < STATIC_LEVELS) {                          // 静态：lv 偶=横轴 lv 奇=竖轴 / lv<3=4 else 5
          if (L1.axis !== (L1.lv % 2 === 0 ? 'h' : 'v')) ruleOk = false;
          if (L1.N !== (L1.lv < 3 ? 4 : 5)) ruleOk = false;
        }
        if (orig.length !== 1 || orig[0].mid !== q.mid || orig[0].color !== q.color) ruleOk = false;
        const third = q.options.filter(o => o !== q.answer && o.mirrored);
        if (third.length !== 1 || third[0].mid === q.mid) ruleOk = false;
      }
    }
    axisHist[L1.axis] = (axisHist[L1.axis] || 0) + 1;
    sizeHist[L1.N] = (sizeHist[L1.N] || 0) + 1;
    if (Object.keys(srcSeen).length !== CH_LEN) srcOk = false;   // 5 源格互异
    /* 引擎直驱：每题贴正确卡（末题 done）→ 0 错 3 星 */
    for (let k = 0; k < L1.quizzes.length && driveOk; k++) {
      const q = L1.quizzes[k];
      const r = engTap(L1, correctIdx(q));
      const want = k === L1.quizzes.length - 1 ? 'done' : 'right';
      if (r !== want) driveOk = false;
    }
    const solvedAll = L1.done && L1.step === CH_LEN && L1.retries === 0 && engStars(L1) === 3;
    const ok = det && L1.quizzes.length === CH_LEN && ruleOk && structAll && dchOk &&
      driveOk && solvedAll && srcOk;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, axis: L1.axis, N: L1.N, ok: ok, det: det, ruleOk: ruleOk,
      structAll: structAll, dchOk: dchOk, driveOk: driveOk, srcOk: srcOk, solvedAll: solvedAll,
      qs: L1.quizzes.map(q => q.axis + q.N + ':' + q.src.r + ',' + q.src.c + '→' +
        q.dst.r + ',' + q.dst.c + ' ' + q.mid + '(' + q.options.map(o =>
          o.mid + (o.mirrored ? '*' : '') + '/' + o.color.slice(1)).join('|') + ')') };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② 覆盖：图案库全用 / 两轴 / 两规格 ---- */
  total++;
  const coverOk = SYM_KEYS.every(m => midHist[m] >= 1) && ASYM_KEYS.every(m => midHist[m] >= 1) &&
    midHist[SYM_KEYS[0]] >= 1 && (axisHist.v || 0) >= 1 && (axisHist.h || 0) >= 1 &&
    (sizeHist[4] || 0) >= 1 && (sizeHist[5] || 0) >= 1;
  if (coverOk) npass++;
  units.cover = { ok: coverOk, mid: midHist, axis: axisHist, size: sizeHist };

  /* ---- ③ 镜像数学专项：dst=src 镜像位（竖 col N-1-c / 横 row N-1-r）+ 两侧分布 ---- */
  total++;
  let mathOk = true;
  for (let flat = 0; flat < 40; flat++) {
    const L = genLevel(flat), half = Math.floor(L.N / 2);
    for (const q of L.quizzes) {
      const wantR = q.axis === 'v' ? q.src.r : L.N - 1 - q.src.r;
      const wantC = q.axis === 'v' ? L.N - 1 - q.src.c : q.src.c;
      if (q.dst.r !== wantR || q.dst.c !== wantC) mathOk = false;   // dst 坐标=镜像数学
      if (q.axis === 'v' ? !(q.src.c < half && q.dst.c >= half)
                         : !(q.src.r < half && q.dst.r >= half)) mathOk = false;   // 源侧/镜像侧
    }
  }
  if (mathOk) npass++;
  units.mirrorMath = { ok: mathOk };

  /* ---- ④ 点选单元：首错零惩罚不 pulse / 灰卡 pointer-events:none + 'again' / 二错 pulse ---- */
  total++;
  startLevel(0);
  const q0 = MIR.quiz;
  const wIdx = wrongIdx(q0);
  const tIdx = ansIdx(q0);
  const noPulse1 = !(optEl(tIdx) && optEl(tIdx).classList.contains('pulse'));
  const r1 = await MIR.tapOption(wIdx);                      // 首错：灰掉零惩罚
  await wait(80);
  const greyEl = optEl(wIdx);
  const peNone = getComputedStyle(greyEl).pointerEvents === 'none';
  const missState = MIR.currentLevel.retries === 1 && MIR.currentLevel.step === 0;
  const r2 = await MIR.tapOption(wIdx);                      // 再点已灰卡：'again' 零惩罚
  const againOk = r2 === 'again' && MIR.currentLevel.retries === 1 && MIR.currentLevel.step === 0;
  const noPulse2 = !(optEl(tIdx) && optEl(tIdx).classList.contains('pulse'));   // 一错后仍不 pulse
  const r3 = await MIR.tapOption(tIdx);                      // 贴对：推进换题（仍在 flat0）
  await wait(200);                                           // 推进演出窗（SPEED 提速）
  const advOk = r3 === 'right' && MIR.currentLevel.step === 1 && MIR.quiz && MIR.quiz.step === 1;
  startLevel(5);                                             // dch2：3 张候选可二错
  const q5 = MIR.quiz;
  const wrongs5 = q5.options.map((o, i) => ({ o: o, i: i })).filter(x => !isAns(q5, x.o));
  const tp5 = ansIdx(q5);
  await MIR.tapOption(wrongs5[0].i);                         // 首错：不 pulse
  const noPulse3 = !(optEl(tp5) && optEl(tp5).classList.contains('pulse'));
  await MIR.tapOption(wrongs5[1].i);                         // 二错：正确卡 pulse 高亮
  const pulse2 = !!(optEl(tp5) && optEl(tp5).classList.contains('pulse'));
  const tapOk = noPulse1 && r1 === 'wrong' && peNone && missState && againOk && noPulse2 &&
    advOk && noPulse3 && pulse2;
  if (tapOk) npass++;
  units.tap = { ok: tapOk, wrong: r1, peNone: peNone, again: r2, pulse2: pulse2, advance: advOk };

  /* ---- ⑤ sayW 节流：flat<3 每错必播 / flat≥3 10s 一条 ---- */
  total++;
  let playLog = [];
  const origPlay = KIDS.voice.play;
  KIDS.voice.play = function (key) { playLog.push(key); };
  startLevel(0);                                             // flat0：每错必播
  const qw = MIR.quiz;
  const wi = wrongIdx(qw);
  playLog = [];
  await MIR.tapOption(wi);
  await MIR.tapOption(wi);                                   // 已灰卡=again 不播
  const sayA = playLog.filter(k => k === 'mir_wrong').length;    // flat0 一错 → 1 条
  lastWrongVoice = 0;                                        /* 隔离 ④ 单元错点的时间戳污染 */
  startLevel(3);                                             // flat3：10s 节流
  const qw3 = MIR.quiz;
  const wi3 = wrongIdx(qw3);
  playLog = [];
  const rw1 = await MIR.tapOption(wi3);
  startLevel(3);                                             // 重发同关（首卡未灰）
  const qw3b = MIR.quiz;
  const wi3b = wrongIdx(qw3b);                               // 重发后 dead 已清，首错卡可直接再点
  const rw2 = await MIR.tapOption(wi3b);
  const sayB = playLog.filter(k => k === 'mir_wrong').length;    // flat3 两错 → 1 条
  KIDS.voice.play = origPlay;
  const sayWOk = sayA === 1 && sayB === 1 && rw1 === 'wrong' && rw2 === 'wrong';
  if (sayWOk) npass++;
  units.sayW = { ok: sayWOk, flat0Plays: sayA, flat3Plays: sayB };

  /* ---- ⑥ 开场顺序链（按轴取竖/横题面 clip）+ replay() 直通 ---- */
  total++;
  const qLog = [];
  const origQueue = KIDS.voice.queue;
  KIDS.voice.queue = function (parts) { qLog.push(parts.slice()); };
  startLevel(2);                                             // dch1 竖轴
  const autoV = qLog.length === 1 && qLog[0][0] === 'mir_hint' && qLog[0][1] === 'mir_q_v';
  const rep1 = MIR.replay() === true;                        // 测试钩子：无视节流直通
  startLevel(15);                                            // dch4 lv0 横轴
  const autoH = qLog.length === 2 && qLog[1][0] === 'mir_hint' && qLog[1][1] === 'mir_q_h';
  KIDS.voice.queue = origQueue;
  KIDS.voice.play = origPlay;
  const chainOk = autoV && autoH && rep1;
  if (chainOk) npass++;
  units.chain = { ok: chainOk, logs: qLog };

  /* ---- ⑥b clips 注入对账（审查 M1：stub play 后缺 clip 无感，页面级兜底） ---- */
  total++;
  const MIR_KEYS = ['core_chapter_end', 'core_day_end', 'core_rest',
    'mir_hint', 'mir_q_h', 'mir_q_v', 'mir_tut_turn', 'mir_tut_watch'];
  const mirClipOk = MIR_KEYS.every(k => !!KIDS.voice.clips[k]);
  if (mirClipOk) npass++;
  units.clips = { ok: mirClipOk, n: MIR_KEYS.length };

  /* ---- ⑦ 候选卡与引擎严格同源（DOM dataset==引擎 options，零手抄） ---- */
  total++;
  let domOk = true;
  for (const flat of [0, 10]) {
    startLevel(flat);
    for (let s = 0; s < 2; s++) {                            // 抽查每关前两题
      const q = MIR.quiz;
      if (!q) break;
      const cards = optsEl.querySelectorAll('.opt');
      if (cards.length !== q.options.length) domOk = false;
      cards.forEach((c, i) => {
        if (c.dataset.mid !== q.options[i].mid ||
            c.dataset.mir !== (q.options[i].mirrored ? '1' : '0')) domOk = false;
      });
      /* 目标格在板面 DOM 在场且坐标=引擎 dst（4×4 偶数 N 曾把镜像列误当轴跳过——回归断言） */
      const tCell = boardEl.querySelector('.cell.target');
      if (!tCell || tCell.dataset.k !== q.dst.r + '-' + q.dst.c) domOk = false;
      /* 源侧 5 贴纸 + 中轴镜线在场 */
      if (boardEl.querySelectorAll('.cell.src').length !== CH_LEN || !boardEl.querySelector('.mirror'))
        domOk = false;
      if (s === 0) await MIR.tapOption(ansIdx(q));          // 推进到第二题
      await wait(150);
    }
  }
  if (domOk) npass++;
  units.domText = { ok: domOk };

  /* ---- ⑧ 教学/演出吞输入单元：demo+locked 门拦真实与钩子输入 ---- */
  total++;
  startLevel(0);
  state.demo = true; state.locked = true;                    // 模拟教学"看"演示期（locked 吞输入）
  const swallow1 = (await MIR.tapOption(0)) === false;
  state.demo = false; state.locked = true;                   // 演出窗口（locked）
  const swallow2 = (await MIR.tapOption(0)) === false;
  state.locked = false;                                      // 还原
  const swallowOk = swallow1 && swallow2 && MIR.currentLevel.step === 0;
  if (swallowOk) npass++;
  units.swallow = { ok: swallowOk, demo: swallow1, locked: swallow2 };

  /* ---- ⑨ 布局：双 viewport 模拟 × 四代表关（v4/v5/h4/h5） ---- */
  function simView(w, h) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    renderQuiz();
    const de = document.documentElement;
    const bad = [];
    document.querySelectorAll('button').forEach(e => {
      if (e.classList.contains('k-parentbtn')) return;       // core 家长按钮豁免（§0.9）
      const r = e.getBoundingClientRect();
      if (r.width > 4 && r.height > 4 && (r.width < 64 || r.height < 64))
        bad.push((e.id || e.className) + ':' + Math.round(r.width) + 'x' + Math.round(r.height));
    });
    const mainBad = [];
    document.querySelectorAll('.opt').forEach(e => {
      const r = e.getBoundingClientRect();
      if (r.width < 96 || r.height < 96)
        mainBad.push((e.id || e.className) + ':' + Math.round(r.width) + 'x' + Math.round(r.height));
    });
    const svgs = Array.prototype.map.call(document.querySelectorAll('.opt svg, #board .cell svg'),
      s => { const r = s.getBoundingClientRect(); return { w: r.width, h: r.height }; });
    const svgOk = svgs.length > 0 && svgs.every(a => a.w >= 64 && a.h >= 64);   // 图案 SVG ≥64
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, bad: bad, mainBad: mainBad, svgOk: svgOk, ox: ox,
      pass: !bad.length && !mainBad.length && svgOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const flat of [0, 10, 15, 19]) {                      // 四代表关：v4 / v5 / h4 / h5
    startLevel(flat);
    sims.push(simView(1280, 800));
    sims.push(simView(800, 1180));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                             // 还原真实 viewport 布局
  const layoutOk = sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑩ UI 冒烟 A：flat0 首错零惩罚 + 通关（1 错=2 星） ---- */
  total++;
  startLevel(0);
  let smokeA = true, wrongDone = false, steps = 0;
  for (let s = 0; s < CH_LEN && smokeA; s++) {
    const q = MIR.quiz;
    if (!q) { smokeA = false; break; }
    if (!wrongDone) {                                        // 首题先错一次：灰掉零惩罚不推进
      const r = await MIR.tapOption(wrongIdx(q));
      wrongDone = r === 'wrong' && MIR.currentLevel.step === 0 && MIR.currentLevel.retries === 1;
      if (!wrongDone) smokeA = false;
    }
    const q2 = MIR.quiz;
    const r = await MIR.tapOption(ansIdx(q2));
    if (r !== 'right' && r !== 'done') { smokeA = false; break; }
    await wait(150);
    steps++;
  }
  const lvA = MIR.currentLevel;
  const smokeOkA = smokeA && wrongDone && steps === CH_LEN && lvA.done && lvA.won &&
    lvA.retries === 1 && engStars(cur) === 2 && !document.querySelector('.k-celebrate');   // verify 页不弹层
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, wrongDone: wrongDone, steps: steps, retries: lvA.retries, stars: engStars(cur) };

  /* ---- ⑩ UI 冒烟 B：flat15（章 4 横轴）autoSolve UI 通路通关 3 星 ---- */
  total++;
  startLevel(15);
  const a15 = await MIR.autoSolve();
  const lv15 = MIR.currentLevel;
  const smokeOkB = cur.axis === 'h' && a15.done && lv15.done && lv15.won && lv15.retries === 0 &&
    engStars(cur) === 3;
  if (smokeOkB) npass++;
  smokes.flat15 = { ok: smokeOkB, axis: cur.axis, taps: a15.taps, stars: engStars(cur) };

  const out = { game: 'mirror', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  runVerify();
}

</script>
</body>
</html>
