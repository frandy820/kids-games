<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>火柴谜题</title>
<style>
/* ================= 火柴谜题 matchstick（batch15）=================
   视觉按 SPEC-BATCH15 §3：暖米底 #FBF3E4、七段火柴数字（暖木色杆+红磷头，
   横段头朝左/竖段头朝上统一）、空槽=虚线框、拿起=浮起+阴影。
   主交互=点火柴（拿起）→点目标虚线槽（放置即判，无确认键）：
   成立=火焰粒子+胜利 / 不成立=晃动零惩罚火柴回原位可再移（miss 计浪费移动）。
   触摸目标：火柴/槽透明命中矩形 ≥64（tangram M5 先例：几何外扩+
   elementFromPoint 采样验证）；底栏按钮 ≥72 高；不灰化款 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:4px 10px}

/* ---------- 题面行 ---------- */
#board{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  min-height:72px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:14px;padding:6px 24px;border-radius:22px;
  background:#FFFAF0;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #DFCFB6}
#prompt-chip .mini{width:54px;height:54px;flex:0 0 54px}
#prompt-chip .ask{font-size:26px;font-weight:800;color:#4A3B2E;letter-spacing:.02em}

/* ---------- 场景区：七段火柴等式 SVG（JS 按容器实测 px 布局，保命中 ≥64） ---------- */
#scene-area{flex:1 1 auto;min-height:260px;width:100%;max-width:1100px;display:flex;
  align-items:center;justify-content:center;padding:2px 6px}
#scene{width:100%;height:100%;min-height:260px;display:flex;align-items:center;justify-content:center}
#scene svg.eq{display:block}

/* 火柴杆/头/命中矩形（hit 透明填充吃指针；locked 等号 hit 不响应） */
#scene .stk .rod{fill:#D9A15E;stroke:#8A6B45;stroke-width:1.6}
#scene .stk .head{fill:#E05548;stroke:#A93B31;stroke-width:1.6}
#scene .stk .hit{fill:transparent;stroke:none;pointer-events:all}
#scene .stk.locked .hit{pointer-events:none}
#scene .slot .gh{fill:none;stroke:#C9B69B;stroke-width:2;stroke-dasharray:6 5;pointer-events:none}
#scene .slot .hit{fill:transparent;stroke:none;pointer-events:all}
#scene .slot.hot .gh{stroke:#E8873A;stroke-width:2.6;stroke-dasharray:7 5;
  animation:slot-hot 1.1s ease-in-out infinite}
@keyframes slot-hot{0%,100%{opacity:.55}50%{opacity:1}}
/* 拿起态：内层 mov 浮起+阴影（CSS transform 不碰外层定位 attribute transform） */
#scene .stk .mov{transition:transform .18s ease,filter .18s ease}
#scene .stk.held .mov{transform:translateY(-13px) scale(1.07);filter:drop-shadow(0 7px 7px rgba(74,59,46,.4))}
#scene .stk.lit .mov{animation:stk-lit .5s ease-in-out infinite alternate}
@keyframes stk-lit{from{filter:drop-shadow(0 0 2px rgba(232,135,58,0))}to{filter:drop-shadow(0 0 9px rgba(232,135,58,.95))}}
/* 救援：可解源火柴 pulse 三连（§0.21；作用于内层 .mov——外层是 attribute transform 定位） */
#scene .stk.pulse3 .mov{animation:stk-pulse3 1.5s ease}
@keyframes stk-pulse3{0%,33.3%,66.6%,100%{transform:scale(1)}16.6%,49.9%,83.2%{transform:scale(1.2)}}
/* 等式整体晃动（放置不成立，§0.26 防重入窗内） */
#scene svg.eq.shake{animation:eq-shake .5s ease}
@keyframes eq-shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}
  38%{transform:translateX(8px)}58%{transform:translateX(-6px)}78%{transform:translateX(5px)}}
/* 成立：等式亮起（背景板转暖绿+杆辉光） */
#scene svg.eq.ok .panel{fill:#EDF6E3;stroke:#8FBF7F}
#scene svg.eq.ok .stk .rod{fill:#C9CE9A}
#scene .fx circle{fill:#F5A623;stroke:none}
#scene .fx .f2{fill:#E8703A}
#scene .fx .f3{fill:#F8D494}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 blocks/numberdet） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：题面/场景适配 */
@media (orientation:portrait){
  #prompt-chip .ask{font-size:22px}
  #prompt-chip .mini{width:46px;height:46px;flex:0 0 46px}
  #scene-area{min-height:300px}
}
</style>
</head>
<body>
<div id="game" aria-label="火柴谜题">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
    </div>
    <div id="scene-area">
      <div id="scene" aria-label="火柴算式"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

   SEG[i] = 第 i 段的段名；SEGSET[d] = 数字 d 点亮的段名集合 ---------- */
const SEG = ['a', 'b', 'c', 'd', 'e', 'f', 'g'];
const SEGSET = {
  0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc',
  5: 'afgcd', 6: 'afgcde', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg'
};
/* 段名 → 段下标 */
const SEGIDX = {}; SEG.forEach((s, i) => { SEGIDX[s] = i; });
/* 数字 → 7 位布尔数组（[a,b,c,d,e,f,g]）；渲染真值源 */
function segBools(d) {
  const on = [false, false, false, false, false, false, false];
  const s = SEGSET[d];
  for (let i = 0; i < s.length; i++) on[SEGIDX[s[i]]] = true;
  return on;
}
/* 7 位布尔数组 → 数字（恰为某数字段集返回该数字，否则 null；判定真值源） */
function boolDigit(on) {
  for (let d = 0; d <= 9; d++) {
    const ref = segBools(d);
    let same = true;
    for (let i = 0; i < 7; i++) if (ref[i] !== !!on[i]) { same = false; break; }
    if (same) return d;
  }
  return null;
}

/* ---------- 七段几何（JS 按容器实测 px 布局；渲染与命中共用同一组数）
   digit cell 宽 W 高 H=2.06W，杆厚 t=0.15W：
   横杆（a/g/d）长 Lh=W-1.7t 居中；竖杆（f/b/e/c）半长 Lv=H/2-1.35t，
   中心 x：f/e=t*0.55（左）、b/c=W-t*0.55（右）；中心 y：f/b=H*0.25、e/c=H*0.75
   命中矩形（M5 先例）：沿杆向=杆长+8，垂直向恒 64（外扩后两向均 ≥64） */
const HIT = 68;                                  // 命中矩形垂直向（px，§0.9；68 留浮点余量保 ≥64）
function digitGeo(W) {
  const H = 2.06 * W, t = 0.15 * W;
  const Lh = W - 1.7 * t, Lv = H / 2 - 1.35 * t;
  return {
    W: W, H: H, t: t, Lh: Lh, Lv: Lv,
    pos: {                                    // 各段中心（cell 局部坐标）
      a: [W / 2, t * 0.55], g: [W / 2, H / 2], d: [W / 2, H - t * 0.55],
      f: [t * 0.55, H * 0.25], b: [W - t * 0.55, H * 0.25],
      e: [t * 0.55, H * 0.75], c: [W - t * 0.55, H * 0.75]
    },
    hz: ['a', 'g', 'd'], vt: ['f', 'b', 'e', 'c']
  };
}
/* 运算符/等号几何：杆长 opL（+/-用）、eqL（=两横用），=双横 y 偏移 ±eqGap
   opL≥78：加号横竖交叉区后画者覆盖，杆端须露出命中带（(opL+8)/2-34≥5）保各自可点 */
function opGeo(W) {
  return { opL: Math.max(78, W * 0.56), eqL: Math.max(76, W * 0.56), eqGap: Math.max(20, W * 0.22) };
}

/* ---------- 火柴 SVG（横杆：红头朝左统一；竖杆：红头朝上统一 §3）
   局部坐标一律横向建模：中心 (0,0)，杆 [-len/2, len/2]×[-t/2,t/2]，头在左端；
   竖杆整组 rotate(90)（左端→正上方）；命中矩形与杆同局部方位（沿杆 len+8 × 垂直 64），
   随组同旋 → 页面两向恒 ≥64（沿杆 len+8≥64 由布局 W≥92 保证） ---------- */
function stickBody(len, t) {
  const hl = len / 2, hw = t * 1.18, hh = t * 1.32;   // 头略长略厚于杆
  return '<rect class="rod" x="' + (-hl) + '" y="' + (-t / 2) + '" width="' + len + '" height="' + t +
    '" rx="' + (t / 2) + '"/>' +
    '<rect class="head" x="' + (-hl - hw * 0.28) + '" y="' + (-hh / 2) + '" width="' + hw + '" height="' + hh +
    '" rx="' + (t * 0.42) + '"/>';
}
/* 命中矩形（横局部：沿杆 len+8 × 垂直 HIT，中心对齐） */
function hitRect(len) {
  const hl = len / 2;
  return '<rect class="hit" x="' + (-hl - 4) + '" y="' + (-HIT / 2) + '" width="' + (hl * 2 + 8) + '" height="' + HIT + '"/>';
}
/* 完整火柴组（外层定位 translate(cx,cy)[ rotate(90)]，内层 .mov 承接拿起浮起 CSS） */
function stickSvg(cx, cy, segName, len, t, vertical, extraCls, slotId) {
  const rot = vertical ? ' rotate(90)' : '';
  return '<g class="stk' + (extraCls ? ' ' + extraCls : '') + '" data-slot="' + slotId + '" data-seg="' + segName + '"' +
    ' transform="translate(' + cx + ',' + cy + ')' + rot + '">' +
    '<g class="mov">' + stickBody(len, t) + '</g>' + hitRect(len) +
    '</g>';
}
/* 空槽组：虚线框（可视 gh + 透明命中矩形 hit）；extraCls 供 hot 态 */
function slotSvg(cx, cy, segName, len, t, vertical, extraCls, slotId) {
  const hl = len / 2;
  const inner = '<rect class="gh" x="' + (-hl) + '" y="' + (-t / 2) + '" width="' + len + '" height="' + t +
    '" rx="' + (t / 2) + '"/>';
  const rot = vertical ? ' rotate(90)' : '';
  return '<g class="slot' + (extraCls ? ' ' + extraCls : '') + '" data-slot="' + slotId + '" data-seg="' + segName + '"' +
    ' transform="translate(' + cx + ',' + cy + ')' + rot + '">' + inner + hitRect(len) + '</g>';
}

    '<path d="M13 34 L27 48 L51 18" stroke="#FFF" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  /* 题面小图标：两根火柴交叉（题面卡左侧视觉锚点，与场景同几何语言） */
  msMini: '<svg viewBox="0 0 58 58" xmlns="http://www.w3.org/2000/svg" fill="none">' +
    '<g transform="rotate(-38 29 29)">' +
    '<rect x="12" y="26" width="34" height="7" rx="3.5" fill="#D9A15E" stroke="' + INK + '" stroke-width="2"/>' +

    '<rect x="12" y="26" width="34" height="7" rx="3.5" fill="#D9A15E" stroke="' + INK + '" stroke-width="2"/>' +
    '<rect x="9.5" y="24.2" width="9.5" height="10.6" rx="3.6" fill="#E05548" stroke="' + INK + '" stroke-width="2"/></g></svg>'
};
/* ================= matchstick 纯引擎：七段段集判定 + 确定性反向构造生成 + 拿放判定（无 DOM）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   数据模型（SPEC-BATCH15 §3）：cells 段位数组——
     {kind:'d',  segs:[bool×7]}  数字位（段序 a..g，SEGSET 真值源）
     {kind:'op', segs:[bool×2]}  加减号位（[横,竖]：[1,1]='+',[1,0]='-'；[0,*]/[*,1] 无横=非法符号）
     {kind:'eq', segs:[true,true]} 等号位（2 横，固定不可移不可放，防无解域扩大 §3）
   布局恒为 A op B = C：[d+][op][d+][eq][d+]（A/B 一或两位，C 一或两位，段元 ≤4+2）
   槽位编址 slotId = cellIdx*8 + segIdx（数字 0-6 / 符号 0-1；等号不可编址）
   有解性（§0.30 命门）：谜面=从合法等式反向移 1 根构造——
     reversePuzzle：合法 cells 洗牌选一根 ON 段移走 → 洗牌试放全部空槽，
     恰使式"可读且不成立"者为谜面（天然有解=移回原处；verify 侧独立穷举复算）
   判定（engPick/engPlace）：
     'held' 拿起 / 'back' 放回原位（零惩罚不计 miss）/ 'right'/'done' 成立推进 /
     'wrong' 不成立（浪费移动计 miss，火柴回原位可再移）/ null 非法
   星级：0 错=3★ / 1-2 错=2★ / 更多=1★（拿起/放回中间态零惩罚 §3） */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
const pick = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];
/* 进度章号单调递增；难度章号：静态关 (ch-1)%4 循环，生成关随机 1-4（§0.3） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- cells 构造与求值（段集表 SEGSET 为唯一真值源，game-data.js） ---------- */
function mkDigit(d) { return { kind: 'd', segs: segBools(d) }; }
function mkOp(op) { return { kind: 'op', segs: [true, op === '+'] }; }
function mkEq() { return { kind: 'eq', segs: [true, true] }; }
/* 数字串（十进制）→ 数字 cells；'10' → [1,0]（含 1x 前导段位，§3 ch3） */
function mkNum(n) { return String(n).split('').map(ch => mkDigit(Number(ch))); }
/* 合法等式 → cells：A op B = C */
function eqCells(A, op, B, C) {
  return mkNum(A).concat([mkOp(op)], mkNum(B), [mkEq()], mkNum(C));
}
function cloneCells(cells) { return cells.map(c => ({ kind: c.kind, segs: c.segs.slice() })); }
const serCells = cells => cells.map(c => c.kind + c.segs.map(v => v ? 1 : 0).join('')).join('|');

/* 求值：可读（每位恰为某数字段集+符号有横）才 valid；ok = valid 且左=右
   返回 { valid, ok, left, right }（不可读/不成立时 left/right=null）
   相位机：0 读 A（数字）→ 遇 op（仅相位 0，须有横）→ 1 读 B → 遇 eq（仅相位 1）→ 2 读 C */
function evalCells(cells) {
  let phase = 0, nums = [0, 0, 0], op = null, hasOp = false, valid = true;
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.kind === 'd') {
      const d = boolDigit(c.segs);
      if (d == null) { valid = false; break; }
      nums[phase] = nums[phase] * 10 + d;
    } else if (c.kind === 'op') {
      if (hasOp || phase !== 0 || !c.segs[0]) { valid = false; break; }   // 孤竖/空/重复符号=非法
      op = c.segs[1] ? '+' : '-';
      hasOp = true; phase = 1;
    } else {                                          // eq
      if (phase !== 1) { valid = false; break; }      // 等号必须在符号与 B 之后
      phase = 2;
    }
  }
  const bad = { valid: false, ok: false, left: null, right: null, A: null, B: null, C: null, op: null };
  if (!valid || !hasOp || phase !== 2) return bad;
  const left = op === '+' ? nums[0] + nums[1] : nums[0] - nums[1];
  return { valid: true, ok: left === nums[2], left: left, right: nums[2],
    A: nums[0], B: nums[1], C: nums[2], op: op };
}

/* ---------- 槽位工具（slotId = cellIdx*8 + segIdx；等号不可编址） ---------- */
function onSlots(cells) {                            // 全部 ON 段（等号除外）
  const out = [];
  for (let i = 0; i < cells.length; i++) {
    if (cells[i].kind === 'eq') continue;
    for (let j = 0; j < cells[i].segs.length; j++) if (cells[i].segs[j]) out.push(i * 8 + j);
  }
  return out;
}
function emptySlots(cells) {                         // 全部空槽（等号除外）
  const out = [];
  for (let i = 0; i < cells.length; i++) {
    if (cells[i].kind === 'eq') continue;
    for (let j = 0; j < cells[i].segs.length; j++) if (!cells[i].segs[j]) out.push(i * 8 + j);
  }
  return out;
}
/* 应用一次移动（就地改 cells；调用方负责快照/还原） */
function applyMove(cells, src, dst) {
  cells[Math.floor(src / 8)].segs[src % 8] = false;
  cells[Math.floor(dst / 8)].segs[dst % 8] = true;
}
function isOpSlot(cells, s) { return cells[Math.floor(s / 8)].kind === 'op'; }

/* ---------- 穷举一解（救援/教学/autoSolve 共用；verify 侧另写独立穷举 §0.30） ---------- */
function engSolve(cells) {
  const out = [];
  const srcs = onSlots(cells);
  for (let a = 0; a < srcs.length; a++) {
    const src = srcs[a];
    const si = Math.floor(src / 8), sj = src % 8;
    cells[si].segs[sj] = false;                      // 移走源杆
    const dsts = emptySlots(cells);                  // 含 src 原槽（下方跳过）
    for (let b = 0; b < dsts.length; b++) {
      const dst = dsts[b];
      if (dst === src) continue;
      const di = Math.floor(dst / 8), dj = dst % 8;
      cells[di].segs[dj] = true;
      const ev = evalCells(cells);
      cells[di].segs[dj] = false;                    // 还原放置
      if (ev.valid && ev.ok) out.push({ src: src, dst: dst });
      if (out.length >= 24) { cells[si].segs[sj] = true; return out; }   // 救援/演示只需少量
    }
    cells[si].segs[sj] = true;                       // 还原源杆
  }
  return out;
}

/* ---------- 谜面数值域（引擎侧；verify 侧 refDomainOk 独立同规复算）
   约束的是谜面结构域（符号/位数/值域），不要求成立（谜面必不成立）：
   ch1 '+' A,B∈2-9 C≤10 / ch2 '-' A∈5-9 B∈1..A-1 C≤9 /
   ch3 A/C 恰一两位（'+' C∈10-19；'-' A∈10-19 C≤9）/ ch4 一位数混合（C≤10） ---------- */
function domainOk(dch, cells) {
  const ev = evalCells(cells);
  if (!ev.valid) return false;
  const nD = cells.filter(c => c.kind === 'd').length;
  if (nD < 3 || nD > 4) return false;                 // 布局界：A op B = C 段元 ≤4
  if (dch === 1) return ev.op === '+' && ev.A >= 2 && ev.A <= 9 && ev.B >= 2 && ev.B <= 9 && ev.C <= 10;
  if (dch === 2) return ev.op === '-' && ev.A >= 5 && ev.A <= 9 && ev.B >= 1 && ev.B < ev.A && ev.C <= 9;
  if (dch === 3) {
    const aTwo = ev.A >= 10, cTwo = ev.C >= 10;
    if (aTwo === cTwo) return false;                  // A/C 恰一为两位（§3）
    if (ev.op === '+') return ev.A >= 2 && ev.A <= 9 && ev.B >= 2 && ev.B <= 9 && ev.C >= 10 && ev.C <= 19;
    return ev.A >= 10 && ev.A <= 19 && ev.B >= 2 && ev.B <= 9 && ev.C <= 9;
  }
  if (ev.A < 2 || ev.A > 9 || ev.C > 10) return false;
  return ev.op === '+' ? (ev.B >= 2 && ev.B <= 9) : (ev.B >= 1 && ev.B <= 9 && ev.B < ev.A);
}

/* ---------- 反向构造（§0.30 命门）：合法 cells → 移 1 根使"可读且不成立"的谜面
   opAllowed=false 时源/目标都限数字段（ch1-3 "数字间移动" §3，符号保持原样）；
   preferOp=true 时优先尝试符号竖杆为源（ch4 运算符参与构造）；
   返回 { cells, solution:{src,dst} } 或 null（全空槽试尽仍成立/无可读 false 放法） */
function reversePuzzle(rnd, legal, opAllowed, preferOp) {
  let srcs = onSlots(legal).filter(s => opAllowed || !isOpSlot(legal, s));
  if (preferOp) {                                     // 符号竖杆排前（相对序保持）
    const ops = srcs.filter(s => isOpSlot(legal, s) && (s % 8) === 1);
    const rest = srcs.filter(s => !(isOpSlot(legal, s) && (s % 8) === 1));
    srcs = ops.concat(rest);
  } else srcs = shuffled(srcs, rnd);
  for (let a = 0; a < srcs.length; a++) {
    const src = srcs[a];
    const si = Math.floor(src / 8), sj = src % 8;
    legal[si].segs[sj] = false;
    const dsts = shuffled(emptySlots(legal), rnd).filter(s => opAllowed || !isOpSlot(legal, s));
    for (let b = 0; b < dsts.length; b++) {
      const dst = dsts[b];
      if (dst === src) continue;
      const di = Math.floor(dst / 8), dj = dst % 8;
      legal[di].segs[dj] = true;
      const ev = evalCells(legal);
      if (ev.valid && !ev.ok) {
        const cells = cloneCells(legal);              // 谜面快照（含已放的 dst）
        const solution = { src: dst, dst: src };      // 谜面上的解=把 dst 处的火柴移回 src
        legal[di].segs[dj] = false;                   // 还原合法式供外层继续
        legal[si].segs[sj] = true;
        return { cells: cells, solution: solution };
      }
      legal[di].segs[dj] = false;
    }
    legal[si].segs[sj] = true;
  }
  return null;
}

/* ---------- 各章合法等式域（SPEC §3 数值域） ---------- */
function genLegal(dch, rnd) {
  let A, B, C, op;
  if (dch === 1) {                                    // ch1 加法：A,B∈2-9，C≤10
    op = '+'; A = ri(rnd, 2, 9); B = ri(rnd, 2, 9);
    while (A + B > 10) { A = ri(rnd, 2, 9); B = ri(rnd, 2, 9); }
    C = A + B;
  } else if (dch === 2) {                             // ch2 减法：A∈5-9；族数字偏好（6/9/5/2/3）
    op = '-'; A = ri(rnd, 5, 9); B = ri(rnd, 1, A - 1); C = A - B;
    let tries = 0;                                    // 偏好重抽：A/B/C 含族数字即收
    const fam = [2, 3, 5, 6, 9];
    while (![A, B, C].some(v => fam.indexOf(v) >= 0) && tries++ < 8) {
      A = ri(rnd, 5, 9); B = ri(rnd, 1, A - 1); C = A - B;
    }
  } else if (dch === 3) {                             // ch3 两位数参与（A 或 C 恰一为两位）
    if (rnd() < 0.5) {                                // α：加法，C 两位（11-18）
      op = '+'; A = ri(rnd, 2, 9); B = ri(rnd, 2, 9);
      while (A + B < 11) { A = ri(rnd, 2, 9); B = ri(rnd, 2, 9); }
      C = A + B;
    } else {                                          // β：减法，A 两位（11-18），C 一位
      op = '-'; A = ri(rnd, 11, 18); B = ri(rnd, 2, 9);
      while (A - B > 9 || A - B < 1) { A = ri(rnd, 11, 18); B = ri(rnd, 2, 9); }
      C = A - B;
    }
  } else {                                            // ch4 加减混合一位数（符号变换入池）
    op = rnd() < 0.5 ? '+' : '-';
    if (op === '+') {
      A = ri(rnd, 2, 9); B = ri(rnd, 2, 9);
      while (A + B > 10) { A = ri(rnd, 2, 9); B = ri(rnd, 2, 9); }
      C = A + B;
    } else {
      A = ri(rnd, 5, 9); B = ri(rnd, 1, A - 1); C = A - B;
    }
  }
  return { A: A, op: op, B: B, C: C, cells: eqCells(A, op, B, C) };
}

/* ---------- 兜底模板（80 次全败概率极低；确定性保 verify）
   ch1-3：谜面 9+3=9（解：9 的 b 段 → 9 的 e 段 → 6+3=9 成立；域：A=9,B=3,C=9 ✓）
   ch4：谜面 8-3=9（解：8 的 b 段 → 符号竖槽 → 6+3=9 成立，符号参与；域 ✓） ---------- */
function fallbackQuiz(dch) {
  if (dch === 4) {
    return { kind: 'ms', cells: eqCells(8, '-', 3, 9), miss: 0, held: null, solved: false,
      solution: { src: 0 * 8 + SEGIDX.b, dst: 1 * 8 + 1 } };
  }
  return { kind: 'ms', cells: eqCells(9, '+', 3, 9), miss: 0, held: null, solved: false,
    solution: { src: 0 * 8 + SEGIDX.b, dst: 0 * 8 + SEGIDX.e } };
}

/* ---------- 单题生成（rnd 同流确定性；avoid=上一题序列化，相邻互异）
   ch1-3 反向构造限数字间移动（§3）；ch4 允符号参与且 qi1/3 优先符号构造；
   谜面须过数值域 domainOk（结构域，不要求成立） ---------- */
function genOne(dch, qi, rnd, avoid) {
  const opAllowed = dch === 4;
  const preferOp = dch === 4 && (qi === 1 || qi === 3);   // ch4 每关 ≥2 题符号参与构造
  const wantMulti = dch >= 2 && !preferOp;   /* b15 试玩 P1-2：ch2+ 偏好多解（nsols≥2，试错有回报） */
  let best = null;
  for (let tries = 0; tries < 80; tries++) {
    const legal = genLegal(dch, rnd);
    const pz = reversePuzzle(rnd, legal.cells, opAllowed, preferOp);
    if (pz && serCells(pz.cells) !== avoid && domainOk(dch, pz.cells)) {
      const cand = { kind: 'ms', cells: pz.cells, solution: pz.solution,
        miss: 0, held: null, solved: false };
      if (!wantMulti) return cand;
      best = best || cand;                    /* 兜底：80 次无多解时保住首个合格单解谜面 */
      if (engSolve(cand.cells).length >= 2) return cand;
    }
  }
  return best || fallbackQuiz(dch);
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // §0.3 batch11 M1 定版
  const quizzes = [];
  let avoid = null;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genOne(dch, qi, rnd, avoid);
    avoid = serCells(q.cells);
    quizzes.push(q);
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 拿放引擎（无 DOM）：engPick(L, s) 拿起一根
   'held' 拿起 / null 已拿着·等号段·空段·关末 */
function engPick(L, s) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (q.held != null) return null;
  if (!Number.isInteger(s) || s < 0) return null;
  const ci = Math.floor(s / 8), sj = s % 8;
  const c = q.cells[ci];
  if (!c || c.kind === 'eq' || sj >= c.segs.length || !c.segs[sj]) return null;
  q.held = s;
  return 'held';
}
/* engPlace(L, s) 放置判定：
   'back' 放回原位（探索零惩罚）/ 'right'/'done' 成立推进 /
   'wrong' 不成立（miss/retries 各 +1，火柴已还原回原位）/
   null 未拿起·等号槽·已占槽·非法 */
function engPlace(L, s) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (q.held == null) return null;
  if (!Number.isInteger(s) || s < 0) return null;
  const ci = Math.floor(s / 8), sj = s % 8;
  const c = q.cells[ci];
  if (!c || c.kind === 'eq' || sj >= c.segs.length) return null;
  if (s === q.held) { q.held = null; return 'back'; }        // 放回原位=取消拿起，不计 miss
  if (c.segs[sj]) return null;                                // 已占槽
  applyMove(q.cells, q.held, s);
  const ev = evalCells(q.cells);
  if (ev.valid && ev.ok) {
    q.held = null;
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  applyMove(q.cells, s, q.held);                              // 不成立：火柴回原位（§3）
  q.miss++;                                                   // 浪费移动计 miss（中间态零惩罚）
  L.retries++;
  q.held = null;
  return 'wrong';
}
/* 星级：浪费移动口径（SPEC §3）——关级 retries 0=3★ / 1-2=2★ / 更多=1★（永不 0 星） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：布局合法+全可读+谜面不成立+存储解成立 ---------- */
function structOk(q) {
  if (!q || q.kind !== 'ms' || !Array.isArray(q.cells) || q.cells.length < 4) return false;
  let sawOp = false, sawEq = false, lastKind = '';
  for (let i = 0; i < q.cells.length; i++) {
    const c = q.cells[i];
    if (!c || !Array.isArray(c.segs)) return false;
    if (c.kind === 'd') {
      if (c.segs.length !== 7 || boolDigit(c.segs) == null) return false;   // 每位恰为数字段集
    } else if (c.kind === 'op') {
      if (sawOp || sawEq || c.segs.length !== 2 || !c.segs[0]) return false;
      sawOp = true;
    } else if (c.kind === 'eq') {
      if (!sawOp || sawEq || c.segs.length !== 2 || !c.segs[0] || !c.segs[1]) return false;
      sawEq = true;
    } else return false;
    lastKind = c.kind;
  }
  if (!sawOp || !sawEq || lastKind !== 'd') return false;
  const ev = evalCells(q.cells);
  if (!ev.valid || ev.ok) return false;                       // 谜面可读且不成立（§0.30）
  if (q.held != null || q.miss !== 0 || q.solved) return false;
  if (!q.solution || !Number.isInteger(q.solution.src) || !Number.isInteger(q.solution.dst)) return false;
  const test = cloneCells(q.cells);                           // 存储解复算成立
  applyMove(test, q.solution.src, q.solution.dst);
  const sev = evalCells(test);
  return sev.valid && sev.ok;
}
/* ================= matchstick 主逻辑（七段火柴等式渲染 / 拿放主路径 / 教学 / 救援 / 推进）
   玩法（SPEC-BATCH15 §3）：火柴棒等式当前不成立——点一根火柴（高亮拿起浮起）→
   点目标虚线槽（放置即判，无确认键）：成立=火焰粒子+胜利下一题 / 不成立=晃动零惩罚
   火柴回原位可再移（浪费移动计 miss；拿起/放回中间态零惩罚）。
   救援 14s=重读题面+可解源火柴 pulse 三连（engSolve 穷举首解），只被等式成立/重听题面
   重置（§0.7a：点火柴/放槽/错放=探索不重置）；读题按钮重置（主动学习动作）。
   教学（仅 flat0 首次）：看=演示完整移动（高亮拿起→虚线槽落位→等式亮起）→演示成立
   （demoR 存 window.__msDemoR §0.27）→重发同关→帮=幽灵手指指该拿的火柴→独=放手。
   验收钩子：window.MS = { get currentLevel, get quiz(){expr,left,right,ok,step,miss,held},
     tapStick(i), tapSlot(i), async autoSolve(), get tutorial, get rescues }（getter 拷贝） */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/开场任务语音/教学/轻反馈不受 flat 门限制（§0.5） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音：flat<3 每错必播；flat≥3 走 10s 节流；force 豁免恰一次——不灰化款 miss 无上限，
   必须 === 2（豁免只在每题 miss 首达 2 时发一次） */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.play(key, text); }
};
/* 拿起/放回轻反馈（§3 ms_pick/ms_drop，10s 节流） */
let lastPickV = 0, lastDropV = 0;
function sayPick() {
  const now = Date.now();
  if (now - lastPickV > 10000) { lastPickV = now; sayR(VOICE.pick.key, VOICE.pick.text); }
}
function sayDrop() {
  const now = Date.now();
  if (now - lastDropV > 10000) { lastDropV = now; sayR(VOICE.drop.key, VOICE.drop.text); }
}

const stageEl = $id('stage'), chipEl = $id('prompt-chip'), sceneEl = $id('scene'),
      sceneArea = $id('scene-area'), ghostEl = $id('ghost'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear');

let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();
let helpRedemo = false;
let lastBlankHint = 0;                          // 空白/探索区轻提示节流（§0.16，10s）
let rescueCount = 0;
let slotXY = {};                                // 渲染期槽位坐标表（火柴飞行动画用）

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));

/* ================= 渲染 ================= */
function renderChip() {
  chipEl.className = '';
  chipEl.innerHTML = '<span class="mini">' + ICONS.msMini + '</span>' +
    '<span class="ask">' + VOICE.q.text + '</span>';

/* 场景：七段火柴等式 SVG（JS 按容器实测 px 布局——命中矩形两向 ≥64 与视口无关地成立）
   画序：panel → 数字/符号/等号 cells（槽虚线在前火柴在后）→ fx 火焰层 */
function renderScene() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  const availW = Math.max(320, sceneArea.clientWidth - 10);
  const availH = Math.max(240, sceneArea.clientHeight - 6);
  const nD = q.cells.filter(c => c.kind === 'd').length;
  /* 字宽拟合：从大到小试到放得下（两档间距；下限 92 保横杆长 ≥64 命中） */
  const tryFit = (gap, minOp, minEq) => {
    for (let w = 168; w >= 92; w -= 3) {
      const total = nD * (w + gap) + Math.max(minOp, w * 0.7) + gap +
        Math.max(minEq, w * 0.72) + gap;
      if (total <= availW) return w;
    }
    return 0;
  };
  let W = tryFit(34, 96, 80);
  if (!W) W = tryFit(20, 88, 76);
  if (!W) W = 92;
  const geo = digitGeo(W), og = opGeo(W);
  const H = geo.H;
  const topPad = 24, botPad = 14;               // 顶部余量=拿起浮起+阴影
  let y0 = topPad;
  if (H + topPad + botPad > availH) {           // 极矮视口：整体按高缩（保底 0.72，verify 视口不触）
    y0 = Math.max(8, topPad - (H + topPad + botPad - availH) * 0.5);
  }
  const xc0 = 10;
  let x = xc0, body = '';
  slotXY = {};
  q.cells.forEach((c, ci) => {
    const held = q.held;
    if (c.kind === 'd') {
      const x0 = x;
      SEG.forEach(seg => {
        const p = geo.pos[seg];
        const s = ci * 8 + SEGIDX[seg];
        const cx = x0 + p[0], cy = y0 + p[1];
        slotXY[s] = [cx, cy];
        const vertical = geo.vt.indexOf(seg) >= 0;
        const len = vertical ? geo.Lv : geo.Lh;
        if (c.segs[SEGIDX[seg]]) {
          body += stickSvg(cx, cy, seg, len, geo.t, vertical,
            (held != null && held === s) ? 'held' : '', s);
        } else {
          body += slotSvg(cx, cy, seg, len, geo.t, vertical,
            held != null ? 'hot' : '', s);
        }
      });
      x += W + 34;
    } else if (c.kind === 'op') {
      const cw = Math.max(96, W * 0.7), cx = x + cw / 2, cy = y0 + H / 2;
      const s0 = ci * 8, s1 = ci * 8 + 1;
      slotXY[s0] = [cx, cy];
      slotXY[s1] = [cx, cy];
      if (!c.segs[1])                                    /* '-'：竖槽虚线（+↔- 单根规则 §3） */
        body += slotSvg(cx, cy, 'v', og.opL, geo.t, true, q.held != null ? 'hot' : '', s1);
      body += stickSvg(cx, cy, 'h', og.opL, geo.t, false,
        (q.held != null && q.held === s0) ? 'held' : '', s0);
      if (c.segs[1])
        body += stickSvg(cx, cy, 'v', og.opL, geo.t, true,
          (q.held != null && q.held === s1) ? 'held' : '', s1);
      x += cw + 34;
    } else {                                             /* '='：双横固定不可移（§3） */
      const cw = Math.max(76, W * 0.72), cx = x + cw / 2, cy = y0 + H / 2;
      body += stickSvg(cx, cy - og.eqGap, 'h', og.eqL, geo.t, false, 'locked', -1);
      body += stickSvg(cx, cy + og.eqGap, 'h', og.eqL, geo.t, false, 'locked', -2);
      x += cw + 34;
    }
  });
  const totalW = x - 34 + 10;
  const svgW = Math.min(totalW, availW), svgH = y0 + H + botPad;
  const scale = totalW > availW ? availW / totalW : 1;   /* 极窄兜底整体缩（verify 双视口不触） */
  const svg = '<svg class="eq" width="' + Math.round(totalW * scale) + '" height="' + Math.round(svgH * scale) +
    (scale !== 1 ? '" viewBox="0 0 ' + totalW + ' ' + svgH : '') +
    '" xmlns="http://www.w3.org/2000/svg" aria-label="火柴算式">' +
    '<rect class="panel" x="2" y="' + (y0 - 14) + '" width="' + (totalW - 4) + '" height="' + (H + 28) +
    '" rx="26" fill="#FFFAF0" stroke="#E3D5BE" stroke-width="3"/>' +
    '<g class="cells"' + (scale !== 1 ? ' transform="scale(' + scale + ')"' : '') + '>' + body + '</g>' +
    '<g class="fx"></g></svg>';
  sceneEl.innerHTML = svg;
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
/* 题面=封闭句单 clip（§0.23）：ms_q 在场播 clip，缺则整句 TTS 兜底（play 自带） */
function speakQuiz() { sayR(VOICE.q.key, VOICE.q.text); }
/* 开场顺序链（§0.5/§0.6）：hint（或教学交接 turn clip）→ 题面，queue 单通道顺序播 */
function openingSpeak(turn) {
  KIDS.voice.queue([turn ? VOICE.turn.key : VOICE.hint.key, VOICE.q.key]);
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderChip();
  renderScene();
  renderStep();
  if (!VERIFY && !state.demo && !state.quiet) speakQuiz();   /* 换题读题 sayR 级 */
}

/* ================= 火柴飞行动画（WAAPI，keyframes 携带绝对 translate 兼容竖杆 rotate） */
function animStick(slot, toSlot, hold) {
  const el = stickEl(slot);
  const from = slotXY[slot], to = slotXY[toSlot];
  if (!el || !from || !to) return;
  const vert = el.getAttribute('transform').indexOf('rotate') >= 0;
  const rot = vert ? ' rotate(90deg)' : '';
  const base = 'translate(' + from[0] + 'px,' + from[1] + 'px)' + rot;
  const dst = 'translate(' + to[0] + 'px,' + to[1] + 'px)' + rot;
  if (hold) {
    el.animate([{ transform: base }, { transform: dst }], { duration: 380 * (VERIFY ? 0.2 : 1), fill: 'forwards', easing: 'ease-in-out' });
  } else {                                      /* 错放：飞过去再弹回原位 */
    el.animate([
      { transform: base }, { transform: dst, offset: 0.38 },
      { transform: base, offset: 0.78 },
      { transform: 'translate(' + (from[0] - 5) + 'px,' + from[1] + 'px)' + rot, offset: 0.88 },
      { transform: base }
    ], { duration: 640 * (VERIFY ? 0.2 : 1), easing: 'ease-in-out' });
  }
}
/* 火焰粒子（成立时从落位火柴喷出，§3 火焰粒子+胜利） */
function flameBurst(slot) {
  const svg = sceneEl.querySelector('svg.eq');
  const fx = svg && svg.querySelector('.fx');
  const p = slotXY[slot];
  if (!fx || !p) return;
  const cols = ['', 'f2', 'f3'];
  for (let i = 0; i < 16; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]);
    c.setAttribute('r', 3 + Math.random() * 4);
    if (cols[i % 3]) c.setAttribute('class', cols[i % 3]);
    fx.appendChild(c);
    const dx = (Math.random() - 0.5) * 130, dy = -(34 + Math.random() * 86);
    c.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.25)', opacity: 0 }
    ], { duration: (560 + Math.random() * 380) * (VERIFY ? 0.2 : 1), delay: i * 22 * (VERIFY ? 0.2 : 1), easing: 'ease-out', fill: 'forwards' });
  }
  setTimeout(() => { if (fx.parentNode) fx.innerHTML = ''; }, VERIFY ? 300 : 1300);
}
function shakeScene() {
  const svg = sceneEl.querySelector('svg.eq');
  if (!svg) return;
  svg.classList.remove('shake'); void svg.offsetWidth; svg.classList.add('shake');
}
function markHot(on) {                          // 拿起后空槽亮虚线（hot 呼吸）
  sceneEl.querySelectorAll('.slot').forEach(el => el.classList.toggle('hot', !!on));
}

/* ================= 拿放主路径（真实点击 / MS 钩子 / autoSolve / 教学演示共用） ================= */
async function uiPick(s, demo) {
  if (!cur || state.won) return false;
  if ((state.locked && !demo) || (state.demo && !demo)) {
    if (!demo) sfx('pop');                      // 吞输入+轻叮（§0.22）
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  if (q.held != null) {                         // 已拿着一根再点火柴
    if (q.held === s) return uiPlace(s, demo);  // 点拿着的火柴=放回原位（'back' 零惩罚）
    /* b15 试玩 P2：换手=自动放回旧的再拿起新的（孩子直接点下一根，不强制先放回原位） */
    await uiPlace(q.held, demo);
    return uiPick(s, demo);
  }
  const r = engPick(cur, s);
  if (r === null) { if (!demo) sfx('pop'); return false; }
  const el = stickEl(s);
  if (el) el.classList.add('held');
  markHot(true);
  if (!VERIFY) KIDS.audio.note(690, 0.08, 0, 0.35);
  if (!demo) sayPick();                         /* 拿起轻反馈（10s 节流）；探索不重置救援钟 §0.7a */
  return 'held';
}
async function uiPlace(s, demo) {
  if (!cur || state.won) return false;
  if ((state.locked && !demo) || (state.demo && !demo)) {
    if (!demo) sfx('pop');                      // 吞输入+轻叮（§0.22）
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  const run = cur;                              // 身份守卫：演出窗口内重玩会重建 cur
  const heldNow = q.held;
  if (heldNow == null) { if (!demo) sfx('pop'); return false; }
  const r = engPlace(cur, s);
  if (r === null) { if (!demo) sfx('pop'); return false; }
  if (r === 'back') {                           // 放回原位=取消拿起：零惩罚（中间态 §3）
    const el = stickEl(heldNow);
    if (el) el.classList.remove('held');
    markHot(false);
    if (!demo) sayDrop();                       /* 放好啦轻反馈（10s 节流） */
    return 'back';
  }
  if (r === 'right' || r === 'done') {
    lastAct = Date.now();                       // 仅等式成立重置救援钟（§0.7a）
    if (state.tut === 'help') {                 // 教学"独"：首次成立 → 强化反馈放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    state.locked = true;
    const el = stickEl(heldNow);
    if (el) el.classList.remove('held');
    markHot(false);
    const svg = sceneEl.querySelector('svg.eq');
    if (svg) svg.classList.add('ok');           // 等式亮起（panel 转暖绿+杆辉光）
    animStick(heldNow, s, true);                // 火柴飞入目标槽
    flameBurst(s);                              // 火焰粒子
    sfx('coin');
    sayR(VOICE.right.key, VOICE.right.text);
    await wait(980 * SPEED);
    if (cur !== run) return r;                  // 演出窗内重玩已重建关卡：丢弃旧续体
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
    return r;
  }
  /* 不成立：晃动零惩罚火柴回原位可再移（浪费移动计 miss，引擎已还原） */
  const el = stickEl(heldNow);
  if (el) el.classList.remove('held');
  markHot(false);
  sfx('fail');
  sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2);   /* flat<3 每错必播 / ≥3 节流+豁免恰一次 */
  shakeScene();
  animStick(heldNow, s, false);                 // 飞过去→弹回原位
  if (q.miss >= 2) {                            // 首错不 pulse：连错 2 次高亮可解源火柴
    const sols = engSolve(q.cells);
    const ok = sols.length ? stickEl(sols[0].src) : null;
    if (ok) { ok.classList.remove('pulse3'); void ok.offsetWidth; ok.classList.add('pulse3'); }
  }
  if (state.tut === 'help') pointHelpNext();
  state.locked = true;                          /* 晃动窗防重入：连点一次错只记一次 miss（§0.26） */
  await wait(680 * SPEED);
  if (cur !== run) return r;
  state.locked = false;
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关用 GEN 文案（不带"明天："前缀） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1)  /* 已完成到 lim-1，预告其下一章（§0.4 防跳章） */ });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.matchstick && sv.matchstick.tutSeen);
  if (VERIFY) { openingSpeak(); return; }        /* verify 页恒走开场链（stub 记录供断言） */
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  openingSpeak();                                /* 开场任务语音+题面顺序链（§0.5） */
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('pulse3'); void el.offsetWidth;
  el.classList.add('pulse3');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向：该拿的火柴（穷举首解源段；fallback 存储解） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q || q.solved) return;
  const sols = engSolve(q.cells);
  const sol = sols.length ? sols[0] : q.solution;
  pointGhostAt(stickEl(sol.src));
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独（save.matchstick.tutSeen）
   看=演示一次完整移动（高亮拿起→幽灵手指到虚线槽→落位→等式亮起+火焰）——
   前段拿起走 demo 通道（locked 吞真实输入），落位临时解锁走真实路径演完整成立演出
   （返回值存 window.__msDemoR，verify 断言真实生效 §0.27）→立即重发同关（确定性，题面一致）
