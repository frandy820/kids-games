<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>找零收银</title>
<style>
/* ================= 找零收银 cashier（batch15）=================
   视觉按 SPEC-BATCH15 §1（承 batch13/money 家族暖米底）：小卖部柜台、小动物顾客拿
   1 件商品+付 1 张大额纸币（10/20/50 三色仅展示不可点）→ 黑板"商品 Y 元 / 付了 X 元"
   → 孩子点币盘（5元×5/2元×5/1元×5/5角×5 固定供给）把找零点入托盘 → 点"找零"提交：
   托盘总额=找零（组合开放，总额判对）→ 顾客道谢离场；≠找零 → 托盘晃动零惩罚可调整
   触摸目标：币 ≥64、托盘内币 ≥64、"找零"主按钮 ≥96、底栏按钮 ≥72 高；pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:4px 10px}

/* ---------- 题面行：顾客+商品+小黑板+大额纸币 ---------- */
#board{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  min-height:76px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:14px;padding:8px 22px;border-radius:22px;
  background:#33544B;border:2.5px solid #B08A5E;box-shadow:0 5px 0 #8A6844}
#prompt-chip .cust{width:54px;height:54px;flex:0 0 54px;transition:transform .5s ease,opacity .5s ease}
#prompt-chip .cust.leave{transform:translateX(46px) rotate(8deg);opacity:0}
#prompt-chip .goods{width:56px;height:56px;flex:0 0 56px}
/* 小黑板：深绿板面+粉笔白大字（承 money）；商品 Y 元 / 付了 X 元 / 找他多少呀 */
#chalk{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
#chalk .ln{display:flex;align-items:baseline;gap:5px;color:#F5F1E6;font-weight:800}
#chalk .lb{font-size:19px;color:#CBE3D4;letter-spacing:.04em}
#chalk b{font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums;color:#FDF9EE;
  text-shadow:0 2px 0 rgba(0,0,0,.18)}
#chalk .u{font-size:18px;color:#CBE3D4;font-weight:800}
#chalk .ask{font-size:21px;color:#F2C98C;font-weight:800}
/* 大额纸币（仅展示不可点选 §0.28）：aria 只读 */
#prompt-chip .bill{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px}

/* ---------- 桌面：币盘（上）+ 托盘行（下） ---------- */
#table-area{flex:1 1 auto;min-height:190px;width:100%;max-width:1180px;display:flex;
  flex-direction:column;justify-content:center;gap:6px}
#coin-tray{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:12px 16px;min-height:80px;padding:6px 8px;border-radius:20px;
  background:#F6ECD9;border:2.5px dashed #D9C5A6}
/* 币盘按钮：圆形硬币简笔（5元紫/2元绿/1元银灰/5角金铜）；点后 .gone（入托盘）；救援 breathe */
.coin{position:relative;width:68px;height:68px;padding:0;border-radius:50%;
  transition:transform .15s;animation:coin-in .4s cubic-bezier(.2,1.5,.4,1) both}
.coin:nth-child(2n){animation-delay:.06s}.coin:nth-child(3n){animation-delay:.12s}
@keyframes coin-in{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.coin:active{transform:translateY(3px)}
.coin svg{width:100%;height:100%;pointer-events:none}
.coin.gone{visibility:hidden;pointer-events:none}
.coin.breathe{animation:coin-breathe 1.6s ease-in-out infinite}
@keyframes coin-breathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(232,151,90,0))}
  50%{transform:scale(1.12);filter:drop-shadow(0 0 12px rgba(232,151,90,.85))}}
/* 飞行币（fixed 克隆，JS 设起止坐标） */
.fly-coin{position:fixed;z-index:60;width:56px;height:56px;pointer-events:none;
  transition:transform .46s cubic-bezier(.35,.05,.6,1),opacity .46s;will-change:transform}

/* 托盘行：找零托盘（托内币可点=移回）+ 合计大字 + 救援"要找"卡 */
#basket-row{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  padding:2px 6px}
#basket{display:flex;align-items:center;gap:10px;min-width:230px;min-height:96px;
  padding:8px 16px;border-radius:20px;background:#FBE9CF;border:2.5px solid #C9A87C;
  box-shadow:0 4px 0 #DFCFB6;flex-wrap:wrap;justify-content:center}
#basket .empty{font-size:16px;font-weight:700;color:#8A7B6C}
#basket.wig{animation:basket-wig .5s ease}
@keyframes basket-wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#basket.nudge{animation:basket-nudge .4s ease}
@keyframes basket-nudge{0%,100%{transform:scale(1)}50%{transform:scale(.97)}}
.tcoin{position:relative;width:64px;height:64px;padding:0;border-radius:50%;
  animation:coin-in .32s cubic-bezier(.2,1.5,.4,1) both;transition:transform .15s}
.tcoin:active{transform:translateY(3px)}
.tcoin svg{width:100%;height:100%;pointer-events:none}
/* 合计：托盘右侧实时大字（目标找零不显示，靠心算——不泄答案） */
#sumbox{display:flex;align-items:baseline;gap:5px;padding:6px 18px;border-radius:16px;
  background:#FFFAF0;border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #DFCFB6}
#sumbox .lb{font-size:17px;font-weight:700;color:#8A7B6C}
#sumbox b{font-size:42px;font-weight:800;color:#E8873A;line-height:1;
  font-variant-numeric:tabular-nums}
#sumbox .u{font-size:19px;font-weight:800;color:#8A7B6C}
#sumbox .jj{display:none;align-items:baseline;gap:4px}
#sumbox .jj b{font-size:30px}
#sumbox.half .jj{display:flex}
/* 救援"要找"数字卡（§0.21 找零额大字提示）：默认隐藏，救援/连错 2 次亮起 */
#find-card{display:none;align-items:baseline;gap:5px;padding:6px 18px;border-radius:16px;
  background:#FDEBD2;border:2.5px solid #E8873A;box-shadow:0 4px 0 #D9A452}
#find-card .lb{font-size:17px;font-weight:700;color:#8A6532}
#find-card b{font-size:42px;font-weight:800;color:#E8873A;line-height:1;
  font-variant-numeric:tabular-nums}
#find-card .u{font-size:19px;font-weight:800;color:#8A6532}
#find-card .jj{display:none;align-items:baseline;gap:4px}
#find-card .jj b{font-size:30px}
#find-card.half .jj{display:flex}
#find-card.show{display:flex;animation:find-in .5s cubic-bezier(.2,1.5,.4,1) both}
#find-card.breathe{animation:find-breathe 1.6s ease-in-out infinite}
@keyframes find-in{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes find-breathe{0%,100%{transform:scale(1);box-shadow:0 4px 0 #D9A452}
  50%{transform:scale(1.07);box-shadow:0 4px 0 #D9A452,0 0 18px rgba(232,151,90,.9)}}

/* ---------- 底部答案区："找零"主提交大按钮（≥96） ---------- */
#answers{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:20px;
  flex-wrap:wrap;min-height:118px;padding:2px 12px}
#deal-tip{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#8A7B6C}
#deal-tip svg{width:34px;height:34px}
#pay-btn{min-width:216px;min-height:96px;padding:0 40px;border-radius:28px;background:#E8975A;
  border:3px solid #4A3B2E;box-shadow:0 6px 0 #C77A42;color:#FFF9EE;font-size:34px;font-weight:800;
  letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:12px;
  transition:transform .15s,box-shadow .15s;animation:coin-in .38s cubic-bezier(.2,1.5,.4,1) both}
#pay-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C77A42}
#pay-btn svg{width:44px;height:44px}
#pay-btn.breathe{animation:pay-breathe 1.6s ease-in-out infinite}
@keyframes pay-breathe{0%,100%{transform:scale(1);box-shadow:0 6px 0 #C77A42}
  50%{transform:scale(1.06);box-shadow:0 6px 0 #C77A42,0 0 18px rgba(232,151,90,.9)}}
#pay-btn.nudge{animation:pay-nudge .4s ease}
@keyframes pay-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 money/divide） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：币/题面适配 */
@media (orientation:portrait){
  .coin{width:64px;height:64px}
  #coin-tray{gap:10px 13px}
  #basket{min-width:210px;min-height:96px}
  #chalk b{font-size:36px}
  #chalk .ask{font-size:19px}
  #chalk .lb{font-size:17px}
  #prompt-chip{gap:10px;padding:8px 16px}
  #prompt-chip .cust{width:46px;height:46px;flex:0 0 46px}
  #prompt-chip .goods{width:48px;height:48px;flex:0 0 48px}
  #pay-btn{min-width:190px;font-size:30px}
  #sumbox b{font-size:38px}
  #find-card b{font-size:38px}
}
</style>
</head>
<body>
<div id="game" aria-label="找零收银">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
    </div>
    <div id="table-area">
      <div id="coin-tray" aria-label="钱币托盘"></div>
      <div id="basket-row" aria-label="找零托盘">
        <div id="basket"></div>
        <div id="sumbox" aria-label="托盘合计"><span class="lb">合计</span><b class="main">0</b><span class="u mu">元</span><span class="jj"><b>5</b><span class="u">角</span></span></div>
        <div id="find-card" aria-label="要找的钱"><span class="lb">要找</span><b class="main">0</b><span class="u mu">元</span><span class="jj"><b>5</b><span class="u">角</span></span></div>
      </div>
    </div>
    <div id="answers" aria-label="作答区"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子掌柜"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   内部金额单位=半元（0.5 元）整数：带角全整数运算零浮点歧义（承 money）
   章难度（SPEC-BATCH15 §1）：
   dch1 付 10 元，价 3-9 元（20% 概率 X.5，X≤8 保找零 ≥1 元），找零 1-7 元
   dch2 付 20 元，价 6-19 元整数，找零 1-14 元
   dch3 付 20 元，价 6-19 整 + 5.5-19.5 半（40% 半），找零 0.5-14.5 元（带角找零=5 角币唯一渠道）
   dch4 付 50 元，价 15-49 元整数，找零 1-35 元
   币盘固定供给（§0.28）：真实人民币面值 {5,2,1} 元 + {5} 角，每面值 5 枚（共 20 枚）
   内部半元编码（0.5 元=1）只在引擎层使用；DOM data-v / CS 钩子 / greedySeq 输出=面值（元）
   供给恒足：5×5+5×2+5×1+5×0.5 = 40.5 元 ≥ 找零上限 35 元；角值 0.5 只能由 5 角币凑（奇偶唯一渠道）
   miss 语义（§1 星级口径）：放币/移币=构造探索不计 miss；提交空盘='empty' 不计次；
   提交总额≠找零 → miss++/retries++（wrong-more 超额 / wrong-less 差额） */

  const price = pickPrice(rnd, pool, used, avoid);
  const pay = dch === 1 ? Y(10) : (dch === 4 ? Y(50) : Y(20));
  return { kind: 'cashier', price: price, pay: pay, change: pay - price,
    goods: qi % GOODS.length, customer: qi % CUSTOMERS.length,
    _tray: [], miss: 0, solved: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // §0.3 batch11 M1 定版
  const quizzes = [];
  const used = [];
  let avoid = -1;                                     // 上一题半元价（相邻互异）
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genQuiz(dch, qi, rnd, used, avoid);
    used.push(q.price);
    avoid = q.price;
    quizzes.push(q);
  }
  return { flat, ch, dch, lv, quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 找零托盘引擎（无 DOM）：托盘总额 ---------- */
const traySum = q => q._tray.reduce((s, v) => s + v, 0);

/* engTapCoin(L, v)：点一枚 v 面值（半元）币入托盘 → 返回新总额；
   非法面值/该面值已用满 5 枚/关已结束 → null（放币=探索，不计 miss 不重置救援钟 §0.7a） */
function engTapCoin(L, v) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (DENOMS.indexOf(v) < 0) return null;
  if (cntOf(q._tray, v) >= DENOM_STOCK) return null;
  q._tray.push(v);
  return traySum(q);
}
/* engTapTray(L, j)：点托盘内第 j 枚币移回 → 返回新总额；非法下标 → null */
function engTapTray(L, j) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (typeof j !== 'number' || Math.floor(j) !== j || j < 0 || j >= q._tray.length) return null;
  q._tray.splice(j, 1);
  return traySum(q);
}
/* engSubmit(L)：'找零'提交——
   空托盘 → 'empty'（不计次不 miss，§1 空提交口径）
   总额=找零 → 'right'/'done'（推进，唯一重置救援钟的主路径 §0.7a）
   超额 → 'wrong-more' / 差额 → 'wrong-less'（miss/retries 计一次，零惩罚可调整） */
function engSubmit(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q._tray.length) return 'empty';
  const s = traySum(q);
  if (s === q.change) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  q.miss++;
  L.retries++;
  return s > q.change ? 'wrong-more' : 'wrong-less';
}
/* 星级：0 错=3★ / 1-2 错=2★ / 更多=1★（空提交不计次，SPEC §1，永不 0 星） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 可行性 DP：multiset（半元数组）能否子集和凑出 target（每币一次） ---------- */
function canReach(avail, target) {
  if (target < 0) return false;
  if (target === 0) return true;
  const dp = new Array(target + 1).fill(false);
  dp[0] = true;
  for (const v of avail) {
    for (let t = target; t >= v; t--) if (dp[t - v]) dp[t] = true;
  }
  return !!dp[target];
}

/* ---------- 贪心最小组合（教学/救援/autoSolve 共用）：5→2→1→0.5 逐枚
   面值制 {5,2,1,.5}×5 对 ≤40 元任意半元值恒成（§0.28 供给恒足）
   target=半元（引擎内部）；返回面值序列（元：5/2/1/0.5，供 UI/钩子直接使用）或 null */
function greedySeq(target) {
  const seq = [];
  let r = target;
  for (const v of DENOMS) {
    let n = 0;
    while (r >= v && n < DENOM_STOCK) { seq.push(DENOM_YUAN[v]); r -= v; n++; }
  }
  return r === 0 ? seq : null;
}

/* ---------- 救援/教学"帮"目标（§1）：总额=找零 → {act:'ok'} 指提交键；
   可加币 → {act:'add', v}（加入后仍可完成）；应移除 → {act:'remove', j}（后放先移，直觉）。
   v=半元（引擎边界，engTapCoin 直用；UI 取币须先 DENOM_YUAN[v] 转元）。
   恒有解（币盘供给恒足，完整贪心解在场）。 ---------- */
function availMultiset(q) {                           // 未入盘的币展开
  const a = [];
  DENOMS.forEach(v => {
    const n = DENOM_STOCK - cntOf(q._tray, v);
    for (let k = 0; k < n; k++) a.push(v);
  });
  return a;
}
function rescueTarget(q) {
  if (!q || q.solved) return null;
  const sum = traySum(q);
  if (sum === q.change) return { act: 'ok' };
  if (sum < q.change) {
    for (const v of DENOMS) {                         // 大面值优先（贪心直觉）
      if (v > q.change - sum) continue;
      const av = availMultiset(q);
      const vi = av.indexOf(v);
      if (vi < 0) continue;
      av.splice(vi, 1);
      if (canReach(av, q.change - sum - v)) return { act: 'add', v: v };
    }
  }
  for (let j = q._tray.length - 1; j >= 0; j--) {     // 后放的先引导移除
    const c = q._tray[j];
    const av = availMultiset(q); av.push(c);
    if (canReach(av, q.change - (sum - c))) return { act: 'remove', j: j };
  }
  return null;                                        // 理论不可达（供给恒足）
}

/* ---------- 结构校验（verify 用）：找零=差额恒正 + 托盘面值/上限合法 + 供给恒足 ---------- */
function structOk(q) {
  if (!q || q.kind !== 'cashier') return false;
  if (q.change !== q.pay - q.price || q.change <= 0) return false;
  if (!Array.isArray(q._tray) || q._tray.some(v => DENOMS.indexOf(v) < 0)) return false;
  if (DENOMS.some(v => cntOf(q._tray, v) > DENOM_STOCK)) return false;   // 每面值 ≤5
  return canReach(trayCoins(), q.change);                                // 币盘供给恒足（§0.28）
}
/* ================= cashier 主逻辑（柜台渲染 / 币盘与找零托盘 / 提交判定 / 教学 / 救援 / 推进）
   玩法（SPEC-BATCH15 §1）：小动物顾客拿 1 件商品+付 1 张大额纸币（10/20/50 只展示）→
   黑板"商品 Y 元 / 付了 X 元"→ 点币盘（5/2/1/0.5 元×5 固定供给）把找零点入托盘，合计实时大字
   → 点"找零"提交：总额=找零→顾客道谢离场下一题（组合开放，总额判对不判组成）；
   ≠找零→托盘晃动零惩罚可调整（多了点托盘币移回/少了补）；空提交不计次（nudge 轻反馈）。
   错提交分超额/差额 → cas_q_more/cas_q_less 方向轻提示（10s 节流，与 cas_wrong queue 顺序链）。
   救援 14s＝重读题面+「要找 Z 元」数字卡亮起+最小组合第一枚币 breathe（miss≥2 同款视觉）。
   救援钟口径（§0.7a）：放币/移币=探索不重置；提交正确/读题/题面卡重置；错提交/空白/兔子不重置。
   教学看-帮-独：watch=演示一笔找零（贪心逐枚）→帮=幽灵手指指可行下一步→独=首次提交对放手；
   演示返回值存 window.__csDemoR（§0.27）。
   验收钩子：window.CS = { get currentLevel, get quiz(){price,paid,change,tray,step,miss},
   tapCoin(v), tapTrayCoin(i), tapSubmit(), autoSolve(), start(flat), get tutorial,
   get rescues }（getter 拷贝非活引用；autoSolve=贪心 5→2→1→0.5 逐枚，断言总额恰=change） */

   必须 === 2（豁免只在每题 miss 首达 2 时发一次）。tail=方向轻提示（§1 more/less，节流窗外）：
   与主句 queue 顺序链单通道播出，不截断（§0.6 精神） */
let lastWrongVoice = 0;

  }
};

async function uiSubmit(demo) {

    /* 审查 M2（batch14）：提交键（主答案）吞输入期轻叮+轻抖——禁静默（§0.22） */
    if (!demo) {
      sfx('pop');
      const b = payBtnEl();
      if (b) { b.classList.remove('nudge'); void b.offsetWidth; b.classList.add('nudge'); }
    }
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  const run = cur;                               // 身份守卫：演出窗口内重玩会重建 cur
  const r = engSubmit(cur);
  if (r === null) return false;
  const btn = payBtnEl();
  if (r === 'right' || r === 'done') {
    lastAct = Date.now();                        // 仅正确推进重置救援钟（§0.7a）
    if (state.tut === 'help') {                  // 教学"独"：首次提交对 → 强化反馈放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    state.locked = true;
    hideFindCard();
    sayR(VOICE.right.key, VOICE.right.text);     // 反馈=找对啦（§1）
    if (btn) { btn.classList.remove('breathe', 'nudge'); btn.style.background = '#8FBF7F'; btn.style.boxShadow = '0 6px 0 #6FA063'; }
    const cust = chipEl.querySelector('.cust');
    if (cust) cust.classList.add('leave');       // 顾客道谢离场（SPEC §1）
    sfx('coin');
    await wait(880 * SPEED);
    if (cur !== run) return r;                   // 演出窗内重玩已重建关卡：丢弃旧续体
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
  } else if (r === 'empty') {                    // 空提交：不计次不 miss（§1 口径）
    basketEl.classList.remove('nudge'); void basketEl.offsetWidth; basketEl.classList.add('nudge');
    sfx('pop');
    return 'empty';
  } else {                                       // 错提交：托盘晃动零惩罚可调整（SPEC §1）
    basketEl.classList.remove('wig'); void basketEl.offsetWidth; basketEl.classList.add('wig');
    sfx('fail');
    sayWrong(q, r === 'wrong-more');             /* 三态 cas_wrong + 方向轻提示（10s 节流） */
    if (q.miss >= 2) applyRescueVisual(q);       /* 首错不提示：连错 2 次给找零额视觉线索（§0.7） */
    if (state.tut === 'help') pointHelpNext();
    state.locked = true;                         /* 晃动窗防重入：连点一次错只记一次 miss（§0.26） */
    await wait(520 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
  }
  return r;
}
/* 错提交语音：cas_wrong 三态主通道 + more/less 方向轻提示（10s 节流，queue 顺序链不截断） */
function sayWrong(q, over) {
  const tip = over ? VOICE.more : VOICE.less;
  const tipDue = Date.now() - lastMoreLess > 10000;
  if (tipDue) lastMoreLess = Date.now();
  sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2, tipDue ? tip : null);
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关用 GEN 文案（不带"明天："前缀，core 模板自带） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1)  /* 已完成到 lim-1，预告其下一章（§0.4 防跳章） */ });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* 教学"帮"阶段指向（rescueTarget 可行性 DP）：总额=找零→指提交；差→指可加币；超→指移回币 */
function pointHelpNext() {

/* ================= 教学（仅关 1-0 首次）：看→帮→独（save.cashier.tutSeen）
   看=演示一笔找零（贪心最小组合逐枚：前 2 枚完整手指演示，其余原地快放控时长）
   →临时解锁走真实路径演示完整提交演出（返回值存 window.__csDemoR §0.27）
   →立即重发同关（确定性关卡，题面一致），"你来当收银员"交接 →帮=指向可行下一步；独=放手 ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);       /* 教学开场 sayR 不受 flat 门（§0.6） */
  await wait(700 * SPEED);
  const q = cur.quizzes[0];
  const seq = greedySeq(q.change) || [];
  for (let k = 0; k < seq.length; k++) {
    const el = coinElFor(seq[k]);
    if (k < 2) {                                 // 前 2 枚：手指移动+按压+飞入（点币语义看清）
      pointGhostAt(el);
      await wait(750 * SPEED);
      ghost.press();
      await wait(260 * SPEED);
      uiTapCoin(seq[k], true);
      await wait(520 * SPEED);
    } else {                                     // 其余：手指原地快放（时长控制）
      if (el) ghost.press();
      await wait(140 * SPEED);
      uiTapCoin(seq[k], true);
      await wait(330 * SPEED);
    }
  }
  await wait(560 * SPEED);                       // 等托盘渲染稳定
  pointGhostAt(payBtnEl());
  await wait(800 * SPEED);
  ghost.press();
  await wait(280 * SPEED);
  state.demo = false; state.locked = false;      /* 时序锚点：解锁窗内无 await 插入（batch9 m6） */
  const demoR = await uiSubmit(true);            // 真实路径演示一次完整提交演出
  window.__csDemoR = demoR;                      /* 演示生效证据（§0.27，verify 断言 'right'） */
  const sv = KIDS._save();                       // 真实页 save 恒非 null；verify 直驱时跳过写档
  if (sv) {
    sv.cashier = sv.cashier || {};
    sv.cashier.tutSeen = true;
    KIDS.store.persist();
  }
  tutorialHandoff();
}
/* 教学"帮"交接（独立成函数：verify 教学链断言直调）：重发同关 + 顺序链 + 幽灵手指 */

  ghost.hide();

  state = { locked: false, won: false, demo: false, tut: 'help', quiet: true };

/* ================= 验收钩子（getter 模式，返回拷贝非活引用） ================= */
window.CS = {
  get currentLevel() {
    if (!cur) return null;
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.quizzes.length,
      step: cur.step, retries: cur.retries, done: cur.done, won: state.won, locked: state.locked };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    return { kind: 'cashier', price: fmtYuan(q.price), paid: fmtYuan(q.pay),
      change: fmtYuan(q.change), tray: q._tray.map(v => DENOM_YUAN[v]),   /* 已放币面值（元） */
      sum: fmtYuan(traySum(q)), step: cur.step, miss: q.miss };           /* SPEC §1 钩子契约 */
  },
  tapCoin(v) {                                    // v=面值（元）：0.5/1/2/5 → 新合计（元）
    if (!cur || cur.done) return false;
    const q = cur.quizzes[cur.step];
    if (!q) return false;
    const j = Y(v);
    if (DENOMS.indexOf(j) < 0 || cntOf(q._tray, j) >= DENOM_STOCK) return false;
    const r = uiTapCoin(v);
    return r === false ? false : fmtYuan(r);
  },
  tapTrayCoin(i) { const r = uiTapTray(i); return r === false ? false : fmtYuan(r); },
  tapSubmit() { return uiSubmit(); },
  start(flat) {                                   /* 测试钩子：跳关（教学演示期拒防打断） */
    if (!cur || state.demo) return false;
    startLevel(flat | 0);
    return true;
  },
  async autoSolve() {                             /* 贪心凑零逐枚 5→2→1→0.5（UI 真实路径） */
    let n = 0, quizzes = 0, sumsOk = true;
    while (cur && !cur.done && n++ < 60) {
      const q = cur.quizzes[cur.step];
      if (!q) break;
      while (q._tray.length) uiTapTray(q._tray.length - 1);   // 清托盘回初态
      const seq = greedySeq(q.change) || [];
      for (const v of seq) { uiTapCoin(v); await wait(30); }
      quizzes++;
      if (traySum(q) !== q.change) { sumsOk = false; break; }  /* 断言总额恰=change（§1） */
      await wait(420 * SPEED);                    // 等飞入+托盘渲染
      await uiSubmit();
    }
    return { done: !!(cur && cur.done), quizzes: quizzes, sumsOk: sumsOk };
  },
  get tutorial() { return state.tut; },
  get rescues() { return rescueCount; }
};

   ⑤ 布局：双 viewport（1280×800 / 800×1180）×（flat0/5/10/15）
     币 ≥64、托盘币 ≥64、"找零"主按钮 ≥96、全按钮 ≥64（.k-parentbtn 豁免）、overflowX ≤0
   ⑥ 分布与专项：VOICE 表文案独立字面量对账（SPEC 定稿）/ numCn·numParts 数位拼接对账
     （五十=五+十 / 四十七=四+十+七）/ cas_* 46 条 clips 注入 clipOk /
     开场顺序链（queue([cas_hint, ...题面段]) 单通道）/ speakQuiz 救援拼句
   结果写 #verify-result + document.title='VERIFY PASS n/n' */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;

  /* ---- verify 侧独立复算（不调引擎生成器/greedySeq/canReach，防两套逻辑同错） ---- */
  function refRangeOk(dch, q) {
    if (q.pay !== (dch === 1 ? 20 : dch === 4 ? 100 : 40)) return false;   // 付 10/20/50 元
    if (q.change !== q.pay - q.price || q.change <= 0) return false;       // 找零=付-价 恒正
    const P = q.price, C = q.change;
    if (dch === 1) {                        // 价 3-9.5 元（整 3-9 / 带 3.5-8.5），找 1-7
      if (P % 2 === 0 ? (P < 6 || P > 18) : (P < 7 || P > 17)) return false;
      if (C < 2 || C > 14) return false;
    } else if (dch === 2) {                 // 价 6-19 整元，找 1-14
      if (P % 2 !== 0 || P < 12 || P > 38) return false;
      if (C < 2 || C > 28) return false;
    } else if (dch === 3) {                 // 价 6-19 整 / 5.5-19.5 带，找 0.5-14.5
      if (P % 2 === 0 ? (P < 12 || P > 38) : (P < 11 || P > 39)) return false;
      if (C < 1 || C > 29) return false;
    } else {                                // 价 15-49 整元，找 1-35
      if (P % 2 !== 0 || P < 30 || P > 98) return false;
      if (C < 2 || C > 70) return false;
    }
    return true;
  }
  function refCanReach(avail, target) {                    // 独立子集和 DP
    if (target < 0) return false;
    const dp = new Array(target + 1).fill(false);
    dp[0] = true;
    for (const v of avail) for (let t = target; t >= v; t--) if (dp[t - v]) dp[t] = true;
    return !!dp[target];
  }
  function refBoundedReach(target) {                       // 币盘供给恒足：{5,2,1,0.5}元×5（§0.28
    if (target < 0) return false;                          // 真实人民币面值）独立有界 DP；
    const dp = new Array(target + 1).fill(false);          // target=半元整数（0.5元=1），币即 10/4/2/1
    dp[0] = true;
    [10, 4, 2, 1].forEach(v => {
      for (let c = 0; c < 5; c++) for (let t = target; t >= v; t--) if (dp[t - v]) dp[t] = true;
    });
    return !!dp[target];
  }
  function refGreedy(target) {                             // 独立贪心（5→2→1→0.5 元逐枚）
    const seq = [];
    let r = target;
    [[10, 5], [4, 5], [2, 5], [1, 5]].forEach(p => {
      let n = 0;
      while (r >= p[0] && n < p[1]) { seq.push(p[0]); r -= p[0]; n++; }
    });
    return r === 0 ? seq : null;
  }
  const refAvail = q => {                                  // 托盘外余币展开（独立复算用）
    const a = [];
    [10, 4, 2, 1].forEach(v => {
      const n = 5 - q._tray.reduce((s, x) => s + (x === v ? 1 : 0), 0);
      for (let k = 0; k < n; k++) a.push(v);
    });
    return a;
  };
  /* 放一枚保证 ≠找零 的币（供错提交；面值元） */
  const wrongCoinYuan = c => (c === 5 ? 2 : 5);

  /* ---- ① 40 关全量审计 + ①b 引擎直驱 + ①c 救援闭环（flat 0-39） ---- */
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1) === JSON.stringify(L2);
    let rangeAll = true, clipAll = true, speechAll = true, adjOk = true,
        structAll = true, supplyAll = true, driveOk = true, rescueOk = true;
    let prevP = -1, jiaoN = 0;
    if (flat < STATIC_LEVELS && L1.dch !== diffOfCh(chOfFlat(flat))) rangeAll = false;  // 静态关=循环章
    if (L1.dch < 1 || L1.dch > 4) rangeAll = false;
    for (let k = 0; k < L1.quizzes.length; k++) {
      const q = L1.quizzes[k];
      if (!refRangeOk(L1.dch, q)) rangeAll = false;
      if (!structOk(q)) structAll = false;
      if (!refBoundedReach(q.change)) supplyAll = false;                  // 币盘供给恒足（§0.28）
      const parts = quizParts(q);
      if (!parts.every(p => !!KIDS.voice.clips[p.key])) clipAll = false;  // 题面拼接段全 clip（§0.23）
      if (qSpeech(q) !== parts.map(p => p.text).join('')) speechAll = false;  // 兜底文本与段一致
      if (q.price === prevP) adjOk = false;                               // 相邻价互异
      prevP = q.price;
      if (q.change % 2 === 1) jiaoN++;
    }

    /* ①b 引擎直驱（retries 为关级累计：断言用题内增量，base=本题起始 retries） */
    const Ld = genLevel(flat);
    for (let k = 0; k < Ld.quizzes.length && driveOk; k++) {
      const q = Ld.quizzes[k];
      const base = Ld.retries;
      if (engSubmit(Ld) !== 'empty' || q.miss !== 0 || Ld.retries !== base) driveOk = false;  // 空提交不计次
      if (engTapCoin(Ld, 99) !== null || engTapCoin(Ld, 3) !== null) driveOk = false;         // 非法面值
      for (let m = 0; m < 5; m++) { if (engTapCoin(Ld, 10) === null) driveOk = false; }       // 5 枚 5 元
      if (engTapCoin(Ld, 10) !== null) driveOk = false;                                       // 第 6 枚拒绝（§0.28 上限）
      while (q._tray.length) { if (engTapTray(Ld, 0) === null) driveOk = false; }
      if (engTapCoin(Ld, 10) === null) driveOk = false;                                       // 放币=探索零计数
      if (traySum(q) === q.change) { if (engTapCoin(Ld, 10) === null) driveOk = false; }      // 防恰等于：再放一枚构造超额
      const sumB = traySum(q);
      const wr = engSubmit(Ld);
      if (wr !== (sumB > q.change ? 'wrong-more' : 'wrong-less')) driveOk = false;            // 错提交分向
      if (q.miss !== 1 || Ld.retries !== base + 1) driveOk = false;                           // miss 恰一次
      if (engTapTray(Ld, 0) === null) driveOk = false;                                        // 移回回落
      if (q.miss !== 1 || Ld.retries !== base + 1) driveOk = false;                           // 探索仍零计数
      while (q._tray.length) engTapTray(Ld, 0);
      const sol = refGreedy(q.change);
      if (!sol) { driveOk = false; break; }
      let sum = 0;
      for (const v of sol) { const r = engTapCoin(Ld, v); if (r === null) { driveOk = false; break; } sum = r; }
      if (driveOk && sum !== q.change) driveOk = false;                                       // 解放齐=找零
      if (q.change % 2 === 1) {                                                               // 带角找零=5 角唯一渠道
        if (sol.indexOf(1) < 0) driveOk = false;                                              // 奇找零必含 0.5 元
        if (sol.some(v => v % 2 === 1 && v !== 1)) driveOk = false;                           // 唯一奇面值=0.5 元
      }
      if (engSubmit(Ld) !== (k === Ld.quizzes.length - 1 ? 'done' : 'right')) driveOk = false;
    }
    /* 星级三档独立驱动：L1x=首题连错 3 次（更多=1★）/ L2x=仅一错（1-2=2★）/ L3=全对（0=3★） */
    const L1x = genLevel(flat);
    const qs1 = L1x.quizzes[0];
    let wcount = 0, g1 = 0;
    while (wcount < 3 && g1++ < 12) {
      if (engTapCoin(L1x, 10) === null && engTapCoin(L1x, 4) === null) break;
      if (traySum(qs1) === qs1.change) continue;
      const r = engSubmit(L1x);
      if (r === 'wrong-more' || r === 'wrong-less') wcount++;
    }
    while (qs1._tray.length) engTapTray(L1x, 0);
    let g2x = 0;
    while (!L1x.done && g2x++ < 30) {
      const q = L1x.quizzes[L1x.step];
      refGreedy(q.change).forEach(v => engTapCoin(L1x, v));
      engSubmit(L1x);
    }
    const s1 = L1x.done && L1x.retries === 3 && engStars(L1x) === 1;
    const L2x = genLevel(flat);
    let g3 = 0;
    while (!L2x.done && g3++ < 30) {
      const q = L2x.quizzes[L2x.step];
      if (L2x.step === 0) {                                       // 仅首题错一次
        engTapCoin(L2x, 10);
        if (traySum(q) === q.change) engTapCoin(L2x, 10);
        engSubmit(L2x);
        while (q._tray.length) engTapTray(L2x, 0);
      }
      refGreedy(q.change).forEach(v => engTapCoin(L2x, v));
      engSubmit(L2x);
    }
    const s2 = L2x.done && L2x.retries === 1 && engStars(L2x) === 2;
    const L3 = genLevel(flat);
    let g4 = 0;
    while (!L3.done && g4++ < 30) {
      const q = L3.quizzes[L3.step];
      refGreedy(q.change).forEach(v => engTapCoin(L3, v));
      engSubmit(L3);
    }
    const s3 = L3.done && L3.retries === 0 && engStars(L3) === 3;
    if (!s1 || !s2 || !s3) driveOk = false;

    /* ①c 救援目标闭环：步进执行 rescueTarget（add/remove）→ 独立 DP 复核 → 收敛 ok → 提交 right */
    const Lr = genLevel(flat);
    const qr = Lr.quizzes[0];
    engTapCoin(Lr, 10);                                           // 歧途态（超或差）
    let rrOk = true, chainOk = true, steps = 0;
    while (steps++ < 30) {
      const t = rescueTarget(qr);
      if (!t) { chainOk = false; break; }
      if (t.act === 'ok') break;
      if (t.act === 'add') {
        if (engTapCoin(Lr, t.v) === null) { chainOk = false; break; }
      } else if (engTapTray(Lr, t.j) === null) { chainOk = false; break; }
      if (!refCanReach(refAvail(qr), qr.change - traySum(qr))) chainOk = false;  // 每步后独立复核仍可达
    }
    if (chainOk && engSubmit(Lr) !== 'right') chainOk = false;
    if (rescueTarget(qr) !== null) rrOk = false;                  // 已解题无救援目标
    rescueOk = rrOk && chainOk;

    const ok = det && L1.quizzes.length === CH_LEN && rangeAll && clipAll && speechAll &&
      adjOk && structAll && supplyAll && driveOk && rescueOk;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, rangeAll: rangeAll, clipAll: clipAll,
      speechAll: speechAll, adjOk: adjOk, structAll: structAll, supplyAll: supplyAll,
      driveOk: driveOk, rescueOk: rescueOk, jiaoN: jiaoN,
      stars: { many1: engStars(L1x), wrong1: engStars(L2x), clean: engStars(L3) },
      qs: L1.quizzes.map(q => fmtTxt(q.pay - q.price) + '<-' + fmtTxt(q.price) + '/付' + fmtYuan(q.pay)) };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② tapCoin 单元（flat0 真实 UI 状态机）：合计 DOM 实时同步 + 币 gone/托盘币落地
     + 币盘 DOM 币制实测（§0.28：真实人民币面值 {5,2,1,0.5}元×5，data-v/aria 均元制） ---- */
  total++;
  startLevel(0);
  const q0 = CS.quiz;
  const coinBtns = Array.prototype.slice.call(coinTrayEl.querySelectorAll('.coin'));
  const dvList = coinBtns.map(b => b.dataset.v);
  const dvOk = dvList.length === 20 &&
    ['0.5', '1', '2', '5'].every(s => dvList.filter(x => x === s).length === 5);  // 恰每面值 5 枚
  const ariaOk = coinBtns.every(b => /^(5 角|5 元|2 元|1 元)硬币$/.test(b.getAttribute('aria-label') || ''));
  const sol0 = refGreedy(Y(q0.change));                           // 半元解
  const taps = [];
  let domOk = true;
  for (const v of sol0) {                                         // 按解逐枚点（钩子面值元）
    const before = CS.quiz.sum;
    const r = CS.tapCoin(DENOM_YUAN[v]);
    taps.push(r);
    if (r === false || Math.abs(r - (before + DENOM_YUAN[v])) > 1e-9) domOk = false;   // 新合计（元）
    if (coinTrayEl.querySelectorAll('.coin.gone').length !== taps.length) domOk = false;  // .gone 同步
    const bTxt = sumboxEl.querySelector('.main').textContent;     // 合计 DOM 实时（含 .half 角态）
    const expInt = Math.floor(r);
    if (bTxt !== String(expInt) || sumboxEl.classList.contains('half') !== (r % 1 !== 0)) domOk = false;
  }
  await wait(620 * SPEED);                                        // 等飞行落地托盘币渲染
  const tkN = basketEl.querySelectorAll('.tcoin').length;
  if (tkN !== taps.length) domOk = false;                         // 托盘币=已放枚数
  const sumDone = CS.quiz.sum === q0.change && CS.quiz.miss === 0 && CS.currentLevel.retries === 0;
  const badVal = CS.tapCoin(7) === false && CS.tapCoin(0) === false && CS.tapCoin(3) === false;  // 非法面值
  const selfOk = taps.every(t => typeof t === 'number') && domOk && sumDone && badVal && dvOk && ariaOk;
  if (selfOk) npass++;
  units.tapCoin = { ok: selfOk, taps: taps, sum: CS.quiz ? CS.quiz.sum : null,
    domOk: domOk, tkN: tkN, badVal: badVal, dvOk: dvOk, ariaOk: ariaOk,
    dv: ['0.5', '1', '2', '5'].map(s => s + 'x' + dvList.filter(x => x === s).length).join(' '),
    change: q0.change, sol: sol0 };

  /* ---- ②b sayW 三态 + ②c 方向轻提示（flat<3 每错必播 / flat≥3 节流 / ===2 豁免 / more-less 方向+节流） ---- */
  total++;
  const wLog = [];
  const origPlay2 = KIDS.voice.play, origQueue2 = KIDS.voice.queue;
  KIDS.voice.play = function (key) { wLog.push(['p', String(key)]); };
  KIDS.voice.queue = function (parts) { wLog.push(['q'].concat(parts)); };
  const cnt = k => wLog.filter(p => p.indexOf(k) >= 0).length;
  startLevel(0);                                                  // flat0：每错必播
  const c0w = CS.quiz.change, v0w = wrongCoinYuan(c0w);
  CS.tapCoin(v0w);
  await CS.tapSubmit();
  await CS.tapSubmit();
  const sayA = cnt('cas_wrong');                                  // → 2
  const key0 = v0w > c0w ? 'cas_q_more' : 'cas_q_less';           // 方向判定（超额 more / 差额 less）
  const other0 = v0w > c0w ? 'cas_q_less' : 'cas_q_more';
  const tipA = cnt(key0);                                         // 首错方向提示恰 1（节流开窗）
  const tipOtherA = cnt(other0);                                  // 反向提示 0（方向正确）
  startLevel(3);                                                  // flat3：10s 节流
  lastWrongVoice = Date.now();                                    /* 显式进入节流窗口内 */
  CS.tapCoin(wrongCoinYuan(CS.quiz.change));
  await CS.tapSubmit();                                           // 窗口内 → 主句不播
  const sayB = cnt('cas_wrong') - 2;                              // 增量 → 0
  const tipB = cnt(key0) + cnt(other0) - tipA - tipOtherA;        // 节流窗内方向提示亦不播 → 0
  startLevel(3);                                                  // 同关重发 fresh quiz：miss===2 force 豁免
  lastWrongVoice = 0;                                             /* 隔离上一子用例时间戳 */
  lastMoreLess = 0;                                               /* 隔离方向提示节流窗 */
  const c3 = CS.quiz.change, v3 = wrongCoinYuan(c3);
  const key3 = v3 > c3 ? 'cas_q_more' : 'cas_q_less';
  CS.tapCoin(v3);
  await CS.tapSubmit();                                           // miss=1 窗口外 → 播
  await CS.tapSubmit();                                           // miss=2 → force === 2 → 播
  const sayC = cnt('cas_wrong') - 2 - sayB;                       // 增量 → 2
  const tipC = cnt(key3) - (key0 === key3 ? tipA : 0);            // 第三节首错再开窗 → 该方向恰 1（扣 A 节同向计数）
  KIDS.voice.play = origPlay2; KIDS.voice.queue = origQueue2;
  const sayWOk = sayA === 2 && sayB === 0 && sayC === 2;
  const tipOk = tipA === 1 && tipOtherA === 0 && tipB === 0 && tipC === 1;
  if (sayWOk && tipOk) npass++;
  units.sayW = { ok: sayWOk && tipOk, flat0Plays: sayA, flat3Throttle: sayB, flat3Force: sayC,
    tipFirst: tipA, tipOther: tipOtherA, tipThrottle: tipB, tipC: tipC,
    dir0: key0, dir3: key3 };

  /* ---- ③ UI 冒烟 A：flat0 真实通路通关（首题错一次+空提交不计次 → 1 错=2 星） ---- */
  total++;
  startLevel(0);
  let smokeA = true, wrongOk = false, quizzesA = 0;
  for (let s = 0; s < CH_LEN && smokeA; s++) {
    const q = CS.quiz;
    if (!q) { smokeA = false; break; }
    if (s === 0) {                                        // 首错：托盘晃动零惩罚可调整；首错不出救援视觉
      CS.tapCoin(wrongCoinYuan(q.change));
      const r = await CS.tapSubmit();
      const wig = basketEl.classList.contains('wig');
      const payOk = !!payBtnEl() && getComputedStyle(payBtnEl()).pointerEvents !== 'none';
      const alive = coinTrayEl.querySelector('.coin:not(.gone)');
      const coinOk = !!alive && getComputedStyle(alive).pointerEvents !== 'none';   /* 不灰化：币仍可点 */
      const noFind = !findCardEl.classList.contains('show');                        /* 首错不亮找零卡 */
      wrongOk = (r === 'wrong-more' || r === 'wrong-less') && wig && payOk && coinOk && noFind &&
        CS.currentLevel.retries === 1 && CS.currentLevel.step === 0;
      while (CS.quiz.tray.length) CS.tapTrayCoin(0);        // 全部移回落（零惩罚可调整）
      if (CS.quiz.sum !== 0) smokeA = false;
      const rE = await CS.tapSubmit();                      // 空提交：不计次（§1 口径）
      if (rE !== 'empty' || CS.currentLevel.retries !== 1) smokeA = false;
    }
    const q2 = CS.quiz;
    const sol = refGreedy(Y(q2.change));
    for (const v of sol) CS.tapCoin(DENOM_YUAN[v]);
    const r = await CS.tapSubmit();
    if (r !== (s === CH_LEN - 1 ? 'done' : 'right')) smokeA = false;
    quizzesA++;
  }
  const lvA = CS.currentLevel;
  const smokeOkA = smokeA && wrongOk && quizzesA === CH_LEN && lvA.done && lvA.won &&
    lvA.retries === 1 && engStars(cur) === 2 && !document.querySelector('.k-celebrate');   // verify 页不弹层
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, wrongOk: wrongOk, quizzes: quizzesA,
    retries: lvA.retries, stars: engStars(cur) };

  /* ---- ④ UI 冒烟 B1：flat5（ch2 付 20 元）黑板 DOM+贪心真实通路通关 ---- */
  total++;
  startLevel(5);
  const L5 = genLevel(5);
  const pay5 = L5.quizzes.every(q => q.pay === 40);                 // 付 20 元
  const chalk5 = chipEl.textContent.indexOf('付了') >= 0 &&
    chipEl.textContent.indexOf('20') >= 0;
  let playB1 = true, quizzesB = 0;
  for (let s = 0; s < CH_LEN && playB1; s++) {
    const q = CS.quiz;
    if (!q) { playB1 = false; break; }
    refGreedy(Y(q.change)).forEach(v => CS.tapCoin(DENOM_YUAN[v]));
    const r = await CS.tapSubmit();
    if (r !== (s === CH_LEN - 1 ? 'done' : 'right')) playB1 = false;
    quizzesB++;
  }
  const lv5 = CS.currentLevel;
  const smokeOkB1 = pay5 && chalk5 && playB1 && quizzesB === CH_LEN && lv5.done &&
    lv5.won && lv5.retries === 0 && engStars(cur) === 3;
  if (smokeOkB1) npass++;
  smokes.flat5 = { ok: smokeOkB1, pay20: pay5, chalk: chalk5, quizzes: quizzesB, stars: engStars(cur) };

  /* ---- ④ UI 冒烟 B2：flat10（ch3 带角）——奇找零题真实走 0.5 币（5 角唯一渠道） ---- */
  total++;
  let jFlat = 10;
  let jIdx = genLevel(10).quizzes.findIndex(q => q.change % 2 === 1);
  if (jIdx < 0) {                                                   // flat10 无带角题（确定性回退扫 ch3）
    for (const f of [11, 12, 13, 14]) {
      const i = genLevel(f).quizzes.findIndex(q => q.change % 2 === 1);
      if (i >= 0) { jFlat = f; jIdx = i; break; }
    }
  }
  startLevel(jFlat);
  const LJ = genLevel(jFlat);
  const jiaoOk = jIdx >= 0 && LJ.quizzes[jIdx].change % 2 === 1;
  let playB2 = true, quizzesC = 0, jiaoPlaced = false, jiaoChecked = false;
  for (let s = 0; s < CH_LEN && playB2; s++) {
    const q = CS.quiz;
    if (!q) { playB2 = false; break; }
    const half = Y(q.change) % 2 === 1;
    refGreedy(Y(q.change)).forEach(v => CS.tapCoin(DENOM_YUAN[v]));
    if (half) {                                                     // 带角题：贪心解必含 5 角币
      jiaoChecked = true;
      jiaoPlaced = CS.quiz.tray.indexOf(0.5) >= 0;
    }
    const r = await CS.tapSubmit();
    if (r !== (s === CH_LEN - 1 ? 'done' : 'right')) playB2 = false;
    quizzesC++;
  }
  const lv10 = CS.currentLevel;
  const smokeOkB2 = jiaoOk && playB2 && quizzesC === CH_LEN && jiaoChecked && jiaoPlaced &&
    lv10.done && lv10.won && lv10.retries === 0 && engStars(cur) === 3;
  if (smokeOkB2) npass++;
  smokes.flat10 = { ok: smokeOkB2, jFlat: jFlat, jIdx: jIdx, jiaoPlaced: jiaoPlaced,
    quizzes: quizzesC, stars: engStars(cur) };

  /* ---- ④ UI 冒烟 B3：flat15（ch4 付 50）——数位拼接全 clip+黑板 50+贪心真实通路 ---- */
  total++;
  startLevel(15);
  const L15 = genLevel(15);
  const pay15 = L15.quizzes.every(q => q.pay === 100);              // 付 50 元
  const parts15 = quizParts(L15.quizzes[0]);
  const compOk = parts15[1].key === 'cas_n_5' && parts15[2].key === 'cas_n_10' &&  // 五十=五+十
    parts15.every(p => !!KIDS.voice.clips[p.key]);                  // 全 clip（含数位拼接段）
  const chalk15 = chipEl.textContent.indexOf('50') >= 0;
  let playB3 = true, quizzesD = 0;
  for (let s = 0; s < CH_LEN && playB3; s++) {
    const q = CS.quiz;
    if (!q) { playB3 = false; break; }
    refGreedy(Y(q.change)).forEach(v => CS.tapCoin(DENOM_YUAN[v]));
    const r = await CS.tapSubmit();
    if (r !== (s === CH_LEN - 1 ? 'done' : 'right')) playB3 = false;
    quizzesD++;
  }
  const lv15 = CS.currentLevel;
  const smokeOkB3 = pay15 && compOk && chalk15 && playB3 && quizzesD === CH_LEN &&
    lv15.done && lv15.won && lv15.retries === 0 && engStars(cur) === 3;
  if (smokeOkB3) npass++;
  smokes.flat15 = { ok: smokeOkB3, pay50: pay15, composed: compOk, chalk: chalk15,
    quizzes: quizzesD, stars: engStars(cur) };

  /* ---- ⑦ 教学链（verify 直驱 tutorialWatch；真实页看-帮-独链路由无头自测覆盖） ---- */
  total++;
  const origQ7 = KIDS.voice.queue, origP7 = KIDS.voice.play;
  const qLog7 = [], pLog7 = [];
  KIDS.voice.queue = function (parts) { qLog7.push(parts.slice()); };
  KIDS.voice.play = function (key) { pLog7.push(String(key)); };
  startLevel(0);
  await tutorialWatch();                        // 看：watch clip → demo 贪心找零+真实提交 → 重发同关 → 帮
  KIDS.voice.queue = origQ7; KIDS.voice.play = origP7;
  const lastQ7 = qLog7[qLog7.length - 1];
  const q0t = CS.quiz;
  const tutOk = pLog7.indexOf('cas_tut_watch') >= 0 &&                    /* 看=演示配 watch clip */
    window.__csDemoR === 'right' &&                                       /* §0.27 演示提交真实生效 */
    state.tut === 'help' && !state.demo && !state.locked &&               /* 帮：解锁等孩子动手 */
    CS.currentLevel && CS.currentLevel.flat === 0 &&                      /* 重发同关 */
    q0t && q0t.step === 0 && q0t.sum === 0 && q0t.tray.length === 0 &&    /* 新题面空托盘初态 */
    lastQ7 && lastQ7.length === 6 && lastQ7[0] === 'cas_tut_turn' &&      /* 交接顺序链单通道 */
    lastQ7[1].key === 'cas_q1' && lastQ7[3].key === 'cas_q2' &&           /* 题面段对象（queue 原样透传） */
    lastQ7[2].key === 'cas_n_10' && lastQ7[5].key === 'cas_q3';
  if (tutOk) npass++;
  units.tutorial = { ok: tutOk, watchClip: pLog7.indexOf('cas_tut_watch') >= 0,
    demoR: window.__csDemoR, handoff: !!lastQ7, parts: lastQ7, tut: state.tut };

  /* ---- ⑤ 布局：双 viewport ×（flat0/5/10/15）
     量测前等入场 stagger 动画结束（§0.11 transform 中途陷阱：coin-in scale(0) 起帧） ---- */
  async function simLayout(w, h, flat) {
    startLevel(flat);
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    await wait(620);                            // 币入场动画 .4s+delay .12s（真实 ms，不吃 SPEED）
    const de = document.documentElement;
    refGreedy(Y(CS.quiz.change)).forEach(v => CS.tapCoin(DENOM_YUAN[v]));   // 放币测托盘币尺寸
    await wait(200);                            // 等飞行落地
    const coins = Array.prototype.slice.call(coinTrayEl.querySelectorAll('.coin'));
    const coinOk = coins.length === 20 &&
      coins.every(b => { const r = b.getBoundingClientRect(); return r.width >= 64 && r.height >= 64; });
    const tks = Array.prototype.slice.call(basketEl.querySelectorAll('.tcoin'));
    const tkOk = tks.length > 0 &&
      tks.every(b => { const r = b.getBoundingClientRect(); return r.width >= 64 && r.height >= 64; });
    const pb = payBtnEl();
    const payOk = !!pb && pb.getBoundingClientRect().height >= 96 && pb.getBoundingClientRect().width >= 96;
    let btnOk = true;                           // 全部按钮 ≥64（.k-parentbtn 家长按钮豁免）
    document.querySelectorAll('button').forEach(b => {
      if (b.classList.contains('k-parentbtn')) return;
      const r = b.getBoundingClientRect();
      if (r.width > 4 && r.height > 4 && (r.width < 64 || r.height < 64)) btnOk = false;
    });
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, flat: flat, coinOk: coinOk, tkOk: tkOk,
      payOk: payOk, btnOk: btnOk, ox: ox, pass: coinOk && tkOk && payOk && btnOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const f of [0, 5, 10, 15]) {
    sims.push(await simLayout(1280, 800, f));
    sims.push(await simLayout(800, 1180, f));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                // 还原真实 viewport 布局
  const layoutOk = sims.length === 8 && sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑥ 分布与专项：文案对账 / 数位拼接对账 / clip 注入 / 开场链 / 救援拼句 ---- */
  total++;
  /* SPEC §1 定稿文案独立字面量（manifest 一致，禁改） */
  const refVoice = VOICE.watch.text === '看！顾客买东西啦' &&
    VOICE.turn.text === '你来当收银员' && VOICE.hint.text === '算一算，要找多少钱' &&
    VOICE.q1.text === '付了' && VOICE.q2.text === '元，买了' &&
    VOICE.q3.text === '元的东西，找他多少呀' && VOICE.q3j.text === '元五角的东西，找他多少呀' &&
    VOICE.right.text === '找对啦' && VOICE.wrong.text === '再算一算找零' &&
    VOICE.more.text === '多找啦，拿回去一枚' && VOICE.less.text === '还差一点点';
  /* 数词：≤35 整词 / 36-50 数位拼接（clip 上限 35 的补足通道） */
  const numOk = numCn(10) === '十' && numCn(21) === '二十一' && numCn(35) === '三十五' &&
    numCn(40) === '四十' && numCn(47) === '四十七' && numCn(50) === '五十' &&
    numParts(35).length === 1 && numParts(35)[0].key === 'cas_n_35' &&
    numParts(50).length === 2 && numParts(50)[0].key === 'cas_n_5' && numParts(50)[1].key === 'cas_n_10' &&
    numParts(47).length === 3 && numParts(47)[0].key === 'cas_n_4' &&
    numParts(47)[1].key === 'cas_n_10' && numParts(47)[2].key === 'cas_n_7' &&
    numParts(47).every(p => !!KIDS.voice.clips[p.key]);
  /* cas_* 全部 46 条 clips 注入对账（build 注入后 KIDS.voice.clips 应含全部） */
  const CAS_KEYS = ['cas_tut_watch', 'cas_tut_turn', 'cas_hint', 'cas_right', 'cas_wrong',
    'cas_q_more', 'cas_q_less', 'cas_q1', 'cas_q2', 'cas_q3', 'cas_q3j']
    .concat(Array.from({ length: 35 }, (_, i) => 'cas_n_' + (i + 1)));
  const clipOk = CAS_KEYS.every(k => !!KIDS.voice.clips[k]);
  /* 开场顺序链（stub 记录）：queue([cas_hint, ...题面段]) 单通道不叠音 */
  const origQ = KIDS.voice.queue, origP = KIDS.voice.play, origS = KIDS.voice.say;
  const qLog = [], playLog = [], sayLog = [];
  KIDS.voice.queue = function (parts) { qLog.push(parts.slice()); };
  KIDS.voice.play = function (key) { playLog.push(String(key)); };
  KIDS.voice.say = function (t) { sayLog.push(String(t)); };
  startLevel(0);                                // verify 页恒走开场链
  const lastQ = qLog[qLog.length - 1];
  const q0v = genLevel(0).quizzes[0];
  const openChain = qLog.length >= 1 && lastQ.length === 6 && lastQ[0] === 'cas_hint' &&
    lastQ[1].key === 'cas_q1' && lastQ[3].key === 'cas_q2' &&        // 付 10=单段数词（对象段按 .key 断言）
    (q0v.price % 2 ? lastQ[5].key === 'cas_q3j' : lastQ[5].key === 'cas_q3');
  speakQuiz(q0v);                                // 救援/重听拼句：题面段（clip 在场走 queue）
  const lastQ2 = qLog[qLog.length - 1];
  const rescueChain = qLog.length >= 2 && lastQ2 !== lastQ && lastQ2.length === 5 &&
    lastQ2[0] === 'cas_q1' && lastQ2.indexOf('cas_q2') === 2;
  const ttsFallback = sayLog.length === 0;       /* 全 clip 在场：正常链路零 TTS 兜底（§0.23） */
  KIDS.voice.queue = origQ; KIDS.voice.play = origP; KIDS.voice.say = origS;
  const specOk = refVoice && numOk && clipOk && openChain && rescueChain && ttsFallback;
  if (specOk) npass++;
  units.dist = { ok: specOk, refVoice: refVoice, numOk: numOk, clips: clipOk,
    openChain: openChain, rescueChain: rescueChain, ttsFallback: ttsFallback,
    casClips: CAS_KEYS.filter(k => !KIDS.voice.clips[k]) };

  const out = { game: 'cashier', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
</body>
