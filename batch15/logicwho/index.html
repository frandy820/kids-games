<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>逻辑三人组</title>
<style>
/* ================= 逻辑三人组 logicwho（batch15）=================
   视觉按 SPEC-BATCH15 §2 + 家族暖底：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E
   舞台四行纵叠：问句条（上）→ 排排坐座位（帽色/物品可见、住客"?"隐藏）→ 线索卡 2-3 条
   → 动物卡 3 张（主答案 ≥96，§0.9）；flex 纵向 + space-evenly，横竖屏同一结构 overflowX 恒 0
   点对：座位揭幕（?身体→动物）+徽章绿光+动物卡跳一下；点错：卡晃动+关键线索卡高亮一下（§2）
   负线索 ✗ 徽记 / 相对位置 ← 徽记（7-8 岁可读辅助）；观察者视角"左边"=屏幕左 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#FDEBD2;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:space-evenly;padding:6px 8px;overflow:hidden}

/* 问句条（点击重听=主动学习动作，重置救援钟 §0.7a） */
#tip{min-height:64px;max-width:94%;padding:9px 30px;border-radius:32px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;gap:12px;transition:transform .15s;flex:0 0 auto}
#tip.flash{animation:tip-b .5s ease}
@keyframes tip-b{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#tip-ico{flex:0 0 auto;display:flex;align-items:center}
#tip-text{font-size:clamp(20px,2.8vw,26px);font-weight:800;color:#4A3B2E;line-height:1.2;white-space:nowrap}

/* 排排坐座位：帽子可见+住客"?"（ch4 加物品角标）；点对=揭幕+绿光 */
#bench{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,24px);
  padding:4px 6px;max-width:100%}
.seat{width:clamp(148px,19vw,200px);height:clamp(150px,21vh,204px);border-radius:24px;
  background:#FFF9EE;border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:8px 8px 12px;position:relative;transition:transform .15s}
.seat:active{transform:translateY(3px)}
.seat .s-hat{flex:0 0 auto;height:clamp(46px,7vh,58px);margin-bottom:-10px;z-index:2}
.seat .s-hat svg{height:100%;width:auto}
.seat .s-body{flex:0 0 auto;width:66%;display:flex;justify-content:center}
.seat .s-body svg{width:100%;height:auto}
.seat .s-item{position:absolute;right:4px;bottom:4px;width:clamp(36px,5vw,48px);height:clamp(36px,5vw,48px);
  border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 2px 0 #D8C9B4;
  display:flex;align-items:center;justify-content:center;z-index:3}
.seat .s-item svg{width:68%;height:68%}
.seat.nudge{animation:seat-b .4s ease}
@keyframes seat-b{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.seat.lit{border-color:#6FA063;background:#F3F8EC;
  box-shadow:0 5px 0 #9CBF8C,0 0 18px rgba(143,191,127,.7)}
.seat.reveal .s-body{animation:seat-pop .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes seat-pop{0%{transform:scale(.4) rotate(-8deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* 线索卡：卡片式逐条列出（icon 徽记 + 文字）；点=重听该线索（主动学习重置） */
#clues{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:10px;
  padding:2px 6px;max-width:100%}
.clue{min-height:64px;padding:8px 16px;border-radius:18px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;
  gap:10px;transition:transform .15s}
.clue:active{transform:translateY(2px)}
.clue .cb{flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:#FDEBD2;
  border:2.5px solid #4A3B2E;display:flex;align-items:center;justify-content:center;
  font-size:23px;font-weight:800;color:#4A3B2E;line-height:1}
.clue .cb.neg{background:#F6DFD8;color:#B0785A}
.clue .cb.pos{border-color:#FFF9EE;box-shadow:0 0 0 2.5px #4A3B2E inset}
.clue .cb svg{width:28px;height:28px}
.clue .ct{font-size:clamp(16px,2.2vw,19px);font-weight:800;color:#4A3B2E;line-height:1.25;
  white-space:nowrap}
.clue.flash{animation:clue-flash .9s ease}
@keyframes clue-flash{0%,100%{background:#FFF9EE;transform:scale(1)}
  40%{background:#FDEBD2;transform:scale(1.05)}}
.clue.pulse3{animation:clue-p3 .55s ease-in 3}
@keyframes clue-p3{0%,100%{box-shadow:0 4px 0 #D8C9B4}
  50%{box-shadow:0 4px 0 #D8C9B4,0 0 16px rgba(232,151,90,.95)}}
.clue.breathe{animation:clue-b 1.6s ease-in-out infinite}
@keyframes clue-b{0%,100%{transform:scale(1)}50%{transform:scale(1.03);background:#FDF3DF}}

/* 动物卡（主答案按钮 ≥96，§0.9）：点对=跳一下；点错=晃动（零惩罚可重点） */
#cards{display:flex;justify-content:center;align-items:stretch;gap:clamp(12px,2.4vw,26px);
  padding:2px 6px;max-width:100%}
.card{width:clamp(104px,14vw,144px);border-radius:22px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:10px 6px 8px;
  transition:transform .15s,box-shadow .15s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card svg{width:clamp(66px,9vw,90px);height:auto}
.card .nm{font-size:clamp(17px,2.4vw,21px);font-weight:800;color:#4A3B2E;line-height:1}
.card.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}
  55%{transform:rotate(5deg)}80%{transform:rotate(-3deg)}}
.card.hop{animation:card-hop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes card-hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px) scale(1.05)}}
.card.pulse{animation:card-pulse 1s ease 2}
@keyframes card-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}
.card.breathe{animation:card-breathe 1.6s ease-in-out infinite}
@keyframes card-breathe{0%,100%{transform:scale(1);box-shadow:0 5px 0 #D8C9B4}
  50%{transform:scale(1.05);box-shadow:0 5px 0 #D8C9B4,0 0 18px rgba(232,151,90,.9)}}
.card.nudge{animation:card-nudge .34s ease}
@keyframes card-nudge{0%{outline:7px solid #F5C445;outline-offset:0}
  100%{outline:7px solid transparent;outline-offset:10px}}
.card.dim{opacity:.35;filter:grayscale(.55)}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：纵向余量大——座位/动物卡放大，行距收紧防溢出 */
@media (orientation:portrait){
  .seat{width:clamp(160px,26vw,210px);height:clamp(168px,20vh,216px)}
  .card{width:clamp(112px,25vw,150px)}
  .card svg{width:clamp(74px,16vw,96px)}
  .clue{padding:8px 18px}
}
</style>
</head>
<body>
<div id="game" aria-label="逻辑三人组">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="tip" aria-live="polite"><span id="tip-ico" aria-hidden="true"></span><span id="tip-text"></span></div>
    <div id="bench" aria-label="排排坐的座位"></div>
    <div id="clues" aria-label="线索卡"></div>
    <div id="cards" aria-label="动物卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= logicwho 纯引擎：确定性出题 + 线索判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）。
   数据模型（SPEC §2）：quiz = { animals[3]（座位序=隐藏真值排列）, hats[3]（座位帽色，可见）,
   items[3]|null（ch4 物品，可见）, clues[2-3], ask{kind,value}, answer（=问句属性所在座位
   下标）, choices[3]（动物卡显示序）, kc（关键线索下标：与问句属性相关者优先，承重者优先）,
   _miss, solved }。
   线索型四类：pos 正"戴X帽子的是Y" / neg 负"戴X帽子的不是W" / rel 相对"X住在Y左边"
   （相邻左，观察者视角=屏幕左，承 batch9 定版）/ abs 绝对"最左/右边的是X" / ipos 物品正"拿I的是X"。
   §0.29 生成门：线索全真 + 问句答案在 6 排列穷举下唯一（solveCheck）；不满足换参数重生成
   （确定性 rnd 循环）。 */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数

/* 6 种排列（animals → 座位 0/1/2 的全部双射）——§0.29 穷举真值源 */
const PERMS6 = (function () {
  const out = [];
  for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) {
    if (b === a) continue;
    out.push([ANIMAL_IDS[a], ANIMAL_IDS[b], ANIMAL_IDS[3 - a - b]]);
  }
  return out;
})();

/* ---------- 线索构造（text/segs 由参数派生，禁手抄——verify 用独立段表对账） ---------- */
function mkClue(o) {
  const c = { t: o.t, hat: o.hat || null, item: o.item || null, X: o.X || null,
    Y: o.Y || null, W: o.W || null, edge: o.edge || null, keyClue: false };
  c.text = clueText(c);
  c.segs = clueSegs(c);
  return c;
}
function clueText(c) {
  if (c.t === 'pos')  return '戴' + HATS[c.hat].cn + '帽子的是' + ANIMALS[c.X].name;
  if (c.t === 'neg')  return '戴' + HATS[c.hat].cn + '帽子的不是' + ANIMALS[c.W].name;
  if (c.t === 'rel')  return ANIMALS[c.X].name + '住在' + ANIMALS[c.Y].name + '左边';
  if (c.t === 'abs')  return (c.edge === 'L' ? '最左边的是' : '最右边的是') + ANIMALS[c.X].name;
  if (c.t === 'ipos') return '拿' + ITEMS[c.item].cn + '的是' + ANIMALS[c.X].name;
  return '';
}
/* 线索句语音 = queue 拼接段（§0.23：4 段拼接单元 lgw_c_a+色词+lgw_c_b+动物名 等） */
function clueSegs(c) {
  if (c.t === 'pos')  return ['lgw_c_a', HATS[c.hat].key, 'lgw_c_b', ANIMALS[c.X].key];
  if (c.t === 'neg')  return ['lgw_c_a', HATS[c.hat].key, 'lgw_c_nb', ANIMALS[c.W].key];
  if (c.t === 'rel')  return [ANIMALS[c.X].key, 'lgw_c_l', ANIMALS[c.Y].key, 'lgw_c_left'];
  if (c.t === 'abs')  return [c.edge === 'L' ? 'lgw_c_ll' : 'lgw_c_rr', ANIMALS[c.X].key];
  if (c.t === 'ipos') return ['lgw_c_h', ITEMS[c.item].key, 'lgw_c_i', ANIMALS[c.X].key];
  return [];
}
/* 线索真值：perm=候选排列（animals→座位序），hats/items=座位属性布局 */
function clueTrueEng(c, perm, hats, items) {
  if (c.t === 'pos')  return perm[hats.indexOf(c.hat)] === c.X;
  if (c.t === 'neg')  return perm[hats.indexOf(c.hat)] !== c.W;
  if (c.t === 'rel')  return perm.indexOf(c.X) === perm.indexOf(c.Y) - 1;   /* 相邻左（屏幕左） */
  if (c.t === 'abs')  return c.edge === 'L' ? perm[0] === c.X : perm[2] === c.X;
  if (c.t === 'ipos') return perm[items.indexOf(c.item)] === c.X;
  return false;
}
const seatOfAttr = (q, kind, value) =>
  kind === 'hat' ? q.hats.indexOf(value) : (q.items || []).indexOf(value);

/* §0.29 核心：6 排列穷举——满足全部线索的排列取"问句座位"的动物，恰一解=答案唯一 */
function solveCheck(qx) {
  const answers = [];
  for (let k = 0; k < PERMS6.length; k++) {
    const perm = PERMS6[k];
    let ok = true;
    for (let i = 0; i < qx.clues.length; i++)
      if (!clueTrueEng(qx.clues[i], perm, qx.hats, qx.items)) { ok = false; break; }
    if (ok) answers.push(perm[seatOfAttr(qx, qx.ask.kind, qx.ask.value)]);
  }
  const uniq = answers.length > 0 && answers.every(a => a === answers[0]);
  return { ok: uniq, answer: uniq ? answers[0] : null, sat: answers.length };
}

/* ---------- 单题生成（章配方 + §0.29 重生成循环） ----------
   ch1：1 正（问该帽=直接型，练"线索→卡"映射）
   ch2：1 正 1 负（负帽=问帽：正线索钉死一只，负线索把第三只排除出问句座位→恰一解且负线索承重）
   ch3：相对+绝对+1 负（先定位置再读属性：rel+abs 唯一确定排列，负帽给问句座位直接排除）
   ch4：帽正+物正+帽负（双属性交叉：正线索钉死两只在不同座位→第三座位住客唯一，问其帽或物） */
function genQuiz(rnd, dch, prevAnimals) {
  let best = null;
  for (let att = 0; att < 500; att++) {
    const animals = shuffled(ANIMAL_IDS, rnd);
    const hats = shuffled(HAT_IDS, rnd);
    const items = dch === 4 ? shuffled(ITEM_IDS, rnd) : null;
    const clues = [];
    let ask = null, answer = -1;
    if (dch === 1) {
      const s = Math.floor(rnd() * 3);
      clues.push(mkClue({ t: 'pos', hat: hats[s], X: animals[s] }));
      ask = { kind: 'hat', value: hats[s] }; answer = s;
    } else if (dch === 2) {
      const sA = Math.floor(rnd() * 3);
      const sB = (sA + 1 + Math.floor(rnd() * 2)) % 3;
      const sC = 3 - sA - sB;
      clues.push(mkClue({ t: 'pos', hat: hats[sA], X: animals[sA] }));
      clues.push(mkClue({ t: 'neg', hat: hats[sB], W: animals[sC] }));
      ask = { kind: 'hat', value: hats[sB] }; answer = sB;
    } else if (dch === 3) {
      const s = Math.floor(rnd() * 2);
      clues.push(mkClue({ t: 'rel', X: animals[s], Y: animals[s + 1] }));
      const edge = rnd() < 0.5 ? 'L' : 'R';
      clues.push(mkClue({ t: 'abs', edge: edge, X: edge === 'L' ? animals[0] : animals[2] }));
      const t = Math.floor(rnd() * 3);
      const ws = [0, 1, 2].filter(k => k !== t);
      clues.push(mkClue({ t: 'neg', hat: hats[t], W: animals[ws[Math.floor(rnd() * 2)]] }));
      ask = { kind: 'hat', value: hats[t] }; answer = t;
    } else {
      const sA = Math.floor(rnd() * 3);
      let sI = Math.floor(rnd() * 3);
      if (sI === sA) sI = (sA + 1 + Math.floor(rnd() * 2)) % 3;
      const sC = 3 - sA - sI;
      clues.push(mkClue({ t: 'pos', hat: hats[sA], X: animals[sA] }));
      clues.push(mkClue({ t: 'ipos', item: items[sI], X: animals[sI] }));
      const t3 = Math.floor(rnd() * 3);
      const ws3 = [0, 1, 2].filter(k => k !== t3);
      clues.push(mkClue({ t: 'neg', hat: hats[t3], W: animals[ws3[Math.floor(rnd() * 2)]] }));
      ask = rnd() < 0.5 ? { kind: 'item', value: items[sC] } : { kind: 'hat', value: hats[sC] };
      answer = sC;
    }
    const ordered = shuffled(clues, rnd);
    /* §0.29 生成门：线索全真 + 恰一解（先记 best：唯一解但相邻排列重复的候选留作兜底） */
    if (!ordered.every(c => clueTrueEng(c, animals, hats, items))) continue;
    const chk = solveCheck({ hats: hats, items: items, clues: ordered, ask: ask, animals: animals });
    if (!chk.ok || chk.answer !== animals[answer]) continue;
    if (!best) best = { animals: animals, hats: hats, items: items, clues: ordered, ask: ask, answer: answer };
    /* 相邻题排列互异（防同关连续两题谜底一眼相同） */
    if (prevAnimals && prevAnimals.join() === animals.join()) continue;
    /* 关键线索 kc（救援/错点回看指向）：与问句属性相关者优先（其中承重者优先）；
       无相关线索时取承重线索（去掉后答案不再唯一）→ 位置线索 → 第一条。
       注：ch3 存在"任两条线索都恰一解"的配置（rel+abs 已钉死排列），承重性非恒存在，
       故 kc 不强制承重——verify 按同款优先级独立复算选择结果 */
    const askRelated = c => ask.kind === 'hat'
      ? ((c.t === 'pos' || c.t === 'neg') && c.hat === ask.value)
      : (c.t === 'ipos' && c.item === ask.value);
    const breaks = i => {
      const sub2 = ordered.filter((_, j) => j !== i);
      const ck2 = solveCheck({ hats: hats, items: items, clues: sub2, ask: ask, animals: animals });
      return !(ck2.ok && ck2.answer === animals[answer]);
    };
    let kc = -1;
    for (let i = 0; i < ordered.length; i++) if (askRelated(ordered[i]) && breaks(i)) { kc = i; break; }
    if (kc < 0) kc = ordered.findIndex(askRelated);
    if (kc < 0) { for (let i = 0; i < ordered.length; i++) if (breaks(i)) { kc = i; break; } }
    if (kc < 0) kc = ordered.findIndex(c => c.t === 'rel' || c.t === 'abs');
    if (kc < 0) kc = 0;
    ordered[kc].keyClue = true;
    const a = ASKS[ask.value];
    return { animals: animals, hats: hats, items: items, clues: ordered,
      ask: { kind: ask.kind, value: ask.value }, askKey: a.key, askText: a.text,
      answer: answer, choices: shuffled(ANIMAL_IDS, rnd), kc: kc, _miss: 0, solved: false };
  }
  /* 理论不可达（配方构造性满足恰一解）；兜底返回首个唯一解候选（放弃相邻互异） */
  if (!best) return null;
  best.clues[0].keyClue = true;
  const a = ASKS[best.ask.value];
  return { animals: best.animals, hats: best.hats, items: best.items, clues: best.clues,
    ask: { kind: best.ask.kind, value: best.ask.value }, askKey: a.key, askText: a.text,
    answer: best.answer, choices: shuffled(ANIMAL_IDS, mulberry32(7)), kc: 0, _miss: 0, solved: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // §0.3 生成关难度随机（b15 审查 M1）
  const quizzes = [];
  let prev = null;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genQuiz(rnd, dch, prev);
    prev = q.animals;
    quizzes.push(q);
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, quizzes: quizzes, step: 0, misses: 0, done: false };
}

/* ---------- 点选动物卡引擎（无 DOM）
   'right' 答对推进（非末题）/ 'done' 通关 / 'wrong' 答错（miss+1，零惩罚可重点）/
   false 非法（越界/已解/关卡结束） ---------- */
function engTapAnimal(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return false;
  const q = L.quizzes[L.step];
  if (!q || q.solved || i < 0 || i >= q.choices.length) return false;
  if (q.choices[i] === q.animals[q.answer]) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  q._miss++;
  L.misses++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级：关 miss（错点）0=3 星 / 1-2=2 星 / 更多=1 星。永不 0 星 */
const engStars = L => L.misses === 0 ? 3 : (L.misses <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：排列合法性 / 章配方构成 / 文本与段同源 /
   线索全真 / 问句与属性分配一致 / 恰一解 / kc 承重 ---------- */
function structOk(q, dch) {
  if (!q || !q.clues || !q.ask) return false;
  const isPerm = (a, ids) => !!a && a.length === 3 && ids.every(x => a.indexOf(x) >= 0);
  if (!isPerm(q.animals, ANIMAL_IDS) || !isPerm(q.hats, HAT_IDS)) return false;
  if (!isPerm(q.choices, ANIMAL_IDS)) return false;
  if (dch === 4 ? !isPerm(q.items, ITEM_IDS) : q.items !== null) return false;
  const n = { 1: 1, 2: 2, 3: 3, 4: 3 }[dch];
  if (q.clues.length !== n) return false;
  const cnt = t => q.clues.filter(c => c.t === t).length;
  if (dch === 1 && !(cnt('pos') === 1)) return false;
  if (dch === 2 && !(cnt('pos') === 1 && cnt('neg') === 1)) return false;
  if (dch === 3 && !(cnt('rel') === 1 && cnt('abs') === 1 && cnt('neg') === 1)) return false;
  if (dch === 4 && !(cnt('pos') === 1 && cnt('ipos') === 1 && cnt('neg') === 1)) return false;
  for (const c of q.clues) {
    if (c.text !== clueText(c) || c.segs.join() !== clueSegs(c).join()) return false;
    if (!clueTrueEng(c, q.animals, q.hats, q.items)) return false;
  }
  if (q.answer !== seatOfAttr(q, q.ask.kind, q.ask.value)) return false;
  if (q.askKey !== ASKS[q.ask.value].key || q.askText !== ASKS[q.ask.value].text) return false;
  if (q.clues.filter(c => c.keyClue).length !== 1 || !q.clues[q.kc] || !q.clues[q.kc].keyClue) return false;
  const chk = solveCheck(q);
  if (!chk.ok || chk.answer !== q.animals[q.answer]) return false;
  return true;
}
/* ================= logicwho 主逻辑（题面渲染 / 点选动物卡 / 教学 / 救援 / 推进）
   玩法（SPEC §2）：三个座位排排坐（帽色/物品可见、住客"?"隐藏）+ 线索卡 2-3 条。
   问句"戴红帽子的是谁呀"→点下方动物卡：对=座位揭幕+徽章亮起+动物跳一下+把结论说成
   完整正陈述（"戴红帽子的是小猫"）；错=卡晃动零惩罚可重点+关键线索卡高亮一下。
   救援 14s（§0.21）：问句重读+正确动物卡 breathe+关键线索卡 pulse 三连。
   §0.7a 口径：点动物卡=主交互（点对重置救援钟/错点不重置）；重听题面/重听线索=主动学习
   动作重置；点座位/兔子/空白=探索不重置。
   §0.26 晃动窗防重入 + 身份守卫（const run=cur，await 后 cur!==run 丢弃旧续体）。
   验收钩子：window.LW = { get currentLevel, get quiz, tapAnimal(i), start(flat),
   async autoSolve(), get tutorial, get rescues }（getter 拷贝非活引用） */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；救援/开场/读题/教学不受 flat 门（§0.5） */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音：flat<3 每错必播 / flat≥3 10s 节流+豁免恰一次（§0.5，b15 审查 M2 对齐家族） */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.play(key, text); }
};
/* 线索句/确认句=queue 拼接（§0.23）：段 clip 全在场走 queue；缺任一段整句 TTS 兜底 */
function sayParts(segs, fullText) {
  if (KIDS.voice.clips && segs.every(k => KIDS.voice.clips[k])) KIDS.voice.queue(segs);
  else KIDS.voice.say(fullText);
}
/* 答对确认句=把推理结论说成完整正陈述（教"线索句"的完整表达） */
function confirmSegs(q) {
  if (q.ask.kind === 'hat')
    return ['lgw_c_a', HATS[q.ask.value].key, 'lgw_c_b', ANIMALS[q.animals[q.answer]].key];
  return ['lgw_c_h', ITEMS[q.ask.value].key, 'lgw_c_i', ANIMALS[q.animals[q.answer]].key];
}
const confirmText = q => q.ask.kind === 'hat'
  ? '戴' + HATS[q.ask.value].cn + '帽子的是' + ANIMALS[q.animals[q.answer]].name
  : '拿' + ITEMS[q.ask.value].cn + '的是' + ANIMALS[q.animals[q.answer]].name;

const stageEl = $id('stage'), tipEl = $id('tip'), tipIcoEl = $id('tip-ico'), tipTextEl = $id('tip-text'),
      benchEl = $id('bench'), cluesEl = $id('clues'), cardsEl = $id('cards'),
      ghostEl = $id('ghost'), rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'),
      hearBtn = $id('btn-hear');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();
let lastBlankHint = 0;                          // 空白点击轻提示节流（§0.16，10s）
let lastReplayAt = 0;                           // 重听题面 3s 节流
let helpTimer = null, helpRedemo = false;
let rescueCount = 0;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const cardEl = i => cardsEl.querySelector('.card[data-i="' + i + '"]');
const clueEl = i => cluesEl.querySelector('.clue[data-i="' + i + '"]');

/* ================= 静态构建 ================= */

/* ================= 渲染 ================= */
/* 线索卡徽记：正=色点（帽色）/负=✗/相对=←/绝对=◀▶/物品正=物品小图（§2 可读辅助） */
function clueBadge(c) {

  if (c.t === 'neg') return '<span class="cb neg">✗</span>';

  if (c.t === 'abs') return '<span class="cb">' + (c.edge === 'L' ? '◀' : '▶') + '</span>';
  return '<span class="cb">' + itemSvg(c.item, 22) + '</span>';
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];

  const dots = $id('chapter-dots');

  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');

/* ================= 视觉反馈小件 ================= */
function clearBreathe() {
  cardsEl.querySelectorAll('.breathe').forEach(e => e.classList.remove('breathe'));
  cluesEl.querySelectorAll('.breathe').forEach(e => e.classList.remove('breathe'));
}
function replayAnim(el, cls) {
  if (!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
}
const wigCard = i => replayAnim(cardEl(i), 'wig');
const hopCard = i => replayAnim(cardEl(i), 'hop');
const nudgeCard = i => replayAnim(cardEl(i), 'nudge');
const flashClue = i => replayAnim(clueEl(i), 'flash');
const dimCard = (i, on) => { const el = cardEl(i); if (el) el.classList.toggle('dim', !!on); };
function pulseKeyClue(q) {                      /* 关键线索卡高亮一下（错点回看提示，§2） */
  replayAnim(clueEl(q.kc), 'flash');
}
function pulseAnswer(q) {                       /* miss≥2 才高亮正确卡（§0.7 首错不 pulse） */
  const idx = q.choices.indexOf(q.animals[q.answer]);
  replayAnim(cardEl(idx), 'pulse');
}
function revealSeat(q) {                        /* 点对：座位揭幕（?身体→动物）+徽章绿光 */

  if (!s) return;
  s.classList.remove('lit', 'reveal'); void s.offsetWidth;
  s.classList.add('lit', 'reveal');
  const body = s.querySelector('.s-body');
  if (body) body.innerHTML = animalSvg(q.animals[q.answer]);
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  clearBreathe();                               /* 指新目标前清全部旧 breathe（家族 P1-3 教训） */
  ghost.toEl(el);
  ghost.show();
  replayAnim(el, 'pulse');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"指向：关键线索卡 breathe——教孩子"回看哪条线索"（本款的认知脚手架） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const el = clueEl(q.kc);
  if (el) el.classList.add('breathe');
  pointGhostAt(el);
}
function scheduleHelpGhost(delay) {
  clearTimeout(helpTimer);
  helpTimer = setTimeout(() => {
    if (state.tut !== 'help' || state.won || state.locked || VERIFY) return;
    pointHelpNext();
  }, delay == null ? 700 : delay);
}

/* ================= 点选动物卡主路径（真实点击 / LW 钩子 / autoSolve / 教学演示共用）
   demo=true 仅教学"看"演示通道（豁免 locked 门，batch5 M1 教训） ================= */
async function uiTapAnimal(i, demo) {
  if (!cur || state.won) return false;
  if ((state.locked && !demo) || (state.demo && !demo)) {
    if (!demo) { sfx('pop'); nudgeCard(i); }    /* 吞输入+轻叮+卡圈轻闪（§0.22 主答案同规） */
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  const run = cur;                              /* 身份守卫：演出窗内重玩会重建 cur */
  const r = engTapAnimal(cur, i);
  if (r === false) return false;
  if (r === 'wrong') {                          /* 错点：晃动零惩罚可重点+关键线索卡高亮一下 */
    sfx('fail');
    sayW(VOICE.wrong.key, VOICE.wrong.text, q._miss === 2);   /* miss 首达 2 豁免恰一次（§0.5） */
    wigCard(i);
    pulseKeyClue(q);
    if (q._miss >= 2) pulseAnswer(q);           /* 首错不 pulse 正确项（§0.7） */
    state.locked = true;                        /* 晃动窗防重入（§0.26：连点只记一次 miss） */
    await wait(560 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    if (state.tut === 'help') scheduleHelpGhost(300);
    return r;                                   /* 错点不重置救援钟（§0.7a） */
  }
  /* ---- 点对：座位揭幕+动物跳一下+结论正陈述 → 推进（点对重置救援钟 §0.7a） ---- */
  lastAct = Date.now();
  if (state.tut === 'help') {                   /* 教学"独"：首次答对放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  clearBreathe();
  revealSeat(q);
  hopCard(i);
  sfx('coin');
  sayParts(confirmSegs(q), confirmText(q));
  state.locked = true;
  await wait(2400 * SPEED);                     /* 确认句 4 段拼接 ≈2.4s，播完再进下一题 */
  if (cur !== run) return r;
  state.locked = false;
  if (r === 'done') winFlow();
  else renderQuiz();
  return r;
}

/* ================= 重听通道（题面/线索）：主动学习动作，重置救援钟（§0.7a 例外） ================= */
function replayAsk(force) {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return false;
  const now = Date.now();
  if (!force && now - lastReplayAt < 3000) return false;
  lastReplayAt = now;
  lastAct = Date.now();
  replayAnim(tipEl, 'flash');
  KIDS.voice.play(q.askKey, q.askText);
  return true;
}
function clueTap(i) {
  const q = cur && cur.quizzes[cur.step];
  if (!q || i < 0 || i >= q.clues.length) return false;
  if (state.locked || state.demo || state.won) { sfx('pop'); flashClue(i); return false; }
  lastAct = Date.now();
  flashClue(i);
  sayParts(q.clues[i].segs, q.clues[i].text);
  return true;
}
function seatTap(i) {                           /* 点座位=探索（不重置救援钟） */
  const s = seatEls()[i];
  if (!s) return false;
  sfx('pop');
  replayAnim(s, 'nudge');
  return true;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关用 GEN 文案（不带"明天："前缀，core 模板自带） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  clearTimeout(helpTimer);
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1)  /* 已完成到 lim-1，预告其下一章（§0.4 防跳章） */ });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);               // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
/* 开场顺序链（§0.5/§0.6）：hint（或教学交接 turn clip）→ 问句 clip，queue 单通道顺序播 */
function openingSpeak(turn) {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  KIDS.voice.queue([turn ? VOICE.turn.key : VOICE.hint.key, q.askKey]);
}
function startLevel(flat) {
  clearTimeout(helpTimer);
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.logicwho && sv.logicwho.tutSeen);
  if (VERIFY) { openingSpeak(); return; }       // verify 页恒走开场链（stub 记录供断言）
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  openingSpeak();
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独（save.logicwho.tutSeen）
   看=线索卡逐条亮+逐条读 → 错误动物划暗（排除可视化）→ 幽灵手指点正确卡（demo 通道真实
   点选，返回值存 window.__lwDemoR §0.27）→ 重发同关 → 帮=幽灵手指指关键线索卡；独=放手 ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);
  await wait(1000 * SPEED);
  const q = cur.quizzes[0];
  for (let k = 0; k < q.clues.length; k++) {    // 线索卡逐条亮+逐条读（读线索→排除）
    flashClue(k);
    sayParts(q.clues[k].segs, q.clues[k].text);
    await wait(2400 * SPEED);
  }
  q.choices.forEach((a, i) => {                 // 排除：错误动物划暗
    if (a !== q.animals[q.answer]) dimCard(i, true);
  });
  await wait(900 * SPEED);
  const idx = q.choices.indexOf(q.animals[q.answer]);
  pointGhostAt(cardEl(idx));
  await wait(880 * SPEED);
  ghost.press();
  await wait(300 * SPEED);
  const demoR = await uiTapAnimal(idx, true);   // demo 通道豁免 locked 门（演示吞输入）
  window.__lwDemoR = demoR;                     /* 演示生效证据（§0.27，verify 断言 'right'） */
  const sv = KIDS._save();                      // 真实页 save 恒非 null；verify 直驱时跳过写档
  if (sv) {
    sv.logicwho = sv.logicwho || {};
    sv.logicwho.tutSeen = true;
    KIDS.store.persist();
  }
  tutorialHandoff();
}
/* 教学"帮"交接（独立成函数：verify 教学链断言直调）：重发同关 + 顺序链 + 幽灵手指 */
function tutorialHandoff() {
  ghost.hide();
  cur = genLevel(0);                            // 确定性关卡：同一关重来（题面一致）
  state = { locked: false, won: false, demo: false, tut: 'help', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  state.quiet = false;
  openingSpeak(true);                           // 交接顺序链：turn clip → 问句（§0.6 单通道）
  scheduleHelpGhost(1100);
}
