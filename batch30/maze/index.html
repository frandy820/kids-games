<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>迷宫探险</title>
<style>
/* ================= 迷宫探险 maze（batch30）=================
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E；迷宫=棕描线墙格
   （树篱灌木 SVG，家族风）。全龄三层难度：ch1 5×5 少障碍 / ch2 7×7 中障碍 /
   ch3 7×7 钥匙门（钥匙格+门格，门挡通路，先拾钥匙才能过门）/ ch4 混合。
   玩法：逐格点选相邻可行格移动（'moved'）；点已走格=合法回退 'back'（死路自救，
   不记 miss）；到萝卜格='right'（末局 'done'）；障碍/对角/不相邻='wrong'+miss
   轻反馈（pop+容器 bump+目标格 deny 闪，不 wig 人格否定+相邻可行格 pulse 高亮）；
   未拿钥匙点门='wrong'+miss+maz_key「先找钥匙哦」；每关 3 局（SPEC §0.75 破 5 题惯例）。
   触摸目标：网格格 ≥72×72（本款口径：5×5 格 84 / 7×7 格 72）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 50px;display:flex;align-items:center;padding:5px 60px 0 14px;gap:14px}
#logo{width:40px;height:40px;border-radius:12px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 40px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面卡（题面句 + 迷宫网格）；无指令卡排（直接点格走位） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:6px 12px}

/* 题面卡：可点重听题面；题面句条 + 迷宫网格 +（ch3）钥匙徽章 */
#scene{position:relative;width:min(600px,94vw);border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;overflow:hidden;padding:10px 12px 14px;
  transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene .q-text{position:relative;z-index:3;margin:0 auto 8px;width:max-content;max-width:100%;
  background:#FBF6EC;border:2.5px solid #4A3B2E;border-radius:16px;
  padding:4px 18px;font-size:23px;font-weight:700;letter-spacing:1px;white-space:nowrap}
/* ch3 钥匙徽章：scene 右上角（未拿=灰暗，拿到=金色点亮弹跳） */
#scene .key-badge{position:absolute;right:12px;top:10px;z-index:4;width:46px;height:46px;
  border-radius:50%;background:#FBF6EC;border:2.5px solid #4A3B2E;display:none;
  align-items:center;justify-content:center}
#scene .key-badge.show{display:flex}
#scene .key-badge svg{width:34px;height:34px;filter:grayscale(1) opacity(.5)}
#scene .key-badge.lit svg{filter:none}
#scene .key-badge.lit{animation:key-lit .55s cubic-bezier(.2,1.6,.4,1);background:#FDE8C8}
@keyframes key-lit{0%{transform:scale(1)}45%{transform:scale(1.28) rotate(-8deg)}100%{transform:scale(1)}}

/* 迷宫网格：尺寸按 size 由 JS 定宽（5×5=444 / 7×7=540），窄屏自适应不溢出；
   格 ≥72×72（5×5=84 / 7×7=72，本款触摸口径） */
#scene .grid{position:relative;display:grid;grid-auto-rows:1fr;gap:6px;
  width:100%;max-width:min(540px,calc(94vw - 50px));aspect-ratio:1;margin:0 auto}
#scene .cell{position:relative;border-radius:12px;background:#EAF2DC;
  border:2.5px solid #9BAA7E;display:flex;align-items:center;justify-content:center;
  transition:background .25s;cursor:pointer}
#scene .cell svg{width:78%;height:78%}
#scene .cell.wall{background:#E4E2DC;border-color:#B9B3A6;padding:2px}
#scene .cell.goal-cell{background:#FDE8C8}
#scene .cell.door-cell{background:#F3E3CB}
#scene .cell.trail-cell::after{content:'';position:absolute;left:50%;top:50%;width:16px;height:16px;
  border-radius:50%;background:#E8975A;opacity:.32;transform:translate(-50%,-50%)}
#scene .cell.deny{animation:cell-deny .4s ease}
@keyframes cell-deny{0%,100%{background:#EAF2DC}45%{background:#F5C9BC}}
#scene .grid.bump{animation:grid-bump .22s ease}
@keyframes grid-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
/* 错反馈方向级：相邻可行格 pulse 高亮（1.2s 三闪） */
#scene .cell.walk-hint{animation:walk-hint .4s ease-in-out 3}
@keyframes walk-hint{0%,100%{background:#EAF2DC;border-color:#9BAA7E}
  50%{background:#FDE8C8;border-color:#E8975A}}
/* 萝卜到达演出：萝卜摇摆放大 */
#scene .cell .carrot-lit{animation:carrot-lit .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes carrot-lit{0%,100%{transform:scale(1)}45%{transform:scale(1.25) rotate(-6deg)}}
/* 拾钥匙演出：钥匙格放大淡出 */
#scene .cell .key-got{animation:key-got .55s ease forwards}
@keyframes key-got{0%{transform:scale(1);opacity:1}60%{transform:scale(1.35);opacity:.7}
  100%{transform:scale(.5);opacity:0}}
#scene.pulse{animation:scene-pulse 1s ease-in-out 3}
@keyframes scene-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#scene.bounce{animation:scene-b .4s ease}
@keyframes scene-b{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}

/* 小兔：绝对定位于网格，left/top 按格心 transition（走格动画） */
#scene .bun{position:absolute;z-index:5;width:82px;height:82px;left:0;top:0;
  transition:left .32s cubic-bezier(.3,1.2,.4,1),top .32s cubic-bezier(.3,1.2,.4,1);
  display:flex;align-items:center;justify-content:center;pointer-events:none}
#scene .bun svg{width:72px;height:72px;filter:drop-shadow(0 3px 0 rgba(74,59,46,.2))}
/* 撞墙（相邻墙错点）：小兔朝该方向顶一下弹回（4 向 nudge） */
#scene .bun.nudge-up{animation:nd-up .38s ease}
#scene .bun.nudge-down{animation:nd-down .38s ease}
#scene .bun.nudge-left{animation:nd-left .38s ease}
#scene .bun.nudge-right{animation:nd-right .38s ease}
@keyframes nd-up{0%,100%{margin-top:0}45%{margin-top:-18px}}
@keyframes nd-down{0%,100%{margin-top:0}45%{margin-top:18px}}
@keyframes nd-left{0%,100%{margin-left:0}45%{margin-left:-18px}}
@keyframes nd-right{0%,100%{margin-left:0}45%{margin-left:18px}}
/* 到萝卜：小兔开心连跳 */
#scene .bun.reach{animation:bun-reach .55s cubic-bezier(.2,1.6,.4,1) 2}
@keyframes bun-reach{0%,100%{margin-top:0}40%{margin-top:-16px}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-29） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：网格与按钮适配，7×7 格仍 ≥72 */
@media (orientation:portrait){
  #scene .q-text{font-size:20px;padding:3px 14px}
  #scene .key-badge{width:40px;height:40px;top:8px;right:10px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
/* 窄屏（<620px 手机）：网格 vw 自适应防溢出（格将小于 72——平板为本族主口径，可用性优先） */
@media (max-width:620px){
  #scene .grid{max-width:calc(94vw - 46px)}
  #scene .bun{width:64px;height:64px}
  #scene .bun svg{width:56px;height:56px}
  #dock{padding:4px 10px 8px}
  #btn-rabbit{width:66px;height:66px}#btn-rabbit svg{width:54px;height:54px}
  #btn-hear{width:64px;height:64px}#btn-hear svg{width:38px;height:38px}
  #btn-replay{width:56px;height:56px}#btn-replay svg{width:34px;height:34px}
}
</style>
</head>
<body>
<div id="game" aria-label="迷宫探险">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关局进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="帮小兔子吃到萝卜，点我再听一遍"></button>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= maze 纯引擎：确定性迷宫生成 + 逐格点选走位判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 37)：同 flat 永远同关（重玩一致、verify 可检）。
   章型（SPEC-BATCH30 §0.75/§3；进度章号单调递增、难度章号 (ch-1)%4+1 循环）：
     dch1 5×5 少障碍（墙 2-4，无门）
     dch2 7×7 中障碍（墙 6-10，无门）
     dch3 7×7 钥匙门（墙 6-10 + 钥匙格 + 门格：门=分隔行唯一缺口 → 恒必经割点）
     dch4 混合：每局独立掷子型 sub∈{1,2,3}（局间混出）
   每关 3 局（RUNS_PER_LEVEL；迷宫单局时长长于选择题，破 5 题惯例——SPEC 明示）。
   生成数学先验（§0.75，出题器即验证——structWhy 同款校验双保险）：
     ① 每局必可解：生成后 BFS 验证 entry→goal 连通，不通整局重生成（同 seed 确定性）；
     ② ch3 分段三验：门关态（walls∪{door} 障碍）entry→key 连通 + 门开态 key→goal
        连通 + 门关态 entry→goal **不连通**（门必经——钥匙必要，未拿钥匙物理到不了出口）；
     ③ 墙格界内互异，不压 entry/goal/key/door；
     ④ 相邻局布局互异（maze 指纹对账）；
     ⑤ 解不要求唯一（走通即 right）；墙分布 seeded 确定（同 flat 同 rnd 流）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / LEVELS_PER_CH) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 网格工具（(r,c)：r=0 顶行，c=0 左列） ---------- */
const samePos = (a, b) => !!a && !!b && a.r === b.r && a.c === b.c;
const isWall = (walls, p) => walls.some(w => samePos(w, p));
const distOf = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
const inSize = (size, p) => p.r >= 0 && p.r < size && p.c >= 0 && p.c < size;
/* BFS 可达：block 为障碍格集（walls / walls∪{door}）；返回 from→to 可达布尔 */
function bfsReach(size, walls, from, to, block) {
  const bs = (block || []).map(w => w.r + ',' + w.c);
  const bad = p => isWall(walls, p) || bs.indexOf(p.r + ',' + p.c) >= 0;
  if (bad(to)) return false;
  const seen = {};
  const qq = [from];
  seen[from.r + ',' + from.c] = 1;
  while (qq.length) {
    const p = qq.shift();
    if (samePos(p, to)) return true;
    [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(d => {
      const nv = { r: p.r + d[0], c: p.c + d[1] };
      if (!inSize(size, nv) || bad(nv) || seen[nv.r + ',' + nv.c]) return;
      seen[nv.r + ',' + nv.c] = 1;
      qq.push(nv);
    });
  }
  return false;
}
/* BFS 最短路路径（含起终点；不可达 null）：autoSolve / 教学帮指 / 答案级救援共用 */
function bfsPath(size, walls, from, to, block) {
  const bs = (block || []).map(w => w.r + ',' + w.c);
  const bad = p => isWall(walls, p) || bs.indexOf(p.r + ',' + p.c) >= 0;
  if (bad(to)) return null;
  const prev = {};
  const key0 = from.r + ',' + from.c;
  const seen = {};
  seen[key0] = 1;
  const qq = [from];
  while (qq.length) {
    const p = qq.shift();
    if (samePos(p, to)) break;
    [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(d => {
      const nv = { r: p.r + d[0], c: p.c + d[1] };
      const k = nv.r + ',' + nv.c;
      if (!inSize(size, nv) || bad(nv) || seen[k]) return;
      seen[k] = 1;
      prev[k] = p.r + ',' + p.c;
      qq.push(nv);
    });
  }
  const tk = to.r + ',' + to.c;
  if (!seen[tk]) return null;
  const path = [];
  let cur = tk;
  while (cur !== key0) { const pp = cur.split(','); path.unshift({ r: +pp[0], c: +pp[1] }); cur = prev[cur]; }
  path.unshift({ r: from.r, c: from.c });
  return path;
}
const mazeKeyOf = q => q.size + '|' + q.entry.r + ',' + q.entry.c + '>' + q.goal.r + ',' + q.goal.c +
  '|' + q.walls.map(w => w.r + ',' + w.c).sort().join(';') +
  (q.key ? '|K' + q.key.r + ',' + q.key.c + 'D' + q.door.r + ',' + q.door.c : '');

/* ---------- 单局生成（确定性）：sub∈{1,2,3} 子型 ---------- */
const SUB_SIZE = { 1: 5, 2: 7, 3: 7 };
const SUB_WALL_LO = { 1: 2, 2: 6, 3: 6 };   // sub3 = 分隔行 6 墙 + 附加 0-4
const SUB_WALL_HI = { 1: 4, 2: 10, 3: 10 };
const SUB_DIST_LO = { 1: 4, 2: 8, 3: 8 };
const SUB_DIST_HI = { 1: 6, 2: 12, 3: 12 };

function buildMaze(sub, rnd, flat, qi, prevQ) {
  /* flat0 局0 教学演示锚点：5×5 entry(1,1)→goal(1,3) dist=2 无墙
     （幽灵手指点 (1,2) 走一步 → 点 (1,3) 到萝卜 = 走 2 步演示，SPEC §3） */
  if (flat === 0 && qi === 0) {
    return { sub: 1, size: 5, entry: { r: 1, c: 1 }, goal: { r: 1, c: 3 }, walls: [],
             key: null, door: null, pos: { r: 1, c: 1 }, trail: [{ r: 1, c: 1 }],
             hasKey: false, _miss: 0, _answered: false };
  }
  const size = SUB_SIZE[sub];

  /* ---- sub3 钥匙门：分隔行走廊构造（门=整行唯一缺口 → 恒必经割点） ---- */
  if (sub === 3) {
    for (let t = 0; t < 40; t++) {
      const sr = ri(rnd, 2, 4);                       // 分隔行（内部行 2-4）
      const sc = ri(rnd, 1, 5);                       // 门列（留边不贴墙）
      const door = { r: sr, c: sc };
      const walls = [];
      for (let c = 0; c < 7; c++) if (c !== sc) walls.push({ r: sr, c: c });   // 分隔行 6 墙
      /* 附加墙（0-4，分歧行上下各随机放；放后三段验证，破坏即重摆本轮） */
      const extra = ri(rnd, 0, 4);
      const upCells = [], dnCells = [];
      for (let r = 0; r < sr; r++) for (let c = 0; c < 7; c++) upCells.push({ r: r, c: c });
      for (let r = sr + 1; r < 7; r++) for (let c = 0; c < 7; c++) dnCells.push({ r: r, c: c });
      /* entry=上半（距门 ≥3）、goal=下半（对角感远距） */
      const upPool = upCells.filter(p => distOf(p, door) >= 3);
      const entry = upPool.length ? upPool[Math.floor(rnd() * upPool.length)] : { r: 0, c: 0 };
      const dnPool = dnCells.filter(p => distOf(entry, p) >= SUB_DIST_LO[3]);
      if (!dnPool.length) continue;
      const goal = dnPool[Math.floor(rnd() * dnPool.length)];
      if (distOf(entry, goal) > SUB_DIST_HI[3]) continue;
      /* key=上半（非 entry，距 entry ≥2 距门 ≥2） */
      const keyPool = upCells.filter(p => !samePos(p, entry) && distOf(p, entry) >= 2 && distOf(p, door) >= 2);
      if (!keyPool.length) continue;
      const key = keyPool[Math.floor(rnd() * keyPool.length)];
      /* 附加墙随机放（上下半，避 entry/goal/key/door），放满 extra 个 */
      const spots = shuffled(upCells.concat(dnCells).filter(p =>
        !samePos(p, entry) && !samePos(p, goal) && !samePos(p, key) && !samePos(p, door)), rnd);
      for (let k = 0; k < spots.length && walls.length - 6 < extra; k++) walls.push(spots[k]);
      const L3 = { sub: 3, size: 7, entry: entry, goal: goal, walls: walls,
                   key: key, door: door, pos: { r: entry.r, c: entry.c },
                   trail: [{ r: entry.r, c: entry.c }], hasKey: false, _miss: 0, _answered: false };
      /* 三段验证（§0.75：门关 entry→key 通 + 门开 key→goal 通 + 门关 entry→goal 不通=门必经） */
      const doorShut = bfsReach(7, walls, entry, key, [door]) &&
                       bfsReach(7, walls, key, goal, []) &&
                       !bfsReach(7, walls, entry, goal, [door]);
      if (doorShut) {
        if (prevQ && mazeKeyOf(prevQ) === mazeKeyOf(L3) && t < 39) continue;   // 相邻局互异（末掷放行）
        return L3;
      }
    }
    /* 兜底（理论不可达）：第 3 行全墙仅 (3,3) 缺口=门；key=(0,3) 顶行可达；goal=(6,6) */
    const walls = [];
    for (let c = 0; c < 7; c++) if (c !== 3) walls.push({ r: 3, c: c });
    return { sub: 3, size: 7, entry: { r: 0, c: 0 }, goal: { r: 6, c: 6 }, walls: walls,
             key: { r: 0, c: 3 }, door: { r: 3, c: 3 }, pos: { r: 0, c: 0 },
             trail: [{ r: 0, c: 0 }], hasKey: false, _miss: 0, _answered: false };
  }

  /* ---- sub1/sub2 无门：随机摆墙 + BFS 可达验证 ---- */
  for (let t = 0; t < 40; t++) {
    const cells = [];
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) cells.push({ r: r, c: c });
    const entry = cells[Math.floor(rnd() * cells.length)];
    const goalPool = cells.filter(p => distOf(p, entry) >= SUB_DIST_LO[sub] && distOf(p, entry) <= SUB_DIST_HI[sub]);
    if (!goalPool.length) continue;
    const goal = goalPool[Math.floor(rnd() * goalPool.length)];
    const nWall = ri(rnd, SUB_WALL_LO[sub], SUB_WALL_HI[sub]);
    const free = shuffled(cells.filter(p => !samePos(p, entry) && !samePos(p, goal)), rnd);
    const walls = free.slice(0, nWall);
    if (!bfsReach(size, walls, entry, goal)) continue;                // 不可达=整局重生成
    const L2 = { sub: sub, size: size, entry: entry, goal: goal, walls: walls,
                 key: null, door: null, pos: { r: entry.r, c: entry.c },
                 trail: [{ r: entry.r, c: entry.c }], hasKey: false, _miss: 0, _answered: false };
    if (prevQ && mazeKeyOf(prevQ) === mazeKeyOf(L2) && t < 39) continue;
    return L2;
  }
  /* 兜底（理论不可达）：对角走廊 + 离路墙（确定性可解） */
  const size2 = SUB_SIZE[sub];
  const walls2 = size2 === 5 ? [{ r: 2, c: 1 }, { r: 1, c: 3 }, { r: 3, c: 3 }]
                            : [{ r: 1, c: 2 }, { r: 2, c: 4 }, { r: 3, c: 1 },
                               { r: 4, c: 5 }, { r: 5, c: 2 }, { r: 1, c: 5 }];
  return { sub: sub, size: size2, entry: { r: 0, c: 0 }, goal: { r: size2 - 1, c: size2 - 1 },
           walls: walls2, key: null, door: null, pos: { r: 0, c: 0 },
           trail: [{ r: 0, c: 0 }], hasKey: false, _miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   生成关 dch 取数前 burn 一掷：mulberry32(flat*7919+37) 首掷对 4 有系统偏差
   （b25 坑④ coder 实测同源）；burn+ri 仍是该 rnd 流固定首个消耗——确定性保持 ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % LEVELS_PER_CH;
  const rnd = mulberry32(flat * 7919 + 37);
  if (flat >= STATIC_LEVELS) rnd();                          // burn：首掷偏差修正（仅生成关消耗）
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const mazes = [];
  let prev = null;
  for (let qi = 0; qi < RUNS_PER_LEVEL; qi++) {
    const sub = dch === 4 ? ri(rnd, 1, 3) : dch;             // ch4 混合：局间掷子型
    const m = buildMaze(sub, rnd, flat, qi, prev);
    mazes.push(m);
    prev = m;
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           mazes: mazes, step: 0, retries: 0, done: false };
}

/* ---------- 逐格点选引擎（无 DOM）：engTapCell(L, r, c) —— 点 (r,c) 格
   'moved' 相邻可行格移动（含拾钥匙：hasKey 变真 / 过门：已拿钥匙后门格=普通格）
   'back'  回退已走格（trail 内格；不记 miss——死路自救）
   'right' 到达萝卜格=本局完成 / 'done' 末局=通关
   'wrong' 障碍格（不论远近）/ 对角 / 不相邻（含点自身）/ 未拿钥匙点门——miss+1
   null    越界 / 局已结束 / 关卡已结束 ---------- */
function engTapCell(L, r, c) {
  if (!L || L.done || L.step >= L.mazes.length) return null;
  const q = L.mazes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(r) || !Number.isInteger(c) ||
      r < 0 || r >= q.size || c < 0 || c >= q.size) return null;
  const p = { r: r, c: c };
  if (isWall(q.walls, p)) {                                   // 障碍格（含点远墙）
    q._miss++; L.retries++; return 'wrong';
  }
  if (q.door && samePos(q.door, p) && !q.hasKey) {            // 未拿钥匙点门（不论远近）
    q._miss++; L.retries++; return 'wrong';
  }
  if (distOf(p, q.pos) !== 1) {                               // 对角 / 跳格 / 不相邻（含点自身）
    q._miss++; L.retries++; return 'wrong';
  }
  if (samePos(p, q.goal)) {                                   // 到萝卜=局终（走通即 right，解不唯一）
    q._answered = true;
    L.step++;
    if (L.step >= L.mazes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  const ti = q.trail.findIndex(s => samePos(s, p));
  if (ti >= 0) {                                              // 回退已走格：截断足迹（不记 miss）
    q.trail = q.trail.slice(0, ti + 1);
    q.pos = { r: r, c: c };
    return 'back';
  }
  q.trail.push({ r: r, c: c });                               // moved（含拾钥匙）
  q.pos = { r: r, c: c };
  if (q.key && !q.hasKey && samePos(q.key, p)) q.hasKey = true;   // 拾钥匙：moved + hasKey 变真
  return 'moved';
}
const engWon = L => !!L && L.done;
/* 星级（§0.75 miss 口径同族）：全关 miss 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));

/* ---------- 求解器：当前局下一步应点格（BFS 最短路第二格）
   未拿钥匙（sub3）→ 目标=key（门视障碍）；拿到 / 无门 → 目标=goal（门可走）
   教学帮指 / 答案级救援 / autoSolve 共用。无解=null（生成先验保证不出现） ---------- */
function solveNext(q) {
  if (!q || q._answered) return null;
  const needKey = !!(q.key && !q.hasKey);
  const dest = needKey ? q.key : q.goal;
  const block = needKey ? [q.door] : [];
  const path = bfsPath(q.size, q.walls, q.pos, dest, block);
  return path && path.length >= 2 ? path[1] : null;
}

/* ---------- 结构校验（verify 用，返回失败原因或 null）：子型/尺寸/墙域/距离域 /
   墙格界内互异不压要点 / 分段三验（sub3） / 可解性（sub1/2） / 相邻互异 /
   flat0q0 锚点 / 初始态干净 ---------- */
function structWhy(q, dch, flat, qi, prevQ) {
  if (!q) return 'q';
  const sub = q.sub;
  if (sub !== 1 && sub !== 2 && sub !== 3) return 'sub';
  if (dch !== 4 && sub !== dch) return 'subDch';              // ch1-3 子型=章型；ch4 局间混出
  if (q.size !== SUB_SIZE[sub]) return 'size';
  if (!inSize(q.size, q.entry) || !inSize(q.size, q.goal)) return 'grid';
  const d = distOf(q.entry, q.goal);
  if (flat === 0 && qi === 0) {                               // 教学锚点（走 2 步到萝卜）
    if (!(q.size === 5 && q.entry.r === 1 && q.entry.c === 1 &&
          q.goal.r === 1 && q.goal.c === 3 && q.walls.length === 0 &&
          !q.key && !q.door && d === 2)) return 'anchor';
  } else {
    if (d < SUB_DIST_LO[sub] || d > SUB_DIST_HI[sub]) return 'dist';
  }
  const ws = q.walls;
  const anchor = flat === 0 && qi === 0;
  if (!anchor && (ws.length < SUB_WALL_LO[sub] || ws.length > SUB_WALL_HI[sub])) return 'wallN';
  const keyset = new Set(ws.map(w => w.r + ',' + w.c));
  if (keyset.size !== ws.length) return 'wallDup';
  if (ws.some(w => !inSize(q.size, w) || samePos(w, q.entry) || samePos(w, q.goal))) return 'wallCell';
  if (sub < 3) {
    if (q.key || q.door) return 'doorCh';                     // 无门章不得带门钥
    if (!bfsReach(q.size, ws, q.entry, q.goal)) return 'unreach';
  } else {
    if (!q.key || !q.door) return 'noKeyDoor';
    if (!inSize(q.size, q.key) || !inSize(q.size, q.door)) return 'kdGrid';
    if (samePos(q.key, q.entry) || samePos(q.key, q.goal) || samePos(q.key, q.door)) return 'keyCell';
    if (samePos(q.door, q.entry) || samePos(q.door, q.goal)) return 'doorCell';
    if (keyset.has(q.key.r + ',' + q.key.c) || keyset.has(q.door.r + ',' + q.door.c)) return 'kdWall';
    if (!bfsReach(q.size, ws, q.entry, q.key, [q.door])) return 'segKey';     // 门关 entry→key
    if (!bfsReach(q.size, ws, q.key, q.goal, [])) return 'segGoal';           // 门开 key→goal
    if (bfsReach(q.size, ws, q.entry, q.goal, [q.door])) return 'doorBypass'; // 门关 entry→goal 必不通
  }
  if (prevQ && mazeKeyOf(prevQ) === mazeKeyOf(q)) return 'adjacent';          // 相邻局布局互异
  if (!samePos(q.pos, q.entry)) return 'pos';
  if (q.trail.length !== 1 || !samePos(q.trail[0], q.entry)) return 'trail';
  if (q.hasKey) return 'hasKey';
  if (q._miss !== 0 || q._answered) return 'init';
  return null;
}
/* ================= maze 主逻辑（迷宫渲染 / 逐格点选走位 / 足迹回退 / 教学 / 救援 / 推进）
   玩法：题面 = size×size 网格迷宫（小兔 / 萝卜 / 树篱墙 /（ch3）钥匙+门 SVG）+ 题面句；
   点相邻可行格 = 小兔走一格（'moved'，走格动画 + 足迹点）；点已走格 = 合法回退
   （'back'，足迹截断，不记 miss——死路自救）；到萝卜 = 局终（'right' / 末局 'done'，
   判对确认 = maz_right clip 局终庆祝无拼播链）；点障碍 / 对角 / 不相邻 = 'wrong' + miss
   轻反馈（迷宫试错 = 探索：pop + 网格容器 bump + 目标格 deny 闪，**不 wig 人格否定** +
   相邻可行格 pulse 高亮=方向级线索）；未拿钥匙点门 = 'wrong' + miss + maz_key「先找
   钥匙哦」（钥匙门 = 规划进阶非陷阱）；拾钥匙 = 'moved' + hasKey + 「拿到钥匙啦」TTS
   + 钥匙徽章点亮；每关 3 局（SPEC §0.75 破 5 题惯例）。
   救援两级（§0.75/家族 B 定版）：14s 方向级 = 重读题面 + 相邻可行格 pulse（lastDir
   独立节流锚，不重置 lastAct）；30s 答案级 = BFS 最短路下一格 breathe + 重读
   （solveNext 实算）；教学"帮"5s 重演示。
   语音窗（家族 G/H/I/N，clip 实长 SPEC-BATCH30 §4）：
   maz_tut_watch 3264 → 教学演示 tap 延至 t=900+3000=3900（≥3264+300=3564，禁撞头）；
   maz_tut_turn 1800 → turn 后读题延 2200（≥1800+300 防尾截）；
   教学 demo 机制句 8 字（点旁边的格子走路 estMs=3360）→ demo 局终演出窗 3700
     （≥3360+300）；
   maz_right 2424 → 局终演出窗 2800（≥2424+300=2724）；winFlow celebrate(2620)+
     wait(400)=3020 ≥2724（契约 H）；
   maz_wrong 2664 + 语义句 TTS「点小兔旁边的格子」（estMs(8)=3360）→ 拼播链
     2664+150+3360=6174，错点防重入窗 1000ms；救援读题掐链由 wrongChainUntil=6500
     守卫（≥2664+150+2544+300=5658，maz_guide clip 实长，家族 I）；
   maz_key 1896（未钥点门单段链）→ wrongChainUntil=2400（≥1896+300=2196，家族 I）。
   T46 阶段2（2026-09-19）：引导句/拾钥匙句/demo 句 clip 化（maz_guide/maz_keyget/
   maz_demo 键段，text=TTS 兜底）——全款 keyless 段清零（Mj-1 链尾约束自然解除）。
   验收钩子：window.MZ = { get currentLevel, get quiz(){maze{size,walls[],key,door,
   entry,goal}, pos{r,c}, hasKey, step(局内已走步数), miss}, tapCell(r,c), start(flat),
   async autoSolve(), get tutorial }——tapCell 返回值族：moved(含拾钥匙/过门)/
   back(回退已走格)/right(到萝卜)/done(末局)/wrong(障碍·对角·不相邻·未钥点门)/
   null(越界或演出窗)，全 async；getter 返回拷贝；maze 每局固定（不随移动变，
   pos 反映当前位置）。教学实证 window.__mzDemoR。 */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速

const replayAnim = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
/* 救援/开场任务语音/读题不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错链节流：flat<3 每错必播；flat≥3 走 10s 节流（家族 J：语义句全程保留，禁切通用 clip） */
let lastWrongVoice = 0;
let wrongChainUntil = 0;                         /* 错反馈链豁免窗终点（救援 interval 让路，家族 I） */
const sayW = parts => {
  if (!cur) return false;
  if (cur.flat < 3) { KIDS.voice.queue(parts); return true; }
  const now = Date.now();
  if (now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.queue(parts); return true; }
  return false;                            /* 节流未播返回 false——豁免窗仅链起播时设（契约 I「起播设」） */
};

const sceneEl = $id('scene');
const gridEl0 = () => sceneEl.querySelector('.grid');   /* 每局重渲染，取现引用 */
const rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear'),
      ghostEl = $id('ghost');

let lastDir = Date.now();                       /* 14s 方向级独立节流锚（家族 B：与 lastAct 分离） */
let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）

const cellEl = (r, c) => sceneEl.querySelector('.cell[data-r="' + r + '"][data-c="' + c + '"]');

/* ================= 题面语音（统一 maz_q clip「帮小兔子吃到萝卜」） ================= */

/* ================= 渲染 ================= */
/* 小兔定位（网格内绝对定位，left/top 按格心——transition .32s 即走格动画；泛化 size） */
function placeBun(pos) {
  const g = gridEl0(), bun = g && g.querySelector('.bun');
  if (!g || !bun) return;
  const size = curMaze() ? curMaze().size : 5;
  const gap = 6, gw = g.clientWidth;
  const cw = (gw - gap * (size - 1)) / size, bs = bun.offsetWidth || 82;
  bun.style.left = (pos.c * (cw + gap) + (cw - bs) / 2) + 'px';
  bun.style.top = (pos.r * (cw + gap) + (cw - bs) / 2) + 'px';
  bun.dataset.r = pos.r; bun.dataset.c = pos.c;      /* 帧内容断言（verify 直读） */
}
/* 撞墙（相邻墙错点）：小兔朝该方向顶一下弹回（视觉解释「过不去」） */
function nudgeBun(dr, dc) {
  const bun = gridEl0() && gridEl0().querySelector('.bun');
  if (!bun) return;
  ['nudge-up', 'nudge-down', 'nudge-left', 'nudge-right'].forEach(c => bun.classList.remove(c));
  void bun.offsetWidth;
  bun.classList.add(dr < 0 ? 'nudge-up' : dr > 0 ? 'nudge-down' : dc < 0 ? 'nudge-left' : 'nudge-right');

/* 相邻可行格 pulse 高亮（错反馈方向级 + 14s 方向级救援共用：§0.75 方向级=相邻可行格） */
function walkHint() {
  const q = curMaze();
  if (!q) return;
  [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(d => {
    const p = { r: q.pos.r + d[0], c: q.pos.c + d[1] };
    if (!inSize(q.size, p) || isWall(q.walls, p)) return;
    if (q.door && !q.hasKey && samePos(q.door, p)) return;   // 未钥门不算可行格
    const el = cellEl(p.r, p.c);
    if (el) { el.classList.remove('walk-hint'); void el.offsetWidth; el.classList.add('walk-hint');
              setTimeout(() => el.classList.remove('walk-hint'), 1300); }
  });
}
function renderRun(speak) {                      // 局题面：题面句条 +（ch3）钥匙徽章 + size×size 网格

/* 足迹增量更新（moved/back 后；renderRun 不重建——走格动画连续性） */
function paintTrail(prevTrail, newTrail) {

  Object.keys(gone).forEach(k => { const el = cellEl(+k.split(',')[0], +k.split(',')[1]); if (el) el.classList.remove('trail-cell'); });
  newTrail.forEach(t => { const el = cellEl(t.r, t.c); if (el) el.classList.add('trail-cell'); });

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;

  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关随机章型 GEN[dch-1]（家族 F：
     genLevel 纯函数确定性，同 flat 恒同 dch——预告与实际章型恒一致；禁 (ci+1)%4 章序推进） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;

    renderDots();

      setTimeout(proceed, 3400);
    } else if (dayDone) {

/* ================= 无操作看护（命名函数 rescueTick——verify 源码级断言用）：

/* ================= 验收钩子（getter 模式，返回拷贝非活引用；start(flat)=外部切关入口）
   MZ.quiz：maze={size,walls[],key,door,entry,goal}（每局固定，不随移动变——key/door
   无门局为 null）/ pos={r,c}（小兔当前格）/ hasKey / step=trail.length-1（局内已走步数，
   回退后随足迹截断变小）/ miss=本局 miss。currentLevel.step=局序（0-2）、
   currentLevel.miss=全关 miss 合计（星级口径） ================= */
window.MZ = {
  start(flat) { startLevel(flat); },
  get currentLevel() {
    if (!cur) return null;
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, n: cur.mazes.length,
             step: cur.step, done: cur.done, won: state.won,
             miss: cur.retries, stars: engStars(cur) };
  },
  get quiz() {
    const q = curMaze();
    if (!q) return null;
    return { maze: { size: q.size,
                     walls: q.walls.map(w => ({ r: w.r, c: w.c })),
                     key: q.key ? { r: q.key.r, c: q.key.c } : null,
                     door: q.door ? { r: q.door.r, c: q.door.c } : null,
                     entry: { r: q.entry.r, c: q.entry.c },
                     goal: { r: q.goal.r, c: q.goal.c } },
             pos: { r: q.pos.r, c: q.pos.c },
             hasKey: !!q.hasKey,
             step: q.trail.length - 1,
             miss: q._miss || 0 };
  },
  tapCell(r, c) { return uiTapCell(r, c); },
  async autoSolve() {                    // UI 路径自动走完当前关（3 局合计 taps，BFS 逐步点真实判定链）
    let taps = 0, guard = 0;
    while (cur && !cur.done && guard++ < 300) {
      const q = curMaze();
      if (!q) break;
      const p = solveNext(q);
      if (!p) break;                             // 无解（生成先验保证不出现）
      const r = await uiTapCell(p.r, p.c);
      if (r === null) break;                     // 锁死/重玩保护
      taps++;
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
  get tutorial() { return state.tut; }

      const had = q.hasKey;
      const atDoor = q.door && p.r === q.door.r && p.c === q.door.c;
      const r = await MZ.tapCell(p.r, p.c);
      if (r === null) break;
      if (!had && q.hasKey) { keyTurn = true; if (window.__playLog.some(e => e[0] === 'maz_keyget' && e[1] === SPEC_SENT.getKey)) sawSay = true; }
      if (atDoor && r === 'moved') passed = true;
    }
    keyOk = keyTurn && sawSay;
    passOk = passed;
    doneOk = !!(cur && cur.done);
  }
  const tapOk = initOk && bad1 && bad2 && bad3 && bad4 && wrongOk && movOk && backOk &&
                rightOk && wallOk && doorWrongOk && keyOk && passOk && doneOk;
  if (tapOk) npass++;
  units.tap = { ok: tapOk, init: initOk, coord: bad1 && bad2 && bad3 && bad4, wrong: wrongOk,
                moved: movOk, back: backOk, right: rightOk, wall: wallOk,
                doorWrong: doorWrongOk, getKey: keyOk, doorPass: passOk, done: doneOk };

  /* ---- ④ 回退专测：走 2 步 → back → 重走通（全程 miss 不增） ---- */
  total++;
  startLevel(0);
  await MZ.tapCell(1, 2);                                        // 局0 走通（此前已 right 过一次，确定性同局）
  await MZ.tapCell(1, 3);
  const adv4 = await advanceRunTo(0, 1);                         // 局1：路径长 ≥4
  const q4 = MZ.quiz;
  const path4 = q4 ? specPath(q4.maze.size, q4.maze.walls, [], q4.maze.entry, q4.maze.goal) : null;
  let reOk = false;
  if (adv4 && path4 && path4.length >= 4) {
    const m0 = MZ.quiz.miss;
    await MZ.tapCell(path4[1].r, path4[1].c);                    // 走 2 步
    await MZ.tapCell(path4[2].r, path4[2].c);
    const s2 = MZ.quiz.step;
    const rb = await MZ.tapCell(path4[1].r, path4[1].c);         // 回退 1 步（已走格相邻）
    const s1 = MZ.quiz.step;
    const m1 = MZ.quiz.miss;
    let rr = null;
    for (let i = 1; i < path4.length; i++) rr = await MZ.tapCell(path4[i].r, path4[i].c);   // 重走通
    reOk = rb === 'back' && s2 === 2 && s1 === 1 && m1 === m0 && rr === 'right' && MZ.quiz.miss === m0;
  }
  if (reOk) npass++;
  units.retreat = { ok: reOk, pathLen: path4 ? path4.length : -1 };

  /* ---- ⑤ 教学链：tutorialWatch 真实走完 → __mzDemoR='right'（走 2 步到萝卜） ---- */
  total++;
  KIDS._save = function () { return { levels: {} }; };           // verify 页存档 stub
  KIDS.store.persist = function () {};
  startLevel(0);
  window.__lastSay = null;
  window.__playLog = [];                                         // T46 阶段2：demo 句改 play，走调用日志断言
  const t0 = Date.now();
  await tutorialWatch();
  const tw = (Date.now() - t0) / SPEED;                          // 折算真实页时长
  const tutOk = window.__mzDemoR === 'right' && state.tut === 'help' &&
                cur.flat === 0 && cur.mazes[0].entry.r === 1 && cur.mazes[0].entry.c === 1 &&
                cur.mazes[0].goal.r === 1 && cur.mazes[0].goal.c === 3 &&   // 锚点重建
                window.__playLog.some(e => e[0] === 'maz_demo' && e[1] === SPEC_SENT.demo) &&   // demo 机制句 clip（T46）
                tw <= 16000;
  if (tutOk) npass++;
  units.tutorial = { ok: tutOk, demoR: window.__mzDemoR, tut: state.tut,
                     demoPlay: window.__playLog.filter(e => e[0] === 'maz_demo'), watchMs: Math.round(tw) };

  /* ---- ⑥ 吞输入轻叮+可见回应：demo/locked 门拦钩子输入=null + 网格容器 bump ---- */
  total++;
  startLevel(0);
  state.demo = true; state.locked = true;                        // 模拟教学"看"演示期
  const sw1 = (await MZ.tapCell(1, 2)) === null &&
              gridEl0().classList.contains('bump');
  state.demo = false; state.locked = true;                       // 演出窗口（locked）
  const sw2 = (await MZ.tapCell(1, 2)) === null;
  state.locked = false;                                          // 还原
  const swallowOk = sw1 && sw2 && MZ.quiz.step === 0 && MZ.quiz.miss === 0;
  if (swallowOk) npass++;
  units.swallow = { ok: swallowOk, demo: sw1, locked: sw2 };

  /* ---- ⑦ UI 冒烟 A：flat0 autoSolve 通关（taps=3 局合计，恒 3 星） ---- */
  total++;
  startLevel(0);
  const a0 = await MZ.autoSolve();
  const lv0 = MZ.currentLevel;
  const smokeA = a0.done && a0.taps >= 6 && lv0.done && lv0.won &&
                 engStars(cur) === 3 && !document.querySelector('.k-celebrate');
  if (smokeA) npass++;
  smokes.flat0 = { ok: smokeA, taps: a0.taps, stars: engStars(cur) };

  /* ---- ⑧ UI 冒烟 B：flat10（dch3）先制造 1 次 wrong 再 autoSolve（1 错=2 星） ---- */
  total++;
  startLevel(10);
  const q8 = MZ.quiz;
  const r8 = await MZ.tapCell(q8.maze.door.r, q8.maze.door.c);   // 未拿钥匙点门=wrong
  const a10 = await MZ.autoSolve();
  const lv10 = MZ.currentLevel;
  const smokeB = r8 === 'wrong' && a10.done && lv10.done && lv10.won &&
                 lv10.miss === 1 && engStars(cur) === 2;
  if (smokeB) npass++;
  smokes.flat10 = { ok: smokeB, r8: r8, taps: a10.taps, miss: lv10.miss, stars: engStars(cur) };

  /* ---- ⑨ ch3 钥匙路径驱动（flat10-14 五关）：全通+每关钥匙转变+过门 ---- */
  total++;
  let k9 = 0, d9 = 0, ok9 = true, stars9 = [];
  for (const flat of [10, 11, 12, 13, 14]) {
    startLevel(flat);
    let g = 0, turn = false, pass = false;
    while (cur && !cur.done && g++ < 300) {
      const q = curMaze();
      const p = solveNext(q);
      if (!p) { ok9 = false; break; }
      const had = q.hasKey;
      const atDoor = q.door && p.r === q.door.r && p.c === q.door.c;
      const r = await MZ.tapCell(p.r, p.c);
      if (r === null) { ok9 = false; break; }
      if (!had && q.hasKey) turn = true;
      if (atDoor && r === 'moved') pass = true;
    }
    if (!(cur && cur.done && turn && pass && engStars(cur) === 3)) ok9 = false;
    if (turn) k9++;
    if (pass) d9++;
    stars9.push(cur && cur.done ? engStars(cur) : 0);
  }
  if (ok9 && k9 === 5 && d9 === 5) npass++;
  smokes.keydrive = { ok: ok9 && k9 === 5 && d9 === 5, keyTurns: k9, doorPasses: d9, stars: stars9 };

  /* ---- ⑩ 帧内容断言（契约 M）：四关每局 DOM 数/类对账 + 逐 tap 小兔位置==pos ---- */
  total++;
  let frameOk = true, frameBad = '';
  for (const flat of [0, 6, 10, 16]) {
    startLevel(flat);
    for (let run = 0; run < RUNS_PER_LEVEL && frameOk; run++) {
      const q = MZ.quiz;
      if (!q) { frameOk = false; frameBad = 'quiz' + flat + '/' + run; break; }
      const g = gridEl0();
      const cells = g.querySelectorAll('.cell');
      const cellN = cells.length === q.maze.size * q.maze.size;
      const wallN = g.querySelectorAll('.cell.wall').length === q.maze.walls.length;
      const doorN = g.querySelectorAll('.cell.door-cell').length === (q.maze.door ? 1 : 0);
      const keyN = g.querySelectorAll('.cell.key-cell').length === (q.maze.key && !q.hasKey ? 1 : 0);
      const bun = g.querySelector('.bun');
      const bunOk = bun && +bun.dataset.r === q.pos.r && +bun.dataset.c === q.pos.c;
      if (!(cellN && wallN && doorN && keyN && bunOk)) {
        frameOk = false; frameBad = 'init ' + flat + '/' + run + ' ' + [cellN, wallN, doorN, keyN, bunOk]; break;
      }
      let guard = 0;
      while (cur.step === run && !cur.done && frameOk && guard++ < 100) {   // 局内逐 tap 小兔位置对账
        const qq = curMaze();
        const p = solveNext(qq);
        if (!p) { frameOk = false; frameBad = 'solve ' + flat + '/' + run; break; }
        const r = await MZ.tapCell(p.r, p.c);
        if (r === null) { frameOk = false; frameBad = 'tap ' + flat + '/' + run; break; }
        if (r === 'done') break;                          // 末局通关：winFlow 接管（quiz 归 null）
        const b2 = gridEl0().querySelector('.bun');
        const pz = MZ.quiz;
        if (!b2 || !pz || +b2.dataset.r !== pz.pos.r || +b2.dataset.c !== pz.pos.c) {
          frameOk = false; frameBad = 'bun ' + flat + '/' + run; break;
        }
      }
    }
  }
  if (frameOk) npass++;
  units.frame = { ok: frameOk, bad: frameBad };

  /* ---- ⑪ 布局：双 viewport ×（flat0 5×5 / flat6 7×7 / flat10 门 / flat17 混合）量测 ---- */
  function lum(hexStr) {
    const m = hexStr.match(/#?([0-9a-f]{6})/i);
    if (!m) return null;
    const n = [0, 2, 4].map(i => parseInt(m[1].substr(i, 2), 16) / 255)
      .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    return 0.2126 * n[0] + 0.7152 * n[1] + 0.0722 * n[2];
  }
  const ratioOf = (a, b) => { const x = lum(a), y = lum(b);
    return x == null || y == null ? 0 : (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const cssToHex = c => { const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    return m ? '#' + [1, 2, 3].map(i => ('0' + (+m[i]).toString(16)).slice(-2)).join('') : c; };
  function simView(w, h) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    startLevel(g._simFlat);
    const cells = Array.prototype.map.call(gridEl0().querySelectorAll('.cell'), b => ({
      w: b.offsetWidth, h: b.offsetHeight }));
    const q = MZ.quiz;
    const cellOk = cells.length === q.maze.size * q.maze.size &&
                   cells.every(b => b.w >= 72 && b.h >= 72);     // 格 ≥72（本款触摸口径）
    const cB = ratioOf('#4A3B2E', '#FBF6EC') >= 3 &&
               ratioOf(cssToHex(getComputedStyle(gridEl0().querySelector('.cell')).borderLeftColor), '#EAF2DC') >= 2;
    const cS = ratioOf(cssToHex(getComputedStyle(sceneEl).borderLeftColor), '#FBF6EC') >= 3;
    const de = document.documentElement;
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, cells: cells.length, size: q.maze.size, cellOk: cellOk,
             contrast: cB && cS, ox: ox, pass: cellOk && cB && cS && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const flat of [0, 6, 10, 17]) {
    $id('game')._simFlat = flat;
    sims.push(simView(1280, 800));
    sims.push(simView(800, 1180));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                                 // 还原真实 viewport 布局
  const layoutOk = sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑫ clips：maz_ 10 条（T46 阶段2 +guide/keyget/demo）+ core 3 条全注入 + 时长身份辨别器（SPEC §4 ±60ms） ---- */
  total++;
  const clipKeys = Object.keys(KIDS.voice.clips);
  const need = ['maz_tut_watch', 'maz_tut_turn', 'maz_hint', 'maz_right', 'maz_wrong', 'maz_q', 'maz_key',
                'maz_guide', 'maz_keyget', 'maz_demo',
                'core_chapter_end', 'core_day_end', 'core_rest'];
  const preOk = clipKeys.length === 13 &&
    need.every(k => clipKeys.indexOf(k) >= 0 && KIDS.voice.clips[k].indexOf('data:audio/mpeg;base64,') === 0);
  const durKeys = Object.keys(SPEC_DUR);
  const durs = await Promise.all(durKeys.map(k => new Promise(res => {
    let done = false;
    const a = new Audio(KIDS.voice.clips[k]);
    const t = setTimeout(() => { if (!done) { done = true; res(-2); } }, 3000);
    a.onloadedmetadata = () => { if (!done) { done = true; clearTimeout(t); res(Math.round(a.duration * 1000)); } };
    a.onerror = () => { if (!done) { done = true; clearTimeout(t); res(-1); } };
  })));
  const durOk = durs.every((d, i) => Math.abs(d - SPEC_DUR[durKeys[i]]) <= 60);
  const clipsOk = preOk && durOk;
  if (clipsOk) npass++;
  units.clips = { ok: clipsOk, n: clipKeys.length, durs: durs };

  /* ---- ⑬ 星级规则（引擎级构造直测：0=3★ / 1-2=2★ / ≥3=1★，永不 0 星） ---- */
  total++;
  const LA = genLevel(10);
  LA.retries = 0; const st3 = engStars(LA) === 3;
  LA.retries = 1; const st2a = engStars(LA) === 2;
  LA.retries = 2; const st2b = engStars(LA) === 2;
  LA.retries = 3; const st1 = engStars(LA) === 1;
  LA.retries = 9; const stFloor = engStars(LA) === 1;   // 永不 0 星
  const starsOk = st3 && st2a && st2b && st1 && stFloor;
  if (starsOk) npass++;
  units.stars = { ok: starsOk, st3: st3, st2: st2a && st2b, st1: st1, floor: stFloor };

  /* ---- ⑭ 章末预告 C7 关键词断言（hint[i] ↔ CHAPTERS[i+1]；GEN_HINTS[k] ↔ dch=k+1） ---- */
  total++;
  const hintOk = CHAPTERS[1].hint.indexOf('大') >= 0 &&                          // 预告 ch2 7×7 大迷宫
                 CHAPTERS[2].hint.indexOf('钥匙') >= 0 &&                        // 预告 ch3 钥匙门
                 CHAPTERS[3].hint.indexOf('混') >= 0 && CHAPTERS[3].hint.indexOf('挑战') >= 0 &&   // 预告 ch4
                 CHAPTERS[4].hint.indexOf('新') >= 0 &&                          // 预告生成关
                 GEN_HINTS[0].indexOf('小') >= 0 &&                              // dch1 小迷宫
                 GEN_HINTS[1].indexOf('大') >= 0 &&                              // dch2 大迷宫
                 GEN_HINTS[2].indexOf('钥匙') >= 0 &&                            // dch3 钥匙门
                 GEN_HINTS[3].indexOf('集合') >= 0;                             // dch4 混合
  const genOk = [24, 29, 34, 39].every(f => nextHint(f) === GEN_HINTS[genLevel(f + 1).dch - 1]);   // 家族 F：实算下一关 dch
  if (hintOk && genOk) npass++;
  units.hints = { ok: hintOk && genOk, chapters: [1, 2, 3, 4].map(i => CHAPTERS[i].hint), gen: GEN_HINTS };

  /* ---- ⑮ verify 提速断言 ---- */
  total++;
  const speedOk = SPEED === 0.12;
  if (speedOk) npass++;
  units.speed = { ok: speedOk, SPEED: SPEED };

  /* ---- ⑯ 语音窗动态断言（clip 实长 SPEC-BATCH30 §4；T46 阶段2 guide/keyget/demo clip 化后
     estMs 字数口径退役，改按实长 2544/1824/2472 推导） ---- */
  total++;
  const winOk = (900 + 3000) >= SPEC_DUR.maz_tut_watch + 300 &&          // 教学演示窗 3900 ≥ 3564
                2200 >= SPEC_DUR.maz_tut_turn + 300 &&                   // turn 后读题延 ≥ 2100
                2800 >= SPEC_DUR.maz_right + 300 &&                      // 局终演出窗 ≥ 2724
                3700 >= SPEC_DUR.maz_demo + 300 &&                       // demo 窗 ≥ 2772（T46 clip 实长）
                (2620 + 400) >= SPEC_DUR.maz_right + 300 &&              // winFlow 3020 ≥ 2724（契约 H）
                6500 >= SPEC_DUR.maz_wrong + 150 + SPEC_DUR.maz_guide + 300 &&   // 错链豁免 ≥ 5658（家族 I）
                2400 >= SPEC_DUR.maz_key + 300 &&                        // 钥匙链豁免 ≥ 2196
                SPEC_DUR.maz_keyget <= 2800;                             // 拾钥匙句 1824 ≤ 局间自然窗
  if (winOk) npass++;
  units.estWin = { ok: winOk, estGuide: SPEC_DUR.maz_guide,
                   chainMin: SPEC_DUR.maz_wrong + 150 + SPEC_DUR.maz_guide + 300,
                   keyChainMin: SPEC_DUR.maz_key + 300, estGetKey: SPEC_DUR.maz_keyget };

  /* ---- ⑰ 家族 A/B/F/I/K/N 源码级断言（Function.toString 含关键串） ---- */
  total++;
  const srcBoot = boot.toString(), srcWin = winFlow.toString(), srcHint = nextHint.toString(),
        srcResc = rescueTick.toString(), srcStart = startLevel.toString(), srcTap = uiTapCell.toString();
  const contractOk =
    srcBoot.indexOf('nextHint(lim - 1)') >= 0 &&                                  // A：启动 dayEnd 传 lim-1
    srcWin.indexOf('nextHint(null)') >= 0 &&                                      // A：winFlow 传 null（等价）
    srcHint.indexOf('genLevel(f + 1).dch - 1') >= 0 &&                            // F：生成关 hint 实算
    srcHint.indexOf('(ci + 1) % 4') < 0 &&                                        // F：禁章序推进
    srcResc.indexOf('wrongChainUntil') >= 0 &&                                    // I：链豁免守卫
    srcResc.indexOf('lastDir') >= 0 && srcResc.indexOf('lastAct') >= 0 &&         // B：救援双锚
    srcResc.indexOf('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel') >= 0 &&   // K：面板守卫
    srcStart.indexOf('lastWrongVoice = 0; wrongChainUntil = 0;') >= 0 &&          // I/J：换关双锚重置
    srcTap.indexOf('wrongChainUntil = Date.now() + 6500') >= 0 &&                 // I：错路径设豁免终点
    srcTap.indexOf('wrongChainUntil = Date.now() + 2400') >= 0 &&                 // I：钥匙链豁免终点
    srcTap.indexOf("{ key: 'maz_guide', text: GUIDE.guide }") >= 0 &&             // T46：引导句 clip 键段（原 keyless 已退役）
    srcTap.indexOf("[VOICE.key.key]") >= 0;                                       // N：钥匙链单段
  if (contractOk) npass++;
  units.contract = { ok: contractOk };

  /* ---- ⑱ 章分布聚合（① 数据收口） ---- */
  total++;
  const distOk = agg.dchOk[1] && agg.dchOk[2] && agg.dchOk[3] &&          // 章型全域一致
                 agg.doorMust &&                                          // 120 局门必经独立复算全过
                 agg.subAll[1] > 0 && agg.subAll[2] > 0 && agg.subAll[3] > 0 &&   // 三子型全现（含 ch4 混出）
                 agg.genDch[1] > 0 && agg.genDch[2] > 0 && agg.genDch[3] > 0 && agg.genDch[4] > 0;   // 生成关四型全现
  if (distOk) npass++;
  units.dist = { ok: distOk, dchOk: agg.dchOk, doorMust: agg.doorMust,
                 subAll: agg.subAll, genDch: agg.genDch };

  const out = { game: 'maze', total: total, pass: npass, layoutOk: layoutOk,
                levels: levels, gen: gen, units: units, smokes: smokes };
  window.__mzMazeDump = dump;                    // python 侧独立 DFS 复算对账（_selftest.py）
  window.__mzVlog = out;
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录调用 key（__lastVoiceKey）；voice.queue 记录拼播链（__lastQueue）；
     voice.say 记录 TTS 拼句（__lastSay）——供 ③ 链句/确认句断言 */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) { window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null;
    (window.__playLog = window.__playLog || []).push([k || null, t || null]); };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    window.__lastVoiceKey = parts && parts.length ? parts[0] : null;
  };
  KIDS.voice.say = function (t) { window.__lastSay = t || null; };
  runVerify();
}
