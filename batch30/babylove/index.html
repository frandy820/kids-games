<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>动物宝宝找妈妈</title>
<style>
/* ================= 动物宝宝找妈妈 babylove（batch30·90 收官批）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 幼体/成体大图 + 题面句（bab_q1「它的妈妈是谁呀」/bab_q2「这是谁的宝宝呀」）
   + 候选图卡点选（图卡=动物 SVG 零文字——5-6 岁不识字可玩，语义语音承载）。
   题型两族（SPEC-BATCH30 §0.73）：findmom（幼体大图+名音→选成体卡）/ findbaby（成体
   大图+名音→选幼体卡，ch3+）。配对封闭 6；干扰=随机异对（5-6 岁不设近形约束）。
   章：ch1 findmom 2 候选 / ch2 findmom 4 / ch3 两族混出 4 / ch4 生成混合（seeded）。
   触摸目标：候选卡 ≥96×96、题面大图 ≥120 高；overflowX 恒 0 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面大图 + 候选图卡排 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}

/* 题面：软草地圆垫 + 幼体/成体大图 + 题面句文字条（点=重听+大图 pulse 方向级回锚） */
#scene{flex:0 0 auto;position:relative;width:min(420px,92vw);min-height:216px;border-radius:24px;
  background:linear-gradient(180deg,#EDF4DC 0%,#E2ECCB 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;transition:transform .15s}
#scene:active{transform:translateY(3px)}
#scene .ask-slot{position:relative;display:flex;align-items:flex-end;justify-content:center;
  min-height:150px}
#scene .ask-slot svg{width:150px;height:150px}
#scene .ask-slot .ask-shadow{position:absolute;left:50%;bottom:2px;width:110px;height:14px;
  border-radius:50%;background:#C9D8A8;opacity:.65;transform:translateX(-50%)}
#scene .q-text{font-size:21px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}
#scene .sub-dots{display:flex;gap:6px;align-items:center;margin-top:2px}
#scene .sub-dots i{width:9px;height:9px;border-radius:50%;background:#DCE9C4;transition:all .25s}
#scene .sub-dots i.done{background:#8FBF7F}
#scene .sub-dots i.cur{background:#E8975A;transform:scale(1.3)}
#scene .grow-tray{display:flex;gap:5px;align-items:center;justify-content:center;padding:2px 0}
#scene .grow-tray .gt-slot{width:52px;height:52px;border-radius:12px;background:#FFF9EE;
  border:2.5px dashed #B9A98E;display:flex;align-items:center;justify-content:center}
#scene .grow-tray .gt-slot.got{border-style:solid;border-color:#8FBF7F;background:#F0F7E4}
#scene .grow-tray .gt-slot svg{width:44px;height:44px}
#scene .grow-tray .gt-num{font-style:normal;font-size:20px;font-weight:800;color:#B9A98E}
#scene .grow-tray .gt-arrow{font-size:18px;font-weight:800;color:#B9A98E}
#scene.pulse{animation:sc-pulse 1.1s ease-in-out 3}
@keyframes sc-pulse{0%,100%{box-shadow:0 4px 0 #D8C9B4}50%{box-shadow:0 0 0 10px rgba(232,151,90,.4)}}
#scene .ask-slot.jump{animation:ask-jump .5s ease 2}
@keyframes ask-jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
#scene .demo-pet{position:absolute;right:10px;bottom:8px;opacity:0;transform:translateX(24px);
  transition:all .5s cubic-bezier(.2,1.4,.4,1)}
#scene .demo-pet.show{opacity:1;transform:translateX(0)}

/* ---------- 候选图卡排（主答案按钮 ≥96×96；ch1 2 卡居中） ---------- */
#board{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;
  gap:14px;max-width:760px;padding:2px 4px}
#board.bump{animation:bd-bump .22s ease}
@keyframes bd-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.card{position:relative;width:150px;min-height:128px;border-radius:20px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;padding:8px 6px;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.card svg{width:104px;height:104px;pointer-events:none}
.card.pop{animation:card-in .4s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes card-in{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.card.lit{border-color:#E8975A;background:#FDEFDC;
  animation:card-lit .5s ease}
@keyframes card-lit{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
.card.wig{animation:card-wig .4s ease}
@keyframes card-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}}
.card.breathe{animation:card-br 1.2s ease-in-out infinite}
@keyframes card-br{0%,100%{filter:none;transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95));transform:scale(1.05)}}
.card.done{opacity:.38;filter:grayscale(.5)}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-29） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：题面/卡收紧，主答案卡仍 ≥96。
   body.port=竖屏规则的类通道（媒体查询跟视口不跟元素，verify simView 靠注入 .port 吃到这段，
   REPORT-REVIEW-r10 M-1），两段规则必须同步改 */
@media (orientation:portrait){
  #scene{width:min(360px,94vw);min-height:196px}
  #scene .ask-slot{min-height:122px}
  #scene .ask-slot svg{width:122px;height:122px}
  #scene .q-text{font-size:17px;padding:3px 12px}
  #scene .grow-tray .gt-slot{width:46px;height:46px}
  #scene .grow-tray .gt-slot svg{width:39px;height:39px}
  #board{gap:11px}
  .card{width:132px;min-height:112px}
  .card svg{width:90px;height:90px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
body.port #scene{width:min(360px,94vw);min-height:196px}
body.port #scene .ask-slot{min-height:122px}
body.port #scene .ask-slot svg{width:122px;height:122px}
body.port #scene .q-text{font-size:17px;padding:3px 12px}
body.port #scene .grow-tray .gt-slot{width:46px;height:46px}
body.port #scene .grow-tray .gt-slot svg{width:39px;height:39px}
body.port #board{gap:11px}
body.port .card{width:132px;min-height:112px}
body.port .card svg{width:90px;height:90px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
</style>
</head>
<body>
<div id="game" aria-label="动物宝宝找妈妈">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <button id="scene" aria-label="题面，点我再听一遍"></button>
    <div id="board" aria-label="候选图卡"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

/* ================= babylove 纯引擎：确定性关卡生成 + 四题型多步判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 87)（本批常量 87，SPEC-BATCH30 §0.73 定版）：
   同 flat 永远同关（重玩一致、verify 可检）。
   章型（r10 五章；进度章号单调递增、难度章号 dch=1+flat//5 静态五档）：
     dch1 findmom 3 连小问 · 4 候选（12 对池——量扩根治「第 2 章见底」）
     dch2 两族混出（kind 逐题掷 findmom/findbaby，全同翻 1 保两族在场）· 近形干扰
     dch3 grow 发育链三段序（6 链轮出：卵→幼→成逐点点选，已点卡 done 淡化）
     dch4 habitat 生境×发育双维（2×2 干扰：同境异段/异境同段/双异 各恰 1）
     dch5 四型混出（每关 ≥3 不同型，翻样保多样）
   flat≥25 生成关 dch=ri(1,5)（burn 先取数保确定性）。
   每题=3 步/小问（r10 时长结构）：tapOpt 返回 'step'（步完成非题尾——storybed 先例）
   /'right'（题完成非末题）/'done'（末题完成）/'wrong'（步错：miss+1 卡不灰可重选）/null。
   flat0 题0 锚定 findmom/tadpole 第 1 小问（教学「看蝌蚪点青蛙」演示锚点）。
   铁律：候选互异含真值 ⊆对应集（findmom=成体集/findbaby=幼体集）；配对干扰=随机异对
   恰 3；dch≥2 幼体候选（findbaby）真值有近形伴时干扰必含伴恰 1 位（CONFUSABLE）；
   habitat 四卡 (hab 对错 × stage 对错) 恰 2×2 唯一组合；grow 卡池=链三阶段全量乱序；
   相邻题（kind:ask 串）互异。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号五章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 5 + 1;

/* ---------- 每关题序表（genLevel 预生成；rnd 同流保确定性）
   配对题 pairs=3 互异幼体 id（题内小问动物互异）；grow 题 chain=链 id；
   habitat 题 hab=生境 id（3 小问同境 want 变化，两种 want 在场）。
   dch4 habs=洗牌 HABITATS 取 5（每生境 ≥1）；dch3 chains=洗牌取 5（互异链）；
   dch5 kind 逐题掷四型 + 翻样（每关 ≥3 不同型）；相邻题（kind:ask 串）互异 ≤8 兜底 ---------- */
function specSeqOf(dch, rnd, flat) {
  const kinds = () => {
    if (dch === 1) return 'findmom';
    if (dch === 2) return rnd() < 0.5 ? 'findmom' : 'findbaby';
    if (dch === 3) return 'grow';
    if (dch === 4) return 'habitat';
    const K4 = ['findmom', 'findbaby', 'grow', 'habitat'];
    return K4[Math.floor(rnd() * 4)];
  };
  const pick3 = () => shuffled(BABIES6, rnd).slice(0, 3);       // 题内 3 小问动物互异
  let specs = [];
  if (dch === 3) {
    const cs = shuffled(GROWTH_CHAINS, rnd).slice(0, 5);        // 5 题互异链
    for (const c of cs) specs.push({ kind: 'grow', chain: c });
  } else if (dch === 4) {
    const hs = shuffled(HABITATS, rnd);                          // 3 生境垫底
    while (hs.length < 5) hs.push(hs[hs.length % 3]);            // 补 2（每生境 ≥1）
    for (const h of hs) specs.push({ kind: 'habitat', hab: h });
  } else if (dch === 5) {
    const K4 = ['findmom', 'findbaby', 'grow', 'habitat'];
    for (let qi = 0; qi < 5; qi++) {
      const k = K4[Math.floor(rnd() * 4)];
      if (k === 'grow') specs.push({ kind: 'grow', chain: GROWTH_CHAINS[Math.floor(rnd() * GROWTH_CHAINS.length)] });
      else if (k === 'habitat') specs.push({ kind: 'habitat', hab: HABITATS[Math.floor(rnd() * 3)] });
      else specs.push({ kind: k, pairs: pick3() });
    }
    let uniq = new Set(specs.map(s => s.kind));                   // 翻样：每关 ≥3 不同型
    let g2 = 0;
    while (g2++ < 8) {
      const miss = ['findmom', 'findbaby', 'grow', 'habitat'].filter(k => !uniq.has(k))[0];
      if (!miss) break;
      const at = ri(rnd, 0, 4);
      if (miss === 'grow') specs[at] = { kind: 'grow', chain: GROWTH_CHAINS[Math.floor(rnd() * GROWTH_CHAINS.length)] };
      else if (miss === 'habitat') specs[at] = { kind: 'habitat', hab: HABITATS[Math.floor(rnd() * 3)] };
      else specs[at] = { kind: miss, pairs: pick3() };
      uniq = new Set(specs.map(s => s.kind));                    // 替换后重算（防顶掉唯一型回退）
    }
  } else {
    for (let qi = 0; qi < 5; qi++) specs.push({ kind: kinds(), pairs: pick3() });
    if (dch === 2) {                                            // 混出：全同翻 1（两族在场）
      const nM = specs.filter(s => s.kind === 'findmom').length;
      if (nM === 0) specs[0] = { kind: 'findmom', pairs: pick3() };
      else if (nM === 5) specs[0] = { kind: 'findbaby', pairs: pick3() };
    }
  }
  if (flat === 0) specs[0] = { kind: 'findmom', pairs: ['tadpole'].concat(shuffled(BABIES6.filter(b => b !== 'tadpole'), rnd).slice(0, 2)) };
  const specKey = s => s.kind + ':' + (s.kind === 'grow' ? s.chain : s.kind === 'habitat' ? s.hab : s.pairs.join(','));
  let prev = null;                                              // 相邻题互异（kind:ask 串）
  for (let qi = 0; qi < specs.length; qi++) {
    let s = specs[qi], pk = prev && specKey(prev);
    for (let g = 0; g < 8 && specKey(s) === pk; g++) {
      const k = kinds();
      if (k === 'grow') s = { kind: 'grow', chain: GROWTH_CHAINS[Math.floor(rnd() * GROWTH_CHAINS.length)] };
      else if (k === 'habitat') s = { kind: 'habitat', hab: HABITATS[Math.floor(rnd() * 3)] };
      else s = { kind: k, pairs: pick3() };
      specs[qi] = s;
    }
    prev = specs[qi];
  }
  return specs;
}

/* ---------- 单步候选构建：真值 + 干扰补齐 → 洗牌 + answer 下标
   findmom：ask=幼体 id，真值=PAIRS6[ask]（成体），候选 ⊆成体集
   findbaby：ask=成体 id，真值=babyOf(ask)（幼体），候选 ⊆幼体集；
     dch≥2 且真值有近形伴 → 干扰必含伴恰 1 位（其余 2 随机异对） ---------- */
function pairOpts(ask, isMom, dch, rnd) {
  const truth = isMom ? PAIRS6[ask] : babyOf(ask);
  const pool = isMom ? ADULTS6 : BABIES6;
  const picks = [truth];
  if (!isMom && dch >= 2 && CONFUSABLE[truth]) picks.push(CONFUSABLE[truth]);   // 近形伴（r10）
  const others = shuffled(pool.filter(x => picks.indexOf(x) < 0), rnd);
  for (const x of others) { if (picks.length >= 4) break; picks.push(x); }
  const order = shuffled(picks, rnd);
  let answer = -1;
  for (let j = 0; j < order.length; j++) if (order[j] === truth) answer = j;
  return { opts: order.map(x => ({ anim: x })), answer: answer };
}

/* ---------- habitat 小问构建（r10 双维）：四卡 (hab 对错 × stage 对错) 恰 2×2
   真值=hab+want 命中；dSame=同境异段 / dStage=异境同段 / dBoth=双异 各恰 1 ---------- */
function habOpts(hab, want, rnd) {
  const isMom = want === 'mom';
  const ofHab = stagePool => stagePool.filter(a => HAB_OF[a] === hab);
  const notHab = stagePool => stagePool.filter(a => HAB_OF[a] !== hab);
  const allB = BABIES6, allA = ADULTS6;
  const tPool = isMom ? ofHab(allA) : ofHab(allB);              // 真值池（hab+want）
  const samePool = isMom ? ofHab(allB) : ofHab(allA);           // 同境异段
  const stagePool = isMom ? notHab(allA) : notHab(allB);        // 异境同段
  const bothPool = isMom ? notHab(allB) : notHab(allA);         // 双异
  const truth = tPool[Math.floor(rnd() * tPool.length)];
  const pick1 = arr => arr[Math.floor(rnd() * arr.length)];
  const picks = [truth, pick1(samePool.filter(x => x !== truth)), pick1(stagePool), pick1(bothPool)];
  const order = shuffled(picks, rnd);
  let answer = -1;
  for (let j = 0; j < order.length; j++) if (order[j] === truth) answer = j;
  return { opts: order.map(x => ({ anim: x })), answer: answer };
}

/* ---------- 单题构建（每题=3 步/小问）
   配对题 subs=[{ask,opts,answer}×3]（3 小问动物互异同 kind）
   grow 题 {ask=链 id, opts=链三阶段乱序, phase}
   habitat 题 subs=[{hab,want,opts,answer}×3]（同境 want 变化，两种 want 在场） ---------- */
function buildQuiz(spec, dch, rnd) {
  if (spec.kind === 'grow') {
    const chain = GROWTH[spec.chain];
    const order = shuffled(chain, rnd);
    return { kind: 'grow', ask: spec.chain, opts: order.map(x => ({ anim: x })),
             phase: 0, _miss: 0, _answered: false };
  }
  if (spec.kind === 'habitat') {
    let wants = [];
    for (let s = 0; s < 3; s++) wants.push(rnd() < 0.5 ? 'mom' : 'baby');
    if (wants.every(w => w === 'mom')) wants[ri(rnd, 0, 2)] = 'baby';    // 两种 want 在场
    else if (wants.every(w => w === 'baby')) wants[ri(rnd, 0, 2)] = 'mom';
    const subs = [];
    for (let s = 0; s < 3; s++) {
      const o = habOpts(spec.hab, wants[s], rnd);
      subs.push({ hab: spec.hab, want: wants[s], opts: o.opts, answer: o.answer });
    }
    return { kind: 'habitat', ask: spec.hab, subs: subs, si: 0, _miss: 0, _answered: false };
  }
  const isMom = spec.kind === 'findmom';
  const subs = [];
  for (let s = 0; s < spec.pairs.length; s++) {
    const ask = isMom ? spec.pairs[s] : PAIRS6[spec.pairs[s]];
    const o = pairOpts(ask, isMom, dch, rnd);
    subs.push({ ask: ask, opts: o.opts, answer: o.answer });
  }
  return { kind: spec.kind, ask: subs[0].ask, subs: subs, si: 0, _miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 25 关与生成关同一确定性通道；生成关 flat≥25 每关随机章参数）
   flat0 题0 第 1 小问恒 findmom/tadpole（§1 教学演示锚点） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 87);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 5);      // 生成关随机章参数（先取数保确定性）
  const specs = specSeqOf(dch, rnd, flat);
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(specs[qi], dch, rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 当前步视图（UI/钩子/救援共用）：摊平当前题当前步 ----------
   {kind, ask, want?(habitat), opts, answer, step, substep, miss}
   findmom ask=幼体 id / findbaby ask=成体 id / grow ask=链 id（=成体 id）
   / habitat ask=生境 id（want='mom'|'baby'）；answer=当前步正确卡下标 ---------- */
function quizView(L) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (q.kind === 'grow') {
    const want = GROWTH[q.ask][q.phase];
    let answer = -1;
    for (let j = 0; j < q.opts.length; j++) if (q.opts[j].anim === want) answer = j;
    return { kind: q.kind, ask: q.ask, opts: q.opts, answer: answer,
             step: L.step, substep: q.phase, miss: q._miss || 0 };
  }
  const sub = q.subs[q.si];
  const v = { kind: q.kind, ask: sub.ask, opts: sub.opts, answer: sub.answer,
              step: L.step, substep: q.si, miss: q._miss || 0 };
  if (q.kind === 'habitat') { v.ask = sub.hab; v.want = sub.want; }
  return v;
}

/* ---------- 点卡引擎（无 DOM）：engTapOpt(L, i) —— 点第 i 张候选卡（opts 数组下标）
   'step'  步/小问完成但本题未完（substep 推进——r10 新值，storybed 先例）
   'right' 题完成且非末题 / 'done' 末题完成=通关
   'wrong' 点错：该题 miss+1（retries 全关累计=星级口径），卡不灰可重选（探索不罚）
   null    非法下标或关卡已结束 ---------- */
function engTapOpt(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  const nSteps = 3;
  if (q.kind === 'grow') {
    const want = GROWTH[q.ask][q.phase];
    const opt = q.opts[i];
    if (!Number.isInteger(i) || i < 0 || !opt) return null;
    if (!q._used) q._used = [];                   // 本题已正确用过的卡（视觉 done 淡化）
    if (q._used.indexOf(i) >= 0) return 'wrong';  // 已点卡再点=wrong 不计 miss（m-2：误触不罚，
                                                  //  storybed §0.74「已点 .done 再点=wrong 同口径」家族定版）
    if (opt.anim !== want) { q._miss++; L.retries++; return 'wrong'; }
    q._used.push(i);
    q.phase++;
    if (q.phase < nSteps) return 'step';
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  const sub = q.subs[q.si];
  if (!sub) return null;
  if (!Number.isInteger(i) || i < 0 || i >= sub.opts.length) return null;
  if (i === sub.answer) {
    q.si++;
    if (q.si < nSteps) return 'step';
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（§0.73 口径承 r10）：全关错选 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：当前步正确卡下标（quizView 独立函数供 verify 复核） */
const correctIdx = q => !q ? -1 : (q.answer !== undefined ? q.answer : -1);

/* ---------- 结构校验（verify 用，返回失败原因或 null）：封闭表 / 章型规则 /
   候选域互异含真值 / answer 自洽 / 干扰构成（配对恰 3·近形·habitat 2×2）/
   grow 链全量 / 相邻题互异 / flat0q0 锚点 / 初始态干净 ---------- */
function structWhy(q, dch, flat, qi, prevQ) {
  if (!q) return 'quiz';
  if (q.kind !== 'findmom' && q.kind !== 'findbaby' && q.kind !== 'grow' && q.kind !== 'habitat') return 'kind';
  const isAnchor = flat === 0 && qi === 0;         // 教学演示题（蝌蚪找妈妈）锚点
  if (isAnchor && (q.kind !== 'findmom' || q.ask !== 'tadpole')) return 'anchor';
  if (dch === 1 && q.kind !== 'findmom') return 'dch1';                    // ch1 恒 findmom
  if (dch === 2 && q.kind !== 'findmom' && q.kind !== 'findbaby') return 'dch2';
  if (dch === 3 && q.kind !== 'grow') return 'dch3';
  if (dch === 4 && q.kind !== 'habitat') return 'dch4';
  if (q._miss !== 0 || q._answered) return 'init';
  const checkStep = (sub, kind) => {
    const isMom = kind === 'findmom';
    if (kind === 'findmom' && BABIES6.indexOf(sub.ask) < 0) return 'askBaby';    // findmom ask=幼体
    if (kind === 'findbaby' && ADULTS6.indexOf(sub.ask) < 0) return 'askAdult';  // findbaby ask=成体
    const pool = isMom ? ADULTS6 : BABIES6;
    const vals = sub.opts.map(o => o.anim);
    if (vals.length !== 4) return 'len4';
    for (const v of vals) if (pool.indexOf(v) < 0) return 'optPool';   // 候选恒 ∈ 对应集
    if (new Set(vals).size !== vals.length) return 'optDup';           // 候选互异
    const truth = isMom ? PAIRS6[sub.ask] : babyOf(sub.ask);           // 真值独立换算
    if (vals.indexOf(truth) < 0) return 'optTruth';                    // 含真值
    if (sub.answer < 0 || sub.answer >= vals.length) return 'ansRange';
    if (vals[sub.answer] !== truth) return 'ansIdx';                   // answer=真值卡下标
    return null;
  };
  if (q.kind === 'grow') {
    if (GROWTH_CHAINS.indexOf(q.ask) < 0) return 'growChain';
    const chain = GROWTH[q.ask];
    const vals = q.opts.map(o => o.anim);
    if (vals.length !== 3) return 'growLen';
    if (new Set(vals).size !== 3) return 'growDup';
    for (const st of chain) if (vals.indexOf(st) < 0) return 'growSet';   // 卡池=链三阶段全量
    if (q.phase !== 0) return 'growPhase';
    const want = chain[0];
    let a = -1;
    for (let j = 0; j < vals.length; j++) if (vals[j] === want) a = j;
    if (a < 0) return 'growAns';                        // 首步正确卡恒在（answer 由 quizView 实算）
  } else if (q.kind === 'habitat') {
    if (HABITATS.indexOf(q.ask) < 0) return 'habAsk';
    const wants = q.subs.map(s => s.want);
    if (new Set(wants).size !== 2) return 'habWantMix';                  // 两种 want 在场
    for (const s of q.subs) {
      if (s.want !== 'mom' && s.want !== 'baby') return 'habWant';
      if (s.hab !== q.ask) return 'habSub';
      const vals = s.opts.map(o => o.anim);
      if (vals.length !== 4 || new Set(vals).size !== 4) return 'habLenDup';
      const sameHab = vals.filter(v => HAB_OF[v] === s.hab);
      const isMom = s.want === 'mom';
      const truthStg = vals.filter(v => (ADULTS6.indexOf(v) >= 0) === isMom);
      if (sameHab.length !== 2 || truthStg.length !== 2) return 'hab2x2'; // (hab×stage) 恰 2×2
      const truth = vals.filter(v => HAB_OF[v] === s.hab && (ADULTS6.indexOf(v) >= 0) === isMom);
      if (truth.length !== 1) return 'habTruth';
      if (s.answer < 0 || vals[s.answer] !== truth[0]) return 'habAns';
      /* r10 裁决：habitat 不设近形干扰位（近形伴与真值同境同段会破坏 2×2 唯一结构——
         近形辨析由 findbaby 承载；异境干扰卡已天然排除同段同境歧义） */
    }
  } else {
    if (!q.subs || q.subs.length !== 3) return 'subLen';
    const asks = q.subs.map(s => s.ask);
    if (new Set(asks).size !== 3) return 'subAskDup';                     // 小问动物互异
    for (const s of q.subs) {
      const why = checkStep(s, q.kind);
      if (why) return why;
      if (q.kind === 'findbaby' && dch >= 2) {                            // 近形伴在场恰 1 位
        const truth = babyOf(s.ask);
        if (CONFUSABLE[truth] && s.opts.map(o => o.anim).indexOf(CONFUSABLE[truth]) < 0) return 'confMiss';
      }
    }
    if (q.si !== 0) return 'si0';
  }
  if (prevQ) {                                    // 相邻题互异（kind + 全步 ask 串——r10 题=3 步，
    const keyOfQ = qq => qq.kind + ':' + (qq.kind === 'habitat' ? qq.ask :   // habitat sub 无 ask 字段：
                                     qq.subs ? qq.subs.map(s => s.ask).join(',') : qq.ask);   // 用 hab（与
    if (keyOfQ(prevQ) === keyOfQ(q)) return 'adjacent';     // specSeqOf 相邻重掷的 specKey 同口径）
  }                                                // 首小问同而二三异=合法复习非重复题
  return null;
}

  const r = engTapOpt(cur, i);

  const el = cardEl(i);

  if (r === 'wrong') {                           /* 答错：摇头+bab_wrong+语义句（keyless 恒链尾）+大图 pulse */
    state.locked = true;

      AGAIN_OF[v0.kind]];                        /* 语义句 clip 键段（T46 阶段2；text=TTS 兜底；四题型） */
    if (sayW(parts))

    pulseAsk();                                  /* 方向级：大图再 pulse（看清楚再想） */
    await wait(1000 * SPEED);                    /* 错点防重入窗 1000ms；对选可打断链；救援由 wrongChainUntil 让路 */
    if (cur !== run) return r;

  /* ---- step（步/小问完成非题尾——r10 新分支） ---- */
  if (r === 'step') {

    const nk = v0.kind;
    if (nk === 'grow') {                         /* 逐点 fire-and-forget（storybed 先例豁免契约 G）：

    chimeGoal();

    await wait((nk === 'habitat' ? HAB_SUB_WIN : SUB_WIN) * SPEED);

  /* ---- right·done（本题完成：大图跳+兔子示范+确认句拼播） ---- */
  lastAct = Date.now();                          /* 正确选择重置救援钟（§0.7a） */

  chimeGoal();
  sfx('coin');
  if (cur === run) celebrateScene(run);          /* 大图跳 + 小兔子滑入示范 */
  const hitAnim = v0.opts[i].anim;               /* 点中动物/阶段名音（grow 末步=成体名） */

     genLevel 纯函数确定性，同 flat 恒同 dch——预告与实际章型恒一致，禁 (ci+1)%5） */
  return ci < 5 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];

function winFlow() {

async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;

  /* SPEC-BATCH30 §0.73 r10 块文字独立重列（禁抄页面 PAIRS6/CONFUSABLE/GROWTH/HAB_OF/文案） */
  const SPEC_PAIRS = {                           // 配对封闭 12（幼体 → 成体）
    tadpole: 'frog', caterpillar: 'butterfly', chick: 'hen',
    puppy: 'dog', kitten: 'cat', calf: 'cow',
    fishfry: 'fish', duckling: 'duck', grub: 'beetle',

  const SPEC_BABIES = ['tadpole', 'caterpillar', 'chick', 'puppy', 'kitten', 'calf',
                       'fishfry', 'duckling', 'grub', 'lamb', 'piglet', 'foal'];   // 幼体集
  const SPEC_ADULTS = ['frog', 'butterfly', 'hen', 'dog', 'cat', 'cow',
                       'fish', 'duck', 'beetle', 'sheep', 'pig', 'horse'];         // 成体集
  const SPEC_INV = {};                           // 成体 → 幼体（SPEC_PAIRS 反查）
  for (const b in SPEC_PAIRS) SPEC_INV[SPEC_PAIRS[b]] = b;
  const SPEC_CONF = { tadpole: 'fishfry', fishfry: 'tadpole',
                      caterpillar: 'grub', grub: 'caterpillar' };   // 近形干扰对（r10）
  const SPEC_GROWTH = {                          // 发育链 6（卵→幼→成）
    frog: ['egg_frog', 'tadpole', 'frog'],
    butterfly: ['egg_butterfly', 'caterpillar', 'butterfly'],
    beetle: ['egg_beetle', 'grub', 'beetle'],
    fish: ['egg_fish', 'fishfry', 'fish'],
    hen: ['egg_hen', 'chick', 'hen'],
    duck: ['egg_duck', 'duckling', 'duck'] };
  const SPEC_HAB = {};                           // 动物 → 生境（SPEC 12 对生境列推导）
  { const M = { tadpole: 'water', fishfry: 'water', duckling: 'water',
                caterpillar: 'forest', grub: 'forest',
                chick: 'grass', puppy: 'grass', kitten: 'grass', calf: 'grass',
                lamb: 'grass', piglet: 'grass', foal: 'grass' };
    for (const b in M) { SPEC_HAB[b] = M[b]; SPEC_HAB[SPEC_PAIRS[b]] = M[b]; } }
  const SPEC_AGAIN = { findmom: '再看看它的妈妈长什么样', findbaby: '再看看这个宝宝是谁',
                       grow: '再想想长大的顺序', habitat: '再看看它住在哪里' };  // 错语义句
  const SPEC_DUR = { bab_tut_watch: 3072, bab_tut_turn: 1824, bab_hint: 2016, bab_right: 2280,
                     bab_wrong: 1656, bab_q1: 2232, bab_q2: 2184,
                     bab_q3: 2520, bab_grow_next: 1488,
                     bab_h_water: 1728, bab_h_forest: 1896, bab_h_grass: 2016,
                     bab_q4_mom: 2136, bab_q4_baby: 2064,
                     bab_n_butterfly: 1416, bab_n_calf: 1416, bab_n_cat: 1344,
                     bab_n_caterpillar: 1584, bab_n_chick: 1440, bab_n_cow: 1344,
                     bab_n_dog: 1368, bab_n_frog: 1368, bab_n_hen: 1344,
                     bab_n_kitten: 1368, bab_n_puppy: 1416, bab_n_tadpole: 1368,
                     bab_n_fishfry: 1368, bab_n_fish: 1368, bab_n_duckling: 1392,
                     bab_n_duck: 1344, bab_n_grub: 1848, bab_n_beetle: 1392,
                     bab_n_lamb: 1392, bab_n_sheep: 1368, bab_n_piglet: 1440,
                     bab_n_pig: 1368, bab_n_foal: 1416, bab_n_horse: 1344,
                     bab_n_egg_frog: 1608, bab_n_egg_butterfly: 1632, bab_n_egg_beetle: 1632,
                     bab_n_egg_fish: 1368, bab_n_egg_hen: 1344, bab_n_egg_duck: 1344,
                     bab_again_mom: 2904, bab_again_baby: 2880, bab_again_grow: 2568,
                     bab_again_hab: 2688 };  // r10 实测表 + T46 阶段2 again 四键（ffprobe 同口径实测）
  const SPEC_CHAPTER_HINTS = { 1: '宝宝变多了，还要反过来找', 2: '宝宝要按长大的样子排队啦',
                               3: '宝宝们都住在哪里呀', 4: '什么都混在一起，大挑战',
                               5: '新一轮帮宝宝找妈妈' };
  const SPEC_GEN_HINTS = ['四张卡里找妈妈', '找妈妈，也找宝宝',
                          '按长大的顺序排一排', '找找它住在哪里', '宝宝妈妈大集合'];
  /* r10 时长窗常量（SPEC §r10 窗表独立重列——与页内实现常量对拍非互证） */
  const M_SUB = 2400, M_HAB = 2600, M_GROW = 2200, M_CONF = 4800, M_LEVEL_MIN = 40000;
  const estMs = n => n * 345 + 600;               // b25 定版：SAPI ~345ms/字 + 600 落定余量
  const unlocked = async () => {                  // 等错防重入/演出窗结束（verify 提速后 ≤1s）
    let wg = 0;
    while ((state.locked || state.demo) && wg++ < 900) await wait(50);
    return !(state.locked || state.demo);
  };
  /* T46 阶段2（2026-09-19）：四题型语义句 clip 化（bab_again_* 键段，text=TTS 兜底）——
     keyless {key:null} 段清零，Mj-1 链尾断言（keylessLast）随之退役移除 */
  /* 遍历推进直到目标题型出现（dch2 混出翻 1 保证两族在场；dch5 四型 ≥3 型在场） */
  const seekKind = async kind => {
    for (let g = 0; g < 40; g++) {
      const v = window.BL.quiz;
      if (!v) return null;
      if (v.kind === kind) return v;
      if (!(await unlocked())) return null;
      const r = await window.BL.tapOpt(v.answer);
      if (r === 'done' || r === false) return null;
    }
    return null;
  };
  const lastQ = () => window.__lastQueue;

  /* ---- ①② 45 关全量审计 + SPEC 表独立对账 ---- */
  const genDch = {}, mixBad2 = [], habBad = [], kindBad5 = [], durBad = [];
  let tableOk = true, badCase = null;
  const NF = 45;
  for (let flat = 0; flat < NF; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1.quizzes) === JSON.stringify(L2.quizzes);      // 确定性
    let ruleOk = true;
    for (let k = 0; k < L1.quizzes.length; k++) {
      const why = structWhy(L1.quizzes[k], L1.dch, flat, k, k > 0 ? L1.quizzes[k - 1] : null);
      if (why) ruleOk = false;
    }
    if (L1.quizzes.length !== CH_LEN) ruleOk = false;
    const expCh = Math.floor(flat / 5) + 1;                       // 章号独立复算
    const chOk = L1.ch === expCh;
    const dchOk = flat < 25 ? L1.dch === Math.floor(flat / 5) + 1   // 静态五档
                            : (L1.dch >= 1 && L1.dch <= 5);       // 生成关随机章参数
    /* 引擎直驱：逐步点应选卡 → step×2 / right / 末题 done；全关零错=3 星 */
    const L3 = genLevel(flat);
    let driveOk = true;
    for (let k = 0; k < L3.quizzes.length && driveOk; k++) {
      for (let s = 0; s < 3 && driveOk; s++) {
        const v = quizView(L3);
        if (!v || v.step !== k || v.substep !== s) { driveOk = false; break; }
        const exp = s < 2 ? 'step' : (k === L3.quizzes.length - 1 ? 'done' : 'right');
        const r = engTapOpt(L3, v.answer);
        if (r !== exp || (v.miss !== 0)) { driveOk = false; break; }
      }
    }
    const solvedAll = L3.done && L3.step === CH_LEN && L3.retries === 0 && engStars(L3) === 3;
    /* SPEC 独立复算驱动副本 Lc（grow answer 逐点复算+全题型同步推进） */
    const Lc = genLevel(flat);

    /* SPEC 表独立对账（每题每步：域/answer 复算/干扰构成/近形/2×2/链全量） */
    let specOk = true;
    let nMom = 0;
    const kindsSeen = new Set();
    for (let k = 0; k < L1.quizzes.length; k++) {
      const q = L1.quizzes[k];
      kindsSeen.add(q.kind);
      if (flat === 0 && k === 0) {                          // 教学演示锚点：蝌蚪找妈妈
        if (q.kind !== 'findmom' || q.subs[0].ask !== 'tadpole') { badCase = 'anchor ' + flat; specOk = false; break; }
      }
      if (L1.dch === 1 && q.kind !== 'findmom') { badCase = 'dch1 ' + flat + '/' + k; specOk = false; break; }
      if (L1.dch === 2 && q.kind !== 'findmom' && q.kind !== 'findbaby') { badCase = 'dch2 ' + flat + '/' + k; specOk = false; break; }
      if (L1.dch === 3 && q.kind !== 'grow') { badCase = 'dch3 ' + flat + '/' + k; specOk = false; break; }
      if (L1.dch === 4 && q.kind !== 'habitat') { badCase = 'dch4 ' + flat + '/' + k; specOk = false; break; }
      if (q.kind === 'findmom') nMom++;
      if (q.kind === 'grow') {
        if (!SPEC_GROWTH[q.ask]) { badCase = 'growChain ' + flat + '/' + k; specOk = false; break; }
        const chain = SPEC_GROWTH[q.ask];
        const vals = q.opts.map(o => o.anim);
        if (vals.length !== 3 || new Set(vals).size !== 3 ||
            chain.some(st => vals.indexOf(st) < 0)) { badCase = 'growSet ' + flat + '/' + k; specOk = false; break; }
        /* 逐点 answer 复算（Lc 同步推进：第 p 步正确卡=chain[p] 下标） */
        for (let p = 0; p < 3; p++) {
          const v = quizView(Lc);
          if (!v || v.step !== k || v.opts[v.answer].anim !== chain[p]) { badCase = 'growAns ' + flat + '/' + k + '/' + p; specOk = false; break; }
          engTapOpt(Lc, v.answer);
        }
        if (!specOk) break;
      } else if (q.kind === 'habitat') {
        if (['water', 'forest', 'grass'].indexOf(q.ask) < 0) { badCase = 'habAsk ' + flat + '/' + k; specOk = false; break; }
        for (let s = 0; s < 3; s++) {             // Lc 同步推进（habitat 题保持步进同步——grow 复算依赖）
          const vv = quizView(Lc);
          if (vv && vv.step === k) engTapOpt(Lc, vv.answer);
        }
        const wants = q.subs.map(s => s.want);
        if (new Set(wants).size !== 2) { badCase = 'habWantMix ' + flat + '/' + k; specOk = false; break; }
        for (const sub of q.subs) {
          const vals = sub.opts.map(o => o.anim);
          if (vals.length !== 4 || new Set(vals).size !== 4) { badCase = 'habLen ' + flat + '/' + k; specOk = false; break; }
          const isMom = sub.want === 'mom';
          if (!vals.every(v => SPEC_HAB[v])) { badCase = 'habDom ' + flat + '/' + k; specOk = false; break; }
          const same = vals.filter(v => SPEC_HAB[v] === sub.hab);
          const stg = vals.filter(v => (SPEC_ADULTS.indexOf(v) >= 0) === isMom);
          const truth = vals.filter(v => SPEC_HAB[v] === sub.hab && (SPEC_ADULTS.indexOf(v) >= 0) === isMom);
          if (same.length !== 2 || stg.length !== 2 || truth.length !== 1 ||
              sub.answer < 0 || vals[sub.answer] !== truth[0]) { badCase = 'hab2x2 ' + flat + '/' + k; specOk = false; break; }
        }
        if (!specOk) break;
      } else {
        for (let s = 0; s < 3; s++) {             // Lc 同步推进（非 grow 题保持步进同步）
          const vv = quizView(Lc);
          if (vv && vv.step === k) engTapOpt(Lc, vv.answer);
        }
        const asks = q.subs.map(s => s.ask);
        if (new Set(asks).size !== 3) { badCase = 'subAskDup ' + flat + '/' + k; specOk = false; break; }
        for (const sub of q.subs) {
          const isMom = q.kind === 'findmom';
          const askOk = isMom ? SPEC_BABIES.indexOf(sub.ask) >= 0 : SPEC_ADULTS.indexOf(sub.ask) >= 0;
          if (!askOk) { badCase = 'askDomain ' + flat + '/' + k; specOk = false; break; }
          const vals = sub.opts.map(o => o.anim);
          const pool = isMom ? SPEC_ADULTS : SPEC_BABIES;
          let poolOk = true;
          for (const v of vals) if (pool.indexOf(v) < 0) poolOk = false;   // 候选恒 ∈ 对应集
          if (!poolOk || vals.length !== 4 || new Set(vals).size !== vals.length) { badCase = 'optPool ' + flat + '/' + k; specOk = false; break; }
          const truth = isMom ? SPEC_PAIRS[sub.ask] : SPEC_INV[sub.ask];   // 真值独立换算
          const inters = vals.filter(v => v !== truth);                   // 干扰=去真值
          if (inters.length !== 3 || new Set(inters).size !== 3 ||
              inters.indexOf(truth) >= 0) { badCase = 'distract ' + flat + '/' + k; specOk = false; break; }
          let expAns = -1;                                       // answer 独立复算：真值卡下标
          for (let j = 0; j < vals.length; j++) if (vals[j] === truth) expAns = j;
          if (expAns < 0 || sub.answer !== expAns) { badCase = 'ans ' + flat + '/' + k; specOk = false; break; }
          /* r10 近形干扰：dch≥2 findbaby 真值有伴 → 候选必含伴恰 1 位 */
          if (q.kind === 'findbaby' && L1.dch >= 2 && SPEC_CONF[truth]) {
            const nConf = vals.filter(v => v === SPEC_CONF[truth]).length;
            if (nConf !== 1) { badCase = 'confMiss ' + flat + '/' + k; specOk = false; break; }
          }
        }
        if (!specOk) break;
      }
    }
    if (!specOk) tableOk = false;
    /* r10 时长 modeled：关下界=Σ题窗公式（SPEC 窗常量独立重列） */
    let modeled = 0;
    for (const q of L1.quizzes)
      modeled += q.kind === 'grow' ? 2 * M_GROW + M_CONF :
                 q.kind === 'habitat' ? 2 * M_HAB + M_CONF : 2 * M_SUB + M_CONF;
    if (modeled < M_LEVEL_MIN) durBad.push(flat + ':' + modeled);
    /* 聚合素材 */
    if (L1.dch === 2 && (nMom === 0 || nMom === CH_LEN)) mixBad2.push(flat);
    if (L1.dch === 4 && new Set(L1.quizzes.map(q => q.ask)).size < 3) habBad.push(flat);
    if (L1.dch === 5 && kindsSeen.size < 3) kindBad5.push(flat);
    if (flat >= 25) genDch[L1.dch] = (genDch[L1.dch] || 0) + 1;
    const ok = det && ruleOk && chOk && dchOk && driveOk && solvedAll && specOk && modeled >= M_LEVEL_MIN;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, ruleOk: ruleOk, chOk: chOk,
                  dchOk: dchOk, driveOk: driveOk, solvedAll: solvedAll, specOk: specOk,
                  modeled: modeled,
                  kinds: L1.quizzes.map(q => (q.kind === 'findmom' ? 'm' : q.kind === 'findbaby' ? 'b' : q.kind === 'grow' ? 'g' : 't') + ':' + q.ask) };   // m=findmom/b=findbaby/g=grow/t=habitat
    if (flat < 25) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ③ 聚合独占票：两族混出/三生境/四型多样/生成关五型全现/时长 modeled ---- */
  total++;
  const aggOk = tableOk && mixBad2.length === 0 && habBad.length === 0 && kindBad5.length === 0 &&
    durBad.length === 0 &&
    genDch[1] > 0 && genDch[2] > 0 && genDch[3] > 0 && genDch[4] > 0 && genDch[5] > 0;
  if (aggOk) npass++;
  units.audit = { ok: aggOk, bad: badCase, mixBad2: mixBad2, habBad: habBad,
                  kindBad5: kindBad5, durBad: durBad, genDch: genDch };

  /* ---- ④ tapOpt 单元（flat0 findmom/tadpole 4 候选，3 小问） ---- */
  total++;
  startLevel(0);
  const q4 = window.BL.quiz;
  const initOk = q4 && q4.kind === 'findmom' && q4.ask === 'tadpole' && q4.substep === 0 &&
                 q4.opts.length === 4 &&
                 q4.opts.every(o => typeof o.anim === 'string' && SPEC_ADULTS.indexOf(o.anim) >= 0) &&
                 q4.opts[q4.answer].anim === 'frog' &&
                 q4.step === 0 && q4.miss === 0;
  const badTap = (await window.BL.tapOpt(99)) === null;           // 非法下标=null（不炸）
  const wA = q4.opts.findIndex((o, i) => i !== q4.answer);        // 错卡（随机异对成体）
  const pW = window.BL.tapOpt(wA);                                // → wrong（1000ms 防重入窗，fire-and-forget）
  const rejW = await window.BL.tapOpt(wA);                        // 窗内紧邻再点=被拦 false
  const rW = await pW;
  const chainA = lastQ() && lastQ().length === 2 &&
                lastQ()[0] === 'bab_wrong' &&                     // 错链=bab_wrong+语义句 clip（T46 阶段2 键段）
                lastQ()[1] && lastQ()[1].key === 'bab_again_mom' &&
                lastQ()[1].text === SPEC_AGAIN.findmom;
  const s1 = rW === 'wrong' && rejW === false && chainA &&
             window.BL.quiz.miss === 1 && window.BL.currentLevel.miss === 1;
  /* 对=step（第 1 小问完成，substep→1，切换链=新小问动物名音） */
  const rS1 = await window.BL.tapOpt(q4.answer);
  const v1 = window.BL.quiz;
  const chainS1 = lastQ() && lastQ().length === 1 && lastQ()[0] === 'bab_n_' + v1.ask;
  const s2a = rS1 === 'step' && v1.substep === 1 && v1.step === 0 &&
              v1.kind === 'findmom' && SPEC_BABIES.indexOf(v1.ask) >= 0 &&
              v1.opts[v1.answer].anim === SPEC_PAIRS[v1.ask] && chainS1;
  const rS2 = await window.BL.tapOpt(v1.answer);                 // 第 2 小问 → step
  const v2 = window.BL.quiz;
  const s2b = rS2 === 'step' && v2.substep === 2;
  const rR = await window.BL.tapOpt(v2.answer);                  // 题尾 → right
  const chainR = lastQ() && lastQ().length === 2 &&
                 lastQ()[0] === 'bab_right' &&                    // 确认链=bab_right+名音尾段（全 clip 无 keyless）
                 lastQ()[1] === 'bab_n_' + SPEC_PAIRS[v2.ask];
  replayQuiz(false);                              // 重听路径：名音+题面句（两 clip 无 keyless）
  const chainQ = lastQ() && lastQ().length === 2 &&
                 lastQ()[0] === 'bab_n_' + window.BL.quiz.ask &&
                 lastQ()[1] === 'bab_q1';
  const s2 = s2a && s2b && rR === 'right' && chainR && chainQ &&
             window.BL.quiz.step === 1 && window.BL.quiz.substep === 0 && window.BL.quiz.miss === 0;

                 nextHint(5) === SPEC_CHAPTER_HINTS[2] &&        // 章首 f=5（ci=1）已属 ch2 段（右边界不提前）
                 nextHint(25) === SPEC_GEN_HINTS[genLevel(26).dch - 1];   // 静态→生成分支切换首关 f=25（ci=5）即走实算
  const genOk = [25, 29, 34, 39, 44].every(f => nextHint(f) === SPEC_GEN_HINTS[genLevel(f + 1).dch - 1] &&   // F：实算（SPEC 表对拍）
                                              SPEC_GEN_HINTS.indexOf(nextHint(f)) >= 0);
  if (hintOk && genOk) npass++;
  units.hints = { ok: hintOk && genOk, chapters: [1, 2, 3, 4, 5].map(i => CHAPTERS[i].hint), gen: GEN_HINTS };

  /* ---- ⑯ estMs 语音窗动态断言（b25 定版：窗 ≥ estMs/链实长；clip 实长 r10 表）
     确认链=bab_right 2280+150+名音 max 1848=4278；错链（最长 findmom 11 字）=1656+150+estMs(11)+300 ---- */
  total++;
  const maxName = SPEC_DUR.bab_n_grub;                             // 名音 max 1848（r10 实测）
  const winOk = (1600 + 3200) >= SPEC_DUR.bab_right + 150 + maxName + 300 &&   // 判对窗 4800 ≥ 4578
                4100 >= SPEC_DUR.bab_n_tadpole + 150 + SPEC_DUR.bab_q1 + 300 && // 教学开题链演示窗 ≥ 4050
                3400 >= SPEC_DUR.bab_tut_watch + 300 &&                          // 教学名音演示延 ≥ 3372
                2150 >= SPEC_DUR.bab_tut_turn + 300 &&                           // turn 后读题延 ≥ 2124
                (2620 + 400) >= SPEC_DUR.bab_right + 300 &&                      // winFlow ≥ 2580
                6600 >= SPEC_DUR.bab_wrong + 150 + SPEC_DUR.bab_again_mom + 300 &&   // findmom 链 ≥ 5010（T46 clip 实长）
                6600 >= SPEC_DUR.bab_wrong + 150 + SPEC_DUR.bab_again_baby + 300 &&
                6600 >= SPEC_DUR.bab_wrong + 150 + SPEC_DUR.bab_again_grow + 300 &&      // grow 链 ≥ 4674
                6600 >= SPEC_DUR.bab_wrong + 150 + SPEC_DUR.bab_again_hab + 300 &&      // habitat 链 ≥ 4794
                SUB_WIN >= SPEC_DUR.bab_n_grub + 300 &&                          // 配对小问切换窗 ≥ 2148
                HAB_SUB_WIN >= SPEC_DUR.bab_q4_mom + 300 &&                      // habitat 小问窗 ≥ 2436
                GROW_STEP_WIN >= SPEC_DUR.bab_grow_next + 300;                   // grow 步动画窗 ≥ 1788
  const estData = { confirmWin: 4800, confirmNeed: SPEC_DUR.bab_right + 150 + maxName + 300,
                    subWin: SUB_WIN, habWin: HAB_SUB_WIN, growWin: GROW_STEP_WIN,
                    watchT: 3400, turnDelay: 2150, rightFlow: 3020, wrongChain: 6600,
                    chainNeedMom: SPEC_DUR.bab_wrong + 150 + SPEC_DUR.bab_again_mom + 300,
                    chainNeedGrow: SPEC_DUR.bab_wrong + 150 + SPEC_DUR.bab_again_grow + 300,
                    chainNeedHab: SPEC_DUR.bab_wrong + 150 + SPEC_DUR.bab_again_hab + 300 };
  if (winOk) npass++;
  units.estWin = { ok: winOk, est: estData };

  /* ---- ⑰b modeled 汇总已在 ①（durBad 聚合）——此处独立复核窗常量与页内实现一致性 ---- */
  total++;
  const wcConst = SUB_WIN === M_SUB && HAB_SUB_WIN === M_HAB && GROW_STEP_WIN === M_GROW &&
                  (1600 + 3200) === M_CONF;          // SPEC 窗表 ↔ 页内常量（SPEC↔实现对拍，非互证）
  const modeledAll = Object.keys(levels).concat(Object.keys(gen))
    .every(k2 => (levels[k2] || gen[k2]).modeled >= M_LEVEL_MIN);
  if (wcConst && modeledAll) npass++;
  units.modeled = { ok: wcConst && modeledAll, sub: SUB_WIN, hab: HAB_SUB_WIN, grow: GROW_STEP_WIN,
                    min: M_LEVEL_MIN };

  /* ---- ⑱ verify 提速断言 ---- */
  total++;
  const speedOk = SPEED === 0.12;
  if (speedOk) npass++;
  units.speed = { ok: speedOk, SPEED: SPEED };

  const out = { game: 'babylove', total: total, pass: npass, layoutOk: layoutOk,
                levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__blVlog = out;                          // 外部断言挂点（任务书钩子）
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text（__lastVoiceKey/__lastVoiceText）；
     voice.queue 记录拼播链（__lastQueue）供反馈链/确认链绑定断言 */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) { window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null; };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    window.__lastVoiceKey = parts && parts.length ? parts[0] : null;
  };
  runVerify();
}

</script>
