<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>晚安故事序</title>
<style>
/* ================= 晚安故事序 storybed（batch30 · r10 难度改造）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E、灰蓝错误色（不用大红）
   玩法 v2（SPEC §6）：order/rain 题 = 题面流程小图+流程名大字+「，先做什么呀？」（stb_q；
   rain 题面顶挂条件徽章「明天下雨」stb_q_rain）+ 上方"顺序条" n 槽（槽序=点选次序）
   + 下方 4-5 张乱序步骤卡（小图为主+短词为辅）。点对（依赖图合法步）=源卡 .done 淡化保留+
   克隆飞入顺序条下一槽亮起；点错（前置未完/干扰）=晃动（miss≥2 才亮应点卡=答案级梯度脚手架）；
   已点卡再点=wrong 同口径（.done 淡化非隐藏——SPEC 定版，区别于 habit .gone）。
   miss 题 = 题面「少了哪一步呀」（stb_q_miss）+ 顺序条=3 个预填槽（链实步）+1 个缺口槽
   （虚线+?，呼吸提示）+ 下方 4 张候选卡；点对=飞入缺口槽，点错（干扰卡）=wrong+miss。
   触摸目标：步骤卡 = 主答案按钮 ≥96×96；底栏按钮 ≥64；overflowX 恒 0 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#D9C9EC;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面行 + 顺序条 + 步骤卡区 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:8px 14px}

/* 题面行：流程小图（SVG）+ 流程名大字 + '，先做什么呀？'（指令全语音承载，文字为识字冗余） */
/* r10 条件徽章（rain 题）：雨云图+「明天下雨」——条件卡片改变流程的视觉锚 */
#cond{flex:0 0 auto;display:none;align-items:center;gap:8px;min-height:44px;padding:3px 16px;
  border-radius:16px;background:#E8F0F7;border:2.5px dashed #7FA8C9}
#cond.show{display:flex}
#cond .cd-ico{width:40px;height:30px;flex:0 0 40px}
#cond .cd-ico svg{width:100%;height:100%}
#cond .cd-word{font-size:21px;font-weight:800;color:#3E6C93;white-space:nowrap}
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:76px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:12px;padding:5px 24px;min-height:66px;
  border-radius:22px;background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;
  transition:transform .15s}
#prompt-chip:active{transform:translateY(3px)}
#prompt-chip .p-ico{width:46px;height:46px;flex:0 0 46px}
#prompt-chip .p-ico svg{width:100%;height:100%}
#prompt-chip .p-name{font-size:32px;font-weight:800;color:#E8873A;line-height:1;white-space:nowrap}
#prompt-chip .p-ask{font-size:21px;font-weight:700;color:#4A3B2E;line-height:1;white-space:nowrap}

/* 顺序条：n 槽横排居中；空槽=虚线+序号大字，亮槽=绿底+小图+角标序号 */
#strip-wrap{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 4px}
#strip{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:nowrap}
.slot{width:84px;height:84px;border-radius:20px;border:3px dashed #D8C9B4;background:#FFF9EE;
  display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.slot .s-num{font-style:normal;font-size:30px;font-weight:800;color:#D8C9B4;line-height:1}
.slot.lit{border-style:solid;border-color:#6FA063;background:#8FBF7F;
  animation:slot-lit .5s cubic-bezier(.2,1.6,.4,1)}
.slot.lit .s-num{position:absolute;top:-9px;right:-9px;width:27px;height:27px;border-radius:50%;
  background:#FFF9EE;border:2px solid #6FA063;color:#4A3B2E;font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.slot.lit .s-art{width:52px;height:52px}
.slot.lit .s-art svg{width:100%;height:100%}
@keyframes slot-lit{0%{transform:scale(.4)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
/* r10 miss 题：预填槽（链实步，静态呈现）+ 缺口槽（虚线+?，呼吸提示=方向锚不泄答案） */
.slot.preset{border-style:solid;border-color:#C9A87C;background:#FFF9EE}
.slot.preset .s-art{width:52px;height:52px}
.slot.preset .s-art svg{width:100%;height:100%}
.slot.preset .s-num{position:absolute;top:-9px;right:-9px;width:27px;height:27px;border-radius:50%;
  background:#FFF9EE;border:2px solid #C9A87C;color:#4A3B2E;font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.slot.gap{border-color:#E8973A;background:#FFF4E3;animation:gap-breathe 1.8s ease-in-out infinite}
.slot.gap .s-q{font-style:normal;font-size:36px;font-weight:800;color:#E8973A;line-height:1}
@keyframes gap-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 9px rgba(232,151,58,.7))}}
/* 飞入动画克隆体（CSS transition：源卡矩形 → 目标槽矩形） */
.fly{position:fixed;z-index:90;border-radius:20px;background:#FFF9EE;border:3px solid #6FA063;
  box-shadow:0 4px 0 #6FA063;display:flex;align-items:center;justify-content:center;
  pointer-events:none;transition:transform .42s cubic-bezier(.3,.85,.35,1.08)}
.fly svg{width:64%;height:64%}

/* 步骤卡区：一行 3-5 张卡（乱序展示），卡=主答案按钮 ≥96×96；小图为主+短词为辅 */
#board{flex:0 0 auto;display:flex;gap:12px;justify-content:center;align-items:stretch;
  width:100%;max-width:1180px;padding:0 2px}
#board.bump{animation:board-bump .22s ease}
@keyframes board-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
.card{position:relative;background:#FFF9EE;border:3px solid #4A3B2E;border-radius:22px;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;flex:1 1 0;min-width:96px;max-width:200px;min-height:132px;
  padding:8px 4px;transition:transform .15s}
.card:active{transform:translateY(3px)}
.card .c-art{width:58px;height:58px;pointer-events:none}
.card .c-art svg{width:100%;height:100%}
.card .c-word{font-size:20px;font-weight:800;color:#4A3B2E;line-height:1.25;white-space:nowrap}
/* 入场弹跳（换题 stagger） */
.card.pop{animation:card-in .42s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes card-in{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* 已点入顺序条：淡化保留+角标对勾（SPEC §0.74 定版——再点=wrong 同口径，区别于 habit 隐藏保位） */
.card.done{opacity:.38}
.card.done::after{content:'✓';position:absolute;top:-8px;right:-8px;width:26px;height:26px;
  border-radius:50%;background:#8FBF7F;border:2.5px solid #4A3B2E;color:#FFF9EE;
  font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center}
/* 答错：晃动（不灰掉——非当前卡都可能是后续步，可重点） */
.card.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}
  55%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
/* miss≥2 答案级线索：当前应点卡呼吸高亮（梯度脚手架 §0.74） */
.card.breathe{animation:an-breathe 1.6s ease-in-out infinite}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
/* 静置救援：当前应点卡 pulse 三连（§0.21 视觉重现——语音之外屏幕可感知）。
   #strip.pulse=miss 题方向级救援链区整体脉冲（M-2：miss 合法集恒=唯一答案卡，pulse 它=泄答案） */
.card.pulse, #strip.pulse{animation:an-pulse 1.2s ease 1}
@keyframes an-pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.16)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#prompt-chip.bounce{animation:hear-b .45s ease}

/* ---------- 幽灵手指教学（照 batch10-29） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：chip/底栏/卡适配，主答案卡仍 ≥96
   body.port=verify simView 竖屏模拟通道（r7/r8 纪律⑥：媒体查询跟视口不跟元素——
   页内改 #game 尺寸不触发 orientation，须类通道；规则与上方 portrait 段逐条同步维护） */
@media (orientation:portrait){
  #cond{gap:6px;min-height:40px;padding:3px 12px}
  #cond .cd-ico{width:34px;height:26px;flex-basis:34px}
  #cond .cd-word{font-size:18px}
  #prompt-chip{gap:9px;padding:5px 18px}
  #prompt-chip .p-ico{width:38px;height:38px;flex-basis:38px}
  #prompt-chip .p-name{font-size:27px}
  #prompt-chip .p-ask{font-size:18px}
  .slot{width:78px;height:78px}
  .slot.lit .s-art{width:48px;height:48px}
  #board{gap:9px}
  .card{gap:3px;min-height:120px;max-width:170px}
  .card .c-art{width:50px;height:50px}
  .card .c-word{font-size:17px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
body.port #cond{gap:6px;min-height:40px;padding:3px 12px}
body.port #cond .cd-ico{width:34px;height:26px;flex-basis:34px}
body.port #cond .cd-word{font-size:18px}
body.port #prompt-chip{gap:9px;padding:5px 18px}
body.port #prompt-chip .p-ico{width:38px;height:38px;flex-basis:38px}
body.port #prompt-chip .p-name{font-size:27px}
body.port #prompt-chip .p-ask{font-size:18px}
body.port .slot{width:78px;height:78px}
body.port .slot.lit .s-art{width:48px;height:48px}
body.port #board{gap:9px}
body.port .card{gap:3px;min-height:120px;max-width:170px}
body.port .card .c-art{width:50px;height:50px}
body.port .card .c-word{font-size:17px}
body.port #btn-rabbit{width:78px;height:78px}
body.port #btn-rabbit svg{width:64px;height:64px}
</style>
</head>
<body>
<div id="game" aria-label="晚安故事序">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="cond" aria-hidden="true"></div>
    <div id="prompt">
      <button id="prompt-chip" aria-label="题目，点我再听一遍"></button>
    </div>
    <div id="strip-wrap" aria-label="顺序条">
      <div id="strip"></div>
    </div>
    <div id="board" aria-label="步骤卡片"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

};
const condArt = id => '<svg viewBox="0 0 64 48" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">' + COND_ART[id] + '</svg>';

/* ---------- 认知模型求值（r10）：perQuizCog(q)=题级认知 ms；关级=Σ题（verify 硬断言 ≥40000 且>动画）
   order/rain：步骤数×baseStep + 可换对数×swapPair（+distract×干扰数 +rain 加 condRead）
   miss：链实步×missScan + missInfer + 候选数×missCand
   可换对数=无约束路径的步骤对数（拓扑独立对：sleep 3 / getup·eat·out 1 / washhand·bath 0 / rain 3） ---------- */
const swapPairsOf = (flow, five) => {
  const ids = five ? [0, 1, 2, 3, 4] : [0, 1, 2, 3];
  const dep = five ? RAIN_DEPS : DEPS[flow];
  const reach = (a, b) => {                      // a 是否约束路径先于 b（DFS 传递闭包）
    if (dep[a].indexOf(b) >= 0) return true;
    return dep[a].some(m => reach(m, b));
  };
  let n = 0;
  for (let i = 0; i < ids.length; i++)
    for (let j = i + 1; j < ids.length; j++)
      if (!reach(ids[i], ids[j]) && !reach(ids[j], ids[i])) n++;
  return n;
};
function quizCogMs(q) {
  if (q.kind === 'miss') return q.chainSteps.length * COG.missScan + COG.missInfer + q.pool.length * COG.missCand;
  const five = q.kind === 'rain';
  const n = five ? 5 : q.stepIds.length;
  let ms = n * COG.baseStep + swapPairsOf(q.flow, five) * COG.swapPair;
  if (!five) ms += q.pool.filter(p => q.stepIds.indexOf(p.stepId) < 0).length * COG.distract;
  else ms += COG.condRead;
  return ms;
}
/* 动画分账（口径与 uiTapCard 实窗一致：step 锁=dur+220≈640 / 判对演出=5200 / 错防重入=1000；
   求值按零错通关路径=只计 step 锁+判对窗——错窗属异常路径不计入基线动画） */
function animMsOf(L) {
  return L.quizzes.reduce((s, q) => s + (q.kind === 'miss' ? 5200 : q.stepIds.length * 640 + 5200), 0);
}

/* ================= storybed 纯引擎 v2（r10）：确定性关卡生成 + 依赖图「合理序」状态机（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 59)（batch30 本批常量 59，注明）：同 flat 永远同关（重玩一致、verify 可检）。
   章型 v2（SPEC-BATCH30 §6 r10；进度章号单调递增、难度章号 (ch-1)%4+1 循环）：
     dch1 可换序多解（order：4 步依赖图判定——DEPS 判「合理序」非唯一序；flat0q0=sleep 前 3 步教学特例）
     dch2 order+1 干扰卡（干扰=其他流程步骤且文本∉本流程文本集，点干扰=wrong+miss）
     dch3 条件分支（题0 恒 rain=flat10q0 确定性锚点；关内 rain 题 nRain=ri(2,3) 均 out+「带小伞」5 步，
       其余位 order+干扰、流程取非 out 的 5 流程互异）
     dch4 缺步补卡（miss：流程 4 步链缺 1 步+4 候选卡=真值+3 干扰，找缺+补对双步认知）
   玩法铁律（§6 逐点制 v2）：点当前合法步骤（未完成∧前置全完成，miss 题=缺失步）='step'
   （placed 追加=槽序=点选次序）→末步='right'（末题='done'）；点非法步骤（前置未完成/已点
   .done 卡/干扰卡/miss 错卡）='wrong'+miss；越界/结束=null。
   已点步骤卡 .done 淡化保留（再点=wrong 同口径——SPEC 定版）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 合法步骤集（r10 依赖图判定核心）：未完成 ∧ 前置集 ⊆ 已完成集
   miss 题合法集=单元素 [missingId]（兼容单答案语义） ---------- */
function legalSteps(q) {
  if (!q || q.solved) return [];
  if (q.kind === 'miss') return [q.missingId];
  const doneSet = new Set(q.placed);
  return q.stepIds.filter(id => {
    if (doneSet.has(id)) return false;
    const n = +id.split('_')[1];
    return (q.deps[n] || []).every(d => doneSet.has(q.flow + '_' + d));
  });
}
/* 应点卡下标（救援/autoSolve/教学用：合法集首步在卡池中的展示位） */
function engAnswerIdx(q) {
  const ls = legalSteps(q);
  if (!ls.length) return -1;
  for (let i = 0; i < q.pool.length; i++) if (q.pool[i].stepId === ls[0]) return i;
  return -1;
}

/* ---------- 卡池乱序：洗牌后若完成步骤在池中的出现序恰=SPEC 正序（过滤干扰位）则重洗
   （乱序卡≠已排好的序——保排序挑战在场；干扰卡任意位均合法；miss 候选池无正序概念直接洗） ---------- */
function genPoolOrder(stepIds, distractId, rnd) {
  const ids = stepIds.concat(distractId ? [distractId] : []);
  let pool = shuffled(ids, rnd), guard = 0;
  const inOrder = p => p                              // 完成序出现位=正序？
    .map(id => stepIds.indexOf(id))
    .filter(x => x >= 0)
    .every((x, i, a) => a[i] === i);
  while (inOrder(pool) && guard++ < 24) pool = shuffled(ids, rnd);
  return pool;
}

/* ---------- 单题生成 v2：mkQuiz(flow, roll, rnd, opt) → 三型题
   opt.short=true → 前 3 步短流程（flat0q0 教学特例，仅 sleep 锚点用）
   opt.distract=true → order 题加 1 干扰卡；opt.miss=true → 缺步补卡题 ---------- */
function mkQuiz(flow, roll, rnd, opt) {
  opt = opt || {};
  const full = FLOWS[flow].steps.map((s, n) => ({
    stepId: stepIdOf(flow, n), text: s.t }));
  /* miss 型：链=4 步去 1（缺口位 seeded），候选 4=真值+3 干扰 */
  if (opt.miss) {
    const gapIdx = ri(rnd, 0, 3);
    const missing = full[gapIdx];
    const others = [];                                   // 干扰池：其他流程步骤且文本∉本流程
    FLOW_IDS.forEach(of => {
      if (of === flow) return;
      FLOWS[of].steps.forEach((s, n) => {
        if (full.map(f => f.text).indexOf(s.t) < 0) others.push(stepIdOf(of, n));
      });
    });
    const ds = shuffled(others, rnd).slice(0, 3);
    const pool = shuffled([missing.stepId].concat(ds), rnd).map(id => {
      const f = id.split('_');
      return { stepId: id, text: FLOWS[f[0]].steps[+f[1]].t, done: false };
    });
    return { kind: 'miss', flow: flow, name: FLOWS[flow].name, dch: roll,
             stepIds: full.map(f => f.stepId), texts: full.map(f => f.text),
             deps: null, pool: pool, placed: [], pos: 0, miss: 0, solved: false,
             chainSteps: full.filter((x, i) => i !== gapIdx).map(x => x.stepId),
             gapIdx: gapIdx, missingId: missing.stepId, missingText: missing.text };
  }
  /* rain 型：out 五步（4=带小伞），依赖=RAIN_DEPS */
  if (opt.rain) {
    const ids = full.map(f => f.stepId).concat([stepIdOf(flow, 4)]);
    const pool = genPoolOrder(ids, null, rnd).map(id => {
      const f = id.split('_');
      const t = +f[1] === 4 ? COND.rain.text : FLOWS[f[0]].steps[+f[1]].t;
      return { stepId: id, text: t, done: false };
    });
    return { kind: 'rain', flow: flow, name: FLOWS[flow].name, dch: roll,
             stepIds: ids, texts: ids.map(id => {
               const f = id.split('_');
               return +f[1] === 4 ? COND.rain.text : FLOWS[f[0]].steps[+f[1]].t;
             }),
             deps: RAIN_DEPS, pool: pool, placed: [], pos: 0, miss: 0, solved: false };
  }
  /* order 型：短流程（前 3 步，仅 flat0q0）或全 4 步（+可选 1 干扰） */
  const useN = opt.short ? 3 : 4;
  const steps = full.slice(0, useN);
  const stepIds = steps.map(s => s.stepId);
  const texts = steps.map(s => s.text);
  let distractId = null;
  if (opt.distract) {
    const others = [];
    FLOW_IDS.forEach(of => {
      if (of === flow) return;
      FLOWS[of].steps.forEach((s, n) => {
        if (texts.indexOf(s.t) < 0) others.push(stepIdOf(of, n));   // 文本∉本流程
      });
    });
    distractId = others[ri(rnd, 0, others.length - 1)];
  }
  const pool = genPoolOrder(stepIds, distractId, rnd).map(id => {
    const f = id.split('_');
    return { stepId: id, text: FLOWS[f[0]].steps[+f[1]].t, done: false };
  });
  /* 依赖图：子流程裁剪（short 时前置∩保留集——sleep 前 3 步无前置，裁剪为防御性） */
  const depFull = DEPS[flow];
  const deps = {};
  steps.forEach(s => {
    const n = +s.stepId.split('_')[1];
    deps[n] = (depFull[n] || []).filter(d => stepIds.indexOf(stepIdOf(flow, d)) >= 0);
  });
  return { kind: 'order', flow: flow, name: FLOWS[flow].name, dch: roll,
           stepIds: stepIds, texts: texts, deps: deps,
           pool: pool, placed: [], pos: 0, miss: 0, solved: false };
}

/* ---------- 关卡生成 v2（静态 20 关与生成关同一确定性通道）
   flat0 题0 恒 sleep+3 步（教学演示锚点：__sbDemoR='right' 终值语义）
   dch3 题0 恒 rain（flat10q0=确定性锚点：verify 布局/驱动/题面断言） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 59);
  if (flat >= STATIC_LEVELS) rnd();                        // burn：mulberry32 首掷对 4 系统偏差（b25 坑④）
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4); // 生成关随机章参数（家族统一，先取数保确定性）
  const quizzes = [];
  if (dch === 1 || dch === 2) {                            // order 关：封闭 6 洗牌取 5 流程互异
    const seq = shuffled(FLOW_IDS, rnd).slice(0, CH_LEN);
    if (flat === 0 && seq[0] !== 'sleep') {                // 教学锚点：题0 恒 sleep
      const i = seq.indexOf('sleep');
      seq[i] = seq[0]; seq[0] = 'sleep';
    }
    seq.forEach((f, qi) => quizzes.push(mkQuiz(f, dch, rnd, {
      short: flat === 0 && qi === 0, distract: dch === 2 })));
  } else if (dch === 3) {                                  // rain 混合关：题0 恒 rain，其余位 seeded
    const nRain = ri(rnd, 2, 3);
    const others = shuffled(FLOW_IDS.filter(f => f !== COND.rain.flow), rnd).slice(0, CH_LEN - nRain);
    const tail = shuffled(
      Array(nRain - 1).fill('rain').concat(Array(CH_LEN - nRain).fill('order')), rnd);
    const slots = ['rain'].concat(tail);
    slots.forEach(kind => quizzes.push(kind === 'rain'
      ? mkQuiz(COND.rain.flow, dch, rnd, { rain: true })
      : mkQuiz(others.pop(), dch, rnd, { distract: true })));
  } else {                                                 // miss 关：封闭 6 洗牌取 5 流程互异
    shuffled(FLOW_IDS, rnd).slice(0, CH_LEN)
      .forEach(f => quizzes.push(mkQuiz(f, dch, rnd, { miss: true })));
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点卡引擎 v2：engTap(L, i) —— 点卡池展示位 i
   'step' 点对一步（题未完，placed 追加） / 'right' 末步完成本题 / 'done' 末题完成=通关
   / 'wrong' 非法点（前置未完成/已点 .done 卡/干扰卡/miss 错卡，miss+1）
   / null 越界/关已结束/本题已判 ---------- */
function engTap(L, i) {
  if (!L || L.done) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.pool.length) return null;
  const p = q.pool[i];
  if (q.kind === 'miss') {                               // 缺步题：点缺失步=一次补对
    if (p.stepId === q.missingId) {
      p.done = true;
      q.solved = true;
      L.step++;
      if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
      return 'right';
    }
    q.miss++; L.retries++;
    return 'wrong';
  }
  const doneSet = new Set(q.placed);
  const n = +p.stepId.split('_')[1];
  const legal = !p.done && q.stepIds.indexOf(p.stepId) >= 0 &&
    (q.deps[n] || []).every(d => doneSet.has(q.flow + '_' + d));
  if (legal) {                                           // 当前合法步骤（多解题合法集内任一）
    p.done = true;
    q.placed.push(p.stepId);
    q.pos++;
    if (q.pos >= q.stepIds.length) {                     // 本题全部排对
      q.solved = true;
      L.step++;
      if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
      return 'right';
    }
    return 'step';
  }
  q.miss++;                                              // 前置未完/已点/干扰卡同口径
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（miss 口径同族）：一关零错=3★ / 总错 ≤2=2★ / 否则 1★。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));

/* ---------- 结构校验 v2（verify 用，返回失败原因或 null）：题型/依赖图/章型池深/
   干扰规则/卡池互异（stepId+text 双口径）/乱序非正序/初始态干净 ---------- */
function structWhy(q, dch, flat, qi, prev) {
  if (!q || !FLOWS[q.flow]) return 'flow';
  if (q.dch !== dch) return 'dch';
  if (['order', 'rain', 'miss'].indexOf(q.kind) < 0) return 'kind';
  const ref = FLOWS[q.flow].steps;
  const short = flat === 0 && qi === 0 && dch === 1;     // 教学特例：sleep 前 3 步
  if (q.kind === 'miss') {                               // ---- miss 型 ----
    if (dch !== 4) return 'missDch';
    const want = 4;
    if (q.stepIds.length !== want) return 'stepN';
    for (let i = 0; i < want; i++) {
      if (q.stepIds[i] !== stepIdOf(q.flow, i)) return 'stepIds';
      if (q.texts[i] !== ref[i].t) return 'texts';
    }
    if (q.gapIdx < 0 || q.gapIdx > 3) return 'gap';
    if (q.missingId !== stepIdOf(q.flow, q.gapIdx)) return 'missingId';
    if (q.missingText !== ref[q.gapIdx].t) return 'missingText';
    if (q.chainSteps.length !== 3) return 'chainN';
    for (let i = 0; i < 3; i++) {                        // 链去缺口后保序
      const wantI = i < q.gapIdx ? i : i + 1;
      if (q.chainSteps[i] !== stepIdOf(q.flow, wantI)) return 'chain' + i;
    }
    if (q.chainSteps.some(id => id === q.missingId)) return 'chainHasMissing';
    if (q.pool.length !== 4) return 'poolN';
    const ids = q.pool.map(p => p.stepId), ts = q.pool.map(p => p.text);
    if (new Set(ids).size !== 4) return 'poolDupId';
    if (new Set(ts).size !== 4) return 'poolDupText';
    if (ids.indexOf(q.missingId) < 0) return 'poolMiss';
    const ext = q.pool.filter(p => q.stepIds.indexOf(p.stepId) < 0);
    if (ext.length !== 3) return 'distractN';
    if (ext.some(p => p.stepId.split('_')[0] === q.flow)) return 'distractSelf';
    if (ext.some(p => q.texts.indexOf(p.text) >= 0)) return 'distractText';
  } else if (q.kind === 'rain') {                        // ---- rain 型 ----
    if (dch !== 3) return 'rainDch';
    if (q.flow !== COND.rain.flow) return 'rainFlow';
    if (q.stepIds.length !== 5) return 'stepN';
    for (let i = 0; i < 4; i++) {
      if (q.stepIds[i] !== stepIdOf(q.flow, i)) return 'stepIds';
      if (q.texts[i] !== ref[i].t) return 'texts';
    }
    if (q.stepIds[4] !== stepIdOf(q.flow, 4) || q.texts[4] !== COND.rain.text) return 'umbrella';
    /* m-7：q.deps 即 RAIN_DEPS 同引用，比它=恒真互证。改为与 SPEC §6 重列字面比
       （真值另由 verify ② SPEC_RAIN_DEPS 独立表对账兜底） */
    if (JSON.stringify(q.deps) !== JSON.stringify({ 0: [], 1: [0], 2: [0], 4: [0], 3: [1, 2, 4] })) return 'rainDeps';
    if (q.pool.length !== 5) return 'poolN';
    const rids = q.pool.map(p => p.stepId), rts = q.pool.map(p => p.text);
    if (new Set(rids).size !== 5) return 'poolDupId';
    if (new Set(rts).size !== 5) return 'poolDupText';
    for (const id of q.stepIds) if (rids.indexOf(id) < 0) return 'poolMiss';
    /* 乱序非正序（保排序挑战在场） */
    const rp = rids.map(id => q.stepIds.indexOf(id));
    if (rp.every((x, i) => x === i)) return 'inOrder';
  } else {                                               // ---- order 型 ----
    if (dch === 4) return 'orderDch';
    const wantN = short ? 3 : 4;
    if (q.stepIds.length !== wantN) return 'stepN';
    for (let i = 0; i < wantN; i++) {
      if (q.stepIds[i] !== stepIdOf(q.flow, i)) return 'stepIds';
      if (q.texts[i] !== ref[i].t) return 'texts';
    }
    const wantPool = wantN + (dch === 2 || dch === 3 ? 1 : 0);
    if (q.pool.length !== wantPool) return 'poolN';
    const ids = q.pool.map(p => p.stepId), ts = q.pool.map(p => p.text);
    if (new Set(ids).size !== ids.length) return 'poolDupId';
    if (new Set(ts).size !== ts.length) return 'poolDupText';
    for (const id of q.stepIds) if (ids.indexOf(id) < 0) return 'poolMiss';
    const wantD = dch === 2 || dch === 3 ? 1 : 0;
    const ext = q.pool.filter(p => q.stepIds.indexOf(p.stepId) < 0);
    if (ext.length !== wantD) return 'distractN';
    if (wantD === 1) {
      if (ext[0].stepId.split('_')[0] === q.flow) return 'distractSelf';
      if (q.texts.indexOf(ext[0].text) >= 0) return 'distractText';
    }
    /* 依赖图与 DEPS 子图一致（short 裁剪） */
    const depFull = DEPS[q.flow];
    for (let i = 0; i < wantN; i++) {
      const want = (depFull[i] || []).filter(d => q.stepIds.indexOf(stepIdOf(q.flow, d)) >= 0);
      if (JSON.stringify(q.deps[i]) !== JSON.stringify(want)) return 'deps';
    }
    /* 乱序：完成步骤出现序 ≠ 正序（排序挑战在场） */
    const seqPos = ids.map(id => q.stepIds.indexOf(id)).filter(x => x >= 0);
    if (seqPos.every((x, i) => x === i)) return 'inOrder';
  }
  if (prev != null && q.kind !== 'rain' && prev.flow === q.flow) return 'adjFlow';   // order/miss 关流程互异（rain 题恒 out 允许相邻）   // 同型相邻重复（order/miss 关全互异）
  if (q.pos !== 0 || q.miss !== 0 || q.solved || q.placed.length !== 0) return 'init';
  if (q.pool.some(p => p.done)) return 'initDone';
  return null;
}
/* ================= storybed 主逻辑 v2（r10）：顺序条/步骤卡渲染 / 依赖图「合理序」逐点制 / 三题型 / 教学 / 救援 / 推进
   玩法（SPEC-BATCH30 §6 r10）：
   order/rain 题：题面=流程小图+流程名大字+「先做什么呀？」（rain 题顶挂「明天下雨」条件徽章，
   语音 stb_q_rain——条件卡片改变流程=出门插入「带小伞」5 步）；上方顺序条 n 槽（槽序=点选次序）；
   下方 4-5 张乱序步骤卡。点当前合法步骤（依赖图：未完成∧前置全完成——可换序多解）→ 源卡
   .done 淡化保留+克隆飞入顺序条下一槽亮起（'step'）→「然后呢」逐点至全部完成（末步 'right'，
   末题 'done'）；点非法步骤（前置未完成/已点/干扰卡）='wrong'+miss+wig（miss≥2 才亮合法卡=
   答案级梯度脚手架）。
   miss 题：题面「少了哪一步呀」（stb_q_miss）+ 顺序条=3 预填槽+1 缺口槽（呼吸提示）+ 4 候选卡；
   点缺失步卡=飞入缺口槽（'right'/末题 'done'）；点干扰卡='wrong'+miss（专用句 GUIDE.miss）。
   救援两级（家族 B 双锚）：14s 方向级=重读题面+合法卡 pulse 三连（lastDir 独立锚不重置 lastAct）；
   30s 答案级=首张合法卡 breathe+重读（lastAct 重置）。
   语音窗（家族 G/H/I/N/T + estMs 全字符口径，SPEC §4 实长 + r10 新键）：
   stb_tut_watch 3096 → 演示首 tap 延至 t=900+2500=3400（≥3096+300=3396 禁撞头）；
   stb_tut_turn 1776 → turn 后读题延 2100（≥1776+300=2076 防尾截）；
   逐点反馈链 [步音, stb_next] =步实长+150+1488 ≤1896+150+1488=3534 fire-and-forget
     （<14000 方向级救援间隔-1000，无掐尾；新点起新链打断旧链=孩子抢点正常语义）；
   排完确认链 [stb_right, 末步步音]=2520+150+1896=4566 → 判对演出窗 1800+3400=5200
     ≥4566+300=4866（契约 G/H；全 clip 段无 keyless——契约 N 无虞）；
   错链 [stb_wrong, 语义句 clip 键段]（T46 阶段2：三句族 stb_g_wrong/distract/miss，
     text=TTS 兜底）=2496+150+3120 → 豁免窗 wrongChainUntil=7100 ≥5766+300=6066（家族 I）；
   出题句分型：order=stb_q / rain=stb_q_rain / miss=stb_q_miss（play 单发无锁窗）；
   错点防重入窗 1000ms；救援读题掐链由 wrongChainUntil 守卫。
   验收钩子（无条件挂 window——b29 坑⑥，gate G2/R8 真实页可达）：
   window.SB = { get currentLevel, get quiz(){kind('order'|'rain'|'miss'),flow,steps[](卡池
   {stepId,text,done}),answers[](当前合法步骤集),answer(=answers[0] 兼容),phase(已点数),
   step,miss,chain[](miss 题出示链,null=缺口)}, tapCard(i), start(flat),
   async autoSolve(){done,taps}, get tutorial }——tapCard 返回值族：
   step/right/done/wrong/null（越界或演出窗），全 async；getter 返回拷贝 */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速

const replayAnim = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
/* 救援/开场任务语音/读题不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */

/* 纠错链节流（家族 J：语义句全程保留禁切通用 clip）：flat<3 每错必播；flat≥3 10s 节流
   ——返回是否起播（契约 I「仅起播时设豁免窗」） */
let lastWrongVoice = 0;
let wrongChainUntil = 0;                         /* 错反馈链豁免窗终点（救援 interval 让路，家族 I） */
const sayW = parts => {
  if (!cur) return false;
  if (cur.flat < 3) { KIDS.voice.queue(parts); return true; }
  const now = Date.now();
  if (now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.queue(parts); return true; }
  return false;
};

const stageEl = $id('stage'), stripEl = $id('strip'), boardEl = $id('board'),
      chipEl = $id('prompt-chip'), condEl = $id('cond'), ghostEl = $id('ghost'),

let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）
let helpRedemo = false;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));

const slotEl = p => stripEl.querySelector('.slot[data-pos="' + p + '"]');
/* 步骤文本查表（含 rain 条件步 out_4「带小伞」——FLOWS 表外唯一扩展步） */
function stepTextOf(flow, n) { return +n === 4 ? COND.rain.text : FLOWS[flow].steps[+n].t; }

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;

}
/* 音效（Web Audio 合成）：排对一步=短双音 / 答错=低柔单音 / 排完一题=叮咚 */
const chimeStep = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.12, 0, 0.55); KIDS.audio.note(880, 0.18, 0.07, 0.6); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };

/* ================= 题面语音分型（r10）：order=stb_q / rain=stb_q_rain / miss=stb_q_miss ================= */
function speakQuiz() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  if (q.kind === 'rain') KIDS.voice.play(VOICE.qr.key, VOICE.qr.text);
  else if (q.kind === 'miss') KIDS.voice.play(VOICE.qm.key, VOICE.qm.text);
  else KIDS.voice.play(VOICE.q.key, VOICE.q.text);
}

/* ================= 渲染 ================= */
function buildStrip(n) {                        // order/rain：n 空槽（虚线+序号大字，槽序=点选次序）
  stripEl.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'slot';
    d.dataset.pos = i;
    d.innerHTML = '<i class="s-num">' + (i + 1) + '</i>';
    stripEl.appendChild(d);
  }
}
function buildMissStrip(q) {                    // miss 题：3 预填槽（链实步）+1 缺口槽（虚线+?）
  stripEl.innerHTML = '';
  const flow = q.flow;
  for (let i = 0; i < 4; i++) {
    const d = document.createElement('div');
    if (i === q.gapIdx) {
      d.className = 'slot gap';
      d.dataset.pos = i;
      d.innerHTML = '<i class="s-q">?</i>';
    } else {
      const k = i < q.gapIdx ? i : i - 1;               // 链实步固有号（跳过缺口）
      d.className = 'slot preset';
      d.dataset.pos = i;
      d.innerHTML = '<span class="s-art">' + stepArt(stepTextOf(flow, k)) + '</span>' +
                    '<i class="s-num">' + (i + 1) + '</i>';
    }
    stripEl.appendChild(d);
  }
}
function buildBoard(q) {                        // 步骤卡池（order/rain=乱序步骤+干扰；miss=4 候选）
  boardEl.innerHTML = '';
  q.pool.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'card pop';
    b.dataset.i = i;
    b.dataset.sid = p.stepId;
    b.setAttribute('aria-label', p.text);
    b.style.animationDelay = (i * 70) + 'ms';
    b.innerHTML = '<span class="c-art">' + stepArt(p.text) + '</span><span class="c-word">' + p.text + '</span>';
    boardEl.appendChild(b);
  });
}
function renderPrompt(q) {                      // 题面行（识字冗余，指令全语音承载）+ 条件徽章分型
  condEl.classList.toggle('show', q.kind === 'rain');
  if (q.kind === 'rain')
    condEl.innerHTML = '<span class="cd-ico">' + condArt('rain') + '</span><span class="cd-word">' + COND.rain.badge + '</span>';
  const ask = q.kind === 'miss' ? '，少了哪一步呀？' : '，先做什么呀？';
  chipEl.innerHTML = '<span class="p-ico">' + flowArt(q.flow) + '</span>' +
    '<span class="p-name">' + q.name + '</span><span class="p-ask">' + ask + '</span>';
  chipEl.setAttribute('aria-label', q.name + '，' + (q.kind === 'miss' ? '少了哪一步呀' : '先做什么呀') + '，点我再听一遍');
}
function renderQuiz(speak) {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  if (q.kind === 'miss') buildMissStrip(q); else buildStrip(q.stepIds.length);
  buildBoard(q);
  renderPrompt(q);
  renderStep();
  if (speak !== false && !VERIFY && !state.demo && !state.quiet) speakQuiz();  /* 开场/换题读题（分型） */
}
function renderStep() {                         // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ================= 飞入动画（§0.11：CSS transition，时长随 SPEED）
   order/rain：源卡 .done 淡化保留 → 克隆飞行体 源卡矩形→顺序条第 placed 位槽 → 到达填充+亮起；
   miss：点对候选卡 → 克隆飞入第 gapIdx 位缺口槽 → 到达填充+亮起 ================= */
function flyStep(el, pos, text) {
  const dur = 420 * SPEED;
  if (el) { el.classList.add('done'); }
  const slot = slotEl(pos);
  if (el && slot) {
    const from = el.getBoundingClientRect();
    const to = slot.getBoundingClientRect();
    const fly = document.createElement('div');
    fly.className = 'fly';
    fly.innerHTML = stepArt(text);
    fly.style.left = from.left + 'px';
    fly.style.top = from.top + 'px';
    fly.style.width = from.width + 'px';
    fly.style.height = from.height + 'px';
    fly.style.transitionDuration = dur + 'ms';
    document.body.appendChild(fly);
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    const k = Math.min(to.width, to.height) / Math.max(from.width, from.height);
    requestAnimationFrame(() => {
      fly.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + k + ')';
    });
    setTimeout(() => fly.remove(), dur + 90);
  }
  setTimeout(() => fillSlot(pos, text), dur);   // 到达即填充亮起
  return dur;
}
function fillSlot(pos, text) {
  const s = slotEl(pos);
  if (!s) return;
  s.classList.remove('lit', 'gap', 'preset'); void s.offsetWidth;
  s.classList.add('lit');
  s.innerHTML = '<span class="s-art">' + stepArt(text) + '</span><i class="s-num">' + (pos + 1) + '</i>';
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向：当前题第一张合法步骤卡（可换序多解下任一合法卡即可） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const i = engAnswerIdx(q);
  if (i >= 0) pointGhostAt(cardEl(i));
}

/* ================= 点卡主路径（真实点击 / SB.tapCard / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（卡板容器 bump 微动效——家族 D）：演出窗/教学演示期/越界=null+pop+bump；
   错点 1000ms 防重入窗；miss≥2 才亮第一张合法卡（答案级梯度脚手架，§6） ========== */
async function uiTapCard(i, demo) {
  if (!cur || state.won || (state.locked && !demo) || (state.demo && !demo)) {
    sfx('pop');
    replayAnim(boardEl, 'bump');
    return null;                                 // 演出窗/教学演示期吞点=null（钩子契约）
  }
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  const run = cur;                               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTap(cur, i);
  if (r === null) { sfx('pop'); replayAnim(boardEl, 'bump'); return null; }   // 越界下标
  const el = cardEl(i);

  if (r === 'wrong') {                           /* 非法点：wig+miss+错链（语义句 clip 键段，三句族分型） */
    state.locked = true;
    if (el) replayAnim(el, 'wig');
    dodgeLo();
    const gk = q.kind === 'miss' ? 'miss'
      : (q.stepIds.indexOf(q.pool[i].stepId) < 0 ? 'distract' : 'wrong');   /* 三句族分型（miss 干扰/干扰/前置未完） */
    if (sayW([VOICE.wrong.key, { key: GUIDE_KEY[gk], text: GUIDE[gk] }]))   /* 错链=stb_wrong+语义句 clip（T46 阶段2；text=TTS 兜底） */
      wrongChainUntil = Date.now() + 7100;       /* 链豁免（家族 I）：2496+150+3120(stb_g_wrong 实长)+300=6066 */
    await wait(1000 * SPEED);                    /* 错点防重入窗 1000ms；救援由 wrongChainUntil 让路 */
    if (cur !== run) return r;
    if (q.miss >= 2) {                           /* 答案级线索 miss≥2 才亮第一张合法卡（梯度脚手架） */
      const ok = cardEl(engAnswerIdx(q));
      if (ok && !ok.classList.contains('done')) replayAnim(ok, 'breathe');
    }
    state.locked = false;
    return r;
  }

  lastAct = Date.now();                          /* 正确推进重置救援钟（§0.7a） */
  if (state.tut === 'help') {                    /* 教学"独"：首次排对 → 放手 */
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  state.locked = true;
  if (el) { el.classList.remove('breathe', 'wig'); }
  if (q.kind === 'miss') {                       /* ---- miss 题补对：飞入缺口槽+确认链 right+缺失步音 ---- */
    const dur = flyStep(el, q.gapIdx, q.missingText);
    chimeStep();
    sfx('coin');
    chimeGoal();
    KIDS.voice.queue([VOICE.right.key, stepKeyOf(q.missingId)]);   /* 2520+150+缺失步步音 */
    await wait(1800 * SPEED);                    /* 入槽+演出主窗 */
    if (cur !== run) return r;
    await wait(3400 * SPEED);                    /* 链收尾窗：总 5200 ≥2520+150+1896+300=4866（契约 G/H） */
    if (cur !== run) return r;
    state.locked = false;
    if (r === 'done') { winFlow(); return 'done'; }
    renderQuiz();                                /* 新题 + 分型读题 */
    return r;
  }
  const n = q.pos - 1;                           /* 引擎已 placed.push：所点步骤序=n（槽序=点选次序） */
  const sid = q.placed[n];
  const dur = flyStep(el, n, stepTextOf(q.flow, +sid.split('_')[1]));   /* 源卡 .done 淡化+克隆飞入槽 n */
  chimeStep();
  if (r === 'step') {                            /* 题内排对一步：逐点反馈链=步音+「然后呢」（fire-and-forget） */
    KIDS.voice.queue([stepKeyOf(sid), VOICE.next.key]);        /* ≤1896+150+1488=3534 <14s 救援间隔 */
    await wait(dur + 220 * SPEED);               /* 飞入 transition 窗 */
    if (cur !== run) return r;
    state.locked = false;
    return r;
  }

  /* ---- right / done（本题排完：全槽亮起+确认链 right+末点点步音） ---- */
  sfx('coin');
  chimeGoal();
  KIDS.voice.queue([VOICE.right.key, stepKeyOf(q.placed[q.placed.length - 1])]);   /* 2520+150+末步步音 */
  await wait(1800 * SPEED);                      /* 入槽+演出主窗 */
  if (cur !== run) return r;
  await wait(3400 * SPEED);                      /* 链收尾窗：总 5200 ≥2520+150+1896+300=4866（契约 G/H；
                                                    错→对路径读题同延防链掐尾） */
  if (cur !== run) return r;
  state.locked = false;
  if (r === 'done') { winFlow(); return 'done'; }
  renderQuiz();                                  /* 新题（顺序条/卡池/题面全换）+分型读题 */
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const f = flat == null ? cur.flat : flat;
  const ci = Math.floor(f / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关=实算下一关随机章型 GEN[dch-1]（家族 F：
     genLevel 纯函数确定性，同 flat 恒同 dch——预告与实际章型恒一致；禁 (ci+1)%4 章序推进） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[genLevel(f + 1).dch - 1];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');

    if (s < steps.length - 1) await wait(1300 * SPEED);   /* 逐点链主体段（步音+然后呢） */
  }

  await wait(500 * SPEED);                       /* 收尾（确认链由 uiTapCard 5200 窗罩满） */

/* ================= 无操作看护（命名函数 rescueTick——verify 源码级断言用）：
   14s 方向级（重读题面+全部合法卡 pulse 三连，lastDir 独立节流锚，不重置 lastAct——30s
   答案级不被饿死）/ 30s 答案级（第一张合法卡 breathe + 重读，lastAct 重置）/ 教学"帮"5s 重演示；
   错反馈链豁免窗守卫在顶部（家族 I：链播完前救援不掐断，不挡主动点选） ================= */
function rescueTick() {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  if (Date.now() < wrongChainUntil) return;   /* 错反馈链豁免窗（家族 I）：链播完前救援不掐断 */
  if (document.querySelector('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel')) return;
  /* 面板遮挡期救援静默（家族 K：层在时点击全吞却每 14-18s 重播读题=「一直在念题点什么都没反应」） */
  const idle = Date.now() - lastAct;
  const q = cur.quizzes[cur.step];
  if (!q) return;
  const legalIdxs = legalSteps(q).map(id => {          // 合法步骤在卡池中的展示位（多解=多卡）
    for (let i = 0; i < q.pool.length; i++) if (q.pool[i].stepId === id) return i;
    return -1;
  }).filter(i => i >= 0);
  if (idle > 30000) {                            /* 答案级：静音也能看见答案线索 */
    const ok = legalIdxs.length ? cardEl(legalIdxs[0]) : null;
    if (ok) replayAnim(ok, 'breathe');
    speakQuiz();
    lastAct = Date.now();
    return;
  }
  if (idle > 14000 && Date.now() - lastDir > 14000) {   /* 方向级：重读题面+链区/合法卡 pulse（不动 lastAct） */
    speakQuiz();
    if (q.kind === 'miss') {                     /* miss 题合法集恒=唯一答案卡——pulse 它=泄答案
                                       （M-2：改 pulse 链区容器，缺口槽常驻呼吸已是方向锚，
                                         与 dressup budget/anti「场景 pulse 不指片」同批口径） */
      for (let k = 0; k < 3; k++) setTimeout(() => replayAnim(stripEl, 'pulse'), k * 520);
    } else {                                     /* 非 miss：多解=多卡方向锚（合法集全部卡） */
      legalIdxs.forEach(i => {
        const ok = cardEl(i);
        if (ok && !ok.classList.contains('done')) {
          for (let k = 0; k < 3; k++) setTimeout(() => replayAnim(ok, 'pulse'), k * 520);
        }
      });
    }
    lastDir = Date.now();
    return;
  }
  if (idle > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {
    helpRedemo = true;
    pointHelpNext();
  }
}

    if (!cur) return null;

             step: cur.step, done: cur.done, won: state.won,
             miss: cur.retries, stars: engStars(cur) };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    const answers = legalSteps(q);                          /* 当前合法步骤集（miss 题=[missingId]） */
    let chain = null;
    if (q.kind === 'miss') {                                /* 出示链（null=缺口位） */
      chain = [];
      for (let i = 0; i < 4; i++) chain.push(i === q.gapIdx ? null : {
        stepId: q.chainSteps[i < q.gapIdx ? i : i - 1],
        text: stepTextOf(q.flow, (i < q.gapIdx ? i : i - 1)) });
    }
    return { kind: q.kind,                                  /* 题型（order/rain/miss，SPEC §6） */
             flow: q.flow,                                  /* 流程 id */
             steps: q.pool.map(p => ({ stepId: p.stepId, text: p.text, done: !!p.done })),   /* 卡池 */
             answers: answers,                              /* 当前合法步骤 stepId 集 */
             answer: answers.length ? answers[0] : null,    /* 兼容单答案语义 */
             chain: chain,                                  /* miss 题出示链（null=缺口） */
             phase: q.pos,                                  /* 已点数 */
             step: cur.step,
             miss: q.miss };
  },
  tapCard(i) { return uiTapCard(i); },
  async autoSolve() {                    // UI 路径自动点完当前关（逐题逐步点合法卡，走真实判定链）
    let taps = 0, guard = 0;
    while (cur && !cur.done && guard++ < 140) {   // 5 题 × 最多 5 卡 = 25 tap 上界，guard 余量
      const q = cur.quizzes[cur.step];
      if (!q) break;
      const want = q.kind === 'miss' ? q.missingId : legalSteps(q)[0];
      let i = -1;
      for (let k = 0; k < q.pool.length; k++) if (q.pool[k].stepId === want) { i = k; break; }
      if (i < 0) break;
      const r = await uiTapCard(i);
      if (r === null || r === false) break;       // 锁死/重玩保护
      taps++;
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
