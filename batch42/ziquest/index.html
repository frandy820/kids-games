<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子识字闯世界</title>
<style>
/* ================= ziquest 小兔子识字闯世界（batch42，第 152 款，大班·幼小衔接旗舰）
   家族基调：暖米底 #FBF6EC / 纸面 #FFF9EE / 暖棕墨线 #4A3B2E（DESIGN-SPEC §8）。
   本款 = 冒险地图 + 收集养成：七层 SVG 绘本长卷（1000×7400，7 区域自下而上），
   wrapper 单一 transform 平移（禁 layout 属性动画），全动效只用 transform/opacity。
   迷雾=未解锁区域半透明 noise pattern；节点 4 态（锁灰笼/可玩呼吸/当前脉冲/完成旗星）。
   触摸目标：节点 hit ≥96（SVG viewBox 1000 宽映射平板横屏≈120px/竖屏≈96px）、底栏按钮 ≥96。 */

/* ========== 一·基式与家族公共段（FAMILY_CSS 三占位：reset/ghost/verify） ========== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#zq-game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ========== 二·冒险地图（HUD 顶栏 / 七层 SVG 长卷 / 底栏三入口） ========== */
#zq-hud{flex:0 0 54px;display:flex;align-items:center;gap:12px;padding:6px 14px 0;z-index:5}
#zq-logo{width:42px;height:42px;border-radius:13px;background:#E8975A;flex:0 0 42px;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#zq-logo svg{width:36px;height:36px}
.zq-pill{display:flex;align-items:center;gap:6px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  border-radius:18px;box-shadow:0 3px 0 #D8C9B4;padding:5px 14px;font-size:19px;font-weight:800;min-height:36px}
.zq-pill svg{width:24px;height:24px;flex:0 0 24px}
.zq-pill b{min-width:26px;text-align:center}
#zq-today{margin-left:auto;font-size:15px;color:#8A7B6C;background:none;box-shadow:none;border-color:#EFE3CD}

/* 地图视口与 wrapper（唯一 transform 平移通道；拖动时关 transition，松手/跳关恢复） */
#zq-view{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none}
#zq-world{position:absolute;left:0;top:0;width:100%;will-change:transform;
  transition:transform .8s cubic-bezier(.3,.9,.35,1)}
#zq-world.drag{transition:none}
#zq-world svg{width:100%;height:auto}
/* L1 远景视差（极慢平移循环，transform-only） */
#zq-l1{animation:zq-far 90s linear infinite;will-change:transform}
@keyframes zq-far{0%,100%{transform:translateX(0)}50%{transform:translateX(-64px)}}
/* 迷雾覆盖（未解锁区域；解锁时 opacity 1→0 过渡=消散仪式） */
.zq-fog{opacity:1;transition:opacity .8s ease;pointer-events:none}
.zq-fog.gone{opacity:0}

/* 节点 4 态：s-locked 灰笼 / s-open 彩色+idle 浮动 / s-current 脉冲环 / s-done 插旗+星 */
.zq-node .zq-ani{transform-box:fill-box;transform-origin:center}
.zq-node .zq-hit{fill:#000;opacity:0;pointer-events:all}
.zq-node.s-open .zq-ani{animation:zq-float 3.2s ease-in-out infinite}
.zq-node.s-open:nth-of-type(2n) .zq-ani{animation-duration:2.6s;animation-delay:-1.2s}
.zq-node.s-open:nth-of-type(3n) .zq-ani{animation-duration:3.8s;animation-delay:-.6s}
@keyframes zq-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.zq-node.s-locked .zq-ani{opacity:.5}
.zq-node.s-locked .zq-cage{display:block}
.zq-cage{display:none;fill:#8A9BAE;opacity:.32}
.zq-node .zq-ring{opacity:0}
.zq-node.s-current .zq-ring{animation:zq-pulse 2.4s ease-out infinite}
.zq-node.s-current .zq-ring.r2{animation-delay:1.2s}
@keyframes zq-pulse{0%{opacity:.85;transform:scale(.62)}70%{opacity:0;transform:scale(1.28)}100%{opacity:0}}
.zq-node .zq-flag,.zq-node .zq-stars{opacity:0;transition:opacity .3s}
.zq-node.s-done .zq-flag,.zq-node.s-done .zq-stars{opacity:1}
.zq-node.s-done .zq-ani{animation:none}
.zq-node.shake .zq-ani{animation:zq-shake .52s ease}
@keyframes zq-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px)}
  45%{transform:translateX(10px)}70%{transform:translateX(-6px)}88%{transform:translateX(4px)}}
/* L5 兔子：hop 落地 squash&stretch（transform-only，作用于内层 g） */
#zq-rabbit .zq-hop{transform-box:fill-box;transform-origin:50% 100%}
#zq-rabbit.hop .zq-hop{animation:zq-hop .42s ease 2}
@keyframes zq-hop{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-30px) scale(.96,1.05)}
  62%{transform:translateY(0) scale(1.14,.84)}82%{transform:translateY(-8px) scale(.99,1.02)}}
/* L6 粒子池（一次性触发，transform/opacity only） */
.zq-fx{opacity:0}
.zq-fx.go{animation:zq-burst .7s ease-out forwards}
@keyframes zq-burst{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}

/* 底栏三入口（图鉴/家园/伙伴——M1 占位，触摸面 ≥96） */
#zq-dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;gap:10px;padding:4px 16px 12px;z-index:5}
.zq-dock-btn{min-width:96px;min-height:96px;border-radius:26px;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 5px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:17px;font-weight:800;transition:transform .15s;flex:1 1 0;max-width:168px}
.zq-dock-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.zq-dock-btn svg{width:44px;height:44px}

/* ========== 三·关卡占位（M2 题型系统样式区预留：场景框/题面/选项/翻牌/拖拽） ========== */
/* M2 接入：#zq-level 覆盖层（场景主题框+脚印进度+材质选项）在此段落追加，禁散落到其它段 */

/* ========== 四·收集占位（M4 图鉴/伙伴/家园样式区预留） ========== */
/* M4 接入：图鉴翻页 / 伙伴家园 / 装扮试穿弹层在此段落追加 */

/* ========== 五·弹层（建设中占位 overlay / 星结算 / 迷雾仪式 / toast） ========== */
.zq-ov{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:rgba(74,59,46,.42);animation:zq-ov-in .3s ease}
.zq-ov.hide{display:none}
@keyframes zq-ov-in{from{opacity:0}to{opacity:1}}
.zq-ov .box{background:#FFF9EE;border:3px solid #4A3B2E;border-radius:28px;box-shadow:0 6px 0 #D8C9B4;
  padding:26px 34px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:86vw}
.zq-ov .box svg{width:110px;height:110px}
.zq-ov .t1{font-size:25px;font-weight:800}
.zq-ov .t2{font-size:16px;color:#8A7B6C}
#zq-toast{position:fixed;left:50%;bottom:128px;transform:translate(-50%,80px);z-index:70;background:#FFF9EE;
  border:2.5px solid #4A3B2E;border-radius:18px;box-shadow:0 4px 0 #D8C9B4;padding:10px 20px;
  font-size:16px;font-weight:700;transition:transform .3s ease;pointer-events:none}
#zq-toast.show{transform:translate(-50%,0)}

@media (orientation:portrait){
  #zq-hud{flex:0 0 48px}
  .zq-pill{font-size:16px;padding:4px 11px}
  .zq-dock-btn{min-width:88px;min-height:88px;font-size:15px}
}

#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}
</style>
</head>
<body>
<!-- 建设中占位 overlay（M1：点可玩节点出此层并写档测试位；M2 换成真关卡入口） -->
<div id="zq-build" class="zq-ov hide" aria-label="建设中">
  <div class="box">
    <div id="zq-build-bunny"></div>
    <div class="t1" id="zq-build-name">建设中</div>
    <div class="t2">这一关正在装修，小兔子先帮你记下进度啦</div>
  </div>
</div>
<div id="zq-game" aria-label="小兔子识字闯世界">
  <div id="zq-hud">
    <div id="zq-logo" aria-hidden="true"></div>
    <div class="zq-pill" aria-label="金币"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#F2C94C" stroke="#4A3B2E" stroke-width="2"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="#B8860B" stroke-width="1.8"/></svg><b id="zq-coin-n">0</b></div>
    <div class="zq-pill" aria-label="星星"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5-5.9-3.2-5.9 3.2 1.2-6.5L2.5 9.5l6.6-.9z" fill="#F5C445" stroke="#4A3B2E" stroke-width="1.8" stroke-linejoin="round"/></svg><b id="zq-star-n">0</b></div>
    <div class="zq-pill" id="zq-today" aria-label="冒险天数">第 1 天</div>
  </div>
  <div id="zq-view"><div id="zq-world"></div></div>
  <div id="zq-dock">
    <button class="zq-dock-btn" id="zq-dex" aria-label="汉字图鉴"><svg viewBox="0 0 48 48"><rect x="8" y="6" width="32" height="36" rx="4" fill="#F2B8C6" stroke="#4A3B2E" stroke-width="2.6"/><path d="M15 15h18M15 22h18M15 29h12" stroke="#4A3B2E" stroke-width="2.6" stroke-linecap="round"/></svg><span>图鉴</span></button>
    <button class="zq-dock-btn" id="zq-home" aria-label="兔子家园"><svg viewBox="0 0 48 48"><path d="M8 26L24 11l16 15v14a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2z" fill="#8FBF7F" stroke="#4A3B2E" stroke-width="2.6" stroke-linejoin="round"/><rect x="19" y="29" width="10" height="12" rx="2" fill="#FBF6EC" stroke="#4A3B2E" stroke-width="2.4"/></svg><span>家园</span></button>
    <button class="zq-dock-btn" id="zq-comp" aria-label="伙伴"><svg viewBox="0 0 48 48"><circle cx="24" cy="27" r="14" fill="#7FB3E0" stroke="#4A3B2E" stroke-width="2.6"/><ellipse cx="15" cy="13" rx="4.5" ry="8" fill="#7FB3E0" stroke="#4A3B2E" stroke-width="2.4" transform="rotate(-12 15 13)"/><ellipse cx="33" cy="13" rx="4.5" ry="8" fill="#7FB3E0" stroke="#4A3B2E" stroke-width="2.4" transform="rotate(12 33 13)"/><circle cx="19" cy="26" r="2.2" fill="#4A3B2E"/><circle cx="29" cy="26" r="2.2" fill="#4A3B2E"/><path d="M21 32q3 3 6 0" stroke="#4A3B2E" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg><span>伙伴</span></button>
  </div>
</div>
<div id="zq-toast" aria-label="提示"></div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

<script>
/* ================= ziquest 小兔子识字闯世界 游戏数据（batch42，第 152 款）
   本文件由 _src/_gen_data.py 从 _src/data/*.json 转写生成（零手抄，禁手改）——
   build.py 每次构建先重跑生成再做 node 提取双向深比较对账（坑13 铁律）。
   ZQ_MAP 地图130节点（meta.rules=解锁规则真值）/ ZQ_CATALOG 伙伴·BOSS·装扮+经济 /
   ZQ_CHARS 区域字表 r1..r7（0c 教研字段原样透传，M1 只依赖 ch/src/order）/

/* ================= ziquest 纯引擎段（M1）：配额 / 节点解锁 / SRS / 经济 / 定级停止
   纪律：本段零 DOM、零 KIDS 依赖、零时钟读取（today 一律由调用方传入——确定性可测）。
   数据引用：ZQ_MAP/ZQ_CATALOG/ZQ_CHARS/ZQ_T（game-data.js 生成物，同 script 块前部）。
   M2 接入点：genLevel 关卡生成器/题型谱在此段扩展（SPEC §6.2 game-core 职责）。 */
'use strict';

/* ---------- 日限速（SPEC §1.4：只锁新字关；首日1/2-7日2/8日起3 封顶 + 家长 bonus） ---------- */
const ZQ_DAY_NEW = [1, 2, 2, 2, 2, 2, 2, 3];
function zqQuota(day, bonus) {           /* day=1-based；day≥8 恒取表尾 3 */
  day = Math.max(1, day | 0);
  return ZQ_DAY_NEW[Math.min(day, ZQ_DAY_NEW.length) - 1] + Math.max(0, bonus | 0);
}
function zqDayIndex(save, today) {       /* firstDay→today 的 1-based 天序（core 同式本地日） */
  const fd = save && save.firstDay;
  if (!fd) return 1;
  return Math.floor((new Date(today + 'T12:00:00') - new Date(fd + 'T12:00:00')) / 86400000) + 1;
}
function zqBonus(save, today) { return (save && save.bonus && save.bonus[today]) || 0; }
function zqNewSpent(save, today) {       /* 今日已完成新字关数（去重；M1 写档方维护 dayLog.newDone） */
  const dl = save && save.zq && save.zq.dayLog && save.zq.dayLog[today];
  return dl && dl.newDone ? dl.newDone.length : 0;
}
function zqDayDone(save, today) {        /* 今日新字关配额完（core calendar.dayDone 的本款自算版） */
  return zqNewSpent(save, today) >= zqQuota(zqDayIndex(save, today), zqBonus(save, today));
}

/* ---------- 地图索引（从 ZQ_MAP 派生：全局序=区域序展开，链前驱=数组前邻） ---------- */
const ZQ_REGIONS = ZQ_MAP.regions;
const ZQ_NODES = [];                      /* {key,region,type,label,x,y,next,prev} 全局序 */
const ZQ_NODE = {};                       /* key → node */
(function buildIndex() {
  ZQ_REGIONS.forEach(function (rg) {
    rg.nodes.forEach(function (nd, i) {
      const n = { key: nd.key, region: rg.id, type: nd.type, label: nd.label, x: nd.x, y: nd.y,
                  next: nd.next.slice(), prev: i ? rg.nodes[i - 1].key : null };
      ZQ_NODES.push(n); ZQ_NODE[nd.key] = n;
    });
  });
})();

/* ---------- 节点解锁纯函数（map.json meta.rules 真值：
   前节点完成→next 亮；本区全部 new 完成→boss 可进；击破前区 boss→区域迷雾消散） ---------- */
function zqNodeDone(save, key) {
  const m = save && save.zq && save.zq.map;
  return !!(m && m[key]);
}
function zqRegionOpen(save, r) {
  if (!(r > 0)) return true;
  const unlock = ZQ_REGIONS[r].unlock;
  if (unlock === 'first') return true;
  if (unlock.slice(-5) === '_boss') return zqNodeDone(save, ZQ_REGIONS[r - 1].boss);
  return zqNodeDone(save, unlock);
}
function zqRegionNewAllDone(save, r) {
  return ZQ_NODES.every(function (n) {
    return n.region !== r || n.type !== 'new' || zqNodeDone(save, n.key);
  });
}
/* 四态之一（不含 current——current=UI 层"兔子站位"语义，另由 curNodeKey 派生）：
   'done' 完成 / 'open' 可玩 / 'locked' 锁（前驱/区域/BOSS 门/新字日配额 四种锁因） */
function nodeState(save, key, today) {
  if (zqNodeDone(save, key)) return 'done';
  const n = ZQ_NODE[key];
  if (!n) return 'locked';
  if (!zqRegionOpen(save, n.region)) return 'locked';
  if (n.type === 'boss') {
    if (!zqRegionNewAllDone(save, n.region)) return 'locked';
  } else if (n.prev && !zqNodeDone(save, n.prev)) {
    return 'locked';
  }
  if (n.type === 'new' && today && zqDayDone(save, today)) return 'locked';
  return 'open';
}
/* 当前节点（兔子站位）：全局序第一个未完成且可达的节点；全图完成=终点 */
function curNodeKey(save, today) {
  for (let i = 0; i < ZQ_NODES.length; i++) {
    const n = ZQ_NODES[i];
    if (!zqNodeDone(save, n.key) && nodeState(save, n.key, today) === 'open') return n.key;
  }
  return ZQ_NODES[ZQ_NODES.length - 1].key;
}

/* ---------- SRS 调度纯函数骨架（SPEC §2.5：六态阶梯，对→进阶，错→减半+入薄弱） ---------- */
const SRS_IV = [1, 3, 7, 14, 30];        /* 见习+1 → 学徒+3 → 学者+7 → 精通+14 → 大师+30（日） */
function zqAddDays(today, d) {
  const t = new Date(today + 'T12:00:00');
  t.setDate(t.getDate() + d);
  return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
}
/* state: {st:0未学/1已学/2精通, lv:0..4 档, due:'YYYY-MM-DD', miss, ok}；ok=本次回忆成败 */
function srsNext(state, ok, today) {
  const s = state || { st: 0, lv: 0, due: null, miss: 0, ok: 0 };
  if (!ok) {                             /* 错：降一档且间隔减半（下界1日）、miss+1 → main 侧入 weak 池 */
    const lv = Math.max(0, s.lv - 1);
    return { st: Math.max(1, s.st), lv: lv, due: zqAddDays(today, Math.max(1, Math.floor(SRS_IV[lv] / 2))),
             miss: s.miss + 1, ok: s.ok };
  }
  const lv = Math.min(s.lv + 1, SRS_IV.length - 1);
  return { st: lv >= 3 ? 2 : Math.max(1, s.st), lv: lv, due: zqAddDays(today, SRS_IV[lv]),
           miss: s.miss, ok: s.ok + 1 };
}
/* due 池（确定性定序：dueDate 升序 → miss 降序 → 字全局序 region*1000+order） */
const ZQ_CH_NO = {};                      /* ch → 全局序（ZQ_CHARS 派生，M2 换 chNo 课标序仍走此表） */
(function buildChNo() {
  Object.keys(ZQ_CHARS).sort(function (a, b) { return a - b; }).forEach(function (r) {
    ZQ_CHARS[r].chars.forEach(function (c) {
      if (!(c.ch in ZQ_CH_NO)) ZQ_CH_NO[c.ch] = (+r) * 1000 + (c.order || 0);
    });
  });
})();
function srsDue(dex, today) {
  const out = [];
  Object.keys(dex).forEach(function (ch) {
    const s = dex[ch];
    if (s.st > 0 && s.due && s.due <= today) out.push(ch);
  });
  out.sort(function (a, b) {
    const A = dex[a], B = dex[b];
    return A.due < B.due ? -1 : A.due > B.due ? 1
      : B.miss - A.miss || (ZQ_CH_NO[a] || 0) - (ZQ_CH_NO[b] || 0) || (a < b ? -1 : 1);
  });
  return out;
}

  if (type === 'new') return first ? ZQ_ECON.newFirst : ZQ_ECON.newReplay;

/* ---------- 定级三带停止规则（SPEC §2.4：40/30/30 三带，晋级线 8/6，<4 即停，连错3 快停） ---------- */
const ZQ_CAL_BANDS = [40, 30, 30];
const ZQ_CAL_PASS = { 1: 8, 2: 6 };       /* 带1→带2 需对≥8；带2→带3 需对≥6；带3=末带 */
function zqHasStreak3(a) {
  let n = 0;
  for (let i = 0; i < a.length; i++) { n = a[i] ? 0 : n + 1; if (n >= 3) return true; }

}
/* bandResults: [{band:1, answers:[true,false,…]}, …] 按带序已答记录（每带 ≤10 题）
   → {stop, band, next}：stop=定级应结束；next=0 结束 / k 下一带号（band=刚完成的带） */
function calStop(bandResults) {
  for (let i = 0; i < bandResults.length; i++) {
    const b = bandResults[i], right = b.answers.filter(Boolean).length;
    if (right < 4 || zqHasStreak3(b.answers)) return { stop: true, band: b.band, next: 0 };
    if (ZQ_CAL_PASS[b.band] === undefined) return { stop: true, band: b.band, next: 0 }; /* 带3 答完=结束 */
    if (right < ZQ_CAL_PASS[b.band]) return { stop: true, band: b.band, next: 0 };      /* 未达晋级线=温和停 */
    if (i === bandResults.length - 1) return { stop: false, band: b.band, next: b.band + 1 };
  }
  return { stop: false, band: 0, next: 1 }; /* 空记录=尚未作答：从带 1 起步（stop=false） */
}
/* ================= ziquest 主逻辑（M1 地图骨架）：core 接线 / 存档 / 七层 SVG / 状态机
   结构：zqEnsure(save) 建 zq 命名空间（旧档无 zq=首进序章，§6.4 schema）→ buildMap() 七层渲染
   （L0 天空色带/L1 远景视差/L2 地块+迷雾/L3 路径 dash/L4 节点4态/L5 兔子hop+装扮槽/L6 粒子池）
   → refreshMap() 全量状态刷 → wrapper 单 transform 平移 + 当前节点居中（800ms）。
   语音段一：zq_ 0 键=静音可玩（core v1.0 缺 clip 静默兜底，play 一律单 key 调用禁 TTS 回退文本）。
   验收钩子：window.ZQ = { save, mapState, tapNode, curNode, … }（getter 拷贝非活引用——家族纪律）。 */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const SVG_NS = 'http://www.w3.org/2000/svg';
const wait = ms => new Promise(r => setTimeout(r, ms));
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
function zqToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(SVG_NS, tag);
  if (attrs) Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
  if (parent) parent.appendChild(e);
  return e;
}

/* ================= 存档：save.zq 命名空间（core v1.0 骨架之上，§6.4） ================= */
function zqEnsure(save) {
  if (!save.zq) save.zq = {};
  const z = save.zq;
  if (!z.cal) z.cal = { done: [], band: 0, skipSeen: false };
  if (!z.map) z.map = {};
  if (!z.dex) z.dex = {};
  if (!z.weak) z.weak = [];
  if (!z.comp) z.comp = {};
  if (!z.dress) z.dress = { owned: [], worn: {}, home: {} };
  if (typeof z.coins !== 'number') z.coins = 0;
  if (!z.storySeen) z.storySeen = [];
  if (!z.dayLog) z.dayLog = {};
  if (!z.dayLog[zqToday()]) z.dayLog[zqToday()] = { newChars: [], nodes: [], newDone: [], quests: [] };
  return z;
}
let SAVE = null;                                  /* KIDS._save() 引用（VERIFY 页=null 用空档渲染） */
function zSave() {                                /* 空档视图：纯函数渲染共用（禁写） */
  return SAVE || { v: '1.0', game: 'ziquest', firstDay: zqToday(), levels: {}, zq: zqEnsure({}) };
}

/* ================= 七层 SVG 地图渲染（viewBox 1000×7400 纵向长卷，7 区域自下而上） ================= */
const REGION_META = [];                           /* {id,name,accent,y0,y1,fogRect,boss} 段落框 */

let worldEl, svgRoot, rabbitG, fxPool = [];
const zqAccent = r => (ZQ_CHARS[String(r)] && ZQ_CHARS[String(r)].meta.accent) || '#E8975A';

/* 七种节点图标简笔（60×60 视区，粗墨线圆角家族语言；done 态另叠旗+星） */
function nodeIcon(type, ac) {

    '<circle cx="24" cy="31" r="2.2" fill="#4A3B2E"/><circle cx="36" cy="31" r="2.2" fill="#4A3B2E"/>';

function buildMap() {
  worldEl = $id('zq-world');
  const CW = ZQ_MAP.meta.canvas.w, CH = ZQ_MAP.meta.canvas.h;
  svgRoot = svgEl('svg', { viewBox: '0 0 ' + CW + ' ' + CH, 'aria-label': '冒险地图' });
  const defs = svgEl('defs', null, svgRoot);
  /* 迷雾 noise pattern（半透明白噪点——L2 未解锁区域覆盖物） */
  const pat = svgEl('pattern', { id: 'zq-fog-pat', width: '96', height: '96', patternUnits: 'userSpaceOnUse' }, defs);
  svgEl('rect', { width: '96', height: '96', fill: '#E6E1D2', opacity: '.62' }, pat);
  svgEl('circle', { cx: '22', cy: '26', r: '27', fill: '#F0ECDF', opacity: '.75' }, pat);
  svgEl('circle', { cx: '70', cy: '62', r: '31', fill: '#EBE6D6', opacity: '.65' }, pat);
  svgEl('circle', { cx: '48', cy: '8', r: '21', fill: '#F4F0E4', opacity: '.6' }, pat);

  /* 区域段落框（y0..y1 自节点包围盒外扩；地块/迷雾/天空共用） */
  ZQ_REGIONS.forEach((rg, i) => {
    const ys = rg.nodes.map(n => n.y);
    const y1 = i === 0 ? CH - 30 : Math.max.apply(null, ys) + 130;
    const y0 = i === ZQ_REGIONS.length - 1 ? 30 : Math.min.apply(null, ys) - 130;
    REGION_META.push({ id: rg.id, name: rg.name, accent: zqAccent(rg.id), y0: y0, y1: y1, boss: rg.boss, unlock: rg.unlock });
  });

  const L0 = svgEl('g', { id: 'zq-l0' }, svgRoot);   /* 天空色带：每区域 3 条柔和平涂 */
  REGION_META.forEach(rm => {
    const h = (rm.y1 - rm.y0) / 3;
    for (let k = 0; k < 3; k++) {
      svgEl('rect', { x: 0, y: Math.round(rm.y0 + h * k), width: CW, height: Math.ceil(h) + 1,
        fill: rm.accent, opacity: (.1 - k * .03).toFixed(3) }, L0);
    }
  });
  const L1 = svgEl('g', { id: 'zq-l1' }, svgRoot);   /* 远景：太阳+远山+云剪影（CSS 视差 90s） */
  svgEl('circle', { cx: 830, cy: 430, r: 64, fill: '#F5C445', opacity: '.55' }, L1);
  svgEl('circle', { cx: 830, cy: 430, r: 46, fill: '#F7D06B', opacity: '.8' }, L1);
  for (let i = 0; i < 7; i++) {
    const cx = 90 + i * 150, cy = 260 + (i % 3) * 90;
    svgEl('circle', { cx: cx, cy: cy, r: 34, fill: '#FFF9EE', opacity: '.5' }, L1);
    svgEl('circle', { cx: cx + 34, cy: cy + 8, r: 26, fill: '#FFF9EE', opacity: '.5' }, L1);
    svgEl('circle', { cx: cx - 32, cy: cy + 10, r: 22, fill: '#FFF9EE', opacity: '.45' }, L1);
  }
  REGION_META.forEach((rm, i) => {
    svgEl('path', { d: 'M0 ' + rm.y0 + ' q125 -86 250 0 t250 0 t250 0 t250 0 V' + (rm.y0 + 10) + 'z',
      fill: i % 2 ? '#D9CBAF' : '#E3D7BE', opacity: '.5' }, L1);
  });
  const L2 = svgEl('g', { id: 'zq-l2' }, svgRoot);   /* 地块（区域强调色低饱和大色块）+ 迷雾 */
  REGION_META.forEach(rm => {
    svgEl('rect', { x: 0, y: Math.round(rm.y0), width: CW, height: rm.y1 - rm.y0,
      fill: rm.accent, opacity: '.16' }, L2);
    rm.fogRect = svgEl('rect', { x: 0, y: Math.round(rm.y0), width: CW, height: rm.y1 - rm.y0,
      fill: 'url(#zq-fog-pat)', class: 'zq-fog' }, L2);
  });
  const L3 = svgEl('g', { id: 'zq-l3' }, svgRoot);   /* 路径：节点邻接虚线小径（已走段实线） */
  ZQ_NODES.forEach(n => n.next.forEach(nk => {
    const t = ZQ_NODE[nk];
    svgEl('path', { d: 'M' + n.x + ' ' + n.y + 'L' + t.x + ' ' + t.y, 'data-edge': n.key + '>' + nk,
      fill: 'none', stroke: '#B9A98C', 'stroke-width': '6', 'stroke-linecap': 'round',
      'stroke-dasharray': '2 16' }, L3);
  }));
  const L4 = svgEl('g', { id: 'zq-l4' }, svgRoot);   /* 130 节点 × 4 态（class 刷，元素一次建齐） */
  ZQ_NODES.forEach(n => {
    const g = svgEl('g', { id: n.key, class: 'zq-node', transform: 'translate(' + n.x + ',' + n.y + ')' }, L4);
    const ring1 = svgEl('circle', { r: '52', fill: 'none', stroke: zqAccent(n.region), 'stroke-width': '5', class: 'zq-ring' }, g);
    svgEl('circle', { r: '52', fill: 'none', stroke: zqAccent(n.region), 'stroke-width': '3.5', class: 'zq-ring r2' }, g);
    const ani = svgEl('g', { class: 'zq-ani' }, g);
    const ico = svgEl('g', null, ani);
    ico.innerHTML = '<g transform="translate(-30,-30)">' + nodeIcon(n.type, zqAccent(n.region)) + '</g>';
    svgEl('circle', { r: '54', class: 'zq-cage' }, g);                  /* 锁灰笼 */
    const flag = svgEl('g', { class: 'zq-flag' }, g);                   /* done 旗+星 */
    flag.innerHTML = '<path d="M18 -46v-22h20l-5 6l5 6h-14v10z" fill="#E8975A" stroke="#4A3B2E" stroke-width="2.6" stroke-linejoin="round"/>';
    const stars = svgEl('g', { class: 'zq-stars' }, g);
    stars.innerHTML = '<g id="stars-' + n.key + '" transform="translate(0,44)"></g>';
    svgEl('circle', { r: '60', class: 'zq-hit' }, g);                   /* 触摸热区（viewBox 60r→平板竖屏≈96px） */
    g.addEventListener('click', () => tapNode(n.key));
    NODE_ELS[n.key] = g;
  });
  rabbitG = svgEl('g', { id: 'zq-rabbit' }, svgRoot); /* L5 兔子 + 装扮槽占位（M4 叠加渲染锚） */
  const hop = svgEl('g', { class: 'zq-hop' }, rabbitG);
  hop.innerHTML = KIDS.assets.rabbit('happy', 72).replace('<svg ', '<svg x="-36" y="-76" ');
  svgEl('g', { id: 'zq-dress-slot' }, rabbitG);       /* 装扮槽（帽/裙/鞋/围巾 SVG 锚点，M4） */
  const L6 = svgEl('g', { id: 'zq-l6' }, svgRoot);    /* L6 粒子池 ≤12（一次性触发复用） */
  for (let i = 0; i < 12; i++) {
    const h = svgEl('g', { class: 'zq-fx-h' }, L6);   /* 外层 g 定位（attr），内层 path 动画（CSS） */
    const p = svgEl('path', { d: 'M0 -7l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5-3.7-3.4 5-.6z',
      fill: i % 2 ? '#F5C445' : '#F2C94C', stroke: '#4A3B2E', 'stroke-width': '1.6', class: 'zq-fx' }, h);
    fxPool.push({ h: h, p: p });
  }
  worldEl.appendChild(svgRoot);
}

/* ================= 状态刷（节点 4 态 class / 迷雾 / 星数 / 兔子站位 / HUD） ================= */
const starPath = (x, on) => '<path d="M' + x + ' 40l2.6 5.4 6 .9-4.3 4.2 1 6-5.3-2.8-5.3 2.8 1-6-4.3-4.2 6-.9z" fill="' +
  (on ? '#F5C445' : '#E5D5BC') + '" stroke="#4A3B2E" stroke-width="1.6"/>';
function refreshMap(anim) {
  const today = zqToday(), sv = zSave(), cur = curNodeKey(sv, today);
  const openedFog = [];
  ZQ_NODES.forEach(n => {
    const st = nodeState(sv, n.key, today);
    const el = NODE_ELS[n.key];
    el.classList.remove('s-locked', 's-open', 's-current', 's-done');
    el.classList.add(st === 'done' ? 's-done' : (n.key === cur ? 's-current' : 's-' + st));
    el.style.visibility = zqRegionOpen(sv, n.region) ? '' : 'hidden';   /* 屏外裁剪：雾区节点整组隐藏 */
    const rec = sv.zq.map[n.key];
    $id('stars-' + n.key).innerHTML = (n.type === 'new' || n.type === 'boss')
      ? starPath(-16, rec && rec.stars >= 1) + starPath(0, rec && rec.stars >= 2) + starPath(16, rec && rec.stars >= 3) : '';
  });
  REGION_META.forEach(rm => {
    const open = zqRegionOpen(sv, rm.id);
    if (!open && rm.fogRect.classList.contains('gone')) rm.fogRect.classList.remove('gone');
    if (open && !rm.fogRect.classList.contains('gone')) { rm.fogRect.classList.add('gone'); openedFog.push(rm.id); }
  });
  const cn = ZQ_NODE[cur];
  rabbitG.setAttribute('transform', 'translate(' + cn.x + ',' + (cn.y + 6) + ')');
  if (anim) { rabbitG.classList.remove('hop'); void rabbitG.getBoundingClientRect(); rabbitG.classList.add('hop'); }
  refreshHud();
  return { cur: cur, fogOpened: openedFog };
}
function refreshHud() {
  const sv = zSave();
  let stars = 0;
  Object.keys(sv.zq.map).forEach(k => { stars += Math.min(3, sv.zq.map[k].stars || 0); });
  $id('zq-coin-n').textContent = sv.zq.coins;
  $id('zq-star-n').textContent = stars;
  $id('zq-today').textContent = '第 ' + zqDayIndex(sv, zqToday()) + ' 天';
}

/* ================= 视口平移：wrapper 单 transform + 当前节点居中 + 触摸拖动 ================= */
let VW = 0, VH = 0;
function worldSize() {
  const v = $id('zq-view');
  VW = v.clientWidth; VH = v.clientHeight;
}
function centerOn(key, animate) {
  const n = ZQ_NODE[key], scale = VW / ZQ_MAP.meta.canvas.w, H = VW * ZQ_MAP.meta.canvas.h / ZQ_MAP.meta.canvas.w;
  let tx = VW / 2 - n.x * scale, ty = VH * 0.46 - n.y * scale;
  tx = Math.min(0, Math.max(VW - VW, tx));           /* 横向：1000 宽=满幅，tx 恒 0（纵向长卷） */
  ty = Math.min(0, Math.max(VH - H, ty));
  if (!animate) worldEl.classList.add('drag');
  worldEl.style.transform = 'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0)';
  if (!animate) { void worldEl.offsetWidth; worldEl.classList.remove('drag'); }
}
function bindPan() {
  const view = $id('zq-view');
  let sx = 0, sy = 0, tx0 = 0, ty0 = 0, moved = false, tyCur = 0;
  const readT = () => {
    const m = /translate3d\((-?[\d.]+)px,\s*(-?[\d.]+)px/.exec(worldEl.style.transform || '');
    return m ? { x: +m[1], y: +m[2] } : { x: 0, y: 0 };
  };
  view.addEventListener('pointerdown', e => {
    const t = readT(); tx0 = t.x; ty0 = t.y; tyCur = t.y; sx = e.clientX; sy = e.clientY; moved = false;
    worldEl.classList.add('drag');
  });
  view.addEventListener('pointermove', e => {
    if (worldEl.classList.contains('drag') && e.buttons) {
      const scale = VW / ZQ_MAP.meta.canvas.w, H = VW * ZQ_MAP.meta.canvas.h / ZQ_MAP.meta.canvas.w;
      let ty = Math.min(0, Math.max(VH - H, ty0 + (e.clientY - sy)));
      worldEl.style.transform = 'translate3d(0px,' + ty.toFixed(1) + 'px,0)';
      if (Math.abs(e.clientY - sy) > 10) moved = true;
      tyCur = ty;
    }
  });
  const end = () => { worldEl.classList.remove('drag'); setTimeout(() => { moved = false; }, 30); };
  view.addEventListener('pointerup', end);
  view.addEventListener('pointercancel', end);
  return { wasDrag: () => moved };
}

/* ================= 节点状态机：tapNode（锁=摇一摇 / 开=占位进关+写档 / done=回看提示） =================
   ★ M2 关卡系统接入点（本节整体替换为真关卡启动，签名契约如下）：
     ZQ.openNode(key) → Promise<{stars, newChars}>
       1. const lvl = genLevel(key, SAVE, today)     // M2 game-core：题型谱+确定性消耗序
       2. 关卡循环渲染/判定/结算（qtypes 注册表渲染器）
       3. 调 finishNode(key, stars) 收口（本函数 M1 已定稿，M2 原样复用）
     finishNode(key: nodeKey, stars: 1|2|3) → {rec, fogOpened}   // 写 map/dayLog/币/解锁刷新/迷雾消散/兔子 hop
   M1 行为：点 open 节点 = 建设中占位 overlay + 以测试位 stars=2 走 finishNode（驱动解锁链可测）。 */
let buildTimer = null;
function finishNode(key, stars) {
  if (!SAVE) return { rec: null, fogOpened: [] };  /* 无真档（VERIFY 空档视图）禁写 */
  const today = zqToday(), z = SAVE.zq, n = ZQ_NODE[key];
  const prev = z.map[key], first = !prev;
  z.map[key] = { stars: Math.max(prev ? prev.stars : 0, stars), plays: (prev ? prev.plays : 0) + 1 };
  if (!z.dayLog[today]) z.dayLog[today] = { newChars: [], nodes: [], newDone: [], quests: [] };
  if (z.dayLog[today].nodes.indexOf(key) < 0) z.dayLog[today].nodes.push(key);
  if (n.type === 'new' && z.dayLog[today].newDone.indexOf(key) < 0) z.dayLog[today].newDone.push(key);
  z.coins += zqNodeReward(n.type, first);
  if (!VERIFY && SAVE === KIDS._save()) KIDS.store.persist();   /* VERIFY 页禁写档（防覆盖真档） */
  const r = refreshMap(true);
  setTimeout(() => centerOn(r.cur, true), ZQ_T.CENTER_MS * 0.4);
  return { rec: z.map[key], fogOpened: r.fogOpened };
}
function nodeLabel(n) {
  if (n.type === 'friend') {                       /* friend.label=伙伴 id → 目录名（lark→小云雀叮叮） */
    const c = ZQ_CATALOG.companions.filter(x => x.id === n.label)[0];
    return c ? '新伙伴·' + c.name : '伙伴事件';
  }
  if (n.type === 'calib') return '和兔子玩认字游戏';
  if (n.type === 'new') return n.label;
  return (ZQ_MAP.meta.nodeTypes[n.type] || '冒险点') + '·' + n.label;
}
function showBuild(node) {
  const ov = $id('zq-build');
  $id('zq-build-bunny').innerHTML = KIDS.assets.rabbit('happy', 110);
  $id('zq-build-name').textContent = nodeLabel(node);
  ov.classList.remove('hide');

'use strict';

const ZQ_VERIFY = /[?&]verify=1/.test(location.search);
const ZQ_SPEED = ZQ_VERIFY ? 0.12 : 1;             /* verify 页演出提速（zilearn 家族口径） */

/* ---------- A. 确定性工具（zilearn mulberry32 家族式；zq 前缀防跨款冲突） ---------- */
function zqMulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function zqHash(s) {                               /* 字符串 → 32 位种子（FNV 变体） */
  let h = 1779033703;

  return h >>> 0;
}
function zqShuffled(arr, rnd) {

    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---------- B. 数据索引（纯派生，顶层一次建齐；只依赖 data/engine 块） ---------- */
const ZQ_CH_ENT = {};                              /* ch → 教研条目（首见=低区优先） */
const ZQ_NEWIDX = {};                              /* new 节点 key → {region, idx, total} */
(function zqBuildIdx() {
  ZQ_REGIONS.forEach(function (rg) {
    let idx = 0;
    rg.nodes.forEach(function (nd) {
      if (nd.type === 'new') { ZQ_NEWIDX[nd.key] = { region: rg.id, idx: idx, total: 0 }; idx++; }
    });
    rg.nodes.forEach(function (nd) {                /* 全区 new 节点回填 total（首版只填 first=除零 NaN bug） */
      if (nd.type === 'new') ZQ_NEWIDX[nd.key].total = idx;
    });
  });
  Object.keys(ZQ_CHARS).sort(function (a, b) { return a - b; }).forEach(function (r) {
    ZQ_CHARS[r].chars.forEach(function (c) { if (!(c.ch in ZQ_CH_ENT)) ZQ_CH_ENT[c.ch] = c; });
  });
})();
function zqRegionChars(r) { return ZQ_CHARS[String(r)].chars; }
/* 节点目标字：区域池序剔除定级已知字（cal.done）后按节点序 floor 均分（4-5 字/关；
   纯存档态函数——同存档态永远同字组，跨日重算不变=早安营地依据稳定） */
function zqNodeChars(key, save) {
  const m = ZQ_NEWIDX[key];
  if (!m) return [];
  const cal = save && save.zq && save.zq.cal && save.zq.cal.done || [];
  const ks = {}; cal.forEach(function (c) { ks[c] = 1; });
  const pool = zqRegionChars(m.region).filter(function (c) { return !ks[c.ch]; });
  const a = Math.floor(m.idx * pool.length / m.total), b = Math.floor((m.idx + 1) * pool.length / m.total);
  return pool.slice(a, Math.max(a + 1, b)).map(function (c) { return c.ch; });
}

/* ---------- C. 题目构造（q 对象=接口契约；选项乱序种子驱动） ---------- */
function zqPadChars(ch, region, need, out, seen) { /* 干扰不足 → 区域池序确定性补位 */
  const cand = zqRegionChars(region);
  for (let i = 0; i < cand.length && out.length < need; i++) {
    const c = cand[i].ch;
    if (c !== ch && !seen[c] && ZQ_CH_ENT[c]) { seen[c] = 1; out.push(c); }
  }
  return out;
}
function zqCharOpts(ch, region, rnd) {             /* 字选项：目标+distract 3（不足区域字补） */
  const seen = {}, dis = [];
  seen[ch] = 1;
  (ZQ_CH_ENT[ch].distract || []).forEach(function (d) {
    if (!seen[d[0]] && dis.length < 3) { seen[d[0]] = 1; dis.push(d[0]); }
  });
  zqPadChars(ch, region, 3, dis, seen);
  const opts = zqShuffled([ch].concat(dis.slice(0, 3)), rnd);
  return { opts: opts, ans: opts.indexOf(ch) };
}
function zqWordOpts(ch, region, rnd) {             /* 词选项：words[0] 正确+3 干扰词（禁含目标字，互异） */
  const correct = ZQ_CH_ENT[ch].words[0][0];
  const seen = {}, dis = [];
  seen[correct] = 1;
  const cand = zqShuffled(zqRegionChars(region), rnd);
  for (let i = 0; i < cand.length && dis.length < 3; i++) {
    const c = cand[i].ch;
    if (c === ch || !ZQ_CH_ENT[c] || !ZQ_CH_ENT[c].words) continue;
    const w = ZQ_CH_ENT[c].words[0][0];
    if (w === correct || w.indexOf(ch) >= 0 || seen[w]) continue;
    seen[w] = 1; dis.push(w);
  }
  const opts = zqShuffled([correct].concat(dis), rnd);
  return { opts: opts, ans: opts.indexOf(correct) };
}
function zqMkQ(type, ch, region, rnd, save) {
  const ent = ZQ_CH_ENT[ch];
  const q = { type: type, ch: ch, py: ent.py, pyKey: ent.pyKey, words: ent.words,
              glyph: ent.glyph, distract: ent.distract, options: [], answer: 0,
              seedIdx: 0, region: region, challenge: 0, judge: type !== 't2' };
  if (type === 't1' || type === 't6') {
    const o = zqCharOpts(ch, region, rnd);
    q.options = o.opts; q.answer = o.ans;
  } else if (type === 't4') {
    const o = zqWordOpts(ch, region, rnd);
    q.options = o.opts; q.answer = o.ans;
  } else if (type === 't3') {                      /* 词挖空：display=首词挖本字；选项=字 */
    const o = zqCharOpts(ch, region, rnd);

}
/* 关内题序（seedIdx=M2b 选项乱序种子：每关从 1 起，关内确定——全局计数会破坏两跑全等） */
function zqPushQ(qs, q) { q.seedIdx = qs.length + 1; qs.push(q); return q; }

/* ---------- D. 关卡生成（new / boss；camp/morning 由 camp.js 同引擎产题） ---------- */
const ZQ_NEW_L2 = { t1: 1, t4: 2, t6: 3, t3: 2 };  /* 认知通道难度档（编排律 6 断言依据） */
function zqHasSent(ch) {                           /* R2+ 末字句题 debut：ZQ_SENTENCES 有句才出 t5 */
  var S = (typeof ZQ_SENTENCES !== 'undefined') && ZQ_SENTENCES;
  if (!S) return false;
  for (var i = 0; i < S.length; i++) {
    if (S[i] && String(S[i].text != null ? S[i].text : S[i]).indexOf(ch) >= 0) return true;
  }

}
function zqGenNew(key, save, today, rnd) {
  const n = ZQ_NODE[key], m = ZQ_NEWIDX[key];

  if (!chars.length) return null;                  /* 池尽（已知字全剔除的极端兜底=不生成 */
  const qs = [];
  chars.forEach(function (ch) {                    /* 开场 T2 逐字亮相（judge:false 演出位） */
    const q = zqMkQ('t2', ch, n.region, rnd, save); q.judge = false; zqPushQ(qs, q);
  });
  chars.forEach(function (ch, i) {                 /* 5 字×2 判定位交错：认识 T1 → 辨认 T4/T6；R2+ 末字有句=T5（运用层关后半，律5 ≤2） */
    zqPushQ(qs, zqMkQ('t1', ch, n.region, rnd, save));
    var L2 = i % 2 ? 't6' : 't4';
    if (n.region >= 2 && i === chars.length - 1 && zqHasSent(ch)) L2 = 't5';
    zqPushQ(qs, zqMkQ(L2, ch, n.region, rnd, save));
  });

           miss: 0, retry: [], perf: {}, done: false, hp: 0, hpMax: 0, bossMiss: 0,
           restTaken: 0, save: save, today: today, rnd: rnd, newIdx: m };
}
function zqGenBoss(key, save, today, rnd) {
  const n = ZQ_NODE[key];
  const b = ZQ_CATALOG.bosses[n.region - 1];
  const hpMax = Math.max(8, Math.min(12, b.hp));
  const pool = zqShuffled(zqRegionChars(n.region).map(function (c) { return c.ch; }), rnd);
  const types = ['t1', 't4', 't3', 't6'];          /* 轮转=相邻不同型（R2 boss 词挖空在场） */
  const qs = [];
  for (let i = 0; i < hpMax; i++) zqPushQ(qs, zqMkQ(types[i % 4], pool[i % pool.length], n.region, rnd, save));
  return { key: key, node: n, kind: 'boss', region: n.region, chars: [], qs: qs, qi: 0,
           miss: 0, retry: [], perf: {}, done: false, hp: hpMax, hpMax: hpMax, bossMiss: 0,
           restTaken: 0, boss: b, save: save, today: today, rnd: rnd };
}
function zqGenLevel(key, save, today) {

  const rnd = zqMulberry32(zqHash(fd + '|' + today + '|' + key));
  if (n.type === 'new') return zqGenNew(key, save, today, rnd);
  if (n.type === 'boss') return zqGenBoss(key, save, today, rnd);

}
function zqBossMore(L) {                           /* boss 题尽 hp 未尽 → 确定性续题（永不失败） */
  const pool = zqRegionChars(L.region);
  const i = L.qs.length;
  const ch = pool[(i * 7 + 3) % pool.length].ch;
  zqPushQ(L.qs, zqMkQ(['t1', 't4', 't3', 't6'][i % 4], ch, L.region, L.rnd, L.save));
}

/* ---------- E. 判定引擎（zilearn engPick 式；verify 直驱同口） ----------
   返回：'right' 推进 / 'wrong' 错（miss+1，boss 计 bossMiss）/ 'rest' boss miss3 休息流 /
        'done' 通关 / false 拒收（演出题判错/已完/越界）。演出题 ok=纯推进不进 perf 账。 */
function zqEngAnswer(L, ok) {
  if (!L || L.done) return false;
  const q = L.qs[L.qi];
  if (!q) return false;
  if (!ok) {
    if (q.judge === false) return false;
    L.miss++;
    const p = L.perf[q.ch] = L.perf[q.ch] || { ok: 0, miss: 0 };
    p.miss++;
    if (L.kind === 'boss') {
      L.bossMiss++;
      if (L.bossMiss >= 3) {                       /* 喝口水休息：保留一半进度，永不失败 */
        L.bossMiss = 0; L.restTaken++;
        L.hp = L.hpMax - Math.ceil((L.hpMax - L.hp) / 2);
        return 'rest';
      }
    } else if (L.kind === 'new' && !q.retried) {
      L.retry.push({ ch: q.ch, avoid: q.type });   /* 错题重入队（每判定位一次） */
    }
    return 'wrong';
  }
  if (q.judge === false) { q.solved = true; L.qi++; return zqEngTail(L); }
  const p = L.perf[q.ch] = L.perf[q.ch] || { ok: 0, miss: 0 };
  p.ok++;
  q.solved = true;
  if (L.kind === 'boss') {
    L.hp--;
    if (L.hp <= 0) { L.done = true; return 'done'; }
    L.qi++;
    if (L.qi >= L.qs.length) zqBossMore(L);
    return 'right';
  }
  L.qi++;
  return zqEngTail(L);
}
function zqEngTail(L) {                            /* 关尾：重入队 append 或收卷 */
  if (L.qi < L.qs.length) return 'right';
  if (L.kind === 'new' && L.retry.length) {
    const r = L.retry.shift();
    const rq = zqMkQ(r.avoid === 't1' ? 't4' : 't1', r.ch, L.region, L.rnd, L.save);
    rq.retried = true;
    zqPushQ(L.qs, rq);
    return 'right';
  }
  L.done = true;
  return 'done';
}
function zqEngPick(L, i) {                         /* verify/autoSolve 直驱口（下标判定） */
  if (!L) return false;
  const q = L.qs[L.qi];
  return q ? zqEngAnswer(L, i === q.answer) : false;
}

/* ================= M2a 流程层二：关卡循环 UI（覆盖层/注册表/渲染/反馈阶梯/救援/墙/结算）
    运行时依赖 game-main（wait/sfx/toast/finishNode/burst/zqSave/SAVE/zqToday/nodeLabel/KIDS）
    ——拼接序 game-main → level → calib → camp → qtypes（build _assemble_flow）。 ================= */

/* ---------- F. 关卡覆盖层（CSS+DOM 懒注入；动画只用 transform/opacity；触摸 ≥96） ---------- */
const ZQ_LV_CSS = [
'#zq-lv{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:#FBF6EC;',
'  animation:zq-lv-in .28s ease}',

let ZQ_LV = null, ZQ_LV_CSS_DONE = false;
function zqLvEnsure() {
  if (!ZQ_LV_CSS_DONE) {
    const s = document.createElement('style');
    s.textContent = ZQ_LV_CSS;
    document.head.appendChild(s);
    ZQ_LV_CSS_DONE = true;
  }

    '<button class="zq-lv-btn" id="zq-lv-hear" aria-label="再听一遍">🔊 听</button></div>' +
    '<div class="zq-lv-steps" id="zq-lv-steps"></div>' +

    '<div class="zq-wall-cards"></div><div class="zq-wall-sub">点一点字卡，听听它的声音</div></div></div>';
  document.body.appendChild(el);
  document.getElementById('zq-lv-back').addEventListener('click', function () {
    if (!ZQ_LV) return;
    ZQ_LV = null;
    el.classList.add('hide');
    sfx('pop');
  });
  document.getElementById('zq-lv-hear').addEventListener('click', function () {
    if (!ZQ_LV) return;
    lastAct = Date.now();
    const q = ZQ_LV.qs[ZQ_LV.qi], d = q && ZQ_QT[q.type];
    if (d && d.onShow) d.onShow(q, ZQ_LV._api);     /* 注册型：重播归题型 */
    else zqSayQuestion(q);                          /* 占位兜底 */
  });
}

/* ---------- G. 题型注册表（M2b qtypes 同步自注册；未注册=占位卡兜底不崩） ---------- */
const ZQ_QT = {};
function zqRegisterQ(type, def) { ZQ_QT[type] = def; }

/* ---------- H. 语音键账（verify 防泄露断言依据；wrap 一次幂等） ---------- */
const ZQ_VLOG = [];
(function zqWireVoice() {
  if (typeof KIDS === 'undefined' || !KIDS.voice || !KIDS.voice.play) return;
  if (KIDS.voice._zqWrapped) return;
  const op = KIDS.voice.play, oq = KIDS.voice.queue;
  KIDS.voice.play = function (key) { ZQ_VLOG.push(['p', key]); return op.call(this, key); };
  KIDS.voice.queue = function (parts) {
    ZQ_VLOG.push(['q', parts.map(function (p) { return typeof p === 'string' ? p : (p && p.key); })]);
    return oq.call(this, parts);
  };
  KIDS.voice._zqWrapped = true;
})();

/* ---------- I. 关卡循环（渲染/api/判定 UI 化） ---------- */
let lastAct = 0, lastDir = 0, lastAns = 0, zqWrongChainUntil = 0;
const ZQ_RIGHT_WIN = 1400;                          /* 对题确认窗（段一静音；M5 实长回填点） */
function zqSayQuestion(q) {                         /* 题面语音（防泄露：视觉题禁播目标音；
                                                       无 VERIFY 守卫——救援路径 verify 直驱可测键账，KIDS 未 init 自静默） */
  if (!q || typeof KIDS === 'undefined') return;
  if (q.type === 't1') KIDS.voice.queue(['zq_listen', 'zq_ch_' + q.pyKey]);
  else if (q.type === 't2') KIDS.voice.play('zq_ch_' + q.pyKey);
  else if (q.type === 't5') KIDS.voice.play('zq_read_hint');
  else KIDS.voice.play('zq_word');
}
function zqRenderPlaceholder(q, box) {              /* M2b 未就位兜底：占位卡可跳过不崩 */
  const d = document.createElement('div');
  d.className = 'zq-ph';
  d.innerHTML = '<div class="zq-ph-t">题型加载中，先看一眼这个字</div>' +
    '<div class="zq-ph-zi">' + q.ch + '</div><div class="zq-ph-py">' + q.py + '</div>' +
    '<div class="zq-ph-g">' + (q.glyph || '') + '</div>';
  const b = document.createElement('button');
  b.className = 'zq-ph-btn';
  b.textContent = q.judge === false ? '继续' : '先跳过';
  b.addEventListener('click', function () { zqUiRight(); });
  d.appendChild(b);
  box.appendChild(d);
}
function zqLvProgress() {
  const L = ZQ_LV, box = document.getElementById('zq-lv-steps');
  if (!L || !box) return;
  if (L.kind === 'boss') {
    let h = '';
    for (let i = 0; i < L.hpMax; i++) h += '<i class="zq-hp' + (i < L.hp ? ' on' : '') + '"></i>';
    let w = '';
    for (let i = 0; i < 3; i++) w += '<i class="zq-drop' + (i < L.bossMiss ? ' on' : '') + '"></i>';
    box.innerHTML = '<span class="zq-hp-wrap">' + h + '</span><span class="zq-drop-wrap">' + w + '</span>';
    return;
  }
  let h = '';
  for (let i = 0; i < L.qs.length; i++) {
    h += '<i class="zq-step' + (i < L.qi ? ' done' : (i === L.qi ? ' cur' : '')) + '"></i>';
  }
  box.innerHTML = h;
}
function zqMakeApi(q, own) {                     /* own=反馈归属（未注册型 level 自担；M2b 注册型其 wirePick 全权） */
  return {
    right: function () { return zqUiRight(); },
    wrong: function () { return zqUiWrong(); },
    replay: function () {
      lastAct = Date.now();
      const d = ZQ_QT[q.type];
      if (d && d.onShow) d.onShow(q, ZQ_LV && ZQ_LV._api);   /* 错2/救援重播 → 题面音归题型 */
      else zqSayQuestion(q);                                  /* 占位兜底 */
    },
    lock: function (on) { if (ZQ_LV) ZQ_LV.qLock = !!on; },
    voice: function (k) { if (!ZQ_VERIFY && typeof KIDS !== 'undefined') KIDS.voice.play(k); },
    hint: function () { if (own) zqBreatheAns(q); },
    progress: function (cur, total) {
      const el = document.getElementById('zq-lv-sub');
      if (el) el.textContent = total > 1 ? (cur + ' / ' + total) : '';
    }
  };
}
function zqRenderQ() {
  const L = ZQ_LV;
  if (!L) return;
  const q = L.qs[L.qi];
  if (!q) return;
  zqLvProgress();
  const box = document.getElementById('zq-qbox');
  box.innerHTML = '';
  const sub = document.getElementById('zq-lv-sub');
  if (sub) sub.textContent = '';
  L.roundMiss = 0;
  const def = ZQ_QT[q.type];
  if (!def) {                                       /* 未注册=占位卡：题面音 level 自担（verify 也记键账） */
    zqRenderPlaceholder(q, box);
    zqSayQuestion(q);
  } else {
    const api = zqMakeApi(q, false);
    L._api = api;                                   /* replay/听键 回转 onShow 用 */
    def.render(q, box, api);
    if (def.onShow) def.onShow(q, api);             /* 注册型：题面音归题型（M2b 契约 onShow(q,api)） */
  }
  lastAct = Date.now(); lastDir = Date.now();
}
function zqLvTitle(L) {
  if (L.kind === 'boss') return L.boss ? L.boss.name : 'BOSS';
  if (L.kind === 'camp') return '复习营地';
  if (L.kind === 'morning') return '早安营地';
  return nodeLabel(L.node);
}
function zqLvRun(L) {
  zqLvEnsure();
  ZQ_LV = L;
  L.uiLock = false; L.qLock = false; L.roundMiss = 0;
  zqWrongChainUntil = 0;
  lastAct = Date.now(); lastDir = Date.now(); lastAns = Date.now();
  const el = document.getElementById('zq-lv');
  el.classList.remove('hide');
  document.getElementById('zq-lv-title').textContent = zqLvTitle(L);
  if (typeof KIDS !== 'undefined' && !ZQ_VERIFY) {
    if (L.kind === 'boss' && L.boss) KIDS.voice.play('zq_boss_' + L.boss.id);
    else if (L.kind === 'camp') KIDS.voice.play('zq_camp_go');
    else if (L.kind === 'morning') KIDS.voice.play('zq_morning');
  }
  zqRenderQ();
}

/* ---------- J. 判定 UI 化（题型经 api.right/wrong 进；演出锁 uiLock/qLock 双闸） ---------- */
function zqOptEl(i) { return document.querySelector('#zq-qbox [data-v="' + i + '"]'); }  /* M2b data.v=原始下标 */
function zqRefx(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function zqBreatheAns(q) { const el = zqOptEl(q.answer); if (el) zqRefx(el, 'breathe'); }
function zqShakeOpts() {
  const c = document.querySelector('#zq-qbox .zq-opts');
  if (c) zqRefx(c, 'shake');
}
function zqDimOne(q) {                             /* 阶梯 3：摘 1 干扰（alive>3 才摘，不删 DOM） */
  const alive = document.querySelectorAll('#zq-qbox .zq-opt:not(.dimmed)');
  if (alive.length <= 3) return;
  for (let k = 0; k < alive.length; k++) {
    if (Number(alive[k].dataset.v) !== q.answer) { alive[k].classList.add('dimmed'); return; }
  }
}
async function zqUiRight() {
  const L = ZQ_LV;
  if (!L || L.uiLock || L.qLock) return false;
  const q = L.qs[L.qi], run = L;
  const ret = L.onAnswer ? L.onAnswer(true) : zqEngAnswer(L, true);   /* calib 动态流覆盖点 */
  if (ret === false) return false;
  lastAct = Date.now(); lastDir = Date.now(); lastAns = Date.now();
  if (ZQ_QT[q.type]) {                              /* M2b 已反馈（good/sfx/zq_right+rightMs 窗）→ 仅推进清场 */
    if (ret === 'done') { zqFinishFlow(run); return ret; }
    zqRenderQ();
    return ret;
  }
  L.uiLock = true;                                  /* 占位路径：level 自担反馈 */
  sfx('coin');
  const good = zqOptEl(q.answer);
  if (good) good.classList.add('good');
  if (!ZQ_VERIFY && q.judge !== false && typeof KIDS !== 'undefined') {
    KIDS.voice.queue(['zq_right', 'zq_ch_' + q.pyKey]);
  }
  await wait(ZQ_RIGHT_WIN * ZQ_SPEED);
  if (ZQ_LV !== run) return ret;
  L.uiLock = false;
  if (ret === 'done') { zqFinishFlow(run); return ret; }
  zqRenderQ();
  return ret;
}
async function zqUiWrong() {                        /* 错误反馈阶梯（zilearn F2 全套） */
  const L = ZQ_LV;
  if (!L || L.uiLock || L.qLock) return false;
  const q = L.qs[L.qi], run = L;
  const ret = L.onAnswer ? L.onAnswer(false) : zqEngAnswer(L, false); /* calib 动态流覆盖点 */
  if (ret === false) return false;
  lastAct = Date.now();
  L.roundMiss++;
  if (ret === 'rest') {                             /* boss miss3 休息流（两路径共通） */
    L.uiLock = true;
    await zqBossRestShow(run);
    if (ZQ_LV !== run) return ret;
    L.uiLock = false;
    zqRenderQ();
    return ret;
  }
  if (ZQ_QT[q.type]) {                              /* M2b 阶梯已反馈（wig/shake/鼓励/breathe/摘干扰）→ 仅状态 */
    if (ret === 'done') { zqFinishFlow(run); return ret; }   /* calib 错在末题=收口 */
    if (ret === 'right') zqRenderQ();               /* calib 动态流：错后推进下一题 */
    return ret;
  }
  L.uiLock = true;                                  /* 占位路径：level 自担错误阶梯（zilearn F2） */
  zqShakeOpts();
  sfx('fail');
  if (L.roundMiss >= 2) {
    if (!ZQ_VERIFY && typeof KIDS !== 'undefined') KIDS.voice.queue(['zq_wrong', 'zq_ch_' + q.pyKey]);
    zqBreatheAns(q);
    if (L.roundMiss === 3) zqDimOne(q);
    zqWrongChainUntil = Date.now() + 2600 * ZQ_SPEED + 400;
  } else {
    if (!ZQ_VERIFY && typeof KIDS !== 'undefined') KIDS.voice.play('zq_wrong');
    zqWrongChainUntil = Date.now() + 1300 * ZQ_SPEED + 200;
  }
  await wait(900 * ZQ_SPEED + 140);
  if (ZQ_LV !== run) return ret;
  L.uiLock = false;
  if (ret === 'done') { zqFinishFlow(run); return ret; }   /* calib 错在末题=收口 */
  if (ret === 'right') zqRenderQ();                 /* calib 动态流：错后推进下一题 */
  return ret;
}

/* ---------- K. boss 休息流（miss3=喝口水休息；半进度重试；永不失败） ---------- */
async function zqBossRestShow(L) {
  sfx('pop');
  if (ZQ_VERIFY) return;
  if (typeof KIDS !== 'undefined') KIDS.voice.play('zq_boss_rest');
  const ov = document.createElement('div');
  ov.className = 'zq-lv-rest';
  ov.innerHTML = '<div class="zq-box"><div class="zq-rest-t">喝口水，休息一下</div>' +
    '<div class="zq-rest-s">' + (L.boss ? L.boss.name : '它') + '累啦，我们保留一半进度，再来一次！</div>' +
    '<button class="zq-rest-btn">继续</button></div>';
  document.body.appendChild(ov);
  await new Promise(function (res) {
    ov.querySelector('.zq-rest-btn').addEventListener('click', res);
    setTimeout(res, 4200 * ZQ_SPEED);               /* 超时自动继续（家长侧不堵流程） */
  });
  ov.remove();
}

/* ---------- L. 无操作看护：14s 方向级 / 30s 答案级（keepIdle：救援均不刷 lastAct） ---------- */
const RESCUE_DIR_MS = 14000, RESCUE_ANS_MS = 30000, RESCUE_ANS_REPEAT = 15000;
function zqRescueCore() {
  const L = ZQ_LV;
  if (!L || L.done || L.uiLock || L.qLock) return;
  const now = Date.now();
  if (now < zqWrongChainUntil) return;              /* 错反馈链豁免窗（zilearn 契约 I） */
  if (document.querySelector('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel,.k-ov,.zq-lv-rest')) return;
  if (!document.getElementById('zq-wall') || !document.getElementById('zq-wall').classList.contains('hide')) return;
  const q = L.qs[L.qi];
  if (!q || q.judge === false) return;
  if (ZQ_QT[q.type]) return;                        /* 注册型：题型自带救援双锚（keepIdle 各自记账） */
  const idle = now - lastAct;
  if (idle > RESCUE_ANS_MS && now - lastAns > RESCUE_ANS_REPEAT) {
    zqBreatheAns(q);
    zqSayQuestion(q);
    lastAns = now;
    return;
  }
  if (idle > RESCUE_DIR_MS && now - lastDir > RESCUE_DIR_MS && idle <= RESCUE_ANS_MS) {
    zqSayQuestion(q);
    lastDir = now;
  }
}
function zqRescueTick() { if (!ZQ_VERIFY) zqRescueCore(); }
setInterval(zqRescueTick, 1000);

/* ---------- M. 生字墙（zilearn F1 式翻牌收字：点卡播字音=主动回忆） ---------- */
async function zqWallShow(L) {
  if (ZQ_VERIFY || !L.chars || !L.chars.length) return;
  zqLvEnsure();
  const wall = document.getElementById('zq-wall');
  const tray = wall.querySelector('.zq-wall-cards');
  tray.innerHTML = '';
  wall.classList.remove('hide');
  if (typeof KIDS !== 'undefined') KIDS.voice.play('zq_wall');
  await new Promise(function (resolve) {
    let lit = 0, over = false;
    const finish = function () { if (over) return; over = true; wall.classList.add('hide'); resolve(); };
    const timer = setTimeout(finish, 12000);        /* 家长侧超时兜底 */
    L.chars.forEach(function (ch) {
      const ent = ZQ_CH_ENT[ch];
      const card = document.createElement('button');
      card.className = 'zq-wall-card';
      card.innerHTML = '<span class="zq-w-zi">' + ch + '</span><span class="zq-w-py">' + ent.py + '</span>';
      card.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (typeof KIDS !== 'undefined') KIDS.voice.play('zq_ch_' + ent.pyKey);
        if (!card.classList.contains('lit')) {
          card.classList.add('lit');
          if (++lit === L.chars.length) {
            clearTimeout(timer);
            if (typeof KIDS !== 'undefined') KIDS.voice.play('zq_wall_done');
            setTimeout(finish, 700);
          }
        }
      });
      tray.appendChild(card);
    });
  });
}

/* ---------- N. 结算（SRS 写档/早安账/celebrate→墙→finishNode 收口） ---------- */
function zqFeedRecall(z, perf, today) {             /* boss/camp 回忆喂 srsNext（camp.js 复用） */
  Object.keys(perf).forEach(function (ch) {
    const p = perf[ch];
    if (!z.dex[ch]) return;
    for (let k = 0; k < p.ok; k++) z.dex[ch] = srsNext(z.dex[ch], true, today);
    for (let k = 0; k < p.miss; k++) z.dex[ch] = srsNext(z.dex[ch], false, today);
    if (z.dex[ch].miss >= 2) { if (z.weak.indexOf(ch) < 0) z.weak.push(ch); }
    else { const i = z.weak.indexOf(ch); if (i >= 0) z.weak.splice(i, 1); }
  });
}
function zqSettle(L, saveArg) {
  const sv = saveArg || SAVE;
  if (!sv || !sv.zq) return;                        /* VERIFY 空档视图禁写；verify 传 fixture 纯驱 */
  const z = sv.zq, today = sv === SAVE ? zqToday() : (L.today || zqToday());
  if (!z.dayLog[today]) z.dayLog[today] = { newChars: [], nodes: [], newDone: [], quests: [] };
  if (L.kind === 'new') {
    L.chars.forEach(function (ch) {
      const p = L.perf[ch] || { ok: 0, miss: 0 };
      z.dex[ch] = { st: 1, lv: 0, due: zqAddDays(today, 1), miss: p.miss, ok: p.ok };  /* 新学当日态：次日 due=早安 recap 刚性 */
      if (p.miss >= 2 && z.weak.indexOf(ch) < 0) z.weak.push(ch);
      if (z.dayLog[today].newChars.indexOf(ch) < 0) z.dayLog[today].newChars.push(ch);
    });
  } else {
    zqFeedRecall(z, L.perf, today);
    if (L.kind === 'camp') {                        /* 营地日次账（日一次+无限玩 0 币扩展依据） */
      const dl = z.dayLog[today];
      if (!dl.campPaid) dl.campPaid = [];
      if (dl.campPaid.indexOf(L.key) < 0) dl.campPaid.push(L.key);
    }
  }
}
async function zqFinishFlow(L, stars) {
  const st = arguments.length > 1 ? stars : zqStars(L);
  L.uiLock = true;
  sfx('win');
  if (ZQ_VERIFY) return;                            /* verify 页：引擎判定即止（不弹层不写档） */
  if (L.finishFlow) { L.finishFlow(st); return; }   /* calib 等动态流自定义收口覆盖点 */
  zqSettle(L);
  await KIDS.ui.celebrate(st);
  await zqWallShow(L);
  document.getElementById('zq-lv').classList.add('hide');
  ZQ_LV = null;
  finishNode(L.key, st);                            /* M1 收口：map/币/解锁/迷雾/兔子 hop/persist */
  burst(L.key);
}
