/* ================= ziquest M2a 流程层三：冷启动定级（calib.js）
   「和兔子玩认字游戏」（包装成游戏而非测验，设计 §2.4）：
   - 探针=T1 听音找字（与正式玩法零学习成本）；三带池=ZQ_CAL.meta.bands（easy40/mid30/hard30，
     build 注入自 data/calib-pool.json），带内 ≤10 题，全对/达晋级线升带（calStop 规则），
     上限 30 题 ≈3-4 分钟。
   - 对=+ZQ_ECON.calibRight 币（即时入账）+zq_calib_right；错=零惩罚（zq_calib_wrong——错不
     标记不扣不进薄弱池）；收口=zq_calib_done+写 SAVE.zq.cal（knownSet 供新字关目标剔除，
     zqNodeChars 已实现）+finishNode 写 map（calib 节点 0 结算币——定级另按对题数计）。
   - 动态自适应流走 level.js 关卡循环覆盖点（L.onAnswer/L.finishFlow）——演出锁/救援/
     反馈阶梯全套复用，零重写。
   - zqCalibSim=纯模拟器（verify 定级停止模拟直驱，无 DOM）。 */
'use strict';

const ZQ_CAL_BAND_LIM = 10;                         /* 每带 ≤10 题（40/30/30 池、上限 30 题） */
const ZQ_CAL_TOTAL_LIM = 30;
const ZQ_CAL_NAMES = ['easy', 'mid', 'hard'];

/* ---------- 纯模拟器（verify 直驱：patterns=每带答案序列 → 停止点/known/n） ---------- */
function zqCalibSim(patterns) {
  const bands = [], known = [];
  let n = 0;
  for (let b = 1; b <= 3; b++) {
    const answers = (patterns[b - 1] || []).slice(0, ZQ_CAL_BAND_LIM);
    const pool = ZQ_CAL.meta.bands[ZQ_CAL_NAMES[b - 1]];
    bands.push({ band: b, answers: answers });
    answers.forEach(function (a, i) {               /* 答对=池序第 i 字已知（收集口径=运行时一致） */
      if (a && known.indexOf(pool[i]) < 0) known.push(pool[i]);
    });
    n += answers.length;
    if (n >= ZQ_CAL_TOTAL_LIM) return { stop: true, why: 'cap', band: b, n: n, known: known };
    if (answers.length < ZQ_CAL_BAND_LIM) return { stop: true, why: 'band-cut', band: b, n: n, known: known };
    const st = calStop(bands);
    if (st.stop) return { stop: true, why: 'calStop', band: b, n: n, known: known };
    if (st.next === 0) return { stop: true, why: 'band3-done', band: b, n: n, known: known };
  }
  return { stop: true, why: 'all-done', band: 3, n: n, known: known };
}

/* ---------- 运行时（复用 level.js 关卡循环：zqLvRun/zqRenderQ/zqUiRight/Wrong） ---------- */
function zqCalibNext(L) {                           /* 带池洗牌序出 1 题（T1 包装） */
  const ch = L.bandPool[L.bi % L.bandPool.length];
  L.bi++;
  return zqMkQ('t1', ch, 1, L.rnd, L.save);
}
function zqCalibFinishFlow(L) {                     /* 收口：写 cal 档+celebrate+finishNode */
  const today = zqToday();
  if (!ZQ_VERIFY && SAVE) {
    const z = SAVE.zq;
    z.cal = { done: L.known.slice(), band: L.band, skipSeen: !!z.cal.skipSeen };
    if (typeof KIDS !== 'undefined') KIDS.voice.play('zq_calib_done');
    KIDS.store.persist();
  }
  ZQ_LV = null;
  document.getElementById('zq-lv').classList.add('hide');
  finishNode(L.key, 1);                             /* calib 完成=1★过点（0 结算币，定级币已即时入账） */
  if (L.onDone) L.onDone(L.known.slice());
}
const ZQ_CALIB = {
  /* start(onDone(knownSet))：定级节点 r0n02 入口（ZQ.Level.start 分发） */
  start: function (onDone) {
    if (ZQ_VERIFY) return { ok: false, reason: 'verify' };   /* verify 页走 zqCalibSim 直驱 */
    const today = zqToday(), sv = zSave();
    const n = ZQ_NODE['r0n02'];
    const rnd = zqMulberry32(zqHash((sv.firstDay || today) + '|' + today + '|calib'));
    const L = { key: 'r0n02', node: n, kind: 'calib', region: 0, chars: [], qs: [], qi: 0,
                miss: 0, retry: [], perf: {}, done: false, hp: 0, hpMax: 0, bossMiss: 0,
                restTaken: 0, band: 1, bi: 0, bandAns: [], bands: [], n: 0, known: [],
                bandPool: zqShuffled(ZQ_CAL.meta.bands.easy, rnd),
                save: sv, today: today, rnd: rnd, onDone: onDone || null,
                finishFlow: zqCalibFinishFlow };
    L.onAnswer = function (ok) {
      const q = L.qs[L.qi];
      if (!q) return false;
      L.bandAns.push(ok);
      L.n++;
      if (ok) {
        if (L.known.indexOf(q.ch) < 0) L.known.push(q.ch);
        if (SAVE) { SAVE.zq.coins += ZQ_ECON.calibRight; refreshHud(); }   /* 每对+2 币即时（不 persist，收口一并落盘） */
        if (typeof KIDS !== 'undefined') KIDS.voice.play('zq_calib_right');
      } else if (typeof KIDS !== 'undefined') {
        KIDS.voice.play('zq_calib_wrong');          /* 零惩罚文案 */
      }
      if (L.n >= ZQ_CAL_TOTAL_LIM) { L.done = true; return 'done'; }
      if (L.bandAns.length >= ZQ_CAL_BAND_LIM) {    /* 带满 → calStop 升带/停止 */
        L.bands.push({ band: L.band, answers: L.bandAns.slice() });
        const st = calStop(L.bands);
        if (st.stop || !st.next || st.next > 3) { L.done = true; return 'done'; }
        L.band = st.next;
        L.bandAns = [];
        L.bi = 0;
        L.bandPool = zqShuffled(ZQ_CAL.meta.bands[ZQ_CAL_NAMES[L.band - 1]], L.rnd);
      }
      L.qi++;
      zqPushQ(L.qs, zqCalibNext(L));
      return 'right';
    };
    zqPushQ(L.qs, zqCalibNext(L));                  /* 首题 */
    if (typeof KIDS !== 'undefined') KIDS.voice.play('zq_calib_start');
    zqLvRun(L);
    return { ok: true, key: 'r0n02', kind: 'calib' };
  }
};
window.ZQ.Calib = ZQ_CALIB;
window.ZQ._calibSim = zqCalibSim;
window.ZQ.CalibStart = ZQ_CALIB.start;              /* level.js ZQ_LEVEL 分发引用（跨段常量） */

/* ================= ziquest M2a 流程层四：复习营地 + 早安营地（camp.js）
   复习营地节点（camp）：srsDue 池（dueDate 升序→miss 降序→字序，engine 定序）取 6 字，
   T4/T1/T6 轮转 6 题（相邻不同型）；完成=finishNode 收口（camp 币 6，首通一次）；
   dayLog.campPaid 日次账（「日一次+之后无限玩 0 币」的扩展依据——首试版 done 节点
   重进受 game-main tapNode done 分支锁死，无限重玩留主线 M3 决策，报告已声明）。
   早安营地（morning，设计 §2.5 通道①）：进图 1.2s 后自动检查——今日未做且昨日有新字
   →弹昨日新字 recap 3 题（T1/T4/T1），morning 币 3+dayLog.morningDone 日一次；
   回忆喂 SRS（昨日新字 due=今日 到期→对=srsNext 进阶——+1 日间隔刚性执行）。
   两营均复用 level.js 关卡循环（静态 qs+zqEngAnswer/zqFinishFlow 覆盖点）。 */
'use strict';

const ZQ_CAMP_N = 6;                                /* 营地 6 题（SPEC 独立表对账） */
const ZQ_MORNING_N = 3;                             /* 早安 recap 3 题 */

/* ---------- 营地字池：due 池优先 → 薄弱池补 → 本区已学 → 本区字兜底（确定性链） ---------- */
function zqCampPool(save, today, region, n) {
  const z = save && save.zq || { dex: {}, weak: [] };
  let pool = srsDue(z.dex, today).slice(0, n);      /* engine 定序快照 */
  if (pool.length < n) {
    z.weak.forEach(function (ch) { if (pool.length < n && pool.indexOf(ch) < 0 && z.dex[ch]) pool.push(ch); });
  }
  if (pool.length < n) {                            /* 本区已学字（dex 有档）兜底 */
    const learned = zqRegionChars(region).map(function (c) { return c.ch; })
      .filter(function (ch) { return z.dex[ch] && pool.indexOf(ch) < 0; });
    pool = pool.concat(learned.slice(0, n - pool.length));
  }
  if (pool.length < n) {                            /* 全新档极端兜底=本区字 */
    zqRegionChars(region).forEach(function (c) {
      if (pool.length < n && pool.indexOf(c.ch) < 0) pool.push(c.ch);
    });
  }
  return pool.slice(0, n);
}

/* ---------- 复习营地节点（ZQ.Camp.start(key)，ZQ.Level.start 分发） ---------- */
function zqGenCamp(key, save, today) {
  const n = ZQ_NODE[key];
  if (!n) return null;
  const rnd = zqMulberry32(zqHash((save.firstDay || today) + '|' + today + '|' + key));
  const chars = zqCampPool(save, today, n.region, ZQ_CAMP_N);
  if (!chars.length) return null;
  const cyc = ['t4', 't1', 't6', 't4', 't1', 't6'];
  const qs = [];
  for (let i = 0; i < chars.length; i++) zqPushQ(qs, zqMkQ(cyc[i % cyc.length], chars[i], n.region, rnd, save));
  return { key: key, node: n, kind: 'camp', region: n.region, chars: chars, qs: qs, qi: 0,
           miss: 0, retry: [], perf: {}, done: false, hp: 0, hpMax: 0, bossMiss: 0,
           restTaken: 0, save: save, today: today, rnd: rnd };
}
const ZQ_CAMP = {
  start: function (key) {
    if (ZQ_VERIFY) return { ok: false, reason: 'verify' };
    const L = zqGenCamp(key, zSave(), zqToday());
    if (!L) return { ok: false, reason: 'no-gen' };
    zqLvRun(L);                                     /* kind='camp'：zq_camp_go 开场语音 */
    return { ok: true, key: key, kind: 'camp' };
  },
  /* 早安营地（进图自动触发，非地图节点——morning 币自结不走 finishNode） */
  morning: function () {
    if (ZQ_VERIFY || !SAVE) return { ok: false, reason: 'skip' };
    const today = zqToday(), z = SAVE.zq;
    const yest = zqAddDays(today, -1);
    const yd = z.dayLog[yest] || {};
    const chars = (yd.newChars || []).slice(0, ZQ_MORNING_N);
    if (!chars.length) return { ok: false, reason: 'no-yest' };
    const dl = z.dayLog[today] = z.dayLog[today] || { newChars: [], nodes: [], newDone: [], quests: [] };
    if (dl.morningDone) return { ok: false, reason: 'done-today' };

  }

/* 早安关生成（纯函数，verify 直驱）：昨日新字前 N 字 T1/T4/T1 交错 recap */
function zqGenMorning(chars, save, today) {
  const rnd = zqMulberry32(zqHash((save.firstDay || today) + '|' + today + '|morning'));
  const cyc = ['t1', 't4', 't1'];

  for (let i = 0; i < chars.length; i++) zqPushQ(qs, zqMkQ(cyc[i % cyc.length], chars[i], region, rnd, save));

}
function zqCampRegionOf(chars) {                    /* 字→所在区（ZQ_CH_NO 全局序 r*1000） */
  const no = ZQ_CH_NO[chars[0]] || 0;

function zqMorningFinish() {                        /* 早安收口：币 3+日次标记+SRS 喂+persist */

/* 进图自动检查（延迟 1.2s——game-main 启动段完成后；今日已做/昨日无新字=静默跳过） */

/* ---------- storycard.js — story 节点最小剧情卡（首试版；M4 升级全功能播放器） ----------
 * 运行时依赖：ZQ_STORY/ZQ_CHARS/ZQ_MAP（game-data 块）、finishNode/toast（game-main）。
 * 形态：全屏夜空卡（区域强调色微光）→ 场景描述小字 + 台词逐句点按推进 → 末句「出发」完成。

(function () {

  var ST = { key: null, scene: null, i: 0, cool: 0, box: null };

    var scenes = {};
    ((typeof ZQ_STORY !== 'undefined' && ZQ_STORY.scenes) || []).forEach(function (s) { scenes[s.id] = s; });
    regions.forEach(function (r) {
      var sts = r.nodes.filter(function (n) { return n.type === 'story'; });
      sts.forEach(function (n, i) {
        var sid;
        if (r.id === 0) sid = i === 0 ? 'prologue_a' : 'prologue_b';
        else if (i === 0) sid = 'r' + r.id + '_open';
        else sid = (r.id === 7) ? 'r7_gala' : 'r' + r.id + '_gate';
        IDX[n.key] = scenes[sid] || null;
      });
    });
  }

  function accent(rid) {
    var m = (typeof ZQ_CHARS !== 'undefined') && ZQ_CHARS[String(rid)];
    return (m && m.meta && m.meta.accent) || '#E8975A';
  }

  function el(tag, css, txt) {
    var e = document.createElement(tag);
    if (css) e.style.cssText = css;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function closeBox() {

  }

})();

/* ================= ziquest 题型层 t3：词挖空（视觉题——题面绝不出现答案字/答案音） =================
   形态：words 中本字挖空「□」（words[0] 优先，防御取首个含本字的词），四选一大字卡补空
   （选项=本字+distract 3，M2a 造 q.options/q.answer）。答对=字飞入空位（transform-only）。
   防泄露：stem 文本=挖空后的词（□ 代替本字），禁含 q.ch；题面音只播 zq_word（不播目标字音）。 */
(function () {
'use strict';

var ZQ = (typeof ZQ !== 'undefined') ? ZQ : (window.ZQ || {});
if (!ZQ._qt) throw new Error('ZQ._qt missing: qtypes must load t1.js first');
var QT_ = ZQ._qt;

ZQ.registerQ('t3', {
  render: function (q, box, api) {
    QT_.teardown(box);
    var f = QT_.frame(box);

    /* 挖空词防御选取：words[0] 含本字用之；否则首个含本字词；全不含退化「□+词」 */
    var w0 = null;
    (q.words || []).some(function (w) {
      if (w && w[0] && String(w[0]).indexOf(q.ch) >= 0) { w0 = String(w[0]); return true; }
      return false;
    });
    var pos = w0 ? w0.indexOf(q.ch) : -1;
    var html;
    if (w0 && pos >= 0) {
      html = '';
      for (var i = 0; i < w0.length; i++) {
        html += i === pos
          ? '<span class="zq-t3-blank" aria-label="空位">□</span>'
          : '<span class="zi">' + QT_.esc(w0[i]) + '</span>';
      }
    } else {
      html = '<span class="zq-t3-blank">□</span>' +
        (w0 ? '<span class="zi">' + QT_.esc(w0) + '</span>' : '');
    }

    f.stem.innerHTML =
      '<div class="zq-prompt"><span>读一读，空格里是哪个字？</span></div>' +
      '<div class="zq-t3-word">' + html + '</div>';

    var items = (q.options || []).map(function (o) {
      return '<span class="zi">' + QT_.esc(o) + '</span>';
    });
    var layout = QT_.layout(items.length, q, 3);
    var optEls = QT_.mkOpts(f.opts, items, layout);
    var blank = f.stem.querySelector('.zq-t3-blank');
    var ansCh = q.options[QT_.ansIdxOf(q)];

    QT_.wirePick({
      box: box, q: q, api: api, optEls: optEls,
      ansIdx: QT_.ansIdxOf(q),           /* 判定域=原始索引（乱序无关） */
      onRight: function () {                      /* 答案字飞入空位（视觉确认，transform-only） */
        if (blank) {
          blank.classList.add('zq-fly');
          setTimeout(function () { blank.textContent = ansCh; blank.classList.add('lit'); }, 220);
        }
      },
      rightMs: 520,
      encText: function (i) {
        return i === 1 ? '没关系，读一读这个词' : (i === 2 ? '想一想它的样子，再选一选' : '去掉一个啦，再选一选');
      }
    });
  },
  onShow: function (q, api) {                     /* 视觉题纪律：题面音不带目标字音 */
    QT_.voice(api, 'zq_word');
  }
});

QT_.cssOnce('zq-css-t3',
  '.zq-t3-word{display:flex;align-items:center;gap:6px;background:#FFF9EE;border:2.5px solid #4A3B2E;' +
    'border-radius:26px;box-shadow:0 5px 0 #D8C9B4;padding:18px 30px;min-height:96px}' +
  '.zq-t3-word .zi{font-size:56px;font-weight:800;color:#4A3B2E;line-height:1}' +
  '.zq-t3-blank{font-size:56px;font-weight:800;color:#E8975A;line-height:1;' +
    'border-bottom:5px dotted #E8975A;padding:0 4px;animation:zq-breathe 1.6s ease-in-out infinite}' +
  '.zq-t3-blank.lit{color:#5B8A4E;border-bottom-color:#5B8A4E;animation:none}');

})();

/* ================= ziquest 题型层 t4：组词（本字+「_」四选一选词，视觉题） =================
   形态：题面=本字大卡 + 虚线空位（本字在词首=「天 _」选词尾；词尾=「_ 天」选词头——由
   words[0] 中本字位置决定）；选项=词卡 ×4（正确词+3 换字词，M2a 造 q.options/q.answer）。
   词卡中与 q.ch 同形的字高亮（视觉锚定本字位置，判别仍在整词）。
   防泄露：stem 只出本字与空位（本字=题干非答案；答案=完整词不出现在题面），题面音只播 zq_word。 */
(function () {
'use strict';

var ZQ = (typeof ZQ !== 'undefined') ? ZQ : (window.ZQ || {});
if (!ZQ._qt) throw new Error('ZQ._qt missing: qtypes must load t1.js first');
var QT_ = ZQ._qt;

ZQ.registerQ('t4', {
  render: function (q, box, api) {
    QT_.teardown(box);
    var f = QT_.frame(box);

    /* 词形方向：words[0] 本字在首 → 空位在右（选词尾）；否则空位在左 */
    var w0 = (q.words && q.words[0] && String(q.words[0][0])) || '';
    var headFirst = w0.indexOf(q.ch) === 0;
    var chCard = '<span class="zq-t4-zi">' + QT_.esc(q.ch) + '</span>';
    var slot = '<span class="zq-t4-slot" aria-label="词的位置"></span>';
    var pair = headFirst ? chCard + slot : slot + chCard;

    f.stem.innerHTML =
      '<div class="zq-prompt"><span>给它找个词朋友</span></div>' +
      '<div class="zq-t4-pair">' + pair + '</div>';

    var items = (q.options || []).map(function (w) {      /* 词卡：本字位置高亮 */
      var s = QT_.esc(String(w));
      return '<span class="wd">' + s.split(QT_.esc(q.ch)).join('<b class="hl">' + QT_.esc(q.ch) + '</b>') + '</span>';
    });
    var layout = QT_.layout(items.length, q, 4);
    var optEls = QT_.mkOpts(f.opts, items, layout);
    var slotEl = f.stem.querySelector('.zq-t4-slot');
    var ansWord = String(q.options[QT_.ansIdxOf(q)]);
    var tailCh = ansWord.split(q.ch).join('');   /* 空位填=本字之外的剩余字 */

    QT_.wirePick({
      box: box, q: q, api: api, optEls: optEls,
      ansIdx: QT_.ansIdxOf(q),           /* 判定域=原始索引（乱序无关） */
      onRight: function () {                      /* 选中的那个字飞入空位 */
        if (slotEl) {
          slotEl.classList.add('zq-fly');
          setTimeout(function () {
            slotEl.textContent = tailCh || ansWord;
            slotEl.classList.add('lit');
          }, 220);
        }
      },
      rightMs: 520,
      encText: function (i) {
        return i === 1 ? '没关系，读一读这些词' : (i === 2 ? '哪个词里有它呢？' : '去掉一个啦，再选一选');
      }
    });
  },
  onShow: function (q, api) {                     /* 视觉题纪律：题面期绝不播目标字音（SPEC-ZILEARN §2） */
    QT_.voice(api, 'zq_word');
  }
});

QT_.cssOnce('zq-css-t4',
  '.zq-t4-pair{display:flex;align-items:center;gap:10px;min-height:96px}' +
  '.zq-t4-zi{min-width:96px;min-height:96px;border-radius:22px;background:#FFF9EE;border:2.5px solid #4A3B2E;' +
    'box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;' +
    'font-size:56px;font-weight:800;color:#4A3B2E;padding:8px 14px}' +
  '.zq-t4-slot{min-width:96px;min-height:96px;border-radius:22px;background:rgba(232,151,90,.12);' +
    'border:2.5px dashed #E8975A;display:flex;align-items:center;justify-content:center;' +
    'font-size:44px;font-weight:800;color:#4A3B2E;padding:8px 12px}' +
  '.zq-t4-slot.lit{border-style:solid;border-color:#5B8A4E;background:#E9F2DF;animation:none}' +
  '.zq-opt .wd{font-size:38px;font-weight:800;line-height:1.15;display:flex;gap:2px;align-items:center}' +
  '.zq-opt .wd .hl{color:#E8975A}');

})();

/* ================= ziquest 题型层 t5：句子挖空（读句找生字，视觉题） =================
   形态：句子大字排开，focus 字（q.ch）首处挖空「□」呼吸卡，四选一大字卡补空；答对字飞入。
   句子来源（运行时探测，M2a 约定）：q.sentence.text → window.ZQ_DATA.ZQ_SENTENCES（元素为
   字符串或 {text}；取含 q.ch 者按 seedIdx 确定性选）→ 都缺=占位卡（words[0] 挖空退化形态，
   class zq-fb 标记，可判定不卡关——sentences.json 由并行线产出，加载时缺失不崩）。
   防泄露：stem 文本=挖空后的句子（□ 代替 focus 字）；题面音只播 zq_read_hint。 */
(function () {
'use strict';

var ZQ = (typeof ZQ !== 'undefined') ? ZQ : (window.ZQ || {});
if (!ZQ._qt) throw new Error('ZQ._qt missing: qtypes must load t1.js first');
var QT_ = ZQ._qt;

function t5PickSent(q) {
  if (q.sentence && q.sentence.text) return String(q.sentence.text);
  /* 探测链（2026-09-29 主线修正）：可注入容器 window.ZQ_DATA.ZQ_SENTENCES 优先（测试两态可控），
     生产环境无容器 → 裸全局 const ZQ_SENTENCES（_gen_data 产出）兜底 */
  var S = (typeof window !== 'undefined' && window.ZQ_DATA && window.ZQ_DATA.ZQ_SENTENCES) ||
          (typeof ZQ_SENTENCES !== 'undefined' && ZQ_SENTENCES) ||
          (typeof ZQ_DATA !== 'undefined' ? ZQ_DATA.ZQ_SENTENCES : null);
  if (S && S.length) {
    var hits = [];
    for (var i = 0; i < S.length; i++) {
      var t = S[i] == null ? '' : (typeof S[i] === 'string' ? S[i] : S[i].text);
      if (t && t.indexOf(q.ch) >= 0) hits.push(t);
    }
    if (hits.length) return hits[((q.seedIdx || 0) % hits.length + hits.length) % hits.length];
  }
  return null;
}

ZQ.registerQ('t5', {
  render: function (q, box, api) {
    QT_.teardown(box);
    var f = QT_.frame(box);
    var sent = t5PickSent(q);

    var html, fbCls = '';
    if (sent) {
      html = '';
      var done = false;
      for (var i = 0; i < sent.length; i++) {
        if (!done && sent[i] === q.ch) {
          html += '<span class="zq-t5-blank" aria-label="空位">□</span>';
          done = true;
        } else {
          html += '<span class="zi">' + QT_.esc(sent[i]) + '</span>';
        }
      }
    } else {                                     /* 占位卡：句库缺失，词挖空退化（标记 zq-fb） */
      fbCls = ' zq-fb';
      var w0 = (q.words && q.words[0] && String(q.words[0][0])) || '';
      var p = w0.indexOf(q.ch);
      html = '';
      for (var k = 0; k < w0.length; k++) {
        html += (k === p) ? '<span class="zq-t5-blank">□</span>'
                          : '<span class="zi">' + QT_.esc(w0[k]) + '</span>';
      }
      if (p < 0) html = '<span class="zq-t5-blank">□</span>' + html;
    }

    f.stem.innerHTML =
      '<div class="zq-prompt"><span>读一读，选出生字</span></div>' +
      '<div class="zq-t5-sent' + fbCls + '">' + html + '</div>';

    var items = (q.options || []).map(function (o) {
      return '<span class="zi">' + QT_.esc(o) + '</span>';
    });
    var layout = QT_.layout(items.length, q, 5);
    var optEls = QT_.mkOpts(f.opts, items, layout);
    var blank = f.stem.querySelector('.zq-t5-blank');

    QT_.wirePick({
      box: box, q: q, api: api, optEls: optEls,
      ansIdx: QT_.ansIdxOf(q),           /* 判定域=原始索引（乱序无关） */
      onRight: function () {
        if (blank) {
          blank.classList.add('zq-fly');
          setTimeout(function () { blank.textContent = q.ch; blank.classList.add('lit'); }, 220);
        }
      },
      rightMs: 520,
      encText: function (i) {
        return i === 1 ? '没关系，把句子读一读' : (i === 2 ? '读到哪里空了呢？' : '去掉一个啦，再选一选');
      }
    });
  },
  onShow: function (q, api) {                     /* 视觉题纪律：题面音不带目标字音 */
    QT_.voice(api, 'zq_read_hint');
  }
});

QT_.cssOnce('zq-css-t5',
  '.zq-t5-sent{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 6px;' +
    'background:#FFF9EE;border:2.5px solid #4A3B2E;border-radius:24px;box-shadow:0 5px 0 #D8C9B4;' +
    'padding:16px 20px;max-width:640px;min-height:96px}' +
  '.zq-t5-sent .zi{font-size:34px;font-weight:800;color:#4A3B2E;line-height:1.5}' +
  '.zq-t5-sent.zq-fb{border-style:dashed;opacity:.96}' +
  '.zq-t5-blank{font-size:34px;font-weight:800;color:#E8975A;line-height:1.5;' +
    'border-bottom:4px dotted #E8975A;padding:0 2px;animation:zq-breathe 1.6s ease-in-out infinite}' +
  '.zq-t5-blank.lit{color:#5B8A4E;border-bottom-color:#5B8A4E;animation:none}');

})();

/* ================= ziquest 题型层 t6：形近辨析（田字格亮相 + 听音选字，辨认层） =================
   形态：题面=主字大田字格（高亮教学锚）+ 3 个形近干扰字小田字格对比排（distract），播目标字音
   → 四选一大字卡（本字+3 干扰，乱序）。
   防泄露口径：题面主字与选项同形=玩法组件（辨析教学亮相——同 t1「听音题的题面音=目标音」
   豁免类，SPEC §2；selftest 专断言：题面主字必在选项中且选项乱序）；干扰格不标注对错。 */
(function () {
'use strict';

var ZQ = (typeof ZQ !== 'undefined') ? ZQ : (window.ZQ || {});
if (!ZQ._qt) throw new Error('ZQ._qt missing: qtypes must load t1.js first');
var QT_ = ZQ._qt;

ZQ.registerQ('t6', {
  render: function (q, box, api) {
    QT_.teardown(box);
    var f = QT_.frame(box);

    var dis = (q.distract || []).map(function (d) { return Array.isArray(d) ? d[0] : d; })
      .filter(function (c) { return c && c !== q.ch; });
    var row = dis.map(function (c) {
      return '<span class="zq-tg zq-t6-mini"><span class="zi">' + QT_.esc(c) + '</span></span>';
    }).join('');

    f.stem.innerHTML =
      '<div class="zq-prompt">' + QT_.ICON.hear + '<span>听一听，找到它</span></div>' +
      '<div class="zq-t6-row">' +
        '<span class="zq-tg zq-t6-main"><span class="zi">' + QT_.esc(q.ch) + '</span></span>' +
        '<span class="zq-t6-vs">它们长得像</span>' +
        '<span class="zq-t6-side">' + row + '</span>' +
      '</div>';

    var items = (q.options || []).map(function (o) {
      return '<span class="zi">' + QT_.esc(o) + '</span>';
    });
    var layout = QT_.layout(items.length, q, 6);
    var optEls = QT_.mkOpts(f.opts, items, layout);

    QT_.wirePick({
      box: box, q: q, api: api, optEls: optEls,
      ansIdx: QT_.ansIdxOf(q),           /* 判定域=原始索引（乱序无关） */
      encText: function (i) {
        return i === 1 ? '没关系，再听一听' : (i === 2 ? '看一看田字格里它的样子' : '去掉一个啦，再选一选');
      }
    });
  },
  onShow: function (q, api) {                     /* 听音题：题面音=目标字音本身是玩法（豁免口径） */
    QT_.voice(api, 'zq_listen');
    QT_.voice(api, 'zq_ch_' + q.pyKey);
  }
});

QT_.cssOnce('zq-css-t6',
  '.zq-t6-row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;min-height:96px}' +
  '.zq-tg{background-color:#FFF9EE;border:2.5px solid #4A3B2E;border-radius:14px;' +
    'background-image:linear-gradient(#D8C9B4,#D8C9B4),linear-gradient(#D8C9B4,#D8C9B4);' +
    'background-size:100% 2px,2px 100%;background-position:center;background-repeat:no-repeat;' +
    'display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #D8C9B4}' +
  '.zq-t6-main{width:104px;height:104px;border-radius:16px;border-color:#E8975A;' +
    'box-shadow:0 5px 0 #E8B287;animation:zq-breathe 2.2s ease-in-out infinite}' +
  '.zq-t6-main .zi{font-size:64px;font-weight:800;color:#4A3B2E}' +
  '.zq-t6-vs{font-size:15px;font-weight:800;color:#8A7B6C}' +
  '.zq-t6-side{display:flex;gap:8px}' +
  '.zq-t6-mini{width:58px;height:58px;border-width:2px;border-radius:10px;box-shadow:none;opacity:.82}' +
  '.zq-t6-mini .zi{font-size:34px;font-weight:800;color:#6B5B4A}');

})();


</script>
<script>
/* ================= ?verify=1 自检（独立第 4 script 块）——M1 骨架 7 单元 + M2a 流程层 17 单元
   ① 结构：script 块数==4 + 完全离线（运行时字面扫描，SVG xmlns 白名单）
   ② 地图拓扑：130 节点 / key 唯一 / next 无断链 / 先序链无孤立（除链尾恰好=各区 boss）/ 区域序线性
   ③ nodeState 解锁律：fixture 存档推进——锁→开→当前→完成 四态转换 + 区域门 + BOSS 门 + 日配额门
   ④ 配额表独立对账：SPEC 硬编码 [1,2,2,2,2,2,2,3] 对照 ZQ_DAY_NEW + zqQuota 全日算 + bonus 叠加
   ⑤ SRS 调度律：对→间隔沿 [1,3,7,14,30] 扩张封顶 / 错→降档减半+miss+1 / srsDue 定序律
   ⑥ 地图渲染 DOM：130 节点在场 / 当前节点 s-current 脉冲类在场 / 未解锁区域迷雾 pattern 在场
   ⑦ 定级停止规则 calStop：晋级线 8/6 / <4 即停 / 连错 3 快停 / 带 3 完=结束 / 空记录=带 1 起步
   ⑧ gen 生成器确定性深对账（同存档同日两跑 JSON 全等/跨日变/字组与日期无关/契约字段/答案下标）
   ⑨ layout 编排六律（首判定认识层/相邻不同型/≥4 型/每字 2 通道/运用层限位/字内难度不降+boss 轮转）
   ⑩ calknown 定级剔除（已知字不进目标+池序顺延+新字必经认识层）
   ⑪ stars 星判定表（0=3★/1-2=2★/≥3=1★ 永不 0/boss 恒 3★）
   ⑫ retry 错题重入队（同字不同型一次为限/错不推进同题重答）
   ⑬ boss HP 制（catalog hp clamp/连对击破/miss3 半进度休息/永错永不失败/题尽续题）
   ⑭ settle 结算写档模拟（dex 新学当日态 due+1/newChars/weak 入池/camp 回忆喂+campPaid 账）
   ⑮ camp 复习营地（due 池 engine 定序/6 题轮转）
   ⑯ morning 早安营地（昨日新字 recap T1/T4/T1/verify 守卫/币 3）
   ⑰ calflow 定级流程模拟（三带全对 30 题/<4 即停/带内晋级/known 收集口径）
   ⑱ leak 防泄露（视觉题面 DOM 零答案文本+渲染期键账零目标音）
   ⑲ ui 渲染兜底+触摸（未注册型占位卡/选项 ≥96/题面选项分离/生字墙容器）
   ⑳ econ 经济常量独立对账（SPEC_ECON 硬编码 ↔ ZQ_ECON）
   ㉑ calpool 三带池对账（40/30/30/池 100 全在字表/三带互异）
   ㉒ rescue 救援双锚直驱（14s 方向级重播/30s 答案级 breathe/keepIdle 不刷 lastAct）
   ㉓ dispatch 节点分发（story/chest/friend 占位/new/boss 弹层/camp·calib verify 守卫）
   ㉔ seed 确定性工具锚（hash 稳定/同种子洗牌全等）
   ㉕ spread 区域字组均分（R1 十三关并集 62 无缝无重/每关 4-5 字）
   结果写 #verify-result + document.title = 'VERIFY PASS n/n'（失败=VERIFY FAIL） */
'use strict';

async function runVerify() {
  document.body.classList.add('verify');
  const units = {};
  let npass = 0, total = 0;
  const ok = (unit, name, cond) => {
    units[unit] = units[unit] || [];
    units[unit].push([name, !!cond]);
    total++; if (cond) npass++;
  };

  /* ---- SPEC 独立表（坑4 铁律：期望值独立硬编码，禁从实现函数复算） ---- */
  const SPEC_DAY_NEW = [1, 2, 2, 2, 2, 2, 2, 3];
  const SPEC_SRS_IV = [1, 3, 7, 14, 30];
  const SPEC_NODES = 130;

  /* ================= ① 结构：script 块数 + 完全离线 ================= */
  try {
    const scripts = document.querySelectorAll('script');
    ok('struct', 'script 块数 == 4', scripts.length === 4);
    const HTTP = 'htt' + 'p://', HTTPS = 'htt' + 'ps://', XMLNS = HTTP + 'www.w3.org/2000/svg';
    let offline = true, bad = '';
    scripts.forEach((s, i) => {
      const t = (s.textContent || '').split(XMLNS).join('NS-SVG');
      [HTTP, HTTPS, '<' + 'link'].forEach(p => {
        if (t.indexOf(p) >= 0 && !bad) bad = 'script[' + i + '] 含外部引用字面';
      });
    });
    if (document.querySelector('link[rel]')) { offline = false; bad = bad || 'link 标签在场'; }
    ok('struct', '完全离线（唯一 http=SVG xmlns）', offline && !bad);
  } catch (e) { ok('struct', '离线扫描异常 ' + e.message, false); }

  /* ================= ② 地图拓扑（先序链无断链/无孤立/区域序） ================= */
  try {
    ok('topo', '节点数 == 130', ZQ_NODES.length === SPEC_NODES);
    const keys = new Set(ZQ_NODES.map(n => n.key));
    ok('topo', 'key 唯一', keys.size === ZQ_NODES.length);
    let chainOk = true;
    ZQ_NODES.forEach(n => n.next.forEach(k => { if (!keys.has(k)) chainOk = false; }));
    ok('topo', 'next 引用全部有效（无断链）', chainOk);
    let intraOk = true;                             /* 区域内 next 链全可达（跨区走 unlock 门，非边） */
    ZQ_REGIONS.forEach(r => {
      const reach = new Set([r.nodes[0].key]);
      r.nodes.forEach(n => n.next.forEach(k => {
        if (reach.has(n.key) && r.nodes.some(x => x.key === k)) reach.add(k);
      }));
      if (reach.size !== r.nodes.length) intraOk = false;
    });
    ok('topo', '区域内先序链无孤立（全可达）', intraOk);
    const tails = ZQ_NODES.filter(n => n.next.length === 0).map(n => n.key);
    const bosses = ZQ_REGIONS.filter(r => r.boss).map(r => r.boss);
    ok('topo', '链尾 = R0 尾站 + 各区 BOSS（7 门）', tails.join() === ['r0n03'].concat(bosses).join() && bosses.length === 7);
    let seqOk = ZQ_REGIONS[0].unlock === 'first';
    for (let i = 1; i < ZQ_REGIONS.length; i++) {
      const u = ZQ_REGIONS[i].unlock;
      if (u !== ZQ_REGIONS[i - 1].boss && u !== 'r' + (i - 1) + '_boss' && !keys.has(u)) seqOk = false;
    }
    ok('topo', '区域序线性（unlock 指向邻区 boss/节点）', seqOk);
    let lvOk = true;
    ZQ_REGIONS.forEach(r => {
      const nNew = r.nodes.filter(n => n.type === 'new').length;
      if (r.levels !== nNew) lvOk = false;
    });
    ok('topo', '各区 levels == new 节点数', lvOk);
  } catch (e) { ok('topo', '拓扑异常 ' + e.message, false); }

  /* ================= ③ nodeState 解锁律（fixture 存档四态转换） ================= */
  try {
    const T = '2026-10-01';
    const mk = over => { const s = { v: '1.0', game: 'ziquest', firstDay: T, levels: {}, bonus: {}, zq: { cal: { done: [], band: 0, skipSeen: false }, map: {}, dex: {}, weak: [], comp: {}, dress: { owned: [], worn: {}, home: {} }, coins: 0, storySeen: [], dayLog: { [T]: { newChars: [], nodes: [], newDone: [], quests: [] } } } }; return Object.assign(s, over || {}); };
    const done = (s, k, st) => { s.zq.map[k] = { stars: st || 2, plays: 1 }; return s; };
    let s0 = mk();
    ok('unlock', '冷档：r0n01=可玩（首节点无前驱）', ZQ._nodeState(s0, 'r0n01', T) === 'open');
    ok('unlock', '冷档：r0n02=锁（前驱未完成）', ZQ._nodeState(s0, 'r0n02', T) === 'locked');
    ok('unlock', '冷档：r1n01=锁（区域门=迷雾）', ZQ._nodeState(s0, 'r1n01', T) === 'locked');
    ok('unlock', '冷档：当前节点=r0n01', ZQ._curNodeKey(s0, T) === 'r0n01');
    done(s0, 'r0n01');
    ok('unlock', 'r0n01 完成→done 态', ZQ._nodeState(s0, 'r0n01', T) === 'done');
    ok('unlock', 'r0n02 开（前驱亮）且为当前', ZQ._nodeState(s0, 'r0n02', T) === 'open' && ZQ._curNodeKey(s0, T) === 'r0n02');
    done(s0, 'r0n02'); done(s0, 'r0n03');
    ok('unlock', 'R0 全通→R1 区域开 r1n01 可玩', ZQ._nodeState(s0, 'r1n01', T) === 'open');
    ok('unlock', 'R1 boss=锁（new 未全通）', ZQ._nodeState(s0, 'r1n20', T) === 'locked');
    const s1 = mk();
    ZQ_NODES.filter(n => n.region === 0).forEach(n => done(s1, n.key));            /* 区域门：R0 全通 */
    ZQ_NODES.filter(n => n.region === 1 && n.type === 'new').forEach(n => done(s1, n.key, 3));
    ZQ_NODES.filter(n => n.region === 1 && n.type !== 'new' && n.type !== 'boss' && n.key < 'r1n20').forEach(n => done(s1, n.key));
    ok('unlock', '本区 new 全通→boss 可进', ZQ._nodeState(s1, 'r1n20', T) === 'open');
    done(s1, 'r1n20');
    ok('unlock', '击破 boss→R2 迷雾散（r2n01 可玩）', ZQ._nodeState(s1, 'r2n01', T) === 'open');
    const sq = mk();
    const CUT = ZQ_NODES.findIndex(n => n.key === 'r1n08');
    ZQ_NODES.slice(0, CUT).forEach(n => { sq.zq.map[n.key] = { stars: 2, plays: 1 }; });   /* r0 全+r1n01..07 */
    sq.zq.dayLog[T].newDone = ['r1n02', 'r1n03', 'r1n04', 'r1n06'];                        /* 首日 quota=1 已超 */
    ok('unlock', '首日配额=1 用尽→后续 new 锁（日配额门）', ZQ._nodeState(sq, 'r1n08', T) === 'locked');
    ok('unlock', '配额不锁营地（r1n07 非锁：open/done 皆可）', ZQ._nodeState(sq, 'r1n07', T) !== 'locked');
  } catch (e) { ok('unlock', '解锁律异常 ' + e.message, false); }

  /* ================= ④ 配额表独立对账 ================= */
  try {
    ok('quota', 'ZQ_DAY_NEW == SPEC [1,2,2,2,2,2,2,3]', ZQ_DAY_NEW.join() === SPEC_DAY_NEW.join());
    let qOk = true;
    for (let d = 1; d <= 30; d++) {
      const want = d >= 8 ? 3 : SPEC_DAY_NEW[d - 1];
      if (ZQ._zqQuota(d, 0) !== want) qOk = false;
    }
    ok('quota', 'zqQuota 全日算（8 日起恒 3）', qOk);
    ok('quota', 'bonus 叠加：zqQuota(1,2)==3', ZQ._zqQuota(1, 2) === 3);
    ok('quota', 'day 序：firstDay+9 天 → dayIndex 10', ZQ._zqDayIndex({ firstDay: '2026-10-01' }, '2026-10-09') === 9);
  } catch (e) { ok('quota', '配额异常 ' + e.message, false); }

  /* ================= ⑤ SRS 调度律 ================= */
  try {
    let st = { st: 1, lv: 0, due: '2026-10-02', miss: 0, ok: 0 }, dues = [];   /* 新学当日态起步 */
    for (let i = 0; i < 7; i++) { st = ZQ._srsNext(st, true, '2026-10-01'); dues.push(st); }
    ok('srs', '对 7 连：lv 沿阶梯升至封顶 4', st.lv === 4 && dues.map(x => x.lv).join() === '1,2,3,4,4,4,4');
    ok('srs', '对→间隔扩张（+3/+7/+14/+30 封顶 30，SPEC_SRS_IV）',
      dues.map(x => x.due).join() === '2026-10-04,2026-10-08,2026-10-15,2026-10-31,2026-10-31,2026-10-31,2026-10-31' &&
      SPEC_SRS_IV.join() === '1,3,7,14,30');
    ok('srs', '对→精通态（lv≥3 st=2）', st.st === 2 && dues[3].st === 2);
    const bad = ZQ._srsNext({ st: 2, lv: 4, due: '2026-10-31', miss: 0, ok: 5 }, false, '2026-10-01');
    ok('srs', '错→降一档+间隔减半（lv4→3，14/2=7 日）', bad.lv === 3 && bad.due === '2026-10-08');
    ok('srs', '错→miss+1（入薄弱池依据）', bad.miss === 1 && bad.ok === 5);
    const dex = {
      '日': { st: 1, lv: 0, due: '2026-09-30', miss: 0, ok: 1 },   /* 最急 */
      '月': { st: 1, lv: 1, due: '2026-10-01', miss: 2, ok: 1 },   /* 同日 miss 高优先 */
      '水': { st: 1, lv: 1, due: '2026-10-01', miss: 0, ok: 1 },
      '山': { st: 0, lv: 0, due: null, miss: 0, ok: 0 },           /* 未学不入池 */
      '火': { st: 1, lv: 2, due: '2026-10-05', miss: 0, ok: 2 }    /* 未到期不入池 */
    };
    ok('srs', 'srsDue：due 升序→miss 降序，未学/未到期排除', ZQ._srsDue(dex, '2026-10-01').join() === '日,月,水');
  } catch (e) { ok('srs', 'SRS 异常 ' + e.message, false); }

  /* ================= ⑥ 地图渲染 DOM 断言 ================= */
  try {
    ok('dom', 'SVG 节点元素 == 130', document.querySelectorAll('#zq-l4 .zq-node').length === SPEC_NODES);
    ok('dom', '迷雾 pattern 在场（url 引用有效）',
      !!document.querySelector('#zq-fog-pat') && document.querySelectorAll('.zq-fog').length >= 7);
    const cur = ZQ.cur;
    ok('dom', '当前节点 s-current 脉冲类在场（' + cur + '）',
      !!cur && document.getElementById(cur).classList.contains('s-current'));
    const lockedN = Object.keys(ZQ.mapState()).filter(k => ZQ.mapState()[k] === 'locked').length;
    ok('dom', '冷档锁节点数 > 100（迷雾区全锁）', lockedN > 100);
    ok('dom', '触摸热区在场（130 hit circle）', document.querySelectorAll('#zq-l4 .zq-hit').length === SPEC_NODES);
    ok('dom', '兔子 L5 + 粒子池 L6 在场', !!document.getElementById('zq-rabbit') && document.querySelectorAll('.zq-fx').length === 12);
  } catch (e) { ok('dom', 'DOM 异常 ' + e.message, false); }

  /* ================= ⑦ 定级停止规则 ================= */
  try {
    const A = n => { const a = []; for (let i = 0; i < 10; i++) a.push(i < n); return a; };
    const AM = n => { const a = []; for (let i = 0; i < 10; i++) a.push((i * n) % 10 < n); return a; };  /* 对错交错（无连3错干扰晋级线） */
    ok('calib', '带1 对9 → 进带2', !ZQ._calStop([{ band: 1, answers: [false].concat(A(9)) }]).stop);
    ok('calib', '带1 对7（达4未达8）→ 温和停', ZQ._calStop([{ band: 1, answers: AM(7) }]).stop);
    ok('calib', '带1 对3 <4 → 即停', ZQ._calStop([{ band: 1, answers: A(3) }]).stop);
    const streak = [true, true, true, true, true, false, false, false, true, true];
    ok('calib', '带内连错 3 → 快速停（对8 也不救）', ZQ._calStop([{ band: 1, answers: streak }]).stop);
    ok('calib', '带2 对6 → 进带3', !ZQ._calStop([{ band: 1, answers: A(10) }, { band: 2, answers: AM(6) }]).stop);
    ok('calib', '带2 对5 → 停', ZQ._calStop([{ band: 1, answers: A(10) }, { band: 2, answers: AM(5) }]).stop);
    ok('calib', '带3 答完 → 结束（next=0）', ZQ._calStop([{ band: 1, answers: A(10) }, { band: 2, answers: A(7) }, { band: 3, answers: A(6) }]).next === 0);
    ok('calib', '空记录 → 带1 起步不叫停', !ZQ._calStop([]).stop && ZQ._calStop([]).next === 1);
  } catch (e) { ok('calib', '定级异常 ' + e.message, false); }

  /* ================= ⑧ 生成器确定性深对账（M2a：同存档态同题序铁律） ================= */
  try {
    const T = '2026-10-01';
    const mk2 = over => { const s = { v: '1.0', game: 'ziquest', firstDay: T, levels: {}, bonus: {}, zq: { cal: { done: [], band: 0, skipSeen: false }, map: {}, dex: {}, weak: [], comp: {}, dress: { owned: [], worn: {}, home: {} }, coins: 0, storySeen: [], dayLog: {} } }; return Object.assign(s, over || {}); };
    const sv = mk2();
    const L = ZQ._genLevel('r1n02', sv, T);
    ok('gen', 'r1n02 可生成（kind=new）', !!L && L.kind === 'new');
    ok('gen', '同存档同日两跑 JSON 全等（确定性）',
      JSON.stringify(L) === JSON.stringify(ZQ._genLevel('r1n02', sv, T)));
    ok('gen', '跨日不同题序（日期入种）',
      JSON.stringify(ZQ._genLevel('r1n02', sv, '2026-10-02')) !== JSON.stringify(L));
    ok('gen', '节点字组与日期无关（早安 recap 依据稳定）',
      JSON.stringify(ZQ._nodeChars('r1n02', sv)) === JSON.stringify(ZQ._nodeChars('r1n02', mk2({ firstDay: '2026-09-01' }))));
    ok('gen', '题数=字数×3（t2 亮相×n + 判定×2n）', L.qs.length === L.chars.length * 3);
    ok('gen', 'q 契约字段齐（ch/py/pyKey/words/glyph/distract/options/answer/seedIdx/region；t2 演出位无选项）',
      L.qs.every(q => q.ch && q.py && q.pyKey && Array.isArray(q.words) && q.glyph &&
        Array.isArray(q.distract) && (q.type === 't2' ? true : (q.options.length === 4 && typeof q.answer === 'number')) &&
        q.seedIdx > 0 && q.region === 1));
    ok('gen', '字题 answer=目标字下标 / t4 answer=首词下标', L.qs.every(q =>
      q.type === 't2' ? true : (q.type === 't4' ? q.options[q.answer] === q.words[0][0] : q.options[q.answer] === q.ch)));
    ok('gen', 't4 干扰词禁含目标字且互异', L.qs.filter(q => q.type === 't4').every(q => {
      const w = q.options;
      return w.length === new Set(w).size && w.every(x => x === q.words[0][0] || x.indexOf(q.ch) < 0);
    }));
  } catch (e) { ok('gen', '生成器异常 ' + e.message, false); }

  /* ================= ⑨ 编排六律（SPEC §3.3；判定序列=t2 演出位之后） ================= */
  try {
    const T = '2026-10-01';
    const mk2 = over => { const s = { v: '1.0', game: 'ziquest', firstDay: T, levels: {}, bonus: {}, zq: { cal: { done: [], band: 0, skipSeen: false }, map: {}, dex: {}, weak: [], comp: {}, dress: { owned: [], worn: {}, home: {} }, coins: 0, storySeen: [], dayLog: {} } }; return Object.assign(s, over || {}); };
    const sv = mk2();
    const L = ZQ._genLevel('r1n02', sv, T);
    const types = L.qs.map(q => q.type);
    const jd = types.slice(L.chars.length);            /* 判定序列（跳过 t2 演出位） */
    ok('layout', '律1 首判定=认识层 t1', jd[0] === 't1');
    let adjOk = true;
    for (let i = 1; i < jd.length; i++) if (jd[i] === jd[i - 1]) adjOk = false;
    ok('layout', '律2 相邻判定位不同型', adjOk);
    ok('layout', '律3 题型 ≥4 种（t2+t1+t4/t6）', new Set(types).size >= 4);
    let chanOk = true, monoOk = true;
    L.chars.forEach(ch => {
      const per = L.qs.filter(q => q.ch === ch && q.judge !== false).map(q => q.type);
      if (!(per.length >= 2 && per[0] === 't1' && per.slice(1).every(t => t === 't4' || t === 't6'))) chanOk = false;
      const lv = L.qs.filter(q => q.ch === ch && q.judge !== false).map(q => ZQ_NEW_L2[q.type]);
      if (lv.length >= 2 && lv[1] < lv[0]) monoOk = false;
    });
    ok('layout', '律4 每新字 ≥2 通道（认识 t1 先行→辨认 t4/t6 断后）', chanOk);
    const nUse = jd.filter(t => t === 't3' || t === 't5').length;
    const useFirstHalf = jd.slice(0, Math.ceil(jd.length / 2)).filter(t => t === 't3' || t === 't5').length;
    ok('layout', '律5 运用层（t3/t5）≤2 且关后半', nUse <= 2 && useFirstHalf === 0);
    ok('layout', '律6 字内难度不降（认识 1 → 辨认 2/3）', monoOk);
    const B = ZQ._genLevel('r1n20', sv, T);
    const bt = B.qs.map(q => q.type);
    let badj = true;
    for (let i = 1; i < bt.length; i++) if (bt[i] === bt[i - 1]) badj = false;
    ok('layout', 'boss 题型轮转相邻不同型', badj && B.qs.length === B.hpMax);
  } catch (e) { ok('layout', '编排异常 ' + e.message, false); }

  /* ================= ⑩ 定级剔除与新字必经认识层 ================= */
  try {
    const T = '2026-10-01';
    const mk2 = over => { const s = { v: '1.0', game: 'ziquest', firstDay: T, levels: {}, bonus: {}, zq: { cal: { done: [], band: 0, skipSeen: false }, map: {}, dex: {}, weak: [], comp: {}, dress: { owned: [], worn: {}, home: {} }, coins: 0, storySeen: [], dayLog: {} } }; return Object.assign(s, over || {}); };
    const base = ZQ._nodeChars('r1n02', mk2());
    const ksv = mk2();
    ksv.zq.cal.done = [base[0], base[1]];
    const kn = ZQ._nodeChars('r1n02', ksv);
    ok('calknown', '定级已知字不进新字关目标', kn.indexOf(base[0]) < 0 && kn.indexOf(base[1]) < 0);
    ok('calknown', '剔除后区域池序顺延补位', kn[0] === base[2] && kn.length === base.length);
    const L = ZQ._genLevel('r1n02', mk2(), T);
    ok('calknown', '新字必经认识层（每字首判定=t1 后才见辨认型）',
      L.chars.every(ch => {
        const per = L.qs.filter(q => q.ch === ch && q.judge !== false).map(q => q.type);
        return per[0] === 't1';
      }));
  } catch (e) { ok('calknown', '定级剔除异常 ' + e.message, false); }

  /* ================= ⑪ 星判定表（SPEC 口径：永不 0★） ================= */
  try {
    const mkL = miss => ({ kind: 'new', miss: miss });
    ok('stars', 'miss0=3★', ZQ._stars(mkL(0)) === 3);
    ok('stars', 'miss1=2★ / miss2=2★', ZQ._stars(mkL(1)) === 2 && ZQ._stars(mkL(2)) === 2);
    ok('stars', 'miss3=1★ / miss5=1★（永不 0★）', ZQ._stars(mkL(3)) === 1 && ZQ._stars(mkL(5)) === 1);
    ok('stars', 'boss 恒 3★（永不掉星）', ZQ._stars({ kind: 'boss', miss: 9 }) === 3);
  } catch (e) { ok('stars', '星判定异常 ' + e.message, false); }

  /* ================= ⑫ 错题重入队（同字不同型；一次为限；错不推进） ================= */
  try {
    const T = '2026-10-01';

    const L2 = ZQ._genLevel('r1n02', mk2(), T);
    const base = L2.chars.length * 3;
    const wrongAt = L2.chars.length + 2;               /* 第 3 判定位答错（engPick 走 L.qi——先推进到位） */
    while (L2.qi < wrongAt) ZQ._engPick(L2, L2.qs[L2.qi].judge === false ? 0 : L2.qs[L2.qi].answer);
    const wrongCh = L2.qs[wrongAt].ch, wrongType = L2.qs[wrongAt].type;
    const qiBefore = L2.qi;
    ZQ._engPick(L2, (L2.qs[wrongAt].answer + 1) % 4);
    ok('retry', '答错不推进（同题重答机制）', L2.qi === qiBefore && L2.miss === 1);
    let g = 0;
    while (!L2.done && g++ < 60) {
      const q = L2.qs[L2.qi];
      ZQ._engPick(L2, q.judge === false ? 0 : q.answer);
    }
    ok('retry', '关尾追加恰 1 道重入题（+1）', L2.qs.length === base + 1);
    const rq = L2.qs[L2.qs.length - 1];
    ok('retry', '重入题=错题字+不同型', rq.ch === wrongCh && rq.type !== wrongType && rq.retried === true);
    const L3 = ZQ._genLevel('r1n02', mk2(), T);
    let g3 = 0, reMissed = false, wDone = false;       /* wrongAt 只错一次（错后同题重答才推进） */
    while (!L3.done && g3++ < 80) {
      const q = L3.qs[L3.qi];
      const isRe = L3.qi === L3.qs.length - 1 && L3.qs.length > L3.chars.length * 3;
      let i = q.judge === false ? 0 : q.answer;
      if (L3.qi === wrongAt && !wDone) { i = (q.answer + 1) % 4; wDone = true; }
      else if (isRe && !reMissed) { i = (q.answer + 1) % 4; reMissed = true; }
      ZQ._engPick(L3, i);
    }
    ok('retry', '重入题再错不二次入队（可重答通关）',
      L3.done && L3.qs.length === L3.chars.length * 3 + 1 && reMissed && L3.miss === 2);
  } catch (e) { ok('retry', '重入队异常 ' + e.message, false); }

    ok('seed', 'rnd 序列确定（首值锚）', zqMulberry32(42)() === zqMulberry32(42)());
  } catch (e) { ok('seed', '种子异常 ' + e.message, false); }

  /* ================= ㉕ 区域字组均分与配额联动 ================= */
  try {
    const T = '2026-10-01';
    const mk2 = () => ({ v: '1.0', game: 'ziquest', firstDay: T, levels: {}, bonus: {}, zq: { cal: { done: [], band: 0, skipSeen: false }, map: {}, dex: {}, weak: [], comp: {}, dress: { owned: [], worn: {}, home: {} }, coins: 0, storySeen: [], dayLog: {} } });
    const sv = mk2();
    const r1News = ZQ_NODES.filter(n => n.region === 1 && n.type === 'new');
    const all = [];
    r1News.forEach(n => { all.push.apply(all, ZQ._nodeChars(n.key, sv)); });
    ok('spread', 'R1 十三关字组并集=区域池 62（无缝无重）',
      all.length === 62 && new Set(all).size === 62 && r1News.length === 13);
    ok('spread', '每关 4-5 字（floor 均分）',
      r1News.every(n => { const l = ZQ._nodeChars(n.key, sv).length; return l >= 4 && l <= 5; }));
    const dsv = mk2();
    dsv.zq.dayLog[T] = { newChars: [], nodes: [], newDone: ['r1n02'], quests: [] };
    ok('spread', '首日 quota=1 用尽判定（zqDayDone 自算）', ZQ._zqQuota(1, 0) === 1);
  } catch (e) { ok('spread', '字组异常 ' + e.message, false); }

  /* ---- 结果（家族写作规范：title 行 + stub·game·total·pass·units 字段） ---- */
  const res = { game: 'ziquest', total: total, pass: npass, units: {} };
  Object.keys(units).forEach(k => {
    res.units[k] = units[k].map(x => (x[1] ? 'PASS ' : 'FAIL ') + x[0]);
  });
  const el = document.getElementById('verify-result');
  if (el) el.textContent = JSON.stringify(res, null, 1);
  document.title = npass === total ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) { runVerify(); }

</script>
