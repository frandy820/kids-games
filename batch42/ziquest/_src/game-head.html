<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子识字闯世界</title>
<style>
/* ================= ziquest 小兔子识字闯世界（batch42，第 152 款，大班·幼小衔接旗舰）
   家族基调：暖米底 #FBF6EC / 纸面 #FFF9EE / 暖棕墨线 #4A3B2E（DESIGN-SPEC §8）。
   本款 = 冒险地图 + 收集养成：七层 SVG 绘本长卷（1000×7400，7 区域自下而上），
   wrapper 单一 transform 平移（禁 layout 属性动画），全动效只用 transform/opacity。
   迷雾=未解锁区域半透明 noise pattern；节点 4 态（锁灰笼/可玩呼吸/当前脉冲/完成旗星）。
   触摸目标：节点 hit ≥96（SVG viewBox 1000 宽映射平板横屏≈120px/竖屏≈96px）、底栏按钮 ≥96。 */

/* ========== 一·基式与家族公共段（FAMILY_CSS 三占位：reset/ghost/verify） ========== */
<!--FAMILY_CSS:reset-->
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#zq-game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ========== 二·冒险地图（HUD 顶栏 / 七层 SVG 长卷 / 底栏三入口） ========== */
#zq-hud{flex:0 0 54px;display:flex;align-items:center;gap:12px;padding:6px 14px 0;z-index:5}
#zq-logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(180deg,#F2A96B,#E8975A);
  border:2.5px solid #4A3B2E;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 #D8C9B4;
  flex:0 0 42px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#zq-logo svg{width:36px;height:36px}
.zq-pill{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#FFFDF6,#FFF1D8);
  border:2.5px solid #4A3B2E;border-radius:18px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 3px 0 #D8C9B4,0 6px 12px rgba(74,59,46,.08);
  padding:5px 14px;font-size:19px;font-weight:800;min-height:36px}
.zq-pill svg{width:24px;height:24px;flex:0 0 24px}
.zq-pill b{min-width:26px;text-align:center}
#zq-today{margin-left:auto;font-size:15px;color:#8A7B6C;background:none;box-shadow:none;border-color:#EFE3CD}

/* 地图视口与 wrapper（唯一 transform 平移通道；拖动时关 transition，松手/跳关恢复） */
#zq-view{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none}
#zq-world{position:absolute;left:0;top:0;width:100%;will-change:transform;
  transition:transform .8s cubic-bezier(.3,.9,.35,1)}
#zq-world.drag{transition:none}
#zq-world svg{width:100%;height:auto}
/* L1 远景视差（极慢平移循环，transform-only） */
#zq-l1{animation:zq-far 90s linear infinite;will-change:transform}
@keyframes zq-far{0%,100%{transform:translateX(0)}50%{transform:translateX(-64px)}}
/* 迷雾覆盖（未解锁区域；解锁时 opacity 1→0 过渡=消散仪式） */
.zq-fog{opacity:1;transition:opacity .8s ease;pointer-events:none}
.zq-fog.gone{opacity:0}

/* 节点 4 态：s-locked 灰笼 / s-open 彩色+idle 浮动 / s-current 脉冲环 / s-done 插旗+星 */
.zq-node .zq-ani{transform-box:fill-box;transform-origin:center}
.zq-node .zq-hit{fill:#000;opacity:0;pointer-events:all}
.zq-node.s-open .zq-ani{animation:zq-float 3.2s ease-in-out infinite}
.zq-node.s-open:nth-of-type(2n) .zq-ani{animation-duration:2.6s;animation-delay:-1.2s}
.zq-node.s-open:nth-of-type(3n) .zq-ani{animation-duration:3.8s;animation-delay:-.6s}
@keyframes zq-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.zq-node.s-locked .zq-ani{opacity:.5}
.zq-node.s-locked .zq-cage{display:block}
.zq-cage{display:none;fill:#8A9BAE;opacity:.32}
.zq-node .zq-ring{opacity:0}
.zq-node.s-current .zq-ring{animation:zq-pulse 2.4s ease-out infinite}
.zq-node.s-current .zq-ring.r2{animation-delay:1.2s}
@keyframes zq-pulse{0%{opacity:.85;transform:scale(.62)}70%{opacity:0;transform:scale(1.28)}100%{opacity:0}}
.zq-node .zq-flag,.zq-node .zq-stars{opacity:0;transition:opacity .3s}
.zq-node.s-done .zq-flag,.zq-node.s-done .zq-stars{opacity:1}
.zq-node.s-done .zq-ani{animation:none}
.zq-node.shake .zq-ani{animation:zq-shake .52s ease}
@keyframes zq-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px)}
  45%{transform:translateX(10px)}70%{transform:translateX(-6px)}88%{transform:translateX(4px)}}
/* L5 兔子：hop 落地 squash&stretch（transform-only，作用于内层 g） */
#zq-rabbit .zq-hop{transform-box:fill-box;transform-origin:50% 100%}
#zq-rabbit.hop .zq-hop{animation:zq-hop .42s ease 2}
@keyframes zq-hop{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-30px) scale(.96,1.05)}
  62%{transform:translateY(0) scale(1.14,.84)}82%{transform:translateY(-8px) scale(.99,1.02)}}
/* L6 粒子池（一次性触发，transform/opacity only） */
.zq-fx{opacity:0}
.zq-fx.go{animation:zq-burst .7s ease-out forwards}
@keyframes zq-burst{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}

/* 底栏三入口（图鉴/家园/伙伴——M1 占位，触摸面 ≥96；渐变+白内高光+顶部光泽） */
#zq-dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;gap:10px;padding:4px 16px 12px;z-index:5}
.zq-dock-btn{position:relative;overflow:hidden;min-width:96px;min-height:96px;border-radius:26px;
  background:linear-gradient(180deg,#FFFDF6,#FFF1D8);border:2.5px solid #4A3B2E;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 5px 0 #D8C9B4,0 8px 14px rgba(74,59,46,.09);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:17px;font-weight:800;transition:transform .15s;flex:1 1 0;max-width:168px}
.zq-dock-btn::after{content:"";position:absolute;left:14%;right:14%;top:5px;height:26%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
.zq-dock-btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 2px 0 #D8C9B4}
.zq-dock-btn svg{width:44px;height:44px}

/* ========== 三·关卡占位（M2 题型系统样式区预留：场景框/题面/选项/翻牌/拖拽） ========== */
/* M2 接入：#zq-level 覆盖层（场景主题框+脚印进度+材质选项）在此段落追加，禁散落到其它段 */

/* ---- v58 跟读卡（readaloud.js：t2 字卡后轻跟读+关尾集中跟读；动画只用 transform/opacity） ---- */
.zq-ra{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;flex:1 1 auto;min-height:0;padding:10px 0;
  animation:zq-ra-in .4s ease}
@keyframes zq-ra-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.zq-ra-tt{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800;color:#6B5B4A}
.zq-ra-tt::before{content:'🎙️';font-size:24px}
.zq-ra-ch{min-width:150px;min-height:150px;padding:8px 30px;border-radius:30px;
  background:linear-gradient(180deg,#FFFDF6,#FFF1D8);border:2.5px solid #4A3B2E;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.95),0 6px 0 #D8C9B4,0 14px 24px rgba(74,59,46,.12);
  display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;
  color:#4A3B2E;line-height:1.1;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.zq-ra-btns{display:flex;flex-direction:column;align-items:center;gap:12px}
.zq-ra-mic{width:110px;height:110px;border-radius:50%;border:2.5px solid #4A3B2E;
  background:linear-gradient(180deg,#FFE9A8,#F5B942);box-shadow:inset 0 3px 0 rgba(255,255,255,.7),
  0 6px 0 #C08A2B,0 12px 20px rgba(74,59,46,.15);display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:transform .18s ease}
.zq-ra-mic svg{width:62px;height:62px}
.zq-ra-mic:active{transform:scale(.94)}
.zq-ra-mic.rec{animation:zq-ra-rec .9s ease-in-out infinite}
@keyframes zq-ra-rec{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.zq-ra-ok{min-width:96px;min-height:96px;padding:0 30px;border-radius:26px;border:2.5px solid #5B8A4E;
  background:linear-gradient(180deg,#F0F8E8,#DDF0CE);box-shadow:inset 0 3px 0 rgba(255,255,255,.9),
  0 6px 0 #BFD4AC;font-size:23px;font-weight:800;color:#3E6B33;cursor:pointer;
  transition:transform .18s ease}
.zq-ra-ok:active{transform:scale(.95)}
.zq-ra-skip{border:none;background:none;font-size:17px;font-weight:700;color:#8A7B6C;
  text-decoration:underline;padding:8px 18px;cursor:pointer}
.zq-ra-tip{min-height:26px;font-size:17px;font-weight:700;color:#8A7B6C;text-align:center}

/* ========== 四·M4 收集三页（v57：图鉴/家园/伙伴——sheet 骨架+卡网格+三态+跟班） ========== */
.zq-sheet{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#FBF6EC,#FFF3DC);animation:zq-sheet-in .26s ease}
@keyframes zq-sheet-in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.zq-sheet-h{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px 6px;
  padding-top:calc(14px + env(safe-area-inset-top))}
.zq-sheet-h .tt{font-size:22px;font-weight:800;white-space:nowrap}
.zq-sheet-h .sub{font-size:13.5px;color:#8A7B6C;line-height:1.35}
/* v57.1 热修：返回改左上大箭头（用户实测「进得去出不来」——原右上小 ✕ 儿童找不到/点不到） */
.zq-sheet-h .back{flex:0 0 58px;width:58px;height:58px;border-radius:19px;
  background:linear-gradient(180deg,#FFFDF6,#FFF1D8);border:2.5px solid #4A3B2E;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 4px 0 #D8C9B4;
  display:flex;align-items:center;justify-content:center}
.zq-sheet-h .back:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 2px 0 #D8C9B4}
.zq-sheet-h .back svg{width:30px;height:30px}
.zq-tabs{flex:0 0 auto;display:flex;gap:8px;padding:6px 16px 10px;overflow-x:auto;scrollbar-width:none}
.zq-tabs::-webkit-scrollbar{display:none}
.zq-tab{flex:0 0 auto;min-height:38px;padding:6px 15px;border-radius:15px;font-size:15.5px;font-weight:800;
  background:#FFFDF6;border:2.5px solid var(--acc,#D8C9B4);white-space:nowrap}
.zq-tab.on{background:var(--acc,#F2A96B);border-color:#4A3B2E;color:#FFF;
  text-shadow:0 1px 0 rgba(74,59,46,.35);box-shadow:0 3px 0 #D8C9B4}
.zq-body{flex:1 1 auto;overflow-y:auto;padding:2px 16px 30px;-webkit-overflow-scrolling:touch}
.zq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}

/* 图鉴字卡（三态：lock 灰+小锁 / seen 米白 / master 星角标） */
.zq-gc{position:relative;aspect-ratio:1;border:2.5px solid #4A3B2E;border-radius:16px;background:#FFFDF6;
  display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;
  box-shadow:0 3px 0 #D8C9B4;overflow:hidden}
.zq-gc:active{transform:translateY(2px);box-shadow:0 1px 0 #D8C9B4}
.zq-gc.lock{color:#C9BBA8;background:#F3EADB;border-color:#D8C9B4;box-shadow:none}
.zq-gc.lock i{position:absolute;right:6px;top:5px;font-style:normal;font-size:13px;opacity:.6}
.zq-gc.master::after{content:"★";position:absolute;left:6px;top:2px;font-size:14px;color:#F5A623}
/* 图鉴大字卡（点卡弹出：图+字+词+听） */
.zq-bigwrap{position:fixed;inset:0;z-index:66;display:flex;align-items:center;justify-content:center;
  background:rgba(74,59,46,.42);animation:zq-ov-in .25s ease}
.zq-big{width:min(78vw,320px);background:linear-gradient(180deg,#FFFDF6,#FFF1D8);border:3px solid #4A3B2E;
  border-radius:26px;box-shadow:0 6px 0 #D8C9B4,0 14px 28px rgba(74,59,46,.16);
  padding:18px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.zq-big .pic{width:170px;height:170px;border:2.5px solid #4A3B2E;border-radius:20px;background:#FFF;
  object-fit:contain;padding:8px;box-sizing:border-box}
.zq-big .ch{font-size:84px;font-weight:800;line-height:1.02}
.zq-big .py{font-size:15px;color:#8A7B6C;margin-top:-4px}
.zq-big .wds{font-size:17px;font-weight:700}
.zq-big .listen{min-height:46px;padding:8px 22px;border-radius:16px;font-size:17px;font-weight:800;
  background:linear-gradient(180deg,#F2A96B,#E8975A);color:#FFF;border:2.5px solid #4A3B2E;
  text-shadow:0 1px 0 rgba(74,59,46,.35);box-shadow:0 4px 0 #D8C9B4}
.zq-big .listen:active{transform:translateY(2px);box-shadow:0 2px 0 #D8C9B4}
.zq-big .zq-big-x{min-height:52px;padding:10px 30px;border-radius:16px;font-size:16.5px;font-weight:700;
  background:#FFFDF6;border:2.5px solid #D8C9B4;color:#8A7B6C}

/* 家园：试穿预览（兔+装扮层同 viewBox 叠放）+ 小屋条 + 商品卡 */
.zq-home-top{display:flex;gap:12px;align-items:center;padding:4px 0 12px}
.zq-bunny{position:relative;width:172px;height:172px;flex:0 0 172px}
.zq-bunny .base,.zq-bunny .layer{position:absolute;inset:0;pointer-events:none}
.zq-homescene{flex:1 1 auto;display:flex;align-items:flex-end;gap:4px;overflow-x:auto;min-height:86px;
  background:linear-gradient(180deg,#FFFDF6,#EFE7D2);border:2.5px dashed #D8C9B4;border-radius:16px;padding:6px}
.zq-homescene svg{width:64px;height:64px;flex:0 0 64px}
.zq-homescene .hint{font-size:12.5px;color:#B0684A;padding:4px 8px;align-self:center}
.zq-item{position:relative;border:2.5px solid #4A3B2E;border-radius:16px;background:#FFFDF6;
  box-shadow:0 3px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px 6px;aspect-ratio:1;overflow:hidden}
.zq-item:active{transform:translateY(2px);box-shadow:0 1px 0 #D8C9B4}
.zq-item svg{width:56px;height:56px}
.zq-item .nm{font-size:14px;font-weight:800;line-height:1.15}
.zq-item .tag{font-size:11px;font-weight:700;color:#8A7B6C;text-align:center;line-height:1.3;min-height:2.6em}
.zq-item.worn{border-color:#E8975A;background:linear-gradient(180deg,#FFF3C9,#FFE9A8)}
.zq-item.worn .tag{color:#8A6A1F}
.zq-item.owned .tag{color:#6B8F5A}
.zq-item.cant{opacity:.6}
.zq-item.claim{border-color:#F5C445;background:linear-gradient(180deg,#FFFDF6,#FFF6D8)}

/* 伙伴卡 + 地图跟班（外 g 定位 attribute transform，内 g bob 动画——两层防覆盖） */
.zq-cc{border:2.5px solid #4A3B2E;border-radius:18px;background:#FFFDF6;box-shadow:0 3px 0 #D8C9B4;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;overflow:hidden}
.zq-cc:active{transform:translateY(2px);box-shadow:0 1px 0 #D8C9B4}
.zq-cc .ava{width:66px;height:66px;border-radius:50%;border:2.5px solid #4A3B2E;background:#FFF;overflow:hidden}
.zq-cc .ava svg{width:100%;height:100%}
.zq-cc .nm{font-size:15px;font-weight:800}
.zq-cc .sk{font-size:12px;color:#8A7B6C}
.zq-cc.lock .ava{filter:grayscale(1);opacity:.4}
.zq-cc.lock{opacity:.72;box-shadow:none}
.zq-cc.on{border-color:#E8975A;background:linear-gradient(180deg,#FFF3C9,#FFE9A8)}
.zq-cc .go{font-size:12.5px;font-weight:800;color:#8A6A1F}
#zq-pet{transform-box:fill-box;transform-origin:center;animation:zq-pet-bob 2.2s ease-in-out infinite}
@keyframes zq-pet-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
/* 伙伴详情层（复用 .zq-bigwrap/.zq-big 骨架） */
.zq-big .comp-ava{width:130px;height:130px;border-radius:50%;border:2.5px solid #4A3B2E;overflow:hidden}
.zq-big .comp-ava svg{width:100%;height:100%}
.zq-big .desc{font-size:14.5px;color:#8A7B6C;line-height:1.5;text-align:center}

@media (orientation:portrait){
  .zq-sheet-h .tt{font-size:19px}
  .zq-grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
  .zq-gc{font-size:30px}
  .zq-bunny{width:136px;height:136px;flex-basis:136px}
}

/* ========== 五·弹层（建设中占位 overlay / 星结算 / 迷雾仪式 / toast） ========== */
.zq-ov{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:rgba(74,59,46,.42);animation:zq-ov-in .3s ease}
.zq-ov.hide{display:none}
@keyframes zq-ov-in{from{opacity:0}to{opacity:1}}
.zq-ov .box{background:linear-gradient(180deg,#FFFDF6,#FFF1D8);border:3px solid #4A3B2E;border-radius:28px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.95),0 6px 0 #D8C9B4,0 14px 28px rgba(74,59,46,.16);
  padding:26px 34px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:86vw}
.zq-ov .box svg{width:110px;height:110px}
.zq-ov .t1{font-size:25px;font-weight:800}
.zq-ov .t2{font-size:16px;color:#8A7B6C}
#zq-toast{position:fixed;left:50%;bottom:128px;transform:translate(-50%,80px);z-index:70;
  background:linear-gradient(180deg,#FFFDF6,#FFF1D8);
  border:2.5px solid #4A3B2E;border-radius:18px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 4px 0 #D8C9B4;padding:10px 20px;
  font-size:16px;font-weight:700;transition:transform .3s ease;pointer-events:none}
#zq-toast.show{transform:translate(-50%,0)}

/* ===== 每日目标条（v56：今日冒险 N 关星槽——给当日收束感；达成不阻断继续玩） ===== */
#zq-goal{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#FFFDF6,#FFF1D8);
  border:2.5px solid #4A3B2E;border-radius:18px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 3px 0 #D8C9B4;padding:4px 14px;
  font-size:15px;font-weight:800;white-space:nowrap;pointer-events:none}
#zq-goal .g{width:22px;height:22px;flex:0 0 22px}
#zq-goal .g svg{width:22px;height:22px;display:block}
#zq-goal .g.off svg{opacity:.28;filter:grayscale(1)}
#zq-goal.full{background:linear-gradient(180deg,#FFF3C9,#FFE9A8)}
#zq-goal .fin{display:none;font-size:13px;color:#8A6A1F}
#zq-goal.full .fin{display:inline}

<!-- ========== 启动 loading 屏（v53：13MB 单文件国内 80KB/s 首载 2-3 分钟白屏 → 流式渲染
     此层在一切大 script 之前，浏览器收到前几 KB 即渲染。零 JS 纯 CSS（script 块数==4
     双断言不动）：文案 5 条 CSS 轮换 / 慢网提示 15s 后淡入 / 收尾+SW 注册由 game-main
     与 game-verify 尾部内联（__zqLoadingDone 幂等）。 ========== -->
<div id="zq-loading" aria-label="正在加载">
<style>
#zq-loading{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;background:#FBF6EC;transition:opacity .35s ease}
#zq-loading.done{opacity:0;pointer-events:none}
#zq-loading .bun{width:120px;height:120px;animation:zq-ld-hop 1.1s ease-in-out infinite}
@keyframes zq-ld-hop{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-22px) scale(.97,1.04)}
  60%{transform:translateY(0) scale(1.1,.88)}80%{transform:translateY(-7px) scale(.99,1.01)}}
#zq-loading .bar{width:min(64vw,300px);height:16px;border:2.5px solid #4A3B2E;border-radius:12px;
  background:#FFF9EE;overflow:hidden;box-shadow:inset 0 2px 0 rgba(255,255,255,.9)}
#zq-loading .bar i{display:block;height:100%;width:38%;border-radius:9px;
  background:linear-gradient(180deg,#F2A96B,#E8975A);animation:zq-ld-run 1.15s ease-in-out infinite}
@keyframes zq-ld-run{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
#zq-loading .txt{position:relative;width:100%;height:30px;text-align:center;font-size:21px;font-weight:800;color:#4A3B2E}
#zq-loading .txt span{position:absolute;left:0;right:0;opacity:0;animation:zq-ld-txt 15s linear infinite}
#zq-loading .txt span:nth-child(2){animation-delay:3s}
#zq-loading .txt span:nth-child(3){animation-delay:6s}
#zq-loading .txt span:nth-child(4){animation-delay:9s}
#zq-loading .txt span:nth-child(5){animation-delay:12s}
@keyframes zq-ld-txt{0%,19%{opacity:1}20%,100%{opacity:0}}   /* 每 3s 换一条（1/5 占空比） */
#zq-loading .slow{opacity:0;font-size:14px;color:#B0684A;max-width:78vw;text-align:center;line-height:1.6;
  animation:zq-ld-slow .6s ease 15s forwards}                /* 15s 未完成=慢网，淡入提示（防家长以为坏了） */
@keyframes zq-ld-slow{to{opacity:1}}
</style>
