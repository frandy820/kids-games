<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子的游戏屋 · 第二间</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FBF3E4;color:#4A3B2E;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:34px 22px}
  .logo{width:150px;height:150px}
  h1{font-size:clamp(26px,5vw,38px);letter-spacing:.05em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px;width:100%;max-width:760px}
  a.card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 24px;border-radius:26px;
         background:#FFF9EE;border:2.5px solid #4A3B2E;text-decoration:none;color:#4A3B2E;
         box-shadow:0 5px 0 #D8C9B4;transition:transform .2s}
  a.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
  @media (hover:hover){
    a.card:hover{transform:translateY(-4px);box-shadow:0 9px 0 #D8C9B4}
  }
  .card .icon{width:92px;height:92px}
  .card .name{font-size:22px;font-weight:700}
  .card .desc{font-size:14px;color:#8A7B6C;line-height:1.6;text-align:center}
  .foot{font-size:12.5px;color:#8A7B6C;text-align:center;line-height:1.8;max-width:520px}
</style>
</head>
<body>
  <div class="logo" id="logo"></div>
  <h1>小兔子的游戏屋 · 新游戏</h1>
  <div class="grid">
    <a class="card" href="memory/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="14" y="14" width="32" height="42" rx="8" fill="#E8B04F" stroke="#4A3B2E" stroke-width="2.5"/><rect x="54" y="14" width="32" height="42" rx="8" fill="#8A9BAE" stroke="#4A3B2E" stroke-width="2.5"/><rect x="14" y="62" width="32" height="24" rx="8" fill="#8FBF7F" stroke="#4A3B2E" stroke-width="2.5"/><rect x="54" y="62" width="32" height="24" rx="8" fill="#E8975A" stroke="#4A3B2E" stroke-width="2.5"/><circle cx="30" cy="35" r="6" fill="#FBF3E4" stroke="#4A3B2E" stroke-width="2"/><circle cx="70" cy="35" r="6" fill="#FBF3E4" stroke="#4A3B2E" stroke-width="2"/></svg></div>
      <div class="name">翻翻找朋友</div>
      <div class="desc">翻开小卡片<br>找到一样的两张</div>
    </a>
    <a class="card" href="tangram/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="14,86 50,50 86,86" fill="none" stroke="#4A3B2E" stroke-width="2.5" stroke-dasharray="5 4"/><polygon points="50,14 68,50 32,50" fill="#E8975A" stroke="#4A3B2E" stroke-width="2.5"/><polygon points="32,50 50,86 14,86" fill="#8FBF7F" stroke="#4A3B2E" stroke-width="2.5"/><polygon points="50,86 68,50 86,86" fill="#F2B8C6" stroke="#4A3B2E" stroke-width="2.5"/></svg></div>
      <div class="name">七巧板拼图</div>
      <div class="desc">拖一拖 转一转<br>把图形放进虚线里</div>
    </a>
    <a class="card" href="color/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="38" cy="38" r="24" fill="none" stroke="#4A3B2E" stroke-width="3"/><path d="M62 30 l24 14 -24 14 z" fill="#E8975A" stroke="#4A3B2E" stroke-width="2.5"/><rect x="12" y="70" width="28" height="18" rx="5" fill="#8FBF7F" stroke="#4A3B2E" stroke-width="2.5"/><circle cx="70" cy="78" r="9" fill="#F2B8C6" stroke="#4A3B2E" stroke-width="2.5"/></svg></div>
      <div class="name">小小涂色本</div>
      <div class="desc">点颜色 点图画<br>画出漂亮的画</div>
    </a>
  </div>
  <p class="foot">每天有新内容，玩完今天的小兔子会说"明天见"。<br>每款游戏右上角家长面板：进度 / 时长 / 今日多玩关数。<br>完全离线，无广告无内购，进度保存在本机。</p>

</body>
</html>
