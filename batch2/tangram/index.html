<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七巧板拼图</title>
<style>
/* ================= 七巧板拼图 tangram =================
   视觉按 DESIGN-SPEC §8：奶油暖白底、暖橙主色；块描边 2.5px 暖棕
   触摸目标：块 ≥64px（SVG 自适应舞台，2-7 块均远超）；间距 ≥16 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏：图标 + 就位进度 + 章节点 ---------- */
#hud{height:58px;flex:0 0 58px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:12px}
#logo{width:44px;height:44px;border-radius:12px;background:#8FBF7F;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
#prog{display:flex;gap:5px;align-items:center;flex:1 1 auto;flex-wrap:wrap;overflow:hidden}
#prog .mini{width:30px;height:30px;opacity:.24;transform:scale(.84);transition:all .35s cubic-bezier(.2,1.6,.4,1)}
#prog .mini.on{opacity:1;transform:scale(1)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：目标区(上) + 托盘带(下) 同一 SVG ---------- */
#stage{flex:1 1 auto;position:relative;overflow:hidden;min-height:120px;padding:4px 10px}
#board{width:100%;height:100%}
#board .trayband{fill:#F3E7CF;stroke:#D8C9B4;stroke-width:.06;rx:.4}
#board .slot{fill:none;stroke:#BCA98D;stroke-width:.09;stroke-dasharray:.32 .24;stroke-linejoin:round}
#board .slot.hintpulse{stroke:#E8975A;stroke-width:.14;animation:slot-pulse 1.1s ease 3}
@keyframes slot-pulse{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
#board .piece{cursor:grab}
#board .piece polygon{stroke:#4A3B2E;stroke-width:.09;stroke-linejoin:round;transition:filter .2s}
#board .piece polygon.hit{fill:transparent;stroke:none;pointer-events:all}
#board .piece.dragging{cursor:grabbing}
#board .piece.dragging polygon{filter:drop-shadow(0 .12 0 rgba(0,0,0,.18))}
#board .piece.placed polygon{stroke-width:.12}
#board .piece.wrongflash polygon{animation:wr .35s ease}
@keyframes wr{0%,100%{stroke:#4A3B2E}50%{stroke:#8A9BAE}}
#board .piece{transition:transform .28s cubic-bezier(.3,1.3,.4,1)}
#board .piece.dragging{transition:none}
#board .piece.demo{transition:transform .5s ease}
#board .piece.pulse polygon{animation:p-pulse 1s ease 2}
@keyframes p-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 .18 rgba(232,151,90,.9))}}

/* ---------- 底栏：小兔子 + 再玩一次 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 18px 16px;gap:16px}
#btn-rabbit{width:96px;height:96px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:78px;height:78px}
#btn-rabbit.hop{animation:hop .45s ease 2}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:44px;height:44px}

/* ---------- 幽灵手指教学 ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:40vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 宽屏（≥820px）：舞台限宽居中 */
@media (min-width:820px){
  #stage{max-width:900px;margin:0 auto;width:100%}
}
</style>
</head>

<body>
<div id="game" aria-label="七巧板拼图">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="prog" aria-label="本关就位进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <svg id="board" preserveAspectRatio="xMidYMid meet" aria-label="拼图舞台"></svg>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

  let name;
  if (flat < 20) name = STATIC_LEVELS[Math.floor(flat / CH_LEN)][flat % CH_LEN];
  else name = T7_POOL[(flat - 20) % T7_POOL.length];
  if (!TPL[name]) name = 'T7S';   // 模板缺失回退（保可玩，回退形本身严格连通）
  return { name, pcs: TPL[name] };
}
const GEN_HINTS = ['更大的拼图图形哦', '更多块块的挑战哦', '新的七巧板图形哦'];
function nextHint(ci) {
  if (ci == null) return '明天有' + GEN_HINTS[0];
  return (ci < 2 ? '块数更多的拼图哦' : '明天有' + GEN_HINTS[ci % GEN_HINTS.length]);
}

/* ================= tangram 引擎（纯函数，无 DOM） =================
   块状态 {i,t,x,y,r}：x,y=锚点（旋转后顶点 0 落点），r=45° 步数（0..7）
   解位 sol={x,y,r} 来自模板；吸附=质心距<0.6 单位 且 旋转外观等价（模 ROT_PERIOD）
   verify=1 的结构校验 / 吸附单元 / autoSolve 直驱全部只依赖本层 + game-data.js */
'use strict';

/* ---------- 几何 ---------- */
function rotPt(p, k) {
  const a = Math.PI / 4 * (k % 8), c = Math.cos(a), s = Math.sin(a);
  return [p[0] * c - p[1] * s, p[0] * s + p[1] * c];
}
/* 块（或模板条目）→ 绝对顶点列表（模板坐标系） */
function vertsOf(pc) {
  const vs = SHAPES[pc.t].map(p => rotPt(p, pc.r));
  const dx = pc.x - vs[0][0], dy = pc.y - vs[0][1];
  return vs.map(v => [v[0] + dx, v[1] + dy]);
}
function centroidOf(vs) {
  return [vs.reduce((s, v) => s + v[0], 0) / vs.length, vs.reduce((s, v) => s + v[1], 0) / vs.length];
}
function shoelace(vs) {
  let s = 0;
  for (let i = 0; i < vs.length; i++) {
    const a = vs[i], b = vs[(i + 1) % vs.length];
    s += a[0] * b[1] - b[0] * a[1];
  }
  return s / 2;
}
/* Sutherland-Hodgman 凸多边形交集面积（块全为凸）——重叠校验用 */
function overlapArea(A, B) {
  const cw = v => (shoelace(v) > 0 ? v.slice().reverse() : v);
  let out = cw(A);
  const cl = cw(B);
  const inside = (p, a, b) => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]) <= 1e-9;
  const isect = (p1, p2, a, b) => {
    const d1 = (b[0] - a[0]) * (p1[1] - a[1]) - (b[1] - a[1]) * (p1[0] - a[0]);
    const d2 = (b[0] - a[0]) * (p2[1] - a[1]) - (b[1] - a[1]) * (p2[0] - a[0]);
    if (Math.abs(d1 - d2) < 1e-12) return p2;
    const t = d1 / (d1 - d2);
    return [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])];
  };
  for (let i = 0; i < cl.length && out.length; i++) {
    const a = cl[i], b = cl[(i + 1) % cl.length], inp = out;
    out = [];
    for (let j = 0; j < inp.length; j++) {
      const cur = inp[j], prev = inp[(j + inp.length - 1) % inp.length];
      const ci = inside(cur, a, b), pi = inside(prev, a, b);
      if (ci) { if (!pi) out.push(isect(prev, cur, a, b)); out.push(cur); }
      else if (pi) out.push(isect(prev, cur, a, b));
    }
  }
  return out.length >= 3 ? Math.abs(shoelace(out)) : 0;
}
/* 旋转外观等价：等腰直角三角 8 步一圈但占位分 4 形 → 用周期表（同型同占位即等价） */
function rotEquiv(t, r, solR) {
  const p = ROT_PERIOD[t];
  return ((r - solR) % p + p) % p === 0;
}
/* ---------- 严格连通判据（与 _tools/solve7.py 同式）----------
   两块相邻 ⟺ 存在共线边段重叠长度 ≥0.15 单位（角对角点接触=视觉漂浮，不算）。
   旧池 bridge7/T7A/T7B 均以此判据实证不连通后移除；verify 对 ≥6 块模板强制断言。 */
function sharedEdgeLen(a1, a2, b1, b2) {
  const d1x = a2[0] - a1[0], d1y = a2[1] - a1[1], d2x = b2[0] - b1[0], d2y = b2[1] - b1[1];
  const L1 = Math.hypot(d1x, d1y), L2 = Math.hypot(d2x, d2y);
  if (L1 < 1e-6 || L2 < 1e-6) return 0;
  const n1x = d1x / L1, n1y = d1y / L1;
  if (Math.abs(n1x * d2x + n1y * d2y) < L2 - 1e-6) return 0;   // 不平行（阈值与 L2 比，勿用 max(L1,L2)）
  const dst = p => Math.abs(d1x * (p[1] - a1[1]) - d1y * (p[0] - a1[0])) / L1;
  if (dst(b1) > 1e-6 || dst(b2) > 1e-6) return 0;               // 不共线
  const t1 = (b1[0] - a1[0]) * n1x + (b1[1] - a1[1]) * n1y;
  const t2 = (b2[0] - a1[0]) * n1x + (b2[1] - a1[1]) * n1y;
  const lo = Math.min(t1, t2), hi = Math.max(t1, t2);
  return Math.max(0, Math.min(hi, L1) - Math.max(lo, 0));
}
function tplConnected(pcs, minShared) {
  if (minShared == null) minShared = 0.15;
  const E = pcs.map(pc => {
    const v = vertsOf(pc);
    return v.map((p, k) => [p, v[(k + 1) % v.length]]);
  });
  const par = pcs.map((_, i) => i);
  const find = i => { while (par[i] !== i) { par[i] = par[par[i]]; i = par[i]; } return i; };
  for (let i = 0; i < pcs.length; i++)
    for (let j = i + 1; j < pcs.length; j++)
      if (E[i].some(e1 => E[j].some(e2 => sharedEdgeLen(e1[0], e1[1], e2[0], e2[1]) >= minShared)))
        par[find(i)] = find(j);
  const roots = {};
  let n = 0;
  for (let i = 0; i < pcs.length; i++) { const r = find(i); if (!roots[r]) { roots[r] = 1; n++; } }
  return n === 1;
}
/* 吸附判定：质心距 < 0.6 单位 且 旋转等价 */
const SNAP_DIST = 0.6;
function snapCheck(pc, sol) {
  if (!rotEquiv(pc.t, pc.r, sol.r)) return false;
  const c1 = centroidOf(vertsOf(pc)), c2 = centroidOf(vertsOf({ t: pc.t, x: sol.x, y: sol.y, r: sol.r }));
  return Math.hypot(c1[0] - c2[0], c1[1] - c2[1]) < SNAP_DIST;
}

/* ---------- 关卡模型 ---------- */
/* 散布后把块的实际顶点包络夹回可视区（M4：块锚点在带内但 45° 转角下顶点可越界半幅） */
function clampIntoView(p, view, trayTop) {
  const vs = vertsOf(p);
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  vs.forEach(v => {
    if (v[0] < minX) minX = v[0]; if (v[0] > maxX) maxX = v[0];
    if (v[1] < minY) minY = v[1]; if (v[1] > maxY) maxY = v[1];
  });
  const loX = view.x + 0.15, hiX = view.x + view.w - 0.15;
  const loY = trayTop + 0.15, hiY = view.y + view.h - 0.15;
  if (minX < loX) p.x += loX - minX; else if (maxX > hiX) p.x -= maxX - hiX;
  if (minY < loY) p.y += loY - minY; else if (maxY > hiY) p.y -= maxY - hiY;
}
/* makeLevel(flat)：确定性（mulberry32(flat*7919+13)）
   返回 {flat, name, pieces:[{i,t,x,y,r,sol,placed}], view:{x,y,w,h}, moves, minMoves, trayTop}
   view=模板包围盒外扩 + 下方托盘带（散布与目标同坐标系，拖动无换算）
   托盘宽下限 = 块数×2.0+1.6（7 块关模板 bbox 常窄于托盘需要宽度，须扩宽防叠死）；
   散布：n≤3 单排 / n≥4 两排（M4 修复 n=2 同列）；初始转角保证非解转；
   minMoves = 块数 + Σ每块转到解位等价角的最少点转数（M3 星级基线，完美玩法 extra=0） */
function makeLevel(flat) {
  const tpl = tplOf(flat);
  const n = tpl.pcs.length;
  const vs = tpl.pcs.map(vertsOf);
  const xs = [], ys = [];
  vs.forEach(v => v.forEach(p => { xs.push(p[0]); ys.push(p[1]); }));
  const bx = Math.min.apply(null, xs), by = Math.min.apply(null, ys);
  const bw = Math.max.apply(null, xs) - bx, bh = Math.max.apply(null, ys) - by;
  const PAD = 0.8;
  const vw = Math.max(bw + PAD * 2, Math.min(13.5, n * 2.0 + 1.6));
  const view = { x: bx + bw / 2 - vw / 2, y: by - PAD, w: vw, h: bh + PAD + 6.6 }; // 以模板中心对齐 view 中心
  const trayTop = by + bh + 0.55;                    // 托盘带顶（渲染层用同一几何）
  const rnd = mulberry32(flat * 7919 + 13);
  const cols = n <= 3 ? n : Math.ceil(n / 2);        // M4：n=2 时两列（旧式两行同列已修）
  const pieces = tpl.pcs.map((pc, i) => {
    let r = (pc.r + 1 + Math.floor(rnd() * 7)) % 8;  // 确定性散布（同 flat 同布局）；1..7 非零偏转
    if (((r - pc.r) % ROT_PERIOD[pc.t] + ROT_PERIOD[pc.t]) % ROT_PERIOD[pc.t] === 0) r = (r + 1) % 8; // 保证非解转
    const p = {
      i, t: pc.t, x: 0, y: 0, r,
      sol: { x: pc.x, y: pc.y, r: pc.r },
      placed: false
    };
    const colI = i % cols, row = Math.floor(i / cols);
    p.x = view.x + 1.1 + (vw - 2.2) * (cols === 1 ? 0.5 : colI / (cols - 1)) + (rnd() - 0.5) * 0.4;
    p.y = trayTop + 0.65 + row * 2.1 + rnd() * 0.4;
    clampIntoView(p, view, trayTop);
    return p;
  });
  let minMoves = n;                                  // 每块至少一次落手
  pieces.forEach(p => {
    minMoves += ((p.sol.r - p.r) % ROT_PERIOD[p.t] + ROT_PERIOD[p.t]) % ROT_PERIOD[p.t];
  });
  return { flat, name: tpl.name, pieces, view, moves: 0, minMoves, trayTop, swapped: null };
}

/* ---------- 操作（UI 与 autoSolve 共用；moves 供星级） ---------- */
function engRotate(L, i) {          // 点转 45°（顺时针视觉）
  const p = L.pieces[i];
  if (!p || p.placed) return false;
  p.r = (p.r + 1) % 8;
  L.moves++;
  return true;
}
function engDrag(L, i, x, y) {      // 拖放到锚点 (x,y)（单位坐标）——被拖离即解除已就位
  const p = L.pieces[i];
  if (!p) return false;
  p.x = x; p.y = y;
  if (p.placed) { p.placed = false; }
  L.moves++;
  return true;
}
function engDrop(L, i) {            // 落手：尝试吸附（就近吸附到位=咔哒；不吸附=留在原地，永不锁死）
  const p = L.pieces[i];
  if (!p) return false;
  if (snapCheck(p, p.sol)) {
    p.x = p.sol.x; p.y = p.sol.y; p.r = p.sol.r;
    p.placed = true;
    return true;
  }
  /* 同型互换（M2）：模板里同型块视觉无差，孩子不分辨块身份——放到"另一块的位置"时
     就近吸附并互换解位（两块同型 ⇒ 虚线槽外观相同，仅槽与块的配对对调，视觉无感） */
  const q = L.pieces.find(qq => qq.i !== i && !qq.placed && qq.t === p.t && snapCheck(p, qq.sol));
  if (q) {
    const tmp = p.sol; p.sol = q.sol; q.sol = tmp;
    p.x = p.sol.x; p.y = p.sol.y; p.r = p.sol.r;
    p.placed = true;
    L.swapped = [i, q.i];           // UI 需同步重画两块对应虚线槽
    return true;
  }
  return false;
}
function engPlace(L, i) {           // 验收/教学：直接放到解位并吸附（内部走同一判定）
  const p = L.pieces[i];
  if (!p) return false;
  p.x = p.sol.x; p.y = p.sol.y; p.r = p.sol.r;
  const ok = engDrop(L, i);
  if (!ok) L.moves++;               // 未吸附也算一次操作（异常兜底）
  return ok;
}
function engWon(L) { return L.pieces.every(p => p.placed); }
function engPlacedCount(L) { return L.pieces.filter(p => p.placed).length; }
/* 星级：多余操作（moves − minMoves；minMoves=块数+必需点转数，见 makeLevel）
   ≤2 → 3 星；≤5 → 2 星；否则 1 星。永不 0 星 */
function engStars(L) {
  const extra = L.moves - (L.minMoves || L.pieces.length);
  return extra <= 2 ? 3 : extra <= 5 ? 2 : 1;
}

   块 g transform = translate(x,y) rotate(r*45°)（顶点 0=锚点，与引擎数学一致） */
function buildBoard() {
  svgEl.setAttribute('viewBox', [cur.view.x, cur.view.y, cur.view.w, cur.view.h].join(' '));
  svgEl.innerHTML = '';
  const band = document.createElementNS(SVGNS, 'rect');
  band.setAttribute('class', 'trayband');
  band.setAttribute('x', cur.view.x + 0.35);
  band.setAttribute('y', cur.trayTop);

  band.setAttribute('height', cur.view.y + cur.view.h - cur.trayTop - 0.5);
  band.setAttribute('rx', 0.4);
  svgEl.appendChild(band);

  const gSlots = document.createElementNS(SVGNS, 'g');
  svgEl.appendChild(gSlots);
  const gPieces = document.createElementNS(SVGNS, 'g');
  svgEl.appendChild(gPieces);

  cur.pieces.forEach(p => {
    const sol = document.createElementNS(SVGNS, 'polygon');
    sol.setAttribute('class', 'slot');
    sol.setAttribute('points', SHAPES[p.t].map(v => v[0] + ',' + v[1]).join(' '));
    sol.setAttribute('transform', 'translate(' + p.sol.x + ',' + p.sol.y + ') rotate(' + p.sol.r * 45 + ')');
    sol.setAttribute('data-slot', p.i);
    gSlots.appendChild(sol);

    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'piece');
    g.setAttribute('data-piece', p.i);
    g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ') rotate(' + p.r * 45 + ')');
    const poly = document.createElementNS(SVGNS, 'polygon');
    poly.setAttribute('points', SHAPES[p.t].map(v => v[0] + ',' + v[1]).join(' '));
    poly.setAttribute('fill', PIECE_COL[p.t]);
    g.appendChild(poly);
    /* M5：透明命中外扩（小三角形裸尺寸不足 64px 触摸目标）。用几何外扩矩形而非 stroke 加宽
       （CSS stroke-width 数字=px 非用户单位，且 getBoundingClientRect 不含 stroke——实测两坑） */
    let mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9;
    SHAPES[p.t].forEach(v => {
      if (v[0] < mnx) mnx = v[0]; if (v[0] > mxx) mxx = v[0];
      if (v[1] < mny) mny = v[1]; if (v[1] > mxy) mxy = v[1];
    });
    const HM = 0.55;                  // 每侧外扩 0.55 单位（≥64px 由 verify 布局断言把关）
    const hit = document.createElementNS(SVGNS, 'polygon');
    hit.setAttribute('points', (mnx - HM) + ',' + (mny - HM) + ' ' + (mxx + HM) + ',' + (mny - HM) + ' ' +
      (mxx + HM) + ',' + (mxy + HM) + ' ' + (mnx - HM) + ',' + (mxy + HM));
    hit.setAttribute('class', 'hit');
    g.appendChild(hit);
    gPieces.appendChild(g);
  });
  renderAll();
}
function pieceEl(i) { return svgEl.querySelector('.piece[data-piece="' + i + '"]'); }

/* 教玩观察 P1：点转绕锚点顶点旋转可把块甩出视区（出屏后点不到=自救困难），转完拉回。
   纯数学算终态 bbox，不量 DOM——.piece 有 transition:transform .28s，getBoundingClientRect
   量到的是过渡中途位置；也不用引擎 clampIntoView（vertsOf 锚点约定与渲染 transform 差 -R(v0)） */
function clampPieceIntoView(i) {
  if (!cur) return;

  const rad = p.r * Math.PI / 4, cs = Math.cos(rad), sn = Math.sin(rad);
  let a = 1e9, b = 1e9, c = -1e9, d = -1e9;              // SHAPES 局部 bbox
  SHAPES[p.t].forEach(v => {
    if (v[0] < a) a = v[0]; if (v[0] > c) c = v[0];
    if (v[1] < b) b = v[1]; if (v[1] > d) d = v[1];
  });
  const HM = 0.55, M = 0.1;                               // 命中外扩（buildBoard 同值）+ 视区边距
  const pts = SHAPES[p.t].concat([[a - HM, b - HM], [c + HM, b - HM], [c + HM, d + HM], [a - HM, d + HM]]);
  let mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9;
  pts.forEach(v => {
    const x = v[0] * cs - v[1] * sn, y = v[0] * sn + v[1] * cs;   // 渲染约定：world = R(v) + (p.x,p.y)
    if (x < mnx) mnx = x; if (x > mxx) mxx = x;
    if (y < mny) mny = y; if (y > mxy) mxy = y;
  });
  let dx = 0, dy = 0;
  if (mnx + p.x < cur.view.x + M) dx = cur.view.x + M - (mnx + p.x);
  else if (mxx + p.x > cur.view.x + cur.view.w - M) dx = cur.view.x + cur.view.w - M - (mxx + p.x);
  if (mny + p.y < cur.view.y + M) dy = cur.view.y + M - (mny + p.y);
  else if (mxy + p.y > cur.view.y + cur.view.h - M) dy = cur.view.y + cur.view.h - M - (mxy + p.y);
  if (dx || dy) { p.x += dx; p.y += dy; renderPiece(i); }
}
function renderProg() { // 顶栏就位进度：本关每块小形状，就位点亮
  const tray = $id('prog');
  tray.innerHTML = '';
  cur.pieces.forEach(p => {
    const d = document.createElement('div');
    d.className = 'mini' + (p.placed ? ' on' : '');
    const mx = Math.max.apply(null, SHAPES[p.t].map(v => v[0]));
    const my = Math.max.apply(null, SHAPES[p.t].map(v => v[1]));
    const myn = Math.min.apply(null, SHAPES[p.t].map(v => v[1]));
    d.innerHTML = '<svg viewBox="' + [-0.2, myn - 0.2, mx + 0.4, my - myn + 0.4].join(' ') + '" width="30" height="30">' +
      '<polygon points="' + SHAPES[p.t].map(v => v[0] + ',' + v[1]).join(' ') + '" fill="' + PIECE_COL[p.t] + '" stroke="#4A3B2E" stroke-width=".12"/></svg>';
    tray.appendChild(d);
  });
}

const ghost = {

  show(reason) { ghostReason = reason; ghostEl.classList.add('show'); },

/* ================= 指针交互：拖动 / 短按点转 ================= */
let drag = null;   // {i, offX, offY, sx, sy, moved}
function toUnit(e) {
  const pt = svgEl.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const m = svgEl.getScreenCTM();
  if (!m) return null;
  const p = pt.matrixTransform(m.inverse());
  return [p.x, p.y];
}
svgEl.addEventListener('pointerdown', e => {
  if (!cur || state.locked || state.won || state.demo) return;
  const g = e.target.closest('.piece');
  if (!g) return;
  e.preventDefault();
  const i = Number(g.getAttribute('data-piece'));
  const p = cur.pieces[i];
  if (p.placed) { p.placed = false; renderPiece(i); renderProg(); }   // 拿起已就位块=重新开始摆（教玩观察 P2：进度盘同步熄灭）
  const u = toUnit(e);
  if (!u) return;
  lastAct = Date.now();
  hideScaffold();
  try { svgEl.setPointerCapture(e.pointerId); } catch (err) {}  // 拖出 SVG 边界仍收 move/up
  svgEl.appendChild(g);                                   // 提到最上层
  g.classList.add('dragging');
  drag = { i, offX: u[0] - p.x, offY: u[1] - p.y, sx: e.clientX, sy: e.clientY, moved: false };
  if (ghostReason === 'tut') { const s = slotEl(i); if (s) ghost.toEl(s); }   // 教玩观察 P2：块被抓走后手指改指目标轮廓槽（原指空托盘位）
  sfx('click');
});
svgEl.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = cur.pieces[drag.i], u = toUnit(e);
  if (!u) return;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
  if (!drag.moved) return;                                // 未超阈值不动（阈值内=点转）
  p.x = u[0] - drag.offX; p.y = u[1] - drag.offY;
  renderPiece(drag.i);
});
function endDrag(e) {
  if (!drag) return;
  const { i, moved } = drag;
  const g = pieceEl(i);
  if (g) g.classList.remove('dragging');
  drag = null;
  const p = cur.pieces[i];
  if (!moved) {                                            // 短按=旋转 45°
    engRotate(cur, i);
    renderPiece(i);
    clampPieceIntoView(i);   // 教玩观察 P1：点转绕锚点顶点可把块甩出视区（出屏后点不到=自救困难），转完按渲染 bbox 拉回
    sfx('pop');
    trySnap(i);
    return;
  }
  engDrag(cur, i, p.x, p.y);                              // 计一次拖放操作
  trySnap(i);
}
svgEl.addEventListener('pointerup', endDrag);

/* 落手吸附尝试：成就位（ok 音+落位动画）；不成就轻微摆动提示（无惩罚，可重放） */

const HINTS = { 1: '块数更多的图形哦', 2: '五块的大图形来啦', 3: '七块的经典七巧板哦' };
function nextHint(ci) {
  if (ci == null) ci = Math.floor(KIDS.calendar.limit(Infinity) / CH_LEN);
  if (ci >= 4) return '明天有' + GEN_HINTS[(ci - 4) % GEN_HINTS.length];
  return HINTS[ci] || '有新的拼图哦';
}
function winFlow() {
  state.won = true; state.locked = true;

  sfx('win');
  KIDS.ui.celebrate(stars).then(() => {
    const ci = Math.floor(cur.flat / CH_LEN), ch = ci + 1, lv = cur.flat % CH_LEN;
    const pr = KIDS.level.pass(ch, lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);   // 关卡无限：日历不设内容上限（每日新关+家长加关由 core 控制）
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: ch, stars: stars5, nextHint: nextHint(ci + 1) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });

}

/* ================= ?verify=1 自检 =================
   ① 25 关（静态 20 + 生成 20-24 抽查）结构校验：确定性 / 块型多重集=模板 / 块间无重叠（SH 交集）/
      ≥6 块模板严格连通（tplConnected 共享边判据，M7）/ 散布块顶点全在视区内（M4 clamp）
   ② 吸附判定单元：正例 6（解位邻域+旋转等价）/ 负例 6（偏移过大 或 非等价转角）
   ②b 同型互换单元（M2）：A 放到 B 解位 → 互换吸附成立；B 再放已换解位 → 全就位
   ②c 星级单元（M3）：完美玩法=3 星 / +3 废操作=2 星 / +6 废操作=1 星
   ③ autoSolve 引擎直驱 25 关：每块转正+落位 → 全部就位（won）
   ④ 布局抽查：mountain2 与 T7S 实建 DOM，最小块命中区（含 .hit 透明外扩）≥64px、无横向溢出 */
function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {};
  let npass = 0, total = 0;
  const strip = L => ({ name: L.name, view: L.view, pieces: L.pieces.map(p => [p.t, +p.x.toFixed(6), +p.y.toFixed(6), p.r]) });
  for (let flat = 0; flat < 25; flat++) {
    total++;
    const L1 = makeLevel(flat), L2 = makeLevel(flat);
    const det = JSON.stringify(strip(L1)) === JSON.stringify(strip(L2));
    const tpl = tplOf(flat);
    const ms1 = L1.pieces.map(p => p.t).sort().join(',');
    const ms2 = tpl.pcs.map(p => p.t).sort().join(',');
    const setOk = ms1 === ms2;
    let noOverlap = true, ovDetail = '';
    const vs = tpl.pcs.map(vertsOf);
    for (let a = 0; a < vs.length && noOverlap; a++)
      for (let b = a + 1; b < vs.length && noOverlap; b++) {
        const ov = overlapArea(vs[a], vs[b]);
        if (ov > 0.02) { noOverlap = false; ovDetail = a + '/' + b + '=' + ov.toFixed(3); }
      }
    const solved = (() => {          // autoSolve 直驱：转正（模拟点转）+ 落位吸附
      L1.pieces.forEach(p => {
        const per = ROT_PERIOD[p.t];
        let clicks = ((p.sol.r - p.r) % per + per) % per;
        while (clicks-- > 0) engRotate(L1, p.i);
        engPlace(L1, p.i);
      });
      return engWon(L1);
    })();
    /* M7：≥6 块模板强制严格连通（章 1/2 简单形相邻接于轮廓点，不适用共享边判据，不断言） */
    const conn = tpl.pcs.length >= 6 ? tplConnected(tpl.pcs) : true;
    /* M4：散布后每块全部顶点须在视区内（clamp 生效证明） */
    let inView = true, oobDetail = '';
    L1.pieces.forEach(p => vertsOf(p).forEach(v => {
      if (v[0] < L1.view.x - 0.001 || v[0] > L1.view.x + L1.view.w + 0.001 ||
          v[1] < L1.view.y - 0.001 || v[1] > L1.view.y + L1.view.h + 0.001) {
        inView = false; oobDetail = 'p' + p.i + '@' + v[0].toFixed(1) + ',' + v[1].toFixed(1);
      }
    }));
    const ok = det && setOk && noOverlap && solved && conn && inView;
    if (ok) npass++;
    const rec = { name: L1.name, pieces: L1.pieces.length, deterministic: det, setOk, noOverlap, solved, conn, inView, ok, ovDetail, oobDetail };
    if (flat < 20) levels[keyOf(flat)] = rec; else gen[flat] = Object.assign({ key: keyOf(flat) }, rec);
  }
  /* 单元：吸附判定正负例（mountain2 模板 + T7S 模板各取块） */
  total++;
  const cases = [];
  const t1 = TPL.mountain2, t7 = TPL.T7S;
  for (let k = 0; k < 6; k++) {      // 正例：块视觉对齐解位（质心微扰<0.3）+ 等价整圈旋转（对称形锚点随转角偏移，按质心反推）
    const src = k < 3 ? t1 : t7;
    const pc = src[k % src.length];
    const r2 = (pc.r + ROT_PERIOD[pc.t]) % 8;
    const cSol = centroidOf(vertsOf({ t: pc.t, x: pc.x, y: pc.y, r: pc.r }));
    const cRot = centroidOf(SHAPES[pc.t].map(v => rotPt(v, r2)));   // r2 朝向下质心的形状局部偏移
    const jx = 0.2 * (k % 2 ? 1 : -1), jy = 0.2 * (k % 2 ? -1 : 1);
    const p = { t: pc.t, x: cSol[0] + jx - cRot[0], y: cSol[1] + jy - cRot[1], r: r2 };
    cases.push({ want: true, got: snapCheck(p, pc), tag: 'pos' + k });
  }
  for (let k = 0; k < 6; k++) {      // 负例：偏移 1.2（超阈）或 非等价转角
    const src = k < 3 ? t1 : t7;
    const pc = src[k % src.length];
    const p = k % 2
      ? { t: pc.t, x: pc.x, y: pc.y, r: (pc.r + 1) % 8 }
      : { t: pc.t, x: pc.x + 1.2, y: pc.y + 1.2, r: pc.r };
    cases.push({ want: false, got: snapCheck(p, pc), tag: 'neg' + k });
  }
  const snapOk = cases.every(c => c.got === c.want);
  if (snapOk) npass++;
  units.snap = { ok: snapOk, cases };
  /* 单元：同型互换（M2）——T7S 两块 LT：A 放到 B 的解位 → 互换吸附；B 再放已换解位 → 全就位 */
  total++;
  const Ls = makeLevel(10);
  const pa = Ls.pieces.find(p => p.t === 'LT'), pb = Ls.pieces.find(p => p.t === 'LT' && p.i !== pa.i);
  const solA0 = pa.sol, solB0 = pb.sol;
  pa.r = pb.sol.r; pa.x = pb.sol.x; pa.y = pb.sol.y;
  const swapStep1 = engDrop(Ls, pa.i) && pa.placed && pa.sol === solB0 && pb.sol === solA0 &&
                    Ls.swapped && Ls.swapped.indexOf(pa.i) >= 0 && Ls.swapped.indexOf(pb.i) >= 0;
  Ls.pieces.forEach(p => engPlace(Ls, p.i));
  const swapOk = swapStep1 && engWon(Ls);
  if (swapOk) npass++;
  units.swap = { ok: swapOk, step1: swapStep1, won: engWon(Ls) };
  /* 单元：星级基线（M3）——完美玩法 moves==minMoves→3 星；+3 废操作→2 星；+6 废操作→1 星 */
  total++;
  const playLevel = (flat, waste) => {
    const L = makeLevel(flat);
    L.pieces.forEach((p, k) => {
      for (let w = 0; w < waste && k === 0; w++) {   // 废操作：拖到远处放手（不吸附不算就位）
        engDrag(L, p.i, p.sol.x + 5.5, p.sol.y + 5.5);
        engDrop(L, p.i);
      }
      const c = ((p.sol.r - p.r) % ROT_PERIOD[p.t] + ROT_PERIOD[p.t]) % ROT_PERIOD[p.t];
      for (let u = 0; u < c; u++) engRotate(L, p.i);
      /* 按质心对齐构造落点（SQ/PA 等价转角下锚点随转角偏移，锚点对锚点会差 √2 — 已知坑） */
      const cSol = centroidOf(vertsOf({ t: p.t, x: p.sol.x, y: p.sol.y, r: p.sol.r }));
      const cRot = centroidOf(vertsOf({ t: p.t, x: 0, y: 0, r: p.r }));
      engDrag(L, p.i, cSol[0] - cRot[0], cSol[1] - cRot[1]);
      engDrop(L, p.i);
    });
    return { won: engWon(L), moves: L.moves, min: L.minMoves, stars: engStars(L) };
  };
  const g0 = playLevel(10, 0), g3 = playLevel(10, 3), g6 = playLevel(10, 6);
  const starsOk = g0.won && g0.moves === g0.min && g0.stars === 3 &&
                  g3.won && g3.moves === g3.min + 3 && g3.stars === 2 &&
                  g6.won && g6.moves === g6.min + 6 && g6.stars === 1;
  if (starsOk) npass++;
  units.stars = { ok: starsOk, perfect: g0, waste3: g3, waste6: g6 };
  /* 布局抽查：mountain2（2 块，flat=0）与 T7S（7 块，flat=10）实建 DOM 量最小块命中区（含 .hit 外扩） */
  const layout = {};
  let layoutOk = true;
  [0, 10].forEach(flat => {
    cur = makeLevel(flat);
    buildBoard();
    let minA = 1e9;
    cur.pieces.forEach(p => {
      const el = pieceEl(p.i);
      if (el) {
        const r = el.getBoundingClientRect();   // g 的 bbox 含透明命中描边带=真实触摸目标
        minA = Math.min(minA, Math.min(r.width, r.height));
      }
    });
    const de = document.documentElement;
    layout['flat' + flat] = { name: cur.name, minHit: Math.round(minA), overflowX: de.scrollWidth - window.innerWidth };
    if (minA < 64 || de.scrollWidth - window.innerWidth > 0) layoutOk = false;
  });
  const out = { game: 'tangram', total, pass: npass, layoutOk, layout, levels, gen, units };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

/* ================= 启动 ================= */
buildStatic();
if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function() {};
  KIDS.audio.sfx = function() {};
  KIDS.speak = function() {};
  KIDS.voice.play = function() {};
  KIDS.voice.queue = function() {};
  runVerify();
} else {
  KIDS.init({ game: 'tangram', title: '七巧板拼图' });
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  let first = 0;
  for (let i = 0; i < lim; i++) { if (!sv.levels[keys[i]]) { first = i; break; } }
  if (KIDS.calendar.dayDone(keys)) { // 今日新关已玩完：先收尾画面（可关闭继续重玩）
    KIDS.ui.dayEnd({ nextHint: nextHint(null) });
    first = 0;
  }
  startLevel(first);
}

/* ================= 验收钩子 ================= */
async function autoSolveExec(plan) {
  for (const st of plan) {
    if (state.won) break;
    for (let c = 0; c < st.clicks; c++) {          // 模拟点转（短按）
      engRotate(cur, st.i);
      renderPiece(st.i);
      await wait(120);
    }
    const p = cur.pieces[st.i];                     // 模拟拖放到解位（吸附动画）
    p.x = p.sol.x; p.y = p.sol.y; p.r = p.sol.r;
    engDrop(cur, st.i);
    renderPiece(st.i);
    renderProg();
    await wait(150);
    if (cur.pieces[st.i].placed) sfx('ok');
  }
}
window.TAN = {
  get currentLevel() {
    return cur ? {
      flat: cur.flat,
      ch: Math.floor(cur.flat / CH_LEN) + 1,        // 章号 1 基
      lv: cur.flat % CH_LEN,
      name: cur.name, pieces: cur.pieces.length,
      placed: engPlacedCount(cur), moves: cur.moves
    } : null;
  },
  get pieces() {
    return cur ? cur.pieces.map(p => ({
      i: p.i, t: p.t, x: p.x, y: p.y, r: p.r, placed: p.placed,
      solX: p.sol.x, solY: p.sol.y, solR: p.sol.r,
      equiv: rotEquiv(p.t, p.r, p.sol.r),
      clicksToSol: ((p.sol.r - p.r) % ROT_PERIOD[p.t] + ROT_PERIOD[p.t]) % ROT_PERIOD[p.t]
    })) : [];
  },
  rotate(i) { engRotate(cur, i); renderPiece(i); return cur.pieces[i].r; },
  place(i, x, y) { const p = cur.pieces[i]; p.x = x; p.y = y; const ok = engDrop(cur, i); renderPiece(i); renderProg(); if (ok && engWon(cur)) winFlow(); return ok; },
  async autoSolve(exec) {
    const plan = cur.pieces.map(p => ({ i: p.i, clicks: ((p.sol.r - p.r) % ROT_PERIOD[p.t] + ROT_PERIOD[p.t]) % ROT_PERIOD[p.t] }));
    if (exec) await autoSolveExec(plan);
    else { cur.pieces.forEach(p => engPlace(cur, p.i)); }   // 引擎直驱（verify 用）
    return plan;
  },
  get tutorial() { return state.tut; }
};
