<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数数小鸡</title>
<style>
/* ================= 数数小鸡 countchick（batch5）r19 难度改造版 ================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、草地浅绿 #E6EFD2、暖橙主色、灰蓝错误色（不用大红）
   触摸目标：小鸡热区 ≥64、答案按钮 ≥96×96、"重新数/再看一眼" ≥72 高；间距 ≥16；
   pointerdown 即响应；小鸡位置由 JS 撒点（中心距 ≥90px 防重叠不可点）
   r19 新面：十加几 ten-chip（满 10 后 10+n 结构化锚）/ 两群 tally 并排 / flash 草丛遮盖呈现 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：草地 + 题面 + 答案 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 10px}
/* 草地：浅绿圆角场 + 内嵌装饰草丛小花（低干扰不响应点击） */
#field{position:relative;width:100%;max-width:1180px;flex:1 1 auto;min-height:200px;
  background:linear-gradient(180deg,#EDF4DC 0%,#E2ECCB 60%,#DCE7C2 100%);
  border:3px solid #C9D8A8;border-radius:26px;overflow:hidden;
  box-shadow:inset 0 0 0 6px rgba(255,249,238,.5)}
#field .grass{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.9}
/* flash 快数：呈现期结束草丛"长高"遮盖（chicks 隐去，估计作答） */
#field .cover{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;
  background:linear-gradient(180deg,rgba(201,216,168,0) 0%,rgba(183,204,142,.55) 45%,rgba(160,188,116,.9) 100%)}
#field.hid .cover{opacity:1}

/* ---------- 场上动物（小鸡/小鸭/小兔）：绝对定位按钮，尺寸/坐标由 JS 撒点 ---------- */
.animal{position:absolute;padding:0;border:none;background:none;transform-origin:50% 88%;
  transition:opacity .35s;will-change:transform}
.animal svg{width:100%;height:100%;pointer-events:none}
.animal.chick{filter:drop-shadow(0 3px 0 rgba(201,216,168,.55))}
#field.hid .animal{opacity:0;pointer-events:none}
/* 跳一下（点数反馈；transform 由 keyframes 接管，不影响布局测量） */
.animal.hop{animation:an-hop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes an-hop{0%,100%{transform:translateY(0) scale(var(--s,1))}40%{transform:translateY(-16%) scale(var(--s,1))}}
/* 干扰动物被点：摆头摆脑（零惩罚，不计数） */
.animal.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0) scale(var(--s,1))}25%{transform:rotate(-7deg) scale(var(--s,1))}
  55%{transform:rotate(6deg) scale(var(--s,1))}80%{transform:rotate(-3deg) scale(var(--s,1))}}
/* 计数角标：头顶序号圆片（点过即显，"重新数"清零） */
.animal .badge{position:absolute;top:-9%;right:-7%;min-width:34px;height:34px;padding:0 5px;
  border-radius:17px;background:#FFF9EE;border:3px solid #E8975A;color:#4A3B2E;
  font-size:21px;font-weight:800;display:none;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;box-shadow:0 2px 0 #D8C9B4;pointer-events:none;z-index:3}
.animal .badge.on{display:flex;animation:badge-pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes badge-pop{from{transform:scale(0) rotate(-18deg)}to{transform:scale(1) rotate(0)}}
/* compare 章：小鸭角标蓝灰描边（与小鸡橙色区分，双群各自数） */
.animal.duck .badge{border-color:#8A9BAE}
.animal.pulse{animation:an-pulse 1s ease 2}
@keyframes an-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px rgba(232,151,90,.95))}}

/* ---------- 题面行：问句 chip + ten-chip + 再看一眼 + 重新数 ---------- */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  min-height:78px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:14px;padding:6px 26px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4}
#prompt-chip .big{font-size:34px;font-weight:800;color:#4A3B2E;line-height:1.2}
#prompt-chip .sub{display:none;font-size:16px;font-weight:700;color:#8A7B6C}
#prompt-chip.mix .sub{display:block}
#prompt-chip svg{width:46px;height:46px}
/* 两群并排 tally：小鸡/小鸭各自清点进度（compare 章，防数格子捷径=排列随机化靠撒点） */
#prompt-chip .tally{display:none;gap:18px;margin-top:2px}
#prompt-chip.cmp .tally{display:flex}
#prompt-chip .tally .t{display:flex;align-items:center;gap:7px;font-size:25px;font-weight:800;
  color:#4A3B2E;font-variant-numeric:tabular-nums}
#prompt-chip .tally .t svg{width:36px;height:36px}
/* 十加几结构化锚（count 章 _cnt≥10 显示「10 + 余数」，教学法：先数 10 再数余数） */
#ten-chip{display:none;align-items:center;gap:6px;min-height:64px;padding:0 20px;border-radius:20px;
  background:#FFF3D6;border:2.5px solid #E8975A;box-shadow:0 4px 0 #D8C9B4;
  font-size:30px;font-weight:800;color:#4A3B2E;font-variant-numeric:tabular-nums}
#ten-chip.on{display:flex;animation:ten-pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes ten-pop{from{transform:scale(.6) rotate(-6deg)}to{transform:scale(1) rotate(0)}}
#btn-recount{display:flex;align-items:center;gap:9px;min-height:72px;padding:0 24px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;
  font-size:22px;font-weight:800;color:#4A3B2E;transition:transform .15s}
#btn-recount:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-recount svg{width:40px;height:40px}
#btn-recount.bounce{animation:recount-b .4s ease}
@keyframes recount-b{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#btn-recount.hidden{display:none}
/* flash 章「再看一眼」：重播呈现窗（零惩罚，每次重播同窗长仍数不完=估计任务保真） */
#btn-resee{display:none;align-items:center;gap:9px;min-height:72px;padding:0 22px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;
  font-size:22px;font-weight:800;color:#4A3B2E;transition:transform .15s}
#btn-resee:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-resee svg{width:40px;height:40px}
#btn-resee.on{display:flex}
#btn-resee.bounce{animation:recount-b .4s ease}

/* ---------- 答案大按钮（主触摸目标 ≥96） ---------- */
#answers{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:2px 12px;min-height:96px}
.opt{min-width:132px;min-height:96px;padding:0 26px;border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;font-size:44px;font-weight:800;color:#4A3B2E;
  font-variant-numeric:tabular-nums;transition:transform .15s,box-shadow .15s;position:relative}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
.opt.right{background:#8FBF7F;color:#4A3B2E;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.opt.right .mark{position:absolute;top:-13px;right:-13px;width:40px;height:40px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.opt.right .mark svg{width:26px;height:26px}
@keyframes opt-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.opt.wrong{background:#EFE3CD;color:#B7AA96;border-color:#C9BDA8;box-shadow:0 3px 0 #C9BDA8;
  opacity:.55;pointer-events:none}
.opt.wrong{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.opt.pulse{animation:opt-pulse 1s ease 2}
@keyframes opt-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}
/* 吞输入容器 bump（家族 D：吞点轻叮必配 bump，替代无声拒绝） */
.bump{animation:cont-bump .32s ease}
@keyframes cont-bump{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}60%{transform:translateX(7px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch4 clock） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：答案按钮与题面适配（草地按 stage 实际宽高撒点，无需改） */
@media (orientation:portrait){
.opt{min-width:150px;min-height:104px;font-size:50px}
#prompt-chip .big{font-size:30px}
#ten-chip{font-size:26px;min-height:56px}
#prompt-chip .tally .t{font-size:20px}
}
/*PORT-CLS*/
body.port .opt{min-width:150px;min-height:104px;font-size:50px}
body.port #prompt-chip .big{font-size:30px}
body.port #ten-chip{font-size:26px;min-height:56px}
body.port #prompt-chip .tally .t{font-size:20px}
</style>
</head>
<body>
<div id="game" aria-label="数数小鸡">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="field" aria-label="草地">
      <div class="grass" aria-hidden="true"></div>
      <div class="cover" aria-hidden="true"></div>
    </div>
    <div id="prompt">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
      <div id="ten-chip" aria-live="polite"></div>
      <button id="btn-resee" aria-label="再看一眼"></button>
      <button id="btn-recount" aria-label="重新数"></button>
    </div>
    <div id="answers" aria-label="答案选项"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

   玩法（r19）：count 章 11-20 只小鸡逐格点数（满 10 出「10+余数」chip=十加几结构化锚；章 2 混小鸭小兔只数小鸡）
   compare 章小鸡+小鸭两群各自清点（tally 并排）→ 问「多几只/少几只」选差值（域 1-5）
   flash 章小鸡短时呈现（flashMs=1200+n*100）→ 草丛遮盖 → 估计作答（选项间距 3，禁逐格数）
   验收钩子：window.CHK = { get currentLevel, get quiz, tapChick(i), tapDuck(j), tapOther(j), recount(),
     pick(i), start(f), modeled(f), async autoSolve(), get tutorial } */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/题面语音不受 flat 门限制（7 岁半玩家评估 P1 + 5.5 岁试玩 P2：不识字孩子 flat≥3 全静默零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };

const fieldEl = $id('field'), answersEl = $id('answers'), chipEl = $id('prompt-chip'),
      tenEl = $id('ten-chip'), recountBtn = $id('btn-recount'), reseeBtn = $id('btn-resee'),
      ghostEl = $id('ghost'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', flashing: false };
let lastAct = Date.now();
let lastDir = 0;                                // 家族 B 救援双锚：方向级节流锚（与 lastAct 分离）
let lastRescueAns = 0;                          // 答案级节流锚
let lastWrongVoice = 0;                         // 家族 J：错反馈语义句 10s 节流锚
let wrongChainUntil = 0;                        // 家族 I：错链豁免窗（窗内错点吞/对选放行）
let helpRedemo = false;
let flashToken = 0;                             // flash 呈现协程防重入令牌
let ghostReason = null;                         // 'tut' | 'scaffold'

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const optEl = i => answersEl.querySelector('.opt[data-i="' + i + '"]');
const chickEl = i => fieldEl.querySelector('.animal[data-k="c"][data-i="' + i + '"]');
const duckEl = j => fieldEl.querySelector('.animal[data-k="d"][data-i="' + j + '"]');
const otherEl = j => fieldEl.querySelector('.animal[data-k="o"][data-i="' + j + '"]');

/* ================= 存档脏键守卫 IIFE（键基 c-[0..4] 未变；先于 KIDS.init 读档执行）
   r18 坑③同族防线：非法键（如 lv>CH_LEN-1 的 '1-9'）=存档污染 → levels 清空重上教学，防生成关软锁 */
(function () {
  try {
    const raw = localStorage.getItem('kidsgame_countchick');
    if (!raw) return;
    const sv = JSON.parse(raw);
    if (!sv || !sv.levels) return;
    let bad = false;
    Object.keys(sv.levels).forEach(k => {
      const m = /^(\d+)-(\d+)$/.exec(k);
      if (!m || +m[1] < 1 || +m[2] > CH_LEN - 1) bad = true;
    });
    if (bad) { sv.levels = {}; localStorage.setItem('kidsgame_countchick', JSON.stringify(sv)); }
  } catch (e) {}
})();

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  recountBtn.innerHTML = ICONS.recount + '<span>重新数</span>';
  reseeBtn.innerHTML = ICONS.resee + '<span>再看一眼</span>';
  fieldEl.querySelector('.grass').innerHTML = grassSvg();
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 72);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 咯咯声（Web Audio 合成）：新数到=双音上扬 / 已数过=低柔单音 / 干扰动物=更低哑声 */
const cluckHi = () => { if (!VERIFY) { KIDS.audio.note(988, 0.09, 0, 0.5); KIDS.audio.note(784, 0.1, 0.07, 0.4); } };
const cluckLo = () => { if (!VERIFY) KIDS.audio.note(660, 0.08, 0, 0.3); };
const quack = () => { if (!VERIFY) { KIDS.audio.note(392, 0.12, 0, 0.4); KIDS.audio.note(330, 0.12, 0.09, 0.35); } };
/* 吞输入容器动画（家族 D：吞点/吞选必配 bump，禁无声拒绝） */
function replayAnim(el, cls) {
  if (!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 900);
}

/* ================= 渲染 ================= */
function optBtn(t, i) {
  const b = document.createElement('button');
  b.className = 'opt';
  b.dataset.i = i;
  b.textContent = t;
  b.setAttribute('aria-label', '选 ' + t);
  return b;
}
/* 草地撒点：count(chicks+others)/compare(chicks+ducks) 同一拒绝采样流（中心距 ≥ 章 D），
   确定性纯函数（同 seed 同尺寸同布局）；排列随机化=防「数格子」捷径 */
function placeAnimals() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  fieldEl.querySelectorAll('.animal').forEach(el => el.remove());
  const C = CHAPTERS[cur.dch];
  const W = fieldEl.clientWidth, H = fieldEl.clientHeight;
  const ducks = q.type === 'compare' ? q.ducks : [];
  const total = q.chicks.length + q.others.length + ducks.length;
  const pts = scatterPts(mulberry32(q.seed), W, H, total, C.D, C.size / 2 + 8);
  const mk = (cls, svg, grp, i, p, size) => {
    const b = document.createElement('button');
    b.className = 'animal ' + cls;
    b.dataset.i = i;
    b.dataset.k = grp;
    b.setAttribute('aria-label', grp === 'c' ? '小鸡' + (i + 1) : grp === 'd' ? '小鸭' + (i + 1) : '其他动物');
    b.style.width = Math.round(size) + 'px';
    b.style.height = Math.round(size) + 'px';
    const base = grp === 'c' ? 0 : grp === 'd' ? q.chicks.length : q.chicks.length + ducks.length;
    const p0 = pts[base + i] || { x: W / 2, y: H / 2 };
    b.style.left = Math.round(p0.x - size / 2) + 'px';
    b.style.top = Math.round(p0.y - size / 2) + 'px';
    b.innerHTML = svg + '<span class="badge"></span>';
    b.style.setProperty('--s', grp === 'o' ? 1 : p.s);
    return b;
  };
  q.chicks.forEach((c, i) => fieldEl.appendChild(mk('chick', ANIMAL_SVG.chick(c), 'c', i, c, C.size * c.s)));
  ducks.forEach((d, j) => fieldEl.appendChild(mk('duck', ANIMAL_SVG.duck(d), 'd', j, d, C.size * d.s)));
  q.others.forEach((o, j) => fieldEl.appendChild(mk('other ' + o.kind, ANIMAL_SVG[o.kind](o), 'o', j, o, C.size * 0.92)));
  /* 恢复本题已数的角标（重渲染不丢进度） */
  q._badges = q._badges || [];
  q.chicks.forEach((c, i) => {
    if (q._badges[i]) {
      const b = chickEl(i).querySelector('.badge');
      b.textContent = q._badges[i];
      b.classList.add('on');
    }
  });
  q._badgesD = q._badgesD || [];
  ducks.forEach((d, j) => {
    if (q._badgesD[j]) {
      const b = duckEl(j).querySelector('.badge');
      b.textContent = q._badgesD[j];
      b.classList.add('on');
    }
  });
}
/* 十加几锚渲染：count 章数到 ≥10 显示（==0「满 10 啦」/>0「10 + k」），compare/flash 不出 */
function renderTen() {
  const q = cur && cur.quizzes[cur.step];
  const on = !!(q && q.type === 'count' && (q._cnt || 0) >= 10);
  tenEl.classList.toggle('on', on);
  if (on) {
    const k = (q._cnt || 0) - 10;
    tenEl.textContent = k === 0 ? '满 10 啦' : '10 + ' + k;
  }
}
/* 两群 tally 渲染（compare 章：双群清点进度并排呈现） */
function renderTally() {
  const q = cur && cur.quizzes[cur.step];
  if (!q || q.type !== 'compare') return;
  const tc = $id('tally-c'), td = $id('tally-d');
  if (tc) tc.textContent = String(q._cnt || 0);
  if (td) td.textContent = String(q._cntD || 0);
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  answersEl.innerHTML = '';
  reseeBtn.classList.remove('on');
  recountBtn.classList.toggle('hidden', q.type === 'flash');
  tenEl.classList.remove('on');
  if (q.type === 'compare') {
    const line = q.dir === 'more' ? VOICE.cmpMore : VOICE.cmpLess;
    chipEl.className = 'cmp';
    chipEl.innerHTML = ICONS.chickmini + '<div><div class="big">' + line.text + '？</div>' +
      '<div class="tally"><span class="t">' + ICONS.chickmini + '<span id="tally-c">0</span></span>' +
      '<span class="t">' + ICONS.duckmini + '<span id="tally-d">0</span></span></div></div>';
    q.items.forEach((t, i) => answersEl.appendChild(optBtn(t, i)));
    renderStep();
    placeAnimals();
    renderTally();
    sayR(line.key, line.text);                  /* 题面问句无 flat 门（不识字孩子靠它做题，P2 教训） */
    return;
  }
  if (q.type === 'flash') {
    chipEl.className = 'flash';
    chipEl.innerHTML = ICONS.chickmini + '<div><div class="big">看一眼，有几只小鸡？</div>' +
      '<div class="sub">马上猜一猜，不用一个一个数</div></div>';
    chipEl.classList.add('mix');                /* 复用 .sub 显示通道 */
    q.items.forEach((t, i) => answersEl.appendChild(optBtn(t, i)));
    renderStep();
    fieldEl.classList.add('hid');               // 起始遮盖：呈现窗=唯一暴露期
    placeAnimals();
    runFlash(false);
    return;
  }
  const mix = q.others.length > 0;
  chipEl.className = mix ? 'mix' : '';
  chipEl.innerHTML = ICONS.chickmini + '<div><div class="big">草地上有几只小鸡？</div>' +
    (mix ? '<div class="sub">只数黄色的小鸡哦</div>' : '') + '</div>';
  q.items.forEach((t, i) => answersEl.appendChild(optBtn(t, i)));
  renderStep();
  placeAnimals();
  renderTen();
}
function renderStep() {                         // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
window.addEventListener('resize', () => { if (cur && cur.quizzes[cur.step]) placeAnimals(); });

/* ================= flash 快数呈现协程（tok 防重入；resee=重播同窗不播问句） ================= */
async function runFlash(resee) {
  const q = cur && cur.quizzes[cur.step];
  if (!q || q.type !== 'flash') return;
  const tok = ++flashToken;
  state.flashing = true;                        // 呈现+问句期：答案吞（家族 D bump）
  reseeBtn.classList.remove('on');
  if (!resee) {
    sayR(VOICE.flashQ.key, VOICE.flashQ.text);
    await wait(QWIN_FLASH * SPEED);
  }
  fieldEl.classList.remove('hid');
  await wait(q.flashMs * SPEED);
  if (tok !== flashToken || !cur || cur.quizzes[cur.step] !== q) return;   // 已切题/重开：弃
  fieldEl.classList.add('hid');
  state.flashing = false;
  const big = chipEl.querySelector('.big');
  if (big) big.textContent = '刚才有几只小鸡？';
  reseeBtn.classList.add('on');
  if (resee) q._resees = (q._resees || 0) + 1;
  lastAct = Date.now();
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show(reason) { ghostReason = reason; ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostReason = null; ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el, reason) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show(reason);
  el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  setTimeout(() => ghost.press(), 800);
}
/* 第一只没数过的动物（_badges 稀疏数组：未点数时长度 0，findIndex 恒 -1——按 chicks/ducks 全长扫） */
function firstUncounted(q, grp) {
  const b = (grp === 'd' ? q._badgesD : q._badges) || [];
  const pool = (grp === 'd' ? q.ducks : q.chicks) || [];
  for (let k = 0; k < pool.length; k++) if (!b[k]) return k;
  return -1;
}
/* 教学"帮"阶段指向：第一只没数过的小鸡（compare 无教学）；全数完 → 指向正确答案（手口一致引导） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  const i = firstUncounted(q, 'c');
  if (i >= 0) pointGhostAt(chickEl(i), 'tut');
  else pointGhostAt(optEl(q.answer), 'tut');
}

/* ================= 点数主路径（真实点击 / CHK 钩子 / autoSolve 共用） ================= */
function uiTapChick(i, demo) {
  /* 反方审查 M1：locked 门原样拦掉教学"看"演示的点数调用（demo 只豁免 demo 子句）——角标机制零演示。
     demo 通道仅 tutorialWatch 内部传 true（钩子/事件不传），locked 豁免随 demo 通道走，无绕锁面 */
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo) || state.flashing) {
    if (!demo && cur && !state.won) replayAnim(fieldEl, 'bump');   /* 吞输入轻叮容器（家族 D——试玩 P2-2：教学/锁定期真实点击不再静默） */
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.type === 'flash') return false;
  const r = engTap(cur, i, 'c');
  if (r === null) return false;
  lastAct = Date.now();
  const el = chickEl(i);
  if (el) { el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop'); }
  if (r > 0) {                                  // 新数到：角标递增 + 双音咯咯
    if (el) {
      const b = el.querySelector('.badge');
      b.textContent = r;
      b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    }
    sfx('pop');
    cluckHi();
    if (q.type === 'count' && r === 10 && !q._tenSaid) {   // 十加几锚：数满 10 播一次（不锁输入）
      q._tenSaid = true;
      sayR(VOICE.ten.key, VOICE.ten.text);
    }
    if (q.type === 'count') renderTen();
    if (q.type === 'compare') renderTally();
  } else {                                      // 已数过的：只跳一下不增号
    cluckLo();
  }
  if (state.tut === 'help') pointHelpNext();    // "帮"：跟着孩子的点数节奏指向下一只
  return r;
}
/* compare 章小鸭群清点（与小鸡各自独立角标/tally） */
function uiTapDuck(j) {
  if (!cur || state.locked || state.won || state.demo || state.flashing) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q.type !== 'compare') return false;
  const r = engTap(cur, j, 'd');
  if (r === null) return false;
  lastAct = Date.now();
  const el = duckEl(j);
  if (el) { el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop'); }
  if (r > 0) {
    if (el) {
      const b = el.querySelector('.badge');
      b.textContent = r;
      b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    }
    sfx('pop');
    quack();
    renderTally();
  } else {
    cluckLo();
  }
  return r;
}
/* 干扰动物（章 2 小鸭/小兔）：摆动+哑声，不计数零惩罚 */
function uiTapOther(j) {
  if (!cur || state.locked || state.won || state.demo || state.flashing) return false;
  lastAct = Date.now();
  const el = otherEl(j);
  if (el) { el.classList.remove('wig'); void el.offsetWidth; el.classList.add('wig'); }
  quack();
  return true;
}
/* 重新数：清零本题全部角标（两群一起清；防漏数重数核心操作） */
function uiRecount() {
  if (!cur || state.locked || state.won || state.demo || state.flashing) return false;
  const q = cur.quizzes[cur.step];
  if (!q || q.type === 'flash') return false;
  const had = engRecount(cur);
  fieldEl.querySelectorAll('.animal .badge.on').forEach(b => { b.classList.remove('on'); b.textContent = ''; });
  tenEl.classList.remove('on');
  renderTally();
  if (had) {
    sfx('click');
    recountBtn.classList.remove('bounce'); void recountBtn.offsetWidth; recountBtn.classList.add('bounce');
    KIDS.voice.play('chk_rec', VOICE.rec.text);   /* 按钮反馈语音（不识字孩子靠它理解功能，无 flat 门） */
  }
  lastAct = Date.now();
  return true;
}

/* ================= 答题主路径（真实点击 / CHK.pick / autoSolve 共用） ================= */
/* 错反馈语义句（家族 J）：flat<3 每错必播；flat≥3 10s 节流。返回是否起播（起播才设豁免窗） */
function sayW(q) {
  const line = q.type === 'compare' ? VOICE.cmpHint : q.type === 'flash' ? VOICE.flashHint : VOICE.hint;
  const now = Date.now();
  if (!cur || cur.flat < 3 || now - lastWrongVoice > 10000) {
    KIDS.voice.play(line.key, line.text);
    lastWrongVoice = now;
    return true;
  }
  return false;
}
async function uiPick(i, demo) {
  if (!cur || state.locked || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  if (state.flashing && !demo) {                // flash 呈现期吞选（家族 D bump）
    replayAnim(answersEl, 'bump');
    sfx('pop');
    return false;
  }
  if (i !== q.answer && wrongChainUntil && Date.now() < wrongChainUntil) {
    /* 契约 I：错链豁免窗内错点吞（不 shake 不计 retries；对选放行）。
       _miss 仍累计——连错 ≥2 的 pulse 提示通道保留（verify_one ⑩ 二错 pulse 口径） */
    q._miss = (q._miss || 0) + 1;
    if (q._miss >= 2) replayAnim(optEl(q.answer), 'pulse');
    replayAnim(answersEl, 'bump');
    sfx('pop');
    lastAct = Date.now();
    return false;
  }
  const r = engPick(cur, i);
  if (r === null || r === 'again') return r;
  lastAct = Date.now();
  const el = optEl(i);
  if (r === 'right' || r === 'done') {
    if (state.tut === 'help') {                 // 教学"独"：首次答对 → 强化反馈放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    state.locked = true;
    if (el) {
      el.classList.add('right');
      const m = document.createElement('span');
      m.className = 'mark';
      m.innerHTML = ICONS.check;
      el.appendChild(m);
    }
    sfx('coin');
    await wait(880 * SPEED);
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
  } else {                                      // 答错：晃动+灰掉（零惩罚，可重点其它）；首错只轻提示，连错 2 次才高亮正确项
    q._miss = (q._miss || 0) + 1;
    if (el) el.classList.add('wrong');
    if (q._miss >= 2) replayAnim(optEl(q.answer), 'pulse');
    sfx('fail');
    if (sayW(q)) wrongChainUntil = Date.now() + WRONG_WIN[q.type];
    await wait(520 * SPEED);
  }
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(f) {
  const ci = Math.floor((f == null ? cur.flat : f) / CH_LEN);

/* ================= ?verify=1 自检（仅 verify 分支加载执行——独立第 4 script 块，E-M2）

   ⑥ 契约源码扫描（querySelectorAll('script')[2]=纯游戏块，禁自匹配；高风险串拼接）：
     家族 A（双 nextHint(lim - 1)+禁 null 形态）/F（生成关实算禁 (ci+1)%4）/D（吞配 bump）/
     E（教学子键先查）/I（链窗重置+让路守卫）/J（10s 节流）/K（rescueTick 命名+面板守卫）

   ⑨ modeled 双钉：modeled(0)===81765（SPEC_MODELED_MIN）+ 0-39 全域 min===56840 + DECIDE_MS 字面

   结果写 #verify-result + document.title='VERIFY PASS n/n'（墙钟 <100s，SPEC §-r19 注记） */
async function runVerify() {

  const SPEC_MODELED_GLOBAL_MIN = 56840;        /* 0-39 全域最小（flat18 flash 关无点数链） */

  const keyOfV = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);

  /* ---- ① 40 关全量审计（flat 0-39） ---- */
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1.quizzes) === JSON.stringify(L2.quizzes);   // 确定性
    const C = CHAPTERS[L1.dch];
    let ruleOk = true, structAll = true, adjOk = true, rangeOk = true;

        if (q.dir !== 'more' && q.dir !== 'less') ruleOk = false;

    for (let k = 0; k < L1.quizzes.length && driveOk; k++) {
      const q = L1.quizzes[k];
      if (q.type !== 'flash') {
        for (let i = 0; i < q.chicks.length; i++) {
          if (engTap(L1, i, 'c') !== i + 1) { driveOk = false; break; }

        if (!driveOk) break;
        if (q.type === 'compare') {
          for (let j = 0; j < q.ducks.length; j++) {

        if (engTap(L1, 0, 'c') !== 0) driveOk = false;                         // 已数过：只跳不增号
        if (q.type === 'compare' && engTap(L1, 0, 'd') !== 0) driveOk = false;
        if (!engRecount(L1)) driveOk = false;                                  // 重数清零（两群一起）
        for (let i = 0; i < q.chicks.length; i++) {
          if (engTap(L1, i, 'c') !== i + 1) { driveOk = false; break; }
        }
        if (!driveOk) break;
        if (q.type === 'compare') {
          for (let j = 0; j < q.ducks.length; j++) {
            if (engTap(L1, j, 'd') !== j + 1) { driveOk = false; break; }

      const want = k === L1.quizzes.length - 1 ? 'done' : 'right';
      if (r !== want) driveOk = false;

    const ok = det && L1.quizzes.length === CH_LEN && ruleOk && structAll && adjOk && rangeOk && driveOk && solvedAll;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, ruleOk: ruleOk, structAll: structAll,
      adjOk: adjOk, rangeOk: rangeOk, driveOk: driveOk, solvedAll: solvedAll,
      ns: L1.quizzes.map(q => q.type === 'compare' ? q.n + 'v' + q.m : q.type === 'flash' ? 'f' + q.n : q.n + (q.others.length ? '+' + q.others.length : '')) };
    if (flat < STATIC_LEVELS) levels[keyOfV(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② count 单元（flat0 真实 UI 状态机）+ 十加几 chip ---- */
  total++;
  startLevel(0);
  const q0 = CHK.quiz;
  const tenEl = document.getElementById('ten-chip');
  const taps = [], badSeq = [];
  let ten10 = true;
  for (let i = 0; i < 9; i++) {                  // 前 9 只：chip 不出现
    taps.push(CHK.tapChick(i));

  }
  ten10 = ten10 && !tenEl.classList.contains('on') && CHK.quiz.ten === null;
  taps.push(CHK.tapChick(9));                    // 第 10 只：「满 10 啦」
  badSeq.push(CHK.currentLevel.counted);
  ten10 = ten10 && tenEl.classList.contains('on') && tenEl.textContent === '满 10 啦';
  const ten11k = CHK.tapChick(10);               // 第 11 只起：「10 + k」
  taps.push(ten11k);
  badSeq.push(CHK.currentLevel.counted);
  const ten11 = tenEl.textContent === '10 + 1' && CHK.quiz.ten === '10 + 1' && ten11k === 11;
  for (let i = 11; i < q0.chicks; i++) {
    taps.push(CHK.tapChick(i));

  const incOk = taps.every((v, i) => v === i + 1) && badSeq.every((v, i) => v === i + 1);
  const retap = CHK.tapChick(0);                 // 已数过 → 0，总数不变
  const retapOk = retap === 0 && CHK.currentLevel.counted === q0.chicks;
  const domBadges = fieldEl.querySelectorAll('.badge.on').length;
  const domOk = domBadges === q0.chicks;         // 每只小鸡一个角标
  CHK.recount();
  const tenOff = !tenEl.classList.contains('on') && CHK.quiz.ten === null;
  const recOk = CHK.currentLevel.counted === 0 && fieldEl.querySelectorAll('.badge.on').length === 0;
  const badIdx = CHK.tapChick(99) === false && CHK.tapChick(-1) === false;
  const tapOk = incOk && retapOk && domOk && recOk && badIdx && ten10 && ten11 && tenOff;
  if (tapOk) npass++;
  units.tapChick = { ok: tapOk, retap: retap, domBadges: domBadges, recount: recOk,
    badIdx: badIdx, ten10: ten10, ten11: ten11, tenOff: tenOff, n: q0.chicks };

  /* ---- ③ compare 单元（flat10）：tally/小鸭组/吞错窗 ---- */
  total++;
  startLevel(10);
  const qc = CHK.quiz;
  const tallyC0 = document.getElementById('tally-c'), tallyD0 = document.getElementById('tally-d');
  const shapeOk = qc.type === 'compare' && qc.m === qc.n - qc.diff && qc.diff >= 1 && qc.diff <= 5 &&
    qc.answer === qc.diff && qc.ducks === qc.m && !!tallyC0 && !!tallyD0 && tallyC0.textContent === '0';
  CHK.tapChick(0); CHK.tapChick(1); CHK.tapChick(2);
  CHK.tapDuck(0); CHK.tapDuck(1);
  const tallyOk = tallyC0.textContent === '3' && tallyD0.textContent === '2' &&
    CHK.quiz.counted === 3 && CHK.quiz.countedD === 2;
  const duckBad = CHK.tapDuck(99) === false && CHK.tapDuck(-1) === false;
  CHK.recount();
  const recBoth = CHK.quiz.counted === 0 && CHK.quiz.countedD === 0 &&
    tallyC0.textContent === '0' && tallyD0.textContent === '0';
  /* 首错零惩罚 + 窗内二错吞（pulse 通道保留、retries 不增） */
  const w1 = qc.items.findIndex((v, i2) => i2 !== qc.answerIdx);
  const r1 = await CHK.pick(w1);
  const w2 = qc.items.findIndex((v, i2) => i2 !== qc.answerIdx && i2 !== w1);
  const r2 = await CHK.pick(w2);
  const okEl = answersEl.querySelector('.opt[data-i="' + qc.answerIdx + '"]');
  const swallowOk = r1 === 'wrong' && r2 === false &&
    CHK.currentLevel.retries === 1 && CHK.currentLevel.step === 0 &&
    okEl.classList.contains('pulse');
  const cmpOk = shapeOk && tallyOk && duckBad && recBoth && swallowOk;
  if (cmpOk) npass++;
  units.compare = { ok: cmpOk, shape: shapeOk, tally: tallyOk, recount: recBoth, swallow: swallowOk,
    n: qc.n, m: qc.m, diff: qc.diff, dir: qc.dir };

  /* ---- ④ flash 单元（flat15）：呈现期吞→遮盖→再看一眼→答对 ---- */
  total++;
  startLevel(15);
  const qf = CHK.quiz;
  const flashStartOk = qf.type === 'flash' && qf.flashing && fieldEl.classList.contains('hid') &&
    qf.flashMs === 1200 + qf.n * 100;
  const tapSw = CHK.tapChick(0) === false;                        // 估计任务禁逐格数
  const pickSw = await CHK.pick(qf.answerIdx);                    // 呈现期吞选 → false
  await wait(1600);                                               // SPEED=0.12：问句窗+呈现窗+遮盖
  const qf2 = CHK.quiz;
  const hidOk = !qf2.flashing && fieldEl.classList.contains('hid') &&
    document.getElementById('btn-resee').classList.contains('on');
  const reseeR = CHK.resee();
  await wait(1200);
  const reseeOk = reseeR === true && CHK.quiz.flashing === false && CHK.quiz.resees === 1;
  const pickR = await CHK.pick(qf2.answerIdx);
  const flashOk = flashStartOk && tapSw === true && pickSw === false && hidOk && reseeOk &&
    (pickR === 'right' || pickR === 'done');
  if (flashOk) npass++;
  units.flash = { ok: flashOk, start: flashStartOk, tapSwallow: tapSw, pickSwallow: pickSw === false,
    hid: hidOk, resee: reseeOk, n: qf.n, flashMs: qf.flashMs };

  /* ---- ⑤ 布局：双 viewport 模拟 ×（ch1 / ch2 最密混养 / ch3 双群最多） ---- */
  function simView(w, h) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    renderQuiz();                               // 按新场地尺寸重新撒点（同 seed 同尺寸同布局）
    const de = document.documentElement;
    const ans = Array.prototype.map.call(answersEl.querySelectorAll('.opt'), b => b.getBoundingClientRect());
    const ansOk = ans.length === 3 && ans.every(r => r.width >= 96 && r.height >= 96);
    const animals = Array.prototype.map.call(fieldEl.querySelectorAll('.animal'), b => {
      const r = b.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
    });
    const hitOk = animals.length > 0 && animals.every(a => a.w >= 64 && a.h >= 64);
    let distOk = true, minD = 1e9;
    for (let i = 0; i < animals.length; i++) {
      for (let j = i + 1; j < animals.length; j++) {
        const d = Math.hypot(animals[i].x - animals[j].x, animals[i].y - animals[j].y);
        if (d < minD) minD = d;
        if (d < 90) distOk = false;             // 撒点中心距 ≥90px：防重叠不可点
      }
    }
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, ansOk: ansOk, hitOk: hitOk, distOk: distOk, minD: Math.round(minD),
      animals: animals.length, ox: ox, pass: ansOk && hitOk && distOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const flat of [0, 5, 10]) {              // ch1 基线 / ch2 最密混养 / ch3 双群最多
    startLevel(flat);
    await wait(90);
    sims.push(simView(1280, 800));
    sims.push(simView(800, 1180));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                // 还原真实 viewport 布局
  const layoutOk = sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑤ 附：scatterPts 确定性单元（同参数两次同布局） ---- */
  total++;
  const sc1 = scatterPts(mulberry32(987654), 900, 460, 24, 90, 42);
  const sc2 = scatterPts(mulberry32(987654), 900, 460, 24, 90, 42);
  const scDet = JSON.stringify(sc1) === JSON.stringify(sc2) && sc1.length === 24;
  let scMin = 1e9;
  for (let i = 0; i < sc1.length; i++) for (let j = i + 1; j < sc1.length; j++) {
    const d = Math.hypot(sc1[i].x - sc1[j].x, sc1[i].y - sc1[j].y);
    if (d < scMin) scMin = d;
  }
  const scOk = scDet && scMin >= 90;
  if (scOk) npass++;
  units.scatter = { ok: scOk, det: scDet, minD: Math.round(scMin) };

  /* ---- ⑥ 契约源码扫描（纯游戏块 [2]；高风险串拼接防同文） ---- */
  total++;
  const src = document.querySelectorAll('script')[2].textContent;
  const LIM1 = ['nextHint', '(lim - 1)'].join('');        // 家族 A
  const NULLF = ['nextHint', '(null)'].join('');
  const F1 = ['GEN_HINTS[genLevel(f + 1)', '.dch - 1]'].join('');   // 家族 F
  const F2 = ['(ci + 1)', ' % 4'].join('');
  const ctrOk = src.split(LIM1).length - 1 === 2 && src.indexOf(NULLF) < 0 &&
    src.indexOf('Math.max(0, lim - 1)') >= 0 &&
    src.indexOf(F1) >= 0 && src.indexOf(F2) < 0 &&
    src.indexOf("replayAnim(answersEl, 'bump')") >= 0 &&           // 家族 D
    src.indexOf('sv.chk && sv.chk.tutSeen') >= 0 &&                // 家族 E
    src.indexOf('lastWrongVoice = 0; wrongChainUntil = 0;') >= 0 &&// 家族 I
    src.indexOf('if (Date.now() < wrongChainUntil) return;') >= 0 &&
    src.indexOf('now - lastWrongVoice > 10000') >= 0 &&             // 家族 J
    src.indexOf('function rescueTick()') >= 0 &&                   // 家族 K
    src.indexOf('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel') >= 0;
  if (ctrOk) npass++;
  units.contract = { ok: ctrOk,
    nLim: src.split(LIM1).length - 1, noNull: src.indexOf(NULLF) < 0, genReal: src.indexOf(F1) >= 0 };

  /* ---- ⑦ clips 注入对账（前缀封闭：chk_/core_；r19 二轮定值 13=core3+旧4+新6）
         + SPEC_DUR 链句实长 ±60ms（r19 审查 m3：estMs 上界假设的运行时证据——实长恒 ≤ estMs 才窗安全） ---- */
  const SPEC_DUR = { chk_hint: 2496, chk_cmp_hint: 2880, chk_flash_hint: 3096 };   // 实测 2026-09-19（主线 headless metadata 读取）
  total++;
  const clipKeys = Object.keys(KIDS.voice.clips);
  let clipsOk = clipKeys.length === 13 &&
    clipKeys.every(k => k.indexOf('chk_') === 0 || k.indexOf('core_') === 0) &&
    ['chk_tut_watch', 'chk_tut_turn', 'chk_hint', 'chk_rec',
     'chk_ten', 'chk_cmp_more', 'chk_cmp_less', 'chk_cmp_hint', 'chk_flash_q', 'chk_flash_hint']
      .every(k => clipKeys.indexOf(k) >= 0);
  if (clipsOk) {
    clipsOk = await Promise.all(Object.keys(SPEC_DUR).map(k => new Promise(res => {
      const a = new Audio(KIDS.voice.clips[k]);   // metadata 读取不出声（无 autoplay）
      a.onloadedmetadata = () => res(Math.abs(a.duration * 1000 - SPEC_DUR[k]) <= 60);
      a.onerror = () => res(false);
    }))).then(v => v.every(Boolean));
  }
  if (clipsOk) npass++;
  units.clips = { ok: clipsOk, n: clipKeys.length };

  /* ---- ⑧ estMs 动态四方之一（全字符口径）+ WRONG_WIN ---- */
  total++;
  const estOk = estMs('点一点，数一数') === 3015 && estMs('满10只啦，接着数') === 3705 &&
    estMs('别急着数，看一眼猜一猜') === 4395 && estMsV(7) === 3015 &&
    WRONG_WIN.count === SPEC_WRONG_WIN.count && WRONG_WIN.compare === SPEC_WRONG_WIN.compare &&
    WRONG_WIN.flash === SPEC_WRONG_WIN.flash;
  if (estOk) npass++;
  units.estWin = { ok: estOk, w: [WRONG_WIN.count, WRONG_WIN.compare, WRONG_WIN.flash] };

  /* ---- ⑨ modeled 双钉（SPEC_MODELED_MIN 精确一致禁约数） ---- */
  total++;
  let mMin = Infinity;
  for (let f = 0; f < 40; f++) mMin = Math.min(mMin, CHK.modeled(f));
  const modOk = CHK.modeled(0) === SPEC_MODELED_MIN && mMin === SPEC_MODELED_GLOBAL_MIN &&
    DECIDE_MS.count === 2600 && DECIDE_MS.compare === 4200 && DECIDE_MS.flash === 3000 &&
    TAP_MS === 950 && FLASH_A === 1200 && FLASH_B === 100 && INTRO_MS === 3415;
  if (modOk) npass++;
  units.modeled = { ok: modOk, flat0: CHK.modeled(0), min: mMin,
    decide: [DECIDE_MS.count, DECIDE_MS.compare, DECIDE_MS.flash] };

  /* ---- ⑩ 分布断言：answerIdx 三位置都出现、首位不恒定（<60%） ---- */
  total++;
  const distOk = idxDist[0] > 0 && idxDist[1] > 0 && idxDist[2] > 0 && idxDist[0] < 200 * 0.6;
  if (distOk) npass++;
  units.dist = { ok: distOk, idx0: idxDist[0], idx1: idxDist[1], idx2: idxDist[2], n: idxDist[0] + idxDist[1] + idxDist[2] };

  /* ---- ⑪ UI 冒烟 A：flat0 全链（首错+窗内吞错）通关（1 重试=2 星） ---- */
  total++;
  startLevel(0);
  let smokeA = true, wrongOk = false, steps = 0;
  for (let s = 0; s < CH_LEN && smokeA; s++) {
    const q = CHK.quiz;
    if (!q) { smokeA = false; break; }
    for (let i = 0; i < q.chicks; i++) {
      if (CHK.tapChick(i) !== i + 1) smokeA = false;
    }
    if (s === 0) {                              // 首错零惩罚；窗内二错吞（pulse 出、retries 不增）
      const widx = q.items.findIndex((v, i2) => i2 !== q.answerIdx);
      await CHK.pick(widx);
      const w2idx = q.items.findIndex((v, i2) => i2 !== q.answerIdx && i2 !== widx);
      const r2 = await CHK.pick(w2idx);
      const okEl2 = answersEl.querySelector('.opt[data-i="' + q.answerIdx + '"]');
      wrongOk = r2 === false && CHK.currentLevel.retries === 1 && CHK.currentLevel.step === 0 &&
        okEl2.classList.contains('pulse');
      await wait(3600);                         // 等错链窗过（3465）再答对
    }
    const r = await CHK.pick(q.answerIdx);
    if (r !== (s === CH_LEN - 1 ? 'done' : 'right')) smokeA = false;
    steps++;
  }
  const lvA = CHK.currentLevel;
  const smokeOkA = smokeA && wrongOk && steps === CH_LEN && lvA.done && lvA.won && lvA.retries === 1 &&
    engStars(cur) === 2 && !document.querySelector('.k-celebrate');   // verify 页不弹层
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, wrongOk: wrongOk, steps: steps, retries: lvA.retries, stars: engStars(cur) };

  /* ---- ⑪ UI 冒烟 B：flat15（ch4 flash）autoSolve UI 通路通关 ---- */
  total++;
  startLevel(15);
  const a15 = await CHK.autoSolve();
  const lv15 = CHK.currentLevel;
  const smokeOkB = a15.done && lv15.done && lv15.won && lv15.retries === 0 && engStars(cur) === 3;
  if (smokeOkB) npass++;
  smokes.flat15 = { ok: smokeOkB, picks: a15.picks, retries: lv15.retries, stars: engStars(cur) };

  /* ---- ⑪ UI 冒烟 C：flat10（ch3 compare）autoSolve UI 通路通关 ---- */
  total++;
  startLevel(10);
  const a10 = await CHK.autoSolve();
  const lv10 = CHK.currentLevel;
  const smokeOkC = a10.done && lv10.done && lv10.won && lv10.retries === 0 && engStars(cur) === 3;
  if (smokeOkC) npass++;
  smokes.flat10 = { ok: smokeOkC, picks: a10.picks, retries: lv10.retries, stars: engStars(cur) };

  const out = { game: 'countchick', total: total, pass: npass, layoutOk: layoutOk, dist: idxDist,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  runVerify();
}

</script>
