<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>连线朋友</title>
<style>
/* ================= 连线朋友 connect（batch5）=================
   视觉按系列 §8：暖浅底 #FFF9EE、暖橙主色、绿=连对、灰蓝错误色（不用大红）
   触摸目标：卡片 ≥88×88（JS 按 stage 实算，章 4 六卡双 viewport 均 ≥88）；间距 ≥10 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#8FBF7F;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：左列动物 / 右列食物 + 连线 overlay ---------- */
#stage{flex:1 1 auto;min-height:120px;position:relative;overflow:hidden;padding:4px 10px}
#board{position:relative;width:100%;height:100%;display:flex;justify-content:center;gap:var(--mid,110px)}
.col{display:flex;flex-direction:column;justify-content:center;gap:var(--gap,12px)}
.col-head{height:24px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;
  color:#6B5A48;letter-spacing:.12em;white-space:nowrap}

/* ---------- 卡片 ---------- */
.card{width:var(--card,120px);height:var(--card,120px);border-radius:22px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;position:relative;
  transition:transform .15s,box-shadow .15s,border-color .2s,opacity .3s}
.card .pic{width:72%;height:66%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card .pic svg{width:100%;height:100%}
.card .lab{font-size:15px;font-weight:700;color:#6B5A48;letter-spacing:.08em;white-space:nowrap;pointer-events:none}
.acard{cursor:grab}
.acard:active{cursor:grabbing}
/* 拖线时当前指向的食物卡高亮（吸附预判可视化） */
.fcard.near{border-color:#E8975A;box-shadow:0 4px 0 #E8975A,0 0 0 7px rgba(232,151,90,.22);
  transform:scale(1.06)}
.fcard.notrans{transition:none!important}
/* 连对后：动物开心跳 + 绿描边 */
.acard.fed{border-color:#6FA063;box-shadow:0 4px 0 #8FBF7F;background:#F4FAEF}
.acard.fed .pic{animation:nom-hop .55s cubic-bezier(.3,1.5,.4,1)}
@keyframes nom-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-13px) scale(1.06)}}
/* r6：集合内连对（part）=绿边+对勾占位（卡不消失，可继续连） */
.fcard.linked{border-color:#6FA063;box-shadow:0 4px 0 #8FBF7F;background:#F4FAEF}
.fcard.linked .tick{opacity:1}
.fcard .tick{position:absolute;right:6px;top:6px;width:30px;height:30px;opacity:0;pointer-events:none;
  animation:tick-pop .4s cubic-bezier(.2,1.6,.4,1) both}
.fcard .tick svg{width:100%;height:100%}
@keyframes tick-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
/* 题目完成被吃：星星弹出占位（右列卡完成态） */
.fcard.eaten{border-color:#BCA98D;box-shadow:0 4px 0 #D8C9B4;background:#FBF6EC}
.fcard.eaten .nom{animation:nom-pop .5s cubic-bezier(.2,1.6,.4,1) .12s both}
.fcard .nom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none}
.fcard .nom svg{width:44%;height:44%}
@keyframes nom-pop{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
/* 左卡问号泡（题目主体在想什么） */
.q-bub{position:absolute;right:-8px;top:-10px;width:40px;height:40px;border-radius:50%;
  background:#FFF9EE;border:3px solid #E8975A;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;color:#E8975A;animation:bub-float 2.2s ease-in-out infinite}
@keyframes bub-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* 链图卡（chain 题）：base→mid→? / base→?→top 三格+箭头 */
.chaincard{width:var(--chainw,220px)!important;flex-direction:row!important;gap:4px;
  justify-content:center;align-items:center;padding:4px}
.chaincard .ch-cell{flex:0 0 auto;width:31%;display:flex;flex-direction:column;align-items:center;gap:1px}
.chaincard .ch-cell .pic{width:100%;height:72%}
.chaincard .ch-cell .lab{font-size:12px;letter-spacing:.02em}
.chaincard .ch-arrow{flex:0 0 auto;width:13%;display:flex;align-items:center;justify-content:center}
.chaincard .ch-arrow svg{width:100%}
.chaincard .ch-q{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#FFF9EE;
  border:3px dashed #E8975A;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:#E8975A;animation:bub-float 2.2s ease-in-out infinite}
/* 错连：两卡晃动（零惩罚，可重连） */
.card.shake{animation:shake .42s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* 连错 ≥2 次才 pulse 正确食物（给再想机会） */
.fcard.pulse{animation:f-pulse 1s ease 2}
@keyframes f-pulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.9))}}

/* ---------- 连线层（覆在两列之上，pointer-events:none） ---------- */
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5}
#lines path{fill:none;stroke-linecap:round}
#lines .dragline{stroke:#E8975A;stroke-width:7;opacity:.95}
#lines .okline{stroke:#8FBF7F;stroke-width:7}
#lines .okdot{fill:#8FBF7F;stroke:#4A3B2E;stroke-width:2}
#lines .dragdot{fill:#E8975A;stroke:#FFF9EE;stroke-width:2.5}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 10px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:66px;height:66px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-13px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}

/* ---------- 幽灵手指教学（照系列标准） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 宽屏（≥820px）：舞台限宽居中 */
@media (min-width:820px){
  #stage{max-width:900px;margin:0 auto;width:100%}
}
</style>
</head>
<body>
<div id="game" aria-label="连线朋友">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关配对进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board" aria-label="动物与晚餐配对">
      <div class="col" id="col-a" aria-label="题目起点"><div class="col-head">起点</div></div>
      <div class="col" id="col-f" aria-label="连给它"><div class="col-head">连给它</div></div>
    </div>
    <svg id="lines" aria-hidden="true"></svg>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
