<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>找不同</title>
<style>
/* ================= 找不同 spotdiff（batch5 · 小兔子的花园）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、灰蓝错误色（不用大红）
   触摸目标：差异热区命中半径 ≥64px（透明 hit 圆，几何由 verify 量 DOM）；
   两图各 ≥200px 高、宽 ≤800；兔/重玩按钮 ≥72px；pointerdown 即响应 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#found-dots{display:flex;gap:9px;align-items:center;flex:1 1 auto}
#found-dots i{width:16px;height:16px;border-radius:50%;background:#E5D5BC;border:2.5px solid #D8C9B4;
  transition:all .3s}
#found-dots i.done{background:#8FBF7F;border-color:#6FA063;transform:scale(1.25)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面 + 上下两图 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;overflow:hidden;padding:4px 8px}
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:12px;padding:5px 24px;border-radius:20px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4}
#prompt-chip .big{font-size:24px;font-weight:800;color:#4A3B2E;letter-spacing:.04em}
#prompt-chip svg{width:32px;height:32px}

#pics{display:flex;flex-direction:column;align-items:center;gap:8px;flex:0 0 auto}
.pic{position:relative;border-radius:16px;overflow:hidden;line-height:0}
.pic svg{width:var(--imgw,480px);height:auto}
#pic-top{border:3px solid #D8C9B4}
#pic-bottom{border:3px solid #E8975A;cursor:pointer}
#pic-bottom:active{border-color:#C77A42}
.pic .cap{position:absolute;right:8px;bottom:6px;line-height:1;font-size:13px;font-weight:700;
  color:#4A3B2E;background:rgba(255,249,238,.88);border-radius:9px;padding:4px 9px;pointer-events:none}
/* 点空白：下图轻摆（零惩罚） */
#pic-bottom.wob svg{animation:picwob .5s ease}
@keyframes picwob{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* 圈中动画（两图同步； SVG circle） */
.ring{fill:none;stroke:#E85D75;stroke-width:7;stroke-linecap:round;
  stroke-dasharray:353;stroke-dashoffset:353;animation:ring-draw .55s ease forwards;
  filter:drop-shadow(0 0 4px rgba(232,93,117,.45))}
@keyframes ring-draw{to{stroke-dashoffset:0}}
/* 连错 2 次支架：剩余一处虚线圈呼吸（首错绝不出现——给再想机会） */
.hintring{fill:none;stroke:#E8975A;stroke-width:6;stroke-dasharray:16 12;stroke-linecap:round;
  animation:hint-b 1.2s ease infinite;pointer-events:none}
@keyframes hint-b{0%,100%{opacity:.4}50%{opacity:1}}
.hotzone{fill:none;stroke:none;pointer-events:none}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}

/* ---------- 幽灵手指教学（照 batch4） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 横屏（宽>高）：两图左右并排——1280×800 每幅 483→~628 宽（5 岁半试玩 P1：竖排上下图幅不足） */
@media (orientation:landscape){
  #pics{flex-direction:row}
}

/* 竖屏（平板竖持）：题面字号微调 */
@media (orientation:portrait){
  #prompt-chip .big{font-size:22px}
}
</style>
</head>
<body>
<div id="game" aria-label="找不同">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="found-dots" aria-label="找到的不同"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
    </div>
    <div id="pics">
      <div class="pic" id="pic-top" aria-label="上面的图"></div>
      <div class="pic" id="pic-bottom" aria-label="下面的图，点一点哪里不一样"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

  sun: ['size', 'del'],
  cloud: ['move', 'size', 'del'],
  flower: ['color', 'size', 'del'],
  mushroom: ['color', 'size', 'del'],
  butterfly: ['color', 'move', 'size', 'del'],
  rabbit: ['move', 'size', 'del']

const ADD_KINDS = ['flower', 'butterfly', 'mushroom', 'cloud'];

/* 固定槽位表（手排无重叠；天带 6 + 草带 8 = 14 槽 → 章 4 元素上限 13 + 剩余空闲槽供 add）
   kinds = 该槽允许的元素类型；增删差异的 add 元素只能落在空闲槽 */
const SLOTS = [
  { id: 'A', x: 660, y: 80,  zone: 'sky',   kinds: ['sun', 'cloud'] },
  { id: 'B', x: 255, y: 68,  zone: 'sky',   kinds: ['cloud'] },
  { id: 'C', x: 445, y: 100, zone: 'sky',   kinds: ['cloud', 'butterfly'] },
  { id: 'D', x: 115, y: 118, zone: 'sky',   kinds: ['cloud', 'butterfly'] },
  { id: 'E', x: 560, y: 200, zone: 'sky',   kinds: ['butterfly'] },
  { id: 'F', x: 340, y: 206, zone: 'sky',   kinds: ['butterfly'] },
  { id: 'G', x: 95,  y: 335, zone: 'grass', kinds: ['flower', 'mushroom'] },
  { id: 'H', x: 225, y: 408, zone: 'grass', kinds: ['flower', 'mushroom'] },
  { id: 'I', x: 380, y: 318, zone: 'grass', kinds: ['flower', 'mushroom'] },
  { id: 'J', x: 505, y: 396, zone: 'grass', kinds: ['flower', 'mushroom'] },
  { id: 'K', x: 640, y: 325, zone: 'grass', kinds: ['flower', 'mushroom'] },
  { id: 'L', x: 733, y: 408, zone: 'grass', kinds: ['flower', 'mushroom'] },
  { id: 'M', x: 283, y: 282, zone: 'grass', kinds: ['flower', 'mushroom'] },
  { id: 'N', x: 735, y: 268, zone: 'grass', kinds: ['flower'] }
];

/* ---------- 各章元素配额（others = 除太阳/小兔外的元素数；min 之和保证 N 落入章区间） ---------- */
const QUOTA = {
  1: { N: [6, 8],   cloud: [1, 2], butterfly: [0, 1], flower: [3, 3], mushroom: [0, 1] },
  2: { N: [8, 10],  cloud: [1, 2], butterfly: [1, 2], flower: [3, 4], mushroom: [1, 2] },
  3: { N: [10, 12], cloud: [2, 3], butterfly: [1, 2], flower: [4, 4], mushroom: [1, 2] },
  4: { N: [12, 13], cloud: [2, 3], butterfly: [2, 2], flower: [4, 5], mushroom: [2, 2] }
};

/* ---------- 图标（全部内嵌 SVG，描边 2.5px 暖棕） ---------- */
const ICONS = {
  logo: '<svg viewBox="0 0 44 44" width="32" height="32" xmlns="http://www.w3.org/2000/svg" fill="none">' +
    '<circle cx="20" cy="24" r="15" fill="#FFF9EE" stroke="#FFF" stroke-width="3"/>' +

    '<ellipse cx="35" cy="44" rx="10" ry="6" fill="#F2B8C6" opacity=".35"/></svg>',
  /* 放大镜（题面图标） */
  look: '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">' +
    '<circle cx="27" cy="27" r="16" fill="#FFF9EE" stroke="' + INK + '" stroke-width="4"/>' +
    '<path d="M39 39 L52 52" stroke="' + INK + '" stroke-width="7" stroke-linecap="round"/>' +
    '<path d="M20 27 a7 7 0 0 1 7 -7" stroke="#E8975A" stroke-width="4" stroke-linecap="round"/></svg>'
};
/* ================= spotdiff 纯引擎：确定性关卡生成（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   章 1=2 处不同（元素 6-8）/ 章 2=3 处（8-10）/ 章 3=4 处（10-12）/ 章 4=5 处（12-13）
   差异类型：color 换色 / move 位移 / size 大小 / del 下图少 / add 下图多
   硬约束：差异点位（下图坐标）两两间距 ≥120（防一点中俩）；点位在图内（边距 ≥56）；
   移动差异落点不与其他元素重叠；所有元素中心在 viewBox 内（按各自半径留边） */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); };
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 位置抖动 + 按类钳制（天带元素不越地平线 / 草带元素不出底边） ---------- */
function placeAt(kind, x, y) {
  const vw = VIS[kind][0], vh = VIS[kind][1], jx = JIT[kind][0], jy = JIT[kind][1];
  x += ri(RND, -jx, jx); y += ri(RND, -jy, jy);
  x = Math.max(vw + 8, Math.min(VB_W - vw - 8, x));
  if (kind === 'flower' || kind === 'mushroom' || kind === 'rabbit') {   // 草带：站草地、不出底边
    y = Math.max(HORIZON + 30, Math.min(VB_H - vh - 6, y));
  } else if (kind === 'sun') {                                           // 太阳：高空
    y = Math.max(vh + 8, Math.min(140, y));
  } else if (kind === 'cloud') {                                         // 云：地平线以上
    y = Math.max(vh - 6, Math.min(172, y));
  } else {                                                               // 蝴蝶：空中飞
    y = Math.max(vh + 8, Math.min(218, y));
  }
  return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
}
let RND = null;   // genLevel 内全程同流（placeAt 依赖；verify 确定性由两跑 JSON 比对把关）

/* ---------- 元素布置：太阳固定 A 槽；小兔随机草槽；其余按配额填充 ---------- */
function layoutEls(dch, rnd) {
  const q = QUOTA[dch];
  const others = ri(rnd, q.N[0], q.N[1]) - 2;
  const free = SLOTS.slice();
  const take = slot => { free.splice(free.indexOf(slot), 1); return slot; };
  const els = [];
  /* 太阳（场景锚点，永远在） */
  let s = SLOTS[0];
  const sunP = placeAt('sun', s.x, s.y);
  els.push({ ei: 0, kind: 'sun', x: sunP[0], y: sunP[1], s: 1, c: 0 });
  take(s);
  /* 小兔（IP 形象，永远在） */
  const grassFree = () => free.filter(sl => sl.zone === 'grass');
  const skyFree = kinds => free.filter(sl => sl.zone === 'sky' && kinds.some(k => sl.kinds.indexOf(k) >= 0));
  let gs = shuffled(grassFree(), rnd)[0];
  const rbP = placeAt('rabbit', gs.x, gs.y);
  els.push({ ei: 1, kind: 'rabbit', x: rbP[0], y: rbP[1], s: 1, c: 0 });
  take(gs);
  /* 其余元素：min 起步，循环补齐到 others（容量不足提前收） */
  const cnt = { cloud: q.cloud[0], butterfly: q.butterfly[0], flower: q.flower[0], mushroom: q.mushroom[0] };
  const cap = { cloud: q.cloud[1], butterfly: q.butterfly[1], flower: q.flower[1], mushroom: q.mushroom[1] };
  const zoneOf = { cloud: 'sky', butterfly: 'sky', flower: 'grass', mushroom: 'grass' };
  const canFit = kind => (zoneOf[kind] === 'sky' ? skyFree([kind]) : free.filter(sl =>
    sl.zone === 'grass' && sl.kinds.indexOf(kind) >= 0)).length > 0;
  let total = cnt.cloud + cnt.butterfly + cnt.flower + cnt.mushroom;
  while (total < others) {
    const ks = shuffled(Object.keys(cnt), rnd).filter(k => cnt[k] < cap[k] && canFit(k));
    if (!ks.length) break;
    cnt[ks[0]]++; total++;
  }
  ['cloud', 'butterfly', 'flower', 'mushroom'].forEach(kind => {
    for (let n = 0; n < cnt[kind]; n++) {
      const cand = zoneOf[kind] === 'sky' ? skyFree([kind]) : free.filter(sl => sl.zone === 'grass' && sl.kinds.indexOf(kind) >= 0);
      if (!cand.length) return;                       // 容量兜底（配额已排布，理论不触发）
      const sl = shuffled(cand, rnd)[0];
      const p = placeAt(kind, sl.x, sl.y);
      els.push({ ei: els.length, kind: kind, x: p[0], y: p[1], s: 1, c: kind === 'cloud' ? 0 : ri(rnd, 0, 2) });
      take(sl);
    }
  });
  return { els, free };
}

/* ---------- 差异挑选：候选洗牌贪心，逐个赋型；间距 <120 或落点非法则弃选重试 ---------- */
const cntType = (diffs, t) => diffs.reduce((n, d) => n + (d.type === t ? 1 : 0), 0);
function pickDiffs(els, free, k, rnd) {
  const pts = [];                                     // 已接受差异点（下图坐标）
  const diffs = [];
  const usedEi = new Set(), usedSlot = new Set();     // 同一元素/槽位不出两个差异
  const okSpot = (x, y) => x >= 62 && x <= VB_W - 62 && y >= 52 && y <= VB_H - 34 &&
    pts.every(p => dist2(p.x, p.y, x, y) >= 120);
  const okSpace = (x, y, r, list) => list.every(e => dist2(e.x, e.y, x, y) >= r + RAD[e.kind] - 6);
  /* 基础候选（引用基础元素）+ add 候选（空闲槽新元素）；数量足够，贪心必有解 */
  for (let t = 0; t < 60 && diffs.length < k; t++) {
    const base = shuffled(els, rnd);
    const adds = shuffled(free, rnd).flatMap(sl =>
      sl.kinds.filter(kk => ADD_KINDS.indexOf(kk) >= 0).map(kk => ({ slot: sl.id, kind: kk })));
    const pool = [];
    base.forEach(e => pool.push({ ei: e.ei }));
    adds.forEach(a => pool.push({ add: a }));
    const cands = shuffled(pool, rnd);
    const types = shuffled(['color', 'move', 'size', 'del'], rnd);
    let ti = 0;
    for (let ci = 0; ci < cands.length && diffs.length < k; ci++) {
      const cd = cands[ci];
      if (cd.add) {                                   // add：下图多的新元素（落在空闲槽）
        if (usedSlot.has(cd.add.slot) || cntType(diffs, 'add') >= Math.max(1, Math.ceil(k / 2))) continue;
        const kind = cd.add.kind;
        const sl = SLOTS.find(ss => ss.id === cd.add.slot);
        const p = placeAt(kind, sl.x, sl.y);
        const others = els.concat(diffs.filter(d => d.type === 'add').map(d => d.el));
        if (!okSpot(p[0], p[1]) || !okSpace(p[0], p[1], RAD[kind] * 1.05, others)) continue;
        const el = { ei: -1, kind: kind, x: p[0], y: p[1], s: 1, c: kind === 'cloud' ? 0 : ri(rnd, 0, 2) };
        pts.push({ x: el.x, y: el.y });
        usedSlot.add(cd.add.slot);
        diffs.push({ ei: -1, type: 'add', el: el, x: el.x, y: el.y });
        continue;
      }
      if (usedEi.has(cd.ei)) continue;
      const e = els[cd.ei];
      let ty = null;
      for (let n = 0; n < 4; n++) {                   // 先取轮转型，不在白名单则退到首个可用型
        const want = types[(ti + n) % 4];
        if (DIFFABLE[e.kind].indexOf(want) >= 0) { ty = want; ti += n + 1; break; }
      }
      if (!ty) { ti++; continue; }
      if (ty === 'color') {
        const c2 = (e.c + 1 + ri(rnd, 0, 1)) % 3;     // 三色三角互换，必不重色
        if (!okSpot(e.x, e.y)) continue;
        pts.push({ x: e.x, y: e.y });
        usedEi.add(e.ei);
        diffs.push({ ei: e.ei, type: 'color', c2: c2, x: e.x, y: e.y });
      } else if (ty === 'size') {
        if (cntType(diffs, 'size') >= 2) { ty = 'color'; }                     // 同型限额（保多样性）
        if (ty === 'size') {
          const s2 = rnd() < 0.5 ? 0.62 : 1.42;
          const vw = Math.round(VIS[e.kind][0] * Math.max(1, s2)), vh = Math.round(VIS[e.kind][1] * Math.max(1, s2));
          const x2 = Math.max(vw + 8, Math.min(VB_W - vw - 8, e.x));
          const y2 = Math.max(vh + 8, Math.min(VB_H - vh - 6, e.y));
          if (Math.abs(x2 - e.x) > 8 || Math.abs(y2 - e.y) > 8) continue;   /* 反方审查 m9：放大被边缘钳出计划外位移=弃选（纯 size 差异不位移） */
          if (!okSpot(x2, y2)) continue;
          pts.push({ x: x2, y: y2 });
          usedEi.add(e.ei);
          diffs.push({ ei: e.ei, type: 'size', s2: s2, x: x2, y: y2 });
        } else {
          const c2 = (e.c + 1 + ri(rnd, 0, 1)) % 3;
          if (DIFFABLE[e.kind].indexOf('color') < 0 || !okSpot(e.x, e.y)) continue;
          pts.push({ x: e.x, y: e.y });
          usedEi.add(e.ei);
          diffs.push({ ei: e.ei, type: 'color', c2: c2, x: e.x, y: e.y });
        }
      } else if (ty === 'move') {
        const bot = bottomSnapshot(els, diffs);       // 落点不得压到其他下图元素
        let mv = null;
        for (let m = 0; m < 10 && !mv; m++) {
          const mag = 70 + ri(rnd, 0, 45), dx = (rnd() < 0.5 ? -1 : 1) * mag;
          const x2 = Math.max(RAD[e.kind] + 12, Math.min(VB_W - RAD[e.kind] - 12, e.x + dx));
          if (Math.abs(x2 - e.x) < 50) continue;      // 被钳住=位移不可见，弃
          if (!okSpot(x2, e.y)) continue;
          if (!okSpace(x2, e.y, RAD[e.kind], bot.filter(b => b.ei !== e.ei))) continue;
          mv = x2;
        }
        if (mv == null) continue;
        pts.push({ x: mv, y: e.y });
        usedEi.add(e.ei);
        diffs.push({ ei: e.ei, type: 'move', x2: mv, y2: e.y, x: mv, y: e.y });
      } else {                                        // del：下图少（点空位处）
        if (cntType(diffs, 'del') >= Math.max(1, Math.ceil(k / 2))) continue;
        if (!okSpot(e.x, e.y)) continue;
        pts.push({ x: e.x, y: e.y });
        usedEi.add(e.ei);
        diffs.push({ ei: e.ei, type: 'del', x: e.x, y: e.y });
      }
    }
    if (diffs.length < k && t >= 40) break;           // 极端兜底退出（布局留量大，理论不触发）
  }
  return diffs.slice(0, k);
}

/* ---------- 下图元素快照（move 重叠检查用：已接受差异应用后的底图） ---------- */
function bottomSnapshot(els, diffs) {
  const out = [];
  els.forEach(e => {
    const d = diffs.find(dd => dd.ei === e.ei);
    if (d && d.type === 'del') return;
    if (d && d.type === 'size') out.push({ ei: e.ei, kind: e.kind, x: d.x, y: d.y });
    else if (d && d.type === 'move') out.push({ ei: e.ei, kind: e.kind, x: d.x2, y: d.y2 });
    else out.push({ ei: e.ei, kind: e.kind, x: e.x, y: e.y });
  });
  diffs.forEach(d => { if (d.type === 'add') out.push(d.el); });
  return out;
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  RND = rnd;
  const { els, free } = layoutEls(dch, rnd);
  let k = CHAPTERS[dch].k;
  const diffs = pickDiffs(els, free, k, rnd);
  /* 反方审查 m5：pickDiffs 极端兜底可能返回 <k 条（槽位近距耗尽）——k 收缩到实际条数，
     防 foundCount>=k 永不可达的理论软锁（当前槽位表 0-99 无触发，防御性收口） */
  if (diffs.length < k) k = diffs.length;
  return { flat, ch, dch, lv, k, els: els, diffs: diffs, found: diffs.map(() => false),
    foundCount: 0, misses: 0, done: false };
}

/* ---------- 下图渲染元素（渲染真值源；UI 与 verify 共用） ---------- */
function bottomEls(L) {
  const out = [];
  L.els.forEach(e => {
    const d = L.diffs.find(dd => dd.ei === e.ei);
    if (!d) { out.push({ ei: e.ei, kind: e.kind, x: e.x, y: e.y, s: e.s, c: e.c }); return; }
    if (d.type === 'del') return;
    if (d.type === 'color') out.push({ ei: e.ei, kind: e.kind, x: e.x, y: e.y, s: e.s, c: d.c2 });
    else if (d.type === 'size') out.push({ ei: e.ei, kind: e.kind, x: d.x, y: d.y, s: d.s2, c: e.c });
    else if (d.type === 'move') out.push({ ei: e.ei, kind: e.kind, x: d.x2, y: d.y2, s: e.s, c: e.c });
    else out.push({ ei: e.ei, kind: e.kind, x: e.x, y: e.y, s: e.s, c: e.c });
  });
  L.diffs.forEach(d => { if (d.type === 'add') out.push({ ei: -1, kind: d.el.kind, x: d.el.x, y: d.el.y, s: 1, c: d.el.c }); });
  return out;
}

/* ---------- 点击判定（无 DOM）：最近未找到差异且距离 ≤R 命中
   {r:'right'|'done', i} 命中 / 'again' 点已圈中处（不计惩罚）/ 'miss' 空点（计一次错点） ---------- */
function engTap(L, x, y, R) {
  if (!L || L.done) return { r: null };
  let best = -1, bd = Infinity;
  for (let i = 0; i < L.diffs.length; i++) {
    if (L.found[i]) continue;
    const d = dist2(L.diffs[i].x, L.diffs[i].y, x, y);
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0 && bd <= R) {
    L.found[best] = true;
    L.foundCount++;
    if (L.foundCount >= L.k) L.done = true;
    return { r: L.done ? 'done' : 'right', i: best };
  }
  for (let i = 0; i < L.diffs.length; i++) {               // 点在已圈中的圈上：轻提示不计罚
    if (L.found[i] && dist2(L.diffs[i].x, L.diffs[i].y, x, y) <= R * 1.5) return { r: 'again' };
  }
  L.misses++;
  return { r: 'miss' };
}
const engWon = L => !!L && L.done;
/* 星级：错点 0 次=3 星 / 1-3 次=2 星 / 更多=1 星。永不 0 星（SPEC §2） */
const engStars = L => L.misses === 0 ? 3 : (L.misses <= 3 ? 2 : 1);
/* ================= spotdiff 主逻辑（双图渲染 / 下图点选 / 教学 / 推进）
   玩法：上下两幅同场景花园图，下图有 K 处不同；点下图不同处→圈中动画+音效+进度点亮；
   点空白轻摆零惩罚（首错不 pulse，连错 2 次才高亮剩余一处）；全找到过关。
   验收钩子：window.SPD = { get currentLevel, get quiz(), tapAt(x,y), tapDiff(i), async autoSolve() } */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援语音不受 flat 门限制（评估 P1：flat≥3 静置 20s 零救援）；idle 看护必用 sayR */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };

const topWrapEl = $id('pic-top'), bottomWrapEl = $id('pic-bottom'),
      foundTrayEl = $id('found-dots'), chipEl = $id('prompt-chip'), ghostEl = $id('ghost'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay');
const topSvgEl = () => topWrapEl.querySelector('svg');
const bottomSvgEl = () => bottomWrapEl.querySelector('svg');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none' };
let lastAct = Date.now();
let helpRedemo = false;
let hintShown = false;                          // 连错 2 次的剩余差异高亮（下次找到即隐藏）

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 72);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
  chipEl.innerHTML = ICONS.look + '<span class="big">两幅图哪里不一样？</span>';
}

/* ================= 场景 SVG（上图=基准元素；下图=bottomEls 应用差异；viewBox 同 800×460） ================= */
function elSvg(e) {
  const t = 'translate(' + e.x + ',' + e.y + ') scale(' + e.s.toFixed(3) + ')';
  if (e.kind === 'sun') {
    let rays = '';
    for (let i = 0; i < 8; i++) {
      const a = i * 45 * Math.PI / 180;
      rays += '<line x1="' + (Math.sin(a) * 46).toFixed(1) + '" y1="' + (-Math.cos(a) * 46).toFixed(1) +
        '" x2="' + (Math.sin(a) * 60).toFixed(1) + '" y2="' + (-Math.cos(a) * 60).toFixed(1) +
        '" stroke="#F2C94C" stroke-width="6" stroke-linecap="round"/>';
    }
    return '<g transform="' + t + '">' + rays +
      '<circle r="38" fill="#F7CE46" stroke="' + INK + '" stroke-width="4"/>' +
      '<circle cx="-12" cy="-6" r="3.6" fill="' + INK + '"/><circle cx="12" cy="-6" r="3.6" fill="' + INK + '"/>' +
      '<path d="M-10 8 q10 9 20 0" stroke="' + INK + '" stroke-width="3.5" fill="none" stroke-linecap="round"/>' +
      '<circle cx="-22" cy="6" r="5" fill="#F2B8C6" opacity=".7"/><circle cx="22" cy="6" r="5" fill="#F2B8C6" opacity=".7"/></g>';
  }
  if (e.kind === 'cloud') {
    return '<g transform="' + t + '" opacity=".96">' +
      '<ellipse cx="-36" cy="6" rx="30" ry="19" fill="#FFFFFF" stroke="#DCCFB8" stroke-width="3"/>' +
      '<ellipse cx="36" cy="8" rx="27" ry="17" fill="#FFFFFF" stroke="#DCCFB8" stroke-width="3"/>' +
      '<ellipse cx="0" cy="-8" rx="36" ry="25" fill="#FFFFFF" stroke="#DCCFB8" stroke-width="3"/>' +
      '<ellipse cx="0" cy="8" rx="44" ry="18" fill="#FFFFFF"/></g>';
  }
  if (e.kind === 'flower') {
    let petals = '';
    for (let i = 0; i < 6; i++) {
      petals += '<ellipse rx="12" ry="16" cy="-24" fill="' + COLORS[e.c] + '" stroke="' + INK +
        '" stroke-width="2.5" transform="rotate(' + i * 60 + ')"/>';
    }
    return '<g transform="' + t + '">' +
      '<path d="M0 8 q-5 26 0 46" stroke="#7FA069" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="-13" cy="32" rx="11" ry="6" fill="#9CC48A" stroke="#7FA069" stroke-width="2" transform="rotate(-24 -13 32)"/>' +
      petals + '<circle r="10.5" fill="#F7CE46" stroke="' + INK + '" stroke-width="2.5"/></g>';
  }
  if (e.kind === 'butterfly') {
    return '<g transform="' + t + '">' +
      '<ellipse cx="-17" cy="-8" rx="14" ry="18" fill="' + COLORS[e.c] + '" stroke="' + INK + '" stroke-width="2.5"/>' +
      '<ellipse cx="17" cy="-8" rx="14" ry="18" fill="' + COLORS[e.c] + '" stroke="' + INK + '" stroke-width="2.5"/>' +
      '<ellipse cx="-13" cy="11" rx="10" ry="12" fill="' + COLORS[e.c] + '" stroke="' + INK + '" stroke-width="2.5" opacity=".9"/>' +
      '<ellipse cx="13" cy="11" rx="10" ry="12" fill="' + COLORS[e.c] + '" stroke="' + INK + '" stroke-width="2.5" opacity=".9"/>' +
      '<ellipse cx="0" cy="2" rx="5.5" ry="17" fill="#8A7B6C" stroke="' + INK + '" stroke-width="2"/>' +
      '<path d="M-3 -14 q-6 -9 -11 -11 M3 -14 q6 -9 11 -11" stroke="' + INK + '" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
      '<circle cx="-14" cy="-10" r="2" fill="#FFF" opacity=".85"/><circle cx="14" cy="-10" r="2" fill="#FFF" opacity=".85"/></g>';
  }
  if (e.kind === 'mushroom') {
    return '<g transform="' + t + '">' +
      '<rect x="-10" y="-2" width="20" height="30" rx="7" fill="#F7EEDE" stroke="' + INK + '" stroke-width="3"/>' +
      '<path d="M-31 -2 A31 31 0 0 1 31 -2 Z" fill="' + COLORS[e.c] + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>' +
      '<circle cx="-13" cy="-16" r="4.5" fill="#FFF" opacity=".92"/><circle cx="6" cy="-21" r="3.6" fill="#FFF" opacity=".92"/>' +
      '<circle cx="17" cy="-11" r="3" fill="#FFF" opacity=".92"/></g>';
  }
  /* rabbit（迷你小兔，IP 形象） */
  return '<g transform="' + t + '">' +
    '<ellipse cx="0" cy="24" rx="20" ry="14" fill="#FBF7F0" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<circle cx="10" cy="26" r="6" fill="#FBF7F0" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<ellipse cx="-11" cy="-22" rx="7" ry="19" fill="#FBF7F0" stroke="' + INK + '" stroke-width="2.5" transform="rotate(-9 -11 -22)"/>' +
    '<ellipse cx="-11" cy="-22" rx="3" ry="12" fill="#F2B8C6" transform="rotate(-9 -11 -22)"/>' +
    '<ellipse cx="9" cy="-23" rx="7" ry="20" fill="#FBF7F0" stroke="' + INK + '" stroke-width="2.5" transform="rotate(11 9 -23)"/>' +
    '<ellipse cx="9" cy="-23" rx="3" ry="13" fill="#F2B8C6" transform="rotate(11 9 -23)"/>' +
    '<circle cx="0" cy="-2" r="19" fill="#FBF7F0" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<circle cx="-7" cy="-4" r="2.8" fill="' + INK + '"/><circle cx="7" cy="-4" r="2.8" fill="' + INK + '"/>' +
    '<ellipse cx="0" cy="2" rx="2.6" ry="2" fill="#D98A8A"/>' +
    '<path d="M-4 7 q4 3.5 8 0" stroke="' + INK + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>' +
    '<ellipse cx="-13" cy="4" rx="4.5" ry="3.2" fill="#F2B8C6" opacity=".8"/><ellipse cx="13" cy="4" rx="4.5" ry="3.2" fill="#F2B8C6" opacity=".8"/></g>';
}
const SCENE_DECO =                                   // 静景（两图完全一致，不参与差异）
  '<defs><linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">' +
  '<stop offset="0" stop-color="#C9E8F6"/><stop offset="1" stop-color="#E6F5FB"/></linearGradient>' +
  '<linearGradient id="grsG" x1="0" y1="0" x2="0" y2="1">' +
  '<stop offset="0" stop-color="#BCDF9F"/><stop offset="1" stop-color="#A4D187"/></linearGradient></defs>' +
  '<rect width="800" height="460" fill="url(#skyG)"/>' +
  '<path d="M0 268 Q140 240 300 258 T620 252 Q720 246 800 258 L800 460 L0 460 Z" fill="url(#grsG)"/>' +
  '<path d="M0 268 Q140 240 300 258 T620 252 Q720 246 800 258" fill="none" stroke="#8FBF7F" stroke-width="5" stroke-linecap="round" opacity=".6"/>' +
  '<path d="M120 300 q3 -16 0 -24 M132 302 q4 -12 9 -18 M109 302 q-4 -12 -9 -18" stroke="#7FA069" stroke-width="4" fill="none" stroke-linecap="round"/>' +
  '<path d="M452 386 q3 -16 0 -24 M464 388 q4 -12 9 -18 M441 388 q-4 -12 -9 -18" stroke="#7FA069" stroke-width="4" fill="none" stroke-linecap="round"/>' +
  '<path d="M688 356 q3 -16 0 -24 M700 358 q4 -12 9 -18 M677 358 q-4 -12 -9 -18" stroke="#7FA069" stroke-width="4" fill="none" stroke-linecap="round"/>';
function sceneSvg(els, withLayers) {
  const body = els.slice().sort((a, b) => a.y - b.y).map(elSvg).join('');
  return '<svg viewBox="0 0 ' + VB_W + ' ' + VB_H + '" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true" preserveAspectRatio="xMidYMid meet">' +
    SCENE_DECO + body +
    (withLayers ? '<g class="rings"></g><g class="hints"></g><g class="hotzones"></g>' : '<g class="rings"></g>') +
    '</svg>';
}

/* ================= 渲染 ================= */
function renderPics() {
  topWrapEl.innerHTML = sceneSvg(cur.els, false) + '<div class="cap">上面的图</div>';
  bottomWrapEl.innerHTML = sceneSvg(bottomEls(cur), true) + '<div class="cap">点下面的图</div>';
  layoutStage();
  renderHotzones();
  renderFound();
}
/* 命中热区（透明圆，仅几何证明触摸目标 ≥64px 半径；判定走最近-距离数学） */
function hitRadiusVb() {
  const svg = bottomSvgEl();
  if (!svg) return 64;
  const r = svg.getBoundingClientRect();
  const scale = r.width / VB_W;
  return scale > 0 ? 64 / scale : 64;
}
function renderHotzones() {
  const svg = bottomSvgEl();
  const g = svg && svg.querySelector('.hotzones');
  if (!g) return;
  g.innerHTML = '';
  const Rv = hitRadiusVb();
  cur.diffs.forEach((d, i) => {
    if (cur.found[i]) return;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('class', 'hotzone');
    c.setAttribute('data-i', i);
    c.setAttribute('cx', d.x); c.setAttribute('cy', d.y);
    c.setAttribute('r', Math.round(Rv * 10) / 10);
    g.appendChild(c);
  });
}
function renderFound() {                         // HUD 找到进度：K 个小圆点亮起
  foundTrayEl.innerHTML = '';
  for (let i = 0; i < cur.k; i++) {
    const d = document.createElement('i');
    d.className = cur.found[i] ? 'done' : '';
    foundTrayEl.appendChild(d);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
/* 圈中标记（下图=差异处；上图确认视觉锚点——move 类元素已挪走，须圈在原位） */
function drawRing(i) {
  const d = cur.diffs[i];
  /* 反方审查 m8：move 类 d.x/d.y=下图新位，上图该处是空地——上图圈 els 原位 */
  const topPos = d.type === 'move' && cur.els[d.ei] ? { x: cur.els[d.ei].x, y: cur.els[d.ei].y } : { x: d.x, y: d.y };
  [[topSvgEl(), topPos], [bottomSvgEl(), { x: d.x, y: d.y }]].forEach(pair => {
    const svg = pair[0], pos = pair[1];
    if (!svg) return;
    const g = svg.querySelector('.rings');
    if (!g) return;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('class', 'ring');
    c.setAttribute('cx', pos.x); c.setAttribute('cy', pos.y);
    c.setAttribute('r', 56);
    g.appendChild(c);
  });
  const bsvg = bottomSvgEl();
  const hz = bsvg && bsvg.querySelector('.hotzones .hotzone[data-i="' + i + '"]');
  if (hz) hz.remove();
}
/* 连错 2 次支架：高亮剩余最近一处（虚线圈呼吸；首错绝不 pulse——给再想机会） */
function showHintRing(x, y) {
  hideHintRing();
  const svg = bottomSvgEl();
  const g = svg && svg.querySelector('.hints');
  if (!g) return;
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('class', 'hintring');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 62);
  g.appendChild(c);
  hintShown = true;
}
function hideHintRing() {
  const svg = bottomSvgEl();
  const g = svg && svg.querySelector('.hints');
  if (g) g.innerHTML = '';
  hintShown = false;
}

/* ================= 尺寸（双 viewport：两图各 ≥200 高、宽 ≤800）
   横屏两图左右并排（与 CSS orientation:landscape 同源读 computed style）：
   单行高不受 /2 限制 → 1280×800 每幅 476→628 宽（5 岁半试玩 P1） ================= */
function layoutStage() {
  const st = $id('stage');
  const availW = st.clientWidth - 16;
  const availH = st.clientHeight - $id('prompt').offsetHeight - 30;   // 提示行 + 图注两行 + 间隙
  const row = getComputedStyle($id('pics')).flexDirection === 'row';
  let w = row
    ? Math.min((availW - 14) / 2, 780, (availH - 4) * VB_W / VB_H)
    : Math.min(availW, 780, Math.floor((availH - 10) / 2 * VB_W / VB_H));
  if (w < 348) w = Math.min(348, Math.max(200, availW));              // 极小窗兜底（标准双 viewport 不触发）
  const root = document.documentElement.style;
  root.setProperty('--imgw', Math.floor(w) + 'px');
}
window.addEventListener('resize', () => { if (cur) { layoutStage(); renderHotzones(); } });

/* ================= 幽灵手指（教学"帮"/演示共用；坐标=下图 vb 坐标换算页面像素） ================= */
const ghost = {
  toVb(x, y) {
    const svg = bottomSvgEl();
    if (!svg) return;
    const r = svg.getBoundingClientRect();
    ghostEl.style.left = (r.left + x / VB_W * r.width) + 'px';
    ghostEl.style.top = (r.top + y / VB_H * r.height) + 'px';
  },
  show(reason) { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(x, y) {
  if (VERIFY) return;
  ghost.toVb(x, y); ghost.show('tut');
  setTimeout(() => ghost.press(), 800);
}

/* ================= 点选主路径（真实点击 / SPD.tapAt / tapDiff / autoSolve 共用） ================= */
async function uiTapAt(x, y, R, demo) {
  if (!cur || state.locked || state.won || (state.demo && !demo)) return { r: null };
  const res = engTap(cur, x, y, R);
  if (res.r === null || res.r === 'again') {
    if (res.r === 'again') sfx('pop');
    return res;
  }
  lastAct = Date.now();
  if (res.r === 'right' || res.r === 'done') {
    if (state.tut === 'help') {                   // 教学"独"：首次找到 → 强化反馈放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    hideHintRing();
    drawRing(res.i);
    renderFound();
    sfx('coin');
    if (res.r === 'done') { await wait(880 * SPEED); winFlow(); }
    return res;
  }
  /* miss：点空白 → 下图轻摆（零惩罚，可再点）；首错只轻声提示，连错 2 次才高亮剩余一处 */
  state.locked = true;
  bottomWrapEl.classList.remove('wob'); void bottomWrapEl.offsetWidth; bottomWrapEl.classList.add('wob');
  sfx('fail');
  sayP(VOICE.hint.key, VOICE.hint.text);
  if (cur.misses >= 2) {
    let bi = -1, bd = Infinity;
    cur.diffs.forEach((d, i) => {
      if (cur.found[i]) return;
      const dd = dist2(d.x, d.y, x, y);
      if (dd < bd) { bd = dd; bi = i; }
    });
    if (bi >= 0) showHintRing(cur.diffs[bi].x, cur.diffs[bi].y);
  }
  await wait(520 * SPEED);
  state.locked = false;
  return res;
}
/* 真实指针：下图按下即判定（坐标→viewBox；命中半径 64px 页面像素换算 vb） */
function toVb(e) {
  const svg = bottomSvgEl();
  if (!svg) return null;
  const m = svg.getScreenCTM();
  if (!m) return null;
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(m.inverse());
  return [p.x, p.y];
}
bottomWrapEl.addEventListener('pointerdown', e => {
  if (!cur || state.locked || state.won || state.demo) return;
  const p = toVb(e);
  if (!p) return;
  e.preventDefault();
  uiTapAt(p[0], p[1], hitRadiusVb());
});
/* 点上图轻提示（5 岁半试玩 P2：孩子第一反应高发点完全无反馈；10s 节流，sayR 不受 flat 门） */
let topTipAt = 0;
topWrapEl.addEventListener('pointerdown', e => {
  if (!cur || state.locked || state.won || state.demo) return;
  e.preventDefault();
  lastAct = Date.now();
  if (Date.now() - topTipAt > 10000) { topTipAt = Date.now(); sayR(VOICE.top.key, VOICE.top.text); }
});

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                             // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                              // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                 // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  clearTimeout(helpTimer);
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none' };
  helpRedemo = false;
  lastAct = Date.now();
  renderPics(); renderDots();
  if (VERIFY) return;
  const sv = KIDS._save();
  const freshTut = flat === 0 && !sv.levels['1-0'] && !(sv.spotdiff && sv.spotdiff.tutSeen);
  if (freshTut) { tutorialWatch(); return; }
  sayR(VOICE.hint.key, VOICE.hint.text);        /* 开场任务语音不设 flat 门（5 岁半试玩共性 P2：不识字孩子 flat≥3 全静默） */
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独 ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayP(VOICE.watch.key, VOICE.watch.text);
  await wait(700 * SPEED);
  const d = cur.diffs[0];
  pointGhostAt(d.x, d.y);
  await wait(1500 * SPEED);
  ghost.press();
  await wait(400 * SPEED);
  state.demo = false;                             // 临时解锁走真实路径演示一次完整圈中演出
  state.locked = false;
  await uiTapAt(d.x, d.y, 40, true);
  const sv = KIDS._save();
  sv.spotdiff = sv.spotdiff || {};
  sv.spotdiff.tutSeen = true;
  KIDS.store.persist();
  sayP(VOICE.turn.key, VOICE.turn.text);
  await wait(500 * SPEED);
  ghost.hide();
  cur = genLevel(0);                              // 确定性关卡：同一关重来（图面一致）
  state = { locked: false, won: false, demo: false, tut: 'help' };
  helpRedemo = false;
  lastAct = Date.now();
  renderPics(); renderDots();
  setTimeout(() => { if (state.tut === 'help') pointGhostAt(cur.diffs[0].x, cur.diffs[0].y); }, 600);
}

/* ================= 无操作看护：20s 救援语音 / 教学"帮"5s 重演示一次 ================= */
let helpTimer = null;
setInterval(() => {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  const idle = Date.now() - lastAct;
  if (idle > 20000) {
    sayR(VOICE.hint.key, VOICE.hint.text);        // 救援语音不受 flat 门（评估 P1）
    lastAct = Date.now();
    return;
  }
  if (idle > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {
    helpRedemo = true;
    pointGhostAt(cur.diffs[0].x, cur.diffs[0].y);
  }
}, 1000);

/* ================= 底栏交互 ================= */
function hopRabbit() {
  rabbitBtn.classList.remove('hop'); void rabbitBtn.offsetWidth; rabbitBtn.classList.add('hop');
}
rabbitBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur) return;
  lastAct = Date.now();
  hopRabbit();
  sayP(VOICE.hint.key, VOICE.hint.text);
});
replayBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur) return;
  lastAct = Date.now();
  startLevel(cur.flat);
});

/* ================= 启动（verify 分支由 game-verify.js 接管） ================= */
buildStatic();
if (!VERIFY) {
  KIDS.init({ game: 'spotdiff', title: '找不同' });
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  let first = 0;
  for (let i = 0; i < lim; i++) { if (!sv.levels[keys[i]]) { first = i; break; } }
  if (lim > 0 && KIDS.calendar.dayDone(keys)) {   // 今日新关已玩完：收尾画面（可关闭继续重玩）
    KIDS.ui.dayEnd({ nextHint: nextHint(lim) });
    first = 0;
  }
  startLevel(first);
}

/* ================= 验收钩子（getter 模式，返回拷贝非活引用） ================= */
window.SPD = {
  get currentLevel() {
    return cur ? { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv, k: cur.k,
      foundCount: cur.foundCount, misses: cur.misses, done: cur.done, won: state.won } : null;
  },
  get quiz() {
    if (!cur || cur.done) return null;
    return { k: cur.k,
      diffs: cur.diffs.map(d => ({ x: d.x, y: d.y, type: d.type })),
      found: cur.found.slice() };
  },
  tapAt(x, y) { return uiTapAt(x, y, hitRadiusVb()); },         // 按坐标找最近 diff 判定（真实点击模拟）
  tapDiff(i) { const d = cur && cur.diffs[i]; return d ? uiTapAt(d.x, d.y, 40) : { r: null }; },
  async autoSolve() {                                            // UI 路径自动点完当前关（走真实判定流程）
    let n = 0;
    while (cur && !cur.done && n++ < 12) {
      const i = cur.found.indexOf(false);
      if (i < 0) break;
      await uiTapAt(cur.diffs[i].x, cur.diffs[i].y, 40);
      await wait(60 * SPEED);
    }
    return { done: !!(cur && cur.done), taps: n };
  },
  get tutorial() { return state.tut; }
};
/* ================= ?verify=1 自检（仅 verify 分支加载执行）
   ① 静态 20 + 生成 20 关（flat 0-39）全量审计：确定性 / K 与元素数在章区间 /
     差异类型合法（类型在元素白名单，color 必换色 / size 必变径 / move 必位移 ≥50 /
     del 上图有下图无 / add 下图有上图无）/ 非差异元素两图一致 / 差异点位两两 ≥120 /
     点位在图内 / 元素中心在 viewBox 内 / 下图元素两两不重叠 / 引擎直驱 autoSolve 通关
   ② tapAt 判定单元：正例（diff 坐标 ±60 内命中）/ 负例（远离全部差异不命中、计罚）
   ③ UI 冒烟：autoSolve UI 路径通关 flat0（K=2）与 flat17（K=5）+ 进度点 DOM 断言
   ④ 布局：上下图各 ≥200px 高、命中热区（透明 hit 圆）直径 ≥127px、overflowX ≤0
   ⑤ 零惩罚：点空白计 miss 不锁关；首错不出高亮圈，连错 2 次才出
   结果写 #verify-result + document.title='VERIFY PASS n/n' */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;
  const RAD2 = (a, b, c, d) => { const x = a - c, y = b - d; return Math.sqrt(x * x + y * y); };
  const N_RANGE = { 1: [6, 8], 2: [8, 10], 3: [10, 12], 4: [12, 13] };   // 元素数章区间（含太阳+小兔）

  /* ---- ① 40 关全量审计（flat 0-39） ---- */
  const typeDist = {};
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const strip = L => ({ k: L.k, els: L.els, diffs: L.diffs });
    const det = JSON.stringify(strip(L1)) === JSON.stringify(strip(L2));   // 确定性
    const dch = L1.dch;
    const kOk = L1.k === CHAPTERS[dch].k && L1.diffs.length === L1.k;
    const nOk = L1.els.length >= N_RANGE[dch][0] && L1.els.length <= N_RANGE[dch][1];
    let typesOk = true, posOk = true, spaceOk = true, elsInOk = true, topBotOk = true;
    const bot = bottomEls(L1);
    const byEi = ei => bot.filter(b => b.ei === ei);
    L1.diffs.forEach(d => {
      typeDist[d.type] = (typeDist[d.type] || 0) + 1;
      if (d.x < 62 || d.x > VB_W - 62 || d.y < 52 || d.y > VB_H - 34) posOk = false;   // 点位在图内
      if (d.type === 'add') {
        if (ADD_KINDS.indexOf(d.el.kind) < 0) typesOk = false;
        if (byEi(-1).filter(b => b.x === d.el.x && b.y === d.el.y).length < 1) topBotOk = false;
      } else {
        const e = L1.els[d.ei];
        if (!e || DIFFABLE[e.kind].indexOf(d.type) < 0) { typesOk = false; return; }
        const be = byEi(d.ei)[0];
        if (d.type === 'color') { if (!be || be.c === e.c) topBotOk = false; }
        if (d.type === 'size') { if (!be || Math.abs(be.s - e.s) < 0.3 || be.s !== d.s2) topBotOk = false; }
        if (d.type === 'move') { if (!be || Math.abs(be.x - e.x) < 50) topBotOk = false; }
        if (d.type === 'del') { if (be) topBotOk = false; }
      }
    });
    for (let a = 0; a < L1.diffs.length; a++)                                  // 差异点位两两 ≥120
      for (let b = a + 1; b < L1.diffs.length; b++) {
        const p = L1.diffs[a], q = L1.diffs[b];
        if (RAD2(p.x, p.y, q.x, q.y) < 119.5) spaceOk = false;
      }
    L1.els.forEach(e => {                                                      // 元素视觉边界在图内（VIS 含描边/花茎/兔耳）
      const vw = VIS[e.kind][0], vh = VIS[e.kind][1];
      if (e.x - vw < 4 || e.x + vw > VB_W - 4 || e.y - vh < 4 || e.y + vh > VB_H - 4) elsInOk = false;
      if ((e.kind === 'flower' || e.kind === 'mushroom' || e.kind === 'rabbit') && e.y < 262) elsInOk = false;   // 草带在草上
      if ((e.kind === 'butterfly') && e.y > 226) elsInOk = false;              // 蝴蝶在空中
    });
    bot.forEach(e => {                                                         // 下图元素（放大/新增）同受图内约束
      const vw = VIS[e.kind][0] * Math.max(1, e.s), vh = VIS[e.kind][1] * Math.max(1, e.s);
      if (e.x - vw < 2 || e.x + vw > VB_W - 2 || e.y - vh < 2 || e.y + vh > VB_H - 2) elsInOk = false;
    });
    let overlapOk = true, ovDetail = '';                                        // 下图元素两两不重叠（抖动/移动余量）
    for (let a = 0; a < bot.length && overlapOk; a++)
      for (let b = a + 1; b < bot.length && overlapOk; b++) {
        const need = RAD[bot[a].kind] * Math.max(1, bot[a].s) + RAD[bot[b].kind] * Math.max(1, bot[b].s) - 22;
        if (RAD2(bot[a].x, bot[a].y, bot[b].x, bot[b].y) < need) {
          overlapOk = false; ovDetail = bot[a].kind + '/' + bot[b].kind + '=' + RAD2(bot[a].x, bot[a].y, bot[b].x, bot[b].y).toFixed(0);
        }
      }
    const countOk = bot.length === L1.els.length - L1.diffs.filter(d => d.type === 'del').length +
      L1.diffs.filter(d => d.type === 'add').length;
    L1.els.forEach(e => {                                                      // 非差异元素两图一致
      if (L1.diffs.some(d => d.ei === e.ei)) return;
      const be = byEi(e.ei)[0];
      if (!be || be.x !== e.x || be.y !== e.y || be.s !== e.s || be.c !== e.c) topBotOk = false;
    });
    /* 引擎直驱：逐差异中心点击 → 全找到通关（0 错点 3 星）；远离点计罚不推进 */
    L1.diffs.forEach(d => engTap(L1, d.x, d.y, 60));
    const solved = engWon(L1) && L1.foundCount === L1.k && L1.misses === 0 && engStars(L1) === 3;
    const ok = det && kOk && nOk && typesOk && posOk && spaceOk && elsInOk && overlapOk && countOk && topBotOk && solved;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: dch, k: L1.k, els: L1.els.length, ok: ok, det: det, kOk: kOk, nOk: nOk,
      typesOk: typesOk, posOk: posOk, spaceOk: spaceOk, elsInOk: elsInOk, overlapOk: overlapOk,
      countOk: countOk, topBotOk: topBotOk, solved: solved, types: L1.diffs.map(d => d.type) };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② tapAt 判定单元：负例先行（远离全部差异不命中、计罚不推进）+ 正例（±60 邻域命中） ---- */
  total++;
  startLevel(0);
  const qz = SPD.quiz;
  let far = null;
  outer:
  for (let gy = 90; gy <= 420; gy += 30) {
    for (let gx = 80; gx <= 720; gx += 30) {
      if (qz.diffs.every(d => RAD2(gx, gy, d.x, d.y) >= 150)) { far = [gx, gy]; break outer; }
    }
  }
  let negOk = false;
  const negCase = [];
  if (far) {
    const res = await SPD.tapAt(far[0], far[1]);
    const lv = SPD.currentLevel;
    negOk = res.r === 'miss' && lv.misses === 1 && lv.foundCount === 0 && !lv.done;
    negCase.push({ p: far, r: res.r, misses: lv.misses, found: lv.foundCount });
  }
  const posCases = [];
  const offs = [[-60, 0], [0, 60], [42, -42]];
  let posOk = true;
  for (let i = 0; i < qz.k; i++) {
    for (let oi = 0; oi < offs.length; oi++) {
      startLevel(0);                              // 每例独立新关（同一确定性关）
      const d = SPD.quiz.diffs[i];
      const res = await SPD.tapAt(d.x + offs[oi][0], d.y + offs[oi][1]);
      const lv = SPD.currentLevel;
      const good = (res.r === 'right' || res.r === 'done') && lv.foundCount === 1 && lv.misses === 0;
      posCases.push({ i: i, off: offs[oi], r: res.r, found: lv.foundCount, good: good });
      if (!good) posOk = false;
    }
  }
  const tapOk = posOk && negOk && posCases.length === qz.k * 3;
  if (tapOk) npass++;
  units.tapAt = { ok: tapOk, posOk: posOk, negOk: negOk, pos: posCases, neg: negCase };

  /* ---- ③ UI 冒烟：autoSolve UI 路径通关 flat0（K=2）/ flat17（K=5）+ 进度点 DOM ---- */
  for (const f of [0, 17]) {
    total++;
    startLevel(f);
    const a = await SPD.autoSolve();
    const lv = SPD.currentLevel;
    const dots = document.querySelectorAll('#found-dots i');
    const dotsOn = document.querySelectorAll('#found-dots i.done').length;
    const rings = document.querySelectorAll('#pic-bottom .ring').length;
    const ok = a.done && lv && lv.done && lv.won && lv.misses === 0 && engStars(cur) === 3 &&
      dots.length === lv.k && dotsOn === lv.k && rings === lv.k;
    if (ok) npass++;
    smokes['autoSolve' + f] = { done: a.done, taps: a.taps, k: lv && lv.k, misses: lv && lv.misses,
      dots: dots.length, dotsOn: dotsOn, rings: rings, won: lv && lv.won, ok: ok };
  }

  /* ---- ④ 布局：上下图 ≥200 高、命中热区直径 ≥127、overflowX ≤0 ---- */
  total++;
  startLevel(0);
  const de = document.documentElement;
  const tr = topWrapEl.querySelector('svg').getBoundingClientRect();
  const br = bottomWrapEl.querySelector('svg').getBoundingClientRect();
  const hzs = document.querySelectorAll('#pic-bottom .hotzone');
  const hzRects = Array.prototype.map.call(hzs, h => h.getBoundingClientRect());
  const hzMin = hzRects.length ? Math.min.apply(null, hzRects.map(r => Math.min(r.width, r.height))) : 0;
  const layout = { topW: Math.round(tr.width), topH: Math.round(tr.height),
    botW: Math.round(br.width), botH: Math.round(br.height), hotzones: hzs.length,
    hzMin: Math.round(hzMin), overflowX: de.scrollWidth - window.innerWidth };
  const layoutOk = tr.height >= 200 && br.height >= 200 && tr.width <= 800 && br.width <= 800 &&
    hzs.length === cur.k && hzMin >= 127 && layout.overflowX <= 0;
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, layout: layout };

  /* ---- ⑤ 零惩罚单元：点空白计 miss 不锁关；首错无高亮圈、二错才出 ---- */
  total++;
  startLevel(2);                                  // 非 flat0（无教学路径干扰）
  const svgB = bottomWrapEl.querySelector('svg');
  const rectB = svgB.getBoundingClientRect();
  const toPage = (x, y) => [rectB.left + x / VB_W * rectB.width, rectB.top + y / VB_H * rectB.height];
  let far2 = null;
  outer2:
  for (let gy = 90; gy <= 420; gy += 30) {
    for (let gx = 80; gx <= 720; gx += 30) {
      const q = SPD.quiz;
      if (q.diffs.every((d, i) => q.found[i] || RAD2(gx, gy, d.x, d.y) >= 150)) { far2 = [gx, gy]; break outer2; }
    }
  }
  const pen = { far: far2 };
  let penOk = false;
  if (far2) {
    /* 真实指针事件点空白（page 坐标）→ 轻摆 + miss 计数；首错不出现高亮圈 */
    const el = document.elementFromPoint(toPage(far2[0], far2[1])[0], toPage(far2[1], far2[1])[1]);
    pen.target = el ? (el.id || el.tagName) : null;
    const r1 = await SPD.tapAt(far2[0], far2[1]);
    await wait(600);
    const lv1 = SPD.currentLevel;
    pen.first = { r: r1.r, misses: lv1.misses, found: lv1.foundCount,
      hintring: document.querySelectorAll('#pic-bottom .hintring').length,
      locked: state.locked, dots: document.querySelectorAll('#found-dots i.done').length };
    const r2 = await SPD.tapAt(far2[0], far2[1]);
    await wait(600);
    const lv2 = SPD.currentLevel;
    pen.second = { r: r2.r, misses: lv2.misses,
      hintring: document.querySelectorAll('#pic-bottom .hintring').length };
    penOk = pen.first.r === 'miss' && pen.first.misses === 1 && pen.first.found === 0 &&
      pen.first.hintring === 0 && !pen.first.locked &&                                    // 首错：零惩罚不锁、不高亮
      pen.second.r === 'miss' && pen.second.misses === 2 && pen.second.hintring === 1;    // 二错：支架高亮出现
    /* 点一个已圈中处（先找到一处）不重复计罚 */
    startLevel(2);
    const q2 = SPD.quiz;
    await SPD.tapDiff(0);
    const again = await SPD.tapAt(q2.diffs[0].x, q2.diffs[0].y);
    const lv3 = SPD.currentLevel;
    pen.again = { r: again.r, misses: lv3.misses, found: lv3.foundCount };
    penOk = penOk && pen.again.r === 'again' && pen.again.misses === 0 && pen.again.found === 1;
  }
  if (penOk) npass++;
  units.penalty = { ok: penOk, pen: pen };

  /* ---- 分布断言：四类差异在 40 关语料里都出现 ---- */
  total++;
  const distOk = ['color', 'move', 'size', 'del', 'add'].every(t => (typeDist[t] || 0) > 0);
  if (distOk) npass++;
  units.dist = { ok: distOk, dist: typeDist };

  const out = { game: 'spotdiff', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  runVerify();
}

</script>
