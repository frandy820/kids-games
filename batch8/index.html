<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子的游戏屋 · 幼小衔接新游戏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FBF3E4;color:#4A3B2E;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:34px 22px}
  .logo{width:150px;height:150px}
  h1{font-size:clamp(26px,5vw,38px);letter-spacing:.05em}
  .ageband{display:inline-flex;align-items:center;gap:8px;background:#7FA88F;color:#fff;font-size:16px;font-weight:700;
           padding:7px 18px;border-radius:999px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px;width:100%;max-width:760px}
  a.card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 24px;border-radius:26px;
         background:#FFF9EE;border:2.5px solid #4A3B2E;text-decoration:none;color:#4A3B2E;
         box-shadow:0 5px 0 #D8C9B4;transition:transform .2s}
  a.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
  @media (hover:hover){
    a.card:hover{transform:translateY(-4px);box-shadow:0 9px 0 #D8C9B4}
  }
  .card .icon{width:92px;height:92px}
  .card .name{font-size:22px;font-weight:700}
  .card .desc{font-size:14px;color:#8A7B6C;line-height:1.6;text-align:center}
  .foot{font-size:12.5px;color:#8A7B6C;text-align:center;line-height:1.8;max-width:520px}
</style>
</head>
<body>
  <div class="logo" id="logo"></div>
  <h1>小兔子的游戏屋 · 幼小衔接新游戏</h1>
  <div class="ageband">★ 6-7 岁 · 幼小衔接 ★</div>
  <div class="grid">
    <a class="card" href="neighbors/index.html">

      <div class="name">数的邻居</div>
      <div class="desc">比 5 多一是几<br>数字街上找邻居</div>
    </a>
    <a class="card" href="picto/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="36" r="17" fill="#E8B04F" stroke="#4A3B2E" stroke-width="2.5"/><circle cx="30" cy="36" r="3" fill="#4A3B2E"/><path d="M58 84 q-10 -14 -2 -26 q6 -10 2 -22" stroke="#8A7B6C" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M62 78 q14 4 18 -6" stroke="#8A7B6C" stroke-width="3.4" fill="none" stroke-linecap="round"/><text x="76" y="30" font-size="24" font-weight="800" fill="#4A3B2E" text-anchor="middle" font-family="KaiTi,STKaiti,serif">月</text><path d="M74 44 l-7 2 M80 44 l-2 7" stroke="#E8975A" stroke-width="2.4" stroke-linecap="round"/><path d="M18 62 q12 10 24 2" stroke="#8FBF7F" stroke-width="3.4" fill="none" stroke-linecap="round"/></svg></div>
      <div class="name">象形字</div>
      <div class="desc">古时候的画<br>变成今天的字</div>
    </a>
    <a class="card" href="worden/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="58" rx="26" ry="22" fill="#F0913D" stroke="#4A3B2E" stroke-width="2.5"/><path d="M36 44 l-6 -12 10 6 M64 44 l6 -12 -10 6" fill="#F0913D" stroke="#4A3B2E" stroke-width="2" stroke-linejoin="round"/><circle cx="42" cy="54" r="2.6" fill="#4A3B2E"/><circle cx="58" cy="54" r="2.6" fill="#4A3B2E"/><path d="M44 66 q6 5 12 0" stroke="#4A3B2E" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M24 68 l-8 4 8 4" fill="#E0503C" stroke="#4A3B2E" stroke-width="1.6" stroke-linejoin="round"/><text x="78" y="30" font-size="17" font-weight="800" fill="#4A3B2E" text-anchor="middle">cat</text></svg></div>
      <div class="name">英语单词</div>
      <div class="desc">小猫就是 cat<br>听一听找一找</div>
    </a>
  </div>
  <p class="foot">每天有新关卡，玩完今天的小兔子会说"明天见"。<br>每款游戏右上角 🔒 家长面板：进度 / 时长 / 今日多玩关数。<br>完全离线，无广告无内购，进度保存在本机。</p>
