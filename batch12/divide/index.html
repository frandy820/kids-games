<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>除法分糖</title>
<style>
/* ================= 除法分糖 divide（batch12）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、桌面浅暖场景、暖橙主色、灰蓝错误色（不用大红）
   玩法两段：deal 发放期（逐颗点糖→飞到当前轮到的盘子，轮流=天然均匀）→ ask 答问期（3 选 1 数字卡）
   触摸目标：糖果热区 ≥68、答案卡 ≥96×96、底栏按钮 ≥72 高；间距 ≥16；pointerdown 即响应
   轮到的盘子呼吸高亮（孩子知道下一颗去哪）；盘子角标=已放糖数（点数角标，subbug 模式） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:4px 10px}

/* ---------- 题面行（ch1-3 图文章面 / ch4 黑板算式） ---------- */
#board{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  min-height:72px;padding:0 8px}
#prompt-chip{display:flex;align-items:center;gap:12px;padding:7px 22px;border-radius:22px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4}
#prompt-chip .seg{display:flex;align-items:center;gap:7px}
#prompt-chip b{color:#E8873A;font-size:36px;font-variant-numeric:tabular-nums;line-height:1}
#prompt-chip .lb{font-size:17px;font-weight:700;color:#8A7B6C}
#prompt-chip svg.cm{width:40px;height:40px;flex:0 0 40px}
#prompt-chip .x{font-size:20px;font-weight:800;color:#C9BDA8}
/* 黑板算式（ch4）：深绿板面+粉笔白大字；? 答对后变绿 */
#prompt-chip.board{background:#3F5E52;border-color:#2E463D;box-shadow:0 5px 0 #2E463D}
#formula{font-size:clamp(30px,4.2vw,44px);font-weight:800;color:#F5F1E6;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;white-space:nowrap}
#formula .qm{color:#F2C98C}
#formula .qm.ok{color:#9FD98F;animation:qm-pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes qm-pop{from{transform:scale(.2) rotate(-14deg);display:inline-block}
  to{transform:scale(1) rotate(0);display:inline-block}}
/* 发放进度小条（题面右侧持续可见：已发 k/需发 K） */
#dealcount{display:flex;align-items:center;gap:6px;height:52px;padding:0 14px;border-radius:16px;
  background:#F6EEDD;border:2.5px dashed #C9BDA8;font-size:20px;font-weight:800;color:#8A7B6C;
  font-variant-numeric:tabular-nums;flex:0 0 auto}
#dealcount b{color:#E8873A;font-size:26px}

/* ---------- 桌面：糖果托盘（上）+ 盘子行（下） ---------- */
#table-area{flex:1 1 auto;min-height:220px;width:100%;max-width:1180px;display:flex;
  flex-direction:column;justify-content:center;gap:6px}
#candy-tray{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:14px 18px;min-height:76px;padding:4px 6px}
/* 糖果按钮：进场弹出；点后 .gone；余数糖 .leftover（降饱和，不循环呼吸防诱导点击） */
.candy{position:relative;width:68px;height:68px;padding:0;border-radius:50%;
  transition:transform .15s;animation:candy-in .4s cubic-bezier(.2,1.5,.4,1) both}
.candy:nth-child(2n){animation-delay:.06s}.candy:nth-child(3n){animation-delay:.12s}
@keyframes candy-in{from{transform:scale(0) rotate(-24deg)}to{transform:scale(1) rotate(0)}}
.candy:active{transform:translateY(3px)}
.candy svg{width:100%;height:100%;pointer-events:none;
  filter:drop-shadow(0 3px 0 rgba(74,59,46,.14))}
.candy.gone{visibility:hidden;pointer-events:none}
.candy.leftover{filter:saturate(.4);opacity:.7}
.candy.leftover svg{filter:none}
.candy.wig{animation:candy-wig .5s ease}
@keyframes candy-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}
  55%{transform:rotate(7deg)}80%{transform:rotate(-4deg)}}
.candy.breathe{animation:candy-breathe 1.6s ease-in-out infinite}
@keyframes candy-breathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(232,151,90,0))}
  50%{transform:scale(1.12);filter:drop-shadow(0 0 12px rgba(232,151,90,.85))}}
/* 飞行糖（fixed 克隆，JS 设起止坐标；transform 过渡到目标盘） */
.fly-candy{position:fixed;z-index:60;width:56px;height:56px;pointer-events:none;
  transition:transform .48s cubic-bezier(.35,.05,.6,1),opacity .48s;will-change:transform}

/* 盘子行：M 个小动物盘子（落点视觉锚点；轮到的呼吸高亮） */
#plate-row{display:flex;justify-content:center;align-items:flex-end;gap:22px;flex-wrap:wrap;
  padding:2px 6px}
.plate{position:relative;width:132px;min-height:118px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:0;border-radius:18px;padding:2px 4px 6px}
.plate .face{width:52px;height:52px;margin-bottom:-8px;position:relative;z-index:2;
  transition:transform .2s}
.plate .dish{position:relative;z-index:1}
.plate .dish svg{width:124px;height:64px}
/* 盘内糖堆（发放到达后：按已放数渲染小糖点排） */
.plate .pile{position:absolute;left:50%;top:22px;transform:translateX(-50%);z-index:1;
  display:flex;flex-wrap:wrap;gap:2px;max-width:104px;justify-content:center}
.plate .pile i{width:17px;height:17px;border-radius:50%;border:2px solid rgba(74,59,46,.4);
  animation:candy-in .32s cubic-bezier(.2,1.5,.4,1) both}
/* 盘角标：已放糖数（发放到达 +1 弹出） */
.plate .badge{position:absolute;top:-6px;right:2px;min-width:36px;height:36px;padding:0 6px;
  border-radius:18px;background:#FFF9EE;border:3px solid #E8975A;color:#4A3B2E;
  font-size:22px;font-weight:800;display:none;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;box-shadow:0 2px 0 #D8C9B4;z-index:3}
.plate .badge.on{display:flex;animation:badge-pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes badge-pop{from{transform:scale(0) rotate(-18deg)}to{transform:scale(1) rotate(0)}}
/* 轮到的盘子：呼吸高亮（下一颗糖去哪）+ 虚线落点框 */
.plate.turn{background:rgba(232,151,90,.13);border:2.5px dashed #E8975A}
.plate.turn .face{animation:plate-breathe 1.6s ease-in-out infinite}
@keyframes plate-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.plate.land{animation:plate-land .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes plate-land{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}

/* ---------- 答案区：deal 期提示条 / ask 期 3 张数字大卡 ---------- */
#answers{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:20px;
  flex-wrap:wrap;min-height:118px;padding:2px 12px}
#deal-tip{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#8A7B6C}
#deal-tip svg{width:34px;height:34px}
.opt{min-width:132px;min-height:96px;padding:0 26px;border-radius:26px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;font-size:44px;font-weight:800;color:#4A3B2E;
  font-variant-numeric:tabular-nums;transition:transform .15s,box-shadow .15s;position:relative;
  animation:candy-in .38s cubic-bezier(.2,1.5,.4,1) both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
/* 不灰化款：错卡=晃动不灰掉可重点（divide SPEC §1） */
.opt.wrong{animation:opt-shake .42s ease}
@keyframes opt-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.opt.right{background:#8FBF7F;color:#4A3B2E;border-color:#6FA063;box-shadow:0 5px 0 #6FA063}
.opt.right .mark{position:absolute;top:-13px;right:-13px;width:40px;height:40px;border-radius:50%;
  background:#8FBF7F;border:2.5px solid #FFF9EE;display:flex;align-items:center;justify-content:center;
  animation:opt-pop .45s cubic-bezier(.2,1.6,.4,1)}
.opt.right .mark svg{width:26px;height:26px}
@keyframes opt-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
/* 救援视觉：正确卡 breathe 持续循环（§0.21） */
.opt.breathe{animation:opt-breathe 1.6s ease-in-out infinite}
@keyframes opt-breathe{0%,100%{transform:scale(1);box-shadow:0 5px 0 #D8C9B4}
  50%{transform:scale(1.07);box-shadow:0 5px 0 #D8C9B4,0 0 16px rgba(232,151,90,.9)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 subbug/sortsize） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：糖 wrap 两行、题面与答案卡适配 */
@media (orientation:portrait){
  .candy{width:64px;height:64px}
  #candy-tray{gap:12px 14px}
  .plate{width:112px;min-height:104px}
  .plate .dish svg{width:104px;height:54px}
  .plate .face{width:44px;height:44px}
  .opt{min-width:150px;min-height:104px;font-size:50px}
  #prompt-chip b{font-size:32px}
  #formula{font-size:34px}
}
</style>
</head>
<body>
<div id="game" aria-label="除法分糖">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="board">
      <div id="prompt-chip" role="heading" aria-label="题目"></div>
      <div id="dealcount" aria-label="发放进度"></div>
    </div>
    <div id="table-area">
      <div id="candy-tray" aria-label="糖果堆"></div>
      <div id="plate-row" aria-label="小盘子"></div>
    </div>
    <div id="answers" aria-label="答案选项"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读题"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= divide 纯引擎：确定性关卡生成 + 轮流发放 + 答题判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   章难度（SPEC-BATCH12 §1）：
   dch1 无余数小量（6/8/10÷2/3/4 整除 5 组合）
   dch2 无余数大量（9-12÷3/4 整除 3 组合；池小→同关"相邻 (n,m) 不同"而非全不重复）
   dch3 有余数（余 1-2、商 ≥2；首题热身=无余数，余数概念首现前给已学样本）
   dch4 除法算式直给（黑板 N÷M=？；全域混合复习；首题热身=无余数）
   全域约束：N∈6..12、M∈2..4、商 ≥2（N≥2M）、余 ∈0..2（余 3 恒不出现——11÷4 型排除）
   答案干扰项 = 商 ±1 / ±2 / 除数 M（商与除数混）互异禁 0 负（§0.17） */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号：静态关 (ch-1)%4+1 循环，生成关随机 1-4（§0.3） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 候选 (N,M) 池（按章规则离线枚举，生成时只做过滤+抽取，天然确定性）
   noRem = 无余数池；hasRem = 余数池（余 1-2 且商 ≥2） ---------- */
const POOL_NOREM_S = [[6, 2], [6, 3], [8, 2], [8, 4], [10, 2]];                  // ch1：小量整除 5 组合
const POOL_NOREM_L = [[9, 3], [12, 3], [12, 4]];                                 // ch2：大量整除 3 组合（含 12÷4=3）
const POOL_HASREM  = [[7, 2], [7, 3], [8, 3], [9, 4], [10, 3], [10, 4], [11, 2], [11, 3]]; // ch3：余 1-2
const POOL_ALL     = POOL_NOREM_S.concat(POOL_NOREM_L, POOL_HASREM);             // ch4：全域混合 13 种
function poolOf(dch, warm) {
  if (dch === 1) return POOL_NOREM_S;
  if (dch === 2) return POOL_NOREM_L;
  if (dch === 3) return warm ? POOL_NOREM_L : POOL_HASREM;   // ch3 首题热身=上一章大糖堆样本
  return warm ? POOL_NOREM_S.concat(POOL_NOREM_L) : POOL_ALL; // ch4 首题热身=已学无余数
}

/* ---------- 单题生成（rnd 同流保证确定性）
   约束链：优先"本关未用的 (n,m)"（池充足章全不重复）→ 退"与前一题不同"（ch2 池 3 种客观约束）
   → 池兜底；warm=首题热身（dch3/4 首题=无余数，SPEC §1） ---------- */
function genOne(dch, qi, rnd, used, prevKey) {
  const warm = qi === 0 && (dch === 3 || dch === 4);
  const pool = poolOf(dch, warm);
  const key = c => c[0] + '/' + c[1];
  let p = pool.filter(c => used.indexOf(key(c)) < 0 && key(c) !== prevKey);
  if (!p.length) p = pool.filter(c => key(c) !== prevKey);
  if (!p.length) p = pool;                                   // 理论不可达（各池 ≥3 种）
  const c = p[Math.floor(rnd() * p.length)];
  const n = c[0], m = c[1];
  const answer = Math.floor(n / m), rem = n % m;
  return genWithItems({ n: n, m: m, answer: answer, rem: rem, warm: warm }, rnd);
}

/* ---------- 答案干扰项：候选池 [商-1, 商+1, 商-2, 商+2, 除数 M]（近邻优先，§0.17）
   滤 0/负/等于答案/互异，取前 2 → 3 选 1 洗牌（答案位置轮转，禁恒首位） ---------- */
function candPool(q) {
  const raw = [q.answer - 1, q.answer + 1, q.answer - 2, q.answer + 2, q.m];
  const uniq = [];
  raw.forEach(v => { if (v > 0 && v !== q.answer && uniq.indexOf(v) < 0) uniq.push(v); });
  return uniq;
}
function genWithItems(q, rnd) {
  const picks = shuffled(candPool(q), rnd).slice(0, 2);
  q.items = shuffled([q.answer, picks[0], picks[1]], rnd);
  q.answerIdx = q.items.indexOf(q.answer);
  return q;
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? diffOfCh(ch) : ri(rnd, 1, 4);   // §0.3 batch11 M1 定版
  const quizzes = [];
  const used = [];
  let prevKey = null;
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genOne(dch, qi, rnd, used, prevKey);
    used.push(q.n + '/' + q.m);
    prevKey = q.n + '/' + q.m;
    /* 发放引擎状态（每题独立；_given 各盘已放/_left 剩糖/_flown 糖是否已发） */
    q._given = [];
    for (let i = 0; i < q.m; i++) q._given.push(0);
    q._left = q.n;
    q._flown = [];
    for (let i = 0; i < q.n; i++) q._flown.push(0);
    q._phase = 'deal';                                        // 'deal' 发放期 → 'ask' 答问期
    q.miss = 0;
    quizzes.push(q);
  }
  return { flat, ch, dch, lv, quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 发放引擎（无 DOM）：engTapCandy(L, i) —— deal 期点第 i 颗糖
   轮流发放：飞到"当前轮到的盘子"（=已放总数 % M，天然均匀防错）
   返回本次发放序号（1..N-余数）；已发走的糖返 0；ask 期/非法下标返 null
   发放到剩糖不足一轮（left < M）→ 自动切 'ask'（余数糖留在桌上） ---------- */
function engTapCandy(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (i < 0 || i >= q.n || typeof i !== 'number' || Math.floor(i) !== i) return null;
  if (q._phase !== 'deal') return null;
  if (q._flown[i]) return 0;
  q._flown[i] = 1;
  q._left--;
  const p = q._given.reduce((s, v) => s + v, 0) % q.m;        // 当前轮到的盘子
  q._given[p]++;
  if (q._left <= q.rem) q._phase = 'ask';                     // 剩糖=余数（含 0）：发放结束
  return q._given.reduce((s, v) => s + v, 0);                 // 发放序号
}
/* 当前轮到的盘子下标（deal 期=下一颗糖的落点；ask 期=发放完毕恒 0） */
const engCurPlate = q => q._given.reduce((s, v) => s + v, 0) % q.m;

/* ---------- 答题引擎（无 DOM）：i = 答案卡下标
   'right' 答对推进 / 'done' 最后一题答对通关 / 'wrong' 点错（不灰化：可重点、每次计 miss）
   'again' 非当前阶段防御层 / null 关卡已结束 ---------- */
function engPick(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (q._phase !== 'ask') return 'again';                     // 发放期点答案卡：防御层早退
  if (i < 0 || i >= q.items.length) return null;
  if (i === q.answerIdx) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) L.done = true;
    return L.done ? 'done' : 'right';
  }
  q.miss++;
  L.retries++;                                                // 不灰化款：同卡可重复点，每次计错
  return 'wrong';
}
/* 星级：0 错=3★ / 1-2 错=2★ / 更多=1★（SPEC §1，永不 0 星） */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：answerIdx 指向 answer 且唯一、3 选项互异禁 0、干扰规则合规 ---------- */
function structOk(q) {
  if (!q || !q.items || q.items.length !== 3) return false;
  if (q.answerIdx < 0 || q.answerIdx >= q.items.length) return false;
  if (q.items[q.answerIdx] !== q.answer) return false;
  for (let i = 0; i < q.items.length; i++) {
    if (q.items[i] <= 0) return false;                        // 禁 0 负
    for (let j = i + 1; j < q.items.length; j++) if (q.items[i] === q.items[j]) return false;
  }
  const ds = q.items.filter((v, i) => i !== q.answerIdx);
  return ds.every(v => v !== q.answer && candPool(q).indexOf(v) >= 0);
}
/* ================= divide 主逻辑（糖果托盘/盘子渲染 / 轮流发放飞行 / 答问 / 教学 / 推进）
   玩法两段（SPEC-BATCH12 §1）：
   deal 发放期——N 颗糖（6-12）分给 M 个盘子（2-4）：逐颗点糖→飞到当前轮到的盘子
   （轮流发放天然均匀=防错），盘子角标 +1，轮到的盘子呼吸高亮；
   剩糖不足一轮（left<M）自动切 ask 答问期——余数糖留桌上（降饱和视觉）+余数语音，
   亮"每人几颗呀"3 选 1 数字大卡（干扰=商±1/±2/商与除数混，互异禁 0）。
   答错=晃动不灰化可重点（不灰化款）；sayW force=q.miss===2；首错不高亮，miss≥2 正确卡 breathe。
   验收钩子：window.DV = { get currentLevel, get quiz(){total,plates,cur,given,left,phase,
   options,answerIdx,answer,rem,step,miss}, tapCandy(i), tapAnswer(i), async autoSolve(), get tutorial } */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/开场任务语音/余数句/教学不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音：flat<3 每错必播；flat≥3 走 10s 节流；force 豁免恰一次——不灰化款（miss 无上限）
   必须 === 2（batch9/sortsize 定版）：豁免只在每题 miss 首达 2 时发一次，防豁免变每错必播 */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.play(key, text); }
};
/* 题面=queue 拼接 clip（times 模式 §0.23）：全部段 clip 在场走 queue，缺任一走整句 TTS 兜底 */
function sayQ(parts, fullText) {
  if (KIDS.voice.clips && parts.every(p => KIDS.voice.clips[p.key])) {
    KIDS.voice.queue(parts.map(p => p.key));
  } else {
    KIDS.voice.say(fullText);
  }
}

const stageEl = $id('stage'), chipEl = $id('prompt-chip'), dealcountEl = $id('dealcount'),
      candyTrayEl = $id('candy-tray'), plateRowEl = $id('plate-row'), answersEl = $id('answers'),
      ghostEl = $id('ghost'), rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'),
      hearBtn = $id('btn-hear');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();
let helpRedemo = false;
let lastBlankHint = 0;                          // 点空白/探索区轻提示节流（§0.16，10s）
let lastRemHint = 0;                            // ask 期点余数糖提示节流（10s）
let ghostReason = null;                         // 'tut' | 'scaffold'

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const candyEl = i => candyTrayEl.querySelector('.candy[data-i="' + i + '"]');
const plateEls = p => plateRowEl.querySelector('.plate[data-p="' + p + '"]');
const optEl = i => answersEl.querySelector('.opt[data-i="' + i + '"]');

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 72);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：发放=双音上扬 / 点余数糖（不放飞）=低柔单音 */
const candyHi = () => { if (!VERIFY) { KIDS.audio.note(880, 0.09, 0, 0.5); KIDS.audio.note(1108, 0.12, 0.07, 0.4); } };
const flapLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };

/* ================= 渲染 ================= */
/* 题面：ch1-3 图文章面（糖icon N 颗糖·平均分给·盘icon M 个小朋友）/ ch4 黑板算式 N÷M=? */
function renderChip(q) {
  if (cur.dch === 4) {
    chipEl.className = 'board';
    chipEl.innerHTML = '<div id="formula">' + q.n + ' ÷ ' + q.m + ' = <span class="qm">?</span></div>';
    return;
  }
  chipEl.className = '';
  chipEl.innerHTML =
    '<span class="seg">' + ICONS.candyMini + '<b>' + q.n + '</b><span class="lb">颗糖</span></span>' +
    '<span class="x">平均分给</span>' +
    '<span class="seg">' + ICONS.plateMini + '<b>' + q.m + '</b><span class="lb">个小朋友</span></span>';
}
/* 发放进度条：已发 k / 需发 K（K=n-rem；发完即答案铺垫） */
function renderDealcount(q) {
  const k = q._given.reduce((s, v) => s + v, 0), K = q.n - q.rem;
  dealcountEl.innerHTML = '<b>' + k + '</b>/' + K + ' 已分';
  dealcountEl.setAttribute('aria-label', '已分 ' + k + ' 颗，共 ' + K + ' 颗');
}
function renderCandies(q) {
  candyTrayEl.innerHTML = '';
  for (let i = 0; i < q.n; i++) {
    const b = document.createElement('button');
    b.className = 'candy';
    b.dataset.i = i;
    b.dataset.pal = i % 4;
    b.setAttribute('aria-label', '糖果' + (i + 1));
    b.innerHTML = candySvg(i % 4, 64);
    candyTrayEl.appendChild(b);
  }
}
function updateBadge(el, n, p) {
  const bd = el.querySelector('.badge');
  if (n > 0) {
    bd.textContent = n;
    bd.classList.remove('on'); void bd.offsetWidth; bd.classList.add('on');
  }
  const pile = el.querySelector('.pile');
  let html = '';
  for (let k = 0; k < n; k++) {
    html += '<i style="background:' + CANDY_PAL[(p + k) % 4].body + '"></i>';
  }
  pile.innerHTML = html;
}
function renderPlates(q) {
  plateRowEl.innerHTML = '';
  for (let p = 0; p < q.m; p++) {
    const d = document.createElement('div');
    d.className = 'plate';
    d.dataset.p = p;
    d.setAttribute('aria-label', '盘子' + (p + 1));
    d.innerHTML = '<span class="face">' + faceSvg(ANIMALS[p % 4]) + '</span>' +
      '<span class="dish">' + dishSvg(124) + '</span>' +
      '<span class="pile"></span><span class="badge"></span>';
    plateRowEl.appendChild(d);
    if (q._given[p] > 0) updateBadge(d, q._given[p], p);   // 重渲染还原已放状态
  }
  renderTurn();
}
/* 轮到的盘子呼吸高亮（deal 期常驻；ask 期清除） */
function renderTurn() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  plateRowEl.querySelectorAll('.plate').forEach(el => el.classList.remove('turn'));
  if (q._phase === 'deal') {
    const el = plateEls(engCurPlate(q));
    if (el) el.classList.add('turn');
  }
}
function optBtn(t, i) {
  const b = document.createElement('button');
  b.className = 'opt';
  b.dataset.i = i;
  b.textContent = t;
  b.setAttribute('aria-label', '选 ' + t);
  return b;
}
function renderStep() {                          // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                          // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
function speakQuiz(q) { if (q) sayQ(quizParts(q), qSpeech(q)); }
/* 开场顺序链（§0.5/§0.6）：hint（或教学交接 turn clip）→ 题面 5 段，
   queue 单通道顺序播（clip 段 onended 接力，禁双通道叠音） */
function openingSpeak(turn) {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  KIDS.voice.queue([turn ? VOICE.turn.key : VOICE.hint.key].concat(quizParts(q)));
}
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderChip(q);
  renderCandies(q);
  renderPlates(q);
  renderDealcount(q);
  answersEl.innerHTML = '<div id="deal-tip">' + ICONS.hand + '<span>一颗一颗点糖果，轮着分</span></div>';
  renderStep();
  if (!VERIFY && !state.demo && !state.quiet) sayQ(quizParts(q), qSpeech(q));  /* 换题读题 sayR 级不受 flat 门（审查 m7：三款统一，不识字依赖听题） */
}

/* ================= 飞行动画：点糖→克隆糖 fixed 飞到盘 → 到达后角标+糖堆+盘弹跳 ================= */
function flyCandy(fromEl, plateIdx, q) {
  const plate = plateEls(plateIdx);
  if (!plate) return;
  const a = fromEl.getBoundingClientRect(), b = plate.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'fly-candy';
  f.innerHTML = candySvg(Number(fromEl.dataset.pal) || 0, 56);
  f.style.left = (a.left + a.width / 2 - 28) + 'px';
  f.style.top = (a.top + a.height / 2 - 28) + 'px';
  document.body.appendChild(f);
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
  const dy = (b.top + b.height * 0.5) - (a.top + a.height / 2);
  requestAnimationFrame(() => {
    f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.55) rotate(14deg)';
    f.style.opacity = '0';
  });
  setTimeout(() => {
    f.remove();
    updateBadge(plate, q._given[plateIdx], plateIdx);
    plate.classList.remove('land'); void plate.offsetWidth; plate.classList.add('land');
    sfx('pop');
  }, 460 * SPEED);
}

/* ================= 发放主路径（真实点击 / DV.tapCandy / autoSolve / 教学演示共用） ================= */
function uiTapCandy(i, demo) {
  /* locked 门拦真实输入；demo 通道仅 tutorialWatch 内部传 true（豁免 locked） */
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  if (q._phase !== 'deal') {                     // ask 期点余数糖：摆动+节流余数提示（零惩罚轻反馈）
    const el = (typeof i === 'number' && i >= 0 && i < q.n && !q._flown[i]) ? candyEl(i) : null;
    if (el) {
      el.classList.remove('wig'); void el.offsetWidth; el.classList.add('wig');
      flapLo();
      if (q.rem > 0 && Date.now() - lastRemHint > 10000) {
        lastRemHint = Date.now();
        sayR(remPart(q).key, remPart(q).text);
      }
    }
    return false;
  }
  const r = engTapCandy(cur, i);
  if (r === null) return false;
  if (r === 0) return 0;                         // 已发走的糖（真实 DOM 不可达；钩子防御）
  lastAct = Date.now();                          // 发放成功=正确推进，重置救援钟（§0.7a）
  const run = cur;
  const el = candyEl(i);
  const plateIdx = (r - 1) % q.m;                // 本颗糖落盘（发放序号 r：0 基盘子轮转）
  if (el) {
    el.classList.remove('breathe', 'wig');
    el.classList.add('gone');
    flyCandy(el, plateIdx, q);
  }
  candyHi();
  renderDealcount(q);
  if (q._phase === 'ask') {                      // 发放完毕：延迟亮答案卡（飞完最后一颗的节奏）
    setTimeout(() => {
      if (cur === run && cur.quizzes[cur.step] === q && q._phase === 'ask' && !q.solved) showAsk(q);
    }, 620 * SPEED);
  } else {
    renderTurn();                                // 轮到的盘子高亮切换
    if (state.tut === 'help') pointHelpNext();   // "帮"：跟着发放节奏指向下一颗
  }
  return r;
}
/* ask 答问期亮卡：余数糖降饱和留桌上 + 余数句（无 flat 门，关键教学）→ 问句（flat<3） */
function showAsk(q) {
  renderTurn();
  for (let i = 0; i < q.n; i++) {
    if (!q._flown[i]) {
      const el = candyEl(i);
      if (el) el.classList.add('leftover');
    }
  }
  renderDealcount(q);
  answersEl.innerHTML = '';
  q.items.forEach((v, i) => answersEl.appendChild(optBtn(v, i)));
  const parts = q.rem > 0 ? [remPart(q)] : [];
  if (cur && cur.flat < 3) parts.push({ key: VOICE.q3.key, text: VOICE.q3.text });
  if (parts.length === 1) KIDS.voice.play(parts[0].key, parts[0].text);
  else if (parts.length === 2) KIDS.voice.queue(parts);
}

/* ================= 答题主路径（真实点击 / DV.tapAnswer / autoSolve 共用） ================= */
async function uiPick(i, demo) {
  if (!cur || state.locked || state.won || (state.demo && !demo)) return false;
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const run = cur;                               /* 身份守卫：演出窗口内重玩会重建 cur（M3） */
  const r = engPick(cur, i);
  if (r === null) return false;
  if (r === 'again') return 'again';             /* 发放期点答案卡：防御层早退零惩罚（§0.7） */
  const el = optEl(i);
  if (r === 'right' || r === 'done') {
    lastAct = Date.now();                        /* 仅正确推进重置救援钟（§0.7a） */
    if (state.tut === 'help') {                  // 教学"独"：首次答对 → 强化反馈放手
      state.tut = 'solo';
      ghost.hide();
      hopRabbit();
    }
    state.locked = true;
    if (el) {
      el.classList.remove('breathe', 'wrong');
      el.classList.add('right');
      const m = document.createElement('span');
      m.className = 'mark';
      m.innerHTML = ICONS.check;
      el.appendChild(m);
    }
    const qm = document.querySelector('#formula .qm');   // ch4 黑板 ? → 答案亮绿
    if (qm) { qm.textContent = q.answer + (q.rem ? '……' + q.rem : ''); qm.classList.add('ok'); }  /* 余数题定格 7÷2=3……1（审查 m8：二年级规范写法） */
    sfx('coin');
    await wait(880 * SPEED);
    if (cur !== run) return r;                   /* 演出窗内重玩已重建关卡：丢弃旧续体 */
    state.locked = false;
    if (r === 'done') winFlow();
    else renderQuiz();
  } else {                                       // 答错：晃动不灰掉可重点（不灰化款 SPEC §1）
    if (el) { el.classList.remove('wrong', 'breathe'); void el.offsetWidth; el.classList.add('wrong'); }
    sfx('fail');
    sayW(VOICE.wrong.key, VOICE.wrong.text, q.miss === 2);   /* flat<3 每错必播 / flat≥3 节流+豁免恰一次（===2） */
    if (q.miss >= 2) {                           /* 首错不 pulse：连错 2 次才高亮正确卡 */
      const ok = optEl(q.answerIdx);
      if (ok) { ok.classList.remove('breathe'); void ok.offsetWidth; ok.classList.add('breathe'); }
    }
    if (state.tut === 'help') pointHelpNext();
    await wait(520 * SPEED);
  }
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关用 GEN 文案（不带"明天："前缀，core 模板自带） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.divide && sv.divide.tutSeen);
  if (VERIFY) { openingSpeak(); return; }        /* verify 页恒走开场链（stub 记录供断言） */
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  openingSpeak();                                /* 开场任务语音+题面顺序链（§0.5） */
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show(reason) { ghostReason = reason; ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostReason = null; ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el, reason) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show(reason);
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向：发放期=下一颗没发的糖；ask 期=正确答案卡（手口一致引导） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  if (q._phase === 'deal') {
    let i = 0;
    while (i < q.n && q._flown[i]) i++;
    if (i < q.n) pointGhostAt(candyEl(i), 'tut');
  } else {
    pointGhostAt(optEl(q.answerIdx), 'tut');
  }
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=幽灵手指演示轮流发放（前 2 颗完整手指演示看懂轮流，其余原地快放控时长）
   →演示选对答案 → 重发同关 → 帮=指向下一颗糖/正确卡；独=首次答对放手
   save.divide.tutSeen 记住演示已放过（§0.6） ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);
  await wait(700 * SPEED);
  const q = cur.quizzes[0];
  const total = q.n - q.rem;
  for (let i = 0; i < total; i++) {
    const el = candyEl(i);
    if (i < 2) {                                 // 前 2 颗：手指移动+按压+放飞（轮流语义看清）
      pointGhostAt(el, 'tut');
      await wait(750 * SPEED);
      ghost.press();
      await wait(260 * SPEED);
      uiTapCandy(i, true);
      await wait(520 * SPEED);
    } else {                                     // 其余：手指原地快放（时长控制）
      if (el) ghost.press();
      await wait(140 * SPEED);
      uiTapCandy(i, true);
      await wait(330 * SPEED);
    }
  }
  await wait(650 * SPEED);                       // 等 ask 亮卡
  pointGhostAt(optEl(q.answerIdx), 'tut');
  await wait(800 * SPEED);
  ghost.press();
  await wait(280 * SPEED);
  state.demo = false;                            // 临时解锁走真实路径演示一次完整答对演出
  state.locked = false;
  await uiPick(q.answerIdx, true);
  const sv = KIDS._save();                       // 真实页 save 恒非 null；verify 直驱时跳过写档
  if (sv) {

/* ================= ?verify=1 自检（仅 verify 分支加载执行）
   ① 40 关全量审计（flat 0-39，每关一记）：确定性（同 flat 两次生成 JSON 一致）/
     数值域独立审计（N 6-12、M 2-4、商=floor(N/M) ≥2、余=N%M ∈0-2、章池字面量对账 REF_POOLS）/
     热身（dch3/4 首题无余数；dch3 必含余数题）/ 同关相邻 (N,M) 不同 /
     干扰项互异禁 0 负且规则池内（商±1/±2/除数 M，独立 candRules 复算）/ structOk /
     引擎直驱（发放期点答案卡='again' 防御层 → 逐颗发放序号递增 → ask 切换 → 各盘=商（轮流均匀）
     → ask 期点糖 null → 余数糖留桌 left=rem → 同卡连错 2 次=不灰化可重点 miss/retries 递增
     → 首题带 2 错通关 2 星；另全对 3 星）
   ② tapCandy 单元（flat0 真实 UI）：发放逐颗 given/cur 推进+糖 DOM gone+盘角标 DOM 递增+
     非法下标 false+ask 期点余数糖 false（不计数零惩罚）
   ②b sayW 三态（flat<3 每错必播 / flat≥3 10s 节流 / miss===2 force 豁免恰一次）
   ③ UI 冒烟 A：flat0 真实通路通关（首题错一次=2 星，verify 页不弹层）
   ④ UI 冒烟 B1：flat10（ch3 有余数）首题热身无余数+余数题剩糖留桌（leftover DOM=rem）
     +div_rem 语音播出+autoSolve 3 星
     B2：flat15（ch4 算式黑板）黑板 DOM（N÷M=?）+首题热身+真实点击通关
   ⑦ 教学链（verify 直驱 tutorialWatch）：watch clip 播出 → demo 发放+答对 → 重发同关 →
     交接链 queue([div_tut_turn, ...题面 5 段]) → tut='help' 解锁
   ⑤ 布局：双 viewport（1280×800 / 800×1180）×（flat0/10/15）deal 期糖 ≥64、盘 ≥64、
     全按钮 ≥64（.k-parentbtn 豁免）+ ask 期答案卡 ≥96×96、overflowX ≤0
   ⑥ 分布与专项：VOICE 表文案独立字面量对账（SPEC 定稿）/ div_* 19 条 clips 注入 clipOk /
     开场顺序链（queue([div_hint, ...题面 5 段]) 单通道）/ speakQuiz 救援拼句（queue 5 段）/
     answerIdx 三位置均出现且首位 <60%
   结果写 #verify-result + document.title='VERIFY PASS n/n' */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {}, smokes = {};
  let npass = 0, total = 0;
  const idxDist = [0, 0, 0];

  /* verify 侧独立复算的章池字面量与干扰规则池（不调引擎 candPool/genOne，防两套逻辑同错） */
  const REF_POOLS = {
    noRemS: ['6/2', '6/3', '8/2', '8/4', '10/2'],
    noRemL: ['9/3', '12/3', '12/4'],
    hasRem: ['7/2', '7/3', '8/3', '9/4', '10/3', '10/4', '11/2', '11/3']
  };
  REF_POOLS.all = REF_POOLS.noRemS.concat(REF_POOLS.noRemL, REF_POOLS.hasRem);
  function refRangeOk(dch, qi, q) {
    if (q.n < 6 || q.n > 12 || q.m < 2 || q.m > 4) return false;
    if (q.answer !== Math.floor(q.n / q.m) || q.rem !== q.n % q.m) return false;   // 整除与余数正确性
    if (q.answer < 2) return false;                                                // 商 ≥2
    const k = q.n + '/' + q.m;
    if (dch === 1) return REF_POOLS.noRemS.indexOf(k) >= 0;
    if (dch === 2) return REF_POOLS.noRemL.indexOf(k) >= 0;
    if (dch === 3) return qi === 0 ? REF_POOLS.noRemL.indexOf(k) >= 0               // 首题热身=无余数
                                   : REF_POOLS.hasRem.indexOf(k) >= 0;
    return qi === 0 ? REF_POOLS.all.indexOf(k) >= 0 && q.rem === 0                  // ch4 首题热身
                    : REF_POOLS.all.indexOf(k) >= 0;
  }
  function candRules(q) {
    const set = [];
    [q.answer - 1, q.answer + 1, q.answer - 2, q.answer + 2, q.m].forEach(v => {
      if (v > 0 && v !== q.answer && set.indexOf(v) < 0) set.push(v);
    });
    return set;
  }

  /* ---- ① 40 关全量审计（flat 0-39） ---- */
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1) === JSON.stringify(L2);      // 确定性（含发放初态）
    let rangeAll = true, warmOk = true, adjOk = true, structAll = true, distrAll = true, remHas = true;
    let prevKey = null;
    if (flat < STATIC_LEVELS && L1.dch !== diffOfCh(chOfFlat(flat))) rangeAll = false;  // 静态关=循环章
    if (L1.dch < 1 || L1.dch > 4) rangeAll = false;
    for (let k = 0; k < L1.quizzes.length; k++) {
      const q = L1.quizzes[k];
      if (!refRangeOk(L1.dch, k, q)) rangeAll = false;                          // 数值域独立审计
      if (q.items.length !== 3 || !structOk(q)) structAll = false;              // 3 选 1 互异禁 0
      q.items.forEach((v, idx) => {                                            // 干扰=规则构造且≠answer
        if (idx === q.answerIdx) return;
        if (v === q.answer || candRules(q).indexOf(v) < 0) distrAll = false;
      });
      idxDist[q.answerIdx]++;
      const key = q.n + '/' + q.m;
      if (prevKey === key) adjOk = false;                                       // 同关相邻 (N,M) 不同
      prevKey = key;
    }
    if ((L1.dch === 3 || L1.dch === 4) && L1.quizzes[0].rem !== 0) warmOk = false;   // 首题热身
    if (L1.dch === 3 && !L1.quizzes.slice(1).some(q => q.rem > 0)) remHas = false;  // ch3 必含余数题
    /* 引擎直驱：防御层 → 发放序号递增 → ask 切换+轮流均匀 → ask 期点糖 null → 余数留桌
       → 首题同卡连错 2（不灰化可重点）→ 带错通关 2 星；另全对 3 星 */
    const Ld = genLevel(flat);
    let driveOk = true;
    for (let k = 0; k < Ld.quizzes.length && driveOk; k++) {
      const q = Ld.quizzes[k];
      if (engPick(Ld, 0) !== 'again') driveOk = false;                          // 发放期点答案卡
      const cnt = q.n - q.rem;
      for (let i = 0; i < cnt; i++) {
        if (engTapCandy(Ld, i) !== i + 1) { driveOk = false; break; }
      }
      if (!driveOk) break;
      if (q._phase !== 'ask' || q._left !== q.rem) driveOk = false;             // 余数糖留桌上
      if (!q._given.every(v => v === q.answer)) driveOk = false;                // 轮流发放=各盘=商
      if (engTapCandy(Ld, 0) !== null || engTapCandy(Ld, 99) !== null ||
          engTapCandy(Ld, 0.5) !== null) driveOk = false;                       // ask 期/非法下标
      if (k === 0) {                                                            // 首题连错 2 次再答对
        let wi = 0; while (wi === q.answerIdx) wi++;
        if (engPick(Ld, wi) !== 'wrong' || q.miss !== 1 || Ld.retries !== 1) driveOk = false;
        if (engPick(Ld, wi) !== 'wrong' || q.miss !== 2 || Ld.retries !== 2) driveOk = false;   // 同卡可重点
      }
      const want = k === Ld.quizzes.length - 1 ? 'done' : 'right';
      if (engPick(Ld, q.answerIdx) !== want) driveOk = false;
    }
    const stars2 = Ld.done && Ld.step === CH_LEN && Ld.retries === 2 && engStars(Ld) === 2;
    const L3 = genLevel(flat);
    let guard = 0;
    while (!L3.done && guard++ < 30) {
      const q = L3.quizzes[L3.step];
      for (let i = 0; i < q.n - q.rem; i++) engTapCandy(L3, i);
      engPick(L3, q.answerIdx);
    }
    const stars3 = L3.done && L3.retries === 0 && engStars(L3) === 3;           // 全对 3 星（永不 0）
    if (!stars2 || !stars3) driveOk = false;
    const ok = det && L1.quizzes.length === CH_LEN && rangeAll && warmOk && adjOk &&
      structAll && distrAll && remHas && driveOk;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, rangeAll: rangeAll, warmOk: warmOk,
      adjOk: adjOk, structAll: structAll, distrAll: distrAll, remHas: remHas, driveOk: driveOk,
      stars: { wrong2: engStars(Ld), clean: engStars(L3) },
      qs: L1.quizzes.map(q => q.n + '/' + q.m + '=' + q.answer + (q.rem ? 'r' + q.rem : '')) };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② tapCandy 单元（flat0 真实 UI 状态机） ---- */
  total++;
  startLevel(0);
  const q0 = DV.quiz;
  const n0 = q0.total, m0 = q0.plates, K0 = n0 - q0.rem;
  const taps = [];
  for (let i = 0; i < K0; i++) taps.push(DV.tapCandy(i));
  const incOk = taps.every((v, i) => v === i + 1);
  const qAfter = DV.quiz;
  const stateOk = qAfter.phase === 'ask' && qAfter.left === q0.rem &&
    qAfter.given.every(v => v === q0.answer) && qAfter.cur === 0;               // 轮流均匀+ask 切换
  const goneN = candyTrayEl.querySelectorAll('.candy.gone').length;             // 每颗已发糖 .gone
  const goneOk = goneN === K0;
  const badIdx = DV.tapCandy(99) === false && DV.tapCandy(-1) === false && DV.tapCandy('x') === false;
  const askTap = DV.tapCandy(0) === false && DV.currentLevel.step === 0;        // ask 期点糖不推进
  await wait(560 * SPEED);                                                      // 等飞行动画落地更新盘角标 DOM
  let badgeOk = true;

    const bd = plateEls(p).querySelector('.badge');
    if (bd.textContent !== String(q0.answer) || !bd.classList.contains('on')) badgeOk = false;
  }
  await wait(200 * SPEED);                                                      // 等 showAsk 亮卡
  const optN = answersEl.querySelectorAll('.opt').length;
  const tapOk = incOk && stateOk && goneOk && badgeOk && badIdx && askTap && optN === 3;
  if (tapOk) npass++;
  units.tapCandy = { ok: tapOk, taps: taps, phase: qAfter.phase, left: qAfter.left,
    given: qAfter.given, gone: goneN, badge: badgeOk, badIdx: badIdx, askTap: askTap, optN: optN };

  /* ---- ②b sayW 三态（flat<3 每错必播 / flat≥3 10s 节流 / miss===2 force 豁免恰一次） ---- */
  total++;
  const wLog = [];
  const origPlay2 = KIDS.voice.play;
  KIDS.voice.play = function (key, text) { wLog.push([key, String(text).slice(0, 4)]); };
  const wrongPlays = () => wLog.filter(p => p[0] === 'div_wrong').length;  /* wrong 已 clip 化（审查 m5） */
  const dealAll = async () => {
    const q = cur.quizzes[cur.step];
    let g = 0;
    while (q._phase === 'deal' && g++ < 16) {
      let i = 0; while (i < q.n && q._flown[i]) i++;
      if (i >= q.n) break;
      uiTapCandy(i);
    }
    await wait(700 * SPEED);
  };
  const wrongIdx = () => { const q = DV.quiz; let i = 0; while (i === q.answerIdx) i++; return i; };
  startLevel(0);                                // flat0：每错必播
  await dealAll();
  await DV.tapAnswer(wrongIdx());
  await DV.tapAnswer(wrongIdx());
  const sayA = wrongPlays();                    // → 2
  startLevel(3);                                // flat3：10s 节流
  await dealAll();
  lastWrongVoice = Date.now();                  /* 显式进入节流窗口内 */
  await DV.tapAnswer(wrongIdx());               // miss=1 窗口内 → 节流不播
  const sayB = wrongPlays() - 2;                // 增量 → 0
  startLevel(3);                                // 同关重发 fresh quiz：miss===2 force 豁免
  await dealAll();
  lastWrongVoice = 0;                           /* 隔离上一子用例时间戳 */
  await DV.tapAnswer(wrongIdx());               // miss=1 → 播（10s 窗口外）
  await DV.tapAnswer(wrongIdx());               // miss=2 → force === 2 → 播
  const sayC = wrongPlays() - 2 - sayB;         // 增量 → 2
  KIDS.voice.play = origPlay2;
  const sayWOk = sayA === 2 && sayB === 0 && sayC === 2;
  if (sayWOk) npass++;

  /* ---- ③ UI 冒烟 A：flat0 真实通路通关（首题错一次 → 1 错=2 星，verify 页不弹层） ---- */
  total++;
  startLevel(0);
  let smokeA = true, wrongOk = false, quizzesA = 0;
  for (let s = 0; s < CH_LEN && smokeA; s++) {
    const q = DV.quiz;
    if (!q) { smokeA = false; break; }
    await dealAll();
    if (s === 0) {                              // 首错：晃动不灰掉可重点；首错不 pulse 正确卡
      const widx = wrongIdx();
      await DV.tapAnswer(widx);
      const wEl = answersEl.querySelector('.opt[data-i="' + widx + '"]');
      const okEl = answersEl.querySelector('.opt[data-i="' + DV.quiz.answerIdx + '"]');
      wrongOk = !!wEl && wEl.classList.contains('wrong') &&
        getComputedStyle(wEl).pointerEvents !== 'none' &&       /* 不灰化：可重点（SPEC §1） */
        !okEl.classList.contains('breathe') &&                  /* 首错不 pulse */
        DV.currentLevel.retries === 1 && DV.currentLevel.step === 0;
