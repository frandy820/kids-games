<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小兔子的游戏屋 · 一二年级的新游戏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FBF3E4;color:#4A3B2E;font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:34px 22px}
  .logo{width:150px;height:150px}
  h1{font-size:clamp(26px,5vw,38px);letter-spacing:.05em}
  .ageband{display:inline-flex;align-items:center;gap:8px;background:#6E9BD8;color:#fff;font-size:16px;font-weight:700;
           padding:7px 18px;border-radius:999px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px;width:100%;max-width:760px}
  a.card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 24px;border-radius:26px;
         background:#FFF9EE;border:2.5px solid #4A3B2E;text-decoration:none;color:#4A3B2E;
         box-shadow:0 5px 0 #D8C9B4;transition:transform .2s}
  a.card:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
  @media (hover:hover){
    a.card:hover{transform:translateY(-4px);box-shadow:0 9px 0 #D8C9B4}
  }
  .card .icon{width:92px;height:92px}
  .card .name{font-size:22px;font-weight:700}
  .card .desc{font-size:14px;color:#8A7B6C;line-height:1.6;text-align:center}
  .foot{font-size:12.5px;color:#8A7B6C;text-align:center;line-height:1.8;max-width:520px}
</style>
</head>
<body>
  <div class="logo" id="logo"></div>
  <h1>小兔子的游戏屋 · 一二年级的新游戏</h1>
  <div class="ageband">★ 7-8 岁 · 一二年级 ★</div>
  <div class="grid">
    <a class="card" href="divide/index.html">

      <div class="name">除法分糖</div>
      <div class="desc">一人一颗轮着分<br>每盘几颗数一数</div>
    </a>
    <a class="card" href="fraction/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="36" fill="#F2B8C6" stroke="#4A3B2E" stroke-width="2.6"/><circle cx="50" cy="50" r="30" fill="#E8975A"/><path d="M50 50 L50 20 A30 30 0 0 1 76 35 Z" fill="#8FBF7F"/><path d="M50 50 L76 35 M50 50 L50 20 M50 50 L50 80 M50 50 L20 50" stroke="#4A3B2E" stroke-width="2.4"/><circle cx="62" cy="20" r="2.6" fill="#FFF9EE"/><circle cx="36" cy="18" r="2.4" fill="#FFF9EE"/><circle cx="76" cy="60" r="2.4" fill="#FFF9EE"/></svg></div>
      <div class="name">分数披萨</div>
      <div class="desc">切一切认分数<br>二分之一四分之三</div>
    </a>
    <a class="card" href="column/index.html">
      <div class="icon"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="14" y="18" width="72" height="58" rx="8" fill="#4E6E52" stroke="#4A3B2E" stroke-width="2.6"/><rect x="22" y="26" width="56" height="42" fill="#39543E"/><text x="44" y="46" font-size="17" font-weight="700" fill="#FFF9EE" text-anchor="middle" font-family="Consolas,monospace">2 7</text><text x="30" y="63" font-size="15" font-weight="700" fill="#F5C445" text-anchor="middle" font-family="Consolas,monospace">+</text><text x="52" y="63" font-size="17" font-weight="700" fill="#FFF9EE" text-anchor="middle" font-family="Consolas,monospace">1 5</text><path d="M12 82 h76" stroke="#8A7B6C" stroke-width="6" stroke-linecap="round"/><rect x="58" y="76" width="24" height="12" rx="5" fill="#E0503C" stroke="#4A3B2E" stroke-width="2"/></svg></div>
      <div class="name">竖式小黑板</div>
      <div class="desc">先算个位再十位<br>进位退位看得见</div>
    </a>
    <p class="foot">每天有新关卡，玩完今天的小兔子会说"明天见"。<br>每款游戏右上角 🔒 家长面板：进度 / 时长 / 今日多玩关数。<br>完全离线，无广告无内购，进度保存在本机。</p>
