<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>竖式小黑板</title>
<style>
/* ================= 竖式小黑板 column（batch12 r15 难度改造 2026-09-16）=================
   小黑板：深绿板面 #2F5D44 + 木框 #9C6B43 + 粉笔白 #F7F3E7（HTML/CSS 结构化渲染，禁 SVG 文字）
   r15：4 列竖式 grid（op|百|十|个，两位数百位列空）+ 顶部标记带（进位小 1 槽）+
   被减数位格退位点槽（玩家自己点亮=操作步）+ 两步题 ①② 步标
   视觉基调按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边、灰蓝/暖红错误色（不用饱和大红）
   触摸目标：数字键盘 0-9 ≥64（3×4 网格）、标记槽 ≥64、底栏按钮 ≥72；黑板数字 ≥40px（--bbfs）
   竖屏双通道（r9 M-A1/r11 M-1/r12 M3 意图、JS 实测布局款落地形态）：本款黑板‖键盘方向与键径由
   layout() 实测计算（CSS @media 无法承载），body.port 类通道=layout() 强制竖排判据 +
   verify simView portStyle 锚（#table.col）+ _selftest P1b 真竖 800×1180 全量 verify 重跑
   pointerdown 即响应；教学/演出期点键盘=吞输入+轻叮+键圈轻闪（§0.22） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:6px;align-items:center;flex:1 1 auto}
#step-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：指令条（上）+ 桌面（黑板‖键盘，方向由 layout() 实测+body.port 双通道） ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  padding:4px 8px;overflow:hidden}
#tip{min-height:54px;max-width:94%;padding:9px 30px;border-radius:27px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;transition:transform .15s;flex:0 0 auto}
#tip.flash{animation:tip-b .5s ease}
@keyframes tip-b{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#tip-text{font-size:clamp(20px,2.8vw,27px);font-weight:800;color:#4A3B2E;line-height:1.2}
#tip.watch{background:#FFF4E0}
#tip.help{background:#FDF3DF}

#table{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;
  justify-content:center;gap:20px;padding:8px 4px}
#table.col{flex-direction:column;gap:10px}

/* ---------- 小黑板（竖式 4 列：op|百|十|个；两位数百位列渲染为空） ---------- */
#boardwrap{flex:1 1 auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#bb{position:relative;width:min(100%,440px);max-height:100%;background:#2F5D44;
  border:11px solid #9C6B43;border-radius:18px;padding:8px 14px 12px;overflow:hidden;
  box-shadow:0 6px 0 #D8C9B4,inset 0 0 26px rgba(0,0,0,.22)}
#bb-face{display:flex;flex-direction:column;justify-content:center;transition:opacity .3s .22s}
#bb.wiped #bb-face{opacity:0}
#bb.stepswap #bb-face{animation:face-swap .4s ease}
@keyframes face-swap{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
/* 竖式行：op 列 + 百 + 十 + 个 四列 grid（数位天然对齐——布局病害铁律：结构化内容用 grid） */
.brow{display:grid;grid-template-columns:.8fr 1fr 1fr 1fr;align-items:center;justify-items:center}
/* 标记带（进位小 1 槽）：高 ≥64 保触摸目标；槽视觉小、命中区整格 */
.mband{height:calc(var(--mbd, 68px))}
.numrow{height:max(68px,calc(var(--bbfs,44px) * 1.32))}
.bn{font-size:var(--bbfs,44px);font-weight:800;color:#F7F3E7;line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.28)}
.bop{font-size:calc(var(--bbfs,44px) * .9);font-weight:800;color:#EFE7CF;line-height:1;
  text-shadow:0 2px 0 rgba(0,0,0,.28)}
/* 步标（两步题 ①②；单步空） */
#step-chip{font-size:calc(var(--bbfs,44px) * .5);font-weight:800;color:#F7E7A1;line-height:1}
/* 标记槽（r15 操作步）：加法=标记带小"1"槽；减法=被减数十/百位格退位点槽（整格按钮 ≥64）
   .arm=本题该 op 该列槽在场（淡虚线锚，提示可点）；.cur=当前应点（呼吸闪烁）；
   .lit=已点亮（小 1/圆点显形+弹入）；.shake=错点亮晃动（暖红） */
.mzone{position:relative;min-width:64px;min-height:64px;display:flex;align-items:center;
  justify-content:center;border-radius:12px;-webkit-tap-highlight-color:transparent}
.mzone[hidden]{display:none}
.mzone .mslot{width:calc(var(--bbfs,44px) * .52);height:calc(var(--bbfs,44px) * .52);
  border:3px dashed rgba(247,231,161,.34);border-radius:50%;opacity:0;transition:opacity .2s}
.mzone.arm .mslot{opacity:1}
.mzone.cur{animation:mz-blink 1.15s ease infinite}
@keyframes mz-blink{0%,100%{background:rgba(247,231,161,.08)}
  50%{background:rgba(247,231,161,.32)}}
.mzone .mval{position:absolute;font-size:calc(var(--bbfs,44px) * .5);font-weight:800;color:#F7E7A1;
  line-height:1;opacity:0;transform:scale(.2)}
.mzone.lit .mval{opacity:1;transform:scale(1);animation:mz-pop .45s cubic-bezier(.2,1.7,.4,1)}
.mzone.lit .mslot{opacity:0}
@keyframes mz-pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
/* 退位点：被减数位格右上角小圆点（.lit 显形；.cur 呼吸） */
.mzone.borrow .bn{pointer-events:none}
.mzone.borrow::after{content:"";position:absolute;top:.1em;right:.42em;width:.17em;height:.17em;
  border-radius:50%;background:#F7E7A1;opacity:0;transition:opacity .15s}
.mzone.borrow.lit::after{opacity:1}
.mzone.borrow .mslot{position:absolute;top:-.05em;right:.16em;width:.4em;height:.4em;border-radius:50%}
.mzone.borrow .mval{display:none}
.mzone.shake{animation:mz-shake .5s ease}
@keyframes mz-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* 粉笔横线 */
#bline{height:calc(var(--bbfs,44px) * .12);min-height:5px;margin:calc(var(--bbfs,44px) * .07) 6%;
  border-radius:4px;background:#F7F3E7;opacity:.92;box-shadow:0 1px 0 rgba(0,0,0,.2)}
/* 答案三格：百|十|个；当前格高亮闪烁（慢频 1.15s，无频闪）；填对=粉笔白亮；填错=暖红晃 */
.bcell{min-width:calc(var(--bbfs,44px) * 1.06);height:calc(var(--bbfs,44px) * 1.18);
  display:flex;align-items:center;justify-content:center;border:3px dashed rgba(247,243,231,.5);
  border-radius:10px;font-size:var(--bbfs,44px);font-weight:800;color:#F7F3E7;line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.28)}
.bcell.cur{border-color:#F7E7A1;animation:cellblink 1.15s ease infinite}
@keyframes cellblink{0%,100%{background:rgba(247,231,161,.1);border-color:rgba(247,231,161,.55)}
  50%{background:rgba(247,231,161,.3);border-color:#F7E7A1}}
.bcell.lit{border-style:solid;border-color:rgba(247,243,231,.85);color:#FFFDF6;
  animation:cell-pop .4s cubic-bezier(.2,1.7,.4,1)}
@keyframes cell-pop{0%{transform:scale(.55)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.bcell.bad{border-color:#E8796B;color:#F5A79B;animation:cellshake .5s ease}
@keyframes cellshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* 板擦（过题横扫动画）：木背+深灰毛毡 */
#eraser{position:absolute;top:16%;left:-96px;width:92px;height:46px;border-radius:11px;
  background:#B98A5F;border:5px solid #8B5E3C;opacity:0;pointer-events:none;
  box-shadow:0 3px 0 rgba(0,0,0,.18)}
#eraser::after{content:"";position:absolute;left:7px;right:7px;top:6px;bottom:6px;
  border-radius:6px;background:#5A5F66}
#bb.sweep #eraser{animation:erase-sweep .85s ease-in-out forwards}
@keyframes erase-sweep{0%{left:-96px;opacity:0;transform:rotate(0deg)}8%{opacity:1}
  50%{transform:rotate(-6deg)}100%{left:calc(100% + 26px);opacity:1;transform:rotate(4deg)}}

/* ---------- 数字键盘（3×4：1-9 + 末行空|0|空；键径 --key 由 layout() 实测，下限 64）
   标记相位键盘降权（#keys.dim）：底色变浅+描边减淡（数字恒深棕保对比），仍可点（miss 反馈） ---------- */
#keys{display:grid;grid-template-columns:repeat(3,var(--key,88px));grid-auto-rows:var(--key,88px);
  gap:13px;flex:0 0 auto;transition:opacity .2s}
#keys.dim .key{border-color:rgba(74,59,46,.4);background:#F3EBDA;box-shadow:0 3px 0 #D8C9B4}
.key{width:var(--key,88px);height:var(--key,88px);border-radius:20px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;font-size:calc(var(--key,88px) * .46);font-weight:800;color:#4A3B2E;
  font-variant-numeric:tabular-nums;transition:transform .12s,box-shadow .12s}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #D8C9B4}
/* 救援视觉（§0.21）：当前应填数字键 breathe 持续循环（慢频 1.25s，静音环境屏幕可感知） */
.key.breathe{animation:key-breathe 1.25s ease infinite}
@keyframes key-breathe{0%,100%{box-shadow:0 5px 0 #D8C9B4,0 0 0 0 rgba(232,151,90,.6);transform:scale(1)}
  50%{box-shadow:0 5px 0 #D8C9B4,0 0 0 15px rgba(232,151,90,0);background:#FDF0DA;transform:scale(1.07)}}
/* 吞输入期轻反馈（§0.22）：被吞键黄圈轻闪一拍 */
.key.nudge{animation:key-nudge .34s ease}
@keyframes key-nudge{0%{outline:7px solid #F5C445;outline-offset:0}
  100%{outline:7px solid transparent;outline-offset:10px}}
.keysp{width:var(--key,88px);height:var(--key,88px)}   /* 末行两侧占位（非按钮，不参与触摸审计） */

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch3-11 家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}
</style>
</head>
<body>
<div id="game" aria-label="竖式小黑板">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="tip" aria-live="polite"><span id="tip-text">加法竖式，算一算</span></div>
    <div id="table">
      <div id="boardwrap" aria-label="竖式小黑板">
        <div id="bb">
          <div id="bb-face">
            <div class="brow mband">
              <span></span>
              <button id="mz-c2" class="mzone carry" aria-label="百位进位小1"><span class="mslot"></span><b class="mval">1</b></button>
              <button id="mz-c1" class="mzone carry" aria-label="十位进位小1"><span class="mslot"></span><b class="mval">1</b></button>
              <span></span>
            </div>
            <div class="brow numrow">
              <span class="bop"></span>
              <button id="mz-b2" class="mzone borrow" aria-label="百位退位点"><span class="bn" id="a-h"></span><span class="mslot"></span></button>
              <button id="mz-b1" class="mzone borrow" aria-label="十位退位点"><span class="bn" id="a-t"></span><span class="mslot"></span></button>
              <span class="bn" id="a-o"></span>
            </div>
            <div class="brow numrow">
              <span class="bop" id="op-sign">+</span>
              <span class="bn" id="b-h"></span>
              <span class="bn" id="b-t"></span>
              <span class="bn" id="b-o"></span>
            </div>
            <div id="bline"></div>
            <div class="brow numrow">
              <span class="bop" id="step-chip"></span>
              <span class="bcell" id="c-h"></span>
              <span class="bcell" id="c-t"></span>
              <span class="bcell" id="c-o"></span>
            </div>
          </div>
          <div id="eraser"></div>
        </div>
      </div>
      <div id="keys" aria-label="数字键盘"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;

    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };

  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();

      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

/* ================= column 纯引擎：确定性竖式题目生成 + 计划(plan)驱动进退位操作步与逐位填键判定
   （无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   r15 章难度（SPEC-BATCH12 §3-r15；进度章号单调递增、难度章号 (ch-1)%4+1 循环）：
     dch1 两位加法（qi0 不进位热身 / qi1-7 进位自点亮小 1）
     dch2 两位减法（qi0 不退位热身 / qi1-7 退位自点亮）
     dch3 三位数加减（qi0 加无标记 / qi1 减无标记 / qi2 加单进 / qi3 减单退 / qi4 加单进 /
          qi5 减单退 / qi6 加连进双标记 / qi7 减连退双标记）
     dch4 两步竖式（qi0 两步无标记 / qi1-4 恰一步有标记 / qi5-7 两步全标记；as=+后− / sa=−后+）
   生成关（flat≥STATIC_LEVELS）难度章 = ri(rnd,1,4) 随机取材（§0.3 batch11 M1 定版）
   ——生成关随机章在四型全域成立（每章型 qi 0-7 构造域全档可生成，§3-r15 先验验算）
   计划(plan)驱动（r15 核心 delta：进退位标记=玩家操作步，非系统代劳）：
     加法动作序（个位起）：填 i 位 →[满十?点亮进位小 1 于 i+1 列]→…（标记在填位后）
     减法动作序（个位起）：[不够减?点亮退位点于 i+1 列]→ 填 i 位 →…（标记在填位前）
     两步题=步 1 计划走完 → 换步 2（中间结果作步 2 首操作数）→ 步 2 计划
   miss 口径（题级 q.miss，不灰化）：填位错数字 / 标记相位按数字键（不可跳过）/
     同 op 槽位错点亮 = miss；提前点亮（后续将点亮的标记）与重复点已亮 = 轻反馈不 miss；
     异 op 槽位（减法点进位带/加法点数位格）= 惰性 no-op（返回 false，非数学断言不罚） */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;
const markKey = (t, col) => t + col;                     // 'c1'=进位到十位 / 'b2'=百位退位点

/* ---------- 单步竖式（两位/三位）：由数值独立推导计划（加=填后标记/减=标记后填） ---------- */
function buildStep(op, a, b) {
  const nd = op === 'add' ? (a + b >= 100 ? 3 : 2) : (a - b >= 100 ? 3 : 2);
  const dg = n => String(n).split('').reverse().map(Number);   // 个位起
  const A = dg(a), B = dg(b);
  const plan = [], marks = [], digits = [];
  if (op === 'add') {
    let carry = 0;
    for (let i = 0; i < nd; i++) {
      const s = (A[i] || 0) + (B[i] || 0) + carry;
      digits.push(s % 10);
      plan.push({ t: 'd', col: i, v: s % 10 });
      carry = s >= 10 ? 1 : 0;
      if (carry && i < nd - 1) { plan.push({ t: 'c', col: i + 1 }); marks.push(markKey('c', i + 1)); }
    }
  } else {
    let borrow = 0;
    for (let i = 0; i < nd; i++) {
      const av = (A[i] || 0) - borrow, r = av - (B[i] || 0);
      if (r < 0) {
        plan.push({ t: 'b', col: i + 1 }); marks.push(markKey('b', i + 1));
        digits.push(r + 10); plan.push({ t: 'd', col: i, v: r + 10 });
        borrow = 1;
      } else {
        digits.push(r); plan.push({ t: 'd', col: i, v: r });
        borrow = 0;
      }
    }
  }
  return { op: op, a: a, b: b, ans: op === 'add' ? a + b : a - b, nd: nd,
           plan: plan, digits: digits, marks: marks,
           pos: 0, cells: new Array(nd).fill(null), lit: [], miss: 0, solved: false };
}

/* ---------- 数值域（§3-r15 全封闭；ri 直接落域，无全域拒绝采样） ---------- */
function pickAdd2(rnd, carry) {
  if (carry) {
    const ta = ri(rnd, 1, 7), tb = ri(rnd, 1, 8 - ta);     // 十位和 ≤8（进 1 后 ≤9 → 和 ≤99）
    const oa = ri(rnd, 1, 9), ob = ri(rnd, 10 - oa, 9);    // 个位和 ≥10（进位）
    return [ta * 10 + oa, tb * 10 + ob];
  }
  const ta = ri(rnd, 1, 8), tb = ri(rnd, 1, 9 - ta);       // 十位和 ≤9 → 和 ≤99
  const oa = ri(rnd, 0, 9), ob = ri(rnd, 0, 9 - oa);       // 个位和 ≤9（不进位）
  return [ta * 10 + oa, tb * 10 + ob];
}
function pickSub2(rnd, borrow) {
  if (borrow) {
    const ta = ri(rnd, 3, 9), tb = ri(rnd, 1, ta - 2);      // 十位差 ≥2（借 1 后仍 ≥1 → 差 ≥10）
    const oa = ri(rnd, 0, 8), ob = ri(rnd, oa + 1, 9);      // 个位不够减（退位借 1）
    return [ta * 10 + oa, tb * 10 + ob];
  }
  const ta = ri(rnd, 2, 9), tb = ri(rnd, 1, ta - 1);       // 十位差 ≥1 → 差 ≥10
  const oa = ri(rnd, 0, 9), ob = ri(rnd, 0, oa);           // 个位够减（不退位）
  return [ta * 10 + oa, tb * 10 + ob];
}
/* 三位数加：varr 'nc' 无进位 / 'o' 仅个位进 / 't' 仅十位进 / 'cc' 连续进位（双标记） */
function pickAdd3(rnd, varr) {
  let ha, hb, ta, tb, oa, ob;
  if (varr === 'nc') {
    ha = ri(rnd, 1, 8); hb = ri(rnd, 1, 9 - ha);
    ta = ri(rnd, 0, 9); tb = ri(rnd, 0, 9 - ta);
    oa = ri(rnd, 0, 9); ob = ri(rnd, 0, 9 - oa);
  } else if (varr === 'o') {
    ha = ri(rnd, 1, 8); hb = ri(rnd, 1, 9 - ha);           // 百位和 ≤9（无百位进 → 和三位）
    ta = ri(rnd, 0, 8); tb = ri(rnd, 0, 8 - ta);           // 十位和 ≤8（+1 后 ≤9 不二连进）
    oa = ri(rnd, 1, 9); ob = ri(rnd, 10 - oa, 9);          // 个位和 ≥10
  } else if (varr === 't') {
    ha = ri(rnd, 1, 7); hb = ri(rnd, 1, 8 - ha);           // 百位和 ≤8（+1 后 ≤9 → 和三位；ha ≤7 防空区间）
    ta = ri(rnd, 1, 9); tb = ri(rnd, 10 - ta, 9);          // 十位和 ≥10（进百位）
    oa = ri(rnd, 0, 9); ob = ri(rnd, 0, 9 - oa);           // 个位和 ≤9
  } else {                                                  // 'cc' 连续进位
    ha = ri(rnd, 1, 7); hb = ri(rnd, 1, 8 - ha);           // 百位和 ≤8（+1 后 ≤9 → 和三位；ha ≤7 防空区间）
    ta = ri(rnd, 0, 9); tb = ri(rnd, 9 - ta, 9);           // 十位和 ≥9（+1 ≥10 二连进）
    oa = ri(rnd, 1, 9); ob = ri(rnd, 10 - oa, 9);          // 个位和 ≥10
  }
  return [ha * 100 + ta * 10 + oa, hb * 100 + tb * 10 + ob];
}
/* 三位数减：varr 'nb' 无退位 / 'o' 仅个位退 / 't' 仅十位退 / 'bb' 连续退位（双标记） */
function pickSub3(rnd, varr) {
  let ha, hb, ta, tb, oa, ob;
  if (varr === 'nb') {
    ha = ri(rnd, 2, 9); hb = ri(rnd, 1, ha - 1);           // 百位差 ≥1 → 差三位
    ta = ri(rnd, 0, 9); tb = ri(rnd, 0, ta);
    oa = ri(rnd, 0, 9); ob = ri(rnd, 0, oa);
  } else if (varr === 'o') {
    ha = ri(rnd, 2, 9); hb = ri(rnd, 1, ha - 1);           // 百位差 ≥1（无百位退 → 差三位）
    ta = ri(rnd, 1, 9); tb = ri(rnd, 0, ta - 1);           // 十位借 1 后仍够减（ta−1 ≥ tb）
    oa = ri(rnd, 0, 8); ob = ri(rnd, oa + 1, 9);           // 个位不够减
  } else if (varr === 't') {
    ha = ri(rnd, 3, 9); hb = ri(rnd, 1, ha - 2);           // 百位差 ≥2（借 1 后 ≥1 → 差三位）
    ta = ri(rnd, 0, 8); tb = ri(rnd, ta + 1, 9);           // 十位不够减（向百位借）
    oa = ri(rnd, 0, 9); ob = ri(rnd, 0, oa);               // 个位够减（仅十位退）
  } else {                                                  // 'bb' 连续退位
    ha = ri(rnd, 3, 9); hb = ri(rnd, 1, ha - 2);           // 百位差 ≥2（借 1 后 ≥1 → 差三位）
    ta = ri(rnd, 0, 8); tb = ri(rnd, ta + 1, 9);           // 十位借 1 后仍不够（ta−1 < tb）
    oa = ri(rnd, 0, 8); ob = ri(rnd, oa + 1, 9);           // 个位不够减
  }
  return [ha * 100 + ta * 10 + oa, hb * 100 + tb * 10 + ob];
}

/* ---------- 单题生成（章型+题序定变体；确定性同 rnd 流） ---------- */
function genQuiz(dch, qi, rnd, used) {
  for (let t = 0; t < 80; t++) {                           // 同关无重复题（80 次兜底）
    let q;
    if (dch === KIND_ADD2) {
      const [a, b] = pickAdd2(rnd, qi > 0);
      q = quizOfSingle('add', a, b);
    } else if (dch === KIND_SUB2) {
      const [a, b] = pickSub2(rnd, qi > 0);
      q = quizOfSingle('sub', a, b);
    } else if (dch === KIND_MIX3) {                        // 三位混合章：奇偶交替加减
      if (qi % 2 === 0) {
        const varr = qi === 0 ? 'nc' : (qi === 6 ? 'cc' : (rnd() < 0.5 ? 'o' : 't'));
        const [a, b] = pickAdd3(rnd, varr);
        q = quizOfSingle('add', a, b);
      } else {
        const varr = qi === 1 ? 'nb' : (qi === 7 ? 'bb' : (rnd() < 0.5 ? 'o' : 't'));
        const [a, b] = pickSub3(rnd, varr);
        q = quizOfSingle('sub', a, b);
      }
    } else {                                                // KIND_TWO 两步竖式
      const form = qi % 2 === 0 ? 'as' : 'sa';             // as/sa 确定性交替
      /* 标记分布：qi0 两步无标记 / qi1-4 恰一步 / qi5-7 两步全标记 */
      const both = qi >= 5, none = qi === 0;
      q = genTwo(form, rnd, none, both);
      if (!q) continue;                                     // 步 2 域不可满足 → 重试（域充裕）
    }
    if (!used || used.indexOf(q.text) < 0) return q;
  }
  return null;                                              // 域耗尽（先验保证不达；verify 兜断言）
}

function quizOfSingle(op, a, b) {
  const st = buildStep(op, a, b);
  return attachDur({ form: null, op: op, a: a, b: b, ans: st.ans, nd: st.nd,
                     steps: [st], si: 0, miss: 0, solved: false,
                     text: a + (op === 'add' ? '+' : '-') + b });
}
/* 步 2 第二操作数按首操作数（mid）定域构造：null=该变体对此 mid 不可满足（外层重试步 1） */
function pickSub2From(a, rnd, borrow) {
  const ta = Math.floor(a / 10), oa = a % 10;
  if (borrow) {
    if (ta < 3 || oa > 8) return null;                    // 借位需十位 ≥3（差 ≥10）且个位可借（≤8）
    return ri(rnd, 1, ta - 2) * 10 + ri(rnd, oa + 1, 9);
  }
  if (ta < 2) return null;                                // 不退位需十位差 ≥1（差 ≥10）
  return ri(rnd, 1, ta - 1) * 10 + ri(rnd, 0, oa);
}
function pickAdd2From(a, rnd, carry) {
  const ta = Math.floor(a / 10), oa = a % 10;
  if (carry) {
    if (ta > 7 || oa < 1) return null;                    // 进位需十位和 ≤8（+1 ≤9）且个位和可 ≥10
    return ri(rnd, 1, 8 - ta) * 10 + ri(rnd, 10 - oa, 9);
  }
  if (ta > 8) return null;                                // 不进位需十位和 ≤9
  return ri(rnd, 1, 9 - ta) * 10 + ri(rnd, 0, 9 - oa);
}
function genTwo(form, rnd, none, both) {
  /* 步 1：as=加 / sa=减；步 2：as=减 / sa=加（中间结果作步 2 首操作数） */
  const mk1 = none ? false : (both ? true : rnd() < 0.5);   // 恰一步=seeded 选步 1 或步 2 带标记
  const mk2 = none ? false : (both ? true : !mk1);
  for (let t = 0; t < 80; t++) {
    const p1 = form === 'as' ? pickAdd2(rnd, mk1) : pickSub2(rnd, mk1);
    const s1 = buildStep(form === 'as' ? 'add' : 'sub', p1[0], p1[1]);
    const mid = s1.ans;
    const c2 = form === 'as' ? pickSub2From(mid, rnd, mk2) : pickAdd2From(mid, rnd, mk2);
    if (c2 == null) continue;                              // 步 2 变体对此 mid 不可满足 → 重试步 1
    const s2 = buildStep(form === 'as' ? 'sub' : 'add', mid, c2);
    if (s2.nd !== 2) continue;                             // 步 2 结果恒两位（域保证，防御断言）
    return attachDur({ form: form, op: s1.op, a: s1.a, b: s1.b, c: s2.b, mid: mid, ans: s2.ans,
                       nd: 2, steps: [s1, s2], si: 0, miss: 0, solved: false,
                       text: s1.a + (form === 'as' ? '+' : '-') + s1.b + (form === 'as' ? '-' : '+') + s2.b });
  }
  return null;
}
/* 时长模型挂账（data 的 quizDurMs 消费）：planLen/planDecide/twoStart */
function attachDur(q) {
  const s1 = q.steps[0], s2 = q.steps[1];
  q.planLen = s1.plan.length + (s2 ? s2.plan.length : 0);
  q.planDecide = s1.plan.map(p => p.t === 'd' ? DECIDE_INPUT_MS : DECIDE_MARK_MS)
    .concat(s2 ? s2.plan.map(p => p.t === 'd' ? DECIDE_INPUT_MS : DECIDE_MARK_MS) : []);
  q.twoStart = s2 ? s1.plan.length : null;
  return q;
}

/* ---------- 关卡生成（静态 32 关与生成关同一确定性通道） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const gen = flat >= STATIC_LEVELS;                    // 静态 32 关之外=无限生成关
  const dch = gen ? ri(rnd, 1, 4) : diffOfCh(ch);       // 生成关难度章随机（先取数保确定性）
  const used = [];
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) {
    const q = genQuiz(dch, qi, rnd, used);
    used.push(q.text);
    quizzes.push(q);
  }
  return { flat, ch, dch, lv, gen, quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 引擎动作判定（无 DOM） ----------
   curActOf(L)：当前步当前 plan 动作；engKey(L,d)=数字键；engMark(L,t,col)=标记槽
   返回：'right' 填对推进 / 'mark' 标记点亮 / 'step2' 两步题步 1 完成换步 /
        'done' 末题末位（整关通关） / 'wrong' miss（题级计数） /
        'early' 轻反馈不 miss（提前点亮/重复点已亮） / null=非法或关末 /
        false=惰性 no-op（异 op 槽位：非数学断言不罚，UI 静默） ---------- */
const curStepOf = L => {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved) return null;
  return q.steps[q.si];
};
const curActOf = s => s.plan[s.pos];
function advStep(L, q, s, r) {                           // 末位填对：换步/换题/通关
  s.solved = true;
  if (q.steps[1] && q.si === 0) { q.si = 1; return 'step2'; }
  q.solved = true;
  L.step++;
  if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
  return r;                                              // 'right'（换题）
}
function miss(L, q) { q.miss++; L.retries++; }         /* 题级 miss 计数（不灰化款无上限） */
function engKey(L, d) {
  const s = curStepOf(L);
  if (!s) return null;
  if (!Number.isInteger(d) || d < 0 || d > 9) return null;
  const q = L.quizzes[L.step];
  const act = curActOf(s);
  if (act.t !== 'd') { miss(L, q); return 'wrongmark'; } /* 标记相位按数字键=miss（不可跳过，方向分型） */
  if (d !== act.v) { miss(L, q); return 'wrong'; }      /* 填错：零惩罚同位重填（不灰化可重点） */
  s.cells[act.col] = d;
  s.pos++;
  if (s.pos >= s.plan.length) return advStep(L, q, s, 'right');
  return 'right';
}
function engMark(L, t, col) {
  const s = curStepOf(L);
  if (!s) return null;
  if ((t !== 'c' && t !== 'b') || !Number.isInteger(col) || col < 1 || col > 2) return null;
  const q = L.quizzes[L.step];
  const act = curActOf(s);
  const key = markKey(t, col);
  if (act.t === t && act.col === col) {                 /* 当前应点标记：点亮推进 */
    s.lit.push(key);
    s.pos++;
    if (s.pos >= s.plan.length) return advStep(L, q, s, 'mark');   /* 末动作恒为填位，此支防御 */
    return 'mark';
  }
  if (s.op === 'add' && t === 'b') return false;        /* 异 op 槽位：惰性 no-op 不罚 */
  if (s.op === 'sub' && t === 'c') return false;
  if (s.plan.some(p => p.t === t && p.col === col && s.lit.indexOf(key) < 0))
    return 'early';                                     /* 提前点亮（后续将点）/未到相位：轻反馈不 miss */
  if (s.lit.indexOf(key) >= 0) return 'early';          /* 重复点已亮：轻反馈不 miss */
  miss(L, q); return 'wrongslot';                       /* 同 op 错点亮（本题无此标记/位置错）=miss */
}
/* 星级：一关零错次=3 星；错次 ≤2=2 星；否则 1 星。永不 0 星 */
const engStars = L => L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1);

/* ---------- 结构校验（verify 用）：数值域+计划+标记独立语义审计（不抄生成器分支，防两套逻辑同错）
   auditStep：从 (op,a,b) 独立位算复推 marks/digits/plan 并对账（auditQuiz 调） ---------- */
function auditStep(st) {
  if (!st || !Number.isInteger(st.a) || !Number.isInteger(st.b) || !Number.isInteger(st.ans)) return false;
  const nd = st.nd;
  if (nd !== 2 && nd !== 3) return false;
  const lo = nd === 2 ? 10 : 100, hi = nd === 2 ? 99 : 999;
  if (st.a < lo || st.a > hi || st.b < lo || st.b > hi) return false;               // 操作数 nd 位数
  if (st.ans !== (st.op === 'add' ? st.a + st.b : st.a - st.b)) return false;       // 总账
  if (st.ans < lo || st.ans > hi) return false;                                     // 结果 nd 位禁前导 0
  if (st.op === 'sub' && st.a <= st.b) return false;                                // 减法 a>b 禁负
  /* 独立位算（个位起）：进/退位标记复推 */
  const A = String(st.a).split('').reverse().map(Number);
  const B = String(st.b).split('').reverse().map(Number);
  const marks = [], digits = [], plan = [];
  if (st.op === 'add') {
    let carry = 0;
    for (let i = 0; i < nd; i++) {
      const sum = (A[i] || 0) + (B[i] || 0) + carry;
      digits.push(sum % 10); plan.push({ t: 'd', col: i, v: sum % 10 });
      carry = sum >= 10 ? 1 : 0;
      if (carry && i < nd - 1) { plan.push({ t: 'c', col: i + 1 }); marks.push(markKey('c', i + 1)); }
    }
    if (carry) return false;                                                        // 百位禁再进（结果恒 nd 位）
  } else {
    let borrow = 0;
    for (let i = 0; i < nd; i++) {
      const av = (A[i] || 0) - borrow, r = av - (B[i] || 0);
      if (r < 0) {
        if (i >= nd - 1) return false;                                              // 顶位禁再借（a>b 保证）
        plan.push({ t: 'b', col: i + 1 }); marks.push(markKey('b', i + 1));
        digits.push(r + 10); plan.push({ t: 'd', col: i, v: r + 10 });
        borrow = 1;
      } else { digits.push(r); plan.push({ t: 'd', col: i, v: r }); borrow = 0; }
    }
  }
  if (JSON.stringify(st.marks) !== JSON.stringify(marks)) return false;             // 标记集合对账
  if (JSON.stringify(st.digits) !== JSON.stringify(digits)) return false;           // 填序数字对账
  if (st.plan.length !== plan.length) return false;
  for (let k = 0; k < plan.length; k++) {                                            // 计划序对账（标记相位）
    if (st.plan[k].t !== plan[k].t || st.plan[k].col !== plan[k].col) return false;
    if (st.plan[k].v !== plan[k].v) return false;
  }
  return true;
}
/* 章型契约：dch+qi → (op/nd/标记总数) 期望（SPEC §3-r15 章型表独立硬编码） */
function auditProfile(dch, qi, q) {
  const s1 = q.steps[0], s2 = q.steps[1];
  const n1 = s1.marks.length, n2 = s2 ? s2.marks.length : 0;
  if (dch === KIND_ADD2) return s1.op === 'add' && s1.nd === 2 && !s2 &&
    n1 === (qi === 0 ? 0 : 1);
  if (dch === KIND_SUB2) return s1.op === 'sub' && s1.nd === 2 && !s2 &&
    n1 === (qi === 0 ? 0 : 1);
  if (dch === KIND_MIX3) {                               // 混合章：奇偶交替；qi0/1 热身 0 标记
    if (qi % 2 === 0) return s1.op === 'add' && s1.nd === 3 && !s2 &&
      n1 === (qi === 0 ? 0 : (qi === 6 ? 2 : 1));
    return s1.op === 'sub' && s1.nd === 3 && !s2 &&
      n1 === (qi === 1 ? 0 : (qi === 7 ? 2 : 1));
  }
  /* KIND_TWO：两位两步；as/sa 交替；qi0 全无 / qi1-4 恰一 / qi5-7 全有 */
  if (!s2 || s1.nd !== 2 || s2.nd !== 2) return false;
  if (q.form !== (qi % 2 === 0 ? 'as' : 'sa')) return false;
  if (s1.op !== (q.form === 'as' ? 'add' : 'sub')) return false;
  if (s2.op !== (q.form === 'as' ? 'sub' : 'add')) return false;
  const total = n1 + n2;
  return total === (qi === 0 ? 0 : (qi <= 4 ? 1 : 2));
}
function auditQuiz(dch, qi, q) {
  if (!q) return false;
  if (!q.steps.every(auditStep)) return false;
  if (q.steps[1]) {                                     // 两步：mid 链路对账
    if (q.mid !== q.steps[0].ans) return false;
    if (q.steps[1].a !== q.mid) return false;
    if (q.ans !== q.steps[1].ans) return false;
    if (q.a !== q.steps[0].a || q.b !== q.steps[0].b || q.c !== q.steps[1].b) return false;
  } else {
    if (q.a !== q.steps[0].a || q.b !== q.steps[0].b || q.ans !== q.steps[0].ans) return false;
  }
  return auditProfile(dch, qi, q);
}
/* ================= column 主逻辑（r15：黑板渲染 4 列 / 计划驱动填键+标记操作步 / 板擦 / 教学 / 救援 / 推进）
   玩法：小黑板呈现竖式（4 列数位对齐+横线：op|百|十|个，两位数百位列空），答案格当前格高亮闪烁；
   先个位后高位逐位填（clm_hint 口径）+ 进退位标记操作步：
   加法=填个位后若满十须点亮十位上方小"1"（再填十位）；减法=个位不够减先点亮被减数十位退位点（再填个位）；

   救援钟 14s（§0.7a/§0.21）：填位相位=重读题面 clm_q_* + 应填数字键 breathe；标记相位=标记句
   clm_carry_go/clm_borrow_go + 标记槽 breathe；错点/空白/探索点击不重置救援钟（契约 K 面板守卫）。
   验收钩子：window.CL = { get currentLevel, get quiz, tapKey(d), tapMark(t,col), start(flat), hear(),

'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);

const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/开场读题/教学不受 flat 门（§0.5：不识字孩子 flat≥3 静置零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音：flat<3 每错必播；flat≥3 走 10s 节流；force=miss===2 豁免恰一次

let lastWrongVoice = 0;

const stageEl = $id('stage'), tableEl = $id('table'), keysEl = $id('keys'),
      tipEl = $id('tip'), tipTextEl = $id('tip-text'), ghostEl = $id('ghost'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear');

let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let lastAct = Date.now();
let lastBlankHint = 0;                          // 空白/探索点击轻提示节流（§0.16，10s）
let lastReplayAt = 0;                           // 听按钮重播 3s 节流
let helpTimer = null, helpRedemo = false;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const keyEl = d => keysEl.querySelector('.key[data-d="' + d + '"]');
const zoneEl = (t, col) => $id('mz-' + t + col);          // 标记槽元素（'c'/'b' × 1/2 列）
const cellEl = col => $id(['c-o', 'c-t', 'c-h'][col]);    // 列号→答案格（0=个位 1=十位 2=百位）

/* ================= 静态构建 ================= */
const KEY_ORDER = [1, 2, 3, 4, 5, 6, 7, 8, 9, null, 0, null];   // 3×4：1-9 + 空|0|空
/* r15 审查 M3：旧档基迁移——CH_LEN 5→8 使 r12 存量档（5 基 '1-0'..'4-4'）键位错位（旧 '2-0'=旧 flat5
   误作新 flat8→跳关+章语义错乱）。新基顺序解锁下「有跨章首关 C-0 而缺前章第 6 键 (C-1)-5」=旧基残留矛盾态
   →一次性整档重置（赶在 KIDS.init 读档前删 localStorage，教学关 ~5min 成本优于静默跳关）。 */
try {
  const raw = localStorage.getItem('kidsgame_column');
  if (raw) {
    const lv = (JSON.parse(raw) || {}).levels || {};
    let legacy = false;
    for (let c = 2; c <= 4; c++) {
      if (lv[c + '-0'] !== undefined && lv[(c - 1) + '-5'] === undefined) { legacy = true; break; }
    }

} catch (e) { /* 迁移失败不阻断启动 */ }
function buildStatic() {

  /* 标记槽统一挂 pointerdown（引擎判分型：mark/early/wrongslot/false 惰性） */
  [['c', 1], ['c', 2], ['b', 1], ['b', 2]].forEach(([t, col]) => {
    const z = zoneEl(t, col);

/* 桌面布局（黑板‖键盘）：按舞台实测切换横/竖排；body.port 类通道强制竖排（r15 竖屏双通道）；
   键径 clamp[64,104]、黑板字号 clamp[40,62]（黑板数字 ≥40px 门禁） */
function layout() {
  const availW = stageEl.clientWidth - 16;
  const availH = stageEl.clientHeight - tipEl.offsetHeight - 22;
  const colMode = document.body.classList.contains('port') ||
                  (availH >= 640 && availW < availH * 1.1);   // 高屏窄持=竖排；否则横排
  tableEl.classList.toggle('col', colMode);
  const gap = 13;
  let kw, kh, bw, bh;
  if (colMode) {
    kw = Math.min(availW, 460); kh = availH * 0.42;
    bw = Math.min(availW, 480); bh = availH * 0.50;
  } else {
    kw = availW * 0.42; kh = availH * 0.92;
    bw = availW * 0.50; bh = availH * 0.94;
  }
  const key = Math.max(64, Math.min(Math.floor((kw - 2 * gap) / 3),
    Math.floor((kh - 3 * gap) / 4), 104));
  const bbw = Math.min(bw, 440);
  const bbfs = Math.max(40, Math.min(Math.floor(Math.min(bbw * 0.20, bh * 0.145)), 62));
  const de = document.documentElement;
  de.style.setProperty('--key', key + 'px');
  de.style.setProperty('--bbfs', bbfs + 'px');
}
window.addEventListener('resize', () => layout());

/* ================= 渲染 ================= */

  else { tipEl.className = ''; tipTextEl.textContent = TIPS[kind] || ''; }
}
function renderStep() {                         // HUD 本关 8 题进度点

/* 竖式黑板状态渲染：4 列数位对齐大字 + 标记槽 arm/cur/lit + 答案格当前位高亮 + ①② 步标 */
function renderBoardState(q) {
  if (!q) return;
  const s = q.steps[q.si], nd = s.nd;
  const dg = (n, i) => nd > 2 || i < 2 ? String(n).split('').reverse()[i] : '';
  $id('a-h').textContent = nd === 3 ? dg(s.a, 2) : '';
  $id('a-t').textContent = dg(s.a, 1);
  $id('a-o').textContent = dg(s.a, 0);
  $id('b-h').textContent = nd === 3 ? dg(s.b, 2) : '';
  $id('b-t').textContent = dg(s.b, 1);
  $id('b-o').textContent = dg(s.b, 0);
  $id('op-sign').textContent = s.op === 'add' ? '+' : '−';
  $id('step-chip').textContent = q.form ? (q.si === 0 ? '①' : '②') : '';
  [0, 1, 2].forEach(col => {
    const c = cellEl(col);
    c.textContent = s.cells[col] == null ? '' : s.cells[col];
    c.classList.remove('cur', 'lit', 'bad');
  });
  const act = s.plan[s.pos];
  if (act && act.t === 'd') cellEl(act.col).classList.add('cur');   // 当前应填格高亮
  /* 标记槽：可见性（加法=标记带 / 减法=位格）+ arm 淡锚 + cur 呼吸 + lit 已亮 */
  [['c', 1], ['c', 2], ['b', 1], ['b', 2]].forEach(([t, col]) => {
    const z = zoneEl(t, col);
    const visible = (t === 'c') === (s.op === 'add') && col < nd;
    z.hidden = !visible;
    z.classList.toggle('arm', visible && !z.classList.contains('lit'));
    z.classList.toggle('lit', s.lit.indexOf(markKey(t, col)) >= 0);
    z.classList.toggle('cur', !!(act && act.t === t && act.col === col));
  });
}
/* 相位同步：标记相位键盘降权+入口提示（flat<3 单次）
   判据 prevActT==='d'（刚从填位进入标记相位）或 allowPrompt（新题/交接后首动作即借位） */
function syncPhase(allowPrompt) {
  const q = cur && cur.quizzes[cur.step];
  if (!q || q.solved) { keysEl.classList.remove('dim'); return; }
  const s = q.steps[q.si];
  const act = s.plan[s.pos];
  keysEl.classList.toggle('dim', !!act && act.t !== 'd');
  if (act && act.t !== 'd' && (prevActT === 'd' || allowPrompt)) {
    const v = act.t === 'c' ? VOICE.carryGo : VOICE.borrowGo;
    if (!state.demo && !state.quiet) sayP(v.key, v.text);
  }
  prevActT = act ? act.t : null;

function hideSweep() { $id('bb').classList.remove('sweep', 'wiped', 'stepswap'); }
function clearBreathe() {

function renderQuiz() {

/* ================= 填键主路径（真实点击 / CL.tapKey / autoSolve 共用） ================= */
async function uiKey(d, demo) {
  /* locked 门拦真实输入；demo 通道仅 tutorialWatch 内部传 true（豁免 locked 门，照家族惯例） */
  if (!cur || state.won) return false;
  if ((state.locked && !demo) || (state.demo && !demo)) {
    if (!demo && !state.won) { sfx('pop'); nudgeKey(d); }   // 吞输入+轻叮+键圈轻闪（§0.22）
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.solved) return false;
  if (!Number.isInteger(d) || d < 0 || d > 9) return false;
  const run = cur;                              /* 演出窗口内点重玩会重建 cur——身份守卫防旧续体错推进 */
  const s = q.steps[q.si];
  const act = s.plan[s.pos];
  const r = engKey(cur, d);
  if (r === null || r === false) return false;

  if (r === 'wrong' || r === 'wrongmark') {
    if (r === 'wrong') {                        /* 填错：该格暖红晃+零惩罚同位重填（不灰化可重点） */
      const cell = cellEl(act.col);

      nudgeZone(act.t, act.col);
      sfx('fail');
      const v = act.t === 'c' ? VOICE.carryGo : VOICE.borrowGo;
      sayW(v.key, v.text, q.miss === 2);
    }
    state.locked = true;                        /* 晃动窗防重入（此窗内新点击=演出窗吞输入+轻叮） */
    await wait(620 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    if (r === 'wrong') {
      const cell = cellEl(act.col);
      if (cell) { cell.textContent = ''; cell.classList.remove('bad'); }
    }
    renderBoardState(q);                        /* 当前格高亮复位（同一格重填） */
    return r;

  if (state.tut === 'help') {                   /* 教学"独"：首次填对 → 强化反馈放手 */
    state.tut = 'solo';

    hopRabbit();
    setTip(q.form ? 'two' : s.op);
  }
  const cell = cellEl(act.col);
  if (cell) {
    cell.textContent = d;
    cell.classList.remove('bad', 'cur');
    cell.classList.add('lit');

  if (!VERIFY) KIDS.audio.note(act.col === 0 ? 523.25 : (act.col === 1 ? 659.25 : 783.99), 0.38, 0, 0.85);
  if (r === 'step2') {                          /* 步 1 完成：换步 2（板面换页+第二步句） */
    renderBoardState(q);                        /* 先落格白亮再换面 */
    state.locked = true;
    await wait(300 * SPEED);
    if (cur !== run) return r;
    $id('bb').classList.add('stepswap');
    prevActT = 'd';                             /* 换步后首动作若为标记=新入口（提示可播） */
    renderBoardState(q);
    sayR(VOICE.qStep2.key, VOICE.qStep2.text);  /* 第二步指令（救援口径不受 flat 门） */
    syncPhase();
    await wait(420 * SPEED);
    if (cur !== run) return r;
    $id('bb').classList.remove('stepswap');
    state.locked = false;
    return r;
  }
  renderBoardState(q);                          /* 下一格高亮/标记槽 cur 在此更新 */
  syncPhase();
  if (q.solved) {                               /* 末位填对=过题：板擦横扫 → 换题/通关 */
    sfx('coin');

             col: act.col, cells: s.cells.slice(), marks: s.lit.slice(),
             step: cur.step, miss: q.miss,
             carry: s.marks.some(m => m.charAt(0) === 'c'),
             borrow: s.marks.some(m => m.charAt(0) === 'b') };
  },
  tapKey(d) { return uiKey(d); },
  tapMark(t, col) { return uiMark(t, col); },
  start(flat) {                                 /* 测试钩子：跳关（教学看演期拒防打断） */
    if (!cur || state.demo) return false;

  },
  hear() { return replaySpeech(true); },        /* 测试钩子：无视节流直通重读题面 */
  async autoSolve() {                           // UI 路径自动答完当前关（照 plan 逐动作：填位+标记）
    let taps = 0, guard = 0;

      if (!q || q.solved) break;
      const s = q.steps[q.si];

  },
  get rescues() { return rescueCount; },        /* 救援触发计数（自测用） */
  get tutorial() { return state.tut; }
};

  }
  const twoOk = sawChip2;
  const hintOk = w0Ok && flOk && c1Ok && phaseOk && skipOk && litOk && bOk && bLitOk && twoOk;
  if (hintOk) npass++;
  units.markFlow = { ok: hintOk, warmAnchor: w0Ok && flOk, carryPhase: c1Ok && phaseOk,
                     noSkip: skipOk, carryLit: litOk, borrowPhase: bOk && bLitOk, twoStep: twoOk };

  /* ---- ⑩ 布局：双 viewport 实测 + body.port 类通道（portStyle 锚=#table.col）
     量测 offsetWidth/offsetHeight（避 transform）；量测前清瞬态类 ---- */
  function simView(w, h, port) {
    const g = $id('game');
    document.querySelectorAll('.breathe,.nudge,.shake,.bad').forEach(e => {
      e.classList.remove('breathe', 'nudge', 'shake', 'bad');
    });
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    document.body.classList.toggle('port', !!port);
    layout();
    const bad = [];
    document.querySelectorAll('button').forEach(e => {
      if (e.classList.contains('k-parentbtn')) return;       // core 家长按钮豁免（§0.9）
      if (e.offsetParent === null) return;                    // hidden 槽不参与（display:none）
      if (e.offsetWidth > 4 && e.offsetHeight > 4 &&
          (e.offsetWidth < 64 || e.offsetHeight < 64))
        bad.push((e.id || e.className) + ':' + e.offsetWidth + 'x' + e.offsetHeight);
    });
    const keys = Array.prototype.map.call(document.querySelectorAll('.key'),
      k => Math.min(k.offsetWidth, k.offsetHeight));
    const keyOk = keys.length === 10 && keys.every(a => a >= 64);   // 键盘 0-9 ≥64（§3）
    const zones = Array.prototype.map.call(
      document.querySelectorAll('.mzone:not([hidden])'),
      z => Math.min(z.offsetWidth, z.offsetHeight));
    const zoneOk = zones.length >= 1 && zones.every(a => a >= 64);  // 可见标记槽 ≥64（两位数关仅 1 槽在场）
    const bn = document.querySelector('.bn');
    const fs = bn ? parseFloat(getComputedStyle(bn).fontSize) : 0;
    const bnOk = fs >= 40;                                   // 黑板数字大字 ≥40px（§3）
    const cellsOk = document.querySelectorAll('.bcell').length === 3;   // 4 列三位答案格
    const tipR = tipEl.getBoundingClientRect();
    const tipOk = tipR.width > 100 && tipR.height >= 40;
    const de = document.documentElement;
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    /* portStyle 锚：竖排判据只依赖 #game 模拟尺寸实测 + body.port 类通道
       （#game 为 fixed+显式宽高，测值与真实窗口方向无关——P1b 真竖下横模拟仍须横排） */
    const colExpect = port || h >= 1180;
    document.body.classList.remove('port');
    return { vp: w + 'x' + h + (port ? 'P' : ''), bad: bad, keyOk: keyOk, minKey: keys.length ?
      Math.round(Math.min.apply(null, keys)) : 0, zoneOk: zoneOk, bbfs: Math.round(fs),
      cellsOk: cellsOk, tipOk: tipOk, ox: ox, colMode: tableEl.classList.contains('col'),
      colExpect: colExpect, pass: !bad.length && keyOk && zoneOk && bnOk && cellsOk && tipOk &&
      ox <= 0 && tableEl.classList.contains('col') === colExpect };
  }
  total++;
  const sims = [];
  for (const flat of [0, 5, 16, 24]) {          // 四章代表关（flat16=ch3 三位、flat24=ch4 两步）
    startLevel(flat);
    sims.push(simView(1280, 800, false));       // 横屏实测（col 期望=false）
    sims.push(simView(800, 1180, false));       // 竖屏实测（量测条件成立 col=true）
    sims.push(simView(1280, 800, true));        // 竖屏类通道（body.port 强制 col=true）
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                // 还原真实 viewport 布局
  const layoutOk = sims.every(s => s.pass);
  if (layoutOk) npass++;
  smokes.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑪ UI 冒烟 A：flat0 首错零惩罚 + autoSolve 通关（1 错=2 星，23 动作） ---- */
  total++;
  startLevel(0);
  const qw = CL.quiz;
  const rw = await CL.tapKey((qw.need + 1) % 10);   // 首题先错一次：零惩罚同位重填
  const wrongDone = rw === 'wrong' && CL.currentLevel.step === 0 &&
                    CL.currentLevel.retries === 1 && CL.quiz.phase === 'fill';
  const a0 = await CL.autoSolve();              // 补完本题（2 键）+ 后续 7 题（3 动作/题）
  const lvA = CL.currentLevel;
  const smokeOkA = wrongDone && a0.done && lvA.done && lvA.won &&
    lvA.retries === 1 && engStars(cur) === 2 && a0.taps === 23 &&   // flat0：2+7×3 动作
    !document.querySelector('.k-celebrate');    // verify 页不弹层
  if (smokeOkA) npass++;
  smokes.flat0 = { ok: smokeOkA, wrongDone: wrongDone, taps: a0.taps, retries: lvA.retries, stars: engStars(cur) };

  /* ---- ⑪ UI 冒烟 B：flat8（ch2 退位章，首题热身）autoSolve 全对 3 星 ---- */
  total++;
  startLevel(8);
  const warm8 = CL.quiz.borrow === false && CL.quiz.op === 'sub';   // 退位章首题=热身不退位
  const a8 = await CL.autoSolve();
  const lv8 = CL.currentLevel;
  const smokeOkB = warm8 && a8.done && lv8.done && lv8.won &&
    lv8.retries === 0 && engStars(cur) === 3 && a8.taps === 23;
  if (smokeOkB) npass++;
  smokes.flat8 = { ok: smokeOkB, warm: warm8, taps: a8.taps, stars: engStars(cur) };

  /* ---- ⑪ UI 冒烟 C：flat24（ch4 两步章，首题热身）autoSolve 全对 3 星（4+5×4+6×3 动作） ---- */
  total++;
  startLevel(24);
  const warm24 = CL.quiz.form !== null && CL.quiz.marks.length === 0;   // 两步热身=无标记
  const a24 = await CL.autoSolve();
  const lv24 = CL.currentLevel;
  const smokeOkC = warm24 && a24.done && lv24.done && lv24.won &&
    lv24.retries === 0 && engStars(cur) === 3 && a24.taps === 42;
  if (smokeOkC) npass++;
  smokes.flat24 = { ok: smokeOkC, warm: warm24, taps: a24.taps, stars: engStars(cur) };

  /* ---- ⑫ duration：独立副本复算（estMsV/分型常量/计划推导全 verify 侧——分源）
     + 逐关对账 levelDurMs + 40 关最低值精确防回漂（CLM_DMIN === 117600） ---- */
  total++;
  const estMsV = s => s.length * 345 + 600;                /* b25 定版（与 data estMs 四方同步） */
  const DECIDE_INPUT_V = 5000, DECIDE_MARK_V = 4000;      /* r15 分型常量（SPEC §4 独立副本） */
  const ADV_V = 1200, ENTER_V = 400, STAGE_V = 400;
  const TWO2_V = estMsV('第二步，接着算') + 300;            /* 步 2 换面句窗 */
  const CLM_DMIN = 117600;                                 /* 40 关最低=ch1/ch2 关恒值：
                                                             11200 + 7×15200（verify ⑫ 精确防回漂） */
  const cueV = q => q.form ? '两步竖式，算一算'
    : (q.op === 'add' ? '加法竖式，算一算' : '减法竖式，算一算');
  const durV = q => {
    let sum = 0, k = 0;
    const twoStart = q.steps[1] ? q.steps[0].plan.length : -1;
    q.steps.forEach(st => {
      /* 独立位算复推动作 DECIDE 序列（禁调 planDecide——分源对账） */
      const A = String(st.a).split('').reverse().map(Number);
      const B = String(st.b).split('').reverse().map(Number);
      const dec = [];
      if (st.op === 'add') {
        let carry = 0;
        for (let i = 0; i < st.nd; i++) {
          dec.push(DECIDE_INPUT_V);
          carry = ((A[i] || 0) + (B[i] || 0) + carry) >= 10 ? 1 : 0;
          if (carry && i < st.nd - 1) dec.push(DECIDE_MARK_V);
        }
      } else {
        let borrow = 0;
        for (let i = 0; i < st.nd; i++) {
          if (((A[i] || 0) - borrow - (B[i] || 0)) < 0) { dec.push(DECIDE_MARK_V); dec.push(DECIDE_INPUT_V); borrow = 1; }
          else { dec.push(DECIDE_INPUT_V); borrow = 0; }
        }
      }
      dec.forEach(d => {
        const win = k === 0 ? (ENTER_V + estMsV(cueV(q)) + 300)
                            : (k === twoStart ? TWO2_V : STAGE_V);
        sum += Math.max(win, d);
        k++;
      });
    });
    return sum + ADV_V;
  };
  let durAll = true, dMin = Infinity, dMinFlat = -1;
  for (let flat = 0; flat < 40; flat++) {
    const Ld = genLevel(flat);
    let sumV = 0;
    Ld.quizzes.forEach(q => {
      sumV += durV(q);
      if (durV(q) !== quizDurMs(q)) durAll = false;        /* 独立副本 vs data 模型逐题对账 */
    });
    if (sumV !== levelDurMs(Ld)) durAll = false;           /* 逐关对账 */
    if (sumV < LEVEL_MIN_MS) durAll = false;               /* 硬门禁 >=40000 */
    if (sumV < dMin) { dMin = sumV; dMinFlat = flat; }
  }
  if (!(CLM_DMIN === dMin && LEVEL_MIN_MS <= dMin)) durAll = false;   /* 精确防回漂 */
  if (durAll) npass++;
  units.duration = { ok: durAll, dMin: dMin, dMinFlat: dMinFlat, expect: CLM_DMIN,
    minGate: LEVEL_MIN_MS };

  const out = { game: 'column', total: total, pass: npass, layoutOk: layoutOk,
    levels: levels, gen: gen, dchHist: dchHist, units: units, smokes: smokes };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__clmVlog = out;                                  /* _selftest P1/P1b 抓取口 */
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险；§0.2 字面清单对齐） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  KIDS.voice.say = function () {};
  runVerify();
}

</script>
