<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>颜色魔法</title>
<style>
/* ================= 颜色魔法 colormix（batch22）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色；
   触摸目标：颜料罐按钮 ≥84px、底栏按钮 ≥72（均 ≥64）；
   浅色色块（黄/白/浅色系）靠 INK 暖棕深描边保证对比度（≥3:1 口径=描边色对底色）；
   5-6 岁零文字依赖：目标=大色块+语音承载色名；「？」泡=非目标反馈（非文字题面） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#F2C9A0;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：目标卡 → 玻璃缸 → 颜料罐排（纵列布局，横竖屏同构） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:6px 10px}

/* 目标色大卡：色块由 JS 设背景；wasm 小图标点角；零文字标签（色名走语音与 aria） */
#prompt{flex:0 0 auto;display:flex;align-items:center;gap:12px}
#target-card{position:relative;width:128px;height:88px;border-radius:20px;background:#E4D9C6;
  border:3.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;transition:background .4s}
#target-card .wand{position:absolute;right:-14px;top:-16px;width:40px;height:40px;
  filter:drop-shadow(0 2px 0 rgba(74,59,46,.25))}
#target-card.rescue{animation:tg-rescue 1.1s ease-in-out 3}
@keyframes tg-rescue{0%,100%{box-shadow:0 5px 0 #D8C9B4}50%{box-shadow:0 5px 0 #D8C9B4,0 0 0 10px rgba(232,151,90,.4)}}

/* 玻璃缸：CSS 容器=玻璃壁；液体=底部色带（result 色漫开 transition）；球排=缸内 contents 可视 */
#bench{position:relative;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;gap:26px}
#tank{position:relative;width:300px;height:224px;border:4px solid #9FC2D2;border-radius:14px 14px 22px 22px;
  background:linear-gradient(180deg,rgba(236,246,250,.55),rgba(216,235,243,.8));overflow:hidden;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 4px 0 #CFDDE5}
#liquid{position:absolute;left:0;right:0;bottom:0;height:46%;background:#E4F1F6;
  transition:background .5s ease}
#liquid.spread{animation:lq-spread .5s ease}
@keyframes lq-spread{0%{filter:brightness(1.25)}100%{filter:brightness(1)}}
#pot-balls{position:absolute;left:10px;right:10px;bottom:12px;display:flex;gap:9px;justify-content:center;align-items:flex-end}
.pball{width:34px;height:34px;border-radius:50%;border:3px solid #4A3B2E;flex:0 0 auto;
  animation:ball-pop .3s cubic-bezier(.2,1.7,.4,1)}
@keyframes ball-pop{0%{transform:scale(.2);opacity:.4}100%{transform:scale(1);opacity:1}}
#tank::after{content:'';position:absolute;left:16px;top:10px;width:26px;height:74%;border-radius:12px;
  background:rgba(255,255,255,.35);transform:rotate(4deg);pointer-events:none}
#tank-label{position:absolute;top:8px;right:12px;width:34px;height:34px;opacity:.9;pointer-events:none}

/* 「？」泡：判非目标时缸上方冒出（1.2s 消失，非错误零惩罚的可视反馈） */
#qm{position:absolute;z-index:30;width:64px;height:64px;border-radius:50%;background:#E8975A;
  border:3.5px solid #4A3B2E;color:#FFF9EE;font-size:36px;font-weight:800;line-height:1;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  animation:qm-pop 1.2s ease forwards}
@keyframes qm-pop{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}
  18%{transform:translate(-50%,-50%) scale(1.08);opacity:1}
  70%{transform:translate(-50%,-58%) scale(1);opacity:1}
  100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}

/* 颜料罐排：大按钮（≥84px 触摸目标）；吞输入=容器 bump 微动效（可见回应） */
#jars{display:flex;gap:16px;align-items:flex-end;flex:0 0 auto}
#jars.bump{animation:jars-bump .22s ease}
@keyframes jars-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.jar{width:88px;height:100px;padding:0;display:flex;align-items:center;justify-content:center;
  transition:transform .15s}
.jar:active{transform:translateY(3px)}
.jar svg{width:84px;height:94px;pointer-events:none}
.jar .glow{position:absolute;inset:-8px;border-radius:24px;background:rgba(232,151,90,.28);
  opacity:0;transition:opacity .3s;pointer-events:none}
.jar.hinted .glow{opacity:1;animation:jar-glow 1.2s ease-in-out infinite}
@keyframes jar-glow{0%,100%{opacity:.35}50%{opacity:.9}}

/* 飞行颜料滴（点罐 → 缸）：fixed 层，JS 定位起终点 */
.drop{position:fixed;z-index:60;width:26px;height:26px;border-radius:50%;pointer-events:none;
  border:3px solid #4A3B2E;transition:transform .32s cubic-bezier(.3,.7,.5,1),opacity .3s}

/* ---------- 配方反推卡（r21 §R4，dch4）：3 张并排，每卡=2-3 小罐（jarSvg 缩样）；
   触摸目标 ≥64（卡高 110）；首次反推次第 bounce 预告可点（不指示正确答案，承 r20 数字钮范式）；
   选错=wiggle 轻反馈（非错误零惩罚） ---------- */
.recipick{position:relative;width:158px;height:110px;background:#FFF9EE;border:3.5px solid #4A3B2E;
  border-radius:18px;box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;gap:4px;transition:transform .15s}
.recipick:active{transform:translateY(3px)}
.recipick .rjar{width:44px;height:50px;flex:0 0 auto}
.recipick .rjar svg{width:44px;height:50px;pointer-events:none}
.recipick.tease{animation:rec-tease .5s ease}
@keyframes rec-tease{0%,100%{transform:scale(1)}40%{transform:scale(1.07) translateY(-5px)}}
.recipick.wig{animation:rec-wig .3s ease}
@keyframes rec-wig{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，教学演示/帮共用；照 batch21） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：目标卡适度收紧；缸/罐同构缩放 */
@media (orientation:portrait){
  #target-card{width:112px;height:80px}
  #tank{width:272px;height:206px}
  #jars{gap:12px}
  .jar{width:82px;height:94px}
  .recipick{width:136px;height:100px}
  .recipick .rjar{width:38px;height:44px}
  .recipick .rjar svg{width:38px;height:44px}
}
</style>
</head>
<body>
<div id="game" aria-label="颜色魔法">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <div id="target-card" role="heading" aria-label="目标颜色">
        <span class="wand" id="wand" aria-hidden="true"></span>
      </div>
    </div>
    <div id="bench" aria-label="调色台">
      <div id="tank" aria-label="玻璃缸">
        <div id="liquid" aria-hidden="true"></div>
        <div id="pot-balls" aria-hidden="true"></div>
        <span id="tank-label" aria-hidden="true"></span>
      </div>
      <div id="jars" aria-label="颜料罐"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

/* ================= colormix 纯引擎：确定性关卡生成 + 玻璃缸 FIFO + 混色判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）。
   章型（SPEC-R21-COLORMIX §R2，r21 修订；进度章号单调递增、难度章号 (ch-1)%4+1 循环）：
   dch1 原色直击（目标=罐上色，单罐即成）/ dch2 恰 2 二级+3 浅原色（深浅两档判定，白罐进场）
   / dch3 恰 2 棕+3 浅二级（三步组合配方）/ dch4 配方反推（给缸中已混出的色选配方卡）
   玩法铁律（§0.51+r21 §R3/§R4）：点罐入缸（缸深 3，超深 FIFO 替换最早球）→ 缸变结果色 →
   自动判定；结果色==目标 celebrate；≠目标=1 试调（缸不清空继续试）——"缸内颜色集变化"才判：
   重复色入缸（集合未变）不判不罚。错试不记 miss 口径=试调次数（探索≠错误，不 sayW 重责）。
   反推题（dch4）：pot 恒空（缸液=目标色展示不泄配方），engPickRecipe 选卡混算==目标即成。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材 */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 混色：engMix(颜色数组) —— 去重集合查 MIX 表（无比例无减色），表外 → mud 浑浊 ---------- */
function mixKey(colors) {
  const u = [];
  for (let i = 0; i < colors.length; i++) if (u.indexOf(colors[i]) < 0) u.push(colors[i]);
  u.sort();
  return u.join('+');
}
const engMix = colors => MIX[mixKey(colors)] || 'mud';

/* ---------- 单题生成 ---------- */
function mkQuiz(target, jars) {
  return { target: target, jars: jars.slice(), pot: [], result: null,
           tries: 0, solved: false };
}

/* ---------- 反推题生成（§R4）：3 张配方卡=正确 + 深浅对 + 换一罐干扰（确定性 seeded）
   干扰两族：d1 深浅对（二级↔其浅版 / 浅X↔其深版；棕无浅版退化双换罐）；
   d2 换一罐（正确配方随机一位换成不在配方中的罐）。MIX 在可达域内是集合→结果的双射，
   集合异⇒结果异——结构性保证干扰混出≠目标（verify 侧独立复算断言兜底）。 ---------- */
function revDistractors(target, rec, rnd) {
  const lightOf = 'light' + target;
  let d1 = null;
  if (target.indexOf('light') === 0) d1 = RECIPE[target.slice(5)];
  else if (RECIPE[lightOf]) d1 = RECIPE[lightOf];
  const others = ['red', 'yellow', 'blue', 'white'].filter(c => rec.indexOf(c) < 0);
  const pos = ri(rnd, 0, rec.length - 1);
  const d2 = rec.slice();
  d2[pos] = others[ri(rnd, 0, others.length - 1)];
  if (!d1) {                                     /* 棕：无浅版（4 色集合缸深 3 不可表达）→ 双换罐 */
    const pos2 = (pos + 1) % rec.length;
    d1 = rec.slice();
    d1[pos2] = others[ri(rnd, 0, others.length - 1)];
  }
  return [d1, d2];
}
function mkRevQuiz(target, rnd) {
  const rec = RECIPE[target];
  const dd = revDistractors(target, rec, rnd);
  return { target: target, mode: 'reverse', jars: [],
           picks: shuffled([rec, dd[0], dd[1]], rnd),
           picked: -1, pot: [], result: target,     /* result=缸中展示色恒=目标（§R4） */
           tries: 0, solved: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   flat0 题0 恒 target='green'（§3 教学"演示调绿（黄+蓝）"=恰好演示完整一题；
   其余 4 题按 ch1 原色直击池——教完二级魔法回炉单罐因果，r21 不动）
   r21 章型（§R2）：dch2 恰 2 二级+3 浅原色（结构性无相邻同——两组内互异、跨组 id 必异）
   / dch3 恰 2 棕+3 浅二级（2 棕相邻重洗，guard 用尽交错兜底）
   / dch4 反推池采样+相邻重摇 ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const C = CHAPTERS[dch];
  const quizzes = [];

  if (dch === 1) {
    /* ch1 原色直击（r21 不动）：池内采样 + 相邻题目标不同（flat0 题0 特例=green） */
    let lastT = null;
    for (let qi = 0; qi < CH_LEN; qi++) {
      if (flat === 0 && qi === 0) {
        quizzes.push(mkQuiz('green', C.jars)); lastT = 'green'; continue;
      }
      let t = C.pool[ri(rnd, 0, C.pool.length - 1)];
      for (let t2 = 0; t2 < 8 && t === lastT; t2++) t = C.pool[ri(rnd, 0, C.pool.length - 1)];
      quizzes.push(mkQuiz(t, C.jars));
      lastT = t;
    }
  } else if (dch === 2) {
    /* ch2 深浅魔法（r21）：恰 2 二级 + 3 浅原色，洗牌（天然无相邻同目标） */
    const seq = shuffled(shuffled(['orange', 'green', 'purple'], rnd).slice(0, 2)
      .concat(['lightred', 'lightyellow', 'lightblue']), rnd);
    for (let i = 0; i < CH_LEN; i++) quizzes.push(mkQuiz(seq[i], C.jars));
  } else if (dch === 3) {
    /* ch3 三色秘密（r21）：恰 2 棕 + 3 浅二级，洗牌且相邻不同（2 棕相邻重洗，guard 用尽交错兜底） */
    let seq = null, guard = 0;
    while (!seq && guard++ < 24) {
      const s = shuffled(['brown', 'brown', 'lightorange', 'lightgreen', 'lightpurple'], rnd);
      let ok = true;
      for (let i = 1; i < s.length; i++) if (s[i] === s[i - 1]) ok = false;
      if (ok) seq = s;
    }
    if (!seq) seq = ['brown', 'lightorange', 'brown', 'lightgreen', 'lightpurple'];
    for (let i = 0; i < CH_LEN; i++) quizzes.push(mkQuiz(seq[i], C.jars));
  } else {
    /* ch4 配方大师（r21 反推）：反推池采样 + 相邻题目标不同 */
    let lastT = null;
    for (let qi = 0; qi < CH_LEN; qi++) {
      let t = REV_POOL[ri(rnd, 0, REV_POOL.length - 1)];
      for (let t2 = 0; t2 < 8 && t === lastT; t2++) t = REV_POOL[ri(rnd, 0, REV_POOL.length - 1)];
      quizzes.push(mkRevQuiz(t, rnd));
      lastT = t;
    }
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, done: false, missTotal: 0 };
}

/* ---------- 点罐引擎（无 DOM）：engTapJar(L, color) —— 点一罐颜料入玻璃缸
   入缸 FIFO（缸深 3，超深替换最早球）→ 结果色重算 →
   'same'   集合未变（重复色）：不判不罚，球照入缸（探索观察）
   'wrong'  一次"调出"判非目标 = 1 试调（缸不清空继续试）
   'right'  结果色==目标：本题成（还有后续题）
   'done'   末题调对 = 通关
   null     非法色（不在本题颜料罐）/ 关卡已结束 ---------- */
function engTapJar(L, color) {
  if (!L || L.done) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved) return null;
  if (q.mode === 'reverse') return null;            // r21 §R4：反推题无点罐通道（UI 守卫吞输入）
  if (q.jars.indexOf(color) < 0) return null;
  if (L.dch === 1 && q.jars.indexOf(q.target) >= 0 && q.pot.length && q.pot[q.pot.length - 1] !== color) q.pot = [];  // 试玩P2a：ch1 直击题换色点=清缸重判（缸残留致「点对了被说错」；混合题如 flat0 题0 green 保 FIFO）
  q.pot.push(color);
  if (q.pot.length > POT_DEPTH) q.pot.shift();      // FIFO：缸满 3 球后替换最早球
  const prev = q.result;
  q.result = engMix(q.pot);
  if (q.result === prev) return 'same';             // 颜色集未变：不算一次"调出"
  if (q.result === q.target) {                      // 自动判定：==目标 celebrate
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q.tries++;                                        // ≠目标 = 1 试调（探索≠错误）
  L.missTotal++;
  return 'wrong';
}
const engWon = L => !!L && L.done;

/* ---------- 选配方引擎（无 DOM，r21 §R4）：engPickRecipe(L, i) —— 反推题点一张配方卡
   卡罐组混算（去重集合语义同缸）==目标 → 本题成；
   'same'   重复点同卡：不判不罚（承 same 探索语义）
   'wrong'  卡混出≠目标 = 1 试调（不换题可重选——探索≠错）
   'right'  ==目标（还有后续题）/ 'done' 末题 / null 非反推态或非法索引 ---------- */
function engPickRecipe(L, i) {
  if (!L || L.done) return null;
  const q = L.quizzes[L.step];
  if (!q || q.solved || q.mode !== 'reverse') return null;
  if (i == null || i < 0 || i >= q.picks.length) return null;
  if (i === q.picked) return 'same';
  q.picked = i;
  if (engMix(q.picks[i]) === q.target) {
    q.solved = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q.tries++;                                        // ≠目标 = 1 试调（可重选，不阻塞）
  L.missTotal++;
  return 'wrong';
}

/* ---------- 星级（SPEC §3 定版 + r21 §R4）：dch1 单罐直击恒 3★；
   其余 = 全关试调总数 missTotal 对最优基线 par（原色 0 / 二级·浅原色 1 / 棕·浅二级 2 /
   反推题 1=容一次探索性错选）：
   ≤par → 3★（每题都最优）；≤par+CH_LEN → 2★（平均多 1 次）；否则 1★。永不 0 星
   （反推 par 收官定夺 0→1：审查 m1+试玩 P2-1 双证据——par=0 下 6 岁人设 2/5 题首错，
   2★ 常态化 3★ 稀缺，与 ch1 豁免先例/ch2 par=1 同级精神一致；认知难度本体在反推维度
   不在星级卡死） ---------- */
const quizPar = t => PAR[t] != null ? PAR[t] : 1;
const engPar = L => L.quizzes.reduce((s, q) => s + (q.mode === 'reverse' ? 1 : quizPar(q.target)), 0);
const engStars = L => {
  if (!L) return 1;
  if (L.dch === 1) return 3;
  const m = L.missTotal || 0, par = engPar(L);
  return m <= par ? 3 : (m <= par + CH_LEN ? 2 : 1);
};

/* ---------- 结构校验（verify 用，返回失败原因或 null；r21 §R2/§R4 域）：
   目标在池 / jars 匹配章 / 相邻不同 / ch2 恰 2 二级+3 浅原色 / ch3 恰 2 棕+3 浅二级 /
   ch4 反推结构（picks 恰 3+正确恰 1+干扰 mix≠目标）/ flat0 题0 恒 green /
   初始 pot/result/tries 自洽 ---------- */
function structWhy(q, dch, flat, qi, prevT) {
  const C = CHAPTERS[dch];
  if (!q || !COLORS[q.target]) return 'target';
  if (q.target === 'mud' || q.target === 'white') return 'targetPool';   // 浑浊/白不做目标
  const isFlat0Q0 = flat === 0 && qi === 0;              // 教学演示题（调绿）豁免池检查
  if (isFlat0Q0) return q.target === 'green' ? null : 'flat0q0';
  if (dch === 4) {
    /* r21 反推题结构：域（池=非平凡配方）/ picks 恰 3 / 正确恰 1 / 干扰混出≠目标 */
    if (REV_POOL.indexOf(q.target) < 0) return 'revPool';
    if (q.mode !== 'reverse' || !Array.isArray(q.picks) || q.picks.length !== 3) return 'revPicks';
    let nOk = 0;
    for (let i = 0; i < q.picks.length; i++) {
      const p = q.picks[i];
      if (!Array.isArray(p) || !p.length || p.length > POT_DEPTH) return 'revPick';
      for (let k = 0; k < p.length; k++) if (['red', 'yellow', 'blue', 'white'].indexOf(p[k]) < 0) return 'revPick';
      const got = engMix(p);
      if (!COLORS[got]) return 'revPick';
      if (got === q.target) nOk++;
    }
    if (nOk !== 1) return 'revOk:' + nOk;                // 正确卡恰 1（干扰族结构性≠目标）
    if (q.pot.length !== 0 || q.result !== q.target || q.tries !== 0 || q.solved) return 'init';
    if (prevT != null && q.target === prevT) return 'adj';
    return null;
  }
  if (C.pool.indexOf(q.target) < 0) return 'pool:' + dch;
  if (q.jars.length !== C.jars.length) return 'jarsLen';
  for (let i = 0; i < q.jars.length; i++) if (q.jars[i] !== C.jars[i]) return 'jars';
  if (prevT != null && q.target === prevT) return 'adj';
  if (q.pot.length !== 0 || q.result !== null || q.tries !== 0 || q.solved) return 'init';
  return null;
}
/* ================= colormix 主逻辑（目标卡 / 玻璃缸与颜料罐渲染 / 入缸判定 / 教学 / 推进）
   玩法：题面语音「调出橙色吧」+目标色大卡 → 点颜料罐入玻璃缸（飞行色滴+入缸动画+颜料名 TTS）
   → 缸变结果色（液体漫开）→ 自动判定（==目标 celebrate 推进；≠目标=「？」泡+col_wrong，
   缸不清空继续点罐叠加观察——探索非错误，不重责）。缸深 3 FIFO 可视。
   r21（SPEC-R21-COLORMIX §R4）：dch4 反推题=缸液目标色+3 张配方卡（点卡作答，
   混算==目标推进；选错=wiggle+可重选不换题；首次反推卡次第 bounce 预告可点）。
   验收钩子：window.CM = { get currentLevel, get quiz, tapJar(color), pickRecipe(i), start(flat), async autoSolve(), get tutorial } */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速（wait 全按 SPEED 缩放）
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
const replayAnim = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/开场任务语音/读题不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };

const jarsEl = $id('jars'), tankEl = $id('tank'),
      liquidEl = $id('liquid'), ballsEl = $id('pot-balls'),
      targetCard = $id('target-card'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear'),
      ghostEl = $id('ghost'), benchEl = $id('bench');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, busy: false, won: false, demo: false, tut: 'none', revTeased: false };
let lastAct = Date.now();
let helpRedemo = false;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  $id('wand').innerHTML = ICONS.wand;
  $id('tank-label').innerHTML = ICONS.wand;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 72);
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：入缸=清脆双音 / 非目标「？」=低柔下滑 / 调对=轻铃上扬 */
const plopSfx = () => { if (!VERIFY) { KIDS.audio.note(880, 0.1, 0, 0.5); KIDS.audio.note(1175, 0.12, 0.05, 0.38); } };
const wooSfx = () => { if (!VERIFY) { KIDS.audio.note(233, 0.2, 0, 0.4); KIDS.audio.note(175, 0.24, 0.1, 0.35); } };
const chimeFull = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.24, 0, 0.5); KIDS.audio.note(783.99, 0.3, 0.09, 0.5); } };

/* ================= 题面语音（mode-aware，r21 §R4）：正推=目标色题面 clip（T46）；
   反推=col_rev_q（新键，注册前 KIDS.voice.play(key,text) 文本自愈） ================= */
const qKey = q => q.mode === 'reverse' ? 'col_rev_q' : quizKey(q.target);
const qSpeech = q => q.mode === 'reverse' ? '这个颜色是怎么调出来的呀' : quizSpeech(q.target);

/* ================= 渲染 ================= */
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  targetCard.style.background = COLORS[q.target].hex;         // 目标色大卡
  targetCard.setAttribute('aria-label', '目标颜色：' + COLORS[q.target].name);
  renderPot();
  renderJars();
  renderStep();
  if (!VERIFY && !state.demo) KIDS.voice.play(qKey(q), qSpeech(q));   // 读题：正推题面 clip / 反推 col_rev_q
}
function renderPot() {                                        // 缸内球（contents 序）+液体结果色
  const q = cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)];
  ballsEl.innerHTML = '';
  if (!q) return;
  for (let i = 0; i < q.pot.length; i++) {                    // 反推题 pot 恒空（缸液=目标色展示，不泄配方）
    const b = document.createElement('span');
    b.className = 'pball';
    b.style.background = COLORS[q.pot[i]].hex;
    ballsEl.appendChild(b);
  }
  liquidEl.style.background = q.result ? COLORS[q.result].hex : '#E4F1F6';
}
function renderJars() {                                       // 颜料罐排（正推）/ 配方卡排（反推，r21）
  const q = cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)];
  jarsEl.innerHTML = '';
  if (!q) return;
  if (q.mode === 'reverse') {
    for (let i = 0; i < q.picks.length; i++) {
      const b = document.createElement('button');
      b.className = 'recipick';
      b.dataset.i = i;
      b.setAttribute('aria-label', '配方' + (i + 1) + '：' + q.picks[i].map(c => COLORS[c].name).join('加'));
      b.innerHTML = q.picks[i].map(c => '<span class="rjar">' + jarSvg(c) + '</span>').join('');
      jarsEl.appendChild(b);
    }
    maybeRevIntro();                                          // 首次反推：卡次第 bounce 预告（§R4）
    return;
  }
  for (let i = 0; i < q.jars.length; i++) {
    const c = q.jars[i];
    const b = document.createElement('button');
    b.className = 'jar';
    b.dataset.color = c;
    b.setAttribute('aria-label', COLORS[c].name + '颜料');
    b.innerHTML = '<span class="glow" aria-hidden="true"></span>' + jarSvg(c);
    jarsEl.appendChild(b);
  }
}
/* 首次反推视觉预告（每存档一次 sv.colormix.revSeen，§R4）：3 卡次第 bounce 一遍
   （预告可点，不指示正确答案——承 r20 数字钮次第高亮范式）；verify 页 stub 档下由
   state.revTeased 拦同关重复（stub _save 每次新对象，revSeen 不可依赖） */
function maybeRevIntro() {
  if (state.revTeased) return;
  const sv = KIDS._save() || { levels: {} };
  if (sv.colormix && sv.colormix.revSeen) return;
  state.revTeased = true;
  if (!VERIFY) {
    sv.colormix = sv.colormix || {};
    sv.colormix.revSeen = true;
    KIDS.store.persist();
  }
  const cards = jarsEl.querySelectorAll('.recipick');
  for (let i = 0; i < cards.length; i++) {
    setTimeout(() => { replayAnim(cards[i], 'tease'); if (!VERIFY) sfx('pop'); }, 150 + i * 150);
  }
}
const jarBtnOf = c => jarsEl.querySelector('.jar[data-color="' + c + '"]');
const recBtnOf = i => jarsEl.querySelector('.recipick[data-i="' + i + '"]');
function renderStep() {                                       // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                                       // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}

/* ---------- 飞行颜料滴：罐心 → 缸心（fixed 层，320ms transition 后移除） ---------- */
function flyDrop(color, btn) {
  if (VERIFY) return;
  const r1 = btn.getBoundingClientRect(), r2 = tankEl.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'drop';
  d.style.background = COLORS[color].hex;
  d.style.left = Math.round(r1.left + r1.width / 2 - 13) + 'px';
  d.style.top = Math.round(r1.top + r1.height / 2 - 13) + 'px';
  document.body.appendChild(d);
  requestAnimationFrame(() => {
    d.style.transform = 'translate(' + Math.round(r2.left + r2.width / 2 - r1.left - r1.width / 2) + 'px,' +
      Math.round(r2.top + r2.height * 0.7 - r1.top - r1.height / 2) + 'px)';
    d.style.opacity = '.25';
  });
  setTimeout(() => d.remove(), 360);
}
/* 「？」泡：缸上方冒出（判非目标可视反馈，1.2s 消失；缸不清空） */
function qmBubble() {
  if (VERIFY) return;
  const old = benchEl.querySelector('#qm');
  if (old) old.remove();
  const d = document.createElement('div');
  d.id = 'qm';
  d.textContent = '？';
  d.style.left = (tankEl.offsetLeft + tankEl.offsetWidth / 2) + 'px';
  d.style.top = (tankEl.offsetTop - 6) + 'px';
  benchEl.appendChild(d);
  setTimeout(() => { if (d.parentNode) d.remove(); }, 1250);
}

/* ================= 幽灵手指（教学"看/帮"共用；指向固定布局的罐按钮，定位一次） ================= */
const ghost = {
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAtEl(btn) {
  if (VERIFY || !btn) return;
  const r = btn.getBoundingClientRect();
  ghostEl.style.left = Math.round(r.left + r.width / 2) + 'px';
  ghostEl.style.top = Math.round(r.top + r.height * 0.42) + 'px';
  ghost.show();
  setTimeout(() => ghost.press(), 800 * SPEED);
}
function pointHelpNext() {                      // 教学"帮"：指向当前题配方第一罐（方向级提示）
  if (!cur) return;
  const q = cur.quizzes[cur.step];
  if (!q) return;
  const rec = RECIPE[q.target];
  if (rec && rec.length) pointGhostAtEl(jarBtnOf(rec[0]));
}

/* ================= 点罐主路径（真实点击 / CM.tapJar / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（罐排容器 bump 微动效——b21 feed 定版）；
   防重入双锁（同步置位→紧邻点罐必被拦，§0.47）：
   busy=点罐占位锁（色滴飞行 240ms 窗，wrong 即释——探索连续可点）；
   locked=调对演出锁（650ms 漫开欣赏窗；演示期不动外层 locked） ================= */
async function uiTapJar(color, demo) {
  if (!cur || state.won) return false;
  if ((state.busy && !demo) || (state.locked && !demo) || (state.demo && !demo)) {   // 吞输入轻叮+bump
    sfx('pop');
    replayAnim(jarsEl, 'bump');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  if (q.jars.indexOf(color) < 0) { sfx('pop'); replayAnim(jarsEl, 'bump'); return false; }   // 非法罐
  const run = cur;                               /* 身份守卫：演出窗内重开会重建 cur——防旧续体错推进 */
  const btn = jarBtnOf(color);
  flyDrop(color, btn);
  state.busy = true;                             // 占位锁同步置位：飞行窗内紧邻点罐=拒绝
  await wait(240 * SPEED);                       // 色滴飞行入缸的观感节拍（verify 提速）
  if (cur !== run) { state.busy = false; return false; }
  const r = engTapJar(cur, color);
  if (r === null) { state.busy = false; sfx('pop'); replayAnim(jarsEl, 'bump'); return false; }
  plopSfx();
  lastAct = Date.now();                          // 有效操作重置救援钟（§0.7a）
  if (state.tut === 'help') {                    // 教学"独"：首次点罐 → 放手
    state.tut = 'solo';
    ghost.hide();
    hopRabbit();
  }
  KIDS.voice.play(paintKey(color), COLORS[color].name);   // 颜料名 clip（T46 阶段2；缺 clip 文本自愈）
  renderPot();                                   // 球入缸+结果色漫开（same 也入缸可视）

  if (r === 'same') { state.busy = false; return 'same'; }        // 集合未变：不判不罚（观察）
  if (r === 'wrong') {                           // 一次"调出"判非目标=1 试调：？泡+col_wrong（缸不清空）
    state.busy = false;                          // 探索连续可点（不设错误防重入窗，§0.51 探索≠错误）
    wooSfx();
    qmBubble();
    setTimeout(() => { if (cur === run && !state.won && !demo) KIDS.voice.play(VOICE.wrong.key, VOICE.wrong.text); },  // 试玩P2b：教学演示不出「不一样」
      VERIFY ? 0 : 500);                         // 色词先说半秒再让位反馈句
    return 'wrong';
  }
  /* right / done：调对——650ms 漫开欣赏窗 */
  if (!demo) state.locked = true;                // 演出锁仅非演示（教学期 locked 由外层持有）
  chimeFull();
  await wait(650 * SPEED);
  state.busy = false;
  if (cur !== run) { if (!demo) state.locked = false; return r; }
  if (!demo) state.locked = false;
  if (r === 'done') { winFlow(); return 'done'; }
  renderQuiz();                                  // 新题（缸已随题切换清空）+读题
  if (state.tut === 'help') pointHelpNext();
  return r;
}

/* ================= 点配方卡主路径（r21 §R4 反推题：真实点击 / CM.pickRecipe / autoSolve 共用）
   吞输入轻叮必配可见回应（罐排容器 bump）；busy/locked 双锁语义同点罐；
   选错=卡 wiggle+col_wrong 不换题可重选（探索≠错）；重复点同卡='same' 不判不罚 ---------- */
async function uiPickRecipe(i) {
  if (!cur || state.won) return false;
  if (state.busy || state.locked || state.demo) {
    sfx('pop');
    replayAnim(jarsEl, 'bump');
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q || q.mode !== 'reverse') return false;
  const run = cur;                               /* 身份守卫：演出窗内重开会重建 cur */
  state.busy = true;                             // 占位锁同步置位：窗内紧邻点卡=拒绝
  await wait(240 * SPEED);                       // 选卡节拍（与点罐观感一致，verify 提速）
  if (cur !== run) { state.busy = false; return false; }
  const r = engPickRecipe(cur, i);
  if (r === null) { state.busy = false; sfx('pop'); replayAnim(jarsEl, 'bump'); return false; }
  lastAct = Date.now();                          // 有效操作重置救援钟（§0.7a）
  if (r === 'same') { state.busy = false; return 'same'; }        // 重复选同卡：不判不罚
  if (r === 'wrong') {                           // 选错=1 试调：卡 wiggle+col_wrong（不换题可重选）
    state.busy = false;
    wooSfx();
    replayAnim(recBtnOf(i), 'wig');
    setTimeout(() => { if (cur === run && !state.won) KIDS.voice.play(VOICE.wrong.key, VOICE.wrong.text); },
      VERIFY ? 0 : 500);
    return 'wrong';
  }
  /* right / done：选对——650ms 欣赏窗 */
  state.locked = true;
  chimeFull();
  await wait(650 * SPEED);
  state.busy = false;
  if (cur !== run) { state.locked = false; return r; }
  state.locked = false;
  if (r === 'done') { winFlow(); return 'done'; }
  renderQuiz();                                  // 新题+读题（含反推→正推切章不发生：dch 关内同型）
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  sayR(VOICE.right.key, VOICE.right.text);       /* col_right：调对啦，颜色真漂亮 */
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, busy: false, won: false, demo: false, tut: 'none', revTeased: false };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  if (VERIFY) return;
  const sv = KIDS._save();
  const freshTut = flat === 0 && !sv.levels['1-0'] && !(sv.colormix && sv.colormix.tutSeen);
  if (freshTut) { tutorialWatch(); return; }
}

/* ================= 教学（仅关 1-0 首次）：看→帮→独
   看=幽灵手指演示调绿（黄+蓝→变绿=恰好完成 flat0 题0）→「变绿啦」；
   帮=指向配方第一罐（黄罐）；独=首次点罐放手（watch 全程 ≤16s） ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);
  await wait(700 * SPEED);
  const q = cur.quizzes[0];                      // flat0 题0 恒 target='green'
  const rec = RECIPE[q.target];                  // ['yellow','blue']
  let demoR = null;
  for (let k = 0; k < rec.length; k++) {
    pointGhostAtEl(jarBtnOf(rec[k]));
    await wait(850 * SPEED);
    ghost.press();
    await wait(300 * SPEED);
    demoR = await uiTapJar(rec[k], true);        /* demo 通道豁免 locked 门（演示吞输入） */
    await wait(520 * SPEED);
  }
  KIDS.voice.play(VOICE.green.key, VOICE.green.text);   /* 演示收束语（T46 阶段2 clip 化） */
  window.__cmDemoR = demoR;                      /* 演示生效证据（§0.27，gate 断言 'right'） */
  await wait(500 * SPEED);
  const sv = KIDS._save();
  sv.colormix = sv.colormix || {};
  sv.colormix.tutSeen = true;
  KIDS.store.persist();
  /* 立即重发同关（确定性关卡，题面一致），"你来调一调"在重发后的题面上说 */
  ghost.hide();
  cur = genLevel(0);
  state = { locked: false, busy: false, won: false, demo: false, tut: 'help', revTeased: false };
  helpRedemo = false;
  lastAct = Date.now();
  renderQuiz(); renderDots();
  sayR(VOICE.turn.key, VOICE.turn.text);
  setTimeout(() => { if (state.tut === 'help') pointHelpNext(); }, 600);
}

/* ================= 底栏交互 ================= */
function hopRabbit() {
  rabbitBtn.classList.remove('hop'); void rabbitBtn.offsetWidth; rabbitBtn.classList.add('hop');
}
rabbitBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur || state.locked || state.demo) return;   /* 教学/演出期点兔子不打断 */
  lastAct = Date.now();
  hopRabbit();
  const q = cur.quizzes[cur.step];
  if (q && !state.won) KIDS.voice.play(qKey(q), qSpeech(q));  /* 戳兔子重读题面（正推色名/反推 col_rev_q） */
  else sayP(VOICE.hint.key, VOICE.hint.text);
});
replayBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur || state.locked || state.demo || state.won) return;   /* 演出/通关期重玩门 */
  lastAct = Date.now();
  startLevel(cur.flat);
});
hearBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur || state.locked) return;
  lastAct = Date.now();
  hearBtn.classList.remove('bounce'); void hearBtn.offsetWidth; hearBtn.classList.add('bounce');
  const q = cur.quizzes[cur.step];
  if (q) KIDS.voice.play(qKey(q), qSpeech(q));   /* 再听一遍：重读题面（正推/反推 mode-aware） */
});
jarsEl.addEventListener('pointerdown', e => {
  const rec = e.target.closest('.recipick');
  if (rec) {                                     /* r21 反推题：点配方卡作答 */
    e.preventDefault();
    uiPickRecipe(+rec.dataset.i);
    return;
  }
  const el = e.target.closest('.jar');
  if (!el) return;
  e.preventDefault();
  uiTapJar(el.dataset.color);
});

/* ================= 无操作看护：14s 救援（重读题面+目标卡脉冲）/ 教学"帮"5s 重演示一次 ================= */
setInterval(() => {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  const idle = Date.now() - lastAct;
  if (idle > 14000) {
    const q = cur.quizzes[cur.step];             /* 救援：重读题面（不受 flat 门，§0.5） */
    if (q) sayR(qKey(q), qSpeech(q));            /* 正推题面 clip / 反推 col_rev_q（mode-aware） */
    replayAnim(targetCard, 'rescue');
    lastAct = Date.now();
    return;
  }
  if (idle > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {
    helpRedemo = true;
    pointHelpNext();
  }
}, 1000);

/* ================= 启动（verify 分支由 game-verify.js 接管） ================= */
buildStatic();
if (!VERIFY) {
  KIDS.init({ game: 'colormix', title: '颜色魔法' });
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  let first = 0;
  for (let i = 0; i < lim; i++) { if (!sv.levels[keys[i]]) { first = i; break; } }
  if (lim > 0 && KIDS.calendar.dayDone(keys)) {  // 今日新关已玩完：收尾画面（可关闭继续重玩）
