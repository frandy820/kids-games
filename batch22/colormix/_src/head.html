<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>颜色魔法</title>
<style>
/* ================= 颜色魔法 colormix（batch22）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色；
   触摸目标：颜料罐按钮 ≥84px、底栏按钮 ≥72（均 ≥64）；
   浅色色块（黄/白/浅色系）靠 INK 暖棕深描边保证对比度（≥3:1 口径=描边色对底色）；
   5-6 岁零文字依赖：目标=大色块+语音承载色名；「？」泡=非目标反馈（非文字题面） */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#F2C9A0;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：目标卡 → 玻璃缸 → 颜料罐排（纵列布局，横竖屏同构） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;overflow:hidden;padding:6px 10px}

/* 目标色大卡：色块由 JS 设背景；wasm 小图标点角；零文字标签（色名走语音与 aria） */
#prompt{flex:0 0 auto;display:flex;align-items:center;gap:12px}
#target-card{position:relative;width:128px;height:88px;border-radius:20px;background:#E4D9C6;
  border:3.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;transition:background .4s}
#target-card .wand{position:absolute;right:-14px;top:-16px;width:40px;height:40px;
  filter:drop-shadow(0 2px 0 rgba(74,59,46,.25))}
#target-card.rescue{animation:tg-rescue 1.1s ease-in-out 3}
@keyframes tg-rescue{0%,100%{box-shadow:0 5px 0 #D8C9B4}50%{box-shadow:0 5px 0 #D8C9B4,0 0 0 10px rgba(232,151,90,.4)}}

/* 玻璃缸：CSS 容器=玻璃壁；液体=底部色带（result 色漫开 transition）；球排=缸内 contents 可视 */
#bench{position:relative;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;gap:26px}
#tank{position:relative;width:300px;height:224px;border:4px solid #9FC2D2;border-radius:14px 14px 22px 22px;
  background:linear-gradient(180deg,rgba(236,246,250,.55),rgba(216,235,243,.8));overflow:hidden;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 4px 0 #CFDDE5}
#liquid{position:absolute;left:0;right:0;bottom:0;height:46%;background:#E4F1F6;
  transition:background .5s ease}
#liquid.spread{animation:lq-spread .5s ease}
@keyframes lq-spread{0%{filter:brightness(1.25)}100%{filter:brightness(1)}}
#pot-balls{position:absolute;left:10px;right:10px;bottom:12px;display:flex;gap:9px;justify-content:center;align-items:flex-end}
.pball{width:34px;height:34px;border-radius:50%;border:3px solid #4A3B2E;flex:0 0 auto;
  animation:ball-pop .3s cubic-bezier(.2,1.7,.4,1)}
@keyframes ball-pop{0%{transform:scale(.2);opacity:.4}100%{transform:scale(1);opacity:1}}
#tank::after{content:'';position:absolute;left:16px;top:10px;width:26px;height:74%;border-radius:12px;
  background:rgba(255,255,255,.35);transform:rotate(4deg);pointer-events:none}
#tank-label{position:absolute;top:8px;right:12px;width:34px;height:34px;opacity:.9;pointer-events:none}

/* 「？」泡：判非目标时缸上方冒出（1.2s 消失，非错误零惩罚的可视反馈） */
#qm{position:absolute;z-index:30;width:64px;height:64px;border-radius:50%;background:#E8975A;
  border:3.5px solid #4A3B2E;color:#FFF9EE;font-size:36px;font-weight:800;line-height:1;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  animation:qm-pop 1.2s ease forwards}
@keyframes qm-pop{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}
  18%{transform:translate(-50%,-50%) scale(1.08);opacity:1}
  70%{transform:translate(-50%,-58%) scale(1);opacity:1}
  100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}

/* 颜料罐排：大按钮（≥84px 触摸目标）；吞输入=容器 bump 微动效（可见回应） */
#jars{display:flex;gap:16px;align-items:flex-end;flex:0 0 auto}
#jars.bump{animation:jars-bump .22s ease}
@keyframes jars-bump{0%,100%{transform:scale(1)}45%{transform:scale(.96)}}
.jar{width:88px;height:100px;padding:0;display:flex;align-items:center;justify-content:center;
  transition:transform .15s}
.jar:active{transform:translateY(3px)}
.jar svg{width:84px;height:94px;pointer-events:none}
.jar .glow{position:absolute;inset:-8px;border-radius:24px;background:rgba(232,151,90,.28);
  opacity:0;transition:opacity .3s;pointer-events:none}
.jar.hinted .glow{opacity:1;animation:jar-glow 1.2s ease-in-out infinite}
@keyframes jar-glow{0%,100%{opacity:.35}50%{opacity:.9}}

/* 飞行颜料滴（点罐 → 缸）：fixed 层，JS 定位起终点 */
.drop{position:fixed;z-index:60;width:26px;height:26px;border-radius:50%;pointer-events:none;
  border:3px solid #4A3B2E;transition:transform .32s cubic-bezier(.3,.7,.5,1),opacity .3s}

/* ---------- 配方反推卡（r21 §R4，dch4）：3 张并排，每卡=2-3 小罐（jarSvg 缩样）；
   触摸目标 ≥64（卡高 110）；首次反推次第 bounce 预告可点（不指示正确答案，承 r20 数字钮范式）；
   选错=wiggle 轻反馈（非错误零惩罚） ---------- */
.recipick{position:relative;width:158px;height:110px;background:#FFF9EE;border:3.5px solid #4A3B2E;
  border-radius:18px;box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;gap:4px;transition:transform .15s}
.recipick:active{transform:translateY(3px)}
.recipick .rjar{width:44px;height:50px;flex:0 0 auto}
.recipick .rjar svg{width:44px;height:50px;pointer-events:none}
.recipick.tease{animation:rec-tease .5s ease}
@keyframes rec-tease{0%,100%{transform:scale(1)}40%{transform:scale(1.07) translateY(-5px)}}
.recipick.wig{animation:rec-wig .3s ease}
@keyframes rec-wig{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，教学演示/帮共用；照 batch21） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：目标卡适度收紧；缸/罐同构缩放 */
@media (orientation:portrait){
  #target-card{width:112px;height:80px}
  #tank{width:272px;height:206px}
  #jars{gap:12px}
  .jar{width:82px;height:94px}
  .recipick{width:136px;height:100px}
  .recipick .rjar{width:38px;height:44px}
  .recipick .rjar svg{width:38px;height:44px}
}
</style>
</head>
<body>
<div id="game" aria-label="颜色魔法">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <div id="target-card" role="heading" aria-label="目标颜色">
        <span class="wand" id="wand" aria-hidden="true"></span>
      </div>
    </div>
    <div id="bench" aria-label="调色台">
      <div id="tank" aria-label="玻璃缸">
        <div id="liquid" aria-hidden="true"></div>
        <div id="pot-balls" aria-hidden="true"></div>
        <span id="tank-label" aria-hidden="true"></span>
      </div>
      <div id="jars" aria-label="颜料罐"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
