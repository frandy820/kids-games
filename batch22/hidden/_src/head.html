<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隐藏朋友</title>
<style>
/* ================= 隐藏朋友 hidden（batch22）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、场景浅色场、暖橙主色；
   触摸目标：热区按钮直径=2×HIT_R 场景单位（恒 ≥64px，fitField 锁 1000:620 无 letterbox），
   底栏按钮 ≥72；布局量测一律 offsetWidth/offsetHeight（禁 getBoundingClientRect 断言）；
   5-6 岁零文字依赖：题面=动物图标+点数（语音承载全部语义），点数进度点随找到点亮 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#A8CF8E;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面计数条 + 场景 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 10px}
/* 计数条：每种目标一枚 chip（动物图标+进度点）——图标与语音题面同源，零文字 */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0 8px}
#counter{display:flex;align-items:center;gap:18px;padding:6px 26px;border-radius:26px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;min-height:76px}
.chip{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:18px;background:#F6EEDD}
.chip.hit{animation:chip-hit .4s cubic-bezier(.2,1.7,.4,1)}
@keyframes chip-hit{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.chip .cicon{width:56px;height:48px;display:block}
.chip .cicon svg{width:100%;height:100%}
.chip .cdots{display:flex;flex-direction:column;gap:6px;max-width:36px;flex-wrap:wrap;max-height:48px}
.chip .cdots i{width:15px;height:15px;border-radius:50%;background:#E5D5BC;border:2px solid #D8C9B4;
  transition:all .25s}
.chip .cdots i.on{background:#8FBF7F;border-color:#6FA968;transform:scale(1.1)}
/* r20 计数作答：countAsk 题答案不外显——「？」徽标替代总数进度点（SPEC-R20 §R3） */
.chip .cq{width:34px;height:34px;border-radius:50%;background:#F2DDA0;border:2.5px dashed #C9A24E;
  color:#8A6A2E;font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center}
#counter.rescue .chip{animation:rescue-pulse 1.1s ease-in-out 3}
/* m3 修复：ask 态 chips 已 display:none（#counter.ask #chips），脉冲打在数字条上保可见 */
#counter.ask.rescue #ansbar{animation:rescue-pulse 1.1s ease-in-out 3}
@keyframes rescue-pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,151,90,0)}50%{box-shadow:0 0 0 9px rgba(232,151,90,.4)}}

/* ---------- r20 计数作答条（#counter.ask 翻转：chips 隐藏 / 数字钮显示，恒 5 钮 {2..6}） ---------- */
#ansbar{display:none;gap:12px;align-items:center}
#counter.ask #chips{display:none}
#counter.ask #ansbar{display:flex}
.anum{min-width:68px;min-height:68px;padding:4px 8px;border-radius:18px;background:#F6EEDD;
  border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;transition:transform .15s}
.anum:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
.anum .an-v{font-size:30px;font-weight:800;color:#4A3B2E;line-height:1}
.anum .an-p{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:64px}
.anum .an-p i{width:8px;height:8px;border-radius:50%;background:#E8975A}
.anum.peek{animation:anum-peek .42s ease}
@keyframes anum-peek{0%,100%{transform:scale(1)}45%{transform:scale(1.14);background:#F2DDA0}}

/* ---------- r20 型4 闪现（SPEC-R20 §R4）：遮挡物半透明显形 + 场角睁眼图标 ---------- */
#field.flashing #svgbox .occ{opacity:.16;transition-duration:.15s}
#eye{position:absolute;right:10px;top:10px;z-index:7;width:54px;height:44px;display:none;
  pointer-events:none;filter:drop-shadow(0 2px 0 rgba(74,59,46,.25))}
#field.flashing #eye{display:block;animation:eye-blink 1.2s ease-in-out infinite}
@keyframes eye-blink{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* 场景场（fitField 锁 1000:620，svg/热区/特效三层同轴） */
#fieldwrap{flex:1 1 auto;min-height:180px;width:100%;display:flex;align-items:center;justify-content:center}
#field{position:relative;width:100%;max-width:1180px;overflow:hidden;
  border:3px solid #B9C7A8;border-radius:26px;
  box-shadow:inset 0 0 0 6px rgba(255,249,238,.5), 0 5px 0 #D8C9B4}
#field.bump{animation:f-bump .3s ease}              /* 吞输入可见回应（b21 沉淀③） */
@keyframes f-bump{0%,100%{transform:scale(1)}40%{transform:scale(1.015)}}
#svgbox,#spots,#fx{position:absolute;inset:0}
#svgbox svg{width:100%;height:100%}
#spots{z-index:4}
#fx{z-index:6;pointer-events:none}

/* ---------- 场景内 SVG 动画（找到=遮挡物淡出+动物跳出；救援=遮挡物沙沙） ---------- */
#svgbox .tg .occ{transition:opacity .45s ease}
#svgbox .tg.found .occ{opacity:0}
#svgbox .an{transform-box:fill-box;transform-origin:50% 92%}
#svgbox .tg.found .an{animation:pop-out .75s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop-out{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-9%) scale(1.16)}
  65%{transform:translateY(-4%) scale(1.08)}100%{transform:translateY(0) scale(1)}}
#svgbox .occ.rustle{transform-box:fill-box;transform-origin:50% 90%;
  animation:occ-rustle .9s ease-in-out 2}
@keyframes occ-rustle{0%,100%{transform:rotate(0)}30%{transform:rotate(-2.4deg)}
  60%{transform:rotate(2.2deg)}}
/* r20：已找到动物次第小跳（计数作答支架/答错重数提示） */
#svgbox .tg.found .an.reb{animation:an-reb .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes an-reb{0%,100%{transform:translateY(0)}40%{transform:translateY(-10%) scale(1.07)}}

/* ---------- 目标热区（透明按钮，直径 2×HIT_R 场景单位 ≈ 恒 ≥64px）
   居中用 transform（%margin 纵轴按宽解析会错位，禁用） ---------- */
.spot{position:absolute;width:15.6%;height:25.16%;transform:translate(-50%,-50%);padding:0;
  border-radius:50%;background:rgba(255,255,255,0);z-index:5}
.spot:active{background:rgba(255,255,255,.14)}

/* ---------- 场内特效 ---------- */
.burst{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  border:5px solid rgba(255,255,255,.92);box-shadow:0 0 0 4px rgba(232,151,90,.35);
  animation:burst .32s ease-out forwards}
@keyframes burst{from{transform:scale(.35);opacity:1}to{transform:scale(1.55);opacity:0}}
.qmark{position:absolute;transform:translate(-50%,-100%);padding:6px 12px;border-radius:16px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;color:#4A3B2E;font-size:24px;font-weight:800;
  line-height:1;animation:q-float .8s ease-out forwards}
.qmark::after{content:'';position:absolute;left:50%;bottom:-7px;width:10px;height:10px;
  background:#FFF9EE;border-right:2.5px solid #4A3B2E;border-bottom:2.5px solid #4A3B2E;
  transform:translateX(-50%) rotate(45deg)}
@keyframes q-float{0%{opacity:0;margin-top:6px}25%{opacity:1}80%{opacity:1}
  100%{opacity:0;margin-top:-14px}}
.halo{position:absolute;width:15.6%;height:25.16%;transform:translate(-50%,-50%);border-radius:50%;
  border:4px dashed #E8975A;animation:halo-breathe 1.6s ease-in-out infinite}
@keyframes halo-breathe{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.55}
  50%{transform:translate(-50%,-50%) scale(1.06);opacity:.95}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，指向目标热区） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：计数条适度收紧（场景按 fieldwrap 实际宽高适配，无需改） */
@media (orientation:portrait){
  #counter{gap:12px;padding:6px 18px}
  .chip .cicon{width:48px;height:42px}
}
</style>
</head>
<body>
<div id="game" aria-label="隐藏朋友">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <div id="counter" role="heading" aria-label="题目">
        <div id="chips" style="display:flex;gap:14px;align-items:center"></div>
        <div id="ansbar" aria-label="数一数答数量"></div>
      </div>
    </div>
    <div id="fieldwrap">
      <div id="field" aria-label="藏猫猫场景">
        <div id="svgbox" aria-hidden="true"></div>
        <div id="spots"></div>
        <div id="fx" aria-hidden="true"></div>
        <div id="eye" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
