<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隐藏朋友</title>
<style>
/* ================= 隐藏朋友 hidden（batch22）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、场景浅色场、暖橙主色；
   触摸目标：热区按钮直径=2×HIT_R 场景单位（恒 ≥64px，fitField 锁 1000:620 无 letterbox），
   底栏按钮 ≥72；布局量测一律 offsetWidth/offsetHeight（禁 getBoundingClientRect 断言）；
   5-6 岁零文字依赖：题面=动物图标+点数（语音承载全部语义），点数进度点随找到点亮 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#A8CF8E;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：题面计数条 + 场景 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 10px}
/* 计数条：每种目标一枚 chip（动物图标+进度点）——图标与语音题面同源，零文字 */
#prompt{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0 8px}
#counter{display:flex;align-items:center;gap:18px;padding:6px 26px;border-radius:26px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 5px 0 #D8C9B4;min-height:76px}
.chip{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:18px;background:#F6EEDD}
.chip.hit{animation:chip-hit .4s cubic-bezier(.2,1.7,.4,1)}
@keyframes chip-hit{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.chip .cicon{width:56px;height:48px;display:block}
.chip .cicon svg{width:100%;height:100%}
.chip .cdots{display:flex;flex-direction:column;gap:6px;max-width:36px;flex-wrap:wrap;max-height:48px}
.chip .cdots i{width:15px;height:15px;border-radius:50%;background:#E5D5BC;border:2px solid #D8C9B4;
  transition:all .25s}
.chip .cdots i.on{background:#8FBF7F;border-color:#6FA968;transform:scale(1.1)}
/* r20 计数作答：countAsk 题答案不外显——「？」徽标替代总数进度点（SPEC-R20 §R3） */
.chip .cq{width:34px;height:34px;border-radius:50%;background:#F2DDA0;border:2.5px dashed #C9A24E;
  color:#8A6A2E;font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center}
#counter.rescue .chip{animation:rescue-pulse 1.1s ease-in-out 3}
/* m3 修复：ask 态 chips 已 display:none（#counter.ask #chips），脉冲打在数字条上保可见 */
#counter.ask.rescue #ansbar{animation:rescue-pulse 1.1s ease-in-out 3}
@keyframes rescue-pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,151,90,0)}50%{box-shadow:0 0 0 9px rgba(232,151,90,.4)}}

/* ---------- r20 计数作答条（#counter.ask 翻转：chips 隐藏 / 数字钮显示，恒 5 钮 {2..6}） ---------- */
#ansbar{display:none;gap:12px;align-items:center}
#counter.ask #chips{display:none}
#counter.ask #ansbar{display:flex}
.anum{min-width:68px;min-height:68px;padding:4px 8px;border-radius:18px;background:#F6EEDD;
  border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;transition:transform .15s}
.anum:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
.anum .an-v{font-size:30px;font-weight:800;color:#4A3B2E;line-height:1}
.anum .an-p{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:64px}
.anum .an-p i{width:8px;height:8px;border-radius:50%;background:#E8975A}
.anum.peek{animation:anum-peek .42s ease}
@keyframes anum-peek{0%,100%{transform:scale(1)}45%{transform:scale(1.14);background:#F2DDA0}}

/* ---------- r20 型4 闪现（SPEC-R20 §R4）：遮挡物半透明显形 + 场角睁眼图标 ---------- */
#field.flashing #svgbox .occ{opacity:.16;transition-duration:.15s}
#eye{position:absolute;right:10px;top:10px;z-index:7;width:54px;height:44px;display:none;
  pointer-events:none;filter:drop-shadow(0 2px 0 rgba(74,59,46,.25))}
#field.flashing #eye{display:block;animation:eye-blink 1.2s ease-in-out infinite}
@keyframes eye-blink{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* 场景场（fitField 锁 1000:620，svg/热区/特效三层同轴） */
#fieldwrap{flex:1 1 auto;min-height:180px;width:100%;display:flex;align-items:center;justify-content:center}
#field{position:relative;width:100%;max-width:1180px;overflow:hidden;
  border:3px solid #B9C7A8;border-radius:26px;
  box-shadow:inset 0 0 0 6px rgba(255,249,238,.5), 0 5px 0 #D8C9B4}
#field.bump{animation:f-bump .3s ease}              /* 吞输入可见回应（b21 沉淀③） */
@keyframes f-bump{0%,100%{transform:scale(1)}40%{transform:scale(1.015)}}
#svgbox,#spots,#fx{position:absolute;inset:0}
#svgbox svg{width:100%;height:100%}
#spots{z-index:4}
#fx{z-index:6;pointer-events:none}

/* ---------- 场景内 SVG 动画（找到=遮挡物淡出+动物跳出；救援=遮挡物沙沙） ---------- */
#svgbox .tg .occ{transition:opacity .45s ease}
#svgbox .tg.found .occ{opacity:0}
#svgbox .an{transform-box:fill-box;transform-origin:50% 92%}
#svgbox .tg.found .an{animation:pop-out .75s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop-out{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-9%) scale(1.16)}
  65%{transform:translateY(-4%) scale(1.08)}100%{transform:translateY(0) scale(1)}}
#svgbox .occ.rustle{transform-box:fill-box;transform-origin:50% 90%;
  animation:occ-rustle .9s ease-in-out 2}
@keyframes occ-rustle{0%,100%{transform:rotate(0)}30%{transform:rotate(-2.4deg)}
  60%{transform:rotate(2.2deg)}}
/* r20：已找到动物次第小跳（计数作答支架/答错重数提示） */
#svgbox .tg.found .an.reb{animation:an-reb .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes an-reb{0%,100%{transform:translateY(0)}40%{transform:translateY(-10%) scale(1.07)}}

/* ---------- 目标热区（透明按钮，直径 2×HIT_R 场景单位 ≈ 恒 ≥64px）
   居中用 transform（%margin 纵轴按宽解析会错位，禁用） ---------- */
.spot{position:absolute;width:15.6%;height:25.16%;transform:translate(-50%,-50%);padding:0;
  border-radius:50%;background:rgba(255,255,255,0);z-index:5}
.spot:active{background:rgba(255,255,255,.14)}

/* ---------- 场内特效 ---------- */
.burst{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  border:5px solid rgba(255,255,255,.92);box-shadow:0 0 0 4px rgba(232,151,90,.35);
  animation:burst .32s ease-out forwards}
@keyframes burst{from{transform:scale(.35);opacity:1}to{transform:scale(1.55);opacity:0}}
.qmark{position:absolute;transform:translate(-50%,-100%);padding:6px 12px;border-radius:16px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;color:#4A3B2E;font-size:24px;font-weight:800;
  line-height:1;animation:q-float .8s ease-out forwards}
.qmark::after{content:'';position:absolute;left:50%;bottom:-7px;width:10px;height:10px;
  background:#FFF9EE;border-right:2.5px solid #4A3B2E;border-bottom:2.5px solid #4A3B2E;
  transform:translateX(-50%) rotate(45deg)}
@keyframes q-float{0%{opacity:0;margin-top:6px}25%{opacity:1}80%{opacity:1}
  100%{opacity:0;margin-top:-14px}}
.halo{position:absolute;width:15.6%;height:25.16%;transform:translate(-50%,-50%);border-radius:50%;
  border:4px dashed #E8975A;animation:halo-breathe 1.6s ease-in-out infinite}
@keyframes halo-breathe{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.55}
  50%{transform:translate(-50%,-50%) scale(1.06);opacity:.95}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（fixed 层，指向目标热区） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:opacity .4s;transform:translate(-50%,-88%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-88%)}50%{transform:translate(-50%,-74%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：计数条适度收紧（场景按 fieldwrap 实际宽高适配，无需改） */
@media (orientation:portrait){
  #counter{gap:12px;padding:6px 18px}
  .chip .cicon{width:48px;height:42px}
}
</style>
</head>
<body>
<div id="game" aria-label="隐藏朋友">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="prompt">
      <div id="counter" role="heading" aria-label="题目">
        <div id="chips" style="display:flex;gap:14px;align-items:center"></div>
        <div id="ansbar" aria-label="数一数答数量"></div>
      </div>
    </div>
    <div id="fieldwrap">
      <div id="field" aria-label="藏猫猫场景">
        <div id="svgbox" aria-hidden="true"></div>
        <div id="spots"></div>
        <div id="fx" aria-hidden="true"></div>
        <div id="eye" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ---------- 单题生成（rnd 同流保证确定性；lastKind/lastTheme=避免与上一题同物同景）

function genOne(pat, qi, rnd, lastKind, lastTheme, seed) {
  const P = PATS[pat];

  for (let t = 0; t < 8 && theme === lastTheme; t++) theme = THEMES[Math.floor(rnd() * 4)];
  const n = ri(rnd, P.nMin, P.nMax);
  let kinds;
  if (P.dual) {                                            /* 双目标种：各 ≥1，和=n */
    let a1 = ANIMAL_IDS[Math.floor(rnd() * ANIMAL_IDS.length)];
    let a2 = ANIMAL_IDS[Math.floor(rnd() * ANIMAL_IDS.length)];
    for (let t = 0; t < 8 && a2 === a1; t++) a2 = ANIMAL_IDS[Math.floor(rnd() * ANIMAL_IDS.length)];
    const k1 = ri(rnd, 1, n - 1);

    kinds = [{ a: first ? a1 : a2, count: first ? k1 : n - k1 },

  } else {
    let a = ANIMAL_IDS[Math.floor(rnd() * ANIMAL_IDS.length)];
    for (let t = 0; t < 8 && a === lastKind; t++) a = ANIMAL_IDS[Math.floor(rnd() * ANIMAL_IDS.length)];
    kinds = [{ a: a, count: n }];

        occlusion: Math.round((rf(rnd, P.occMin, P.occMax)) * 100) / 100,
        found: false,

  for (let qi = 0; qi < CH_LEN; qi++) {

    if (dch === 4) q.flash = true;          /* SPEC-R20 §R4：型4 闪现叠加在子型 {2,3} 上 */
    lastKind = q.kinds[0].a; lastTheme = q.theme;

   （shop-math playChain 先例；段恒在册=防御性死分支）；verify 页记序列不出声（M-1） */
const playChain = (keys, fallback) => {
  if (SAYLOG) { SAYLOG.push({ k: keys.join('+'), t: performance.now() }); return; }
  if (keys.every(k => KIDS.voice.clips[k])) KIDS.voice.queue(keys);
  else KIDS.voice.say(fallback);
};

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);

/* ================= 场景适配：#field 恒保持 1000:620（按钮按 % 定位与 SVG 一一对齐，
   无 letterbox；布局量测一律 offsetWidth/offsetHeight） ================= */
function fitField() {
  const wrap = $id('fieldwrap');
  const aw = wrap.clientWidth - 4, ah = wrap.clientHeight - 4;
  if (aw <= 0 || ah <= 0) return;
  let w = Math.min(aw, 1180), h = w * SCENE_H / SCENE_W;
  if (h > ah) { h = ah; w = h * SCENE_W / SCENE_H; }
  /* #field 有 3px 边框 ×2：内盒（svgbox/spots/fx）须恰为 1000:620 → 外框补 6px */
  fieldEl.style.width = Math.floor(w + 6) + 'px';
  fieldEl.style.height = Math.floor(h + 6) + 'px';
}
window.addEventListener('resize', fitField);

/* ================= 场景渲染（SVG 背景 + 目标动物 + 遮挡物 + 干扰动物 → 按钮热区）
   遮挡几何：动物可视宽 base，遮挡物盖住右侧/左侧 occlusion 比例——
   被盖带中心 = x + side*base*(1-occ)/2，遮挡物宽 = occ*base + 44（两侧略出沿） ================= */
function occPlace(t) {
  const base = ANIMALS[t.animal].v;
  const cx = t.x + t._side * base * (1 - t.occlusion) / 2;
  const cy = t.y + 8;
  const w = t.occlusion * base + 44;
  return '<g class="occ" data-i="' + t._idx + '"><g transform="translate(' + Math.round(cx) + ' ' + Math.round(cy) + ')">' +
    occSvg(t._ok, Math.round(w), t._side) + '</g></g>';
}
function sceneSvg(q) {
  const rnd = mulberry32(q.seed * 3 + 7);       /* 场景装饰 seeded 微随机（确定性） */
  let s = '<svg viewBox="0 0 ' + SCENE_W + ' ' + SCENE_H + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    sceneBg(q.theme, rnd);
  for (let i = 0; i < q.targets.length; i++) {
    const t = q.targets[i];
    t._idx = i;
    s += '<g class="tg" data-i="' + i + '">' + animalAt(t.animal, t.x, t.y) + occPlace(t) + '</g>';
  }
  if (q.distractor) {                            /* r20：型2 同系干扰半遮蔽（视觉判别负荷） */
    const d = q.distractor;
    s += '<g class="dg">' + animalAt(d.animal, d.x, d.y) +
      (d.occlusion != null
        ? '<g class="occ" data-i="d"><g transform="translate(' + Math.round(d.x + d._side * ANIMALS[d.animal].v * (1 - d.occlusion) / 2) + ' ' + Math.round(d.y + 8) + '">' +
          occSvg(d._ok, Math.round(d.occlusion * ANIMALS[d.animal].v + 44), d._side) + '</g></g>'
        : '') + '</g>';
  }
  return s + '</svg>';
}
function mkSpotEl(t, i) {
  const el = document.createElement('button');
  el.className = 'spot';
  el.dataset.i = i;
  el.setAttribute('aria-label', '找一找');

  el.style.top = (t.y / SCENE_H * 100) + '%';
  return el;
}

}
/* 题面计数条：每种目标一枚 chip=动物图标+进度点（零文字，点数即题面）
   r20：countAsk 题（型2/3/4）chips 不铺总数进度点（答案不外显，SPEC-R20 §R3）——
   「？」徽标替代；找到时 chip 仅 bounce 不点亮（chipFound 对空 cdots 天然兼容） */
function renderQuiz() {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  const tray = $id('chips');
  tray.innerHTML = '';
  q.kinds.forEach(kd => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = '<span class="cicon"><svg viewBox="0 0 120 100">' + ANIMALS[kd.a].draw() + '</svg></span>' +
      (q.countAsk ? '<span class="cq">？</span>'
                  : '<span class="cdots">' + '<i></i>'.repeat(kd.count) + '</span>');
    tray.appendChild(chip);
  });
  renderStep();
  renderScene();
  hideAnsbar();                                  /* r20：新题重置作答条 */
  q._said = 0;                                   /* mi6：题面首发标志（二级 timer 与按钮读题互斥，防双发） */
  if (!state.demo) {                             /* M-1 修复：闪现题读题延迟至闪现结束——原 hid_mem_watch
                                                    与读题同 tick 发出，被 voice.queue 的 _stop 截断不可闻 */
    if (q.flash) startFlash(q);                  /* r20 型4：开场闪现（SPEC-R20 §R4），watch 提示先行独占声道 */
    else { q._said = 1; playChain(quizKeys(q), quizSpeech(q)); }   /* 读题：题面 clip/段链（T46 阶段2） */
  }
}

/* ================= r20 计数作答条（SPEC-R20 §R3）：找全后弹数字钮报总数 ================= */
function openAnsbar() {

/* ================= r20 型4 闪现（SPEC-R20 §R4）：开场 2.4s 遮挡物半透明，期外点击=吞输入 ================= */
function startFlash(q) {
  state.flash = true;
  fieldEl.classList.add('flashing');
  sayR('hid_mem_watch', '看清楚哦，记住它们藏在哪里');   /* r20 新键（上报）；M-1：闪现期独占声道 */
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(() => {
    flashTimer = null;
    state.flash = false;
    fieldEl.classList.remove('flashing');
    lastAct = Date.now();                        /* 闪现结束才起算救援钟 */
    if (q && !state.demo) {                      /* M-1 修复：读题在闪现结束后发（verify 页入 SAYLOG）；
                                                    mi1：mem_watch 实测 3.36s>FLASH_MS 2.4s，再等 clip 播完免截尾 */
      if (quizSayTimer) clearTimeout(quizSayTimer);
      quizSayTimer = setTimeout(() => {
        quizSayTimer = null;
        if (!q._said) { q._said = 1; playChain(quizKeys(q), quizSpeech(q)); }   /* mi6：按钮已首发则不再发 */
      }, Math.max(0, MEM_WATCH_MS - FLASH_MS) * SPEED);
    }
  }, FLASH_MS * SPEED);
}
function renderStep() {                         // HUD 本关 5 题进度点
  const tray = $id('step-dots');

function renderDots() {                         // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };    // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
/* 找到一只：chip 对应点变绿 + 跳一下 */
function chipFound(q) {
  const chips = counterEl.querySelectorAll('.chip');
  q.kinds.forEach((kd, ci) => {
    const got = q.targets.filter(t => t.animal === kd.a && t.found).length;
    const chip = chips[ci];
    if (!chip) return;
    const dots = chip.querySelectorAll('.cdots i');
    for (let k = 0; k < got && k < dots.length; k++) dots[k].className = 'on';
    chip.classList.remove('hit'); void chip.offsetWidth; chip.classList.add('hit');
  });
}
/* 场内特效：找到=金星扩散圈；「？」=轻气泡（不计数不记错） */

/* ================= 幽灵手指（教学"帮"/演示共用；指向目标热区中心） ================= */
const ghost = {

function pointGhostAt(i) {

/* ================= 点按主路径（真实点击 / HD 钩子 / autoSolve / 教学演示共用）
   找全判定 120ms 防重入窗（承 bubble：窗内紧邻点按=拒绝不计数）
   r20：flash 期（型4 闪现）点击=吞输入轻反馈；找全 countAsk 题返回 'full' 弹作答条 ================= */
async function uiTapTarget(i, demo) {
  if (!cur || state.won) return false;
  if ((state.locked && !demo) || (state.demo && !demo) || (state.flash && !demo)) { sfx('pop'); bump(); return false; }   // 吞输入轻叮+bump
  const run = cur;                              /* 身份守卫：演出窗口内重玩会重建 cur */
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  if (i < 0 || i >= q.targets.length) { sfx('pop'); bump(); return false; }
  const tp = q.targets[i];
  if (tp.found) {                               /* 点已找到的目标=「？」轻反馈（探索≠错误） */
    lastAct = Date.now();                        /* 审查 m1：孩子有互动，重置 14s 方向级救援钟 */
    wooSfx(); qmarkAt(tp.x, tp.y);
    return '?';
  }
  const r = engFoundTarget(cur, i);
  if (r === '?') return '?';
  /* 找到：遮挡物淡出+动物跳出+金星+计数 */
  lastAct = Date.now(); lastProg = Date.now();
  if (haloEl) { haloEl.remove(); haloEl = null; }
  const tg = $id('svgbox').querySelector('.tg[data-i="' + i + '"]');
  if (tg) tg.classList.add('found');
  ghost.hide();
  popSfx();
  burstAt(tp.x, tp.y);
  chipFound(q);
  if (state.tut === 'help') {                   /* 教学"独"：首次自己找到 → 放手 */
    state.tut = 'solo';
    hopRabbit();
  }
  if (r === 'full') {                           /* r20：找全待答 → 弹计数作答条（不推进） */
    openAnsbar();
    return r;
  }
  if (r === 'right' || r === 'done') {          /* 找全：120ms 防重入窗 → 推进/通关 */
    state.locked = true;                        /* 同步置位：窗内紧邻点按=拒绝不计数 */
    if (r === 'right') chimeFull();
    await wait(120 * SPEED);
    if (cur !== run) return r;
    state.locked = false;
    if (r === 'done') winFlow();
    else {
      renderQuiz();
      if (state.tut === 'help') pointHelpNext();
    }
  }
  return r;
}
/* r20 计数作答入口（数字钮点击 / HD.answer / autoSolve 共用；SPEC-R20 §R3）
   答对=原 right/done 推进链；答错=「再数一数」轻反馈+动物再 bounce，不记 miss 不扣星 */
async function uiAnswer(num) {
  if (!cur || state.won) return false;
  const q = cur.quizzes[cur.step];
  if (!q || !q.ansOpen) return false;
  const run = cur;
  const r = engAnswer(cur, num);                 /* 单一判定源：引擎先记 ansMiss/推进再放 UI 反馈 */
  if (r === 'retry') {
    lastAct = Date.now();
    sayR('hid_cnt_retry', '再数一数吧');           /* r20 新键（M1 直调点收编 sayR 入 SAYLOG） */
    counterEl.classList.remove('rescue'); void counterEl.offsetWidth; counterEl.classList.add('rescue');
    bounceFound();
    return 'retry';
  }
  if (r !== 'right' && r !== 'done') return r;
  lastAct = Date.now(); lastProg = Date.now();
  hideAnsbar();
  state.locked = true;                          /* 120ms 防重入窗（与找全推进同规格） */
  chimeFull();
  await wait(120 * SPEED);
  if (cur !== run) return r;
  state.locked = false;
  if (r === 'done') winFlow();
  else {
    renderQuiz();
    if (state.tut === 'help') pointHelpNext();
  }
  return r;
}
/* tapScene（场景单位 0-1000 × 0-620）：钩子命中检测入口（与按钮点击同一判定链） */
function uiTapScene(x, y) {
  if (!cur || state.won) return false;
  if (state.locked || state.demo || state.flash) { sfx('pop'); bump(); return false; }
  const i = engFoundIdx(cur, x, y);
  if (i < 0) {                                  /* 点非目标：轻反馈不计数不记错（miss 恒 0） */
    lastAct = Date.now();
    const q = cur.quizzes[cur.step];
    if (q && q.distractor && !q._dSaid && Math.hypot(x - q.distractor.x, y - q.distractor.y) <= HIT_R) {
      q._dSaid = 1;                             /* 试玩P3：干扰动物首次点名（排除法认知支点——「这不是小鸟呀」） */
      sayR(wrongKey(q.distractor.animal), '这不是' + ANIMALS[q.distractor.animal].n + '呀');   /* T46 clip；M1 直调点收编 sayR 入 SAYLOG */
    }
    wooSfx(); qmarkAt(x, y);
    return '?';
  }
  return uiTapTarget(i);
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  hideAnsbar();                                  /* r20：通关收作答条 */
  sfx('win');
  sayR(VOICE.right.key, VOICE.right.text);      /* hid_right：全找到啦，眼睛真亮 */
  if (VERIFY) return;                           // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(engStars(cur)).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, engStars(cur), [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {

function proceed() {                            // 今日解锁范围内第一个未通关的关（含生成关）

   →立即重发同关（确定性同场景），"你来找一找"在重发后的场景上说（watch ≤16s） ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);      /* hid_tut_watch：看！小动物藏起来啦 */
  /* mi5 修复：watch→ear 衔接延迟至 clip 实长（M-1 同根因存量——原固定 700ms 窗，
     hid_tut_watch 3.264s 被 ear 的 voice.play _stop 截断尾段 2.56s 不可闻）；
     教学总长复核：3.4+1.0+0.32+0.6+turn(1.78s)≈7.1s ≤16s 预算 */
  await wait(Math.max(700, TUT_WATCH_MS) * SPEED);
  const q = cur.quizzes[0];
  if (!q) { state.demo = false; state.locked = false; return; }
  sayR(VOICE.ear.key, VOICE.ear.text);              /* 演示引导语（T46 阶段2 clip 化；M1 直调点收编 sayR 入 SAYLOG） */
  const i = helpNextIdx(q);
  pointGhostAt(i);
  await wait(1000 * SPEED);
  ghost.press();
  await wait(320 * SPEED);
  const demoR = await uiTapTarget(i, true);     /* demo 通道豁免 locked 门（演示吞输入） */
  window.__hdDemoR = demoR;                     /* 演示生效证据（§0.27，gate 断言 'found'） */
  await wait(600 * SPEED);
  const sv = KIDS._save();

  sv.hidden.tutSeen = true;
  KIDS.store.persist();
  /* 立即重发同关（确定性关卡，题面一致），"你来找一找"在重发后的场景上说 */
  ghost.hide();
  cur = genLevel(0);
  state = { locked: false, won: false, demo: false, tut: 'help' };
  helpRedemo = false;
  lastAct = Date.now(); lastProg = Date.now();
  renderQuiz(); renderDots();
  sayR(VOICE.turn.key, VOICE.turn.text);        /* hid_tut_turn：你来找一找 */
  setTimeout(() => { if (state.tut === 'help') pointHelpNext(); }, 600);
}

/* ================= 验收钩子（getter 模式，返回拷贝非活引用）

window.HD = {

  start(flat) { startLevel(flat); },                    /* 外部切关（verify 页/独立复验共用口径） */
  get currentLevel() {

    const q = cur.quizzes[Math.min(cur.step, cur.quizzes.length - 1)];
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv,
             n: cur.quizzes.length, step: cur.step, done: cur.done, won: state.won,
             foundN: q ? q._found : 0, miss: 0, ansOpen: q ? !!q.ansOpen : false };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    return { theme: q.theme, pattern: q.pattern, n: q.n,
             kinds: q.kinds.map(k => ({ animal: k.a, count: k.count })),
             targets: q.targets.map(t => ({ animal: t.animal, x: t.x, y: t.y,
                                            occlusion: t.occlusion, found: t.found })),
             distractor: q.distractor ? { animal: q.distractor.animal, x: q.distractor.x, y: q.distractor.y,

  },
  tapScene(x, y) { return uiTapScene(x, y); },          /* 场景单位命中检测（0-1000 × 0-620） */
  answer(num) { return uiAnswer(num); },                /* r20：计数作答入口（UI 真实判定链） */
  get flashOn() { return state.flash === true; },       /* r20：闪现期标志（复验等待用） */
  async autoSolve() {                    // UI 路径自动找全当前关（逐目标点真实判定链+r20 作答步）
    let taps = 0, guard = 0;
    while (cur && !cur.done && guard++ < 600) {
      const q = cur.quizzes[cur.step];
      if (!q) break;
      if (state.flash) { await wait(150); continue; }   /* r20：闪现期等待（同步拒绝空转会耗尽 guard） */
      if (q.ansOpen) { await uiAnswer(q.n); taps++; continue; }   /* r20：找全待答 → 答对推进 */
      const i = helpNextIdx(q);
      if (i == null) { await wait(30); continue; }

  },
  get tutorial() { return state.tut; },
  _rescue: { dir: triggerDirHint, ans: triggerAnsHint }  /* verify 直驱救援视觉（无钟等待） */
};
/* ================= ?verify=1 自检（仅 verify 分支加载执行）
   ① 40 关全量审计（flat 0-39，各关独立计分）：确定性（同 flat 两次生成 JSON 一致）/
     章型结构（structWhy 全 null：N 区间/遮蔽 30-60 与章内子区间/双种各 ≥1/型1 必带干扰/
     型2 同系干扰+干扰遮蔽区间/countAsk 标志/位置互距 ≥256/初始态干净/
     型位表 dch1-3 恒型、dch4 子型∈{2,3} 混合 ≥2 型全题 flash——r20 SPEC-R20 §R2）/
     引擎直驱通关（tapScene 逐目标 found→full（countAsk）→engAnswer 答错 retry 不推进→
     答对 right/done + 场景空白 '?' 不计数不记错 + 完局后 null + miss 恒 0 + 3★）
   ② 遮蔽率元数据抽样（40 关全量）：全部 ∈[0.30,0.60]；dch1 ⊆[0.30,0.45]；dch2 ⊆[0.40,0.55]；
     dch3 ⊆[0.35,0.60]；全局出现 <0.40 与 >0.50（区间真实铺开非恒值）
   ③ 章型分布（r20 域）：flat0-4 型1+异种干扰（全可见）/ 5-9 型2+同系干扰+countAsk /
     10-14 型3 双种+countAsk / 15-19 型4 子型∈{2,3} 混合 ≥2 型+flash 全题 /
     20-39 难度章 (ch-1)%4+1 循环；主题 ≥3 种出现过
   ④ tapScene 命中语义（flat0 UI，型1 无作答）：空白 '?' 不计数 / 目标 found / 已找到 '?' /
     近偏点 '?' / 找全 right→新题 foundN 归零（miss 恒 0 全程）
   ⑤ 命中检测对账：每个热区按钮中心（offsetWidth/offsetLeft 量测）↔ 场景单位目标坐标 <12，
     且 engFoundIdx 同点命中同下标（UI/引擎同口径）
   ⑥ 吞输入单元：demo/locked 门拦 tapScene=false 且场容器 bump 类可见回应
   ⑦ 救援视觉直驱：方向级 .occ.rustle 沙沙 / 答案级 .halo 轮廓 breathe 出现→找到即撤
   ⑧ UI 冒烟：flat0 autoSolve 通关（恒 3★，verify 页不弹层）
   ⑨ 布局：双 viewport（1280×800 / 800×1180）×（章 2 / 章 4）：热区按钮 offset 尺寸 ≥64、
     计数条高 ≥64、field 宽高比=1000:620（无 letterbox）、overflowX ≤0
   ⑩ clips：必备键钉名全注入（m4：r20 三新键钉名入 need，≥37，SPEC-R20 §R6）
   ⑪ r20 计数作答全链（flat6 型2）：找全→ansOpen+作答条 5 钮→答错 retry 不推进不记 miss→
     ansOpen 态点目标 '?'→答对推进新题归零
   ⑫ r20 闪现单元（flat15 型4）：flash 期 tapScene=false 吞输入+bump+foundN 不动→
     flash 结束可点→找全+答数推进
   结果写 #verify-result + document.title='VERIFY PASS n/n' */
async function runVerify() {
  document.body.classList.add('verify');
  const levels = {}, gen = {}, units = {};
  let npass = 0, total = 0;

  /* ---- ① 40 关全量审计（flat 0-39，逐关计分） ---- */
  const occAll = [], occByDch = { 1: [], 2: [], 3: [], 4: [] };
  const themeSeen = {};
  for (let flat = 0; flat < 40; flat++) {
    total++;
    const L1 = genLevel(flat), L2 = genLevel(flat);
    const det = JSON.stringify(L1) === JSON.stringify(L2);          // 同 flat 同场景（确定性）
    let ruleOk = true;
    const pats = new Set();
    for (let k = 0; k < L1.quizzes.length; k++) {
      const q = L1.quizzes[k];
      if (structWhy(q, q.pattern, k) !== null) ruleOk = false;
      pats.add(q.pattern);
      themeSeen[q.theme] = 1;
      for (let i = 0; i < q.targets.length; i++) {
        occAll.push(q.targets[i].occlusion);
        occByDch[L1.dch].push(q.targets[i].occlusion);
      }
    }
    if (L1.quizzes.length !== CH_LEN) ruleOk = false;
    if (L1.dch >= 1 && L1.dch <= 3) {                               // 章 1-3 恒型
      if (!L1.quizzes.every(q => q.pattern === L1.dch)) ruleOk = false;
    } else {                                                        // r20 章4：子型∈{2,3} 混合 ≥2 型+全题 flash+countAsk
      if (!(pats.size >= 2 && L1.quizzes.every(q =>
        (q.pattern === 2 || q.pattern === 3) && q.flash === true && q.countAsk === true))) ruleOk = false;
    }
    if (L1.dch !== 4 && L1.quizzes.some(q => q.flash)) ruleOk = false;   // 闪现仅型4
    /* 引擎直驱：空白 '?' → 逐目标 found→full（countAsk）→engAnswer 答错 retry→答对推进
       → 完局 null + miss 0 + 3★（r20 SPEC-R20 §R3/R5） */
    let driveOk = true;
    for (let k = 0; k < L1.quizzes.length && driveOk; k++) {
      const q = L1.quizzes[k];
      if (engTapScene(L1, 500, 60) !== '?') driveOk = false;        // 空白点=轻反馈不计数
      for (let i = 0; i < q.targets.length && driveOk; i++) {
        const last = i === q.targets.length - 1;
        const exp = last ? (q.countAsk ? 'full' : (k === L1.quizzes.length - 1 ? 'done' : 'right')) : 'found';
        if (engTapScene(L1, q.targets[i].x, q.targets[i].y) !== exp) driveOk = false;
      }
      if (driveOk && q.countAsk) {
        if (engAnswer(L1, q.n === 6 ? 2 : q.n + 1) !== 'retry') driveOk = false;   // 答错=不推进
        if (engTapScene(L1, q.targets[0].x, q.targets[0].y) !== '?') driveOk = false;  // ansOpen 态点目标=轻反馈
        const expA = k === L1.quizzes.length - 1 ? 'done' : 'right';
        if (engAnswer(L1, q.n) !== expA) driveOk = false;           // 答对=推进
      }
      if (!q.solved || q._found !== q.n) driveOk = false;
    }
    const edgeOk = L1.done && L1.step === CH_LEN &&
      engTapScene(L1, L1.quizzes[0].targets[0].x, L1.quizzes[0].targets[0].y) === null &&
      engFoundTarget(L1, 0) === null && engAnswer(L1, 3) === null &&  // 完局后引擎拒绝（含作答）
      L1.quizzes.every(q => q.targets.every(t => t.found)) &&
      (L1.missCnt || 0) === 0 && engStars(L1) === 3;
    const ok = det && ruleOk && driveOk && edgeOk;
    if (ok) npass++;
    const rec = { ch: L1.ch, dch: L1.dch, ok: ok, det: det, ruleOk: ruleOk,
      driveOk: driveOk, edgeOk: edgeOk,
      pats: L1.quizzes.map(q => q.pattern), n: L1.quizzes.map(q => q.n) };
    if (flat < STATIC_LEVELS) levels[keyOf(flat)] = rec;
    else gen[flat] = rec;
  }

  /* ---- ② 遮蔽率元数据（40 关全量抽样断言；r20 加 dch3 ⊆[0.35,0.60]） ---- */
  total++;
  const occOk = occAll.length > 300 &&
    occAll.every(v => v >= 0.30 - 1e-9 && v <= 0.60 + 1e-9) &&
    occByDch[1].length > 0 && occByDch[1].every(v => v >= 0.30 - 1e-9 && v <= 0.45 + 1e-9) &&
    occByDch[2].length > 0 && occByDch[2].every(v => v >= 0.40 - 1e-9 && v <= 0.55 + 1e-9) &&
    occByDch[3].length > 0 && occByDch[3].every(v => v >= 0.35 - 1e-9 && v <= 0.60 + 1e-9) &&
    occAll.some(v => v < 0.40) && occAll.some(v => v > 0.50);
  if (occOk) npass++;
  units.occ = { ok: occOk, n: occAll.length, min: Math.min.apply(null, occAll),
    max: Math.max.apply(null, occAll),
    dch1: [Math.min.apply(null, occByDch[1]), Math.max.apply(null, occByDch[1])],
    dch2: [Math.min.apply(null, occByDch[2]), Math.max.apply(null, occByDch[2])],
    dch3: [Math.min.apply(null, occByDch[3]), Math.max.apply(null, occByDch[3])] };

  /* ---- ③ 章型分布（静态 20 关区间 + 生成关循环；r20 域：型2 同系干扰+countAsk/
     型3 双种+countAsk/型4 子型{2,3}+flash 全题） ---- */
  total++;
  let distOk = true;
  const bandExpect = flat => (flat < 5 ? 1 : flat < 10 ? 2 : flat < 15 ? 3 : flat < 20 ? 4
    : (Math.floor(flat / 5) % 4) + 1);
  for (let flat = 0; flat < 40; flat++) {
    const L = genLevel(flat);
    if (L.dch !== bandExpect(flat)) distOk = false;
    if (L.dch === 4) continue;                     // dch4 子型叠加 flash 由①/mix15 专断（§R2）
    for (const q of L.quizzes) {
      if (q.pattern === 1 && !q.distractor) distOk = false;         // 型1 必带异种干扰（全可见）
      if (q.pattern === 1 && q.distractor.occlusion != null) distOk = false;
      if (q.pattern === 2) {                                        // r20 型2：同系干扰半遮蔽+countAsk
        if (!q.distractor || q.distractor.occlusion == null) distOk = false;
        else if (SIM[q.distractor.animal] !== q.kinds[0].a) distOk = false;
        else if (q.distractor.occlusion < 0.35 - 1e-9 || q.distractor.occlusion > 0.55 + 1e-9) distOk = false;
        if (!q.countAsk || q.flash) distOk = false;
      }
      if (q.pattern === 3) {                                        // r20 型3：双种+countAsk 无干扰
        if (q.kinds.length !== 2) distOk = false;
        if (q.distractor || !q.countAsk || q.flash) distOk = false;
      }
    }
  }
  const L15 = genLevel(15);
  const mix15 = new Set(L15.quizzes.map(q => q.pattern)).size >= 2 &&  // r20 章4 子型混合+全题 flash
    L15.quizzes.every(q => q.flash === true && q.countAsk === true);
  const themesOk = Object.keys(themeSeen).length >= 3;              // 主题多样性（四主题轮换）
  const distAll = distOk && mix15 && themesOk;
  if (distAll) npass++;
  units.dist = { ok: distAll, bandOk: distOk, mix15: mix15, themes: Object.keys(themeSeen) };

  /* ---- ④ tapScene 命中语义（flat0 真实 UI 状态机） ---- */
  total++;
  HD.start(0);
  const q0 = HD.quiz;
  const missPoint = t => {                        // 找一个离所有未找到目标都 >HIT_R 的近偏点
    for (let a = 0; a < 8; a++) {
      const ang = a * Math.PI / 4, px = t.x + Math.cos(ang) * (HIT_R + 12), py = t.y + Math.sin(ang) * (HIT_R + 12);
      if (px > 0 && px < SCENE_W && py > 0 && py < SCENE_H && engFoundIdx(cur, px, py) < 0) return [px, py];
    }
    return [30, 30];
  };
  const rBlank = await HD.tapScene(30, 30);
  const blankOk = rBlank === '?' && HD.quiz.foundN === 0 && HD.quiz.miss === 0;
  const t0 = q0.targets[0];
  const mp = missPoint(t0);
  const rNear = await HD.tapScene(mp[0], mp[1]);
  const nearOk = rNear === '?' && HD.quiz.foundN === 0;
  const rHit = await HD.tapScene(t0.x, t0.y);
  const hitOk = rHit === 'found' && HD.quiz.foundN === 1 &&
    HD.quiz.targets[0].found === true;
  const rAgain = await HD.tapScene(t0.x, t0.y);
  const againOk = rAgain === '?' && HD.quiz.foundN === 1;           // 已找到再点=「？」不重复计数
  let rLast = null;
  for (let i = 1; i < q0.targets.length; i++) rLast = await HD.tapScene(q0.targets[i].x, q0.targets[i].y);
  const fullOk = rLast === 'right' && HD.currentLevel.step === 1 &&
    HD.quiz && HD.quiz.foundN === 0 && HD.quiz.miss === 0;          // 找全推进，新题归零
  const tapOk = blankOk && nearOk && hitOk && againOk && fullOk;
  if (tapOk) npass++;
  units.tap = { ok: tapOk, blank: blankOk, near: nearOk, hit: hitOk, again: againOk,
    full: fullOk, rHit: rHit, rNear: rNear };

  /* ---- ⑤ 命中检测对账：热区按钮视觉中心 ↔ 引擎目标（offset 量测，非 gBCR；
     .spot 用 translate(-50%,-50%) 居中 → 布局锚点即视觉中心） ---- */
  total++;
  HD.start(3);
  const q3 = HD.quiz;
  const fw = fieldEl.offsetWidth, fh = fieldEl.offsetHeight;
  const sw = spotsEl.offsetWidth, sh = spotsEl.offsetHeight;
  let alignOk = fw > 0 && Math.abs(sw / sh - SCENE_W / SCENE_H) < 0.03 && spotsEl.children.length === q3.targets.length;
  for (let i = 0; i < spotsEl.children.length && alignOk; i++) {
    const s = spotsEl.children[i];
    const cx = s.offsetLeft / sw * SCENE_W;
    const cy = s.offsetTop / sh * SCENE_H;
    if (Math.hypot(cx - q3.targets[i].x, cy - q3.targets[i].y) > 12) alignOk = false;
    if (engFoundIdx(cur, cx, cy) !== i) alignOk = false;            // 同点引擎命中同下标
  }
  if (alignOk) npass++;
  units.align = { ok: alignOk, fw: fw, fh: fh, sw: sw, sh: sh, n: spotsEl.children.length };

  /* ---- ⑥ 吞输入单元：demo/locked 门拦输入 + bump 可见回应 ---- */
  total++;
  HD.start(0);
  const qt = HD.quiz;
  state.demo = true; state.locked = true;                           // 模拟教学"看"演示期
  const p1 = HD.tapScene(qt.targets[0].x, qt.targets[0].y);
  const bump1 = fieldEl.classList.contains('bump');
  const sw1 = (await p1) === false && bump1 && HD.quiz.foundN === 0;
  fieldEl.classList.remove('bump');
  state.demo = false; state.locked = true;                          // 演出窗口（locked）
  const p2 = HD.tapScene(qt.targets[0].x, qt.targets[0].y);
  const bump2 = fieldEl.classList.contains('bump');
  const sw2 = (await p2) === false && bump2 && HD.quiz.foundN === 0;
  fieldEl.classList.remove('bump');
  state.locked = false;                                             // 还原
  const swallowOk = sw1 && sw2;
  if (swallowOk) npass++;
  units.swallow = { ok: swallowOk, demo: sw1, locked: sw2 };

  /* ---- ⑦ 救援视觉直驱（无钟等待）：方向级 rustle / 答案级 halo ---- */
  total++;
  HD.start(10);
  const dirOk = HD._rescue.dir() === true &&
    !!$id('svgbox').querySelector('.occ.rustle');
  const ansOk = HD._rescue.ans() === true &&
    !!$id('fx').querySelector('.halo');
  const ht = HD.quiz.targets[Number($id('fx').querySelector('.halo').dataset.i)];
  await HD.tapScene(ht.x, ht.y);                                    // 找到该目标 → halo 即撤
  const haloGone = !$id('fx').querySelector('.halo');
  const rescueOk = dirOk && ansOk && haloGone;
  if (rescueOk) npass++;
  units.rescue = { ok: rescueOk, dir: dirOk, ans: ansOk, haloGone: haloGone };

  /* ---- ⑧ UI 冒烟：flat0 autoSolve 通关（恒 3★，verify 页不弹层） ---- */
  total++;
  HD.start(0);
  const wantTaps = cur.quizzes.reduce((s, q) => s + q.n, 0);
  const a0 = await HD.autoSolve();
  const lv0 = HD.currentLevel;
  const smokeOk = a0.done && a0.taps === wantTaps && lv0.done && lv0.won &&
    lv0.miss === 0 && engStars(cur) === 3 && !document.querySelector('.k-celebrate');
  if (smokeOk) npass++;
  units.smoke = { ok: smokeOk, taps: a0.taps, want: wantTaps, stars: engStars(cur) };

  /* ---- ⑨ 布局：双 viewport ×（章 2 / 章 4）offsetWidth/offsetHeight 量测 ---- */
  function simView(w, h, flat) {
    const g = $id('game');
    g.style.width = w + 'px';
    g.style.height = h + 'px';
    startLevel(flat);
    fitField();
    const spots = Array.prototype.map.call(spotsEl.children, s => ({ w: s.offsetWidth, h: s.offsetHeight }));
    const hitOk = spots.length >= 2 && spots.every(s => s.w >= 64 && s.h >= 64);
    const cntOk = counterEl.offsetHeight >= 64;
    const fw2 = fieldEl.offsetWidth, fh2 = fieldEl.offsetHeight;
    const aspOk = fw2 > 0 && fh2 > 0 && Math.abs(fw2 / fh2 - SCENE_W / SCENE_H) < 0.03;
    const de = document.documentElement;
    const ox = Math.max(g.scrollWidth - g.clientWidth, de.scrollWidth - de.clientWidth);
    return { vp: w + 'x' + h, flat: flat, hitOk: hitOk, cntOk: cntOk, aspOk: aspOk, ox: ox,
      n: spots.length, minW: spots.length ? Math.min.apply(null, spots.map(s => s.w)) : 0,
      pass: hitOk && cntOk && aspOk && ox <= 0 };
  }
  total++;
  const sims = [];
  for (const flat of [6, 15]) {
    sims.push(simView(1280, 800, flat));
    sims.push(simView(800, 1180, flat));
  }
  const g0 = $id('game');
  g0.style.width = '';
  g0.style.height = '';
  startLevel(0);                                                    // 还原真实 viewport 布局
  const layoutOk = sims.every(s => s.pass);
  if (layoutOk) npass++;
  units.layout = { ok: layoutOk, sims: sims };

  /* ---- ⑩ clips：m4 钉名——r20 三新键钉名入 need，≥37（SPEC-R20 §R6；
     必备集从 SPEC §1 六动物域推导不从实现归纳） ---- */
  total++;
  const keys = Object.keys(KIDS.voice.clips);
  const need = ['hid_tut_watch', 'hid_tut_turn', 'hid_hint', 'hid_right',
    'hid_cnt_q', 'hid_cnt_retry', 'hid_mem_watch'];
  const T46 = Object.keys(ANIMALS).reduce((a, aid) => a.concat(['hid_q_' + aid, 'hid_an_' + aid, 'hid_w_' + aid]), [])
    .concat(['hid_s_find', 'hid_s_he'])
    .concat(Array.from({ length: 6 }, (_, i) => 'hid_n_' + (i + 1)))
    .concat(['hid_ear']);
  const clipsOk = keys.length >= 37 &&
    need.every(k => keys.indexOf(k) >= 0 && KIDS.voice.clips[k].indexOf('data:audio/mpeg;base64,') === 0) &&
    T46.every(k => !!KIDS.voice.clips[k] && KIDS.voice.clips[k].indexOf('data:audio/mpeg;base64,') === 0);
  if (clipsOk) npass++;
  units.clips = { ok: clipsOk, n: keys.length, t46: T46.length, keys: keys };

  /* ---- ⑪ r20 计数作答全链（flat6 型2 UI 真实判定链）：
     找全→ansOpen+作答条 5 钮（域 {2..6}）→答错 retry 不推进+ansMiss=1+miss 0→
     ansOpen 态点目标 '?'→答对推进新题归零 ---- */
  total++;
  HD.start(6);
  const qa = HD.quiz;
  for (let i = 0; i < qa.targets.length; i++) {
    await HD.tapScene(qa.targets[i].x, qa.targets[i].y);
  }
  const askOpen = HD.quiz && HD.quiz.ansOpen === true && HD.currentLevel.step === 0 &&
    counterEl.classList.contains('ask') && $id('ansbar').children.length === 5;
  const nums = Array.prototype.map.call($id('ansbar').children, b => Number(b.dataset.n));
  const domainOk = nums.join() === '2,3,4,5,6';
  const wrongN = qa.n === 6 ? 2 : qa.n + 1;
  const rRetry = await HD.answer(wrongN);
  const retryOk = rRetry === 'retry' && HD.quiz.ansOpen === true &&
    HD.quiz.ansMiss === 1 && HD.quiz.miss === 0 && HD.currentLevel.step === 0;
  const rHold = await HD.tapScene(qa.targets[0].x, qa.targets[0].y);
  const holdOk = rHold === '?' && HD.quiz.foundN === HD.quiz.n && HD.quiz.ansOpen === true;
  const rAns = await HD.answer(qa.n);
  const askAnsOk = rAns === 'right' && HD.currentLevel.step === 1 &&
    HD.quiz && HD.quiz.foundN === 0 && HD.quiz.ansOpen === false &&
    !counterEl.classList.contains('ask') && $id('ansbar').children.length === 0;
  const askAll = askOpen && domainOk && retryOk && holdOk && askAnsOk;
  if (askAll) npass++;
  units.ask = { ok: askAll, open: askOpen, domain: domainOk, retry: retryOk, hold: holdOk,
    ans: askAnsOk, n: qa.n, rRetry: rRetry, rHold: rHold, rAns: rAns };

  /* ---- ⑫ r20 闪现单元（flat15 型4）：flash 期 tapScene=false 吞输入+bump+foundN 不动→
     flash 结束可点→找全+答数推进 ---- */
  total++;
  HD.start(15);
  const fl0 = HD.quiz;
  const flashOn = HD.flashOn === true && fieldEl.classList.contains('flashing') &&
    getComputedStyle($id('eye')).display !== 'none';
  const rFl = await HD.tapScene(fl0.targets[0].x, fl0.targets[0].y);
  const swallowFl = rFl === false && fieldEl.classList.contains('bump') && HD.quiz.foundN === 0;
  fieldEl.classList.remove('bump');
  let waited = 0;
  while (HD.flashOn && waited < 5000) { await wait(60); waited += 60; }   // 等 flash 结束（verify 页 ≈0.29s）
  const flashOff = HD.flashOn === false && !fieldEl.classList.contains('flashing');
  const rFl2 = await HD.tapScene(fl0.targets[0].x, fl0.targets[0].y);
  const hitOk2 = rFl2 === 'found' && HD.quiz.foundN === 1;
  let fullDone = true;
  for (let i = 1; i < fl0.targets.length && fullDone; i++) {
    await HD.tapScene(fl0.targets[i].x, fl0.targets[i].y);
  }
  const opened = HD.quiz && HD.quiz.ansOpen === true;                    // 型4 子型均 countAsk
  const rFa = opened ? await HD.answer(fl0.n) : null;
  const advOk = opened && (rFa === 'right' || rFa === 'done') && !HD.quiz.ansOpen;
  const flashAll = flashOn && swallowFl && flashOff && hitOk2 && advOk;
  if (flashAll) npass++;
  units.flash = { ok: flashAll, on: flashOn, swallow: swallowFl, off: flashOff,
    hit: hitOk2, adv: advOk, waitMs: waited };

  const out = { game: 'hidden', total: total, pass: npass, units: units, levels: levels, gen: gen };
  $id('verify-result').textContent = JSON.stringify(out);
  document.title = (npass === total && layoutOk) ? 'VERIFY PASS ' + npass + '/' + total : 'VERIFY FAIL';
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function () {};
  KIDS.voice.queue = function () {};
  runVerify();
}

</script>
</body>
