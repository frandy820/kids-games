<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>滑块拼图</title>
<style>
/* ================= 滑块拼图 slide（batch22）=================
   视觉按 DESIGN-SPEC §8：暖米底 #FBF6EC、暖橙主色、暖棕描边 #4A3B2E。
   玩法 = 小兔子照片切块打乱（2×2 → 2×3 → 3×3，从完成态做 K 次随机
   合法滑动构造——构造即证明可解，禁随机排列），右侧小样恒可见（5-6 岁
   须有参照，SPEC-BATCH22 §2）；点空格相邻块 = 滑入（动画 ≤200ms）；
   点非相邻块 = 该块轻微晃动 'wig' 拒绝（非错误零惩罚）；全块归位 =
   自动 celebrate（无提交）；不限步不限时。
   零文字依赖（§0.19）：块上禁数字标号，图块自身纹理 = 线索；
   题面/纠错语义全语音承载。触摸目标：拼图块 = 主答案 ≥64；
   底栏按钮 ≥64；布局量测走 offsetWidth/offsetHeight（禁动画帧 getBCR）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：拼图盘（恒正方形）+ 右侧照片小样（恒可见参照） ---------- */
#stage{flex:1 1 auto;min-height:180px;display:flex;align-items:center;justify-content:center;
  gap:16px;padding:12px 14px;overflow:hidden}
#boardwrap{flex:1 1 auto;align-self:stretch;display:flex;align-items:center;justify-content:center;
  min-width:120px;min-height:120px}
#board{position:relative;flex:0 0 auto;border-radius:14px;background:#F2E7D2;
  box-shadow:0 5px 0 rgba(74,59,46,.22),inset 0 0 0 3px #4A3B2E}
#board.bump{animation:an-bump .3s ease}
@keyframes an-bump{0%{transform:scale(1)}45%{transform:scale(.97)}100%{transform:scale(1)}}

/* 拼图块（主答案按钮 ≥64）：块 = 网格等分矩形，内嵌完整 SVG 图的对应区域
   （.art 相对块恒静止，滑入 = 块 left/top transition ≤200ms） */
.tile{position:absolute;border-radius:7px;overflow:hidden;padding:0;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),0 1px 3px rgba(74,59,46,.25);
  transition:left .18s cubic-bezier(.4,.1,.3,1),top .18s cubic-bezier(.4,.1,.3,1)}
.tile:active{filter:brightness(1.05)}
.tile .art{position:absolute;left:0;top:0}
.tile.pop{animation:tile-in .4s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes tile-in{from{transform:scale(.4) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
/* 点非相邻块：轻微晃动 'wig' 拒绝（非错误零惩罚，不灰化可重点） */
.tile.wig{animation:an-wig .55s ease}
@keyframes an-wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}
  55%{transform:rotate(5deg)}80%{transform:rotate(-3deg)}}
/* 救援答案级（30s 无进展）：下一步应滑块 breathe 循环（§0.21 在屏） */
.tile.breathe{animation:an-breathe 1.6s ease-in-out infinite}
/* 救援方向级（14s）：应滑块描边闪两下（试玩P2——空格 pulse 外的可点指示） */
.tile.hintline{animation:an-hintline .6s ease-out 2}
@keyframes an-hintline{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 5px rgba(242,163,60,.85) inset,0 0 12px rgba(242,163,60,.75)}}
@keyframes an-breathe{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px rgba(232,151,90,.95)) brightness(1.06)}}

/* 空格（不可点）：虚线软框——14s 方向级救援 = pulse 呼吸高亮 */
.blankcell{position:absolute;border-radius:7px;border:2.5px dashed #C9B393;
  background:rgba(255,249,238,.5);pointer-events:none;
  animation:blank-in .4s ease backwards}
@keyframes blank-in{from{opacity:0}to{opacity:1}}
.blankcell.pulse{animation:an-pulse 1.5s ease-in-out infinite}
@keyframes an-pulse{0%,100%{box-shadow:none;border-color:#C9B393}
  50%{box-shadow:0 0 0 7px rgba(232,151,90,.4);border-color:#E8975A}}

/* 本题复原：完整原图盖盘闪现（celebrate 前的「照片拼好了」仪式感） */
#reveal{position:absolute;inset:0;z-index:8;border-radius:10px;overflow:hidden;display:none;
  box-shadow:0 0 0 4px #FFF9EE,0 0 0 7px #E8975A}
#reveal.show{display:block;animation:reveal-in .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes reveal-in{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}

/* 右侧照片小样（完成参照，恒可见；零文字依赖：相框图形承载语义） */
#side{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
#mini{width:158px;padding:8px;border-radius:14px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #C9A87C;position:relative}
#mini .cap{position:absolute;left:-7px;top:-9px;width:30px;height:30px;border-radius:9px;
  background:#E8975A;border:2.5px solid #4A3B2E;display:flex;align-items:center;justify-content:center}
#mini svg{width:100%;height:auto}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch9-21） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板竖持）：小样移到盘面上方横排居左，块仍 ≥64 */
@media (orientation:portrait){
  #stage{flex-direction:column;gap:10px;padding:10px 12px}
  #side{flex-direction:row;align-self:stretch;justify-content:flex-start;gap:12px}
  #mini{width:136px;padding:6px}
  #mini .cap{width:26px;height:26px}
}
</style>
</head>
<body>
<div id="game" aria-label="滑块拼图">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="boardwrap">
      <div id="board" aria-label="照片拼图盘"></div>
    </div>
    <div id="side">
      <div id="mini" aria-label="照片小样">
        <span class="cap" aria-hidden="true"></span>
        <div id="mini-art"></div>
      </div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

/* ================= slide 纯引擎：确定性盘面生成（K 步合法滑动构造）+ 滑块判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 13)：同 flat 永远同关（重玩一致、verify 可检）
   章型（SPEC-BATCH22 §2/§0.50；进度章号单调递增、难度章号 (ch-1)%4+1 循环；生成关随机章参数）：
     dch1 2×2  K∈[3,6]  / dch2 2×3（W=3,H=2）K∈[6,12] / dch3 3×3 K∈[12,20]
     dch4 盘型轮换：每关 5 题盘型计划 = shuffled([1,2,3,1,2])（≥2 种盘型，SPEC「ch4 生成关盘型轮换」）
   可解性构造（§0.50 核心，禁随机排列——3×3 奇偶性 50% 死局）：
     从完成态做 K 次随机合法滑动（禁立即回退防平凡抵消；终态=完成态重摇；
     终态=「完成态上块 m 与空格互换」（opt=1 模式）重摇——K 下限保证非平凡）。
     构造即证明可解：三角不等式 ⇒ 盘面到完成态最优步 opt ≤ K 恒成立（verify 侧
     BFS/IDA* 独立求解器对账）。q.path = 构造滑入序的块 id 反序 = 一条 K 步复原
     路（玩家解序参照，verify 重放对账）。
   引擎返回：'slide' 滑入未复原（题内推进）/ 'goal' 滑入且本题复原（本关继续）
     / 'done' 通关 / 'wig' 点非相邻块（轻微晃动拒绝，非错误零惩罚，仅计次不惩罚）
     / null 非法下标或关卡已结束 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章循环取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 盘型参数（W 列 × H 行；K=构造滑动步数带） */
const CH_PARAMS = {
  1: { W: 2, H: 2, kLo: 3,  kHi: 6 },
  2: { W: 3, H: 2, kLo: 6,  kHi: 12 },
  3: { W: 3, H: 3, kLo: 8, kHi: 12 }        /* 试玩P1 勘误：3×3 降难 12-20→8-12（5-6 岁空间工作记忆上限） */
};
/* 空格相邻位（上下左右） */
function neighborsOf(p, W, H) {
  const x = p % W, y = Math.floor(p / W), out = [];
  if (x > 0) out.push(p - 1);
  if (x < W - 1) out.push(p + 1);
  if (y > 0) out.push(p - W);
  if (y < H - 1) out.push(p + W);
  return out;
}
const isHome = (posOf, blank, n) => blank === n - 1 && posOf.every((p, id) => p === id);

/* ---------- 单题生成：K 次随机合法滑动构造（禁立即回退 + 终态防完成态/opt=1） */
function genOne(P, rnd) {
  const W = P.W, H = P.H, n = W * H;
  const K = ri(rnd, P.kLo, P.kHi);
  for (let attempt = 0; attempt < 40; attempt++) {
    const occ = Array.from({ length: n }, (_, p) => p < n - 1 ? p : -1);  // occ[pos]=块 id（-1=空格）
    let blank = n - 1, prev = -1;
    const path = [];                                                      // 构造序：每步滑入空格的块 id
    for (let k = 0; k < K; k++) {
      const cands = neighborsOf(blank, W, H).filter(p => p !== prev);     // 禁立即回退
      const pick = cands[Math.floor(rnd() * cands.length)];
      path.push(occ[pick]);
      occ[blank] = occ[pick]; occ[pick] = -1;
      prev = blank; blank = pick;
    }
    /* 终态=完成态（opt=0）重摇 */
    if (occ.every((id, p) => p === n - 1 ? id === -1 : id === p)) continue;
    /* 终态=完成态上块 m 与空格互换（opt=1 模式）重摇：blank===m 且 occ[n-1]===m 且其余归位 */
    const m1 = occ[n - 1];
    if (m1 >= 0 && blank === m1 &&
        occ.every((id, p) => p === n - 1 || p === m1 || id === p)) continue;
    const posOf = Array.from({ length: n - 1 }, (_, id) => occ.indexOf(id));
    path.reverse();                                       /* 存玩家复原解序（构造序反序）：
                                                             path[0]=初态第一步应滑入空格的块 id */
    return { W: W, H: H, K: K, posOf: posOf, blank: blank, path: path,
             moves: 0, wigs: 0, _answered: false };
  }
  return null;                                                            // 理论不可达（防御）
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   生成关（flat≥STATIC_LEVELS）：随机章参数 dch∈1-4（先取数保确定性） */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 13);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);
  /* 盘型计划：dch1-2 全同盘型；dch3 静态章全 3×3；生成关 dch3/dch4 每题轮换且去 3×3
     （试玩P1 勘误：3×3 超纲——shuffled [1,2,1,2,2] → 5 题 2×2/2×3 两种，rnd 消耗序列不变保确定性） */
  const isGen = flat >= STATIC_LEVELS;
  const plan = (dch === 4 || (dch === 3 && isGen)) ? shuffled([1, 2, 1, 2, 2], rnd) : [dch, dch, dch, dch, dch];
  const quizzes = plan.map(pi => genOne(CH_PARAMS[pi], rnd));
  return { flat: flat, ch: ch, dch: dch, lv: lv, plan: plan,
           quizzes: quizzes, step: 0, moveTot: 0, kTot: quizzes.reduce((s, q) => s + q.K, 0),
           done: false };
}

/* ---------- 滑块引擎（无 DOM）：engTap(L, i) —— 点块 id i */
function engTap(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  const n = q.W * q.H;
  if (!Number.isInteger(i) || i < 0 || i >= n - 1) return null;
  const pos = q.posOf[i], b = q.blank;
  const adj = Math.abs(pos % q.W - b % q.W) + Math.abs(Math.floor(pos / q.W) - Math.floor(b / q.W)) === 1;
  if (!adj) { q.wigs++; return 'wig'; }                   /* 非相邻：'wig' 拒绝（零惩罚仅计数） */
  q.posOf[i] = b; q.blank = pos;                          /* 滑入空格 */
  q.moves++; L.moveTot++;
  if (isHome(q.posOf, q.blank, n)) {                      /* 全块归位：本题复原（自动判定无提交） */
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'goal';
  }
  return 'slide';
}
const engWon = L => !!L && L.done;
/* 星级：试滑块数口径（SPEC §2：≤K+2=3★/≤2K=2★/>2K=1★，K=本关各题构造步数和
   kTot；wig 非错误不入口径——滑块款几乎无惩罚路径仅计数）。永不 0 星 */
const engStars = L => L.moveTot <= L.kTot + 2 ? 3 : (L.moveTot <= L.kTot * 2 ? 2 : 1);

/* ---------- IDA* 求解器（曼哈顿启发，独立于构造路径）：
   返回 { opt: 最优步数, first: 第一步应滑块 id } 或 null。
   用途①救援答案级（30s 无进展：下一步应滑块 breathe——单步提示非全解）
   用途②verify 对账（与 BFS 距离表交叉验证）。禁回退剪枝不影响最优性；
   bound 每次 +2（曼哈顿奇偶与步长奇偶一致） */
function solveStep(q) {
  const W = q.W, H = q.H, n = W * H;
  const pos = q.posOf.slice();                            // id -> pos（工作副本）
  const occ = Array.from({ length: n }, () => -1);        // pos -> id
  for (let id = 0; id < n - 1; id++) occ[pos[id]] = id;
  const manh = () => {
    let s = 0;
    for (let id = 0; id < n - 1; id++) {
      const p = pos[id];
      s += Math.abs(p % W - id % W) + Math.abs(Math.floor(p / W) - Math.floor(id / W));
    }
    return s;
  };
  let bound = manh(), steps = 0;
  let stack = [];
  const dfs = (b, g, prev) => {
    const hh = manh();
    if (hh === 0) { steps = g; return true; }
    if (g + hh > bound) return false;
    const cand = neighborsOf(b, W, H);
    for (let ci = 0; ci < cand.length; ci++) {
      const p = cand[ci];
      if (p === prev) continue;                           /* 禁回退剪枝 */
      const id = occ[p];
      occ[b] = id; occ[p] = -1; pos[id] = b;
      stack.push(id);
      if (dfs(p, g + 1, b)) return true;
      stack.pop();
      occ[p] = id; occ[b] = -1; pos[id] = p;
    }
    return false;
  };
  for (let it = 0; it < 48; it++) {
    stack = [];
    if (dfs(q.blank, 0, -1)) return { opt: steps, first: stack[0] };
    bound += 2;
  }
  return null;
}

/* ---------- 构造路径重放（verify 对账用）：玩家按 path 序滑入 → 应回完成态
   （q.path = 构造滑入序反序 = K 步复原路，构造即证明可解的运行时证据） */
function replayHome(q) {
  const W = q.W, n = q.W * q.H;
  const posOf = q.posOf.slice(), path = q.path.slice();
  let blank = q.blank;
  const pos0 = q.posOf.slice(), b0 = q.blank;             /* 快照（重放可还原） */
  let ok = true;
  for (let k = 0; k < path.length; k++) {
    const id = path[k], p = posOf[id];
    if (neighborsOf(blank, W, q.H).indexOf(p) < 0) { ok = false; break; }
    posOf[id] = blank; blank = p;
  }
  if (!isHome(posOf, blank, n)) ok = false;
  q.posOf = pos0; q.blank = b0;                           /* 还原现场 */
  return ok;
}

/* ---------- 结构校验（verify 用）：盘型合法、K 落带、posOf 互异且与 blank
   互补、初始非完成态、非 opt=1 模式、path 长=K、初态自洽。返回失败原因 */
function structWhy(q) {
  if (!q) return 'null';
  const P = Object.values(CH_PARAMS).find(p => p.W === q.W && p.H === q.H);
  if (!P) return 'board';
  const n = q.W * q.H;
  if (!Number.isInteger(q.K) || q.K < P.kLo || q.K > P.kHi) return 'Kband';
  if (!Array.isArray(q.posOf) || q.posOf.length !== n - 1) return 'posOfLen';
  const seen = {};
  for (let id = 0; id < n - 1; id++) {
    const p = q.posOf[id];
    if (!Number.isInteger(p) || p < 0 || p >= n) return 'posRange';
    if (p === q.blank) return 'posBlank';
    if (seen[p]) return 'posDup';
    seen[p] = 1;
  }
  if (!Number.isInteger(q.blank) || q.blank < 0 || q.blank >= n) return 'blankRange';
  if (isHome(q.posOf, q.blank, n)) return 'home';         /* 初始即完成态 */
  const occPos = {}; q.posOf.forEach((p, id) => { occPos[p] = id; });   /* pos -> id */
  for (let m = 0; m < n - 1; m++) {                       /* opt=1 模式：blank===m 且其余归位 */
    if (q.blank === m && occPos[n - 1] === m &&
        q.posOf.every((p, id) => id === m ? p === n - 1 : p === id)) return 'opt1';
  }
  if (!Array.isArray(q.path) || q.path.length !== q.K) return 'pathLen';
  if (q.moves !== 0 || q.wigs !== 0) return 'counters';
  if (q._answered) return 'answered';
  return null;
}
/* ================= slide 主逻辑（拼图盘渲染 / 滑块动画 / 教学 / 救援 / 推进）
   玩法：题面语音「把小兔子的照片拼好吧」，右侧小样恒可见（完成参照）。
   盘面恒正方形（块=网格等分矩形，全百分比布局，resize 免重排），点空格
   相邻块=滑入（left/top transition ≤200ms + sfx）；点非相邻块='wig' 轻晃
   + sli_wrong（零惩罚，1000ms 防重入窗）；全块归位=完整原图盖盘闪现
   + sli_right（自动判定无提交）；5 盘=1 关 celebrate。
   开场/交接语音走顺序链（queue 单通道）：hint（或 turn clip）→ 题面 TTS。
   救援两级（SPEC §2）：14s 方向级=重读题面+空格 pulse；30s 无进展答案级=
   IDA* 独立求解下一步应滑块 breathe（单步提示非全解）。
   验收钩子：window.SL = { get currentLevel, get quiz(){grid W,H,
   tiles[]({id,pos,goal}),blank,moves,step}, tapTile(i), start(flat),
   async autoSolve(), get tutorial }（getter 返回拷贝非活引用）；
   教学演示判对证据 window.__slDemoR（§0.27，verify 断言 'slide'）。 */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
/* 语音仅前 3 关（flat<3）；core 章/日/休息语音不受限 */
const sayP = (key, text) => { if (cur && cur.flat < 3) KIDS.voice.play(key, text); };
/* 救援/开场任务语音/读题不受 flat 门限制（§0.5） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错轻语音：flat<3 每次必播；flat≥3 走 10s 节流；force=豁免恰一次（===2 防变每次必播） */
let lastWrongVoice = 0;
const sayW = (key, text, force) => {
  if (!cur) return;
  if (cur.flat < 3) { KIDS.voice.play(key, text); return; }
  const now = Date.now();
  if (force || now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.play(key, text); }
};

const boardEl = $id('board'), miniArtEl = $id('mini-art'),
      rabbitBtn = $id('btn-rabbit'), replayBtn = $id('btn-replay'), hearBtn = $id('btn-hear'),
      ghostEl = $id('ghost');

let cur = null;                                 // 当前关模型（genLevel 产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
let actAt = Date.now(), dirAt = Date.now();     // 救援双钟：答案级 30s（仅有效滑动重置 §0.7a）/方向级 14s
let lastBlankHint = 0;                          // 点空白 10s 节流（§0.16）
let helpRedemo = false;

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const tileEl = id => boardEl.querySelector('.tile[data-id="' + id + '"]');
const blankEl = () => boardEl.querySelector('.blankcell');

/* ================= 静态构建 ================= */
function buildStatic() {
  $id('logo').innerHTML = ICONS.logo;
  replayBtn.innerHTML = ICONS.replay;
  hearBtn.innerHTML = ICONS.hear;
  rabbitBtn.innerHTML = KIDS.assets.rabbit('normal', 70);
  $id('mini').querySelector('.cap').innerHTML = ICONS.frame;
  ghostEl.innerHTML = ICONS.finger + '<div class="g-ripple"></div>';
}
/* 音效（Web Audio 合成）：滑入=短滑音双音 / wig=低柔单音 / 复原一题=叮咚 */
const chimeSlide = () => { if (!VERIFY) { KIDS.audio.note(620, 0.09, 0, 0.4); KIDS.audio.note(830, 0.13, 0.05, 0.45); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(500, 0.09, 0, 0.28); };
/* 吞输入可见回应（b21 沉淀③：轻叮必配 bump 微动效） */
function bumpBoard() {
  boardEl.classList.remove('bump'); void boardEl.offsetWidth; boardEl.classList.add('bump');
}

/* ================= 题面语音（读题 sayR 级不受 flat 门；T46 阶段2 clip 化=sli_q）
   开场/交接顺序链（§0.5/§0.6）：queue 单通道——hint（或 turn clip）播完接题面 */
function speakQuiz() { KIDS.voice.play(VOICE.quiz.key, VOICE.quiz.text); }
function openingSpeak(turn) {
  if (!cur || !cur.quizzes[cur.step]) return;
  KIDS.voice.queue([turn ? VOICE.turn.key : VOICE.hint.key, { key: 'sli_q', text: quizSpeech() }]);
}

/* ================= 渲染（全百分比布局：块=网格等分矩形，resize 免重排；
   .art 相对块恒静止——块内显示完整 SVG 图的对应区域，滑入=块 left/top 位移） */
function setTilePos(el, pos, q) {
  el.style.left = ((pos % q.W) * 100 / q.W) + '%';
  el.style.top = (Math.floor(pos / q.W) * 100 / q.H) + '%';
}
/* 盘面恒正方形：量 boardwrap 可用空间给 #board 设显式 px（子元素全 absolute
   不撑开父级，必须显式尺寸；tile 全百分比 → resize 重排仅此一处） */
function layoutBoard() {
  const wrap = $id('boardwrap');
  const S = Math.max(140, Math.floor(Math.min(wrap.offsetWidth, wrap.offsetHeight)) - 8);
  boardEl.style.width = S + 'px';
  boardEl.style.height = S + 'px';
}
function renderScene(q) {
  layoutBoard();
  boardEl.innerHTML = '';
  const art = PICS[picOf(cur.flat)];
  /* 空格软框（不可点，救援方向级 pulse 靶） */
  const bEl = document.createElement('div');
  bEl.className = 'blankcell pop';
  bEl.style.width = (100 / q.W) + '%'; bEl.style.height = (100 / q.H) + '%';
  setTilePos(bEl, q.blank, q);
  boardEl.appendChild(bEl);
  /* 拼图块（id 序，块上禁数字标号——图块纹理=线索，aria 无数字） */
  q.posOf.forEach((pos, id) => {
    const b = document.createElement('button');
    b.className = 'tile pop';
    b.dataset.id = id;
    b.setAttribute('aria-label', '照片拼图块');
    b.style.width = (100 / q.W) + '%'; b.style.height = (100 / q.H) + '%';
    b.style.animationDelay = (id * 60) + 'ms';
    const c = id % q.W, r = Math.floor(id / q.W);
    const a = document.createElement('div');
    a.className = 'art';
    a.style.width = (q.W * 100) + '%'; a.style.height = (q.H * 100) + '%';
    a.style.left = (-c * 100) + '%'; a.style.top = (-r * 100) + '%';
    a.innerHTML = art;
    b.appendChild(a);
    setTilePos(b, pos, q);
    boardEl.appendChild(b);
  });
  /* 完整原图盖盘层（本题复原闪现） */
  const rv = document.createElement('div');
  rv.id = 'reveal';
  rv.innerHTML = art;
  boardEl.appendChild(rv);
}
function moveBlankCell(q) {
  const b = blankEl();
  if (b) setTilePos(b, q.blank, q);
}
function revealShow() {
  const rv = boardEl.querySelector('#reveal');
  if (rv) { rv.classList.remove('show'); void rv.offsetWidth; rv.classList.add('show'); }
}
function pulseBlank() {
  const b = blankEl();
  if (b) { b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); }
}
function renderStep() {                                 // HUD 本关 5 题进度点
  const tray = $id('step-dots');
  tray.innerHTML = '';
  for (let k = 0; k < CH_LEN; k++) {
    const i = document.createElement('i');
    i.className = k < cur.step ? 'done' : (k === cur.step && !cur.done ? 'cur' : '');
    tray.appendChild(i);
  }
}
function renderDots() {                                 // 章节点（1 基，生成关循环章画到当前章）
  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };            // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);
    i.className = done ? 'done' : (c === cur.ch ? 'cur' : '');
    dots.appendChild(i);
  }
}
function renderMini() { miniArtEl.innerHTML = PICS[picOf(cur.flat)]; }
function renderQuiz(skipSpeak) {
  const q = cur.quizzes[cur.step];
  if (!q) return;
  renderScene(q);
  renderStep();
  if (!VERIFY && !state.demo && !state.quiet && !skipSpeak) speakQuiz();  /* 开场/换盘读题；demo 门防叠播；skipSpeak=已并入 queue（审查 M2） */
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800);
}
/* 教学"帮"阶段指向：当前盘下一步应滑块（IDA* 独立求解，非构造路径复读） */
function hintNextTile() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return null;
  const s = solveStep(q);
  return s ? tileEl(s.first) : null;
}
function pointHelpNext() {
  const el = hintNextTile();
  if (el) pointGhostAt(el);
}

/* ================= 滑块点选主路径（真实点击 / SL.tapTile / autoSolve / 教学演示共用）
   uiTapTile(i, demo)：locked 门拦真实输入（吞输入轻叮+bump §0.22/沉淀③）；demo 通道仅教学用 */
async function uiTapTile(i, demo) {
  if (!cur || (state.locked && !demo) || state.won || (state.demo && !demo)) {
    if (!demo) { sfx('pop'); bumpBoard(); }              /* 吞输入轻叮+可见回应（零静默） */
    return false;
  }
  const q = cur.quizzes[cur.step];
  if (!q) return false;
  const run = cur;                              /* 身份守卫：演出窗口内重玩会重建 cur，防旧续体错推进 */
  const r = engTap(cur, i);
  if (r === null) { if (!demo) { sfx('pop'); bumpBoard(); } return false; }
  const el = tileEl(i);

  if (r === 'wig') {                             /* 非相邻块：轻晃拒绝（非错误零惩罚，不计数入口径） */
    dodgeLo();
    sayW(VOICE.wrong.key, VOICE.wrong.text, q.wigs === 2);
    if (el) { el.classList.remove('wig', 'breathe'); void el.offsetWidth; el.classList.add('wig'); }
    state.locked = true;
    await wait(1000 * SPEED);                    /* 晃动防重入窗 1000ms（§0.27/§0.26） */
    if (cur !== run) return r;
    state.locked = false;                        /* 不灰化可重点（零惩罚） */
    return r;
  }

  /* ---- 滑入：块位移动画（≤200ms）→ （复原）完整图闪现 ---- */
  actAt = dirAt = Date.now();                    /* 仅有效滑动重置救援钟（§0.7a） */
  if (state.tut === 'help') {                    /* 教学"独"：首次滑入 → 强化反馈放手 */
    state.tut = 'solo';
    ghost.hide();
    dockHop();
  }
  state.locked = true;
  chimeSlide();
  if (el) { el.classList.remove('breathe', 'wig'); setTilePos(el, q.posOf[i], q); }
  moveBlankCell(q);
  await wait(210 * SPEED);                       /* 滑入动画 ≤200ms + 余量 */
  if (cur !== run) return r;
  if (r === 'slide') {                           /* 题内滑入未复原：不换盘继续 */
    state.locked = false;
    return r;
  }
  sfx('coin');                                   /* 本题复原：完整原图盖盘 + sli_right */
  revealShow();
  if (r === 'done') {
    sayR(VOICE.right.key, VOICE.right.text);     /* 末题无后续读题，直接播完 */
    await wait(950 * SPEED);
    if (cur !== run) return r;
    winFlow();
    return r;
  }
  KIDS.voice.queue([VOICE.right.key, { key: 'sli_q', text: quizSpeech() }]);  /* 审查 M2：奖励→读题 queue 接力，防 say 打断截尾 */
  await wait(1050 * SPEED);
  if (cur !== run) return r;
  state.locked = false;
  renderQuiz(true);                              /* 换盘：读题已并入 queue，跳过 */
  return r;
}

/* ================= 过关推进（celebrate → level.pass → 章末/日末） ================= */
function nextHint(flat) {
  const ci = Math.floor((flat == null ? cur.flat : flat) / CH_LEN);
  /* 章末预告=刚打完章的下一章（ci<4）；生成关用 GEN 文案（b21 沉淀②：hint[i]↔CHAPTERS[i+1]） */
  return ci < 4 ? CHAPTERS[ci + 1].hint : GEN_HINTS[(ci + 1) % 4];
}
function winFlow() {
  state.won = true;
  state.locked = true;
  ghost.hide();
  const stars = engStars(cur);
  sfx('win');
  if (VERIFY) return;                            // verify 页：引擎判定即止，不弹层不写档
  KIDS.ui.celebrate(stars).then(() => {
    const pr = KIDS.level.pass(cur.ch, cur.lv, stars, [0, 1, 2, 3, 4]);
    renderDots();
    const lim = KIDS.calendar.limit(Infinity);
    const dayDone = lim > 0 && KIDS.calendar.dayDone(keysUpTo(lim));
    if (pr.chapterDone) {
      const stars5 = [0, 1, 2, 3, 4].reduce((s, l) => s + KIDS.level.stars(cur.ch, l), 0);
      KIDS.ui.chapterEnd({ chapter: cur.ch, stars: stars5, nextHint: nextHint(cur.flat) });
      setTimeout(proceed, 3400);
    } else if (dayDone) {
      KIDS.ui.dayEnd({ nextHint: nextHint(null) });
      setTimeout(proceed, 3400);
    } else proceed();
  });
}
function proceed() {                             // 今日解锁范围内第一个未通关的关（含生成关）
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  for (let i = 0; i < lim; i++) {
    if (!sv.levels[keys[i]]) { startLevel(i); return; }
  }
  startLevel(cur ? cur.flat : 0);                // 全部完成：停留当前关可无限重玩
}

/* ================= 关卡加载 ================= */
function startLevel(flat) {
  ghost.hide();
  cur = genLevel(flat);
  state = { locked: false, won: false, demo: false, tut: 'none', quiet: true };
  helpRedemo = false;
  actAt = dirAt = Date.now();
  renderMini(); renderQuiz(); renderDots();
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  const freshTut = !VERIFY && flat === 0 && !sv.levels['1-0'] && !(sv.slide && sv.slide.tutSeen);
  if (VERIFY) { openingSpeak(); return; }        // verify 页恒走 openingSpeak（stub 记录开场链）
  if (freshTut) { tutorialWatch(); return; }
  state.quiet = false;
  openingSpeak();                                /* 开场任务语音+题面顺序链（§0.5） */
}

/* ================= 教学（仅关 1-0 首次，save.slide.tutSeen）：看→帮→独
   看=演示滑 1 块（幽灵手指点+滑动+「空格旁边的才能滑」）→
   帮=IDA* 指向下一应滑块；独=首次滑入放手（SPEC §2；watch ≤16s） ================= */
async function tutorialWatch() {
  state.demo = true; state.locked = true; state.tut = 'watch';
  sayR(VOICE.watch.key, VOICE.watch.text);
  await wait(700 * SPEED);
  const q = cur.quizzes[0];                      // flat0=ch1 2×2（确定性）
  const s0 = solveStep(q);                       // 演示块=IDA* 下一步应滑块（真实有效步）
  const i1 = s0 ? s0.first : q.path[0];
  KIDS.voice.play(VOICE.adj.key, VOICE.adj.text);   /* 演示规则句（T46 阶段2 clip 化） */
  pointGhostAt(tileEl(i1));
  await wait(1100 * SPEED);
  ghost.press();
  await wait(320 * SPEED);
  const demoR = await uiTapTile(i1, true);       // demo 通道豁免 locked（演示吞真实输入）——演示滑 1 块
  window.__slDemoR = demoR;                      /* 演示判对真实生效证据（§0.27，verify 断言 'slide'） */
  const sv = KIDS._save();                       // 真实页 save 恒非 null；verify 直驱跳过写档
  if (sv) {
    sv.slide = sv.slide || {};
    sv.slide.tutSeen = true;
    KIDS.store.persist();
  }
  /* 立即重发同关（确定性关卡，盘面一致），"你来拼一拼"在重发后的盘上说（照 batch5-21） */
  ghost.hide();
  cur = genLevel(0);
  state = { locked: false, won: false, demo: false, tut: 'help', quiet: true };
  helpRedemo = false;
  actAt = dirAt = Date.now();
  renderMini(); renderQuiz(); renderDots();
  state.quiet = false;
  openingSpeak(true);                            /* 交接顺序链：turn clip → 题面 TTS（queue 单通道） */
  setTimeout(() => { if (state.tut === 'help') pointHelpNext(); }, 600);
}

/* ================= 底栏与舞台交互 ================= */
function dockHop() {
  rabbitBtn.classList.remove('hop'); void rabbitBtn.offsetWidth; rabbitBtn.classList.add('hop');
}
rabbitBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur) return;
  dockHop();                                     /* 探索点击不重置救援钟（§0.7a） */
  if (state.locked || state.demo || state.won) { /* §0.20 三件门；点兔子=轻反馈不静默（§0.16） */
    sfx('pop');
    return;
  }
  sayP(VOICE.hint.key, VOICE.hint.text);
  pulseBlank();                                  /* 提示配空格高亮：方向级同款视觉（§0.15 救援视觉） */
});
replayBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur || state.locked || state.demo || state.won) return;   /* §0.20 教学/演出/通关期重玩门 */
  startLevel(cur.flat);
});
hearBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (VERIFY || !cur || state.locked || state.demo || state.won) return;
  actAt = Date.now();
  hearBtn.classList.remove('bounce'); void hearBtn.offsetWidth; hearBtn.classList.add('bounce');
  speakQuiz();                                   /* 再听一遍：题面整句重读 */
});
boardEl.addEventListener('pointerdown', e => {
  const p = e.target.closest('.tile');
  e.preventDefault();
  if (p) {                                       // 拼图块：主答路径
    uiTapTile(Number(p.dataset.id));             /* 吞输入轻叮+bump 在 uiTapTile 门内（§0.22/沉淀③） */
    return;
  }
  /* 空白/空格探索点击：10s 节流轻提示（§0.16）；不重置救援钟（§0.7a） */
  if (VERIFY || !cur) return;
  if (state.locked || state.won || state.demo) { sfx('pop'); bumpBoard(); return; }
  if (Date.now() - lastBlankHint > 10000) {
    lastBlankHint = Date.now();
    sayR(VOICE.hint.key, VOICE.hint.text);
    pulseBlank();
  }
});

/* ================= 无操作看护（SPEC §2 两级救援；§0.7a 双钟）
   方向级 14s：重读题面 + 空格 pulse（dirAt 重置，不拦答案级计时）
   答案级 30s 无有效进展：IDA* 下一步应滑块 breathe（单步提示非全解；actAt 重置）
   教学"帮"5s 重演示一次 ================= */
setInterval(() => {
  if (VERIFY || !cur || state.won || state.locked || state.demo) return;
  const q = cur.quizzes[cur.step];
  if (!q) return;
  const now = Date.now(), idleAct = now - actAt, idleDir = now - dirAt;
  if (idleAct > (q.W * q.H === 9 ? 20000 : 30000)) {  /* 答案级：3×3 盘 20s 快救（试玩P1），余 30s */
    sayR(VOICE.hint.key, VOICE.hint.text);
    pulseBlank();
    const el = hintNextTile();
    if (el) { el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe'); }
    actAt = dirAt = now;
    return;
  }
  if (idleDir > 14000) {                         /* 方向级：重读题面 + 空格 pulse + 应滑块描边（试玩P2） */
    speakQuiz();
    pulseBlank();
    const he = hintNextTile();
    if (he) { he.classList.remove('hintline'); void he.offsetWidth; he.classList.add('hintline');
      setTimeout(() => he.classList.remove('hintline'), 1300); }
    dirAt = now;
    return;
  }
  if (idleDir > 5000 && state.tut === 'help' && !helpRedemo && !ghostEl.classList.contains('show')) {
    helpRedemo = true;
    pointHelpNext();
  }
}, 1000);

/* ================= 启动（verify 分支由 game-verify.js 接管） ================= */
buildStatic();
if (!VERIFY) {
  KIDS.init({ game: 'slide', title: '滑块拼图' });
  const lim = KIDS.calendar.limit(Infinity), keys = keysUpTo(lim), sv = KIDS._save();
  let first = 0;
  for (let i = 0; i < lim; i++) { if (!sv.levels[keys[i]]) { first = i; break; } }
  if (lim > 0 && KIDS.calendar.dayDone(keys)) {  // 今日新关已玩完：收尾画面（可关闭继续重玩）
    KIDS.ui.dayEnd({ nextHint: nextHint(lim) });
    first = 0;
  }
  startLevel(first);
}

/* ================= 验收钩子（getter 模式，返回拷贝非活引用；b21 沉淀①start 必带） */
window.SL = {
  start(flat) { startLevel(flat); },                     /* 外部切关（verify 页/独立复验共用口径） */
  get currentLevel() {
    if (!cur) return null;
    return { flat: cur.flat, ch: cur.ch, dch: cur.dch, lv: cur.lv,
             n: cur.quizzes.length, plan: cur.plan.slice(), step: cur.step,
             moves: cur.moveTot, kTot: cur.kTot,
             wigs: cur.quizzes.reduce((s, q) => s + q.wigs, 0),
             done: cur.done, won: state.won };
  },
  get quiz() {
    if (!cur || cur.done) return null;
    const q = cur.quizzes[cur.step];
    if (!q) return null;
    return { grid: { W: q.W, H: q.H }, W: q.W, H: q.H, K: q.K,     /* SPEC §2 钩子契约 */
             tiles: q.posOf.map((pos, id) => ({ id: id, pos: pos, goal: id })),
             blank: q.blank, moves: q.moves, wigs: q.wigs, step: cur.step };
  },
  tapTile(i) { return uiTapTile(i); },
  async autoSolve() {                        // UI 路径自动点完当前关（逐盘沿构造复原路 K 步）
    let taps = 0, guard = 0, qi = -1, pi = 0;
    while (cur && !cur.done && guard++ < 200) {   // 5 盘 × K≤20 = 100 tap 上界，guard 200 余量
      if (cur.step !== qi) { qi = cur.step; pi = 0; }
      const q = cur.quizzes[qi];
      if (!q) break;
      const r = await uiTapTile(q.path[pi]);      /* path=构造序反序=K 步复原路（恒合法） */
      taps++;
      if (r === false || r === null) break;       // 锁死/重玩保护
      if (r === 'slide') pi++;
      /* goal/done → 换盘：下轮 step!==qi 重置 pi */
    }
    return { done: !!(cur && cur.done), taps: taps };
  },
  get tutorial() { return state.tut; }
};
/* ================= ?verify=1 自检（仅 verify 分支加载执行）

   ② tapTile 单元（flat0 真实 UI）：DOM 与引擎对账（tile 数=n-1、data-i 序、

   ②b sayW 三态（页面单元）：flat<3 每次 'wig' 必播 / flat≥3 10s 节流 /

   ②c 教学链单元：直调 tutorialWatch——watch clip → 演示滑 1 块（__slDemoR='slide'）
     →「空格旁边的，才能滑」→ 重发同关 → turn clip 接题面 TTS（queue 单通道）→

   ③ UI 冒烟 A：flat0 真实通路通关（含 1 次 wig=零惩罚 3★，verify 页不弹层）
   ④ UI 冒烟 B1：flat5（ch2）全 2×3 + SPEC 侧独立走法（BFS 贪心降距，不读引擎
     path）真实点击通关 3★；B2：flat10（ch3）全 3×3（8 块）+ autoSolve 3★；
     B3：flat15（ch4 盘型轮换 ≥2 种）+ autoSolve 3★
   ⑤ 布局：双 viewport（1280×800 / 800×1180）× flat{0,5,10,17}：tile=主答案 ≥64、

     注入 / quizSpeech SPEC 例句 / 开场顺序链 stub（queue 首段 sli_hint 接题面）/
