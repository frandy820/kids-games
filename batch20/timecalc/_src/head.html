<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>时间计算</title>
<style>
/* ================= 时间计算 timecalc（batch20·r16 难度改造）=================
   视觉按 SPEC-BATCH20 §1（承家族暖米底）：每题=题面句（关键词高亮可 pulse）+
   展示区（clock5/elapse/comp=SVG 时钟盘 / 星期题=七天日历条 / night=晚睡早起双牌 /
   sched=作息表）/4 张答案卡。孩子点选答案卡：对=绿框+celebrate+下一题；
   错=卡抖动零惩罚可重点（单选制）。
   竖屏双通道（r16 三件套）：@media (orientation:portrait) 与 body.port 类逐条等值——
   body.port 供 verify simView 在横屏视口内模拟竖屏（与 @media 双通道同步维护）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF3E4;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:40px;height:40px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 40px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E7D8C0;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E7D8C0}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:4px 10px}
#tip{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:#6E5F4E;flex:0 0 auto}
#tip .dot{width:10px;height:10px;border-radius:50%;background:#E8975A;flex:0 0 10px}
#tip.flash{animation:tip-flash .55s ease}
@keyframes tip-flash{0%,100%{background:none}40%{background:#F6E3C5;border-radius:10px}}
/* 题面关键词（方向级救援 pulse 目标）：橙色加粗 */
.kw{color:#D96C2C;font-weight:800}
.kw.pulse{animation:kw-pulse .5s ease 3}
@keyframes kw-pulse{0%,100%{background:none;border-radius:8px}
  40%{background:#F6C55A;border-radius:8px;transform:scale(1.12)}}

/* ---------- 展示区（时钟盘 / 七天日历条 / 晚睡早起双牌 / 作息表，四选一显示） ---------- */
#show-area{flex:0 0 auto;width:100%;max-width:1120px;display:flex;align-items:center;
  justify-content:center;min-height:150px}
#clock-box{width:196px;height:196px;border-radius:50%;background:#F6ECD9;border:3px solid #D9C5A6;
  box-shadow:0 4px 0 rgba(74,59,46,.12);display:none;align-items:center;justify-content:center;
  padding:10px;animation:show-in .4s ease both}
#clock-box.show{display:flex}
#clock-box svg{width:100%;height:100%}
#clock-box.pulse{animation:clock-pulse .55s ease 3}
@keyframes clock-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
/* 七天日历条：7 块日历卡（日..六），today/from/to 高亮+角标 */
#week-box{display:none;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:8px 10px;padding:10px 12px;border-radius:20px;background:#F6ECD9;border:2.5px solid #D9C5A6;
  box-shadow:0 3px 0 rgba(74,59,46,.12);animation:show-in .4s ease both}
#week-box.show{display:flex}
@keyframes show-in{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.wday{position:relative;width:64px;height:64px;border-radius:14px;background:#FFFAF0;
  border:2.5px solid #D9C5A6;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;transition:transform .15s}
.wday:active{transform:translateY(2px)}
.wday .wd-top{font-size:11px;font-weight:700;color:#C9A87C;line-height:1}
.wday .wd-n{font-size:27px;font-weight:800;color:#4A3B2E;line-height:1.1}
.wday .wd-tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:800;color:#FFF9EE;background:#E8975A;border-radius:8px;
  padding:1px 7px;line-height:1.5;display:none}
.wday.today{border-color:#E8975A;background:#FDEBD7;box-shadow:0 3px 0 rgba(232,151,90,.45)}
.wday.today .wd-tag{display:block}
.wday.from{border-color:#8A9BAE;background:#EDF2F7;filter:saturate(.5) opacity(.72)}   /* 审查 M1：出发日不算——降饱和传达「跳过它」 */
.wday.from .wd-tag{display:block;background:#8A9BAE}
.wday.to{border-color:#8FBF7F;background:#EDF5E3}
.wday.to .wd-tag{display:block;background:#7BA86B}
.wday.pulse{animation:wday-pulse .5s ease 3}
@keyframes wday-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
/* night 双时刻牌：晚睡（月）→ 早起（日） */
#night-box{display:none;align-items:center;justify-content:center;gap:14px;padding:12px 16px;
  border-radius:20px;background:#F6ECD9;border:2.5px solid #D9C5A6;
  box-shadow:0 3px 0 rgba(74,59,46,.12);animation:show-in .4s ease both}
#night-box.show{display:flex}
.ncard{width:132px;min-height:112px;border-radius:16px;background:#FFFAF0;border:2.5px solid #D9C5A6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px}
.ncard .n-big{font-size:24px;font-weight:800;color:#4A3B2E;line-height:1.1}
.ncard .n-sub{font-size:14px;font-weight:700;color:#C9A87C}
.n-arrow{font-size:20px;font-weight:800;color:#D96C2C;display:flex;flex-direction:column;
  align-items:center;gap:2px}
.n-arrow .n-mid{font-size:12px;color:#8A9BAE}
#night-box.pulse .ncard{animation:wday-pulse .5s ease 3}
/* sched 作息表（r16）：小表格——活动/开始/结束 三列；行可点朗读（主动学习） */
#sched-box{display:none;padding:10px 14px;border-radius:20px;background:#F6ECD9;
  border:2.5px solid #D9C5A6;box-shadow:0 3px 0 rgba(74,59,46,.12);animation:show-in .4s ease both}
#sched-box.show{display:block}
#sched-box table{border-collapse:collapse}
#sched-box th{font-size:13px;font-weight:800;color:#C9A87C;padding:4px 12px;line-height:1.4}
#sched-box .srow{display:table-row;background:#FFFAF0;border:2.5px solid #D9C5A6;transition:transform .15s}
#sched-box .srow:active{transform:translateY(2px)}
#sched-box .srow td{font-size:17px;font-weight:800;color:#4A3B2E;padding:9px 14px;text-align:center;
  height:46px;border:2px solid #E9DCC4;border-left:none;border-right:none}
#sched-box .srow td:first-child{border-left:2px solid #E9DCC4;border-radius:12px 0 0 12px;text-align:left}
#sched-box .srow td:last-child{border-right:2px solid #E9DCC4;border-radius:0 12px 12px 0}
#sched-box .srow td.c{color:#6E5F4E;font-weight:700}
#sched-box .srow.pulse{animation:srow-pulse .5s ease 3}
@keyframes srow-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- 候选卡池（4 张答案卡） ---------- */
#pool-area{flex:1 1 auto;min-height:120px;width:100%;max-width:1120px;display:flex;
  flex-direction:column;justify-content:center;gap:6px}
#card-pool{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:12px 14px;min-height:96px;padding:8px 10px;border-radius:20px;
  background:#F6ECD9;border:2.5px dashed #D9C5A6}
.card{position:relative;width:110px;height:88px;border-radius:18px;background:#FFFAF0;
  border:2.5px solid #4A3B2E;box-shadow:0 4px 0 rgba(74,59,46,.28);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;animation:card-in .4s cubic-bezier(.2,1.5,.4,1) both}
.card:nth-child(2n){animation-delay:.06s}.card:nth-child(3n){animation-delay:.12s}
@keyframes card-in{from{transform:scale(0) rotate(-14deg)}to{transform:scale(1) rotate(0)}}
.card:active{transform:translateY(3px)}
.card .cv{font-size:29px;font-weight:800;color:#4A3B2E;line-height:1}
.card.ok{border-color:#8FBF7F;background:#EDF5E3}
.card.wig{animation:card-wig .5s ease}
@keyframes card-wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  45%{transform:translateX(8px)}70%{transform:translateX(-5px)}90%{transform:translateX(3px)}}
.card.breathe{animation:card-breathe 1.6s ease-in-out infinite}
@keyframes card-breathe{0%,100%{transform:scale(1);box-shadow:0 4px 0 rgba(74,59,46,.28)}
  50%{transform:scale(1.12);box-shadow:0 4px 14px rgba(232,151,90,.85)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:88px;height:88px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:72px;height:72px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:80px;height:80px;border-radius:50%;background:#FFFAF0;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-hear svg{width:46px;height:46px}
#btn-hear.bounce{animation:hear-b .45s ease}
@keyframes hear-b{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFFAF0;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* ---------- 竖屏通道 A：@media（平板竖持）：答案卡/日历块仍 ≥64；时钟缩至 172 ---------- */
@media (orientation:portrait){
  .card{width:98px;height:80px}
  .card .cv{font-size:26px}
  #clock-box{width:172px;height:172px}
  .wday{width:64px;height:64px}
  .wday .wd-n{font-size:25px}
  #tip{font-size:15px}
  #week-box{gap:7px}
  #sched-box th{font-size:11px;padding:3px 9px}
  #sched-box .srow td{font-size:15px;padding:7px 10px;height:46px}
  .ncard{width:118px;min-height:100px}
  .ncard .n-big{font-size:21px}
}
/* ---------- 竖屏通道 B：body.port 类（verify simView 模拟竖屏——与上方 @media 逐条等值，双通道同步 r16） ---------- */
/*PORT-CLS*/
body.port .card{width:98px;height:80px}
body.port .card .cv{font-size:26px}
body.port #clock-box{width:172px;height:172px}
body.port .wday{width:64px;height:64px}
body.port .wday .wd-n{font-size:25px}
body.port #tip{font-size:15px}
body.port #week-box{gap:7px}
body.port #sched-box th{font-size:11px;padding:3px 9px}
body.port #sched-box .srow td{font-size:15px;padding:7px 10px;height:46px}
body.port .ncard{width:118px;min-height:100px}
body.port .ncard .n-big{font-size:21px}
/*PORT-CLS-END*/
</style>
</head>
<body>
<div id="game" aria-label="时间计算">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="tip" aria-label="题目"><span class="dot"></span><span id="tip-text"></span></div>
    <div id="show-area">
      <div id="clock-box" aria-label="时钟盘"></div>
      <div id="week-box" aria-label="日历条，点一日读一日"></div>
      <div id="night-box" aria-label="晚睡早起时间牌"></div>
      <div id="sched-box" aria-label="作息表，点一行读一行"></div>
    </div>
    <div id="pool-area">
      <div id="card-pool" aria-label="答案卡池"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="读一读题面"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
