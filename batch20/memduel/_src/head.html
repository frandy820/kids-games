<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记忆双背</title>
<style>
/* ================= 记忆双背 memduel（batch20 · r17 难度改造）=============
   视觉按 SPEC-BATCH20 §1-r17-memduel（承家族暖米底）：每题=三相位。展示期串卡
   逐个翻亮（语音同步读值词——数字/字母/颜色三素材）；遮盖期整排翻回背面「?」；
   延迟型（dx）插 3.8s 干扰窗（兔子 gapcall 呼唤+点小兔子）；作答期点底栏候选卡
   池按序拼出（正背=原序/倒背=逆序——dx 方向遮盖后才公布），拼满自动判定：
   对=卡排转绿+下一题；错=晃动+错位清空对位保留（零惩罚可重拼）。
   触摸目标：记忆卡/候选卡 ≥64、底栏按钮 ≥72 高；pointerdown 即响应。
   竖屏双通道（三件套）：@media (orientation:portrait) 与 body.port 类逐条等值——
   body.port 供 verify simView 在横屏视口内模拟竖屏（与 @media 双通道同步维护）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 52px;display:flex;align-items:center;padding:6px 60px 0 14px;gap:14px}
#logo{width:42px;height:42px;border-radius:12px;background:#E8975A;display:flex;align-items:center;
  justify-content:center;flex:0 0 42px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 10px}
/* 玩法提示条（点击=sayP hint 重听玩法，主动学习动作重置救援钟 §0.7a；
   展示文案与 §1-r17 明文同源：素材词+方向预告（dx 展示期不预告） */
#tip{min-height:56px;max-width:94%;padding:8px 26px;border-radius:30px;background:#FFF9EE;
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;
  justify-content:center;gap:12px;transition:transform .15s;flex:0 0 auto}
#tip.flash{animation:tip-b .5s ease}
@keyframes tip-b{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#tip-ico{flex:0 0 auto;display:flex;align-items:center}
#tip-text{font-size:clamp(18px,2.5vw,24px);font-weight:800;color:#4A3B2E;line-height:1.2;white-space:nowrap}

/* ---------- 记忆卡排（展示/遮盖/拼答同排）：宽 min(15vw,104px)×7+gap ≤94vw（800 竖屏走 @media 86px）
   尺寸链：卡 ≥96 高（§0.9 主展示目标），横竖屏均达标（verify ⑤ 量测门禁） ---------- */
#memo-area{flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;
  gap:clamp(8px,1.4vw,14px);padding:12px 16px;border-radius:24px;background:#F6ECD9;
  border:2.5px solid #D9C5A6;box-shadow:0 4px 0 rgba(74,59,46,.12);animation:map-in .4s ease both}
@keyframes map-in{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
#memo-area.ok{border-color:#6FA063;box-shadow:0 4px 0 #9CBF8C,0 0 22px rgba(143,191,127,.75)}
#bd-check{position:absolute;right:-16px;top:-18px;width:56px;height:56px;display:none;
  filter:drop-shadow(0 3px 0 #D8C9B4);z-index:5}
#memo-area.ok #bd-check{display:block;animation:bd-ok .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes bd-ok{0%{transform:scale(.3) rotate(-14deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
/* 记忆卡：默认背面（?）；.show=展示期翻亮；.filled=作答期已拼（值/色块+橙边）；
   点已拼卡=退回（改答零惩罚）；展示锁定=半透明 */
.mcard{position:relative;width:min(15vw,104px);height:min(19vw,132px);min-width:64px;min-height:96px;
  border-radius:18px;background:#FDF6E7;border:3px dashed #C9A87C;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(38px,7.5vw,62px);font-weight:900;line-height:1;color:#C9A87C;
  transition:transform .15s,border-color .2s,background .2s;cursor:pointer;
  animation:mcard-in .4s cubic-bezier(.2,1.5,.4,1) both}
.mcard:nth-child(2n){animation-delay:.06s}.mcard:nth-child(3n){animation-delay:.12s}
@keyframes mcard-in{from{transform:scale(0) rotate(-10deg)}to{transform:scale(1) rotate(0)}}
.mcard:active{transform:translateY(3px)}
.mcard .q{font-size:clamp(30px,5.6vw,46px)}
.mcard.show{border-style:solid;border-color:#4A3B2E;background:#FFF9EE;color:#4A3B2E;
  box-shadow:0 4px 0 rgba(74,59,46,.25)}
.mcard.filled{border-style:solid;border-color:#4A3B2E;background:#FFF3DC;color:#E8975A;
  box-shadow:0 4px 0 rgba(74,59,46,.25)}
.mcard.flip{animation:mcard-flip .38s cubic-bezier(.3,1.4,.5,1)}
@keyframes mcard-flip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(90deg) scale(1.07)}100%{transform:rotateY(0) scale(1)}}
#memo-area.wig{animation:memo-wig .5s ease}
@keyframes memo-wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  45%{transform:translateX(8px)}70%{transform:translateX(-5px)}90%{transform:translateX(3px)}}
#memo-area.okrow{animation:memo-ok .55s ease}
@keyframes memo-ok{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
#memo-area.ok .mcard.wave{animation:mcard-wave .6s ease both}
@keyframes mcard-wave{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px) scale(1.06)}}
.mcard.breathe{animation:mcard-b 1.6s ease-in-out infinite;z-index:2}
@keyframes mcard-b{0%,100%{transform:scale(1);box-shadow:0 4px 0 rgba(74,59,46,.25)}
  50%{transform:scale(1.07);box-shadow:0 4px 0 rgba(74,59,46,.25),0 0 18px rgba(232,151,90,.85)}}
#memo-area.showing .mcard{cursor:default}     /* 展示期不可点（引擎锁定，视觉同步） */
.mcard.nudge{animation:mcard-nudge .34s ease}
@keyframes mcard-nudge{0%{outline:7px solid #F5C445;outline-offset:0}
  100%{outline:7px solid transparent;outline-offset:10px}}

/* 色块面（颜色串素材：视觉记忆通道，无文字） */
.card .sw{width:44px;height:44px;border-radius:12px;border:2.5px solid #4A3B2E;
  box-shadow:0 3px 0 rgba(74,59,46,.22)}
.mcard .sw-m{width:56px;height:56px;border-radius:14px;border:3px solid #C9A87C}
.mcard.show .sw-m,.mcard.filled .sw-m{border-color:#4A3B2E}

/* ---------- 候选卡池（数字/字母/颜色三素材） ---------- */
#pool-area{flex:1 1 auto;min-height:120px;width:100%;max-width:1120px;display:flex;
  flex-direction:column;justify-content:center;gap:6px}
#card-pool{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;
  gap:12px 14px;min-height:84px;padding:8px 10px;border-radius:20px;
  background:#F6ECD9;border:2.5px dashed #D9C5A6}
#card-pool.locked .card{opacity:.45}          /* 展示/延迟期池锁定（视觉同步 §0.44/§1-r17） */
/* 候选大字卡；点后 .gone（入位）；救援 breathe、pulse 三连 */
.card{position:relative;width:min(10vw,76px);height:min(10vw,76px);min-width:64px;min-height:64px;
  border-radius:18px;background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 4px 0 rgba(74,59,46,.28);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;animation:card-in .4s cubic-bezier(.2,1.5,.4,1) both}
.card:nth-child(2n){animation-delay:.06s}.card:nth-child(3n){animation-delay:.12s}
@keyframes card-in{from{transform:scale(0) rotate(-14deg)}to{transform:scale(1) rotate(0)}}
.card:active{transform:translateY(3px)}
.card .cv{font-size:clamp(30px,4.8vw,38px);font-weight:900;color:#4A3B2E;line-height:1}
.card.gone{visibility:hidden;pointer-events:none}
.card.breathe{animation:card-breathe 1.6s ease-in-out infinite}
@keyframes card-breathe{0%,100%{transform:scale(1);box-shadow:0 4px 0 rgba(74,59,46,.28)}
  50%{transform:scale(1.12);box-shadow:0 4px 14px rgba(232,151,90,.85)}}
.card.pulse{animation:card-pulse .5s ease 3}
@keyframes card-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22) rotate(6deg)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px 12px;gap:12px}
#btn-rabbit{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:68px;height:68px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-rabbit.gapcall{animation:gap-call 1.1s ease-in-out infinite;box-shadow:0 4px 0 #E8975A,0 0 20px rgba(232,151,90,.8)}
@keyframes gap-call{0%,100%{transform:scale(1)}50%{transform:scale(1.1) rotate(-4deg)}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #DFCFB6;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #DFCFB6}
#btn-replay svg{width:42px;height:42px}

/* ---------- 幽灵手指教学（照家族） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* ---------- 竖屏通道 A：@media（平板竖持）：7 卡排不横溢（86px）；候选卡 66 仍 ≥64 ---------- */
@media (orientation:portrait){
  .mcard{width:min(12vw,86px);height:min(16vw,118px)}
  .card{width:66px;height:66px}
  .card .cv{font-size:30px}
  .card .sw{width:40px;height:40px}
  .mcard .sw-m{width:48px;height:48px}
  #pool-area{min-height:110px}
  #memo-area{gap:7px;padding:10px 12px}
}
/* ---------- 竖屏通道 B：body.port 类（verify simView 模拟竖屏——与上方 @media 逐条等值，双通道同步） ---------- */
/*PORT-CLS*/
body.port .mcard{width:min(12vw,86px);height:min(16vw,118px)}
body.port .card{width:66px;height:66px}
body.port .card .cv{font-size:30px}
body.port .card .sw{width:40px;height:40px}
body.port .mcard .sw-m{width:48px;height:48px}
body.port #pool-area{min-height:110px}
body.port #memo-area{gap:7px;padding:10px 12px}
/*PORT-CLS-END*/
</style>
</head>
<body>
<div id="game" aria-label="记忆双背">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="tip" aria-live="polite"><span id="tip-ico" aria-hidden="true"></span><span id="tip-text"></span></div>
    <div id="memo-area" aria-label="记忆卡排">
      <div id="bd-check" aria-hidden="true"></div>
    </div>
    <div id="pool-area">
      <div id="card-pool" aria-label="候选卡池"></div>
    </div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>
