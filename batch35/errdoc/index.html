<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>错题小医生</title>
<style>
/* ================= 错题小医生 errdoc（batch35·扩容批 5）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 错题病历三步诊（SPEC-BATCH35 §0.87/§3，7-8 岁元认知·错例诊断）：
   步1 找病灶（点三部位之一：0=左数/1=运算符/2=答案，b 不设部位——§0.87 定版）
   → 步2 开药（3 张药卡数字选 1：fix+fix±1/±10 邻近干扰）
   → 步3 归因（三选：没看清/算错啦/点太快——任何选择都接受，非惩罚）。
   三错型：ans=答案算错(病灶2)/num=数字抄错(病灶0)/op=符号看错(病灶1)。
   触摸目标：部位 ≥56×64、药卡 ≥96×72、归因键 ≥120×64；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 舞台：小诊所（病人兔子 + 病历卡 + 问句条 + 药/归因行） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}
#scene{flex:0 0 auto;position:relative;width:min(640px,94vw);border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F6E2BE 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:row;align-items:center;
  justify-content:center;gap:12px;padding:12px 16px}
#scene.bump{animation:ed-bump .22s ease}
@keyframes ed-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
#scene.wig{animation:ed-wig .5s ease}
@keyframes ed-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}
  50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}

/* 病人小兔子（治疗对象：normal 生病脸 / cured happy + 康复跳） */
#patient{flex:0 0 auto;width:104px;height:104px;border-radius:50%;background:#FFF9EE;
  border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4;display:flex;align-items:center;justify-content:center}
#patient svg{width:84px;height:84px}
#patient.cured{animation:ed-hop .5s cubic-bezier(.3,1.6,.5,1) 3}
@keyframes ed-hop{0%,100%{margin-bottom:0}50%{margin-bottom:14px}}

/* 病历卡：白卡 + 红十字角标 + 算式三部位（b 与 = 为纯展示不设部位） */
#chart{flex:1 1 auto;position:relative;min-height:150px;background:#FFFDF7;border:3px solid #4A3B2E;
  border-radius:18px;box-shadow:0 4px 0 #D8C9B4;padding:26px 18px 16px}
#chart.wig{animation:ed-wig .5s ease}
#chart-tag{position:absolute;left:12px;top:-14px;font-size:15px;font-weight:700;color:#fff;
  background:#D98A6A;border:2.5px solid #4A3B2E;border-radius:12px;padding:2px 12px;letter-spacing:.12em}
#eq{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap}
.part{min-width:64px;min-height:64px;padding:6px 10px;border-radius:14px;background:#FDF3DC;
  border:2.5px solid #4A3B2E;font-size:36px;font-weight:800;line-height:1;color:#4A3B2E;
  transition:transform .12s, box-shadow .2s}
.part.op{min-width:56px;font-size:34px;background:#FBE9CC}
.part:active{transform:translateY(3px)}
.eq-slot{font-size:36px;font-weight:800;color:#4A3B2E;padding:6px 4px}
/* 病灶红圈高亮（步1 点中） */
.part.lesion{border-color:#D95040;border-width:3.5px;box-shadow:0 0 0 5px rgba(217,80,64,.28);
  animation:ed-les .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes ed-les{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.part.shake, .pill.shake{animation:ed-shake .4s ease}
@keyframes ed-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
  50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.part.breathe, .pill.breathe, .why-btn.breathe{animation:ed-br 1.2s ease-in-out infinite}
@keyframes ed-br{0%,100%{box-shadow:0 0 0 0 rgba(232,151,90,0)}
  50%{box-shadow:0 0 0 7px rgba(232,151,90,.75)}}
/* 病灶提示泡（num/op 型：正确原数/正确符号；ans 型不出现） */
#bubble{position:absolute;left:50%;bottom:8px;transform:translate(-50%,10px);opacity:0;
  background:#FFF9EE;border:2.5px solid #4A3B2E;border-radius:14px;padding:4px 14px;
  font-size:17px;font-weight:700;color:#4A3B2E;box-shadow:0 3px 0 #D8C9B4;
  transition:opacity .3s, transform .3s;white-space:nowrap}
#bubble.show{opacity:1;transform:translate(-50%,0)}
/* 痊愈勾（步2 选对药：病历卡打勾） */
#stamp{position:absolute;right:10px;top:6px;width:52px;height:52px;border-radius:50%;
  background:#8FBF7F;border:3px solid #4A3B2E;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:900;color:#FFFDF7;opacity:0;transform:scale(.3) rotate(-20deg);
  transition:all .4s cubic-bezier(.2,1.8,.4,1)}
#chart.cured #stamp{opacity:1;transform:scale(1) rotate(0)}

/* 问句条（纯文字不播——题面恒静态 DOM 文字） */
#q-text{font-size:20px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4;flex:0 0 auto;align-self:center}

/* ---------- 药卡行（步2）/ 归因行（步3）：常驻 DOM，off 态只隐不删（可测可量） ---------- */
#pills, #why{flex:0 0 auto;display:flex;gap:14px;align-items:center;justify-content:center;
  transition:opacity .35s, transform .35s}
#pills.off, #why.off{opacity:0;pointer-events:none;transform:translateY(14px)}
#pills.wig, #why.wig{animation:ed-wig .5s ease}
.pill{position:relative;min-width:96px;min-height:72px;border-radius:36px;
  background:linear-gradient(180deg,#F5A96B 0%,#F5A96B 49%,#FBF7F0 51%,#FBF7F0 100%);
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #C9A87C;font-size:30px;font-weight:800;color:#4A3B2E;
  transition:transform .12s}
.pill:active{transform:translateY(3px)}
.pill.ok{background:linear-gradient(180deg,#9CCB8B 0%,#9CCB8B 49%,#FBF7F0 51%,#FBF7F0 100%);
  box-shadow:0 4px 0 #7BA96A}
.pill.dim{opacity:.45}
.why-btn{min-width:120px;min-height:64px;padding:6px 16px;border-radius:18px;background:#FFF9EE;
  border:2.5px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4;font-size:20px;font-weight:700;color:#4A3B2E;
  display:flex;align-items:center;gap:8px;transition:transform .12s}
.why-btn:active{transform:translateY(3px)}
.why-btn.pick{background:#FDEBD2;box-shadow:0 4px 0 #E8975A}
.why-btn svg{width:26px;height:26px;flex:0 0 26px}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:ed-dhop .45s ease 2}
@keyframes ed-dhop{0%,100%{margin-top:0}50%{margin-top:-14px}}

/* ---------- 幽灵手指教学（照 batch21-34） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .7s ease,top .7s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：舞台收紧，触摸面仍达标 */
@media (orientation:portrait){
  #scene{width:min(460px,96vw);flex-direction:column;gap:8px}
  #patient{width:84px;height:84px}
  #patient svg{width:68px;height:68px}
  .part{min-width:56px;min-height:56px;font-size:30px}
  .part.op{min-width:48px;font-size:28px}
  .eq-slot{font-size:30px}
  #q-text{font-size:17px;padding:3px 14px}
  .pill{min-width:84px;min-height:64px;font-size:26px}
  .why-btn{min-width:104px;min-height:58px;font-size:18px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="错题小医生">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="小诊所，生病的算式躺在病历卡上">
      <div id="patient" aria-hidden="true"></div>
      <div id="chart">
        <div id="chart-tag">病例卡</div>
        <div id="eq" aria-label="生病的算式：点一点不对劲的部位">
          <button class="part num" data-part="0" aria-label="左边的数"></button>
          <button class="part op" data-part="1" aria-label="运算符"></button>
          <span class="eq-slot" id="eq-b"></span>
          <span class="eq-slot">=</span>
          <button class="part num" data-part="2" aria-label="答案"></button>
        </div>
        <div id="bubble"></div>
        <div id="stamp" aria-hidden="true">✓</div>
      </div>
    </div>
    <div id="q-text"></div>
    <div id="pills" class="off" aria-label="药：选一张治好它"></div>
    <div id="why" class="off" aria-label="当时为什么错呀"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= errdoc 纯引擎：确定性关卡生成 + 三步诊判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 631)（本款常量 631，SPEC-BATCH35 §0.87 定版）：
   同 flat 永远同关（重玩一致、verify 可检）。
   章型（SPEC §0.87）：ch1=ans 20 内加减 / ch2=ans 表内乘法（fix≤20 域）/ ch3=num
   数字抄错 / ch4=混合三型（每题三型 seeded 取一）。静态关 flat0-14=QZ_BANK 静态表
   照录（同章各关同题同序）；flat15-19=ch4 构造；生成关 flat≥20 dch=ri(rnd,1,4)
   seeded 随机（b33 硬性②显式声明：域全档成立型）+按 dch 型构造公式生成新式
   （ans 加减=20 内新式（拒静态 ch1 sig）；ans 乘法=表内 fix≤20（拒 ch2 sig）；
   num=十几抄反 ab→ba 答案按 ba 算（拒 ch3 shown sig）；op=+/- 互换答案按错符算）。
   b34 坑③先验可满足性验算（2026-09-12 Python 等价模拟 flats 15-39）：
   生成器零空返回 / fix 恒 1-20 / dch 四档全现 {1:6,2:5,3:5,4:9} / dch4 合关三型
   全现（20-39 池化 {ans,num,op} 齐）/ 同关 5 题 sig 互异 ✓。
   quiz 结构：{ kind('errdoc' 恒), errType, shown{a,op,b,r}, orig{a,op,b}, fix,
   pills[3], phase('spot'|'fix'|'why'), _miss, _spotDone, _fixDone }
   miss 口径（b34 坑①）：步1 点正常部位与步2 选错药各计一次 miss——计数在本
   core 判定层；UI 层豁免窗 guard 在判定前拦且预判口径（i !== lesionOf(q) /
   q.pills[i] !== q.fix）与 core 判定严格同构。步3 归因不计 miss（非惩罚）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;
const calc = (a, op, b) => op === '+' ? a + b : (op === '-' ? a - b : a * b);
const reverse2 = n => (n % 10) * 10 + Math.floor(n / 10);    // 两位数抄反：13↔31
/* 病灶映射（SPEC §0.87 定版三部位）：ans=答案 2 / num=左数 0 / op=运算符 1 */
const LESION = { ans: 2, num: 0, op: 1 };
const lesionOf = q => LESION[q.errType];

/* ---------- 静态题库 15 题（SPEC §4 全表照录禁改；verify 双录对账）
   行结构：{ t 错型, a, op, b, r }（shown 四元）+ fix + num 型 origA（正确原数）
   ch1 ans 加减：原式算对答案错（|r-fix|≤2 邻近误算）；
   ch2 ans 乘法：表内 fix≤20；
   ch3 num 抄错：shown=按抄错数算对的完整式（shown.r=calc(shown.a,op,b) 恒成立），
   fix=按原题算——孩子须发现「数不对」而非「答案错」。 ---------- */
const QZ_BANK = {
  1: [ /* SPEC §4 ch1：①13-5=9→fix8 ②7+6=12→fix13 ③15-8=8→fix7 ④9+9=17→fix18 ⑤16-7=10→fix9 */
    { t: 'ans', a: 13, op: '-', b: 5, r: 9,  fix: 8 },
    { t: 'ans', a: 7,  op: '+', b: 6, r: 12, fix: 13 },
    { t: 'ans', a: 15, op: '-', b: 8, r: 8,  fix: 7 },
    { t: 'ans', a: 9,  op: '+', b: 9, r: 17, fix: 18 },
    { t: 'ans', a: 16, op: '-', b: 7, r: 10, fix: 9 }
  ],
  2: [ /* SPEC §4 ch2：①3×4=14→fix12 ②2×7=12→fix14 ③4×4=18→fix16 ④5×3=16→fix15 ⑤3×3=8→fix9 */
    { t: 'ans', a: 3, op: '×', b: 4, r: 14, fix: 12 },
    { t: 'ans', a: 2, op: '×', b: 7, r: 12, fix: 14 },
    { t: 'ans', a: 4, op: '×', b: 4, r: 18, fix: 16 },
    { t: 'ans', a: 5, op: '×', b: 3, r: 16, fix: 15 },
    { t: 'ans', a: 3, op: '×', b: 3, r: 8,  fix: 9 }
  ],
  3: [ /* SPEC §4 ch3：①原13-5=8→shown 31-5=26 ②原15+4=19→shown 51+4=55 ③原16-9=7→shown 61-9=52
           ④原12+6=18→shown 21+6=27 ⑤原13-9=4→shown 31-9=22（fix=按原题算） */
    { t: 'num', a: 31, op: '-', b: 5, r: 26, fix: 8,  origA: 13 },
    { t: 'num', a: 51, op: '+', b: 4, r: 55, fix: 19, origA: 15 },
    { t: 'num', a: 61, op: '-', b: 9, r: 52, fix: 7,  origA: 16 },
    { t: 'num', a: 21, op: '+', b: 6, r: 27, fix: 18, origA: 12 },
    { t: 'num', a: 31, op: '-', b: 9, r: 22, fix: 4,  origA: 13 }
  ]
};
/* 静态 sig 集（生成题「新式」拒撞域：同型不与静态表撞 + 同关内互异） */
const STATIC_SIGS = {
  A: {}, M: {}, N: {}
};
(function () {
  for (let i = 0; i < 5; i++) {
    const r1 = QZ_BANK[1][i], r2 = QZ_BANK[2][i], r3 = QZ_BANK[3][i];
    STATIC_SIGS.A[r1.a + r1.op + r1.b] = 1;
    STATIC_SIGS.M[r2.a + '×' + r2.b] = 1;
    STATIC_SIGS.N[r3.a + r3.op + r3.b] = 1;
  }
})();

/* ---------- 药卡构造（确定性，禁用 rnd——同题恒同药卡）：fix+两个干扰
   （d1=fix±10 邻近 / d2=fix±1 邻近，域 0-20 互异），轮转 k=(fix+a+b)%3 定序 ---------- */
function pillSet(fix, a, b) {
  const d1 = fix >= 10 ? fix - 10 : fix + 10;
  const d2 = fix % 2 === 0 ? fix - 1 : fix + 1;
  const base = [fix, d1, d2];
  const k = (fix + a + b) % 3;
  return base.slice(k).concat(base.slice(0, k));
}
/* 行 → quiz 组装（shown/orig/fix/pills/相位与 miss 态初始化） */
function mkQuiz(row) {
  const t = row.t;
  const orig = t === 'num' ? { a: row.origA, op: row.op, b: row.b }
             : t === 'op' ? { a: row.a, op: row.origOp, b: row.b }
             : { a: row.a, op: row.op, b: row.b };
  return { kind: 'errdoc', errType: t,
           shown: { a: row.a, op: row.op, b: row.b, r: row.r },
           orig: orig, fix: row.fix,
           pills: pillSet(row.fix, row.a, row.b),
           phase: 'spot', _miss: 0, _spotDone: false, _fixDone: false };
}

/* ---------- 生成构造器（确定性公式，SPEC §4 ch4 规则；拒绝式保新式+同关互异）
   ans 加减：a/b 域保证 fix 1-20、r=fix±1/±2 误算邻近；
   ans 乘法：a,b∈2-5 排 5×5（fix≤20 域）、r=fix±1/±2/±3；
   num：原数 12-19（抄反≠自身）抄反 ab→ba，答案按 ba 算对（加法限 a0+b≤20）；
   op：+/- 互换（原 + 需 a>b 使错式 9-6=3 形态成立；原 - 需 a+b≤20 卡面友好）。 ---------- */
function genAnsAdd(rnd, used) {
  for (let g = 0; g < 60; g++) {
    const op = rnd() < 0.5 ? '+' : '-';
    let a, b, fix;
    if (op === '+') { a = ri(rnd, 5, 15); b = ri(rnd, 2, 9); fix = a + b; if (fix > 20) continue; }
    else { a = ri(rnd, 9, 19); b = ri(rnd, 2, 8); fix = a - b; }
    if (fix < 1) continue;
    if (STATIC_SIGS.A[a + op + b] || used['A' + a + op + b]) continue;
    let r = fix + (rnd() < 0.5 ? -1 : 1) * ri(rnd, 1, 2);
    if (r < 0) r = fix + 2;
    used['A' + a + op + b] = 1;
    return { t: 'ans', a: a, op: op, b: b, r: r, fix: fix };
  }
  return null;
}
function genAnsMul(rnd, used) {
  for (let g = 0; g < 60; g++) {
    const a = ri(rnd, 2, 5), b = ri(rnd, 2, 5);
    if (a === 5 && b === 5) continue;                       // fix ≤ 20（SPEC：乘法章 fix≤20 域）
    if (STATIC_SIGS.M[a + '×' + b] || used['M' + a + '×' + b]) continue;
    const fix = a * b;
    let r = fix + (rnd() < 0.5 ? -1 : 1) * ri(rnd, 1, 3);
    if (r < 0) r = fix + 1;
    used['M' + a + '×' + b] = 1;
    return { t: 'ans', a: a, op: '×', b: b, r: r, fix: fix };
  }
  return null;
}
function genNum(rnd, used) {
  for (let g = 0; g < 60; g++) {
    const a0 = ri(rnd, 12, 19);                             // 原数十几（12-19 抄反≠自身）
    const op = rnd() < 0.5 ? '+' : '-';
    let b;
    if (op === '+') { b = ri(rnd, 1, 9); if (a0 + b > 20) continue; }
    else { b = ri(rnd, 2, 9); if (b >= a0) continue; }
    const ra = reverse2(a0);                                // 抄反 13→31
    if (STATIC_SIGS.N[ra + op + b] || used['N' + ra + op + b]) continue;
    used['N' + ra + op + b] = 1;
    return { t: 'num', a: ra, op: op, b: b,
             r: calc(ra, op, b), fix: calc(a0, op, b), origA: a0 };
  }
  return null;
}
function genOp(rnd, used) {
  for (let g = 0; g < 40; g++) {
    const origOp = rnd() < 0.5 ? '+' : '-';
    let a, b;
    if (origOp === '+') { a = ri(rnd, 6, 9); b = ri(rnd, 2, a - 1); }          // 错式 - 需 a>b
    else {
      a = ri(rnd, 8, 15);
      const hi = Math.min(9, a - 2, 20 - a);                                   // 错式 + 需 a+b≤20
      if (hi < 2) continue;
      b = ri(rnd, 2, hi);
    }
    const showOp = origOp === '+' ? '-' : '+';
    if (used['O' + a + showOp + b]) continue;
    used['O' + a + showOp + b] = 1;
    return { t: 'op', a: a, op: showOp, b: b,
             r: calc(a, showOp, b), fix: calc(a, origOp, b), origOp: origOp };
  }
  return null;
}
/* 手解安全网（genLevel 极端防御；先验模拟证明不可达——flats 15-39 零空返回） */
const GEN_FALLBACKS = {
  A: { t: 'ans', a: 14, op: '-', b: 6, r: 9,  fix: 8 },
  M: { t: 'ans', a: 4,  op: '×', b: 3, r: 13, fix: 12 },
  N: { t: 'num', a: 41, op: '-', b: 8, r: 33, fix: 6, origA: 14 },
  O: { t: 'op',  a: 8,  op: '+', b: 5, r: 13, fix: 3, origOp: '-' }
};
function genRow(dch, rnd, used) {
  let row = null;
  if (dch === 1) row = genAnsAdd(rnd, used);
  else if (dch === 2) row = genAnsMul(rnd, used);
  else if (dch === 3) row = genNum(rnd, used);
  else {                                    // dch4 混合：每题三型 seeded 取一（SPEC §4）
    const t = ['ans', 'num', 'op'][ri(rnd, 0, 2)];
    row = t === 'ans' ? genAnsAdd(rnd, used) : (t === 'num' ? genNum(rnd, used) : genOp(rnd, used));
  }
  if (row) return row;
  const fk = dch === 2 ? 'M' : (dch === 3 ? 'N' : (dch === 4 ? 'O' : 'A'));
  return GEN_FALLBACKS[fk];
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道）
   静态 flat0-14：QZ_BANK[dch] 照录同序；flat15-19=ch4 混合构造；
   生成关 flat≥20：dch=ri(rnd,1,4)（先取数保确定性）+按型构造新式。 ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 631);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  let quizzes;
  if (dch <= 3 && flat < STATIC_LEVELS) {
    quizzes = QZ_BANK[dch].map(mkQuiz);                      // 静态 15 题照录（同章各关同题同序）
  } else {
    const used = {};                                         // 同关互异 sig（静态 sig 已在各构造器内拒）
    quizzes = [];
    for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(mkQuiz(genRow(dch, rnd, used)));
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 三步诊引擎（无 DOM）
   engTapPart(L,i) 步1 点部位 i（0=左数/1=运算符/2=答案）：
     中病灶 'spot'（phase→'fix'）；正常部位 'wrong'（该题 miss+1=步1 计 miss）；
     null=关已结束/非 spot 相位/非法下标。
   engTapFix(L,i) 步2 点药卡 i：对 'fix'（phase→'why'）；错 'wrong'（miss+1）；
     null=非 fix 相位/越界。
   engTapWhy(L,i) 步3 归因三选（0/1/2 任何选择都接受，不计 miss）：
     末题步3 完 'done'（L.done）；否则 'why_done'（step++）；null=非 why 相位/越界。 ---------- */
function engTapPart(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.phase !== 'spot') return null;
  if (!Number.isInteger(i) || i < 0 || i > 2) return null;
  if (i === lesionOf(q)) {
    q._spotDone = true;
    q.phase = 'fix';
    return 'spot';
  }
  q._miss++;                                  /* miss 计数在 core 判定层（b34 坑①） */
  L.retries++;
  return 'wrong';
}
function engTapFix(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.phase !== 'fix') return null;
  if (!Number.isInteger(i) || i < 0 || i >= 3) return null;
  if (q.pills[i] === q.fix) {
    q._fixDone = true;
    q.phase = 'why';
    return 'fix';
  }
  q._miss++;                                  /* miss 计数在 core 判定层（b34 坑①） */
  L.retries++;
  return 'wrong';
}
function engTapWhy(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q.phase !== 'why') return null;
  if (!Number.isInteger(i) || i < 0 || i > 2) return null;
  L.step++;                                   /* 任何选择都接受（元认知自评无真值，非惩罚） */
  if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
  return 'why_done';
}
const engWon = L => !!L && L.done;
/* 星级（miss 口径：步1+步2 各计，累计 L.retries）：0 错 3★ / 1-2 错 2★ / ≥3 错 1★，永不 0★ */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));

/* ---------- TTS 段键（T46 化 2026-09-19：全式/提示句拆段 clip 拼播——零 keyless；
   eqTTS/hintTTS 整句 TTS 构造退役，verify 持独立 SPEC 副本对账）
   确认链尾段：[ed_n_a, ed_op_*, ed_n_b, ed_s_eq, ed_n_fix]（原 NUMCN[a]+op+NUMCN[b]+等于+NUMCN[fix]）；
   spot 提示尾段：[ed_s_here, ed_n_a | ed_op_*]（原「这里应该是」+正确原数/正确符号读法） ---------- */
const numClip = n => 'ed_n_' + n;
const OP_CLIP = { '+': 'ed_op_add', '-': 'ed_op_sub', '×': 'ed_op_mul' };
const opClip = op => OP_CLIP[op];
const eqParts = q => [numClip(q.orig.a), opClip(q.orig.op), numClip(q.orig.b), 'ed_s_eq', numClip(q.fix)];
const hintParts = q => ['ed_s_here', q.errType === 'num' ? numClip(q.orig.a) : opClip(q.orig.op)];
/* 提示泡卡面文案（阿拉伯数字/符号展示——与 TTS 中文读法分流） */
function hintShow(q) {
  return '这里应该是 ' + (q.errType === 'num' ? String(q.orig.a) : q.orig.op);
}
const pillIndexOf = q => q.pills.indexOf(q.fix);

/* ---------- 结构校验（verify 用，返回失败原因或 null）：三错型不变量逐条
   （num/op 型 shown 恒算术自洽=「数对/符错答案对」，ans 型算式对仅答案错且
   误算邻近；orig↔shown 抄反/互换互推；fix=calc(orig) 恒 ≤20；药卡邻近域） ---------- */
function structWhy(q) {
  if (!q || q.kind !== 'errdoc') return 'kind';
  if (['ans', 'num', 'op'].indexOf(q.errType) < 0) return 'errType';
  const s = q.shown, o = q.orig;
  if (!s || !Number.isInteger(s.a) || !Number.isInteger(s.b) || !Number.isInteger(s.r)) return 'shownInt';
  if (!OP_WORD[s.op]) return 'shownOp';
  if (!o || !Number.isInteger(o.a) || !Number.isInteger(o.b) || !OP_WORD[o.op]) return 'orig';
  if (!Number.isInteger(q.fix) || q.fix !== calc(o.a, o.op, o.b)) return 'fixCalc';
  if (q.fix < 1 || q.fix > 20) return 'fixRange';
  if (q.errType === 'num') {
    if (s.r !== calc(s.a, s.op, s.b)) return 'numR';            // 答案按抄错数算对
    if (reverse2(s.a) !== o.a || reverse2(o.a) !== s.a) return 'numRev';   // 十几抄反互推
    if (o.a < 12 || o.a > 19) return 'numTeen';
  } else if (q.errType === 'op') {
    if (s.r !== calc(s.a, s.op, s.b)) return 'opR';             // 答案按错符算对
    if (s.op === o.op) return 'opSwap';                         // +/- 互换（× 不入 op 型）
    if ((s.op !== '+' && s.op !== '-') || (o.op !== '+' && o.op !== '-')) return 'opDom';
    if (s.a !== o.a || s.b !== o.b) return 'opAb';
  } else {
    if (s.a !== o.a || s.op !== o.op || s.b !== o.b) return 'ansEq';   // 算式本身对
    if (s.r === q.fix) return 'ansR';                                  // 答案必须错
    if (s.r < 0 || Math.abs(s.r - q.fix) > 3) return 'ansNear';        // 误算邻近（静态≤2 生成≤3）
  }
  if (s.r < 0) return 'rNeg';
  if (!Array.isArray(q.pills) || q.pills.length !== 3) return 'pillsLen';
  if (q.pills.filter(v => v === q.fix).length !== 1) return 'pillsFix';
  const ds = q.pills.filter(v => v !== q.fix);
  if (ds[0] === ds[1]) return 'pillsDup';
  const near = [q.fix - 10, q.fix - 1, q.fix + 1, q.fix + 10];
  if (!ds.every(v => v >= 0 && near.indexOf(v) >= 0)) return 'pillsNear';
  if (q.phase !== 'spot' || q._miss !== 0 || q._spotDone || q._fixDone) return 'init';
  return null;
}
/* ================= errdoc 主逻辑（三步诊：找病灶 → 开药 → 归因）
   开题（presentQuiz）：病历卡入场 800ms 锁（题面恒静态 DOM 文字不 TTS——SPEC §3）→
   开放点选三部位（0=左数/1=运算符/2=答案；b 与 = 纯展示不设部位）。
   步1 中病灶（uiTapPart）：红圈高亮 .lesion+ed_spot 链（ans 型单 clip 窗 2900；
   num/op 型提示链 [ed_spot, ed_s_here, 数/符号段]（T46 化 3 段全 clip）窗 6450 ≥6432）+提示泡（num
   「这里应该是 13」/op「这里应该是 +」——ans 型无提示不泄 fix）→ 药卡行入场（phase
   已 'fix'）。
   步2 选对药（uiTapFix）：痊愈动画（病历卡打勾✓+小兔子康复跳）+确认链
   [ed_right, ed_n_a, ed_op_*, ed_n_b, ed_s_eq, ed_n_fix]（T46 化 6 段全 clip）窗 10200 ≥10146（家族 G/H/N）→ 归因
   行入场（phase 已 'why'）。
   步3 归因（uiTapWhy）：任何选择都接受（非惩罚不计 miss）+对应药方 clip 单发
   （窗 3050 ≥2964）→ 末题步3 完 'done' 通关 / 否则下一题。
   错路径（步1 点正常部位/步2 选错药同链同窗）：错链 [ed_wrong, ed_hint] 豁免窗
   5274=1656+150+3168+300 真时钟（契约 I/I 补：窗内错点吞 false 不计 miss/对选放行/
   窗后二错照计）+吞输入轻叮配 bump（家族 D）+梯度：首错方向级（整卡/药卡行 wiggle
   不指答案）/miss≥2 答案级（病灶部位/正确药卡 breathe）。
   救援（契约 B/K）：14s 方向级=当前相位活动区 wiggle（lastDir 独立节流锚）/
   30s 答案级=病灶部位或正确药卡 breathe；错链豁免窗让路；教学帮 5s 重演示。
   验收钩子：window.ED = { get currentLevel, get quiz{shown{a,op,b,r}, errType, fix,
   phase, step(全关题号 0-4——b33 坑①), miss}, get pills()(fix 阶段返回当前题药卡值
   数组·显示序数值型拷贝；spot/why 阶段/无题返回 null——复验定版 2026-09-12),
   tapPart(i), tapFix(i), tapWhy(i), start(flat), autoSolve() }——真实页同暴露（b29 坑⑥）。
   tapPart 返回：中病灶 'spot'（phase→'fix'）/正常部位 'wrong'/豁免窗内错点吞
   false /演出期·相位不符·越界 null。tapFix：对 'fix'（phase→'why'）/错 'wrong'/
   同上 null·false。tapWhy：恒 'why_done'（末题步3 完 'done'）。 */
'use strict';

const VERIFY = /[?&]verify=1/.test(location.search);
const $id = s => document.getElementById(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const SPEED = VERIFY ? 0.12 : 1;               // verify 页内 UI 演出提速
const sfx = n => { if (!VERIFY) KIDS.audio.sfx(n); };
const replayAnim = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
/* 救援/开场任务语音不受 flat 门限制（§0.5：不识字孩子 flat≥3 静置 14s 零救援） */
const sayR = (key, text) => { if (cur) KIDS.voice.play(key, text); };
/* 纠错链节流：flat<3 每错必播；flat≥3 走 10s 节流（契约 J：语义句全程保留，禁切通用 clip） */
let lastWrongVoice = 0;
let wrongChainUntil = 0;                         /* 错反馈链豁免窗终点（真时钟，救援 interval 让路——契约 I） */
const sayW = parts => {
  if (!cur) return false;
  if (cur.flat >= 0 && cur.flat < 3) { KIDS.voice.queue(parts); return true; }
  const now = Date.now();
  if (now - lastWrongVoice > 10000) { lastWrongVoice = now; KIDS.voice.queue(parts); return true; }
  return false;                            /* 节流未播返回 false——豁免窗仅链起播时设（契约 I「起播设」） */
};

const sceneEl = $id('scene'), chartEl = $id('chart'), eqEl = $id('eq'),
      eqBEl = $id('eq-b'), bubbleEl = $id('bubble'), patientEl = $id('patient'),
      qTextEl = $id('q-text'), pillsEl = $id('pills'), whyEl = $id('why'),
      rabbitBtn = $id('btn-rabbit'), ghostEl = $id('ghost'), stageEl = $id('stage');

let cur = null;                                 // 当前关模型（genLevel/教学迷你关产物，UI 与引擎共用）
let state = { locked: false, won: false, demo: false, tut: 'none', quiet: true, showUntil: 0 };
let lastAct = Date.now();                       /* 30s 答案级 idle 锚（方向级不得重置它——契约 B） */
let lastDir = Date.now();                       /* 14s 方向级独立节流锚（家族 B：与 lastAct 分离） */
let lastBlankHint = 0;                          // 点空白轻提示节流（§0.16，10s）
let helpRedemo = false;
let showRun = 0;                                // 演出令牌（重开关卡/新题中止在途）
let firstFlat = 0;                              // 启动首个未通关 flat（教学完成后进入）

const keyOf = i => (Math.floor(i / CH_LEN) + 1) + '-' + (i % CH_LEN);
const keysUpTo = lim => Array.from({ length: lim }, (_, i) => keyOf(i));
const partBtnAt = i => eqEl.querySelector('.part[data-part="' + i + '"]');
const pillBtnAt = i => pillsEl.querySelector('.pill[data-pill="' + i + '"]');
const whyBtnAt = i => whyEl.querySelector('.why-btn[data-why="' + i + '"]');

/* ================= 静态构建 ================= */
function buildStatic() {

/* 音效（Web Audio 合成，家族马林巴音色）：点中病灶=中音双跳 / 判对=双音上行+钱币 /
   答错=低柔单音 / 卡入场=轻叮 */
const chimeSpot = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.14, 0, 0.55); KIDS.audio.note(784, 0.22, 0.08, 0.5); } };
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };

/* ================= 渲染（渲染即引擎——契约 M 帧内容锚：部位/药卡文本与 quiz 真值同源） ================= */
function renderCard(q) {
  partBtnAt(0).textContent = String(q.shown.a);
  partBtnAt(1).textContent = OP_SHOW[q.shown.op];

  whyEl.innerHTML = '';

function renderStep() {                         // HUD 本关 5 题进度点

  const dots = $id('chapter-dots');
  dots.innerHTML = '';
  const sv = KIDS._save() || { levels: {} };     // verify 页 KIDS 未 init，空档兜底
  for (let c = 1; c <= Math.max(4, cur.ch); c++) {
    const i = document.createElement('i');
    const done = [0, 1, 2, 3, 4].every(l => sv.levels[c + '-' + l]);

function renderQuiz() {

/* ================= 开题演出：卡入场 800ms 锁 → 开放点选
   演出锁=真时钟 showUntil（tapPart 演出期返 null——测试驱动须轮询等可交互） ================= */
async function presentQuiz() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  renderQuiz();
  const run = cur, token = ++showRun;
  state.locked = true;
  state.showUntil = Date.now() + PRESENT_MS * SPEED + 140;   // 真时钟演出锁（余量）
  sfx('click');
  await wait(PRESENT_MS * SPEED);
  if (token !== showRun || cur !== run) return;
  state.locked = false;
  lastAct = Date.now();                          /* 演出完成开放点选（b25 M4：重置 idle 锚） */
  lastDir = Date.now();
}

/* ================= 幽灵手指（教学"帮"/演示共用） ================= */
const ghost = {
  toEl(el) { const r = el.getBoundingClientRect(); ghostEl.style.left = (r.left + r.width / 2) + 'px'; ghostEl.style.top = (r.top + r.height * 0.62) + 'px'; },
  show() { ghostEl.classList.add('show'); },
  press() { ghostEl.classList.remove('pressing'); void ghostEl.offsetWidth; ghostEl.classList.add('pressing'); },
  hide() { ghostEl.classList.remove('show', 'pressing'); }
};
function pointGhostAt(el) {
  if (VERIFY || !el) return;
  ghost.toEl(el);
  ghost.show();
  el.classList.remove('breathe'); void el.offsetWidth; el.classList.add('breathe');
  setTimeout(() => ghost.press(), 800 * SPEED);
}
/* 教学"帮"阶段指向（按相位）：spot=病灶部位 / fix=正确药卡 / why=归因首键
   （教学期泄答案=家族先例，帮→独后撤） */
function pointHelpNext() {
  const q = cur && cur.quizzes[cur.step];
  if (!q) return;
  if (q.phase === 'spot') { const i = lesionOf(q); pointGhostAt(partBtnAt(i)); }
  else if (q.phase === 'fix') pointGhostAt(pillBtnAt(pillIndexOf(q)));
  else pointGhostAt(whyBtnAt(0));
}

/* ================= 吞输入轻叮（家族 D：必配可见回应——诊所场景 bump 微动效） ================= */
function denyBump() { sfx('pop'); replayAnim(sceneEl, 'bump'); }

/* ================= 步1 找病灶（真实点击 / ED.tapPart / autoSolve / 教学演示共用）
   豁免窗 guard（I 补）在判定前拦，预判口径 i !== lesionOf(q) 与 core 判定严格同构（b34 坑①） ================= */
async function uiTapPart(i, demo) {
  if (!cur || state.won) { denyBump(); return null; }
  if (!demo && (state.locked || state.demo || Date.now() < state.showUntil)) { denyBump(); return null; }
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  if (!Number.isInteger(i) || i < 0 || i > 2) { denyBump(); return null; }   // 越界
  if (q.phase !== 'spot') { denyBump(); return null; }                       // 相位门（步1 已过）
  /* b31 家族 I 补口径：错链豁免窗（真时钟）内错点吞——pop+bump 不计 miss；
     对选放行（缓解吞输入急性子观察）；窗后第二错照常计 miss（miss≥2 梯度可达） */
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil && i !== lesionOf(q)) {
    denyBump(); return false;
  }
  const run = cur, token = showRun;              /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapPart(cur, i);
  if (r === null) { denyBump(); return null; }
  const el = partBtnAt(i);

  if (r === 'wrong') {                           /* 点了正常部位：摇头+错链+视觉梯度 */
    state.locked = true;
    state.showUntil = Date.now() + WROLL_MS * SPEED + 140;
    dodgeLo();
    if (el) replayAnim(el, 'shake');
    if (sayW([VOICE.wrong.key, VOICE.hint.key]))            /* 错链全 clip 无 keyless（契约 N） */
      wrongChainUntil = Date.now() + WRONG_CHAIN_WIN;      /* 链豁免：1656+150+3168+300=5274 真时钟（契约 I） */
    if (q._miss === 1) replayAnim(chartEl, 'wig');          /* 方向级：整卡 wiggle 不指病灶 */
    if (q._miss >= 2) {                                   /* miss≥2=病灶部位 breathe（答案级梯度） */
      const le = partBtnAt(lesionOf(q));
      if (le) replayAnim(le, 'breathe');
    }
    await wait(WROLL_MS * SPEED);
    if (cur !== run || token !== showRun) return r;
    state.locked = false;
    return r;
  }

  /* ---- spot（点中病灶：红圈+链+提示泡 → 药卡入场，phase 已 'fix'） ---- */
  lastAct = Date.now();                          /* 正确选择重置救援钟（§0.7a） */
  state.locked = true;
  const win = q.errType === 'ans' ? SPOT_WIN_ANS : SPOT_WIN_HINT;
  state.showUntil = Date.now() + win * SPEED + 140;
  const le = partBtnAt(lesionOf(q));
  if (le) le.classList.add('lesion');            // 病灶红圈高亮（契约 M 帧内容锚）
  chimeSpot();
  if (q.errType === 'ans') {
    KIDS.voice.queue([VOICE.spot.key]);          // ans 型单 clip（不泄 fix，孩子自己算）
  } else {
    bubbleEl.textContent = hintShow(q);          // 提示泡：这里应该是 13 / 这里应该是 +
    bubbleEl.classList.add('show');
    KIDS.voice.queue([VOICE.spot.key].concat(hintParts(q)));   // T46 化：spot+here+数/符号段 3 段全 clip——零 keyless
  }
  pillsEl.classList.remove('off');               // 药卡提前入场（窗内可见，锁内不可点）
  setQText('fix');
  await wait(win * SPEED);                       // 等 spot 链播完（家族 G/H/T）
  if (cur !== run || token !== showRun) return r;
  state.locked = false;
  lastAct = Date.now();
  if (state.tut === 'help') setTimeout(pointHelpNext, 400 * SPEED);   // 帮：转指正确药卡
  return r;                                      // 'spot'
}

/* ================= 步2 开药（3 张药卡选 1；豁免窗 guard 同构预判 q.pills[i] !== q.fix） ================= */
async function uiTapFix(i, demo) {
  if (!cur || state.won) { denyBump(); return null; }
  if (!demo && (state.locked || state.demo || Date.now() < state.showUntil)) { denyBump(); return null; }
  const q = cur.quizzes[cur.step];
  if (!q) return null;
  if (!Number.isInteger(i) || i < 0 || i >= 3) { denyBump(); return null; }
  if (q.phase !== 'fix') { denyBump(); return null; }                        // 相位门（步2 未开/已过）
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil && q.pills[i] !== q.fix) {
    denyBump(); return false;                                                // I 补：窗内错药吞
  }
  const run = cur, token = showRun;
  const r = engTapFix(cur, i);
  if (r === null) { denyBump(); return null; }
  const el = pillBtnAt(i);

  if (r === 'wrong') {                           /* 选错药：药卡摇头+错链+视觉梯度（步1/步2 同链同窗） */
    state.locked = true;
    state.showUntil = Date.now() + WROLL_MS * SPEED + 140;

  await phaseReady('fix');
  h0 = window.__queueHist.length;
  const r10c = await driveTap(() => window.ED.tapFix(pillIdxByFix(deriveFixV(qn))));
  const expEqKeys = ['ed_right', 'ed_n_' + deriveOrigA(qn), 'ed_op_' + deriveOrigOp(qn).replace('+', 'add').replace('-', 'sub').replace('×', 'mul'),
                     'ed_n_' + qn.shown.b, 'ed_s_eq', 'ed_n_' + deriveFixV(qn)];   // T46：6 段全键
  const confirmNum = r10c === 'fix' && window.__queueHist.slice(h0).some(h =>
    h.length === 6 && h.join('|') === expEqKeys.join('|') &&
    h.every(x => typeof x === 'string'));
  await phaseReady('why');
  /* rx 药方三选播对应 clip（连续三题各选 0/1/2） */
  const rxGot = [];
  for (let w = 0; w < 3; w++) {
    const rr = await driveTap(() => window.ED.tapWhy(w));
    if (rr !== 'why_done' && rr !== 'done') break;
    rxGot.push(window.__lastVoiceKey);
    if (w < 2) { await phaseReady('spot'); await driveTap(() => window.ED.tapPart(SPEC_LESION[window.ED.quiz.errType])); await phaseReady('fix'); await driveTap(() => window.ED.tapFix(pillIdxByFix(deriveFixV(window.ED.quiz)))); await phaseReady('why'); }
  }
  const rxOk = rxGot.length === 3 &&
    rxGot[0] === 'ed_rx_careful' && rxGot[1] === 'ed_rx_calc' && rxGot[2] === 'ed_rx_slow';
  /* op 型 spot 双段链（15-19 定位首题 op 型 flat；期望独立推导：这里应该是加/减） */
  let opFlat2 = -1;
  for (let f = 15; f < 20 && opFlat2 < 0; f++) {
    if (genLevel(f).quizzes[0].errType === 'op') opFlat2 = f;
  }
  let spotOp = false;
  if (opFlat2 >= 0) {
    startLevel(opFlat2);
    await phaseReady('spot');
    const qo = window.ED.quiz;
    const expHintOpKeys = ['ed_spot', 'ed_s_here', 'ed_op_' + deriveOrigOp(qo).replace('+', 'add').replace('-', 'sub').replace('×', 'mul')];
    h0 = window.__queueHist.length;
    const rOp = await driveTap(() => window.ED.tapPart(SPEC_LESION.op));
    spotOp = rOp === 'spot' && window.__queueHist.slice(h0).some(h =>
      h.length === 3 && h.join('|') === expHintOpKeys.join('|') &&
      h.every(x => typeof x === 'string'));   // T46：op 型提示链 3 段全键
  }
  const chainUnitOk = spotAns && spotNum && confirmNum && rxOk && spotOp;
  if (chainUnitOk) npass++;
  units.chains = { ok: chainUnitOk, spotAns: spotAns, spotNum: spotNum,
                   confirmNum: confirmNum, rx: rxGot, spotOp: spotOp, opFlat: opFlat2,
                   expEq: expEqNum, expHint: expHintNum };

  /* ---- ⑪ save：真实写档链（origLS 模式：测前保存、测后恢复——b34 坑②） ---- */
  total++;
  const origSave = window.__edOrig.save, origPersist = window.__edOrig.persist;
  const origLS = localStorage.getItem('kidsgame_errdoc');
  let saveOk = false, saveDetail = '';
  try {
    KIDS._save = origSave;                       // 还原真函数（init 用）
    KIDS.store.persist = origPersist;
    localStorage.removeItem('kidsgame_errdoc');
    KIDS.init({ game: 'errdoc', title: '错题小医生' });   // 真实 init：store.load 新档 v1.0
    startLevel(0);                               // verify 页 freshTut 恒 false → 直接开题
    const a11 = await window.ED.autoSolve();     // 真实判定链通关（5 题×三步=15 taps）→ persistWin
    const raw = localStorage.getItem('kidsgame_errdoc');
    const j = raw ? JSON.parse(raw) : null;
    saveOk = !!(a11.done && a11.taps === 15 && j && j.v === '1.0' && j.game === 'errdoc' &&
                j.levels && j.levels['1-0'] &&
                j.levels['1-0'].stars === 3 && j.levels['1-0'].plays === 1);
    if (!saveOk) saveDetail = JSON.stringify({ taps: a11.taps, raw: raw && raw.slice(0, 200) });
  } catch (err) {
    saveDetail = 'ERR ' + (err && err.message);
  }
  /* 清理：恢复原 localStorage（不污染真实存档）——U12 继续用真实函数 */
  if (origLS === null) localStorage.removeItem('kidsgame_errdoc');
  else localStorage.setItem('kidsgame_errdoc', origLS);
  if (saveOk) npass++;
  units.save = { ok: saveOk, detail: saveDetail };

  /* ---- ⑫ realPath：预置存档 v1.0+tutSeen → start(0) 非教学直达题面+window.ED 真实页暴露 ---- */
  total++;
  const today = new Date();
  const tstr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  const pre = { v: '1.0', game: 'errdoc', firstDay: tstr, lastDay: tstr, levels: {},
                dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 },
                restTip: { day: '', shown: 0 }, errdoc: { tutSeen: true } };
  localStorage.setItem('kidsgame_errdoc', JSON.stringify(pre));
  KIDS.store.load();                             // 重读预置档
  window.__edDemoR = null;                       // 教学实证清零（非教学路径不应重设）
  const hookOk = typeof window.ED === 'object' && typeof window.ED.tapPart === 'function' &&
                 typeof window.ED.tapFix === 'function' && typeof window.ED.tapWhy === 'function' &&
                 typeof window.ED.start === 'function' && typeof window.ED.autoSolve === 'function' &&
                 !!window.ED.currentLevel;                     // b29 坑⑥：真实页暴露（quiz 在关末合法为 null）
  window.ED.start(0);
  await unlocked();
  const q12 = window.ED.quiz;
  const realOk = hookOk && state.tut === 'none' && window.__edDemoR === null &&
                 q12 && q12.shown.a === SPEC_TUT_ROW[0] && q12.shown.op === SPEC_TUT_ROW[1] &&
                 q12.shown.b === SPEC_TUT_ROW[2] && q12.shown.r === SPEC_TUT_ROW[3] &&
                 q12.errType === SPEC_BANK[1].type && q12.fix === deriveFixV(q12) &&
                 q12.phase === 'spot' && q12.step === 0 && q12.miss === 0 &&
                 window.ED.currentLevel.flat === 0 && window.ED.currentLevel.n === 5 &&
                 (KIDS._save() || {}).v === '1.0';
  if (realOk) npass++;
  units.realPath = { ok: realOk, hook: hookOk, tut: state.tut,
                     quiz: q12 && { a: q12.shown.a, op: q12.shown.op, b: q12.shown.b,
                                    r: q12.shown.r, fix: q12.fix, phase: q12.phase } };
  /* 收尾清理：恢复原 localStorage + 沙盒 stub（防真实页误写） */
  if (origLS === null) localStorage.removeItem('kidsgame_errdoc');
  else localStorage.setItem('kidsgame_errdoc', origLS);
  KIDS._save = function () { return { levels: {} }; };
  KIDS.store.persist = function () {};

  const out = { game: 'errdoc', total: total, pass: npass, units: units };
  document.getElementById('verify-result').textContent = JSON.stringify(out);
  window.__edVlog = out;                          // 外部断言挂点（任务书钩子）
  document.title = (npass === total) ? 'VERIFY PASS ' + npass + '/' + total
                                     : 'VERIFY FAIL ' + npass + '/' + total;
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text 并留播报历史；voice.queue 记录拼播链（__lastQueue+
     __queueHist 全史——链断言用全史防覆盖） */
  window.__voiceHist = [];
  window.__queueHist = [];
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) {
    window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null;
    if (k) window.__voiceHist.push(k);
  };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    if (parts) window.__queueHist.push(parts);
    window.__lastVoiceKey = parts && parts.length
      ? (typeof parts[0] === 'string' ? parts[0] : parts[0].key) : null;
  };
  runVerify();
}

</script>
