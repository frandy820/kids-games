<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>轮流浇花</title>
<style>
/* ================= 轮流浇花 turntake（batch35·扩容批 5；2026-09-13 难度升级改造）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 花圃 3 盆花轮流浇水（渴度比较+排序判定层）：
   每回合三盆都有渴度梯度（t1 稍低土微干 / t2 低垂叶弯 / t3 垂地土裂+枯色），
   顶部双头像指示轮到谁（孩子头像亮=轮到你 / 兔子头像亮=轮到小兔子；ch1-2 另有大箭头）；
   孩子回合：ch1-2=点「最渴的」一盆（ch1 {1,1,3} 档差大 / ch2 {2,2,3} 档差细微）；
   ch3-4=按最渴→最不渴排序浇 3 步（点序错=wrong 不罚退已浇，miss≥2=应点花 breathe）；
   兔子回合=兔子走位浇水演出 1.2s，seeded 约 1/3 浇错——浇错开纠错回合
   （quiz.turn='k'+「小兔子浇错啦，帮帮它」，孩子点应点盆纠正；演出期点击=抢点温和提醒不罚）。
   回合序列 turnSeq：每关孩子回合恒 5、兔子 4-6；ch1-2 严格交替起 K；
   ch3-4 不规则 seeded（首 K、连续同方≤2）。渴度 seeded 相邻回合 argmax 互异。
   触摸目标：花盆按钮 ≥96×96（横竖双档核）；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 46px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:36px;height:36px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 36px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 轮到指示条：双头像 + 大箭头（ch1-2；ch3-4 .no-arrow 隐藏箭头，头像亮灯恒在） ---------- */
#turn-bar{flex:0 0 auto;position:relative;display:flex;justify-content:center;gap:56px;padding:4px 0 2px}
.who{display:flex;flex-direction:column;align-items:center;gap:2px;width:76px}
.who .avatar{width:54px;height:54px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  display:flex;align-items:center;justify-content:center;overflow:hidden;transition:all .25s}
.who .avatar svg{width:80%;height:80%}
.who .name{font-size:13px;font-weight:700;opacity:.5;transition:all .25s}
.who.active .avatar{box-shadow:0 0 0 5px rgba(232,151,90,.55);animation:tt-who .8s ease infinite alternate}
.who.active .name{opacity:1;color:#C4702F}
.who:not(.active) .avatar{filter:grayscale(.55);opacity:.55}
@keyframes tt-who{from{transform:scale(1)}to{transform:scale(1.07)}}
#turn-arrow{position:absolute;top:-31px;width:44px;height:38px;transform:translateX(-50%);
  pointer-events:none;transition:left .4s ease}
#turn-arrow svg{width:100%;height:100%;animation:tt-ar .7s ease infinite alternate}
@keyframes tt-ar{from{transform:translateY(0)}to{transform:translateY(5px)}}
#turn-arrow.at-k{left:calc(50% - 66px)}
#turn-arrow.at-r{left:calc(50% + 66px)}
#turn-bar.no-arrow #turn-arrow{display:none}

/* ---------- 舞台：花圃场景（主点选区）+ 题面句条 ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;overflow:hidden;padding:4px 12px}

/* 场景垫：暖色花园垫（草地+太阳+栅栏 SVG 铺底），3 盆花浮层 */
#scene{position:relative;flex:0 0 auto;width:min(460px,94vw,calc((100vh - 340px)*1.31));
  aspect-ratio:420/320;border-radius:24px;overflow:hidden;cursor:pointer;
  background:linear-gradient(180deg,#FDF3DC 0%,#F6E9C8 55%,#E9DCB4 100%);
  border:3px solid #4A3B2E;box-shadow:0 4px 0 #D8C9B4}
#scene.bump{animation:tt-bump .22s ease}
@keyframes tt-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
#bg-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* 花层：3 盆花恒全摆（每回合三盆都有渴度梯度 t1/t2/t3——姿态+土色双通道可辨） */
#flowers{position:absolute;left:3%;right:3%;bottom:5%;height:80%;display:flex;
  justify-content:space-between;align-items:flex-end;z-index:10}
.flower{position:relative;width:29%;height:100%;display:flex;align-items:flex-end;
  justify-content:center;transition:transform .15s}
.flower:active{transform:scale(.96)}
.flower svg.plant{width:100%;height:auto;transition:filter .6s;overflow:visible}
/* 渴度三档·姿态通道：t1 花头稍低 / t2 花头低垂叶弯 / t3 花头垂地+轻微枯色（三档角度差 ≥13deg 可辨） */
.flower [data-anim="head"]{transform-box:fill-box;transform-origin:50% 88%;transition:transform .6s ease}
.flower.t1 [data-anim="head"]{transform:rotate(11deg) translate(2px,4px)}
.flower.t2 [data-anim="head"]{transform:rotate(26deg) translate(5px,11px)}
.flower.t3 [data-anim="head"]{transform:rotate(44deg) translate(9px,22px) scale(.94)}
.flower .leaf{transform-box:fill-box;transition:transform .6s ease}
.flower.t1 .leaf-l{transform:rotate(-10deg)}
.flower.t1 .leaf-r{transform:rotate(10deg)}
.flower.t2 .leaf-l{transform:rotate(-24deg)}
.flower.t2 .leaf-r{transform:rotate(24deg)}
.flower.t3 .leaf-l{transform:rotate(-42deg)}
.flower.t3 .leaf-r{transform:rotate(42deg)}
.flower.t2 svg.plant{filter:saturate(.8)}
.flower.t3 svg.plant{filter:saturate(.55) brightness(.95)}
/* 渴度三档·土色通道：越渴土越浅发干；t3 裂纹显（.cracks 默认隐） */
.flower .soil{transition:fill .6s ease}
.flower.t1 .soil{fill:#936434}
.flower.t2 .soil{fill:#A1733F}
.flower.t3 .soil{fill:#B08450}
.flower .cracks{display:none}
.flower.t3 .cracks{display:block}
.flower.pop-in{animation:tt-pop .4s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes tt-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
/* 渴度水滴气泡（演出层锚：三盆都渴都挂——不单独标答案，判定材料=梯度本身） */
.drop{position:absolute;top:-7%;left:56%;width:38%;aspect-ratio:1;display:flex;align-items:center;
  justify-content:center;background:#FFF9EE;border:2.5px solid #4A3B2E;border-radius:50%;
  box-shadow:0 3px 0 #D8C9B4;animation:tt-dropb 1.6s ease-in-out infinite;z-index:5}
.drop svg{width:56%;height:56%}
@keyframes tt-dropb{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
/* 教学渴度圈注（仅教学演示期渲染：每盆挂 thirst 枚小水滴=1/2/3，教「比一比谁最渴」） */
.tbadge{position:absolute;top:-18%;left:6%;display:flex;gap:3px;z-index:6}
.tbadge i{width:13px;height:16px;background:#9CC6E8;border:2.5px solid #4A3B2E;
  border-radius:50% 50% 60% 60%;box-shadow:0 2px 0 #D8C9B4}
/* 反馈动效：pulse=方向级一轮（首错）/ breathe=答案级（miss≥2）/ wig=错点摇头 / watered=花开 */
.flower.pulse{animation:tt-pulse .95s ease 1}
@keyframes tt-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.flower.breathe{animation:tt-br 1.2s ease-in-out infinite}
@keyframes tt-br{0%,100%{filter:drop-shadow(0 0 0 rgba(232,151,90,0))}50%{filter:drop-shadow(0 0 13px rgba(232,151,90,.9))}}
.flower.wig{animation:tt-wig .4s ease}
@keyframes tt-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.flower.watered{animation:tt-bloom .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes tt-bloom{0%{transform:scale(1)}45%{transform:scale(1.15)}100%{transform:scale(1)}}

/* 浇水演出：水壶倾斜 + 水滴（孩子/兔子回合共用，JS 挂 #scene 顶部目标花上方） */
.can-wrap{position:absolute;top:9%;z-index:30;pointer-events:none;width:21%;
  transform:translateX(-50%)}
.can-wrap .can{width:100%;animation:tt-tilt 1.4s ease-in-out}
@keyframes tt-tilt{0%,15%{transform:rotate(0)}45%,80%{transform:rotate(-26deg)}100%{transform:rotate(0)}}
.can-wrap i{position:absolute;bottom:-6px;left:30%;width:7px;height:11px;opacity:0;
  border-radius:50% 50% 60% 60%;background:#7FB3D5;animation:tt-drip 1.15s ease-in infinite}
.can-wrap i:nth-child(2){left:46%;animation-delay:.18s}
.can-wrap i:nth-child(3){left:62%;animation-delay:.36s}
.can-wrap i:nth-child(4){left:54%;animation-delay:.55s}
@keyframes tt-drip{0%{opacity:0;transform:translateY(0)}25%{opacity:.95}100%{opacity:0;transform:translateY(70px)}}

/* 兔子走位（兔子回合演出：从场边走到目标花旁浇水——1.2s=走位 500+浇水 700，缩短无效等待） */
.bunny-g{position:absolute;bottom:3%;left:-22%;width:17%;z-index:8;pointer-events:none;opacity:0;
  transition:left .45s ease,opacity .3s ease}
.bunny-g.show{opacity:1}
.bunny-g.hop{animation:tt-bhop .5s ease 3}
@keyframes tt-bhop{0%,100%{margin-bottom:0}50%{margin-bottom:8px}}
.bunny-g .bsvg{width:100%;height:auto}
.bunny-g .mini-can{position:absolute;right:-16%;top:6%;width:62%;transform:rotate(-18deg)}

/* 题面句条 */
#qbar{flex:0 0 auto;max-width:94vw}
#qbar .q-text{font-size:21px;font-weight:700;padding:3px 18px;border-radius:14px;
  background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}
#qbar.jump{animation:tt-qjump .5s ease 2}
@keyframes tt-qjump{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:bun-hop .45s ease 2}
@keyframes bun-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#btn-replay{width:72px;height:72px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-replay svg{width:42px;height:42px}
#btn-hear{width:84px;height:84px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-hear:active{transform:translateY(3px);box-shadow:0 1px 0 #D8C9B4}
#btn-hear svg{width:48px;height:48px}
#btn-hear.bounce{animation:tt-hearb .45s ease}
@keyframes tt-hearb{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ---------- 幽灵手指教学（照 batch21-34） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：场景收紧，花盆仍 ≥96×96 */
@media (orientation:portrait){
  #scene{width:min(400px,94vw)}
  #qbar .q-text{font-size:18px;padding:3px 14px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="轮流浇花">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="turn-bar" aria-label="轮到谁">
    <div id="turn-arrow" aria-hidden="true"></div>
    <div class="who who-k" data-side="k"><div class="avatar"></div><div class="name">你</div></div>
    <div class="who who-r" data-side="r"><div class="avatar"></div><div class="name">小兔子</div></div>
  </div>
  <div id="stage">
    <div id="scene" aria-label="花圃，点空白再听一遍">
      <svg id="bg-svg" viewBox="0 0 420 320" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="flowers" aria-label="三盆花"></div>
    </div>
    <div id="qbar"><div class="q-text"></div></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子"></button>
    <button id="btn-hear" aria-label="再听一遍"></button>
    <button id="btn-replay" aria-label="再玩一次"></button>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

/* ================= turntake 纯引擎：确定性回合序列生成 + 渴度梯度分配 + 兔子对错 + 点花判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 419)（本款常量 turntake=419，SPEC-BATCH35 §0.85 定版）：
   同 flat 永远同关（重玩一致、verify 可检）。
   回合序列 turnSeq（§0.85 数学先验，封闭域已验算——2026-09-13 改造沿用不动）：
     每关孩子回合恒 5（=5 题），兔子回合 4-6；
     dch1-2 = 严格交替 [K,R]*4+[K]（K,R,K,R,K,R,K,R,K——§0.85 括注枚举，末题=孩子）；
     dch3-4 = 不规则 seeded 构造：基架内空位 4 各 1 基座 R + 尾空位 0，额外 R m=ri(rnd,0,2)
       插入 5 空位（每空 ≤1 额外→连 2 R 可达、连 3 禁）。
   渴度梯度（2026-09-13 改造核心）：每回合 3 盆 thirsts∈{1,2,3}^3 seeded——
     dch1 多重集 {1,1,3}（档差大）/ dch2 {2,2,3}（档差细微，相邻档）/
     dch3-4 shuffled([1,2,3])（三盆互异=可排序）；最渴恒唯一；
     相邻回合 argmax 互异（重掷 ≤8 兜底：dch≤2 换 pos / dch≥3 换 perm，仍同则确定性回退）。
   兔子回合实质化：rabbitWrong=ri(rnd,1,3)===1（seeded 约 1/3 浇错）；浇错时 rabbitPos=
     非 argmax 两盆（升序）中 ri(rnd,0,1) 选一；浇对时 rabbitPos=argmax。纠错回合=UI 层
     置 q._fix=true（quiz.turn 报 'k'），孩子点 target 纠正='right' 推进（不计题号 step）。
   铁律：3 盆花恒全摆；孩子回合答对才推进（错不罚可重选，排序错不罚退已浇）；
     兔子演出期引擎层恒 'wait'（抢点不罚不计 miss——社交学习低挫败定版）。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 回合序列（dch≤2 严格交替定版串；dch≥3 seeded 不规则构造，见头注验算式）
   取数序（verify 独立复算同构锚）：dch≥3 时 nR=ri(4,6) → m=nR-4>0 时 shuffled([0,1,2,3,4]) 取前 m
   作额外 R 空位；dch≤2 零取数。 ---------- */
function turnSeqOf(dch, rnd) {
  if (dch <= 2) return ['k', 'r', 'k', 'r', 'k', 'r', 'k', 'r', 'k'];
  const nR = ri(rnd, 4, 6);                       // 兔子回合 4-6（§0.85）
  const slots = [1, 1, 1, 1, 0];                  // 5 空位：4 内空位基座 1 + 尾空位基座 0
  const m = nR - 4;                               // 额外 R 数 0-2
  if (m > 0) {
    const pick = shuffled([0, 1, 2, 3, 4], rnd).slice(0, m);
    for (let s = 0; s < pick.length; s++) slots[pick[s]]++;
  }
  const seq = [];
  for (let k = 0; k < 5; k++) {                   // 5 个孩子回合（恒定）
    seq.push('k');
    for (let r = 0; r < slots[k]; r++) seq.push('r');
  }
  return seq;
}

/* ---------- 渴度三元组（章型定版：dch1 {1,1,3} 档差大 / dch2 {2,2,3} 档差细微 /
   dch≥3 shuffled([1,2,3]) 三盆互异；argmax 与 prevArg 相同重掷 ≤8，兜底确定性回退）
   取数序（verify 独立复算同构锚）：dch≤2 先 ri(0,2) 掷 pos（相邻同则重掷）；dch≥3 整组掷 perm。 ---------- */
function thirstsOf(dch, rnd, prevArg) {
  if (dch <= 2) {
    let pos = ri(rnd, 0, 2), g = 0;
    while (pos === prevArg && g++ < 8) pos = ri(rnd, 0, 2);
    if (pos === prevArg) pos = (prevArg + 1) % 3; // 兜底换花（3 花域恒可满足）
    const lo = dch === 1 ? 1 : 2;
    const th = [lo, lo, lo]; th[pos] = 3;
    return th;
  }
  let th = shuffled([1, 2, 3], rnd), g = 0;
  while (argmaxOf(th) === prevArg && g++ < 8) th = shuffled([1, 2, 3], rnd);
  if (argmaxOf(th) === prevArg) th = [th[1], th[2], th[0]];   // 兜底左旋（3 必换位→argmax 必变）
  return th;
}
const argmaxOf = t => { let b = 0; for (let i = 1; i < t.length; i++) if (t[i] > t[b]) b = i; return b; };

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关随机章参数）
   取数序：dch（flat≥20 时 ri(1,4) 先取保确定性）→ turnSeqOf → 逐回合 thirstsOf →（r 回合）
   rabbitWrong=ri(1,3)===1 → 浇错时 wrongPos=ri(0,1)（非 argmax 两盆升序中选一） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 419);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数
  const seq = turnSeqOf(dch, rnd);
  const turns = [];
  let prevArg = -1;
  for (let t = 0; t < seq.length; t++) {
    const thirsts = thirstsOf(dch, rnd, prevArg);
    const arg = argmaxOf(thirsts);
    let rabbitWrong = false, rabbitPos = arg;
    if (seq[t] === 'r') {
      rabbitWrong = ri(rnd, 1, 3) === 1;                     // seeded 约 1/3 浇错
      if (rabbitWrong) {
        const others = [0, 1, 2].filter(j => j !== arg);     // 非 argmax 两盆（升序）
        rabbitPos = others[ri(rnd, 0, 1)];
      }
    }
    prevArg = arg;
    turns.push({ turn: seq[t], thirsts: thirsts, watered: [false, false, false],
                 rabbitWrong: rabbitWrong, rabbitPos: rabbitPos,
                 _miss: 0, _waitSaid: false, _answered: false, _fix: false, _taps: 0 });
  }
  return { flat: flat, ch: ch, dch: dch, lv: lv, turns: turns,
           turnIdx: 0, step: 0, retries: 0, done: false };
}

/* ---------- 当前应点盆（verify 独立复核锚）：未浇盆中渴度最大者
   （ch1-2/纠错=thirst 最大者；ch3-4=剩余未浇中最渴者；水过的盆渴度视 0 不再入选） ---------- */
function engTarget(L) {
  if (!L || L.done) return -1;
  const q = L.turns[L.turnIdx];
  if (!q) return -1;
  let best = -1;
  for (let i = 0; i < 3; i++)
    if (!q.watered[i] && (best < 0 || q.thirsts[i] > q.thirsts[best])) best = i;
  return best;
}

/* ---------- 点花引擎（无 DOM）：engTapFlower(L, i) —— 点第 i 盆花（0-2）
   'right'  孩子有效回合（题面或兔子纠错）点中当前应点盆：
            排序中间步（dch≥3 孩子题 _taps<3）不推进仅记浇；
            回合收口（排序末步/单步题/纠错步）推进 turnIdx（纠错不计题号 step）
   'done'   该次点击收口了最后一回合=通关（ch1-2 末题=孩子；ch3-4 尾随 R 由 engAdvance 收口）
   'wrong'  孩子有效回合点非应点盆：该回合 miss+1（retries 全关累计=星级口径），
            排序错不罚退已浇（watered 保留可续点）
   'wait'   兔子演出期（未开纠错）任意点=抢点（不罚不计 miss；每回合提醒 1 次由 UI 层承载）
   null     非法下标或关卡已结束 ---------- */
function engTapFlower(L, i) {
  if (!L || L.done) return null;
  const q = L.turns[L.turnIdx];
  if (!q) return null;
  const kidNow = q.turn === 'k' || q._fix;         // 纠错回合（_fix）视孩子有效回合
  if (!kidNow) return 'wait';                      // 兔子演出期抢点（引擎层恒 wait）
  if (!Number.isInteger(i) || i < 0 || i >= 3) return null;
  if (i === engTarget(L)) {
    q.watered[i] = true;
    const need = (L.dch >= 3 && q.turn === 'k') ? 3 : 1;   // 排序题=3 步；单步题/纠错=1 步
    q._taps++;
    if (q._taps >= need) {
      q._answered = true;
      if (!q._fix) L.step++;                       // 题号=孩子题收口（纠错不计——b33 坑①口径）
      L.turnIdx++;
      if (L.turnIdx >= L.turns.length) { L.done = true; return 'done'; }
      return 'right';
    }
    return 'right';                                // 排序中间步（UI 走短确认窗）
  }
  q._miss++;
  L.retries++;                                     // 星级口径：孩子有效回合点非应点盆
  return 'wrong';
}

/* ---------- 回合推进（兔子回合演出完成由 UI 调用——浇错回合先经纠错再推进；
   孩子回合点中在 engTapFlower 内联推进）
   'done'=通关 / 'k'|'r'=下一回合方 ---------- */
function engAdvance(L) {
  if (!L || L.done) return null;
  L.turnIdx++;
  if (L.turnIdx >= L.turns.length) { L.done = true; return 'done'; }
  return L.turns[L.turnIdx].turn;
}
const engWon = L => !!L && L.done;
/* 星级口径：全关错选 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星（抢点不计） */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));

/* ---------- 结构校验（verify 用，返回失败原因或 null）：回合序列规则 / 渴度规则 /
   兔子对错规则 / 章映射 / 初始态干净 ---------- */
function structWhy(L) {
  if (!L || !L.turns || !L.turns.length) return 'null';
  const seq = L.turns.map(t => t.turn);
  if (seq.length < 9 || seq.length > 11) return 'seqLen';       // 5K+4R=9 .. 5K+6R=11
  if (seq.some(s => s !== 'k' && s !== 'r')) return 'side';
  if (seq[0] !== 'k') return 'first';                            // 首=K
  if (seq.filter(s => s === 'k').length !== 5) return 'kCount';  // 孩子回合恒 5
  const nR = seq.filter(s => s === 'r').length;
  if (nR < 4 || nR > 6) return 'rCount';                         // 兔子回合 4-6
  for (let t = 2; t < seq.length; t++)
    if (seq[t] === seq[t - 1] && seq[t - 1] === seq[t - 2]) return 'run3';   // 连续同方≤2
  if (L.dch <= 2) {                                              // ch1-2 严格交替定版串
    const alt = ['k', 'r', 'k', 'r', 'k', 'r', 'k', 'r', 'k'];
    if (seq.length !== alt.length || seq.some((s, t) => s !== alt[t])) return 'alt';
  }
  let prevArg = -1;
  for (let t = 0; t < L.turns.length; t++) {                     // 渴度：三元组章型+argmax 相邻互异
    const q = L.turns[t], th = q.thirsts;
    if (!Array.isArray(th) || th.length !== 3 || th.some(v => !Number.isInteger(v) || v < 1 || v > 3))
      return 'thirstsRange';
    if (th.indexOf(Math.max.apply(null, th)) !== th.lastIndexOf(Math.max.apply(null, th)))
      return 'thirstsTie';                                       // 最渴恒唯一（无并列）
    const s = th.slice().sort((a, b) => a - b).join(',');
    if (L.dch === 1 && s !== '1,1,3') return 'thShape1';         // 档差大
    if (L.dch === 2 && s !== '2,2,3') return 'thShape2';         // 档差细微
    if (L.dch >= 3 && s !== '1,2,3') return 'thShapeSort';       // 三盆互异=可排序
    const arg = argmaxOf(th);
    if (arg === prevArg) return 'thirstsAdj';                    // 相邻回合 argmax 互异
    prevArg = arg;
    if (q.turn === 'r') {                                        // 兔子：对错与浇点位
      if (typeof q.rabbitWrong !== 'boolean') return 'rwType';
      if (!Number.isInteger(q.rabbitPos) || q.rabbitPos < 0 || q.rabbitPos > 2) return 'rposRange';
      if (q.rabbitWrong ? q.rabbitPos === arg : q.rabbitPos !== arg) return 'rposMatch';
    }
    if (q.watered.some(w => w) || q._fix || q._taps !== 0) return 'initTurns';   // 初始态干净
  }
  if (L.step !== 0 || L.retries !== 0 || L.done) return 'init';
  if (L.turns.some(t => t._miss !== 0 || t._waitSaid || t._answered)) return 'initFlags';
  if (L.turnIdx !== 0) return 'initIdx';
  if (L.ch !== Math.floor(L.flat / CH_LEN) + 1 || L.lv !== L.flat % CH_LEN) return 'chmap';
  const dch0 = (L.ch - 1) % 4 + 1;
  if (L.flat < STATIC_LEVELS ? L.dch !== dch0 : (L.dch < 1 || L.dch > 4)) return 'dch';
  return null;
}
/* ================= turntake 主逻辑（花圃渲染 / 回合状态机 / 点花判定链 / 教学 / 救援 / 推进）
   2026-09-13 难度升级改造：判定层从「找耷拉」升级为「渴度比较+排序」。
   玩法：3 盆花每回合都有渴度梯度（thirsts∈{1,2,3}——CSS 三档 t1/t2/t3 姿态+土色双通道），

/* 音效（Web Audio 合成）：答对=双音上行 / 答错=低柔单音 / 喷水=带通噪声（喷水音=Web Audio
   合成，SPEC §1 定版——非 clip；verify 页 stub 且 ctx null 双保险下静默） */
const chimeGoal = () => { if (!VERIFY) { KIDS.audio.note(659.25, 0.16, 0, 0.6); KIDS.audio.note(880, 0.3, 0.09, 0.65); } };
const dodgeLo = () => { if (!VERIFY) KIDS.audio.note(587, 0.09, 0, 0.3); };
const spraySfx = () => {
  if (VERIFY) return;
  const c = KIDS.audio.ctx;
  if (!c || !c.createBufferSource) return;
  try {
    const dur = 0.7, len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);

    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 0.8;
    const g = c.createGain(); g.gain.value = 0.16 * (KIDS.audio._vol ? KIDS.audio._vol() : 0.6);
    src.connect(f); f.connect(g); g.connect(c.destination); src.start();

};

/* ================= 回合流（从当前回合推进：R=兔子演出连演（浇错开纠错回合）/ K=备题开放点选） ================= */
async function flowFrom() {
  const run = cur, token = perfRun;

    const q = run.turns[run.turnIdx];
    if (!q) return;

      state.rabbit = false;

        q._fix = true;

        qText(RABBIT_WRONG_TEXT);                 /* 题面轻提示「小兔子浇错啦，帮帮它」 */
        KIDS.voice.play(VOICE.rabbitWrong.key, VOICE.rabbitWrong.text);   /* tt_rabbit_wrong 单发不拼播（同 tt_wait 口径） */
        hopRabbit();
        lastAct = Date.now();                     /* 纠错回合开放重置 idle 锚 */
        lastDir = Date.now();
        return;                                   // 等孩子点正确盆纠正
      }
      engAdvance(run);
      if (run.done) { winFlow(); return; }        // ch3-4 尾随 R 回合在此收口通关
      continue;                                   // 连 2 R（dch≥3 域）继续演
    }
    renderTurnUI();                               // 孩子回合：备题（渴度梯度渲染+亮灯）
    if (run.dch <= 2) {                           /* ch1-2=点最渴的；ch3-4=排序浇（题面分派） */
      qText(PROMPT_TEXT);

/* ================= 点花主路径（真实点击 / TT.tapFlower / autoSolve / 教学演示共用）
   吞输入轻叮必配可见回应（场景容器 bump 微动效——家族 D）；
   浇水演出期 null（SPEC §1）；兔子演出期 'wait'/重复抢点 false；错点 1000ms 防重入窗 ========== */
async function uiTapFlower(i, demo) {
  if (!cur || state.won || (state.demo && !demo)) {

  }
  if (cur.done) return null;
  const q = cur.turns[cur.turnIdx];

    if (!q._waitSaid) {

      KIDS.voice.play(VOICE.wait.key, VOICE.wait.text);   /* tt_wait 单发不拼播（SPEC §4，不设豁免窗） */
      qText(WAIT_TEXT);
      hopRabbit();
      return 'wait';
    }
    sfx('pop'); replayAnim(sceneEl, 'bump');      /* 同回合重复抢点=false 轻吞（家族 D） */
    return false;
  }
  if (!demo && state.watering) return null;       // 浇水演出期 null（SPEC §1 定版）
  if (!demo && state.locked) { sfx('pop'); replayAnim(sceneEl, 'bump'); return false; }   // 错窗防重入
  /* b31 家族 I 补口径：错链豁免窗（真时钟）内错点吞——pop+bump 不计 miss；
     对选放行（缓解吞输入急性子观察）；窗后第二错照常计 miss（miss≥2 梯度可达） */
  if (!demo && wrongChainUntil && Date.now() < wrongChainUntil && i !== engTarget(cur)) {
    sfx('pop'); replayAnim(sceneEl, 'bump'); return false;
  }
  const run = cur, token = perfRun;               /* 身份守卫：演出窗内重玩会重建 cur，防旧续体错推进 */
  const r = engTapFlower(cur, i);
  if (r === null) { sfx('pop'); replayAnim(sceneEl, 'bump'); return null; }   // 越界
  const el = flowerEl(i);

  if (r === 'wrong') {                            /* 答错：花摇头+错链两段+方向级回锚（应点花 pulse） */
    state.locked = true;
    if (el) replayAnim(el, 'wig');
    dodgeLo();
    const order = run.dch >= 3 && !q._fix;        /* 排序题中错=顺序反馈；ch1-2/纠错错=找最渴反馈 */
    qText(order ? ORDER_WRONG_TEXT : WRONG_TEXT);
    const parts = [VOICE.wrong.key,               /* 错链头=wrong clip「这盆不渴哦」（manifest 文案） */
                   order ? VOICE.orderWrong.key : VOICE.hint.key];   /* 语义句尾：先浇更渴/找最渴——全 clip 无 keyless */
    if (sayW(parts))
      wrongChainUntil = Date.now() + 5217;        /* 链豁免：1752+150+estMs(7 字 3015)+300=5217（新句 estMs 口径，待主线实测回填，契约 I） */
    dirAnchor();                                  /* 方向级=应点花 pulse 一轮（定版） */
    if (q._miss >= 2) {                           /* miss≥2=应点花 breathe（答案级梯度） */
      const th = flowerEl(engTarget(cur));
      if (th) replayAnim(th, 'breathe');
    }
    await wait(1000 * SPEED);                     /* 错点防重入窗 1000ms；对选可打断链；救援由豁免窗让路 */
    if (cur !== run || token !== perfRun) return r;
    state.locked = false;
    return r;
  }

  /* ---- right·done（浇水演出：回合收口步=完整窗+确认链 / 排序中间步=短确认 1400 无 clip） ---- */
  const advanced = q._answered;                   /* engTapFlower 已收口本回合（排序中间步=false） */
  lastAct = Date.now();                           /* 正确选择重置救援钟（§0.7a） */
  lastDir = Date.now();
  if (state.tut === 'help') {                     /* 教学"独"：首次选对 → 放手 */
    state.tut = 'solo';

    ghost.hide();

  relievePot(i);

    qText(RIGHT_TEXT);

    await wait(1500 * SPEED);                     /* 浇水演出主窗（水壶倾斜+水滴+花开） */
    if (cur !== run || token !== perfRun) return r;

    if (cur !== run || token !== perfRun) return r;

  state.watering = false;
  if (cur.flat < 0) {                             /* 教学迷你关完成：帮→独后进正式关 */

/* ================= 过关推进（celebrate → persistWin → 章末/日末）

function persistWin(stars) {

  KIDS.ui.celebrate(stars).then(async () => {

    const pr = persistWin(stars);

    typeof window.__lastQueue[0] === 'string';           /* 确认链=right 单 clip（SPEC §4 窗 2772；排序中间步无 clip 不入链） */
  if (chainR) npass++;
  units.confirm = { ok: chainR, r: r10, chain: window.__lastQueue };

  window.__ttProg = 'U11';
  total++;
  const origSave = window.__ttOrig.save, origPersist = window.__ttOrig.persist,
        origPass = window.__ttOrig.pass;
  const origLS = localStorage.getItem('kidsgame_turntake');      /* 防毁真实玩家档 */
  let saveOk = false, saveDetail = '';
  try {
    KIDS._save = origSave;                       /* 还原真函数（init 用） */
    KIDS.store.persist = origPersist;
    KIDS.level.pass = origPass;
    localStorage.removeItem('kidsgame_turntake');
    KIDS.init({ game: 'turntake', title: '轮流浇花' });   /* 真实 init：store.load 新档 v1.0 */
    startLevel(0);                               /* verify 页 freshTut 恒 false → 直接开题 */
    const a11 = await window.TT.autoSolve();     /* 真实判定链通关 → winFlow verify 分支 persistWin */
    const raw = localStorage.getItem('kidsgame_turntake');
    const j = raw ? JSON.parse(raw) : null;
    saveOk = !!(a11.done && a11.taps >= 5 && j && j.v === '1.0' && j.game === 'turntake' &&
                j.levels && j.levels['1-0'] &&
                j.levels['1-0'].stars === 3 && j.levels['1-0'].plays === 1);
    if (!saveOk) saveDetail = JSON.stringify({ taps: a11.taps, raw: raw && raw.slice(0, 200) });
  } catch (err) {
    saveDetail = 'ERR ' + (err && err.message);
  }
  /* 清理：恢复原 localStorage（不污染真实存档）——⑫ 继续用真实函数 */
  if (origLS === null) localStorage.removeItem('kidsgame_turntake');
  else localStorage.setItem('kidsgame_turntake', origLS);
  if (saveOk) npass++;
  units.save = { ok: saveOk, detail: saveDetail };

  window.__ttProg = 'U12';
  total++;
  const today = new Date();
  const tstr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') +
               '-' + String(today.getDate()).padStart(2, '0');
  const pre = { v: '1.0', game: 'turntake', firstDay: tstr, lastDay: tstr, levels: {},
                dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 },
                restTip: { day: '', shown: 0 }, turntake: { tutSeen: true } };
  localStorage.setItem('kidsgame_turntake', JSON.stringify(pre));
  KIDS.store.load();                             /* 重读预置档（真实函数） */
  window.__ttDemoR = null;                       /* 教学实证清零（非教学路径不应重设） */
  window.TT.start(0);
  await unlocked2();
  const q12 = window.TT.quiz;
  const lv12 = window.TT.currentLevel;
  const realOk = state.tut === 'none' && window.__ttDemoR === null &&
    !!q12 && q12.turn === 'k' && Array.isArray(q12.thirsty) && q12.thirsty.length === 3 &&
    q12.thirsty.every(v => Number.isInteger(v) && v >= 1 && v <= 3) &&
    q12.thirsty.indexOf(Math.max.apply(null, q12.thirsty)) ===
      q12.thirsty.lastIndexOf(Math.max.apply(null, q12.thirsty)) &&
    q12.target === amax(q12.thirsty) && q12.rabbitWrong === false &&
    q12.step === 0 && q12.miss === 0 && q12.turnIdx === 0 && q12.flowers === undefined &&
    !!lv12 && lv12.flat === 0 && lv12.n === 9 && lv12.kTurns === 5 && lv12.rTurns === 4 &&
    lv12.dch === 1 &&
    typeof window.TT.tapFlower === 'function' && typeof window.TT.autoSolve === 'function' &&
    typeof window.TT.start === 'function' &&
    src.indexOf('window.TT =') >= 0 &&                        /* 真实页同暴露（b29 坑⑥） */
    src.indexOf('sv.turntake && sv.turntake.tutSeen') >= 0 && /* freshTut 教学分支源码在场 */
    src.indexOf('async function tutorialWatch') >= 0 &&
    (KIDS._save() || {}).v === '1.0';
  if (realOk) npass++;
  units.realPath = { ok: realOk, tut: state.tut,
                     quiz: q12 && { turn: q12.turn, thirsty: q12.thirsty, target: q12.target },
                     lv: lv12 && { flat: lv12.flat, n: lv12.n, k: lv12.kTurns, r: lv12.rTurns } };
  /* 收尾清理：恢复原 localStorage + 沙盒 stub（防真实页误写） */
  if (origLS === null) localStorage.removeItem('kidsgame_turntake');
  else localStorage.setItem('kidsgame_turntake', origLS);
  KIDS._save = function () { return { levels: {} }; };
  KIDS.store.persist = function () {};
  KIDS.level.pass = function () { return { chapterDone: false }; };

  const out = { game: 'turntake', total: total, pass: npass, units: units };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__ttVlog = out;                          /* 外部断言挂点（任务书钩子） */
  document.title = (npass === total) ? 'VERIFY PASS ' + npass + '/' + total
                                     : 'VERIFY FAIL ' + (total - npass) + '/' + total;
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text（__lastVoiceKey/__lastVoiceText）；
     voice.queue 记录拼播链（__lastQueue——错链/确认链绑定断言） */
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) { window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null; };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    window.__lastVoiceKey = parts && parts.length ? parts[0] : null;
  };
  /* 沙盒三件（教训族）：_save stub / persist no-op / level.pass no-op——
     单元③在 KIDS.init 前通关 20 次，persistWin→KIDS.level.pass 在 core 内部 save=null
     上必炸（hidecup 无 init 前通关故幸免——本款 verify 必须 stub，⑪ 再还原真函数） */
  window.__ttOrig = { save: KIDS._save, persist: KIDS.store.persist, pass: KIDS.level.pass };
  KIDS._save = function () { return { levels: {} }; };
  KIDS.store.persist = function () {};
  KIDS.level.pass = function () { return { chapterDone: false }; };
  runVerify();
}

</script>
