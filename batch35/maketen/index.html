<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>凑十小铺</title>
<style>
/* ================= 凑十小铺 maketen（batch35·扩容批 5）
   视觉按家族基调：暖米底 #FBF6EC、暖橙主色 #E8975A、暖棕描边 #4A3B2E；
   玩法 = 伙伴卡配对收银（SPEC-BATCH35 §0.86/§2，6-7 岁数感·凑十）：
   题面顶部大字 target（10/15/20）→ 柜台中央伙伴卡数字 a → 下方卡池 4-5 张
   数字卡点一张 x：a+x=target → 收进店里（钱币叮当+货架+1）；≠target →
   两级方向数感反馈（和>target「多了一点，换张小一点的」/和<target
   「少了一点，换张大一点的」——按和值分派 mt_wrong_more/mt_wrong_less）。
   触摸目标：卡池卡 ≥96×96、底栏按钮 ≥72；overflowX 恒 0。
   款内自建 button 带显式 color（契约 O：不依赖 core 兜底）。 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#FBF6EC;color:#4A3B2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:#4A3B2E}
svg{display:block}

#game{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- 顶栏 ---------- */
#hud{flex:0 0 48px;display:flex;align-items:center;padding:4px 60px 0 14px;gap:14px}
#logo{width:38px;height:38px;border-radius:11px;background:#F2DDC0;display:flex;align-items:center;
  justify-content:center;flex:0 0 38px}
#step-dots{display:flex;gap:7px;align-items:center;flex:1 1 auto}
#step-dots i{width:12px;height:12px;border-radius:50%;background:#E5D5BC;transition:all .3s}
#step-dots i.done{background:#8FBF7F}
#step-dots i.cur{background:#E8975A;transform:scale(1.35)}
#chapter-dots{display:flex;gap:5px;align-items:center;flex:0 0 auto}
#chapter-dots i{width:10px;height:10px;border-radius:50%;background:#E5D5BC}
#chapter-dots i.done{background:#8FBF7F}
#chapter-dots i.cur{background:#E8975A}

/* ---------- 题面：本凑目标大字（SPEC §0.86——三目标切换=认知坡度主体） ---------- */
#target-bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:6px 24px 6px 20px;
  border-radius:20px;background:#FFF9EE;border:2.5px solid #4A3B2E;box-shadow:0 3px 0 #D8C9B4}
#target-bar .tb-label{font-size:24px;font-weight:700;letter-spacing:2px}
#target-num{font-size:54px;font-weight:900;color:#E8975A;line-height:1;min-width:66px;text-align:center}
#target-bar.pulse{animation:mt-tp .45s ease-in-out 3}
@keyframes mt-tp{50%{transform:scale(1.14)}}

/* ---------- 舞台：小铺（货架 + 柜台 + 伙伴卡） ---------- */
#stage{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;overflow:hidden;padding:6px 12px}
#scene{flex:0 0 auto;position:relative;width:min(640px,94vw);border-radius:24px;
  background:linear-gradient(180deg,#FDF3DC 0%,#F6E2BE 100%);border:3px solid #4A3B2E;
  box-shadow:0 4px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;padding:10px 14px 12px}
#shelf{display:flex;gap:10px;justify-content:center;align-items:center;padding:2px 0 10px;width:100%}
.slot{width:46px;height:46px;border-radius:50%;border:2.5px dashed #C9A87C;background:rgba(255,249,238,.55);
  display:flex;align-items:center;justify-content:center;transition:all .3s}
.slot.fill{border:2.5px solid #4A3B2E;background:radial-gradient(circle at 35% 30%,#F7D154 0%,#E5A93D 78%);
  animation:mt-coin .5s cubic-bezier(.2,1.6,.4,1)}
.slot.fill::after{content:'★';font-size:22px;color:#FFF9EE;text-shadow:0 1px 0 #C08A2D}
@keyframes mt-coin{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

/* 伙伴卡：柜台中央的大数字卡（小店伙伴举着的卡）——契约 M 锚 data-role="buddy" */
#buddy-card{width:104px;height:126px;border-radius:18px;background:#FDF3DC;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #D8C9B4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;position:relative;z-index:2;margin-bottom:-6px}
#buddy-card .buddy-tag{font-size:13px;font-weight:700;color:#8A7B6C;letter-spacing:1px}
#buddy-card .buddy-face{width:36px;height:36px}
#buddy-num{font-size:52px;font-weight:900;line-height:1;color:#4A3B2E}
#buddy-card.pulse{animation:mt-tp .45s ease-in-out 3}
#counter{width:100%;height:16px;border-radius:12px;background:#E9CD9F;border:2.5px solid #4A3B2E;
  box-shadow:0 3px 0 #D8C9B4;flex:0 0 auto}

/* ---------- 卡池（恒全摆 4-5 张互异数字卡；契约 M 锚 data-i） ---------- */
#pool{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch;
  max-width:min(680px,96vw)}
#pool.bump{animation:mt-bump .22s ease}
@keyframes mt-bump{0%,100%{transform:scale(1)}45%{transform:scale(.97)}}
.card{width:98px;height:122px;border-radius:16px;background:#FFF9EE;border:3px solid #4A3B2E;
  box-shadow:0 5px 0 #D8C9B4;display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .15s}
.card .cv{font-size:50px;font-weight:900;line-height:1}
.card:active{transform:translateY(4px);box-shadow:0 1px 0 #D8C9B4}
.card.wig{animation:mt-wig .4s ease}
@keyframes mt-wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}
  50%{transform:translateX(7px)}75%{transform:translateX(-5px)}}
.card.breathe{animation:mt-br 1.2s ease-in-out infinite}
@keyframes mt-br{0%,100%{transform:scale(1)}50%{transform:scale(1.07);
  box-shadow:0 5px 0 #D8C9B4,0 0 16px rgba(232,151,90,.95)}}
/* 收银：点中卡飞进店里（gone=契约 M 收银帧锚——池恒全摆下的已收标记） */
.card.gone{animation:mt-fly .6s cubic-bezier(.4,0,.8,1) forwards;pointer-events:none}
@keyframes mt-fly{55%{transform:translateY(-120px) scale(.5) rotate(10deg);opacity:.9}
  100%{transform:translateY(-175px) scale(.22) rotate(18deg);opacity:0;visibility:hidden}}

/* ---------- 底栏 ---------- */
#dock{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-start;
  padding:6px 18px 12px;gap:12px}
#btn-rabbit{width:86px;height:86px;border-radius:50%;background:#FFF9EE;border:2.5px solid #4A3B2E;
  box-shadow:0 4px 0 #C9A87C;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#btn-rabbit:active{transform:translateY(3px);box-shadow:0 1px 0 #C9A87C}
#btn-rabbit svg{width:70px;height:70px}
#btn-rabbit.hop{animation:mt-hop .45s ease 2}
@keyframes mt-hop{0%,100%{margin-top:0}50%{margin-top:-14px}}
#dock-tip{font-size:15px;color:#8A7B6C;padding-left:4px}

/* ---------- 幽灵手指教学（照 batch21-34） ---------- */
#ghost{position:fixed;z-index:80;width:64px;height:76px;pointer-events:none;opacity:0;
  transition:left .8s ease,top .8s ease,opacity .4s;transform:translate(-50%,-92%)}
#ghost.show{opacity:.92}
#ghost.pressing{animation:g-press .6s ease}
@keyframes g-press{0%,100%{transform:translate(-50%,-92%)}50%{transform:translate(-50%,-78%) scale(.92)}}
#ghost .g-ripple{position:absolute;left:50%;bottom:-8px;width:56px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);transform:translateX(-50%) scale(.3);opacity:0}
#ghost.pressing .g-ripple{animation:g-ripple .6s ease}
@keyframes g-ripple{0%{transform:translateX(-50%) scale(.3);opacity:.9}100%{transform:translateX(-50%) scale(1.5);opacity:0}}

/* verify 结果（不参与正常布局） */
#verify-result{position:fixed;left:0;top:0;z-index:99999;font:12px/1.5 monospace;color:#4A3B2E;
  background:#FFF9EE;padding:6px;max-height:60vh;overflow:auto;display:none;white-space:pre-wrap}
body.verify #verify-result{display:block}

/* 竖屏（平板/手机竖持）：舞台收紧，卡触摸面仍 ≥96 */
@media (orientation:portrait){
  #target-bar{padding:4px 18px 4px 16px;gap:8px}
  #target-bar .tb-label{font-size:20px}
  #target-num{font-size:44px;min-width:54px}
  #scene{width:min(460px,96vw)}
  .slot{width:40px;height:40px}
  .slot.fill::after{font-size:18px}
  #buddy-card{width:96px;height:118px}
  #buddy-num{font-size:46px}
  .card{width:96px;height:118px}
  .card .cv{font-size:46px}
  #btn-rabbit{width:78px;height:78px}
  #btn-rabbit svg{width:64px;height:64px}
}
</style>
</head>
<body>
<div id="game" aria-label="凑十小铺">
  <div id="hud">
    <div id="logo" aria-hidden="true"></div>
    <div id="step-dots" aria-label="本关题目进度"></div>
    <div id="chapter-dots" aria-label="章节进度"></div>
  </div>
  <div id="stage">
    <div id="target-bar" aria-label="本凑目标"><span class="tb-label">凑</span><span id="target-num">10</span></div>
    <div id="scene" aria-label="小铺柜台，货架和伙伴卡">
      <div id="shelf" aria-label="收银货架"></div>
      <div id="buddy-card" data-role="buddy" aria-label="伙伴卡">
        <div class="buddy-tag">伙伴卡</div>
        <div class="buddy-face" id="buddy-face" aria-hidden="true"></div>
        <div id="buddy-num">3</div>
      </div>
      <div id="counter" aria-hidden="true"></div>
    </div>
    <div id="pool" aria-label="数字卡池"></div>
  </div>
  <div id="dock">
    <button id="btn-rabbit" aria-label="小兔子提示"></button>
    <div id="dock-tip">点一张卡，和伙伴卡凑出目标数</div>
  </div>
</div>
<div id="ghost" aria-hidden="true"></div>
<pre id="verify-result"></pre>

<script>
/* KIDS core v1.0 — 儿童离线游戏公共内核（内嵌于每款游戏，无外部依赖）
 * 提供：存档 / 内容日历 / 会话计时与休息提示 / Web Audio 合成音效 / TTS / 过关与章节仪式 / 家长面板 / 小兔子 SVG
 * 用法：内嵌本文件全文 → KIDS.init({game:'pipe', title:'管道小兔子'}) → 各 API
 */
const KIDS = (() => {
  'use strict';
  const VER = '1.0';
  let cfg = { game: 'game', title: '游戏' };
  let save = null;
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.floor((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const $ = s => document.querySelector(s);

  /* ---------- 存档 ---------- */
  const store = {
    load() {
      let raw = null;
      try { raw = localStorage.getItem('kidsgame_' + cfg.game); } catch (e) {}
      try { save = raw ? JSON.parse(raw) : null; } catch (e) { save = null; } // 存档损坏=重置，不白屏
      if (!save || save.v !== VER) save = {
        v: VER, game: cfg.game, firstDay: todayStr(), lastDay: todayStr(),
        levels: {}, dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 }, restTip: { day: '', shown: 0 }
      };
      save.lastDay = todayStr();
      this.persist();
    },
    persist() { try { localStorage.setItem('kidsgame_' + cfg.game, JSON.stringify(save)); } catch (e) {} }
  };

  /* ---------- 音频（全合成，马林巴音色） ---------- */
  const audio = {
    ctx: null,
    unlock() {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _vol() { return save && save.settings ? (save.settings.sound ? save.settings.vol : 0) : 0.6; },
    note(freq, dur = 0.5, when = 0, vol = 1) { // 马林巴：基音+2.9倍泛音+指数衰减
      const c = this.ctx; if (!c || !freq || this._vol() <= 0) return;
      const t = c.currentTime + when, v = this._vol() * vol;
      [[1, 1], [2.9, 0.2]].forEach(([mul, amp]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = freq * mul;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5 * v * amp, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      });
    },
    sfx(name) {
      const c = this.ctx; if (!c || this._vol() <= 0) return;
      if (name === 'ok') { this.note(523.25, 0.35, 0, 0.9); this.note(659.25, 0.45, 0.09, 0.9); }
      else if (name === 'win') { [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, 0.5, i * 0.09, 0.95)); }
      else if (name === 'fail') { this.note(196, 0.18, 0, 0.45); } // 柔和低音，不惊吓
      else if (name === 'click') { // 短噪声脉冲
        const t = c.currentTime, len = c.sampleRate * 0.04, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'highpass'; f.frequency.value = 1800;
        g.gain.value = 0.18 * this._vol();
        s.buffer = buf; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
      }
      else if (name === 'pop') { this.note(880, 0.15, 0, 0.6); }
      else if (name === 'coin') { this.note(987.77, 0.2, 0, 0.8); this.note(1318.5, 0.4, 0.08, 0.8); }
    }
  };

  /* ---------- 语音：预合成童声音频优先，系统 TTS 回退 ----------
   * clips = { key: dataURI }，由游戏侧注入（build 时内嵌 base64 mp3）。
   * play(key, text)：有 clip 播 clip（停止上一条），否则回退 speak(text)。
   * queue(parts)：拼接句顺序播报，parts = [key 或 {key,text}]，段间 0.15s 停顿（替代标点停顿）。 */
  const voice = {
    clips: {},
    _audio: null,
    _qtimer: null,
    _mk(uri, onfail) { // 单条播放器，音量跟随家长面板
      const a = new Audio(uri);
      a.volume = save && save.settings ? save.settings.vol : 0.6;
      if (onfail) a.play().catch(onfail); else a.play().catch(() => {});
      return a;
    },
    _stop() {
      if (this._audio) { this._audio.pause(); this._audio = null; }
      if (this._qtimer) { clearTimeout(this._qtimer); this._qtimer = null; }
    },
    play(key, text) {
      if (!save || !save.settings.tts) return;
      this._stop();
      const uri = this.clips[key];
      if (!uri) { if (text) speak(text); return; }
      try { this._audio = this._mk(uri, () => { if (text) speak(text); }); } // 自动播放被拦则回退 TTS
      catch (e) { if (text) speak(text); }
    },
    queue(parts) { // 拼接句：如 ['shop_recount','shop_want','shop_g_apple_3']
      if (!save || !save.settings.tts) return;
      this._stop();
      const list = parts.slice();
      const step = () => {
        if (!list.length) return;
        const p = list.shift(), key = typeof p === 'string' ? p : p.key;
        const text = typeof p === 'object' && p ? p.text : null;
        const uri = this.clips[key];
        if (!uri) { if (text) speak(text); return; } // 缺 clip 且无文本=放弃整句（比逐段 TTS 混搭更自然）
        try {
          this._audio = this._mk(uri);
          this._audio.onended = () => { this._qtimer = setTimeout(step, 150); };
        } catch (e) { return; }
      };
      step();
    },
    say(text) { this.play(null, text); } // 强制走 TTS（动态拼句且无 clip 时）
  };

  /* ---------- TTS（Task#46 阶段3 2026-09-20 通道删除）----------
   * 用户红线：彻底消灭 speechSynthesis 系统合成音（120 款 keyless 点位已全量 clip 化，
   * 二波 77/77 闭环）。残余 keyless 调用（say 裸文本/play 缺 clip 回退）到此为
   * 静默无声+控制台告警——不 fallback 系统音色跳变，也不可听见机械声。 */
  const speak = (text) => {
    try { console.warn('[KIDS.voice] clipless speech dropped:', text); } catch (e) {}
  };

  /* ---------- 内容日历：每日新关基数 6（首日）→ 12（第 2 天起封顶，2026-09-05 用户反馈 dayIndex 线性增长导致"永远玩不完"后封顶）
   * 家长可在面板手动输入今日多玩关数：save.bonus = { '2026-09-05': n }（0-30，设置语义替换旧值，当日生效）。
   * keysFlat = 游戏按顺序传入全部关卡 key（'ch-lv'）的扁平数组，用于判断今日新关是否全部完成 */
  const DAILY_NEW = 6, DAY_CAP = 2, BONUS_MAX = 30;
  const calendar = {
    dayIndex() { return dayDiff(save.firstDay, todayStr()) + 1; },
    bonusToday() { return (save.bonus && save.bonus[todayStr()]) || 0; },
    bonusSet(n) { // 家长设置今日多玩关数（替换旧值），返回是否成功
      n = Math.round(Number(n));
      if (!(n >= 0 && n <= BONUS_MAX)) return false;
      if (!save.bonus) save.bonus = {};
      save.bonus[todayStr()] = n;
      store.persist();
      return true;
    },
    limit(totalLevels) { return Math.min(totalLevels, Math.min(this.dayIndex(), DAY_CAP) * DAILY_NEW + this.bonusToday()); },
    isNew(flatIdx, totalLevels) { return flatIdx < this.limit(totalLevels); },
    dayDone(keysFlat) { // 今日新关全部有通关记录？
      const lim = this.limit(keysFlat.length);
      for (let i = 0; i < lim; i++) if (!save.levels[keysFlat[i]]) return false;
      return true;
    }
  };

  /* ---------- 关卡进度 ---------- */
  const level = {
    key(ch, lv) { return ch + '-' + lv; },
    stars(ch, lv) { return (save.levels[this.key(ch, lv)] || {}).stars || 0; },
    pass(ch, lv, stars, chapterLevels) { // chapterLevels = 本章全部 lv 数组（如 [0,1,2,3,4]）
      const k = this.key(ch, lv), prev = save.levels[k] || { stars: 0, plays: 0 };
      save.levels[k] = { stars: Math.max(prev.stars, stars), plays: prev.plays + 1 };
      store.persist();
      const chapterDone = chapterLevels.every(l => save.levels[this.key(ch, l)]);
      return { chapterDone };
    }
  };

  /* ---------- 会话计时与休息提示（只计前台时间，按分钟增量入账 dailyMin） ---------- */
  const session = {
    t0: null, timer: null, lastMin: 0, hiddenAt: null,
    settle() { // 把 lastMin 以来的前台分钟增量写入当日
      const min = Math.floor((Date.now() - this.t0) / 60000);
      if (min > this.lastMin) {
        const today = todayStr();
        save.dailyMin[today] = (save.dailyMin[today] || 0) + (min - this.lastMin);
        this.lastMin = min;
        store.persist();
      }
    },
    start() {
      this.t0 = Date.now(); this.lastMin = 0; this.hiddenAt = null;
      const tick = () => {
        if (document.hidden) return;
        this.settle();
        const today = todayStr();
        if (!save.restTip || save.restTip.day !== today) save.restTip = { day: today, shown: 0 }; // 按日清零
        const min = Math.floor((Date.now() - this.t0) / 60000);
        if ((min >= 13 && save.restTip.shown < 13) || (min >= 25 && save.restTip.shown < 25)) {
          save.restTip.shown = min >= 25 ? 25 : 13; store.persist();
          ui.restTip();
        }
      };
      clearInterval(this.timer);
      this.timer = setInterval(tick, 20000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { this.settle(); this.hiddenAt = Date.now(); }   // 切走：入账并暂停
        else if (this.hiddenAt) { this.t0 += Date.now() - this.hiddenAt; this.hiddenAt = null; } // 回来：平移起点
      });
    }
  };

  /* ---------- 覆盖层 UI ---------- */
  const css = `
button{color:inherit}
.k-ov{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(251,243,228,.94);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .3s}
.k-ov.show{opacity:1}
.k-ov .k-big{font-size:30px;font-weight:700;color:#4A3B2E;letter-spacing:.06em;text-align:center;padding:0 30px}
.k-ov .k-sub{font-size:20px;color:#8A7B6C;text-align:center;padding:0 30px;line-height:1.6}
.k-btn{min-width:72px;min-height:72px;padding:0 34px;border:none;border-radius:24px;background:#E8975A;color:#fff;font-size:22px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #C77A42;transition:transform .15s}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C77A42}
.k-btn.ghost{background:#FFF9EE;color:#4A3B2E;box-shadow:0 4px 0 #D8C9B4}
.k-star{font-size:64px;line-height:1;color:#F5C445;text-shadow:0 3px 0 #D8862B;animation:k-pop .5s cubic-bezier(.2,1.6,.4,1) both}
.k-star:nth-child(2){animation-delay:.12s}.k-star:nth-child(3){animation-delay:.24s}
@keyframes k-pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.k-stamp{width:120px;height:120px;border-radius:50%;background:#8FBF7F;display:flex;align-items:center;justify-content:center;font-size:58px;animation:k-stamp .55s cubic-bezier(.2,1.8,.4,1) both}
@keyframes k-stamp{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.k-parentbtn{position:fixed;top:10px;right:10px;z-index:10000;width:44px;height:44px;border-radius:14px;border:none;background:rgba(232,151,90,.25);color:#4A3B2E;font-size:20px;cursor:pointer}
.k-panel{position:fixed;inset:0;z-index:99999;background:rgba(74,59,46,.35);display:flex;align-items:center;justify-content:center}
.k-panel .box{background:#FFF9EE;border-radius:20px;padding:26px 30px;max-width:420px;width:88%;max-height:80vh;overflow:auto;font-size:15px;color:#4A3B2E;line-height:1.7}
.k-panel h3{margin:0 0 12px;font-size:18px}
.k-panel table{width:100%;border-collapse:collapse;margin:8px 0}
.k-panel td{padding:5px 0;border-bottom:1px solid #EFE3CD;font-size:14px}
.k-panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.k-panel .mbtn{padding:10px 16px;border:none;border-radius:12px;background:#E8975A;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.k-panel .mbtn.ghost{background:#EFE3CD;color:#4A3B2E}
.k-panel input[type=number]{width:100px;padding:10px;font-size:20px;border:2px solid #E8975A;border-radius:10px}
.k-numrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.k-numrow button{width:52px;height:52px;font-size:20px;border:none;border-radius:12px;background:#EFE3CD;color:#4A3B2E;cursor:pointer;font-family:inherit}
.k-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;cursor:pointer;color:#8A7B6C}
`;
  const ui = {
    injectCss() { const s = el('style'); s.textContent = css; document.head.appendChild(s); },
    _ov(cls) {
      /* b14 试玩 P2①：同类型层幂等——层未关时再次触发（如日终后继续重玩又通关）
         会向 body 叠加第二层（实测累积 7 个"明天见"按钮）；先移除同 cls 旧层 */
      if (cls) document.querySelectorAll('.k-ov.' + cls).forEach(o => o.remove());
      const o = el('div', 'k-ov' + (cls ? ' ' + cls : '')); document.body.appendChild(o); requestAnimationFrame(() => o.classList.add('show')); return o;
    },
    celebrate(stars = 3) { // 过关：金星+“真棒！”+2.3s 自动收起（视觉评估：仪式感弱/星星深棕非金黄/1.8s过短）；类名 k-celebrate 供验收断言
      return new Promise(res => {
        const o = this._ov('k-celebrate');
        const box = el('div'); box.style.cssText = 'display:flex;gap:8px';
        for (let i = 0; i < stars; i++) box.appendChild(el('div', 'k-star', '★'));
        o.appendChild(box);
        o.appendChild(el('div', 'k-big', stars >= 3 ? '真棒！' : '好棒！'));
        o.appendChild(el('div', '', '<div style="width:140px;height:140px">' + assets.rabbit('happy') + '</div>'));
        setTimeout(() => { o.classList.remove('show'); setTimeout(() => { o.remove(); res(); }, 320); }, 2300);
      });
    },
    chapterEnd(info) { // {chapter, stars, nextHint}
      const o = this._ov('k-chapterend');
      o.appendChild(el('div', 'k-stamp', '★'));
      o.appendChild(el('div', 'k-big', '第 ' + info.chapter + ' 章 完成！'));
      o.appendChild(el('div', 'k-sub', '本章星星 ' + info.stars + '<br>明天：' + (info.nextHint || '有新的关卡哦')));
      const b = el('button', 'k-btn', '明天见');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('win');
      voice.play('core_chapter_end', '这一章完成啦，明天还有新关卡哦');
    },
    dayEnd(info) { // {nextHint}
      const o = this._ov('k-dayend');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('wave') + '</div>'));
      o.appendChild(el('div', 'k-big', '今天的新关卡玩完啦'));
      o.appendChild(el('div', 'k-sub', '明天：' + (info.nextHint || '有新的关卡哦')));
      const again = el('button', 'k-btn ghost', '再玩玩旧关卡');
      again.onclick = () => { o.remove(); };
      const bye = el('button', 'k-btn', '明天见');
      bye.onclick = () => { o.remove(); };
      const row = el('div'); row.style.cssText = 'display:flex;gap:18px'; row.appendChild(again); row.appendChild(bye);
      o.appendChild(row);
      audio.sfx('win');
      voice.play('core_day_end', '今天的新关卡玩完啦，明天见');
    },
    restTip() {
      const o = this._ov('k-resttip');
      o.appendChild(el('div', '', '<div style="width:150px;height:150px">' + assets.rabbit('sleepy') + '</div>'));
      o.appendChild(el('div', 'k-big', '小兔子的眼睛要休息啦'));
      o.appendChild(el('div', 'k-sub', '去看看远处的大树，明天再一起玩'));
      const b = el('button', 'k-btn', '好的');
      b.onclick = () => { o.remove(); };
      o.appendChild(b);
      audio.sfx('pop');
      voice.play('core_rest', '我的眼睛要休息啦，我们去看看远处的大树吧，明天再一起玩');
    }
  };

  /* ---------- 家长面板（含家长门） ---------- */
  const parent = {
    init() {
      const b = el('button', 'k-parentbtn', '👪');
      b.title = '家长'; b.setAttribute('aria-label', '家长');
      b.onclick = () => this.gate();
      document.body.appendChild(b);
    },
    gate() {
      // 两位数加法：10 以内加法是幼儿园大班常规内容，不足以挡住目标年龄段儿童（Apple Kids 家长门要求"儿童难完成"）
      const a = 11 + Math.floor(Math.random() * 40), b = 11 + Math.floor(Math.random() * 40);
      const p = el('div', 'k-panel');
      const box = el('div', 'box');
      box.style.position = 'relative';
      box.innerHTML = '<h3>家长验证</h3><div style="font-size:17px">' + a + ' + ' + b + ' = ?</div>';
      const input = el('input'); input.type = 'number'; input.min = 0; input.max = 200;
      const nums = el('div', 'k-numrow');
      for (let i = 0; i <= 9; i++) {
        const nb = el('button', '', String(i));
        nb.onclick = () => { input.value = (input.value || '') + i; };
        nums.appendChild(nb);
      }
      const del = el('button', '', '⌫'); del.onclick = () => { input.value = String(input.value || '').slice(0, -1); };
      del.style.width = '52px'; del.style.height = '52px'; del.style.cssText += ';border:none;border-radius:12px;background:#EFE3CD;cursor:pointer;font-size:18px';
      nums.appendChild(del);
      const ok = el('button', 'mbtn', '确定');
      ok.onclick = () => {
        if (parseInt(input.value, 10) === a + b) { p.remove(); this.panel(); }
        else { input.value = ''; input.placeholder = '再试一次'; }
      };
      const row = el('div', 'row'); row.appendChild(ok);
      const cancel = el('button', 'mbtn ghost', '取消'); cancel.onclick = () => p.remove(); row.appendChild(cancel);
      box.appendChild(input); box.appendChild(nums); box.appendChild(row);
      p.appendChild(box); document.body.appendChild(p);
    },
    panel() {
      const p = el('div', 'k-panel');
      const box = el('div', 'box'); box.style.position = 'relative';
      const days = Object.keys(save.dailyMin);
      const totalStars = Object.values(save.levels).reduce((s, l) => s + (l.stars || 0), 0);
      const done = Object.keys(save.levels).length;
      box.innerHTML = '<span class="k-close" title="关闭">✕</span><h3>家长面板 · ' + cfg.title + '</h3>' +
        '<table>' +
        '<tr><td>首次游玩</td><td>' + save.firstDay + '</td></tr>' +
        '<tr><td>最近游玩</td><td>' + save.lastDay + '</td></tr>' +
        '<tr><td>已完成关卡</td><td>' + done + ' 关</td></tr>' +
        '<tr><td>累计星星</td><td>' + totalStars + '</td></tr>' +
        '<tr><td>今日游玩</td><td>' + (save.dailyMin[todayStr()] || 0) + ' 分钟</td></tr>' +
        '</table>' +
        '<div style="font-size:13px;color:#8A7B6C">近期每日游玩（分钟）</div>' +
        '<div style="font-size:13px">' + days.slice(-7).map(d => d.slice(5) + '：' + save.dailyMin[d]).join('　') + '</div>';
      const row = el('div', 'row');
      const sndBtn = el('button', 'mbtn ghost', save.settings.sound ? '声音：开' : '声音：关');
      sndBtn.onclick = () => { save.settings.sound = !save.settings.sound; store.persist(); sndBtn.textContent = save.settings.sound ? '声音：开' : '声音：关'; };
      const ttsBtn = el('button', 'mbtn ghost', save.settings.tts ? '语音：开' : '语音：关');
      ttsBtn.onclick = () => { save.settings.tts = !save.settings.tts; store.persist(); ttsBtn.textContent = save.settings.tts ? '语音：开' : '语音：关'; };
      const volIn = el('input'); volIn.type = 'range'; volIn.min = 0; volIn.max = 100; volIn.value = save.settings.vol * 100; volIn.style.width = '110px';
      volIn.oninput = () => { save.settings.vol = volIn.value / 100; store.persist(); };
      row.appendChild(sndBtn); row.appendChild(ttsBtn); row.appendChild(volIn);
      const row2 = el('div', 'row');
      /* 今日多玩：家长手动输入今日多玩关数（0-30，替换旧值）——家长在场时灵活放宽，不必等明天 */
      const bonusRow = el('div', 'row');
      bonusRow.appendChild(el('span', '', '今日多玩关数：'));
      const bIn = el('input'); bIn.type = 'number'; bIn.min = 0; bIn.max = 30; bIn.value = calendar.bonusToday();
      bIn.style.width = '80px';
      const bOk = el('button', 'mbtn', '确定');
      const bTip = el('span', '', '');
      const refreshTip = () => { bTip.innerHTML = '<span style="font-size:12px;color:#8A7B6C">今日已在基数上加 ' + calendar.bonusToday() + ' 关（上限 30）</span>'; };
      refreshTip();
      bOk.onclick = () => { calendar.bonusSet(parseInt(bIn.value, 10)); bIn.value = calendar.bonusToday(); refreshTip(); };
      bonusRow.appendChild(bIn); bonusRow.appendChild(bOk); bonusRow.appendChild(bTip);
      const exp = el('button', 'mbtn', '导出存档');
      exp.onclick = () => {
        const blob = new Blob([JSON.stringify(save, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsgame-' + cfg.game + '-' + todayStr() + '.json'; a.click();
      };
      const imp = el('button', 'mbtn ghost', '导入存档');
      imp.onclick = () => {
        const inp = el('input'); inp.type = 'file'; inp.accept = '.json';
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader();
          r.onload = () => { try { const j = JSON.parse(r.result); if (j && j.v === VER && j.game === cfg.game) { save = j; store.persist(); location.reload(); } else alert('存档格式不匹配'); } catch (e) { alert('存档解析失败'); } };
          r.readAsText(f); };
        inp.click();
      };
      const reset = el('button', 'mbtn ghost', '重置进度');
      reset.onclick = () => { if (confirm('确定清空该游戏的全部进度吗？')) { try { localStorage.removeItem('kidsgame_' + cfg.game); } catch (e) {} location.reload(); } };
      row2.appendChild(exp); row2.appendChild(imp); row2.appendChild(reset);
      box.appendChild(row); box.appendChild(bonusRow); box.appendChild(row2);
      box.querySelector('.k-close').onclick = () => p.remove();
      p.appendChild(box); document.body.appendChild(p);
    }
  };

  /* ---------- 小兔子 SVG ---------- */
  const assets = {
    rabbit(pose = 'normal', size = 120) {
      const eyes = pose === 'happy'
        ? '<path d="M44 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M66 62 q5 -7 10 0" stroke="#4A3B2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<path d="M42 63 h12 M64 63 h12" stroke="#4A3B2E" stroke-width="3.5" stroke-linecap="round"/><text x="88" y="30" font-size="16" fill="#8A7B6C">z z</text>'
        : '<circle cx="48" cy="62" r="4.5" fill="#4A3B2E"/><circle cx="72" cy="62" r="4.5" fill="#4A3B2E"/>';
      const mouth = pose === 'happy'
        ? '<path d="M55 74 q5 6 10 0" stroke="#4A3B2E" stroke-width="3" fill="none" stroke-linecap="round"/>'
        : pose === 'sleepy'
        ? '<ellipse cx="60" cy="75" rx="3" ry="2" fill="#D98A8A"/>'
        : '<path d="M56 73 q2 3 4 0 q2 3 4 0" stroke="#4A3B2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
      const paw = pose === 'wave'
        ? '<circle cx="18" cy="55" r="9" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>'
        : '';
      return '<svg viewBox="0 0 120 120" width="' + size + '" height="' + size + '" xmlns="http://www.w3.org/2000/svg" fill="none">' +
        '<ellipse cx="60" cy="96" rx="26" ry="12" fill="#EFE3CD"/>' +
        '<ellipse cx="45" cy="28" rx="10" ry="26" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(-10 45 28)"/>' +
        '<ellipse cx="45" cy="30" rx="4.5" ry="17" fill="#F2B8C6" transform="rotate(-10 45 30)"/>' +
        '<ellipse cx="76" cy="26" rx="10" ry="27" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5" transform="rotate(14 76 26)"/>' +
        '<ellipse cx="76" cy="28" rx="4.5" ry="18" fill="#F2B8C6" transform="rotate(14 76 28)"/>' +
        '<circle cx="60" cy="68" r="38" fill="#FBF7F0" stroke="#4A3B2E" stroke-width="2.5"/>' +
        '<ellipse cx="54" cy="56" rx="3" ry="2.2" fill="#D98A8A"/><ellipse cx="66" cy="56" rx="3" ry="2.2" fill="#D98A8A"/>' +
        '<ellipse cx="37" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/><ellipse cx="83" cy="74" rx="6.5" ry="4.5" fill="#F2B8C6" opacity=".8"/>' +
        eyes + mouth + paw + '</svg>';
    }
  };

  /* ---------- init ---------- */
  function init(config) {
    cfg = Object.assign({ game: 'game', title: '游戏' }, config);
    store.load();
    ui.injectCss();
    document.addEventListener('pointerdown', () => audio.unlock(), { once: false });
    parent.init();
    session.start();
    return KIDS;
  }

  return { init, VER, store, audio, speak, voice, calendar, level, session, ui, parent, assets, _save: () => save };
})();

</script>

/* ================= maketen 纯引擎：确定性关卡生成 + 点卡判定（无 DOM，UI 与 verify 共用）
   种子 = mulberry32(flat * 7919 + 523)（本款常量 523，SPEC-BATCH35 §0.86 定版）：
   同 flat 永远同关（重玩一致、verify 可检）。
   章型（SPEC §0.86；进度章号单调递增、难度章号 dch=1+flat//5 静态四档）：
     dch1 凑 10（a∈2-8 偶偏，池 4）/ dch2 凑 10（a∈1-9 全域，池 5）
     dch3 凑 15（a∈6-9，池 4）/ dch4 混合（每题 target∈{10,15,20} seeded，池 5）
     生成关（flat≥20）dch=ri(rnd,1,4) seeded 随机（域全档成立型——b33 硬性②）
   数学先验（SPEC §0.86 封闭域验算）：补数封闭——凑 10 a∈1-9 x=10-a（对集
   (1,9)(2,8)(3,7)(4,6)(5,5)）；凑 15 a∈6-9 x=15-a∈6-9；凑 20 a∈11-18
   x=20-a∈2-9；卡池互异+含补数⇒唯一解（补数由 a 唯一确定，池互异禁双同值）。
   干扰池构造：池=补数+干扰，干扰取补数±1/±2 邻近值优先（距离序取数，同距组内
   seeded 洗牌），域凑 10 时 1-9 / 凑 15·20 时扩展 2-18，互异，禁取 a 本身
   （自己配自己=0 概念混淆）——不足额沿距离序外扩（同域内）直至凑满。
   answer=池中唯一满足 a+v=target 的下标（derive 独立函数——verify 从
   a+pool 复算=对账锚，禁读 quiz.answer 直比）。
   ch4 三目标在场：关内 5 题 seeded 取 target∈{10,15,20} 后做在场补齐
   （缺 target 换入重复槽——5 槽 3 值必有重复槽可换，SPEC「三目标切换」
   认知坡度主体）。
   quiz 结构：{ kind('ten' 恒), target(10|15|20), a, pool[{v}] 互异恒全摆,
               answer(池中补数下标), _miss, _answered }
   铁律：每关 5 题。 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
const ri = (rnd, lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)); // [lo,hi] 闭区间整数
/* 进度章号单调递增（与 keyOf/写档一致）；难度章号四章取材（§0.4） */
const chOfFlat = flat => Math.floor(flat / CH_LEN) + 1;
const diffOfCh = ch => (ch - 1) % 4 + 1;

/* ---------- 章型真值表（SPEC §0.86）：池张数 / a 域（dch1 特例 a∈2-8） ---------- */
const POOL_N = { 1: 4, 2: 5, 3: 4, 4: 5 };                          // 池张数
const Q_TARGET = { 1: 10, 2: 10, 3: 15 };                           // ch1-3 固定目标
const A_RANGE = { 10: [1, 9], 15: [6, 9], 20: [11, 18] };           // a 域（按 target）
const D_DOMAIN = { 10: [1, 9], 15: [2, 18], 20: [2, 18] };          // 干扰域（凑 10 收 1-9）

/* ---------- answer 独立推导（对账锚）：池中唯一满足 a+v=target 的下标
   （无唯一解返回 -1——verify 复算用，禁读 quiz.answer 当期望源） ---------- */
function deriveAnswer(a, target, poolVs) {
  let idx = -1, cnt = 0;
  for (let i = 0; i < poolVs.length; i++) {
    if (a + poolVs[i] === target) { idx = i; cnt++; }
  }
  return cnt === 1 ? idx : -1;
}

/* ---------- 干扰池构造：邻近优先（距离序）+域约束+互异+禁 a 本身 ---------- */
function buildPool(a, target, size, rnd) {
  const x = target - a;                              // 补数（唯一解）
  const dom = D_DOMAIN[target], lo = dom[0], hi = dom[1];
  const buckets = {};
  for (let v = lo; v <= hi; v++) {
    if (v === x || v === a) continue;                // 互异（排补数）+禁 a 本身（干扰）
    const d = Math.abs(v - x);
    (buckets[d] = buckets[d] || []).push(v);
  }
  const picks = [];
  for (let d = 1; d <= hi - lo + 1 && picks.length < size - 1; d++) {
    if (buckets[d]) picks.push.apply(picks, shuffled(buckets[d], rnd));   // 同距组内 seeded 洗牌
  }
  const vals = picks.slice(0, size - 1);             // 距离序取数（±1/±2 邻近优先）
  vals.push(x);                                      // 补数入池
  const mixed = shuffled(vals, rnd);                 // 洗牌成池（互异全摆）
  const pool = mixed.map(v => ({ v: v }));
  /* answer 必须在**洗牌后**的池序上推导（曾错在洗牌前数组上推导=恒指末位的
     假答案：引擎与钩子共享错值自洽，verify 独立复算 a+v=target 才暴露） */
  return { pool: pool, answer: deriveAnswer(a, target, mixed) };
}

/* ---------- ch4 关内 target 序：seeded 取 {10,15,20} + 三目标在场补齐
   （5 槽 3 值必有重复槽——缺 target 换入首次出现保留的重复槽） ---------- */
function targetSeqOf(rnd) {
  const T = [10, 15, 20];
  const seq = [];
  for (let i = 0; i < CH_LEN; i++) seq.push(T[Math.floor(rnd() * T.length)]);
  for (let k = 0; k < T.length; k++) {
    if (seq.indexOf(T[k]) >= 0) continue;
    let slot = -1;
    for (let i = 0; i < CH_LEN; i++) {
      if (seq.indexOf(seq[i]) !== i) { slot = i; break; }   // 重复出现的槽（首次出现保留）
    }
    if (slot >= 0) seq[slot] = T[k];
  }
  return seq;
}

/* ---------- 单题构建 ---------- */
function buildQuiz(dch, rnd, tSeq, qi) {
  let target, a;
  if (dch === 4) {                                   // 混合：每题 target seeded（关内序）
    target = tSeq[qi];
    a = ri(rnd, A_RANGE[target][0], A_RANGE[target][1]);
  } else if (dch === 1) {                            // 凑 10 起步：a∈2-8 偶偏（偶数 60%）
    target = 10;
    a = rnd() < 0.6 ? 2 * ri(rnd, 1, 4) : ri(rnd, 2, 8);
  } else {
    target = Q_TARGET[dch];
    a = ri(rnd, A_RANGE[target][0], A_RANGE[target][1]);
  }
  const bp = buildPool(a, target, POOL_N[dch], rnd);
  return { kind: 'ten', target: target, a: a, pool: bp.pool, answer: bp.answer,
           _miss: 0, _answered: false };
}

/* ---------- 关卡生成（静态 20 关与生成关同一确定性通道；生成关 flat≥20 每关
   随机章参数 dch=ri(rnd,1,4) 先取数保确定性；ch4 tSeq 关内共享=三目标在场） ---------- */
function genLevel(flat) {
  flat = Math.max(0, flat | 0);
  const ch = chOfFlat(flat), dch0 = diffOfCh(ch), lv = flat % CH_LEN;
  const rnd = mulberry32(flat * 7919 + 523);
  const dch = flat < STATIC_LEVELS ? dch0 : ri(rnd, 1, 4);   // 生成关随机章参数（先取数保确定性）
  const tSeq = targetSeqOf(rnd);                             // ch4 关内 target 序（三目标在场）
  const quizzes = [];
  for (let qi = 0; qi < CH_LEN; qi++) quizzes.push(buildQuiz(dch, rnd, tSeq, qi));
  return { flat: flat, ch: ch, dch: dch, lv: lv,
           quizzes: quizzes, step: 0, retries: 0, done: false };
}

/* ---------- 点卡引擎（无 DOM）：engTapCard(L, i) —— 点卡池第 i 张（pool 数组下标）
   'right' 点中补数且非末题（本题完成推进）/ 'done' 点中且末题=通关
   'wrong' 点错：该题 miss+1（retries 全关累计=星级口径），卡不灰可重点（探索不罚）
   null    非法下标 / 关卡已结束 / 本题已答
   miss 计数在本引擎判定层（b34 坑①：UI 防重入 guard 在调用判定前拦，
   预判口径 i===q.answer 与本引擎判定严格同构） ---------- */
function engTapCard(L, i) {
  if (!L || L.done || L.step >= L.quizzes.length) return null;
  const q = L.quizzes[L.step];
  if (!q || q._answered) return null;
  if (!Number.isInteger(i) || i < 0 || i >= q.pool.length) return null;
  if (i === q.answer) {
    q._answered = true;
    L.step++;
    if (L.step >= L.quizzes.length) { L.done = true; return 'done'; }
    return 'right';
  }
  q._miss++;
  L.retries++;
  return 'wrong';
}
const engWon = L => !!L && L.done;
/* 星级（§0.86 miss 口径）：全关错选 0=3 星 / 1-2=2 星 / ≥3=1 星。永不 0 星 */
const engStars = L => !L ? 1 : (L.retries === 0 ? 3 : (L.retries <= 2 ? 2 : 1));
/* 答案级救援/教学帮指用：当前题正确卡下标（=deriveAnswer 复算，独立函数供 verify 复核） */
const correctIdx = q => !q ? -1 : deriveAnswer(q.a, q.target, q.pool.map(c => c.v));

/* ---------- 结构校验（verify 用，返回失败原因或 null）：章型 target/池张数/a 域 /
   池互异 / 含补数唯一（answer=deriveAnswer 复算）/ 干扰域+禁 a 本身 / 初始态干净 ---------- */
function structWhy(q, dch, qi) {
  if (!q) return 'quiz';
  if (q.kind !== 'ten') return 'kind';
  if (!POOL_N[dch]) return 'dch';
  if (dch !== 4 && q.target !== Q_TARGET[dch]) return 'target';            // ch1-3 固定目标
  if (dch === 4 && [10, 15, 20].indexOf(q.target) < 0) return 'target';    // ch4 三值域
  const alo = dch === 1 ? 2 : A_RANGE[q.target][0];
  const ahi = dch === 1 ? 8 : A_RANGE[q.target][1];
  if (!Number.isInteger(q.a) || q.a < alo || q.a > ahi) return 'aRange';
  if (!Array.isArray(q.pool) || q.pool.length !== POOL_N[dch]) return 'poolLen';
  const vals = q.pool.map(c => c.v);
  for (let k = 0; k < vals.length; k++) if (!Number.isInteger(vals[k])) return 'vInt';
  if (new Set(vals).size !== vals.length) return 'vDup';                   // 池互异
  const x = q.target - q.a;
  if (vals.indexOf(x) < 0) return 'vComp';                                 // 池含补数
  if (q.answer !== deriveAnswer(q.a, q.target, vals)) return 'answer';     // answer 推导自洽（唯一解）
  const dom = D_DOMAIN[q.target];
  for (let k = 0; k < vals.length; k++) {                                  // 干扰域+禁 a 本身
    if (vals[k] === x) continue;
    if (vals[k] < dom[0] || vals[k] > dom[1]) return 'dDomain';
    if (vals[k] === q.a) return 'dIsA';
  }
  if (q._miss !== 0 || q._answered) return 'init';
  return null;
}
/* ================= maketen 主逻辑（题面 → 点卡 → 收银/两级错反馈）

  await unlocked();
  const q4 = window.MT.quiz;
  const cards4 = Array.from(poolEl.querySelectorAll('.card'));
  const frameQuiz = cards4.length === q4.pool.length && Number(poolEl.dataset.n) === q4.pool.length &&
    cards4.every((c, i) => Number(c.querySelector('.cv').textContent) === q4.pool[i].v) &&  /* 帧内容层 */
    document.getElementById('buddy-num').textContent === String(q4.a) &&                     /* 伙伴卡===quiz.a */
    document.getElementById('target-num').textContent === String(q4.target);                 /* 题面===quiz.target */
  const iW4 = (q4.answer + 1) % q4.pool.length;                       // 非补数卡（flat0 池 4 恒存在）
  const rW4 = await tapRetry(iW4);                                    // → wrong（错点）
  const poolStay = Array.from(poolEl.querySelectorAll('.card')).length === q4.pool.length;   /* 错点后卡数不变（恒全摆） */
  const el4 = poolCardAt(q4.answer);                                  // 收银前捕获补数卡元素引用
  const rR4 = await tapRetry(q4.answer);                              // → right（收银）
  const goneOk = el4.classList.contains('gone');                      /* 收银后卡 gone（飞进店里） */
  const q4n = window.MT.quiz;                                         // 新题（渲染即引擎）
  const buddyNext = q4n && document.getElementById('buddy-num').textContent === String(q4n.a);
  const frameOk = frameQuiz && rW4 === 'wrong' && poolStay && rR4 === 'right' && goneOk && buddyNext;
  if (frameOk) npass++;
  units.frameM = { ok: frameOk, quiz: frameQuiz, wrongR: rW4, poolStay: poolStay,
                   rightR: rR4, gone: goneOk, buddyNext: buddyNext };

  /* ---- ⑤ wrongPath：错路径+两级链头区分+豁免窗（真时钟 6018：窗内二击吞/窗后二错照计） ---- */
  total++;
  let f5 = -1, q5 = null, iMore = -1, iLess = -1;
  for (let flat = 0; flat < 3; flat++) {                // flat<3=每错必播链（两级链头均可取证）
    startLevel(flat);
    await unlocked();
    const q = window.MT.quiz;
    const vs = q.pool.map(c => c.v);
    let m = -1, l = -1;
    for (let i = 0; i < vs.length; i++) {
      if (i === q.answer) continue;
      if (q.a + vs[i] > q.target) m = i;
      if (q.a + vs[i] < q.target) l = i;
    }
    if (m >= 0 && l >= 0) { f5 = flat; q5 = q; iMore = m; iLess = l; break; }
  }
  const badTap = f5 >= 0 && (await window.MT.tapCard(99)) === null;   // 非法下标=null（不炸）
  const rM = await tapRetry(iMore);                      // 一错（和>target）→ mt_wrong_more 链头
  const headMore = window.__lastQueue && window.__lastQueue.length === 2 &&
                   window.__lastQueue[0] === 'mt_wrong_more' &&
                   window.__lastQueue[1] === 'mt_hint' &&
                   window.__lastQueue.every(p => typeof p === 'string');   // 错链全 clip 无 keyless
  await unlocked();                                     // 等首错演出锁尾窗（showUntil+140）过——豁免窗（真时钟 6018）仍在
  const rejW = await window.MT.tapCard(iLess);           // 豁免窗内二错（和<target）=被吞 false（I 补：不计 miss）
  const miss1 = rM === 'wrong' && rejW === false && window.MT.quiz.miss === 1;   /* 立即求值（二错前） */
  await new Promise(w => setTimeout(w, 6200));           // 等豁免窗（真时钟 6018）过——窗后二错照计
  const rL = await tapRetry(iLess);                      // 二错（和<target）→ mt_wrong_less 链头
  const headLess = window.__lastQueue && window.__lastQueue.length === 2 &&
                   window.__lastQueue[0] === 'mt_wrong_less' &&
                   window.__lastQueue[1] === 'mt_hint';
  const miss2 = rL === 'wrong' && window.MT.quiz.miss === 2;      // 卡不灰可重点（探索不罚）
  await unlocked();
  const rE = await tapRetry(q5.answer);
  const wrongOk = badTap && miss1 && headMore && miss2 && headLess && rE === 'right';
  if (wrongOk) npass++;
  units.wrongPath = { ok: wrongOk, flat: f5, badTap: badTap, miss1: miss1, headMore: headMore,
                      rejInWin: rejW === false, miss2: miss2, headLess: headLess, right: rE };

  /* ---- ⑥ gradient：首错=方向级（错卡 wig+题面重锚，正确卡无 breathe）/miss≥2=正确卡 breathe ---- */
  total++;
  startLevel(5);
  await unlocked();
  const q6 = window.MT.quiz;
  let i6 = -1;
  for (let i = 0; i < q6.pool.length; i++) if (i !== q6.answer) { i6 = i; break; }
  const r6a = await tapRetry(i6);                         // 首错（flat5≥3：链 10s 节流起播）
  const wigFirst = poolCardAt(i6).classList.contains('wig') &&       // 错卡摇头（方向级视觉）
                   targetBarEl.classList.contains('pulse') &&        // 题面重锚（不指正确卡）
                   !poolCardAt(q6.answer).classList.contains('breathe');   /* 正确卡无 breathe */
  await new Promise(w => setTimeout(w, 6200));            // 等豁免窗过（二错不重设窗：10s 节流内）
  const r6b = await tapRetry(i6);                         // 二错（miss=2）
  const brEl = poolCardAt(q6.answer);
  const breathe2 = !!brEl && brEl.classList.contains('breathe');  // miss≥2=正确卡 breathe（答案级）
  const gradOk = r6a === 'wrong' && wigFirst && r6b === 'wrong' &&
                 window.MT.quiz.miss === 2 && breathe2;
  if (gradOk) npass++;
  units.gradient = { ok: gradOk, wigFirst: wigFirst, secondR: r6b,
                     breathe2: breathe2, miss: window.MT.quiz.miss };

  /* ---- ⑦ stars：星级口径（0=3★/1-2=2★/≥3=1★，永不 0 星） ---- */
  total++;
  const LA = genLevel(10);
  LA.retries = 0; const st3 = engStars(LA) === 3;
  LA.retries = 1; const st2a = engStars(LA) === 2;
  LA.retries = 2; const st2b = engStars(LA) === 2;
  LA.retries = 3; const st1 = engStars(LA) === 1;
  LA.retries = 9; const stFloor = engStars(LA) === 1;   // 永不 0 星
  const starsOk = st3 && st2a && st2b && st1 && stFloor;
  if (starsOk) npass++;
  units.stars = { ok: starsOk, st3: st3, st2: st2a && st2b, st1: st1, floor: stFloor };

  /* ---- ⑧ gen：生成关 flat20+（seeded ri(rnd,1,4) 独立复算+四档全现+先验静态验算+ch4 三 target） ---- */
  total++;
  const genBad = [];
  const genDch = {};
  const ch4Gen = {};
  for (let flat = 20; flat < 40; flat++) {
    const rnd = mulberry32V(flat * 7919 + 523);      // SPEC §0.86：独立重写 rng
    const expDch = 1 + Math.floor(rnd() * 4);        // dch=第一个随机数（先取数保确定性）
    const L = genLevel(flat);
    if (L.dch !== expDch) genBad.push(flat + ':dch ' + L.dch + '!=' + expDch);
    genDch[L.dch] = (genDch[L.dch] || 0) + 1;
    const det = JSON.stringify(L.quizzes) === JSON.stringify(genLevel(flat).quizzes);   // 确定性
    if (!det) genBad.push(flat + ':det');
    const cfg = SPEC_CH[L.dch];
    let priorOk = true;
    for (let k = 0; k < L.quizzes.length && priorOk; k++) {
      const q = L.quizzes[k];
      const vs = q.pool.map(c => c.v);
      const expAns = deriveAnswerV(q.a, q.target, vs);          // answer 独立复算
      const aLo = L.dch === 1 ? 2 : SPEC_A[q.target][0];
      const aHi = L.dch === 1 ? 8 : SPEC_A[q.target][1];
      const dom = SPEC_DD[q.target];
      const okQ = q.kind === 'ten' && q.pool.length === cfg.pool &&
        (L.dch === 4 || q.target === cfg.target) &&
        (L.dch === 4 ? [10, 15, 20].indexOf(q.target) >= 0 : true) &&
        q.a >= aLo && q.a <= aHi &&
        new Set(vs).size === vs.length && expAns >= 0 && q.answer === expAns &&
        vs.every((v, j) => j === expAns ? true : (v >= dom[0] && v <= dom[1] && v !== q.a));
      if (!okQ) { genBad.push(flat + ':prior ' + k); priorOk = false; }
      if (structWhy(q, L.dch, k)) { genBad.push(flat + ':struct ' + k); priorOk = false; }
    }
    /* ch4 关内三 target 全现 */
    if (L.dch === 4) {
      const tOk = [10, 15, 20].every(t => L.quizzes.some(q => q.target === t));
      if (!tOk) genBad.push(flat + ':ch4targets');
      ch4Gen[flat] = L.quizzes.map(q => q.target);
    }
  }
  const distOk = [1, 2, 3, 4].every(d => genDch[d] > 0);   // 四档全现（域全档成立型）
  const genOk = genBad.length === 0 && distOk;
  if (genOk) npass++;
  units.gen = { ok: genOk, bad: genBad.slice(0, 5), dist: genDch, ch4: ch4Gen };

  /* ---- ⑨ windows+contract：窗静态断言（SPEC §4 实长表）+契约源码断言 ---- */
  total++;
  const src = document.querySelectorAll('script')[2].textContent;
  const coreSrc = document.querySelectorAll('script')[0].textContent;
  const D = SPEC_DUR;
  const wrongMoreChain = D.mt_wrong_more + 150 + D.mt_hint + 300;    // 5970
  const wrongLessChain = D.mt_wrong_less + 150 + D.mt_hint + 300;    // 6018
  /* T46 确认链全域最坏值独立复算（a 域按 target：10→1-9/15→6-9/20→11-18，
     ch1 a∈2-8 为子集不另列——超集上界恒安全） */
  let worstChain = 0, worstQ = null;
  for (const t of [10, 15, 20]) {
    for (let a = SPEC_A[t][0]; a <= SPEC_A[t][1]; a++) {
      const c = chainMs(a, t - a, t);
      if (c > worstChain) { worstChain = c; worstQ = { a: a, x: t - a, t: t }; }
    }
  }
  const demoChain = chainMs(3, 7, 10);                        // 教学演示题 3+7=10（tutWatchLevel 定版锚）
  const winOk = WRONG_CHAIN_WIN === Math.max(wrongMoreChain, wrongLessChain) &&   // 两链取 max（==6018 精确）
                WRONG_CHAIN_WIN === 6018 &&
                WRONG_CHAIN_WIN >= 6018 &&                              // 豁免窗 ≥6018（SPEC §4）
                worstChain === 10098 && worstQ.a === 16 && worstQ.t === 20 &&   // 最坏锚=t20/a16（精确防漂）
                (CELE_MAIN + CELE_TAIL) >= worstChain &&                // 10100 ≥ 10098（T46 clip 口径）
                demoChain === 9642 && (CELE_MAIN + TUT_CELE_TAIL) >= demoChain &&  // demo 9700 ≥ 9642
                TUT_WATCH_WIN >= D.mt_tut_watch + 300 &&                 // watch 延 ≥3564
                TUT_TURN_WIN >= D.mt_tut_turn + 300 &&                   // turn 延 ≥2076
                (2620 + 400) >= D.mt_right + 300;                        // celebrate ≥2772
  const srcA = src.indexOf('KIDS.ui.dayEnd({ nextHint: nextHint(lim - 1) })') >= 0 &&
               src.indexOf('KIDS.ui.dayEnd({ nextHint: nextHint(null) })') >= 0;   // A：启动 lim-1+winFlow null
  const srcB = src.indexOf('lastDir') >= 0 && src.indexOf('lastAct') >= 0 &&
               src.indexOf('if (idle > 14000 && Date.now() - lastDir > 14000)') >= 0 &&
               src.indexOf('idle > 30000') >= 0;   // B：救援双锚（14s 方向级独立节流/30s 答案级）
  const srcC = coreSrc.indexOf("VER = '1.0'") >= 0 &&                       // C：存档版本 1.0（core）
               coreSrc.indexOf("'kidsgame_' + cfg.game") >= 0 &&            // C：存档键名
               src.indexOf("KIDS.init({ game: 'maketen'") >= 0;             // C：本款存档键 kidsgame_maketen
  const srcE = src.indexOf('sv.maketen && sv.maketen.tutSeen') >= 0;   // E：行为分流先查教学特例（freshTut 源码）
  const srcF = src.indexOf('GEN_HINTS[genLevel(f + 1).dch - 1]') >= 0 &&   // F：生成关实算 dch-1
               src.indexOf('(ci + 1)' + ' % 4') < 0;   // 禁章序右移（检索串拼接防 verify 源码自匹配）
  const srcI = src.indexOf('wrongChainUntil = Date.now() + WRONG_CHAIN_WIN') >= 0 &&
               src.indexOf('if (Date.now() < wrongChainUntil) return;') >= 0 &&
               src.indexOf('lastWrongVoice = 0; wrongChainUntil = 0;') >= 0 &&   // I：豁免窗+救援守卫+重置
               src.indexOf('wrongChainUntil && Date.now() < wrongChainUntil && i !== q.answer') >= 0;   // I 补：豁免窗 guard
  const srcJ = src.indexOf('now - lastWrongVoice > 10000') >= 0;          // J：语义句 10s 节流在场
  const srcK = src.indexOf("if (document.querySelector('.k-dayend,.k-chapterend,.k-resttip,.k-celebrate,.k-panel')) return;") >= 0 &&
               src.indexOf('function rescueTick()') >= 0;   // K：面板守卫+命名函数
  const srcL = src.indexOf('const NUMCN') >= 0 && src.indexOf("2: '两'") >= 0 &&
               src.indexOf("20: '二十'") >= 0 &&
               NUMCN[2] === '两' && NUMCN[20] === '二十' &&
               formulaText({ a: 18, target: 20 }) === '十八加两等于二十' &&   /* NUMCN 全式输出（契约 L 实算——x=2 读「两」，8 字） */
               formulaText({ a: 3, target: 10 }) === '三加七等于十';          /* 「+」读「加」「=」读「等于」 */
  const srcHint = CHAPTERS[1].hint === SPEC_CHAPTER_HINTS[1] &&   // C7 独立硬编码对账
                  CHAPTERS[2].hint === SPEC_CHAPTER_HINTS[2] &&
                  CHAPTERS[3].hint === SPEC_CHAPTER_HINTS[3] &&
                  CHAPTERS[4].hint === SPEC_CHAPTER_HINTS[4] &&
                  GEN_HINTS[0] === SPEC_GEN_HINTS[0] && GEN_HINTS[1] === SPEC_GEN_HINTS[1] &&
                  GEN_HINTS[2] === SPEC_GEN_HINTS[2] && GEN_HINTS[3] === SPEC_GEN_HINTS[3] &&
                  nextHint(4) === SPEC_CHAPTER_HINTS[1] && nextHint(9) === SPEC_CHAPTER_HINTS[2] &&
                  nextHint(14) === SPEC_CHAPTER_HINTS[3] && nextHint(19) === SPEC_CHAPTER_HINTS[4] &&
                  [24, 29, 34, 39].every(f => nextHint(f) === GEN_HINTS[genLevel(f + 1).dch - 1]);   // F：实算
  const srcSpeed = SPEED === 0.12;                       // ⑯ verify 提速
  const srcMT = src.indexOf('window.MT =') >= 0;         // b29 坑⑥：真实页同暴露（main 无 VERIFY 包裹）
  const contractOk = srcA && srcB && srcC && srcE && srcF && srcI && srcJ && srcK && srcL &&
                     srcHint && srcSpeed && srcMT;
  const winUnitOk = winOk && contractOk;
  if (winUnitOk) npass++;
  units.windows = { ok: winUnitOk, win: winOk, A: srcA, B: srcB, C: srcC, E: srcE, F: srcF,
                    I: srcI, J: srcJ, K: srcK, L: srcL, hints: srcHint, mtHook: srcMT };

  /* ---- ⑩ confirmChain：确认链构成（T46 化 6 段全 string clip）+题面 ---- */
  total++;
  startLevel(20);
  await unlocked();
  const q10 = window.MT.quiz;
  const faceOk = document.getElementById('target-num').textContent === String(q10.target);   /* 题面大字 */
  const h0 = window.__queueHist.length;      // 订阅起点（right 后换题渲染不会重播链）
  const r10 = await tapRetry(q10.answer);
  const hs = window.__queueHist.slice(h0);
  const expParts = ['mt_right', 'mt_n_' + q10.a, 'mt_s_add',
                    'mt_n_' + (q10.target - q10.a), 'mt_s_eq', 'mt_n_' + q10.target];   // 段键独立推导
  const chainOk10 = r10 === 'right' && hs.some(h =>
           h.length === 6 && h.every((p, i) => p === expParts[i]) &&       /* 6 段全 clip 拼播 */
           h.every(p => typeof p === 'string') &&                          /* 零 keyless（T46 政策） */
           !keylessLast(h));                                               /* 全 string 恒真复核（Mj-1） */
  const chainUnitOk = chainOk10 && faceOk;
  if (chainUnitOk) npass++;
  units.confirmChain = { ok: chainUnitOk, rightR: r10, face: faceOk,
                         queue: (window.__queueHist[h0] || []).map(p => typeof p === 'string' ? p : JSON.stringify(p)) };

  /* ---- ⑪ save：真实写档链（init maketen→autoSolve 通关→localStorage 更新，测后还原）
           origLS 模式（b34 坑②）：测前保存原档，测后恢复——防毁真实玩家档 ---- */
  total++;
  const origSave = window.__mtOrig.save, origPersist = window.__mtOrig.persist;
  const origLS = localStorage.getItem('kidsgame_maketen');      /* b34 坑②：origLS 保存 */
  let saveOk = false, saveDetail = '';
  try {
    KIDS._save = origSave;                       // 还原真函数（init 用）
    KIDS.store.persist = origPersist;
    localStorage.removeItem('kidsgame_maketen');
    KIDS.init({ game: 'maketen', title: '凑十小铺' });   // 真实 init：store.load 新档 v1.0
    startLevel(0);                               // verify 页 freshTut 恒 false → 直接题面
    const a11 = await window.MT.autoSolve();     // 真实判定链通关 → winFlow verify 分支 persistWin
    const raw = localStorage.getItem('kidsgame_maketen');
    const j = raw ? JSON.parse(raw) : null;
    saveOk = !!(a11.done && a11.taps === 5 && j && j.v === '1.0' && j.game === 'maketen' &&
                j.levels && j.levels['1-0'] &&
                j.levels['1-0'].stars === 3 && j.levels['1-0'].plays === 1);
    if (!saveOk) saveDetail = JSON.stringify({ taps: a11.taps, raw: raw && raw.slice(0, 200) });
  } catch (err) {
    saveDetail = 'ERR ' + (err && err.message);
  }
  /* 清理：恢复原 localStorage（不污染真实存档）——U12 继续用真实函数 */
  if (origLS === null) localStorage.removeItem('kidsgame_maketen');
  else localStorage.setItem('kidsgame_maketen', origLS);
  if (saveOk) npass++;
  units.save = { ok: saveOk, detail: saveDetail };

  /* ---- ⑫ realPath：预置存档 v1.0+tutSeen → start(0) 非教学直达题面（契约 E 分流） ---- */
  total++;
  const today = new Date();
  const tstr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  const pre = { v: '1.0', game: 'maketen', firstDay: tstr, lastDay: tstr, levels: {},
                dailyMin: {}, settings: { sound: true, tts: true, vol: 0.6 },
                restTip: { day: '', shown: 0 }, maketen: { tutSeen: true } };
  localStorage.setItem('kidsgame_maketen', JSON.stringify(pre));
  KIDS.store.load();                             // 重读预置档
  window.__mtDemoR = null;                       // 教学实证清零（非教学路径不应重设）
  window.MT.start(0);
  await unlocked();
  const q12 = window.MT.quiz;
  const realOk = state.tut === 'none' && window.__mtDemoR === null &&
                 q12 && q12.kind === 'ten' && q12.target === 10 &&
                 q12.a >= 2 && q12.a <= 8 &&                             /* 首关 ch1 a∈2-8 */
                 q12.pool.length === 4 &&                                /* 池 4 */
                 Array.isArray(q12.pool) && q12.step === 0 && q12.miss === 0 &&
                 q12.answer === deriveAnswerV(q12.a, 10, q12.pool.map(c => c.v)) &&  /* answer 独立复算 */
                 window.MT.currentLevel.flat === 0 && window.MT.currentLevel.n === 5 &&
                 (KIDS._save() || {}).v === '1.0' &&
                 typeof window.MT === 'object' && !!window.MT.tapCard && !!window.MT.autoSolve;   /* b29 坑⑥ 真实页暴露（!! 归一布尔，防函数引用 JSON 序列化成 null 的假失败） */
  if (realOk) npass++;
  units.realPath = { ok: realOk, tut: state.tut, quiz: q12 && { t: q12.target, a: q12.a, n: q12.pool.length } };
  /* 收尾清理：恢复原 localStorage + 沙盒 stub（防真实页误写） */
  if (origLS === null) localStorage.removeItem('kidsgame_maketen');
  else localStorage.setItem('kidsgame_maketen', origLS);
  KIDS._save = function () { return { levels: {} }; };
  KIDS.store.persist = function () {};

  const out = { game: 'maketen', total: total, pass: npass, units: units };
  $id('verify-result').textContent = JSON.stringify(out);
  window.__mtVlog = out;                          // 外部断言挂点（任务书钩子）
  document.title = (npass === total) ? 'VERIFY PASS ' + npass + '/' + total
                                     : 'VERIFY FAIL ' + (total - npass) + '/' + total;
}

if (VERIFY) {
  /* verify 模式：stub 全部发声 API（KIDS 未 init，audio.ctx 为 null，双保险）
     voice.play 记录 key+text 并留播报历史；voice.queue 记录拼播链（__lastQueue+
     __queueHist 全史——right 后链头取证用全史）；voice.say 记 __lastSayText */
  window.__voiceHist = [];
  window.__queueHist = [];
  KIDS.audio.note = function () {};
  KIDS.audio.sfx = function () {};
  KIDS.speak = function () {};
  KIDS.voice.play = function (k, t) {
    window.__lastVoiceKey = k || null; window.__lastVoiceText = t || null;
    if (k) window.__voiceHist.push(k);
  };
  KIDS.voice.say = function (t) { window.__lastSayText = t || null; };
  KIDS.voice.queue = function (parts) {
    window.__lastQueue = parts;
    if (parts) window.__queueHist.push(parts);
    window.__lastVoiceKey = parts && parts.length
      ? (typeof parts[0] === 'string' ? parts[0] : parts[0].key) : null;
  };
  runVerify();
}
